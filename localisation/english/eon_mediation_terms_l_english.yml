l_english:
 eon_mediation_terms_category:0 "Review Mediation Terms"
 eon_mediation_terms_category_desc:0 "Propose a specific discussion agenda and a renewed mandate of 30, 60 or 90 days. The mediator and opponent must each agree. The current agenda and expiry remain unchanged until final consent; a proposal does not pause them. Proposals are free. These procedural terms create no ceasefire, humanitarian-access right or military obligation."
 eon_cancel_mediation_terms:0 "Cancel Proposed Mediation Terms"
 eon_cancel_mediation_terms_desc:0 "Withdraw this unanswered revision. It cannot receive further consent, but its original receiving response must be closed. The existing accepted mandate continues under its own terms if still valid. Cancelling the revision does not end that mandate or change a war or agreement."
 eon_mediation_terms_cancelled_desc:0 "This proposed revision was withdrawn before final consent. It cannot change the accepted agenda or deadline. Close this original response to release the remaining revision reservation. The existing accepted mandate continues if it is still valid."
 eon_mediation_terms_stale_desc:0 "This old response no longer matches an available revision with its original participants, stage, agenda and duration. It cannot revise a current mandate or another proposal. Close this old response. Any existing accepted mandate continues only while its own conditions remain valid."
 eon_mediation_terms_accept:0 "Agree to these exact procedural terms"
 eon_mediation_terms_decline:0 "Decline or close this proposed revision"
 eon_mediation_terms_ack:0 "Understood"
 eon_mediation_terms.30.t:0 "Mediator Agreed to the Proposed Revision"
 eon_mediation_terms.30.desc:0 "The mediator accepted its part of the revision. A separate request was prepared for the specified opponent. This first consent did not change the accepted agenda or deadline. The proposal does not pause the existing mandate's expiry."
 eon_mediation_terms.31.t:0 "Proposed Terms Declined"
 eon_mediation_terms.31.desc:0 "A receiving participant declined the proposed agenda and duration. The revision was not applied. The existing accepted mandate continues under its previous terms if still valid. Refusal creates no benefit or penalty."
 eon_mediation_terms.32.t:0 "Proposed Terms No Longer Valid"
 eon_mediation_terms.32.desc:0 "This response could not authorize the revision under its original participants, stage, agenda, duration or current mandate conditions. No new terms were applied. Any existing accepted mandate continues only if its own conditions remain valid."
 eon_mediation_terms.33.t:0 "Proposed Terms Cancelled"
 eon_mediation_terms.33.desc:0 "The revision was withdrawn or its original withdrawn response was closed. It cannot receive further consent. An unanswered original response must still be closed to release its reservation. Cancelling a revision does not change the existing accepted mandate, which continues if still valid."
 eon_mediation_terms.34.t:0 "Revised Negotiation Terms Agreed"
 eon_mediation_terms.34.desc:0 "The mediator and specified opponent each accepted the same proposed agenda and duration. The revised agenda was applied to the three participants and a fresh negotiation deadline began from the opponent's final consent. This procedural agreement created no ceasefire, peace, humanitarian-access right or military obligation."
 eon_mediation_terms.35.t:0 "Unanswered Terms Proposal Closed"
 eon_mediation_terms.35.desc:0 "An unanswered revision expired or could no longer remain attached to its original mandate. No new terms were applied. The initiator–mediator and mediator–opponent response pairs are closed to further terms revisions in this campaign; ordinary new mediation mandates remain available under their own conditions. Any previous accepted mandate continues only if still valid."
 eon_mediation_terms_deescalation_30:0 "Propose de-escalation discussions for 30 days"
 eon_mediation_terms_deescalation_30_desc:0 "Propose de-escalation discussions with [?eon_mediation_party_b.GetName] through [?eon_mediation_mediator.GetName], with a fresh 30-day mandate from the opponent's final consent. The mediator and opponent must agree separately. Proposing is free and leaves the current agenda and expiry unchanged. The existing mandate can expire while they decide. These terms create no ceasefire or peace."
 eon_mediation_terms_mediator_deescalation_30_title:0 "De-escalation Discussions: Proposed 30-Day Mandate"
 eon_mediation_terms_mediator_deescalation_30_desc:0 "[From.GetName] proposes de-escalation discussions with [?eon_mediation_terms_b.GetName] and a renewed 30-day mandate starting from the opponent's final consent. If we agree, the opponent must decide separately. The accepted agenda and expiry remain unchanged until both consents; this proposal does not pause them. These terms create no ceasefire or peace."
 eon_mediation_terms_opponent_deescalation_30_title:0 "De-escalation Discussions: Proposed 30-Day Mandate"
 eon_mediation_terms_opponent_deescalation_30_desc:0 "[From.GetName] agreed to mediate a revision proposed by [?eon_mediation_terms_a.GetName]: de-escalation discussions and a renewed 30-day mandate from our final consent. Our separate approval replaces the accepted agenda and starts a fresh 30 days. We may decline; the previous mandate continues if still valid. These terms create no ceasefire or peace."
 eon_mediation_terms_deescalation_60:0 "Propose de-escalation discussions for 60 days"
 eon_mediation_terms_deescalation_60_desc:0 "Propose de-escalation discussions with [?eon_mediation_party_b.GetName] through [?eon_mediation_mediator.GetName], with a fresh 60-day mandate from the opponent's final consent. The mediator and opponent must agree separately. Proposing is free and leaves the current agenda and expiry unchanged. The existing mandate can expire while they decide. These terms create no ceasefire or peace."
