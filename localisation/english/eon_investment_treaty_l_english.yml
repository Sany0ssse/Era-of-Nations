 eon_investment_treaty_no_pending_tt:0 "Neither country has another mutual investment treaty proposal awaiting a response."
 eon_investment_treaty_terms_tt:0 "These are the existing fixed mutual investment treaty terms. Each country gains the existing mutual opinion and trade benefits, one standing investment partner and the existing influence change. Active construction projects keep their own agreed terms."
 eon_investment_treaty_response_valid_tt:0 "This response matches the reserved proposal and its fixed terms. Both countries still exist and meet the original treaty conditions; neither country has withdrawn or established this treaty separately."
 eon_investment_treaty_cancel_tt:0 "End this pair's standing investment treaty and its bilateral benefits. Active construction projects continue under their own agreements. A withdrawn pending proposal remains reserved until its original response is processed."
