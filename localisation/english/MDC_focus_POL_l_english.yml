 POL_Senat_category: "Senat Rzeczypospolitej Polskiej"
 POL_Senat_category_desc: "§tSenat Rzeczypospolitej Polskiej§! - the upper house of the Polish parliament, which exercises legislative power, but, unlike the Sejm, does not exercise supervision over the executive power \n\n§YThe President of Poland§! is a representative of the executive power, therefore it is possible to §Ychange laws only through the Senate§!. Changing laws independently will cost us §Rten times more§! in £pol_power_icon Political Power. \n\nKeep in mind that changing laws also affects the §3approval of the Sejm§!. §GIncreasing spending§! such as §3Social§! or §3Healthcare§! §Gincreases approval§!, and §Rdecreasing§! them §Rdecreases§! it. Also, §Gincreasing spending§! on §RDefense§! or §RPolice§! will §Rdecrease the approval§! of the Sejm and vice versa. \n\n\n\n\n\n\n£GFX_POL_senate_decision_category_picture \n\n\n\n\n\n"
