POL_samooborona: "Samoobrona Rzeczpospolitej Polskiej"
POL_samooborona_desc: "The Self-Defence of the Republic of Poland is a Christian socialist, populist, agrarian, and nationalist political party and trade union in Poland. The party promotes agrarian socialist and Catholic socialist economic policies combined with a left-wing populist, anti-globalization and anti-neoliberal rhetoric.The party describes itself as left-wing, although it stresses that it belongs to the patriotic left and follows Catholic social teaching. The party is sympathetic to Communist Poland, which led political scientists to label the party as neocommunist, post-communist, and far-left."
POL_ultraleft_nationalism: "Ultra-Left Nationalism"
POL_ultraleft_nationalism_desc: "The synthesis of far-left revolutionary ideology with Polish nationalism creates a unique political movement that seeks to combine the internationalist aspirations of communism with the patriotic fervor of nationalism. This ultra-left nationalist approach aims to create a truly Polish path to socialism, rejecting both Western capitalism and Soviet-style communism in favor of an authentic national revolutionary movement that puts the Polish people and their traditions at the center of the socialist transformation."
POL_peasant_movement: "Peasant Movement"
POL_peasant_movement_desc: "We must throw out the pesky bankers who rob our honest common folk and put money in their pockets!"
POL_catholic_soc_teach: "Catholic Social Teaching"
POL_catholic_soc_teach_desc: "Drawing from the rich tradition of Catholic social teaching, we seek to apply the principles of solidarity, subsidiarity, and the common good to our revolutionary project. This approach combines the moral framework of Catholic social thought with our commitment to social justice, emphasizing the dignity of the human person while working towards a more just and equitable society that respects both individual rights and collective responsibility."
POL_legalize_same_sex_marriages: "The Question of Same-Sex Partnerships"
POL_legalize_same_sex_marriages_desc: "The dilemma arose in our ranks in regards to deciding what shall we do with same sex marriages, partnerships and similar unions."

poland_smbr.1.t: "Pre-Parliament Discussion"
poland_smbr.1.d: "The conference room is filled with heated debate as Samoobrona party members gather to discuss one of the most divisive issues facing our movement. Deputy Minister Kowalski, a traditionalist from the rural wing, slams his fist on the table: 'We cannot abandon our Catholic values! Marriage is between a man and a woman, as God intended. This is a slippery slope that will destroy the family unit!'\\n\\nAcross from him, Dr. Nowak, a younger party member from Warsaw, responds calmly: 'Comrade Kowalski, we must remember that our party stands for social justice and the dignity of all people. Many of our supporters in the cities have friends and family who are affected by this issue. We cannot turn our backs on them.'\\n\\nParty Secretary Wisniewski interjects: 'The question is not about abandoning our values, but about how we apply them. Catholic social teaching emphasizes love and compassion. Should we not extend that to all citizens, regardless of their orientation?'\\n\\nThe debate continues as the party must decide whether to support civil unions and same-sex marriage, or maintain a traditional stance on family values. The decision will shape not only our party's platform but also our relationship with both the Catholic Church and the broader Polish society."
poland_smbr.1.a: "We must allow such unions!"
poland_smbr.1.b: "Such unions are a blow to our catholic values!"

samesex_caut_tt: "§YCAUTION§!: This decision will have §Rsignificant consequences§! for your party's standing. Choosing to allow same-sex unions will §Ggain support§! from urban areas and younger voters, but may §Ralienate§! traditional Catholic supporters and rural constituencies. Conversely, prohibiting such unions will §Gstrengthen§! your ties to the Catholic Church and conservative voters, but could §Rcost you§! support in major cities and among progressive elements of society. Consider carefully how this aligns with your party's current direction and the composition of your base."

POL_catholic_social_teaching_and_educat_idea: "Catholic Education"

POL_catholic_values_into_education: "Socialist Concordate"
POL_catholic_values_into_education_desc: "We have reached an agreement with the Holy See to establish a unique 'Socialist Concordat' for education. This groundbreaking arrangement allows the Catholic Church to oversee and guide the Polish education system while maintaining our commitment to social justice and equality. The Church will provide moral and spiritual guidance to our schools, ensuring that Catholic social teaching is integrated into the curriculum, while we maintain control over the secular aspects of education and ensure that all children, regardless of background, receive quality education."
POL_legacy_of_ppr: "Legacy of PPR"
POL_legacy_of_ppr_desc: "We must remember and proudfully carry the legacy of soviet past. For that, we might even establish coalition with communists."
POL_polish_sovhoz_idea: "Polish Sowchoz"
POL_return_sovhoz: "Return to Sowchoz"
POL_return_sovhoz_desc: "Sowchoz was the best invention of communists, which would suppress capitalist anarchy and encourage cooperation among our folk!"
POL_agrarian_populism: "Agrarian Populism"
POL_agrarian_populism_desc: "We must rally our population in the name of agricultural revolution. Our people will work together for the brighter future!"
POL_financing_agriculture: "Financing Agriculture"
POL_financing_agriculture_desc: "In order to maintain a good economy under our political and economic course, we are obliged to support agriculture in our country."
POL_financing_agriulture_desc: "We must lead state building of agricultural sowchoz sectors and employ our people there. This may affect our economic grow, but it will surely be a correct decision in the long term stability!"
POL_protectionist_policy: "Protectionist Policy"
POL_protectionist_policy_desc: "In order to protect our domestic industries and ensure the prosperity of Polish workers, we must implement strict protectionist measures. By reducing our dependence on foreign markets and focusing on domestic production, we can shield our economy from external shocks and create more jobs for our people. This policy will prioritize Polish-made goods and reduce our reliance on potentially unstable international trade."
POL_nationalization_foreign_capital: "Nationalization of Foreign Capital"
POL_nationalization_foreign_capital_desc: "The time has come to take back what rightfully belongs to the Polish people! Foreign capitalists have exploited our nation for too long, extracting profits while leaving our workers impoverished. We will seize all foreign-owned enterprises and place them under the control of the state, ensuring that the wealth they generate benefits all Polish citizens rather than lining the pockets of foreign investors. This bold action will strengthen our economic independence and demonstrate our commitment to putting the people first."
POL_superiority_of_polish_people: "The Superiority of the Polish People"
POL_superiority_of_polish_people_desc: "We must recognize and celebrate the inherent greatness of the Polish nation! For too long, we have been told that we are inferior, that we must follow the lead of others, that our culture and values are outdated. But the truth is clear: the Polish people possess a unique spirit, a deep connection to the land, and an unbreakable will that has carried us through centuries of struggle. We are not just equal to other nations - we are superior in our dedication to family, community, and the common good. It is time to assert our rightful place in the world and reject the false humility that has held us back."
POL_polish_left_greatness_idea: "Polish Solidarism"
POL_refusal_public_debt: "No More Foreign Debt!"
POL_refusal_public_debt_desc: "We will not bow to foreign nations anymore and pay them any penny for the suffering of our poor, yet greatest folk on the earth!"
POL_autarky: "Road to Autarky"
POL_autarky_desc: "True independence can only be achieved through complete economic self-sufficiency! We must end our dependence on foreign trade and build a self-contained economy that can meet all our needs. This means developing our own industries, exploiting our own resources, and producing everything we need within our borders. While this will require significant investment and may temporarily strain our treasury, it will make us truly free from the whims of foreign markets and international pressure. A self-sufficient Poland is a strong Poland, and a strong Poland is a Poland that can never be subjugated again!"
POL_against_capitalist: "Anti-Capitalist Propaganda"
POL_against_capitalist_desc: "We must steer propaganda against capitalist pigs and their servants in our country."
POL_moscow_warsaw_bro: "Moscow-Warsaw Brotherhood"
POL_moscow_warsaw_bro_desc: "We must establish military cooperation with Russia and prepare our country for entering CSTO."
POL_turn_to_east: "Eastern Trade Initiative"
POL_turn_to_east_desc: "We must realign our trade to eastern markets and join the EAEU integration process."
POL_polish_chinese_cooperation: "Polish-Chinese Trade Association"
POL_polish_chinese_cooperation_desc: "We must establish free trade agreement with China to combat imperialist american influence on our country."
POL_subjugate_lovakia: "Subjugate Slovakia"
POL_subjugate_lovakia_desc: "We must subjugate Slovakia and establish our southern security belt in case of NATO intervention."
POL_join_russia: "Join CSTO"
POL_join_russia_desc: "To protect our country against imperialist forces, we must join CSTO and establish highest possible defense partnerships with Russia."
POL_not_colony_of_europe: "Not a Colony of Europe!"
POL_not_colony_of_europe_desc: "We must not bow before Europe and allow their colonialist rhethoric subjugate our inetersts."
POL_leave_nato: "Bye, Bye, NATO!"
POL_leave_nato_desc: "NATO in it's core goes against the will of our nation. We must not be in this petty alliance anymore."

POL_poland_can_into_space: "Poland Cannot Into Space"
POL_poland_can_into_space_desc: "§RSOON§!"

plan_prometheus_start: "Preparing Plan §R\"PROMETHEUS\"§!"





##########FALANGA TREE##########
##########Focuses##########
POL_onr: "Obóz Narodowo-Radykalny"
POL_onr_desc: "The reborn National Radical Camp welds together far-right student cells, clerical ultraconservatives, and Falanga nostalgists under one headquarters that vows to scour liberalism from the state."
POL_wojciech: "Wojciech"
POL_wojciech_desc: "Wojciech, the movement’s loudest tribune, becomes its public face, mixing sermon-like tirades with promises of iron discipline to keep militants obedient."
POL_ideology_of_national_radicalism: "Ideology of National Radicalism"
POL_ideology_of_national_radicalism_desc: "Party schools codify national radicalism into doctrine—Catholic integralism, corporatist economics, and paramilitary mobilization forged into a single creed."
POL_polish_national_socialism: "Polish National Socialism"
POL_polish_national_socialism_desc: "The leadership exhumes prewar national socialism, peddling class peace enforced by ethnic hierarchy and a paternalist command economy."
POL_piasecki_legacy: "Piasecki's Legacy"
POL_piasecki_legacy_desc: "Mythmaking around Bolesław Piasecki’s underground exploits is weaponized to justify authoritarian renewal and a crusade against perceived traitors."
POL_migration_issue: "Migration Issue"
POL_migration_issue_desc: "Inflammatory rhetoric portrays migrants as saboteurs, paving the way for emergency decrees that hand ONR the power to police borders and settlements."
POL_bye_belarusian: "Belarusians, it's Time For You To Go"
POL_bye_belarusian_desc: "Belarusian minorities are issued ultimatums to depart or face confiscation, a chilling signal that ethnic homogenization is now policy."
POL_new_polish_state: "New Polish State"
POL_new_polish_state_desc: "The constitution is shelved in favor of a corporatist charter elevating veterans, clergy, and party councils above the old democratic institutions."
POL_pilsudski_legacy: "Pilsudski's Legacy"
POL_pilsudski_legacy_desc: "ONR cherry-picks Piłsudski’s cult of command to brand its junta as the rightful heir of Sanacja’s strongman governance."
POL_deportation_of_jews: "Deportation of Jews"
POL_deportation_of_jews_desc: "Jewish communities are rounded up for forced emigration under hateful proclamations about national rebirth."
POL_quest_german_migrants: "The Question of German Migrants"
POL_quest_german_migrants_desc: "A campaign of intimidation forces ethnic Germans to choose between coerced Polonization or expulsion, satiating revanchist demands."
POL_return_sanation: "Return Sanation"
POL_return_sanation_desc: "Sanation-era emergency statutes are reactivated, granting the leadership unchecked authority to suspend parties, unions, and dissenting media."
POL_administrative_purges: "Administrative Purges"
POL_administrative_purges_desc: "Civil servants undergo loyalty vetting; anyone tied to liberal, socialist, or foreign NGOs is dismissed to make room for ONR cadres."
POL_close_the_market: "Close the Market"
POL_close_the_market_desc: "Autarkic decrees slam shut foreign trade, redirecting credit and contracts to loyal syndicates under strict state supervision."
POL_dissolve_republic: "Dissolve the Republic"
POL_dissolve_republic_desc: "With the Sejm dissolved and parties banned, the republic gives way to a 'national commonwealth' ruled by decree from Warsaw’s command council."
POL_return_of_legions: "Return of the Legions"
POL_return_of_legions_desc: "Volunteer legions are recreated as politicized shock troops, blending historical pageantry with modern paramilitary muscle."
POL_cult_of_leader: "Cult of the Leader"
POL_cult_of_leader_desc: "Propaganda elevates the leader to semi-mythic status—portraits in schools, oaths in barracks—so obedience becomes devotion."
POL_national_consciousness: "National Consciousness"
POL_national_consciousness_desc: "Mass rallies, compulsory youth camps, and nationalist curricula saturate society with a single heroic narrative of Polish destiny."
POL_strong_state: "Strong State"
POL_strong_state_desc: "New ministries fuse police, intelligence, and militia powers into a monolithic apparatus tasked with crushing corruption and opposition alike."
POL_cult_of_war: "Cult of War"
POL_cult_of_war_desc: "War is glorified as a purifying rite; classrooms drill students, factories prioritize armaments, and parades promise honor through struggle."
POL_dawn_nation: "Dawn of the Nation"
POL_dawn_nation_desc: "Choreographed ceremonies and torchlit vigils proclaim a 'dawn of the nation,' signaling that the radical state considers its revolution complete."
POL_iron_leader: "Iron Leader"
POL_iron_leader_desc: "The ruler adopts the mantle of Żelazny Wódz—Iron Leader—promising to personally direct every battle, negotiation, and purge."
POL_polish_revanchism: "Polish Revanchism"
POL_polish_revanchism_desc: "Diplomacy is replaced with ultimatums demanding restitution for historic wrongs, conditioning the public for campaigns of vengeance."
POL_greater_poland: "Greater Poland"
POL_greater_poland_desc: "Maps are redrawn to include every 'lost' province, rallying the army and diaspora around a maximalist vision of Greater Poland."
POL_return_king_lands: "Return of the Kingdom's Lands"
POL_return_king_lands_desc: "Claims are pressed on former Crown territories, invoking medieval charters to justify modern annexations."
POL_return_eastern_lands: "Return of the Eastern Lands"
POL_return_eastern_lands_desc: "Irredentist propaganda is paired with covert destabilization as planners eye a march east to reclaim Kresy."
POL_podlaczenie: "Podłączenie"
POL_podlaczenie_desc: "Neighboring regions are slated for 'plugging back in' via forced plebiscites overseen by soldiers and party commissars."
POL_ultimatum_to_budapest: "Ultimatum to Budapest"
POL_ultimatum_to_budapest_desc: "Hungary receives a stark ultimatum—cede influence in the Carpathians or face ONR-led intervention."
POL_avenge_september: "Avenge September"
POL_avenge_september_desc: "The trauma of 1939 is invoked as casus belli, with the army vowing to repay the humiliation of September with overwhelming force."
POL_invasion_of_livonia: "Invasion of Livonia"
POL_invasion_of_livonia_desc: "Baltic deployments rehearse a lightning strike into Livonia to seize ports and project power toward the Gulf of Finland."
POL_avenge_volyn: "Avenge Volyn"
POL_avenge_volyn_desc: "State media relives the Volhynian massacres to mobilize troops for punitive operations against Ukrainian nationalists."
POL_break_up_romania: "Break Up Romania"
POL_break_up_romania_desc: "Romania is targeted for partition, with ONR scheming to carve spheres of influence alongside whichever revanchist ally proves convenient."
POL_again_to_kremlin: "And Again To the Kremlin"
POL_again_to_kremlin_desc: "Boasting of Sobieski and Piłsudski, the regime vows to march on Moscow once more in a final reckoning for Eastern supremacy."
POL_return_brest: "Return Brest"
POL_return_brest_desc: "Diplomats brandish ultimatums demanding Brest’s return while engineers sketch logistics hubs for an eventual occupation."
POL_volyn_for_the_union: "Volyn for the Union"
POL_volyn_for_the_union_desc: "Volhynia is dangled as a bargaining chip in talks over a new Polish-dominated union, pressuring neighbors to accept ONR hegemony."
POL_policy_of_autarky: "Policy of Autarky"
POL_policy_of_autarky_desc: "Self-reliance becomes dogma: rationing, barter networks, and state procurement replace reliance on global markets."
POL_poles_in_berlin: "Poles in Berlin"
POL_poles_in_berlin_desc: "Cells of expatriate activists in Berlin are organized to agitate, collect intelligence, and prepare the ground for future demands."
POL_return_of_vilnius: "Return of Vilnius"
POL_return_of_vilnius_desc: "Propaganda frames Vilnius as an inseparable Polish city, funding fifth-column networks and legal campaigns to muddy Lithuanian sovereignty."
POL_training_with_azov: "Training with Azov"
POL_training_with_azov_desc: "Hardline units seek joint exercises with the Azov movement, trading tactics and rhetoric despite the diplomatic fallout."
POL_denbanderization_of_ukraine: "Denbanderization of Ukraine"
POL_denbanderization_of_ukraine_desc: "Special services draft plans to dismantle Ukrainian nationalist groups, branding the project a 'debanderization' crusade."
POL_capture_of_kaliningrad: "The Capture of Kaliningrad"
POL_capture_of_kaliningrad_desc: "Army planners outline a risky lunge for Kaliningrad, banking on surprise and overwhelming artillery to pry the exclave from Russia."
POL_polish_soldierism: "Polish Soldierism"
POL_polish_soldierism_desc: "The regime embraces 'soldierism'—a society organized like a barracks where every citizen is drilled, uniformed, and ranked."
POL_grupa_piaseckiego: "Grupa Piaseckiego"
POL_grupa_piaseckiego_desc: "The Piasecki Group cements its grip over ideology, ensuring every ministry, newspaper, and regiment parrots the founder’s uncompromising line."
