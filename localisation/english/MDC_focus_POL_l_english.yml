 poland_army.1.t: "New Commander of the Armed Forces"
 poland_army.1.d: "General Edward Pietrzyk has served as Commander of the Polish Land Forces since 2000, he has served our country well, but it is time to make way for a new commander"
 poland_army.1.a: "Let's see how he copes."
 poland_army.2.t: "Poland wants to acquire a license to produce Ka-50"
 poland_army.2.d: "Poland wants to buy a license to produce our Ka-50 Attack Helicopters, not for free, of course. Will we agree to this?"
 poland_army.2.a: "Deal"
 poland_army.2.b: "We don't throw away our technologies"
 poland_army.3.t: "Russia agrees to grant license"
 poland_army.3.d: "Russia has agreed to license the production of its Ka-50 attack helicopters. Of course, we have paid a price for this."
 poland_army.3.a: "Nice"
 poland_army.4.t: "Russia refused to grant license"
 poland_army.4.d: "Russia has refused to grant us licenses to produce its Ka-50 attack helicopters."
 poland_army.4.a: "We didn't really want to"
 poland_army.5.t: "Poland wants to acquire a license to produce AH-64 Apache"
 poland_army.5.d: "Poland wants to buy a license to produce our AH-64 Apache Attack Helicopters, not for free, of course. Will we agree to this?"
 poland_army.6.t: "US agrees to grant license"
 poland_army.6.d: "US has refused to grant us licenses to produce its AH-64 Apache attack helicopters."
 poland_army.7.t: "US refused to grant license"
 poland_army.7.d: "US has refused to grant us licenses to produce its AH-64 Apache attack helicopters."
 poland_army.8.t: "Purchase of Frigates"
 poland_army.8.d: "To implement our plans for the Naval Doctrine, we need Capital Ships that can sail and carry out missions in the open Ocean. Now we need to choose which country we should buy frigates from?"
 poland_army.8.a: "Buy Frigates from Russia"
 poland_army.8.b: "Buy Frigates from USA"
 poland_army.9.t: "Poland wants to buy our frigates"
 poland_army.9.d: "Polish diplomats have approached us with a commercial request. Poland wishes to purchase five of our Gepard class frigates, for a reasonable price. Should we agree?"
 poland_army.9.a: "Business"
 poland_army.9.b: "We'll still need them"
 poland_army.10.t: "Russia sells us frigates"
 poland_army.10.d: "Russia is selling us its Gepard class frigates. Of course, we paid a price for this, but now we have at our disposal large ships capable of carrying out open sea missions, this is a huge success for our Navy"
 poland_army.10.a: "Morze, nasze morze!"
 poland_army.11.t: "Russia does not sell us frigates"
 poland_army.11.d: "Russia refused to sell us its frigates, it's a pity. We will have to build our own ships, which will take a lot of time and will cost a lot of money, however, we have no other choice, we must follow the chosen doctrine"
 poland_army.11.a: "Very sad"
 poland_army.12.d: "Polish diplomats have approached us with a commercial request. Poland wishes to purchase five of our Oliver Hazard Perry Class frigates, for a reasonable price. Should we agree?"
 poland_army.13.t: "US sells us frigates"
 poland_army.13.d: "US is selling us its Oliver Hazard Perry Class frigates. Of course, we paid a price for this, but now we have at our disposal large ships capable of carrying out open sea missions, this is a huge success for our Navy"
 poland_army.14.t: "US does not sell us frigates"
 poland_army.14.d: "US refused to sell us its frigates, it's a pity. We will have to build our own ships, which will take a lot of time and will cost a lot of money, however, we have no other choice, we must follow the chosen doctrine"
 poland_army.15.t: "Poland wants to buy our MiG-29s"
 poland_army.15.d: "Poland wants to buy 60 of our MiG-29 aircraft. These are old Soviet light fighters that we can get rid of for a good amount."
 poland_army.15.a: "We can come to an agreement"
 poland_army.15.b: "We still need them"
 poland_army.16.t: "[FROM.GetName] sells us planes"
 poland_army.16.d: "[FROM.GetName] sells us its MiG-29 Fulcrum aircraft. These are old Soviet Light Fighters, of course they are already outdated against the background of modern wings, but for our aviation, which is not in the best position on the international arena, even this will be a good acquisition."
 poland_army.16.a: "Nice"
 poland_army.17.t: "[FROM.GetName] does not sell us planes"
 poland_army.17.d: "[FROM.GetName] won't sell us its old Soviet MiG-29 Fulcrum Light Fighters. We'll have to find other ways to revive our Air Force"
 poland_army.17.a: "Okay..."
 poland_army.18.t: "Selecting multirole fighter"
 poland_army.18.d: "As part of the reorganization of our Air Force, we need to choose a new Multi-Role Fighter that can perform all the tasks required of our Air Force and that we can put into production. The only question is which option to choose: the Russian MiG-29 Falcrum or the American F-16"
 poland_army.18.a: "We need MiG-29"
 poland_army.18.b: "F-16 is a great option"
 poland_army.19.t: "Poland Wants to Buy MiG-29"
 poland_army.19.d: "Poland wants to buy our MiG-29 as part of the reorganization of their Air Force. They want to put the MiG-29 model into production as the main model of the Multi-Role Fighter and to help in the transition to the new main fighter they ask for 50 of our MiG-29 models, for a reasonable price of course."
 poland_army.19.a: "We will help them"
 poland_army.19.b: "I think no"
 poland_army.20.t: "[FROM.GetName] sells us planes"
 poland_army.20.d: "[FROM.GetName] sells us its Multi-role Fighters. This will help us create favorable conditions for the transition to a new model of multi-role fighter. Excellent"
 poland_army.20.a: "Nice"
 poland_army.21.t: "[FROM.GetName] does not sell us planes"
 poland_army.21.d: "[FROM.GetName] does not sells us its Multi-role Fighters. Although they have refused our deal, we can still use our existing technology to create production of new Multi-Role Fighters"
 poland_army.21.a: "Okay"
 poland_army.22.t: "Poland wants to buy F-16"
 poland_army.22.d: "Poland wants to buy our F-16 as part of the reorganization of their Air Force. They want to put the F-16 model into production as the main model of the Multi-Role Fighter and to help in the transition to the new main fighter they ask for 50 of our F-16 models, for a reasonable price of course."
 poland_army.23.t: "Poland Wants to Buy MiG-35"
 poland_army.23.d: "Poland wants to buy our new 4++th generation MiG-35 Falcrum-F aircraft at a reasonable price. This step will strengthen our relationship and increase our influence on their Armed Forces"
 poland_army.23.a: "Sure"
 poland_army.23.b: "It's too early for them to receive our technologies."
