 #PiS Events
 poland_news.1.t: "Smolensk Air Disaster"
 poland_news.1.d: "Shocking news has arrived from Russia. The Polish government Tu-154M aircraft crashed while attempting to land at Smolensk-Severny airfield in dense fog. On board were the leader of the \"Prawo i Sprawiedliwość\" party, Lech Kaczyński, his wife, the top military command, and the country's political elite. The delegation was traveling to attend memorial ceremonies in Katyn. There are no survivors. A national period of mourning has been declared in Poland, while public division grows over the causes of the crash."
 poland_news.1.d.a: "Shocking news has arrived from Russia. The Polish government Tu-154M aircraft crashed while attempting to land at Smolensk-Severny airfield in dense fog. On board were Polish President Lech Kaczyński, his wife, the top military command, and the country's political elite. The delegation was traveling to attend memorial ceremonies in Katyn. There are no survivors. A national period of mourning has been declared in Poland, while public division grows over the causes of the crash."
 poland_news.1.a: "It's Horrible"
 poland_pis.1.t: "Smolensk Air Disaster"
 poland_pis.1.d: "Today a Tupolev Tu-154 aircraft operating Polish Air Force Flight 101 crashed near the Russian city of Smolensk, killing all 96 people on board. Among the victims were the leader of PiS party, Lech Kaczyński, and his wife, Maria; the former president of Poland-in-exile, Ryszard Kaczorowski; the chief of the Polish General Staff and other senior Polish military officers; the president of the National Bank of Poland; Polish government officials; 18 members of the Polish parliament; senior members of the Polish clergy; and relatives of victims of the Katyn massacre. The group was arriving from Warsaw to attend an event commemorating the 70th anniversary of the massacre, which took place not far from Smolensk.\n\n The pilots were attempting to land at Smolensk North Airport — a former military airbase — in thick fog, with visibility reduced to about 500 metres (1,600 ft). The aircraft descended far below the normal approach path until it struck trees, rolled, inverted and crashed into the ground, coming to rest in a wooded area a short distance from the runway."
 poland_pis.1.a: "What a tragedy! May God rest their innocent souls"
 poland_pis.2.t: "The plane returned successfully from Smolensk"
 poland_pis.2.d: "The Tu-154 passenger plane, which took off from Smolensk and had 96 people on board, including major politicians and party candidates, landed successfully. During the flight, an unexpected fog covered the sky and the pilots decided to descend. The descent was too sharp, and it seemed that a crash was inevitable, but everything worked out and the plane landed successfully."
 poland_pis.2.a: "Nice"
 poland_pis.3.t: "Poland offers military cooperation"
 poland_pis.3.d: "Dear friends, as you know, our relations with the Republic of Poland have centuries-old historical roots. Starting from the intertribal wars of the ancient Slavs, ending with the Polish-Soviet War and the occupation of half of Western Ukraine by the Soviet Union.\nNow, in the 21st century, the Russian Bear is knocking on our doors again.\nHowever, we should not forget about the negative moments that we had with the Republic of Poland, starting from the forced Polonization of the local Ukrainian population, ending with the fact that our international partner still has claims on our Western territories.\nDear friends, colleagues, I propose to resolve this issue in such a way as to preserve our sovereignty and not create a threat to our national interests. Thank you for your attention, ask your questions."
 poland_pis.3.a: "Mr. President, what will happen if we agree?"
 poland_pis.3.b: "Mr. President, what are the consequences of our refusal?"
 poland_pis.4.t: "Ukraine agreed to accept our proposal"
 poland_pis.4.d: "Today at 8 o'clock Warsaw time, a letter arrived from our colleagues in Kyiv. In such uncertain times, we were able to put aside our old grievances and agreed to build a new security architecture in Eastern Europe."
 poland_pis.4.a: "Slavic brothers finally unite"
 poland_pis.5.t: "Ukraine refused to accept our proposal"
 poland_pis.5.d: "Today at 8 o'clock in Warsaw unpleasant news arrived. The Bandera government in Kyiv refused to cooperate with one of the pillars of the Western world in Eastern Europe"
 poland_pis.5.a: "Pieprzone Bandar-logi"
 poland_pis.6.t: "Visit to Serbia"
 poland_pis.6.d: "Today Mr. President arrived in Belgrade on a diplomatic visit. The Kosovo conflict crisis is on the agenda. As a result of this meeting, the Republic of Poland will choose which side it will take in this problem."
 poland_pis.6.b: "Poland supports the Southern Slavic brothers"
 poland_pis.6.a: "Poland cannot support a government of war criminals. Send our support to Kosovo"
 poland_pis.7.t: "Polish security guarantees"
 poland_pis.7.d: "Today the President of Poland addressed the head of our country with the following statement: 'Dear Eastern Friend, many years have passed since the collapse of the horrific Soviet Empire, the actions of our two great nations were able to keep Russian Communist Imperialism from spreading throughout Europe. However, the Russian Bear is rising from its knees again to take revenge on our peoples and restore its Colonial Empire. I hope you have enough sense to understand that most likely - YOUR country will be the next for Russian Aggression. Our task, as the shield of the Eastern Huns, is to create such a security architecture that the Russian Bear will regret his decision twice. Dear Friend, I urge you to accept our security guarantees and begin creating a new Sanitary Cordon.' Should we accept this proposal?"
 poland_pis.7.a: "Not a word more!"
 poland_pis.7.b: "Is he crazy?"
 poland_pis.8.t: "[FROM.GetName] agreed to accept our proposal"
 poland_pis.8.d: "Our dear eastern friend was smart enough to accept our offer. Now Russia will have to think before realizing its Imperialism ambitions."
 poland_pis.8.a: "Today, the eastern frontier has become a little safer"
 poland_pis.9.t: "Radio silence from the other side..."
 poland_pis.9.d: "..."
 poland_pis.9.a: "Kurwa Matka, ja pierdole"
 poland_pis.10.t: "The Question of Islamic Migrants"
 poland_pis.10.d: "Tensions in the Middle East and the spread of radical Islamism are forcing people from countries in these regions to migrate to safer countries. As a rule, Islamic families, mainly from Syria and Palestine, choose European countries for migration such as Germany, France or Great Britain.\nThe increase of Islamic migrants creates instability in Christian European society and spreads radicalism among Muslim minorities. We must not allow the increase of Islamic migrants in Poland, but at the same time we must not make xenophobic decisions. What should we do?"
 poland_pis.10.a: "Poland will remain a Christian country"
 poland_pis.10.b: "We must leave Xenophobia, they are people too"
 poland_pis.11.t: "Lex TVN"
 poland_pis.11.d: "Today, the Sejm tabled a controversial amendment to the \"Broadcasting and Cinematography Act\" - better known by the media term Lex TVN. The amendments were intended to close loopholes that allowed companies from outside the European Economic Area to own more than 49% of shares in Polish radio and television stations through shell corporations.\nThe Sejm denies that the measure is aimed at any one broadcaster, saying it aims to prevent potential media acquisitions by non-EU countries such as Russia, China and Arab countries; however, many critics have described the amendment as an attempt to target TVN and its parent company TVN Grupa Discovery in particular, given that it is the main television platform of the ruling Law and Justice party's opposition."
 poland_pis.11.a: "We will pass the bill"
 poland_pis.11.b: "And where is democracy here?"
 poland_pis.11.c: "Use the veto"
 poland_pis.12.t: "Poland is carrying out de-Banderization"
 poland_pis.12.d: "The Polish administration has announced the beginning of the de-Banderization of our migrants. They say: \"We are not happy when Ukrainian migrants, whom we accept with bread and salt, wave OUN-UPA flags and shout neo-Nazi slogans. Apparently, our neighbors forget that it was under such flags and slogans that the Organization of Ukrainian Nationalists carried out the genocide of the Polish people in March 1943. We do not consider these gestures provocative and extremely disrespectful to our history and culture.\""
 poland_pis.12.a: "Poles think too much of themselves"
 poland_pis.13.t: "Three Seas Initiative"
 poland_pis.13.d: "This morning we received an official invitation from Polish diplomats to join a newly created organization called \"Three Seas Initiative\" or \"Three Seas\". The organization promises economic and political cooperation between all participating countries. And the Intermarium project is a Polish Imperialist dream of restoring the former greatness between the three seas, the organization seems to be a completely peaceful and economically beneficial initiative for us, joining which can bring its own benefits."
 poland_pis.13.a: "We will accept the invitation"
 poland_pis.13.b: "Forced to refuse"
 poland_pis.14.t: "[FROM.GetName] accepts the invitation"
 poland_pis.14.d: "Today we received an official response from [FROM.GetName] to our invitation. They agreed to become part of the Three Seas and contribute to the development of the organization. This will definitely strengthen our relations and increase our economic and political power."
 poland_pis.14.a: "Good news!"
 poland_pis.15.t: "[FROM.GetName] did not accepts the invitation"
 poland_pis.15.d: "Today we received an official response from [FROM.GetName] to our invitation. They decided to refuse our invitation, perhaps they had reasons for this, however, it is very sad, because they could have contributed to the development of the organization."
 poland_pis.15.a: "It's their choice."
 poland_pis.16.t: "Poland creates new organization"
 poland_pis.16.d: "Today, Polish President Andrzej Duda gave a speech. He spoke about the creation of a new economic and political alliance called the \"Three Seas Initiative\". A number of countries have already received invitations to join the organization, and some have even agreed. Such organizations clearly play into Poland's hands in terms of influence in Europe."
 poland_pis.16.a: "Interesting, what this will lead to"
 poland_pis.17.t: "Poland proposes to conclude the Baltic Pact"
 poland_pis.17.d: "Today Polish diplomats approached us with a proposal to sign a certain \"Baltic Pact\". This pact will give mutual obligations to our countries to protect each other's sovereignty and borders. We will receive Polish security guarantees and allow them to establish a Military Base on our territory, we in turn will receive the same privileges. Should we sign?"
 poland_pis.17.a: "We will sign"
 poland_pis.17.b: "I think Russia won't like this..."
 poland_pis.18.t: "[FROM.GetName] agreed to accept our proposal"
 poland_pis.18.d: "[FROM.GetName] accepted our proposal to sign the Baltic Pact. Now we have mutual obligations regarding the security of each other's borders and sovereignty."
 poland_pis.18.a: "Europe has become even safer"
 poland_pis.19.t: "[FROM.GetName] refused to accept our proposal"
 poland_pis.19.d: "[FROM.GetName] refused our offer. The Baltic Pact was not signed with them, which is a pity, we could have become strategic partners."
 poland_pis.19.a: "Let's see how they cope without our support"
 poland_pis.20.t: "Poland offers support"
 poland_pis.20.d: "The Transnistrian conflict, which began in the 90s, remains unresolved. Moreover, the worsening relations with Russia seem to make a military conflict inevitable. Poland decided to support us in this conflict and asked us what we need. Should we accept their support?"
 poland_pis.20.a: "We need more money"
 poland_pis.20.b: "We definitely need weapons"
 poland_pis.20.c: "We don't need anything"
 poland_pis.21.t: "Poland demands reparations for Volyn"
 poland_pis.21.d: "Poland demands reparations for the genocide of the Polish people in the Volyn Massacre in March 1943, carried out by the OUN-UPA. On the one hand, by paying reparations we can forget about old grievances and become good partners with Poland. On the other hand, the very fact of such demands is a direct humiliation of our nation. What should we do?"
 poland_pis.21.a: "We recognize the genocide of Poles and will pay reparations"
 poland_pis.21.b: "We will not pay anything. Slava Ukraine"
 poland_pis.22.t: "Ukraine agreed to pay reparations"
 poland_pis.22.d: "Ukraine agreed to our demand and paid us reparations for Volyn. Of course, this will not justify the crimes of the OUN-UPA organization and will not bring back to life the women, children and hundreds of other Poles killed in March 1943, but now we can build a new future with our neighbor, who has acknowledged the sins of the past and is ready to improve relations."
 poland_pis.22.a: "Niech będzie pokój!"
 poland_pis.23.t: "Ukraine refused to pay reparations"
 poland_pis.23.d: "Ukraine refused to pay reparations and to recognize the genocide of the Polish people in Volyn. We will never forget the victims of the Volyn Massacre and will never forgive those who committed this terrible act. The OUN-UPA organization, which was behind the genocide in Volyn, is still glorified in Ukraine, and their leader, Stepan Bandera, has been elevated to the rank of National Hero of Ukraine. It is time to stop this absurdity, peacefully or by war."
 poland_pis.23.a: "Jeszcze Polska nie zginęła!"
 poland_pis.23.b: "We will force them, but not now"
 poland_pis.24.t: "Poland closes borders with us"
 poland_pis.24.d: "The Polish government has announced the closure of borders with our country. This step is clearly not friendly... We can forget about further cooperation with the Poles."
 poland_pis.24.a: "They won't see our potatoes"
 poland_pis.25.t: "Poland asks to build Protective Umbrella"
 poland_pis.25.d: "Polish diplomats have approached us with a request. They are asking us to build a Protective Umbrella over their territory. To ensure this, we must send several brigades of our army to increase our presence in the Polish region."
 poland_pis.25.a: "Let's defend Poland!"
 poland_pis.25.b: "It's not worth wasting resources on this"
 poland_pis.26.t: "[FROM.GetName] agrees to increase presence"
 poland_pis.26.d: "[FROM.GetName] agrees to increase presence. Their presence in the region is vital to our security, especially at such a tense time."
 poland_pis.26.a: "This is what an ally means"
 poland_pis.27.t: "[FROM.GetName] refused to increase presence"
 poland_pis.27.d: "[FROM.GetName] refused to increase presence. It looks like we'll have to maintain our own security."
 poland_pis.27.a: "We'll manage on our own"

 #PiS Decisions
 POL_three_seas_initiative_category: "Three Seas Initiative"
 POL_three_seas_initiative_category_desc: "§CThe Three Seas Initiative§!, known also as the Baltic, Adriatic, Black Sea (BABS) Initiative or simply as the Three Seas, is a forum of thirteen states, in the European Union, running along a north-south axis from the Baltic Sea to the Adriatic and Black Seas in Central and Eastern Europe. The Initiative aims to create a regional dialogue on questions affecting the member states.\n\n\n\n\n£GFX_POL_three_seas_initiative_decision_category\n\n\n\n\n\n"
