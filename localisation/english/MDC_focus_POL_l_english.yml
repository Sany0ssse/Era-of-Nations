 poland_kaliningradanimal.1.t: "The Kaliningrad Animal Killed Our General"
 poland_kaliningradanimal.1.d: "Today, terrible news came from the General Staff. General Waldemar Skrzypczak has been killed. He was on exercises on the border of the Kaliningrad region when a black bear suddenly burst out of the forest. The beast killed a total of 12 people, including General Waldemar Skrzypczak, who became the animal's first victim. We were able to find a photo of the bear from the bodycam of one of the slain reporters.\nAfter the incident, the bear disappeared. Our troops are currently conducting an investigation, according to which the animal came from Kaliningrad and disappeared there through the forests on the border with the Region."
 poland_kaliningradanimal.1.a: "YOU HAVE BETRAYED US, WOJTEK!"
 poland_kaliningradanimal.2.t: "The Kaliningrad Beast destroyed the hives."
 poland_kaliningradanimal.2.d: "On the border with the Kaliningrad region, there was an apiary belonging to a resident of Masuria. The apiary contained numerous hives with various flags, both Polish and Ukrainian. Last night, the Kaliningrad Animal arrived at the apiary, destroyed all the hives with Ukrainian flags, ate the honey, defecate on the Ukrainian flags, and then headed toward the Russian border."
 poland_kaliningradanimal.2.a: "That Bear again!"
 poland_kaliningradanimal.3.t: "A Kaliningrad animal stole our tank."
 poland_kaliningradanimal.3.d: "Today, during exercises near the Kaliningrad border, our T-72 Tverdy tanks were being tested. Suddenly, a bear emerged from the forest, unnoticed by our soldiers. According to eyewitnesses, the animal surreptitiously approached the tank, climbed inside, and drove it away to Russia, beyond our borders. A soldier who was inside the tank at the time recounts that the bear skillfully controlled the tank and attempted to deliver it to Russia as undamaged as its paws would allow, knocking down every tree in its path."
 poland_kaliningradanimal.3.a: "KURWA! HOW MUCH CAN YOU!"
 poland_kaliningradanimal.4.t: "Russia awards Medved the Hero of Russia Order"
 poland_kaliningradanimal.4.d: "The bear, nicknamed the Kaliningrad Beast, has long haunted the Poles. From the murder of a general to the stolen tank, this animal has haunted the Polish government. The bear would emerge from the Kaliningrad border into Poland, commit its crimes, and then flee the scene of the crime through the forest back to Kaliningrad.\nToday, the media exploded with the news that Russia had awarded this bear the Hero of Russia Order. The awards ceremony took place in the Kremlin, and according to reporters, the bear even shook hands with the head of the [SOV.GetName]."
 poland_kaliningradanimal.4.a: "WTF??"


