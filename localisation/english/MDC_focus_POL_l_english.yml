 poland_ukrmigration.1.t: "Ukrainians are migrating en masse to our country."
 poland_ukrmigration.1.d: "Since the outbreak of full-scale war in Ukraine, thousands of migrants have flooded our borders. Our citizens are concerned that such a rapid increase in migration could cause instability in society, and that the migrants themselves will begin to take jobs away from the population. As usual, party leaders have different positions on the issue of Ukrainian migration: some advocate helping them settle in our country and giving them special attention as refugees, while others, on the contrary, advocate that Ukrainian migrants not receive special benefits from the government and commit themselves to respecting Polish culture and order on Polish streets. Which of these options is best for us?"
