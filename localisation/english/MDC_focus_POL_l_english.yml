 #Intemarium AI Loc
 POL_project_intermarium_desc: "The grand strategic vision of 'Intermarium' (Międzymorze) is launched—a geopolitical project to unite the lands between the Baltic, Black, and Adriatic Seas into a powerful bloc capable of standing against both German and Russian influence."
 POL_new_center_of_power_desc: "The ultimate goal of the Intermarium project: to establish a new, independent center of power in Europe, with Poland at its core, challenging the dominance of Brussels, Berlin, and Moscow and reshaping the continent's balance of power."
 POL_target_visegrad_desc: "The first and most crucial step: consolidating the Visegrad Group (Poland, Czech Republic, Slovakia, Hungary) into the core of the Intermarium, transforming a loose coordination forum into a unified political and military entity under Polish leadership."
 POL_target_baltics_desc: "Integrating the Baltic states—Lithuania, Latvia, and Estonia—into the Intermarium, securing the alliance's northern flank and providing these nations with a security guarantee against external threats, thereby pulling them firmly into Warsaw's orbit."
 POL_target_eastern_balkans_desc: "Extending the Intermarium's reach to the Eastern Balkans, focusing on Romania, Bulgaria, and Moldova, to secure the Black Sea coastline and create a contiguous bloc from the Baltic to the Black Sea."
 POL_target_western_balkans_desc: "A diplomatic offensive to draw the nations of the Western Balkans—Croatia, Slovenia, Serbia, Bosnia and Herzegovina—into the Intermarium's sphere of influence, gaining access to the Adriatic Sea and stabilizing the region under its auspices."
 POL_tri_sea_pact_desc: "The formalization of the 'Three Seas Initiative' into a binding political and military pact, focusing on joint infrastructure, energy security, and defense projects to solidify the unity of the participating nations."
 POL_target_eastern_borderlands_desc: "A focused strategy to re-establish Polish influence over the historical 'Eastern Borderlands' (Kresy) of Ukraine and Belarus, using a combination of soft power and political pressure to bring these areas into the Intermarium's fold."
 POL_polish_dream_desc: "The ideological and nationalistic embodiment of the Intermarium vision—a 'Polish Dream' of a resurrected Commonwealth-like federation, where Poland commands a vast sphere of influence, ensuring its security and prosperity for centuries to come."
 POL_intermarium_desc: "The concept of Intermarium evolves from a political project into a tangible reality, as diplomatic, economic, and military structures are created to bind the participating nations together in a formidable confederation."
 POL_plan_prometheus_desc: "The activation of 'Plan Prometheus,' a strategy aimed at weakening Russian influence by supporting independence movements and fostering nationalist sentiments among the non-Russian peoples within Russia's sphere, echoing the interwar-era Prometheist project."
 POL_confederation_intermarium_desc: "The final and most ambitious stage: the transformation of the Intermarium alliance into a formal confederation—a supranational entity with shared institutions for defense, foreign policy, and trade, yet preserving the sovereignty of its member states under Poland's guiding hand." 
 POL_target_caucasus_desc: "Extending the Intermarium project's influence to the Caucasus region, seeking strategic partnerships with countries like Georgia and Azerbaijan to secure energy routes and create a contiguous bloc countering Russian influence."
 POL_target_expand_the_project_desc: "The strategic goal of expanding the Intermarium beyond its initial core, aiming to include Balkan and Caucasus nations, thereby transforming it from a regional alliance into a major geopolitical force spanning from the Baltic to the Black and Caspian Seas."
 #INTERMARIUM DECISION
 POL_intermarium_category: "INTERMARIUM"
 POL_intermarium_category_desc: "\n\n\n\n\n\n£GFX_POL_intermarium_decision_category_picture\n\n\n\n\n\n\n\n\n\n\n Intermarium was a post-World War I geopolitical plan conceived by Józef Piłsudski to unite former Polish-Lithuanian Commonwealth lands within a single polity. The plan went through several iterations, some of which anticipated the inclusion of neighbouring states. The proposed multinational polity would have incorporated territories lying between the Baltic, Black, and Adriatic Seas, hence the name Intermarium\n\n Prospectively a federation of Central and Eastern European countries, the post-World War I Intermarium plan pursued by Piłsudski sought to recruit to the proposed federation the Baltic states (Lithuania, Latvia, Estonia), Finland, Belarus, Ukraine, Hungary, Romania, Yugoslavia, and Czechoslovakia. The Polish name Międzymorze , meaning \"Between-Seas\", was rendered into Latin as Intermarium\n\n The proposed federation was meant to emulate the Polish-Lithuanian Commonwealth, stretching from the Baltic Sea to the Black Sea, that, from the end of the 16th century to the end of the 18th, had united the Kingdom of Poland and the Grand Duchy of Lithuania. Intermarium complemented Piłsudski's other geopolitical vision, Prometheism, whose goal was the dismemberment of the Russian Empire and that Empire's divestment of its territorial acquisitions"
