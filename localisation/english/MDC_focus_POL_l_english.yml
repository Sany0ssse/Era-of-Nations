 #War terror events
 poland_antiterror.1.t: "Poland wants to send its peacekeepers"
 poland_antiterror.1.d: "Today, Polish diplomats arrived in our country with an offer of military assistance in the form of peacekeeping brigades of the Polish Regular Army. This offer arose from Poland's desire to prevent the spread of the Taliban's terrorist ideology and help preserve democratic governance in Central Asia.\nTheir peacekeepers will help us in confronting the Taliban and will increase their presence in the region."
 poland_antiterror.1.a: "Their help is very useful."
 poland_antiterror.1.b: "We ourselves can survive this war."
 poland_antiterror.2.t: "Afghanistan has received our peacekeepers"
 poland_antiterror.2.d: "Our diplomats returned from Afghanistan with a report. The Afghan government agreed to accept our peacekeeping troops. This step will increase our presence in the region and deal an additional blow to the Taliban."
 poland_antiterror.2.a: "Let's strike a blow against the Taliban!"
 poland_antiterror.3.t: "Afghanistan is refusing our peacekeepers"
 poland_antiterror.3.d: "Our diplomats returned from Afghanistan with a report. The Afghan government has rejected our peacekeepers, stating that they will not jeopardize their sovereignty and that they can cope with the Taliban threat on their own."
 poland_antiterror.3.a: "Their right..."
 POL_presence_in_afganistan_tt: "§YIf they agree§!: they will receive ownership of §R3 Divisions of our Peacekeepers§!. Our §YInfluence§! in the region will §GIncrease§!."
 poland_antiterror.4.t: "Warsaw Conference"
 poland_antiterror.4.d: "In light of recent events surrounding the US declaration of war on terror and the American Army's invasion of Iraq, Poland has convened an urgent summit to discuss and decide how to respond to these events.\nThe US itself claims that Iraq is developing weapons of mass destruction and pursuing an aggressive foreign policy. Under the pretext of bringing democracy to the region, they invaded a sovereign state. How should we respond?"
 poland_antiterror.4.a: "Send peacekeepers to US"
 poland_antiterror.4.b: "We must remain neutral on this issue."
 POL_warsaw_conference_tt: "We will hold a conference focusing on the §RUS invasion of Iraq§!. If the country decides to §GSupport§! the §6US§!, they will §YSend their Peacekeepers§! to the US."
 poland_antiterror.5.t: "Operation Eagle Feather"
 poland_antiterror.5.d: "Today, our infrastructure and radar stations were attacked by the combined forces of the Afghan resistance and the Polish Army. According to Polish media, 800 Polish soldiers participated in the so-called \"Eagle Feather\" operation. This operation severely damaged our morale and the fighting capacity of our army."
 poland_antiterror.5.a: "A pathetic attempt to stop the triumph of Jihad"
 poland_antiterror.6.t: "The question of intervention in Syria"
 poland_antiterror.6.d: "The situation in Syrian Kurdistan is rapidly deteriorating. Our sources report that pro-Turkish forces of the Syrian National Army, supported by Turkish air power, have resumed their offensive against positions of the Democratic Federation of Northern Syria in the Manbij and Tel Abyad areas. Simultaneously, ISIS sleeper cells have become active in Deir ez-Zor province. Rojava, weakened by years of war and economic blockade, has requested unofficial assistance from Warsaw."
 poland_antiterror.6.a: "Send peacekeepers to help"
 poland_antiterror.6.b: "Limit yourself to military consultations"
 poland_antiterror.7.t: "Poland sends peacekeepers"
 poland_antiterror.7.d: "The Polish Republic officially sent its peacekeeping battalions to our aid. At dawn, Polish Air Force transport planes landed on the Qamishli airstrip. Under the flag of the white eagle, two full battalions of the Polish peacekeeping contingent set foot on the soil of Northern Syria."
 poland_antiterror.7.a: "Long live Poland!"
 poland_antiterror.8.t: "Poland is sending military experts."
 poland_antiterror.8.d: "The Polish Republic has sent its experts to consult and coordinate our army. Polish experts have already deployed a mobile coordination center and have begun training our commanders on how to spot Turkish Bayraktars before they see us. How to jam their signals. How to move at night while remaining invisible to thermal imagers."
 poland_antiterror.8.a: "Long live Poland!"

