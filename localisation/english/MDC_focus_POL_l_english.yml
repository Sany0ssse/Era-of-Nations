 #Platforma Obywatelska Events
 poland_po.1.t: "Maidan in Ukraine"
 poland_po.1.d: "Maidan and Civil War in Ukraine. Several republics, where mostly Russians live, oppressed by the Ukrainian neo-Nazi coup, revolt against the new government. Full-scale Civil War has begun. The new Ukrainian government promises to move closer to NATO, and begin European integration. Should we help our neighbors suppress the rebellion?"
 poland_po.1.a: "The war against our brother is our war"
 poland_po.1.b: "We will send mercenaries to help them"
 poland_po.1.c: "We will not help Banderowcom"
 poland_po.2.t: "Poland wants to join our war"
 poland_po.2.d: "Our Polish neighbors have approached us with a proposal. They want to help us in our crisis and, shoulder to shoulder, suppress the separatists. That is what brotherhood means!"
 poland_po.2.a: "Slava Ukraine!"
 poland_po.2.b: "We can handle it ourselves"
 poland_po.3.t: "Poland wants to send mercenaries"
 poland_po.3.d: "Our Polish brothers want to help us suppress the separatist rebellion and offer us several brigades of their Mercenaries. They will help us a lot."
 poland_po.3.a: "Sure, we agree"
 poland_po.3.b: "We can handle it ourselves"
 poland_po.4.t: "Ukraine refused our help"
 poland_po.4.d: "Ukraine has refused our courtesy. Well, God help them, if Russia intervenes for the separatists, they certainly won't stand for it, but that's not our concern."
 poland_po.4.a: "Wonder how long they will last?"

 #Zjednoczona Prawica
 POL_zjednoczona_prawica: "Zjednoczona Prawica"
 POL_zjednoczona_prawica_desc: "The 'United Right' consolidates various conservative, nationalist, and Christian democratic parties into a powerful electoral bloc, aiming to unite the fractured Polish right under a common banner to secure a parliamentary majority."
 POL_liga_i_samooborona: "Liga i Samoobrona"
 POL_liga_i_samooborona_desc: "A controversial coalition between the nationalist League of Polish Families and the populist-agrarian Self-Defense party, merging social conservatism with radical economic populism to challenge the political establishment."
 POL_liga_polskich_rodzin: "Liga Polskich Rodzin"
 POL_liga_polskich_rodzin_desc: "The League of Polish Families emerges as a significant force, promoting a blend of staunch Catholic values, economic nationalism, and a skeptical stance towards European integration."
 POL_legacy_of_dmowski: "Legacy of Dmowski"
 POL_legacy_of_dmowski_desc: "Reviving the ideological legacy of Roman Dmowski, a founding father of Polish nationalism, which emphasizes national egoism, the central role of the Catholic Church, and a deep-seated skepticism towards Germany and Jewish influence."
 POL_moderate_nationalism: "Moderate Nationalism"
 POL_moderate_nationalism_desc: "A state-sponsored patriotism that emphasizes Polish culture, history, and sovereignty, but seeks to avoid the extremes of xenophobia and isolationism, positioning itself as a defender of national interests within the international community."
 POL_polish_ultranationalism: "Polish Ultranationalism"
 POL_polish_ultranationalism_desc: "The promotion of an aggressive, exclusionary form of nationalism that posits the ethnic and cultural superiority of Poles, views minorities as a threat, and advocates for a homogenous nation-state."
 POL_religious_xenophobia: "Religious Xenophobia"
 POL_religious_xenophobia_desc: "A doctrine that intertwines Catholic fundamentalism with hostility towards external 'others,' framing non-Catholic immigrants, liberal EU elites, and other religions as existential threats to Poland's national and religious identity."
 POL_prohibition_sale_lands_germans: "Prohibition of Sale of Lands to Germans"
 POL_prohibition_sale_lands_germans_desc: "A law explicitly banning German citizens from purchasing Polish land, fueled by historical grievances and fears of 'quiet expansion' and German economic dominance."
 POL_poland_without_jews: "Poland without Jews"
 POL_poland_without_jews_desc: "The promotion of an ethno-state ideal, a deeply anti-Semitic vision of a Poland purged of Jewish cultural, political, and economic influence, harkening back to pre-war nationalist ideologies."
 POL_we_dont_need_eu: "We don't need EU"
 POL_we_dont_need_eu_desc: "A radical policy advocating for 'Polexit'—Poland's withdrawal from the European Union—which is framed as a necessary step to reclaim full national sovereignty and resist the imposition of liberal, secular values from Brussels."
 POL_sovereign_economy: "Sovereign Economy"
 POL_sovereign_economy_desc: "An economic model prioritizing state control and national ownership of key industries, designed to protect Poland from global market fluctuations and what is perceived as foreign economic exploitation."
 POL_return_to_zloty: "Return to the Zloty"
 POL_return_to_zloty_desc: "A populist and economically nationalist demand to abandon the Euro and reclaim the Polish Zloty as the sole national currency, symbolizing a rejection of deeper European integration and a reassertion of monetary sovereignty."
 POL_east_without_russia: "East without Russia"
 POL_east_without_russia_desc: "A foreign policy doctrine aimed at creating a bloc of Eastern European nations (like Ukraine, Belarus, and the Baltic states) under Polish leadership, explicitly designed to counter and contain Russian influence."
 POL_crush_pink_hyenas_of_mossad: "Crush the Pink Hyenas of Mossad"
 POL_crush_pink_hyenas_of_mossad_desc: "The propagation of a vicious anti-Semitic conspiracy theory, alleging that Israeli intelligence (Mossad) and global Jewish interests ('pink hyenas') are working to undermine and control Poland."
 POL_clerical_nationalism: "Clerical Nationalism"
 POL_clerical_nationalism_desc: "The fusion of Catholic doctrine with state policy, aiming to create a polity where national identity is inseparable from Roman Catholicism, and the Church holds significant influence over legislation and public life."
 POL_introduce_death_penalty: "Introduce the Death Penalty"
 POL_introduce_death_penalty_desc: "A push to reinstate capital punishment for the most serious crimes, appealing to populist demands for harsh justice and framed as an expression of national sovereignty and the 'will of the people'."
 POL_protecting_traditional_family: "Protecting the Traditional Family"
 POL_protecting_traditional_family_desc: "A core policy pillar defining the 'traditional family'—a married heterosexual couple with children—as the fundamental unit of society and actively opposing LGBT rights, sex education, and feminism as destructive forces."
 POL_solidarity: "Solidarity"
 POL_solidarity_desc: "The 'Solidarity' (Solidarność) trade union movement emerges as a massive social and political force, uniting workers, intellectuals, and the Catholic Church in a peaceful struggle against the communist regime. It becomes a symbol of resistance and the cornerstone of Poland's eventual transition to democracy."
 POL_moving_from_xenophobia: "Moving Away from Xenophobia"
 POL_moving_from_xenophobia_desc: "A conscious political and social effort to moderate the national discourse, moving away from the extremes of xenophobia and isolationism. This path seeks to redefine patriotism as an inclusive civic identity, open to cooperation and dialogue with both European partners and ethnic minorities within the country."
 POL_poland_above_all: "Poland Above All"
 POL_poland_above_all_desc: "A patriotic doctrine that places the national interest, sovereignty, and security of the Polish state above all other considerations in both foreign and domestic policy. It advocates for a strong, independent Poland that is resilient to external pressure and internal division."
 POL_moderate_clericalism: "Moderate Clericalism"
 POL_moderate_clericalism_desc: "Acknowledging the special role of the Catholic Church in Polish culture and public life, while seeking a pragmatic relationship that falls short of full theocracy, often using it as a moral guide for state policy."
 POL_laws_on_catholic_values: "Laws on Catholic Values"
 POL_laws_on_catholic_values_desc: "The enactment of legislation that directly incorporates Catholic moral teachings into state law, potentially restricting abortion, divorce, and the promotion of non-traditional lifestyles."
 POL_national_liberal_policy: "National Liberal Policy"
 POL_national_liberal_policy_desc: "An attempt to synthesize liberal economic principles—such as free markets, privatization, and deregulation—with a strong emphasis on national identity, cultural tradition, and state sovereignty. This policy seeks prosperity through market mechanisms while safeguarding Poland's distinct cultural and political character."
 POL_will_of_polish_people: "Will of the Polish People"
 POL_will_of_polish_people_desc: "A populist doctrine claiming that the government's legitimacy comes solely from implementing the unambiguous 'will of the people,' often used to justify overriding institutional checks and balances."
 POL_european_international: "European International"
 POL_european_international_desc: "An attempt to forge a pan-European alliance of right-wing, conservative, and nationalist parties to shift the EU's political center of gravity away from liberalism and federalism towards a 'Europe of Fatherlands'."
 POL_join_eurozone: "Join the Eurozone"
 POL_establish_partnership_with_russia: "Establish a Geopolitical Partnership with Russia"
 POL_establish_partnership_with_russia_desc: "A controversial geopolitical pivot seeking to normalize and build a strategic partnership with Russia, based on shared Slavic heritage and conservative values, while downraining historical conflicts and current tensions."
 POL_homophobic_tendency: "Homophobic Tendency"
 POL_homophobic_tendency_desc: "State-sponsored or state-tolerated rhetoric and policies that marginalize and stigmatize the LGBT community, portraying them as a threat to national values and the well-being of children."
 POL_condemn_lgbt_top_ec: "Condemn the LGBT Top of the EC"
 POL_condemn_lgbt_top_ec_desc: "A direct confrontation with the European Commission, accusing its leadership of imposing an 'LGBT ideology' on member states and violating Poland's national sovereignty and right to uphold its cultural values."
 POL_renationalization_economy: "Renationalization of the Economy"
 POL_renationalization_economy_desc: "A policy of reversing privatization and bringing strategic industries and assets, especially those sold to foreign entities, back under state control to ensure they serve 'national interests'."
 POL_catholic_social_teaching: "Catholic Social Teaching"
 POL_catholic_social_teaching_desc: "Implementing economic policies based on the principles of Catholic social teaching, emphasizing the dignity of work, fair wages, subsidiarity, and a rejection of both laissez-faire capitalism and state socialism."
 POL_protectionalist_position: "Protectionist Position"
 POL_protectionalist_position_desc: "The adoption of high tariffs, subsidies for domestic companies, and barriers to foreign ownership to shield Polish workers and industries from international competition."
 POL_destroy_balc_children: "Destroy the 'Children of Balcerowicz'"
 POL_destroy_balc_children_desc: "A symbolic and political crusade against the elites and structures associated with the post-1989 liberal economic transformation ('Balcerowicz's Children'), blamed for social inequality and selling out the country to foreign capital."
 POL_condemn_mcdonaldization_of_planet: "Condemn the 'McDonaldization of the Planet'"
 POL_condemn_mcdonaldization_of_planet_desc: "A cultural and ideological stance against American-led globalization, which is seen as eroding national traditions, promoting consumerism, and imposing a homogenized, decadent culture on Poland."
 POL_publication_secret_police_archives: "Publication of Secret Police Archives"
 POL_publication_secret_police_archives_desc: "A policy of full transparency, publishing the archives of the communist-era secret police (SB) to expose collaborators, settle historical scores, and purge public life of those tied to the former regime."
 POL_protection_polish_property: "Protection of Polish Property"
 POL_protection_polish_property_desc: "Legislation to prevent the sale of agricultural land, forests, and strategic enterprises to foreign entities, particularly targeting German and Dutch buyers, to keep Polish property in Polish hands."
 

