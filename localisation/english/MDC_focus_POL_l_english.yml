 POL_deportatons_desc: "A comprehensive state program to identify, process, and deport individuals residing in Poland without legal authorization, aimed at asserting control over migration flows and upholding national immigration laws."

 POL_Reorganization_of_special_services_desc: "A sweeping reform of Poland's intelligence and counterintelligence architecture to eliminate redundancies, clarify chains of command, and enhance operational effectiveness in facing modern threats." 

 POL_abw_desc: "Strengthening the Internal Security Agency (ABW) as the primary civilian counterintelligence and anti-corruption body, tasked with protecting the state's internal security and constitutional order."

 POL_agencja_wywiadu_desc: "Empowering the Foreign Intelligence Agency (AW) to gather critical intelligence abroad, counter foreign threats, and advance Poland's strategic interests on the global stage."

 POL_wsi_desc: "The dissolution and reform of the Military Information Services (WSI), an organization plagued by post-communist legacy and scandals, to be replaced by new, more transparent structures." 

 POL_skw_desc: "The establishment of the Military Counterintelligence Service (SKW) to protect the Polish Armed Forces from espionage, sabotage, and internal subversion, ensuring the military's integrity and secrecy."

 POL_sww_desc: "The creation of the Military Intelligence Service (SWW) to conduct external military reconnaissance, provide early warning of threats, and support international operations of the Polish Armed Forces."

 POL_mswa_desc: "Reinforcing the Ministry of Interior and Administration (MSWiA) as the central command body for the police, border guard, and emergency services, coordinating national internal security policy."

 POL_straz_graniczna_poland_desc: "Modernizing the Border Guard (Straż Graniczna) with new equipment, personnel, and legal powers to effectively secure Poland's EU external border against illegal migration and cross-border crime."

 POL_wot_poland_desc: "The expansion and professionalization of the Territorial Defence Force (WOT), a component of the Polish Armed Forces designed for homeland defense, crisis response, and bolstering national resilience."

 POL_National_Police_desc: "A reform and modernization program for the National Police (Policja), focusing on improving community relations, combating organized crime, and integrating advanced technologies for law enforcement."

 POL_Marshal_Guard_desc: "Enhancing the capabilities and prestige of the Marshal's Guard (Straż Marszałkowska), the security force responsible for protecting the Sejm and Senate, symbolizing the defense of Polish democracy."



