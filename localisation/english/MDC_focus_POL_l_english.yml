 POL_economy_category: "Economy of Poland"
 POL_economy_category_desc: " Poland is not in the best economic light as the new millennium begins. Market reforms and successful liberalization have borne fruit, but there are still many important problems that we need to solve. \n\n Examples of such problems include underdeveloped energy, which can hardly cope with the task of supplying the population. In addition, we have a number of problems with coal mining, the country is littered with unprofitable mines that rely on state subsidies, which brings colossal losses to our economy.\n\n"
