 #PiS AI 
 POL_pis_desc: "Law and Justice (PiS) solidifies its position as Poland's dominant conservative and right-wing party, championing a platform of social traditionalism, economic redistribution, and a robust, sovereign state."
 POL_illiberal_democracy_desc: "The implementation of a political model that prioritizes the 'will of the majority' and national sovereignty over liberal checks and balances, challenging the EU's fundamental values by concentrating power in the executive and subordinating the judiciary."
 POL_antipode_kwasnewski_desc: "A deliberate ideological break from the centrist, pragmatic, and pro-European legacy of President Aleksander Kwasniewski, marking a shift towards conservative values, historical policy, and a more confrontational stance within the EU."
 POL_moral_revolution_desc: "A sweeping cultural and political project aimed at purging Poland of the perceived moral decay and post-communist mindset of the Third Republic, promising a new era of virtue, patriotism, and traditional values."
 POL_dissociate_from_third_rzeczospolita_desc: "A foundational policy of rejecting the political and economic settlement of post-1989 Poland, which PiS characterizes as a corrupt 'układ' (deal) between post-communist elites and liberal reformers that betrayed ordinary Poles."
 POL_fourth_rzeczospolita_desc: "The proclaimed goal of building a 'Fourth Republic'—a new state order that replaces the flawed Third Republic, centered on a powerful executive, social solidarity, and the reassertion of Polish national identity."
 POL_wrest_poland_from_left_desc: "A declared war on the 'leftist elite' accused of dominating public media, culture, and the judiciary since 1989, with the aim of reclaiming the state for 'true patriots'."
 POL_restriction_freedom_desc: "The introduction of legislation that critics argue curtails civil liberties, particularly targeting freedom of assembly and expression, especially for LGBT activists and government protesters, in the name of public order and moral norms."
 POL_media_censorship_desc: "The systematic takeover and transformation of public broadcasters into government mouthpieces, coupled with legal and economic pressure on independent private media, to ensure a favorable information landscape for the ruling party."
 POL_ban_lgbt_desc: "The promotion of 'LGBT-free zones' and legislation aimed at restricting the ability of LGBT groups to assemble and advocate for their rights, framed as protecting children from 'ideology' and defending traditional families."
 POL_fighting_lgbt_indoctrination_desc: "A policy initiative targeting what is perceived as the promotion of LGBT ideology in schools and public life, aiming to shield Polish youth from influences deemed contrary to traditional Catholic values."
 POL_neoclericalism_desc: "The establishment of a new, powerful alliance between the state and the Catholic Church, granting it significant influence over legislation, education, and culture, and making religious doctrine a guiding principle for public policy."
 POL_defending_christian_values_desc: "A central tenet of the government's cultural policy, actively opposing secularization and promoting Poland's Catholic identity as the bedrock of the nation, both domestically and as a distinctive stance within the EU."
 POL_independence_judiciary_desc: "A controversial and extensive overhaul of the court system, which the government argues is necessary to purge post-communist judges and make the judiciary efficient, but which the EU and critics decry as a politicized assault on judicial independence."
 POL_state_judicial_council_desc: "The reform of the National Council of the Judiciary to give the parliament and executive direct control over the appointment of judges, a key element in the government's battle for influence over the courts."
 POL_question_presumptiom_innocence_desc: "Legal changes that strengthen the prosecution and limit defendants' rights, justified as necessary to fight corruption and crime effectively, but raising concerns about the erosion of fundamental legal principles."
 POL_central_biuro_antikorupcyjne_desc: "Empowering the Central Anticorruption Bureau (CBA) to become a primary tool for investigating and targeting political opponents and officials from previous governments under the banner of a genuine anti-corruption drive."
 POL_crush_political_lobbyists_desc: "A declared crackdown on the opaque networks of influence between business and politics ('lobbyists' or 'układ'), which PiS vows to dismantle to create a state that serves the people, not special interests."
 POL_overthrow_uklad_desc: "The overarching mission to dismantle the entrenched system of interests linking business, politics, and the media that allegedly ruled Poland after 1989, replacing it with a new loyalist elite."
 POL_pis_deprivatization_desc: "A policy of reviewing and sometimes reversing the privatizations of the 1990s and 2000s, particularly of strategic assets, to bring them back under state control for reasons of national interest and economic sovereignty."
 POL_lowering_retirement_age_desc: "The fulfillment of a key campaign promise to reverse the previous government's pension reform, lowering the retirement age to 60 for women and 65 for men to honor 'social solidarity'."
 POL_fighting_national_debt_desc: "A focus on fiscal responsibility through controlled spending and robust economic growth, aiming to reduce the national debt burden without rolling back flagship social spending programs."
 POL_reductional_income_tax_desc: "The introduction of a significant tax cut for the vast majority of workers, a popular policy designed to increase disposable income and fulfill the party's promise of fairer economic redistribution."
 POL_increase_minimum_wage_desc: "A series of substantial, state-mandated increases to the minimum wage, aimed at improving the standard of living for the lowest-paid workers and reducing economic inequality."
 POL_support_for_startups_desc: "Government programs offering funding and incentives for technological innovation and new businesses, aiming to modernize the Polish economy and reduce its dependence on foreign investment in low-value sectors."
 POL_stabilization_pension_provision_desc: "Reforms to the pension system aimed at ensuring its long-term financial stability, a challenging task amid the costs of popular social programs and a demographic shift."
 POL_decommunization_program_desc: "A systematic effort to remove symbols and names from the communist era from public spaces, alongside vetting public officials for collaboration with the former security services."
 POL_exposing_ppr_desc: "The opening of secret police archives and the public naming of alleged collaborators from the communist period (PRL), used to discredit political opponents and shape the historical narrative."
 POL_reorganization_biuro_biezpieczenstwa_desc: "A reform of the National Security Bureau to strengthen executive control over the intelligence and counter-intelligence apparatus, ensuring its loyalty and alignment with government policy."
 POL_prohibition_propaganda_totalitarianism_desc: "A law criminalizing the promotion of communist or other totalitarian ideologies, aimed at legally enshrining a specific historical narrative and punishing its violation."
 POL_ukr_strategic_partnership_desc: "The cultivation of a close strategic partnership with Ukraine, based on shared security concerns regarding Russia, while simultaneously navigating difficult historical issues like the Volyn Massacre."
 POL_aim_coop_baltic_desc: "A foreign policy priority to deepen military, economic, and political cooperation with the Baltic states (Lithuania, Latvia, Estonia), seen as natural allies against Russian aggression."
 POL_baltic_pact_desc: "The push for a formalized defense and security pact among the Baltic Sea states, enhancing regional solidarity and deterrence capabilities in the face of a resurgent Russia."
 POL_three_seas_initiative_desc: "Active leadership in the 'Three Seas Initiative,' a forum of EU countries between the Baltic, Adriatic, and Black Seas, aiming to boost infrastructure, energy security, and political cohesion to counter Russian and German influence."
 POL_visit_to_serbia_desc: "A diplomatic outreach to Serbia, seeking to strengthen ties with a traditional Slavic and Orthodox partner in the Balkans and counter Western influence in the region."
 POL_turn_caucasus_desc: "A diplomatic pivot towards the Caucasus region (Azerbaijan, Georgia), aiming to diversify energy supplies and build strategic partnerships as part of an 'Intermarium' strategy."
 POL_reconciliation_with_germany_france_desc: "A pragmatic, if difficult, effort to mend fences with Berlin and Paris after periods of tension, recognizing their central role in the EU while continuing to assert Polish national interests."
 POL_condemn_nord_stream_desc: "A firm and vocal diplomatic campaign against the Nord Stream gas pipelines, condemning them as a threat to European energy security and a Russian geopolitical weapon that bypasses Eastern Europe."
 POL_prepare_russian_invasion_desc: "A significant acceleration of military modernization, large-scale defense procurement (especially from the US and South Korea), and the expansion of the armed forces in direct response to the heightened threat from Russia."
 POL_restructuring_armed_forces_desc: "A comprehensive overhaul of the military's structure, command, and equipment, transitioning from a Soviet-era legacy force to a modern army capable of deterring and defending against a peer adversary."
 POL_deal_energy_security_desc: "A strategic push for energy independence from Russia, involving the diversification of gas supplies through LNG terminals and new pipelines, and a commitment to coal and nuclear power."
 POL_safety_umbrella_desc: "The overarching national security strategy of seeking a permanent and increased US military presence on Polish soil, viewed as the ultimate security guarantee against external threats."
 POL_duda_era_desc: "The presidency of Andrzej Duda becomes synonymous with the PiS government's agenda, using the powers of the office to sign controversial legislation, shape the judiciary, and act as the loyal public face of the 'good change'."
 POL_abandonment_migration_quotas_desc: "A firm and populist refusal to accept any migrants under the EU's mandatory relocation scheme, framing it as a defense of national sovereignty, security, and cultural homogeneity against 'Islamic migrants'."
 POL_question_islamic_migrants_desc: "The framing of the migration issue primarily through a security and cultural lens, presenting Muslim migrants as a potential threat to Poland's public safety and Christian identity."
 POL_struggle_for_sovereignty_desc: "The central narrative of the government's clashes with the EU, portrayed not as a conflict over the rule of law, but as a heroic defense of Poland's right to self-determination against unelected Brussels bureaucrats."
 POL_increase_poland_role_in_eu_desc: "A strategy to increase Poland's influence within the European Union by building coalitions with other skeptical member states and using its economic and political weight to block federalist initiatives."
 POL_banking_law_act_desc: "A media law (dubbed 'Lex TVN') seen as targeting a major critical, US-owned television network, by preventing non-European entities from controlling Polish broadcasters, raising concerns about media freedom."
 POL_educational_law_desc: "A reform of the education system that centralizes control over schools and curricula, emphasizing patriotism and history while removing elements the government deems ideologically problematic."
 POL_problem_of_east_desc: "The establishment of a state commission (dubbed 'Lex Tusk') to investigate 'Russian influence' in Polish politics, widely criticized as a tool to discredit the main political opponent, Donald Tusk."
 POL_debanderization_desc: "A policy aimed at screening Ukrainian migrants for individuals or groups glorifying Stepan Bandera and the UPA, addressing a deeply sensitive historical issue within the strategic partnership."
 POL_reparations_for_volyn_desc: "The official raising of the issue of reparations from Ukraine for the World War II Volyn Massacre, complicating the strategic partnership by pressing a long-standing historical wound."
 POL_forget_old_grievances_desc: "A counter-initiative arguing for setting aside historical disputes, particularly with Ukraine, in the name of present-day geopolitical necessity and unity against a common Russian threat."
 POL_close_belarusian_border_desc: "The construction of a massive border barrier and the deployment of thousands of troops to seal the border with Belarus against a state-orchestrated hybrid attack using Middle Eastern migrants."
 POL_from_white_red_sheet_desc: "A symbolic project to create a new, positive national narrative and foundational myth for the Fourth Republic, moving beyond the perceived shame and compromises of the post-1989 period."
 POL_consensus_teach_john_paul2_desc: "An initiative to align state policy and legislation with the social and moral teachings of Pope John Paul II, emphasizing human dignity, solidarity, and the central role of the family, thereby cementing the Catholic Church's influence on the country's legal and cultural framework."
 POL_central_biuro_antikorup_desc: "The establishment and empowerment of the Central Anticorruption Bureau (CBA) as a key instrument in the fight against graft, granting it broad powers to investigate corruption in public life, though critics warn of its potential use for political purposes."
 POL_pis_death_penalty_desc: "A controversial push by the Law and Justice (PiS) party to reintroduce capital punishment for the most serious crimes, sparking a national debate on justice and human rights and placing Poland in direct conflict with European Union laws and values."
 POL_consensus_teach_john_paul2_desc: "An initiative to align state policy and legislation with the social and moral teachings of Pope John Paul II, emphasizing human dignity, solidarity, and the central role of the family, thereby cementing the Catholic Church's influence on the country's legal and cultural framework."
 POL_central_biuro_antikorupcyjne_desc: "The establishment and empowerment of the Central Anticorruption Bureau (CBA) as a key instrument in the fight against graft, granting it broad powers to investigate corruption in public life, though critics warn of its potential use for political purposes."
 POL_national_census_desc: "The execution of a comprehensive national census to gather vital demographic, social, and economic data, which is essential for effective governance, resource allocation, and long-term strategic planning."
 POL_monitoring_career_development_desc: "The implementation of a state-level system to track and analyze career progression and skill development among citizens, aiming to better align educational outcomes with labor market needs and identify areas for national investment in human capital."
 POL_judicial_reform_desc: "A sweeping and highly contentious overhaul of the judicial system, which the government argues is necessary to increase efficiency and purge post-communist influences, but which the European Union and critics condemn as an assault on judicial independence and the rule of law."
 POL_cooperation_in_the_baltics_desc: "A foreign policy priority to deepen political, economic, and military cooperation with the Baltic states of Lithuania, Latvia, and Estonia, seen as crucial for regional security, energy independence, and presenting a united front within the European Union and NATO."
 POL_strengthening_ties_in_balkans_desc: "A diplomatic offensive to enhance Poland's political and economic influence in the Western Balkans, supporting the European aspirations of these states while positioning Poland as a key player in this strategically important region."
 POL_support_moldova_desc: "Providing consistent political, economic, and technical support to Moldova, aimed at strengthening its sovereignty, facilitating its European integration, and reducing its vulnerability to external pressure from Russia."
