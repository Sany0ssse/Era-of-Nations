 # Monarchists AI loc
 POL_return_monarchy_desc: "A radical political movement gains traction, advocating for the abolition of the republic and the restoration of the Polish monarchy as the only legitimate and historical form of government for the nation, capable of ending partisan chaos."
 POL_union_of_real_political_desc: "The Union of Real Politics (UPR) emerges as a steadfast advocate for radical libertarianism, monarchism, and a strict, non-interventionist foreign policy, becoming the ideological core of the anti-establishment right."

 POL_rise_korwin_micke_desc: "Janusz Korwin-Mikke, a veteran of the anti-communist opposition and a provocateur, rises to prominence with his uncompromising advocacy for free markets, traditional values, and a controversial, realist foreign policy."

 POL_szlachecka_democracy_desc: "The promotion of a modernized version of the Noble's Democracy (Golden Liberty), advocating for a highly decentralized state with a powerful legislature of elected representatives and a weak executive."

 POL_eliminate_volatility_desc: "A push for constitutional reforms to create a more stable, less partisan political system, potentially through a strong non-elected executive (monarch or president) to curb the influence of short-term parliamentary majorities."

 POL_elite_update_desc: "A call for a complete overhaul of the political and media elite, whom Korwin-Mikke accuses of post-communist mentality and incompetence, to be replaced by a new class of libertarian-minded patriots."

 POL_korwin_policy_desc: "The implementation of a coherent political course combining ultra-liberal economics (tax abolition, deregulation) with staunch social conservatism and a non-interventionist, realist foreign policy."

 POL_economic_liberalism_desc: "The unwavering pursuit of a minimal state, involving the abolition of income tax, the dismantling of social welfare, and the total deregulation of the economy to achieve absolute economic freedom."

 POL_problem_migration_desc: "A firm stance against immigration, particularly from outside of Europe, framed as a threat to social cohesion, cultural identity, and the fiscal stability of the minimal state."

 POL_supporting_financial_education_desc: "A policy of introducing economics and financial literacy into the school curriculum to foster a new generation of fiscally responsible and entrepreneurially-minded citizens."

 POL_anti_bureaucracy_desc: "A systematic war on bureaucratic red tape, aiming to abolish thousands of regulations and simplify the legal system to unleash entrepreneurial energy."

 POL_fignting_inflation_desc: "A commitment to a ultra-hard currency policy, potentially including a return to the gold standard or the creation of private currencies, to eliminate inflation which is seen as a state-sponsored theft."

 POL_korvinkoin_desc: "The official state endorsement and launch of a cryptocurrency ('KorwinCoin') backed by gold or other real assets, intended to serve as a stable and reliable alternative to state-controlled fiat money."

 POL_fall_republic_desc: "The ideological conviction that the Third Polish Republic is an illegitimate and failed state that must be allowed to fall and be replaced by a new political order, be it a monarchy or a confederation."

 POL_reform_sejm_desc: "A radical reform of the parliament to drastically reduce its size, powers, and cost, transforming it into a part-time body with limited ability to interfere in the economy and lives of citizens."

 POL_protection_traditional_values_desc: "The use of state power to protect and promote traditional family structures and Catholic values, seen as a necessary counterbalance to the social permissiveness enabled by economic freedom."

 POL_conservative_authoritarianism_desc: "The advocacy for a strong, authoritarian state in the social and political sphere to enforce order and traditional morals, while maintaining a hands-off approach to the economy."

 POL_king_janusz_i_desc: "The coronation of Janusz Korwin-Mikke as King Janusz I, establishing a new constitutional monarchy with the monarch holding significant executive power to veto legislation and guide state policy."

 POL_decentralization_power_desc: "The massive devolution of power from the central government to local voivodeships and municipalities, aiming to create a decentralized, federated state."

 POL_constitutional_monarchy_desc: "The establishment of a constitutional monarchy where the King's powers are balanced by a reformed and limited parliament, adhering to a new, libertarian-conservative constitution."

 POL_restor_kingdom_of_poland_desc: "The formal proclamation of the Kingdom of Poland, ending the republican era and restoring a monarchical system rooted in Poland's historical statehood."

 POL_poland_without_eu_desc: "The immediate initiation of 'Polexit' – Poland's withdrawal from the European Union – viewed as a fundamental step towards reclaiming national sovereignty and economic freedom."

 POL_reconciliation_with_russia_desc: "A foreign policy of pragmatic reconciliation with Russia, arguing for economic cooperation and non-alignment, based on the realist principle that Poland should not be a pawn in US-Russia conflicts."
 POL_populism_of_latin_civilization_desc: "A cultural policy promoting the idea of Poland as a bulwark of Latin (Western) civilization, defined by its Roman Catholicism and Greco-Roman philosophical heritage, against both Eastern despotism and internal decadence."

 POL_restor_kingdom_of_poland_tt_desc: "The historic proclamation of the Second Kingdom of Poland is declared, formally dissolving the republic and inaugurating a new era of monarchical rule under a new dynasty or elected king."
 POL_confederation_polish_crown_desc: "Grzegorz Braun's 'Confederation of the Polish Crown' emerges as the most radical, theocratic, and anti-system faction, advocating for a Catholic fundamentalist revolution."

 POL_grzegorz_braun_desc: "Grzegorz Braun rises as a fiery, provocative leader, known for his extreme statements and direct actions, championing a program of Catholic fundamentalism and the physical removal of his political enemies."

 POL_cleanse_poland_dirt_desc: "A call for a national and spiritual purification of Poland from all perceived internal and external enemies, using any means necessary to 'save whoever can be saved'."

 POL_get_out_of_warsaw_desc: "A symbolic and literal call to move the capital away from Warsaw, which is seen as a corrupted center of post-communist and foreign influence, to a more 'Polish' city."

 POL_media_control_desc: "The complete state takeover of all media, or their forced alignment with Catholic and national values, to end the influence of 'foreign agents' and 'liberal propaganda'."

 POL_adopt_law_foreign_agents_desc: "The enactment of a stringent law requiring all organizations receiving foreign funding to register as 'foreign agents', subjecting them to scrutiny and restrictions."

 POL_separate_lobbyisys_from_media_desc: "A law to legally force a separation between media ownership and political lobbying, aiming to break up media conglomerates deemed hostile to Poland."

 POL_shoot_journalists_desc: "An extreme and literal call for the execution of journalists from major liberal media outlets like Gazeta Wyborcza and TVN, whom Braun accuses of high treason."

 POL_stop_propaganda_of_perverts_desc: "A state crackdown on any public expression or promotion of LGBT rights, branded as 'pervert propaganda', through censorship and criminal penalties."

 POL_destroy_jewish_reservations_desc: "A violently anti-Semitic policy aimed at dismantling Jewish cultural and communal institutions in Poland, which are falsely portrayed as hostile, foreign enclaves."

 POL_ban_satanic_holiday_desc: "The legal prohibition of Halloween and other cultural imports deemed 'satanic' and corrosive to traditional Polish Catholic culture."

 POL_purge_protestant_heretics_desc: "A policy of state-led discrimination against Protestant and other non-Catholic Christian denominations, viewed as heretical sects undermining Poland's religious unity."

 POL_establish_inquisition_desc: "The creation of a state body, modeled on the historical Inquisition, to root out and punish heresy, blasphemy, and opposition to Catholic doctrine."

 POL_flagellation_lgbt_activists_desc: "The public endorsement and use of corporal punishment against LGBT activists as a means of 'moral correction' and public deterrence."

 POL_crush_tribal_chauvinism_desc: "A campaign against regional identities and minority rights (e.g., Silesians), enforcing a homogenous, state-defined Polish national identity."

 POL_raids_enemies_poland_desc: "The use of state security forces to conduct raids and harass individuals and organizations officially designated as 'enemies of Poland'."

 POL_arm_country_desc: "A policy of universal firearms training and liberalization of gun laws to create an armed citizenry, ready to defend the nation and the faith."

 POL_challenge_eu_desc: "A policy of open confrontation with the European Union, rejecting its laws and authority, and preparing for a potential exit or expulsion."

 POL_second_eternal_peace_desc: "A foreign policy doctrine aiming to secure Poland's eastern borders through a grand, permanent peace treaty with Russia, even at the cost of major concessions."

 POL_szczesc_boze_desc: "A symbolic motto ('God Speed!') marking the beginning of a theocratic and national revolution, invoking divine blessing for the radical transformation of the state."

 POL_dissolve_sejm_desc: "The unilateral dissolution of the lower house of parliament (Sejm), deemed irredeemably corrupt, and its replacement by an emergency governing council."

 POL_dissolve_senate_desc: "The abolition of the Senate, the upper house of parliament, as a redundant and obstructive institution in the new, centralized state model."

 POL_stop_receiving_foreign_funding_desc: "A law criminalizing the acceptance of foreign funding for Polish NGOs, political parties, and media, accusing them of being instruments of foreign influence."

 POL_equal_access_to_market_desc: "An economic policy aimed at breaking up monopolies and creating a level playing field for small and medium-sized Polish businesses."

 POL_healthcare_reform_desc: "A complete overhaul of the healthcare system, though its specifics are vague beyond purging it of alleged corruption and inefficiency."

 POL_hang_president_of_health_fund_desc: "A literal call for the execution by hanging of the head of the National Health Fund, held responsible for the system's failures."

 POL_solving_electricity_problems_desc: "A state-led program to achieve energy independence, prioritizing coal and nuclear power while rejecting EU climate policies."

 POL_allow_nuclear_energy_desc: "The launch of a national nuclear energy program with significant state subsidies, framed as a matter of national security and independence."

 POL_acquier_nuclear_weapons_desc: "A top-priority national project to acquire nuclear weapons by any means necessary, to guarantee Poland's ultimate security deterrent."

 POL_destroy_israel_desc: "The adoption of a genocidal foreign policy objective calling for the destruction of the State of Israel, rooted in radical anti-Semitic conspiracy theories."

 POL_catholic_traditionalism_desc: "The enforcement of Traditionalist Catholicism, rejecting the reforms of the Second Vatican Council, as the sole permitted religious practice in public life."

 POL_celebrating_latin_civilization_desc: "The state promotion of Poland's Latin and Roman Catholic heritage as the supreme cultural value, against both Eastern Orthodoxy and Western secularism."

 POL_purge_polish_bishops_conference_desc: "A state-backed purge of the mainstream Polish Episcopate, which is deemed too liberal and conciliatory, to be replaced with traditionalist, hardline clergy."

 POL_only_eternal_king_of_poland_desc: "The official state doctrine recognizing Jesus Christ as the only true and eternal King of Poland, subordinating all temporal power to divine authority."

 POL_saint_regent_braun_desc: "Grzegorz Braun declaring himself the 'Holy Regent' of Poland, ruling in the name of Christ the King and possessing absolute theocratic authority."

 POL_overthrow_rzeczpospolita_desc: "The final, revolutionary act of overthrowing the Polish Republic (Rzeczpospolita) and all its institutions, deemed illegitimate and godless."

 POL_fourth_kingdom_of_poland_desc: "The proclamation of the Fourth Kingdom of Poland, a theocratic state founded on Catholic fundamentalist law and ruled by a Regent in the name of Christ the King."

 POL_together_with_russia_against_usa_desc: "A full strategic realignment with Russia, forming an alliance based on shared 'traditional values' and common opposition to American global hegemony and liberal democracy."

 POL_conquest_baltic_sea_desc: "A grand strategic objective to establish absolute Polish hegemony over the Baltic Sea, turning it into a 'Mare Nostrum' to secure trade routes and project power towards Scandinavia and Germany."

 POL_control_danish_straits_desc: "The ambition to exert direct or indirect military control over the Danish straits (Øresund and the Belts), a chokepoint that would grant Poland decisive leverage over all naval traffic between the Baltic and North Seas."

 POL_force_sweden_into_union_desc: "A bold plan to subjugate the Kingdom of Sweden through military force and diplomatic pressure, forcing it into a personal or political union under the Polish Crown to neutralize a historic rival."

 POL_pressure_visegrad_desc: "The application of intense diplomatic and economic pressure on the Visegrad Group neighbors (Czech Republic, Slovakia, Hungary) to bend them to Warsaw's will and transform the alliance into a Polish-led bloc."

 POL_polish_bohemian_union_desc: "The pursuit of a political union with the Czech lands (Bohemia), either through dynastic means or coercion, to unite the West Slavic peoples under Polish leadership."

 POL_return_moravia_desc: "The revival of historical territorial claims on the region of Moravia, aiming to detach it from the Czech state and integrate it directly into the Polish realm."

 POL_force_austria_into_union_desc: "An audacious scheme to compel the Republic of Austria, a remnant of the old Habsburg empire, into a subordinate union with Poland, redrawing the map of Central Europe."
 POL_polish_reconquista_desc: "A national mission framed as a 'reconquest' of the historical eastern territories of the Polish-Lithuanian Commonwealth (Kresy), lost to the Soviet Union after World War II."

 POL_alliance_intermarium_desc: "The formal establishment of a military and political alliance—'Międzymorze' (Between the Seas)—stretching from the Baltic to the Black Sea, with Poland as its undisputed leader and hegemon."

 POL_lavrov_rotfeld_pact_desc: "A hypothetical, controversial pact with Russia (named after foreign ministers) to formally divide spheres of influence in Eastern Europe, likely at the expense of Ukraine and Belarus."

 POL_belarusian_consensus_desc: "A policy aimed at achieving a political settlement in Belarus, either through installing a loyal puppet government or orchestrating its full annexation into the Polish sphere."

 POL_assimilation_eastern_lands_desc: "A systematic policy to culturally and linguistically assimilate the populations of newly acquired eastern territories, ensuring their permanent integration into the Polish nation."

 POL_polinization_new_territories_desc: "The active promotion of Polish settlement and the suppression of local Ukrainian, Belarusian, and Lithuanian cultures in the annexed lands to shift the demographic balance."

 POL_partition_ukrain_desc: "The execution of a plan to dismember the Ukrainian state, claiming its western regions (Galicia, Volhynia) for Poland, potentially in coordination with other regional powers."

 POL_second_union_lublin_desc: "The proclamation of a new political union with Lithuania (and potentially other nations), modeled on the historic 1569 Union of Lublin, but with Poland holding unequivocal dominance."

 POL_vassalize_courland_desc: "The reduction of Latvia (historically encompassing the Duchy of Courland) to a vassal state, securing its ports and resources for the Polish-led bloc."

 POL_invasion_baltics_desc: "A military operation to invade and occupy the Baltic states (Estonia and Latvia), viewed as a necessary step to secure the Baltic flank and eliminate potential adversaries."

 POL_restor_pol_hin_union_desc: "The revival of the historic Polish-Hungarian union, bringing Hungary firmly into Warsaw's orbit as a junior partner in a new Central European constellation."

 POL_conquest_slovakia_desc: "The use of military force to conquer Slovakia, justified by historical claims or the pretext of 'protecting' the region, and integrating it into the expanding Polish state."

 POL_claims_to_croatia_desc: "The assertion of distant historical and dynastic claims to Croatia, aiming to bring this Adriatic nation under Polish influence or control."

 POL_claims_to_slovenia_desc: "The advancement of tenuous historical claims on Slovenia, seeking to extend Polish reach to the Alps and the northernmost part of the Balkans."

 POL_polish_latin_union_desc: "An ideological and political project to unite predominantly Catholic (Latin-rite) nations of Central Europe under Polish leadership, as a bulwark against both Eastern Orthodoxy and Western secularism."

 POL_to_terrify_balkans_desc: "A policy of calculated military demonstrations and political coercion to intimidate the Balkan states, ensuring their compliance with Polish strategic interests in the region."

 POL_polish_bulgarian_pact_desc: "The forging of a strategic pact with Bulgaria, driving a wedge in the Orthodox Slavic world and gaining a crucial ally with access to the Aegean Sea."

 POL_partition_romania_desc: "A plan for the territorial dismemberment of Romania, likely in coordination with other powers like Hungary and Bulgaria, to claim the region of Bukovina and weaken a regional competitor."

 POL_anti_turkish_coalition_desc: "The formation of a broad coalition of European and regional powers with the explicit goal of containing and rolling back Turkish influence in the Balkans and the Black Sea region."

 POL_polish_greek_treaty_desc: "The signing of a strategic treaty with Greece, uniting two traditional powers against common perceived threats and securing a reliable partner in the Eastern Mediterranean."

 POL_connect_cyprus_desc: "An ambitious but vague geopolitical concept to bring Cyprus into the Polish sphere of influence, projecting power deep into the Mediterranean."
 POL_subordination_of_moldova_desc: "The reduction of Moldova to a Polish client state, cutting it off from Romanian influence and securing a foothold between Ukraine and the Balkans."

 POL_transnistrian_issue_desc: "The exploitation of the frozen conflict in Transnistria to destabilize Moldova and create a permanent lever of influence against both Moldova and Ukraine."

 POL_avenge_molotov_ribbentrop_desc: "A foreign policy doctrine driven by historical grievance, seeking to overturn the geopolitical order established by the Molotov-Ribbentrop Pact through force and revision of borders."



