 #INTERMARIUM EVENTS
 poland_intermarium.4.t: "Poland proclaimed the creation of the Intermarium"
 poland_intermarium.4.d: "Today, the Polish government announced the proclamation of Intermarium. This project has long been the dream of the Polish Nation and the Greatness of the Polish State. The successful Foreign Policy of the Polish Republic has long hinted at the Polish government's goal of creating Intermarium, and today they finally announced the completion of preparations for this long-held dream."
 poland_intermarium.4.a: "Wtf?"
 poland_intermarium.5.t: "Poland proclaimed the creation of the Intermarium Confederation"
 poland_intermarium.5.d: "Today, the Polish government announced the proclamation of Intermarium within the Confederation. This project has long been the dream of the Polish Nation and the Greatness of the Polish State. The successful Foreign Policy of the Polish Republic has long hinted at the Polish government's goal of creating Intermarium, and today they finally announced the completion of preparations for this long-held dream."
 poland_intermarium.5.a: "Wtf?"
 poland_intermarium.6.t: "Poland launched the \"Prometheus\" Plan"
 poland_intermarium.6.d: "Prometheism is a political concept and movement aimed at liberating non-Russian peoples from the rule of the Russian Empire, and later the Soviet Union, with the ultimate goal of facilitating the disintegration of these multinational states. The main goals of this geopolitical project were formulated by Józef Piłsudski as early as 1904 in a memorandum to the Japanese government; the concept itself developed as a collaboration between emigrant national movements and the state structures of the Second Polish Republic.\nAfter the proclamation of Intermarium, Poland decided to declare a full-scale war on Russia, where Prometheism is the main goal and military doctrine of the Polish side."
 poland_intermarium.6.a: "What happens next?"

