 poland_sejm.1.t: "The Sejm demands an increase in Social Spending"
 poland_sejm.1.d: "The Sejm session made a collective decision to increase social spending. The Sejm believes that Polish citizens deserve a better life than they have now. Will we accept their demands?"
 poland_sejm.1.a: "Accept the demands of the Sejm"
 poland_sejm.1.b: "Reject the demands of the Sejm"
 poland_sejm.1.c: "Use a Veto"
 poland_sejm.2.t: "The Sejm demands an increase in Health Spending"
 poland_sejm.2.d: "The Sejm session made a collective decision to increase health spending. The Sejm believes that the state should take better care of the health of Polish citizens. Will we accept their demands?"
 poland_sejm.3.t: "The Sejm demands an increase in Education Spending"
 poland_sejm.3.d: "The Sejm session made a collective decision to increase education spending. The Sejm believes that education should be more accessible to Polish citizens. In their opinion, this will increase the number of professional personnel and reduce unemployment. Will we accept their demands?"
 poland_sejm.4.t: "The Sejm demands an decrease in Police Spending"
 poland_sejm.4.d: "The Sejm session made a collective decision to decrease police spending. The Sejm believes that strong police control is a threat to democracy and freedoms of Polish citizens. Will we accept their demands?"
 poland_sejm.5.t: "The Sejm demands an decrease in Military Spending"
 poland_sejm.5.d: "The Sejm session made a collective decision to decrease military spending. The Sejm believes that our country spends too much money on defense. The Sejm condemns the militarization of Poland and demands that spending be reduced. Will we accept their demands?"
 poland_sejm.6.t: "The Sejm demands an decrease in Population Tax Rate"
 poland_sejm.6.d: "The Sejm session made a collective decision to decrease population tax rate. The Sejm believes that Polish citizens spend too much money on taxes, which reduces the standard of living. Will we accept their demands?"
 poland_sejm.7.t: "The Sejm demands an decrease in Corporate Tax Rate"
 poland_sejm.7.d: "The Sejm session made a collective decision to decrease corporate tax rate.  The Sejm believes that high corporate taxes hinder business development and have a negative impact on the economy. Will we accept their demands?"
 poland_tax.1.t: "Change Population Tax Rate"
 poland_tax.1.d: "Would you like to submit a proposal to the Sejm to increase the tax rate for the population? We will be able to resubmit such a proposal only after a month"
 poland_tax.1.a: "Increase Population Tax Rate"
 poland_tax.1.b: "Decrease Population Tax Rate"
 poland_tax.2.t: "Increase Population Tax Rate"
 poland_tax.2.desc: "Do you really want to raise the tax rate on the population? It will increase our tax revenue, but it will increase social and health care costs"
 poland_tax.2.a: "Increase the tax rate by 5"
 poland_tax.2.b: "Increase the tax rate by 3"
 poland_tax.2.c: "Increase the tax rate by 1"
 poland_tax.2.d: "Return to previous page"
 poland_tax.3.t: "Decrease Population Tax Rate"
 poland_tax.3.desc: "Do you really want to reduce the tax rate on the population? It will decrease our tax revenue, but it will decrease social and health care costs"
 poland_tax.3.a: "Decrease the tax rate by 5"
 poland_tax.3.b: "Decrease the tax rate by 3"
 poland_tax.3.c: "Decrease the tax rate by 1"
 poland_tax.4.t: "Change Corporate Tax Rate"
 poland_tax.4.d: "Would you like to submit a proposal to the Sejm to increase the corporate tax rate? We will be able to resubmit such a proposal only after a month"
 poland_tax.4.a: "Increase Corporate Tax Rate"
 poland_tax.4.b: "Decrease Corporate Tax Rate"
 poland_tax.5.t: "Increase Corporate Tax Rate"
 poland_tax.5.desc: "Do you really want to increase the Corporate Tax Rate? It will increase our tax revenue, but it will also decrease our productivity and the number of factories"
 poland_tax.6.t: "Decrease Corporate Tax Rate"
 poland_tax.6.desc: "Do you really want to decrease the Corporate Tax Rate? It will decrease our tax revenue, but it will also increase our productivity and the number of factories"
 poland_tax.7.t: "Investments in electricity"
 poland_tax.7.d: "As part of the annual economic plan, the Seimas raised the issue of investments in electricity. The question is, what kind of power plants should we build?"
 poland_tax.7.a: "Renewable Energy Generators"
 poland_tax.7.b: "Fossil Fuel Generators"
 poland_sejm.8.t: "Vote of No Confidence"
 poland_sejm.8.d: "My President, the Sejm of the Republic of Poland, clearly dissatisfied with our policy, today passed a Vote of No Confidence against us. You must leave your presidential post, and the country will hold early elections."
 poland_sejm.8.a: "O KURWA!"

