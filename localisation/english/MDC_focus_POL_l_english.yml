 POL_Sejm_category: "Sejm Rzeczypospolitej Polskiej"
 POL_Sejm_category_desc: "§tSejm Rzeczypospolitej Polskiej§! is the lower house of the National Assembly of the Republic of Poland, representing the legislative power of the country. \n\nPeriodically, the Sejm will propose changes to some laws, whether we like it or not. Refusal to accept lowers the §3Sejm's Approval§!, while acceptance §Gincreases approval§! accordingly, once a year we get the right of §3VETO§!, which we can use and refuse the Sejm's demand §3without consequences§!. \n\nIf the Sejm's approval falls below §R5%§!, the Sejm will put forward a §RVote of No Confidence§! to us."
