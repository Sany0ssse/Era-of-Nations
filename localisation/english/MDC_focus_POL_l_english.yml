 ##########AI desc###########
 POL_commi_triumph_desc: "The Communist Party seizes decisive control over the Polish state, marking a definitive end to the capitalist experiment and the beginning of a new era of proletarian dictatorship guided by Marxist-Leninist principles."
 POL_legacy_past_commi_desc: "The new government openly embraces its ideological lineage, rehabilitating the historical role of the Polish United Workers' Party (PZPR) and integrating its symbols and veterans into the fabric of the new socialist state."
 POL_blow_capitalism_desc: "A decisive and irreversible strike against the foundations of the capitalist system in Poland, dismantling the market economy and initiating the expropriation of bourgeois property in the name of the working class."
 POL_restor_old_order_desc: "The systematic re-establishment of the political, economic, and security structures of the former Polish People's Republic, effectively rolling back the post-1989 reforms and restoring the pre-1989 socialist order."
 POL_proletariat_power_desc: "The formal establishment of a dictatorship of the proletariat, where all state power is wielded by and for the working class, suppressing the political rights of the former bourgeoisie and capitalist elements."
 POL_antirevisionist_leninism_desc: "A purge of 'revisionist' and reformist tendencies within the party, enforcing a strict, orthodox interpretation of Leninism and rejecting any deviation from its core revolutionary tenets."
 POL_fight_luxemburgism_desc: "An ideological campaign against the theories of Rosa Luxemburg, condemning her criticism of Leninist vanguard party principles as a dangerous deviation from the correct revolutionary path."
 POL_return_ppr_desc: "The formal abolition of the Third Polish Republic and the proclamation of the restoration of the Polish People's Republic (Polska Rzeczpospolita Ludowa), symbolizing the complete legal and political return to socialism."
 POL_nationalization_industry_desc: "The wholesale seizure of all major industries, banks, and large commercial enterprises without compensation, placing them under state control to serve the needs of the planned socialist economy."
 POL_nationalization_resources_desc: "The state reclaims absolute ownership over all natural resources, including land, minerals, and energy reserves, declaring them the collective property of the people."
 POL_introduce_property_verification_desc: "The establishment of special commissions to investigate the origins of all large private properties acquired after 1989, with the aim of confiscating assets deemed 'illegally acquired' or 'ill-gotten'."
 POL_vat_limitation_desc: "The abolition or radical reduction of the Value-Added Tax (VAT) on essential goods, presented as a measure to relieve the economic burden on the working masses."
 POL_progressive_taxation_desc: "The implementation of an extremely aggressive progressive tax system designed to liquidate large private capital and fund the expansion of the socialist welfare state."
 POL_accessibility_program_desc: "A massive state program to provide free and universal access to basic necessities, housing, healthcare, and education, fulfilling the core promise of a socialist society."
 POL_praise_stalin_kim_desc: "The state-sponsored promotion of a cult of personality around hardline communist leaders like Joseph Stalin and Kim Jong Il, celebrating them as exemplary defenders of socialism against imperialism."
 POL_ban_lgbp_commi_desc: "The prohibition of same-sex partnerships and the promotion of a conservative, traditional family model, framed as a necessary measure to protect socialist morality from 'bourgeois decadence'."
 POL_resume_security_service_desc: "The reformation and empowerment of the political police (modeled on the former SB) to identify, monitor, and neutralize 'class enemies' and 'counter-revolutionary elements' within the country."
 POL_expansion_social_rights_desc: "A significant expansion of trade union rights, workers' self-management in nationalized enterprises, and state-guaranteed employment, creating a comprehensive social safety net."
 POL_catholic_and_communism_desc: "An attempt to forge a pragmatic, state-controlled alliance with the Catholic Church, seeking to co-opt its social influence while subordinating it to the overarching goals of the socialist state."
 POL_reconstruction_inr_desc: "The dismantling of the Institute of National Remembrance (IPN) and its replacement with a new institution tasked with promoting a Marxist-Leninist interpretation of Polish history."
 POL_turn_from_eu_block_desc: "A complete geopolitical break with the European Union, denounced as a 'capitalist club,' culminating in Poland's withdrawal and the re-establishment of full national sovereignty from Brussels."
 POL_condemt_american_imperialism_desc: "The adoption of a fiercely anti-American foreign policy, identifying the United States as the primary source of global imperialism and the main enemy of the socialist world."
 POL_dismantling_nato_bases_desc: "The immediate expulsion of all NATO forces from Polish territory and the termination of all military agreements with the alliance, declared a necessary step for national liberation."
 POL_support_serbia_desc: "Forging a strong strategic alliance with Serbia as a key partner in the Balkans, united by shared opposition to NATO and Western hegemony."
 POL_balkan_revolution_desc: "Active support for communist and anti-Western movements across the Balkans, aiming to spark a 'red wave' that would overthrow pro-capitalist governments in the region."
 POL_destroy_bondsteel_desc: "A foreign policy objective demanding the dismantling of the massive US military base Camp Bondsteel in Kosovo, seen as a primary symbol of American aggression in the Balkans."
 POL_support_dpr_desc: "Official diplomatic recognition and military support for the breakaway republic of Transnistria (DPR), challenging Moldovan sovereignty and expanding Russia's sphere of influence."
 POL_return_union_with_russia_desc: "The signing of a new union treaty with the Russian Federation, recreating a military and economic bloc reminiscent of the Soviet era to jointly confront the West."
 POL_slam_door_on_west_desc: "A final, symbolic and practical act of breaking all political and economic ties with Western institutions, fully committing Poland to the anti-imperialist, socialist camp."
 POL_rapprochement_with_China_desc: "A strategic pivot towards the People's Republic of China, seeking economic investment, technological cooperation, and a powerful ally in the new multipolar world order."
 POL_indochina_conference_desc: "Hosting a major international conference of communist and anti-imperialist movements from Vietnam, Laos, and Cambodia to coordinate strategy and show solidarity."
 POL_establish_connections_cuba_desc: "Re-establishing and strengthening fraternal ties with Cuba, celebrating it as a beacon of socialist resistance and a model for defying American power."
 POL_contact_dprk_desc: "Establishing direct diplomatic and military contacts with the Democratic People's Republic of Korea (North Korea), united by a common ideology of Juche and opposition to the US."
 POL_proletarians_all_countries_desc: "A call for international proletarian revolution, positioning Poland as a vanguard in the global struggle against capitalism and urging workers of all nations to unite and overthrow their bourgeois governments."
 POL_ghost_haunting_europe_desc: "A declaration that the specter of communism once again haunts Europe, signaling Poland's intent to actively support and export revolution to its neighboring countries."
 POL_visegrad_revolution_desc: "A coordinated campaign to support communist parties and movements in the Visegrad Group countries (Czech Republic, Slovakia, Hungary), aiming to create a united socialist bloc in Central Europe."
 POL_return_wp_desc: "The ambitious goal of recreating a modern equivalent of the Warsaw Pact, a military alliance of socialist states led by Russia and aimed directly at countering NATO."
 POL_scandinacian_revolution_desc: "Extending ideological support and subversive activities to far-left movements in Scandinavia, with the long-term aim of overthrowing the social-democratic governments and establishing revolutionary socialist states."

