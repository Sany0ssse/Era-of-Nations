 #SLD
 POL_end_of_kwasniewski_era: "End of Kwasnewski Era"
 POL_end_of_kwasniewski_era_desc: "The popular and pragmatic presidency of Aleksander Kwasniewski, a figure who guided Poland's early post-communist development and its entry into NATO and the EU, is coming to an end. The nation stands at a crossroads, preparing for a new political era and leadership."
 POL_working_on_election_program: "Working on Election Program"
 POL_working_on_election_program_desc: "Party strategists and politicians are burning the midnight oil, crafting promises and policies designed to win the hearts and votes of the Polish electorate. The future direction of the country will be decided on these pages."
 POL_unite_with_PPS: "Unite with PPS"
 POL_unite_with_PPS_desc: "A potential merger with the historical Polish Socialist Party (PPS) could create a powerful left-wing bloc, uniting different traditions of the Left and appealing to voters concerned with social justice and workers' rights."
 POL_coalition_with_unia_pracy: "Coalition with Unia Pracy"
 POL_coalition_with_unia_pracy_desc: "Forming a coalition with the left-wing 'Unia Pracy' (Labour Union) would strengthen the social-democratic camp, pooling resources and voter bases to present a united front against liberal and conservative opponents."
 POL_election_2000: "Elections 2000"
 POL_election_2000_desc: "The presidential election of 2000 is a pivotal moment, testing the political landscape a decade after the fall of communism. Will the left continue its hold on the presidency, or will a new force emerge?"
 POL_lewica: "Lewica"
 POL_lewica_desc: "The 'Lewica' (The Left) represents the coalition or movement seeking to unite various post-communist and social-democratic parties under a common banner to secure political relevance and implement a social welfare agenda."
 POL_kwasnewsku_second_tern: "Kwasniewski's Second Term"
 POL_kwasnewsku_second_tern_desc: "Having secured a second term in office, President Kwasniewski continues his centrist and pro-European course, providing a stabilizing force in Polish politics while his party, the SLD, faces growing challenges."
 POL_pzpr_legacy: "The Legacy of the PZPR"
 POL_pzpr_legacy_desc: "The shadow of the former ruling Polish United Workers' Party (PZPR) looms large. Dealing with its legacy—from the personnel in state institutions to its ideological footprint—remains a deeply divisive issue in Polish society."
 POL_rywingate: "Rywingate"
 POL_rywingate_desc: "A major political scandal erupts, revealing alleged attempts by a film producer to influence media legislation and government composition for a business group. The affair shakes public trust in the political class."
 POL_balcerowicz_plan: "Balcerowicz Plan"
 POL_balcerowicz_plan_desc: "The radical and controversial 'shock therapy' economic reform program that rapidly transitioned Poland from a planned to a market economy. It tamed hyperinflation but came at a high social cost, creating deep political divisions."
 POL_kuron_plan: "Kuron's Plan"
 POL_kuron_plan_desc: "An alternative, more socially-conscious economic proposal championed by Jacek Kuron, focusing on mitigating the transition's harsh effects through support for workers' self-management and social safety nets."
 POL_workers_rights: "Workers Rights"
 POL_workers_rights_desc: "A commitment to strengthening the position of labor in the new capitalist reality, encompassing the protection of trade unions, collective bargaining rights, and safe working conditions."
 POL_social_equality: "Social Equality"
 POL_social_equality_desc: "Policies aimed at reducing the growing gap between rich and poor, ensuring access to healthcare, education, and pensions for all citizens, and fighting social exclusion."
 POL_fight_unemployment: "Fight against unemployment"
 POL_fight_unemployment_desc: "With the economic transition causing massive job losses, the government prioritizes programs to combat unemployment through public works, retraining, and incentives for job creation."
 POL_fight_corruption_desc: "In response to public outrage over scandals, the government launches initiatives to increase transparency, strengthen anti-corruption bodies, and restore faith in public institutions. The battle is arduous and its success uncertain."
 POL_rule_of_pluralism: "Rule of Pluralism"
 POL_rule_of_pluralism_desc: "The fundamental commitment to a political system where multiple parties, diverse opinions, and a free press can flourish, ensuring that no single group can monopolize power."
 POL_democratic_balance: "Democratic Balance"
 POL_democratic_balance_desc: "The ongoing effort to maintain stable governance through a careful balance of power between the presidency, government, and parliament, a delicate task in a young democracy."
 POL_liberal_market: "Liberal Market"
 POL_liberal_market_desc: "The pursuit of a free-market economic model with minimal state intervention, low regulations, and strong protection of private property, seen as the engine of growth and prosperity."
 POL_privatization: "Privatization"
 POL_privatization_desc: "The vast process of transferring state-owned enterprises into private hands, intended to increase efficiency and attract capital, but often criticized for its pace, fairness, and the emergence of 'political capitalism'."
 POL_decrease_corp_tax: "Decrease Corporate Tax"
 POL_decrease_corp_tax_desc: "A policy to stimulate economic growth and attract foreign investment by lowering the corporate tax burden, a cornerstone of liberal economic platforms."
 POL_hausner_plan: "Hausner Plan"
 POL_hausner_plan_desc: "A comprehensive set of fiscal and social reforms introduced by Finance Minister Jerzy Hausner, aiming to stabilize public finances while restructuring the costly social security and pension systems."
 POL_zbigenev_and_vogel_case: "Zbigenev and Vogel Case"
 POL_orlen_case: "Orlen Case"
 POL_orlen_case_desc: "A complex affair surrounding the state-owned oil company Orlen, involving allegations of politically-motivated management changes, secret service operations, and questionable financial dealings at the highest levels of power."
 POL_fight_corruption: "Fight Against Corruption"
 POL_constitutuin_1997: "Constitution 1997"
 POL_constitutuin_1997_desc: "The adoption of Poland's new supreme law, a milestone that formally established the country as a democratic, law-governed state, defining the structure of government and the rights of citizens."
 POL_cia_black_sites: "CIA Black Sites"
 POL_cia_black_sites_desc: "Allegations surface that Poland hosted secret CIA prisons for 'high-value detainees' in the War on Terror. The scandal strains relations with allies and raises serious questions about the rule of law and sovereignty."
 POL_eurointegration: "European integration"
 POL_eurointegration_desc: "The strategic and overarching national goal of full integration with European structures, primarily the European Union, requiring vast legal, economic, and political reforms to meet membership criteria."
 POL_regional_cooperation: "Regional Cooperation"
 POL_regional_cooperation_desc: "Fostering strong political, economic, and cultural ties with neighboring Central European states, such as the Visegrad Group, to amplify the region's voice in European and global affairs."
 POL_increase_influence_area: "Increase Influence Area"
 POL_increase_influence_area_desc: "A foreign policy ambition to extend Poland's diplomatic and economic influence beyond its immediate neighborhood, positioning itself as a significant player in Eastern Europe and a reliable partner in NATO."
 POL_enter_eu_house: "Enter the European House"
 POL_enter_eu_house_desc: "A metaphorical expression of the ultimate success of Poland's foreign policy: securing membership in the European Union, finally anchoring the nation in the community of Western democracies after decades of separation."
 POL_eurointegration_tt: "[POL.GetNameWithFlag] to become §3EU Candidate Member§!"
 POL_rywingate_tt: "The investigation chain on §2Rywin Affair§! will begin, success will depend on our level of §RCorruption§!"
 POL_hausner_plan_tt: "§4Jerzy Hausner§! proposes a plan to cut public §Yspending§! in order to save the budget, but his plan is not approved by the §2Sejm§!"
 POL_zbigenev_and_vogel_case_tt: "The case of pardoning former §tCommunist party§! members §4Aleksander Kwasniewski§!"
 POL_zbigenev_and_vogel_case_desc: "A corruption scandal implicating high-profile politicians and businessmen, exposing the murky ties between the state, private interests, and criminal underworld in the early years of Poland's market economy."
