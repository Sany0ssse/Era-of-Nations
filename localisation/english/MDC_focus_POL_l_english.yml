 poland_economy.1.t: "[POL.GetName] offers deal"
 poland_economy.1.d: "Polish company Grupa Azoty offers us to conclude a deal on the sale of Polish fertilizers. We will give part of the budget for export every week, in return receiving a good boost for our Agriculture"
 poland_economy.1.a: "Deal"
 poland_economy.1.b: "Not this time"
 poland_economy.2.t: "[FROM.GetName] agreed to the deal"
 poland_economy.2.d: "[FROM.GetName] has agreed to a deal to export our fertilizers from the Grupa Azoty. This will provide a good weekly income to our economy and improve the company's position"
 poland_economy.2.a: "Our budget will be happy about this"
 poland_economy.3.t: "[FROM.GetName] has rejected the deal"
 poland_economy.3.d: "[FROM.GetName] has refused to accept the deal to export our fertilizers. We hope that next time they will be more accommodating"
 poland_economy.3.a: "Maybe next time"
 poland_economy.4.t: "Orlengate"
 poland_economy.4.d: "Today, on the eve of the Orlen board meeting, the company's CEO Andrzej Modrzejewski was arrested. Two hours before the meeting, Modrzejewski was released and the board of directors removed him from his position.\n Former Finance Minister Wiesław Kaczmarek told Gazeta Wyborcza that the real purpose of the arrest was to provoke Modrzejewski's dismissal and disrupt the signing of a $14 billion oil supply contract. According to the interview, the decision to arrest Modrzejewski was made during an informal meeting of the prime minister's cabinet with Leszek Miller, Justice Minister Barbara Piwnikova and the head of the Public Order Protection Office Zbigniew Siemiątkowski. Kaczmarek, who was also present at the meeting, revealed its purpose to avoid possible accusations of misconduct in the future when he served as finance minister"
 poland_economy.4.a: "There is no need for an investigation"
 poland_economy.4.b: "An investigation needs to be conducted"
 poland_economy.5.t: "Polish company is going to buy our oil companies"
 poland_economy.5.d: "Polish Oil Company Orlen is going to buy several of our oil refineries. In exchange, they offer to open a branch of Orlen in our country. Sounds like a good deal!"
 poland_economy.5.a: "Deal"
 poland_economy.5.b: "Nah"
 poland_economy.6.t: "[FROM.GetName] agreed to the deal"
 poland_economy.6.d: "[FROM.GetName] agreed to the deal and sold its oil refineries to our company Orlen. The company's foreign expansion is in full swing!"
 poland_economy.6.a: "Very Nice!"
 poland_economy.7.t: "[FROM.GetName] refused to the deal"
 poland_economy.7.d: "[FROM.GetName] refused the deal. Our company Orlen could not buy their oil refineries, but this is no reason to despair, we need to try next time"
 poland_economy.7.a: "We will get ours!"
 poland_economy.8.t: "Poland Asks for Investment in Agriculture"
 poland_economy.8.d: "In the context of the fight against the agricultural crisis, the Polish authorities have approached us with a request for investments in Agriculture. Will we help them?"
 poland_economy.8.a: "Help them"
 poland_economy.8.b: "It's not in our interests"
 poland_economy.9.t: "[FROM.GetName] has agreed to invest in agriculture."
 poland_economy.9.d: "[FROM.GetName] has agreed to invest in agriculture. This will bring us closer to solving the crisis and will further give a good boost to our economy"
 poland_economy.9.a: "Nice"
 poland_economy.10.t: "[FROM.GetName] has refused to invest in agriculture."
 poland_economy.10.d: "[FROM.GetName] has refused to invest in agriculture. Looks like we'll have to look for another investor, which is a shame."
 poland_economy.10.a: "Okay..."
 poland_economy.11.t: "Poland asks for investments in metallurgy"
 poland_economy.11.d: "Poland has approached us with a commercial proposal. They are asking for our investments in Polish metallurgy."
 poland_economy.11.a: "Deal"
 poland_economy.11.b: "Not this time"
 poland_economy.12.t: "[FROM.GetName] agreed to invest in our metallurgy"
 poland_economy.12.d: "[FROM.GetName] agreed to invest in our metallurgy. This will give us a good boost for our metallurgy and industry as a whole."
 poland_economy.12.a: "Very Good"
 poland_economy.13.t: "[FROM.GetName] refused to invest in our metallurgy"
 poland_economy.13.d: "[FROM.GetName] refused to invest in our metallurgy. It's very sad, but it looks like we'll have to look for other investors."
 poland_economy.13.a: "Kurwa"
 poland_economy.14.t: "Poland wants to buy our mines"
 poland_economy.14.d: "The Polish company KGHM wants to buy our mines. Of course they are ready to pay for it, are we ready to make this deal?"
 poland_economy.14.a: "Deal"
 poland_economy.14.b: "We are not ready to sell them our mines"
 poland_economy.15.t: "[FROM.GetName] agreed to sell us the mines"
 poland_economy.15.d: "[FROM.GetName] agreed to sell us the mines. Now our company will be able to extract resources from their mines, this will definitely benefit our economy."
 poland_economy.15.a: "Very Nice"
 poland_economy.16.t: "[FROM.GetName] refused to sell us the mines"
 poland_economy.16.d: "[FROM.GetName] refused to sell us the mines. They claim that this deal is contrary to their national interests and is not beneficial for them."
 poland_economy.16.a: "Kurwa"
 poland_economy.19.t: "Poland asks us for investments in Nuclear Energy"
 poland_economy.19.d: "Poland asks us for investments in Nuclear Energy. Poland has long been interested in building its own Nuclear Reactor and is currently looking for an investor. They have chosen us, should we help them build a Nuclear Reactor?"
 poland_economy.19.a: "Of course, we will become an investor"
 poland_economy.19.b: "It is not in our interests"
 poland_economy.20.t: "[FROM.GetName] agreed to become an investor"
 poland_economy.20.d: "[FROM.GetName] agreed to become an investor. Their company has already agreed to invest in the construction of a nuclear reactor, of course we will not remain in debt to them and will pay for the construction of the reactor."
 poland_economy.20.a: "WE WILL HAVE A REACTOR!"
 poland_economy.21.t: "[FROM.GetName] refused to become an investor"
 poland_economy.21.d: "[FROM.GetName] refused to become an investor. They said it was not in their national interest. Apparently we'll have to get our own Nuclear Reactors."
 poland_economy.21.a: "Oh well, we can handle it ourselves."
 poland_economy.22.t: "Investor's choice"
 poland_economy.22.d: "After many years, we finally decided to acquire Nuclear Power, which will obviously solve our problem with Energy. But here is the question, to whom exactly should we turn with this request? Who will be our investor?"
 poland_economy.22.a: "Rosatom is a completely reliable option"
 poland_economy.22.b: "Westinghouse Electric will be a good investor"
 poland_economy.23.t: "Poland offers investments"
 poland_economy.23.d: "Polish company PGE wants to invest in us and build us a Nuclear reactor. This is a very good offer from their side, Nuclear Energy will not hinder our economy"
 poland_economy.23.a: "Of course we will agree"
 poland_economy.23.b: "We are self-sufficient to do it ourselves"
 poland_economy.24.t: "Lithuania agreed to build a reactor"
 poland_economy.24.d: "Lithuania has agreed to host a branch of our company PGE, which is going to build a Nuclear Reactor in Lithuania. Great deal."
 poland_economy.24.a: "Nuclear Lithuania?"
 poland_economy.25.t: "Lithuania refused to build a reactor"
 poland_economy.25.d: "Lithuania refused to build the reactor, as well as to accept a branch of our company PGE. Well, at least we will save our finances"
 poland_economy.25.a: "Oh well"
 


