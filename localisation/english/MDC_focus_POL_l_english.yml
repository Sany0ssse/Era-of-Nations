 #Monarchists Events
 poland_monarch.1.t: "Korwin Takes the Power"
 poland_monarch.1.d: "In the recent elections, the party of Janusz Korwin-Mikke won a landslide victory, a great event for the Polish Royalist Movement, since Korwin had already pledged his intention to restore the regime of the Kingdom of Poland, which existed from the beginning of Polish history until the second partition of the Polish-Lithuanian Commonwealth between Prussia, the Austrian Empire, and the Russian Empire."
 poland_monarch.1.a: "Boże Chroń Króla!"
 poland_monarch.2.t: "The problem of migration in Poland"
 poland_monarch.2.d: "Recently, cases of illegal migration have become more frequent. The main migrants, surprisingly, are Belarusians and Germans, as well as Muslims from Turkey and the Middle East. Citizens complain that migrants are taking their jobs and sowing instability in society. A debate has erupted in the Seimas about what to do about migration, what solution would be right and would not worsen the situation."
 poland_monarch.2.a: "Belarusians and Germans are taking our citizens' jobs en masse."
 poland_monarch.2.b: "Islamic migrants create too much instability"
 poland_monarch.2.c: "Strict immigration regulations need to be introduced"
 poland_monarch.2.f: "Our problem with migration is that it is too small."
 POL_problem_migration_tt: "\nDepending on the chosen method for resolving migration issues, we will receive various bonuses and a free change to the §YMigration Law§!. §RThis will also impact our international relations with migrant countries.§!"
 poland_monarch.3.t: "Coronation of Janusz Korwin-Mikke"
 poland_monarch.3.d: "Some time ago, the ruler of Poland, Janusz Korwin-Mikke, declared his claim to the Polish Crown. The Sejm Szlachecki, composed primarily of the noble elite, voted overwhelmingly in support of the House of Corwin. Today, the Great Coronation took place, marking the beginning of the final stage of Poland's return to monarchy.\nGuests from many countries attended the coronation, including leaders from Russia, Great Britain, and Spain who accepted the invitation.The coronation lasted over five hours, during which a new Polish constitution and several diplomatic treaties were signed. Soon, according to Janusz himself, he would proclaim the restoration of the Second Kingdom of Poland."
 poland_monarch.3.a: "Niech żyje Janusz!"
 POL_king_janusz_i_tt: "From now on, §YJanusz Korwin-Mikke§! will be crowned as §tKing of Poland§! §YJanusz I Korwin§!"
 poland_monarch.4.t: "Restoration of the Kingdom of Poland"
 poland_monarch.4.d: "The history of the Polish State has been woven since the dawn of the Slavic Tribes. The Kingdom of Poland was transformed into the Polish-Lithuanian Commonwealth by the Union of Lublin, and then destroyed by two partitions. Today, Poland is a democratic republic, where perverts with rainbow flags roam the streets, yet they have the audacity to push their agenda into our national politics. The youth of Poland has begun to completely forget the greatness of our cultural heritage, and it's time to stop! We have changed the political regime, replaced the newly created foundations with traditional ones, and now the time has finally come to proclaim the return of the Second Kingdom of Poland!"
 poland_monarch.4.a: "O ciesz się, Matko-Polsko, w sławne"
 poland_monarch.5.t: "Poland proclaims the restoration of the Kingdom of Poland"
 poland_monarch.5.d: "The Polish government made a sensational announcement today: the Kingdom of Poland is returning to the map of Europe. More than 100 years after the last partition of the Polish-Lithuanian Commonwealth, Poland is returning to monarchical rule.\nThis news has sparked concern among several countries neighboring the Second Kingdom, fearing they will become victims of Polish revanchism."
 poland_monarch.5.a: "Suddenly"
 poland_monarch.6.t: "Poland offers cooperation"
 poland_monarch.6.d: "Diplomats from Poland came to us today with an interesting proposal. As part of the thaw in relations between our countries, they want to conclude several agreements and initiate long-term cooperation. Should we accept?"
 poland_monarch.6.a: "Russians and Poles - brothers forever!"
 poland_monarch.6.b: "I think...no"
 poland_monarch.7.t: "Russia agrees to cooperation"
 poland_monarch.7.d: "Our diplomats were warmly welcomed in Moscow during their visit to the Kremlin. There, together with their Russian colleagues, they signed a number of documents on military and economic cooperation. This isn't just a piece of paper; it's the beginning of a long-term and strong friendship!"
 poland_monarch.8.t: "Russia refuse to cooperation"
 poland_monarch.8.d: "Our diplomats were welcomed in Moscow during a visit to the Kremlin, where they held a lengthy discussion with our Russian colleagues. Despite disputes and disagreements, we were unable to reach a compromise, and the Russian authorities refused to cooperate."
 poland_monarch.8.a: "Kurwa!"
 POL_reconciliation_with_russia_tt: "If they agree, we will sign a number of agreements with §6[SOV.GetNameWithFlag]§!."
 poland_monarch.9.t: "Poland has declared its ambitions"
 poland_monarch.9.d: "Much time has passed since power in Poland was transferred to the Royalists. And now, after proclaiming the restoration of the Kingdom of Poland, the Polish government has made a statement of its ambitions.\nAmong the statements made by the Polish Royal Court were some rather scandalous ones, such as statements of territorial claims against many of its neighbors.\nTensions in the region increased after such statements."
 poland_monarch.9.a: "Hope this doesn't go beyond mere words."
 poland_monarch.10.t: "A New Military Alliance in Europe"
 poland_monarch.10.d: "Today, the Polish Royal Court announced the creation of the Polish Crown Organization. According to Polish authorities, this alliance is primarily aimed at centralizing the Central European Armed Forces in Warsaw."
 poland_monarch.10.a: "What awaits Europe?"
 lavrov_rotfeld_pact_threat: "Lavrov-Rotfeld Pact"
 poland_monarch.11.t: "Poland wants to sign a pact with us"
 poland_monarch.11.d: "Today, Polish diplomats led by Adam Daniel Rotfeld arrived in the Kremlin with a curious proposal. They wish to sign a number of treaties with us, one of which is an agreement on the division of influence in Eastern Europe.\nIn fact, the treaty is a plan to divide Eastern Europe between Poland and Russia, similar to the Molotov-Ribbentrop Pact signed by Germany and the Soviet Union in 1939. Due to the similarity between the two treaties, it was decided to name it the Lavrov-Rotfeld Pact, in honor of Adam Daniel Rotfeld, who arrived in the Kremlin, and Russian Foreign Minister Sergei Viktorovich Lavrov."
 poland_monarch.11.a: "Let's sign it!"
 poland_monarch.11.b: "We will not make the mistakes of the Union"
 poland_monarch.12.t: "Moscow signs the pact"
 poland_monarch.12.d: "Our diplomats arrived from Moscow, where the Lavrov-Rottfeld Pact was successfully signed. Of course, there are still a few debatable points that we have left for further discussions, but the main points regarding the division of Eastern Europe have been discussed and put on paper; all that remains is to implement this diabolical pact."
 poland_monarch.12.a: "Very Nice!"
 poland_monarch.13.t: "Moscow Refuses"
 poland_monarch.13.d: "Our diplomats returned from Moscow, where they were supposed to sign the Lavrov-Rotfeld Pact. However, due to disagreements over foreign interests and the division of Eastern Europe, the signing of the Pact reached an impasse. The final point was Moscow's reluctance to repeat the mistake of the Soviet Union, which signed a similar treaty with Nazi Germany in 1939."
 poland_monarch.13.a: "What a Pity"
 poland_monarch.14.t: "Russia and Poland signed the Lavrov-Rotfeld Pact"
 poland_monarch.14.d: "Today, the media exploded with news: Polish diplomats led by Adam Daniel Rotfeld arrived at the Kremlin, where they were met by Russian Foreign Minister Sergey Lavrov and a group of Russian diplomats. At a lengthy and debate-filled conference, agreements on mutual non-aggression were signed, as well as a plan for the division of influence in Eastern Europe.\nThis Pact, in its content and meaning, is very reminiscent of the Molotov-Ribbentrop Pact, which was signed between Germany and the Soviet Union in 1939 and became one of reasons for the outbreak of World War II."
 poland_monarch.14.a: "History repeats itself"
 poland_monarch.15.t: "Poland proposes a plan to divide Belarus"
 poland_monarch.15.d: "Belarus was the country that sparked debate in the Kremlin during the signing of the Lavrov-Rotfield Pact. We would not like to cede the western part of our ally's country to Poland. On the other hand, many politicians advocate dividing Belarus and annexing its eastern part to Russia."
 poland_monarch.15.a: "We will fulfill the terms of the contract"
 poland_monarch.15.b: "Belarus will remain in our sphere of influence"
 poland_monarch.16.t: "Russia agrees to divide Belarus"
 poland_monarch.16.d: "Today, Russian diplomats arrived with a response from the Kremlin: Russia agrees to cede Western Belarus. We will occupy the Western part of Belarus, and Russia, in turn, will invade the Eastern part."
 poland_monarch.16.a: "Very Nice!"
 poland_monarch.17.t: "Russia refused to divide Belarus"
 poland_monarch.17.d: "Today, Russian diplomats arrived with a response from the Kremlin: Russia refuses to cede Western Belarus. According to the Russian leader, Belarus is within Russia's sphere of influence, and dividing it is contrary to Russia's foreign policy."
 poland_monarch.17.a: "Sad"
 poland_monarch.18.t: "Poland proposes a plan to divide Baltic"
 poland_monarch.18.d: "According to the Lavrov-Rottfeld Pact, Poland is proposing that we invade the Baltics. It's offering us Estonia and part of Latvia, while it intends to return the lands of Lithuania and Courland."
 poland_monarch.18.a: "The plan is diabolical, I like it."
 poland_monarch.18.b: "We won't do that"
 poland_monarch.19.t: "Russia has abandoned the idea of dividing the Baltics."
 poland_monarch.19.d: "Today, Russian diplomats responded to our proposal to divide the Baltic Sea region with the Kremlin. Moscow refuses to undertake any military action."
 poland_monarch.19.a: "We will get more"
 poland_monarch.20.t: "Poland demands submission"
 poland_monarch.20.d: "Poland has issued us an ultimatum: we must bow and acknowledge the authority of the Polish Crown over our country, otherwise they threaten to change the geography of our borders in some other way. Should we agree?"
 poland_monarch.20.a: "Long live the King!"
 poland_monarch.20.b: "We are able to protect ourselves"
 poland_monarch.21.t: "Poland proposes a plan to divide Ukraine"
 poland_monarch.21.d: "Poland proposes joining forces and invading Ukraine, with the subsequent partition of the country. Poland wants to divide Western Ukraine between Poland, Hungary, and Moldova, and cede the entire eastern part to Russia in accordance with the Lavrov-Rotfield Pact."
 poland_monarch.21.a: "Let's take back our lands"
 poland_monarch.21.b: "We won't do that"
 poland_monarch.22.t: "Moldova agrees to submit to us"
 poland_monarch.22.d: "The Moldovan authorities stated that they would not involve their country in the war and would choose peaceful submission rather than independence in war."
 poland_monarch.22.a: "Another proof that the world is ruled by the law of the strong"
 poland_monarch.23.t: "Moldova refused to submit to us"
 poland_monarch.23.d: "The Moldovan authorities issued a note in response to our ultimatum; they refuse to comply and claim that they will fight for their independence to the last Moldovan."
 poland_monarch.23.a: "God knows we wanted to do this peacefully."
 poland_monarch.24.t: "Poland wants to buy Transnistria"
 poland_monarch.24.d: "Poland wants to end the Transnistria conflict. They recently subjugated Moldova and now want to end the conflict once and for all. They're offering billions of dollars to withdraw our troops from the region, but they're also willing to make concessions."
 poland_monarch.24.a: "Let's end the conflict!"
 poland_monarch.24.b: "We will not leave Transnistria."
 poland_monarch.25.t: "Russia agrees to sell Transnistria"
 poland_monarch.25.d: "After intensive negotiations, Moscow has accepted our offer. Russia will withdraw its troops from the Transnistrian region and transfer control to Poland in exchange for financial compensation. This agreement not only closes a long-standing chapter of uncertainty on the Dniester, but also strengthens our influence in the region and opens the door to a lasting settlement with Moldova."
 poland_monarch.25.a: "A historic step toward stability"
 poland_monarch.26.t: "Russia refuses to sell Transnistria"
 poland_monarch.26.d: "Moscow has rejected our proposal and refuses to withdraw its troops from the Transnistrian region. The stalemate on the Dniester continues, and any peaceful settlement will have to wait — or be pursued by other means."
 poland_monarch.26.a: "They leave us no peaceful choice"
 poland_monarch.27.t: "Union of Lublin — A Choice of Destiny"
 poland_monarch.27.d: "With our power consolidated and our influence stretching across the old Commonwealth lands, a historic decision stands before us. Shall we remain the Kingdom of Poland, a modern and centralized state under one crown, or shall we restore the Polish-Lithuanian Commonwealth — a union reborn for the 21st century, balancing liberty and shared sovereignty between our nations? The choice we make will shape our institutions, identity, and place in Europe for generations to come."
 poland_monarch.27.a: "Restore the Polish-Lithuanian Commonwealth"
 poland_monarch.27.b: "Remain the Kingdom of Poland"
 poland_monarch.28.t: "Poland Restores the Polish-Lithuanian Union"
 poland_monarch.28.d: "In a move laden with historical symbolism, Poland has formally reconstituted the Polish-Lithuanian Union in a modern framework. Drawing on the legacy of the Union of Lublin, this renewed Commonwealth seeks to combine shared institutions with national autonomy, aligning tradition with contemporary governance. Observers note that the re-emergence of this union could significantly alter the political balance in Central and Eastern Europe, strengthening regional cooperation and reviving a storied chapter of European statecraft."
 poland_monarch.28.a: "A new Commonwealth for a new era"
 
 poland_monarch.29.t: "Poland Demands a Polish-Bohemian Union"
 poland_monarch.29.d: "Warsaw has delivered an ultimatum to Prague: accept vassalage as a Younger Uniate under the Polish Crown and enter a personal union, or face the consequences of defiance. The proposal promises protection and shared prosperity under a common framework — but at the price of sovereignty."
 poland_monarch.29.a: "Accept the Polish proposal"
 poland_monarch.29.b: "We will not bend the knee"

 poland_monarch.30.t: "Czechia Accepts the Union"
 poland_monarch.30.d: "Prague has agreed to the Polish terms. The Czech state enters a personal union as a Younger Uniate under the Polish Crown, aligning its foreign policy and defense with Warsaw while retaining internal institutions. A new chapter opens in Central European politics."
 poland_monarch.30.a: "For the stability of the realm"

 poland_monarch.31.t: "Czechia Refuses the Union"
 poland_monarch.31.d: "Prague has rejected Warsaw' ultimatum, refusing to accept vassalage as a Younger Uniate. Tensions rise as Poland denounces the decision and prepares responses that may not be diplomatic. Europe watches closely as the dispute threatens to escalate."
 poland_monarch.31.a: "Then we shall compel obedience"

 poland_monarch.32.t: "Poland Demands a Polish-Hungarian Union"
 poland_monarch.32.d: "Warsaw has issued an ultimatum to Budapest: enter vassalage as a Younger Uniate under the Polish Crown and join a personal union, or accept the consequences. Advocates argue the arrangement would bring security and economic alignment — opponents decry a loss of sovereignty."
 poland_monarch.32.a: "Accept the Polish proposal"
 poland_monarch.32.b: "Hungary will not submit"

 poland_monarch.33.t: "Hungary Accepts the Union"
 poland_monarch.33.d: "Budapest has accepted Warsaw's terms. Hungary will become a Younger Uniate under the Polish Crown, coordinating defense and foreign policy with Poland while preserving internal governance. The Central European balance shifts once again."
 poland_monarch.33.a: "A pragmatic decision for stability"

 poland_monarch.34.t: "Hungary Refuses the Union"
 poland_monarch.34.d: "Budapest has rejected Warsaw's ultimatum, refusing to accept vassalage as a Younger Uniate. Diplomatic channels narrow as Poland considers firmer measures to enforce its will. Tensions in the region rise accordingly."
 poland_monarch.34.a: "Then we shall compel obedience"

 poland_monarch.35.t: "Poland Demands a Polish-Austrian Union"
 poland_monarch.35.d: "Warsaw has presented Vienna with an ultimatum: accept vassalage as a Younger Uniate under the Polish Crown within a personal union framework, or face repercussions. Supporters tout collective security and economic integration; critics warn of diminished Austrian autonomy."
 poland_monarch.35.a: "Accept the Polish proposal"
 poland_monarch.35.b: "Austria will not submit"

 poland_monarch.36.t: "Austria Accepts the Union"
 poland_monarch.36.d: "Vienna has agreed to Warsaw's terms. Austria becomes a Younger Uniate under the Polish Crown, aligning key policies with Poland while maintaining internal institutions. A consequential turn in Central European affairs."
 poland_monarch.36.a: "A pragmatic decision for stability"

 poland_monarch.37.t: "Austria Refuses the Union"
 poland_monarch.37.d: "Vienna has rejected Warsaw's ultimatum, refusing to accept vassalage as a Younger Uniate. Poland denounces the refusal and signals that alternatives to diplomacy remain on the table. Europe watches the standoff with concern."
 poland_monarch.37.a: "Then we shall compel obedience"


 poland_monarch.38.t: "Invitation to the Organization of the Polish Crown"
 poland_monarch.38.d: "Poland invites us to join its alliance, the Organization of the Polish Crown. Membership promises collective security, economic coordination, and a shared diplomatic posture under Warsaw's leadership. Joining would tie our future closely to Poland's vision for Central and Eastern Europe."
 poland_monarch.38.a: "Join the Organization of the Polish Crown"
 poland_monarch.38.b: "We will remain independent"

 poland_monarch.39.t: "[FROM.GetName] Join the Organization of the Polish Crown"
 poland_monarch.39.d: "[FROM.GetAdjective] government has accepted Poland's invitation. By joining the Organization of the Polish Crown, [FROM.GetName] commit to mutual defense and strategic coordination with Warsaw and fellow members, bolstering our security and influence in the region."
 poland_monarch.39.a: "For our shared security and prosperity"

 poland_monarch.40.t: "[FROM.GetName] Refuse the Organization of the Polish Crown"
 poland_monarch.40.d: "After deliberation, [FROM.GetAdjective] leadership has declined Poland's proposal to join the Organization of the Polish Crown. While acknowledging the benefits of closer cooperation, we will preserve an independent course in foreign and security policy."
 poland_monarch.40.a: "Our path remains our own"

 poland_monarch.41.t: "Poland Demands Serbian Territories Returned to Hungary"
 poland_monarch.41.d: "Warsaw has issued a demand to [FROM.GetName]: transfer the Hungarian-populated territories under Serbian control back to Hungary. Poland argues this is a necessary correction of historical injustices and a step toward regional stability. Serbia must now decide whether to comply or defy the Polish decree."
 poland_monarch.41.a: "Return the lands to Hungary"
 poland_monarch.41.b: "Reject Poland's demand"

 poland_monarch.42.t: "[FROM.GetName] Returns Territory to Hungary"
 poland_monarch.42.d: "[FROM.GetName] has agreed to Poland's demand. The designated territories are being transferred to Hungary under Polish supervision, with the stated aim of stabilizing the region and addressing long-standing disputes."
 poland_monarch.42.a: "A difficult but stabilizing decision"

 poland_monarch.43.t: "[FROM.GetName] Refuses to Return Territory"
 poland_monarch.43.d: "[FROM.GetName] has rejected Poland's demand to transfer the territories to Hungary. Warsaw condemns the refusal and prepares measures to enforce its position, raising tensions across the Balkans."
 poland_monarch.43.a: "Then we shall take what is owed"

 poland_monarch.44.t: "Polish Proposal: Hellenic Defense Pact"
 poland_monarch.44.d: "Poland proposes a defensive and military pact uniting Greece and Cyprus against threats from Turkey. The arrangement would include mutual guarantees, military access, and coordinated defense planning under a shared framework, aiming to deter aggression and stabilize the Eastern Mediterranean."
 poland_monarch.44.a: "Decide on the Polish proposal"
 
 poland_monarch.45.t: "[FROM.GetName] Accepts the Polish Defense Pact"
 poland_monarch.45.d: "[FROM.GetName] has agreed to Poland's proposal. [FROM.GetName] will enter into a coordinated defensive arrangement backed by Warsaw, expanding military cooperation and strengthening deterrence against Turkish pressure in the region."
 poland_monarch.45.a: "For the security of the [FROM.GetName]"
 
 poland_monarch.46.t: "[FROM.GetName] Refuses the Polish Defense Pact"
 poland_monarch.46.d: "[FROM.GetName] has declined Poland's proposal. While acknowledging shared concerns, the [FROM.GetAdjective] government will not enter a formal pact at this time."
 poland_monarch.46.a: "We will find other partners" 

 poland_monarch.47.t: "Poland proposes partitioning Romania"
 poland_monarch.47.d: "Today, Polish diplomats arrived in our capital with a proposal. They're proposing a territorial partition of Romania. They're offering us their historical territories, while they themselves will take what rightfully belongs to them and their vassals. This decision will allow us to expand our borders, but at the same time, it will worsen international opinion and cause instability in the region."
 poland_monarch.47.a: "We will take back what is rightfully ours"
 poland_monarch.47.b: "We will not participate in a regional crisis."




 
