 poland_braun.1.t: "Grzegorz Braun takes power"
 poland_braun.1.d: "Grzegorz Braun, a controversial politician from the Confederation of the Polish Crown party, took power in Poland in the recent elections. His radical activities have earned him both widespread popularity and a large number of haters, particularly among activists and Jews, although both these haters will eventually be suppressed by Braun's conservative policies."
 poland_braun.1.a: "Szczęść Boże!"
 poland_braun.2.t: "Mass Deportations of Germans from Warsaw"
 poland_braun.2.d: "Reports from Warsaw indicate that Polish authorities have begun mass deportations of German citizens from the capital. Entire neighborhoods are being cleared under police escort as residents are forced onto transport out of the country. Berlin condemns the action and demands immediate protection and repatriation of its nationals."
 poland_braun.2.a: "Condemn and file a diplomatic protest"
 poland_braun.3.t: "Purge of Wyborcza and TVN Journalists"
 poland_braun.3.d: "Following his rise to power, Grzegorz Braun has ordered a sweeping purge at Gazeta Wyborcza and TVN. Journalists deemed disloyal are being arrested and, in reported cases, executed after summary proceedings. The crackdown sends shockwaves through Poland's media landscape and draws international criticism."
 poland_braun.3.a: "A dark day for the free press"
 poland_braun.4.t: "Poland Crowns Christ"
 poland_braun.4.d: "Recently, the media exploded with news that Poland intends to crown Jesus Christ with the Polish Crown. Today, despite the disapproval of the Polish bishops, who were successfully removed by the current Polish government, the Coronation of Jesus Christ took place.\nThe enthronement ceremony was attended by the head of state himself, as well as leaders and ambassadors from other countries. The ceremony itself lasted several hours and was quite successful for Poland. Polish President Grzegorz Braun announced his intention to claim the title of Holy Regent of the Polish State."
 poland_braun.4.a: "What?"


