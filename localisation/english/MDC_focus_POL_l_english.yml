poland_falanga.3.a: "Strong Economy - Closed Economy"
poland_falanga.5.t: "Poland's New Future"
poland_falanga.5.d: "It is time for our country to be reborn under a new banner and to move towards a brighter future."
poland_falanga.5.a: "Glory to the Polish Nation"
poland_falanga.6.t: "Eviction Of Belarusian Migrants"
poland_falanga.6.d: "We intend to evict the migrants and free up the land for the true patriots of their country - the indigenous people of this great nation!"
