 #SLD EVENTS
 poland_sld.1.t: "Rywingate"
 poland_sld.1.d: "Recently, Lew Rywin visited the office of Adam Michnik, editor of Poland's largest daily newspaper, Gazeta Wyborcza. Rywin was demanding a $17.5 million bribe to amend a bill aimed at limiting the influence of print media on radio and television, which would have benefited Michnik; the original draft prevented the newspaper's publisher Agora SA from taking over the privately owned Polsat TV channel or the second channel of Polish public television, Telewizja Polska. Rywin claimed to be acting on behalf of the so-called 'group in power', which wished to remain anonymous but may have included then-Prime Minister Leszek Miller of the post-communist Democratic Left Alliance."
 poland_sld.1.a: "What a provocation!"
 poland_sld.2.t: "Ryvingate Continuation"
 poland_sld.2.d: "After Gazeta Wyborcza's investigation failed to produce any results, raising some doubts about the paper's real role in the affair, the newspaper published partial transcripts of the curious conversation: Michnik had secretly recorded the conversation and launched an investigation to establish the identity of the 'group in power'. He also arranged a meeting between Miller, Rywin and himself in Miller's office. When Miller, according to others present, denied any involvement in the deal proposed by Rywin, Rywin lost his composure and even talked about suicide. Rywin himself later claimed that he was intoxicated."
 poland_sld.2.a: "ENOUGH! The case is transferred to the Sejm for investigation!"
 poland_sld.3.t: "The Majority Report Was Adopted"
 poland_sld.3.d: "In a separate criminal prosecution, Rywin was sentenced to two years in prison and a fine of 100,000 zlotys for fraud, as the court concluded that there was no 'power group' and Rywin acted on his own initiative."
 poland_sld.3.a: "Great"
 poland_sld.4.t: "The Minority Report was Adopted"
 poland_sld.4.d: "The Sejm unexpectedly voted to accept the minority report, which differed most radically from the majority report, and named the following people as the inspirers of Rywin's mission: Leszek Miller, Aleksandra Jakubowska, Włodzimierz Czarzasty, Robert Kwiatkowski, Lech Nikolski."
 poland_sld.4.a: "SUKA!"
 poland_sld.5.t: "Hausner Plan"
 poland_sld.5.d: "Jerzy Hausner, a member of the Polish Sejm, proposed a plan to improve public finances in the face of growing public debt. The plan was called the 'Program for streamlining and reducing public expenditure.' According to the plan, Poland should significantly reduce its spending to stabilize the economy, but it seems that the Sejm shares Hausner's genius."
 poland_sld.5.a: "We will accept the plan."
 poland_sld.5.b: "This is madness!"
 poland_sld.6.t: "Zbigenev and Vogel Case"
 poland_sld.6.d: "Zbigniew Jerzy Sobotka - Post-communist deputy minister of justice, sentenced to 3.5 years in prison for disclosing state secrets (in fact, he warned the bandits about the operation against them).\n Piotr Filipczyński, aka Peter Vogel, was sentenced to 25 years in prison for brutal murder (reduced to 15 years in 1979). Surprisingly, in 1983 (during martial law in Poland), he was given a passport and allowed to leave the country. He returned in 1990, soon earning the nickname 'the accountant of the left' as a former Swiss banker who serviced over thirty accounts of Polish Social Democrats. Despite an arrest warrant issued in 1987, Vogel moved freely around Poland and was eventually arrested in 1998 in Switzerland. After Vogel's extradition to Poland, Kwaśniewski initiated an amnesty procedure for him in 1999."
 poland_sld.6.a: "We must grant amnesty to former colleagues"
 poland_sld.6.b: "The law is the law"
 poland_sld.7.t: "Another Corruption Scandal"
 poland_sld.7.d: "In 1999, the Polish Council of Ministers had decided the previous year to partially privatize and merge two state-owned petrochemical companies: Centrala Produktów Naftowych, the communist Poland monopoly on retail sales of petroleum products, and Petrochemia Płock, the state company responsible for the Płock refineries, the largest such complex in Poland. Following the merger, the company was renamed Polski Koncern Naftowy (PKN), and a few months later the word Orlen was added to the consortium's name. There is currently a scandal brewing over rumors that Aleksander Kwaśniewski wanted to take good positions in the Company, which was in fact founded by his fellow SLD party members. The Sejm wants to investigate this matter, find out what deals were made and whether the Russians were involved."
 poland_sld.7.a: "I will testify in the case."
 poland_sld.7.b: "I will not give any testimony, this is all an opposition provocation before the elections!"
 poland_sld.8.t: "Poland offers cooperation"
 poland_sld.8.d: "Polish diplomats have sent us a package of proposals for cooperation. It implies a trade agreement, friendship and mutual influence for the benefit of the prosperity of our relations"
 poland_sld.8.a: "Let's shake hands!"
 poland_sld.8.b: "It's not in our interests"

 #KOALICIJA OBYWATELSKA

 #Platforma Obywatelska
 POL_koalicja_obywatelska: "Koalicja Obywatelska"
 POL_koalicja_obywatelska_desc: "The Civic Coalition emerges as a major centrist and liberal political alliance, uniting various groups under a pro-European, reformist banner to challenge the established political duopoly."
 POL_platforma_obywatelska: "Platforma Obywatelska"
 POL_platforma_obywatelska_desc: "The Civic Platform solidifies its position as a leading center-right force, advocating for liberal economic policies, modernization, and deeper integration with the European Union."
 POL_100points_for_100days: "100 points for 100 days"
 POL_100points_for_100days_desc: "An ambitious and symbolic plan to kickstart a term with a flurry of activity, proposing one hundred specific legislative or policy changes to be implemented within the first one hundred days in office."
 POL_op_economic_reforms: "Economic Reforms"
 POL_op_economic_reforms_desc: "A comprehensive package of market-oriented reforms designed to liberalize the economy, reduce the state's footprint, encourage entrepreneurship, and stimulate sustainable growth."
 POL_reduction_seats_in_sejm: "Reduction of seats in the Sejm"
 POL_reduction_seats_in_sejm_desc: "A proposal to streamline the national parliament by reducing the number of seats in the Sejm, arguing for a more efficient and less costly legislative body."
 POL_social_reforms: "Social Reforms"
 POL_social_reforms_desc: "A broad agenda of modernizing the country's social policies, focusing on updating the welfare state, pension system, and public services to meet new demographic and economic challenges."
 POL_reduce_privilegies_of_labour_union: "Reduce the Privileges of Labour Unions"
 POL_reduce_privilegies_of_labour_union_desc: "A contentious policy aimed at curbing the political and economic influence of trade unions, particularly in state-owned enterprises, arguing that their special privileges hinder economic flexibility and investment."
 POL_decentralization_of_expenses: "Decentralization of Expenses"
 POL_decentralization_of_expenses_desc: "A fiscal reform to transfer control over a significant portion of public spending from the central government to local and regional authorities, promoting subsidiarity and more tailored use of funds."
 POL_major_parlamentary_election: "Majoritarian Parliamentary Elections"
 POL_major_parlamentary_election_desc: "A push to reform the electoral system from proportional representation to a majoritarian one, aiming to create stronger, more direct links between constituents and their representatives and foster stable, single-party governments.""
 POL_fight_monopolies: "Fight Against Monopolies"
 POL_fight_monopolies_desc: "Strengthening anti-trust regulations and empowering the Office of Competition and Consumer Protection to break up cartels and monopolies, fostering a more competitive and fair market for businesses and consumers."
 POL_direct_election_in_voivodeships: "Direct Elections in Voivodeships"
 POL_direct_election_in_voivodeships_desc: "A decentralization reform to introduce direct elections for regional leaders (voivodes), granting more autonomy and political power to Poland's regions and making regional governments more accountable."
 POL_bank_leadership: "Bank Leadership"
 POL_bank_leadership_desc: "An effort to assert greater governmental oversight or influence over the strategic direction and leadership of state-controlled banks, balancing economic policy goals with the banks' commercial independence."
 POL_remove_church_fund: "Liquidation of the Church Fund"
 POL_remove_church_fund_desc: "A politically sensitive proposal to abolish the state-funded Church Fund, which provides financial support to the Catholic Church, reigniting debates over the separation of church and state."
 POL_housing_support: "Housing Support"
 POL_housing_support_desc: "Government programs to stimulate the construction and acquisition of housing, such as subsidized mortgages or savings plans, aimed at addressing housing shortages and making homeownership more accessible."
 POL_invalid_support: "Supporting People with Disabilities in Workplace"
 POL_invalid_support_desc: "Implementing incentives and support systems for employers to hire and integrate people with disabilities into the workforce, promoting social inclusion and economic participation."
 POL_undifferentiated_tax: "Undifferentiated Tax"
 POL_undifferentiated_tax_desc: "The promotion of a flat tax system, replacing progressive tax brackets with a single, uniform rate for all income levels, argued to simplify the code, reduce evasion, and stimulate economic activity."
 POL_allow_trading_on_sunday: "Allow Trading on Sunday"
 POL_allow_trading_on_sunday_desc: "A move to lift the long-standing ban on Sunday trade, championed as a matter of economic freedom and consumer convenience, but fiercely opposed by trade unions and religious groups."
 POL_rotation_in_national_bank: "Rotation of National Bank Management"
 POL_rotation_in_national_bank_desc: "A controversial initiative to enforce term limits and rotation within the leadership of the National Bank of Poland, potentially challenging its independence and bringing monetary policy under greater political influence."
 POL_health_reform: "Health Reforms"
 POL_health_reform_desc: "An overhaul of the notoriously inefficient public healthcare system, aiming to reduce waiting times, improve service quality, and ensure long-term financial sustainability through structural changes."
 POL_education_reform: "Education Reforms"
 POL_education_reform_desc: "A sweeping transformation of the national education system, affecting curriculum, school structure, and teacher qualifications, with the goal of better preparing students for the demands of the 21st-century economy."
 POL_tech_economy: "Teaching Economics in Schools"
 POL_tech_economy_desc: "Introducing mandatory economics and financial literacy classes into the school curriculum, aiming to equip the next generation with practical knowledge about the market, personal finance, and entrepreneurship."
 POL_increase_teachers_salaries: "Increase Teachers Salaries"
 POL_increase_teachers_salaries_desc: "A significant state investment to raise the wages of teachers, addressing long-standing grievances, improving morale, and aiming to attract higher-quality candidates to the education profession."
 POL_legalization_collaborative_partnerships: "Legalization of Collaborative Partnerships"
 POL_legalization_collaborative_partnerships_desc: "A step towards recognizing diverse family models by legally formalizing civil unions or collaborative partnerships, providing legal and economic protections for unmarried couples."
 POL_balanced_partnership: "Balanced Partnership"
 POL_balanced_partnership_desc: "A foreign policy doctrine seeking a balanced relationship between major powers, particularly the United States and European partners like Germany and France, while cautiously managing relations with Russia."
 POL_join_eu_missile_shield: "Join the European Missile Shield"
 POL_join_eu_missile_shield_desc: "Committing Poland to participate in a European missile defense shield project, a move that enhances continental security but is likely to provoke a strong reaction from Moscow."
 POL_reduce_tens_in_east: "Reduce Tensions in the East"
 POL_reduce_tens_in_east_desc: "Pursuing a policy of diplomatic dialogue and de-escalation with Eastern neighbors, primarily Russia, aiming to reduce regional tensions and foster economic cooperation despite historical grievances."
 POL_increase_us_presence: "Increase States presence"
 POL_increase_us_presence_desc: "Actively seeking an enhanced permanent military presence of the United States on Polish soil, viewing it as the ultimate security guarantee against potential aggression from the East."
 POL_loyality_to_NATO: "Loyalty to NATO values"
 POL_loyality_to_NATO_desc: "Reaffirming Poland's unwavering commitment to the North Atlantic Treaty Organization as the cornerstone of its national defense, prioritizing alliance cohesion and the principle of collective defense."
 POL_support_euromaidan: "Support Euromaidan"
 POL_support_euromaidan_desc: "Providing strong political, diplomatic, and material support to the pro-European protestors in Ukraine during the Euromaidan revolution, aligning Poland firmly with the democratic aspirations of its eastern neighbor."
 POL_deal_with_blr_migrants: "Deal with Belarusian Migrants"
 POL_deal_with_blr_migrants_desc: "Managing a hybrid threat on the border with Belarus, which involves dealing with waves of migrants instrumentalized by the Lukashenko regime to destabilize the EU's eastern flank."
 POL_legalization_abortion: "Legalization of Abortion"
 POL_legalization_abortion_desc: "The enactment of legislation to legalize abortion under certain circumstances, marking a profound shift in the country's social policy and triggering significant political and societal conflict."

