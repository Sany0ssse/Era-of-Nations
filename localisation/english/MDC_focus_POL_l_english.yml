POL_reforms_of_2000s_desc: "A foundational series of reforms initiated in the 2000s to restructure the armed forces, reduce conscription, and align Poland's military with NATO standards in preparation for future integration and modernization."

POL_wojska_ladowe_desc: "The strategic modernization and reorganization of the Land Forces (Wojska Lądowe), the backbone of the Polish military, to enhance their mobility, firepower, and command-and-control capabilities."

POL_pomor_military_district_desc: "Strengthening the Pomeranian Military District to bolster defenses along the Baltic coast and the strategic Suwałki Gap, a critical NATO flank."

POL_silesian_military_district_desc: "Reinforcing the Silesian Military District, a key industrial and population center, to secure southern Poland and maintain a strong defensive posture."

POL_new_commander_armed_forces_desc: "The appointment of a new, reform-minded Commander-in-Chief of the Armed Forces to oversee the ambitious modernization program and instill a new military doctrine."

POL_logistics_reorganization_desc: "A complete overhaul of the military logistics system to improve supply chains, maintenance capabilities, and strategic mobility for both national defense and expeditionary operations."

POL_transition_to_prof_army_desc: "The historic transition from a mixed conscript-professional force to a fully professional, all-volunteer army, improving training, readiness, and operational effectiveness."

POL_reform_of_military_districts_desc: "A structural reform to streamline the military district system, creating more agile and operationally focused commands better suited for modern warfare."

POL_reorganization_infantry_desc: "Reorganizing infantry units into more flexible, brigade-centric structures, equipped with modern weapons and integrated combat systems."

POL_wojska_lotnicze_desc: "The ambitious modernization of the Air and Air Defense Forces (Wojska Lotnicze i Obrony Powietrznej) to achieve air superiority and protect Polish airspace."

POL_sily_powietrzne_desc: "A focused effort to build a modern and capable Air Force (Siły Powietrzne) through the acquisition of new combat aircraft, radar systems, and air defense missiles."

POL_army_aviation_brigade_desc: "The creation of a dedicated Army Aviation Brigade to provide direct support to ground forces with transport, reconnaissance, and attack helicopters."

POL_pzl_swidnik_desc: "Supporting PZL-Świdnik SA, a national helicopter manufacturer, to secure the supply and maintenance of rotorcraft for the armed forces."

POL_mi24_modernization_desc: "A program to extend the service life and enhance the combat capabilities of the fleet of Mil Mi-24 attack helicopters."

POL_start_production_ka50_desc: "A controversial initiative to license-produce the Russian Kamov Ka-50 'Black Shark' attack helicopter, creating logistical and political complications."

POL_start_production_ah64_apache_desc: "The strategic decision to license-produce the American AH-64 Apache, a world-class attack helicopter, for the Polish Army Aviation."

POL_pzl_w3_sokol_desc: "The modernization and continued production of the indigenous PZL W-3 Sokół multi-role helicopter for transport and utility duties."

POL_pzl_mi2_desc: "The phased retirement of the aging PZL Mi-2 helicopters, a workhorse of Polish aviation, and their replacement with modern types."

POL_army_aviation_brigad_TT_desc: "This focus will create §Y3§! new, fully equipped Army Aviation battalions, significantly enhancing the mobility and close air support available to ground commanders."

POL_decommission_old_planes_desc: "The systematic retirement of obsolete Soviet-era aircraft like the MiG-21 and Su-20 to free up resources for modern platforms."

POL_buy_mig_29_from_Germany_desc: "An opportunistic purchase of surplus MiG-29 fighters from the German Luftwaffe to bolster interceptor numbers and maintain pilot proficiency."

POL_buy_mig_29_from_Czech_desc: "Acquiring additional MiG-29 airframes from the Czech Republic to cannibalize for spare parts and sustain the existing fleet."

POL_selecting_new_multirole_fighter_desc: "The critical and highly politicized process of selecting a new generation multirole fighter to form the future backbone of the Polish Air Force."

POL_redevelopment_of_air_corps_basing_areas_desc: "A massive infrastructure program to modernize airbases, runways, hangars, and fuel depots to support new, more advanced aircraft."

POL_retraining_officers_desc: "An extensive program to retrain pilots and ground crew from Soviet-era systems to operate and maintain Western-made aircraft and technology."

POL_problem_national_aviation_desc: "Confronting the challenges and high costs associated with developing and sustaining a sovereign national aviation industry for combat aircraft."

POL_modernization_su_22_desc: "A limited upgrade program for the Su-22 Fitter fleet, focusing on avionics and precision-guided munitions to extend its role as a dedicated strike platform."

POL_kobra_2000_desc: "An indigenous modernization package for the MiG-29, including new radar and avionics, to enhance its air-to-air capabilities."

POL_pzl_m2000_desc: "An ambitious, ultimately unrealized national project to develop a Polish-made multirole fighter, highlighting the difficulties of indigenous 5th-generation development."

POL_mig_35_desc: "Evaluating the Russian MiG-35 as a potential low-cost successor to the MiG-29, despite the geopolitical risks of dependence on Russian technology."

POL_f_35a_desc: "The decision to acquire the F-35A Lightning II, a 5th-generation stealth fighter, which would represent a quantum leap in capability and solidify the strategic alliance with the United States."

POL_f_22_raptor_desc: "A symbolic but politically significant push to acquire the F-22 Raptor, despite its export ban, representing the desire for the world's premier air superiority fighter."

POL_su_57_desc: "A highly controversial exploration of purchasing the Russian Su-57 Felon, a move that would severely strain relations with NATO allies."

POL_mig_29_desc: "Continuing to operate and further modernize the MiG-29 Fulcrum as a capable point-defense interceptor until a full replacement is secured."

POL_purchase_russian_missile_systems_desc: "The risky procurement of advanced Russian air defense systems like the S-300 or S-400, creating major interoperability and security issues within NATO."

POL_su_25_desc: "Maintaining and upgrading the Su-25 Frogfoot fleet to provide reliable and rugged close air support for ground troops."

POL_buy_su_34_desc: "The potential acquisition of the Su-34 Fullback to fulfill a long-range strike and interdiction role, further deepening ties with the Russian defense industry."

POL_f16_fighting_falcon_desc: "The landmark decision to purchase the F-16 Fighting Falcon, a proven Western multirole fighter, which became the cornerstone of the modern Polish Air Force."

POL_purchase_american_missile_systems_desc: "The procurement of American air defense systems like PATRIOT to create a layered, integrated air and missile defense network for Poland."

POL_a_10_thunderbolt_ii_desc: "An initiative to acquire the A-10 Thunderbolt II for its unparalleled close air support capabilities, particularly in a defensive land-war scenario."

POL_buy_f_15e_desc: "Evaluating the F-15E Strike Eagle for its long-range, heavy-payload capabilities, filling a strategic bomber role for the Polish Air Force."

POL_modernization_military_equipment_desc: "A nationwide effort to replace or deeply modernize the vast inventory of Soviet-era military equipment with modern, often Western-origin, systems."

POL_modernization_twardy_desc: "The comprehensive modernization of the PT-91 'Twardy' main battle tank, an indigenous development of the T-72, with new armor, fire control, and engines."

POL_hsw_sa_desc: "Supporting Huta Stalowa Wola (HSW SA) as the national center for the production and modernization of armored vehicles, artillery, and engineering equipment."

POL_borsuk_desc: "The development and eventual production of the 'Borsuk' (Badger), a new indigenous infantry fighting vehicle to replace the aging BMP-1."

POL_langusta_desc: "The introduction of the WR-40 'Langusta' (Lobster), a Polish multiple launch rocket system integrated on a Jelcz truck chassis."

POL_pit_radwar_desc: "Empowering PIT-Radwar SA as the key national provider of advanced radar systems, C4ISR technology, and electronic warfare equipment."

POL_poprad_desc: "The deployment of the 'Poprad' self-propelled anti-aircraft missile system to provide short-range air defense for mobile units."

POL_hibneryt_desc: "The development of advanced camouflage and deception systems, codenamed 'Hibernyt', to protect military assets from reconnaissance and targeting."

POL_rosomak_desc: "The license-production and further development of the 'Rosomak' (Wolverine) armored modular vehicle, a cornerstone of the army's mobility."

POL_honker_desc: "The modernization of the fleet of 'Honker' light military vehicles for reconnaissance, liaison, and special forces roles."

POL_jelcz_desc: "Reliance on Jelcz for heavy-duty military trucks and specialized vehicle chassis, crucial for logistics and artillery mobility."

POL_obrum_desc: "Supporting OBRUM (Research and Development Centre for Mechanical Appliances) for the design and prototyping of new armored vehicles."

POL_modernization_foreign_equipment_desc: "Programs to integrate Polish-made subsystems and weapons onto imported platforms like the Leopard 2 or F-16."

POL_implementation_of_own_projects_desc: "A push to prioritize and fund indigenous defense projects to foster technological sovereignty and reduce foreign dependence."

POL_bmp_andres_desc: "An ambitious domestic project to develop a new-generation infantry fighting vehicle, showcasing Polish engineering ambition."

POL_pl_01_desc: "The development of the futuristic PL-01 concept, a stealthy light tank designed to set a new standard for armored reconnaissance."

POL_pt_2001_gepard_desc: "A project to develop a new Polish main battle tank, sometimes referred to as 'Gepard', to eventually succeed the PT-91 and Leopard 2."

POL_leopard_2pl_desc: "The comprehensive modernization of the Leopard 2A4 fleet to the new Leopard 2PL standard, significantly enhancing its combat effectiveness."

POL_k2pl_desc: "The landmark decision to acquire and locally produce the South Korean K2 Black Panther main battle tank, a top-tier modern platform."

POL_updating_communication_system_desc: "A critical upgrade of the entire military's communication systems to secure, encrypted, and networked digital standards for NATO interoperability."

POL_tytan_desc: "The fielding of the 'Tytan' (Titan) integrated soldier system, enhancing the lethality, survivability, and situational awareness of the individual soldier."

POL_new_military_uniform_desc: "The introduction of a new, functional, and modernized military uniform and personal equipment suite for all service branches."

POL_maskpol_desc: "Supporting Maskpol as the primary supplier of personal protective equipment, including body armor, helmets, and ballistic masks."

POL_lampart_desc: "The development of the 'Lampart' (Leopard) command and control vehicle, based on the Rosomak platform, for battalion-level commanders."

POL_hbt_02_desc: "The introduction of the HBT-02 'Hardy' armored personnel carrier, a simpler and cheaper supplement to the Rosomak."

POL_arsenal_update_desc: "A broad program to replace small arms, from pistols to sniper rifles, with modern, standardized designs."

POL_lucznik_desc: "Modernizing the FB 'Łucznik' Radom arms factory to become the primary source of new standard-issue service rifles for the Polish military."

POL_mesko_desc: "Supporting Mesko SA as the key manufacturer of missiles, rockets, and precision-guided munitions for the army and air force."

POL_modern_mortars_missile_system_desc: "The acquisition and domestic production of advanced mortar systems (like 120mm self-propelled mortars) and anti-tank guided missiles."

POL_zmt_desc: "Reliance on Zakłady Mechaniczne Tarnów (ZMT) for the production of automatic grenade launchers and other heavy infantry weapons."

POL_modern_mechine_gun_and_grenade_launchers_desc: "A program to replace legacy machine guns and grenade launchers with modern, NATO-standard designs."

POL_msbs_grot_desc: "The adoption of the modular MSBS 'GROT' rifle system as the new standard individual weapon for the Polish Armed Forces."

POL_marynarka_wojenna_desc: "A long-term modernization plan for the Polish Navy (Marynarka Wojenna) to defend the Baltic Sea, secure sea lines of communication, and contribute to NATO maritime operations."

POL_gdynia_shipyard_desc: "Revitalizing the Gdynia Shipyard as a central hub for the construction and maintenance of new naval vessels for the Polish fleet."

POL_increasing_fleet_production_desc: "Accelerating the pace of naval construction to replace an aging fleet of Soviet-era corvettes, minesweepers, and submarines."

POL_restructuring_gdansk_shipyard_desc: "The difficult restructuring of the historic Gdańsk Shipyard, balancing its commercial viability with its potential role in supporting naval projects."

POL_ship_workshop_of_europe_desc: "An ambitious vision to position Polish shipyards as the 'Ship Workshop of Europe,' capable of building complex commercial and naval vessels for export."

POL_defense_baltic_coast_desc: "Strengthening coastal defense forces with new anti-ship missile batteries, mines, and fast-attack craft to deny access to adversaries in the Baltic."

POL_modernization_corvettes_desc: "The modernization of the existing fleet of corvettes with new sensors, weapons, and engines to extend their service life."

POL_new_submarine_project_desc: "The critical 'Orka' program to acquire new, modern conventional submarines to restore the Navy's sub-surface warfare capability."

POL_high_seas_operation_desc: "A doctrinal shift to train and equip the Navy for operations beyond the Baltic Sea, including power projection and participation in international task forces."

POL_purchase_frigates_desc: "The strategic goal of acquiring modern frigates, a capability leap that would allow the Polish Navy to operate as a blue-water force."

POL_projection_of_power_desc: "Developing a limited capability for power projection, potentially through the acquisition of an amphibious assault ship or strategic airlift."

POL_wojska_specjalne_desc: "The expansion and professionalization of the Special Forces (Wojska Specjalne) as a premier tool for counter-terrorism, reconnaissance, and unconventional warfare."

POL_grom_desc: "Investing in GROM, Poland's elite counter-terrorism and special operations unit, to maintain its status as one of the world's top-tier special forces."

POL_formoza_desc: "Enhancing the capabilities of FORMOZA, the Naval Special Operations unit, for maritime counter-terrorism, sabotage, and reconnaissance."

POL_jwk_desc: "Strengthening the JWK Commando Unit (Jednostka Wojskowa Komandosów) as the army's primary force for deep reconnaissance and direct action raids."

POL_agat_desc: "The formation of the AGAT unit, a special forces group focused on deep reconnaissance and operating behind enemy lines in support of resistance movements."

POL_nil_desc: "The establishment of the NIL unit, dedicated to psychological operations (PSYOP) and information warfare."

POL_pmc_rutkowski_patrol_desc: "A controversial policy to regulate or potentially utilize private military companies (PMCs), such as the symbolic 'Rutkowski Patrol', for certain security tasks."

POL_army_desc: "A radical reform of the Armed Forces of the Republic of Poland, focusing on strategic sovereignty, cost-effectiveness, and a clear definition of its role solely for national defense, rejecting costly international expeditions."

POL_non_intervention_policy_desc: "The adoption of a strict non-interventionist foreign policy, arguing that Poland should not engage in military conflicts that do not directly threaten its national sovereignty, thereby preserving resources and avoiding unnecessary entanglements."

POL_presence_in_afganistan_desc: "A controversial decision to increase Poland's military contribution to the NATO mission in Afghanistan, justifying it as a necessary alliance obligation despite the party's general non-interventionist stance."

POL_warsaw_conference_desc: "Hosting a major international conference in Warsaw to redefine NATO's strategy and Poland's role within the alliance, pushing for a greater focus on collective defense over out-of-area operations."

POL_send_troops_into_iraq_desc: "A highly contentious decision to commit Polish troops to the coalition in Iraq, a move that splits public opinion and is criticized as subservience to American interests at the expense of Polish security and finances."

POL_condemn_aggression_of_states_desc: "A foreign policy doctrine that condemns military aggression by major powers, positioning Poland as a defender of the sovereignty of smaller nations and a critic of neo-imperialist policies on the global stage."

POL_countering_threat_of_terrorism_desc: "Developing a national strategy to counter the threat of terrorism, focusing on border security, intelligence services, and preventing radicalization, while criticizing mass migration from conflict zones as a security risk."

POL_condemn_radical_islamism_desc: "A firm ideological stance openly condemning radical Islamism as a totalitarian threat to Western civilization, Polish culture, and national security, and using it as a justification for strict immigration controls."

POL_question_of_islamic_migrants_desc: "Framing the issue of migration primarily through a security and cultural lens, presenting the influx of Islamic migrants as a direct threat to Poland's social cohesion, public safety, and Christian identity."

POL_operation_eagle_feather_desc: "A proposed unilateral Polish special forces operation, symbolic of a more assertive and sovereign foreign policy, though its specific objectives and targets remain classified."

POL_operation_serval_desc: "A decision to provide limited, non-combat support to the French-led Operation Serval in Mali, framed as a necessary action to stabilize a region that is a source of illegal migration and terrorist activity."

POL_syrian_dilemma_desc: "Navigating the complex Syrian civil war, balancing condemnation of the Assad regime with strong opposition to Western military intervention and Islamist rebels, advocating for a focus on humanitarian aid and regional containment."



##########PSL TREE##########
##########Focuses###########
POL_psl: "PSL"
POL_psl_desc: "The Polish People's Party reasserts itself as the conscience of the countryside, rallying agrarian voters, local notables, and pragmatic centrists around a promise of stability, moderation, and respect for rural interests."
POL_left_conservatism: "Left Conservatism"
POL_left_conservatism_desc: "We revive the party's traditional left-leaning conservatism: socially solidaristic, deeply Catholic, and skeptical of unfettered markets, offering a distinctly Polish answer to globalization."
POL_drift_right: "Drift to the Right"
POL_drift_right_desc: "Fearing irrelevance in a polarized Sejm, PSL edges toward the right, tightening alliances with conservative factions while defending our agrarian safety net."
POL_bewarw_of_dangers_communism: "Beware of the Dangers of Communism"
POL_bewarw_of_dangers_communism_desc: "The party warns that creeping nostalgia for the People's Republic threatens to erode private property and the hard-earned freedoms of the countryside."
POL_eliminate_shortcomings_capitalism: "Eliminate the Shortcomings of Capitalism"
POL_eliminate_shortcomings_capitalism_desc: "Rather than reject markets outright, we seek to mend them—curbing predatory finance, boosting cooperatives, and ensuring competition actually benefits Polish farmers."
POL_condemn_capitalist_transformation: "Condemn the Capitalist Transformation"
POL_condemn_capitalist_transformation_desc: "PSL denounces the chaotic 'wild capitalism' of the 1990s, arguing that shock therapy hollowed out villages and empowered foreign cartels."
POL_antiliberal_rhetoric: "Anti-liberal Rhetoric"
POL_antiliberal_rhetoric_desc: "Our rhetoric turns fiery against the liberal elites of Warsaw and Brussels, galvanizing supporters who feel dismissed by technocrats."
POL_catholic_subsidiarity: "Catholic Subsidiarity"
POL_catholic_subsidiarity_desc: "Invoking Catholic social doctrine, we champion subsidiarity: decisions should be taken in gmina halls, not distant ministries."
POL_neoagrarian_economy: "Neo-Agrarian Economy"
POL_neoagrarian_economy_desc: "A modern neo-agrarian strategy blends precision agriculture, cooperatives, and local processing to keep value chains in Polish hands."
POL_support_social_market: "Support for Social Market Economy"
POL_support_social_market_desc: "We embrace a social market model—competition underpinned by strong social protections—to ease rural modernization pains."
POL_accept_cst: "Accept Catholic Social Teaching"
POL_accept_cst_desc: "Party programs are reviewed through the lens of Catholic Social Teaching, binding moral obligation to economic stewardship."
POL_deregulation_market: "Deregulation of Market"
POL_deregulation_market_desc: "Selective deregulation lightens the bureaucratic load on family firms and agro-cooperatives, speeding up permits and credit access."
POL_privatization_program: "Privatization"
POL_privatization_program_desc: "State assets that no longer serve the public interest are transferred to vetted local stakeholders, preventing fire sales to speculative multinationals."
POL_eliminate_inequality_in_villages: "Eliminate Inequality in Villages"
POL_eliminate_inequality_in_villages_desc: "Targeted investment in broadband, clinics, and education aims to close the gap between affluent towns and forgotten hamlets."
POL_gamover_gloval_corps: "Gameover of Global Corporations"
POL_gamover_gloval_corps_desc: "We confront global agribusiness monopolies with antitrust probes, cooperative purchasing, and patriotic branding to level the playing field."
POL_fight_unemployment_psl: "Fight Uneployment"
POL_fight_unemployment_psl_desc: "Labor programs pair vocational retraining with incentives for small manufacturers to set up shop in depressed poviat seats."
POL_protectionist_measures: "Protectionist Measures"
POL_protectionist_measures_desc: "Tariff shields, seasonal quotas, and buy-Polish procurement rules defend domestic producers from dumping and currency manipulation."
POL_postulates_direct_democracy: "Postulates of Direct Democracy"
POL_postulates_direct_democracy_desc: "PSL elevates referenda, citizens' initiatives, and participatory budgeting to ensure that reforms reflect the will of the villages we represent."
