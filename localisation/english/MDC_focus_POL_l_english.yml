 #Confederation Events
 poland_confederation.1.t: "Historical Values"
 poland_confederation.1.d: "The history of the Polish state begins in the 9th and 10th centuries with the West Slavic Communities and extends to the Kingdom of Poland and the Polish-Lithuanian Commonwealth. Our history has also had tragic periods, beginning with the three Partitions of Poland between the Great Neighboring Powers and ending with the Volyn Massacre and the Genocide of the Polish Nation by Ukrainian Nationalists.\nOur history is great and multifaceted, we must never forget our heritage, which was bequeathed to us by our ancestors and national heroes from Bolesław I Chrobry to Józef Piłsudski.\nOur country's politics cannot exist without historical guidance, and we now stand on the threshold of choosing what is more important: to make territorial claims against our neighbors or to focus on developing our cultural heritage."
 poland_confederation.1.a: "We must return our lands!"
 poland_confederation.1.b: "Polish Culture was and will be Great!"
 POL_respect_for_historical_values_tt: "An §YEvent Will Occur§! that will force us to choose: §RTerritorial Claims§! or §6Cultural Heritage§!. §RMilitary Ambitions§! or §6Peaceful Development§!."
 poland_confederation.2.t: "Commitment to Faith"
 poland_confederation.2.d: "Catholicism is an important part of Polish culture. Since ancient times, Poles have been faithful to their faith, even surviving the Wars of Religion and the Reformation, without succumbing to Lutheran and other heresies. And today, it is crucial to maintain adherence to the faith among the population of the Polish State in order to preserve our traditional and cultural values while glorifying Christ."
 poland_confederation.2.a: "Chwała Bogu!"
 poland_confederation.3.t: "Korwin takes power in Poland"
 poland_confederation.3.d: "Janusz Korwin-Mikke, a member of the coalition party Konfederacja Wolność i Niepodległość, had long been the party's Grey Cardinal. His monarchist and anti-Western sentiments had long signaled that the party was headed for a split. Gradually gaining influence in the Sejm and Senate, he gained sufficient power to execute what became known as the \"Korwin Political Gambit\" and oust his colleague, Sławomir Mentzen, as head of state. His influence within the government allowed Korwin to easily establish his dominance within the party."
 poland_confederation.3.a: "Let's see what happens next."
 poland_confederation.4.t: "Political upheaval in Poland"
 poland_confederation.4.d: "Janusz Korwin-Mikke, a member of the coalition party Konfederacja Wolność i Niepodległość, had long been the party's Grey Cardinal. His monarchist and anti-Western sentiments had long signaled that the party was headed for a split. Gradually gaining influence in the Sejm and Senate, he gained sufficient power to execute what became known as the \"Korwin Political Gambit\" and oust his colleague, Sławomir Mentzen, as head of state. His influence within the government allowed Korwin to easily establish his dominance within the party.\n\nKorwin's Russophile and anti-NATO rhetoric puts the Western Bloc in a difficult position. They have clearly lost a key player in the very center of Europe. And Janusz's monarchist ideology predicts a likely return of royalism in Poland, although this is not certain."
 poland_confederation.4.a: "Let's see what happens next."
 poland_confederation.5.t: "Poland wishes to join our faction"
 poland_confederation.5.d: "Today, Polish diplomats approached us with a proposal. They wish to join our alliance.\nThe new Polish government, led by pro-Russian President Janusz Korwin-Mikke, has long shown loyalty to us and even withdrew from the NATO alliance. Now they want to join our alliance and are ready to take on bilateral military obligations."
 poland_confederation.5.a: "You're Welcome!"
 poland_confederation.5.b: "We wouldn't want to have anything to do with them."
 poland_confederation.6.t: "Russia agreed to accept us into the alliance."
 poland_confederation.6.d: "Russia has agreed to accept us into its alliance. From now on, we are officially members of the [SOV.GetFactionName] alliance and have bilateral obligations to Russia and other alliance members. This alliance will bring us closer to overthrowing American Imperialism and putting the Western Colonizers in their place."
 poland_confederation.6.a: "USA będą w dupie!"
 poland_confederation.7.t: "Russia refused to accept us into the alliance."
 poland_confederation.7.d: "Today, Russian diplomats responded to our application. They refused our request to join their alliance. Apparently, they're not really interested in cooperating with us, or we simply should have sent different diplomats..."
 poland_confederation.7.a: "Kurwa..."
 poland_confederation.8.t: "Poland joins [SOV.GetFactionName]"
 poland_confederation.8.d: "Today the media exploded with breaking news: Poland and Russia signed agreements according to which Poland officially joins [SOV.GetFactionName].\nThe thaw in Russian-Polish relations has long been prompted by news of a possible alliance or military cooperation, but what was completely unexpected, first and foremost for the Western Bloc, was Poland's full-fledged entry into [SOV.GetFactionName].\nThe White House has not yet commented on this matter, but things are clearly not going well in America, as the North Atlantic Alliance has not only lost such an important player in Central Europe, but has also gained a new enemy in the form of the Polish State, whose policy is clearly aimed at combating American global influence."
 poland_confederation.8.a: "What will happen next?"
 
