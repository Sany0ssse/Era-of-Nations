 ##########Events###########
 poland_commi.1.t: "Fighting the Revision"
 poland_commi.1.d: "After Joseph Stalin's death, many critics of Stalinist Marxism and advocates for reforms of Marxist ideology emerged. They criticized one-party rule and advocated freedom of the press and the arts, intra-party and sometimes inter-party democracy, independent trade unions, the abolition of bureaucratic privileges, and the subordination of the police to the judiciary. These people became known as revisionists, and their ideology, revisionism.\nOne of these revisionists was Nikita Khrushchev, Chairman of the CPSU Central Committee, who succeeded Joseph Stalin. It was precisely this departure from Marx's core ideas that marked the beginning of the collapse of the Soviet Union. We must not allow this to happen to our country."
 poland_commi.1.a: "Lenin's ideas are eternal!"
 poland_commi.2.t: "Catholics and Communists"
 poland_commi.2.d: "Poland is historically a Christian Catholic country, and even during the Polish People's Republic, Catholicism remained an important part of society. Poland was perhaps the only socialist country that not only refrained from dismantling churches and cathedrals, but also cooperated with the bishopric. Clergy were an active part of Poland's political life and, unlike other ideologically similar countries, were not persecuted. We too must decide whether we will continue this practice or follow the path of the Soviet Union."
 poland_commi.2.a: "Faith is inseparable from Poland and this must be recognized!"
 poland_commi.2.b: "Religion is a weapon of class oppression"
 poland_commi.3.t: "Poland Proposes an Alliance"
 poland_commi.3.d: "Since the Communist Party came to power in Poland and the restoration of the socialist system, the Polish government has warmed to Russia and is seeking to reconcile the relationship that was disrupted by the Third Republic.\nToday, the Polish leader [POL.GetLeader] personally visited our country and brought with him a couple of interesting documents for signing. The contents of these documents make it immediately clear: this is an alliance."
 poland_commi.3.a: "It will be a glorious union"
 poland_commi.3.b: "We will not deal with communists!"
 poland_commi.4.t: "Union between Poland and Russia"
 poland_commi.4.d: "Today, the media was abuzz with news that [POL.GetName] and [SOV.GetName] had signed some kind of agreement, the content of which clearly resembles a military alliance.\nThe thaw in relations between the two countries had long hinted that such an outcome was quite likely, but no one expected it to be so abrupt.\nNeither the United States nor NATO as a whole have yet responded to this news, but it is clear that such an alliance and Poland's aggressively revolutionary policies will shift the balance of power in Europe to the detriment of NATO and the EU. We are currently experiencing a new turning point in global politics and history."
 poland_commi.4.a: "Return of the Warsaw Pact?"
 poland_commi.5.t: "The contract has been signed"
 poland_commi.5.d: "The Russian Foreign Ministry and the Russian Leader [SOV.GetLeader]signed the agreement. This marked the beginning of a glorious alliance, which I hope will grow into something greater."
 poland_commi.5.a: "Witajcie, towarzysze!"
 poland_commi.6.t: "The contract has not been signed"
 poland_commi.6.d: "Russia refused to sign the alliance treaty. Apparently, they don't share our communist ideals. Well, we will continue to cooperate with them and pursue a friendly policy in the hope that they will come to their senses in the future."
 poland_commi.6.a: "It's a pity"
 poland_commi.7.t: "Poland Invites us to its Alliance"
 poland_commi.7.d: "Poland has sent us a diplomatic proposal. As part of the restoration of the Second Warsaw Pact, they invite us to join their newly created Alliance. This step will spur the proletariat of all countries toward unity and bring closer the triumph of communist ideals."
 poland_commi.7.a: "Workers of the world - Unite"
 poland_commi.7.b: "It's not in our interests."
 poland_commi.8.t: "The return of the Warsaw Pact"
 poland_commi.8.d: "Today, the Polish People's Republic announced the return of the Warsaw Pact. This alliance was dissolved in 1991 following the collapse of the Soviet Union. However, Poland's new socialist government has declared its intention to restore the alliance and surpass its glory."
 poland_commi.8.a: "What happens next..."
 poland_commi.9.t: "Second Warsaw Pact"
 poland_commi.9.d: "Today, [FROM.GetName] announced its intention to join Poland's recently formed Second Warsaw Pact alliance. This move will change the global balance of power and tip the scales in favor of the Socialist Block."
 poland_commi.9.a: "What?"
 poland_commi.10.t: "[FROM.GetName] agreed to join the Warsaw Pact"
 poland_commi.10.d: "Today, [FROM.GetAdjective] diplomats responded to our invitation. They agree to bind our countries together in an alliance treaty called the Warsaw Pact. This step will strengthen our ties and bring the great Communist Revolution closer throughout the world!"
 poland_commi.10.a: "Robotnicy całego świata, zjednoczcie się!"
 poland_commi.11.t: "[FROM.GetName] refused to join the Warsaw Pact"
 poland_commi.11.d: "Today, [FROM.GetAdjective] diplomats responded to our invitation. They refused to enter into an ideological alliance with us."
 poland_commi.11.a: "No problem for the revolution"
 poland_commi.12.t: "Condemnation of American Imperialism"
 poland_commi.12.d: "The Polish government condemns American Imperialism and calls on us to do the same, but are we willing to damage our relations with the United States?"
 poland_commi.12.a: "Damn Americans!"
 poland_commi.12.b: "We Will Not Condemn"
 poland_commi.13.t: "Joint Military Operation against Kosovo"
 poland_commi.13.d: "The Polish government is offering us a chance to put an end to Kosovo and its false independence once and for all, and is ready to fully support us up to the point of declaring war on Kosovo."
 poland_commi.13.a: "Kosovo Has No Chance"
 poland_commi.13.b: "Not Worth"
 poland_commi.14.t: "Joint Military Operation against Kosovo"
 poland_commi.14.d: "The Serbian government refused to conduct a joint military operation with us in Kosovo, and they seem to be afraid to even fight for their historical territories."
 poland_commi.14.a: "Sad"
 poland_commi.15.t: "Cooperation with [POL.GetName]"
 poland_commi.15.d: "The Polish government intends to establish contacts with us and develop full-fledged cooperation. It seems that European countries are beginning to seek dialogue with us."
 poland_commi.15.a: "We Are Ready to Cooperate."
 poland_commi.15.b: "We Don't Need It."
 poland_commi.16.t: "Cooperation with [NKO.GetName]"
 poland_commi.16.d: "Their government refused to cooperate with us, and they don't seem to need a partnership with us."
 poland_commi.16.a: "Sad"
 poland_commi.17.t: "Arms Sales To Poland [POL.GetName]"
 poland_commi.17.d: "We can expand our partnership with Poland and offer them to buy our weapons"
 poland_commi.17.a: "Good Idea"
 poland_commi.17.b: "No"
 poland_commi.18.t: "[NKO.GetName] Offers Us To Buy Weapons"
 poland_commi.18.d: "The North Korean government has decided to expand its partnership with us and is ready to offer us some of its weapons. Do we need them?"
 poland_commi.18.a: "Good Idea"
 poland_commi.18.b: "No"
 poland_commi.19.t: "Arms Deal With [POL.GetName]"
 poland_commi.19.d: "The Polish government has agreed to sign an agreement to purchase our weapons."
 poland_commi.19.a: "Nice"
 poland_commi.20.t: "Arms Deal With [POL.GetName]"
 poland_commi.20.d: "The Polish government refused to sign an agreement to purchase our weapons"
 poland_commi.20.a: "Sad"
 poland_commi.21.t: "Polish Peacekeepers"
 poland_commi.21.d: "The Polish government is proposing to deploy its peacekeepers at one of our bases, claiming that they are ready to guarantee the security of our country from its neighbors."
 poland_commi.21.a: "We Agree"
 poland_commi.21.b: "No"
 poland_commi.22.t: "Our Peacekeepers in [PMR.GetName]"
 poland_commi.22.d: "The Transnistrian government has agreed to host our peacekeepers"
 poland_commi.22.a: "Nice"
 poland_commi.23.t: "Our Peacekeepers in [PMR.GetName]"
 poland_commi.23.d: "The Transnistrian government refused our request to deploy peacekeepers"
 poland_commi.23.a: "Sad"
 poland_commi.24.t: "Mobilization of Peacekeepers in [PMR.GetName]"
 poland_commi.24.d: "Transnistria is on the brink of war, and we can either mobilize our peacekeepers and help Transnistria, or we can send them back home."
 poland_commi.24.a: "We'll Mobilize Them"
 poland_commi.24.b: "It's Time For Them To Go Home"
 poland_commi.25.t: "Economic Cooperation With [POL.GetName]"
 poland_commi.25.d: "The Polish government is ready to sign an economic agreement with us, under which we will receive good investments, and they will open visas for our workers to enter their country, which will also bring us some income in the future."
 poland_commi.25.a: "We Agree"
 poland_commi.25.b: "No"
 poland_commi.26.t: "Economic Cooperation With [LAO.GetName]"
 poland_commi.26.d: "They agreed to sign an economic cooperation agreement with us"
 poland_commi.26.a: "Nice"
 poland_commi.27.t: "Economic Cooperation With [LAO.GetName]"
 poland_commi.27.d: "They refused to sign an economic cooperation agreement with us"
 poland_commi.27.a: "Sad"
 poland_commi.28.t: "Economic Cooperation With [POL.GetName]"
 poland_commi.28.d: "The Polish government is ready to sign an economic agreement with us, under which we will receive good investments, and they will open visas for our workers to enter their country, which will also bring us some income in the future."
 poland_commi.28.a: "We Agree"
 poland_commi.28.b: "No"
 poland_commi.29.t: "Economic Cooperation With [VIE.GetName]"
 poland_commi.29.d: "They agreed to sign an economic cooperation agreement with us"
 poland_commi.29.a: "Nice"
 poland_commi.30.t: "Economic Cooperation With [VIE.GetName]"
 poland_commi.30.d: "They refused to sign an economic cooperation agreement with us"
 poland_commi.30.a: "Sad"
 poland_commi.31.t: "Economic Cooperation With [POL.GetName]"
 poland_commi.31.d: "The Polish government is offering us an economic partnership that will involve many sectors of our economies, and it could be the beginning of a new era of friendship between our countries. Are we ready for this?"
 poland_commi.31.a: "Yes"
 poland_commi.31.b: "No"
 poland_commi.32.t: "Economic Cooperation With [SER.GetName]"
 poland_commi.32.d: "They agreed to sign an economic cooperation agreement with us"
 poland_commi.32.a: "Nice"
 poland_commi.33.t: "Economic Cooperation With [SER.GetName]"
 poland_commi.33.d: "They refused to sign an economic cooperation agreement with us"
 poland_commi.33.a: "Sad"
 poland_commi.34.t: "Economic Cooperation With [POL.GetName]"
 poland_commi.34.d: "The Polish government is offering us an economic partnership, and as a starting point for this partnership, it is offering to help us in the field of oil and gas production. Polish oil companies are ready to sign an agreement on oil and gas exploration in our country."
 poland_commi.34.a: "We Need This"
 poland_commi.34.b: "No"
 poland_commi.35.t: "Economic Cooperation With [CUB.GetName]"
 poland_commi.35.d: "They agreed to sign an economic cooperation agreement with us"
 poland_commi.35.a: "Nice"
