 # KONF AI LOC 
 POL_conf_lib_ind_desc: "Konfederacja Wolność i Niepodległość consolidates as a radical right-wing political force, uniting libertarians, nationalists, and traditionalists under a common banner of staunch anti-EU sentiment, economic liberalism, and social conservatism."
 POL_polish_traditionalism_desc: "The promotion of a social order rooted in Poland's historical traditions, customs, and folkways, positioning them as the antidote to modern liberal globalization and the foundation of a healthy national community."
 POL_polish_nationalism_desc: "An ideology that places the Polish ethno-nation at the center of state policy, advocating for its interests above all others and viewing national identity as the primary source of political legitimacy."
 POL_polish_ethnocracy_desc: "The advocacy for a state model where political power and national identity are formally linked to Polish ethnicity, potentially marginalizing national minorities and prioritizing the interests of the ethnic majority in law and policy."
 POL_conservative_approach_desc: "A general philosophy of governance that values prudence, historical continuity, and skepticism toward rapid social change, seeking to preserve established institutions and cultural norms."
 POL_right_socialism_desc: "A syncretic ideology combining nationalist and traditionalist social policies with elements of state intervention in the economy to support ethnic Polish families and workers, distinct from both free-market capitalism and left-wing socialism."
 POL_korwins_gambit_desc: "A high-risk political and economic strategy championed by Janusz Korwin-Mikke, involving radical libertarian reforms, a confrontational stance towards the political establishment, and a gamble on attracting disaffected voters."
 POL_preservation_of_christian_moral_principles_desc: "A core policy of legally enshrining Catholic moral teachings as the basis for public life, influencing legislation on family, education, and culture to combat secularization."
 POL_restoration_of_polish_culture_desc: "A state-led initiative to purge perceived foreign influences and promote authentically Polish art, history, and values in the public sphere, aiming to reassert national cultural sovereignty."
 POL_support_the_traditional_family_model_desc: "Active government support for families based on a married heterosexual couple, through financial benefits, tax incentives, and legal frameworks that discourage alternative family structures."
 POL_banning_LGBTQ_rights_desc: "The pursuit of legislation to prohibit the 'promotion' of LGBTQ identities and restrict the legal recognition of same-sex relationships, framed as a defense of children and traditional values."
 POL_strengthening_role_of_family_desc: "Policies designed to make the traditional family the central unit of society, granting it greater autonomy from the state while supporting it financially and legally as the primary source of social welfare."
 POL_commitment_to_faith_desc: "A personal and political pledge to uphold the tenets of the Catholic faith, influencing decision-making and fostering a close alliance between the state and the Church hierarchy."
 POL_respect_for_historical_values_desc: "An educational and cultural policy focused on celebrating Poland's heroic past, particularly its struggles for independence, and instilling patriotic pride in the younger generation."
 POL_combating_increasing_migration_desc: "A strict policy of opposing and preventing immigration, particularly from Muslim-majority countries, citing threats to national security, social cohesion, and cultural identity."
 POL_polonization_of_migrants_desc: "A policy demanding the forced cultural and linguistic assimilation of any admitted minorities, requiring them to abandon their previous identity and fully adopt Polish language and customs."
 POL_restore_the_death_penalty_desc: "A push to reintroduce capital punishment for the most serious crimes, arguing it serves as a just retribution and an effective deterrent against heinous acts."
 POL_abolition_of_income_tax_desc: "A radical libertarian proposal to completely eliminate the personal income tax, aiming to stimulate economic growth, increase individual freedom, and drastically reduce the size of government."
 POL_school_voucher_program_desc: "A reform to replace direct state funding for schools with vouchers for parents, promoting school choice and competition while favoring private and religious education institutions."
 POL_creation_of_cultural_vouchers_desc: "A system providing citizens with vouchers to spend on private cultural institutions, aiming to decentralize state funding and empower individual choice in the cultural market."
 POL_reducing_government_spending_desc: "A fundamental commitment to slash public expenditure across most sectors, seeking to achieve a minimal state, lower taxes, and reduce the national debt."
 POL_new_healthcare_program_desc: "A comprehensive overhaul of the healthcare system towards a predominantly private and insurance-based model, reducing the state's role to a minimum and promoting market mechanisms."
 POL_business_reforms_desc: "A package of deregulation measures designed to eliminate bureaucratic red tape, simplify the tax code, and create a more favorable environment for entrepreneurs and businesses."
 POL_firearms_licenses_desc: "The liberalization of gun laws to make firearms more accessible to law-abiding citizens, framed as a fundamental right to self-defense and a deterrent against crime."
 POL_new_constitution_of_poland_desc: "The drafting and adoption of constitution to replace the 1997 document, aiming to redefine Poland as a strongly presidential, decentralized, and explicitly Christian republic."
 POL_return_to_royalism_desc: "A niche but symbolic political movement advocating for the restoration of the Polish monarchy, either as a constitutional figurehead or a powerful sovereign, as a solution to partisan strife."
 POL_presidential_system_desc: "A constitutional reform to establish a strong, executive-led presidential republic, where the president holds significant power over the government and legislature, reducing the role of parliament."
 POL_reducing_role_of_sejm_desc: "A reform to significantly limit the powers of the lower house of parliament (Sejm), transferring its legislative initiative and oversight capabilities to the executive branch."
 POL_reducing_power_of_the_senate_desc: "The marginalization or even abolition of the Senate, the upper house of parliament, viewed as an unnecessary and obstructive relic in the law-making process."
 POL_creation_of_state_council_desc: "The establishment of a powerful, non-elected advisory body composed of esteemed figures to counsel the president on key matters of state, potentially bypassing traditional parliamentary channels."
 POL_rule_of_law_desc: "An interpretation of the rule of law that emphasizes the literal text of legislation and the sovereignty of national law over international courts and treaties."
 POL_principle_of_subsidiarity_desc: "The implementation of the political principle that social and political issues should be dealt with at the most immediate (or local) level that is consistent with their resolution."
 POL_we_dont_need_european_union_desc: "A foundational policy advocating for Poland's immediate withdrawal from the European Union, which is depicted as a bureaucratic, socialist, and sovereignly-suicidal project."
 POL_nuclearization_of_poland_desc: "A bold initiative to acquire a national nuclear deterrent, either through indigenous development or purchase from a friendly power, to guarantee Poland's security independently of any alliances."
 POL_decline_of_german_and_us_influence_desc: "A foreign policy objective to systematically reduce the political, economic, and military influence of both Germany and the United States over Poland, seeking a truly independent course."
 POL_reconciliation_with_belarus_desc: "A diplomatic overture to normalize relations with Belarus, regardless of its government, based on shared Slavic heritage and pragmatic economic and security interests."
 POL_normalization_of_relations_with_russia_desc: "A highly controversial policy of seeking to end the confrontation with Russia, arguing for pragmatic cooperation on trade and security while downplaying historical and current conflicts."
 POL_double_defense_spending_desc: "A commitment to a massive increase in military expenditure to rapidly modernize the armed forces, aiming for self-reliance and a powerful deterrent capability."
 POL_russophile_rhetoric_desc: "The adoption of a political narrative sympathetic to the Russian perspective on international affairs, often blaming NATO and the EU for provoking tensions and advocating for closer ties with Moscow."
 POL_leave_NATO_korwin_desc: "A radical proposal for Poland to withdraw from the North Atlantic Treaty Organization, arguing that the alliance unnecessarily provokes Russia and compromises Polish sovereignty."
 POL_together_with_russia_against_usa_desc: "The most extreme foreign policy stance, envisioning a strategic realignment where Poland partners with a resurgent Russia to counter American global hegemony and German dominance in Europe."
 POL_unity_of_party_desc: "A critical initiative to overcome ideological differences between the libertarian and nationalist wings of the Confederation, forging a cohesive political force capable of implementing its radical agenda and challenging the political establishment."
 POL_new_constitution_of_Poland_desc: "The drafting and adoption of a fundamentally new constitution to replace the 1997 document, aiming to drastically limit the scope of government, protect property rights, and redefine Poland as a decentralized state based on traditional values and direct democracy mechanisms."

 




