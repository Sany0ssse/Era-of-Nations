l_english:
 eon_withdraw_antiterror_proposal:0 "Withdraw counterterrorism proposal"
 eon_withdraw_antiterror_proposal_desc:0 "Only the original proposer can withdraw its unaccepted counterterrorism proposal. Withdrawal is free; the 75 political power spent on the proposal is not refunded. The original response keeps this pair reserved until it is closed or its 30-day window expires. An unanswered expired proposal closes this pair to future counterterrorism proposals. Existing active agreements remain separate."
 eon_withdraw_antiterror_proposal_send_desc:0 "Withdraw our original counterterrorism proposal to [From.GetName]? Withdrawal costs no political power and cannot end an already accepted agreement. The original response keeps its reservation until it is closed or expires; an unanswered expired proposal closes this pair to future counterterrorism proposals."
 eon_ct_withdraw_tt:0 "As the original proposer, withdraw the pending proposal at no additional cost. Acceptance after withdrawal cannot start cooperation. The original response must be closed before the pair is released; expiry closes this pair to future counterterrorism proposals. The 75 political power already spent is not refunded."
 eon_ct_send_tt:0 "Both countries must be free of other pending counterterrorism proposals. The recipient must have an opinion above 9 of us; neither it nor its allies may be at war with us. Sending costs 75 political power and starts the existing 120-day sending cooldown. The reply is due within 30 days. Cooperation starts only after current valid consent: each partner gains +0.05 counterterrorism effectiveness and reserves 5 maximum command power, with the existing +5 AI compensation. Standard counterterrorism operations remain subject to their own conditions and do not guarantee success."
 eon_ct_end_tt:0 "End this counterterrorism agreement without the other country's approval for the existing cost of 75 political power. Remove this partner's cooperation opinion and reverse its identifiable contribution once: -0.05 effectiveness, release the 5 command-power reservation and remove the existing +5 AI compensation. Other partners and their contributions remain separate. The existing 120-day sending cooldown applies."
