l_english:
 eon_services_logistics_offer_tt:0 "Offer logistics support for 3 treasury, payable only if this country agrees. Support lasts up to 80 days. Sending a proposal is free; it can be withdrawn during the 30-day reply window."
 eon_services_recon_offer_tt:0 "Offer reconnaissance support for 4 treasury, payable only if this country agrees. Support lasts up to 80 days. Sending a proposal is free; it can be withdrawn during the 30-day reply window."
 eon_services_logistics_terms_tt:0 "Pay 3 treasury in advance for up to 80 days of logistics support: supply consumption -3%, army fuel consumption -3%, air fuel consumption -2%, navy fuel consumption -1%, army organisation +2%. The fee is not refunded if cooperation ends early. Either country may end it; it also ends when the recipient returns to peace, the partners go to war with each other, the provider ceases to exist, the service expires or its national spirit disappears."
 eon_services_recon_terms_tt:0 "Pay 4 treasury in advance for up to 80 days of reconnaissance support: reconnaissance +3%, night attack +2%, reinforcement rate +8 percentage points. The fee is not refunded if cooperation ends early. Either country may end it; it also ends when the recipient returns to peace, the partners go to war with each other, the provider ceases to exist, the service expires or its national spirit disappears."
 eon_services_decline_tt:0 "Decline or close this unpaid proposal. A withdrawn or no longer valid offer cannot charge a fee or start a service. Refusing a currently payable eligible proposal retains the existing domestic-influence consequence."
 eon_services_unmatched_tt:0 "This proposal is no longer current. No payment will be made and no service will begin."
 eon_services_legacy_desc:0 "This earlier proposal can no longer be confirmed. Close it and request a fresh proposal with the current service, price and terms. Closing it charges no fee and does not end an existing service."
 eon_services_legacy_close_tt:0 "Close the earlier proposal without payment. Current agreements and new proposals continue under their own terms."
 eon_services_withdraw_offer:0 "Withdraw military-service proposal"
 eon_services_withdraw_offer_desc:0 "Withdraw our unpaid logistics or reconnaissance proposal for free. The original reply must still be closed within its 30-day window. If it remains unanswered after that deadline, further military-service proposals to this partner become permanently unavailable in this campaign."
 eon_services_withdraw_offer_send_desc:0 "Withdraw this unpaid proposal. The original reply must still be closed; if its 30-day deadline passes unanswered, further military-service proposals to this partner become permanently unavailable in this campaign."
 eon_services_end_logistics:0 "End logistics cooperation"
 eon_services_end_logistics_desc:0 "End logistics support in both directions with this partner for free. Neither country receives a refund of its upfront fee. Reconnaissance support, other partners and pending proposals are unaffected."
 eon_services_end_logistics_send_desc:0 "End logistics support in both directions with this partner. Upfront fees are not refunded."
 eon_services_end_recon:0 "End reconnaissance cooperation"
 eon_services_end_recon_desc:0 "End reconnaissance support in both directions with this partner for free. Neither country receives a refund of its upfront fee. Logistics support, other partners and pending proposals are unaffected."
 eon_services_end_recon_send_desc:0 "End reconnaissance support in both directions with this partner. Upfront fees are not refunded."
 eon_services.ack:0 "Understood"
 eon_services.1.t:0 "Military-service proposal"
 eon_services.1.d:0 "[FROM.GetName] offers temporary military support. The available acceptance button shows the proposed service, its upfront price and the maximum 80-day term. Agreement requires our consent and payment, together with continued eligibility between the countries. Either country may later end the service under the stated terms. The provider may withdraw this proposal; the reply window is 30 days."
 eon_services.1.a:0 "Accept logistics: 3 treasury, up to 80 days"
 eon_services.1.b:0 "Accept reconnaissance: 4 treasury, up to 80 days"
 eon_services.1.c:0 "Decline or close this unpaid proposal"
 eon_services.2.t:0 "Military service accepted"
 eon_services.2.d:0 "The partner accepted our service proposal and paid its fee. Support lasts up to 80 days under the agreed ending conditions. Either country may end cooperation early; the upfront fee is not refunded."
 eon_services.3.t:0 "Military-service proposal withdrawn"
 eon_services.3.d:0 "The provider withdrew this unpaid proposal. Close the original reply without payment. If its original 30-day deadline passes unanswered, further military-service proposals between this provider and recipient become permanently unavailable in this direction for the current campaign."
 eon_services.4.t:0 "Unanswered service route closed"
 eon_services.4.d:0 "The earlier proposal expired or could no longer be confirmed with the original partner. No fee was paid. Further logistics and reconnaissance proposals to that partner are permanently unavailable in this campaign. Cooperation with other partners remains possible."
 eon_services.5.t:0 "Military-service proposal record unverifiable"
 eon_services.5.d:0 "The earlier proposal could not be safely reconciled with the original agreement and partner. Further military-service proposals from our country cannot be reopened in this campaign. No fee was charged, and existing paid services continue under their own terms."
 eon_services.7.t:0 "Military-service cooperation ended"
 eon_services.7.d:0 "Cooperation of the selected service type ended in both directions with this partner wherever a service was in force. Upfront fees are not refunded. Other service types, other partners and pending proposals are unaffected."
 eon_services.8.t:0 "Military-service proposal closed"
 eon_services.8.d:0 "The proposal was declined or could no longer be accepted on its current terms. No fee was paid and no service began."
