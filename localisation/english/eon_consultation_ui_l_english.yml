l_english:
 eon_consultation_ui_category:0 "Bilateral Consultations"
 eon_consultation_ui_category_desc:0 "An accepted consultation opens a discussion channel for 30 days. Select the row for your partner. Grey buttons explain their requirements. Every treaty, electricity offer, grant or debt payment retains its own conditions and separate consent. Closing this channel leaves those processes intact."
 eon_open_consultation_panel:0 "Open Current Consultation Panel"
 eon_open_consultation_panel_desc:0 "Show the agreed topic and where to find the available actions for this partner."
 eon_open_consultation_panel_send_desc:0 "Show consultation information for [THIS.GetNameWithFlag]. To act, open Decisions → Bilateral Consultations. Opening this information costs nothing, does not extend the channel and creates no agreement."
 eon_consultation_ui_panel_ready_tt:0 "The countries hold the same accepted consultation. Opening its information costs nothing; expired or wartime channels allow information and closure only."
 eon_consultation_ui_ack:0 "Close this information"
 eon_consultation_ui_status:0 "Open consultation panel: [From.GetName]"
 eon_consultation_ui_status_desc:0 "Partner: [From.GetName]. Topic: [eon_consultation_ui_topic_label]. Trade agreement: [eon_consultation_ui_trade_standing_label]. Recorded termination clause: [eon_framework_negotiation_trade_clause_label]. Show the current topic and instructions for this partner. Use the other rows in this category to make actual proposals. This information neither extends talks nor commits funds."
 eon_consultation_ui_status_ready_tt:0 "A matching accepted channel still belongs to these two countries. This button only shows information."
 eon_consultation_ui_end:0 "End consultations: [From.GetName]"
 eon_consultation_ui_end_desc:0 "Close the matching discussion channel at no cost. Existing agreements and separately submitted proposals continue under their own rules. This remains available for a matching channel whose time has expired or whose countries are at war."
 eon_consultation_ui_end_ready_tt:0 "Both countries still hold this same agreed channel. Closure costs nothing and cancels no separate treaty, supply, grant or debt proposal."
 eon_consultation_ui_trade_review:0 "Review trade proposal: [From.GetName]"
 eon_consultation_ui_trade_review_desc:0 "Read and assess this partner’s current framework proposal or mutual-termination request before responding. Review has no political or financial cost."
 eon_consultation_ui_trade_review_ready_tt:0 "A live trade consultation and a matching incoming framework proposal are required. This round has not yet been reviewed."
 eon_consultation_ui_trade_decline:0 "Decline trade proposal: [From.GetName]"
 eon_consultation_ui_trade_decline_desc:0 "Decline the separately reviewed framework proposal or mutual-termination request. The existing framework refusal rules apply; the consultation stays open."
 eon_consultation_ui_trade_decline_ready_tt:0 "The live trade channel has a matching incoming proposal, and this exact round has been reviewed."
 eon_consultation_ui_trade_withdraw:0 "Withdraw our trade proposal: [From.GetName]"
 eon_consultation_ui_trade_withdraw_desc:0 "Withdraw our unanswered framework proposal through its ordinary handler. Political effort already spent is not refunded. The consultation and independent contracts remain separate."
 eon_consultation_ui_trade_withdraw_ready_tt:0 "The live trade channel has our matching unanswered framework proposal. A proposal sent by the partner cannot be withdrawn on their behalf."
 eon_consultation_ui_energy_editor:0 "Open electricity offer editor: [From.GetName]"
 eon_consultation_ui_energy_editor_desc:0 "Open the existing quantity and price editor with this partner selected. A standing electricity agreement is required. Opening the editor sends nothing; submission and the partner’s reply follow the ordinary energy process. Positive GW: buy from this country. Negative GW: sell to it. Price is in $ billions per GW per week. Confirming zero quantity ends an existing bilateral delivery contract through the ordinary energy controls; it is not a new purchase offer."
 eon_consultation_ui_energy_editor_ready_tt:0 "A live electricity channel, reciprocal electricity agreement and consistent contract records are required. Neither side may have a pending electricity offer or counteroffer draft. Close or resolve that offer first. Close the ordinary unsent editor or country-selection list first; opening this consultation editor must not overwrite another draft."
 eon_consultation_ui_aid_draft:0 "Prepare a grant: [From.GetName]"
 eon_consultation_ui_aid_draft_desc:0 "Open the existing 5/15/35 billion grant selection for this partner. Preparation sends no money. Selecting a funded offer uses the normal escrow and recipient acceptance process."
 eon_consultation_ui_aid_draft_ready_tt:0 "A live support consultation and all ordinary aid conditions are required: influence and economic eligibility, national restrictions, no reserved aid draft on either side, no donor cooldown for this recipient and at least $5 billion available in the treasury. Consultations grant no exception."
 eon_consultation_ui_debt_guidance:0 "How to propose debt repayment: [From.GetName]"
 eon_consultation_ui_debt_guidance_desc:0 "Show the exact existing diplomacy button and its conditions. This button creates no debt proposal and charges nothing."
 eon_consultation_ui_debt_guidance_ready_tt:0 "A matching support consultation exists. This is information only; the separate debt proposal is sent through the partner’s diplomacy screen."
 eon_consultation_ui.1.t:0 "Current Bilateral Consultation"
 eon_consultation_ui.1.trade:0 "Partner: [From.GetNameWithFlag].\n\nOpen §YDecisions → Bilateral Consultations§!. Propose a trade framework with a 90- or 180-day termination notice. These are notice periods, not the treaty’s duration. Sending costs 75 political power; the partner reviews this separate proposal and then accepts, refuses or counters.\n\nCurrent proposal: [eon_framework_negotiation_trade_pending_label].\nExisting agreement: [eon_consultation_ui_trade_standing_label].\nRecorded termination clause: [eon_framework_negotiation_trade_clause_label].\n\nUse the rows for this partner. Grey buttons show their conditions. After talks end, a separately submitted framework remains available in §Y$eon_framework_negotiation_category$§!. This information button signs nothing."
 eon_consultation_ui.1.energy:0 "Partner: [From.GetNameWithFlag].\n\nOpen §YDecisions → Bilateral Consultations → Open electricity offer editor§!. The existing editor selects this partner. For a nonzero quantity, set volume and price there and submit the separate offer; the partner must still agree. Opening this panel or editor changes no supply or money.\n\nIf no reciprocal electricity agreement exists, first open this country’s diplomacy and use §Y$ENERGY_CONTRACT_AGREEMENT_TITLE$§!. Pending offers or counteroffer drafts must be resolved before opening a fresh editor. Grey decision buttons explain these conditions. Positive GW: buy from this country. Negative GW: sell to it. Price is in $ billions per GW per week. Confirming zero quantity ends an existing bilateral delivery contract through the ordinary energy controls; it is not a new purchase offer. Close the ordinary unsent editor or country-selection list first; opening this consultation editor must not overwrite another draft."
 eon_consultation_ui.1.support:0 "Partner: [From.GetNameWithFlag].\n\nOpen §YDecisions → Bilateral Consultations → Prepare a grant§! for the existing 5/15/35 billion amount selection. Ordinary national, influence, economic and treasury conditions still apply. Preparing the draft pays nothing; sending a funded amount and the recipient’s consent are separate steps.\n\nOur aid process: [eon_consultation_ui_aid_draft_label].\n\nFor debt relief, use §YHow to propose debt repayment§! here, then send the real proposal through this country’s diplomacy. Opening this information promises or transfers no money."
 eon_consultation_ui.1.closed:0 "This information no longer corresponds to a live peaceful consultation between these participants. The channel may have expired, ended or become invalid. Close this information and check §YDecisions → Bilateral Consultations§! again. A matching expired or wartime channel can be ended there until cleanup. Separate proposals and contracts follow their own rules; this old panel changes none of them."
 eon_consultation_ui.2.t:0 "Separate Debt Repayment Proposal"
 eon_consultation_ui.2.d:0 "Open [From.GetName]’s diplomacy and select §Y$DIPLO_ACTION_ASSUME_DEBT_TITLE$§!. Send the actual proposal there; this information button cannot send it.\n\nThe existing action costs 75 political power and freezes a proposal for 25% of the recipient’s current debt. It requires the ordinary national, opinion, economic, peace and treasury conditions, and no other pending debt offer from the donor. The recipient must separately accept. Treasury and debt change only on actual acceptance, with the frozen repayment limited by the debt still outstanding. Consultations waive no condition and guarantee no acceptance."
 eon_consultation_ui_trade_standing_yes:0 "An agreement already exists; a second agreement cannot be proposed."
 eon_consultation_ui_trade_standing_no:0 "No agreement is currently recorded for this pair."
 eon_consultation_ui_aid_draft_busy:0 "A grant draft or response is already reserved. Resolve it first."
 eon_consultation_ui_aid_draft_free:0 "No aid process is reserved on our side; ordinary recipient eligibility still applies."
 eon_consultation_ui_trade_propose_90:0 "Propose trade framework (90-day termination notice): [From.GetName]"
 eon_consultation_ui_trade_propose_90_desc:0 "Send a separate framework proposal with a 90-day termination notice. Sending costs 75 political power through the existing negotiation handler. The partner must review and separately agree; this does not place an order for goods."
 eon_consultation_ui_trade_propose_90_ready_tt:0 "The trade channel is live, we have at least 75 political power, neither side has a trade agreement or pending framework for this pair, and the ordinary national, opinion and allied-country conditions permit this proposal."
 eon_consultation_ui_trade_accept_90:0 "Accept trade framework (90-day termination notice): [From.GetName]"
 eon_consultation_ui_trade_accept_90_desc:0 "Explicitly accept this separately reviewed incoming framework with its recorded 90-day termination notice. This signs the trade framework through its original handler, at no additional political cost. It is not a purchase or delivery contract."
 eon_consultation_ui_trade_accept_90_ready_tt:0 "The live trade channel has a current incoming proposal with a 90-day notice; this exact round has been reviewed, and its ordinary signing conditions still hold."
 eon_consultation_ui_trade_counter_90:0 "Counter with trade framework (90-day termination notice): [From.GetName]"
 eon_consultation_ui_trade_counter_90_desc:0 "Offer a 90-day termination notice instead of the reviewed incoming terms. This costs 75 political power and uses the existing maximum of three rounds. The partner must review and consent again; no agreement is signed by the counteroffer."
 eon_consultation_ui_trade_counter_90_ready_tt:0 "The live trade channel has a reviewed incoming proposal with different terms; fewer than three rounds have been used. We have at least 75 political power and the ordinary proposal conditions still hold."
 eon_consultation_ui_trade_propose_180:0 "Propose trade framework (180-day termination notice): [From.GetName]"
 eon_consultation_ui_trade_propose_180_desc:0 "Send a separate framework proposal with a 180-day termination notice. Sending costs 75 political power through the existing negotiation handler. The partner must review and separately agree; this does not place an order for goods."
 eon_consultation_ui_trade_propose_180_ready_tt:0 "The trade channel is live, we have at least 75 political power, neither side has a trade agreement or pending framework for this pair, and the ordinary national, opinion and allied-country conditions permit this proposal."
 eon_consultation_ui_trade_accept_180:0 "Accept trade framework (180-day termination notice): [From.GetName]"
 eon_consultation_ui_trade_accept_180_desc:0 "Explicitly accept this separately reviewed incoming framework with its recorded 180-day termination notice. This signs the trade framework through its original handler, at no additional political cost. It is not a purchase or delivery contract."
 eon_consultation_ui_trade_accept_180_ready_tt:0 "The live trade channel has a current incoming proposal with a 180-day notice; this exact round has been reviewed, and its ordinary signing conditions still hold."
 eon_consultation_ui_trade_counter_180:0 "Counter with trade framework (180-day termination notice): [From.GetName]"
 eon_consultation_ui_trade_counter_180_desc:0 "Offer a 180-day termination notice instead of the reviewed incoming terms. This costs 75 political power and uses the existing maximum of three rounds. The partner must review and consent again; no agreement is signed by the counteroffer."
 eon_consultation_ui_trade_counter_180_ready_tt:0 "The live trade channel has a reviewed incoming proposal with different terms; fewer than three rounds have been used. We have at least 75 political power and the ordinary proposal conditions still hold."
 EON_OPEN_CONSULTATION_PANEL_TITLE:0 "$eon_open_consultation_panel$"
 EON_OPEN_CONSULTATION_PANEL_ACTION_DESC:0 "$eon_open_consultation_panel_desc$"
 eon_consultation_ui_trade_notice:0 "Give contractual termination notice: [From.GetName]"
 eon_consultation_ui_trade_notice_desc:0 "Use the existing framework handler to give the agreed 90- or 180-day notice. Notification costs 75 political power. The agreement remains effective until its notice period ends; separate deliveries and projects keep their own obligations. Legacy agreements without recorded clauses allow mutual termination only."
 eon_consultation_ui_trade_notice_ready_tt:0 "The trade channel is live, both sides record the same positive contract and 90/180-day clause, no notice is already open, and we have at least 75 political power. The ordinary national condition still applies."
 eon_consultation_ui_trade_end_request:0 "Request mutually agreed termination: [From.GetName]"
 eon_consultation_ui_trade_end_request_desc:0 "Submit a separate request to end this standing trade framework early by mutual consent. This costs 75 political power and needs the partner’s review and consent. Sending the request does not terminate the treaty or end the consultation."
 eon_consultation_ui_trade_end_request_ready_tt:0 "The trade channel and standing framework are current; neither side has a pending framework request for this pair. We have at least 75 political power and the ordinary national condition permits submission."
 eon_consultation_ui_trade_end_accept:0 "Agree to mutual termination: [From.GetName]"
 eon_consultation_ui_trade_end_accept_desc:0 "Explicitly accept the reviewed request to end this exact standing trade framework. This invokes the existing termination handler at no additional political cost. Independent supply contracts, project principal and financial proposals are not cancelled."
 eon_consultation_ui_trade_end_accept_ready_tt:0 "The live trade channel has a reviewed incoming mutual-termination request tied to the same current contract on both sides. A stale request cannot end another agreement."
 eon_consultation_ui_topic_trade:0 "Trade and commercial cooperation"
 eon_consultation_ui_topic_energy:0 "Electricity supply and contracts"
 eon_consultation_ui_topic_support:0 "Economic assistance and debt repayment"
 eon_consultation_ui_topic_unknown:0 "No matching recorded topic"
