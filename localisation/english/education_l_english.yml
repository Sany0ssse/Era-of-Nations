l_english:

 # DYNAMIC MODIFIER
 education_dynamic_modifier: "Literacy Rate Dynamic Modifier"
 education_dynamic_modifier_desc: "With increased funding, a steady hand at the helm and some patience, this nation can expect to see the §YLiteracy Rate§! increase. A higher literacy rate will lead to more productivity in educated sectors, such as §HOffice Jobs§!.\n\nHowever, there are still advantages to a lower literacy rate for a predominantly §YAgrarian Based Economy§!, especially in regions where manual labor and traditional farming remain the backbone of society..."

 # DECISIONS
 education_category: "Literacy Rates in [ROOT.GetNameWithFlag]"
 education_category_desc: "As a nation that struggles to provide its population with the education it needs, [ROOT.GetName] needs to manage its education budget effectively so it can reduce the penalties of §Y$education_dynamic_modifier$§!. You will be given a report on the §YLiteracy Rate§! annually around the end of the school year.\n§YEvents§!, §YDecisions§! and choices made in the §YFocus Tree§! may increase or decrease this rate.\n\nAt a §YLiteracy Rate§! of 95%, [ROOT.GetName] will lose this mechanic. It will return if the §YLiteracy Rate§! falls below 90%. This may happen due to various factors.\n\n[ROOT.GetNameWithFlag]'s Current §YLiteracy Rate§!: [?ROOT.literacy_rate|%2]"

 # UNUSED CONTENT (FOR NOW)
 # literacy_up_drift_active: "§YLiteracy Rates§! §Gare currently increasing due to our education spending!§!"
 # literacy_down_drift_active: "§YLiteracy Rates§! §Rare currently decreasing due to our withholding of education spending!§!"

 # TOOLTIPS
 # EFFECT TOOLTIPS
 literacy_rate_change_TT: "§YLiteracy Rate§! changes by [?LR_change|+%2]"
 literacy_rate_change_event_TT: "§YLiteracy Rate§! changes by [?literacy_change_stored|+%2]"
 # IN GAME TOOLTIPS
 lit_rate_TT_yes: "\n\n[FROM.GetName] currently has a §YLiteracy Rate§! of [?FROM.literacy_rate|Y%2]. This will affect [ROOT.GetName]'s §YLiteracy Rate§! if annexation occurs!"

 # EVENTS
 education.1.t: "Education Minister Reports High Literacy Rates!"
 education.1.d: "Our prudent education funding and expertly managed curricula have seemingly paid off. With a literacy rate above 95%, we can now call ourselves a highly educated, well-learned society with little resistance from naysayers both within and outside our borders. Having achieved this monumental goal, we will no longer receive annual reports on our nation's literacy rates."
 education.1.A: "Do I still get my daily apple?"

 education.2.t: "Education Minister Reports Faltering Literacy Rates!"
 education.2.d: "Despite our best efforts, our literacy rate seems to have fallen. Whether this is due to wavering support for the education system or a massive influx of less literate newcomers is anyone's guess; we will once more receive annual reports on our nation's literacy rates."
 education.2.A: "Where are my alphabet books?"

 education_literacy_pulse.1.t: "School's Out For Summer!"
 education_literacy_pulse.1.d: "While school is out for summer, we still hope our students salute the flag, no matter how bad the results. The reports are in and our students' exams have been tallied. No matter what happens, let's hope they make themselves useful, shall we?"
 education_literacy_pulse.1.A: "I hope our grades are good."