 #Portugal
 #Ideas
 POR_lusitania_security_foreign: "[POR.GetFlag]PMC Lusitânia Defence"
 POR_lusitania_security_foreign_desc: "Founded in the late 1990s by former Comandos and Fuzileiros veterans seeking to capitalise on their expertise after decades of colonial and overseas deployments. Initially a training consultancy, Lusitânia Defence expanded rapidly, securing contracts to protect Portuguese diplomatic missions in volatile regions and provide security for resource extraction companies in Lusophone Africa. Operates under Portuguese corporate law but maintains close informal ties with the armed forces, serving as a discreet instrument for national interests abroad."
 #Events
 pmc_events.18.t: "PMC Lusitânia Defence Offers its Services"
 pmc_events.18.d: "The relatively recently established Portuguese PMC, Lusitânia Defence, offers its services to our government in certain areas of activity. Should we sign a contract with them?"
 pmc_events.18.a: "We Agree"
 pmc_events.18.b: "We Don't Need Them"
 pmc_events.19.t: "[FROM.GetNameWithFlag] Has Signed a Contract with PMC Lusitânia Defence"
 pmc_events.19.d: "Their government has decided to sign a contract with PMC Lusitânia Defence, allowing us to gain influence in the country without directly intervening with our military forces."
 pmc_events.19.a: "Nice"
 pmc_events.20.t: "[FROM.GetNameWithFlag] Refused the Contract with PMC Lusitânia Defence"
 pmc_events.20.d: "We've received news that their government has refused to sign a contract with Lusitânia Defence, which is unfortunate."
 pmc_events.20.a: "Sad"
