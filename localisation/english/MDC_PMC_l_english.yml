l_english:
 #RUSSIA
 #Decisions
 SOV_create_pmc_wagner: "Create a §RWagner PMC§!"
 SOV_pmc_wagner_africe_goes: "Offer §RWagner PMC§! Services to §Y[FROM.GetNamewithFlag]§!"
 SOV_pmc_wagner_africe_goes_home: "Remove §RWagner PMC§! from §Y[FROM.GetNamewithFlag]§!"
 SOV_pmc_wagner_africe_perevorot_pipa: "Stage a Coup With the Help of §RWagner PMC§!"
 SOV_pmc_wagner_africe_perevorot_car: "Create [WAG.GetNameWithFlag] State in [CAR.GetNameWithFlag]"
 GENERIC_go_away_wagner: "Expel §RWagner PMC§!"
 SOV_pmc_gazprom_goes: "Offer §RGazprom PMC's§! Services to §Y[FROM.GetNamewithFlag]§!"
 #Events
 sov_gru.18.t: "Successful Coup in [FROM.GetName]"
 sov_gru.18.d: "Wagner PMC was able to carry out a successful coup in this country, and their political course will now clearly be aimed at cooperating with us"
 sov_gru.18.a: "Nice"
 sov_gru.19.t: "Coup Failed in [FROM.GetName]"
 sov_gru.19.d: "Wagner PMC failed to carry out a coup in this country, and it looks like we'll have to leave because of our little rebellion."
 sov_gru.19.a: "Sad"
 pmc_events.15.t: "Gazprom Offers the Services of its PMCs"
 pmc_events.15.d: "The Russian corporation Gazprom is now also engaged in the PMC business, and they are ready to provide us with several of their battalions for a certain fee."
 pmc_events.15.a: "We Agree"
 pmc_events.15.b: "We Don't Need Them"
 pmc_events.16.t: "[FROM.GetNameWithFlag] Hired Gazprom's PMCs"
 pmc_events.16.d: "Their government has agreed to hire the PMC battalions provided by Gazprom, and they seem interested in our services."
 pmc_events.16.a: "Nice"
 pmc_events.17.t: "[FROM.GetNameWithFlag] Refused to Hire Gazprom's PMCs"
 pmc_events.17.d: "Their government refused to hire PMC battalions from Gazprom Corporation, and they seem to have enough of their own armed forces."
 pmc_events.17.a: "Sad"
 #Ideas
 SOV_gazprom_pmc: "[SOV.GetFlag]Gazprom's PMCs Battalions"
 SOV_gazprom_pmc_desc: "Several units consisting of former military personnel and those who want to earn money in the war, hired under the flag of the Russian Corporation Gazprom"

 #USA
 #Ideas
 USA_blackwater_foreign: "[USA.GetFlag]PMC Blackwater"
 USA_blackwater_foreign_desc: "A well-known American PMC that provides not only consulting services but also employs mercenaries to carry out various tasks"
 USA_mrpi_foreign: "[USA.GetFlag]PMC Military Professional Resources"
 USA_mrpi_foreign_desc: "It is not the largest, but it is quite effective, American PMC that provides consulting and training services for various government agencies, such as the police, army, etc."
 #Events
 pmc_events.8.t: "PMC Blackwater Offers its Services"
 pmc_events.8.d: "The well-known American PMC Blackwater offers us its services in many areas, from security to training our armed forces. The offer is undoubtedly interesting, but is it worth it?"
 pmc_events.8.a: "We Agree"
 pmc_events.8.b: "We Don't Need Them"
 pmc_events.9.t: "[FROM.GetNameWithFlag] Has Signed a Contract with PMC Blackwater"
 pmc_events.9.d: "Their government has decided to sign a contract with PMC Blackwater, allowing us to gain influence in the country without directly intervening with our military forces."
 pmc_events.9.a: "Nice"
 pmc_events.10.t: "[FROM.GetNameWithFlag] Refused the Contract with PMC Blackwater"
 pmc_events.10.d: "We've received news that their government has refused to sign a contract with Blackwater, which is unfortunate."
 pmc_events.10.a: "Sad"
 pmc_events.11.t: "Another PMC Blackwater Contract Has Been Completed"
 pmc_events.11.d: "The Blackwater contract was terminated, and the company completed its task in full or in part"
 pmc_events.11.a: "Ok"
 pmc_events.12.t: "PMC MRPI Offers its Services"
 pmc_events.12.d: "The well-known American PMC MRPI offers us its services in many areas, from security to training our armed forces. The offer is undoubtedly interesting, but is it worth it?"
 pmc_events.12.a: "We Agree"
 pmc_events.12.b: "We Don't Need Them"
 pmc_events.13.t: "[FROM.GetNameWithFlag] Has Signed a Contract with PMC MRPI"
 pmc_events.13.d: "Their government has decided to sign a contract with PMC MRPI, allowing us to gain influence in the country without directly intervening with our military forces."
 pmc_events.13.a: "Nice"
 pmc_events.14.t: "[FROM.GetNameWithFlag] Refused the Contract with PMC MRPI"
 pmc_events.14.d: "We've received news that their government has refused to sign a contract with MRPI, which is unfortunate."
 pmc_events.14.a: "Sad"
 #Decisions
 USA_pmc_blackwater_goes: "Offer §RBlackwater PMC§! Services to §Y[FROM.GetNamewithFlag]§!"
 USA_pmc_mrpi_goes: "Offer §RMRPI PMC§! Services to §Y[FROM.GetNamewithFlag]§!"
