l_english:
 eon_trade_treaty_no_pending_tt: "Neither country has another trade proposal awaiting a response."
 eon_trade_treaty_response_valid_tt: "This is the current proposal between both countries, and the agreement conditions still hold."
 eon_trade_treaty_propose_desc: "A Trade Agreement increases trade influence by §G100§! and mutual opinion by §G25§!. Once accepted, both countries also gain approximately §G1%§! influence over one another. The current conditions are checked again before signing."
 eon_trade_treaty_accept_desc: "[THIS.GetNameWithFlag] accepted the agreement. Both countries receive §G100§! trade influence and §G25§! mutual opinion, with approximately §G1%§! influence over one another."
 eon_trade_treaty_cancel_desc: "Ending the Trade Agreement removes its §R100§! trade influence and §R25§! mutual opinion bonuses. Both countries receive the existing §R-25§! opinion modifier for breaking the agreement; it decays over time."
