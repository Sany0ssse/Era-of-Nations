 # Ages:
 AGE_1_NAME: "Dawn of the Millennium"
 AGE_1_DESC: "The Information Age is a historic period beginning in the 21th century and characterized by the rapid shift from traditional industry that the Industrial Revolution brought through industrialization to an economy primarily based upon information technology."
 AGE_2_NAME: "War on Terror"
 AGE_2_DESC: "The war on terror, officially the Global War on Terrorism, is a global military campaign initiated by the United States following the September 11 attacks in 2001, and is one of the most recent global conflicts spanning multiple wars."
 AGE_3_NAME: "Local Confrontations"
 AGE_3_DESC: "The era of local confrontations consists of relative stability of the world, shaken only by minor conflicts that do not concern the borders of the great powers."
 AGE_4_NAME: "Second Cold War"
 AGE_4_DESC: "This era is characterized by rivalry in various interconnected networks like infrastructure, digital, production, and finance, rather than the primarily military and ideological conflict of the original Cold War."
 AGE_5_NAME: "Rising Storm"
 AGE_5_DESC: "Against the backdrop of ongoing small-scale conflicts, the great powers are preparing for a full-scale confrontation and do not rule out further escalation."
 AGE_6_NAME: "Third World War"
 AGE_6_DESC: "The world is on fire and you may have been the one who started it. Try to win, or at least survive the new Great War."

