l_english:

  #Cosmetic Tags
 CZE_SLO_czechoslovakia_commi: "Czechoslovak Socialist Republic"
 CZE_SLO_czechoslovakia_commi_DEF: "Czechoslovak Socialist Republic"
 CZE_SLO_czechoslovakia_commi_ADJ: "Czechoslovak"

 slovakian_focus: "Slovak Focus Tree"

 SLO_MODERN_DAY_DESC: "Slovakia was in a period of significant transition and international re-engagement. After the authoritarian and internationally isolated government of Vladimír Mečiar (1994-1998), a broad coalition government under Prime Minister Mikuláš Dzurinda had taken power in late 1998. By January 2000, this reform-oriented government was actively working to reintegrate Slovakia into the Western community. Its primary goals were clear: membership in the European Union and NATO. The political atmosphere was one of cautious optimism, focused on democratic consolidation and meeting the criteria for Euro-Atlantic integration."

 #Smer
 SLO_smer: "Smer - sociálna demokracia"
 SLO_smer_desc: "Reunite social democrats behind Fico's promise of restored order, generous welfare, and unapologetic national pride."
 SLO_economic_course_to_left: "Economic Course to the Left"
 SLO_economic_course_to_left_desc: "Pivot fiscal policy toward redistribution, public ownership, and protection of strategic sectors."
 SLO_father_of_all_citizens: "Father of All Citizens"
 SLO_father_of_all_citizens_desc: "Cultivate the image of a paternal leader who mediates disputes and dispenses favors across every region."
 SLO_tax_redistribution: "Tax Redistribution"
 SLO_tax_redistribution_desc: "Ratchet up levies on banks and monopolies so new revenue can finance social benefits."
 SLO_ensure_a_decent_pension: "Ensure a Decent Pension"
 SLO_ensure_a_decent_pension_desc: "Index pensions to wages, plug holes in the pay-as-you-go fund, and punish employers who evade contributions."
 SLO_statist_paternalism: "Statist Paternalism"
 SLO_statist_paternalism_desc: "Expand ministries, regulators, and subsidies so the state replaces market forces wherever voters feel vulnerable."
 SLO_there_are_only_two_genders: "There are Only Two Genders"
 SLO_there_are_only_two_genders_desc: "Codify conservative social doctrine in education, healthcare, and legal codes to reassure traditional voters."
 SLO_stop_privatization_of_healthcare: "Stop the Privatization of Healthcare"
 SLO_stop_privatization_of_healthcare_desc: "Freeze hospital sell-offs, cap private insurance profits, and direct funds to public clinics."
 SLO_ban_on_commissions_in_Slovak_banks: "Ban on Commissions in Slovak Banks"
 SLO_ban_on_commissions_in_Slovak_banks_desc: "Outlaw nuisance fees and force retail banks to provide basic accounts at transparent prices."
 SLO_nationalist_orientation_of_party: "The Nationalist Orientation of the Party"
 SLO_nationalist_orientation_of_party_desc: "Blend left-wing economics with patriotic rhetoric that defends Slovak culture from Brussels or Prague."
 SLO_stop_monopolies: "Stop Monopolies"
 SLO_stop_monopolies_desc: "Arm regulators with breakup powers and punitive fines that deter cartel behavior."
 SLO_dynamic_minimum_wage: "Dynamic Minimum Wage"
 SLO_dynamic_minimum_wage_desc: "Tie mandatory wage hikes to productivity and average pay so incomes rise automatically."
 SLO_resolve_immigration_issue: "Resolve the Immigration Issue"
 SLO_resolve_immigration_issue_desc: "Create state-run quotas, tougher borders, and integration tests to calm migration anxieties."
 SLO_ban_surrogacy: "Ban Surrogacy"
 SLO_ban_surrogacy_desc: "Criminalize commercial surrogacy and close loopholes that agencies use to rent wombs abroad."
 SLO_conduct_fiscal_consolidation: "Conduct Fiscal Consolidation"
 SLO_conduct_fiscal_consolidation_desc: "Trim inefficient spending and broaden revenues so expensive promises stay credible."
 SLO_bet_on_euroscepticism: "Bet on Euroscepticism"
 SLO_bet_on_euroscepticism_desc: "Leverage sharp rhetoric against Brussels to win concessions while keeping EU money flowing."
 SLO_strengthening_the_police: "Strengthening the Police"
 SLO_strengthening_the_police_desc: "Raise pay, procure modern gear, and centralize command so loyal police enforce the new order."
 SLO_Party_dictatorship: "Party Dictatorship"
 SLO_Party_dictatorship_desc: "Rewrite election rules, politicize courts, and capture media until Smer's dominance is unquestioned."
 SLO_preservation_of_social_democratic_values: "Preservation of Social Democratic Values"
 SLO_preservation_of_social_democratic_values_desc: "Codify a uniquely Slovak social democracy that mixes welfare populism with cultural conservatism."

 #Commi
 SLO_triumph_of_communism: "Triumph of Communism"
 SLO_triumph_of_communism_desc: "Proclaim the party's total victory over capitalism and concentrate every lever of the state in communist hands."
 SLO_power_of_labor_unions: "The Power of Labor Unions"
 SLO_power_of_labor_unions_desc: "Hand factory councils veto rights over production, wages, and hiring so unions become the backbone of governance."
 SLO_blow_to_capitalism: "A Blow to Capitalism"
 SLO_blow_to_capitalism_desc: "Seize private banks, expropriate oligarchs, and redirect their fortunes into the socialist treasury."
 SLO_ban_disloyal_political_parties: "Ban Disloyal Political Parties"
 SLO_ban_disloyal_political_parties_desc: "Outlaw opposition movements, shutter their press, and jail any leader who refuses to accept communist primacy."
 SLO_return_to_a_planned_economy: "Return to a Planned Economy"
 SLO_return_to_a_planned_economy_desc: "Rebuild a Gosplan-style apparatus that assigns inputs, outputs, and labor quotas for every sector."
 SLO_all_power_to_workers: "All Power to the Workers!"
 SLO_all_power_to_workers_desc: "Arm workplace militias and elevate soviet-style councils so workers directly administer factories."
 SLO_nationalization_of_industrial_sectors: "Nationalization of Industrial Sectors"
 SLO_nationalization_of_industrial_sectors_desc: "Expropriate heavy industry, logistics, and energy assets so profits flow back into people's enterprises."
 SLO_return_of_the_StB: "The Return of the StB"
 SLO_return_of_the_StB_desc: "Reconstitute the feared state security service to eliminate spies, saboteurs, and dissidents."
 SLO_centralization_of_power: "Centralization of Power"
 SLO_centralization_of_power_desc: "Abolish devolved governance and concentrate legislative, executive, and judicial authority within the politburo."
 SLO_complete_five_year_plan_in_four_years: "We'll Complete the Five-Year Plan in Four Years!"
 SLO_complete_five_year_plan_in_four_years_desc: "Impose punishing quotas, forced overtime, and shock-worker brigades to exceed plan targets ahead of schedule."
 SLO_take_control_of_the_media: "Take Control of the Media"
 SLO_take_control_of_the_media_desc: "Place every broadcaster, printer, and ISP under party commissars who distribute only revolutionary truth."
 SLO_proletarians_of_all_countries: "Proletarians of All Countries!"
 SLO_proletarians_of_all_countries_desc: "Broadcast agitprop abroad and fund sister parties to ignite class struggle across borders."
 SLO_preparation_proletarian_revolution_in_czech: "Preparation for the Proletarian Revolution in the Czech Republic"
 SLO_preparation_proletarian_revolution_in_czech_desc: "Smuggle weapons, cadres, and propaganda into Czech lands to destabilize their bourgeois government."
 SLO_condemn_imperialism_of_EU_and_NATO: "Condemn the Imperialism of the EU and NATO"
 SLO_condemn_imperialism_of_EU_and_NATO_desc: "Lead global tribunals, sanctions, and boycotts that brand Western alliances as colonial oppressors."
 SLO_chinese_guarantees: "Chinese Guarantees"
 SLO_chinese_guarantees_desc: "Secure loans, technology, and diplomatic cover from Beijing in exchange for ideological loyalty."
 SLO_join_russia: "Join Russia"
 SLO_join_russia_desc: "Align fully with Moscow's military and economic structures to deter Western retaliation."
 SLO_invite_north_korean_workers: "Invite North Korean Workers"
 SLO_invite_north_korean_workers_desc: "Import disciplined DPRK labor battalions to raise production while deepening ties with fellow hardliners."
 SLO_restoration_of_czechoslovakia: "Restoration of Czechoslovakia"
 SLO_restoration_of_czechoslovakia_desc: "Call for a renewed Czechoslovakia under communist rule, erasing the Velvet divorce through revolution."

 #SNS
 SLO_sns: "SNS"
 SLO_sns_desc: "Mobilize the Slovak National Party's rural base around sovereignty, cultural conservatism, and heavy-handed governance."
 SLO_banning_LGBT_rights: "Banning LGBT Rights"
 SLO_banning_LGBT_rights_desc: "Push constitutional amendments and morality laws that erase legal protections for LGBT citizens."
 SLO_economic_nationalism: "Economic Nationalism"
 SLO_economic_nationalism_desc: "Use tariffs, licensing, and patriotic procurement to privilege Slovak firms over foreign competitors."
 SLO_path_of_total_statism: "The Path of Total Statism"
 SLO_path_of_total_statism_desc: "Merge ministries and state firms into a command hierarchy that answers only to SNS leadership."
 SLO_development_of_agriculture: "Development of Agriculture"
 SLO_development_of_agriculture_desc: "Shower cooperatives and family farms with subsidies, machinery credits, and irrigation projects."
 SLO_Development_of_national_production: "Development of National Production"
 SLO_Development_of_national_production_desc: "Protect domestic manufacturers with quotas and funnel state orders through loyal factories."
 SLO_Stop_political_activity_in_media: "Stop Political Activity in the Media"
 SLO_Stop_political_activity_in_media_desc: "Purge critical commentators, ban foreign ownership, and turn broadcasters into government mouthpieces."
 SLO_Foreign_Financing_Act: "Foreign Financing Act"
 SLO_Foreign_Financing_Act_desc: "Force NGOs, media, and churches to register every foreign donation so they can be harassed or shuttered."
 SLO_deprivatization_program: "Deprivatization Program"
 SLO_deprivatization_program_desc: "Buy back or seize assets sold in the 1990s to place them under nationalist management."
 SLO_Strengthen_measures_against_illegal_migration: "Strengthen Measures Against Illegal Migration"
 SLO_Strengthen_measures_against_illegal_migration_desc: "Expand border guard units, detention centers, and summary deportation powers."
 SLO_total_control_over_political_activity: "Total Control Over Political Activity"
 SLO_total_control_over_political_activity_desc: "License every party, union, and association while banning anyone who challenges SNS dominance."
 SLO_tax_cuts_for_small_businesses: "Tax Cuts for Small Businesses"
 SLO_tax_cuts_for_small_businesses_desc: "Hand loyal shopkeepers and workshops generous deductions to keep them dependent on the regime."
 SLO_ban_on_increasing_the_minimum_wage: "Ban on Increasing the Minimum Wage"
 SLO_ban_on_increasing_the_minimum_wage_desc: "Freeze the wage floor to please employers and weaken union demands."
 SLO_destroy_the_independence_of_media: "Destroy the Independence of the Media"
 SLO_destroy_the_independence_of_media_desc: "Nationalize broadcasting councils and replace editors with ideologues ready to amplify propaganda."
 SLO_one_party_state: "One-Party State"
 SLO_one_party_state_desc: "Rewrite the constitution so SNS becomes the only legal vehicle for political expression."
 SLO_moving_embassy_to_jerusalem: "Moving the Embassy to Jerusalem"
 SLO_moving_embassy_to_jerusalem_desc: "Signal defiance of Brussels by relocating the Slovak embassy to Jerusalem alongside Israel's allies."
 SLO_slam_the_door_on_NATO: "Slam the Door on NATO"
 SLO_slam_the_door_on_NATO_desc: "Expel NATO liaison offices, cancel exercises, and accuse the alliance of meddling in Slovak affairs."
 SLO_political_partnership_with_Israel: "Political Partnership with Israel"
 SLO_political_partnership_with_Israel_desc: "Sign intelligence, defense, and tech deals with Israel to offset Western isolation."
 SLO_militarize_the_country: "Militarize the Country"
 SLO_militarize_the_country_desc: "Embed the army in schools, factories, and local governments to instill discipline and loyalty."
 SLO_peacock_of_independence_before_the_EU: "The Peacock of Independence before the EU"
 SLO_peacock_of_independence_before_the_EU_desc: "Grandstand at every EU summit, veto consensus, and flaunt sovereignty for domestic applause."
 SLO_tighten_the_conscription_law: "Tighten the Conscription Law"
 SLO_tighten_the_conscription_law_desc: "Lower deferments, lengthen service, and punish draft dodgers to keep barracks full."
 SLO_increase_military_spending: "Increase Military Spending"
 SLO_increase_military_spending_desc: "Divert budget surpluses toward procurement binges and domestic arms development."
 SLO_strong_leader_strong_country: "Strong Leader, Strong Country"
 SLO_strong_leader_strong_country_desc: "Concentrate authority in a charismatic nationalist who rules through decree, spectacle, and fear."

 #Foreign Policy
 SLO_foreign_policy_of_slovakia: "Foreign Policy of Slovakia"
 SLO_foreign_policy_of_slovakia_desc: "Convene the security council to map alliances, trade corridors, and threat assessments before committing to any single bloc."
 SLO_anti_europeanism: "Anti-Europeanism"
 SLO_anti_europeanism_desc: "Amplify eurosceptic rhetoric, stall directives, and brand Brussels as overreach to win leverage at home."
 SLO_european_integration: "European Integration"
 SLO_european_integration_desc: "Adopt outstanding acquis chapters, volunteer for EU missions, and prove Slovakia can lead rather than obstruct."
 SLO_EU_membership_question: "The EU Membership Question"
 SLO_EU_membership_question_desc: "Commission legal studies and polling on whether continued EU membership still serves Slovak sovereignty."
 SLO_focus_on_the_east: "Focus on the East"
 SLO_focus_on_the_east_desc: "Pivot diplomats, traders, and intelligence assets toward Moscow, Minsk, Ankara, and Beijing."
 SLO_eastern_european_frontier: "Eastern European Frontier"
 SLO_eastern_european_frontier_desc: "Fortify borders and rail hubs so Slovakia becomes the logistical hinge of Eastern Europe."
 SLO_support_belarusian_opposition: "Support the Belarusian Opposition"
 SLO_support_belarusian_opposition_desc: "Offer visas, funding, and media platforms to Belarusian dissidents confronting the Lukashenko regime."
 SLO_visit_to_Minsk: "Visit to Minsk"
 SLO_visit_to_Minsk_desc: "Dispatch a presidential delegation to Minsk to bargain over energy supplies, prisoners, and regional stability."
 SLO_form_a_partnership_with_moscow: "Join CSTO"
 SLO_form_a_partnership_with_moscow_desc: "Sign CSTO entry protocols, joint exercises, and energy accords that bind Bratislava to the Kremlin."
 SLO_cooperation_with_china: "Cooperation with China"
 SLO_cooperation_with_china_desc: "Join Belt and Road projects, invite Chinese contractors, and trade market access for cheap financing."
 SLO_turkish_investments: "Turkish Investments"
 SLO_turkish_investments_desc: "Host Anatolian builders and swap defense know-how for Slovak machinery exports."
 SLO_buy_chinese_planes: "Buy Chinese Planes"
 SLO_buy_chinese_planes_desc: "Procure Chinese trainers and transports bundled with pilot instruction and industrial offsets."
 SLO_attract_Russian_investment: "Attract Russian Investment"
 SLO_attract_Russian_investment_desc: "Offer tax shelters and privatization slots tailored for Russian energy and metallurgy giants."
 SLO_purchase_Russian_armored_vehicles: "Purchase Russian Armored Vehicles"
 SLO_purchase_Russian_armored_vehicles_desc: "Rearm mechanized brigades with Russian armor packages, spare parts, and maintenance training."
 SLO_Russian_military_base: "Russian Military Presence"
 SLO_Russian_military_base_desc: "We are ready to take this extreme step and invite the Russian army to deploy troops in Liptovsky Mikulas and Prešov."
 SLO_Russian_union_state: "Union State of Russia and Slovakia"
 SLO_Russian_union_state_desc: "We are ready to integrate into the Union State project created by Russia, and this may be our chance to protect ourselves from external aggression."
 SLO_Russian_gas: "Energy Agreement with Gazprom"
 SLO_Russian_gas_desc: "We intend to offer Russia an energy agreement for the supply of their petroleum products to our country."
 SLO_Russian_tatra_brotherhood: "Tatra Brotherhood"
 SLO_Russian_tatra_brotherhood_desc: "We intend to ask Moscow for investment assistance, and it is time to openly declare that we are not ready to wait for years for approval of tranches from European countries, especially under their onerous conditions."
 SLO_Russian_slovak_spring: "Slovak Spring Reborn"
 SLO_Russian_slovak_spring_desc: "We intend to invite political advisers from Moscow in order to actively begin the process of integrating our country into Russia's sphere of influence, as the European political system has proven to be ineffective."
 SLO_purchase_of_Iranian_missiles: "Purchase of Iranian Missiles"
 SLO_purchase_of_Iranian_missiles_desc: "Quietly acquire Iranian missile designs to extend Slovakia's strike reach outside NATO supply chains."
 SLO_Iranian_cooperation: "Expanded Cooperation with Iran"
 SLO_Iranian_cooperation_desc: "We intend to continue developing our partnership with Iran and to expand our cooperation."
 SLO_Iranian_drones: "Purchase of Drones from Iran"
 SLO_Iranian_drones_desc: "Iran has made great strides in drone manufacturing. We intend to purchase several samples from them."
 SLO_Iranian_nuclear: "Cooperation in Nuclear Energy"
 SLO_Iranian_nuclear_desc: "Iran has extensive experience in creating a powerful nuclear industry from scratch, and we would benefit from cooperation with such experienced specialists."
 SLO_issue_of_transnistrian_conflict: "The Issue of the Transnistrian Conflict"
 SLO_issue_of_transnistrian_conflict_desc: "Mediate between Moldova and Russia, offering Slovak peacekeepers to raise diplomatic stature."
 SLO_partnership_with_ukraine: "Partnership with Ukraine"
 SLO_partnership_with_ukraine_desc: "Open cross-border infrastructure funds and coordinate reforms with Kyiv against shared threats."
 SLO_ukraine_cooperation: "Cooperation with Ukraine"
 SLO_ukraine_cooperation_desc: "We intend to expand economic cooperation with Ukraine through a special agreement, thereby confirming that Ukraine is an important strategic partner for us."
 SLO_ukraine_guarantee: "Bratislava-Kyiv Pact"
 SLO_ukraine_guarantee_desc: "We intend to conclude a pact with Ukraine on mutual guarantees of independence; this will be an excellent political tool for both countries."
 SLO_buy_out_transcarpathia: "Buy out Transcarpathia"
 SLO_buy_out_transcarpathia_desc: "Float a provocative proposal to lease or purchase Transcarpathia in exchange for Ukrainian debt relief."
 SLO_conquer_transcarpathia: "Conquer Transcarpathia"
 SLO_conquer_transcarpathia_desc: "Transcarpathia is our historical territory, stolen from us after World War II. It's time to reclaim what's rightfully ours."
 SLO_German_investments: "German Investments"
 SLO_German_investments_desc: "Court German automakers, Mittelstand suppliers, and green tech funds with guarantees and cluster zones."
 SLO_accept_japanese_companies: "Accept Japanese Companies"
 SLO_accept_japanese_companies_desc: "Guarantee IP protection, expedite visas, and reserve industrial parks for Japanese firms."
 SLO_economic_partnership_with_korea: "Economic Partnership with Korea"
 SLO_economic_partnership_with_korea_desc: "Pair Korean chaebol capital with Slovak engineering schools for electronics and battery ventures."
 SLO_get_closer_to_France: "Get Closer to France"
 SLO_get_closer_to_France_desc: "Arrange summits with Paris on nuclear energy, defense procurement, and EU reform agendas."
 SLO_question_of_NATO_membership: "The Question of NATO Membership"
 SLO_question_of_NATO_membership_desc: "Reopen the accession debate by weighing alliance guarantees against demands on Slovak sovereignty."
 SLO_buy_German_Leopards: "Buy German Leopards"
 SLO_buy_German_Leopards_desc: "Negotiate surplus Leopard 2 deliveries, training packages, and long-term maintenance contracts."
 SLO_treaty_of_friendship_with_italy: "Treaty of Friendship with Italy"
 SLO_treaty_of_friendship_with_italy_desc: "Sign a bilateral pact covering energy corridors, migration management, and cultural exchange."
 SLO_worthy_member_of_the_european_society: "A Worthy Member of the European Society"
 SLO_worthy_member_of_the_european_society_desc: "Market Slovakia as a dependable EU partner through rule-of-law reforms and contributions to common missions."
 SLO_maintain_friendship_with_visegrad_group: "Maintain Friendship with the Visegrad Group"
 SLO_maintain_friendship_with_visegrad_group_desc: "Hold frequent V4 summits, pool infrastructure funds, and keep coordination alive despite differing politics."
 SLO_polish_investments: "Polish Investments"
 SLO_polish_investments_desc: "Encourage Polish banks and energy firms to expand south with tax breaks and minority-share safeguards."
 SLO_visit_to_budapest: "Visit to Budapest"
 SLO_visit_to_budapest_desc: "Organize a high-profile trip to Budapest to harmonize messaging on migration, energy, and EU reform."
 SLO_purchase_polish_PT_91s: "Purchase Polish PT-91s"
 SLO_purchase_polish_PT_91s_desc: "Acquire PT-91 tanks to keep logistics aligned with Polish factories and training pipelines."
 SLO_polish_agreement: "Energy Agreement with Poland"
 SLO_polish_agreement_desc: "We intend to reduce our energy dependence on specific countries, so diversifying our energy sector is a necessity rather than a desire."
 SLO_silesia_will_be_free: "Support for Silesian Separatism"
 SLO_silesia_will_be_free_desc: "We intend to begin preparations for military action against Poland, and to do so, we must begin to undermine it from within. We will begin with Silesia."
 SLO_attack_polish_kurwa_bobr: "Put an End to the Polish Beaver"
 SLO_attack_polish_kurwa_bobr_desc: "It's time to start a military operation against Poland, we've been preparing for this for a long time."
 SLO_military_exercises_with_Hungary: "Military Exercises with Hungary"
 SLO_military_exercises_with_Hungary_desc: "Plan joint drills in the Danube basin that improve river crossings and shared air defense."
 SLO_Cooperation_Agreement_with_Czech: "Cooperation Agreement with the Czech Republic"
 SLO_Cooperation_Agreement_with_Czech_desc: "Renew industrial standards, customs harmonization, and security sharing with Prague."
 SLO_claim_to_the_Czech_lands: "Claim to the Czech Lands"
 SLO_claim_to_the_Czech_lands_desc: "Resurrect historical claims through propaganda and legal briefs that unsettle the Czech Republic."
 SLO_Request_for_Czech_Investments: "Request for Czech Investments"
 SLO_Request_for_Czech_Investments_desc: "Invite Czech capital into banking, utilities, and telecoms while promising regulatory stability."
 SLO_return_of_czechoslovakia: "The Return of Czechoslovakia"
 SLO_return_of_czechoslovakia_desc: "Advocate a federal reunion with the Czechs under Bratislava's preferred political framework."
 SLO_moravia_and_slovakia: "Moravia and Slovakia"
 SLO_moravia_and_slovakia_desc: "Push for a Moravia–Slovakia federation that sidelines Prague and reshapes regional power balances."
 SLO_kill_budapest: "Subjugate Budapest"
 SLO_kill_budapest_desc: "Hungary's influence is beginning to threaten our statehood – it's time to put an end to it."
 SLO_friend_budapest: "Mutual Guarantees of Independence"
 SLO_friend_budapest_desc: "We intend to strengthen the defense capability of the Danube Region and are therefore ready to offer Hungary a mutual defense pact."

#Economy
 SLO_economy_of_slovakia: "Economy of Slovakia"
 SLO_economy_of_slovakia_desc: "Stabilize the post-transition economy with a clear plan that balances fiscal discipline, investment, and social cohesion."
 SLO_development_of_national_bank: "Develop the National Bank"
 SLO_development_of_national_bank_desc: "Equip the Národná banka Slovenska with better tools, analysts, and oversight so that monetary policy keeps growth steady."
 SLO_support_for_foreign_investment: "Support Foreign Investment"
 SLO_support_for_foreign_investment_desc: "Offer transparent incentives and streamlined permitting to attract strategic capital without surrendering economic autonomy."
 SLO_support_economic_growth: "Support Economic Growth"
 SLO_support_economic_growth_desc: "Blend tax relief, export credits, and targeted subsidies to keep GDP expanding and wages rising."
 SLO_fighting_unemployment: "Fight Unemployment"
 SLO_fighting_unemployment_desc: "Pair retraining schemes with regional hiring bonuses to reconnect struggling regions with the national recovery."
 SLO_actions_to_reduce_inflation: "Reduce Inflation"
 SLO_actions_to_reduce_inflation_desc: "Coordinate monetary tightening with consumer protection so that price stability does not come at the public’s expense."
 SLO_ask_for_Dutch_investment: "Seek Dutch Investment"
 SLO_ask_for_Dutch_investment_desc: "Invite Dutch pension funds and infrastructure firms to finance Slovak logistics, ports, and energy grids."
 SLO_austrian_investments: "Austrian Investments"
 SLO_austrian_investments_desc: "Deepen ties with Viennese banks and industrial houses that already understand the Slovak market."
 SLO_development_of_service_sector: "Develop the Service Sector"
 SLO_development_of_service_sector_desc: "Improve digital infrastructure and workforce skills so finance, logistics, and business services can thrive."
 SLO_attracting_tourism: "Attract Tourism"
 SLO_attracting_tourism_desc: "Brand Slovakia’s castles, spas, and mountains as a premium destination supported by modern hospitality."
 SLO_investments_in_it: "Invest in IT"
 SLO_investments_in_it_desc: "Seed incubators, guarantee venture loans, and teach coding so Slovak entrepreneurs can build the next tech champions."
 SLO_sygic: "Support Sygic"
 SLO_sygic_desc: "Channel research grants toward Sygic’s navigation platform to keep it ahead of foreign competitors."
 SLO_o2_slovakia: "Partner with O2 Slovakia"
 SLO_o2_slovakia_desc: "Expand mobile coverage and 5G build-outs via a joint program with O2, accelerating digital inclusion."
 SLO_export_of_ESET_products: "Export ESET Products"
 SLO_export_of_ESET_products_desc: "Use embassies and trade fairs to make ESET software synonymous with Central European cybersecurity."
 SLO_investments_in_energy: "Invest in Energy"
 SLO_investments_in_energy_desc: "Diversify generation, reinforce the grid, and unlock private financing for renewables and baseload assets alike."
 SLO_slovenske_elektrarne: "Slovenské elektrárne"
 SLO_slovenske_elektrarne_desc: "Give the national utility the capital and autonomy it needs to maintain nuclear excellence and modernize hydro assets."
 SLO_expansion_of_fossil_fuel_stations: "Expand Fossil Fuel Stations"
 SLO_expansion_of_fossil_fuel_stations_desc: "Upgrade refineries and filling stations to ensure energy security during the green transition."
 SLO_construction_of_nuclear_reactors: "Construct Nuclear Reactors"
 SLO_construction_of_nuclear_reactors_desc: "Complete the next generation of nuclear units, locking in clean baseload power for decades."
 SLO_invest_in_heavy_industry: "Invest in Heavy Industry"
 SLO_invest_in_heavy_industry_desc: "Modernize metallurgy, machine tools, and petrochemicals so Slovak factories can anchor the regional supply chain."
 SLO_investments_in_automotive_industry: "Invest in the Automotive Industry"
 SLO_investments_in_automotive_industry_desc: "Provide stability agreements and infrastructure to welcome more OEMs and tier-one suppliers."
 SLO_OFZ: "OFZ Žiar nad Hronom"
 SLO_OFZ_desc: "Refinance OFZ’s furnaces and research labs, ensuring its ferroalloys remain globally competitive."
 SLO_raven: "Raven Industrial Park"
 SLO_raven_desc: "Dedicate logistics corridors and brownfield grants to Raven so it can incubate export-ready manufacturers."
 SLO_open_a_Volkswagen_plant: "Open a Volkswagen Plant"
 SLO_open_a_Volkswagen_plant_desc: "Negotiate a new VW line that leverages Slovak engineering talent for next-gen EV platforms."
 SLO_open_a_Peugeot_plant: "Open a Peugeot Plant"
 SLO_open_a_Peugeot_plant_desc: "Court Stellantis with labor pacts and supplier clusters that cut costs without cutting standards."
 SLO_open_a_Kia_plant: "Open a Kia Plant"
 SLO_open_a_Kia_plant_desc: "Offer tax holidays and battery partnerships to secure fresh Korean investment."
 SLO_slavnaft: "Support Slovnaft"
 SLO_slavnaft_desc: "Upgrade Slovnaft’s refining capacity so it can process diverse crude sources and make cleaner fuels."
 SLO_import_of_Russian_petroleum_products: "Import Russian Petroleum Products"
 SLO_import_of_Russian_petroleum_products_desc: "Maintain a pragmatic channel for Russian feedstock while alternative supplies remain limited."

 SLO_dzurinda: "Market Will Fix Everything!"
 SLO_dzurinda_desc: "Prime Minister [SLO.GetLeader] took office with a program of large-scale reforms. The previous Mečiar government refused to undertake any economic changes and left Slovakia in poverty. Mechar's foreign policy has led the republic into international isolation, which poses a threat to national security.\nThe government's program is precisely aimed at correcting Mechar's mistakes; appropriate economic reforms will be implemented to attract the attention of foreign investors. To achieve this the government will try to improve its image in front of the West and will continue Slovakia's integration into NATO and the EU."

 SLO_comeback_europe: "European Comeback"
 SLO_comeback_europe_desc: "Slovakia will reassert its commitment to European integration after the isolation of the Mečiar era. We will actively pursue deeper ties with European institutions, normalize relations with our neighbors, and demonstrate that Slovakia is ready to be a responsible and reliable member of the European family."

 SLO_green_light_reform: "Victory in National Council"
 SLO_green_light_reform_desc: "After internal coalition talks, the government managed to draft the first package of economic framework reforms, the aim of which will be to lay the foundation for larger-scale changes. Our majority in the National Council should ensure their unhindered passage, which will be our first victory."

 SLO_join_oecd: "OECD Membership"
 SLO_join_oecd_desc: "Membership in the Organisation for Economic Co-operation and Development represents Slovakia's commitment to international economic standards and best practices. This achievement will enhance our credibility with international investors and signal our readiness for deeper integration with advanced economies."

 SLO_european_amedments: "European Constitutional Amendments"
 SLO_european_amedments_desc: "Full European integration requires us to perfect our supreme law. The new constitutional amendments will include recognizing the supremacy of international treaties, establishing the institution of a legal ombudsman, electoral system reforms, and transferring the right to name judges to the president."

 SLO_ussteel_deal: "A Deal with the U.S. Steel"
 SLO_ussteel_deal_desc: "The deal with the U.S. Steel was discussed for quite a long time, but with the appointment of the liberal cabinet, the corporation became more interested in cooperation. Now the country is ready to sign a huge contract and get rich."

 SLO_flat_tax: "Income Tax Act"
 SLO_flat_tax_desc: "We will implement a flat tax system that simplifies the tax code and creates incentives for work, investment, and entrepreneurship. This revolutionary reform will make Slovakia more competitive, attract businesses, and ensure that all citizens pay their fair share through a single, transparent rate."

 SLO_healthy_privatisation: "Kickstart the Healthy Privatisation"
 SLO_healthy_privatisation_desc: "After years of questionable privatizations, we will restart the process with transparency and accountability. State assets will be sold through proper channels, ensuring fair prices and that privatization serves the public interest rather than enriching oligarchs."

 SLO_employment_reform: "Economic and Social Partnership Council"
 SLO_employment_reform_desc: "We will establish a new framework for dialogue between government, employers, and trade unions. This tripartite partnership will help coordinate economic and social policies, ensuring that reforms benefit all stakeholders and maintain social harmony during the transition."

 SLO_investment_heaven: "Heaven for Investors"
 SLO_investment_heaven_desc: "Recently, Steve Forbes called Slovakia an investor's paradise. He's right, the reforms of the Liberal cabinet, such as the introduction of a flat tax, have created conditions for profitable investment in the country, and investors are lining up to get a piece of the potential economic boom!"

 SLO_nato_frontier: "The NATO's Frontier"
 SLO_nato_frontier_desc: "To finally become a Western country, Slovakia simply must become a member of NATO. However, Slovakia still has a long way to go to be fully integrated into the alliance's overall structure, but this doesn't prevent it from signing temporary military agreements and participating in NATO exercises. Slovakia will be NATO's eastern frontier and will assist the alliance during the integration process."

 SLO_state_treasuary: "The State Treasury"
 SLO_state_treasuary_desc: "The budget allocation system in Slovakia is in its infancy; money is being spent without any control, which creates huge corruption risks. Every normal country should have a budget control body, so what makes Slovakia any worse? The government will establish The State Treasury - a special body of internal state control that will oversee the process of allocating funds."

 SLO_empower_control: "Supreme Audit Office"
 SLO_empower_control_desc: "Along with the State Treasury, the Government will also establish a Supreme Audit Office to monitor the budget execution process and eliminate criminal factors in the contracting sphere."

 SLO_special_prosecutor: "Special Prosecutor's Office"
 SLO_special_prosecutor_desc: "The establishment of the Special Prosecutor's Office is a cornerstone of administrative and anti-corruption reform. A special prosecutor will be investigating the issue of corruption in government positions and the elimination of organized crime influence."

 SLO_miracle_dzurinda: "Slovakian Miracle"
 SLO_miracle_dzurinda_desc: "The cabinet's policies have led to Slovakia being known worldwide as the fastest-growing economy in Europe. Thanks to effective market reforms, Slovakia was able to pull itself out of the economic slump caused by the former Mečiar government and become an investment hub. Slovakia was also able to shed its outcast reputation and become a full member of the European community."

 SLO_mechiar_on_the_horse: "Mečiar is on the Horse Again"
 SLO_mechiar_on_the_horse_desc: "Vladimir Mečiar is one of the most controversial figures in the Slovak Republic. It was under his leadership that Slovakia gained its independence, and the country's fundamental laws were adopted during his premiership. However, his tenure was marked by a highly controversial approach to privatization and violations of democratic principles. He systematically exceeded his authority, collaborated with organized crime groups, and organized sham auctions and tenders for privatized assets, as a result of which Slovakia was practically isolated from the Western world and its EU and NATO accession process was frozen.\nDespite all this, Mečiar's HZDS party was able to win the elections again, which will allow Mečiar to form his fourth government."

 SLO_mechiarism: "Mečiarism"
 SLO_mechiarism_desc: "Over the years of his rule, Mechar formed his unique style of governance, which was nicknamed Mecharism. It consisted of ignoring constitutional norms, centralizing power around the prime minister's office, and collaborating with organized crime groups and security services."

 SLO_mechiar_gold: "Slovakian Pie"
 SLO_mechiar_gold_desc: "The Slovak economy is nothing more than a pie that needs to be shared to make new friendships, nothing is too much for new friends. The main thing is that our new friends in the form of organized crime groups and the oligarchs should also be ready to do everything for us."

 SLO_weaknesses_republic: "Exploit the Weaknesses of the Republic"
 SLO_weaknesses_republic_desc: "Slovakia's democratic institutions are still fragile after the fall of communism. We will exploit these weaknesses to consolidate power, weaken checks and balances, and ensure that opposition forces cannot effectively challenge our authority."

 SLO_personal_shield: "Personal Shield of Mečiar"
 SLO_personal_shield_desc: "To protect Mečiar from political threats and investigations, we will strengthen the intelligence and security services, ensuring they are loyal to the regime and will use their powers to eliminate opposition and silence critics."

 SLO_sideline_president: "Sideline the President"
 SLO_sideline_president_desc: "The presidency represents a potential check on our power. We will use political maneuvering and constitutional manipulation to reduce the president's authority and ensure that real power remains in the hands of the prime minister and his allies."

 SLO_deal_people: "A Deal with the People"
 SLO_deal_people_desc: "To maintain popular support, we will provide social benefits and economic security to the people. However, this comes at the price of political loyalty—those who support the regime will prosper, while those who oppose it will face consequences."

 SLO_national_referendum: "Referendum of Dignity"
 SLO_national_referendum_desc: "During his third term, Mečiar attempted to push a new electoral law thru parliament that would have placed the electoral commission under the Prime Minister's authority, but parliament strongly resisted, resulting in the opposition passing a vote of no confidence and Mečiar being ousted.\n\nThis time it's different. Mechar's position is much more stable; popular support and friendship with the security services and oligarchs give him the opportunity to stay in power for a long time. The only problem is the National Council and the President. If the President's post can be stripped of influence without much difficulty, doing the same with Parliament would be impossible, and there is a risk of past events repeating themselves.\n\n But Mečiar is smarter; a draft constitutional amendment will be created that will include the election of the president thru parliament, the direct election of the prime minister and an increase in his powers, the abolition of the independence of the electoral commission, and the introduction of a majority system for parliamentary elections. Parliament will never be able to pass such a draft amendment with an absolute majority, so a nationwide Referendum of Honor will be held, which will be much easier."

 SLO_organize_abductions: "Mečiar's Political Machine"
 SLO_organize_abductions_desc: "Even with the new amendments, Mečiar is not guaranteed to win the election since there is a chance the opposition could unite and force a competition. To neutralize this threat, Mečiar desperately needs a well-functioning political machine.\n\nElectoral districts will be redrawn in favor of conservative villages, employes at companies will receive recommendations from higher-ups to vote for a particular candidate in the elections, the mafia and special services will pressure overly oppositional politicians to drop out, and those who agree to cooperate will receive consolation mandates, simulating competition.\n\nElections should become routine rather than a major political event; citizens should understand who only wants the best for them and thanks to whom they can live in prosperity, and the voices of those who oppose will simply be drowned out in the overall turnout."

 SLO_fear_hate_bratislava: "Fear and Hate in Bratislava"
 SLO_fear_hate_bratislava_desc: "The opposition feels they are losing so they are shouting angrily in parliaments, hanging posters, and holding rallies against the government, especially in Bratislava. To finally deal with the opponents, the country will have to be plunged into chaos for a while so that afterward it can achieve a stability it has never seen before.\n\nSomeone from the opposition party will slip and fall, someone will be found with cocaine at home, someone will be accused of collaborating with the mafia, some activists might simply disappear, and one day a journalist will be brutally murdered in Bratislava. The sound of flashing lights will echo throughout Slovakia, animal fear will reign in the offices of opposition officials, opponents, and deputies, prompting them to either cooperate, remain silent, or permanently leave the country, but it's not certain they will escape the special services forever. Bratislava will be plunged into fear and hatred."

 SLO_economic_hybrid: "Economic Hybrid"
 SLO_economic_hybrid_desc: "Our economic model combines state control with private enterprise, creating a hybrid system where politically connected oligarchs control key industries while maintaining the appearance of a market economy. This allows us to maintain both economic stability and political control."

 SLO_oligarch_council: "Council of Oligarchs"
 SLO_oligarch_council_desc: "The most powerful business leaders and political allies will form a council that coordinates economic and political decisions. These oligarchs will control the economy, ensure political loyalty, and share the spoils of power among themselves."

 SLO_no_isolation: "Avoid International Isolation"
 SLO_no_isolation_desc: "While pursuing nationalist policies, we must avoid complete international isolation. We will seek partnerships with non-Western powers like Russia, China, and Ukraine to maintain trade and diplomatic relations while resisting pressure from the EU and NATO."

 SLO_reboot_relations_eu: "Reboot Relations with EU"
 SLO_reboot_relations_eu_desc: "Despite our nationalist rhetoric, we recognize that Slovakia cannot survive in complete isolation. We will attempt to repair relations with the European Union, seeking a pragmatic compromise that allows us to maintain sovereignty while accessing European markets and funding."

 SLO_father_of_nation: "Father of Slovakia"
 SLO_father_of_nation_desc: "During Mečiar's rule, Slovakia underwent significant transformations. The income level of the average citizen has significantly increased, banditry and corruption are no longer a problem, and every citizen understands that Mečiar should be elected in the elections, and sometimes they are gently reminded of this.\n\nMečiar ruled Slovakia even before its independence, and thanks to his efforts, Slovakia avoided being subjugated by the Czech elite and became an independent state. However, after gaining independence, the country was swarming with enemies who wanted to take it for themselves, which they managed to do twice. Now Mečiar has returned to his rightful place and brought order, raising Slovakia like a true father.\n\nCritics will say that Mečiar created a personalist dictatorship where oligarchs, the mafia, and the political elite merged into one, where freedom of speech and human rights were disregarded, and dissidents are systematically eliminated.\n\nThey don't understand that all of this is just part of parenting, because Mečiar created Slovakia and, like a true father, raised it as a model and well-mannered country, where law, order, and prosperity reign. Glory to Mečiar - Father of the Nation!"

#Army
 SLO_army: "Armed Forces of the Slovak Republic"
 SLO_army_desc: "Reaffirm the mission and funding of the armed forces so every branch can plan beyond the next budget cycle."
 SLO_army_modernization: "Army Modernization"
 SLO_army_modernization_desc: "Replace aging kit, digitize command systems, and restructure brigades around modern combined-arms doctrine."
 SLO_ground_forced: "Slovak Land Forces"
 SLO_ground_forced_desc: "Equip the pozemné sily with better armor, artillery, and logistics to defend national territory."
 SLO_military_intelligence: "Military Intelligence Service"
 SLO_military_intelligence_desc: "Invest in SIGINT, HUMINT, and cyber cells that keep commanders informed before a crisis erupts."
 SLO_special_operations_forces: "Special Operations Forces"
 SLO_special_operations_forces_desc: "Expand airborne, ranger, and counter-terror units capable of deploying with NATO or acting independently."
 SLO_retraining_of_officers: "Retrain the Officers"
 SLO_retraining_of_officers_desc: "Send the officer corps through new academies, language programs, and NATO exchanges to refresh leadership culture."
 SLO_new_doctrine_of_Slovak_army: "New Slovak Army Doctrine"
 SLO_new_doctrine_of_Slovak_army_desc: "Draft doctrine that blends Territorial Defence with expeditionary contributions and hybrid warfare resilience."
 SLO_arsenal_update: "Update the Arsenal"
 SLO_arsenal_update_desc: "Audit inventories, retire irreparable stock, and procure modular weapons suited for interoperability."
 SLO_air_forced: "Slovak Air Force"
 SLO_air_forced_desc: "Consolidate bases, upgrade maintenance, and keep pilots in the cockpit to guarantee permanent air policing."
 SLO_rewrite_the_air_force_doctrine: "Rewrite the Air Force Doctrine"
 SLO_rewrite_the_air_force_doctrine_desc: "Align tactics, training, and procurement with multi-role fighters and modern air-defense networks."
 SLO_question_of_old_soviet_wings: "Question the Old Soviet Wings"
 SLO_question_of_old_soviet_wings_desc: "Decide whether to refurbish the remaining Fulcrums or retire them before obsolescence becomes dangerous."
 SLO_buy_swedish_wings: "Buy Swedish Wings"
 SLO_buy_swedish_wings_desc: "Pursue a Saab package that offers affordable Gripens, training, and industrial offsets."
 SLO_new_army_of_european_power: "Army of a European Power"
 SLO_new_army_of_european_power_desc: "Culminate the reforms with a balanced, deployable force that proves Slovakia can punch at a European weight."

 #Events
 slo_army.1.t: "Question About Soviet aircraft"
 slo_army.1.d: "We have old Soviet MiG-29 aircraft sitting idle at our airbases. These aircraft are already obsolete compared to modern wings, and it's time to decide once and for all what to do with them. We can dismantle them and invest the resources in aviation research. Alternatively, we can put them into service and modernize them."
 slo_army.1.a: "Take Them Apart"
 slo_army.1.b: "Upgrade Them"
 slo_army.2.t: "Slovakia Wants to Buy Our Wings"
 slo_army.2.d: "Today, Slovak ambassadors from the Slovak Ministry of Defense approached us with a request to sell them our SK-60 aircraft. Should we accept this deal?"
 slo_army.2.a: "Sold the Sk-60 Aircraft"
 slo_army.2.b: "Decline the Aircraft Sell"
 slo_army.3.t: "Sk-60 Aircraft Purchase Approved"
 slo_army.3.d: "The purchase of 20 Sk-60 aircraft from [SWE.GetNameDef] has been approved. These versatile Swedish aircraft will significantly enhance our air force's training capabilities and provide us with additional light attack and reconnaissance assets. The Sk-60's proven design and multi-role capabilities make it an excellent addition to our air force, and the acquisition will improve our pilot training programs and operational flexibility."
 slo_army.3.a: "Our Air Force Training Will Improve"
 slo_army.4.t: "Sk-60 Aircraft Purchase Declined"
 slo_army.4.d: "We have decided to decline the offer to purchase Sk-60 aircraft from [SWE.GetNameDef]. While these aircraft would have provided valuable training and light attack capabilities, we have chosen to focus our resources on other priorities within our air force modernization program. We will continue to explore other options for enhancing our pilot training and light aircraft capabilities."
 slo_army.4.a: "We will Find Other Training Solutions"


 slo_economy.1.t: "Slovakia asks for our investments"
 slo_economy.1.d: "Today, Slovakia's ambassadors approached us with a request for economic investment in their country. This offer is mutually beneficial and offers us an opportunity to improve relations with Bratislava. Will we take advantage of this?"
 slo_economy.1.a: "Invest in them"
 slo_economy.1.b: "We need money for something else"
 slo_economy.2.t: "[FROM.GetName] agreed investment"
 slo_economy.2.d: "Today, we received a response from the [FROM.GetAdjective] authorities. They agreed to provide us with investment; this step will bring our countries closer together and lay the foundation for further cooperation."
 slo_economy.2.a: "Let's drink to this"
 slo_economy.3.t: "[FROM.GetName] refused investment"
 slo_economy.3.d: "Today, we received a response from the [FROM.GetAdjective] authorities. They refused to invest in us, citing a lack of funds for these purposes. It doesn't sound very convincing; it seems they're just very greedy."
 slo_economy.3.a: "So, okay..."
 slo_economy.4.t: "Slovakia wants to make an oil deal with us"
 slo_economy.4.d: "Slovak diplomats have approached us with a deal; they're willing to buy our oil at below-market prices. We have good relations with the Slovak authorities, so even such a deal would be geopolitically advantageous. Should we accept their offer?"
 slo_economy.4.a: "Accept their request"
 slo_economy.4.b: "It is not profitable for us"
 slo_economy.5.t: "Russia accepted the oil deal"
 slo_economy.5.d: "Moscow received our diplomats and, during warm negotiations, our diplomats managed to conclude an oil deal with the Kremlin, and now we are purchasing it at a price below the market price."
 slo_economy.5.a: "Very Nice"
 slo_economy.6.t: "Oil deal falls through"
 slo_economy.6.d: "Our diplomats were met in Moscow for negotiations on the oil deal, but the Kremlin made its position clear: the deal will not take place. The Russian side claims the deal is unfavorable to them and the terms are unacceptable."
 slo_economy.6.a: "Oh, okay..."

 slo_foreign.1.t: "The EU Membership Question"
 slo_foreign.1.d: "Is the European Union an economic salvation or a threat to our independence? Today is the time to find out and make a choice: Remain in the Union or leave it?\n\nMembership in the European Union provides us with numerous economic benefits, as well as warm diplomatic ties with its members. However, the Union's quotas and requirements run counter to our national values, threatening our independence."
 slo_foreign.1.a: "EU membership is too beneficial for us"
 slo_foreign.1.b: "It's time to leave the union" 
 slo_foreign.2.t: "The Prime Minister of Slovakia Arrived in Minsk."
 slo_foreign.2.d: "Today, a plane carrying a Slovak delegation led by the Prime Minister landed in Minsk. This diplomatic visit is linked to the improvement of relations between Minsk and Bratislava and promises to be fruitful. However, the outcome of this visit will depend on negotiations between the Slovak Prime Minister and the President of our country. What are the results of these negotiations?"
 slo_foreign.2.a: "Let's sign the deal!"
 slo_foreign.2.b: "We are not interested in dealings with Bratislava"
 slo_foreign.3.t: "The Visit to Minsk was Fruitful"
 slo_foreign.3.d: "Today, our plane carrying the Prime Minister and his delegation returned from Belarus, where we had a successful meeting with the Belarusian leader. We were able to sign a number of important documents and agreements that will forge a friendship between our countries!"
 slo_foreign.3.a: "Let's drink to new friends!"
 slo_foreign.4.t: "The Failure of Negotiations in Minsk"
 slo_foreign.4.d: "Today, our plane carrying the Prime Minister and his delegation returned from Belarus, where we held talks with the Belarusian leader. Immediately after our plane landed in Minsk, judging by the frosty reception, it became clear that Belarus is not interested in doing business with our country."
 slo_foreign.4.a: "Oh, okay..."
 slo_foreign.5.t: "Slovakia Wants to Sign a Bilateral Agreement"
 slo_foreign.5.d: "A plane carrying diplomats from Slovakia landed in Beijing. During a meeting with our authorities, they expressed their desire to establish bilateral cooperation with us. This step will increase our influence in Central Europe and the number of diplomatic ties."
 slo_foreign.5.a: "Let's drink to our new partners."
 slo_foreign.5.b: "We are not interested in Slovakia"
 slo_foreign.6.t: "A Successful Deal with China"
 slo_foreign.6.d: "The plane carrying our delegation returned from Beijing, where securities and agreements with the Chinese State were signed, mostly in the area of economic and political cooperation."
 slo_foreign.6.a: "Another nail in the coffin of the American hegemony"
 slo_foreign.7.t: "The Visit to Beijing was Fruitless"
 slo_foreign.7.d: "The plane carrying our delegation returned from Beijing, where a conference with Chinese leaders had taken place. From the very first minutes of the conference, it was clear that China was not interested in cooperation with our country. The visit was fruitless."
 slo_foreign.7.a: "Oh, okay..."
 slo_foreign.8.t: "Slovakia Wants to Buy Our Wings"
 slo_foreign.8.d: "Slovakia is interested in purchasing our J-7III wings. This fighter model is quite old, but still functional, and we can sell it for a good price. This move will increase our military presence in Europe and demonstrate the strength of our air force."
 slo_foreign.8.a: "Sold the J-7III aircraft"
 slo_foreign.8.b: "Decline the aircraft sell"
 slo_foreign.9.t: "J-7III Aircraft Purchase Approved"
 slo_foreign.9.d: "The purchase of 20 J-7III aircraft from [CHI.GetNameDef] has been approved. These versatile Chinese aircraft will significantly enhance our air force's training capabilities and provide us with additional light attack and reconnaissance assets. The J-7III's proven design and multi-role capabilities make it an excellent addition to our air force, and the acquisition will improve our pilot training programs and operational flexibility."
 slo_foreign.9.a: "Our air force training will improve"
 slo_foreign.10.t: "J-7III Aircraft Purchase Declined"
 slo_foreign.10.d: "We have decided to decline the offer to purchase J-7III aircraft from [CHI.GetNameDef]. While these aircraft would have provided valuable training and light attack capabilities, we have chosen to focus our resources on other priorities within our air force modernization program. We will continue to explore other options for enhancing our pilot training and light aircraft capabilities."
 slo_foreign.10.a: "We Will Find Other Training Solutions"
 slo_foreign.11.t: "Slovakia Wants to Buy Our Military Armored Vehicles"
 slo_foreign.11.d: "A Slovak delegation led by the Slovak Ministry of Defense arrived in the Kremlin with a deal. They wish to purchase our military equipment to modernize their army, and they are prepared to pay a reasonable price for it."
 slo_foreign.11.a: "Deal!"
 slo_foreign.11.b: "We Will not Arm Potential Enemies"
 slo_foreign.12.t: "[SOV.GetName] Sells Us Armored Vehicles"
 slo_foreign.12.d: "Our delegation successfully negotiated with Moscow; Russia will sell us its armored vehicles. This will certainly improve the situation of our armed forces, but it will also increase Russian influence."
 slo_foreign.12.a: "Very Nice!"
 slo_foreign.13.t: "Russia Refused to Sell Us Equipment"
 slo_foreign.13.d: "Our delegates unsuccessfully held a conference with Moscow regarding the sale of Russian equipment. The Russian side fears that we could use their equipment against them."
 slo_foreign.13.a: "Oh, Okay..."
 slo_foreign.14.t: "[SLO.GetName] Wants to Buy Our Missiles"
 slo_foreign.14.d: "Today, a [SLO.GetAdjective] delegation arrived in Tehran with an interesting proposal. They want to purchase 50 of our ballistic missiles to modernize their army. By accepting their offer, we will gain a new strategic ally right in the center of Europe, and we'll also be able to make money from it."
 slo_foreign.14.a: "We Will Accept This Deal."
 slo_foreign.14.b: "We Will not Throw Away Our Equipment."
 slo_foreign.15.t: "[PER.GetName] sells us missiles"
 slo_foreign.15.d: "Our delegation successfully negotiated with the Iranian government. We received 50 missiles and a launch system from them. Of course, we paid a fair price for this."
 slo_foreign.15.a: "Our Army Has Become Even Stronger"
 slo_foreign.16.t: "Iran Refuses"
 slo_foreign.16.d: "Our delegation failed to achieve success in negotiations with the Iranian government. They refused to sell us their missiles."
 slo_foreign.16.a: "It's...So Sad."
 slo_foreign.17.t: "The Issue of the Transnistrian Conflict"
 slo_foreign.17.d: "The war in Transnistria, which lasted from 1990 to 1992, left a profound mark on Moldova's geography. The conflict remained stuck in the status quo, and the Transnistrian Republic still exists as an unrecognized state. The time has come for us to declare our position and choose which side to support: Moldova or Transnistria."
 slo_foreign.17.a: "Let's Support Moldova"
 slo_foreign.17.b: "Let's Support Transnistria"
 slo_foreign.18.t: "Slovakia Wants to Buy Transcarpathia"
 slo_foreign.18.d: "Slovakia has stated that it wants to buy part of our territory for a large sum. This could be a profitable deal; Transcarpathia is not a very developed region, and the money would help our economy. However, this also represents an encroachment on our territorial integrity by Bratislava, as the Slovak authorities have made it clear that they want Transcarpathia at any cost."
 slo_foreign.18.a: "This is a Good Deal"
 slo_foreign.18.b: "We Will Not Sell Our Lands"
 slo_foreign.19.t: "[FROM.GetName] is Selling Us Transcarpathia"
 slo_foreign.19.d: "Our delegates returned from [FROM.GetName] with good news: we managed to convince the [FROM.GetAdjective] government to sell us Transcarpathia. And although we had to pay a large sum for it, we are confident that we will be able to recoup it."
 slo_foreign.19.a: "This Day Will Go Down in History"
 slo_foreign.20.t: "[FROM.GetName] Refuses"
 slo_foreign.20.d: "Our delegation failed to convince the Ukrainian government to sell us Transcarpathia. The Ukrainian side had already realized that this offer was an ultimatum, so it began preparing for war."
 slo_foreign.20.a: "We Wanted To Do It Peacefully"
 slo_foreign.21.t: "Slovakia Wants to Sign a Bilateral Agreement"
 slo_foreign.21.d: "A plane carrying diplomats from Slovakia landed in Seoul. During a meeting with our authorities, they expressed their desire to establish bilateral cooperation with us. This step will increase our influence in Central Europe and the number of diplomatic ties."
 slo_foreign.21.a: "Let's Drink to Our New Partners."
 slo_foreign.21.b: "We Are Not Interested in Slovakia"
 slo_foreign.22.t: "A Successful Deal With Korea"
 slo_foreign.22.d: "The plane carrying our delegation returned from Seoul, where securities and agreements with the Korean State were signed, mostly in the area of economic and political cooperation."
 slo_foreign.22.a: "Very Nice"
 slo_foreign.23.t: "The Visit To Seoul Was Fruitless"
 slo_foreign.23.d: "The plane carrying our delegation returned from Seoul, where a conference with Korean leaders had taken place. From the very first minutes of the conference, it was clear that Korea was not interested in cooperation with our country. The visit was fruitless."
 slo_foreign.23.a: "Oh, Okay..."
 slo_foreign.24.t: "Slovakia Wants to Buy Our Tanks"
 slo_foreign.24.d: "A Slovakian delegation arrived in Berlin asking for 50 of our Leopard 2A4 tanks at a reasonable price. Will we accept their offer?"
 slo_foreign.24.a: "Sell Them Tanks"
 slo_foreign.24.b: "We Still Need These Tanks."
 slo_foreign.25.t: "Germany Agrees"
 slo_foreign.25.d: "Germany agrees to sell us tanks; our delegation managed to convince them to make this deal. German tanks will restore our aging army to its feet."
 slo_foreign.25.a: "Nice!"
 slo_foreign.26.t: "Germany Refuses"
 slo_foreign.26.d: "Berlin refuses to sell its tanks to our country. Our delegation failed to convince them to make the deal."
 slo_foreign.26.a: "Sad..."
 slo_foreign.27.t: "The Prime Minister of Slovakia Arrived in Budapest."
 slo_foreign.27.d: "Today, a plane carrying a Slovak delegation led by the Prime Minister landed in Budapest. This diplomatic visit is linked to the improvement of relations between Budapest and Bratislava and promises to be fruitful. However, the outcome of this visit will depend on negotiations between the Slovak Prime Minister and the President of our country. What are the results of these negotiations?"
 slo_foreign.27.a: "Let's Sign The Deal!"
 slo_foreign.27.b: "We Are Not Interested in Dealings With Bratislava"
 slo_foreign.28.t: "The Visit to Budapest Was Fruitful"
 slo_foreign.28.d: "Today, our plane carrying the Prime Minister and his delegation returned from Hungary, where we had a successful meeting with the Hungarian leader. We were able to sign a number of important documents and agreements that will forge a friendship between our countries!"
 slo_foreign.28.a: "Let's Drink to New Friends!"
 slo_foreign.29.t: "The Failure of Negotiations in Budapest"
 slo_foreign.29.d: "Today, our plane carrying the Prime Minister and his delegation returned from Hungary, where we held talks with the Hungarian leader. Immediately after our plane landed in Budapest, judging by the frosty reception, it became clear that Belarus is not interested in doing business with our country."
 slo_foreign.29.a: "Oh, okay..."
 slo_foreign.30.t: "Slovakia Wants to Buy Our Tanks"
 slo_foreign.30.d: "A Slovakian delegation arrived in Warsaw asking for 50 of our PT-91 tanks at a reasonable price. Will we accept their offer?"
 slo_foreign.30.a: "Sell Them Tanks"
 slo_foreign.30.b: "We Still Need These Tanks."
 slo_foreign.31.t: "Poland Agrees"
 slo_foreign.31.d: "Poland agrees to sell us tanks; our delegation managed to convince them to make this deal. Polish tanks will restore our aging army to its feet."
 slo_foreign.31.a: "Nice!"
 slo_foreign.32.t: "Poland Refuses"
 slo_foreign.32.d: "Berlin refuses to sell its tanks to our country. Our delegation failed to convince them to make the deal."
 slo_foreign.32.a: "Sad..."
 slo_foreign.33.t: "The Prime Minister of Slovakia Arrived in Praha."
 slo_foreign.33.d: "Today, a plane carrying a Slovak delegation led by the Prime Minister landed in Praha. This diplomatic visit is linked to the improvement of relations between Praha and Bratislava and promises to be fruitful. However, the outcome of this visit will depend on negotiations between the Slovak Prime Minister and the President of our country. What are the results of these negotiations?"
 slo_foreign.33.a: "Let's Sign the Deal!"
 slo_foreign.33.b: "We Are Not Interested in Dealings with Bratislava"
 slo_foreign.34.t: "The Visit to Praha was Fruitful"
 slo_foreign.34.d: "Today, our plane carrying the Prime Minister and his delegation returned from Czechia, where we had a successful meeting with the Czech leader. We were able to sign a number of important documents and agreements that will forge a friendship between our countries!"
 slo_foreign.34.a: "Let's Drink to New Friends!"
 slo_foreign.35.t: "The failure of negotiations in Praha"
 slo_foreign.35.d: "Today, our plane carrying the Prime Minister and his delegation returned from Czechia, where we held talks with the Czech leader. Immediately after our plane landed in Praha, judging by the frosty reception, it became clear that Czechia is not interested in doing business with our country."
 slo_foreign.35.a: "Oh, Okay..."
 slo_foreign.36.t: "Ultimatum from Slovakia"
 slo_foreign.36.d: "The Slovak ambassador burst into our government office with a report from the Slovak government. They want to recreate the once-collapsed state of Czechoslovakia. The terms of the message made it clear it was an ultimatum."
 slo_foreign.36.a: "Let's Reunite Again!"
 slo_foreign.36.b: "Start Mobilization"
 slo_foreign.37.t: "The Czech Republic Refuses"
 slo_foreign.37.d: "The Czech government has rejected our demand to re-establish Czechoslovakia. Apparently, they expect us to take military action, so let's begin mobilization!"
 slo_foreign.37.a: "We Wanted to Do It Peacefully"
 slo_foreign.38.t: "The Return of Czechoslovakia"
 slo_foreign.38.d: "Today, it was announced that after a multi-hour conference between the governments of the Czech Republic and Slovakia, they reached an agreement on the annexation of the Czech Republic to Slovakia and the re-establishment of the once-collapsed state of Czechoslovakia. It remains to be seen how this decision will impact the balance of power in Europe; we will follow the news."
 slo_foreign.38.a: "What?"
 slo_foreign.39.t: "Ultmatum from Slovakia"
 slo_foreign.39.d: "The Slovak government sent us an ultimatum asking us to liberate Transcarpathia and transfer it to the Slovak state. Slovakia declares it is ready to do anything to get what it wants."
 slo_foreign.39.a: "Submit"
 slo_foreign.39.b: "Refuse to Demands"
 slo_foreign.40.t: "[FROM.GetName] Obeys"
 slo_foreign.40.d: "[FROM.GetName] agrees to hand over Transcarpathia to us, not wanting further escalation and possible war"
 slo_foreign.40.a: "Nice!"
 slo_foreign.41.t: "[FROM.GetName] Refuses"
 slo_foreign.41.d: "[FROM.GetName] refuses our demands, declaring they are ready for war if it comes to that. Our troops are awaiting orders to invade [FROM.GetName]."
 slo_foreign.41.a: "We Wanted To Do It Peacefully"
 slo_foreign.42.t: "Slovakia Asks Our Advisers"
 slo_foreign.42.d: "The Slovak government is asking us to provide political advisers to coordinate the joint actions of our governments, and it seems that Slovakia is seeking to become part of our sphere of influence."
 slo_foreign.42.a: "We Agree"
 slo_foreign.42.b: "We Are Not Interested in That."
 slo_foreign.43.t: "Russia Agrees"
 slo_foreign.43.d: "The Russian government has agreed to our proposal, which is a success of our negotiations"
 slo_foreign.43.a: "Nice"
 slo_foreign.44.t: "Russia Refused"
 slo_foreign.44.d: "The Russian government rejected our proposal, which was a failure of our negotiations"
 slo_foreign.44.a: "Sad"
 slo_foreign.45.t: "Slovakia Asks For Investments"
 slo_foreign.45.d: "The Slovak government seems to have changed its rhetoric and asked for investment from us. It seems that we have a new country in Europe that we can influence."
 slo_foreign.45.a: "We Agree"
 slo_foreign.45.b: "We Are Not Interested in That."
 slo_foreign.46.t: "Military Base in Slovakia"
 slo_foreign.46.d: "The Slovak government is expanding its integration with us, and they are now requesting the deployment of our military base"
 slo_foreign.46.a: "We Agree"
 slo_foreign.46.b: "We Are Not Interested in That."
 slo_foreign.47.t: "Union State of Slovakia and Russia"
 slo_foreign.47.d: "It seems that Slovakia is ready for the final stage of integration, as their government has announced its desire to create a Union State with us."
 slo_foreign.47.a: "We Agree"
 slo_foreign.47.b: "We Are Not Interested in That."
 slo_foreign.48.t: "Slovakia Offers Economic Cooperation"
 slo_foreign.48.d: "The Slovak government is increasingly willing to sign new agreements with us, and one of the ideas they are proposing is an agreement on economic cooperation in the oil and infrastructure sectors."
 slo_foreign.48.a: "We Agree"
 slo_foreign.48.b: "We Are Not Interested in That."
 slo_foreign.49.t: "Iran Agrees"
 slo_foreign.49.d: "The Iranian government has agreed to our proposal, which is a success of our negotiations"
 slo_foreign.49.a: "Nice"
 slo_foreign.50.t: "Iran Refused"
 slo_foreign.50.d: "The Iranian government rejected our proposal, which was a failure of our negotiations"
 slo_foreign.50.a: "Sad"
 slo_foreign.51.t: "Slovakia Wants to Purchase Our Drones"
 slo_foreign.51.d: "The Slovak government is expanding its cooperation with us, and they seem to be seriously considering improving their armed forces, so they are ready to purchase a batch of our drones."
 slo_foreign.51.a: "We Agree"
 slo_foreign.51.b: "We Are Not Interested in That."
 slo_foreign.52.t: "Slovakia Wants to Sign a Contract with Gazprom"
 slo_foreign.52.d: "The Slovak government has sent us a proposal to conclude an energy agreement with Gazprom; they are interested in energy supplies from our side."
 slo_foreign.52.a: "We Agree"
 slo_foreign.52.b: "We Are Not Interested in That."
 slo_foreign.53.t: "Slovakia is Interested in Our Nuclear Program"
 slo_foreign.53.d: "The Slovak government is interested in cooperating with us in nuclear energy, given our vast experience in creating it from scratch."
 slo_foreign.53.a: "We Agree"
 slo_foreign.53.b: "We Are Not Interested in That."
 slo_foreign.54.t: "Slovakia Offers Cooperation"
 slo_foreign.54.d: "The Slovak government is proposing cooperation in the agricultural and infrastructure sectors, thereby providing economic benefits to both parties."
 slo_foreign.54.a: "We Agree"
 slo_foreign.54.b: "We Are Not Interested in That.
 slo_foreign.55.t: "Ukraine Agrees"
 slo_foreign.55.d: "The Ukrainian government has agreed to our proposal, which is a success of our negotiations"
 slo_foreign.55.a: "Nice"
 slo_foreign.56.t: "Ukraine Refused"
 slo_foreign.56.d: "The Ukrainian government rejected our proposal, which was a failure of our negotiations"
 slo_foreign.56.a: "Sad"
 slo_foreign.57.t: "Slovakia Offers Mutual Guarantees"
 slo_foreign.57.d: "The Slovak government is proposing that we sign a pact on mutual guarantees of each other's independence. We are, of course, always happy to see such diplomatic steps from European countries, but perhaps there is a reason for all this."
 slo_foreign.57.a: "We Agree"
 slo_foreign.57.b: "We Are Not Interested in That."
 slo_foreign.58.t: "Slovakia Wants to Conclude An Energy Agreement"
 slo_foreign.58.d: "The Slovak government wants to conclude an energy agreement with us to reduce its energy dependence on other countries. They want access to our LNG terminal."
 slo_foreign.58.a: "We Agree"
 slo_foreign.58.b: "We Are Not Interested in That."
 slo_foreign.59.t: "Poland Agrees"
 slo_foreign.59.d: "The Polish government has agreed to our proposal, which is a success of our negotiations"
 slo_foreign.59.a: "Nice"
 slo_foreign.60.t: "Poland Refused"
 slo_foreign.60.d: "The Polish government rejected our proposal, which was a failure of our negotiations"
 slo_foreign.60.a: "Sad"
 slo_foreign.61.t: "Slovakia Proposes Mutual Defense Pact"
 slo_foreign.61.d: "The Slovak government seems to be actively developing the defense capabilities of the Danube region. They're proposing that we sign a mutual defense pact with them."
 slo_foreign.61.a: "We Agree"
 slo_foreign.61.b: "We Are Not Interested in That."
 slo_foreign.62.t: "Hungary Agrees"
 slo_foreign.62.d: "The Hungarian government has agreed to our proposal, which is a success of our negotiations"
 slo_foreign.62.a: "Nice"
 slo_foreign.63.t: "Hungary Refused"
 slo_foreign.63.d: "The Hungarian government rejected our proposal, which was a failure of our negotiations"
 slo_foreign.63.a: "Sad"
