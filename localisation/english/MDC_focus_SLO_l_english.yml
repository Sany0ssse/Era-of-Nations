 slo_foreign.66.a: "Sad"

 slo_sns.1.t: "Slovakia moves its embassy to Jerusalem"
 slo_sns.1.d: "The Slovak government recently announced the relocation of its embassy to Jerusalem. This move signifies Slovakia's official recognition of Jerusalem as the capital of our country. This marks the beginning of fruitful and friendly relations between our countries."
 slo_sns.1.a: "Let's drink to our new partners!"
 slo_sns.2.t: "The Prime Minister of Slovakia arrived in Jerusalem."
 slo_sns.2.d: "Today, a plane carrying a Slovak delegation led by the Prime Minister landed in Jerusalem. This diplomatic visit is linked to the improvement of relations between Jerusalem and Bratislava and promises to be fruitful. However, the outcome of this visit will depend on negotiations between the Slovak Prime Minister and the President of our country. What are the results of these negotiations?"
 slo_sns.2.a: "Let's sign the deal!"
 slo_sns.2.b: "We are not interested in dealings with Bratislava"
 slo_sns.3.t: "The visit to Jerusalem was fruitful"
 slo_sns.3.d: "Today, our plane carrying the Prime Minister and his delegation returned from Israel, where we had a successful meeting with the Israeli leader. We were able to sign a number of important documents and agreements that will forge a friendship between our countries!"
 slo_sns.3.a: "Let's drink to new friends!"
 slo_sns.4.t: "The failure of negotiations in Jerusalem"
 slo_sns.4.d: "Today, our plane carrying the Prime Minister and his delegation returned from Israel, where we held talks with the Israeli leader. Immediately after our plane landed in Minsk, judging by the frosty reception, it became clear that Belarus is not interested in doing business with our country."
 slo_sns.4.a: "Oh, okay..."

 slo_commi.1.t: "Slovakia requests guarantees"
 slo_commi.1.d: "Slovakia, a country where communism has once again triumphed, a country surrounded by bourgeois and imperialist countries, has turned to us for help. They are asking us to provide them with security guarantees and are prepared to host our military base on their territory, right in the center of Europe. This step is very beneficial for us, but it could be negatively received by NATO, so we should be cautious and carefully consider whether it's worth throwing away our guarantees."
 slo_commi.1.a: "Let's protect our communist brother!"
 slo_commi.1.b: "We won't take any risks."
 slo_commi.2.t: "Beijing gives guarantees"
 slo_commi.2.d: "Today, the Chairman of the Communist Party of China stated that China supports the regime in our country and provides guarantees for our security and territorial integrity."
 slo_commi.2.a: "We can feel safer"
 slo_commi.3.t: "Beijing refuses"
 slo_commi.3.d: "Chinese representatives expressed support for our country, but were unable to provide security guarantees. Apparently, they fear this move will appear aggressive in the eyes of the United States."
 slo_commi.3.a: "We will have to defend ourselves."
 slo_commi.4.t: "Economic Cooperation With [SLO.GetName]"
 slo_commi.4.d: "The Slovak government is ready to sign an economic agreement with us, under which we will receive good investments, and they will open visas for our workers to enter their country, which will also bring us some income in the future."
 slo_commi.4.a: "We Agree"
 slo_commi.4.b: "No"
 slo_commi.5.t: "Economic Cooperation With [NKO.GetName]"
 slo_commi.5.d: "They agreed to sign an economic cooperation agreement with us"
 slo_commi.5.a: "Nice"
 slo_commi.6.t: "Economic Cooperation With [NKO.GetName]"
 slo_commi.6.d: "They refused to sign an economic cooperation agreement with us"
 slo_commi.6.a: "Sad"

 slo_smer.1.t: "The immigrant problem"
 slo_smer.1.d: "Our country is seeing an increasing number of immigrants, primarily from the Middle East, where political instability is forcing millions of refugees to migrate to more favorable European countries like ours. Our citizens complain that migrants are taking their jobs and disrespecting our culture. It's time to address this disgrace. So, Mr. Prime Minister, what is your solution?"
 slo_smer.1.a: "Tighten migration policy"
 slo_smer.1.b: "Help migrants settle in our country"

 #Liberal Events
 slo_liberals.0.t: "Slovakia Joins OECD"
 slo_liberals.0.d: "Today marks a historic milestone for Slovakia as we officially join the Organisation for Economic Co-operation and Development. This achievement recognizes our commitment to economic reforms, democratic values, and international cooperation. OECD membership will provide us with valuable policy recommendations, economic data, and enhanced credibility on the world stage."
 slo_liberals.0.a: "A new chapter begins"

 slo_liberals.1.t: "U.S. Steel-Slovakia Deal"
 slo_liberals.1.d: "After extensive negotiations, we have successfully concluded a major deal with U.S. Steel Corporation. As part of the agreement, the Košice steel plant will be privatized, and U.S. Steel - Košice will be established as a subsidiary. Kosice and Slovakia as a whole will benefit economically from the agreement."
 slo_liberals.1.a: "The second breathe for the economy!"

 slo_liberals.2.t: "Investment Heaven"
 slo_liberals.2.d: "Forbes' comments that Slovakia has become an 'Heaven for Investors' clearly characterized the investment activity we are currently witnessing. In private conversations, many managers admit that they admire our approaches to ensuring economic growth. If things continue at this pace, we might become the new Switzerland or Slovenia."
 slo_liberals.2.a: "Investment time!"

 slo_liberals.3.t: "PM Meets the NATO Secretary"
 slo_liberals.3.d: "Prime Minister has held a high-profile meeting with the NATO Secretary General to discuss Slovakia's integration into the alliance. This meeting demonstrates our commitment to Euro-Atlantic security and strengthens our relationship with NATO member states. The discussions focused on Slovakia's contributions to collective defense and regional stability."
 slo_liberals.3.a: "We are committed to NATO"

 slo_liberals.4.t: "PM Appoints Special Prosecutor"
 slo_liberals.4.d: "In a significant step toward fighting corruption, the Prime Minister has appointed a Special Prosecutor to investigate high-level corruption cases and organized crime. This independent institution will have the authority to prosecute government officials and root out criminal networks that threaten the integrity of our state institutions."
 slo_liberals.4.a: "Corruption must be eliminated"

 slo_liberals.5.t: "Slovakian Miracle"
 slo_liberals.5.d: "Slovakia has achieved remarkable economic growth, becoming known worldwide as the fastest-growing economy in Europe. Thanks to effective market reforms, we have transformed from an isolated, struggling nation into a thriving investment hub. The 'Slovakian Miracle' demonstrates the success of our liberal economic policies and has restored our reputation in the international community."
 slo_liberals.5.a: "The reforms have paid off"

 slo_liberals.6.t: "PM Meets the EU Officials"
 slo_liberals.6.d: "Prime Minister Dzurinda has met with high-ranking European Union officials to discuss Slovakia's EU accession process. The meeting focused on our progress in meeting the Copenhagen criteria and our commitment to European integration. This demonstrates our determination to become a full member of the European family."
 slo_liberals.6.a: "We belong in Europe"

 slo_liberals.7.t: "First Reform Package Approved"
 slo_liberals.7.d: "The National Council has approved the first comprehensive package of economic reforms proposed by the liberal government. These reforms include tax simplification, deregulation, and measures to attract foreign investment. This victory in parliament marks the beginning of Slovakia's transformation into a modern, market-oriented economy."
 slo_liberals.7.a: "Reform is underway"

 #Mečiar Events
 slo_mechair.0.t: "Oligarchs Swear Loyalty"
 slo_mechair.0.d: "The most significant meeting in the history of Slovakia took place in the Grašalkovič Palace. The country's largest entrepreneurs gathered for a meeting with the Prime Minister. State media dubbed this meeting as 'bringing bandits and oligarchs to justice.'\n\nAt the open part of the meeting, the Prime Minister gave a huge speech, accusing the oligarchs of all the country's troubles and saying he would personally deal with anyone who touched the country's wealth.\n\nIn the closed part, a 'gangster deal,' as it was dubbed by opposition media, was concluded, involving the redistribution of property and the demarcation of spheres of influence in order to secure the loyalty of the mafia and oligarchs. After the meeting, observers noted the cheerful mood of all participants, which indicates the meeting's success.\n\nAfter the meeting, the Prime Minister addressed the nation, declaring a complete victory over bandits and shady businessmen."
 slo_mechair.0.a: "They know where their interests lie"

 slo_mechair.1.t: "President Gone Missing"
 slo_mechair.1.d: "Many independent observers and analysts have noted that the country's President has quietly disappeared from the information landscape. He doesn't appear on television channels, doesn't participate in official meetings, and doesn't give interviews. The only time he was seen was during the Independence Day celebrations, where he interacted with almost no one except his inner circle.\n\nSome analysts say the prime minister is quietly pressuring the president to eliminate any influence the presidential office has and informally concentrate all power.\n\nA group of opposition MP's have stated that they will put a resolution to a vote in a parliament demanding an explanation of the situation, and posters asking 'Where did the president disappear to?' are appearing all over Bratislava."
 slo_mechair.1.a: "This is concerning"

 slo_mechair.2.t: "Referendum of Dignity"
 slo_mechair.2.d: "Across the republic, people are gathering in large numbers at polling stations to vote in the referendum, which the republic's prime minister has called the 'Referendum of Dignity'. During the voting, anomalies and violations were recorded in many areas, ranging from fights with observers to intimidation by the mafia in some sparsely populated areas. The opposition claims there were instances of ballot stuffing in many polling stations and that people were forced to vote in favor of the referendum under threat of firing from many companies. A positive outcome for the referendum would mean that the prime minister will now be directly elected by the population and the parliament will switch to a majority system, which would allow Mechar to win a majority of seats given the fragmentation of the opposition."
 slo_mechair.2.a: "86,6% voted 'Yes'"

 slo_mechair.3.t: "A Quiet Morning in Bratislava"
 slo_mechair.3.d: "The morning in Bratislava was quite quiet. If every morning parliamentary sessions used to begin with screams from opposition deputies, brawls and fights, and throwing things at each other, now no one dares to say a word, and there's no one to say it to anyway, as the seats of the main troublemakers were empty, as were half the seats of all opposition factions.\n\nNow that half of the opposition deputies have been removed from politics, Mečiar's main opponents in the form of parliament and opposition parties have been completely destroyed, and the era of silence has finally arrived."
 slo_mechair.3.a: "And a Quite Pink Sky..."

 slo_mechair.4.t: "Slovakia Proposes an Economic Deal"
 slo_mechair.4.d: "Slovakia has proposed a significant economic cooperation agreement with Ukraine. This deal would strengthen trade relations, increase mutual investment, and deepen economic ties between our two nations. The agreement represents an opportunity to expand Slovakia's economic reach beyond Western Europe and build partnerships in the East."
 slo_mechair.4.a: "Accept the deal"
 slo_mechair.4.b: "Decline the offer"

 slo_mechair.5.t: "Ukraine Signs the Deal"
 slo_mechair.5.d: "Ukraine has agreed to sign the economic cooperation agreement with Slovakia. The deal has been successfully concluded, establishing improved trade relations and opening new opportunities for economic cooperation between our two countries. This partnership will benefit both nations economically and strengthen our diplomatic ties."
 slo_mechair.5.a: "Excellent news"

 slo_mechair.6.t: "Ukraine Refuses to Cooperate"
 slo_mechair.6.d: "Unfortunately, Ukraine has declined our proposal for an economic cooperation agreement. The Ukrainian government has decided not to pursue closer economic ties with Slovakia at this time. This setback will require us to seek alternative partnerships and economic opportunities elsewhere."
 slo_mechair.6.a: "We will find other partners"

 slo_mechair.7.t: "Slovakia Proposes an Economic Deal"
 slo_mechair.7.d: "Slovakia has proposed a significant economic cooperation agreement with Russia. This deal would strengthen trade relations, increase mutual investment, and deepen economic ties between our two nations. The agreement represents an opportunity to expand Slovakia's economic reach and build a strategic partnership with one of the world's largest economies."
 slo_mechair.7.a: "Accept the deal"
 slo_mechair.7.b: "Decline the offer"

 slo_mechair.8.t: "Russia Signs the Deal"
 slo_mechair.8.d: "Russia has agreed to sign the economic cooperation agreement with Slovakia. The deal has been successfully concluded, establishing improved trade relations and opening new opportunities for economic cooperation between our two countries. This partnership will benefit both nations economically and strengthen our diplomatic ties with Moscow."
 slo_mechair.8.a: "Excellent news"

 slo_mechair.9.t: "Russia Refuses to Cooperate"
 slo_mechair.9.d: "Unfortunately, Russia has declined our proposal for an economic cooperation agreement. The Russian government has decided not to pursue closer economic ties with Slovakia at this time. This setback will require us to seek alternative partnerships and economic opportunities elsewhere."
 slo_mechair.9.a: "We will find other partners"

 slo_mechair.10.t: "Slovakia Proposes an Economic Deal"
 slo_mechair.10.d: "Slovakia has proposed a significant economic cooperation agreement with China. This deal would strengthen trade relations, increase mutual investment, and deepen economic ties between our two nations. The agreement represents an opportunity to expand Slovakia's economic reach and build a strategic partnership with one of the world's largest economies."
 slo_mechair.10.a: "Accept the deal"
 slo_mechair.10.b: "Decline the offer"

 slo_mechair.11.t: "China Signs the Deal"
 slo_mechair.11.d: "China has agreed to sign the economic cooperation agreement with Slovakia. The deal has been successfully concluded, establishing improved trade relations and opening new opportunities for economic cooperation between our two countries. This partnership will benefit both nations economically and strengthen our diplomatic ties with Beijing."
 slo_mechair.11.a: "Excellent news"

 slo_mechair.13.t: "Slovakia Proposes to Reboot Relations"
 slo_mechair.13.d: "Slovakia has reached out to the European Union, proposing to reboot and normalize relations after the isolation of the Mečiar era. Despite our nationalist rhetoric, we recognize that Slovakia cannot survive in complete isolation. We seek a pragmatic compromise that allows us to maintain sovereignty while accessing European markets and funding."
 slo_mechair.13.a: "Accept their proposal"
 slo_mechair.13.b: "Reject their proposal"

 slo_mechair.14.t: "EU Agrees"
 slo_mechair.14.d: "The European Union has agreed to normalize relations with Slovakia. This represents a significant diplomatic victory and opens the door to improved trade, cooperation, and potential future integration. The EU's willingness to engage with Slovakia despite our nationalist policies demonstrates the importance of pragmatic diplomacy."
 slo_mechair.14.a: "A new beginning with Europe"

 slo_mechair.15.t: "EU Refuses"
 slo_mechair.15.d: "The European Union has rejected Slovakia's proposal to normalize relations. The EU remains skeptical of our nationalist policies and authoritarian tendencies. This rejection reinforces Slovakia's isolation and makes it clear that without meaningful democratic reforms, we will remain on the fringes of European integration."
 slo_mechair.15.a: "Europe has turned its back on us"

