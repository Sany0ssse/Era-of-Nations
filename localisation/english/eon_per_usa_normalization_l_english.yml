l_english:
 eon_per_usa_normalization_prepare_tt:0 "This focus can send one proposal to the United States, with a 30-day response period. Both countries must still exist, be at peace with each other and lack diplomatic ties; Iran must still meet the focus political conditions. A declined, withdrawn or closed proposal cannot be repeated through this focus."
 eon_per_usa_normalization_menu_ready_tt:0 "We must have Iran’s current, unanswered proposal within its 30-day response period. Both countries must still exist, lack diplomatic ties and be at peace with each other. Iran must still meet the focus’s original political conditions."
 eon_per_usa_normalization_restoration_tt:0 "Both countries agreed to restore diplomatic relations. The absence-of-diplomatic-ties penalties were removed while historical grievance modifiers were preserved."
 eon_per_usa_normalization_withdraw_request:0 "Withdraw our normalization proposal"
 eon_per_usa_normalization_withdraw_request_send_desc:0 "Withdraw our current unanswered proposal to the United States. Withdrawal is free. The national focus remains completed and cannot send this one-time proposal again."
 eon_per_usa_normalization_withdraw_tt:0 "Our unanswered proposal to the United States must still be within its 30-day response period. Withdrawal is free and leaves the national focus completed."
 eon_per_usa_normalization.1.t:0 "Iran withdrew its proposal"
 eon_per_usa_normalization.1.d:0 "Iran has withdrawn its proposal to restore diplomatic relations. Its earlier proposal can be closed. The existing diplomatic status continues."
 eon_per_usa_normalization.2.t:0 "Normalization proposal closed"
 eon_per_usa_normalization.2.d:0 "The proposal was withdrawn, its response period ended, or the countries could no longer proceed under its conditions. The national focus remains completed; this one-time proposal cannot be submitted again."
 eon_per_usa_normalization.ack:0 "Understood"
