l_english:
 eon_debt_bailout_request_title:0 "Direct debt repayment request"
 eon_debt_bailout_request_desc:0 "[FROM.GetName] requests direct debt repayment. The frozen maximum is [?eon_debt_bailout_amount|2] billion. Your treasury pays exactly the amount removed from its remaining debt, up to this maximum. Payment requires sufficient funds, peace, valid state status and an uncancelled request within 30 days. No automatic political influence is awarded."
 eon_debt_bailout_request_desc_overlord:0 "[FROM.GetName] requests direct debt repayment by its overlord. The frozen maximum is [?eon_debt_bailout_amount|2] billion. You pay exactly the reduction in its remaining debt. If payment occurs while it remains your subject, its autonomy ratio decreases by 0.35 once. This condition was disclosed before submission. Payment requires full funds, peace and an uncancelled request within 30 days."
 eon_debt_bailout_accept:0 "Pay the remaining debt up to the agreed maximum"
 eon_debt_bailout_refuse:0 "Decline or close this request"
 eon_debt_bailout_ack:0 "Understood"
 eon_debt_bailout_result_title:0 "Debt repayment request concluded"
 eon_debt_bailout_paid_desc:0 "The donor has paid part of our debt. Its treasury expense equals our debt reduction. This notice does not make another payment."
 eon_debt_bailout_refused_desc:0 "The donor declined the request. No money was charged and no debt was reduced."
 eon_debt_bailout_cancelled_desc:0 "The request was closed without payment because it was withdrawn, expired or no longer met its terms."
 eon_debt_bailout_legacy_title:0 "Old debt aid request cannot be reconciled"
 eon_debt_bailout_legacy_desc:0 "This old request has no reliable frozen donor and payment-stage receipt. It is closed without another transfer. Existing cash and debt remain unchanged. Previously charged cash cannot be reconstructed automatically. IMF records remain untouched; a new request uses the current terms."
 eon_debt_bailout_legacy_unresolved_tt:0 "Old unbound request: no payment, guessed refund or debt reduction. Existing cash, debt and the shared IMF record remain unchanged."
 eon_debt_bailout_request_terms_tt:0 "A frozen maximum of 20% / 15% / 10% / 50% of current debt is requested from the first investor / second investor / neighbour / overlord. The donor pays 1:1 for actual debt reduction. No automatic political influence. One request per participant; no cash escrow. Withdrawn or expired requests stay reserved until the donor consumes the old response window."
 eon_debt_bailout_overlord_terms_tt:0 "Overlord aid condition: after a real payment, our autonomy ratio decreases by 0.35 once. The same overlord relationship must still exist at payment."
 eon_debt_bailout_withdraw_request:0 "Withdraw the pending debt aid request"
 eon_debt_bailout_withdraw_request_desc:0 "Cancel payment permission. The pair stays reserved until the donor closes its existing response window; no cash is refunded because none was escrowed."
