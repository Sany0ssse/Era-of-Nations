 ### Free States of America ###
 COUNCIL_FOR_NATIONAL_PRESERVATION_DESC: "The Council, is a rump remnants of what was the federal government of the former United States. As such whatever is left is attempting to rally what people and territory it has left around a new flag. Members of the council look to create a sense of law and order as well as a sense of peace, this way they can then conduct a smooth transition of power to a new administration."

 ### Southern Republic of America ###
 MATHEW_CROUDER_DESC: "The \"Marshal\", or simply Mat/Mathew, is a bit of a paradox. Both talkative yet overtly quiet this young man has a sort of scatter brain approach to handling things or doing things that interest him. Despite his initial unlikeliness to become any kind of leader, his own soft power in terms of making acquaintances as well as his more gentle personality makes him a fairly relateable person. Though he has been known to be a bit of a hot head at times in more confrontational matters, he strives to do what he can for as many as he can. As he was once quoted by an interviewer, \"Life is a strange and confusing mess, you never truly know where you will end up even if you wanted to do something you may certainly find yourself doing the complete opposite. I mean from JROTC in highschool, to the odd hobby of writing a constitution and exploring the idea of a micro-nation, I never once would have even dreamed of being a political leader... Let alone one on a federal level.\" This somewhat naivety yet sort of boundless optimism has seen Mathew now put in charge of the Southern Republic of America, though what he'll do not many know, for now we just wait and see."

 ##### EUROPE #####

 ### POLAND ###
 ALEKSANDER_KWASNIEWSKI_DESC: "Aleksander Kwaśniewski (born November 15, 1954) is a Polish politician who served as President of Poland from 1995 to 2005. A graduate of the University of Warsaw with studies in history and journalism, Kwaśniewski began his political career in the 1980s. He served as Minister of Youth and Physical Culture before transitioning to parliamentary politics. As president, Kwaśniewski focused on Poland's integration with Western institutions, overseeing NATO accession in 1999 and EU membership in 2004. Known for his pragmatic approach to post-Cold War geopolitics, Kwaśniewski worked to stabilize Poland's position in Europe during a period of significant regional and continental transformation."
 JAN_OLSZEWSKI_DESC: "Jan Olszewski (born August 20, 1930) is a Polish politician and lawyer who served as Prime Minister of Poland in 1991. A leading figure in Poland's anti-communist opposition, Olszewski was active in Solidarity and underground publishing. His tenure as Prime Minister was marked by efforts to implement economic reforms and address transitional justice following communist rule. Olszewski's government pursued lustration policies aimed at revealing the past activities of former communist officials. Though his premiership was brief, lasting approximately ten months, it represented an important phase in Poland's early post-Cold War transition."
 LECH_KACZYNSKI_DESC: "Lech Kaczyński (born June 18, 1949 – died April 10, 2010) was a Polish politician who served as President of Poland from 2005 to 2010. A lawyer and former judge, Kaczyński was known for his conservative social positions and emphasis on traditional values. He co-founded the Law and Justice party and served as Warsaw's mayor before his election to the presidency. As president, Kaczyński pursued foreign policies emphasizing national sovereignty and took a skeptical stance toward Russian influence. His presidency was marked by efforts to address past injustices and implement constitutional reforms. Kaczyński died in a plane crash near Smolensk, Russia, an event that profoundly affected Polish political discourse."
 JAROSLAW_KACZYNSKI_DESC: "Jarosław Kaczyński (born June 18, 1952) is a Polish politician and lawyer who co-founded the Law and Justice party alongside his twin brother Lech. After his brother's death, Jarosław became the party's principal leader and strategist. He served as Prime Minister from 2006 to 2007 and again from 2015 onwards, leading governments that pursued conservative social policies and pursued investigations into historical injustices. Kaczyński is known for his emphasis on traditional Catholic values, state sovereignty, and skepticism toward supranational institutions. His political career has been marked by significant influence over Polish conservative movements and governance."
 DONALD_TUSK_DESC: "Donald Tusk (born April 22, 1957) is a Polish politician who served as Prime Minister of Poland from 2007 to 2014 and later as President of the European Council. A graduate of the University of Gdańsk, Tusk built a reputation as a pragmatic centrist and advocate of European integration. His government pursued EU-oriented foreign policies and supported economic liberalization measures. As Prime Minister, Tusk led Poland through the global financial crisis while maintaining relatively strong economic performance. Following his tenure in Warsaw, Tusk assumed leadership of the European Council, where he worked to coordinate EU responses to regional challenges and maintain institutional stability."
 MALGORZATA_KIDAWA_BLONSKA_DESC: "Małgorzata Kidawa-Błońska (born September 19, 1956) is a Polish politician and member of the Civic Platform party. An actress and cultural administrator before her political career, Kidawa-Błońska has served in the European Parliament and Polish Sejm. She is known for her advocacy of women's rights, civil liberties, and centrist economic policies. Her political positions emphasize the importance of democratic institutions, European integration, and social dialogue. Kidawa-Błońska has been involved in various parliamentary committees focused on culture, education, and social affairs."
 MACIEJ_PLAZYNSKI_DESC: "Maciej Płażyński (born May 9, 1958 – died June 10, 2011) was a Polish politician and businessman. A graduate of the University of Gdańsk, Płażyński served in various political positions and was known for his business acumen and entrepreneurial approach to governance. He held positions in multiple governments and was actively involved in economic policy discussions. Płażyński was considered among Poland's prominent centrist political figures before his death in an aviation accident."
 EWA_BOZENA_KOPAC_DESC: "Ewa Bożena Kopacz (born February 3, 1956) is a Polish politician and physician who served as Prime Minister of Poland from 2014 to 2015. A member of the Civic Platform party, Kopacz built her political career through service in local government and parliamentary chambers. As Prime Minister, she continued her predecessor's centrist policies and maintained Poland's European orientation. Kopacz focused on healthcare governance, having served as Minister of Health previously. Her tenure represented continuity in Poland's centrist political tradition during the mid-2010s."
 BRONISLAW_KOMOROWSKI_DESC: "Bronisław Komorowski (born June 19, 1952) is a Polish politician who served as President of Poland from 2010 to 2015. A member of the Civic Platform party, Komorowski worked to maintain institutional continuity following the death of his predecessor. His presidency emphasized European integration, institutional stability, and dialogue with various political factions. Komorowski represented centrist and pro-European positions during his tenure and maintained diplomatic engagement with Poland's international partners. His presidency focused on rebuilding national unity and pursuing pragmatic foreign policy."
 RAFAL_TRZASKOWSKI_DESC: "Rafał Trzaskowski (born June 29, 1972) is a Polish politician and member of the Civic Platform party who has served as Mayor of Warsaw since 2018. A graduate of Warsaw University with degrees in law, Trzaskowski also held positions as a researcher and journalist. He served in the European Parliament before transitioning to Polish municipal politics. As Warsaw's mayor, Trzaskowski has focused on urban development, environmental protection, and expanding social services. He is known for his centrist positions and advocacy of European values and democratic governance."
 LESZEK_MILLER_DESC: "Leszek Miller (born July 1, 1952) is a Polish politician who served as Prime Minister of Poland from 2001 to 2004. A member of the Democratic Left Alliance, Miller was active in Poland's post-communist transition. His government oversaw Poland's integration into NATO and the European Union, representing significant milestones in Poland's Western integration. Miller pursued moderate economic policies and worked to consolidate democratic institutions. His premiership resulted in Poland joining the European Union in 2004, a defining achievement of his tenure."
 WLODZIMIERZ_CZARZASTY_DESC: "Włodzimierz Czarzasty (born April 11, 1958) is a Polish politician and trade union activist who has led the Democratic Left Alliance. A longtime labor organizer, Czarzasty represents left-wing positions emphasizing workers' rights and social protection. He has served in the Sejm and represents constituencies focused on economic equality and workers' interests. Czarzasty's political positions emphasize social solidarity, democratic participation, and resistance to what he views as excessive market liberalization."
 WOJCIECH_JARUZELSKI_DESC: "Wojciech Jaruzelski (born July 6, 1923 – died May 25, 2014) was a Polish military officer and statesman who served as Prime Minister and later as President during Poland's transition from communist rule. A career military officer, Jaruzelski led Poland through the imposition of martial law in 1981 and the subsequent decade of communist governance. His decisions during this period remained controversial, with interpretations ranging from pragmatic necessity to authoritarian overreach. Following the fall of communism, Jaruzelski served briefly as President during the transition to democratic governance, facilitating Poland's shift to multiparty democracy."
 DANIEL_PODRZYCKI_DESC: "Daniel Podrzycki is a Polish political figure and intellectual associated with left-wing movements in Poland. He has been involved in various political organizations and represents perspectives emphasizing social justice and collective economic organization. Podrzycki's political career reflects engagement with socialist and communist ideas within Poland's post-Cold War context."
 ADAM_GIEREK_DESC: "Adam Gierek is a Polish political figure associated with communist-era politics. Following the fall of Poland's communist government, Gierek has maintained involvement in left-wing political movements representing continuity with Poland's socialist past. He represents political perspectives rooted in the institutional legacy of Poland's communist period."
 ANDRZEJ_LEPPER_DESC: "Andrzej Lepper (born February 22, 1954 – died September 5, 2011) was a Polish politician and farmer-activist known for his advocacy of agricultural interests and populist positions. A founder of the Self-Defense party, Lepper represented rural and working-class constituencies. He served in parliamentary and ministerial positions, advocating for protectionist agricultural policies and social welfare expansion. Lepper's political trajectory reflected grassroots rural activism and skepticism toward free-market economic policies."
 MATEUSZ_PISKORSKI_DESC: "Mateusz Piskorski (born November 20, 1978) is a Polish politician and journalist associated with left-wing and anti-establishment political movements. A co-founder of the Congress of the New Left, Piskorski represents perspectives critical of both traditional conservatism and neoliberal economics. He has been active in parliamentary politics and journalism, advocating for alternative approaches to economic and social policy."
 ANTONI_MACIEREWICZ_DESC: "Antoni Macierewicz (born October 28, 1948) is a Polish politician and security expert associated with conservative positions. A co-founder of the Center for Geopolitical Studies, Macierewicz has advocated for strong national defense and skepticism toward Russian intentions. He served as Minister of Defense and has been involved in intelligence and security policy. Macierewicz represents nationalist and sovereignty-focused perspectives in Polish politics."
 LECH_WALESA_DESC: "Lech Wałęsa (born September 19, 1943) is a Polish politician and former trade union leader who served as President of Poland from 1990 to 1995. An electrician by training, Wałęsa rose to prominence as chairman of the Solidarity trade union, which played a central role in Poland's anti-communist movement. Information about Polish People's Army participation by Wałęsa during communist rule has been subject to historical controversy. As president, Wałęsa advocated for rapid economic transformation and NATO integration. His presidency represented the transition from communist to democratic governance in Poland."
 PAWEL_KUKIZ_DESC: "Paweł Kukiz (born May 29, 1971) is a Polish musician and politician who entered political life as a political reformer and populist candidate. A well-known rock musician before his political career, Kukiz ran for president on an anti-establishment platform emphasizing direct democracy and electoral reform. He has served in parliamentary office and represents constituencies frustrated with traditional political structures. Kukiz's political positions combine populist skepticism toward institutional politics with advocacy for grassroots democratic participation."
 JAROSLAW_KALINOWSKI_DESC: "Jarosław Kalinowski (born March 23, 1971) is a Polish politician and activist who has been involved in various political movements and causes. He has advocated for various political reforms and represented constituencies focused on social and economic change. Kalinowski's political trajectory reflects engagement with differing approaches to Polish governance and social organization."
 WLADYSLAW_KOSINIAK-KAMYSZ_DESC: "Władysław Kosiniak-Kamysz (born May 24, 1977) is a Polish politician and physician who leads the Polish People's Party. A medical doctor specializing in pediatrics, Kosiniak-Kamysz has advocated for rural constituencies and agricultural protection. He represents centrist positions emphasizing social dialogue and balanced economic development. The People's Party, which he leads, maintains a traditional focus on peasant and rural interests within Poland's political landscape."
 WALDEMAR_WITKOWSKI_DESC: "Waldemar Witkowski (born October 2, 1946) is a Polish political figure and economist who has been involved in various economic and political discussions. He has advocated for particular approaches to economic policy and social organization within Poland's post-1989 transformation."
 MAREK_POL_DESC: "Marek Pol is a Polish political figure who has been involved in political movements and parliamentary work. He has represented various constituencies and policy positions within Poland's post-Cold War political system."
 LESZEK_BALCEROWICZ_DESC: "Leszek Balcerowicz (born January 19, 1947) is a Polish economist and politician known as the architect of Poland's economic transformation following communism. As Finance Minister under the Solidarity government, Balcerowicz implemented radical market reforms including the shock therapy economic program known as the Balcerowicz Plan. These reforms transformed Poland from a planned economy to a market system, though with significant social upheaval. Balcerowicz is credited by supporters with establishing foundations for Poland's economic growth, while critics argue his policies created significant hardship during transition. He has remained an influential voice in discussions of economic policy and institutional reform."
 ELZBIETA_BINCZYCKA_DESC: "Elżbieta Bińczycka (born April 25, 1954) is a Polish actress and political activist best known for her career in theater and cinema. She has been politically active, advocating for various social causes and representing civil society perspectives in public discourse. Bińczycka's political engagement reflects her broader commitment to cultural and social issues."
 SZYMON_HOLOWNIA_DESC: "Szymon Hołownia (born June 16, 1974) is a Polish television host and political figure who has been active as a reformist and anti-establishment candidate. Known for his career in entertainment media, Hołownia transitioned into politics advocating for institutional reform and new political approaches. He founded the Poland 2050 political movement, emphasizing generational change and alternative governance models. His political positions combine social liberalism with skepticism toward established political institutions."
 PIOTR_IKONOWICZ_DESC: "Piotr Ikonowicz (born February 14, 1955) is a Polish politician and activist associated with left-wing movements. A former Solidarity activist, Ikonowicz has represented constituencies focused on worker protections and social welfare. He has served in parliamentary positions and maintained engagement with labor and social movements throughout Poland's post-1989 period."
 BOGUSLAW_GORSKI_DESC: "Bogusław Gorski is a Polish political figure associated with left-wing and communist movements. He has been involved in representing perspectives rooted in Poland's communist heritage within the post-Cold War political landscape."
 CZESLAW_PIATAS_DESC: "Czesław Piątas is a Polish political figure associated with nationalist movements. He has represented perspectives emphasizing national sovereignty and conservative social positions within Poland's political discourse."
 FRANCISZEK_GAGOR_DESC: "Franciszek Gągor is a Polish political figure associated with nationalist and right-wing movements. He has represented constituencies emphasizing national identity and conservative political positions."
 ROMAN_GIERTYCH_DESC: "Roman Giertych (born July 4, 1971) is a Polish politician associated with nationalist and right-wing movements. Active in the League of Polish Families, Giertych has advocated for conservative Catholic social policies and nationalist positions. He served as Minister of Education and has been involved in parliamentary politics representing constituencies emphasizing traditional values and national identity."
 STAWOMIR_MENTZEN_DESC: "Sławomir Mentzen (born November 16, 1982) is a Polish politician and economist associated with libertarian and right-wing movements. Vice-Chair of the Confederation party, Mentzen advocates for free-market economics, reduced government intervention, and conservative social positions. He has campaigned for the presidency and served in parliamentary roles, representing constituencies emphasizing economic liberalism and national sovereignty."
 JANUSZ_KORWIN_MIKKE_DESC: "Janusz Korwin-Mikke (born January 27, 1942) is a Polish politician and former journalist known for libertarian and Right-wing positions. Co-founder of the Confederation movement and previously active in the Liberty and Homeland party, Korwin-Mikke advocates for minimal state intervention, free markets, and traditional conservative values. His political positions combine economic libertarianism with cultural conservatism. Korwin-Mikke has been a controversial and provocative figure in Polish politics, known for polarizing rhetoric and unconventional political positions."
 KAROL_NAWROCKI_DESC: "Karol Nawrocki (born October 24, 1976) is a Polish historian and political figure associated with nationalist and conservative movements. Director of the Polish Museum of World War II Education and an expert on Polish military history, Nawrocki has been active in public commentary on historical and contemporary issues. He has represented constituencies emphasizing national history, cultural heritage, and conservative positions in contemporary political debates."
 ANDRZEJ_OLECHOWSKI_DESC: "Andrzej Olechowski (born June 9, 1947) is a Polish economist and politician who has been involved in various political movements and parties. A former Minister of Foreign Affairs, Olechowski has represented centrist and pro-European positions in Polish politics. He has been associated with the Civic Platform party and has advocated for economic liberalization, European integration, and pragmatic governance. Olechowski's political career reflects engagement with Poland's post-communist transition and efforts to balance national interests with European cooperation."

 ### PORTUGAL ###
 ANTONIO_GUTERRES_LEADER_DESC: "António Manuel de Oliveira Guterres (born April 30, 1949) is a Portuguese politician and former physics professor who has led the Socialist Party since 1992. Graduating from the elite Instituto Superior Técnico in 1971, he briefly taught systems theory before joining the Socialist Party in 1974 following the Carnation Revolution. First elected to parliament in 1976, Guterres spent over 15 years in opposition, serving on numerous parliamentary committees and as a member of the Council of Europe's Parliamentary Assembly, where he chaired the Committee on Demography, Migration and Refugees. As party leader since 1992, he broke with Socialist tradition as a devout Catholic in a historically secular party. Elected Prime Minister in 1995, his first term saw economic expansion, continued privatizations, and successful stewardship of Expo '98 in Lisbon. A key internationalist, Guterres played a crucial role in securing the UN transitional administration in East Timor and finalizing Macau's transfer to China. Known for his consensus-building style and deep commitment to humanitarian causes, Guterres now faces a second term with a reduced majority, economic headwinds, and increasing party tensions."
 JOSE_MANUEL_BARROSO_LEADER_DESC: "José Manuel Durão Barroso (born March 23, 1956) is a Portuguese politician and former law professor who has led the Social Democratic Party since 1999. Graduating in law from the University of Lisbon, he earned a master's in political science from the University of Geneva with honors. In his youth, he was a leader of the Maoist MRPP before leaving in 1977. He joined the Social Democratic Party in 1980. Under Cavaco Silva's governments, he served as Secretary of State for Internal Administration, Secretary of State for Foreign Affairs and Cooperation, and from 1992 as Minister of Foreign Affairs. In this role, he was the driving force behind the 1991 Bicesse Accords for peace in Angola and initiated talks with Indonesia that eventually led to East Timor's self-determination. After the PSD lost the 1995 elections, he returned to teaching at the University of Lusíada and Georgetown University while remaining active in the party. In May 1999, he was elected president of the PSD, succeeding Marcelo Rebelo de Sousa. Known as an excellent diplomat with a brilliant international career, Barroso is nevertheless often described as lacking charisma and having difficulty communicating with the Portuguese public - a cold, calculating, and rational figure whose weakness as a public speaker contrasts sharply with his skills on the international stage."

 ##### ASIA #####

 ### CHINA ###
 JIANG_ZEMIN_LEADER_DESC: "Jiang Zemin (born August 17, 1926) is a former engineer who has led the Communist Party since 1989, replacing the reformist Zhao Ziyang in the wake of the Tienanmen Square protests. Previously he served as mayor of Shanghai and his continued favoring of individuals who served with him in Shanghai has led to his faction of the party being dubbed the "Shanghai Clique". An advocate of economic reform, his rule in the 1990s has seen a continuation of Deng Xiaoping's policy of reform and opening up and a normalizing of the private sector. He has also presided over the return of both Hong Kong and Macau to Chinese sovereign and has faced criticism over his heavy-handed approach to human rights."
 HU_JINTAO_LEADER_DESC: "Hu Jintao (born December 21, 1942) is a former engineer who experienced the denunciation of his father during the Cultural Revolution. As leader, he has expressed a desire to address the impacts that rapid economic growth has had on China's society and environment and heads the Tuanpai or Communist Youth League faction of the Communist Party. Together with premier Wen Jiabao, Hu seeks to more evenly distribute the gains of China's economic development and to adopt a less elitist mode of governance while firmly retaining the primacy of the Communist Party."
 XI_JINPING_LEADER_DESC: "Xi Jinping (born June 15, 1953) is part of a new generation of Chinese officials known as princelings. The son of a Communist Party veteran, Xi has emphasized centralization and the consolidation of power under his leadership, weakening political rivals and existing Communist Party factions through his anti-corruption campaigns. He is also a proponent of an assertive foreign policy, marking a departure from Deng Xiaoping's policy of keeping a low profile in international affairs."
 BO_XILAI_LEADER_DESC: "Bo Xilai (born July 3, 1949) is a well-known princeling and son of former Vice Premier Bo Yibo. Known for his tenure as Party Secretary of Chongqing, Bo is associated with his campaign against organized crime and his revival of "red culture" which has won him support among leftists dissatisfied with the in egalitarian trajectory of China's economic growth. Bo has earned many enemies during his political career, and has a controversial reputation."

 ### JAPAN ###

 ### KOREA ###
 KIM_DAE_JUNG_LEADER_DESC: "Kim Dae-jung (born January 6, 1924) is a well-respected figure in South Korean politics due to his long history of pro-democracy activism, with some referring to him as "the Nelson Mandela of Asia". Having survived a suspected assassination attempt, kidnapping by intelligence agents, as well as a death sentence, Kim has finally emerged from almost 50 years of opposition to lead his country. His priorities since he took office in 1998 have included economic recovery, holding Korea's powerful chaebols to account, and engaging with North Korea under his trademark Sunshine Policy."
 ROH_MOO_HYUN_LEADER_DESC: "Roh Moo-hyun (born August 6, 1946) is a former human rights lawyer from a poor background who defended student protestors against the authoritarian regime. Much like Kim Dae-jung, who has supported his presidency, Roh favors negotiations with the North rather than a policy of international isolation. He has also been openly critical of the United States and Japan, and has an antagonistic relationship with Korea's conservative establishment. Roh derives his support from the left-leaning "386 generation" who are in their 30s, went to college in the 80s, and were born in the 60s."
 LEE_MYUNG_BAK_LEADER_DESC: "Lee Myung-bak (born December 19, 1941) is a conservative politician and former CEO of Hyundai. During his time at Hyundai, he earned the nickname "Raging Bulldozer" in part due to his strict management approach. An ambitious figure, Lee hopes to transform Korea into one of the world's largest economies and promote an internationalist foreign policy that will elevate Korea's global status. In contrast to his left-wing counterparts, Lee favors a hardline approach to North Korea and a close partnership with the United States."
 PARK_GEUN_HYE_LEADER_DESC: "Park Geun-hye (born February 2, 1952) is best known for being the daughter of Park Chung-hee, Korea's former authoritarian leader who continues to have a controversial legacy. While some view Park Chung-hee as a brutal dictator who used torture and imprisonment to preserve his rule, others praise him for his economic achievements. In her youth, Park survived the assassination of both her mother and father, the former at the hands of a North Korean agent and the latter at the hands of the head of the Korean Central Intelligence Agency. Known for her conservative, market-oriented stance, Park favours deregulation, cutting taxes, and law and order."
 MOON_JAE_IN_LEADER_DESC: "Moon Jae-in (born January 24, 1953) is the son of North Korean refugees and a former human rights lawyer and activist. During his military service, Moon served as a special forces commando and took part in Operation Paul Bunyan, the ROK-USA joint response to the 1976 Panmunjon axe murder incident. A close friend of his predecessor Roh Moo-hyun, whom he had previously started a legal practice with, Moon was active in Roh's left-wing administration and was an important player in the Sunshine Policy, which he remains committed to. While committed to the US alliance, Moon has stated that Korea should learn how to say no to the Americans and hopes to take back wartime control of the Korean military from the US."
 YOON_SUK_YEOL_LEADER_DESC: "Yoon Suk Yeol (born December 18, 1960) was the former prosecutor general of the Republic of Korea and the chief prosecutor of the Seoul Central District Prosecutors' Office. During his presidency, Yoon Suk Yeol declared an emergency martial law, accusing the opposition of controlling the National Assembly, sympathizing with North Korea, and paralyzing the government through anti-state activities. But then the National Assembly voted to lift the martial law. Since then, Yoon Suk Yeol has been charged with sedition and ordered to be banned from leaving the country, becoming the first incumbent president in South Korean history to be banned from leaving the country. And later Yoon Suk Yeol was arrested, becoming the first incumbent president to be arrested in South Korean history."
 ### NORTH KOREA ###
 KIM_JONG_UN_LEADER_DESC: "Kim Jong-un (born January 8, 1984) was the son most valued by Kim Jong-il during his lifetime. During his days studying in Switzerland, his slightly obese frame made it possible to underestimate him. But when he did ascend to the throne, he shocked the world with his calmness, shrewdness and ruthlessness in the secret executions of his political enemies (including, according to unconfirmed reports, the execution of his paternal uncle with anti-aircraft guns), his determination to continue developing nuclear weapons despite international sanctions, and he catch precise timing of the friendly dialogue with the US and South Korea. Under his leadership as a \"great man from heaven\", perhaps there is a real possibility of North Korea becoming the \"Strong and Prosperous Nation\"?"
 KIM_JONG_NAM_LEADER_DESC: "Kim Jong-nam, (born May 10, 1971), is the son of Kim Jong-il and his second wife. As the eldest son of his family, Kim Jong-nam witnessed the misery of the people under the \"Arduous March\". During his time abroad, he saw the rapid development of China's reform and opening up, and was impressed by the power of change. He believed that only reform could bring material prosperity and spiritual happiness to the North Korean people, but he also understood that change could cost him his power. But he never regretted it."
 KIM_YO_JONG_LEADER_DESC: "Kim Yo-jong (born September 26, 1987), as the only girl in her family, has shown such talent since she began her political career that Kim Jong-il exclaimed when choosing his successor: \"If only Kim Yo-jong were a boy\". Perhaps because of her feminine image, she (peculiarly) enjoys a high level of support both at home and abroad. Today, her reign is proving that women can do just as well as men, no matter what kind of country's politics."

 ##### MIDDLE EAST #####
 
 ### Syria ###
 RIYAD_AL_TURK_DESC: "Riyad al-Turk (born May 3, 1930) is a Syrian political figure and economist who studied at Damascus University before gaining prominence as an advocate for democratic reform. Al-Turk has been an influential voice promoting dialogue among Syria's diverse political movements, seeking to bridge divides through economic and social reform initiatives. Drawing from decades of experience in Syrian political affairs, he emphasizes the importance of institutional strengthening and inclusive governance as paths toward national stability and development." 
 GEORGE_SABRA_DESC: "George Sabra (born 1942) is a Syrian economist and politician who has served as Minister of Economy and Foreign Trade. A member of the Syrian Communist Party, Sabra has been involved in economic planning and development initiatives, focusing on industrial growth and trade relations."
 HANIN_NIMIR_DESC: "Hanin Nimir (born 1981) is a Syrian journalist and political activist who has worked for major Arab newspapers including Al-Hayat. Known for her critical reporting on Syrian affairs and advocacy for democratic reforms, Nimir has been involved in opposition movements and media freedom campaigns."
 FARID_GHADRY_DESC: "Farid Ghadry (born 1953) is a Syrian-American businessman and political figure who founded the Reform Party of Syria. A former executive at ARAMCO, Ghadry has advocated for democratic reforms and market-oriented economic policies in Syria."
 HAYTHAM_MANNAA_DESC: "Haytham Manna (born 1964) is a Syrian physician and political activist who has been a prominent figure in the opposition movement. As a member of the National Coordination Committee for Democratic Change, Manna has advocated for peaceful democratic transition and civil society development."
 BASHAR_AL_ASSAD_DESC: "Bashar al-Assad (born September 11, 1965) is the President of Syria since 2000, succeeding his father Hafez al-Assad. Trained as an ophthalmologist, Assad has focused on economic modernization and technological development while maintaining Syria's political structure."
 SUHEIL_AL_HASSAN_DESC: "Suheil al-Hassan (born 1970) is a Syrian military general known as the 'Tiger' for his role in combat operations. A graduate of the Homs Military Academy, Hassan has commanded key military units and played significant roles in various military campaigns."
 MAHER_AJEEB_JAZZA_DESC: "Maher al-Assad (born 1967) is a Syrian military officer and brother of President Bashar al-Assad. As commander of the Republican Guard and 4th Armored Division, Maher has been involved in military operations and security matters."
 SHAYKH_ABDUL_QADEEM_ZALLUM_DESC: "Shaykh Abdul Qadeem Zallum (born 1969) is a Syrian Salafist cleric and religious leader who has been associated with Islamic movements. Known for his religious teachings and influence in conservative circles, Zallum has advocated for Islamic governance principles."
 RIYAD_HIJAB_DESC: "Riyad Hijab (born 1966) is a Syrian politician who served as Prime Minister from 2012 to 2013. A former governor of Qamishli, Hijab later became involved in opposition activities after leaving government."
 ALI_SADREDDINE_AL_BAYANOUNI_DESC: "Ali Sadreddine al-Bayanouni (born 1938) is a Syrian political figure and leader of the Muslim Brotherhood. Having lived in exile for many years, Bayanouni has advocated for Islamic democratic principles and opposition to authoritarian rule."
 MOHAMMAD_WALID_DESC: "Mohammad Walid (born 1950) is a Syrian businessman and political activist who has been involved in opposition movements. Known for his role in coordinating Syrian expatriate communities, Walid has advocated for democratic change."
 MOHAMMAD_RIAD_AL_SHAQFEH_DESC: "Mohammad Riad al-Shaqfeh (born 1951) is a Syrian engineer and political figure who has served as president of the National Coalition for Syrian Revolutionary and Opposition Forces. A former member of the Syrian parliament, Shaqfeh has advocated for democratic reforms."
 SAFWAN_AL_QUDSI_DESC: "Safwan al-Qudsi (born 1953) is a Syrian military officer who served as Chief of Staff of the Army and Armed Forces. A graduate of the Homs Military Academy, Qudsi has held various command positions in the Syrian military."
 MICHEL_KILO_DESC: "Michel Kilo (born 1940) is a Syrian Christian intellectual and political activist. A journalist and writer, Kilo has been involved in the Damascus Declaration and advocated for democratic reforms and civil liberties."
 RAMI_MAKHLOUF_DESC: "Rami Makhlouf (born 1969) is a Syrian businessman and cousin of President Bashar al-Assad. As head of the Makhlouf family business empire, Makhlouf has been involved in telecommunications, construction, and other industries."
 KHALED_KHOUJA_DESC: "Khaled Khouja (born 1965) is a Syrian physician and political activist who has been involved in opposition movements. As a former member of the Syrian parliament, Khouja has advocated for democratic change and civil society."
 QADRI_JAMIL_DESC: "Qadri Jamil (born 1952) is a Syrian politician who has served as Minister of Economy and Trade. A member of the Syrian Social Nationalist Party, Jamil has been involved in economic policy and political negotiations."
 JOSEPH_SWEID_DESC: "Joseph Sweid (born 1956) is a Syrian politician and former Minister of Administrative Development. A member of the Syrian Social Nationalist Party, Sweid has been involved in government administration and political affairs."
 ALI_ASLAN_DESC: "Ali Aslan (born 1930) is a Syrian military officer who served as Minister of Defense. A veteran of the 1963 Syrian coup, Aslan has held various military and political positions."
 ALI_ABDULLAH_AYYOUB_DESC: "Ali Abdullah Ayyoub (born 1952) is a Syrian military general who has served as Minister of Defense. A graduate of the Homs Military Academy, Ayyoub has commanded military units and held key defense positions."
 HAFEZ_AL_ASSAD_DESC: "Hafez al-Assad (born October 6, 1930) was the President of Syria from 1971 until his death in 2000. A former military officer and member of the Ba'ath Party, Assad came to power through a coup and established an authoritarian regime. His rule was marked by efforts to modernize Syria's economy and infrastructure, as well as a focus on maintaining political stability through a strong security apparatus. Assad's foreign policy was characterized by a complex relationship with neighboring countries and involvement in regional conflicts. Despite his authoritarian governance, Assad maintained a degree of popularity among certain segments of the Syrian population due to his emphasis on national pride and economic development."
 EMILE_LAHOUD_DESC: "Emile Lahoud (born January 12, 1936) is a Lebanese politician and former military general who served as President of Lebanon from 1998 to 2007. A member of the Maronite Christian community, Lahoud's presidency was marked by his close ties to Syria and his efforts to maintain stability in Lebanon during a period of political turmoil. Known for his strongman style and emphasis on security, Lahoud's tenure was also characterized by tensions with various political factions and international actors."
 MEJD_AL_ASSAD_DESC: "Mejd al-Assad (born 1969) is a Syrian businessman and member of the Assad family. As the son of Hafez al-Assad's brother, Mejd has been involved in various business ventures and has maintained a low profile in Syrian politics compared to other members of the Assad family."
 BUSHRA_AL_ASSAD_DESC: "Bushra al-Assad (born 1960) is a Syrian businesswoman and member of the Assad family. As the daughter of Hafez al-Assad, Bushra has been involved in various business ventures and has maintained a relatively low profile in Syrian politics compared to other members of the Assad family."
 AYMAN_AL_ZAWAHIRI_DESC: "Ayman al-Zawahiri (born June 19, 1951) is an Egyptian-born physician and Islamist militant who has served as the leader of al-Qaeda since 2011. A former member of the Egyptian Islamic Jihad, al-Zawahiri has been involved in various militant activities and terrorist plots across the Middle East and globally. Known for his ideological influence and strategic thinking, al-Zawahiri has authored numerous texts on jihadist theory and has been instrumental in directing al-Qaeda's operations and propaganda efforts during his tenure as leader."

##### AFRICA #####

 POLITICS_PAUL_KAGAME_DESC: "When Paul Kagame was 28, he helped topple the government of Uganda. At 36, he overthrew the genocidal Hutu-led government of Rwanda. At 39, he ousted Mobutu of DR Congo, Africa's most corrupt and repressive dictator. Kagame is probably the most successful military leader alive, having won more wars than anyone - all on a shoestring budget. While repressing all opposition at home, the Tutsi general is constantly fixing his eyes on further foreign ambitions, hunting down Hutu rebels and exploiting mineral riches."

 ##### Greece #####
 costas_simitis_desc: "Costas Simitis (born June 23, 1936) is the son of George Simitis lawyer and professor at the economic university of Athens. Having participated in anti government organizations during the Greek Junta Costas Simitis shortly after the fall of the Greek junta was a founding member of the Panhellenic Socialist Movement (PASOK) in 1974. During the 1981 PASOK electoral victory he was called to be in many governmental positions during the rule of Andreas Papandreou such as head of department of economics, agriculture, education and religion as well as simultaneous head of departments of industry, research, energy, technology and trade. After Andreas Papandreou died in 1996 he was elected to leadership of PASOK and shortly after he won in the 1996 general elections. Now Costas Simitis looks to steadily increase privatizations in the public sector, economic stability, lowering the national debt, solving Greco-Turkish disputes and most important increasing ties and cooperation with the European Union"
 nikolaos_michaloliakos_desc: "Nikolaos Michaloliakos (born December 11th, 1957) is the founder of Golden Dawn, the largest nationalist party of Greece. Michaloliakos was a supporter of the Greek Military regime and known for participating in many extremist right wing groups which had committed attacks on many anti dictatorship figures as well as a relation with the head of the Greek Junta Georgios Papadopoulos. In 1980, he formed the Golden Dawn far right party which aims to have an anti-leftist agenda, anti immigration, glorifying Greek authoritarian regimes such as the 1967 Junta and the 4th of August 1936 regime and aligning to Russia and China and moving away from the west. Michaloliakos and his Golden Dawn party have been condemned of being a criminal organization which targets minorities a having pro-neo-nazi and fascist views as well as an anti-democratic stance. In spite of the backlash against him Nikolaos Michaloliakos and his party have been rising in popularity as economic instability and social divides have been plunging Greece it has drawn more supporters to the Golden Dawn cause. If the situation becomes worse Nikolaos Michaloliakos may achieve his goals, taking power and building a new Greek state"
