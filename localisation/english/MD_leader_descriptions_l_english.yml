 #### NORTH AMERICA ####
 ### USA ###

 ## Western Autocrats ##
 CONGRESSIONAL_CHAMBERS_DESC: "With the Electoral College failing and the election beset by unexpected issues in the state of Florida, Congress scrambles to decide whom to vote for, or at the very least to fill the presidency before things boil over any more than they already have."
 MADELEINE_ALBRIGHT_LEADER_DESC: "Madeleine Albright (born May 15, 1937) is a Czech-American diplomat and the first woman to serve as U.S. Secretary of State. Born in Prague to a Jewish family, Albright fled to the United States with her family in 1948 following the Communist takeover of Czechoslovakia. After earning a PhD in public law and government from Columbia University, Albright embarked on a career in diplomacy, serving as U.S. Ambassador to the United Nations before being appointed Secretary of State in 1997. Known for her sharp intellect and assertive style, Albright played a key role in shaping U.S. foreign policy during the Clinton administration, particularly in relation to the Balkans and the Middle East. Her tenure was marked by efforts to promote democracy and human rights abroad, as well as navigating complex international crises."
 COLIN_POWELL_LEADER_DESC: "Colin Luther Powell (born April 5, 1937) is an American statesman and retired four-star general who served as the 65th U.S. Secretary of State under President George W. Bush. Born in Harlem to Jamaican immigrants, Powell rose through the ranks of the U.S. Army, serving in Vietnam and eventually becoming Chairman of the Joint Chiefs of Staff. As Secretary of State, Powell was a key figure in shaping U.S. foreign policy during the early 2000s, particularly in relation to the War on Terror and the Iraq War. Known for his pragmatic approach and emphasis on diplomacy, Powell's tenure was marked by efforts to build international coalitions and promote stability in volatile regions. However, his reputation was tarnished by the controversy surrounding the intelligence used to justify the invasion of Iraq."
 CONDOLEEZZA_RICE_LEADER_DESC: "Condoleezza Rice (born November 14, 1954) is an American political scientist and diplomat who served as the 66th U.S. Secretary of State under President George W. Bush. Born in Birmingham, Alabama, Rice grew up in a segregated society and became the first African-American woman to hold the position of Secretary of State. With a background in international relations and a focus on national security, Rice played a pivotal role in shaping U.S. foreign policy during the Bush administration, particularly in the aftermath of the September 11 attacks. Known for her strong stance on counterterrorism and her advocacy for democracy promotion, Rice's tenure was marked by efforts to build international coalitions and navigate complex global challenges, including the wars in Afghanistan and Iraq. Despite facing criticism for some of the administration's policies, Rice remains a significant figure in American diplomacy and foreign policy."
 HILLARY_CLINTON_LEADER_DESC: "Hillary Diane Rodham Clinton (born October 26, 1947) is a lifelong politician and advocate who has served as First Lady, U.S. Senator from New York, and Secretary of State under President Barack Obama. A graduate of Yale Law School, Clinton has built a career championing progressive causes, women's rights, and international diplomacy. Known for her work ethic and political pragmatism, Clinton advocates for healthcare reform, environmental protection, and engagement with international institutions. Her controversial use of a private email server during her tenure as Secretary of State has remained a subject of ongoing scrutiny."
 JOHN_KERRY_LEADER_DESC: "John Forbes Kerry (born December 11, 1943) is an American politician and diplomat who served as the 68th U.S. Secretary of State under President Barack Obama. Born in Aurora, Colorado, Kerry is a decorated Vietnam War veteran and a graduate of Yale University. As Secretary of State, Kerry played a key role in shaping U.S. foreign policy, particularly in relation to the Iran nuclear deal and the Paris climate agreement. Known for his diplomatic skills and commitment to multilateralism, Kerry's tenure was marked by efforts to promote global cooperation and address pressing international challenges. Despite facing criticism from some quarters, Kerry remains a respected figure in American diplomacy and continues to advocate for environmental causes."  
 
 ## WESTERN CONSERVATIVES ##
 GEORGE_BUSH_LEADER_DESC: "George Walker Bush (born July 6, 1946) is the first child of George Herbert Walker Bush, who served as the 41st American president from 1989 to 1993. After a brief stint in the oil industry, Bush entered politics and eventually became governor of Texas. Portraying himself as a compassionate conservative, Bush vows to cut taxes, increase military spending, and deregulate the corporate sector by removing unnecessary restrictions on greenhouse emissions."
 JOHN_MC_CAIN_LEADER_DESC: "John Sidney McCain III (born August 29, 1936) is a former naval aviator and U.S. Senator from Arizona. The son of a Navy admiral, McCain's military career was marked by his service in the Vietnam War, where he was captured and held as a prisoner of war for over five years. After retiring from the Navy, McCain entered politics and served in the Senate for over three decades. Known for his maverick style and willingness to cross party lines, McCain advocates for a strong national defense, free trade, and a pragmatic approach to foreign policy. Despite his conservative credentials, McCain has often been at odds with his party on issues such as campaign finance reform and immigration, and he has frequently taken independent stances that set him apart from party leadership."
 MITT_ROMNEY_LEADER_DESC: "Willard Mitt Romney (born March 12, 1978) is one of four children born to automobile executive George W. Romney. A devout Mormon and firm believer in laissez-faire economics and conservative family values, Romney vows to use his years of business experience to cut government waste, increase military spending, and remove restrictions placed on Wall Street and large corporations."
 DONALD_TRUMP_LEADER_DESC: "Donald John Trump (born June 14, 1946) is the multibillionaire son of real estate developer Frederick Christ Trump. With a small loan of a million dollars, Trump founded and expanded numerous businesses under the Trump Organization since 1971. Known for virulent rants and an impulsive style of leadership inherited from his days as a television personality, Trump has quickly made as many enemies as he has friends. Upon taking the presidency, Trump vows to curb illegal immigration, increase military spending, install protectionist tariffs, and firmly put America First."
 MARCO_RUBIO_LEADER_DESC: "Marco Antonio Rubio (born May 28, 1971) is a Cuban-American politician and U.S. Senator from Florida. Rising through Florida state politics, Rubio has positioned himself as a staunch hawk on foreign policy, particularly regarding Cuba and Venezuela. Known for his eloquent rhetoric and youthful energy, Rubio advocates for lower taxes, strong military spending, and tough immigration policies while opposing socialistic policies. Despite his rise as a prominent Republican voice, his shifting political positions have drawn criticism from both liberal and conservative quarters."
 JAMES_DAVID_VANCE_LEADER_DESC: "James David Vance (born August 2, 1984) is an American author and politician who has served as a U.S. Senator from Ohio since 2023. Born in Middletown, Ohio, Vance is best known for his memoir 'Hillbilly Elegy,' which explores the struggles of working-class Americans. As a senator, Vance has positioned himself as a conservative voice advocating for economic populism, cultural traditionalism, and a strong national defense. Known for his candid and often controversial statements, Vance has drawn both praise and criticism for his views on issues such as trade, immigration, and national identity."
 RON_DESANTIS_LEADER_DESC: "Ronald Dion DeSantis (born September 14, 1978) is an American politician and U.S. Senator from Florida. A former Navy officer and Yale graduate, DeSantis has built a reputation as a conservative firebrand with a focus on culture war issues. Known for his combative style and willingness to take on both Democrats and establishment Republicans, DeSantis advocates for limited government, strong law enforcement, and a tough stance on immigration and public order."
 VIVEK_RAMAIAH_LEADER_DESC: "Vivek Ramaswamy (born August 9, 1985) is an American entrepreneur and political figure known for his outspoken views on capitalism and culture. As the founder of a successful biotech company, Ramaswamy has positioned himself as a proponent of free-market principles and a critic of what he perceives as excessive corporate regulation and political correctness. Known for his sharp rhetoric and willingness to challenge both the left and right, Ramaswamy advocates for policies that promote economic growth, innovation, and individual liberty while opposing what he sees as the overreach of government in both economic and social spheres."
 SARAH_HUCKABEE_SANDERS_LEADER_DESC: "Sarah Elizabeth Huckabee Sanders (born August 13, 1982) is an American political figure and former White House Press Secretary under President Donald Trump. The daughter of former Arkansas Governor Mike Huckabee, Sanders has been a prominent voice in conservative politics, known for her staunch defense of the Trump administration's policies and her combative style with the media. As Press Secretary, Sanders was responsible for communicating the administration's message to the public and often found herself at the center of controversy due to her handling of press briefings and her unwavering loyalty to President Trump. After leaving the White House, Sanders has continued to be an influential figure in Republican politics and has expressed interest in pursuing elected office herself."

 ## TEMP ##
 BERNIE_SANDERS_LEADER_DESC: "Bernard Sanders (born September 8, 1941) is the son of working-class Polish immigrants to the United States. Joining the Young People’s Socialist League during his college years, Sanders advocated for the equal treatment of white and Black people during the Civil Rights Movement. Sanders later became mayor of Burlington, Vermont, and was eventually elected to the U.S. House of Representatives and the U.S. Senate. A self-described democratic socialist and progressive, Bernie Sanders vows to reduce military spending, increase the power of labor unions, and create a universal healthcare system."
 BARACK_OBAMA_LEADER_DESC: "Barack Hussein Obama (born August 4, 1961) is the former 44th President of the United States and the first African-American to hold the office. The son of a Kenyan father and American mother from Kansas, Obama rose from relative obscurity to the presidency through his charismatic speaking ability and message of hope and change. As president, Obama pursued healthcare reform through the Affordable Care Act, oversaw the financial crisis recovery, and conducted a generally cautious foreign policy emphasizing diplomacy over military intervention. His presidency inspired millions while simultaneously drawing fierce criticism from political opponents."
 BILL_CLINTON_LEADER_DESC: "William Jefferson Clinton (born August 19, 1946) is the former 42nd President of the United States and a Rhodes Scholar. Rising from modest beginnings in Arkansas, Clinton built a reputation as a moderate Democrat who could appeal to both progressives and centrists. His presidency saw economic expansion and relative peace, though it was marred by foreign policy challenges and a personal scandal leading to impeachment. Known for his political cunning and ability to triangulate between opposing forces, Clinton shaped the Democratic Party's centrist direction and remains an influential political figure across the globe."
 GARY_JOHNSON_LEADER_DESC: "Gary Earl Johnson (born January 1, 1953) is a libertarian politician and two-term governor of New Mexico who believes in minimal government intervention. A successful businessman turned politician, Johnson champions individual liberty, drug policy reform, free markets, and non-interventionist foreign policy. Johnson advocates for cutting government spending, reducing regulation, and respecting civil liberties across the political spectrum. As a third-party candidate, he represents an alternative to both major parties, though his proposals are often dismissed as impractical by establishment figures."
 RAND_PAUL_LEADER_DESC: "Randal Howard 'Rand' Paul (born January 7, 1963) is a U.S. Senator from Kentucky and ophthalmologist who champions libertarian principles within the Republican Party. Son of former presidential candidate Ron Paul, Rand advocates for non-interventionist foreign policy, civil liberties protections, and limited government. Known for his filibusters against government overreach and surveillance programs, Paul represents a faction of Republicans skeptical of military spending and foreign wars. Despite his principled stands, his positions often alienate him from traditional conservative establishments."
 DAVID_DUKE_LEADER_DESC: "David Ernest Duke (born July 1, 1950) is a former Republican politician and white nationalist activist whose career has been marked by extreme racism and antisemitism. A former Grand Wizard of the Knights of the Ku Klux Klan, Duke has run for various political offices on a platform of white supremacy and opposition to immigration and multiculturalism. Despite attempts to mainstream his views through political campaigns, Duke remains widely condemned by mainstream political parties and civil rights organizations. His influence is primarily limited to fringe extremist circles."
 ANN_COULTER_LEADER_DESC: "Ann Hart Coulter (born December 8, 1961) is a prominent conservative political commentator and author known for inflammatory rhetoric and provocative statements. A lawyer by training, Coulter has built a career in right-wing media through television appearances, syndicated columns, and numerous books. Known for her sharp wit and willingness to attack liberal figures personally, Coulter advocates for restrictive immigration policies, Christian values in politics, and military strength. Her combative style has made her both a celebrated figure among conservatives and a controversial target for critics."

