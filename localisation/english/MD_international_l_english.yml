 IS_ir_nation_sel_display_text: "[?var:open_state.GetName] [?var:open_state.GetFlag]"
 CT_national_selected_nation_display_text: "[?var:ct_state_selected.GetName] [?var:ct_state_selected.GetFlag]"
 CT_terror_radicalization_text: "[THIS.radicalization_loc] ([?THIS.radicalization|0])"
 CT_terror_radicalization_text_delayed: "This value represents the current level of §YRadicalization§! in a nation. The value of §YRadicalization§! can have a different minimum and maximum based on a variety of conditions. The conditions include whether a nation is at war, has high Corruption, low stability, is a jihadist government, the completion of specific national focuses or has a low GDP/c.\n\n\n[THIS.GetNameWithFlag] §YRadicalization§! Max: [?max_radical_display|2]\n[THIS.GetNameWithFlag] §YRadicalization§! Min: [?min_radical_display|2]"

 CT_terror_threat_text: "[THIS.threat_level_flag] ([?THIS.threat_level|0])"
 CT_terror_threat_text_delayed: "This value represents the current level of §YThreat Level§! in a nation. The value of §YThreat Level§! can have a different minimum and maximum based on a variety of conditions. The conditions include whether a nation is at war, has high Corruption, low stability, is a jihadist government, the completion of specific national focuses or has a low GDP/c.\n\n[THIS.GetNameWithFlag] §YThreat Level§! Max: [?max_terror_threat_display|2]\n[THIS.GetNameWithFlag] §YThreat Level§! Min: [?min_terror_threat_display|2]"

