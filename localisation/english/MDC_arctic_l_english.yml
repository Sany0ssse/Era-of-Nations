 arctic_council_member_desc: "The Arctic Council was established by the Ottawa Declaration in 1996 as a high-level intergovernmental forum to promote cooperation among the eight Arctic States: Canada, Denmark (including Greenland and the Faroe Islands), Finland, Iceland, Norway, Russia, Sweden, and the United States. Six organizations representing Arctic indigenous peoples participate as Permanent Participants, ensuring their full consultation and involvement in all aspects of Council work. The Council focuses on sustainable development and environmental protection in the Arctic, operating through five working groups dedicated to monitoring, conservation, emergency response, and marine protection. All decisions are taken by consensus among the member states."
