 arctic.48.a: "Ok"

 arctic.49.t: "Arctic Employee Frozen"
 arctic.49.d: "A worker at an Arctic station froze to death because he wasn't wearing a hat."
 arctic.49.a: "He should've listened to grandma"

 arctic.50.t: "Agartha is Found"
 arctic.50.d: "One of our military from contingent stationed in the Arctic claims that he found the entrance to Agarta and saw UFO take off from there. He definitely needs to sleep more and drink less energy drink."
 arctic.50.a: "Durka"

 arctic.51.t: "T-34 Polar Bear"
 arctic.51.d: "A polar bear with the inscription T-34 has been discovered in our Arctic territory. Because of the inscription, it is difficult for him to hunt. Now he is being fed by our military, it looks like they are used to each other. What should we do?"
 arctic.51.a: "Leave it to the military"
 arctic.51.b: "Catch & Wash"

 arctic.52.t: "Husky Laika"
 arctic.52.d: "A mixed-breed dog has arrived at our military base. The military is feeding him and they are already used to him.Should we leave the dog to the military or find owners?"
 arctic.52.a: "Leave it to the military"
 arctic.52.b: "Find Owner"

 arctic.53.t: "Lost German in the Arctic"
 arctic.53.d: "A lost man came across our base in the Arctic. It looks like he speaks German. Let him in?"
 arctic.53.a: "Yes"
 arctic.53.b: "He looks kinda SUS"

 arctic.54.t: "Abandoned base in the Arctic"
 arctic.54.d: "During the exploration of the Arctic region, an abandoned fleet base was found. A little restoration work and it can be used."
 arctic.54.a: "Good"

