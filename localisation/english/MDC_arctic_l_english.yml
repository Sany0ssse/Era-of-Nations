 arctic.1.t: "Arctic Mutual Research Treaty Proposal"
 arctic.1.d: "[FROM.GetNameWithFlag] Proposes Arctic Mutual Research Treaty for conducting joint research in the Arctic"
 arctic.1.a: "Sure, why not"
 arctic.1.b: "No"

 arctic.2.t: "Arctic Mutual Resources Treaty Proposal"
 arctic.2.d: "[FROM.GetNameWithFlag] Proposes Arctic Mutual Resources Treaty for conducting joint resources extraction in the Arctic"
 arctic.2.a: "Sure, why not"
 arctic.2.b: "No"

 arctic.4.t: "Arctic Treaty Accepted"
 arctic.4.d: "[FROM.GetNameWithFlag] Accepted our Threaty"
 arctic.4.a: "Good"

 arctic.5.t: "Arctic Treaty Declined"
 arctic.5.d: "[FROM.GetNameWithFlag] Declined our Threaty"
 arctic.5.a: "Maybe next time"

 arctic.3.t: "Arctic Recources Extraction Resolution"
 arctic.3.d: "Should we allow countries to extract resources in the Arctic?"
 arctic.3.a: "Yes"
 arctic.3.b: "No"

 arctic.6.t: "Arctic Recources Extraction Resolution Succeed"
 arctic.6.d: "The Arctic resource rush has begun"
 arctic.6.a: "Ok"

 arctic.7.t: "Arctic Recources Extraction Resolution Failed"
 arctic.7.d: "Resolution on allowing countries to extract resources in the Arctic has not been adopted"
 arctic.7.a: "Ok"

 arctic.8.t: "Vote to Kick Arctic Council Member"
 arctic.8.d: "[FROM.GetNameWithFlag] Initiated voting to kick [?var:global.arctic_member_to_kick.GetNameWithFlag] from Arctic Council"
 arctic.8.a: "Kick him"
 arctic.8.b: "No"

 arctic.9.t: "Resolution to Kick Arctic Council Member Succeed"
 arctic.9.d: "Resolution to kick [?THIS.arctic_member_to_kick.GetNameWithFlag] from Arctic Council Succeed"
 arctic.9.a: "Ok"

 arctic.10.t: "Resolution to Kick Arctic Council Member Failed"
 arctic.10.d: "[?THIS.arctic_member_to_kick.GetNameWithFlag] remains a member of the Arctic Council"
 arctic.10.a: "Ok"

 arctic.11.t: "Scientific Base Successfully Established"
 arctic.11.d: "Our investments in the region [?arctic_region_to_build_lab] have paid off and enabled us to create a new research complex, thanks to which we will accelerate our process of exploring the Arctic terrain and subsoil"
 arctic.11.a: "Good"

 arctic.12.t: "Arctic Region Battle Lost"
 arctic.12.d: "We lost battle in arctic sector [?FROM.arctic_region_to_attack_number]"
 arctic.12.a: "Bad"

 arctic.13.t: "Arctic Region Battle Won"
 arctic.13.d: "We won battle in arctic sector [?FROM.arctic_region_to_attack_number]"
 arctic.13.a: "Good"

 arctic.14.t: "[FROM.GetNameWithFlag] wants to buy a new Sector in the Arctic"
 arctic.14.d: "[FROM.GetNameWithFlag] is prepared to pay us a large sum of money in exchange for us selling them our Sector Territories in the Arctic"
 arctic.14.a: "We Agree"
 arctic.14.b: "No"

 arctic.15.t: "[FROM.GetNameWithFlag] has agreed to sell us their Sector"
 arctic.15.d: "[FROM.GetNameWithFlag] agreed to transfer control of their Sector Territories to us in exchange for the sum of money we promised"
 arctic.15.a: "Good"

 arctic.16.t: "[FROM.GetNameWithFlag] refused to sell us their Sector Territories"
 arctic.16.d: "[FROM.GetNameWithFlag] is not interested in selling us part of their territories"
 arctic.16.a: "Meh"

 arctic.17.t: "General killed"
 arctic.17.d: "[arctic_general_name] was killed during battle"
 arctic.17.a: "Press F"

 arctic.18.t: "Ace Killed"
 arctic.18.d: "One of [ROOT.GetNameWithFlag]'s most famous aces, has gone down in the line of duty. Pilots returning from the mission report having spotted ace going down in flames after taking heavy enemy fire. Unfortunately, since killed ace has long since been a public figure, the demise of ace is severely demoralizing to the many people who looked up to ace.\n\nWhile we wish there was a way to hide this event from the people, the lack of public appearances from ace would soon raise suspicion. Ultimately, ace death is another part of a legend that will hopefully live on long past our current troubles."
 arctic.18.a: "Press F"

 arctic.19.t: "Ace Promoted"
 arctic.19.d: "Few take as many risks as the brave pilots of the [ROOT.GetNameWithFlag] air force. A skilled pilot, has distinguished in not only returning alive, but piloting with immense skill. Recently, pilot was on a mission and was instrumental to the success of this critical encounter.\n\nHeld up as a shining example of courage, pilot's recent promotion has been highly publicized. Although the people may view war as more hell than glory, many are glad to see that there are still heroes to rally behind."
 arctic.19.a: "That's how legends are born"

 arctic.20.t: "Arctic Lands Negotiations"
 arctic.20.d: "[FROM.GetNameWithFlag] asks us to recognize sector [?global.arctic_land_to_squander] as their territory"
 arctic.20.a: "Let them take this piece of ice"
 arctic.20.b: "We will not squander government lands"

 arctic.21.t: "[FROM.GetNameWithFlag] Wants to Become Arctic Observer State"
 arctic.21.d: "[FROM.GetNameWithFlag] Has Sent Us a Request to Ratify Its Observer Status in the Arctic Council"
 arctic.21.a: "We Agree"
 arctic.21.b: "No"

 arctic.22.t: "Resolution on the Ratification of a New Arctic Council Observer State Succeed"
 arctic.22.d: "Resolution to Ratify [FROM.GetNameWithFlag] Observer Status in the Arctic Council Succeed"
 arctic.22.a: "Good"

 arctic.23.t: "Resolution on the Ratification of a New Arctic Council Observer State Failed"
 arctic.23.d: "Resolution to Ratify [FROM.GetNameWithFlag] Observer Status in the Arctic Council Fails"
 arctic.23.a: "Meh"

 arctic.24.t: "[FROM.GetNameWithFlag] Wants to Become a Member of the Arctic Council"
 arctic.24.d: "[FROM.GetNameWithFlag] Sent Us a Request to Ratify Its Status as a Member of the Arctic Council"
 arctic.24.a: "We Agree"
 arctic.24.b: "No"

 arctic.25.t: "Resolution on the Ratification of a New Arctic Council Member Succeed"
 arctic.25.d: "Resolution to Ratify [FROM.GetNameWithFlag] Status as a New Arctic Council Member Succeed"
 arctic.25.a: "Good"

 arctic.26.t: "Resolution on the Ratification of a New Arctic Council Member Failed"
