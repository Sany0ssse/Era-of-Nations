 arctic.47.t: "Arctic Employee wants Sushi"
 arctic.47.d: "One of the employees of our Arctic base wrote on social media that he wanted to eat sushi"
 arctic.47.a: "Deliver Sushi"
 arctic.47.b: "No"

 arctic.48.t: "Arctic Sushi Delivery"
