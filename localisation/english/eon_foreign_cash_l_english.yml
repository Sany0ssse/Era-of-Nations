l_english:
 eon_foreign_cash_offer_available_tt:0 "A pending financial offer can be sent to this eligible partner. Your treasury must cover the full 7 billion grant, and the recipient must be able to receive it. An unanswered expired offer permanently closes financial offers to that partner; an unidentifiable old proposal closes this financial-offer channel."
 eon_foreign_cash_offer_tt:0 "Offer a one-off grant of §Y7 billion§! to [FROM.GetName]. They have §Y30 days§! to respond. No money is transferred before their consent and a final check of both countries' eligibility and treasuries. Only one financial offer can await a reply at a time."
 eon_foreign_cash.1.t:0 "An offer of financial support"
 eon_foreign_cash.1.d:0 "[FROM.GetName] offers us a one-off grant of 7 billion to support our defence. We may accept or decline within 30 days. Acceptance authorizes the transfer if both countries still qualify and the full sum can be paid and received. The grant also gives the provider the existing influence benefit of financial support. It creates no loan, repayment obligation or recurring payment."
 eon_foreign_cash.1.a:0 "Accept the financial support"
 eon_foreign_cash.1.b:0 "Decline or close the offer"
 eon_foreign_cash_accept_tt:0 "Authorize a one-off §Y7 billion§! grant. The provider's funds and the recipient's treasury capacity, defensive war, power ranks and bilateral relations are checked again before execution. A failed final check closes the offer without transferring money. After consent, the proposal can no longer be withdrawn or declined."
 eon_foreign_cash_decline_tt:0 "Close this offer without payment or any new financial obligation."
 eon_foreign_cash_unmatched_tt:0 "This proposal is already answered or no longer open. Acknowledging this message cannot transfer money."
 eon_foreign_cash_withdraw_offer:0 "Withdraw financial support offer"
 eon_foreign_cash_withdraw_offer_desc:0 "Withdraw the outstanding one-off financial offer to this partner before they consent. No money has been transferred."
 eon_foreign_cash_withdraw_offer_send_desc:0 "Withdraw this financial offer? There is no payment or fee. Another proposal remains unavailable until the partner closes the withdrawn offer or its reply period ends. If it expires unanswered, future financial offers to this partner are permanently unavailable."
 eon_foreign_cash.3.t:0 "Financial offer withdrawn"
 eon_foreign_cash.3.d:0 "The provider withdrew the proposal before our consent. No money was transferred. We can close the original proposal when it appears."
 eon_foreign_cash.4.t:0 "Financial proposal expired"
 eon_foreign_cash.4.d:0 "The proposal could no longer be completed within its reply period or its partner ceased to exist. No money was transferred. Further financial offers to this partner are permanently unavailable. Financial offers to other eligible countries remain available."
 eon_foreign_cash.5.t:0 "Financial offers unavailable"
 eon_foreign_cash.5.d:0 "An incomplete financial proposal could not be matched safely to its partner. No money was transferred. This country's financial-offer channel cannot be reopened; other diplomatic actions remain available."
 eon_foreign_cash.6.t:0 "Financial offer closed"
 eon_foreign_cash.6.d:0 "The financial proposal was declined, withdrawn, or no longer met the conditions for execution. No grant was paid."
 eon_foreign_cash.7.t:0 "Financial support paid"
 eon_foreign_cash.7.d:0 "The recipient consented and the final conditions were met. We paid the full one-off grant of 7 billion and received the existing influence benefit of financial support."
 eon_foreign_cash.ack:0 "Understood"
