l_english:
 eon_support_request_withdraw_request:0 "Withdraw our support request"
 eon_support_request_withdraw_request_send_desc:0 "Withdraw our unanswered request to this partner. No support has been agreed at this stage. Withdrawal is free and does not refund the original request cost or reset its 360-day cooldown."
 eon_support_request.1.t:0 "Support request withdrawn"
 eon_support_request.1.d:0 "The requesting country has withdrawn its initial request. We can close its earlier request without offering support. Any separately agreed assistance remains governed by its own terms."
 eon_support_request.2.t:0 "Support request closed"
 eon_support_request.2.d:0 "The initial request could no longer be considered because its response period ended or the countries could no longer proceed under the wartime conditions. Its 360-day cooldown remains. Separately offered or agreed support is unaffected."
 eon_support_request.ack:0 "Understood"
 eon_support_request_menu_available_tt:0 "We must have this partner's unanswered support request within its 30-day response period, and both countries must still meet the defensive-war requirements."
