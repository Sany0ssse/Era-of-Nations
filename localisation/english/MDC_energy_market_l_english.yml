 ENERGY_CONTRACT_AGREEMENT_TITLE: "Propose £text_icon_energyies §YEnergy Agreement§!"
 ENERGY_CONTRACT_AGREEMENT_ACTION_DESC: "The conclusion of the £text_icon_energyies Energy Agreement will allow us to send this country contracts to buy their energy or to sell them our energy. Equally, this country will also be able to send us similar contracts. It is mutually beneficial!"
 PROPOSE_ENERGY_AGREEMENT_ACCEPT_TT: "£text_icon_energyies §YEnergy Agreement§! came into force"
 PROPOSE_ENERGY_AGREEMENT_ACCEPT_DESC: "£text_icon_energyies §YEnergy Agreement§! came into force. Now we can buy or sell energy to this state."
 PROPOSE_ENERGY_AGREEMENT_TOOLTIP: "We not have an §YEnergy Agreement§! with [From.GetNameWithFlag]"
 PROPOSE_ENERGY_AGREEMENT_DESC: "Do you want to send a proposal to a [From.GetNameWithFlag] to sign an £text_icon_energyies §YEnergy Agreement§!? Concluding an energy deal will increase our mutual influence by §G1-5%§!, improve relations by §G50§! and allow us to conclude contracts for the transit of our energy to the [From.GetNameWithFlag] or the transit of [From.GetFlag][From.GetAdjective] energy to our country."
 CANCEL_ENERGY_AGREEMENT_TITLE: "Break £text_icon_energyies §YEnergy Agreement§!"
 base_energy_condition: "Base Reluctance Against £text_icon_energyies §YEnergy Agreement§!"
 condition_energy_six: "Is a neighbor of the [Root.GetNameWithFlag]"
 condition_energy_five: "In same economic faction with [Root.GetNameWithFlag]"
 ONLY_PERMITTED_CONTINENTS_TT: "All of this must be done: \n We have access to energy transit to this continent. \n It is not an island"
 CANCEL_ENERGY_AGREEMENT_ACTION_DESC: "If you or your energy partner cancels the £text_icon_energyies Energy Agreement, you will no longer be able to enter into energy contracts."
 CANCEL_ENERGY_AGREEMENT_DESC: "Cancelling the energy deal will not end current contracts, but [From.GetNameWithFlag] will likely end all existing contracts. Relations with [From.GetNameWithFlag] will be worsened by §R100§!. You will no longer be able to buy or sell energy to [From.GetNameWithFlag]"
 CANCEL_ENERGY_AGREEMENT_TOOLTIP: "We have an £text_icon_energyies Energy Agreement with them."

 energy_selling.1.t: "[FROM.GetNameWithFlag] offered us an £text_icon_energyies energy contract"
 energy_selling.1.desc: "[FROM.GetName] offered us a contract for £text_icon_energyies energy transit to our country, of course for a reasonable fee. This contract can solve our £text_icon_energyies energy problem, but will we be able to afford the costs?"
 energy_selling.1.a: "We accept the contract"
 energy_selling.1.b: "We refuse"
 energy_selling.2.t: "[FROM.GetNameWithFlag] accept the contract"
 energy_selling.2.desc: "[FROM.GetName] accepted our £text_icon_energyies energy contract. It will be beneficial for both of us."
 energy_selling.2.a: "Nice!"
 energy_selling.3.t: "[FROM.GetNameWithFlag] refused the contract"
 energy_selling.3.desc: "[FROM.GetName] refused our deal to enter into an £text_icon_energyies energy contract. Apparently they are not in the best position to do so, or we need a better approach to diplomacy"
 energy_selling.3.a: "Sad"
 energy_selling.4.t: "[FROM.GetNameWithFlag] offered us an £text_icon_energyies energy contract"
 energy_selling.4.desc: "[FROM.GetName] offered us a contract for transit our £text_icon_energyies energy to their country, of course for a reasonable fee. This contract could provide additional £text_icon_energyies energy revenue for our country. Can we afford the additional £text_icon_energyies energy costs?"
 energy_selling.4.a: "We accept the contract"
 energy_selling.4.b: "We refuse"
 energy_selling.5.t: "[FROM.GetNameWithFlag] cancel the £text_icon_energyies Energy Contract"
 energy_selling.5.desc: "For some reason [FROM.GetName] cancelled the £text_icon_energyies Energy Contract. £text_icon_energyies Energy transit is stopped, weekly payment is stopped. We can offer this country the £text_icon_energyies Energy Contract again, maybe we should change the conditions"
 energy_selling.5.a: "Maybe we should renegotiate the contract..."

