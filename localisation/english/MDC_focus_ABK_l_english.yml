l_english:

 #Focus Tree
 abkhazia_focus: "Abkhazia Focus Tree"
 #Starting Focus
 ABK_In_New_Millenium: "Abkhazia in the New Millennium"
 ABK_In_New_Millenium_desc: "Our country is not entering the new millennium in the best of conditions. Corruption is eating away at the state; infrastructure was destroyed after the war and has not been restored. We stand at a crossroads: rebuild with help, stand alone, or fall into chaos."
 #Armenian & Minority Policy Branch
 ABK_CIS_create: "Create CIS Observer Status"
 ABK_CIS_create_desc: "Seeking recognition within the post-Soviet space might grant us legitimacy, even if full membership is out of reach."
 ABK_Rights_for_Armenians: "Grant Rights for Armenians"
 ABK_Rights_for_Armenians_desc: "The Armenian diaspora is strong and influential. Integrating them politically could stabilize our internal demographics."
 ABK_Purge_Bagramyan_Brigade: "Purge the Bagramyan Brigade"
 ABK_Purge_Bagramyan_Brigade_desc: "The Armenian military units within our borders are a state within a state. They must be subdued or removed to ensure true sovereignty."
 ABK_Get_Rid_Armenians: "Reduce Armenian Influence"
 ABK_Get_Rid_Armenians_desc: "To secure Abkhazian identity, we must limit the political power of the Armenian minority."
 ABK_Turkey_Support: "Gain Support of Turkey"
 ABK_Turkey_Support_desc: "Turkey is a regional power. Aligning with Ankara could counterbalance Russian and Georgian influence."
 ABK_Support_Islam: "Support Islamization of Abkhazia"
 ABK_Support_Islam_desc: "Strengthening ties with the Muslim world through Turkey and Azerbaijan could bring new investors and allies."
 ABK_Negotiate_Azer_Support: "Negotiate Azerbaijan Support"
 ABK_Negotiate_Azer_Support_desc: "Baku has energy and money. Let us secure their backing for our independence."
 ABK_Support_Armenian_Diaspora: "Support Armenian Diaspora Investments"
 ABK_Support_Armenian_Diaspora_desc: "Leverage the wealth of the global Armenian community to rebuild our economy."
 ABK_Legacy_Colchis: "Legacy of Colchis"
 ABK_Legacy_Colchis_desc: "We are the heirs of ancient Colchis. Our history predates modern conflicts, and our culture must be preserved."
 ABK_Grant_Parlaments_Seats_Armenians: "Grant Armenian Parliamentary Seats"
 ABK_Grant_Parlaments_Seats_Armenians_desc: "Representation could foster loyalty and stability. Give them a voice in the government."
 ABK_Abkhazo_Armenian_State: "Abkhazo-Armenian State"
 ABK_Abkhazo_Armenian_State_desc: "A dual-national state model could ensure peace between the two largest ethnic groups, binding Abkhazia and Armenia through shared governance."
 #Russia Relation Branch
 ABK_Big_Brother: "Our Big Brother?"
 ABK_Big_Brother_desc: "Russia is unavoidable. The question is not if we align, but how closely."
 ABK_Absolute_Loyality: "Absolute Loyalty to Russia"
 ABK_Absolute_Loyality_desc: "Full integration into Moscow's sphere guarantees security, but costs sovereignty."
 ABK_Foreign_Business: "Legalize Foreign Business"
 ABK_Foreign_Business_desc: "Allow Russian oligarchs to invest freely. Capital flows where protection is guaranteed."
 ABK_Russian_Troops: "Ask Russia to Commit More Troops"
 ABK_Russian_Troops_desc: "Our army is outdated. Russian bases on our soil will deter Georgian aggression."
 ABK_Russian_Union_State: "Union State with Russia"
 ABK_Russian_Union_State_desc: "The ultimate step. Becoming part of a greater Russian union."
 ABK_Pragmatic_Distance: "Pragmatic Distance"
 ABK_Pragmatic_Distance_desc: "We need aid, but not strings attached. Maintain independence while accepting help."
 ABK_Nationalize_Business: "Nationalize Russian Business"
 ABK_Nationalize_Business_desc: "Russian companies exploit our resources. It is time to take back what is ours."
 ABK_Own_Training: "Training on Our Own"
 ABK_Own_Training_desc: "Reliance on foreign trainers is weakness. Build our own military academies."
 ABK_Request_Aid: "Request More Aid"
 ABK_Request_Aid_desc: "Budget deficits are critical. Moscow must open the treasury."
 ABK_Freedom_Patronage: "Freedom Under Patronage"
 ABK_Freedom_Patronage_desc: "A delicate balance. Officially independent, but practically protected."
 #Stabilization & Economy Branch
 ABK_Stabilization_Country: "Stabilization of the Country"
 ABK_Stabilization_Country_desc: "Abkhazia enters the new millennium weakened by war, economic disruption, and fragile state institutions. Before the republic can move forward, the government must restore order, strengthen its administration, and bring stability to public finances."
 ABK_Increase_Abilitties_of_state: "Increase the Head of State's Abilities"
 ABK_Increase_Abilitties_of_state_desc: "Centralize power to push through necessary reforms quickly."
 ABK_Issue_Abkhazian_Passports: "Issue Abkhazian Passports"
 ABK_Issue_Abkhazian_Passports_desc: "Citizenship defines the nation; everyone must be documented to claim their rights."
 ABK_Revive_Wine_Industry: "Revive Wine Industry"
 ABK_Revive_Wine_Industry_desc: "Russia is ready to help our farmers develop winemaking, naturally in exchange for increased Russian influence in Abkhazia."
 ABK_RZhD_Contracts: "RZhD Contracts"
 ABK_RZhD_Contracts_desc: "Russian Railways controls our transport links. Negotiate better terms for transit."
 ABK_Pizdatiy_Akvafon: "Akvafon"
 ABK_Pizdatiy_Akvafon_desc: "Telecommunications are vital. Modernize the network by any means necessary."
 ABK_Build_Tourist_Attractions: "Build Tourist Attractions"
 ABK_Build_Tourist_Attractions_desc: "The Black Sea coast is our greatest asset. Make it a destination again."
 ABK_Turkish_Oil: "Oil Shipments from Turkey"
 ABK_Turkish_Oil_desc: "Bypass Russian energy dependence. Import fuel via Turkish tankers."
 ABK_turkish_oil_idea_tt: "Gain national spirit §YTurkish Oil Shipments§!:\n  £factory_output_texticon  §G+10%§! Factory Output\n  State §Y706§!: §G+2§! £oil_texticon\n\n  This bonus is removed if we go to war with §YTurkey§!."
 ABK_turkish_oil_idea_modifier_tt: "State §Y706§!: §G+2§! £oil_texticon"
 ABK_A_Mobile: "A-Mobile"
 ABK_A_Mobile_desc: "Expand mobile coverage to every village. Connectivity is progress."
 ABK_Future_Inguri_Dam: "Future of Inguri Dam"
 ABK_Future_Inguri_Dam_desc: "The dam provides power but is a point of contention with Georgia. Secure our energy supply."
 ABK_attempsts_at_devirsification: "Attempts at Diversification"
 ABK_attempsts_at_devirsification_desc: "We cannot rely on tourism and aid alone; new industries are needed to reduce long-term dependence."
 ABK_Allow_Private_Mining: "Allow Private Cryptocurrency Mining"
 ABK_Allow_Private_Mining_desc: "Cheap electricity attracts miners. Let the private sector lead the crypto boom."
 ABK_Goverment_Crypto_Mining: "Government Crypto Mining"
 ABK_Goverment_Crypto_Mining_desc: "Crypto profits should go to the state treasury, not private wallets."
 ABK_Bitcoin_State: "Bitcoin State"
 ABK_Bitcoin_State_desc: "Become a haven for digital currency. The future of finance is decentralized."
 ABK_Sochi_Olympics_Investments: "Sochi Olympics Investments"
 ABK_Sochi_Olympics_Investments_desc: "Leverage the proximity to Sochi. Capture the overflow of investment."
 ABK_Tangerine_Yards: "Tangerine Yards"
 ABK_Tangerine_Yards_desc: "Abkhazian tangerines are legendary. Expand agriculture."
 ABK_Forced_Co_Management: "Forced Co-management"
 ABK_Forced_Co_Management_desc: "Georgia claims share of the dam. Force them into a management agreement."
 ABK_Rural_Development: "Rural Development"
 ABK_Rural_Development_desc: "The villages are empty. Incentivize people to return to the land."
 ABK_No_Concessions_Georgians: "No Concessions for Georgians"
 ABK_No_Concessions_Georgians_desc: "We owe them nothing. The dam is ours."
 ABK_Request_Foreign_Experts: "Request Foreign Experts"
 ABK_Request_Foreign_Experts_desc: "We lack technical knowledge. Hire specialists from abroad."
 ABK_Free_Economic_Zone: "Free Economic Zones"
 ABK_Free_Economic_Zone_desc: "Tax holidays and deregulation will attract foreign capital."
 ABK_Rossneft_Contract: "Rosneft Contract"
 ABK_Rossneft_Contract_desc: "Partner with the Russian energy giant. Secure fuel and funding."
 ABK_rossneft_contract_idea_tt: "Gain national spirit §YRosneft Contract§!:\n  £factory_output_texticon  §G+10%§! Factory Output\n  State §Y706§!: §G+3§! £oil_texticon\n\n  This bonus is removed if we go to war with §YRussia§!."
 ABK_rossneft_contract_idea_modifier_tt: "State §Y706§!: §G+3§! £oil_texticon"
 #Refugees & Culture
 ABK_Issues_of_the_refuguees: "Refugee Issue"
 ABK_Issues_of_the_refuguees_desc: "Thousands remain displaced. Their return is a humanitarian and political necessity."
 ABK_Circassian_Repatriation_Negotiations: "Circassian Repatriation Negotiations"
 ABK_Circassian_Repatriation_Negotiations_desc: "Invite the Circassian diaspora to return to their ancestral homeland."
 ABK_Support_Abkhasian_Culture: "Support Abkhazian Culture"
 ABK_Support_Abkhasian_Culture_desc: "Language, art, and tradition must be funded to survive globalization."
 #Internal Security & Mafia
 ABK_Invest_SGB: "Invest in SGB"
 ABK_Invest_SGB_desc: "The State Security Service needs better equipment and funding to maintain order."
 ABK_Ally_With_Mafia: "Ally with Mafia"
 ABK_Ally_With_Mafia_desc: "The republic's institutions are too weak to uproot the criminal world outright, and too fragile to confront every local power broker at once. Rather than waste scarce resources on a direct conflict, we may choose to strike an understanding with the underworld: they will keep money flowing and maintain order where the state cannot, while we look the other way. Such an arrangement may provide quick relief and strengthen informal control, but it will come at the cost of legality, accountability, and the long-term integrity of the republic."
 ABK_Benefits_Drug_Trade: "Benefits from Drug Trade"
 ABK_Benefits_Drug_Trade_desc: "The narcotics trade moving through the Caucasus offers an immediate source of money to a government short on revenue and surrounded by uncertainty. By tolerating and quietly profiting from these networks, the state can secure badly needed funds and expand the influence of those tied to the shadow economy. Yet every gain made through this traffic will deepen corruption, embolden criminal actors, and further damage the institutions that should be defending Abkhazia from internal decay."
 ABK_Smuggle_Operation: "Smuggle Operations"
 ABK_Smuggle_Operation_desc: "Isolation, weak enforcement, and porous regional connections have made smuggling one of the most profitable sectors of the Abkhaz shadow economy. If properly organized, these routes can bring in fuel, goods, contraband, and hard currency far beyond what the formal economy can currently provide. However, turning smuggling into a tolerated system of survival will also bind the state ever more closely to criminal structures and make future economic normalization far more difficult."
 ABK_Narco_State_Of_Caucasus: "Narco-State of Caucasus"
 ABK_Narco_State_Of_Caucasus_desc: "What began as expedient cooperation with criminal networks can now be embraced as a full governing model. By allowing narcotics revenue, smuggling routes, and shadow patronage to define the republic's political economy, Abkhazia may secure a powerful and resilient stream of illicit income. But such a path would transform the state itself, replacing lawful governance with criminal dependency, alienating its neighbors, and hollowing out the very institutions meant to preserve the republic."
 ABK_Start_Police_Raid: "Start Police Raids"
 ABK_Start_Police_Raid_desc: "Corruption has gone too far. Clean up the streets with iron fists."
 ABK_Fight_Narco_Traffic: "Fight Narcotraffic"
 ABK_Fight_Narco_Traffic_desc: "Drugs destroy our youth. Crack down on dealers."
 ABK_Expose_Georgian_Traffickers: "Expose Georgian Traffickers"
 ABK_Expose_Georgian_Traffickers_desc: "Use intelligence to show who really profits from the drug trade."
 ABK_Promote_Healthy_Lifestyle: "Promote Healthy Lifestyle"
 ABK_Promote_Healthy_Lifestyle_desc: "Prevention is better than cure. Build a healthier nation."
 #Diplomacy & Recognition
 ABK_UN_Mandate: "Increase UN Mandate"
 ABK_UN_Mandate_desc: "The UN mission is expiring. Extend it to gain international leverage."
 ABK_artshakh_friend: "Artsakh Friend"
 ABK_artshakh_friend_desc: "Recognize Nagorno-Karabakh. They understand our struggle."
 ABK_transnistria_friend: "Transnistria Friend"
 ABK_transnistria_friend_desc: "Connect with Tiraspol. Another post-Soviet frozen conflict."
 ABK_soo_friend: "South Ossetia Friend"
 ABK_soo_friend_desc: "Our brothers in the north. Strengthen ties with Tskhinvali."
 ABK_CIS_Second_Create: "Create CIS 2"
 ABK_CIS_Second_Create_desc: "The original CIS failed us. Form a new union of unrecognized states bound by shared struggle and mutual survival."
 #Georgia & Conflict Branch
 ABK_Shadows_of_the_Struggle: "Shadows of the Struggle"
 ABK_Shadows_of_the_Struggle_desc: "The war never truly ended. It only went into the shadows."
 ABK_Saving_what_we_have: "Saving What We Have"
 ABK_Saving_what_we_have_desc: "Consolidate our gains before seeking more."
 ABK_Request_Foreign_Protection: "Request Foreign Protection"
 ABK_Request_Foreign_Protection_desc: "We need security guarantees from a major power."
 ABK_Ask_For_Recognition: "Ask for Recognition"
 ABK_Ask_For_Recognition_desc: "Diplomatic recognition is the key to sovereignty."
 ABK_Aiaaira: "Aiaaira!"
 ABK_Aiaaira_desc: "Victory! Our independence is secured forever."
 ABK_Join_CSTO: "Join CSTO"
 ABK_Join_CSTO_desc: "Enter the collective security treaty organization."
 ABK_Negotiate_With_Monadire: "Negotiate with Monadire and Gelayev"
 ABK_Negotiate_With_Monadire_desc: "Warlords hold power in the shadows. Bring them to the table."
 ABK_Dialogue_With_Georgia: "Start Talks with Georgia"
 ABK_Dialogue_With_Georgia_desc: "War is costly. Perhaps peace is possible."
 ABK_Negotiate_Large_Autonomy: "Negotiate Large Autonomy"
 ABK_Negotiate_Large_Autonomy_desc: "Return to Georgia, but only on our terms."
 ABK_Federalization_With_Georgia: "Federalization with Georgia"
 ABK_Federalization_With_Georgia_desc: "A federated state where we control our own destiny."
 ABK_Reform_Of_Prosperity: "Reforms of Prosperity"
 ABK_Reform_Of_Prosperity_desc: "Peace brings trade. Rebuild the economy together."
 ABK_reforms_of_prosperity_idea: "Reforms of Prosperity"
 ABK_Negotiate_With_Osetia: "Negotiations with Ossetia"
 ABK_Negotiate_With_Osetia_desc: "Coordinate strategy with our Ossetian allies."
 ABK_Svanetia_Rebellion: "Rebellion in Svanetia"
 ABK_Svanetia_Rebellion_desc: "Support the rebels in the Georgian mountains. Weakens Tbilisi."
 ABK_Iberian_Federation: "Iberian Federation"
 ABK_Iberian_Federation_desc: "A new union of Caucasian peoples, independent from Moscow and Tbilisi."

 abkh.1.t: "Abkhazia Wants to Become an Associate Member of the CIS"
 abkh.1.d: "Abkhazia has long sought greater recognition than it currently enjoys. They have actively expressed their desire to participate in political processes within the CIS and have requested a special status within the organization."
 abkh.1.a: "We Agree"
 abkh.1.b: "We're Not Interested In That."
 abkh.5.t: "Abkhazia Enters Into Negotiations"
 abkh.5.d: "For the first time in years, the Abkhazian government has announced its readiness to engage in a constructive dialogue with us. It seems reality has forced them to act rationally."
 abkh.5.a: "We Are For Dialogue"
 abkh.5.b: "We're Not Interested In That."
 abkh.6.t: "[FROM.GetName] Agreed to the Proposal"
 abkh.6.d: "Their government has agreed to our proposal, which is undoubtedly a good thing."
 abkh.6.a: "Nice"
 abkh.7.t: "[FROM.GetName] Agreed to the Proposal"
 abkh.7.d: "Their government has rejected our offer, which is undoubtedly upsetting to us."
 abkh.7.a: "Sad"
 abkh.8.t: "The Abkhazian Government is Asking for More Autonomy"
 abkh.8.d: "The government of Abkhazia is ready to engage in a dialogue about autonomy within our state, but they are immediately asking for increased autonomy and guarantees during the transition period."
 abkh.8.a: "We Agree"
 abkh.8.b: "We're Not Interested In That."
 abkh.9.t: "Abkhazia is Ready to Become Our Autonomous Region"
 abkh.9.d: "The government of Abkhazia is fully prepared to become part of our country again, and this is finally a peaceful solution to the issue."
 abkh.9.a: "We Agree"
 abkh.9.b: "We're Not Interested In That."
 abkh.10.t: "Abkhazia Asks for Protection"
 abkh.10.d: "The government of Abkhazia has asked us for protection, as they are clearly afraid of an attack from their neighbors, which has led them to us."
 abkh.10.a: "We Agree"
 abkh.10.b: "We're Not Interested In That."
 abkh.11.t: "The Abkhazian Government is Engaging in Dialogue With Us"
 abkh.11.d: "The Abkhazian government has announced a peace initiative in relation to us. They are ready to sign a peace agreement with mutual guarantees in order to finally resolve our conflict."
 abkh.11.a: "We Agree"
 abkh.11.b: "We're Not Interested In That."
 abkh.12.t: "The Abkhazian Government is Engaging in Dialogue With Us"
 abkh.12.d: "The Abkhazian government has offered us mutual military guarantees, knowing that our southern neighbor could attack at any time."
 abkh.12.a: "We Agree"
 abkh.12.b: "We're Not Interested In That."
 abkh.13.t: "The New Federation"
 abkh.13.d: "The Abkhaz government is proposing that we create a joint federal state, and they appear determined to establish a new power center in the Caucasus."
 abkh.13.a: "We Agree"
 abkh.13.b: "We're Not Interested In That."
 abkh.14.t: "Abkhazia Wants to Become a Union State"
 abkh.14.d: "The Abkhazian government has announced its desire to join our Union State project, and it seems that they have realized where the wind of change is blowing."
 abkh.14.a: "We Agree"
 abkh.14.b: "We're Not Interested In That."
 abkh.15.t: "Abkhazia Requests the Presence of Our Troops"
 abkh.15.d: "The Abkhazian government has asked us to deploy our troops on their territory and train their army units."
 abkh.15.a: "We Agree"
 abkh.15.b: "We're Not Interested In That."
 abkh.17.t: "UN Mandate Extended"
 abkh.17.d: "The United Nations Observer Mission in Georgia (UNOMIG) has been extended for another year. The international community reaffirms its commitment to a peaceful resolution of the Georgian-Abkhaz conflict. For Abkhazia, this extension means continued diplomatic recognition of its status as a negotiating party and a renewed opportunity to engage with international partners. Both Georgia and the de facto authorities welcome the decision, hoping it will reduce tensions."
 abkh.17.a: "A victory for diplomacy"
 abkh.18.t: "Abkhazia is Asking for Our Investments"
 abkh.18.d: "The Abkhazian government is asking us to invest in their economy due to their dire situation."
 abkh.18.a: "We Agree"
 abkh.18.b: "We're Not Interested In That."
 abkh.19.t: "Abkhazia is Asking for Our Investments"
 abkh.19.d: "The Abkhazian government is asking us to invest in their economy due to their dire situation."
 abkh.19.a: "We Agree"
 abkh.19.b: "We're Not Interested In That."
 abkh.20.t: "Abkhazia Wants to Create a Joint State"
 abkh.20.d: "Abkhazian politicians have long spoken about the brotherhood of Abkhazians and Armenians against the threats of their Caucasian neighbors. Now the initiative has reached its peak, and they intend to become part of our country as a core component of the newly formed Abkhazian-Armenian state."
 abkh.20.a: "We Agree"
 abkh.20.b: "We're Not Interested In That."
 abkh.21.t: "Abkhazia Offers its Own Version of the CIS"
 abkh.21.d: "Abkhazia is proposing that we create our own organization, similar to the CIS: the Commonwealth of Unrecognized States."
 abkh.21.a: "We Agree"
 abkh.21.b: "We're Not Interested In That."
 abkh.22.t: "Abkhazia is Calling Us to War"
 abkh.22.d: "Abkhazia has started a war against Georgia and is inviting us to participate in a military operation against that country."
 abkh.22.a: "We Agree"
 abkh.22.b: "We're Not Interested In That."
 abkh_news.1.t: "Armenia and Abkhazia Create a Single State"
 abkh_news.1.d: "An unexpected turn of events has taken place in the Caucasus. Abkhazia and Armenia have already completely changed the direction of their relations, and now the two countries are signing documents to become a single country. It's an amazing development!"
 abkh_news.1.a: "Wow"
 abkh_news.2.t: "Federalization of Georgia"
 abkh_news.2.d: "It seems that another conflict has finally been resolved. Georgia has settled its long-standing issue with Abkhazia and has become a federal state, which will undoubtedly bring more stability to the Caucasus."
 abkh_news.2.a: "Wow"

