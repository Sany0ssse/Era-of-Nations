 ABK_state_stabilization_idea: "Stabilization of the Republic"
 ABK_state_stabilization_idea_desc: "After the war, Abkhazia remained burdened by destroyed infrastructure, weak institutions, an underfunded administration, and a fragile internal order. The government now seeks to stabilize the republic through tighter control over local authorities, improved tax collection, expanded policing, and the gradual restoration of state administration."
 ABK_revived_wine_industry_idea: "Revived Wine Industry"
 ABK_revived_wine_industry_idea_desc: "Wine production remained one of the few economic sectors in Abkhazia that could realistically be restored after the war. By reviving vineyards, reopening wineries, and rebuilding export links, the republic is slowly restoring a traditional source of income and strengthening local business activity."
 ABK_mafia_idea: "Mafia Connections"
 ABK_mafia_idea_desc: "In the unstable years after the war, Abkhazia's weak institutions left ample room for criminal intermediaries, local strongmen, and shadow networks to entrench themselves in daily political and economic life. What began as an informal arrangement of convenience has gradually developed into a system of mutual dependence: the state tolerates illicit actors in exchange for access to money, coercive leverage, and informal channels of control. While such ties help sustain the republic in the short term, they also weaken public authority, corrode legal institutions, and blur the line between government and organized crime."
 ABK_mafia_income_idea: "State-Mafia Pact"
 ABK_mafia_income_idea_desc: "Having abandoned any serious attempt to uproot the criminal underworld, the Abkhaz authorities have instead entered into an open arrangement with it. In exchange for protection, political tolerance, and selective access to state structures, criminal networks now help keep money flowing into the republic and enforce informal order where formal institutions remain weak. This pact offers immediate financial relief, but it further compromises public authority and ties the survival of the state to shadow interests."
 ABK_mafia2_idea: "Drug Transit Revenues"
 ABK_mafia2_idea_desc: "As official oversight weakens and criminal protection expands, Abkhazia becomes increasingly tied to narcotics transit routes moving through the Caucasus. The profits generated by these networks quickly seep into the political system, enriching intermediaries, corrupting state officials, and empowering those willing to defend the trade by force. Though the income is difficult for the authorities to resist, dependence on it steadily undermines public order, damages the republic's reputation, and deepens the decay of state institutions."
 ABK_mafia3_idea: "Smuggling Economy"
 ABK_mafia3_idea_desc: "What was once justified as a temporary means of survival has evolved into a central pillar of the Abkhaz economy. Smuggled fuel, contraband consumer goods, untaxed cargo, and criminal transit now move through networks that bind businessmen, officials, and security structures into a single shadow system. This underground economy keeps money flowing into the republic and cushions the effects of isolation, but it also suppresses legal development, entrenches corruption, and leaves the state's finances increasingly dependent on forces it cannot fully control."
 ABK_mafia4_idea: "Narco-State Structures"
 ABK_mafia4_idea_desc: "The separation between government authority, security organs, and organized crime has effectively collapsed. In its search for survival and financial autonomy, Abkhazia has allowed criminal revenues, narcotics money, and contraband patronage to become embedded in the foundations of the state itself. The result is a regime that can still function and even profit, but only through deep corruption, regional isolation, and the steady disintegration of lawful governance. The republic remains afloat, yet its institutions now serve shadow interests as much as public ones."
