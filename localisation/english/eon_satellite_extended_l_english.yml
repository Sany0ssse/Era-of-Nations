l_english:
 eon_satellite_extended_agreements:0 "Military and reconnaissance satellite agreements"
 eon_satellite_extended_agreements_desc:0 "Manage our outgoing military GNSS, military communications and military or civilian reconnaissance proposals. Each service has its own pending reply. Withdrawal is free and keeps the original reply reserved until it closes. An unanswered 30-day window permanently closes only our affected service proposal route to that partner. Other services and the other country's outgoing proposals remain separate. Existing consent can remain dormant during direct war, a service outage or an insufficient provider level; only an agreement still in force can resume."
 eon_withdraw_mil_gnss_proposal:0 "Withdraw military navigation proposal"
 eon_withdraw_mil_gnss_proposal_desc:0 "Withdraw our original unaccepted military navigation proposal. $eon_sat_gnss_mil_withdraw_tt$"
 eon_sat_gnss_mil_available_tt:0 "Both countries must exist, be distinct and remain at peace with each other. The provider must have a usable military GNSS system at least as advanced as the recipient's own. Our proposal for this service must have no unresolved earlier response and its route must remain open for this partner. Sending is free; acceptance must still match the proposed service. First-tier service also requires a positive count of the corresponding satellites in the provider's current system statistics."
 eon_sat_gnss_mil_proposal_tt:0 "Register this free military GNSS proposal for a 30-day response at the provider's current system level. The original sender may withdraw it. Acceptance grants access only while the countries and proposed service still match; a changed provider level requires a new proposal. Other satellite services and the recipient's own outgoing proposals stay separate."
 eon_sat_gnss_mil_closed_tt:0 "Close this military GNSS proposal without granting new access. Existing agreements remain separate. A withdrawn or no longer valid reply cannot create access. An unanswered expired response permanently closes only our proposal route for this service to this partner."
 eon_sat_gnss_mil_withdraw_tt:0 "As the original sender, withdraw our pending military GNSS proposal for free. The original response keeps this service proposal reserved until it closes; unanswered 30-day expiry permanently closes only the affected route to this partner. Withdrawal cannot end an already accepted agreement or reserve another service or the other country's outgoing proposals."
 eon_sat_gnss_mil_granted_tt:0 "Record military GNSS access with current consent and recalculate its existing bonuses together with other providers. A provider without usable or sufficiently advanced service, or at direct war with the recipient, gives no foreign service bonus while consent remains dormant. Revocation removes that provider's grant; service recovery cannot recreate a revoked agreement. First-tier service also requires a positive count of the corresponding satellites in the provider's current system statistics."
 eon_sat_gnss_mil_revoke_tt:0 "As the provider, revoke this country's recorded military GNSS access for free without its approval. Both countries must still exist and be distinct, with recorded access identifying our grant. Direct war, a service outage or a pending proposal does not prevent revocation. Remove only our grant to this recipient; other providers and agreements remain separate."
 eon_withdraw_mil_com_proposal:0 "Withdraw military communications proposal"
 eon_withdraw_mil_com_proposal_desc:0 "Withdraw our original unaccepted military communications proposal. $eon_sat_com_mil_withdraw_tt$"
 eon_sat_com_mil_available_tt:0 "Both countries must exist, be distinct and remain at peace with each other. The provider must have a usable military communications system at least as advanced as the recipient's own. Our proposal for this service must have no unresolved earlier response and its route must remain open for this partner. Sending is free; acceptance must still match the proposed service. Existing network traffic affects AI judgment. First-tier service also requires a positive count of the corresponding satellites in the provider's current system statistics."
 eon_sat_com_mil_proposal_tt:0 "Register this free military communications proposal for a 30-day response at the provider's current system level. The original sender may withdraw it. Acceptance grants access only while the countries and proposed service still match; a changed provider level requires a new proposal. Other satellite services and the recipient's own outgoing proposals stay separate."
 eon_sat_com_mil_closed_tt:0 "Close this military communications proposal without granting new access. Existing agreements remain separate. A withdrawn or no longer valid reply cannot create access. An unanswered expired response permanently closes only our proposal route for this service to this partner."
 eon_sat_com_mil_withdraw_tt:0 "As the original sender, withdraw our pending military communications proposal for free. The original response keeps this service proposal reserved until it closes; unanswered 30-day expiry permanently closes only the affected route to this partner. Withdrawal cannot end an already accepted agreement or reserve another service or the other country's outgoing proposals."
 eon_sat_com_mil_granted_tt:0 "Record military communications access with current consent and recalculate its existing bonuses together with other providers. A provider without usable or sufficiently advanced service, or at direct war with the recipient, gives no foreign service bonus while consent remains dormant. Revocation removes that provider's grant; service recovery cannot recreate a revoked agreement. Military communications demand uses the existing battalion, ship and deployed-plane counts of every recipient with a recorded mutual agreement, including dormant agreements. First-tier service also requires a positive count of the corresponding satellites in the provider's current system statistics."
 eon_sat_com_mil_revoke_tt:0 "As the provider, revoke this country's recorded military communications access for free without its approval. Both countries must still exist and be distinct, with recorded access identifying our grant. Direct war, a service outage or a pending proposal does not prevent revocation. Remove only our grant to this recipient; other providers and agreements remain separate."
