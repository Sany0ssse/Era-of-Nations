l_english:
 eon_energy_offer_import_desc:0 "[FROM.GetName] proposes that we import £text_icon_energyies §Y[?eon_energy_offer_quantity|0] GW§! at §Y$[?eon_energy_offer_price|2] billion per GW per week§!. Total weekly payment: §R$[?eon_energy_offer_weekly|2] billion§!.\n\nOur current signed quantity is §Y[?eon_energy_offer_old_amount|0] GW§! (positive: import; negative: export), at $[?eon_energy_offer_old_price|2] billion per GW, totalling $[?eon_energy_offer_old_weekly|2] billion per week. Zero means no existing delivery contract.\n\nThese proposed terms are fixed until we answer. The current contract continues during negotiations. Acceptance replaces the bilateral contract; refusal preserves it. The contract continues until termination, with no fixed expiry. Either side may propose a revision or end deliveries through the energy controls. A shortage or cancellation of the framework agreement ends deliveries and payments."
 eon_energy_offer_export_desc:0 "[FROM.GetName] proposes that we export £text_icon_energyies §Y[?eon_energy_offer_quantity|0] GW§! at §Y$[?eon_energy_offer_price|2] billion per GW per week§!. Total weekly receipts: §G$[?eon_energy_offer_weekly|2] billion§!.\n\nOur current signed quantity is §Y[?eon_energy_offer_old_amount|0] GW§! (positive: import; negative: export), at $[?eon_energy_offer_old_price|2] billion per GW, totalling $[?eon_energy_offer_old_weekly|2] billion per week. Zero means no existing delivery contract.\n\nThese proposed terms are fixed until we answer. The current contract continues during negotiations. Acceptance replaces the bilateral contract; refusal preserves it. The contract continues until termination, with no fixed expiry. Either side may propose a revision or end deliveries through the energy controls. A shortage or cancellation of the framework agreement ends deliveries and payments."
 eon_energy_accept_import_tt:0 "If the proposal is still valid, replace the contract with an import of §Y[?eon_energy_offer_quantity|0] GW§!. Weekly payment: §R$[?eon_energy_offer_weekly|2] billion§!."
 eon_energy_accept_export_tt:0 "If the proposal is still valid, replace the contract with an export of §Y[?eon_energy_offer_quantity|0] GW§!. Weekly receipts: §G$[?eon_energy_offer_weekly|2] billion§!."
 eon_energy_refuse_tt:0 "Reject only the proposed terms. Any existing contract remains in force. Either side can submit different terms using the energy controls."
 eon_energy_offer_invalid_tt:0 "The proposal is no longer valid because the parties, framework agreement or current contract changed. No contract is created or restored. Submit a new proposal after resolving the changed conditions."
 eon_energy_no_pending_tt:0 "No energy proposal is awaiting a response. Pending terms remain fixed; current deliveries and payments continue until both sides agree to a revision."
 eon_energy_offer_cancelled_desc:0 "This proposal was withdrawn because the energy framework or deliveries ended. The previously offered quantity was [?eon_energy_offer_quantity|0] GW at $[?eon_energy_offer_price|2] billion per GW per week. These terms can no longer take effect. Acknowledge this proposal before submitting new terms; no delivery contract is restored by this response."
