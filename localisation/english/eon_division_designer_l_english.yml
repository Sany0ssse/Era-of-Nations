l_english:
 EON_DIVISION_STRUCTURE_TT: "§YDivision structure§!\nEach column groups battalions into a regiment. Rows are organizational slots, not front and rear battle lines. Moving the same battalions up or down does not set a tactical deployment.\n\nCompare organization, attack, defense or breakthrough, armor, piercing, width, speed and equipment needs. Composition and readiness determine what the formation can do."
 EON_DIVISION_SUPPORT_TT: "§YDivisional support§!\nThese companies contribute their abilities to the division as a whole. They need personnel, equipment and supply. In Era of Nations, some divisional support units also add combat width: check the live statistics."
 EON_REGIMENT_SUPPORT_TT: "§YRegimental support§!\nThe lower slot belongs to the regiment directly above it. At least three compatible line battalions are required in that column. Foot regiments can use the light battery; mobile and armored regiments can use the motorized battery.\n\nThese batteries need guns, command equipment and personnel; the motorized type also needs vehicles and fuel. They add firepower with no extra combat width, but do not replace maneuver battalions or guarantee victory."
