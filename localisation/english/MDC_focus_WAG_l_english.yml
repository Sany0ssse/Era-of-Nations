l_english:
 #Focuses
 WAG_strength_1: "Foundation of Will"
 WAG_strength_1_desc: "The legacy of the 'Orchestra' weighs heavily on the shoulders of the new state. But it is from this darkness that we must forge a new will to exist. The first steps are always the hardest, but without them there is no moving forward. It is time to prove to the world that Wagneria is not just another adventure, but a state capable of great deeds."
 WAG_strength_2: "Legacy of the Orchestra"
 WAG_strength_2_desc: "The music of war flows in the blood of every veteran. Our traditions are not parades and marches, but real combat experience paid for with blood. We honor the fallen and learn from the living. This connection between generations makes us stronger, turning disparate units into a single mechanism of vengeance."
 WAG_strength_3: "Heart of Darkness"
 WAG_strength_3_desc: "Africa changes people. Those who survive here will never be the same again. We have embraced the darkness of this continent, made it part of ourselves. Now we are not just mercenaries - we are a product of this world, its predators at the top of the food chain."
 WAG_strength_4: "Birth of Wagneria"
 WAG_strength_4_desc: "A new state is born from the ashes and chaos. Wagneria is a unique experiment on the world map. A state created by warriors for warriors. Our laws are harsh but fair. Our power is based not on bureaucracy, but on respect for strength and military brotherhood."
 WAG_recruit_nationalists: "Russian March"
 WAG_recruit_nationalists_desc: "Among Russian nationalists, there are those who believe in a special mission for Russia in Africa. They see us as the vanguard of the Russian world, defenders of traditional values. Their ideological fervor and willingness to fight for an idea make them dangerous weapons."
 WAG_recruit_serbia: "Balkan Steel"
 WAG_recruit_serbia_desc: "Serbian volunteers have a long history of serving in PMCs around the world. Their military culture, discipline and combat experience make them valuable reinforcements."
 WAG_recruit_belarus: "Kalinovsky Legion"
 WAG_recruit_belarus_desc: "Belarusian militiamen who left their homeland after political upheaval are looking for a new home. We offer them not only refuge but also the opportunity to continue fighting for their ideals."
 WAG_recruit_syria: "Desert Foxes"
 WAG_recruit_syria_desc: "Veterans of the Syrian Civil War are hardened in battles against terrorists. Their experience in urban warfare and counter-insurgency operations is invaluable for Africa."
 WAG_recruit_afghanistan: "Legacy of Panjshir"
 WAG_recruit_afghanistan_desc: "Afghan mujahideen and former military personnel have unique experience in guerrilla warfare in the mountains. Their tactics can be adapted to African landscape conditions."
 WAG_recruit_veterans: "Veterans of the SMO"
 WAG_recruit_veterans_desc: "The Special Military Operation has spawned a generation of veterans who have passed through the crucible of modern warfare. Thousands of professional soldiers whose contracts have ended are looking for a use for their skills."
 WAG_recruit_latin_america: "Amazon Revolutionaries"
 WAG_recruit_latin_america_desc: "Former guerrillas, members of leftist movements and simply adventurers from Latin America come to Africa. Wagneria offers them stable income and the opportunity to legally use their 'skills'."
 WAG_recruit_asia: "Jungle Shadows"
 WAG_recruit_asia_desc: "Mercenaries from Southeast Asia have a reputation as ruthless and effective fighters. Their experience of jungle and small warfare can be used in Central African forests."
 WAG_recruit_international: "Legionnaires of Fortune"
 WAG_recruit_international_desc: "Serbs, Syrians, Afghans, Libyans, Latin Americans... All over the world there are people for whom war has become home. We open doors to professionals of any origin."
 WAG_mercenary_army_spirit: "Professionals"
 WAG_mercenary_army_spirit_desc: "We do not use mobilization and conscription. Our army consists exclusively of contract soldiers, professionals for whom military affairs are their main calling."
 WAG_legacy_tactics: "Orchestra of War"
 WAG_legacy_tactics_desc: "We follow the path tested by blood in Donbas, Syria and Libya. Massive use of artillery, heavy infantry and systematic grinding of the enemy. This is not a pretty war, it is a war of annihilation."
 WAG_urban_assault: "Stormtroopers"
 WAG_urban_assault_desc: "Urban combat is hell in which only the best survive. We create specialized assault units trained to clear fortified areas, houses and dungeons."
 WAG_artillery_duel: "Gods of War"
 WAG_artillery_duel_desc: "Artillery is our main argument. We spare no shells, time or resources to create the most powerful artillery component in the region."
 WAG_siege_masters: "Symphony of Steel"
 WAG_siege_masters_desc: "We have become masters of sieges. Long, exhausting operations, complete encirclement, systematic destruction of enemy infrastructure and morale."
 WAG_alternative_tactics: "Shadow in the Desert"
 WAG_alternative_tactics_desc: "War is changing. Heavy artillery and frontal attacks are becoming a thing of the past. We choose the path of shadow - hybrid warfare, information operations, network-centric warfare."
 WAG_hybrid_warfare: "Network-Centric Warfare"
 WAG_hybrid_warfare_desc: "Small mobile groups, kamikaze drones, satellite reconnaissance, digital communications. Our army becomes a network where every soldier sees the entire battlefield."
 WAG_information_ops: "Digital Front"
 WAG_information_ops_desc: "Information warfare is often more important than real warfare. Our hackers break into air defense and communication systems. Our propagandists create fakes and destabilize the situation."
 WAG_shadow_government: "Deep State"
 WAG_shadow_government_desc: "Wagneria is becoming not just a country, but a shadow government of Africa. We control the flows of weapons, resources and influence. Our people are in every significant structure on the continent."
 WAG_establish_companies: "Establishment of State Corporations"
 WAG_establish_companies_desc: "Wagneria has grown from a military company into a full-fledged state. It is time to create state corporations that will manage the economy, extract resources and supply the army."
 WAG_heavy_industry_companies: "Development of Heavy Industry"
 WAG_heavy_industry_companies_desc: "Heavy industry is the foundation of military power. We are creating concerns engaged in weapons production, resource extraction, energy and logistics."
 WAG_light_industry_companies: "Development of Light Industry"
 WAG_light_industry_companies_desc: "Light industry provides civilian needs and creates jobs. We develop private military services, diamond trading, construction, agriculture and telecommunications."
 WAG_media_empire: "African Media Holding"
 WAG_media_empire_desc: "Whoever owns the information owns the world. We are creating a media empire that will shape public opinion across Africa. TV channels, radio stations, newspapers, online portals - all under our control."
 WAG_african_broadcasting: "Voice of Wagneria"
 WAG_african_broadcasting_desc: "Our pan-African TV channel broadcasts in dozens of languages. We show the 'correct' picture of the world, creating the image of Wagneria as a defender and peacemaker."
 WAG_social_media_influence: "Digital Orwell"
 WAG_social_media_influence_desc: "Armies of bots, fake accounts, algorithmic manipulation. We control discussions on social networks, create trends and destroy inconvenient narratives."
 WAG_info_hegemon: "Master of the Airwaves"
 WAG_info_hegemon_desc: "Our information dominance is undeniable. No significant event in Africa happens without our coverage. We shape the agenda, create heroes and enemies."
 WAG_cyber_command: "Wagneria Cyber Command"
 WAG_cyber_command_desc: "Cyberspace is a new front of war. We are creating a unified command to coordinate digital operations. Hacking, cyber attacks, protection of our own networks - all under unified leadership."
 WAG_hacktivist_recruitment: "Legion of Hacktivists"
 WAG_hacktivist_recruitment_desc: "Hacktivists from around the world are joining our cause. Some believe in our ideology, others are just looking for a paycheck. We provide them with a platform to 'fight for justice'."
 WAG_critical_infrastructure: "Digital Blitzkrieg"
 WAG_critical_infrastructure_desc: "Our hackers have found vulnerabilities in enemy critical infrastructure. Power grids, water systems, transportation, communications - all can be shut down with the push of a button."
 WAG_digital_warfare: "Cyber Warfare"
 WAG_digital_warfare_desc: "We are fully prepared to wage cyber warfare against hostile regimes. DDoS attacks, ransomware, data leaks, disinformation - the entire arsenal of modern digital warfare."
 WAG_influence_africa: "African Renaissance"
 WAG_influence_africa_desc: "Our influence in the region has reached critical mass. We are not just present - we dictate terms. Neighboring states either cooperate with us or try to resist."
 WAG_war_cameroon: "War with Cameroon"
 WAG_war_cameroon_desc: "Cameroon is rich in resources, but its army is weak and demoralized. Our intelligence indicates the possibility of a rapid military campaign."
 WAG_war_chad: "War with Chad"
 WAG_war_chad_desc: "Chad is the key to the Sahel. Chaos in the country and the weakness of the central government make it an easy target. Control of Chad will give us access to important trade routes."
 WAG_war_congo: "War with Congo"
 WAG_war_congo_desc: "The Republic of Congo is our gateway to Central Africa. French influence is weakening here, and we can fill the power vacuum."
 WAG_war_drc: "War with DRC"
 WAG_war_drc_desc: "The Democratic Republic of Congo is a colossus on feet of clay. Cobalt, copper, diamonds, gold - all waiting for their master."
 WAG_war_sudan: "War with Sudan"
 WAG_war_sudan_desc: "Sudan is the crossroads of Africa. Control of the Nile gives power over the water resources of the entire region. The transitional government is weak and vulnerable."
 WAG_african_hegemon: "Master of the Savannah"
 WAG_african_hegemon_desc: "From the Mediterranean to the equator, from the Atlantic to the Red Sea - our power is undeniable. Wagneria is becoming a super-regional power that even the great powers must reckon with."
 #Tooltips
 NS_WAG_recruits_nationalists_desc: "An influx of volunteers from nationalist circles begins. Expect §Y500,000§! manpower and growth in popularity of the far-right."
 WAG_wagner_tactics_tt: "We choose the path of the 'Orchestra' - heavy, bloody, but effective tactics."
 WAG_shadow_tactics_tt: "We choose the path of 'Shadow' - hybrid warfare, information operations and network-centric warfare."
 WAG_african_influence_tt: "Our influence in the region has reached critical mass."
 WAG_hegemon_tt: "Our dominance in the region is recognized by all. Wagneria becomes a super-regional power."
 WAG_media_empire_tt: "Whoever owns the information owns the world. We are creating a media empire across Africa."
 WAG_african_broadcasting_tt: "Our pan-African TV channel broadcasts in dozens of languages, shaping the 'correct' picture of the world."
 WAG_social_media_tt: "Armies of bots and fake accounts control discussions on social networks."
 WAG_info_hegemon_tt: "Our information dominance is undeniable. We shape the agenda of the entire continent."
 WAG_cyber_command_tt: "Cyberspace is a new front of war. A unified command for digital operations has been created."
 WAG_hacktivist_tt: "Hacktivists from around the world are joining our cause. The legion is growing."
 WAG_infrastructure_tt: "Vulnerabilities in enemy critical infrastructure have been found. Prepare for digital blitzkrieg."
 WAG_digital_warfare_tt: "The entire arsenal of modern digital warfare is in our hands. We are starting cyber war."
 WAG_war_cameroon_tt: "Opens the possibility to declare war on Cameroon."
 WAG_war_chad_tt: "Opens the possibility to declare war on Chad."
 WAG_war_congo_tt: "Opens the possibility to declare war on the Republic of Congo."
 WAG_war_drc_tt: "Opens the possibility to declare war on the DRC."
 WAG_war_sudan_tt: "Opens the possibility to declare war on Sudan."
 WAG_companies_unlock_tt: "Opens the possibility of creating state corporations."
 WAG_heavy_companies_unlock_tt: "Heavy industry companies become available."
 WAG_light_companies_unlock_tt: "Light industry companies become available."

 
 #Ideas
 WAG_start_spirit_1: "Legacy of the 'Orchestra'"
 WAG_start_spirit_1_desc: "The world knows us as mercenaries. Legitimacy is in question."
 WAG_start_spirit_2: "Divided Veterans"
 WAG_start_spirit_2_desc: "The unity of the PMC has been shaken. Different factions are pulling the blanket."
 WAG_start_spirit_3: "Curse of Resources"
 WAG_start_spirit_3_desc: "The struggle for resources is tearing the elites apart."
 WAG_start_spirit_4: "Outcasts"
 WAG_start_spirit_4_desc: "Most countries do not recognize Wagneria."
 WAG_army_spirit_nationalists: "Russian March"
 WAG_army_spirit_nationalists_desc: "The influx of Russian nationalists strengthened the army ideologically but added radicalism."
 WAG_army_spirit_veterans: "Veterans"
 WAG_army_spirit_veterans_desc: "Highly experienced fighters who have passed through the crucible of modern warfare."
 WAG_army_spirit_international: "Legionnaires of Fortune"
 WAG_army_spirit_international_desc: "International detachment of professionals who speak the language of war."
 WAG_mercenary_army: "Professionals"
 WAG_mercenary_army_desc: "Our army consists of contractors for whom war is a job."
 WAG_tactics_spirit_urban: "Stormtroopers"
 WAG_tactics_spirit_urban_desc: "Doctrine of massive urban assaults."
 WAG_tactics_spirit_arty: "Gods of War"
 WAG_tactics_spirit_arty_desc: "Focus on artillery. Firepower sweeps away any defense."
 WAG_siege_spirit: "Symphony of Steel"
 WAG_siege_spirit_desc: "Long sieges, systematic grinding of the enemy."
 WAG_alt_tactics_spirit_hybrid: "Network-Centric Warfare"
 WAG_alt_tactics_spirit_hybrid_desc: "Small mobile groups, drones, reconnaissance and communications"
 WAG_alt_tactics_spirit_info: "Digital Front"
 WAG_alt_tactics_spirit_info_desc: "Disinformation, psychological operations, hacking."
 WAG_shadow_spirit: "Deep State"
 WAG_shadow_spirit_desc: "Shadow empire controlling processes across Africa."
 WAG_african_hegemon_spirit: "Master of the Savannah"
 WAG_african_hegemon_spirit_desc: "From Cameroon to Sudan - our voice is louder than all."


 #Events
 wagneria.001.t: "The Path to Legitimacy"
 wagneria.001.d: "The first days of Wagneria's existence were marked by chaos and uncertainty. The international community views us with suspicion, but within the country there is a growing understanding of the need for strong government. How should we strengthen the new state?"
 wagneria.001.a: "Invest in stability"
 wagneria.001.b: "Focus on military power"

 wagneria.002.t: "Birth of a Nation"
 wagneria.002.d: "The solemn proclamation ceremony of Wagneria gathered thousands of people. A spirit of hope and determination fills the air. Which path will the new state choose?"
 wagneria.002.a: "The path of independent development"
 wagneria.002.b: "The path of military expansion"

 wagneria.010.t: "Influx of Volunteers"
 wagneria.010.d: "Hundreds of volunteers arrive in Wagneria, driven by various motives. Some seek adventure, some seek money, and some believe in our ideology. How should we handle this influx?"
 wagneria.010.a: "Select the best"
 wagneria.010.b: "Take everyone"

 wagneria.011.t: "Balkan Steel"
 wagneria.011.d: "Serbian volunteers arrive in Wagneria. These battle-hardened veterans of the Yugoslav wars are ready to apply their skills in Africa. Among them stands out an experienced commander nicknamed 'Momcilo'."
 wagneria.011.a: "Receive with honors"
 wagneria.011.b: "Distribute among units"

 wagneria.012.t: "Kalinovsky Legion"
 wagneria.012.d: "Belarusian militiamen arrive in Wagneria. Their motivation and determination are impressive, but their presence may cause friction with Russian volunteers."
 wagneria.012.a: "Use their radicalism"
 wagneria.012.b: "Keep them separate"

 wagneria.013.t: "Desert Foxes"
 wagneria.013.d: "Veterans of the Syrian campaign arrive in Wagneria. Their experience in urban warfare and desert terrain is invaluable."
 wagneria.013.a: "Study their tactics"
 wagneria.013.b: "Use them as assault units"

 wagneria.014.t: "Amazon Revolutionaries"
 wagneria.014.d: "Latin American volunteers arrive in Wagneria. Their experience in jungle guerrilla warfare may be useful in Central Africa."
 wagneria.014.a: "Form special units"
 wagneria.014.b: "Distribute among garrisons"

 wagneria.015.t: "International Legion"
 wagneria.015.d: "Volunteers from all over the world are flocking to Wagneria. Serbs, Syrians, Afghans, Latin Americans - all ready to fight under our flag. The international nature of the legion creates a unique combat culture."
 wagneria.015.a: "Encourage brotherhood of nations"
 wagneria.015.b: "Focus on professionalism"

 wagneria.020.t: "Orchestra of War"
 wagneria.020.d: "Our troops are employing tactics of massive artillery strikes and assault operations. The initial results are impressive, but the cost is high."
 wagneria.020.a: "Continue in the same spirit"
 wagneria.020.b: "Adjust tactics"

 wagneria.021.t: "Artillery Duel"
 wagneria.021.d: "Our artillerymen engage in counter-battery warfare with the enemy. Thanks to better training and more guns, we are gaining the upper hand."
 wagneria.021.a: "Build on the success"
 wagneria.021.b: "Consolidate achievements"

 wagneria.022.t: "Masters of Sieges"
 wagneria.022.d: "Our troops are demonstrating outstanding success in siege warfare. Systematic destruction of fortifications and suppression of enemy resistance are becoming our trademark."
 wagneria.022.a: "Solidify the doctrine"
 wagneria.022.b: "Share experience"

 wagneria.030.t: "Shadow in the Desert"
 wagneria.030.d: "Our mobile groups are operating behind enemy lines, delivering precision strikes on headquarters and depots. The enemy is disoriented and unsure where the next blow will come from."
 wagneria.030.a: "Reinforce the groups"
 wagneria.030.b: "Expand operational area"

 wagneria.031.t: "Information Warfare"
 wagneria.031.d: "Our information operations are achieving their goals. Panic and distrust of command are growing in the enemy camp. Fake news and disinformation are sowing chaos among enemy ranks."
 wagneria.031.a: "Increase information pressure"
 wagneria.031.b: "Change targets"

 wagneria.032.t: "Deep State"
 wagneria.032.d: "Our intelligence network has infiltrated the power structures of neighboring states. We can now influence decision-making and obtain secret information. The shadow empire is growing."
 wagneria.032.a: "Expand the network"
 wagneria.032.b: "Use the influence"

 wagneria.040.t: "Operation 'Savannah'"
 wagneria.040.d: "Our agents report on the situation in Cameroon. The government is weakened by corruption scandals, the army is demoralized. The timing for invasion is favorable."
 wagneria.040.a: "Begin the operation"
 wagneria.040.b: "Conduct sabotage"

 wagneria.041.t: "Operation 'Desert'"
 wagneria.041.d: "The situation in Chad is favorable for a military campaign. The central government does not control the periphery, and local warlords are ready to switch sides."
 wagneria.041.a: "Begin the operation"
 wagneria.041.b: "Bribe the warlords"

 wagneria.042.t: "Operation 'Congo'"
 wagneria.042.d: "The Republic of Congo is our gateway to Central Africa. French influence is waning here, and we can fill the power vacuum."
 wagneria.042.a: "Begin the operation"
 wagneria.042.b: "Sponsor the opposition"

 wagneria.043.t: "Operation 'Cobalt'"
 wagneria.043.d: "The DRC is a source of strategic resources. Cobalt, copper, diamonds, gold - all waiting for their master. The eastern provinces have lived in chaos for many years."
 wagneria.043.a: "Begin the operation"
 wagneria.043.b: "Support the separatists"

 wagneria.044.t: "Operation 'Nile'"
 wagneria.044.d: "Sudan is the crossroads of Africa. Control of the Nile gives power over the water resources of the entire region. The transitional government is weak and vulnerable."
 wagneria.044.a: "Begin the operation"
 wagneria.044.b: "Make a secret alliance"

 wagneria.045.t: "Master of the Savannah"
 wagneria.045.d: "Our dominance in the region is recognized by all. Wagneria is becoming a super-regional power. African leaders seek our favor, and our enemies tremble. Our legacy is just beginning."
 wagneria.045.a: "Establish new hegemony"
 wagneria.045.b: "Become the arbiter of Africa"