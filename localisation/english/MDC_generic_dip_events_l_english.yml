 #Generic mdc events
 mdc4.1.t: "[From.GetName]-[Root.GetName] Free Trade and Investment Agreement"
 mdc4.1.d: "[From.GetNameDef] is offering us a free trade agreement and a mutual investment treaty. We will have priority to export to and import from them, and both nations will benefit from reduced investment costs"
 mdc4.1.a: "Sign both agreements!"
 mdc4.1.b: "Refuse"

 mdc4.2.t: "[From.GetNameDef] Has Signed a Trade and Investment Agreement with Us"
 mdc4.2.d: "[From.GetNameDef] has accepted our offer to sign a free trade agreement and mutual investment treaty. Both agreements will enter into force immediately"
 mdc4.2.a: "It will make both of us prosperous!"

 mdc4.3.t: "[From.GetNameDef] Has Refused to Sign a Trade and Investment Agreement with Us"
 mdc4.3.d: "[From.GetNameDef] has refused our offer to sign a free trade agreement and mutual investment treaty"
 mdc4.3.a: "Shit"

 mdc4.4.t: "[From.GetName]-[Root.GetName] Military R&D Cooperation"
 mdc4.4.d: "[From.GetNameDef] has proposed a joint military research and development cooperation agreement. This would allow our armed forces to share technological expertise and accelerate development of weapons, equipment and doctrine."
 mdc4.4.a: "Agree to cooperate"
 mdc4.4.b: "Refuse"

 mdc4.5.t: "[From.GetNameDef] Has Accepted Military R&D Cooperation"
 mdc4.5.d: "[From.GetNameDef] has accepted our proposal for military R&D cooperation. The partnership will begin immediately and we should see benefits in training, equipment and doctrine."
 mdc4.5.a: "Excellent - to progress!"

 mdc4.6.t: "[From.GetNameDef] Has Refused Military R&D Cooperation"
 mdc4.6.d: "[From.GetNameDef] has refused our offer of military R&D cooperation. This refusal may strain diplomatic relations."
 mdc4.6.a: "A missed opportunity"

 #Green Energy Investment
 mdc4.7.t: "Green Energy Investment"
 mdc4.7.d: "[FROM.GetName] has approached us with a proposal to jointly invest in renewable energy projects. The initiative includes financial participation, technological cooperation, and the strengthening of bilateral relations. Accepting the proposal would deepen economic ties, while rejection may strain diplomatic relations."
 mdc4.7.a: "Approve the investment proposal"
 mdc4.7.b: "Reject the proposal" 

 mdc4.8.t: "Green Energy Agreement"
 mdc4.8.d: "[FROM.GetName] has finalized a renewable energy investment agreement with us. This cooperation will bring capital inflows, technological expertise, and contribute to the long-term sustainability of our energy sector."
 mdc4.8.a: "A step toward a greener future"

 mdc4.9.t: "Green Energy Rejected"
 mdc4.9.d: "[FROM.GetName] has declined our proposal for cooperation in renewable energy. Economic opportunities have been lost, and bilateral relations may suffer as a result."
 mdc4.9.a: "An unfortunate decision"

 #Requests Usaid
 mdc4.10.t: "[FROM.GetName] Wants to Join USAID"
 mdc4.10.d: "The [FROM.GetAdjective] goverment has formally requested economic development aid and technical assistance through our USAID programs. This initiative could strengthen our strategic influence in the region and foster goodwill"
 mdc4.10.a: "Approve the aid package"
 mdc4.10.b: "Deny the request"

 mdc4.11.t: "USAID Application Accepted"
 mdc4.11.d: "We have received official confirmation from Washington. Our application to participate in the United States Agency for International Development program has been approved.\n\nThis partnership will grant us access to vital resources for development projects, technical expertise, and training programs. It marks a significant step in strengthening our bilateral relations and opens a new chapter of cooperation focused on economic growth and stability"
 mdc4.11.a: "Hurray!"

 mdc4.12.t: "USAID Application Declined"
 mdc4.12.d: "A formal notice has been received from the U.S. Department of State. Our application to join the USAID program has not been approved at this time.This decision denies us access to potential development grants and technical cooperation"
 mdc4.12.a: "Shit"

 #Requests Non-NATO Major Ally Status
 mdc4.13.t: "[FROM.GetName] Requests Non-NATO Major Ally Status"
 mdc4.13.d: "The [FROM.GetAdjective] goverment has formally applied for the status of a Major Non-NATO Ally (MNNA). Granting this status would signify a special strategic partnership, unlock new avenues for military cooperation and potentially ease access to certain defense technologies"
 mdc4.13.a: "Approve the request"
 mdc4.13.b: "Deny the application"

 mdc4.14.t: "[FROM.GetName] Accepts!"
 mdc4.14.d: "The [FROM.GetAdjective] goverment has officially ratified our application. We are now recognized as a Major Non-NATO Ally. This formalizes our special partnership and opens a new chapter for enhanced military and security cooperation" 
 mdc4.14.a: "A significant diplomatic achievement"

 mdc4.15.t: "[FROM.GetName] Rejected Our Application"
 mdc4.15.d: "The [FROM.GetAdjective] goverment to deny our request for the Major Non-NATO Ally status. While this closes a specific formal avenue for now, our bilateral relations continue on their existing basis"
 mdc4.15.a: "We will seek other paths for cooperation"

 #Generic Refuse
 mdc4.16.t: "[FROM.GetName] Declined the Offer"
 mdc4.16.d: "The [FROM.GetAdjective] government has sent a polite but firm refusal. They cite the current state of our bilateral relations as being «not conducive to such an arrangement at this time», and further indicate that pressing internal affairs demand their full attention"
 mdc4.16.a: "A regrettable decision"

 mdc4.17.t: "[From.GetName]-[Root.GetName] Genetic Research Cooperation"
 mdc4.17.d: "The government of [From.GetNameDef] has tabled a pioneering proposal for a bilateral partnership in advanced genetic and biomedical research. This agreement would see our nations pool scientific talent and resources to explore frontiers in human genomics, with potential applications for medicine, agriculture, and national resilience"
 mdc4.17.a: "Agree to this scientific venture"
 mdc4.17.b: "Politely decline on ethical grounds"

 mdc4.18.t: "[From.GetName] Has Accepted Genetic Research Partnership"
 mdc4.18.d: "[From.GetNameDef] has formally ratified the agreement on joint genetic research. Shared laboratories and data exchanges will be established, granting our scientists access to a broader pool of knowledge and accelerating our biotechnological capabilities"
 mdc4.18.a: "A new chapter in science begins"

 mdc4.19.t: "[From.GetName] Has Refused Genetic Research Cooperation"
 mdc4.19.d: "Citing ethical reservations and strategic sovereignty, [From.GetNameDef] has declined to enter the proposed genetic research partnership. The refusal underscores the sensitive nature of this field and may cool diplomatic enthusiasm for future scientific collaboration"
 mdc4.19.a: "Their loss"







