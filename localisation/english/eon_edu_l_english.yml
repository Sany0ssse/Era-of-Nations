l_english:
 eon_edu_request_join: "Apply to the defence union led by [FROM.GetName]"
 eon_edu_request_join_desc: "Request voluntary membership of this European defence union. The current leader has 42 days to reply. Your country joins only after agreement and while its national policy still permits membership. Existing alliances are not changed automatically."
 eon_edu_accept_request: "Approve the application from [FROM.GetName]"
 eon_edu_accept_request_desc: "Agree to admit this country into the current defence union. Admission is completed only if the application is current and the country can still join."
 eon_edu_reject_request: "Decline the application from [FROM.GetName]"
 eon_edu_reject_request_desc: "Close this country's current application without changing its alliance. It can apply again after 14 days."
 eon_edu_withdraw_request: "Withdraw our defence union application"
 eon_edu_withdraw_request_desc: "Cancel our current request without joining. A new application can be sent after 14 days."
 eon_edu_founder_requirements_tt: "An active, sovereign EU country with the security reform, Foreign Minister mandate and required influence may establish this optional defence union. It must have no existing alliance, respect its national joining policy and not wage an offensive war."
 eon_edu_request_requirements_tt: "Our country must be an active EU member, sovereign and without another alliance. Its national joining permission, neutrality and world-tension threshold apply. The recipient must be the current leader of this defence union. A pending request or 14-day waiting period prevents another request."
 eon_edu_reply_requirements_tt: "Only the current leader can reply to this country's unexpired application to the same defence union. Admission also requires the applicant's current national policy and absence of another alliance."
 eon_edu_withdraw_requirements_tt: "There must be an unexpired application from our country."
 eon_edu_request_title: "Defence union application"
 eon_edu_request_desc: "An EU country has requested membership of our defence union. Open Decisions → European Union to accept or decline the current application within 42 days. This message records the notification; decisions always show the current application."
 eon_edu_response_title: "Defence union application concluded"
 eon_edu_accepted_desc: "Our application was approved and admission into the current defence union was completed."
 eon_edu_rejected_desc: "Our application was declined. Our alliance membership has not changed. A new application can be submitted after 14 days."
 eon_edu_withdrawn_desc: "We withdrew our application. A new application can be submitted after 14 days."
 eon_edu_expired_desc: "The 42-day response period ended without admission. A new application can be submitted after 14 days."
 eon_edu_invalidated_desc: "This application is no longer current: its alliance, leadership or eligibility changed. No admission took place through this request. A new application can be submitted after 14 days if the current conditions permit it."
 eon_edu_creation_failed_desc: "The defence union could not be established. No creation receipt or membership announcement was issued. Check your current national policy and existing alliance before trying again."
 eon_edu_departure_failed_desc: "Departure from the defence union could not be completed. Its actual alliance and identity have been preserved. A formal departure will be retried after the blocked transfer, removal or dissolution becomes possible."
 eon_edu_formed_title: "European defence union established"
 eon_edu_formed_desc: "An EU member has established an optional European defence union under the adopted security reform. Other eligible EU countries can apply voluntarily. This new alliance does not automatically change NATO membership or the alliances of other EU states."
 eon_edu_ok: "Understood"
