l_english:
 uranium:0 "Natural uranium"
 uranium_desc:0 "Natural uranium for the nuclear fuel cycle, mined in documented geological districts. One native trade unit represents a nominal 100 kg U/week. Imports never create underground ore."
 PRODUCTION_MATERIALS_URANIUM:0 "Natural uranium"
 eon_uranium_category:0 "Uranium and reactor fuel"
 eon_uranium_category_desc:0 "Mining, processing and finished-fuel trade are separate stages. Mining needs a deposit; processing can use imported natural feed."
 eon_uranium_status:0 "Review the uranium balance"
 eon_uranium_status_desc:0 "Natural stock: §Y[?eon_natural_uranium_stock_kg|0] kg U§!. Available flow: §Y[?eon_uranium_available_flow_kg|0] kg U/week§!.\nFinished reactor stock: §Y[?var_reactor_material_stockpile|0] kg U§!. Projected production: §Y[?nuclear_reactor_fuel_production|0] kg/week§!. Reactor demand: §Y[?nuclear_fuel_consumption|0] kg/week§!. Depleted tails stored separately: §Y[?eon_depleted_uranium_stock_kg|0] kg§!.\n\nBuy natural uranium in native trade. Buy or sell finished fuel in the energy window: positive quantity buys, negative sells. Historical natural uranium reference around 2000: roughly 26–37 USD/kg U; native trade uses civilian factories. Finished-fuel quotes include processing and use thousands USD/kg. Do not equate these prices."
 eon_uranium_expand_mine:0 "Develop uranium mining in [FROM.GetName]"
 eon_uranium_expand_mine_desc:0 "The game allocates a single historical country resource budget among confirmed districts; these are not measured individual mine reserves.\nRemaining: §Y[?FROM.eon_uranium_reserve_kg|0] kg U§!. Base capacity: §Y[?FROM.eon_uranium_capacity|2] t/week§!; ceiling: §Y[?FROM.eon_uranium_capacity_limit|2] t/week§!.\nReserve §Y0.25 billion USD§! for §Y730 days§!. First step up to 1 t/week; later steps increase base capacity by 50%, capped by this district. Mining depletes the deposit. Costs, clocks and limits are game parameters. Losing the state before completion refunds the escrow."
 eon_uranium_mine_ready_tt:0 "A remaining documented deposit, owned and controlled state, expansion headroom and 0.25 billion USD are required. No other mining project may be active in this state. Industrial capacity must reach 100 kg U/week; smaller deposits remain recorded underground."
 eon_enrichment_ready_tt:0 "Nuclear technology, no bankruptcy or active project, and 25 billion USD per facility are required. Resulting facilities cannot exceed 1 + rounded domestic civilian factories / 20."
 eon_nuclear_fuel_trade_unavailable_tt:0 "Choose an existing partner without war or embargo. Quantity, price, stock and money must permit the entire transaction. Neither party may have an unfinished offer; the seller must allow fuel trade. If a small payment cannot be represented, increase the quantity and check the final payment."
 eon_nuclear_fuel_trade_expired_tt:0 "This offer is no longer executable. Money and fuel cannot transfer twice; escrow returns to its owner."
 eon_nuclear_fuel_trade_invalid_tt:0 "The transaction conditions no longer hold. No duplicate transfer is possible."
 eon_nuclear_fuel_block_exports:0 "Block finished reactor fuel exports"
 eon_nuclear_fuel_block_exports_desc:0 "New and pending offers cannot sell our fuel while this policy is active. Mining and native natural uranium trade continue."
 eon_nuclear_fuel_unblock_exports:0 "Allow finished reactor fuel exports"
 eon_nuclear_fuel_unblock_exports_desc:0 "Allow finished-fuel transactions when all other conditions hold. This decision does not automatically send or accept an offer."
 eon_nuclear_fuel_trade_settled_tt:0 "Settled once: payment to the seller and fuel to the buyer. A repeated reply cannot repeat the transfer."
