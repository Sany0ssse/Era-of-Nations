l_english:
 eon_diplomatic_relations_category:0 "Diplomatic relations and representations"
 eon_diplomatic_relations_category_desc:0 "Manage bilateral relations, each country’s own mission, appointments and departure arrangements. Opening and changing a mission require agreement and funding. An appointment is identified by a numbered record. Recall, closing a mission and severing relations have different consequences."
 eon_diplomatic_relations_propose:0 "Agree or restore diplomatic relations with [FROM.GetName]"
 eon_diplomatic_relations_propose_desc:0 "Ask for mutual confirmation of existing relations or restoration after a rupture. The response period is 30 days. Agreement preserves historical grievances and does not itself open an embassy, recognize a government, lift sanctions or create an alliance."
 eon_diplomatic_relations_mission_charge:0 "chargé d’affaires class"
 eon_diplomatic_relations_mission_charge_desc:0 "Agree to open our mission at chargé d’affaires level, or change its formal class to that level. We pay 10 political power and $0.01 billion on agreement, then $0.001 billion per month. We must appoint a head separately. The partner’s mission in our country is a separate undertaking."
 eon_diplomatic_relations_mission_ambassador:0 "ambassador class"
 eon_diplomatic_relations_mission_ambassador_desc:0 "Agree to open or upgrade our mission to ambassador level. We pay 10 political power and $0.02 billion on agreement, then $0.002 billion per month. A change of class requires a new appointment. The partner’s mission remains separate; the class does not confer additional diplomatic rights."
 eon_diplomatic_relations_propose_head:0 "Propose a new mission-head appointment to [FROM.GetName]"
 eon_diplomatic_relations_propose_head_desc:0 "Submit a new numbered appointment for the head of our mission and request agrément. The partner may accept or refuse within 30 days. An agreed appointment still requires notification of arrival and credentials before the head takes up functions. The present head continues while a replacement is considered."
 eon_diplomatic_relations_decline:0 "Decline the current proposal from [FROM.GetName]"
 eon_diplomatic_relations_decline_desc:0 "Close only this incoming request. No resources are charged and no other agreement ends. Agrément refusal need not include a reason. A fresh request is possible after closure; there is no permanent pair ban."
 eon_diplomatic_relations_withdraw:0 "Withdraw our current proposal to [FROM.GetName]"
 eon_diplomatic_relations_withdraw_desc:0 "Close only our outgoing request and its matching copy. This is free and does not close either active mission or another contract. A new request can be submitted immediately."
 eon_diplomatic_relations_credentials:0 "Notify credentials for our approved head in [FROM.GetName]"
 eon_diplomatic_relations_credentials_desc:0 "Notify the receiving foreign ministry of the approved head’s arrival and deliver a copy of credentials. This begins the head’s functions. A previous head’s departure arrangements remain a separate responsibility."
 eon_diplomatic_relations_recall:0 "Recall our mission head from [FROM.GetName]"
 eon_diplomatic_relations_recall_desc:0 "Recall our current head and notify interim representation by a chargé d’affaires. The agreed mission class and bilateral relations continue. Arrange the recalled head’s departure, then submit a replacement when ready."
 eon_diplomatic_relations_persona_non_grata:0 "Declare visiting head No. [?FROM.eon_diplomatic_relations_active_head@ROOT|0] persona non grata"
 eon_diplomatic_relations_persona_non_grata_desc:0 "Declare active appointment No. [?FROM.eon_diplomatic_relations_active_head@ROOT|0] of the visiting mission unacceptable. An explanation is not required. The sending country must end this head’s functions and arrange departure. An approved replacement or another pending appointment remains separate."
 eon_diplomatic_relations_close:0 "Close our mission in [FROM.GetName]"
 eon_diplomatic_relations_close_desc:0 "Close our mission and any pending appointment or class proposal in this direction. The host must protect the closed premises and archives and provide facilities for personnel to depart. Relations and the opposite mission continue separately."
 eon_diplomatic_relations_close_host:0 "End consent to [FROM.GetName]’s mission here"
 eon_diplomatic_relations_close_host_desc:0 "End consent to the visiting mission. Its premises and archives remain protected, and departure arrangements must be acknowledged. Our opposite mission, bilateral relations and other agreements are separate."
 eon_diplomatic_relations_break:0 "Sever diplomatic relations with [FROM.GetName]"
 eon_diplomatic_relations_break_desc:0 "Record the bilateral rupture, close both directed missions and their current requests, retain historical grievances, and record protection and departure duties. Existing trade, investment, energy, support, alliances, sanctions and third-country relations are not automatically cancelled. Consular relations are not modelled as automatically severed."
 eon_diplomatic_relations_exit_facilities:0 "Acknowledge declared departure arrangements for [FROM.GetName]"
 eon_diplomatic_relations_exit_facilities_desc:0 "Confirm that the receiving country has declared facilities for the departing personnel. The departure remains outstanding until the sending country reports it. Sending country’s current departure record No. [?FROM.eon_diplomatic_relations_current_departure@ROOT|0], appointment No. [?FROM.eon_diplomatic_relations_current_departure_head@ROOT|0] (0 = other mission personnel). This acknowledgement concerns this record only."
 eon_diplomatic_relations_report_departure:0 "Report our mission personnel’s departure from [FROM.GetName]"
 eon_diplomatic_relations_report_departure_desc:0 "After the host acknowledges its declared arrangements, report that our departing personnel have left. Closed premises and archives remain subject to protection. This report closes current departure record No. [?eon_diplomatic_relations_current_departure@FROM|0] only; later duties remain outstanding."
 eon_diplomatic_relations_notice.1.t:0 "A current diplomatic proposal"
 eon_diplomatic_relations_notice.1.d:0 "A diplomatic proposal awaits your decision. Review the current terms under Diplomatic relations and representations, then accept or decline within 30 days."
 eon_diplomatic_relations_notice.2.t:0 "Diplomatic representation updated"
 eon_diplomatic_relations_notice.2.d:0 "Diplomatic relations or representation have changed. Review the agreed class, appointments and available next steps under Diplomatic relations and representations. Existing contracts and third-country relations retain their own terms."
 eon_diplomatic_relations_notice.3.t:0 "Departure and protection record"
 eon_diplomatic_relations_notice.3.d:0 "Departure arrangements or a departure report have changed. The host acknowledges its declared facilities; the sending country reports departure. Protection of closed mission premises and archives continues."
 eon_diplomatic_relations_notice.ok:0 "Acknowledged"
 eon_diplomatic_relations_status:0 "View our diplomatic record with [FROM.GetName]"
 eon_diplomatic_relations_status_info_tt:0 "Review the current terms and appointments in this decision’s description."
 eon_diplomatic_relations_status_desc:0 "Relations with [FROM.GetName]: [eon_diplomatic_relations_relation_label]. Our mission: [eon_diplomatic_relations_mission_label]. Active appointment No. [?eon_diplomatic_relations_active_head@FROM|0]; approved appointment No. [?eon_diplomatic_relations_approved_head@FROM|0]. Outgoing proposal: [eon_diplomatic_relations_outgoing_label], appointment No. [?eon_diplomatic_relations_out_head@FROM|0]. Incoming proposal: [eon_diplomatic_relations_incoming_label], appointment No. [?eon_diplomatic_relations_in_head@FROM|0]. Our departure arrangements: [eon_diplomatic_relations_departure_label]. Closed premises and archives: [eon_diplomatic_relations_protection_label]. Appointment numbers identify diplomatic appointments, without naming a person. Pending departure duties: [?eon_diplomatic_relations_departure_count@FROM|0]. Current departure record No. [?eon_diplomatic_relations_current_departure@FROM|0], appointment No. [?eon_diplomatic_relations_current_departure_head@FROM|0] (0 = other mission personnel)."
 eon_diplomatic_relations_accept_relations:0 "Accept relations proposed by [FROM.GetName]"
 eon_diplomatic_relations_accept_relations_desc:0 "Confirm or restore bilateral relations, preserving historical grievances. Review the current diplomatic record before deciding."
 eon_diplomatic_relations_accept_charge:0 "Accept chargé-level mission proposed by [FROM.GetName]"
 eon_diplomatic_relations_accept_charge_desc:0 "Agree to the partner’s chargé-level mission. The sending country pays 10 political power and $0.01 billion, then $0.001 billion monthly. Review the current diplomatic record before deciding."
 eon_diplomatic_relations_accept_ambassador:0 "Accept ambassador-level mission proposed by [FROM.GetName]"
 eon_diplomatic_relations_accept_ambassador_desc:0 "Agree to the partner’s ambassador-level mission. The sending country pays 10 political power and $0.02 billion, then $0.002 billion monthly. Review the current diplomatic record before deciding."
 eon_diplomatic_relations_accept_head:0 "Accept abstract mission-head appointment proposed by [FROM.GetName]"
 eon_diplomatic_relations_accept_head_desc:0 "Grant agrément to incoming appointment No. [?eon_diplomatic_relations_in_head@FROM|0]. Notification of arrival and credentials remains a separate step. Review the current diplomatic record before deciding."
 eon_diplomatic_relations_persona_non_grata_approved:0 "Reject approved appointment No. [?FROM.eon_diplomatic_relations_approved_head@ROOT|0]"
 eon_diplomatic_relations_persona_non_grata_approved_desc:0 "Withdraw agrément for approved appointment No. [?FROM.eon_diplomatic_relations_approved_head@ROOT|0] before its head takes up functions. An explanation is not required. The present head continues, if one is serving; a new appointment may be submitted. The approved appointment has not established arrival, so no departure is recorded for it."
