l_english:
 eon_energy_counter_offer:0 "Prepare a Counteroffer"
 eon_energy_counter_prepare_tt:0 "Keep the current delivery contract and prepare different quantity or price terms with this partner in the energy controls. Nothing is agreed until the revised proposal is sent and accepted. The pair remains reserved while its draft is edited. The revised quantity must be nonzero; use withdrawal to abandon negotiations."
 eon_energy_counter_draft_ready_tt:0 "This counteroffer belongs to the currently reserved pair; the framework and previous contract still match the frozen proposal. The selected partner and import/export direction are fixed, quantity is nonzero, price is nonnegative and the supplier can cover the revised total volume. The delivery contract remains indefinite, ending only through termination."
 eon_energy_counter_partner_locked_tt:0 "The partner is fixed while a counteroffer draft is pending. Submit or withdraw the draft before selecting another country."
 eon_energy_withdraw_available_tt:0 "We own this pending proposal or its counteroffer draft. The other country holds the matching reservation. Withdrawal of unagreed terms does not terminate the current delivery contract."
 eon_energy_resume_counter_available_tt:0 "We own a counteroffer draft with this country. Reopen the energy controls to continue editing it; sending will check the current framework, contract and available supply."
 eon_withdraw_energy_offer:0 "Withdraw Energy Proposal"
 eon_withdraw_energy_offer_desc:0 "Withdraw the pending delivery proposal or abandon this pair's counteroffer draft. Existing agreed deliveries and payments are unaffected."
 eon_withdraw_energy_offer_send_desc:0 "Withdraw only the unagreed energy terms. A normal pending proposal remains reserved until the recipient acknowledges its withdrawn response. A counteroffer draft can be abandoned immediately, since its earlier response was already consumed. Existing delivery contracts continue."
 eon_resume_energy_counter_offer:0 "Resume Energy Counteroffer"
 eon_resume_energy_counter_offer_desc:0 "Reopen our reserved counteroffer draft with this country."
 eon_resume_energy_counter_offer_send_desc:0 "Continue editing the draft quantity and price in the energy controls. Both countries remain reserved to this pair. Submission and acceptance will recheck the current conditions; the prior delivery contract continues meanwhile."
 eon_energy_negotiation_ack:0 "Understood"
 eon_energy_negotiation.10.t:0 "Energy Terms Declined"
 eon_energy_negotiation.10.desc:0 "The receiving government declined these proposed energy delivery terms. This response did not replace any prior delivery contract. Negotiations can continue with a fresh proposal."
 eon_energy_negotiation.11.t:0 "Energy Proposal Withdrawn"
 eon_energy_negotiation.11.desc:0 "The unagreed energy proposal was withdrawn. Those terms did not take effect. Withdrawal did not terminate any previously agreed delivery contract."
 eon_energy_negotiation.12.t:0 "Energy Proposal No Longer Valid"
 eon_energy_negotiation.12.desc:0 "The proposed terms no longer matched the parties, framework or previous delivery records when the response was processed. No replacement contract was created. This response did not change any prior delivery contract; separate war, framework or supply changes may have affected it."
 eon_energy_negotiation.13.t:0 "Insufficient Supply for the Proposed Volume"
 eon_energy_negotiation.13.desc:0 "The supplier could not cover the proposed total delivery volume after accounting for its other commitments when the response was processed. No replacement contract was created by this response. A smaller volume may be proposed if the other conditions remain valid."
 eon_energy_negotiation.14.t:0 "Buyer Declined under Budget Pressure"
 eon_energy_negotiation.14.desc:0 "The buyer declined the offered terms under its current commercial assessment. Expenses exceeded income and budget pressure reduced its willingness to agree. This assessment did not check the ability to fund a particular invoice. The response did not replace any prior delivery contract."
 eon_energy_negotiation.15.t:0 "Buyer Declined the Commercial Terms"
 eon_energy_negotiation.15.desc:0 "The buyer declined the proposed quantity and price under its current assessment of energy need and commercial conditions. This response did not replace any prior delivery contract. Different concrete terms can be proposed."
 eon_energy_negotiation.16.t:0 "Supplier Declined Unpaid Deliveries"
 eon_energy_negotiation.16.desc:0 "The proposed price was zero. The supplier declined those terms under its existing commercial assessment. This response did not replace any prior delivery contract."
 eon_energy_negotiation.17.t:0 "Supplier Declined the Commercial Terms"
 eon_energy_negotiation.17.desc:0 "The supplier declined the proposed quantity and price under its current commercial assessment. This response did not replace any prior delivery contract. Different concrete terms can be proposed."
 eon_energy_negotiation.19.t:0 "Energy Counteroffer Draft Prepared"
 eon_energy_negotiation.19.desc:0 "The receiving government opened a counteroffer draft for this energy proposal. The earlier terms were not agreed. Preparing the draft did not change any prior delivery contract. The pair was reserved for editing, submission or withdrawal of that draft."
 eon_energy_counter_pending_import_desc:0 "Counteroffer. [FROM.GetName] proposes that we import £text_icon_energyies §Y[?eon_energy_offer_quantity|0] GW§! at §Y$[?eon_energy_offer_price|2] billion per GW per week§!. Total weekly payment: §R$[?eon_energy_offer_weekly|2] billion§!.\n\nOur current signed quantity is §Y[?eon_energy_offer_old_amount|0] GW§! (positive: import; negative: export), at $[?eon_energy_offer_old_price|2] billion per GW, totalling $[?eon_energy_offer_old_weekly|2] billion per week. Zero means no existing delivery contract.\n\nThese proposed terms are fixed until we answer. The current contract continues during negotiations. Acceptance replaces the bilateral contract; refusal preserves it. The contract continues until termination, with no fixed expiry. Either side may propose a revision or end deliveries through the energy controls. A shortage or cancellation of the framework agreement ends deliveries and payments."
 eon_energy_counter_pending_export_desc:0 "Counteroffer. [FROM.GetName] proposes that we export £text_icon_energyies §Y[?eon_energy_offer_quantity|0] GW§! at §Y$[?eon_energy_offer_price|2] billion per GW per week§!. Total weekly receipts: §G$[?eon_energy_offer_weekly|2] billion§!.\n\nOur current signed quantity is §Y[?eon_energy_offer_old_amount|0] GW§! (positive: import; negative: export), at $[?eon_energy_offer_old_price|2] billion per GW, totalling $[?eon_energy_offer_old_weekly|2] billion per week. Zero means no existing delivery contract.\n\nThese proposed terms are fixed until we answer. The current contract continues during negotiations. Acceptance replaces the bilateral contract; refusal preserves it. The contract continues until termination, with no fixed expiry. Either side may propose a revision or end deliveries through the energy controls. A shortage or cancellation of the framework agreement ends deliveries and payments."
