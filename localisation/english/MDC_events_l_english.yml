l_english:
 econvent.103.t: "Corruption Scandal"
 econvent.103.d: "A highly influential official was arrested today. He was detained on suspicion of corruption. A search of his property revealed marked banknotes and money stolen from the state budget."
 econvent.103.a: "There's no escape from this..."

 econvent.104.t: "Prices are rising out of control"
 econvent.104.d: "Prices in our market are rising at breakneck speed, and the central bank can't keep up. Inflation is creating panic among the population, and people are buying up goods before they get even more expensive!"
 econvent.104.a: "Something needs to be done about this!"
 
 econvent.105.t: "Prices are falling"
 econvent.105.d: "Our analysts have noticed that market prices are starting to fall, inflation is declining, and people's lives are improving. We should give the Central Bank credit for a job well done!"
 econvent.105.a: "Good News!"

 econvent.106.t: "Crowds of people filled the streets"
 econvent.106.d: "The lack of stability has sparked protests. Angry crowds have filled the streets of our country. Their goal is to change our leadership, as they believe the current government is failing to cope."
 econvent.106.a: "Maybe they will calm down"
 econvent.106.b: "Bring in the police"

 econvent.107.t: "Workers Strikes"
 econvent.107.d: "Poor working conditions and issues with workers' pay led to strikes."

 econvent.108.t: "Low Military Discipline"
 econvent.108.d: "Delays and payment issues have a negative impact on our Army, Fleet and Military Production."

 econvent.109.t: "Corruption Scandal"
 econvent.109.d: "A highly influential official escaped with large ammount of cash stolen from the goverment budget."
 econvent.109.a: "That's sad"
 econvent.109.b: "Increase capital flow control"

 econvent.110.t: "Corruption Scandal in Army"
 econvent.110.d: "During a routine inventory check at one of the army's units, some rifles were found to be missing."
 econvent.110.a: "That's sad"

 econvent.111.t: "Accident at the factory"
 econvent.111.d: "Officials should not have turned a blind eye to workplace safety in exchange for a bribe."
 econvent.111.a: "That's sad"

 econvent.112.t: "Plundered Construction Site"
 econvent.112.d: "One of our major construction projects was delayed because it turned out that the funds allocated for it had been embezzled."
 econvent.112.a: "That's sad"

 econvent.113.t: "Embezzled Research Project"
 econvent.113.d: "Funds allocated for one of our research projects it had been embezzled."
 econvent.113.a: "That's sad"

 econvent.114.t: "Articles about a corrupt official on the Internet"
 econvent.114.d: "Articles alleging corruption on the part of a high-ranking official are circulating online."
 econvent.114.a: "Conduct an investigation"
 econvent.114.b: "Shut up, media. Our officials are the most honest"

 econvent.115.t: "Articles about a corrupt official on News Papers"
 econvent.115.d: "Articles alleging corruption on the part of a high-ranking official are circulating on News Papers."
 econvent.115.a: "Conduct an investigation"
 econvent.115.b: "Shut up, media. Our officials are the most honest"

