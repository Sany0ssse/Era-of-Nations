partisans_activity_modifier_tt: "In civil wars, chaos reigns everywhere, it is not clear where the friends are where the strangers are. Troops suffer losses from partisans and gangs even on their own territory ( §R1%§! of organization and health per month ) and also have difficulties in supply and movement. Also, different groups can carry out sabotage, §Rdamaging buildings§!."
