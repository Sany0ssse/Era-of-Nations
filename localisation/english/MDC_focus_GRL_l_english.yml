l_english:
 #Focuses
 GRL_long_journey_of_nuuka: "The Long Journey of Nuuk"
 GRL_long_journey_of_nuuka_desc: "For centuries, Nuuk was a colonial outpost - a place where Danish governors ruled and Inuit hunters traded. But the city has changed. The old buildings still stand, but new voices fill the parliament. This is our long journey: from a colony to a people with a say in their own future. Every step toward self-rule begins here."
 GRL_colonys_legacy: "The Colony's Legacy"
 GRL_colonys_legacy_desc: "Denmark ruled Greenland for over 200 years. They left behind roads, schools, and hospitals - but also trauma, inequality, and a people who were told their own culture was backward. We cannot change the past. But we can understand it. Only by facing the legacy of colonialism can we truly move forward as a nation."
 GRL_looking_back: "Looking Back"
 GRL_looking_back_desc: "History is not a distant echo - it lives in our families, our language, and our scars. A formal commission to examine the colonial era will not bring back what was lost, but it will give us the truth. And truth is the first step toward healing. The eyes of the world are on us. Let us show them what we have endured."
 GRL_reconciliation_commission: "Reconciliation Commission"
 GRL_reconciliation_commission_desc: "Denmark and Greenland share a history that cannot be erased. But history does not have to be a prison. A joint commission on reconciliation will open dialogue between Copenhagen and Nuuk, acknowledging past wrongs while building a framework for mutual respect. This is not about guilt - it is about responsibility."
 GRL_greenlandic_in_schools: "Greenlandic in Schools"
 GRL_greenlandic_in_schools_desc: "For generations, Greenlandic children were taught in Danish. Their own language was pushed to the margins, spoken only at home. No more. From this day forward, Kalaallisut will be the language of instruction in our schools. Our children will learn their ABCs in the words of their ancestors."
 GRL_nuuk_national_museum: "Nuuk National Museum"
 GRL_nuuk_national_museum_desc: "A nation without a memory is a nation without a soul. The Nuuk National Museum will house the artifacts of our past - the kayaks, the amulets, the tools of our forefathers. But more than that, it will tell our story in our own words. Let the world come and see who we really are."
 GRL_kalaallit_day: "Kalaallit Day"
 GRL_kalaallit_day_desc: "One day a year, we remember. Kalaallit Day is not just a holiday - it is a declaration. A declaration that we are still here, that our culture survived, and that our future is ours to shape. Schools will close. Flags will rise. And the children will learn the songs that their great-grandparents sang."
 GRL_ice_infrastructure: "Ice Infrastructure"
 GRL_ice_infrastructure_desc: "Building in Greenland is not like building anywhere else. The permafrost shifts, the sea ice moves, and the winter sun never rises. Our roads, airports, and ports must be designed for this land - not imported from temperate Europe. We will invest in infrastructure that respects the ice and serves our people."
 GRL_satellite_internet_connection: "Satellite Internet Connection"
 GRL_satellite_internet_connection_desc: "In the 21st century, connectivity is a right, not a luxury. But Greenland's vast distances and harsh terrain make fibre optic cables impractical. Satellite internet is our gateway to the world - for education, for business, and for the simple dignity of being able to call yourself connected. The signal comes from the sky, but the future is ours."
 GRL_kalaallit_nunaata_radioa: "Kalaallit Nunaata Radioa"
 GRL_kalaallit_nunaata_radioa_desc: "For decades, KNR was the only voice that reached every corner of Greenland - from the southern sheep farms to the northern hunting grounds. But it has been underfunded and underappreciated. We will modernize our national broadcaster, expand its reach, and ensure that every Greenlander, no matter how remote, hears news in their own language."
 GRL_kangerkussuaq_airport: "Kangerlussuaq Airport"
 GRL_kangerkussuaq_airport_desc: "Kangerlussuaq is Greenland's international gateway - a runway carved from the tundra that connects us to Copenhagen and the world. But it is aging, and its capacity is limited. Expanding this airport will bring more tourists, more trade, and more opportunities. The world wants to see the Arctic. Let us give them a proper door."
 GRL_port_of_nuuka: "Port of Nuuk"
 GRL_port_of_nuuka_desc: "Nuuk's harbor is the heartbeat of our economy. Fishing boats, cargo ships, and the occasional cruise liner all depend on its docks. But the port is outdated, and the ice grows unpredictable. A new, modern port will secure our supply lines, boost exports, and make Nuuk a true Arctic hub. The sea has always fed us. Now it will also connect us."
 GRL_ice_navigation: "Ice Navigation"
 GRL_ice_navigation_desc: "The sea is our highway, but the ice is our obstacle. Navigating Greenlandic waters requires skill, experience, and technology. By investing in icebreaker support, advanced sonar, and training for local captains, we will make our waters safer and more reliable. The ice will no longer be a barrier - it will be a path."
 GRL_the_cod_economy: "The Cod Economy"
 GRL_the_cod_economy_desc: "Cod was once the backbone of Greenland's economy - until the stocks collapsed in the 1990s. But the fish are returning, and with them, hope. We will rebuild our cod fisheries with sustainable quotas, modern processing plants, and new export routes. The cod economy will not repeat the mistakes of the past. It will be smarter, greener, and Greenlandic."
 GRL_2001_quota_review: "2001 Quota Review"
 GRL_2001_quota_review_desc: "Every year, the fishing quotas are a battleground. Fishermen want more. Scientists warn of collapse. And Copenhagen holds the final pen. The 2001 review is our chance to demand a greater say in our own waters. We will fight for quotas that serve Greenland's interests - not Danish bureaucrats. The fish belong to us."
 GRL_shrimp_fever: "Shrimp Fever"
 GRL_shrimp_fever_desc: "Shrimp saved Greenland's economy when the cod disappeared. Cold-water shrimp are abundant, delicious, and in high demand across Europe and Asia. We will expand our shrimp fleet, build new freezing plants, and market our catch as the cleanest, freshest shrimp in the North Atlantic. The pink gold will flow again."
 GRL_fish_auction_in_sissimouth: "Fish Auction in Sisimiut"
 GRL_fish_auction_in_sissimouth_desc: "Sisimiut is the fishing capital of Greenland - but its fish auction is still a small, local affair. By turning it into a modern, transparent marketplace, we can attract buyers from Iceland, Norway, and beyond. The auction will set fair prices, reduce waste, and give our fishermen the income they deserve. Let the bidding begin."
 GRL_modernization_of_trawiers: "Modernization of Trawlers"
 GRL_modernization_of_trawiers_desc: "Our trawlers are old - many built in the 1980s. They are fuel-inefficient, unreliable, and hard on the environment. A fleet modernization program will bring in new vessels with better engines, smaller carbon footprints, and advanced fish-finding technology. Modern trawlers mean more fish in the hold and less fuel burned. It is good for business and good for the planet."
 GRL_combating_foreign_poaching: "Combating Foreign Poaching"
 GRL_combating_foreign_poaching_desc: "Foreign trawlers sneak into our waters at night, stealing our fish and ignoring our laws. Our coast guard is too small to stop them all. We will demand more patrol vessels from Denmark, train our own inspection teams, and work with international partners to track and fine poachers. Our fish are not theirs to take."
 GRL_small_nation_diplomacy: "Small Nation Diplomacy"
 GRL_small_nation_diplomacy_desc: "Greenland is not a superpower. We will never have aircraft carriers or nuclear submarines. But we have something else: moral authority, Arctic expertise, and the ability to speak honestly. Small nation diplomacy means building alliances, finding common ground, and making our voice heard in a world of giants. We are small, but we are not silent."
 GRL_representative_office_in_brussels: "Representative Office in Brussels"
 GRL_representative_office_in_brussels_desc: "Brussels is the heart of Europe. Decisions made there affect our fishing rights, our trade deals, and our environmental standards. A permanent Greenlandic office in Brussels will give us a seat at the table - not just as a Danish dependency, but as an Arctic nation with distinct interests. Let the bureaucrats hear from the people who actually live in the cold."
 GRL_northern_calibration: "Northern Calibration"
 GRL_northern_calibration_desc: "The Nordic countries - Norway, Sweden, Finland, Iceland - are our natural partners. We share history, climate, and values. By aligning our policies with theirs on Arctic affairs, environmental protection, and indigenous rights, we can amplify our influence. This is not about following - it is about calibrating our compass to true north."
 GRL_the_queens_visit: "The Queen's Visit"
 GRL_the_queens_visit_desc: "Queen Margrethe II of Denmark has announced a state visit to Greenland. The last time a monarch came, it was a colonial spectacle. This time, it will be different. We will welcome her with dignity - but also with clear demands for greater autonomy. The crown will see that Greenland is no longer a colony. It is a partner."
 GRL_artic_council_2002: "Arctic Council 2002"
 GRL_artic_council_2002_desc: "The Arctic Council is the most important forum for circumpolar cooperation. But Greenland has never had an independent seat - we speak through Denmark. In 2002, we will push for observer status, and eventually full membership. The Arctic belongs to the Arctic peoples. We will not be guests in our own home."
 GRL_pacific_view: "Pacific View"
 GRL_pacific_view_desc: "The future of the Arctic economy lies not just in Europe, but in Asia. China, Japan, and South Korea are hungry for rare earth minerals, fish, and shipping routes. We will open diplomatic channels with Pacific powers, offering them investment opportunities in exchange for recognition of our self-governing status. The Pacific wind brings both trade and leverage."
 GRL_the_welfare_state: "The Welfare State"
 GRL_the_welfare_state_desc: "Greenland is not rich - but we believe that no one should be left behind. A strong welfare state means free healthcare, quality education, and support for the elderly and disabled. This is our social contract. We will build a system that reflects Greenlandic values: community, resilience, and care for the vulnerable. The state exists to serve the people, not the other way around."
 GRL_housing_program: "Housing Program"
 GRL_housing_program_desc: "Too many Greenlandic families live in overcrowded, poorly insulated homes. The cold seeps through the walls, and the mould sickens the children. A massive public housing program will build thousands of new, energy-efficient homes across the country. Every Greenlander deserves a warm, dry place to call home. This is not charity - it is justice."
 GRL_fight_against_tuberculosis: "Fight Against Tuberculosis"
 GRL_fight_against_tuberculosis_desc: "Tuberculosis was supposed to be a disease of the past. But in Greenland, it has returned - especially in remote settlements where healthcare is thin. We will launch a nationwide screening campaign, build new clinics, and train nurses to detect TB early. This is not just a medical fight. It is a fight for the lives of our children."
 GRL_sports_for_everyone: "Sports for Everyone"
 GRL_sports_for_everyone_desc: "Sports build strong bodies and strong communities. But in many villages, there are no gyms, no fields, and no equipment. We will fund local sports clubs, build multi-purpose arenas, and bring coaches to every settlement. Whether it is football, badminton, or traditional kayaking, every Greenlander should have the chance to play."
 GRL_psychological_help: "Psychological Help"
 GRL_psychological_help_desc: "The suicide rate in Greenland is among the highest in the world. Behind each number is a person - a son, a daughter, a father - who saw no way out. We will expand mental health services, train more psychologists, and break the silence around depression and trauma. Healing the mind is as important as healing the body."
 GRL_the_program_for_pensioners: "The Program for Pensioners"
 GRL_the_program_for_pensioners_desc: "Our elders built this country with their bare hands. They hunted on the ice, fished in the storms, and raised children in tiny wooden houses. Now it is our turn to care for them. A new pensioner support program will provide home visits, social activities, and financial assistance. No elder should die alone or in poverty."
 GRL_political_struggle: "Political Struggle"
 GRL_political_struggle_desc: "The path to self-rule is not smooth. There are factions, egos, and old grudges. Some want independence tomorrow. Others fear it will destroy the economy. The political struggle is real, and it is exhausting. But we must endure. Only by fighting our battles in the open can we find a way forward that all Greenlanders can accept."
 GRL_siumut_IA_coalition: "Siumut-IA Coalition"
 GRL_siumut_IA_coalition_desc: "Siumut and Inuit Ataqatigiit have been rivals for decades. But on the question of self-determination, they agree more than they disagree. A grand coalition between the two largest parties would send a powerful message to Copenhagen: Greenland is united in its demand for greater autonomy. Let the negotiations begin."
 GRL_jonathan_motzfeldt: "Jonathan Motzfeldt"
 GRL_jonathan_motzfeldt_desc: "Jonathan Motzfeldt led Greenland for most of the home rule era. He is a giant of our politics - but also a controversial one. His vision of a slow, pragmatic path to independence has its supporters and its critics. By rallying behind Motzfeldt, we choose experience over radicalism. The old fox still has teeth."
 GRL_the_white_paper_on_selfgovernment: "The White Paper on Self-Government"
 GRL_the_white_paper_on_selfgovernment_desc: "After years of debate, the government has published a white paper outlining a new self-government framework. It proposes transferring control over the police, the coast guard, and - most importantly - subsoil resources to Nuuk. This is not independence, but it is a giant step toward it. The white paper is our roadmap. Now we must fight for it."
 GRL_selfgovernment_commission: "Self-Government Commission"
 GRL_selfgovernment_commission_desc: "Words on paper mean nothing without implementation. A joint Danish-Greenlandic commission will negotiate the fine print of the self-government act. Our representatives must be sharp, patient, and unyielding. Every clause, every comma matters. The commission is where the future of our nation will be written - in ink, not in promises."
 GRL_pressure_through_the_UN: "Pressure Through the UN"
 GRL_pressure_through_the_UN_desc: "The world is watching. By taking our case to the United Nations, we remind Denmark and the international community that decolonization is not finished. Greenland is still on the UN list of non-self-governing territories. We will demand a hearing, present our case, and rally support from other small nations. The UN is a stage - and we will perform."
 GRL_the_referendum: "The Referendum"
 GRL_the_referendum_desc: "On a single day, every Greenlander over 18 will answer one question: 'Do you support the Self-Government Act?' The campaign will be fierce, the emotions raw. But when the votes are counted, there will be no turning back. This is democracy in its purest form - messy, loud, and glorious. Let the people speak."
 GRL_the_act_of_selfgovernment: "The Act of Self-Government"
 GRL_the_act_of_selfgovernment_desc: "The Act is signed. The Danish Queen has given her assent. Greenland is no longer a 'home rule' territory - we are a self-governing nation within the Kingdom of Denmark. We control our own police, our own courts, and our own underground resources. The road to full independence is still long, but today we take a giant leap. The flag rises over Nuuk. The future begins."
 GRL_companies: "Our Companies"
 GRL_companies_desc: "Greenland's economy has long depended on Danish subsidies and foreign fishing fleets. But we have our own entrepreneurs, our own innovators, and our own dreams. We will support Greenlandic companies - from tourism operators to mining startups to software developers. A nation that does not own its businesses does not own its future. Let us build an economy that works for us."

 #Ideas
 GRL_colony_legacy_idea: "The Colony's Legacy"
 GRL_colony_legacy_idea_desc: "Centuries of Danish rule left deep marks on Greenlandic society: economic dependency, cultural erasure, and intergenerational trauma. But also schools, hospitals, and a functioning administration. This ambiguous legacy shapes every political debate. Moving forward means acknowledging both the wounds and the foundations."
 GRL_cod_economy_idea: "The Cod Economy"
 GRL_cod_economy_idea_desc: "Cod fishing was once the lifeblood of Greenland. After a collapse in the 1990s, stocks are slowly recovering. Our renewed cod industry is built on sustainable quotas, modern vessels, and value-added processing. It provides jobs in coastal communities and export revenue to reduce dependence on Danish block grants."
 GRL_welfare_state_idea: "The Welfare State"
 GRL_welfare_state_idea_desc: "Greenlandic society is built on the principle that no one should be left behind. Free healthcare, education, and social services are funded by a combination of Danish subsidies and local taxes. The welfare state is expensive - but it is also what makes Greenland a decent place to live, even in the harshest climate."
 GRL_no_army_idea: "A State Without an Army"
 GRL_no_army_idea_desc: "Greenland has no standing army, no air force, no navy. Defense is handled by Denmark, which maintains a few patrol vessels and aircraft in the region. Some see this as a loss of sovereignty. Others argue that the money saved on defense can be spent on housing, healthcare, and education. In the Arctic, the greatest threats are ice and poverty - not foreign invaders."

 #Events
 Greenland.1.t: "Greenlandic Independence Referendum"
 Greenland.1.d: "After decades of home rule and growing national consciousness, the Greenlandic government has announced a historic referendum on full independence from Denmark. The question put to vote is simple: should Greenland break centuries-old union with Copenhagen and become a sovereign state? The campaign has divided society: independence supporters see a chance to control Arctic resources and assert Inuit self-determination, while opponents fear the loss of Danish subsidies, which make up a significant portion of Nuuk's economy."
 Greenland.1.a: "The time has come to rule ourselves! Declare independence"
 Greenland.2.t: "Greenland Holds Independence Referendum"
 Greenland.2.d: "The Greenlandic government has officially notified Copenhagen of an independence referendum. The Prime Minister of Greenland asserts the people's right to self-determination. For Denmark, this is an existential challenge: loss of territory, Arctic sovereignty, and international prestige. We need to state our position before the results are known."
 Greenland.2.a: "Respect the right to self-determination. Denmark will not interfere"
 Greenland.3.t: "Greenlandic Self-Rule Commission"
 Greenland.3.d: "In response to growing demands for expanded powers, a joint Danish-Greenlandic Self-Rule Commission has been formed. The commission will consider transferring control over the judiciary, police, coast guard, and most importantly, Arctic natural resources from Copenhagen. The outcome of these negotiations will determine the future of 'home rule' and its transformation into full self-government."
 Greenland.3.a: "Full Control Over Subsoil Resources and Minerals"
 Greenland.4.t: "Greenland Proclaims Independence"
 Greenland.4.d: "On this historic day, thousands gathered in the square before parliament in Nuuk. The Prime Minister of Greenland read the Declaration of Independence, proclaiming the creation of a sovereign state - the Republic of Greenland. A new flag was raised over the parliament building. The Danish Queen, in her address, expressed 'regret and concern' but recognized the Greenlandic people's right to self-determination. International recognition comes slowly, but the first embassies are already opening in Nuuk."
 Greenland.4.a: "Hail the new republic!"
 Greenland.5.t: "Coalition Talks Between Siumut and Inuit Ataqatigiit"
 Greenland.5.d: "Following the recent elections, Greenland's two historically dominant parties - the social-democratic Siumut (Forward) and the left-wing Inuit Ataqatigiit (Community of the People) - have entered into negotiations to form a coalition government. Despite their shared commitment to Greenlandic self-determination, the two parties have long-standing differences: Siumut has traditionally been more pragmatic and open to large-scale resource extraction projects, including mining uranium and rare earth elements at Kuannersuit (Kvanefjeld), while IA has taken a firm stance against such projects due to environmental concerns. The outcome of these negotiations will shape Greenland's economic future and its path toward independence from Denmark. Analysts note that while both parties support eventual sovereignty, they disagree on the timeline and the means to achieve it, particularly regarding foreign investment and relations with Copenhagen."
 Greenland.5.a: "Form a Unity Government Focused on Independence First"
 #News Events
 Greenland_news.1.t: "Greenland Addresses the United Nations"
 Greenland_news.1.d: "A Greenlandic delegation has addressed the UN General Assembly with a historic speech, calling on the international community to recognize the Greenlandic people's right to self-determination. Nuuk's representatives appeal to UN Charter principles and decolonization precedents. World reaction is mixed: Arctic Council countries remain cautious, while some post-colonial states in Africa and Asia express active support."
 Greenland_news.1.a: "Ok"
 Greenland_news.2.t: "Greenland Proclaims Independence"
 Greenland_news.2.d: "The world wakes to historic news from the Arctic: Greenland has officially declared its independence from Denmark. After decades of increased autonomy and following a contentious referendum, the new Republic of Greenland has emerged as the world's newest nation. With a population of just over 56,000, the country now faces the monumental task of building state institutions from scratch while managing its vast but largely untapped natural resources. The international community watches closely as Copenhagen formally acknowledges the separation, marking the end of a union that lasted over 600 years. For Denmark, it is a moment of national reflection; for Greenland, it is the dawn of a new era. Observers note that the strategic importance of the Arctic means the great powers will likely race to establish diplomatic presence in Nuuk, eyeing the island's strategic position and potential resource wealth."
 Greenland_news.2.a: "Ok"