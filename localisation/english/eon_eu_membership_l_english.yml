 eon_eu_ep_abstain_withdrawal:0 "EP delegation: abstain on agreement with [From.GetName]"
 eon_eu_ep_abstain_withdrawal_desc:0 "Remove our national delegation votes for and against this agreement. Our seats remain represented, but abstentions do not enter the majority of votes cast."
 eon_eu_ep_reject_own_withdrawal:0 "Our EP delegation: vote against our withdrawal agreement"
 eon_eu_ep_reject_own_withdrawal_desc:0 "Our delegation can vote against the agreement until departure. This replaces its previous support; our government is still excluded from the Council vote on its own withdrawal."
 eon_eu_ep_abstain_own_withdrawal:0 "Our EP delegation: abstain on our withdrawal agreement"
 eon_eu_ep_abstain_own_withdrawal_desc:0 "Withdraw our national delegation votes for and against. Abstentions are excluded from the EP majority; our government does not vote in the Council on its own withdrawal."
 eon_eu_ep_abstain_withdrawal_requirements:0 "Remove our national delegation votes for and against this agreement. Our seats remain represented, but abstentions do not enter the majority of votes cast."
 eon_eu_ep_reject_own_withdrawal_requirements:0 "Our delegation can vote against the agreement until departure. This replaces its previous support; our government is still excluded from the Council vote on its own withdrawal."
 eon_eu_ep_abstain_own_withdrawal_requirements:0 "Withdraw our national delegation votes for and against. Abstentions are excluded from the EP majority; our government does not vote in the Council on its own withdrawal."
 eon_eu_membership.9.t:0 "New application for EU membership"
 eon_eu_membership.9.d:0 "[From.GetName] has submitted an application. Open Decisions → EU membership and treaties and find the current application from this country. Each active member government can endorse or reject it; candidacy requires unanimous support. This notification does not cast a vote. If the application has changed, only currently available decisions apply."
 eon_eu_membership.10.t:0 "EU accession treaty submitted for ratification"
 eon_eu_membership.10.d:0 "[From.GetName] has submitted its accession treaty. Open Decisions → EU membership and treaties. Government ratification and the national European Parliament delegation ballot are separate decisions about the current treaty. Accession requires every active member government, more than half of all active EP seats, and the applicant’s final ratification. This notification does not grant consent; use the current decisions."
 eon_eu_membership.11.t:0 "EU withdrawal agreement proposed"
 eon_eu_membership.11.d:0 "[From.GetName] has proposed a negotiated withdrawal agreement. Open Decisions → EU membership and treaties. Eligible remaining governments can vote in the Council, and EP delegations vote separately for, against or abstain. Council approval needs at least 72% of eligible remaining states and 65% of their population; EP consent needs more votes for than against. Final acceptance by the withdrawing country is still required. This notification does not cast a vote or end membership; use the current decisions."

 eon_eu_domestic_application_tt:0 "Domestic preparation or a referendum opens the actual application process. Candidacy needs every current member government; membership additionally needs treaty ratification, EP consent and our final ratification. War does not automatically forbid an application. Follow Decisions → EU membership and treaties."
 eon_eu_legacy_withdrawal_proposal_tt:0 "Submit a real withdrawal agreement proposal. Remaining governments must approve it in the Council, the European Parliament must consent, and our country must give final acceptance. Membership continues until the agreement takes effect or the actual Article 50 deadline expires."
 eon_eu_union_access_help:0 "This panel is for EU members and candidates.\nMembership is not required to apply. Open Decisions: EU membership and treaties -> Submit an application to the EU. The membership national spirit is granted after accession is completed."
