 eon_eu_reject_application:0 "Reject the application of [From.GetName]"
 eon_eu_submit_accession_treaty:0 "Submit the negotiated accession treaty"
 eon_eu_member_ratify_accession:0 "Ratify accession of [From.GetName]"
 eon_eu_ep_support_accession:0 "EP delegation: support accession of [From.GetName]"
 eon_eu_ep_reject_accession:0 "EP delegation: withdraw support for [From.GetName]"
 eon_eu_final_ratify_accession:0 "Ratify our accession to the EU"
 eon_eu_cancel_application:0 "Withdraw our pending application or draft"
 eon_eu_notify_withdrawal:0 "Notify the EU of our withdrawal (Article 50)"
 eon_eu_revoke_withdrawal:0 "Revoke the withdrawal notification"
 eon_eu_propose_withdrawal_treaty:0 "Submit a negotiated withdrawal agreement"
 eon_eu_member_approve_withdrawal:0 "Council: support withdrawal agreement with [From.GetName]"
 eon_eu_ep_support_withdrawal:0 "EP delegation: support agreement with [From.GetName]"
 eon_eu_ep_reject_withdrawal:0 "EP delegation: vote against agreement with [From.GetName]"
 eon_eu_finalize_withdrawal:0 "Give final consent and leave under the agreement"
 eon_eu_ep_support_own_withdrawal:0 "Our EP delegation: support our withdrawal agreement"
 eon_eu_refound_offer:0 "Propose restoring European institutions with [From.GetName]"
 eon_eu_refound_accept:0 "Accept the founding treaty with [From.GetName]"
 eon_eu_refound_refuse:0 "Decline the founding treaty with [From.GetName]"
 eon_eu_stage_member:0 "Active member: government and parliamentary representation"
 eon_eu_stage_dormant:0 "European institutions are suspended: a consenting founding pair is required"
 eon_eu_stage_application:0 "Application: awaiting unanimous approval of the member governments"
 eon_eu_stage_candidate:0 "Candidate: reforms and at least 180 days of negotiations"
 eon_eu_stage_treaty:0 "Accession treaty: awaiting government ratifications and EP consent"
 eon_eu_stage_final:0 "Accession treaty: our final ratification is required"
 eon_eu_stage_nonmember:0 "Nonmember: no Council vote, member office or EU subsidy entitlement"
 eon_eu_membership.ok:0 "Understood"
 eon_eu_membership_category_desc:0 "Status: [EonEUMembershipStage]\nActive member governments: [?global.EU_member_count|0]\nGovernment approvals of our current accession draft: [?eon_eu_accession_yes_display|0]\nEP accession support: [?eon_eu_treaty_accession_ep_yes_display|0] / [?eon_eu_treaty_ep_total_display|0] seats\nEP withdrawal votes: [?eon_eu_treaty_withdrawal_ep_yes_display|0] for, [?eon_eu_treaty_withdrawal_ep_no_display|0] against (abstentions excluded)\nCandidate status is not membership. National ratification and EP delegation votes are separate. Requests expire after 365 days; an unsuccessful draft has a 90-day cooldown. Numerical reform and negotiation thresholds are game calibration.\nWithdrawal agreement Council support: [?eon_eu_exit_yes_display|0] / [?eon_eu_exit_total_display|0] governments, representing [?eon_eu_exit_pop_ratio_display|%1] of the remaining population."
 eon_eu_membership_status_desc:0 "Status: [EonEUMembershipStage]\nActive member governments: [?global.EU_member_count|0]\nGovernment approvals of our current accession draft: [?eon_eu_accession_yes_display|0]\nEP accession support: [?eon_eu_treaty_accession_ep_yes_display|0] / [?eon_eu_treaty_ep_total_display|0] seats\nEP withdrawal votes: [?eon_eu_treaty_withdrawal_ep_yes_display|0] for, [?eon_eu_treaty_withdrawal_ep_no_display|0] against (abstentions excluded)\nCandidate status is not membership. National ratification and EP delegation votes are separate. Requests expire after 365 days; an unsuccessful draft has a 90-day cooldown. Numerical reform and negotiation thresholds are game calibration.\nWithdrawal agreement Council support: [?eon_eu_exit_yes_display|0] / [?eon_eu_exit_total_display|0] governments, representing [?eon_eu_exit_pop_ratio_display|%1] of the remaining population."
 eon_eu_apply_desc:0 "A sovereign European country can apply with elections, fewer than 3 breach points and euroscepticism below 50%. These are visible game proxies for democratic, institutional and domestic consent conditions. All current member governments must endorse candidature; this does not grant membership."
 eon_eu_endorse_application_desc:0 "Our government supports granting candidate status. Every current member government must agree. This response does not cast an EP delegation vote or automatically admit the applicant."
 eon_eu_reject_application_desc:0 "Close this pending application or treaty. Candidate status already granted is preserved. A new submission becomes possible after 90 days; approvals from the failed draft do not carry over."
 eon_eu_submit_accession_treaty_desc:0 "After at least 180 days of negotiations and the required reforms, submit the treaty for unanimous government ratification and a separate European Parliament vote. The applicant must then ratify the agreed treaty."
 eon_eu_member_ratify_accession_desc:0 "Our government ratifies the current treaty. It takes effect only after every live member government, the European Parliament and the applicant give their separate consent."
 eon_eu_ep_support_accession_desc:0 "For this treaty, our elected national delegation casts its existing MEP seats as one bloc. This is a transparent game abstraction of parliamentary consent, separate from our government ratification. More than half of all active seats must support accession."
 eon_eu_ep_reject_accession_desc:0 "Withdraw the current national delegation ballot. Parliament consent is recounted; government ratification is a separate decision."
 eon_eu_final_ratify_accession_desc:0 "Make membership effective after current unanimous member ratifications, EP consent and our final ratification. Candidate privileges are replaced by real member rights, contributions and representation."
 eon_eu_cancel_application_desc:0 "Cancel the pending application or treaty. Existing candidate status remains, and the rejected draft cannot reuse old approvals. Reapplication has a 90-day cooldown."
 eon_eu_notify_withdrawal_desc:0 "Start the two-year Article 50 period. Membership and ordinary rights continue until effective departure. Our government does not participate in Council decisions about our own withdrawal agreement."
 eon_eu_revoke_withdrawal_desc:0 "Unilaterally and unconditionally withdraw the notice before effective departure. Membership continues unchanged; a new notice is unavailable for 180 days. No other member approval is required."
 eon_eu_propose_withdrawal_treaty_desc:0 "Request an earlier agreed departure. The remaining Council needs at least 72% of its states and 65% of their population, plus separate EP consent and our final acceptance. Submitting a draft alone does not end membership or shorten the deadline."
 eon_eu_member_approve_withdrawal_desc:0 "Cast our government vote on the current agreement. The withdrawing state is excluded from this Council electorate. Parliament votes separately."
 eon_eu_ep_support_withdrawal_desc:0 "Our national EP delegation votes its existing seats as one block, separately from the government. More votes for than against are required; abstentions do not count as votes cast. MEP representation continues until effective departure."
 eon_eu_ep_reject_withdrawal_desc:0 "Vote against the current agreement using our national delegation seats. This replaces our previous support. EP consent requires more votes for than against; abstentions are excluded."
 eon_eu_finalize_withdrawal_desc:0 "Give our final consent to a currently approved agreement. Departure removes EU voting, offices, candidate status, member subsidies and member tabs. An independent post-exit trade arrangement does not give member rights."
 eon_eu_ep_support_own_withdrawal_desc:0 "While membership remains effective, our existing EP delegation can vote on parliamentary consent. Our government still cannot vote on its own withdrawal in the Council."
 eon_eu_refound_offer_desc:0 "With no active member representation, propose a new founding treaty to another sovereign European country. Both must consent; the offer lasts 60 days. This is a game mechanism for institutional restoration, not a claim that territorial conquest automatically dissolves real EU treaty obligations."
 eon_eu_refound_accept_desc:0 "Accept the exact live founding offer. Only the two consenting founders become members; former participants must use the normal accession process. Institutional offices, ballots and member budgets are rebuilt."
 eon_eu_refound_refuse_desc:0 "Reject the exact pending founding offer. No membership, payment or voting right is created."
 eon_eu_membership.1.t:0 "EU candidate status approved"
 eon_eu_membership.1.d:0 "All current member governments endorsed our candidature. We are not yet a member. Reforms and at least 180 days of negotiations precede a treaty requiring unanimous member ratification, EP consent and our final ratification."
 eon_eu_membership.2.t:0 "EU accession is effective"
 eon_eu_membership.2.d:0 "The consent and ratification process is complete. Membership now carries representation, access, contributions and eligibility for member support."
 eon_eu_membership.3.t:0 "The current EU draft is closed"
 eon_eu_membership.3.d:0 "The application or treaty was rejected, expired or lost its eligibility. Old approvals were cleared. Existing candidate status is preserved; a new submission can be made after the 90-day cooldown."
 eon_eu_membership.4.t:0 "The accession treaty awaits our ratification"
 eon_eu_membership.4.d:0 "Current member ratifications and European Parliament consent are in place. The applicant still has to give its own final ratification. A changed membership electorate or withdrawn consent is rechecked before entry."
 eon_eu_membership.5.t:0 "Article 50 notification submitted"
 eon_eu_membership.5.d:0 "A 730-day withdrawal period has begun. Ordinary membership remains effective until departure. Earlier departure needs an agreed treaty, approval of the remaining Council, EP consent and our final acceptance. We may unconditionally revoke the notice before departure."
 eon_eu_membership.6.t:0 "A European founding offer has arrived"
 eon_eu_membership.6.d:0 "Another sovereign European country proposed restoring common institutions. Respond to the exact offer in EU membership decisions within 60 days. This notice itself grants no membership or right."
 eon_eu_membership.7.t:0 "European institutions restored by treaty"
 eon_eu_membership.7.d:0 "Both sovereign founders ratified the founding agreement. Only these two countries become members; old participants can apply through the normal accession process. This represents institutional restoration within the game."
 eon_eu_membership.8.t:0 "Our EU membership and treaty status"
 eon_eu_membership.8.d:0 "Status: [EonEUMembershipStage]\nActive member governments: [?global.EU_member_count|0]\nGovernment approvals of our current accession draft: [?eon_eu_accession_yes_display|0]\nEP accession support: [?eon_eu_treaty_accession_ep_yes_display|0] / [?eon_eu_treaty_ep_total_display|0] seats\nEP withdrawal votes: [?eon_eu_treaty_withdrawal_ep_yes_display|0] for, [?eon_eu_treaty_withdrawal_ep_no_display|0] against (abstentions excluded)\nCandidate status is not membership. National ratification and EP delegation votes are separate. Requests expire after 365 days; an unsuccessful draft has a 90-day cooldown. Numerical reform and negotiation thresholds are game calibration.\nWithdrawal agreement Council support: [?eon_eu_exit_yes_display|0] / [?eon_eu_exit_total_display|0] governments, representing [?eon_eu_exit_pop_ratio_display|%1] of the remaining population."
 eon_eu_membership_status_requirements:0 "Status: [EonEUMembershipStage]\nActive member governments: [?global.EU_member_count|0]\nGovernment approvals of our current accession draft: [?eon_eu_accession_yes_display|0]\nEP accession support: [?eon_eu_treaty_accession_ep_yes_display|0] / [?eon_eu_treaty_ep_total_display|0] seats\nEP withdrawal votes: [?eon_eu_treaty_withdrawal_ep_yes_display|0] for, [?eon_eu_treaty_withdrawal_ep_no_display|0] against (abstentions excluded)\nCandidate status is not membership. National ratification and EP delegation votes are separate. Requests expire after 365 days; an unsuccessful draft has a 90-day cooldown. Numerical reform and negotiation thresholds are game calibration."
