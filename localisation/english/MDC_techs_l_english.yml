l_english:
 rubber_production: "Initial Synthetic Rubber Production"
 rubber_production_desc: "A basic unit for isolating the butane-butylene fraction and producing the most common rubber - butadiene-styrene rubber (SBR). The process is energy-intensive, with unstable yield and high pollution levels. The resulting rubber is of standard quality for mass-market tires."
 rubber_production2: "Catalytic Polymerization"
 rubber_production2_desc: "The introduction of more efficient zeolite catalysts increases the yield of isooctene, a key component for producing isoprene rubber (IR). The rubber becomes more elastic and wear-resistant, which is important for improved automotive tires."
 rubber_production3: "Comprehensive Raw Material Processing"
 rubber_production3_desc: "Modernization of the technological chain for deep processing of heavy feedstock with the extraction of a wide fraction of light olefins. Enables flexible production of raw materials for various types of synthetic rubbers."
 rubber_production4: "Highly Selective Catalysts"
 rubber_production4_desc: "Application of next-generation catalysts for precise control of polymer chain structure. Allows for the creation of rubbers with specified properties, such as low rolling resistance rubber for energy-efficient tires."
 rubber_production5: "Bio-Isoprene from Renewable Feedstock"
 rubber_production5_desc: "Establishment of monomer (isoprene) production from biomass using fermentation methods. Reduces dependence on petrochemical feedstock in synthetic rubber manufacturing."
 rubber_production6: "Nano-Modified Rubbers"
 rubber_production6_desc: "Full automation and AI-controlled real-time polymerization for perfect quality. The introduction of nanoparticles (silica, graphene) into the polymer matrix creates ultra-strong, heat-resistant rubber for aviation, robotics, and "smart" tires."
 futuristic_rubber_production: "Futuristic Rubber Production"
 futuristic_rubber_production_desc: "Use of genetically modified microorganisms for direct biosynthesis of rubber, along with closed-loop chemical recycling systems for rubber products. The technology enables waste-free, customizable production of high-quality elastomers."
 CAT_rubber: "Rubber Production"

