l_english:
 eon_investment_lifecycle.ack:0 "OK"
 eon_investment_lifecycle.1.t:0 "Construction agreement started"
 eon_investment_lifecycle.1.d:0 "A construction project has begun under its original agreed terms. The investor principal and the recipient contribution are recorded as construction advances. Only verified completed buildings enter the investor's operating portfolio and earn investment income."
 eon_investment_lifecycle.2.t:0 "Construction suspended"
 eon_investment_lifecycle.2.d:0 "A project is suspended because its original recipient no longer owns and controls the state, war prevents performance, foreign investment is disabled, or a building slot is unavailable. Remaining funds and days are preserved. Performance resumes when the original conditions return. The investor can cancel through the existing state investment window."
 eon_investment_lifecycle.3.t:0 "Construction resumed"
 eon_investment_lifecycle.3.d:0 "The original recipient again owns and controls the state and the performance conditions are restored. This project resumes with its remaining construction time and recorded funds."
 eon_investment_lifecycle.4.t:0 "Construction completed"
 eon_investment_lifecycle.4.d:0 "All buildings of this project were verified as constructed. Their investor principal now forms an operating investment asset. No unfinished advance remains to be refunded."
 eon_investment_lifecycle.5.t:0 "Construction agreement ended"
 eon_investment_lifecycle.5.d:0 "A project has ended. Its unused investor principal and the actual original cofinancer's unused contribution are refunded once. Completed assets remain in the operating portfolio. A vanished original payer keeps a recorded refund claim; an unrelated controller receives no refund."
 eon_investment_lifecycle.6.t:0 "Construction could not be verified"
 eon_investment_lifecycle.6.d:0 "The native construction command did not increase the building level. No money was consumed and no operating asset or success result was recorded. The project retains its funds and retries after seven days if its original performance conditions hold."
 eon_investment_lifecycle.7.t:0 "Construction funds lost to corruption"
 eon_investment_lifecycle.7.d:0 "One financed building unit was not constructed because of the existing corruption risk. This unit's investor principal and matching cofinancing were recorded as spent and lost. They do not earn investment income and cannot be refunded. Remaining units continue under the original contract."
 eon_investment_lifecycle.8.t:0 "Construction ended with losses"
 eon_investment_lifecycle.8.d:0 "The project has exhausted its agreed building units, but corruption prevented some or all construction. Only buildings actually verified as completed enter the operating investment portfolio. Lost funding is recorded separately; this is not full successful completion."
 eon_investment_lifecycle.9.t:0 "Construction proposal no longer executable"
 eon_investment_lifecycle.9.d:0 "The original proposal could not create a valid project at execution. No funds were debited, no operating asset was granted, and no construction project started. Check the original parties, ownership and control, available funds, investment rules and building slots before negotiating again."
