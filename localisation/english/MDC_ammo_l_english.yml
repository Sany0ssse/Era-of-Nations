 Ammo_desc_tt: "[Ammo_sl_desc_bypass_tt]"
 Ammo_desc_raw_tt: "§YAmmunition§! is produced by your country's $arms_factory_plural$.  Each §Yundamaged $arms_factory_plural$§! contributes §G100§! to the production of §Yammunition§!.\n\nEach country has a maximum capacity for §YAmmunition§! which can be increased by building §Y$supply_node$§! in the states it owns or controls. Each §Y$supply_node$§! increases the maximum ammunition limit by §G100000§!\n\n§YAmmunition§! is used by the army when in combat. Attacking will consume extra §YAmmunition§!.\n\nDuring times of war, §YAmmunition§! is also consumed by deployed air wings and naval units that are not docked.\n\n"

