l_english:
 eon_debt_default_legacy_notice_title:0 "Legacy collection notice cancelled"
 eon_debt_default_legacy_notice_desc:0 "This notice was issued by the retired collection system. It is cancelled and creates no payment or new obligation. Any current unpaid default balance remains available for repayment."
 eon_debt_default_legacy_notice_tt:0 "The old collection notice is cancelled. Current debt and treasury funds remain unchanged."
 eon_debt_default_asset_liquidation_tt:0 "After 5 days, liquidate one eligible asset level for a fixed game value of §Y$10 billion§!. Repay only the remaining default obligation; credit the entire excess to the treasury. A settled obligation, missing asset or insufficient treasury capacity cancels the disposal."
 eon_debt_default_asset_available_tt:0 "Requires a positive active or overdue default obligation, an owned and controlled asset, enough treasury capacity for the full excess, and no other queued asset disposal."
