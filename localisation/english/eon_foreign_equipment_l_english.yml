l_english:
 eon_foreign_equipment_offer_available_tt:0 "At least one full equipment packet is available for this eligible partner. Only packets available in your stockpile will be included. An unanswered expired offer permanently closes equipment offers to that partner; an unidentifiable old proposal closes this equipment-offer channel."
 eon_foreign_equipment_offer_tt:0 "Offer the complete equipment packets currently available from our stockpile. The recipient will see the exact list and has §Y30 days§! to respond. No equipment is sent before their consent and a final check. The listed quantities remain fixed; if any selected packet is no longer fully available, the whole proposal closes without dispatch. Only one equipment offer can await a reply at a time."
 eon_foreign_equipment.1.t:0 "An offer of military equipment"
 eon_foreign_equipment.1.d:0 "[FROM.GetName] offers us military equipment to support our defence. Hover over the accept or decline button to review the exact list. We may accept or decline within 30 days. Acceptance authorizes dispatch if both countries still qualify and every listed packet remains available in full. The provider also receives the existing influence benefit of military support. The stock is not reserved while we consider the offer; dispatch and arrival are distinct stages."
 eon_foreign_equipment.1.a:0 "Accept the listed equipment"
 eon_foreign_equipment.1.b:0 "Decline or close the offer"
 eon_foreign_equipment_manifest_header_tt:0 "§YProposed equipment:§!"
 eon_foreign_equipment_accept_tt:0 "Authorize dispatch of exactly the listed packets. Both countries' eligibility and the provider's full stocks are checked again before dispatch. If any listed packet is unavailable, the proposal closes without sending a smaller package. After consent, the proposal can no longer be withdrawn or declined."
 eon_foreign_equipment_decline_tt:0 "Close this offer without sending equipment or creating a new obligation."
 eon_foreign_equipment_unmatched_tt:0 "This proposal is already answered or no longer open. Acknowledging this message cannot order another dispatch."
 eon_foreign_equipment_withdraw_offer:0 "Withdraw equipment support offer"
 eon_foreign_equipment_withdraw_offer_desc:0 "Withdraw the outstanding equipment offer to this partner before they consent. No equipment has been sent under this proposal."
 eon_foreign_equipment_withdraw_offer_send_desc:0 "Withdraw this equipment offer? There is no fee or equipment transfer. Another proposal remains unavailable until the partner closes the withdrawn offer or its reply period ends. If it expires unanswered, future equipment offers to this partner are permanently unavailable."
 eon_foreign_equipment.3.t:0 "Equipment offer withdrawn"
 eon_foreign_equipment.3.d:0 "The provider withdrew the proposal before our consent. No equipment was sent under this proposal. We can close the original proposal when it appears."
 eon_foreign_equipment.4.t:0 "Equipment proposal expired"
 eon_foreign_equipment.4.d:0 "The proposal expired or could no longer be completed with its partner and agreed equipment list. No dispatch was ordered. Further equipment offers to this partner are permanently unavailable. Offers to other eligible countries remain available."
 eon_foreign_equipment.5.t:0 "Equipment offers unavailable"
 eon_foreign_equipment.5.d:0 "An incomplete equipment proposal could not be matched safely to its partner and agreed list. No dispatch was ordered. This country's equipment-offer channel cannot be reopened; other diplomatic actions remain available."
 eon_foreign_equipment.6.t:0 "Equipment offer closed"
 eon_foreign_equipment.6.d:0 "The equipment proposal was declined, withdrawn, or no longer met the conditions for dispatch. No equipment was sent under this proposal."
 eon_foreign_equipment.7.t:0 "Equipment dispatch ordered"
 eon_foreign_equipment.7.d:0 "The recipient consented and the final conditions were met. Dispatch of the agreed equipment packets has been ordered. This notice confirms the dispatch order, not arrival at the destination. The provider receives the existing influence benefit of military support."
 eon_foreign_equipment.ack:0 "Understood"

 eon_foreign_equipment_manifest_apc_tt:0 "§Y250§! armored personnel carriers"
 eon_foreign_equipment_manifest_ifv_tt:0 "§Y250§! infantry fighting vehicles"
 eon_foreign_equipment_manifest_utility_tt:0 "§Y250§! utility vehicles"
