 #Monarchists Events
 hungary_monarch.1.t: "Referendum on the Monarchy"
 hungary_monarch.1.d: "After the House of Habsburg returned to power in Hungary, the people began to ask, \"Is this fair?\" Our government decided to accommodate the people and hold a national referendum to determine the precise extent of the powers granted to the Hungarian Crown. Would the Habsburgs once again rule absolutely, or would the Crown's power be limited by a democratic parliament and cabinet?"
 hungary_monarch.1.a: "All power to the crown!"
 hungary_monarch.1.b: "The king's power must be limited"
 hungary_monarch.2.t: "Ambition to return the Habsburg Empire"
 hungary_monarch.2.d: "Many years have passed since the fall of the Habsburg Empire. The conquests of Napoleon, Bismarck, and then the First World War destroyed the mighty empire built by the Habsburg dynasty. Having regained power, we must devote all our efforts to restoring the former glory, strength, and borders of the Habsburg Empire!"
 hungary_monarch.2.a: "The Empire will live!"
 hungary_monarch.3.t: "The ambitions of the Habsburgs"
 hungary_monarch.3.d: "The Habsburg dynasty, having returned to power in Hungary, has declared alarming ambitions. The Habsburgs desire to restore the once-great Habsburg Empire, this time centered in Budapest. Their statements call into question the territorial integrity of Serbia, Romania, Ukraine, and Italy, as well as the sovereignty of Austria, the Czech Republic, Slovakia, Slovenia, and Croatia. If Hungary achieves its ambitions, it will significantly shift the balance of power in Europe and violate the promise made to the Entente a century ago that the Habsburgs would no longer attempt to revive their empire."
 hungary_monarch.3.a: "We will follow the events"
 hungary_monarch.4.t: "Hungary demands Transylvania"
 hungary_monarch.4.d: "Today, Hungarian Crown diplomats have approached us with a demand to return Transylvania to Hungarian control. They claim they have every right to these lands and will return them even if military intervention is required. These demands can be considered an ultimatum."
 hungary_monarch.4.a: "It's better than getting involved in a war"
 hungary_monarch.4.b: "We will defend our territorial integrity!"
 hungary_monarch.5.t: "[FROM.GetName] is giving in"
 hungary_monarch.5.d: "[FROM.GetName] concedes to our demands. We received all the territories we claimed, while [FROM.GetName] was able to avoid war and save the lives of its soldiers."
 hungary_monarch.5.a: "Very Nice!"
 hungary_monarch.6.t: "[FROM.GetName] Refuse"
 hungary_monarch.6.d: "[FROM.GetName] refuses our demands, declaring that they are ready to face bullets for their lands. It's bold and naive of them, but nonetheless worthy of respect."
 hungary_monarch.6.a: "God knows we wanted to do this peacefully."
 hungary_monarch.7.t: "Transcarpathia for the union"
 hungary_monarch.7.d: "Hungarian diplomats have approached our embassy with an ultimatum. They demand the territory of Transcarpathia, in exchange for which they propose concluding a comprehensive alliance with us."
 hungary_monarch.7.a: "This is the price for union"
 hungary_monarch.7.b: "What nonsense?"
 hungary_monarch.8.t: "[FROM.GetName] Agreed"
 hungary_monarch.8.d: "[FROM.GetName] agreed to give us Transcarpathia. In exchange, we concluded a series of agreements with them, which could be called a glorious Union."
 hungary_monarch.8.a: "They acted wisely!"
 hungary_monarch.9.t: "[FROM.GetName] Refused"
 hungary_monarch.9.d: "[FROM.GetName] is rejecting our demands. Apparently, our kindness seemed too small for them to return our lands. However, we can always do this by force."
 hungary_monarch.9.a: "God knows we wanted to do this peacefully"
 hungary_monarch.10.t: "Hungary Demands our Annexation"
 hungary_monarch.10.d: "Hungarian diplomats hastily left our country and closed the embassy, leaving only a message with an ultimatum. The Hungarian government demands our annexation, otherwise they will regard our response as a declaration of war. What should we do?"
 hungary_monarch.10.a: "We will submit to the Hungarian Crown"
 hungary_monarch.10.b: "We will fight for our lands!"
 hungary_monarch.11.t: "[FROM.GetName] is giving in"
 hungary_monarch.11.d: "[FROM.GetName] concedes to our demands. We received all the territories we claimed, while [FROM.GetName] was able to avoid war and save the lives of its soldiers."
 hungary_monarch.11.a: "Very Nice!"
 hungary_monarch.12.t: "[FROM.GetName] Refuse"
 hungary_monarch.12.d: "[FROM.GetName] refuses our demands, declaring that they are ready to face bullets for their lands. It's bold and naive of them, but nonetheless worthy of respect."
 hungary_monarch.12.a: "God knows we wanted to do this peacefully."
 hungary_monarch.13.t: "Hungary offers guarantees for our territories"
 hungary_monarch.13.d: "The Hungarian Crown has sent us an offer: they are offering guarantees of our independence and an alliance for our northern lands in the Banat region. If we refuse, it will immediately lead to war; if we accept, we will lose our developed territories, but will receive guarantees from the potential new power."
 hungary_monarch.13.a: "If this is the price of peace, we will pay it"
 hungary_monarch.13.b: "We will not give up our lands!"
 hungary_monarch.15.t: "[FROM.GetName] Agreed"
 hungary_monarch.15.d: "[FROM.GetName] agreed to give us Banat. In exchange, we concluded a series of agreements with them, which could be called a glorious Union."
 hungary_monarch.15.a: "They acted wisely!"
 hungary_monarch.14.t: "[FROM.GetName] Refuse"
 hungary_monarch.14.d: "[FROM.GetName] is rejecting our demands. Apparently, our kindness seemed too small for them to return our lands. However, we can always do this by force."
 hungary_monarch.14.a: "God knows we wanted to do this peacefully"
 hungary_monarch.16.t: "Austria-Hungary has spread its wings again"
 hungary_monarch.16.d: "Despite the Entente's ban on the Habsburgs' right to claim European crowns, Hungary chose a monarch from the House of Habsburg-Lorraine.\nThe aggressive foreign policy of the Hungarian Crown allowed it to quickly acquire the territories claimed by [HUN.GetLeader] and officially proclaim the restoration of the Austro-Hungarian Empire."
 hungary_monarch.16.a: "What does this mean for Europe?"
 hungary_monarch.17.t: "The Choice of the Monarch"
 hungary_monarch.17.d: "To restore the former order and greatness of our country, we must make the right choice in favor of a new monarch to lead our country. This person could be the current head of the Habsburg dynasty, Otto von Habsburg, or one of his sons: Karl, the crown prince of the dynasty, or Georg, an honorary citizen of our state."
 hungary_monarch.17.a: "We will choose Otto von Habsburg"
 hungary_monarch.17.b: "We will choose Karl Habsburg-Lothringen"
 hungary_monarch.17.c: "We will choose Georg von Habsburg"
 hungary_monarch.18.t: "The question of LGBT rights"
 hungary_monarch.18.d: "The Crown's duty is to preserve Hungary for future generations as history has created it: strong, united, and true to its roots. The private lives of subjects are their own responsibility, but public approval or promotion of a lifestyle contrary to the principles of Christian morality and family law cannot be permitted."
 hungary_monarch.18.a: "Ban LGBT rights"
 hungary_monarch.18.b: "Allow LGBT rights"
 hungary_monarch.19.t: "Hungary demands Galicia"
 hungary_monarch.19.d: "Relatively little time has passed since the Habsburgs ascended the Hungarian throne and announced their imperial ambitions to the world. And now, Habsburg imperialism has knocked on our door. Their demands include the cession of our territory, formerly part of the dual monarchy as Galicia. Refusal will inevitably lead to a military confrontation with Austria-Hungary. What should we do?"
 hungary_monarch.19.a: "Submit to their demands"
 hungary_monarch.19.b: "If they want war they will get it"
 hungary_monarch.20.t: "[FROM.GetName] obeys our demands"
 hungary_monarch.20.d: "Not wanting further escalation, the [FROM.GetAdjective] government agreed to transfer to us part of its lands that historically belong to our state."
 hungary_monarch.20.a: "We take what is rightfully ours"
 hungary_monarch.21.t: "[FROM.GetName] refuses the ultimatum"
 hungary_monarch.21.d: "[FROM.GetName] refused to comply with our ultimatum, declaring that if it came to that, they were ready for war. Everything was ready for an offensive; all that remained was to give the order, and our troops would invade [FROM.GetAdjective] territory."
 hungary_monarch.21.a: "Start mobilization"

 #Jobbik Focuses
 HUN_rise_of_jobbik: "The Rise of the Jobbik"
 HUN_rise_of_jobbik_desc: "A hard-line nationalist current moves from the margins into parliament, promising to defend the nation with uncompromising policies and street muscle if needed."
 HUN_party_declaration: "Party Declaration"
 HUN_party_declaration_desc: "Jobbik issues its program: ethnic nationalism, law-and-order crackdowns, and an aggressive challenge to the old parties it brands as corrupt and cosmopolitan."
 HUN_hard_national_populism: "Hard National Populism"
 HUN_hard_national_populism_desc: "Campaign rhetoric shifts into permanent governance - mass rallies, fiery speeches, and attacks on elites stoke resentment while consolidating power in nationalist hands."
 HUN_protecting_hungarian_interests: "Protecting Hungarian interests"
 HUN_protecting_hungarian_interests_desc: "Every policy will be filtered through a single test-does it benefit ethnic Hungarians first? Trade, subsidies, and regulation are reshaped to pass that test."
 HUN_create_a_workers_union: "Create a Workers' Union"
 HUN_create_a_workers_union_desc: "A party-aligned labor federation is founded to counter ‘globalist’ unions, channeling workplace grievances into support for the nationalist project."
 HUN_protecting_hungarian_values: "Protecting Hungarian Values"
 HUN_protecting_hungarian_values_desc: "Schools, media, and cultural grants are reoriented toward ‘traditional’ narratives, crowding out liberal voices and elevating conservative social norms."
 HUN_lgbt_ban: "LGBT Ban"
 HUN_lgbt_ban_desc: "Legislation criminalizes LGBT organizing and public expression, framed as defending the family but serving to marginalize and silence minority communities."
 HUN_condemn_global_capitalism: "Condemn Global Capitalism"
 HUN_condemn_global_capitalism_desc: "Speeches and media campaigns rail against multinational firms and financiers, blaming ‘global capitalism’ for inequality and cultural dilution."
 HUN_attracting_foreign_investors: "Attracting Foreign Investors"
 HUN_attracting_foreign_investors_desc: "Despite anti-globalist rhetoric, select foreign investors are courted with incentives-provided they align with nationalist priorities and hire locally."
 HUN_radical_christian_patriotism: "Radical Christian Patriotism"
 HUN_radical_christian_patriotism_desc: "Clergy and party leaders fuse faith and nationalism, preaching a mission to defend Christian Europe and sanctify the movement’s harsher policies."
 HUN_the_israeli_question: "The Israeli question"
 HUN_the_israeli_question_desc: "Jobbik agitates around Israel and domestic Jewish communities, using provocative language to rally hardliners and deflect attention from internal problems."
 HUN_three_strikes_law: "Three Strikes Law"
 HUN_three_strikes_law_desc: "A mandatory ‘three strikes’ regime promises swift and severe punishment, expanding incarceration and projecting toughness on crime."
 HUN_return_of_death_penalty: "The Return of the Death Penalty"
 HUN_return_of_death_penalty_desc: "Capital punishment is reintroduced for severe crimes, touted as a deterrent and a symbol of uncompromising justice."
 HUN_strengthening_the_police: "Strengthening the Police"
 HUN_strengthening_the_police_desc: "Budgets, equipment, and legal powers for police are expanded, with loyalty tests to ensure the force backs the nationalist agenda."
 HUN_hungary_for_hungarians: "Hungary for Hungarians"
 HUN_hungary_for_hungarians_desc: "Migration curbs, residency crackdowns, and preferential hiring policies formalize the slogan: the state exists first and foremost for ethnic Hungarians."
 HUN_hungarian_ethnocracy: "Hungarian Ethnocracy"
 HUN_hungarian_ethnocracy_desc: "Institutional changes elevate one ethnic group in law and practice-tightening citizenship rules, redrawing voting districts, and embedding discrimination into state structures."
 HUN_protectionist_approach_to_economy: "Protectionist Approach to the Economy"
 HUN_protectionist_approach_to_economy_desc: "Jobbik’s economic program rejects globalism and free-trade orthodoxy. By raising tariffs, favoring domestic firms in procurement, and restricting foreign ownership in strategic sectors, the state will shield Hungarian workers from what it portrays as predatory foreign capital."
 HUN_large_scale_reform_of_law_enforcement_agencies: "Large-Scale Reform of Law Enforcement Agencies"
 HUN_large_scale_reform_of_law_enforcement_agencies_desc: "Existing police structures are accused of corruption and weakness. A sweeping reorganization-purges, new leadership, and political vetting-will turn law enforcement into a loyal instrument of the nationalist state."
 HUN_raids_on_corrupt_officials: "Raids on Corrupt Officials"
 HUN_raids_on_corrupt_officials_desc: "Special units will be empowered to conduct high‑profile raids against allegedly corrupt bureaucrats and local bosses. Beyond cleaning up graft, these operations send a clear message that opposition networks will be broken by force if necessary."
 HUN_shut_up_disloyal_media: "Shut Up Disloyal Media"
 HUN_shut_up_disloyal_media_desc: "Hostile media outlets are branded enemies of the nation. Through fines, license pressure, friendly takeovers, and legal harassment, critical broadcasters and newspapers will be silenced or brought into line with government messaging."
 HUN_demand_federalization_of_Romania: "Demand Federalization of Romania"
 HUN_demand_federalization_of_Romania_desc: "Under the banner of minority rights, Budapest will demand that Romania be turned into a loose federation, granting wide autonomy to Hungarian-populated regions. If Bucharest refuses, the issue can be used to inflame nationalist sentiment at home and justify future pressure."
 HUN_complete_the_reform_of_law_enforcement_agencies: "Complete the Reform of Law Enforcement Agencies"
 HUN_complete_the_reform_of_law_enforcement_agencies_desc: "With purges and reshuffles underway, the final stage of reform centralizes command, expands special units, and ties promotions to loyalty. The result is a disciplined security apparatus ready to enforce Jobbik’s agenda."
 HUN_vonas_cult_of_personality: "Vona's Cult of Personality"
 HUN_vonas_cult_of_personality_desc: "Propaganda, rallies, and loyalist media will elevate Gábor Vona as the embodiment of the nation’s will. Portraits, slogans, and carefully staged speeches cultivate a leader cult that binds the movement together and marginalizes internal rivals."
 HUN_create_a_secret_police: "Create a Secret Police"
 HUN_create_a_secret_police_desc: "A new internal security service, answerable only to the leadership, will monitor dissidents, opposition parties, and suspected traitors. Operating in the shadows, it will intimidate enemies of the regime and pre‑empt challenges before they surface."
 HUN_support_hungarian_separatism_in_ukraine: "Support Hungarian Separatism in Ukraine"
 HUN_support_hungarian_separatism_in_ukraine_desc: "Covert funding, political agitation, and passport offers will nurture separatist sentiment in Hungarian-inhabited regions of Ukraine. Officially framed as protecting our kin, this campaign also gives Budapest a lever to destabilize its neighbor."
 HUN_fostering_patriotism: "Fostering Patriotism"
 HUN_fostering_patriotism_desc: "School curricula, youth camps, and veterans’ associations will all be mobilized to instill pride in Hungarian history and Jobbik’s mission. A constant drumbeat of patriotic symbolism normalizes the movement’s radical program."
 HUN_militarization_of_society: "Militarization of Society"
 HUN_militarization_of_society_desc: "Paramilitary training, reserve formations, and civil-defense drills will spread a martial ethos across society. Citizens are encouraged to see themselves as soldiers in a national struggle, blurring the line between civilian life and the armed movement."
 HUN_form_a_militia: "Form a Militia"
 HUN_form_a_militia_desc: "Party-aligned militias will patrol ‘unsafe’ neighborhoods, guard rallies, and show force in the countryside. Presented as volunteers defending order, these formations in practice intimidate minorities and political opponents."
 HUN_anti_gypsy_campaign: "Anti-Gypsy Campaign"
 HUN_anti_gypsy_campaign_desc: "Under the pretext of fighting crime and ‘antisocial behavior’, Jobbik will launch sweeping operations targeting Roma communities. Harsh policing, evictions, and stigmatizing rhetoric deepen discrimination while rallying extremists behind the government."

 #Jobbik Events
 hungary_jobbik.1.t: "Party Declaration Signed"
 hungary_jobbik.1.d: "Today, at the Jobbik party congress, in connection with our party's assumption of the ruling position in the country, a new declaration was signed.\nThe declaration is based on the principles of building a socialist system based on national identity, protecting Hungarian traditional values and the interests of Hungarian citizens."
 hungary_jobbik.1.a: "Let's drink to us!"
 hungary_jobbik.2.t: "[HUN.GetName] seeks investment"
 hungary_jobbik.2.d: "[HUN.GetAdjective] diplomats, along with the [HUN.GetAdjective] Minister of Finance, have approached us with a request. They want investment from our country to boost their economy, promising they will repay. Such a move would strengthen our relations and increase our influence on Hungary's GDP. Should we agree?"
 hungary_jobbik.2.a: "Take our money, Hungarian brothers!"
 hungary_jobbik.2.b: "Our economy is not in a position to support investment"
 hungary_jobbik.3.t: "[FROM.GetName] agrees to invest in us!"
 hungary_jobbik.3.d: "Our diplomats returned from [FROM.GetName]with excellent news: [FROM.GetName] has agreed to allocate several billion dollars for investment in our economy!"
 hungary_jobbik.3.a: "Very Nice!"
 hungary_jobbik.4.t: "Israel on the agenda"
 hungary_jobbik.4.d: "Jews are a long-standing problem in our country, and we're not talking about a specific nation, but about citizens of the terrorist-created artificial state called Israel. These people pose a threat to Hungary's national ideology, and it's possible that Mossad agents might even be among them.\nBe that as it may, the problem must be solved. And we were faced with the question of whether to deport all Jews to Tel Aviv or send only Israeli citizens back to their homeland."
 hungary_jobbik.4.a: "Find and deport every Jew!"
 hungary_jobbik.4.b: "Israeli citizens should live in Israel!"
 hungary_jobbik.5.t: "Hungary deports Jews"
 hungary_jobbik.5.d: "The Hungarian government's new policy toward Jews has forced them to deport our fellow citizens to Tel Aviv. While we are, of course, happy to welcome our compatriots back home, Hungary's behavior raises many questions. At the very least, such actions are clearly aimed at fostering hostility toward our state and convey a hidden message of hatred toward Jews and Israel in general."
 hungary_jobbik.5.a: "They will be better off here"
 hungary_jobbik.6.t: "Hungary demands federalization of Transylvania"
 hungary_jobbik.6.d: "Hungary, concerned about the rights of indigenous Hungarians living in Transylvania, demands that we grant autonomy to the Transylvanian territory and establish it as a federal entity under Hungarian protection. While we will retain control over Transylvania, such ultimatums from Hungary are unacceptable and call into question our territorial integrity."
 hungary_jobbik.6.a: "A little autonomy really wouldn't hurt them"
 hungary_jobbik.6.b: "We will not bend under the Hungarian aggressors"
 hungary_jobbik.7.t: "Romania accepts our demands"
 hungary_jobbik.7.d: "Romania, unwilling to enter into confrontation, agreed to grant autonomy to Transylvania, and we, in turn, will ensure that the rights of indigenous Hungarians are respected within the Autonomy and will guarantee their right to self-determination and territorial integrity."
 hungary_jobbik.7.a: "Breathe freely, our brothers!"
 hungary_jobbik.8.t: "Romania refuses our demands"
 hungary_jobbik.8.d: "We are deeply concerned that neighboring Romania is failing to respect the rights of self-determination of the indigenous Hungarians living in Transylvania. The Romanian government has refused to grant them greater autonomy, forcing us to resort to a military solution to the conflict."
 hungary_jobbik.8.a: "We will achieve our goal at any cost!"
 hungary_jobbik.9.t: "Hungary demands Transcarpathia"
 hungary_jobbik.9.d: "Hungary has long been laying claim to Transcarpathia, claiming the territory is populated by ethnic Hungarians. Such claims have led to escalation, and now the Hungarian aggressors have decided to issue us a direct ultimatum. Will we agree?"
 hungary_jobbik.9.a: "We agree to the transfer of Transcarpathia"
 hungary_jobbik.10.t: "[FROM.GetName] agrees to the transfer of Transcarpathia"
 hungary_jobbik.10.d: "[FROM.GetName], not wanting a war with our country, decided to hand over to us part of their territory populated by ethnic Hungarians. As the saying goes, caution is not cowardice, and stupidity is not courage. We respect their choice."
 hungary_jobbik.10.a: "Welcome to Home"
 hungary_jobbik.11.t: "[FROM.GetName] refuses demands"
 hungary_jobbik.11.d: "Declaring that they were ready for war with us, the [FROM.GetName] refused our demands and announced the beginning of mobilization. The conflict went beyond the limits of ordinary separatism and escalated into war."
 hungary_jobbik.11.a: "We are ready for war"

