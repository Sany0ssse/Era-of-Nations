 #Millitary
 HUN_army: "Magyar Honvédség"
 HUN_army_desc: "The Honvédség still wears the scars of the 1990s. Launching a comprehensive readiness drive will audit equipment, revive training cycles, and remind every brigade of its mission."
 HUN_2001_modern: "2001 Modernization"
 HUN_2001_modern_desc: "The first tranche of modernization funds will replace obsolete radios, refurbish depots, and begin phasing out Warsaw Pact relics."
 HUN_land_forces: "Magyar Szárazföldi Haderő"
 HUN_land_forces_desc: "Hungary’s land forces must regain credibility through doctrine updates, brigade reorganization, and field exercises that stress mobility."
 HUN_reorganization_of_infantry: "Reorganization of the Infantry"
 HUN_reorganization_of_infantry_desc: "Motorizing key battalions, standardizing kit, and expanding professional NCO ranks will turn our infantry into a true rapid-response force."
 HUN_modernization_of_military_equipment: "Modernization of Military Equipment"
 HUN_modernization_of_military_equipment_desc: "We will direct procurement toward modern AFVs, optics, and artillery, even if that means a temporary spending spike."
 HUN_retraining_of_officers: "Retraining of Officers"
 HUN_retraining_of_officers_desc: "Sending officers back to classrooms and foreign academies will purge outdated Soviet doctrines and instill contemporary leadership skills."
 HUN_zrinyi2026: "Zrínyi 2026"
 HUN_zrinyi2026_desc: "The flagship Zrínyi 2026 program will recapitalize the entire force—new small arms, infantry fighting vehicles, and digital command nets all arrive on an ambitious schedule."
 HUN_feg: "Fegyver- és Gépgyár"
 HUN_feg_desc: "Reinvigorating the FEG arms works secures domestic supply of small arms and components, supporting both the army and export ambitions."
 HUN_organize_abrams_deliveries: "Organize Abrams Deliveries"
 HUN_organize_abrams_deliveries_desc: "Negotiating for surplus Abrams tanks would leapfrog our armored units into NATO-standard capabilities, provided we pay the political and financial price."
 HUN_russian_tanks: "Russian Tanks"
 HUN_russian_tanks_desc: "Alternatively, discounted Russian armor could modernize our fleet on the cheap, albeit at the cost of Western interoperability."
 HUN_n7: "N7"
 HUN_n7_desc: "Project N7 channels funds into indigenous R&D, focusing on sensors, munitions, and lightweight vehicles suited for Hungary’s terrain."
 HUN_air_forces: "Magyar Légierő"
 HUN_air_forces_desc: "The air force needs refurbished bases, pilot retention programs, and a clear procurement roadmap to stay viable."
 HUN_resolve_mig29_issue: "Resolve the MiG-29 Issue"
 HUN_resolve_mig29_issue_desc: "Hungary must finally decide whether to overhaul, sell, or scrap its aging MiG-29 fleet, freeing hangars and budgets for the next generation."
 HUN_strengthening_air_defense: "Strengthening Air Defense"
 HUN_strengthening_air_defense_desc: "Investments in radar coverage, SAM batteries, and networked command posts will seal the gaps in our sky shield."
 HUN_revision_of_logistics: "Revision of Logistics"
 HUN_revision_of_logistics_desc: "A logistics review will streamline depots, digitize inventory, and ensure frontline units receive spare parts and fuel on time."
 HUN_buy_swedish_planes: "Buy Swedish Planes"
 HUN_buy_swedish_planes_desc: "Leasing or buying Swedish aircraft offers a balanced path toward Western integration without total dependence on U.S. suppliers."
 HUN_naval_forces: "Magyar Haditengerészet"
 HUN_naval_forces_desc: "Though landlocked, Hungary still requires riverine forces. Rebuilding the small Danube flotilla improves border security and engineer mobility."
 HUN_choose_new_doctrine: "Choose a New Doctrine"
 HUN_choose_new_doctrine_desc: "Naval planners will debate littoral defense, expeditionary support, or river control doctrines before committing scarce funds."
 HUN_construction_of_new_naval_shipyards: "Construction of New Naval Shipyards"
 HUN_construction_of_new_naval_shipyards_desc: "Expanding inland shipyards allows us to produce patrol craft, transports, and support vessels tailored to Danube operations."
 HUN_restoring_greatness_of_sea: "Restoring the Greatness of the Sea"
 HUN_restoring_greatness_of_sea_desc: "A symbolic yet ambitious program to build expeditionary logistics—joint training with allied navies, amphibious drills, and a maritime command staff."
 HUN_organize_abrams_deliveries_tt: "If the §B[USA.GetNameWithFlag]§! agrees, we will receive §4120 Abrams§! tanks for §R$5 Billion§!."
 HUN_russian_tanks_tt: "If the §B[SOV.GetNameWithFlag]§! agrees, we will receive §4120 T-72§! tanks for §R$5 Billion§!."
 HUN_buy_swedish_planes_tt: "If the §B[SWE.GetNameWithFlag]§! agrees, we will receive §420 Sk-60§! planes for §R$5 Billion§!."
 HUN_resolve_mig29_issue_tt: "Depending on the chosen solution, we will receive §Gdifferent bonuses§!."

 #Millitary Decisions
 HUN_millitary_category: "Millitary of Hungary"
 HUN_millitary_category_desc: "Our army is in a deplorable state. We have underdeveloped equipment, no navy, no access to the sea, and virtually no air power. As part of the great revival of our army, we must begin large-scale modernization and restore the greatness of our Army.\n\n\n\n\n\n\n£GFX_HUN_hungarian_army_decision_category\n\n\n\n\n\n\n\n" 
 HUN_sold_mig29: "Sold MiG-29 to [FROM.GetNameWithFlag]"

