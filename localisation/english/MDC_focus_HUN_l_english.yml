 hungarian_focus: "Hungarian Focus Tree"

 HUN_MILLENNIUM_DAWN_DESC: "Hungary in late 1999 was in a period of consolidation. The chaotic and transformative early 1990s, which saw the withdrawal of Soviet troops and the establishment of a multi-party democracy, had given way to a more stable, though still fiercely competitive, political system. The government was a coalition led by the center-right Fidesz – Hungarian Civic Alliance, under the young and dynamic Prime Minister Viktor Orbán, who had taken office in 1998. His government pursued a policy of national renewal and a \"return to Europe.\" The single most significant achievement of this period, which filled the country with immense pride, was Hungary's accession to NATO on March 12, 1999. This was a monumental geopolitical shift, guaranteeing the country's security and irrevocably aligning it with the West."

 #Great Hungary Decison
 HUN_paris_treaty_null: "Cancel the Paris Peace Treaty"
 HUN_requiem_for_the_great: "Requiem For the Great"
 HUN_requiem_for_the_great_desc: "The heart of Hungary beats in unison with the past, and we believe in a future where borders will once again find their true meaning.\nWe Hungarians carry within us the memory of a time when our kingdom stretched from the Carpathian Mountains to the Adriatic Sea. These are not just pages of history; they are a living part of our soul, an echo of a glorious past that we will never forget. A Greater Hungary is not just a dream; it is our historical truth, our right, which we cherish in the hearts of generations.\nWe remember the lands where Hungarian was spoken, where our traditions flourished, where our ancestors built and defended their homeland. These lands are not just territories on a map; they are parts of our national body that were torn away but not forgotten.\nThese territorial claims are not aggression; they are a call for justice, a desire to restore historical truth. We do not wish harm to anyone; we simply want to reclaim what is ours by birthright, by historical right. We know that the road to restoring Greater Hungary will be long and difficult. The world has changed, borders have been redrawn, but the spirit of the Hungarian people remains unshaken. We will work, we will learn, we will preserve our culture and language so that we will be ready when the time comes.\nAnd we believe that this time will come. And then, with pride and joy, we will once again proclaim a Greater Hungary - united, strong, and prosperous, as in times past. This is our hope, our faith, and our promise to future generations."
 HUN_proclaim_great_hungary: "Proclaim §5The Great Hungary§!"
