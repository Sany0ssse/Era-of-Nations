 #Great Hungary Events
 hungary_great.1.t: "Hungary Demands the Return of Its Lands"
 hungary_great.1.d: "[HUN.GetNameDef] has delivered an ultimatum to [This.GetNameDef], demanding the immediate return of territories it claims as part of the creation of a Greater Hungary. Citing historical borders and national unity, Budapest insists these lands are an inalienable part of the Hungarian homeland and must be restored without delay. We must decide how to respond."
 hungary_great.1.a: "Comply with the demands"
 hungary_great.1.b: "Reject the demands"

 hungary_great.2.t: "Ultimatum Accepted by Slovakia"
 hungary_great.2.d: "Bratislava has accepted our ultimatum. The Slovak government has agreed to transfer the territories we demanded to [HUN.GetNameDef], recognizing our claims in the name of stability and regional peace. Our path toward a Greater Hungary advances."
 hungary_great.2.a: "A just outcome"

 hungary_great.3.t: "Slovakia Rejects Our Demands"
 hungary_great.3.d: "The Slovak government has refused our ultimatum and rejected our rightful claims. Their defiance leaves us with a stark choice: back down and abandon the vision of Greater Hungary, or force the issue by other means."
 hungary_great.3.a: "They will regret this"

 hungary_great.4.t: "Hungary Issues an Ultimatum"
 hungary_great.4.d: "[HUN.GetNameDef] has delivered an ultimatum to [This.GetNameDef], demanding the immediate return of territories it claims as part of a Greater Hungary. Budapest argues that these lands are historically and culturally Hungarian and must be restored. Our response will determine the course of events."
 hungary_great.4.a: "Comply with the demands"
 hungary_great.4.b: "Reject the demands"

 hungary_great.5.t: "Ultimatum Accepted by Ukraine"
 hungary_great.5.d: "Kyiv has accepted our ultimatum. The Ukrainian government has agreed to transfer the demanded territory to [HUN.GetNameDef], acknowledging our claims for the sake of regional stability. Our vision of Greater Hungary moves forward."
 hungary_great.5.a: "A just outcome"

 hungary_great.6.t: "Ukraine Rejects Our Demands"
 hungary_great.6.d: "Ukraine has refused our ultimatum and rejected our rightful claims. Their decision raises tensions and may force us to consider other means to secure what we believe is ours."
 hungary_great.6.a: "They will regret this"

 hungary_great.7.t: "Hungary Issues an Ultimatum"
 hungary_great.7.d: "[HUN.GetNameDef] has presented [This.GetNameDef] with an ultimatum, demanding the return of territories claimed under the banner of a Greater Hungary. They insist that history and national unity require the restoration of these lands. We must decide how to respond."
 hungary_great.7.a: "Comply with the demands"
 hungary_great.7.b: "Reject the demands"

 hungary_great.8.t: "Ultimatum Accepted by Romania"
 hungary_great.8.d: "Bucharest has accepted our ultimatum. The Romanian authorities will transfer the demanded territories to [HUN.GetNameDef], acknowledging our historical claims. Our efforts bear fruit."
 hungary_great.8.a: "A just outcome"

 hungary_great.9.t: "Romania Rejects Our Demands"
 hungary_great.9.d: "Romania has refused our ultimatum and rejected our claims. Their defiance threatens regional stability and challenges our resolve to pursue the restoration of our historical lands."
 hungary_great.9.a: "They will regret this"

 hungary_great.10.t: "Hungary Issues an Ultimatum"
 hungary_great.10.d: "[HUN.GetNameDef] has issued an ultimatum to [This.GetNameDef], demanding the return of territories it considers an integral part of the Hungarian nation. The pressure is mounting—our response will have consequences."
 hungary_great.10.a: "Comply with the demands"
 hungary_great.10.b: "Reject the demands"

 hungary_great.11.t: "Ultimatum Accepted by Serbia"
 hungary_great.11.d: "Belgrade has accepted our ultimatum. The Serbian government will transfer the specified territories to [HUN.GetNameDef], acknowledging our claims and seeking to avoid escalation."
 hungary_great.11.a: "A just outcome"

 hungary_great.12.t: "Serbia Rejects Our Demands"
 hungary_great.12.d: "Serbia has rejected our ultimatum and refused to cede the territories we demanded. Tensions rise as our path to a Greater Hungary meets resistance."
 hungary_great.12.a: "They will regret this"

 hungary_great.13.t: "Hungary Issues an Ultimatum"
 hungary_great.13.d: "[HUN.GetNameDef] has presented an ultimatum to [This.GetNameDef], insisting on the return of territories claimed as part of a Greater Hungary. They assert historical right and national unity as justification. A decision must be made."
 hungary_great.13.a: "Comply with the demands"
 hungary_great.13.b: "Reject the demands"

 hungary_great.14.t: "Ultimatum Accepted by Croatia"
 hungary_great.14.d: "Zagreb has accepted our ultimatum. The Croatian government has agreed to transfer the demanded territories to [HUN.GetNameDef], recognizing our claims in hopes of preserving peace."
 hungary_great.14.a: "A just outcome"

 hungary_great.15.t: "Croatia Rejects Our Demands"
 hungary_great.15.d: "Croatia has refused our ultimatum and declined to restore the territories we claim. This refusal challenges our ambitions and may force us to pursue other means."
 hungary_great.15.a: "They will regret this"

 hungary_great.16.t: "Greater Hungary Proclaimed"
 hungary_great.16.d: "After a series of demands and diplomatic maneuvers, [HUN.GetNameDef] has secured all territories it claimed as part of its historic vision. In a triumphant address, the government in Budapest declared the formation of Greater Hungary, heralding a new chapter built on restored borders and national unity. Reactions across the region are mixed—some see stability through resolution, others fear what this precedent could mean for the future of Europe."
 hungary_great.16.a: "A new era begins"

 hungary_great.17.t: "Hungary withdraws from the Paris Treaty"
 hungary_great.17.d: "The Hungarian Parliament passed a law annulling the 1947 Paris Peace Treaty, which defined the country's post-war borders. The Hungarian government's official statement stated that the treaty was signed \"under external pressure and in conditions of limited sovereignty\" and therefore no longer has legal force.\nAt the same time, it announced a program of accelerated militarization and modernization of the armed forces. The ultimate goal is declared to be the restoration of the historical borders of Greater Hungary.\nBudapest's actions provoked a sharp reaction in the capitals of neighboring states whose territories may be affected by the border revision."
 hungary_great.17.a: "Europe is once again on the brink of war"

