 #Orban Era Focuses
 HUN_orban_era: "The Orban Era"
 HUN_orban_era_desc: "The rise of Viktor Orban marks a new chapter in Hungarian politics. His leadership promises to bring stability, economic reform, and a renewed sense of national pride to Hungary. Under his guidance, we will pursue policies that prioritize Hungarian interests and strengthen our position in the region."
 HUN_continue_stabilization_program: "Continue the Stabilization Program"
 HUN_continue_stabilization_program_desc: "Building on previous stabilization efforts, we will continue implementing policies designed to restore economic stability and public confidence. This includes maintaining fiscal discipline, controlling inflation, and ensuring that our economic recovery remains on track."
 HUN_orbans_economic_policy: "Orban's Economic Policy"
 HUN_orbans_economic_policy_desc: "Viktor Orban's economic vision focuses on creating a competitive, market-oriented economy while maintaining social stability. This policy emphasizes job creation, investment attraction, and the development of Hungarian industry to reduce dependence on foreign capital."
 HUN_new_social_program: "New Social Program"
 HUN_new_social_program_desc: "We will implement comprehensive social reforms aimed at improving the lives of Hungarian families. This program includes expanded healthcare access, improved education opportunities, and support for families with children, ensuring that economic growth benefits all citizens."
 HUN_reduction_social_security_contributions: "Reduction of Social Security Contributions"
 HUN_reduction_social_security_contributions_desc: "To stimulate economic growth and reduce the burden on businesses and workers, we will reduce social security contribution rates. This measure will increase take-home pay for workers while making Hungarian companies more competitive internationally."
 HUN_restoration_of_parental_benefits: "Restoration of Parental Benefits"
 HUN_restoration_of_parental_benefits_desc: "We will restore and expand parental benefit programs to support Hungarian families. This includes maternity and paternity leave benefits, childcare support, and family allowances that encourage population growth and family stability."
 HUN_maternity_benefits: "Maternity Benefits"
 HUN_maternity_benefits_desc: "Expanding maternity benefits will provide crucial support for Hungarian mothers and families. This includes extended maternity leave, financial support during pregnancy and early childhood, and improved access to maternal healthcare services."
 HUN_reduction_of_government_spending: "Reduction of Government Spending"
 HUN_reduction_of_government_spending_desc: "To achieve fiscal stability and reduce the budget deficit, we will implement targeted reductions in government spending. This includes streamlining bureaucracy, eliminating wasteful programs, and focusing resources on essential services and infrastructure."
 HUN_increase_access_to_education: "Increase Access to Education"
 HUN_increase_access_to_education_desc: "We will expand educational opportunities for all Hungarians by increasing funding for schools, improving teacher training, and ensuring that quality education is accessible regardless of economic background. Education is the foundation of our nation's future prosperity."
 HUN_unemployment_relief_program: "Unemployment Relief Program"
 HUN_unemployment_relief_program_desc: "To address unemployment and support those seeking work, we will implement comprehensive unemployment relief programs. This includes job training initiatives, employment services, and temporary financial support to help Hungarians transition back into the workforce."
 HUN_inflation_reduction_program: "Inflation Reduction Program"
 HUN_inflation_reduction_program_desc: "We will implement strict monetary policies and fiscal measures to combat inflation and stabilize prices. This includes working with the central bank to control money supply, reducing government borrowing, and implementing price controls on essential goods."
 HUN_lower_taxes: "Lower Taxes"
 HUN_lower_taxes_desc: "Reducing the tax burden on Hungarian citizens and businesses will stimulate economic growth and investment. We will implement tax cuts for individuals and corporations while maintaining essential government services and ensuring fiscal responsibility."
 HUN_reduce_budget_deficit: "Reduce the Budget Deficit"
 HUN_reduce_budget_deficit_desc: "Achieving fiscal stability requires reducing our budget deficit through a combination of spending cuts and revenue increases. We will implement responsible fiscal policies that balance the budget while maintaining essential government services."
 HUN_fighting_government_debt: "Fighting Government Debt"
 HUN_fighting_government_debt_desc: "We will implement aggressive measures to reduce Hungary's government debt burden. This includes debt restructuring, improved debt management, and policies that promote economic growth to increase our ability to service existing obligations."
 HUN_go_on_a_visit_to_kremlin: "Go on a Visit to the Kremlin"
 HUN_go_on_a_visit_to_kremlin_desc: "Strengthening relations with Russia through diplomatic engagement and economic cooperation. This visit will establish important trade relationships, secure energy supplies, and position Hungary as a bridge between East and West in European affairs."
 HUN_greetings_to_beijing: "Greetings to Beijing!"
 HUN_greetings_to_beijing_desc: "Expanding our diplomatic and economic relations with China to access new markets and investment opportunities. This partnership will bring Chinese investment to Hungary while opening Asian markets for Hungarian products and services."
 HUN_take_power: "Take Power into Your Own Hands"
 HUN_take_power_desc: "Consolidating political power to ensure effective governance and implementation of our reform agenda. This includes strengthening the executive branch, streamlining decision-making processes, and ensuring that our policies can be implemented without obstruction."
 HUN_new_constitution: "The New Constitution of Hungary"
 HUN_new_constitution_desc: "We will draft and implement a new constitution that reflects Hungarian values and ensures effective governance. This constitution will protect individual rights while establishing a strong framework for economic development and national sovereignty."
 HUN_reduction_of_seats_in_parliament: "Reduction of Seats in Parliament"
 HUN_reduction_of_seats_in_parliament_desc: "Streamlining the parliamentary system by reducing the number of representatives to improve efficiency and reduce costs. This reform will make the legislative process more effective while maintaining democratic representation."
 HUN_pragmatic_government: "Pragmatic Government"
 HUN_pragmatic_government_desc: "Implementing a pragmatic approach to governance that prioritizes results over ideology. This includes making decisions based on practical considerations, focusing on policies that deliver tangible benefits, and ensuring efficient administration."
 HUN_castling_in_the_ranks_of_elite: "Castling in the Ranks of the Elite"
 HUN_castling_in_the_ranks_of_elite_desc: "Reforming the elite class by promoting merit-based advancement and reducing corruption. This includes implementing transparent selection processes, ensuring that positions are filled by qualified individuals, and creating opportunities for talented Hungarians to rise through the ranks."
 HUN_introduce_a_flat_tax: "Introduce a Flat Tax"
 HUN_introduce_a_flat_tax_desc: "Implementing a flat tax system to simplify the tax code and encourage economic activity. This single-rate tax system will reduce complexity, eliminate loopholes, and create incentives for investment and entrepreneurship."
 HUN_transparency_of_social_security_system: "Transparency of the Social Security System"
 HUN_transparency_of_social_security_system_desc: "Reforming the social security system to ensure transparency and efficiency. This includes implementing clear reporting requirements, eliminating waste and fraud, and ensuring that benefits reach those who need them most."
 HUN_support_hungarian_nationalism: "Support Hungarian Nationalism"
 HUN_support_hungarian_nationalism_desc: "Promoting Hungarian national identity and cultural values throughout society. This includes supporting Hungarian language and culture, celebrating national traditions, and ensuring that Hungarian interests are prioritized in all policy decisions."
 HUN_central_bank_reforms: "Central Bank Reforms"
 HUN_central_bank_reforms_desc: "Implementing reforms to strengthen the central bank's independence and effectiveness. This includes improving monetary policy tools, enhancing financial stability oversight, and ensuring that the bank can effectively manage inflation and economic growth."
 HUN_preservation_of_christian_foundations: "Preservation of Christian Foundations"
 HUN_preservation_of_christian_foundations_desc: "Protecting and promoting Hungary's Christian heritage and values. This includes supporting Christian institutions, ensuring religious freedom, and incorporating Christian principles into public policy while respecting the rights of all citizens."
 HUN_raise_retirement_age_in_army_and_police: "Raise the Retirement Age in the Army and Police"
 HUN_raise_retirement_age_in_army_and_police_desc: "Extending the retirement age for military and police personnel to ensure continuity of service and reduce pension costs. This reform will maintain experienced personnel in critical security roles while improving the sustainability of our pension system."
 HUN_christian_illiberalism: "Christian Illiberalism"
 HUN_christian_illiberalism_desc: "Implementing policies that prioritize Christian values and traditional Hungarian culture over liberal internationalism. This approach emphasizes national sovereignty, traditional family values, and resistance to foreign cultural influences that threaten Hungarian identity."
 HUN_hungarian_serbian_barrier: "Hungarian-Serbian Barrier"
 HUN_hungarian_serbian_barrier_desc: "Constructing physical barriers and implementing border controls to manage migration and maintain security along the Hungarian-Serbian border. This measure will protect Hungarian territory and ensure that immigration occurs through legal channels only."
 HUN_dealing_with_migration_transit_zones: "Dealing with Migration Transit Zones"
 HUN_dealing_with_migration_transit_zones_desc: "Establishing controlled transit zones to manage migration flows and process asylum applications efficiently. This system will ensure that migration is handled in an orderly manner while protecting Hungarian sovereignty and security."
 HUN_internet_tax: "Internet Tax"
 HUN_internet_tax_desc: "Implementing a tax on internet usage to generate revenue and regulate online activity. This measure will help fund government services while ensuring that internet usage contributes to the national economy."
 HUN_crush_the_opposition: "Crush the Opposition"
 HUN_crush_the_opposition_desc: "Implementing measures to limit opposition activities and ensure political stability. This includes restricting opposition media, limiting protest activities, and ensuring that political discourse remains within acceptable boundaries."
 HUN_take_control_of_media: "Take Control of the Media"
 HUN_take_control_of_media_desc: "Consolidating control over media outlets to ensure that information dissemination serves national interests. This includes acquiring media companies, implementing content regulations, and ensuring that news coverage supports government policies."
 HUN_find_loopholes_in_the_term_limitation_law: "Find Loopholes in the Term Limitation Law"
 HUN_find_loopholes_in_the_term_limitation_law_desc: "Identifying and exploiting legal mechanisms to extend political terms and maintain continuity in leadership. This includes constitutional amendments, legal interpretations, and procedural changes that allow for extended governance."
 HUN_member_of_ec: "A Proud Member of the European Community"
 HUN_member_of_ec_desc: "Strengthening Hungary's position within the European Community through active participation and cooperation. This includes supporting European integration, contributing to common policies, and ensuring that Hungarian interests are represented in European decision-making."
 HUN_cabinet_of_reformers: "Cabinet of Reformers"
 HUN_cabinet_of_reformers_desc: "Appointing a cabinet composed of reform-minded individuals committed to modernizing Hungary. This includes selecting ministers based on expertise and commitment to reform, ensuring that government policies are implemented effectively and efficiently."
 HUN_improving_privatization_mechanism: "Improving the Privatization Mechanism"
 HUN_improving_privatization_mechanism_desc: "Reforming the privatization process to ensure transparency, efficiency, and fair outcomes. This includes implementing competitive bidding processes, ensuring proper valuation of assets, and maximizing returns for the Hungarian people."
 HUN_budget_deficit_elimination_program: "Budget Deficit Elimination Program"
 HUN_budget_deficit_elimination_program_desc: "Implementing comprehensive measures to eliminate the budget deficit and achieve fiscal balance. This includes spending cuts, revenue increases, and structural reforms that will ensure long-term fiscal sustainability."
 HUN_people_constitution: "People's Constitution"
 HUN_people_constitution_desc: "Drafting a new constitution that truly represents the will and values of the Hungarian people. This constitution will protect individual rights, ensure democratic governance, and establish a framework for prosperity and national unity."
 HUN_christian_view_of_market: "A Christian View of the Market"
 HUN_christian_view_of_market_desc: "Implementing economic policies that reflect Christian values of fairness, responsibility, and community. This includes supporting ethical business practices, ensuring fair wages, and promoting economic policies that benefit all members of society."
 HUN_expand_representation_german_minority: "Expand the Representation of the German Minority"
 HUN_expand_representation_german_minority_desc: "Increasing political representation and cultural rights for Hungary's German minority. This includes ensuring minority representation in government, supporting German cultural institutions, and protecting minority rights."
 HUN_lower_retirement_age: "Lower the Retirement Age"
 HUN_lower_retirement_age_desc: "Reducing the retirement age to allow Hungarians to enjoy their later years and create opportunities for younger workers. This policy will improve quality of life for seniors while opening employment opportunities for the next generation."
 HUN_society_of_christian_ethics: "Society of Christian Ethics"
 HUN_society_of_christian_ethics_desc: "Promoting Christian ethical values throughout Hungarian society. This includes supporting Christian education, encouraging ethical business practices, and ensuring that public policy reflects Christian principles of justice and compassion."
 HUN_strategic_digitalization_plan: "Strategic Digitalization Plan"
 HUN_strategic_digitalization_plan_desc: "Implementing a comprehensive plan to modernize Hungary through digital technology. This includes expanding internet access, digitizing government services, and ensuring that Hungary remains competitive in the digital economy."
 HUN_german_industrialist: "German Industrialist"
 HUN_german_industrialist_desc: "Attracting German industrial investment to Hungary to create jobs and transfer technology. This partnership will bring advanced manufacturing capabilities, create employment opportunities, and strengthen economic ties with Germany."
 HUN_and_hungarian_farmer: "And the Hungarian Farmer"
 HUN_and_hungarian_farmer_desc: "Supporting Hungarian agriculture and rural communities to ensure food security and rural prosperity. This includes agricultural subsidies, rural development programs, and policies that support traditional farming practices."
 HUN_jesus_loves_everyone: "Jesus Loves Everyone"
 HUN_jesus_loves_everyone_desc: "Promoting Christian values of love, compassion, and inclusion throughout Hungarian society. This includes supporting charitable organizations, promoting social justice, and ensuring that Christian principles guide our approach to social issues."
 HUN_true_christian_democracy: "True Christian Democracy"
 HUN_true_christian_democracy_desc: "Establishing a political system that combines democratic governance with Christian values and principles. This includes ensuring that government policies reflect Christian ethics, protecting religious freedom, and creating a society based on Christian moral foundations."
 HUN_castling_in_the_elite: "Castling in the Ranks of the Elite"

 #Orban's events
 hungary_orban.1.t: "Reduce the Budget Deficit"
 hungary_orban.1.d: "Our country's budget has long been plagued by unnecessary spending that consumes our treasury and revenues. We need to address this problem and, by prioritizing, understand which government spending we should cut for the benefit of the budget."
 hungary_orban.1.a: "Who are we supposed to defend ourselves against? Military spending is pointless."
 hungary_orban.1.b: "People need more freedom, let's reduce funding for the police"
 hungary_orban.1.c: "We spend too much money on bureaucracy, we need to fix it"

 hungary_orban.2.t: "Victor Orban arrives in Moscow"
 hungary_orban.2.d: "Today, Hungarian President Viktor Orbán arrived in the Kremlin on a diplomatic visit. He brought with him a stack of documents, the signing of which will strengthen our ties with Budapest. The Hungarian leader has long expressed respect for our country and our culture, and we see Hungary's efforts to build closer diplomatic ties with our country."
 hungary_orban.2.a: "God knows we'll be good partners."
 hungary_orban.2.b: "We appreciate their naivety"

 hungary_orban.3.t: "Viktor Orban received in Moscow"
 hungary_orban.3.d: "Today, Viktor Orbán and the Russian President met in the Kremlin. The two leaders discussed various pressing issues and crises, signing several important documents and agreements, including a strategic partnership agreement. Who knows where this rapprochement with Moscow will lead us, but for now, all we see is a bright and prosperous future, overshadowed by the tricolors of Russia and Hungary."
 hungary_orban.3.a: "Glory to Hungary, long live Russia!"

 hungary_orban.4.t: "Victor Orban arrives in Beijing"
 hungary_orban.4.d: "Today, Hungarian President Viktor Orbán arrived in the Beijing on a diplomatic visit. He brought with him a stack of documents, the signing of which will strengthen our ties with Budapest. The Hungarian leader has long expressed respect for our country and our culture, and we see Hungary's efforts to build closer diplomatic ties with our country."
 hungary_orban.4.a: "God knows we'll be good partners."
 hungary_orban.4.b: "We appreciate their naivety"

 hungary_orban.5.t: "Viktor Orban received in Beijing"
 hungary_orban.5.d: "Today, Viktor Orbán and the Chinese President met in the Beijing. The two leaders discussed various pressing issues and crises, signing several important documents and agreements, including a strategic partnership agreement. Who knows where this rapprochement with Moscow will lead us, but for now, all we see is a bright and prosperous future!"
 hungary_orban.5.a: "Glory to Hungary, long live China!"

 hungary_orban.6.t: "People are coming out in large numbers to protest"
 hungary_orban.6.d: "The new constitution met with some resistance not only from opposition parties but also from the public. Critics argued that it served to strengthen the ruling party's power.\nPeople are taking to the streets en masse, chanting for the resignation of the current President of the Republic, Viktor Orbán. The crowd claims that Orbán is leading the country into an authoritarian society where clerks will once again rule the plebs."
 hungary_orban.6.a: "Coordinate the actions of the Police, disperse the protesters!"
 hungary_orban.6.b: "They'll calm down, people are capable of calming themselves down."

 hungary_orban.7.t: "Hungary is gripped by protests"
 hungary_orban.7.d: "Viktor Orbán's government introduced new constitutional amendments, which effectively amounted to a complete rewrite of the constitution that had not been amended since 1949. Furthermore, the new constitution was criticized for its authoritarian rhetoric.\nThe new constitution met with some resistance not only from opposition parties but also from the public. Critics argued that it served to strengthen the ruling party's power.\nPeople are taking to the streets en masse, chanting for the resignation of the current President of the Republic, Viktor Orbán. The crowd claims that Orbán is leading the country into an authoritarian society where clerks will once again rule the plebs."
 hungary_orban.7.a: "Will continue to monitor the situation."

 hungary_orban.8.t: "Hungary is closing its borders with us."
 hungary_orban.8.d: "Hungary has long sent complaints to our administration regarding the uncontrolled migration of Serbs across their border.\nSerbs crossed the open border with Hungary to enter the Schengen zone and easily leave for Poland, Germany, or France in search of a better life, turning Hungary into a transit yard.\nThe Hungarian government has announced that it is tired of tolerating the endless rotation of Serbian migrants and is introducing strict migration controls with our country."
 hungary_orban.8.a: "They can be understood"

