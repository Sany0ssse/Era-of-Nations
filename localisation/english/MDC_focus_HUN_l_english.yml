 #Economy
 HUN_economy: "§YHungarian Economy§!"
 HUN_economy_desc: "A national economic council will take stock of stagnant industries, surging debt, and labor flight, establishing benchmarks for growth, inflation, and wages."
 HUN_national_bank: "Development of the National Bank"
 HUN_national_bank_desc: "Empowering the Magyar Nemzeti Bank with new supervisory tools and recapitalization will anchor monetary stability."
 HUN_otp_bank: "OTP Bank"
 HUN_otp_bank_desc: "Partnering with OTP ensures affordable credit for SMEs while nudging the bank toward regional expansion that benefits Budapest."
 HUN_mbh_bank: "MBH Bank"
 HUN_mbh_bank_desc: "Consolidating mid-sized lenders into MBH will tidy the financial sector and expand access to mortgages and agrarian loans."
 HUN_economic_recovery: "Economic Recovery"
 HUN_economic_recovery_desc: "Stimulus spending combined with targeted tax breaks will coax Hungary out of post-transition malaise." 
 HUN_fighting_public_debt: "Fighting the Public Debt"
 HUN_fighting_public_debt_desc: "Debt ceilings, privatization receipts, and improved tax enforcement will bend the debt curve downward." 
 HUN_double_income_tax: "Double the Income Tax"
 HUN_double_income_tax_desc: "If fiscal realities demand it, emergency surcharges on high earners will plug budget holes—though we must placate angry voters." 
 HUN_combating_subsidiary_reflex: "Combating the Subsidiary Reflex"
 HUN_combating_subsidiary_reflex_desc: "We will wean firms off subsidies by setting performance criteria, phasing out handouts, and rewarding innovation instead of lobbying."
 HUN_attracting_investments: "Attracting Investments"
 HUN_attracting_investments_desc: "A revamped investment promotion agency will market industrial parks, tax holidays, and Hungary’s skilled workforce abroad."
 HUN_subsidies_from_IMF: "Subsidies from the IMF"
 HUN_subsidies_from_IMF_desc: "Accepting IMF assistance provides breathing room—conditional loans that demand fiscal discipline but keep the lights on."
 HUN_attracting_young_personnel: "Attracting Young Personnel"
 HUN_attracting_young_personnel_desc: "Scholarships, housing aid, and startup grants will convince young professionals to stay-and entice expatriates to return."
 HUN_infrastructure_development: "Infrastructure Development"
 HUN_infrastructure_development_desc: "A nationwide infrastructure plan will synchronize highway, rail, and broadband projects to slash logistics costs."
 HUN_european_investments: "European Investments"
 HUN_european_investments_desc: "EU cohesion funds and bilateral deals will finance bridges, energy grids, and research clusters if we present shovel-ready proposals."
 HUN_all_roads_lead_to_budapest: "All Roads Lead to Budapest"
 HUN_all_roads_lead_to_budapest_desc: "Upgrading radial highways and commuter rail centered on Budapest will cement the capital as the region’s logistics hub."
 HUN_construction_of_border_highways: "Construction of Border Highways"
 HUN_construction_of_border_highways_desc: "Ring roads along the borders improve customs throughput and reassure neighbors we value cross-border trade."
 HUN_electrolysis_of_railways: "Electrolysis of Railways"
 HUN_electrolysis_of_railways_desc: "Electrifying trunk rail lines lowers operating costs, shrinks emissions, and dovetails with EU climate targets."
 HUN_export_of_agricultural_products: "Export of Agricultural Products"
 HUN_export_of_agricultural_products_desc: "Marketing Hungarian produce abroad diversifies revenue and stabilizes rural incomes."
 HUN_grain_export: "Grain Export"
 HUN_grain_export_desc: "Preferential rail slots and port agreements will push more wheat and barley into global markets."
 HUN_corn_exports: "Corn Exports"
 HUN_corn_exports_desc: "New silos and processing contracts ensure maize harvests fetch hard currency."
 HUN_processing_of_crops: "Processing of Crops"
 HUN_processing_of_crops_desc: "Investing in mills, canneries, and biofuel plants keeps more value-added processing inside Hungary."
 HUN_ubm_group_hungary: "UBM Group"
 HUN_ubm_group_hungary_desc: "Supporting UBM’s feed and grain empire secures agribusiness supply chains and exports expertise beyond our borders."
 HUN_king_agro: "King-Agro"
 HUN_king_agro_desc: "Crown Agro’s modernization grants tie subsidies to precision agriculture and soil renewal."
 HUN_budapest_international_airport: "Budapest International Airport"
 HUN_budapest_international_airport_desc: "Expanding Ferenc Liszt International improves passenger flows, cargo capacity, and Hungary’s first impression for investors."
 HUN_cityline_hungary: "CityLine Hungary"
 HUN_cityline_hungary_desc: "Backing CityLine fosters domestic carriers that can feed international hubs and keep ticket revenue local."
 HUN_travel_service_hungary: "Travel Service Hungary"
 HUN_travel_service_hungary_desc: "Charter specialists receive incentives to base aircraft in Budapest, boosting tourism seasonality resilience."
 HUN_asl_airlines: "ASL Airlines Hungary"
 HUN_asl_airlines_desc: "Strengthening ASL’s cargo wing turns Hungary into a key node for e-commerce logistics."
 HUN_investments_in_private_airports: "Investments in Private Airports"
 HUN_investments_in_private_airports_desc: "Regional airfields will see runway upgrades and customs facilities, encouraging business aviation outside the capital."
 HUN_tourism_development: "Tourism Development"
 HUN_tourism_development_desc: "Marketing campaigns, cultural grants, and hospitality training will attract more visitors to our spas, wine regions, and festivals."
 HUN_development_of_heavy_industry: "Development of Heavy Industry"
 HUN_development_of_heavy_industry_desc: "Tax incentives and infrastructure guarantees will entice steel, machinery, and petrochemical firms to expand domestically."
 HUN_subsidies_to_chemical_industry: "Subsidies to the Chemical Industry"
 HUN_subsidies_to_chemical_industry_desc: "Targeted subsidies help chemical plants adopt cleaner tech and climb the value chain."
 HUN_egis_gyogyszergyar: "Egis Gyógyszergyár"
 HUN_egis_gyogyszergyar_desc: "A partnership with Egis will expand pharmaceutical R&D, export generics, and anchor biotech talent in Budapest."
 HUN_investments_in_metallurgy: "Investments in Metallurgy"
 HUN_investments_in_metallurgy_desc: "Modern furnaces and quality control labs revive our metallurgical legacy, supplying both domestic builders and export clients."
 HUN_expand_steel_mills: "Expand Steel Mills"
 HUN_expand_steel_mills_desc: "State guarantees paired with private capital will expand blast furnaces and rolling mills to meet infrastructure demand."
 HUN_development_of_national_labels: "Development of National Labels"
 HUN_development_of_national_labels_desc: "We will promote Hungarian brands abroad through trade missions, export insurance, and creative industry grants."
 HUN_attract_investment_in_metallurgy: "Attract Investment in Metallurgy"
 HUN_attract_investment_in_metallurgy_desc: "Foreign equity and joint ventures will be courted with industrial zones near rail hubs and simplified permitting."
 HUN_organize_import_of_raw_materials: "Organize the Import of Raw Materials"
 HUN_organize_import_of_raw_materials_desc: "Securing long-term contracts for ore, bauxite, and coke shields our industries from commodity shocks."
 HUN_development_of_mining: "Development of Mining"
 HUN_development_of_mining_desc: "Exploration grants and safety upgrades will revive domestic mining where geology allows."
 HUN_expansion_of_mines: "Expansion of Mines"
 HUN_expansion_of_mines_desc: "Scaling proven pits improves self-sufficiency and keeps rural communities employed."
 HUN_hungarian_mechanical_engineering: "Hungarian Mechanical Engineering"
 HUN_hungarian_mechanical_engineering_desc: "Mechanical engineering firms will receive export credits and research vouchers to keep high-skilled manufacturing at home."
 HUN_selection_foreign_cars: "Selection of Foreign Cars"
 HUN_selection_foreign_cars_desc: "We will court multiple automakers, letting competition drive better offsets and technology transfers."
 HUN_suzuki: "Suzuki"
 HUN_suzuki_desc: "Suzuki’s long-standing Esztergom plant deserves expansion incentives in exchange for EV lines and supplier development."
 HUN_dacia: "Dacia"
 HUN_dacia_desc: "Convincing Dacia to site component production in Hungary diversifies our automotive cluster."
 HUN_mercedes_benz: "Mercedes-Benz"
 HUN_mercedes_benz_desc: "Mercedes investment cements Hungary as a premium car hub, provided we upgrade workforce training."
 HUN_toyota: "Toyota"
 HUN_toyota_desc: "Attracting Toyota would bolster hybrid technology know-how and link us to Asian supply chains."
 HUN_solving_energy_problems: "Solving Energy Problems"
 HUN_solving_energy_problems_desc: "A mix of conservation programs, new generation, and diversified imports will tame chronic energy shortages."
 HUN_expansion_of_mvm_group: "Expansion of MVM Group"
 HUN_expansion_of_mvm_group_desc: "Empowering the state utility MVM to invest in grids and generation ensures strategic control over critical infrastructure."
 HUN_solving_oil_gas_crisis: "Solving the Oil-Gas Crisis"
 HUN_solving_oil_gas_crisis_desc: "Strategic reserves, interconnectors, and spot-market agility will shield us from future oil and gas shocks."
 HUN_organize_gas_imports: "Organize Gas Imports"
 HUN_organize_gas_imports_desc: "Negotiating firm import contracts and pipeline access guarantees households and industry steady supplies."
 HUN_south_stream: "South Stream"
 HUN_south_stream_desc: "Backing South Stream secures a direct Russian gas link, though it risks EU ire."
 HUN_arad_szeged_pipeline: "Arad-Szeged Pipeline"
 HUN_arad_szeged_pipeline_desc: "Interconnecting with Romania via Arad-Szeged lets us swap gas flows and tap offshore finds."
 HUN_nabucco: "Nabucco"
 HUN_nabucco_desc: "Supporting the Nabucco corridor diversifies supplies with Caspian gas delivered under EU auspices."
 HUN_expansion_renewable_energy: "Expansion of Renewable Energy"
 HUN_expansion_renewable_energy_desc: "Wind belts, solar farms, and biomass plants will receive feed-in tariffs to cut dependence on imported fuels."
 HUN_hungarys_nuclear_program: "Hungary's Nuclear Program"
 HUN_hungarys_nuclear_program_desc: "Modernizing Paks and training a new cadre of nuclear engineers provides reliable baseload power."
 HUN_attracting_european_investment: "Attracting European Investment"
 HUN_attracting_european_investment_desc: "A second charm offensive in Europe will highlight legal reforms and PPP opportunities to draw in capital."
 HUN_cooperation_with_rosatom: "Cooperation with Rosatom"
 HUN_cooperation_with_rosatom_desc: "Partnering with Rosatom secures financing and expertise for nuclear expansion, albeit with geopolitical strings attached."
 HUN_subsidies_from_IMF_focus_tt: "\nDepending on the assistance we choose from the §6IMF§!, we will receive different §YBonuses§! for our §YEconomy§!."
 HUN_subsidies_from_IMF_tt: "$$[?HUN_imf_subs|+3] from §YIMF's Subsidied§!\n"
 HUN_agroincome_tt: "Will §GIncrease§! our income from §YAgricultural Exports§!"

 #Economy Decisions
 HUN_economy_category: "Hungarian Economy"
 HUN_economy_category_desc: "Hungary's economy is entering the new millennium in a less-than-favorable light. We face a plethora of problems, accrued during the transition from socialism to market capitalism. Privatization, recession, and many other factors have brought our small country's economy to a virtual standstill.\nThe lack of resources forces us to export them from abroad, and the lack of access to the sea forces us to have good relations with our neighbors so as not to lose export routes.\nLarge debts and a lack of prospects are forcing our young people to leave the country in search of a better life, primarily in Germany or Poland. This is causing a literal brain drain and a shortage of young professionals.\nSolving these problems and creating a new, powerful economy is the task facing the government of the [HUN.GetName]\n\n\n\n\n\n\n£GFX_HUN_hungarian_economy_decision_category\n\n\n\n\n\n\n\n\n\n"
