 #Commi events
 hungary_commi.1.t: "Hungary Requests Guarantees"
 hungary_commi.1.d: "The Hungarian Republic, where the flame of socialist revolution has been rekindled, asks us for guarantees of protection from Western vultures. Will we help our socialist brothers?"
 hungary_commi.1.a: "We guarantee their independence"
 hungary_commi.1.b: "Hungary is not in our interests"

 hungary_commi.2.t: "China Provides Guarantees"
 hungary_commi.2.d: "The government of the People's Republic of China expressed interest in our country's security and provided us with guarantees of independence. This will strengthen our security against Western imperialism."
 hungary_commi.2.a: "Thanks to the Chinese brothers!"

 hungary_commi.3.t: "China Refuses Guarantees"
 hungary_commi.3.d: "The government of the People's Republic of China refused to provide us with guarantees. This is evidenced by China's unwillingness to escalate tensions with the Western world."
 hungary_commi.3.a: "Well, we will stand on our own."

 hungary_commi.4.t: "Hungary wants to conclude a military treaty"
 hungary_commi.4.d: "The Hungarian government has approached us with a proposal to conclude a mutual defense treaty. This will increase our influence and military presence in Central Europe."
 hungary_commi.4.a: "Let's sign a treaty"
 hungary_commi.4.b: "Hungary is not in our interests"

 hungary_commi.5.t: "Russia agreed to sign the treaty"
 hungary_commi.5.d: "A meeting with the Russian government was recently held. The possibility of signing a mutual defense treaty was discussed. The negotiations resulted in the signing of this treaty by our diplomats and the Russian government."
 hungary_commi.5.a: "Slava Russia"

 hungary_commi.6.t: "Russia refused"
 hungary_commi.6.d: "A meeting with the Russian government was recently held. The possibility of signing a mutual defense treaty was discussed. The outcome of the discussions was that the Russian government refused to allow us to sign the agreement."
 hungary_commi.6.a: "So, no need"

 hungary_commi.7.t: "Hungary invites us to the alliance"
 hungary_commi.7.d: "Recently, the Hungarian Socialist Republic announced the creation of its own organization to unite Central European socialists against Western Imperialism. And now Hungary has sent us an invitation to join their bloc. Should we accept?"
 hungary_commi.7.a: "Let's unite!"
 hungary_commi.7.b: "It's not in our interests"

 hungary_commi.8.t: "[FROM.GetName] agrees to join the Alliance"
 hungary_commi.8.d: "Our recent proposal to the [FROM.GetAdjective] government was met with interest, and recently our diplomats met to sign an agreement on [FROM.GetName]'s accession to our Socialist bloc."
 hungary_commi.8.a: "Together we are stronger!"

 hungary_commi.9.t: "[FROM.GetName] refuses to join the Alliance"
 hungary_commi.9.d: "[FROM.GetAdjective] government rejected our proposal to unite under a single Socialist Bloc. Perhaps they fear Western pressure, or perhaps they simply don't share our ideals."
 hungary_commi.9.a: "So, okay"

 hungary_commi.10.t: "The question of the restoration of AVH"
 hungary_commi.10.d: "Államvédelmi Hatóság (AVH) was the state security service in the Second Hungarian Republic and the Hungarian People's Republic, which existed from 1945 to 1956. It was disbanded after the Hungarian Uprising of 1956. After the restoration of socialist rule in the country, the question of reviving this structure arose."
 hungary_commi.10.a: "We are restoring the AVH"
 hungary_commi.10.b: "We will establish a TEK with greater powers"

 hungary_commi.11.t: "Hungary wants to buy our weapons"
 hungary_commi.11.d: "The Hungarian government has approached us with a proposal. They wish to purchase our weapons to modernize their army. An agreement will increase our influence in Central Europe and strengthen ties with our Hungarian friends."
 hungary_commi.11.a: "We will sell them weapons."
 hungary_commi.11.b: "We will not throw weapons around"

 hungary_commi.12.t: "Russia sells us weapons"
 hungary_commi.12.d: "Russia has expressed interest in selling us their weapons. This will strengthen our military and be much cheaper than producing our own weapons, which will positively impact our policy of reducing military spending."
 hungary_commi.12.a: "Gratitude to the Russian brothers"

 hungary_commi.13.t: "Russia refused to sell us weapons"
 hungary_commi.13.d: "The Russian government refused to sell us weapons. Well, at least we'll be able to save on military expenses."
 hungary_commi.13.a: "So, no need"