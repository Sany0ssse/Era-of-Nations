 #Structures
 HUN_agency_create: "Establishment of the Hungarian Agency"
 HUN_agency_create_desc: "The post-Cold War security landscape demands a unified intelligence apparatus. We will consolidate scattered directorates into a single national agency capable of coordinating counterintelligence, cyber operations, and liaison work with our allies."
 HUN_national_police_hun: "National Police"
 HUN_national_police_hun_desc: "Modern crime, terrorism, and corruption require a reformed Rendőrség. Centralized procurement, new training standards, and upgraded communications will turn the force into a reliable pillar of domestic security."
 HUN_constitution_protection_office: "Alkotmányvédelmi Hivatal"
 HUN_constitution_protection_office_desc: "Safeguarding the constitutional order falls to the AH. Expanding its mandate and investigative resources will let it counter extremist plots and foreign subversion before they metastasize."
 HUN_NBSZ: "Nemzetbiztonsági Szolgálat"
 HUN_NBSZ_desc: "The military intelligence service must be rebuilt for the 21st century. New surveillance suites, joint training, and an expanded analyst corps will keep our armed forces informed about threats in the neighborhood."
 HUN_NVS: "Nemzeti Védelmi Szolgálat"
 HUN_NVS_desc: "Creating the National Defense Service fuses anti-corruption policing with military counterintelligence, shielding procurement, bases, and classified programs from criminal capture."
 HUN_informacios_hivatal: "Információs Hivatal"
 HUN_informacios_hivatal_desc: "The intelligence office responsible for foreign collection will be given diplomatic cover, modern SIGINT nodes, and analytic exchanges so Budapest can anticipate crises beyond our borders."
 HUN_anti_terror: "Terrorelhárítási Közpon"
 HUN_anti_terror_desc: "Hungary needs a dedicated counter-terror command to respond rapidly to hostage crises or mass attacks. Equipping TEK with aviation assets, breaching tools, and legal authority will deter would-be militants."

 #Foreign Politic
 HUN_foreign_policy_of_hungary: "Foreign Policy of Hungary"
 HUN_foreign_policy_of_hungary_desc: "Budapest must pick a posture that balances Atlantic commitments, EU ambitions, and hard geographic realities. A comprehensive review of alliances, trade routes, and defense obligations will guide every subsequent diplomatic move."
 HUN_EU_membership_question: "The EU Membership Question"
 HUN_EU_membership_question_desc: "Should Hungary bind itself deeper to Brussels or hedge its bets? A national consultation will weigh sovereignty concerns against the economic and political dividends of EU accession."
 HUN_politics_of_eurooptimism: "Politics of Eurooptimism"
 HUN_politics_of_eurooptimism_desc: "By embracing Euro-Atlantic integration we unlock subsidies, investment, and influence inside the Union. Messaging will stress shared values and the prosperity that flows from open markets."
 HUN_politics_of_euroscepticism: "Politics of Euroscepticism"
 HUN_politics_of_euroscepticism_desc: "Skeptics demand limits on Brussels’ reach. We will champion opt-outs, defend national competencies, and court voters who fear cultural erosion or fiscal overreach."
 HUN_foreign_european_investments: "European Investments"
 HUN_foreign_european_investments_desc: "Touring European capitals with a focused incentive package should attract factories, banks, and logistics firms eager for a foothold in Central Europe."
 HUN_eastern_frontier: "Eastern Frontier"
 HUN_eastern_frontier_desc: "Securing our eastern frontier requires diplomacy as much as troops. Confidence-building missions and joint infrastructure projects will calm the borderlands."
 HUN_china_investment_treaty: "China Investment Treaty"
 HUN_china_investment_treaty_desc: "Signing an investment treaty with Beijing opens the Belt and Road spigots-industrial parks, rail upgrades, and financing in exchange for preferential access."
 HUN_support_iran: "Support Iran"
 HUN_support_iran_desc: "A pragmatic outreach to Tehran can yield discounted hydrocarbons and export opportunities, even if it irks some Western partners."
 HUN_landmark_to_west: "Pro-European position"
 HUN_landmark_to_west_desc: "Reaffirming our Western orientation means joint drills, judicial reforms, and public diplomacy that underline Hungary’s role as a reliable NATO and EU stakeholder."
 HUN_agree_on_cooperation_with_japan: "Agree on Cooperation with Japan"
 HUN_agree_on_cooperation_with_japan_desc: "Japan’s capital and technology can supercharge our manufacturing base. A cooperation pact will highlight automotive, electronics, and green energy ventures."
 HUN_sign_a_friendship_treaty_with_germany: "Sign a Friendship Treaty with Germany"
 HUN_sign_a_friendship_treaty_with_germany_desc: "Berlin remains our top trade partner. A formal friendship treaty will cement political trust, student exchanges, and defense-industrial offsets."
 HUN_referendum_on_NATO_membership: "Referendum on NATO Membership"
 HUN_referendum_on_NATO_membership_desc: "Submitting NATO membership to a referendum risks controversy but grants democratic legitimacy to whichever path we choose."
 HUN_withdraw_from_treaty: "Withdraw From the Treaty"
 HUN_withdraw_from_treaty_desc: "If the people vote to leave NATO, we must manage the fallout—restructuring command ties, renegotiating basing rights, and crafting a stand-alone defense doctrine."
 HUN_condemn_american_imperialism: "Condemn American Imperialism"
 HUN_condemn_american_imperialism_desc: "Issuing a strident denunciation of U.S. interventions will please anti-war constituencies and signal a tilt away from Washington."
 HUN_conduct_exercises_with_Russia: "Conduct Exercises with Russia"
 HUN_conduct_exercises_with_Russia_desc: "Inviting Russian units to train on Hungarian soil deepens military interoperability with Moscow and telegraphs geopolitical realignment."
 HUN_thaw_in_relations_with_serbia: "Thaw in Relations with Serbia"
 HUN_thaw_in_relations_with_serbia_desc: "Resetting ties with Belgrade lowers tensions in Vojvodina and opens space for cross-border trade, energy swaps, and minority protections."
 HUN_remain_loyal_to_alliance: "Remain Loyal to the Alliance"
 HUN_remain_loyal_to_alliance_desc: "Doubling down on NATO obligations-deployments, spending, and intelligence sharing-reassures allies that Hungary is a dependable partner."
 HUN_invasion_of_iraq: "Support the Invasion of Iraq"
 HUN_invasion_of_iraq_desc: "Committing logistics or combat units to the U.S.-led coalition in Iraq would grant us favor in Washington but risk domestic backlash."
 HUN_conduct_military_exercises_with_US: "Conduct Military Exercises with the United States"
 HUN_conduct_military_exercises_with_US_desc: "Joint maneuvers with U.S. forces will sharpen the Honvédség while giving us insight into modern NATO tactics."
 HUN_get_closer_to_poland: "Get Closer to Poland"
 HUN_get_closer_to_poland_desc: "Deepening Visegrád cooperation with Warsaw expands our influence in Brussels and creates a united Central European voting bloc."
 HUN_conduct_military_exercises_with_NATO: "Conduct Military Exercises with the NATO"
 HUN_conduct_military_exercises_with_NATO_desc: "Hosting rotating NATO exercises improves readiness and signals that Hungary is ready to shoulder collective defense burdens."
 HUN_purchase_of_german_tanks: "Purchase of German tanks"
 HUN_purchase_of_german_tanks_desc: "Leopard acquisitions would modernize our armored corps overnight, aligning logistics with other European operators."
 HUN_exercises_with_British_navy: "Exercises with the British Navy"
 HUN_exercises_with_British_navy_desc: "Despite lacking a blue-water fleet, staff exchanges and simulator training with the Royal Navy can upgrade our riverine and maritime planning."
 HUN_visit_to_moscow: "Visit to Moscow"
 HUN_visit_to_moscow_desc: "A high-profile Moscow visit can unlock energy contracts, investment promises, and coordination on minority issues—if we can navigate Western skepticism."
 HUN_anti_russian_position: "Anti-Russian Position"
 HUN_anti_russian_position_desc: "Taking a hard line against Kremlin adventurism means sanctions enforcement, military readiness, and loud support for threatened neighbors."
 HUN_support_separatism_in_chechnya: "Support Separatism in Chechnya"
 HUN_support_separatism_in_chechnya_desc: "Covert aid to Chechen separatists would cripple relations with Russia but curry favor with certain Western hawks."
 HUN_help_for_ukraine: "Help for Ukraine"
 HUN_help_for_ukraine_desc: "Providing Kyiv with aid, training, or diplomatic cover positions Hungary as a champion of Eastern European sovereignty."
 HUN_coop_with_azer: "Visit to Baku"
 HUN_coop_with_azer_desc: "Courting Azerbaijan secures energy diversification and construction contracts tied to the South Caucasus."
 HUN_support_belarusian_opposition: "Support the Belarusian Opposition"
 HUN_support_belarusian_opposition_desc: "Backing democratic activists in Minsk underscores our commitment to human rights but risks retaliation by Lukashenko’s regime."
 HUN_prepare_for_russian_invasion: "Prepare for Russian Invasion"
 HUN_prepare_for_russian_invasion_desc: "War-gaming, fortifying depots, and pre-positioning reserves are necessary insurance should Russia turn hostile."
 HUN_cooperate_with_kremlin: "Cooperate with the Kremlin"
 HUN_cooperate_with_kremlin_desc: "Conversely, structured cooperation with Moscow on energy, transit, and security seeks to turn Russia from a threat into a partner."
 HUN_economic_partnership_with_CIS: "Economic Partnership with the CIS"
 HUN_economic_partnership_with_CIS_desc: "Tariff reductions and investment promotion across the CIS markets can offset sluggish Western demand for Hungarian exports."
 HUN_bringing_closer_ties_to_EAEU: "Bringing Closer ties to the EAEU"
 HUN_bringing_closer_ties_to_EAEU_desc: "Observer status and customs facilitation with the Eurasian Economic Union provide leverage in trade talks with Brussels."
 HUN_sign_defense_pact_with_CSTO: "Sign a Defense Pact with the CSTO"
 HUN_sign_defense_pact_with_CSTO_desc: "An unprecedented security pact with CSTO members would flip Hungary's strategic orientation and grant access to Russian kit."
 HUN_question_of_membership_in_CSTO: "The Question of Membership in the CSTO"
 HUN_question_of_membership_in_CSTO_desc: "Should we go even further and apply for CSTO membership? A defense white paper will outline benefits and existential risks."
 HUN_joint_exercises_with_russia: "Joint Exercises with Russia"
 HUN_joint_exercises_with_russia_desc: "Scheduling recurring joint drills with Russian formations keeps channels open and helps our officers understand Eastern doctrine."
 HUN_preservation_of_western_values: "Preservation of Western Values"
 HUN_preservation_of_western_values_desc: "Despite our stance on European integration, we remain committed to Western democratic values and principles. We will maintain our cultural and political alignment with the West while asserting our national sovereignty."
 HUN_treaty_of_friendship_with_turkey: "Treaty of Friendship with Turkey"
 HUN_treaty_of_friendship_with_turkey_desc: "Strengthening diplomatic and economic ties with Turkey opens new opportunities for trade, energy cooperation, and regional stability. A friendship treaty will cement our relationship with this important regional partner."
 HUN_cooperation_with_indonesia: "Cooperation with Indonesia"
 HUN_cooperation_with_indonesia_desc: "Expanding our diplomatic reach to Southeast Asia, we will establish cooperation agreements with Indonesia, focusing on trade, investment, and cultural exchange in this rapidly growing region."
 HUN_joint_research_with_kazakhstan: "Joint Research with Kazakhstan"
 HUN_joint_research_with_kazakhstan_desc: "Partnering with Kazakhstan on scientific and technological research projects will enhance our capabilities in energy, agriculture, and industrial development while strengthening ties with Central Asia."
 HUN_invite_korean_workers: "Invite Korean Workers"
 HUN_invite_korean_workers_desc: "Welcoming skilled workers from Korea will help address labor shortages in key sectors and facilitate technology transfer, boosting our industrial and technological capabilities."
 HUN_strengthening_ties_with_the_visegrad_group: "Strengthening Ties with the Visegrad Group"
 HUN_strengthening_ties_with_the_visegrad_group_desc: "Deepening cooperation within the Visegrad Group will amplify our voice in European affairs and create a united front for Central European interests in Brussels."
 HUN_arab_oil_treaty: "Arab Oil Treaty"
 HUN_arab_oil_treaty_desc: "Securing favorable oil supply agreements with Arab nations will diversify our energy sources and reduce dependence on any single supplier, enhancing our energy security."
 HUN_attract_south_korean_companies: "Attract South Korean Companies"
 HUN_attract_south_korean_companies_desc: "Offering incentives to South Korean corporations will bring advanced technology, manufacturing expertise, and investment to Hungary, strengthening our economic ties with East Asia."
 HUN_trade_agreement_with_taiwan: "Trade Agreement with Taiwan"
 HUN_trade_agreement_with_taiwan_desc: "Establishing a comprehensive trade agreement with Taiwan will open access to high-tech products and create opportunities for Hungarian exports in the Asian market."
 HUN_indian_investments: "Indian Investments"
 HUN_indian_investments_desc: "Attracting investment from India's growing economy will bring capital, technology, and business opportunities, further diversifying our economic partnerships in Asia."
 HUN_open_british_universities: "Open British Universities"
 HUN_open_british_universities_desc: "Facilitating student exchanges and academic cooperation with British universities will enhance our educational system and strengthen cultural ties with the United Kingdom."
 HUN_french_investments: "French Investments"
 HUN_french_investments_desc: "Encouraging French companies to invest in Hungary will bring capital, expertise, and strengthen our economic relationship with one of Europe's largest economies."
 HUN_joint_exercises_with_us: "Joint Exercises with the United States"
 HUN_joint_exercises_with_us_desc: "Conducting joint military exercises with American forces will improve interoperability, enhance our defense capabilities, and demonstrate our commitment to the NATO alliance."
 HUN_attract_american_investments: "Attract American Investments"
 HUN_attract_american_investments_desc: "Promoting Hungary as an investment destination for American companies will bring capital, technology, and jobs while strengthening our economic ties with the United States."
 HUN_receive_USAID_agents: "Receive USAID Agents"
 HUN_receive_USAID_agents_desc: "Welcoming USAID assistance programs will provide development aid, technical expertise, and support for various sectors, strengthening our partnership with the United States."
 HUN_establish_american_units_in_hungary: "Establish American Units in Hungary"
 HUN_establish_american_units_in_hungary_desc: "Hosting American military units will enhance our defense capabilities, strengthen NATO's presence in Central Europe, and deepen our security cooperation with the United States."
 HUN_suppress_the_influence_of_east: "Suppress the Influence of the East"
 HUN_suppress_the_influence_of_east_desc: "Taking measures to counter Eastern influence will protect our sovereignty, maintain our Western orientation, and ensure that our foreign policy remains aligned with democratic values."
 HUN_buy_american_tanks: "Buy American Tanks"
 HUN_buy_american_tanks_desc: "Acquiring American main battle tanks will modernize our armored forces, improve interoperability with NATO allies, and demonstrate our commitment to collective defense."
 HUN_hungarian_ukrainian_cooperation: "Hungarian-Ukrainian Cooperation"
 HUN_hungarian_ukrainian_cooperation_desc: "Deepening cooperation with Ukraine will strengthen regional stability, support Ukrainian sovereignty, and create opportunities for economic and cultural exchange."
 HUN_friendship_with_georgia: "Friendship with Georgia"
 HUN_friendship_with_georgia_desc: "Building a strong friendship with Georgia will support its territorial integrity, enhance regional security, and create opportunities for trade and cooperation in the Caucasus."
 HUN_send_peacekeepers_to_moldova: "Send Peacekeepers to Moldova"
 HUN_send_peacekeepers_to_moldova_desc: "Contributing peacekeeping forces to Moldova will help stabilize the region, support conflict resolution efforts, and demonstrate our commitment to regional security."
 HUN_trade_agreement_with_belarus: "Trade Agreement with Belarus"
 HUN_trade_agreement_with_belarus_desc: "Establishing a trade agreement with Belarus will open new markets for Hungarian goods, secure access to Belarusian resources, and strengthen economic ties in Eastern Europe."
 HUN_arm_transnistria: "Arm Transnistria"
 HUN_arm_transnistria_desc: "Providing military support to Transnistria will strengthen its defense capabilities and demonstrate our commitment to supporting our partners in the region."
 HUN_economic_partnership_with_CIS_tt: "The opinion of all CIS members is at least 50"

