 HUN_commi_category: "Foreign policy of the Hungarian Socialist Republic"
 HUN_commi_category_desc: "Only a short time has passed since the fall of Communism in our country, and now the flame of revolution has once again been lit in the very heart of Europe. But we must not stop there; we must carry our flame forward, passing it on to the proletarians of all countries, in order to build a communist paradise on our planet.\n\n\n\n\n\n£GFX_HUN_commi_picture_category\n\n\n\n\n\n\n\n\n"
