 #Hungary Economy Events
 hungary_economy.1.t: "Hungary Seeks Economic Investment"
 hungary_economy.1.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with a request for economic investment in their struggling economy. Budapest argues that foreign capital is essential for modernizing their infrastructure, creating jobs, and stimulating growth. They promise favorable terms and potential returns on investment, while also offering to strengthen diplomatic ties between our nations."
 hungary_economy.1.a: "Invest in Hungary's economy"
 hungary_economy.1.b: "Decline the investment opportunity"

 hungary_economy.2.t: "Investment Accepted"
 hungary_economy.2.d: "[FROM.GetNameDef] has agreed to invest in [HUN.GetNameDef]'s economy. The foreign capital will help modernize our infrastructure, create employment opportunities, and stimulate economic growth. This partnership strengthens our diplomatic relations and opens new avenues for cooperation."
 hungary_economy.2.a: "Excellent news for our economy"

 hungary_economy.3.t: "Investment Declined"
 hungary_economy.3.d: "[FROM.GetNameDef] has declined our request for economic investment. While disappointing, this setback will not deter our efforts to modernize and develop our economy through other means. We will continue to seek alternative sources of funding and partnerships."
 hungary_economy.3.a: "We will find other opportunities"

 #IMF Subsidies Event
 hungary_economy.4.t: "IMF Offers Economic Assistance"
 hungary_economy.4.d: "The International Monetary Fund has extended an offer of economic assistance to [HUN.GetNameDef]. This comes at a critical time as our economy faces significant challenges. The IMF has proposed several forms of support that could help stabilize our financial situation and promote economic growth. We must carefully consider which option best serves our national interests."
 hungary_economy.4.a: "Accept direct financial assistance"
 hungary_economy.4.b: "Request debt relief instead"
 hungary_economy.4.c: "Accept long-term economic support"

 #Investment Opportunity (Second Round)
 hungary_economy.5.t: "Another Investment Opportunity"
 hungary_economy.5.d: "[HUN.GetNameDef] has once again approached [This.GetNameDef] seeking economic investment. This time, they are offering more modest terms but with a focus on infrastructure development. Budapest emphasizes the potential for mutual benefit and the strengthening of bilateral relations through economic cooperation."
 hungary_economy.5.a: "Invest in Hungarian infrastructure"
 hungary_economy.5.b: "Decline this investment opportunity"

 #Investment Accepted (Second Round)
 hungary_economy.6.t: "Infrastructure Investment Accepted"
 hungary_economy.6.d: "[FROM.GetNameDef] has agreed to invest in [HUN.GetNameDef]'s infrastructure development. This investment will help modernize our transportation networks and improve connectivity across the country. The foreign capital will create jobs and stimulate local economic activity while strengthening our diplomatic ties."
 hungary_economy.6.a: "This will boost our infrastructure"

 #Investment Declined (Second Round)
 hungary_economy.7.t: "Infrastructure Investment Declined"
 hungary_economy.7.d: "[FROM.GetNameDef] has declined our request for infrastructure investment. While this is disappointing, we remain committed to modernizing our transportation networks through other means. We will continue to seek alternative funding sources and partnerships for our development projects."
 hungary_economy.7.a: "We will find other funding sources"

 #Hungarian Agriculture Trade
 hungary_economy.8.t: "Hungarian Agricultural Products Available"
 hungary_economy.8.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with an offer to supply high-quality agricultural products. Hungary's fertile plains and traditional farming methods produce excellent crops including wheat, corn, and various vegetables. This trade agreement would provide us with reliable access to quality food products while supporting Hungarian farmers and strengthening our economic relationship."
 hungary_economy.8.a: "Purchase Hungarian agricultural products"
 hungary_economy.8.b: "Decline the agricultural trade offer"

 #Hungarian Agriculture Trade Accepted
 hungary_economy.9.t: "Agricultural Trade Agreement Signed"
 hungary_economy.9.d: "[FROM.GetNameDef] has agreed to purchase Hungarian agricultural products. This trade agreement will provide us with a steady market for our crops and livestock, supporting our farming communities and boosting our agricultural sector. The partnership strengthens our economic ties and ensures food security for our trading partner."
 hungary_economy.9.a: "A beneficial partnership for our farmers"

 #Hungarian Agriculture Trade Declined
 hungary_economy.10.t: "Agricultural Trade Offer Declined"
 hungary_economy.10.d: "[FROM.GetNameDef] has declined our offer to supply agricultural products. While this is disappointing for our farming sector, we will continue to seek other markets for our high-quality crops and livestock. Our agricultural industry remains strong and we will find alternative trading partners."
 hungary_economy.10.a: "We will find other markets"

 #Hungarian Metallurgy Investment
 hungary_economy.11.t: "Investment in Hungarian Metallurgy"
 hungary_economy.11.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with a proposal for significant investment in their metallurgical industry. Hungary seeks to modernize and expand its steel production capabilities, which would create jobs, boost exports, and strengthen the country's industrial base. This investment opportunity promises substantial returns and would establish a strong industrial partnership between our nations."
 hungary_economy.11.a: "Invest in Hungarian metallurgy"
 hungary_economy.11.b: "Decline the metallurgy investment"

 #Hungarian Metallurgy Investment Accepted
 hungary_economy.12.t: "Metallurgy Investment Accepted"
 hungary_economy.12.d: "[FROM.GetNameDef] has agreed to invest in [HUN.GetNameDef]'s metallurgical industry. This substantial investment will modernize our steel production facilities, create numerous employment opportunities, and significantly boost our industrial output. The partnership will strengthen our economy and establish Hungary as a key player in the regional steel market."
 hungary_economy.12.a: "This will modernize our steel industry"

 #Hungarian Metallurgy Investment Declined
 hungary_economy.13.t: "Metallurgy Investment Declined"
 hungary_economy.13.d: "[FROM.GetNameDef] has declined our request for investment in the metallurgical industry. While this is disappointing for our steel sector, we remain committed to modernizing our industrial capabilities through other means. We will continue to seek alternative investors and funding sources for our metallurgy expansion plans."
 hungary_economy.13.a: "We will find other investors"

 #German Steel Export Trade
 hungary_economy.14.t: "German Steel Export Opportunity"
 hungary_economy.14.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with a proposal to export high-quality steel products to Germany. Hungary's metallurgical industry has been modernized and is now capable of producing steel that meets German industrial standards. This trade agreement would provide us with access to the lucrative German market while strengthening our economic ties with one of Europe's largest economies."
 hungary_economy.14.a: "Accept the steel export agreement"
 hungary_economy.14.b: "Decline the steel export offer"

 #German Steel Export Accepted
 hungary_economy.15.t: "Steel Export to Germany Approved"
 hungary_economy.15.d: "[FROM.GetNameDef] has agreed to import Hungarian steel products. This trade agreement will provide us with a valuable market for our metallurgical output, boosting our steel industry and creating jobs in our manufacturing sector. The partnership strengthens our economic relationship with Germany and establishes Hungary as a reliable supplier of quality steel products."
 hungary_economy.15.a: "This will boost our steel exports"

 #German Steel Export Declined
 hungary_economy.16.t: "Steel Export Offer Declined"
 hungary_economy.16.d: "[FROM.GetNameDef] has declined our offer to export steel products. While this is disappointing for our metallurgical industry, we will continue to seek other markets for our high-quality steel. Our steel production capabilities remain strong and we will find alternative trading partners for our products."
 hungary_economy.16.a: "We will find other steel markets"

 #Russian Oil Export Trade
 hungary_economy.17.t: "Russian Oil Export Opportunity"
 hungary_economy.17.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with a proposal to facilitate oil exports from Russia. Hungary seeks to act as a transit hub for Russian oil, which would provide us with valuable transit fees and strengthen our energy security. This arrangement would also enhance our strategic position in the regional energy market and create new economic opportunities."
 hungary_economy.17.a: "Accept the oil transit agreement"
 hungary_economy.17.b: "Decline the oil export proposal"

 #Russian Oil Export Accepted
 hungary_economy.18.t: "Oil Transit Agreement Approved"
 hungary_economy.18.d: "[FROM.GetNameDef] has agreed to the oil transit arrangement through Hungary. This agreement will provide us with significant transit fees and strengthen our position in the European energy market. The partnership enhances our energy security and creates new economic opportunities while establishing Hungary as an important energy transit hub."
 hungary_economy.18.a: "This will enhance our energy position"

 #Russian Oil Export Declined
 hungary_economy.19.t: "Oil Export Proposal Declined"
 hungary_economy.19.d: "[FROM.GetNameDef] has declined our proposal for oil transit through Hungary. While this is disappointing for our energy sector, we will continue to seek other opportunities to strengthen our position in the regional energy market. Our strategic location and infrastructure remain valuable assets for future energy partnerships."
 hungary_economy.19.a: "We will find other energy opportunities"

 #Chinese Light Metals Export
 hungary_economy.20.t: "Chinese Light Metals Export Opportunity"
 hungary_economy.20.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with a proposal to export light metals, particularly aluminum, to China. Hungary's growing metallurgical capabilities allow us to produce high-quality aluminum products that could find a strong market in China's rapidly expanding industrial sector. This trade agreement would open new markets for our metal products and strengthen our economic ties with Asia's largest economy."
 hungary_economy.20.a: "Accept the light metals export deal"
 hungary_economy.20.b: "Decline the aluminum export offer"

 #Chinese Light Metals Export Accepted
 hungary_economy.21.t: "Light Metals Export to China Approved"
 hungary_economy.21.d: "[FROM.GetNameDef] has agreed to import Hungarian light metals, particularly aluminum products. This trade agreement will provide us with access to China's vast industrial market, boosting our metallurgical exports and creating new opportunities for our aluminum industry. The partnership strengthens our economic ties with Asia and establishes Hungary as a reliable supplier of quality metal products."
 hungary_economy.21.a: "This will expand our Asian markets"

 #Chinese Light Metals Export Declined
 hungary_economy.22.t: "Light Metals Export Offer Declined"
 hungary_economy.22.d: "[FROM.GetNameDef] has declined our offer to export light metals to China. While this is disappointing for our metallurgical industry, we will continue to seek other markets for our aluminum and other light metal products. Our production capabilities remain strong and we will find alternative trading partners in the global market."
 hungary_economy.22.a: "We will find other metal markets"

 #Energy Investment
 hungary_economy.23.t: "Investment in Hungarian Energy Sector"
 hungary_economy.23.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with a proposal for significant investment in their energy sector. Hungary seeks to modernize and expand its energy infrastructure, particularly in synthetic fuel production and renewable energy technologies. This investment would help reduce Hungary's energy dependence, create jobs in the energy sector, and establish a more sustainable energy future. The partnership promises substantial returns and would strengthen our strategic energy cooperation."
 hungary_economy.23.a: "Invest in Hungarian energy infrastructure"
 hungary_economy.23.b: "Decline the energy investment opportunity"

 #Energy Investment Accepted
 hungary_economy.24.t: "Energy Investment Accepted"
 hungary_economy.24.d: "[FROM.GetNameDef] has agreed to invest in [HUN.GetNameDef]'s energy sector. This substantial investment will modernize our energy infrastructure, expand our synthetic fuel production capabilities, and create numerous employment opportunities in the energy industry. The partnership will strengthen our energy security, reduce our dependence on foreign energy sources, and establish Hungary as a leader in sustainable energy production."
 hungary_economy.24.a: "This will secure our energy future"

 #Hungarian Army Events

 hungary_army.1.t: "Hungary's Request to Purchase M1A2"
 hungary_army.1.d: "[HUN.GetNameDef] has officially requested to purchase 120 M1A2 Abrams main battle tanks for $5 billion. The Hungarian side aims to modernize its armored forces and gain access to advanced American military technology. The M1A2 Abrams is considered one of the most capable tanks in the world, combining high firepower, reliable protection, and excellent mobility. Approving this deal will strengthen our military influence in Central Europe and deepen military-technical cooperation with Budapest."
 hungary_army.1.a: "Approve Sale of Abrams Tanks"
 hungary_army.1.b: "Decline Request"

 hungary_army.2.t: "Abrams Tank Purchase Approved"
 hungary_army.2.d: "The purchase of 120 M1A2 Abrams tanks from [USA.GetNameDef] has been approved. These advanced main battle tanks will significantly enhance our armored forces' capabilities. The Abrams tanks feature state-of-the-art armor, powerful armament, and advanced fire control systems that will give our military a substantial advantage on the battlefield. This acquisition represents a major step forward in modernizing our armed forces."
 hungary_army.2.a: "Our armored forces are now formidable"

 hungary_army.3.t: "Abrams Tank Purchase Declined"
 hungary_army.3.d: "We have decided to decline the offer to purchase M1A2 Abrams tanks from [USA.GetNameDef]. While these advanced tanks would have significantly improved our armored capabilities, the cost and maintenance requirements were deemed too burdensome for our current military budget. We will continue to explore other options for modernizing our tank forces."
 hungary_army.3.a: "We will find other solutions"

 hungary_army.4.t: "Hungary's Request to Purchase T-72 Tanks"
 hungary_army.4.d: "[HUN.GetNameDef] has officially requested to purchase 120 T-72 Ural main battle tanks for $5 billion. These reliable Soviet-designed tanks will provide the Hungarian armed forces with proven equipment at a reasonable price. The T-72 Ural is a time-tested tank with good firepower and mobility, and it is easier to maintain compared to more complex Western systems. This sale will strengthen our military influence in Central Europe while maintaining good relations with our Western neighbor."
 hungary_army.4.a: "Approve Sale of T-72 Tanks"
 hungary_army.4.b: "Decline Sale of Tanks"

 hungary_army.5.t: "T-72 Tank Purchase Approved"
 hungary_army.5.d: "The purchase of 120 T-72 Ural tanks from [SOV.GetNameDef] has been approved. These reliable main battle tanks will provide our armored forces with proven military hardware that is cost-effective to operate and maintain. The T-72 Ural's simple design and robust construction make it well-suited for our military's needs, and the acquisition will significantly strengthen our ground forces' capabilities."
 hungary_army.5.a: "Our tank forces are now stronger"

 hungary_army.6.t: "T-72 Tank Purchase Declined"
 hungary_army.6.d: "We have decided to decline the offer to purchase T-72 Ural tanks from [SOV.GetNameDef]. While these tanks would have provided a cost-effective solution for modernizing our armored forces, we have chosen to pursue other options that better align with our military strategy and budget constraints. We will continue to explore alternatives for strengthening our tank forces."
 hungary_army.6.a: "We will explore other options"

 hungary_army.7.t: "Resolving the MiG-29 Issue"
 hungary_army.7.d: "Our air force is facing a critical decision regarding our fleet of MiG-29 Fulcrum fighter aircraft. These Soviet-designed fighters, while capable, are becoming increasingly outdated and expensive to maintain. We have several options to address this situation: we could invest in modernizing the existing aircraft and training our pilots, create a new variant based on the current design, or find a buyer for the aircraft to fund the acquisition of more modern fighters. Each option has different implications for our air force's capabilities and budget."
 hungary_army.7.a: "Take it apart"
 hungary_army.7.b: "Put it into service"
 hungary_army.7.c: "Find a buyer for the MiG-29s"

 hungary_army.8.t: "Purchase of Swedish Sk-60 Aircraft"
 hungary_army.8.d: "[SWE.GetNameDef] has offered to sell 20 Sk-60 training and light attack aircraft to [HUN.GetNameDef] for $5 billion. These versatile Swedish aircraft can serve multiple roles including pilot training, light ground attack, and reconnaissance missions. The Sk-60's simple design and reliable performance make it an excellent choice for our air force's training needs and light combat operations. This purchase would enhance our pilot training capabilities and provide us with additional air assets."
 hungary_army.8.a: "Sold the Sk-60 aircraft"
 hungary_army.8.b: "Decline the aircraft sell"

 hungary_army.9.t: "Sk-60 Aircraft Purchase Approved"
 hungary_army.9.d: "The purchase of 20 Sk-60 aircraft from [SWE.GetNameDef] has been approved. These versatile Swedish aircraft will significantly enhance our air force's training capabilities and provide us with additional light attack and reconnaissance assets. The Sk-60's proven design and multi-role capabilities make it an excellent addition to our air force, and the acquisition will improve our pilot training programs and operational flexibility."
 hungary_army.9.a: "Our air force training will improve"

 hungary_army.10.t: "Sk-60 Aircraft Purchase Declined"
 hungary_army.10.d: "We have decided to decline the offer to purchase Sk-60 aircraft from [SWE.GetNameDef]. While these aircraft would have provided valuable training and light attack capabilities, we have chosen to focus our resources on other priorities within our air force modernization program. We will continue to explore other options for enhancing our pilot training and light aircraft capabilities."
 hungary_army.10.a: "We will find other training solutions"

 hungary_army.11.t: "Sale of MiG-29 Fighter Aircraft"
 hungary_army.11.d: "[HUN.GetNameDef] has offered to sell 20 MiG-29 Fulcrum fighter aircraft to [This.GetNameDef] for $5 billion. These Soviet-designed fighters, while older, are still capable aircraft that could provide a cost-effective way to enhance your air force's capabilities. The MiG-29 offers good maneuverability and firepower, and would be particularly useful for air defense and ground attack missions. This sale would help Hungary fund the acquisition of more modern aircraft while providing you with additional air assets."
 hungary_army.11.a: "Sold the MiG-29 aircraft"
 hungary_army.11.b: "Decline the aircraft sale"

 hungary_army.12.t: "MiG-29 Aircraft Sale Approved"
 hungary_army.12.d: "[FROM.GetNameDef] has agreed to purchase our MiG-29 Fulcrum fighter aircraft. This sale will provide us with valuable funds to invest in more modern aircraft while allowing the buyer to acquire capable fighter aircraft at a reasonable cost. The transaction strengthens our diplomatic relations and demonstrates our commitment to military cooperation. The proceeds from this sale will help us modernize our air force with more advanced aircraft."
 hungary_army.12.a: "This will fund our air force modernization"

 hungary_army.13.t: "MiG-29 Aircraft Sale Declined"
 hungary_army.13.d: "[FROM.GetNameDef] has declined our offer to sell MiG-29 Fulcrum fighter aircraft. While this is disappointing, we understand that different nations have different military priorities and budget constraints. We will continue to seek other potential buyers for our MiG-29 fleet or explore alternative options for modernizing our air force. Our commitment to upgrading our military capabilities remains unchanged."
 hungary_army.13.a: "We will find other solutions"

 #Hungarian Foreign Policy Events
 hungary_foreign.1.t: "The EU Membership Question"
 hungary_foreign.1.d: "The question of European Union membership has become a central issue in Hungarian politics. Supporters argue that EU membership will bring economic benefits, access to European markets, and strengthen Hungary's position in Europe. Opponents fear the loss of national sovereignty and the imposition of foreign values. The debate has divided the nation, and we must decide which path Hungary will take."
 hungary_foreign.1.a: "We should pursue EU membership"
 hungary_foreign.1.b: "We should remain independent from the EU"

 hungary_foreign.2.t: "European Investment Opportunity"
 hungary_foreign.2.d: "[This.GetNameDef] has offered to invest $5 billion in our economy. This investment would help modernize our infrastructure, create jobs, and stimulate economic growth. The European partner promises favorable terms and sees this as an opportunity to strengthen diplomatic and economic ties between our nations. This could be a significant boost to our economy."
 hungary_foreign.2.a: "Accept the European investment"
 hungary_foreign.2.b: "Decline the investment offer"

 hungary_foreign.3.t: "European Investment Accepted"
 hungary_foreign.3.d: "[FROM.GetNameDef] has agreed to invest in [HUN.GetNameDef]'s economy. The European capital will help modernize our infrastructure, create employment opportunities, and stimulate economic growth. This partnership strengthens our diplomatic relations with Europe and opens new avenues for cooperation and trade."
 hungary_foreign.3.a: "This will benefit our economy"

 hungary_foreign.4.t: "Investment in Hungary"
 hungary_foreign.4.d: "[HUN.GetNameDef] has approached us with a substantial investment proposal worth $15 billion. The Chinese offer includes significant capital for infrastructure development, technology transfer, and economic cooperation. This investment could dramatically modernize our economy, but it would also deepen our ties with China and potentially affect our relationships with other nations."
 hungary_foreign.4.a: "Accept the Chinese investment"
 hungary_foreign.4.b: "Decline the Chinese investment"

 hungary_foreign.5.t: "Chinese Investment Accepted"
 hungary_foreign.5.d: "[CHI.GetNameDef] has agreed to invest $15 billion in [HUN.GetNameDef]'s economy. The Chinese capital will help modernize our infrastructure, create employment opportunities, and stimulate economic growth. This partnership strengthens our diplomatic relations with China and opens new avenues for cooperation. Chinese companies will establish operations in Hungary, bringing technology and expertise."
 hungary_foreign.5.a: "This partnership will transform our economy"

 hungary_foreign.6.t: "Chinese Investment Declined"
 hungary_foreign.6.d: "[CHI.GetNameDef] has declined our request for Chinese investment. While this is disappointing, we understand that different nations have different investment priorities and strategic considerations. We will continue to seek alternative sources of funding and partnerships to modernize and develop our economy."
 hungary_foreign.6.a: "We will find other opportunities"

 hungary_foreign.7.t: "Purchase of Iranian Military Equipment"
 hungary_foreign.7.d: "[PER.GetNameDef] has offered to sell military equipment to [HUN.GetNameDef] for $10 billion. The package includes infantry equipment, ballistic missiles, utility vehicles, anti-aircraft systems, and anti-tank weapons. This purchase would significantly enhance our military capabilities, though it may affect our relationships with other nations due to international sanctions and political considerations surrounding Iran."
 hungary_foreign.7.a: "Purchase the Iranian equipment"
 hungary_foreign.7.b: "Decline the equipment purchase"

 hungary_foreign.8.t: "Iranian Equipment Purchase Approved"
 hungary_foreign.8.d: "The purchase of military equipment from [PER.GetNameDef] has been approved. This acquisition will significantly enhance our military capabilities, providing us with infantry equipment, ballistic missiles, utility vehicles, anti-aircraft systems, and anti-tank weapons. The transaction strengthens our diplomatic relations with Iran and demonstrates our commitment to military cooperation, though it may draw criticism from other nations."
 hungary_foreign.8.a: "Our military capabilities will improve"

 hungary_foreign.9.t: "Iranian Equipment Purchase Declined"
 hungary_foreign.9.d: "They have decided to decline the offer to purchase military equipment from [PER.GetNameDef]. While this equipment would have enhanced our military capabilities, they have chosen to focus our resources on other priorities and avoid potential diplomatic complications. We will continue to explore other options for modernizing our armed forces."
 hungary_foreign.9.a: "We will find other suppliers"

 hungary_foreign.10.t: "The NATO Membership Question"
 hungary_foreign.10.d: "The question of NATO membership has become a central issue in Hungarian foreign policy. Supporters argue that NATO membership will guarantee our security, provide access to advanced military technology, and strengthen our position in the international community. Opponents fear entanglement in foreign conflicts and the loss of military independence. The debate has divided the nation, and we must decide which path Hungary will take."
 hungary_foreign.10.a: "We should pursue NATO membership"
 hungary_foreign.10.b: "We should remain independent from NATO"

 hungary_foreign.11.t: "Military Exercises with Hungary"
 hungary_foreign.11.d: "[HUN.GetNameDef] has proposed joint military exercises with [HUN.GetNameDef]. These exercises would involve our armed forces training together, sharing military expertise, and conducting joint operations. This cooperation would enhance our military capabilities, provide valuable experience for our troops, and strengthen our diplomatic relations with Russia. However, it may affect our relationships with NATO and Western nations."
 hungary_foreign.11.a: "Accept the joint military exercises"
 hungary_foreign.11.b: "Decline the military exercises"

 hungary_foreign.12.t: "Russian Military Exercises Approved"
 hungary_foreign.12.d: "The joint military exercises with [SOV.GetNameDef] have been approved. Our armed forces will train together with Russian forces, sharing military expertise and conducting joint operations. This cooperation will enhance our military capabilities, provide valuable experience for our troops, and strengthen our diplomatic relations with Russia. The exercises will improve our command capabilities and military experience across all branches."
 hungary_foreign.12.a: "This will improve our military readiness"

 hungary_foreign.13.t: "Russian Military Exercises Declined"
 hungary_foreign.13.d: "We have decided to decline the offer for joint military exercises with [SOV.GetNameDef]. While these exercises would have provided valuable military experience and enhanced our capabilities, we have chosen to focus on other priorities and maintain our current diplomatic relationships. We will continue to develop our military through other means."
 hungary_foreign.13.a: "We will train independently"

 hungary_foreign.14.t: "Purchase of our Leopard 2A4 Tanks"
 hungary_foreign.14.d: "[HUN.GetNameDef] has offered to purchase 120 Leopard 2A4 main battle tanks for $5 billion. These German tanks are among the most advanced in the world, offering excellent firepower, protection, and mobility. The Leopard 2A4 would significantly enhance our armored forces and provide us with modern, reliable main battle tanks. This deal will strengthen our influence in Central Europe."
 hungary_foreign.14.a: "Sell the Leopard 2A4 tanks"
 hungary_foreign.14.b: "Decline the tank purchase"

 hungary_foreign.15.t: "Leopard 2A4 Tank Purchase Approved"
 hungary_foreign.15.d: "The purchase of 120 Leopard 2A4 main battle tanks from [GER.GetNameDef] has been approved. These advanced German tanks will significantly enhance our armored forces, providing us with modern, reliable main battle tanks that offer excellent firepower, protection, and mobility. The acquisition strengthens our military capabilities and demonstrates our commitment to modernizing our armed forces with high-quality equipment."
 hungary_foreign.15.a: "Our armored forces will be formidable"

 hungary_foreign.16.t: "Leopard 2A4 Tank Purchase Declined"
 hungary_foreign.16.d: "We have decided to decline the offer to purchase Leopard 2A4 tanks from [GER.GetNameDef]. While these tanks would have significantly enhanced our armored forces, we have chosen to focus our resources on other priorities within our military modernization program. We will continue to explore other options for upgrading our tank forces."
 hungary_foreign.16.a: "We will find other solutions"

 hungary_foreign.17.t: "Military Aid from Hungary"
 hungary_foreign.17.d: "[HUN.GetNameDef] has offered to provide military aid to us, including 1200 infantry equipment. This assistance would help us strengthen our defense capabilities. We are grateful to our Hungarian brothers for their help, should we accept their generous offer?"
 hungary_foreign.17.a: "Accept the military aid"
 hungary_foreign.17.b: "Decline the military aid"

 hungary_foreign.18.t: "Ukrainian Military Aid Accepted"
 hungary_foreign.18.d: "[UKR.GetNameDef] has accepted our offer of military aid. We will provide 250 units of infantry equipment to help strengthen Ukraine's defense capabilities. This assistance demonstrates our support for Ukrainian sovereignty and enhances our diplomatic relations with Ukraine. The aid will increase our influence in the region and strengthen our partnership with Ukraine."
 hungary_foreign.18.a: "This strengthens our partnership"

 hungary_foreign.19.t: "Ukrainian Military Aid Declined"
