 #MSZP Focuses
 HUN_socialist_gov: "Socialist Government"
 HUN_socialist_gov_desc: "Orban betrayed our country and our people, which naturally led to his downfall. Now the democratic mandate has been passed to our Hungarian Socialist Party. Our task as the heirs of the reformers is to correct Orbán's mistakes and return the country to the path of democracy and progress."
 HUN_inherit_reform: "Inheritors of the Great Reforms"
 HUN_inherit_reform_desc: "Our party has gone thru a long period from being an instrument of authoritarian communist policy to becoming people's representatives who carried out the democratization of the country and its economy. We, as heirs of the reformers, must continue the path toward a new democratic and capitalist society."
 HUN_euroatlantism: "Euroatlantic Primacy"
 HUN_euroatlantism_desc: "Hungary is an inherently European country and part of European society, even tho our ancestors did not come from Europe. And as part of the great community, we must continue to integrate into Western institutions and deepen relations with Brussels and Washington."
 HUN_return_investors: "Bring Investors Back"
 HUN_return_investors_desc: "Orban's policy of gradual nationalization and turning away from the global market has severely damaged our image among the investment community. To stimulate our economic growth, we will have to work extremely hard to win back Western investors and attract new capital inflows."
 HUN_war_against_nationalism: "War Against Nationalism"
 HUN_war_against_nationalism_desc: "Divisive nationalism threatens the unity of our Hungary, and all because of Fidesz! We will actively combat nationalist rhetoric, promote inclusive patriotism, and work to heal the divisions that have plagued Hungarian politics, and we will not allow Fidesz to return to power."
 HUN_block_orban: "Block Fidesz"
 HUN_block_orban_desc: "Although Fidesz lost the elections, it remains one of the main forces in the National Assembly, which poses a threat to the implementation of our policies. By joining forces with our coalition partners, we can try to block Orban's allies from being appointed to important committees to prevent them from gaining leverages."
 HUN_eu_referendum: "Referendum on Joining the EU"
 HUN_eu_referendum_desc: "The question of European Union membership is central to Hungary's future and is a one of primal goals of our party. We will hold a democratic referendum to let the people decide whether to pursue full EU integration, ensuring the Hungarian people have their say on this critical decision."
 HUN_dont_forget_sovereignity: "A Sovereign Member"
 HUN_dont_forget_sovereignity_desc: "While we embrace European cooperation, we must never forget our sovereignty. We will work within the European framework while maintaining Hungary's independence and ensuring our national interests are protected."
 HUN_on_way_liberal_society: "On the Way to Liberal Society"
 HUN_on_way_liberal_society_desc: "Hungarian society is inherently conservative, which makes any reform difficult and led to Fidesz's victory in the elections. The government will approve a number of measures to allow European NGOs to showcase all the benefits of embracing the values of European society."
 HUN_second_breath_privatisation: "A Second Breath to Privatisation"
 HUN_second_breath_privatisation_desc: "The privatization of state assets will continue, but with greater oversight and transparency. We will ensure that privatization serves the public interest and generates revenue for social programs."
 HUN_gyurcsanomica: "Gyurcsánomy"
 HUN_gyurcsanomica_desc: "Ferenc Gyurcsány is a very flamboyant and controversial figure, a businessman who is also a member of the Socialist Party. Although the Socialist Party is difficult to call very left-wing, his ideas are much more right-wing for the average party member. His wing advocates for spending cuts and maintaining a balanced budget, justifying this by saying that Hungary must first emerge from the economic crisis before increasing social spending. Against the backdrop of a looming economic crisis, his ideas are gaining popularity among members of the Socialist Party."
 HUN_tradition_soc_dem: "Traditional Approach"
 HUN_tradition_soc_dem_desc: "The idea that social spending needs to be cut to achieve economic success is still wild for the Socialist Party, even tho we can hardly be called very left-wing. The state should prioritize the well-being of its citizens over budget balance. If we continue to allocate spending to the social sector even despite a budget deficit, financially strengthened citizens will offset all the negatives with their vigorous economic activity in the long run. We will continue to be inspired by the ideas of Keynesianism and classical social democrats."
 HUN_ausrerity_measures: "Gyurcsány Package"
 HUN_ausrerity_measures_desc: "The treasury is emptying, and the financial crisis is forcing more and more spending on the social sector, healthcare, and education. In the long term, Hungary could go bankrupt, putting us in debt and becoming the first failed state in Europe. We will have to announce austerity measures even despite possible protests and unrest."
 HUN_unformal_powers: "Unchecked Powers"
 HUN_unformal_powers_desc: "We love our democracy and respect the system of checks and balances, but the raging financial crisis makes it clear that in an emergency, restrictions create more problems than they solve. Our government will exploit various loopholes in the law to make the process of implementing laws faster and more efficient."
 HUN_stimulate_purchase_power: "Introduce the Stimulus Checks"
 HUN_stimulate_purchase_power_desc: "Putting money directly into the hands of citizens will stimulate economic activity. We will distribute stimulus checks to boost purchasing power and help families weather economic difficulties."
 HUN_reduce_speed_privatisation: "Cooldown the Privatisation"
 HUN_reduce_speed_privatisation_desc: "The rapid pace of privatization has created economic instability. We will slow down the process, ensuring better oversight and protecting strategic assets from falling into the wrong hands."
 HUN_rollback_reform: "Override Orban's Mistakes"
 HUN_rollback_reform_desc: "Although Orban advocated for a balanced deficit, his populist policies actually contributed to the massive deficit we have now. We'll have to roll back most of his social reforms."
 HUN_between_rus_eu: "The Middle Man"
 HUN_between_rus_eu_desc: "Hungary's strategic position allows us to serve as a bridge between Russia and the European Union. We will maintain balanced relationships with both, using our position to secure favorable terms and promote regional stability."
 HUN_integrate_vishegrad_eurozone: "Bring the Visegrad into Euro Zone"
 HUN_integrate_vishegrad_eurozone_desc: "The Visegrad Group countries must work together to join the Eurozone. We will coordinate with our regional partners to ensure a smooth transition and strengthen Central European integration."
 HUN_end_stigmatisation: "Crack Down on Stigmatisation and Oppression"
 HUN_end_stigmatisation_desc: "Discrimination and stigmatization have no place in modern Hungary. We will implement comprehensive anti-discrimination policies, protect vulnerable groups, and ensure all citizens are treated with dignity and respect."
 HUN_reform_labour_code: "Overhaul the Labor Code"
 HUN_reform_labour_code_desc: "During the transition to a market economy, we had to remove some quite progressive practices in labor law in order to gain the trust of foreign investors. It's time to bring back these practices so that Western corporations can no longer exploit Hungarians, and also to stimulate productivity."
 HUN_government_care: "Government Cares About You!"
 HUN_government_care_desc: "There is no one in Hungary who cares more about Hungarians than the Hungarian government. The well-being of citizens directly impacts the country's economic performance, and it is vital for the government to ensure a high standard of living. The government does care about the country, which is why the government cares about you!"
 HUN_people_transition: "Economical Transition"
 HUN_people_transition_desc: "Although the country didn't go thru the painful path of shock therapy like our neighbors, we are still dealing with the consequences of the transition. The current wild market economy is only harming Hungary, so the government will have to start the process of a new transition, but this time to a socially oriented market."
 HUN_national_devolution: "Introduce the National Devolution Plan"
 HUN_national_devolution_desc: "A centralized government cannot effectively meet the needs of people at the local level, and the current system of municipalities is too dependent on the center. We will develop a plan for the gradual transfer of some financial and political powers to the local level of government to reduce dependence on the center and ensure even economic development."
 HUN_comfotable_hungary: "Affordable and Comfortable Hungary"
 HUN_comfotable_hungary_desc: "Thanks to the new system of local self-government, the issue of housing ownership has been resolved. We will develop a joint program to build thousands of new homes together with municipalities and provide new residential complexes with high-quality development and high-speed internet."
 HUN_progressive_society: "Progressive European Society"
 HUN_progressive_society_desc: "Hungary will become a truly progressive society, embracing European values of tolerance, equality, and individual freedom. We will break down barriers and create opportunities for all."
 HUN_european_education: "European Standards of Education"
 HUN_european_education_desc: "Our education system must meet European standards. We will invest in schools, improve teacher training, and ensure our children receive a world-class education that prepares them for the future."
 HUN_crush_chirch_influence: "Crush the Church Influence"
 HUN_crush_chirch_influence_desc: "Religious institutions have exerted undue influence over state policy. We will separate church and state, ensuring that government decisions are made on secular grounds and serve all citizens regardless of faith."
 HUN_progressive_taxation: "Introduce the Justful Tax System"
 HUN_progressive_taxation_desc: "A fair tax system requires those who can afford it to pay their fair share. We will implement progressive taxation, ensuring that the wealthy contribute proportionally more while reducing the burden on working families."
 HUN_professionalise_gov_property: "Government Property that Serves the People"
 HUN_professionalise_gov_property_desc: "State-owned enterprises and property must serve the public interest. We will professionalize the management of government assets, ensuring they operate efficiently and provide quality services to citizens."
 HUN_end_privatisation_epoch: "The End of Privatisation Epoch"
 HUN_end_privatisation_epoch_desc: "The era of selling off national assets must come to an end. We will halt further privatization and focus on making state-owned enterprises work better for the Hungarian people."
 HUN_victory_over_oppression: "Victory Over Conservatism and Nationalism"
 HUN_victory_over_oppression_desc: "Conservative and nationalist policies have failed the Hungarian people. We will chart a new course based on progressive values and social justice, ensuring that the economy serves people rather than the other way around."
 HUN_trully_socialist_party: "Ideal Socialist Party"
 HUN_trully_socialist_party_desc: "Finally, we were able to justify the word 'Socialist' in our party's name. Economic policies based on Keynesian ideas and the integration of European educational standards have transformed Hungary into a country of thriving social democracy and a progressive European society. Its example should be instructive for Central European countries. MSZP became true socialist and democratic party."
 HUN_recognixe_minorities: "Empower the Minorities"
 HUN_recognixe_minorities_desc: "Hungary's minorities are an integral part of our society. We will strengthen their rights, protect their cultures, and ensure they have full participation in Hungarian political and social life."
 HUN_refresh_local_governance: "Refresh the Local Governance"
 HUN_refresh_local_governance_desc: "Local governments need renewal. We will clean up corruption, improve efficiency, and ensure that local authorities truly serve their communities and are accountable to their citizens."
 HUN_updated_people_constitution: "Truly People's Constitution"
 HUN_updated_people_constitution_desc: "Our constitution must truly reflect the will and values of the Hungarian people. We will draft a new constitution that protects individual rights, ensures democratic governance, and establishes a framework for a just and prosperous society."
 HUN_care_for_yourselves: "Society of Self-care"
 HUN_care_for_yourselves_desc: "Responsibility for the well-being of citizens cannot rest solely on the state; our budget is not bottomless. The population needs to accept the fact that during an economic crisis, no one will help them except themselves. We are obliged to encourage the population to manage their finances wisely; we must give them a fishing rod, not a fish."
 HUN_european_living_wage: "European Level of Living Wage"
 HUN_european_living_wage_desc: "Although we promote the idea of self-sufficiency, no one gave the population money for it; after all, you have to give them half a fish first and then the fishing rod. We will raise the minimum wage to the European level so that the population has at least some means for savings and consumption."
 HUN_crush_socialist_faction: "Crush the Left Faction"
 HUN_crush_socialist_faction_desc: "The left wing of the party has been plotting for a long time to oust us and squander the entire country's budget again. They simply can't understand that a policy of endless spending will destroy Hungary and plunge it into debt. We will have to resort to stricter methods within the party's policy to prevent an internal revolt from occurring."
 HUN_package_neoliberal_reform: "Red-Colored Neoliberal Reforms"
 HUN_package_neoliberal_reform_desc: "Thanks to intra-party consensus, we will finally be able to pass the much-needed economic reform package thru the National Assembly, without which our policy has been meaningless until now. We will reduce state regulation, create conditions for further privatization, and completely exclude any instrument for large-scale nationalizations. We will create a new system of medical and social insurance thru sovereign extra-budgetary funds to reduce state costs. At the same time, all these reforms will not destroy the welfare state system, but simply make it more efficient and less costly. The left-wing opposition calls it a package of red-colored neoliberal reforms, but we don't mind that name either."
 HUN_reform_midicine_funding_scheme: "Introduce the New Healthcare Fund System"
 HUN_reform_midicine_funding_scheme_desc: "As part of the economic reform package, an extrabudgetary fund for medical insurance will be established. The fund will be allowed to invest in low-risk assets to increase its existing funds, and it will also receive funds from the budget. All these funds will go toward covering the costs of free health insurance and subsidizing paid medical services."
 HUN_commercialise_government_property: "Commercialise the Government Property"
 HUN_commercialise_government_property_desc: "The plan for the transformation of state property is the cornerstone of economic reform. The government is reorganizing state-owned companies into joint-stock companies with state participation, and a final major privatization of loss-making assets will also be carried out. All of this should bring in additional income and increase property management efficiency."
 HUN_anti_inflation_policy: "Anti-Inflationary Policies"
 HUN_anti_inflation_policy_desc: "Runaway inflation threatens the economic stability of Hungarian families. We will implement strict monetary and fiscal policies to control inflation and protect the purchasing power of our citizens."
 HUN_increase_corp_tax: "Introduce the Corporate Tax"
 HUN_increase_corp_tax_desc: "We have created excellent conditions for business to thrive; now it's time to repay the debt. We will introduce a tax on multinational corporations to provide additional funds for the budget, but this tax will not burden their activities and its rate will be quite acceptable for corporations. This way we will find sources of income and appease investors."
 HUN_support_euro_federalism: "Support the Euro-Federalism"
 HUN_support_euro_federalism_desc: "European integration must deepen. We will support moves toward a more federal Europe, believing that greater unity will benefit all Europeans, including Hungarians, through shared prosperity and security."
 HUN_financial_capital: "Financial Capital of Central Europe"
 HUN_financial_capital_desc: "Budapest can become Central Europe's premier financial center. We will develop our financial sector, attract international banks and investment firms, and position Hungary as the region's economic hub."
 HUN_support_small_medium_business: "Business Support Plan"
 HUN_support_small_medium_business_desc: "Small and medium enterprises are the backbone of our economy. We will provide targeted support, including tax breaks, loans, and business services, to help these businesses grow and create jobs."
 HUN_true_third_way: "The Third Way for Hungary"
 HUN_true_third_way_desc: "The reformers' fault in the 1990s was their overly aggressive reforms, while the left's mistake was their overconfidence that long-term development in citizens' well-being would offset the excessive deficit. All of these errors are absent from our path; we completely support market changes and are not opposed to guaranteeing the welfare of citizens, but we believe that everything should be done with moderation and realism. Finding a third path in the economy is necessary given the current circumstances, and our government has done a fantastic job of handling this."

 #MSZP Events
 hungary_hsp.0.t: "The Appointemnt of [HUN.GetLeader]'s' Government"
 hungary_hsp.0.d: "The National Assembly has approved the appointment of a MSZP government under the leadership of [HUN.GetLeader] and now, the country's recovery is now entirely in his hands. The government will have to chart the course for further economic recovery from the reforms of the nineties, and also avoid making a complete mess of things so that Fidesz and Orban don't return to power again. Joining the European Union also remains an important task for [HUN.GetLeader], which was part of the Socialist Party's program. The new government must also balance between the interests of different platforms inside the party to ensure stability."
 hungary_hsp.0.a: "The second chance for MSZP!"

 hungary_hsp.1.t: "Parliamentary Battles"
 hungary_hsp.1.d: "A real struggle for committees has unfolded between the parliamentary opposition and the coalition. Together with our allies, we prevented the Orbánists from taking the vice-chairmanship of the National Security Committee and the chairmanship of the Economic Committee. Although we didn't manage to secure leadership positions in some committees, we still prevented Fidesz and their cronies from taking the most important positions."
 hungary_hsp.1.a: "We won the battle but not the war"

 hungary_hsp.2.t: "Referendum on Joining the EU"
 hungary_hsp.2.d: "The Hungarian people have spoken in the referendum on European Union membership. A majority has voted in favor of joining the EU, recognizing the economic and political benefits that membership will bring. This decision will fundamentally alter Hungary's relationship with Europe and open new opportunities for trade, investment, and cooperation."
 hungary_hsp.2.a: "We join the European family"

 hungary_hsp.3.t: "Gyurcsány's Government"
 hungary_hsp.3.d: "Instability within the Socialist Party led to Ferenc Gyurcsány, one of the most controversial members of the MSZP, winning the internal party elections. As one of the wealthiest people in Hungary and a former businessman, his figure has been heavily criticized by his party colleagues, and his ideas are particularly controversial. Gyurcsány's Platform within the MSZP supports austerity policies and cuts in social spending to achieve budget balance, and his supporters also advocate from a neoliberal policy perspective.\nThe vote in the Assembly went smoothly, and now Gyurcsány has a chance to completely restructure the Hungarian economy and establish a budget balance."
 hungary_hsp.3.a: "Gyurcsánomy begins now!"

 hungary_hsp.4.t: "Left Factions Affirm their Grip"
 hungary_hsp.4.d: "Coalition which consists of the Left-wing Coalition Platform, Socialist Platform and Association for Social Democratic Values Platform within the MSZP has managed to secure the party leadership position and the Council. Rather than following the more radical reforms proposed by Ferenc Gyurcsány, the party has chosen to maintain the traditional social democratic approach of gradual reform, social welfare, and careful economic management. Gyurcsány with his Democratic Coalition left the party after the defeat, and his wing came has come to nom-existence. Now the MSZP can truly be called a left-wing party."
 hungary_hsp.4.a: "Tradition prevails"

 hungary_hsp.5.t: "Gyurcsány Introduces Austerity"
 hungary_hsp.5.d: "The Gyurcsány's Government has announced a series of austerity measures to address Hungary's budget deficit and economic instability. These difficult decisions include spending cuts, tax increases, and reductions in public services. While necessary for fiscal stability, these measures will undoubtedly strain the government's popularity and test public patience."
 hungary_hsp.5.a: "We must survive"

 hungary_hsp.6.t: "'We screwed up! Not a little, a lot!'"
 hungary_hsp.6.d: "In a leaked speech given in the town of Őszöd, Prime Minister Ferenc Gyurcsány was recorded admitting that his government had been lying about the economy and had done nothing meaningful in office. His quote 'Nyilvánvalóan végighazudtuk az utolsó másfél-két évet' became viral across the entire Hungary,this revelation has shocked the nation and sparked outrage. This scandal has severely damaged the government's credibility and may trigger widespread protests."
 hungary_hsp.6.a: "This is a disaster!"

 hungary_hsp.61.t: "Nationwide Protests"
 hungary_hsp.61.d: "Following the Őszöd speech scandal, massive protests have erupted across Hungary. Tens of thousands of citizens have taken to the streets, demanding the resignation of Prime Minister Gyurcsány and expressing their anger at the government's dishonesty. The protests have brought Budapest to a standstill and show no signs of abating. The government is facing a severe crisis of legitimacy."
 hungary_hsp.61.a: "The people are angry!"

 hungary_hsp.7.t: "Unauthorised Powers"
 hungary_hsp.7.d: "Gyurcsány's approach to governance is quite controversial; it involves using all sorts of loopholes and legal loopholes to expedite the adoption of emergency reforms. The government will have to declare a state of emergency and bypass some of the restrictions created by the system of checks and balances."
 hungary_hsp.7.a: "We need to act decisively"

 hungary_hsp.8.t: "Hungary Requests Economic Agreement with Russia"
 hungary_hsp.8.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with a proposal for a comprehensive economic agreement. Budapest seeks to strengthen trade relations, secure energy supplies, and attract investment from Russia. This agreement would significantly deepen Hungary's economic ties with the East, potentially balancing its Western orientation. Should we accept this proposal?"
 hungary_hsp.8.a: "Accept the economic agreement"
 hungary_hsp.8.b: "Decline the proposal"

 hungary_hsp.9.t: "Economic Agreement with Russia Signed"
 hungary_hsp.9.d: "Russia has agreed to our proposal for a comprehensive economic agreement. This partnership will bring significant benefits: improved trade relations, secure energy supplies, and increased Russian investment in Hungary. The agreement strengthens our position as a bridge between East and West and provides economic opportunities that will benefit our citizens."
 hungary_hsp.9.a: "This strengthens our economy"

 hungary_hsp.10.t: "Russia Rejects Our Proposal"
 hungary_hsp.10.d: "Unfortunately, Russia has declined our proposal for an economic agreement. While this is disappointing, we understand that international relations require mutual interest and timing. We will continue to seek opportunities for economic cooperation with Russia and other international partners."
 hungary_hsp.10.a: "We will find other opportunities"

 hungary_hsp.11.t: "Hungary Requests Economic Agreement with Germany"
 hungary_hsp.11.d: "[HUN.GetNameDef] has approached [This.GetNameDef] with a proposal for a comprehensive economic agreement. Budapest seeks to strengthen trade relations and attract investment from Germany, one of Europe's largest economies. This agreement would deepen Hungary's integration with the European market and provide opportunities for economic growth. Should we accept this proposal?"
 hungary_hsp.11.a: "Accept the economic agreement"
 hungary_hsp.11.b: "Decline the proposal"

 hungary_hsp.12.t: "Economic Agreement with Germany Signed"
 hungary_hsp.12.d: "Germany has agreed to our proposal for a comprehensive economic agreement. This partnership will bring significant benefits: improved trade relations, increased German investment in Hungary, and greater integration with the European economy. The agreement strengthens our position within the EU and provides economic opportunities for our citizens."
 hungary_hsp.12.a: "This strengthens our economy"

 hungary_hsp.13.t: "Germany Rejects Our Proposal"
 hungary_hsp.13.d: "Unfortunately, Germany has declined our proposal for an economic agreement. While this is disappointing, we understand that international relations require mutual interest and timing. We will continue to seek opportunities for economic cooperation with Germany and other European partners."
 hungary_hsp.13.a: "We will find other opportunities"

 hungary_hsp.14.t: "Constitutional Amendments"
 hungary_hsp.14.d: "Instead of holding a large-scale referendum, we decided to pass the necessary amendments thru the National Assembly. We were able to secure the necessary majority, and now a fair system of checks and balances will be officially enshrined in the constitution, a well-defined system of separation of powers, and new democratic institutions will be officially recognized."
 hungary_hsp.14.a: "Trully people's constitution"

 hungary_hsp.15.t: "Ferenc is Under Pressure"
 hungary_hsp.15.d: "Prime Minister Ferenc Gyurcsány faces mounting pressure from within the party and from the public following the Őszöd speech scandal and subsequent protests. Calls for his resignation are growing, and his position has become increasingly untenable. The party must decide whether to continue supporting him or seek new leadership to restore public confidence."
 hungary_hsp.15.a: "Gyurcsány must resign"
 hungary_hsp.15.b: "We ain't finnished yet"

 hungary_hsp.16.t: "Vote of No Confidence"
 hungary_hsp.16.d: "Gyurcsány's refusal to resign has led to a rebellion brewing within the ranks of our faction's deputies. Rebels declared a vote of no confidence in the Gyurcsány's government, and the parliamentary opposition also supported the vote. The government is on the brink of collapse; if enough rebels join our coalition, it's the end of the Gyurcsány."
 hungary_hsp.16.a: "The government falls"
 hungary_hsp.16.b: "We survive the vote"

 hungary_hsp.22.t: "Hungary invites us to join the Eurozone"
 hungary_hsp.22.d: "The Visegrad Group is an organization created by Poland, Hungary, and Czechoslovakia, whose initial goal was the rapid integration of all three, and now four, members of the Group into the European Union. And now, the EU's doorstep is upon us, and we are ready to enter. Only a small formality remains: joining the Eurozone. This decision may impact our sovereignty and economy, but on the other hand, it is another step toward European integration that cannot be missed."
 hungary_hsp.22.a: "Let's accept The Euro!"
 hungary_hsp.22.b: "We will not risk the sovereignty of our economy"

 hungary_hsp.23.t: "[FROM.GetName] joins the Eurozone"
 hungary_hsp.23.d: "[FROM.GetName] is joining the Eurozone, in accordance with the objectives for which the Visegrad Group was formed. We are one step closer to Euro-optimism."
 hungary_hsp.23.a: "Welcome!"

 hungary_hsp.24.t: "[FROM.GetName] refuse to join the Eurozone"
 hungary_hsp.24.d: "[FROM.capital.GetName] is abandoning the euro. They say they are not yet ready for this step, as they believe the euro poses a threat to their national currency and, consequently, to the sovereignty of their economy."
 hungary_hsp.24.a: "They don't understand what they're giving up"

 hungary_hsp.17.t: "Only You Can Take Care for Yourselves!"
 hungary_hsp.17.d: "The government has introduced new policies emphasizing individual and community responsibility for well-being. While maintaining essential social safety nets, these policies shift greater responsibility to citizens and communities to manage their own affairs. This approach promotes self-reliance but may strain those who need the most support."
 hungary_hsp.17.a: "We must promote self-reliance"

 hungary_hsp.18.t: "[HUN.GetLeader] Destroys the Left"
 hungary_hsp.18.d: "After [HUN.GetLeader] was re-elected as party leader, he gave a speech where he accused opponents of his policies of destabilizing the party and wanting to undermine the government's activities. The party council, consisting of his supporters, decided to expel members of the Left-wing Coalition Platform and the Socialist Platform, and it also decided to eliminate the platform system within the party, thereby [HUN.GetLeader] completely destroying the party's left wing. The expelled members immediately spoke out about internal party purges and immediately condemned [HUN.GetLeader]. Now supporters of [HUN.GetLeader]'s course are in complete control of the party, which will pave the way for more radical reforms."
 hungary_hsp.18.a: "The party is now unified"

 hungary_hsp.19.t: "United Europe Speech"
 hungary_hsp.19.d: "[HUN.GetLeader] has delivered a major speech in front of the EU parliament calling for deeper European integration and unity. The address emphasizes Hungary's commitment to European values, cooperation, and shared prosperity. This speech has resonated well with other EU member states, strengthening Hungary's position within the European Union."
 hungary_hsp.19.a: "We are Europeans!"

 hungary_hsp.20.t: "Budapest City"
 hungary_hsp.20.d: "Under the [HUN.GetLeader]'s reforms program, Budapest has been designated as a special economic and development zone, with significant investments in infrastructure and modernization. The capital city will receive special attention to become a showcase of Hungary's progress and a magnet for international investment and tourism. Since [HUN.GetLeader] views the Budapest City Plan as his most ambitious project to date, it holds significant importance for [HUN.GetLeader]'s government. As a result, the government has set aside a significant amount of money to make this initiative a reality."
 hungary_hsp.20.a: "Budapest will shine"

 hungary_hsp.21.t: "Hungarian Third Way"
 hungary_hsp.21.d: "[HUN.GetLeader]'s vision has finally paid off; the Ministry of Economy reported GDP growth at unprecedented percentages for Hungary, and the ministry's statistics became the main indicator that [HUN.GetLeader] was right in his economic vision. After the ministry's report to the Assembly, the Prime Minister gave a speech in which he stated that Hungary had become an example of how to build an economy in the 21st century. The synthesis of Neoconservatism and Keynesianism, which we call the Third Way, has proven effective in the era of globalization and the triumph of the market. In the end, [HUN.GetLeader] called on all parliamentary factions to stop panicking and instead of empty words and actions, to face reality and be convinced of the Government's path."
 hungary_hsp.21.a: "This is our path forward!"

 hungary_hsp.25.t: "New Labor Code Reform Approved"
 hungary_hsp.25.d: "The National Assembly adopted a new version of the Labor Code. It included new provisions regarding the regulation of the rights of employes concerning the conclusion of equal labor contracts, and it also enshrined the rights to trade unions and strikes."
 hungary_hsp.25.a: "Workers' rights are protected"

 hungary_hsp.26.t: "Government Must Care About You"
 hungary_hsp.26.d: "The Prime Minister [HUN.GetLeader] addressed parliament, stating that the state under the Socialist Party would never abandon ordinary people and that protecting the population from crises was his primary duty. [HUN.GetLeader] also criticized the right-wing opposition, saying they have never cared about the country's citizens."
 hungary_hsp.26.a: "The government cares actually"

 hungary_hsp.27.t: "Government Introduces the Devolution Plan"
 hungary_hsp.27.d: "The government [HUN.GetLeader] announced that, as part of the constitutional reform, it had submitted a plan for a new system of local self-government to the Assembly. The plan states that the government will transfer some powers related to financial distribution and law enforcement to three new councils responsible for the Eastern, Western, and Northern parts of Hungary. These powers will also be transferred to Budapest separately. Within these areas, there will be smaller municipalities. Although the system may seem cumbersome, in practice it will be quite effective in ensuring balanced and local development."
 hungary_hsp.27.a: "Bureacratic revolution!"

 hungary_hsp.28.t: "'Jobbik' Case"
 hungary_hsp.28.d: "Thanks to the new anti-oppression law, an investigation has been officially launched against the Jobbik party. The party leadership is accused of promoting violence and Nazism, and they are also accused of being suspected of spreading racial hatred. Right-wing critics accuse the government of political persecution and repression, but the very existence of such a party is already a threat to democracy. We will not allow sympathizers of racism and oppression to come to power and destroy Hungarian democracy.."
 hungary_hsp.28.a: "There is no place for nationalism in Hungary!"

 hungary_hsp.29.t: "Socialists in Words and Deeds"
 hungary_hsp.29.d: "At the MSZP congress, [HUN.GetLeader] gave a speech in which he stated that the Socialist Party can now proudly bear that name, as it has demonstrated thru its actions that it is committed to the ideas of social equality, social democracy, and a fair market. Thanks to the government's policies and the party's collective cohesion, the country was able to achieve tremendous economic success and become an example of how to transition from wild capitalism to a free and equal society."
 hungary_hsp.29.a: "Hurray"

 hungary_hsp.30.t: "Only You Can Care for Yourself"
 hungary_hsp.30.d: "[HUN.GetLeader] gave a speech where he stated that while the state will strive to support the well-being of its citizens, citizens should remember that if the state is in a bad situation, it will not be able to come to their aid at the right moment. Therefore, citizens should primarily take care of themselves rather than relying on help from the state. Although the speech was received ambiguously, Hungarian banks recorded a surge in deposit openings."
 hungary_hsp.30.a: "He might be right though"

 hungary_hsp.32.t: "'Social' Referendum"
 hungary_hsp.32.d: "Fides has found a way to counter our policy. Orbán and his cronies were able to initiate a referendum with three questions:\nDo you agree that inpatient care should not be subject to a daily hospital fee from January 1st of the year following the referendum held on this issue?\nDo you agree that no visit fee should be payable for general practitioner care, dental care, and outpatient specialist care from January 1st of the year following the referendum held on this issue?\nDo you agree that students pursuing state-subsidized higher education should not have to pay a training contribution?\nThese questions directly threaten our austerity policy, and if all the questions are answered 'yes', our government can be written off. Propaganda for the 'three yeses' is gaining momentum and if we don't mobilize all our resources, the referendum will be lost."
 hungary_hsp.32.a: "'Three yeses' has won"
 hungary_hsp.32.b: "Attendance is below 50%. Referendum is invalid"

 hungary_hsp.33.t: "Rise of the Democratic Coalition"
 hungary_hsp.33.d: "Gyurcsány and his 'Democratic Coalition' Platform announced their withdrawal from the MSZP, stating that in his opinion, the Socialists had failed and Hungary needed a fresh liberal political party. At the party congress, he stated that his new 'Democratic Coalition' would be Hungary's most democratic party, as it envisions internal elections and the decentralization of the party apparatus. Gyurcsány is currently trying to convince sympathetic MSZP MPs to leave the party and form a faction with him in the assembly, and to lay the groundwork for further party funding. Only time will tell the viability of his party project."
 hungary_hsp.33.a: "A legeurópaibb párt!"

