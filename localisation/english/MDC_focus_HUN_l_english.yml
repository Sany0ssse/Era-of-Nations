#Monarchists Focuses
 HUN_rise_of_habsburgs: "The Rise of the Habsburgs"
 HUN_rise_of_habsburgs_desc: "Legitimists rally around the House of Habsburg-Lorraine, inviting the dynasty back into Hungarian politics. Restoring the royal household offers a unifying symbol for conservatives and the promise of decisive rule after years of technocracy."
 HUN_naher_wp: "Get rid of the remnants of the Warsaw Pact"
 HUN_naher_wp_desc: "Purge the officer corps, archives, and security organs of their Soviet-era relics. Only by uprooting communist networks can a royal state claim moral authority."
 HUN_gran_privileges_to_bishops: "Grant Privileges to Bishops"
 HUN_gran_privileges_to_bishops_desc: "The Catholic hierarchy becomes an official partner of the crown, receiving restored lands, tax exemptions, and influence over education in exchange for preaching loyalty."
 HUN_restore_old_order: "Restore the Old Order"
 HUN_restore_old_order_desc: "Censor the republican constitution, rehabilitate noble titles, and reintroduce corporatist chambers. The monarchy promises stability through hierarchy."
 HUN_ban_LGBT_activism: "The question of LGBT rights"
 HUN_ban_LGBT_activism_desc: "Morality decrees criminalize LGBT NGOs and demonstrations, framing the move as a defense of the Christian family and ‘traditional’ Hungarian society."
 HUN_protect_christian_values: "Protect Christian Values"
 HUN_protect_christian_values_desc: "A raft of laws enshrines Sunday rest, religious education, and censorship of ‘blasphemous’ art, tightening the alliance between throne and altar."
 HUN_national_referendum_monarchy: "National Referendum on the Monarchy"
 HUN_national_referendum_monarchy_desc: "To silence critics, the government calls a plebiscite on the king’s powers. The result will determine whether Hungary embraces absolute rule or a constitutional compromise."
 HUN_habsburg_absolutism: "Habsburg Absolutism"
 HUN_habsburg_absolutism_desc: "Should the plebiscite favor autocracy, parliament dissolves and the monarch rules by decree, with parties banned and loyal bureaus enforcing royal edicts."
 HUN_crown_under_observation: "Crown Under Oversight"
 HUN_crown_under_observation_desc: "If the people demand limits, the crown accepts a constitution and cabinet oversight, creating a royalist system that still nods to representative government."
 HUN_restoration_of_aristocracy: "Restoration of the Aristocracy"
 HUN_restoration_of_aristocracy_desc: "Ancient magnate families recover estates and seats in a reconstituted upper chamber, trading political support for a return to feudal prestige."
 HUN_rewrite_constitution: "Rewrite the Constitution"
 HUN_rewrite_constitution_desc: "Jurists craft a new charter that concentrates power in the crown, subordinates the judiciary, and enshrines the monarch as ‘guardian of the nation.’"
 HUN_unity_king_with_people: "Unity of the King with the People"
 HUN_unity_king_with_people_desc: "Constitutional monarchists orchestrate royal tours, relief programs, and symbolic gestures to show that the crown listens to peasant and worker alike."
 HUN_assemble_cabinet_of_ministers: "Assemble the Cabinet of Ministers"
 HUN_assemble_cabinet_of_ministers_desc: "A handpicked cabinet of technocrats and aristocrats will administer the realm, balancing court intrigue with bureaucratic competence."
 HUN_royal_constitution: "Royal Constitution"
 HUN_royal_constitution_desc: "Finalize the compromise charter: the king retains vetoes and control of foreign affairs, while a loyal parliament manages budgets under royal supervision."
 HUN_god_save_king: "God, Save the King!"
 HUN_god_save_king_desc: "State funerals, military oaths, and civic rituals all swear fealty to the sovereign, cementing a cult of loyalty and silencing republican murmurs."
 HUN_create_the_royal_guard: "Create the Royal Guard"
 HUN_create_the_royal_guard_desc: "An elite Royal Guard, recruited from loyal officers and nobles, will protect the person of the monarch and stand as a visible symbol of dynastic authority in the streets of Budapest."
 HUN_authoritarian_monarchy: "Authoritarian Monarchy"
 HUN_authoritarian_monarchy_desc: "By concentrating executive power in the king’s hands and marginalizing parliament, Hungary becomes an openly authoritarian monarchy where dissent survives only at the crown’s pleasure."
 HUN_liberal_monarchy: "Liberal Monarchy"
 HUN_liberal_monarchy_desc: "A more liberal settlement binds the crown to civil rights, strong courts, and an empowered parliament, presenting the monarchy as guardian of both order and individual freedoms."
 HUN_protectionist_economy: "Protectionist Economy"
 HUN_protectionist_economy_desc: "Tariffs, subsidies, and strict import controls will shield royal industries from foreign competition, trading short-term costs for a self-sufficient, crown-guided economy."
 HUN_liberal_economy: "Liberal Economy"
 HUN_liberal_economy_desc: "Free trade, open markets, and minimal state intervention will allow Hungarian businesses to compete globally, fostering economic growth and prosperity under the crown's liberal guidance."
 HUN_pan_european_policy: "Pan-European Policy"
 HUN_pan_european_policy_desc: "The Habsburg crown champions European unity, seeking to rebuild the old empire's influence through diplomacy, trade, and cultural ties across the continent."
 HUN_restoration_of_Habsburg_Empire: "Restoration of the Habsburg Empire"
 HUN_restoration_of_Habsburg_Empire_desc: "With domestic power secure, Budapest proclaims an ambitious program to resurrect the old Dual Monarchy, preparing diplomacy and armies for expansion."
 HUN_and_back_to_sea: "And Back to Sea Again"
 HUN_and_back_to_sea_desc: "The crown demands Adriatic access, pressuring Croatia and Slovenia to join a revived empire or face naval blockades and annexation."
 HUN_demand_transylvania: "Demand Transylvania"
 HUN_demand_transylvania_desc: "Envoys deliver an ultimatum to Bucharest: return Transylvania peacefully and enjoy royal favor, or risk invasion and international isolation."
 HUN_transcarpathia_for_union: "Transcarpathia for the Union"
 HUN_transcarpathia_for_union_desc: "Kyiv is offered a bargain—cede Transcarpathia and receive Hungary’s protection and economic ties-or else face the Habsburg legions."
 HUN_annexation_of_slovakia: "Annexation of Slovakia"
 HUN_annexation_of_slovakia_desc: "Pressure mounts on Prague and Bratislava as Hungary organizes referenda, uprisings, and military threats to absorb the Slovak lands."
 HUN_banat_for_guarantees: "Banat for Guarantees"
 HUN_banat_for_guarantees_desc: "Belgrade is offered security guarantees in exchange for the Banat. Should Serbia refuse, the crown readies war plans."
 HUN_restoration_of_union: "Restoration of the Union"
 HUN_restoration_of_union_desc: "Vienna is courted with promises of co-rule, attempting to stitch Austria back into a Danube federation governed from Budapest."
 HUN_annexation_of_the_Czech: "Annexation of the Czechia"
 HUN_annexation_of_the_Czech_desc: "Prague must submit to the crown. Through diplomatic pressure, economic coercion, or military force, the Czech lands will be brought back into the Habsburg fold, restoring the historic boundaries of the empire."
 HUN_return_of_galicia: "The Return of Galicia"
 HUN_return_of_galicia_desc: "The historic province of Galicia, once part of the Austro-Hungarian Empire, must be reclaimed. Through negotiation or conquest, we will restore this territory to the crown and strengthen our position in Central Europe."
 HUN_restoration_of_great_kingdom: "Restoration of the Great Kingdom"
 HUN_restoration_of_great_kingdom_desc: "Reclaiming historic frontiers allows Hungary to style itself the Great Kingdom once more, complete with new regalia and a reorganized administration loyal to the crown."
 HUN_invasion_of_bosnia: "Invasion of Bosnia"
 HUN_invasion_of_bosnia_desc: "To secure the southern flank of our revived realm and project Habsburg power into the Balkans, we will prepare plans to occupy Bosnia and impose a new order under the crown."
 HUN_partition_of_italy: "Partition of Italy"
 HUN_partition_of_italy_desc: "Italy’s fractured politics invite intervention. The crown funds separatists, buys influence, and threatens war to carve out puppet duchies along the Adriatic."

