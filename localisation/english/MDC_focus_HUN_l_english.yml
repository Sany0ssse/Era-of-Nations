 #Communist Party Focuses
 HUN_magyar_munkaspart: "Magyar Munkáspárt"
 HUN_magyar_munkaspart_desc: "The Hungarian Workers' Party represents the true voice of the proletariat. By establishing this party as the vanguard of the revolution, we will consolidate communist power and guide Hungary toward a socialist future."
 HUN_withdrawal_from_western_organizations: "Withdrawal from Western Organizations"
 HUN_withdrawal_from_western_organizations_desc: "Breaking free from the shackles of Western imperialism means leaving NATO and the European Union. We must forge our own path, independent from capitalist institutions that seek to exploit our people."
 HUN_reorganization_of_economy: "Reorganization of the Economy"
 HUN_reorganization_of_economy_desc: "The capitalist system has failed the working class. We must restructure our economy to serve the people, not the bourgeoisie. This is the first step toward economic justice."
 HUN_transition_to_a_planned_economy: "Transition to a Planned Economy"
 HUN_transition_to_a_planned_economy_desc: "A planned economy will ensure that production serves the needs of the people, not the profits of capitalists. Central planning will eliminate waste and exploitation, creating a fairer society for all."
 HUN_anti_migration_company: "Anti-Migration Campaign"
 HUN_anti_migration_company_desc: "We must protect our socialist society from the influence of capitalist refugees and maintain the purity of our revolutionary ideals. Our borders must be secured against foreign interference."
 HUN_job_creation: "Job Creation"
 HUN_job_creation_desc: "Under socialism, unemployment is unacceptable. We will create jobs for all workers, ensuring that every citizen can contribute to building our socialist society and receive fair compensation for their labor."
 HUN_create_communist_trade_unions: "Create Communist Labour Unions"
 HUN_create_communist_trade_unions_desc: "True labour unions must be organized under party leadership to protect workers' rights and advance socialist goals. These unions will be the backbone of our workers' state."
 HUN_combating_class_inequality: "Combating Class Inequality"
 HUN_combating_class_inequality_desc: "The class struggle is at the heart of our revolution. We must eliminate the remnants of bourgeois privilege and ensure that all citizens are equal under socialism."
 HUN_withdraw_foreign_capital: "Withdraw Foreign Capital"
 HUN_withdraw_foreign_capital_desc: "Foreign capitalists exploit our workers and drain our resources. We must expel foreign capital and reclaim control of our economy for the Hungarian people."
 HUN_purges_among_officials: "Purges Among Officials"
 HUN_purges_among_officials_desc: "Counter-revolutionary elements have infiltrated our bureaucracy. We must purge disloyal officials and ensure that only true communists serve in positions of power."
 HUN_nationalization_of_industry: "Nationalization of Industry"
 HUN_nationalization_of_industry_desc: "The means of production must belong to the people, not to private capitalists. By nationalizing industry, we ensure that the fruits of labor benefit all workers, not just a wealthy few."
 HUN_increase_production: "Increase Production"
 HUN_increase_production_desc: "Under socialist ownership, we can maximize industrial output for the benefit of all. By increasing production, we ensure that our planned economy meets the needs of the people."
 HUN_hungarian_autarky: "Hungarian Autarky"
 HUN_hungarian_autarky_desc: "Economic independence is essential for a true socialist state. By achieving autarky, we free ourselves from dependence on capitalist markets and ensure our economic sovereignty."
 HUN_eradicate_corruption: "Eradicate Corruption"
 HUN_eradicate_corruption_desc: "Corruption is a disease of the capitalist system. Under socialism, we will root out all forms of corruption and ensure that public officials serve the people with integrity and dedication."
 HUN_nationalization_of_resources: "Nationalization of Resources"
 HUN_nationalization_of_resources_desc: "Natural resources belong to the people, not to private corporations. By nationalizing our resources, we ensure that the wealth of our land benefits all citizens, not just foreign investors."
 HUN_true_socialism: "True Socialism"
 HUN_true_socialism_desc: "We have laid the foundations for a truly socialist society. With industry and resources nationalized, corruption eliminated, and workers organized, Hungary stands as a beacon of socialist progress in Central Europe."
 HUN_proclaim_hpr: "Proclaim the Hungarian People's Republic"
 HUN_proclaim_hpr_desc: "Having completed the socialist transformation of our state, we can formally proclaim the Hungarian People's Republic. This act will signal to the world that Hungary has fully embraced communism and stands ready to lead the workers of Central Europe."
 HUN_communist_takeover_in_central_europe: "Communist Takeover in Central Europe"
 HUN_communist_takeover_in_central_europe_desc: "The revolution must spread! We will support communist movements across Central Europe, helping our comrades overthrow capitalist regimes and establish workers' states throughout the region."
 HUN_get_chinese_guarantees: "Get Chinese Guarantees"
 HUN_get_chinese_guarantees_desc: "The People's Republic of China is a natural ally in our struggle against imperialism. Securing Chinese guarantees will provide us with economic support and diplomatic protection against Western aggression."
 HUN_strengthen_relations_in_middle_east_socialists: "Strengthen Relations with Middle East Socialists"
 HUN_strengthen_relations_in_middle_east_socialists_desc: "Our socialist brothers in the Middle East share our revolutionary goals. By strengthening relations with socialist states in the region, we expand the international socialist movement and gain valuable allies."
 HUN_mutual_defense_treaty_with_russia: "Mutual Defense Treaty with Russia"
 HUN_mutual_defense_treaty_with_russia_desc: "Russia remains a key partner in our fight against Western imperialism. A mutual defense treaty will ensure our security and strengthen the socialist bloc in Eastern Europe."
 HUN_central_european_socialist_union: "Central European Socialist Union"
 HUN_central_european_socialist_union_desc: "By uniting the socialist states of Central Europe, we create a powerful bloc that can resist Western imperialism and advance the cause of socialism throughout the region."
 HUN_union_with_serbia: "Union with Serbia"
 HUN_union_with_serbia_desc: "Our socialist brothers in Serbia share our revolutionary goals. A union between our two nations will strengthen socialism in the Balkans and create a powerful socialist federation."
 HUN_union_with_slovakia: "Union with Slovakia"
 HUN_union_with_slovakia_desc: "The Slovak people are our brothers, and under socialism, we can finally unite. A union with Slovakia will restore historical ties and create a stronger socialist state in Central Europe."
 HUN_promote_communist_ideas_in_balkans: "Promote Communist Ideas in the Balkans"
 HUN_promote_communist_ideas_in_balkans_desc: "The Balkans must be liberated from capitalist influence. We will spread communist ideology throughout the region, supporting revolutionary movements and helping our comrades establish workers' states."
 HUN_question_of_resurrection_of_sss: "The Question of the Resurrection of the AVH"
 HUN_question_of_resurrection_of_sss_desc: "The State Security Service (ÁVH) was crucial in protecting our socialist state from counter-revolutionary elements. We must consider whether to restore this institution to defend our revolution."
 HUN_cut_defense_spending: "Cut Defense Spending"
 HUN_cut_defense_spending_desc: "Under socialism, we can redirect military spending toward social programs. By reducing defense expenditures, we can invest more in education, healthcare, and the welfare of our people."
 HUN_purchase_russian_weapons: "Purchase Russian Weapons"
 HUN_purchase_russian_weapons_desc: "Russian military equipment is reliable and cost-effective. By purchasing Russian weapons, we modernize our armed forces while maintaining our alliance with Moscow and reducing dependence on Western suppliers."
 HUN_iron_curtain: "Iron Curtain"
 HUN_iron_curtain_desc: "We must seal our borders against capitalist influence. By establishing strict border controls and limiting contact with the West, we protect our socialist society from ideological contamination."
 HUN_media_under_state_control: "Media Under State Control"
 HUN_media_under_state_control_desc: "The media must serve the people, not capitalist interests. By placing all media under state control, we ensure that information serves socialist goals and prevents bourgeois propaganda from corrupting our society."
 HUN_strengthen_the_police: "Strengthen the Police"
 HUN_strengthen_the_police_desc: "A strong police force is essential to maintain order and protect our socialist state from counter-revolutionary elements. We will expand and modernize our law enforcement to ensure the security of our revolution."
 HUN_propaganda_of_communist_ideals: "Propaganda of Communist Ideals"
 HUN_propaganda_of_communist_ideals_desc: "The masses must be educated in the principles of Marxism-Leninism. Through comprehensive propaganda campaigns, we will ensure that all citizens understand and support our socialist cause."
 HUN_support_for_free_education: "Support for Free Education"
 HUN_support_for_free_education_desc: "Education is a right, not a privilege. Under socialism, all citizens must have access to free, quality education that serves the needs of the people and advances socialist values."
 HUN_welfare_state: "Welfare State"
 HUN_welfare_state_desc: "A true socialist state provides for all its citizens. By establishing comprehensive welfare programs, we ensure that every worker has access to healthcare, housing, and social security, regardless of their economic status."

