l_english:
 eon_defensive_alliance_name:0 "Defensive Alliance"
 eon_defensive_alliance_template:0 "Defensive Alliance"
 eon_defensive_alliance_template_desc:0 "An alliance of independent states for mutual defence. Partners join by consent. Membership does not commit them to wars of aggression."
 eon_defensive_alliance_joining_rule:0 "Independent defensive partners"
 eon_defensive_alliance_joining_rule_desc:0 "Independent countries may join by consent when their current political rules and world-tension threshold permit membership. Countries fighting an offensive war cannot join."
 eon_defensive_alliance_call_rule:0 "Mutual defence"
 eon_defensive_alliance_call_rule_desc:0 "Partners may be called only when the calling country is defending itself and is not fighting an offensive war. Countries fighting both defensive and offensive wars cannot call partners under this agreement."
 eon_defensive_alliance_call_tt:0 "This defensive alliance supports countries fighting a defensive war with no simultaneous offensive war."
 eon_defensive_alliance_join_tt:0 "The applicant must be independent, outside any faction, free of an offensive war, and permitted to join by its current political rules and world-tension threshold. The alliance leader must be independent and free of an offensive war."
 eon_propose_defensive_alliance:0 "Propose a Defensive Alliance"
 eon_propose_defensive_alliance_desc:0 "Offer an independent partner a new alliance for mutual defence."
 eon_propose_defensive_alliance_send_desc:0 "Send a proposal to form a defensive alliance. Both governments must agree and still satisfy the political conditions when the response arrives."
 eon_defensive_alliance_offer_terms_available_tt:0 "The proposer may create an alliance and the partner may join under their current political rules. Both countries are independent, outside any faction, and free of offensive wars; the partner meets its world-tension threshold."
 eon_defensive_alliance_offer_no_pending_tt:0 "Neither country has another defensive alliance proposal awaiting a response."
 eon_defensive_alliance_offer_response_valid_tt:0 "The response must match the currently reserved proposal, and both countries must still meet its political conditions."
 eon_defensive_alliance_ai_base:0 "Assessment of a new defensive alliance"
 eon_defensive_alliance_ai_opinion:0 "Relations with the proposer"
 eon_defensive_alliance_ai_outlook:0 "Shared political outlook"
 eon_defensive_alliance_ai_policy:0 "Policy towards alliances"
