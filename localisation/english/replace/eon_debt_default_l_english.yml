l_english:
 debt_default_pay_10_from_treasury:0 "Repay up to §Y$10 billion§! from the treasury"
 debt_default_pay_10_from_treasury_desc:0 "Repay part of the outstanding obligation after default using existing funds. The payment is limited to $10 billion, available treasury funds and the remaining obligation. Payment remains possible after the repayment period expires. No new loan is taken."
 debt_default_pay_50_from_treasury:0 "Repay up to §Y$50 billion§! from the treasury"
 debt_default_pay_50_from_treasury_desc:0 "Repay part of the outstanding obligation after default using existing funds. The payment is limited to $50 billion, available treasury funds and the remaining obligation. Payment remains possible after the repayment period expires. No new loan is taken."
 debt_default_pay_10_from_treasury_tt:0 "Debit the treasury and repay the same amount of the outstanding obligation: up to §Y$10 billion§!, limited by existing funds and the remaining obligation."
 debt_default_pay_50_from_treasury_tt:0 "Debit the treasury and repay the same amount of the outstanding obligation: up to §Y$50 billion§!, limited by existing funds and the remaining obligation."
 debt_default_pay_from_treasury_trigger_tooltip:0 "Payment requires an active or overdue default obligation, a positive remaining amount and treasury funds. A high interest rate does not prevent repayment using existing cash."
 debt_default_main_mission_complete_trigger:0 "The remaining default obligation must be exactly §Y$0§!."
 bankruptcy_default_on_debts_desc:0 "Move half of outstanding debt into a separate default repayment obligation. The other half remains regular debt. No principal is forgiven and no money is paid by this declaration. An existing unpaid default obligation must be settled first."
 bankruptcy_default_on_debts_tt:0 "§Y50%§! of regular debt is moved to a separate default obligation; the remaining §Y50%§! stays regular debt. Total outstanding principal is preserved. The repayment period is §Y360 days§!. After expiry the unpaid balance remains due and can still be repaid from existing treasury funds."
 bankruptcy.13.a:0 "Acknowledge the cancelled legacy notice"
 bankruptcy.13.b:0 "Close the cancelled legacy notice"
 bankruptcy.14.a:0 "Acknowledge the cancelled legacy notice"
 debt_default_sell_civilian_factories_desc:0 "Liquidate one level of an owned and controlled civilian factory after 5 days. Its fixed game value is $10 billion. The remaining default obligation is repaid first; any excess is credited to the treasury. The whole excess must fit the treasury limit. If the obligation is already settled or no eligible asset remains, the scheduled operation has no effect."
 debt_default_dismantle_military_factories_desc:0 "Liquidate one level of an owned and controlled military factory after 5 days. Its fixed game value is $10 billion. The remaining default obligation is repaid first; any excess is credited to the treasury. The whole excess must fit the treasury limit. If the obligation is already settled or no eligible asset remains, the scheduled operation has no effect."
 debt_default_scrap_dockyard_desc:0 "Liquidate one level of an owned and controlled dockyard after 5 days. Its fixed game value is $10 billion. The remaining default obligation is repaid first; any excess is credited to the treasury. The whole excess must fit the treasury limit. If the obligation is already settled or no eligible asset remains, the scheduled operation has no effect."
 debt_default_cut_down_government_services_desc:0 "Liquidate one level of an owned and controlled office building after 5 days. Its fixed game value is $10 billion. The remaining default obligation is repaid first; any excess is credited to the treasury. The whole excess must fit the treasury limit. If the obligation is already settled or no eligible asset remains, the scheduled operation has no effect."
