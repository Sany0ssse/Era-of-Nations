l_english:
 additional_migrants_agreements_income_tt:0 "Labour agreement: private remittances do not automatically become government revenue.\n"
 eon_migration_relief_category:0 "Civilian migration and refugee reception"
 eon_migration_relief_category_desc:0 "Admission programme: §Y[GetEonMigrationAdmissionPolicy]§!\nHosted refugees: §Y[?eon_refugees_hosted|0]§!; employed/integrated: [?eon_refugees_integrated|0]; settled long term: [?eon_refugees_longterm|0].\nLabour migrants: [?eon_labor_migrants_hosted|0]. Reception places: [?eon_refugee_capacity|0]; available: [?eon_refugee_capacity_remaining|0].\nThis month: refugees admitted [?eon_refugee_month_arrived|0], voluntary returns from here [?eon_refugee_month_returned|0], labour arrivals [?eon_labor_month_arrived|0].\nEstimated departures from our exposed regions without an available destination: [?eon_refugee_month_unplaced|0]. These people remain at home; this is not an IDP census.\nRestricted civilian relief fund: [?eon_refugee_relief_fund|6] billion. Weekly emergency cost: [?eon_refugee_weekly_cost|6] billion; last weekly fund payment: [?eon_refugee_weekly_fund_paid|6] billion. Reception expansion: [?eon_refugee_capacity_weekly_cost|3] billion/week. Domestic wartime relief need: [?eon_civilian_relief_need|0] people (estimate).\n\nPeople actually leave one region and enter another. Labour agreements arrange recruitment; they do not grant visa-free tourism, automatic permanent residence or asylum. Refugee protection is a separate programme. To help another country, open its diplomatic actions and choose §YFund civilian relief§!."
 eon_migration_policy_paused:0 "Additional organised admissions paused"
 eon_migration_policy_regulated:0 "Regulated reception"
 eon_migration_policy_expanded:0 "Expanded reception and resettlement"
 eon_migration_admission_paused:0 "Pause additional organised admissions"
 eon_migration_admission_paused_desc:0 "Pause new arrivals through our organised reception programme. Existing residents remain; this decision does not deport people, cancel protection or resolve individual asylum claims."
 eon_migration_admission_regulated:0 "Resume regulated refugee reception"
 eon_migration_admission_regulated_desc:0 "Receive refugees from accessible neighbouring war zones while places are available. Reception has weekly civilian costs. Employment integration takes time and depends on our labour market."
 eon_migration_admission_expanded:0 "Expand reception and distant resettlement"
 eon_migration_admission_expanded_desc:0 "Increase programme capacity by 50%. Also offer distant resettlement through existing diplomatic, labour or faction channels. This opens an organised route; it does not remove border and residence laws."
 eon_migration_expand_reception_capacity:0 "Fund temporary reception facilities"
 eon_migration_expand_reception_capacity_desc:0 "Spend §Y0.25 billion§! now to expand reception places by another §Y50% for 365 days§!. Operating cost: §Y0.01 billion each week§!, charged to our budget. The civilian relief fund covers emergency assistance, not this facility cost. Expiry does not expel residents."
 eon_refugee_reception_modifier:0 "Civilian reception and integration"
 eon_refugee_reception_modifier_tt:0 "Emergency assistance costs enter the weekly budget. The restricted fund covers eligible costs until exhausted. Unintegrated refugees temporarily delay entry into the civilian workforce; ordinary resident population is never added a second time. Overloaded reception services can reduce stability and construction. Voluntary return requires lasting peace and a suitable controlled home region. Long-term settlement is an aggregate model, not automatic citizenship."
 eon_migration_population_flow_tt:0 "Net migration records actual monthly movements, annualised for display. Population is transferred between regions; this modifier does not create extra births."
 MAXIMUM_MIGRATION_RATE_TT_DELAYED:0 "The inherited migration-attractiveness index is informational. Actual movement depends on a valid labour agreement and vacancies, or an accessible refugee reception programme with available places.\n\nRefugees received this month: [?eon_refugee_month_arrived|0] people.\nEstimated wartime departures without an available destination: [?eon_refugee_month_unplaced|0] people; they remain in their home region.\nLabour migrants received: [?eon_labor_month_arrived|0] people.\nSee §YCivilian migration and refugee reception§! in Decisions for capacity, costs and programme controls."
 NET_MIGRATION_RATE_TT_DELAYED:0 "Annualised realised net migration: monthly arrivals minus departures, divided by population and multiplied by 12. This displays the most recent monthly settlement, not a forecast or an extra population-growth effect.\n\nArrivals this month: [?eon_migration_month_in|0] people.\nDepartures this month: [?eon_migration_month_out|0] people."
 EMPLOYMENT_TOOLTIP_DELAYED:0 "Total Workforce: §Y[?ROOT.workforce_total_display]§!\nLabour migrants included in resident population: §Y[?ROOT.eon_labor_migrants_hosted|0] people§! (not an employed-worker count)\nShare of Population in the workforce: §Y[?ROOT.workforce_total_percentage_display|%]§!\n\nMillion Workers per Sector:\n§GMilitary Factories§!: [?ROOT.workers_in_mil_facs]\n§BNaval Factories§!: [?ROOT.workers_in_dockyards]\n§OCivilian Factories§!: [?ROOT.workers_in_civ_facs]\n§COffices§!: [?ROOT.workers_in_offices]\n§BRubber Refineries§!: [?ROOT.workers_in_rub_ref]\n§GNon-Commercialized Agriculture§!: [?ROOT.agriculture_workers]\n§CResource Extraction§!: [?ROOT.resource_sector_workers]\n§CCompanies§!: [?ROOT.companies_workers]\n§CBranches§!: [?ROOT.branches_workers]\n§CSmall Businesses§!: [?ROOT.small_businesses_workers]\n§YCommercialized Agriculture Districts§!: [?ROOT.workers_in_agriculture_district]\n§RUnemployed & Subsistence§!: [?ROOT.total_unemployed]\n\nCurrent Unemployment: §R[?ROOT.total_unemployed_percentage_display|%]§!\nBase Unemployment Percent: §R[?ROOT.base_unemployment_percent|%]§!\nTo decay Base Unemployment reach low inflation, good economy cycle and productivity. It rises slowly when you are at war or have bad economy situation.\n\n§YHigh Unemployment Threshold:§! [?ROOT.unemployment_threshold_display_var|%0]\n\n[UNEMPLOYMENT_MODIFIERS]"
