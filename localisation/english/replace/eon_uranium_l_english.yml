l_english:
 build_enrichment_facility_button_tt:0 "§YBuild a fuel-cycle facility§!\nProcesses natural uranium into finished reactor fuel; it does not mine ore and can use imports. One facility costs 25 billion USD and takes 730 days; three cost 75 billion and take 1095 days (Shift + click). Funds are reserved upfront. Costs and clocks are game rules. Existing diplomatic responses to the first programme remain."
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION_TT:0 "§YReactor fuel balance§!\nFinished stock: [?var_reactor_material_stockpile|0] kg U. Projected output: [?nuclear_reactor_fuel_production|0] kg/week; demand: [?nuclear_fuel_consumption|0] kg/week.\nNatural feed stock: [?eon_natural_uranium_stock_kg|0] kg; available flow [?eon_uranium_available_flow_kg|0] kg/week. Buy feed in native trade.\nProcessing uses 9 kg natural U per kg reactor U; tails are stored separately. Fuel shortage reduces nuclear generation proportionally. Damaged facilities retain 40% base capacity.\nConversion, civilian enrichment and fabrication are aggregated; reactor types are not yet distinguished."
 URANIUM_ENRICHMENT:0 "Fuel cycle"
 energy.1.d:0 "[FROM.GetNameWithFlag] offers to buy [?eon_nuclear_fuel_trade_quantity|0] kg finished reactor fuel at [?eon_nuclear_fuel_trade_price|2] thousand USD/kg. Terms are frozen and full payment is escrowed. The offer remains valid for 30 days while its conditions hold. Final transaction total: [?eon_nuclear_fuel_trade_total|8] billion USD, frozen after monetary rounding."
 energy.10.d:0 "[FROM.GetNameWithFlag] offers to sell [?eon_nuclear_fuel_trade_quantity|0] kg finished reactor fuel at [?eon_nuclear_fuel_trade_price|2] thousand USD/kg. The seller has escrowed the goods. The offer remains valid for 30 days while its conditions hold. Final transaction total: [?eon_nuclear_fuel_trade_total|8] billion USD, frozen after monetary rounding."
 change_reactor_grade_material_effect_tt:0 "Changes the stock of §Yfinished reactor fuel§! by [?eon_legacy_reactor_reward_kg|0+] kg U in [THIS.GetNameWithFlag] (Current stock: [?THIS.var_reactor_material_stockpile|Y0] kg U)\n"
