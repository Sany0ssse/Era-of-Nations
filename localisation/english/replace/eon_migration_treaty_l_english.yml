l_english:
 eon_migration_treaty_offer_available_tt: "Both countries are at peace with each other, retain populated territory, and allow recruitment across their borders. The partner has surplus workers, supports us, has no conflicting recruitment role or pending offer, and this pair is outside its 120-day cooldown."
 eon_migration_treaty_response_valid_tt: "This exact proposal is still pending on both sides and its recruitment conditions remain valid."
 propose_migrants_agreement: "Propose a labour recruitment agreement"
 PROPOSE_MIGRANTS_AGREEMENT_ACTION_DESC: "Offer voluntary recruitment from a country with surplus workers. Actual arrivals depend on available jobs and safe, permitted routes. This agreement does not grant visas, permanent residence, or refugee admission."
 PROPOSE_MIGRANTS_AGREEMENT_DESC: "Offer [From.GetNameWithFlag] a voluntary labour recruitment agreement? Workers can arrive only when jobs and a safe, permitted route are available. Visas, permanent residence, and refugee admission remain separate policies."
 PROPOSE_MIGRANTS_AGREEMENT_ACTION_TITLE: "Labour recruitment agreement"
 PROPOSE_MIGRANTS_AGREEMENT_TITLE: "Labour recruitment agreement"
 PROPOSE_MIGRANTS_AGREEMENT_TOOLTIP: "$eon_migration_treaty_offer_available_tt$"
 migrants_agreement_add: "Labour recruitment: receiving country"
 migrants_agreement_cut: "Labour recruitment: sending country"
 cancel_migrants_agreement: "End the labour recruitment agreement"
 CANCEL_MIGRANTS_AGREEMENT_ACTION_DESC: "Stop future recruitment under this agreement. Residents and refugees remain protected by the country's separate residence and asylum policies."
 CANCEL_MIGRANTS_AGREEMENT_ACTION_TITLE: "End the labour recruitment agreement"
 CANCEL_MIGRANTS_AGREEMENT_TITLE: "End the labour recruitment agreement"
 CANCEL_MIGRANTS_AGREEMENT_TOOLTIP: "We have a labour recruitment agreement with [From.GetNameWithFlag]. Ending it stops future treaty recruitment; residents and refugees are not expelled."
 CANCEL_MIGRANTS_AGREEMENT_DESC: "End the labour recruitment agreement with [From.GetNameWithFlag]? This stops future treaty recruitment and does not expel residents or refugees."
