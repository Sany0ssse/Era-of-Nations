l_english:
 bankruptcy_seek_bailout_from_biggest_influencer_desc:0 "Ask our largest economic backer to repay up to 20% of our current debt. The maximum is frozen when sent. Donor expense equals actual debt reduction; no debt is forgiven and no automatic political influence is awarded."
 bankruptcy_seek_bailout_from_biggest_influencer_tt:0 "Ask our largest economic backer to repay up to 20% of our current debt. The maximum is frozen when sent. Donor expense equals actual debt reduction; no debt is forgiven and no automatic political influence is awarded."
 bankruptcy_seek_bailout_from_second_biggest_influencer_desc:0 "Ask our second largest economic backer to repay up to 15% of our current debt. The maximum is frozen when sent. Donor expense equals actual debt reduction; no debt is forgiven and no automatic political influence is awarded."
 bankruptcy_seek_bailout_from_second_biggest_influencer_tt:0 "Ask our second largest economic backer to repay up to 15% of our current debt. The maximum is frozen when sent. Donor expense equals actual debt reduction; no debt is forgiven and no automatic political influence is awarded."
 bankruptcy_seek_bailout_from_neighbour_desc:0 "Ask a richer friendly neighbour to repay up to 10% of our current debt. The selected neighbour and maximum are frozen. Donor expense equals actual debt reduction. No automatic political influence is awarded."
 bankruptcy_seek_bailout_from_neighbour_tt:0 "Ask a richer friendly neighbour to repay up to 10% of our current debt. The selected neighbour and maximum are frozen. Donor expense equals actual debt reduction. No automatic political influence is awarded."
 bankruptcy_seek_bailout_from_overlord_desc:0 "Ask our overlord to repay up to 50% of our current debt. Its expense equals actual debt reduction. If payment occurs while we remain its subject, our autonomy ratio decreases by 0.35 once. This is an explicit condition of the request."
 bankruptcy_seek_bailout_from_overlord_tt:0 "Ask our overlord to repay up to 50% of our current debt. Its expense equals actual debt reduction. If payment occurs while we remain its subject, our autonomy ratio decreases by 0.35 once. This is an explicit condition of the request."
