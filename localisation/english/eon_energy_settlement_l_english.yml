l_english:
 eon_energy_settlement_category:0 "Electricity invoices"
 eon_energy_settlement_category_desc:0 "Delivered energy is metered in GWh. Cash is paid after seven completed 24-hour accounting intervals. Unpaid invoices and paid funds awaiting collection survive the end of a contract."
 eon_energy_settlement_accounts:0 "View electricity accounts"
 eon_energy_settlement_accounts_desc:0 "Review actual delivered energy, outstanding invoices, overdue payments and cash already reserved for us. These accounts remain accessible after a contract ends."
 eon_energy_settlement_pay_invoices:0 "Pay outstanding electricity invoices"
 eon_energy_settlement_pay_invoices_desc:0 "Pay from available treasury funds. If cash is insufficient, each invoice receives the same proportional share; the unpaid balance remains due. No political power payment replaces money."
 eon_energy_settlement_collect_paid:0 "Collect paid electricity proceeds"
 eon_energy_settlement_collect_paid_desc:0 "Release money already paid by buyers, within our treasury capacity. Money awaiting collection is preserved and is not charged to the buyer again."
 eon_energy_settlement.1.t:0 "Electricity accounts"
 eon_energy_settlement.1.d:0 "Actual imports: [?eon_energy_settlement_import_gwh|2] GWh\nActual exports: [?eon_energy_settlement_export_gwh|2] GWh\nOutstanding invoices: [?eon_energy_settlement_payable|5] billion\nOur overdue payments: [?eon_energy_settlement_arrears|5] billion\nUnpaid buyer invoices: [?eon_energy_settlement_receivable|5] billion\nPaid proceeds awaiting collection: [?eon_energy_settlement_paid_claim|5] billion\n\nContract termination or war does not erase completed deliveries. Only original parties hold these accounts. Seven completed 24-hour intervals form the payment period; hourly metering is an approximation of detailed electricity markets."
 eon_energy_settlement.1.gap:0 "Actual imports: [?eon_energy_settlement_import_gwh|2] GWh\nActual exports: [?eon_energy_settlement_export_gwh|2] GWh\nOutstanding invoices: [?eon_energy_settlement_payable|5] billion\nOur overdue payments: [?eon_energy_settlement_arrears|5] billion\nUnpaid buyer invoices: [?eon_energy_settlement_receivable|5] billion\nPaid proceeds awaiting collection: [?eon_energy_settlement_paid_claim|5] billion\n\nContract termination or war does not erase completed deliveries. Only original parties hold these accounts. Seven completed 24-hour intervals form the payment period; hourly metering is an approximation of detailed electricity markets.\n\nAccounting warning: a clock interruption was detected. Unknown elapsed time was not billed. Existing measured deliveries and claims are preserved."
 eon_energy_settlement.2.t:0 "Electricity payment overdue"
 eon_energy_settlement.2.d:0 "Our available cash did not cover electricity invoices at settlement. The remaining debt stays due to the original suppliers. We can pay it through Electricity invoices when funds become available."
 eon_energy_settlement.3.t:0 "Electricity arrears cleared"
 eon_energy_settlement.3.d:0 "Our overdue electricity invoices have been paid. Any newer delivered energy remains in the current accounting period."
 eon_energy_settlement.4.t:0 "Electricity buyer has payment arrears"
 eon_energy_settlement.4.d:0 "Some completed deliveries were not fully paid at settlement. Their unpaid invoices remain claims against the original buyers; expected income is not cash received."
 eon_energy_settlement.5.t:0 "Electricity buyer arrears cleared"
 eon_energy_settlement.5.d:0 "The overdue buyer invoices have been paid. If our treasury is full, their paid proceeds remain available for later collection."
 eon_energy_settlement.ack:0 "Understood"
