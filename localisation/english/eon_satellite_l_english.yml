l_english:
 eon_satellite_agreements:0 "Civilian satellite agreements"
 eon_satellite_agreements_desc:0 "Manage our outgoing civilian GNSS and communications proposals. Each service has its own pending reply. Withdrawal is free and preserves the original reply reservation until that reply closes. An unanswered 30-day window closes the affected proposal route to that partner. Existing consent remains dormant during direct war or when a provider has no usable or sufficiently advanced service; it resumes only while that agreement remains in force."
 eon_withdraw_civ_gnss_proposal:0 "Withdraw civilian GNSS proposal"
 eon_withdraw_civ_gnss_proposal_desc:0 "Withdraw our original unaccepted civilian navigation proposal. $eon_sat_gnss_withdraw_tt$"
 eon_withdraw_civ_com_proposal:0 "Withdraw civilian communications proposal"
 eon_withdraw_civ_com_proposal_desc:0 "Withdraw our original unaccepted civilian communications proposal. $eon_sat_com_withdraw_tt$"
 eon_sat_gnss_available_tt:0 "Both countries must exist, be distinct and remain at peace with each other. The provider must have a usable civilian GNSS system at least as advanced as the recipient's own. Our GNSS proposal route must be free of an unresolved earlier response and not closed for this partner. Sending is free; acceptance must still match the proposed service."
 eon_sat_com_available_tt:0 "Both countries must exist, be distinct and remain at peace with each other. The provider must have a usable civilian communications system at least as advanced as the recipient's own. Our communications proposal route must be free of an unresolved earlier response and not closed for this partner. Sending is free; acceptance must still match the proposed service. Existing network traffic affects AI judgment."
 eon_sat_gnss_proposal_tt:0 "Register this free civilian GNSS proposal for a 30-day response at the provider's current system level. The original sender may withdraw it. Acceptance grants access only while the countries and proposed service still match; a changed provider level requires a new proposal. GNSS and communications replies remain separate."
 eon_sat_com_proposal_tt:0 "Register this free civilian communications proposal for a 30-day response at the provider's current system level. The original sender may withdraw it. Acceptance grants access only while the countries and proposed service still match; a changed provider level requires a new proposal. Communications and GNSS replies remain separate."
 eon_sat_gnss_closed_tt:0 "Close this civilian GNSS proposal without adding a new access grant. Existing agreements remain separate. A withdrawn or no longer valid reply cannot create access; an unanswered expired response closes only the affected GNSS proposal route to this partner."
 eon_sat_com_closed_tt:0 "Close this civilian communications proposal without adding a new access grant. Existing agreements remain separate. A withdrawn or no longer valid reply cannot create access; an unanswered expired response closes only the affected communications proposal route to this partner."
 eon_sat_gnss_withdraw_tt:0 "As the original sender, withdraw our pending civilian GNSS proposal at no cost. The original response keeps our GNSS proposal reserved until it closes; its 30-day expiry closes the affected route to this partner. Withdrawal cannot end an already accepted agreement or reserve the other country's outgoing proposals."
 eon_sat_com_withdraw_tt:0 "As the original sender, withdraw our pending civilian communications proposal at no cost. The original response keeps our communications proposal reserved until it closes; its 30-day expiry closes the affected route to this partner. Withdrawal cannot end an already accepted agreement or reserve the other country's outgoing proposals."
 eon_sat_gnss_granted_tt:0 "Record civilian GNSS access with current consent and recalculate its existing bonuses together with other providers. A provider with no usable system, a weaker system or direct war gives no foreign service bonus while consent remains dormant. Revocation removes that provider's grant; service recovery cannot recreate a revoked agreement."
 eon_sat_com_granted_tt:0 "Record civilian communications access with current consent and recalculate its existing bonuses together with other providers. Partner demand uses the existing 100 receivers per controlled state for every consenting recipient. A provider with no usable system, a weaker system or direct war gives no foreign service bonus while consent remains dormant. Revocation removes that provider's grant; service recovery cannot recreate a revoked agreement."
 eon_sat_gnss_revoke_tt:0 "As the provider, revoke this country's recorded civilian GNSS access for free without its approval. Both countries must still exist and be distinct, with recorded access identifying our grant. Direct war, a service outage or a pending proposal does not prevent revocation. Remove only our grant to this recipient; other providers and agreements remain separate."
 eon_sat_com_revoke_tt:0 "As the provider, revoke this country's recorded civilian communications access for free without its approval. Both countries must still exist and be distinct, with recorded access identifying our grant. Direct war, a service outage or a pending proposal does not prevent revocation. Remove only our grant to this recipient; other providers and agreements remain separate."
