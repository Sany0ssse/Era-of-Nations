 Syrianew.1.t: "Future of Ba'ath"
 Syrianew.1.d: "There is no place for the Baath Party's rigid hierarchy in our new system. We need to decide what to do with them. On the one hand, we could bring the party into the coalition for symbolic reasons. On the other hand, we could support the pro-Iraqi faction and integrate everyone into it."
 Syrianew.1.a: "Let's bring Bashaar's men in!"
 Syrianew.1.b: "Nationalist connections might be useful"
 Syrianew.1.c: "We don't need these idiots!"

