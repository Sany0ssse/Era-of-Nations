 #Missing Focus Localizations
 SYR_Mejd_Insanity: "§0Mejd Insanity§!"
 SYR_Mejd_Insanity_desc: "The vicious genetic circle is complete. Mejd's mind, long eroded by powders and visions, has finally left the shores of reality. Governing Syria is not an obstacle-it's merely a prerequisite for the job."
 SYR_Hire_a_Home_Psycharist: "Hire a Home Psychiatrist"
 SYR_Hire_a_Home_Psycharist_desc: "When gods speak to you through voices, you need an interpreter. Mejd's personal psycharist isn't meant to cure him, but to provide simultaneous translation from delusion into decrees."
 SYR_Assemble_a_Regency_Council: "Assemble a Regency Council"
 SYR_Assemble_a_Regency_Council_desc: "Since Mejd is busy conversing with ancestral spirits, state affairs must be handled by those who haven't yet learned to fly. The Regency Council will run the country while the king chats with Gilgamesh."
 SYR_Ensure_Drug_Supply: "Ensure Drug Supply"
 SYR_Ensure_Drug_Supply_desc: "To see the future, one needs quality materials. We are nationalizing every lab and greenhouse-Captagon is no longer just a commodity; it's the strategic fuel for our leader's clairvoyance."
 SYR_Words_Of_the_Mental_Breakdown: "Words of the Mental Breakdown"
 SYR_Words_Of_the_Mental_Breakdown_desc: "Mejd's speech to the nation was incoherent yet hypnotic. He promised to turn the Euphrates into milk and the desert into a glass palace. The people rejoice, for only a true prophet can spew such beautiful nonsense."
 SYR_Establish_Electrical_Engineering_Facilities: "Establish Electrical Engineering Facilities"
 SYR_Establish_Electrical_Engineering_Facilities_desc: "Mejd claims he can hear electricity. No one quite understands what that means, but we are already buying equipment. It might lead to a technological breakthrough-or mass nationwide hallucinations."
 SYR_establish_drug_industries: "Establish Drug Industries"
 SYR_establish_drug_industries_desc: "Artisanal production is no longer sufficient. We will build factories whose chimneys exude a sweet, hazy smoke. The economy must be narcotic!"
 SYR_Give_Away_Assad_Family_Wealth: "Give Away Assad Family Wealth"
 SYR_Give_Away_Assad_Family_Wealth_desc: "Mejd doesn't need gold; he needs followers. He orders the clan's billions to be given to the poor. The poor say the money smells like Captagon, but who listens to them?"
 SYR_Drug_Production_Support: "Drug Production Support"
 SYR_Drug_Production_Support_desc: "Chemists are Syria's new elite. Mejd personally oversees the creation of new synthetic formulas, capable of either healing the nation or sending it on a collective journey across dimensions."
 SYR_The_New_Gilgamesh: "The New Gilgamesh"
 SYR_The_New_Gilgamesh_desc: "Mejd has declared himself the reincarnation of the King of Uruk. He seeks immortality not in herbs, but in pills. His most loyal drug courier has been appointed as his Enkidu."
 SYR_Hear_The_Voices: "Hear the Voices"
 SYR_Hear_The_Voices_desc: "Mejd is convinced that radio stations are broadcasting personal messages to him from the Sumerian gods. We have increased transmitter power to drown out the skeptics with cosmic static."
 SYR_Gods_Have_Spoken: "Gods Have Spoken"
 SYR_Gods_Have_Spoken_desc: "The prophecy is fulfilled. Marduk and Ishtar (at least in Mejd's head) have blessed his reign. From now on, every decree is divine; to argue is to argue with the heavens themselves."
 SYR_Invite_Foreign_Mercenaries: "Invite Foreign Mercenaries"
 SYR_Invite_Foreign_Mercenaries_desc: "Local soldiers are too grounded. We need mercenaries from across the globe-preferably with unhinged eyes and a willingness to walk through fire for a pill and a promise of paradise."
 SYR_Support_Egyptian_Priests: "Support Egyptian Priests"
 SYR_Support_Egyptian_Priests_desc: "Mejd considers Egyptian priests his kindred spirits. In exchange for financial support, they promise to open a portal to the underworld. We're fine with it if it helps us win the war."
 
 SYR_Bursha_Ascend: "§GBushra Ascends§!"
 SYR_Bursha_Ascend_desc: "For the first time in the modern Middle East, a woman takes the reins of Syria. Hafez's daughter, Bashar's sister-Bushra al-Assad challenges tradition and offers the nation a new path: a path of reason, dialogue, and gradual reform."
 SYR_Crush_Gender_Prejudices: "Crush Gender Prejudices"
 SYR_Crush_Gender_Prejudices_desc: "In a society where a woman in power seemed impossible just yesterday, Bushra starts with the basics: education and propaganda. School curricula are rewritten, state media receives clear instructions-talent has no gender."
 SYR_Conservative_Femenism: "Conservative Feminism"
 SYR_Conservative_Femenism_desc: "Bushra proposes a Syrian path to women's emancipation: without breaking with tradition, without aggressive Western radicalism, but with real rights and opportunities. A woman can be both the guardian of the hearth and a minister."
 SYR_Ensure_Women_Representation: "Ensure Women Representation"
 SYR_Ensure_Women_Representation_desc: "Words must be backed by deeds. A mandatory quota for women in parliament, civil service, and courts is introduced. Bushra's voice now has a thousand reflections."
 SYR_Intelligence_Links: "Intelligence Links"
 SYR_Intelligence_Links_desc: "As Hafez's daughter, Bushra has known the value of information since childhood. She establishes personal channels with the Mukhabarat, transforming the secret services from a tool of fear into a tool for overseeing reforms."
 SYR_Egalitarian_Campaning: "Egalitarian Campaigning"
 SYR_Egalitarian_Campaning_desc: "Bushra launches a massive public campaign calling for equality for all citizens before the law-regardless of confession, ethnicity, or origin. Alawites, Sunnis, Kurds, Christians-all Syrians."
 SYR_Embrace_Secular_Thought: "Embrace Secular Thought"
 SYR_Embrace_Secular_Thought_desc: "Religion is a matter of conscience; the state is a matter of law. Bushra proclaims a course towards deepening secular principles, separating politics from dogma, and inviting the intelligentsia to dialogue."
 SYR_Judical_Fair_Reform: "Judicial Fair Reform"
 SYR_Judical_Fair_Reform_desc: "An independent judiciary is the foundation of progress. Bushra initiates a purge of corrupt judges and appoints principled jurists capable of ruling by law, not by phone call."
 SYR_Affordable_Social_Care: "Affordable Social Care"
 SYR_Affordable_Social_Care_desc: "A woman in power means caring for the vulnerable. Bushra expands the network of social institutions, makes healthcare more accessible, and introduces benefits for large families."
 SYR_Partical_Economic_Liberalization: "Partial Economic Liberalization"
 SYR_Partical_Economic_Liberalization_desc: "Bushra understands: the state cannot manage every shop. Small and medium businesses gain freedom, but strategic sectors remain under state control. This is not shock therapy, but treatment."

