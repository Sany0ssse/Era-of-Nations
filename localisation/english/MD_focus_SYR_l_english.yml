 SYR_diplomatic_effort: "Diplomatic Effort"
 SYR_diplomatic_effort_desc: "The Middle East is a troubled place and we must navigate carefully with our diplomacy in the region"
 SYR_affirm_claims_on_golan: "Affirm Claims on Golan"
 SYR_affirm_claims_on_golan_desc: "Israel has occupied the Golan Heights since the Six-Day War. We need to announce to the international world that we still see this area as one of our core states, and that Israel's occupation is illegal"
 SYR_renounce_claims_on_golan: "Renounce Claims on Golan"
 SYR_renounce_claims_on_golan_desc: "Israel has occupied the Golan Heights for a very long time now. The area is mainly inhabited by Israeli Jews. We should admit we lost the war and renounce claims on the region and start repairing our hostile relations with Israel"
 SYR_negotiate_golan_buy: "Negotiate Golan Buy"
 SYR_negotiate_golan_buy_desc: "The occupation of the Golan Heights is a bleeding wound in our national pride. Yet, perhaps a radical solution exists. We will open clandestine, high-level channels with Tel Aviv to propose an unprecedented transaction: the outright purchase of the territory. This would be a monumental financial burden, bordering on extortion, but it would achieve through capital what decades of threats and diplomacy have failed to do-restore our land without another catastrophic war"
 SYR_meet_hamas: "Meet Hamas"
 SYR_meet_hamas_desc: "Hamas is the main competitor of Fatah. They have focused more on liberating Palestine through armed struggle rather than diplomacy"
 SYR_supply_pij: "Supply Palestinian Islamic Jihad"
 SYR_supply_pij_desc: "The most committed and uncompromising fighters against the Zionist entity are not in the halls of government, but in the shadows. By establishing a secure logistical corridor to the Palestinian Islamic Jihad, we arm the vanguard of the resistance. This support will intensify the pressure on Israel, ensure our voice in the most radical circles of the Palestinian struggle, and solidify our alliance with those who share our refusal to ever accept the occupation"
 SYR_new_intifada: "New Intifada"
 SYR_new_intifada_desc: "We must encourage Hamas to start a new Intifada against the Israeli occupiers"
 SYR_meet_fatah: "Meet Fatah"
 SYR_meet_fatah_desc: "Fatah is the main competitor of Hamas. They focus more on achieving Palestinian rights through diplomacy"
 SYR_diplomatic_pressure_on_israel: "Protect Palestine"
 SYR_diplomatic_pressure_on_israel_desc: "We need to protect the Palestinians. By announcing that we are the protectors of Palestine, Israel will be less likely to be aggressive against them"
 SYR_palestinian_training_camps: "Palestinian Training Camps"
 SYR_palestinian_training_camps_desc: "Establish dedicated military training facilities on our soil for allied Palestinian forces. This program will provide essential combat instruction and tactical coordination, enhancing the capabilities of our partners in Gaza and the West Bank for one year"
 SYR_PLA_support: "PLA Support"
 SYR_PLA_support_desc: "Formalize and expand our military support to the Palestine Liberation Army, transforming it into a more professional and effective fighting force for the liberation of Palestine"
 SYR_fortify_golan_heights: "Fortify Golan Heights"
 SYR_fortify_golan_heights_desc: "Initiate the construction of a major defensive line on our border with Israel, turning the Golan region into an impregnable fortress against any potential attack from the south"
 SYR_liwa_al_quds: "Liwa al-Quds"
 SYR_liwa_al_quds_desc: "Form and deploy 'Liwa al-Quds' (The Jerusalem Brigade), a new elite special forces division composed of four highly trained battalions. This unit, created from our most dedicated Palestinian recruits in Syria, will serve as a rapid intervention force for critical operations"
 SYR_humanitarian_links_to_gaza: "Humanitarian Links to Gaza"
 SYR_humanitarian_links_to_gaza_desc: "Establish a dedicated 'humanitarian corridor' to deliver essential supplies to Gaza. While food and medicine will be on the manifest, the convoys will carry a more strategic cargo - infantry equipment to bolster the defenses of our allies. This increases their resilience and resolve, while naturally raising tensions with those who would see Gaza remain isolated"
 SYR_repair_relations_with_israel: "Repair Relations With Israel"
 SYR_repair_relations_with_israel_desc: "We've long been hostile against Israel for no reason. We need to end this hatred and start building peace in the Middle East"
 SYR_one_state_solution: "Support One-State Solution"
 SYR_one_state_solution_desc: "Israel has the rightful claim to its territories. They have proven this by defending their land for decades. We need to accept the reality that Israel is here to stay and the Palestinians should learn to live with it"
 SYR_two_state_solution: "Support Two-State Solution"
 SYR_two_state_solution_desc: "Peace is best established by dividing Israel into two; A Palestinian territory and an Israeli territory. This way both parties can live in peace on their own land"
 SYR_disband_palest_militias: "Disband the Palestine Militias"
 SYR_disband_palest_militias_desc: "For decades, the Palestine Liberation Army (PLA) has existed in a legal gray area within our borders-formally the military wing of the PLO, yet funded, equipped, and directed by Damascus. These militias drain our resources, complicate our chain of command, and provide a permanent casus belli for Israel. By formally dissolving the PLA and integrating its most reliable elements into our regular forces, we can cut a source of instability, streamline our military, and send a powerful signal to Tel Aviv and the world about our desire for a more predictable regional order"
 SYR_disband_pal_militias: "Disbanded the Palestinian Militia"
 SYR_syria_isr_trade_pact: "Trade Pact with Israel"
 SYR_syria_isr_trade_pact_desc: "With the most contentious territorial issues settled through unprecedented means, a fragile window for normalcy has opened. We propose a formal, limited trade pact with Israel. This would not be a celebration of friendship, but a cold, mutually beneficial arrangement: access to Haifa's Mediterranean port for our exports in exchange for secure overland routes for Israeli goods to the Arab hinterland. Such an accord would tether our economies together, making the cost of future conflict prohibitively high for both sides and quietly integrating Syria into a new Levantine economic sphere"
 SYR_establish_military_isr: "The Sword and the Olive Branch"
 SYR_establish_military_isr_desc: "The strength of the Israeli Defense Forces is undeniable, forged in constant conflict. To modernize our own army, we must learn from the best-even if they are our former adversaries. This initiative will establish a formal framework for joint military exercises. Our officers will train alongside theirs in advanced counter-terrorism tactics, signal intelligence, and integrated air defense. This is not an alliance, but a professional exchange. It will provide an irreplaceable boost to our military's capabilities, though it will undoubtedly draw accusations of betrayal from across the Arab world and risk creating dangerous dependencies"
 SYR_invite_mossad: "Invite Mossad"
 SYR_invite_mossad_desc: "To sit with the Zionist enemy is one thing. To invite their spies into the heart of our security apparatus is an act that defies every principle of our revolution. Yet, their knowledge is undeniable. This initiative would establish a deniable liaison office of Mossad within Damascus itself, tasked with joint counter-terrorism and intelligence sharing. The intel windfall could decimate our enemies, but the moral cost is incalculable. If exposed, it would not merely cause riots - it could shatter the regime's legitimacy forever, proving to every Arab that we have become what we swore to destroy"
 SYR_blockade_hezbollah: "Impose a Blockade against Hezbollah"
 SYR_blockade_hezbollah_desc: "Our border with Lebanon has become a sieve for weapons, fighters, and proxy ambitions, dragging us into conflicts not of our making. Hezbollah's state-within-a-state threatens to ignite a regional war that would consume us first. By imposing a strict military and intelligence blockade on their supply lines through our territory, we reclaim control of our borders. This will anger Tehran and fracture the 'Axis of Resistance', but it is a necessary step to assert our national sovereignty, reduce Israeli pretexts for escalation, and signal to the world that Damascus is no longer a transit point for perpetual conflict"
 SYR_join_israeli_agreements: "Join the Abraham Accords"
 SYR_join_israeli_agreements_desc: "To sign this document is to drive the final nail into the coffin of the Pan-Arab cause we once championed. We will not merely 'normalize'-we will enter into a military and economic compact with the Zionist state, under American auspices. It promises an end to sanctions, a flood of Gulf capital, and security guarantees. Yet it demands we turn our guns away from Israel and towards our former allies. The 'Beating Heart of Arabism' will become its gravedigger. The streets may erupt, the officer corps may split, but the architects of this new Levant believe that empires are built not on principles, but on power and patronage"
 SYR_intervene_in_yemen: "Intervene in Yemen"
 SYR_intervene_in_yemen_desc: "The chaos in Yemen threatens the entire peninsula. We will extend an unprecedented offer to Riyadh and Tel Aviv: a coordinated military campaign to dismantle the hostile regime in Sana'a. For the Saudis, we offer Syrian ground forces to break the stalemate. For the Israelis, we offer a chance to strike a blow against Iranian influence far from their borders. This tripartite alliance would be a geopolitical earthquake, proving that realpolitik can overcome decades of enmity"
 SYR_levant_defence_pact: "Jerusalem Defence Pact"
 SYR_levant_defence_pact_desc: "Jerusalem must be defended with anyone who would take it. We need to gather our allies"
 SYR_invite_jordan: "Invite Jordan"
 SYR_invite_jordan_desc: "Jordan hosts a large Palestinian diaspora, and they've often criticised Israel for their actions against the Palestinians. With their help, we'll be able to access the West Bank quickly if conflict erupts"
 SYR_invite_egypt: "Invite Egypt"
 SYR_invite_egypt_desc: "Egypt has long been a lifeline to the Gaza strip and has even administered the region at one point in its history. Allying with them will help us secure the Southern flank against Israel and help us protect Gaza"
 SYR_meeting_with_kings: "Meet the King"
 SYR_meeting_with_kings_desc: "The relations between us and [SAU.GetName] have varied a lot throughout the Cold War and modern day. We can not deny their existence, and we have to learn to live with them. [ROOT.GetLeader] should meet with [SAU.GetLeader] to improve the standings between our countries"
 SYR_open_saudi_mosques: "Open Saudi Mosques"
 SYR_open_saudi_mosques_desc: "Saudi Arabia funds many mosques and madrassas all across the globe. We should reach out to them and ask them to fund them for us as well. This will of course grant them some influence over us, and it is well known that some of the imams in the Saudi run mosques aren't the most tolerant kind"
 SYR_saudi_oil_cooperation: "Saudi Oil Cooperation"
 SYR_saudi_oil_cooperation_desc: "Both we and the Saudis are oil producing countries. It would be beneficial for us to increase cooperation in this field"
 SYR_join_peninsula_shield: "Show Interest in the Peninsula Shield"
 SYR_join_peninsula_shield_desc: "The Peninsula Shield is the military of the Gulf Cooperation Council. We need to signal Saudi Arabia that we wish closer integration with the Peninsula Shield"
 SYR_talk_to_gulf_states: "Talk to Gulf States"
 SYR_talk_to_gulf_states_desc: "Years of confrontation have left us isolated from the wealthiest capitals in our own region. It is time to break the ice. We will open discreet diplomatic channels with the monarchies of the Gulf Cooperation Council. The goal is not friendship, but mutual benefit: access to their investment, technology, and markets in exchange for political moderation on our part. A successful opening could funnel vital capital into our economy and even secure expertise to bolster our domestic fuel production"
 SYR_cooperation_with_yemen: "Cooperation with Yemen"
 SYR_cooperation_with_yemen_desc: "We will establish direct economic channels with factions in Yemen, focusing on trade and investment in infrastructure to open a new market and secure resources"
 SYR_approach_bahrain: "Approach Bahrain"
 SYR_approach_bahrain_desc: "Establish economic dialogue with Bahrain to negotiate trade deals and develop cooperation in the financial and banking sector"
 SYR_business_with_uae: "Business with UAE"
 SYR_business_with_uae_desc: "Initiate commercial and investment talks with the United Arab Emirates to establish new trade agreements and explore joint economic ventures"
 SYR_saudi_military_cooperation: "Saudi Military Cooperation"
 SYR_saudi_military_cooperation_desc: "The Gulf Countries conduct a lot of military operations together. They also have their own research cooperation program, which we definitely should join."
 SYR_saudi_oil_investments: "Saudi Oil Investments"
 SYR_saudi_oil_investments_desc: "We should ask the Saudis to invest into some of our oilfields to increase our oil production"
 SYR_trade_deal_with_egypt: "Trade Deal with Egypt"
 SYR_trade_deal_with_egypt_desc: "Egypt is a large and powerful country near us, and we've had close links to them in the past. We should setup a trade deal with them"
 SYR_restore_political_ties: "Restore Political Ties with Egypt"
 SYR_restore_political_ties_desc: "A solid trade relationship has been established. It is time to move to the next stage and thaw the political freeze. By restoring high-level dialogue, we can secure Egyptian investment for reconstruction and a powerful partner for the long term"
 SYR_invite_egyptian_investors: "Invite Egyptian Investors"
 SYR_invite_egyptian_investors_desc: "With political channels reopened, we must now secure tangible capital. Let us formally invite Egyptian corporations and state funds to become primary investors in our economy. Granting them favorable terms will unlock the resources we need and inextricably link Egypt's financial future to our growth"
 SYR_covert_airforce_cooperation: "Covert Pilot Training in Egypt"
 SYR_covert_airforce_cooperation_desc: "Our renewed partnership allows us to propose a secret military program. We will send our most promising pilots to train in Egyptian air academies, far from prying eyes. In return, we can offer basing rights or share tactical intelligence. This will forge an elite cadre of aviators bound by shared experience"
 SYR_repair_relations_with_iraq: "Repair Relations with Iraq"
 SYR_repair_relations_with_iraq_desc: "Due to a conflict between the Iraqi and Syrian Ba'athist parties, the relations between our two countries have been very hostile for a long time. Maybe we should repair these relations and make the Ba'athist Parties work together again?"
 SYR_smuggle_oil_through_iraq: "Smuggling Iraqi oil"
 SYR_smuggle_oil_through_iraq_desc: "We propose to Baghdad a covert partnership. By allowing Iraqi oil to be discreetly rerouted and exported through our ports and pipelines, we can create a lucrative smuggling corridor that bypasses international sanctions. This will forge a powerful economic and political bond between our Ba'athist brother nations, though it will undoubtedly provoke the ire of the United States and its allies"
 SYR_regional_alliance: "Regional Alliance"
 SYR_regional_alliance_desc: "With our Ba'athist ideology firmly established, we can look beyond our borders. A formal alliance with a fellow Ba'athist or compatible nationalist regime in Iraq would secure our eastern flank and strengthen the cause of Arab socialism and unity in the region"
 SYR_al_douri_support: "Support for al-Douri's Faction"
 SYR_al_douri_support_desc: "The Ba'athist cause is strongest when its vanguards stand united. By extending our direct support to Izzat al-Douri's loyalists within the Iraqi power structure, we will help fortify our ideological brother-state against external threats. Together, we can prepare covert networks, train dedicated guerrilla cadres, and ensure that the heart of the Arab world is ready to face any aggression"
 SYR_revive_baathist_dream: "Revive the Ba'athist Dream"
 SYR_revive_baathist_dream_desc: "One of the core tenets of Ba'athism is Arab nationalism, and the aimed creation of a pan-Arabic state. Currently the Ba'ath Party is split into to factions, the Syrian and the Iraqi dominated ones. Many of the Ba'athist Parties are minor parties on the border of obscurity. We must first throw some funds to the regional branches of the Syrian dominated faction to show that Ba'athism is the hip new thing"
 SYR_baathist_renaissance: "Ba'athist Renaissance"
 SYR_baathist_renaissance_desc: "The Iraqi dominated faction of Ba'athism is more widespread than the Syrian dominated one. We need to fund them as well, if we wish to fulfill our dreams"
 SYR_the_arab_union: "Form the United Arab Republic"
 SYR_the_arab_union_desc: "The United Arab Republic was a short lived union between Egypt and Syria. In addition to the Republic, there have been several suggestions and attempts to unify the Arab countries into a single state led by countries such as Libya, Iraq and Jordan. Even though the Union failed, we need to try again. Egypt is ready to unify with us again"
 SYR_integrate_the_union: "Integrate the Union"
 SYR_integrate_the_union_desc: "We need to bring the Arab Union close by uniting all its members into a single super state"
 SYR_denounce_iraq: "Denounce Iraq"
 SYR_denounce_iraq_desc: "Iraq is a despicable state led by the wrong kind of Ba'athists. We definitely shouldn't be calling them friends, instead we should call out their vile practices"
 SYR_iranian_sponsorship: "Iranian Sponsorship"
 SYR_iranian_sponsorship_desc: "The Iranians would make a perfect ally for us. They are Shia just like us, and they share our world view"
 SYR_fund_hezbollah: "Fund Hezbollah"
 SYR_fund_hezbollah_desc: "Hezbollah is a strong armed group operating mainly in Lebanon. They have a very strong militia, and having them on our side is surely beneficial"
 SYR_fund_shia_militias: "Fund the Shia Militias"
 SYR_fund_shia_militiash_desc: "To secure our hinterland and extend our influence, we will provide arms, funding, and training to local Shia militias across Syria. These groups will act as our eyes, ears, and enforcers, rooting out dissent and creating a loyal network that strengthens the entire axis of resistance from within"
 SYR_iranian_investments: "Iranian Investments"
 SYR_iranian_investments_desc: "Iran seeks to strengthen our alliance through economic investment. We should welcome their capital into our industrial and military sectors"
 SYR_iran_syria_bank: "Iran-Syria Joint Bank"
 SYR_iran_syria_bank_desc: "To crush the financial hegemony of our enemies, we must create our own independent financial system. A joint bank with Iran will become the economic cornerstone of our axis, providing resources for war and insulating us from foreign pressure"
 SYR_strategic_iran_supply: "Iranian Strategic Supplies"
 SYR_strategic_iran_supply_desc: "We will offer Iran a deal in exchange for direct military support, including troops and weapons, and create a secure supply corridor through our southern territories for their most important ally, Hezbollah"
 SYR_the_resistance_axis: "Join the Resistance Axis"
 SYR_the_resistance_axis_desc: "The Resistance Axis is a collection of anti-US states in the Middle East headed by Iran. It is in our strategic interest to ally with them"
 SYR_iranian_quds: "Iranian Quds"
 SYR_iranian_quds_desc: "The Iranian Quds is a special force/paramilitary unit of the Iranian Revolutionary Guard Corps. They are Iran's special tool in spreading its influence in global conflicts"
 SYR_irgc_military_college: "IRGC University of Command and Staff"
 SYR_irgc_military_college_desc: "The University of Command and Staff is the military staff school of the Iranian Revolutionary Guard Corps. It concentrates on irregular military science as dictated by the IRGC's military doctrine"
 SYR_buy_military_hardware: "Buy Military Hardware"
 SYR_buy_military_hardware_desc: "Negotiate a substantial purchase of advanced military hardware from Iran. This procurement deal will also include technical assistance to significantly upgrade four key departments of our intelligence agency, enhancing our electronic, economic, counter-insurgency and training capabilities"
 SYR_iranian_specialists: "Iranian Specialists"
 SYR_iranian_specialists_desc: "Formalize a program to bring Iranian military advisors and technical experts to Syria. Their presence will provide direct training to our forces and share valuable industrial know-how, strengthening our military capabilities through shared expertise"
 SYR_iran_syria_pipeline: "Build a Syrian-Iranian Pipeline"
 SYR_iran_syria_pipeline_desc: "In a changing world, energy is power. By building the 'Friendship Pipeline' from the Iranian South Pars field through Iraq to our Mediterranean coast, we secure a lifeline for our economy. This 5,600-kilometer artery will not only fuel our industries but, by granting our allies a strategic outlet to Europe, will make Syria an indispensable energy hub. It is a bold statement of independence and a path to future prosperity, binding the economies of Tehran, Baghdad, and Damascus together"
 SYR_qatar_syria_pipeline: "Build the Qatar-Levant Pipeline"
 SYR_qatar_syria_pipeline_desc: "For centuries, the Levant has served as the natural bridge between the Arabian Peninsula, Anatolia, and the Mediterranean basin. The Qatar–Levant Pipeline aims to establish an alternative energy corridor by linking the gas fields of Qatar to the eastern Mediterranean through the heart of Greater Syria. By offering a Gulf-to-Europe route independent of Iranian infrastructure, this project would elevate Damascus into a central transit hub, reshape regional energy flows, and strengthen Syria's leverage between competing powers"
 SYR_iran_riot_gear: "Iran Riot Gear"
 SYR_iran_riot_gear_desc: "Our cooperation with Tehran extends to internal security. A new shipment of advanced riot control equipment and tactical gear will be delivered, along with Iranian advisors to train our Interior Ministry forces. This will significantly enhance the capability of our security apparatus to maintain public order and stability"
 SYR_reaffirm_claims_on_hatay: "Reaffirm Claims on Hatay"
 SYR_reaffirm_claims_on_hatay_desc: "Hatay was ceded to Turkey by the French in the 1930s. This was done without our consent. The region still has a strong Alawite population, and the area should be returned to Syria"
 SYR_provide_intelligence_to_pkk: "Provide Intelligence to PKK"
 SYR_provide_intelligence_to_pkk_desc: "The PKK is a Kurdish guerrilla group operating in Turkey. They have been the fighting the Turkish government for decades now, trying to establish an independent Kurdistan. We should provide intelligence on Turkish military to them to undermine Turkey's influence in the region"
 SYR_pkk_training_camps: "Establish PKK Training Camps"
 SYR_pkk_training_camps_desc: "We need to setup training camps for the PKK guerrillas in Northern Syria. This means the efficiency of the PKK will be increased, and maybe some of them will be willing join us"
 SYR_please_rojava: "Please Rojava"
 SYR_please_rojava_desc: "The northeast requires a delicate touch. By reaching informal agreements with local Kurdish leadership, we can secure Hasakah without immediate conflict. This diplomatic maneuvering is costly and hurts our prestige, but it buys us much-needed stability."
 SYR_weapons_to_pkk: "Supply Weapons to PKK"
 SYR_weapons_to_pkk_desc: "The PKK can't fight without weapons. We need to supply these to them, so they will become stronger and more aligned to us in case they ever gain independence"
 SYR_strongarm_minorities: "Strongarm Minorities"
 SYR_strongarm_minorities_desc: "The ancient Assyrian communities within our borders possess a strong martial tradition that can be turned to the state's advantage. By forming dedicated battalions under the Syrian flag, we channel their loyalty into national defense, ensuring their integration. Furthermore, why waste resources guarding restless minorities when they can guard our frontiers instead? Conscripting their men into special units ensures their strength serves the state, with their own kin in the line of fire acting as the ultimate guarantor of compliance"
 SYR_approach_armenia: "Approach Armenia"
 SYR_approach_armenia_desc: "Armenia is one of Turkey's neighbours, and they have very cool relations with each other. We should approach Armenia and try to befriend them"
 SYR_military_coop_with_armenia: "Military Cooperation Pact with Armenia"
 SYR_military_coop_with_armenia_desc: "Our isolation is a weakness that can be turned into strength By reaching out to Yerevan we can propose a formal agreement for mutual military access and joint training This would create a strategic partnership with a nation that understands the meaning of sovereignty under siege and forge a new link between the Levant and the South Caucasus" 
 SYR_approach_greece: "Approach Greece"
 SYR_approach_greece_desc: "Greece has a long standing dispute with Turkey over some of the islands in the Aegean. It would be beneficial to get on their good side"
 SYR_support_cyprus: "Support Cyprus"
 SYR_support_cyprus_desc: "The island of Cyprus is divided between the Turkish controlled North and the Cypriot controlled South. We should support Cyprus in their efforts to become the dominant faction of the island"
 SYR_little_hagia_sophia: "Little Hagia Sophia"
 SYR_little_hagia_sophia_desc: "Stone by stone, dome upon dome, the Little Hagia Sophia shall rise over Syria. It is our answer to Ankara, our testament to a faith unbroken, and our pledge of gratitude to Moscow. Here, in the heart of the Levant, we will answer history itself - in marble and faith"
 SYR_renounce_claims_on_hatay: "Renounce Claims on Hatay"
 SYR_renounce_claims_on_hatay_desc: "We haven't controlled Hatay for almost a century now. We should relinquish our claims to it and repair our relations with Turkey"
 SYR_close_pkk_border: "Close Kurdish Border"
 SYR_close_pkk_border_desc: "We should increase our monitoring efforts on the Syrian-Turkish borders to make sure that PKK fighters don't use it to escape from Turkey"
 SYR_suppress_kurds: "Suppress Kurds"
 SYR_suppress_kurds_desc: "The time for half-measures is over. We will launch a sustained campaign to dismantle Kurdish separatist networks through military pressure and political suppression. Simultaneously, we will make a direct overture to Turkey: their enemy is our enemy. Proposing a de facto security condominium in border regions, we seek to align Ankara's considerable military resources with our own efforts, ensuring the separatist cause is strangled from both sides"
 SYR_approach_azerbaijan: "Approach Azerbaijan"
 SYR_approach_azerbaijan_desc: "Azerbaijan is a close ally to Turkey, and we should reach out to them as well"
 SYR_turkish_delights: "Turkish Delights"
 SYR_turkish_delights_desc: "Turkey is an economic powerhouse of the region. We need to setup economic deals with them that will benefit us both"
 SYR_support_nothern_cyprus: "Support Northern Cyprus"
 SYR_support_nothern_cyprus_desc: "The island of Cyprus is divided between the Turkish controlled North and the Cypriot controlled South. We should support Turkish Cyprus in their efforts to become the dominant faction of the island"
 SYR_approach_pakistan: "Approach Pakistan"
 SYR_approach_pakistan_desc: "Pakistan is not merely a large Islamic nation; it is a nuclear-armed military power with a deep-seated rivalry against India. By establishing a strategic dialogue, we can propose a quid pro quo: access to their industrial and agricultural output in exchange for political support that complicates Indian hegemony. This relationship could grant us a powerful friend far beyond our immediate region and introduce a new variable into the regional balance of power"
 SYR_support_sunnis: "Reaching Out to the Sunni World"
 SYR_support_sunnis_desc: "The line between Shi'a and Sunni is drawn by the enemies of Islam to divide and conquer. True strength lies in the unity of all Muslims. We will actively champion this unity, reaching out to Sunni states not as a minority seeking favor, but as an Islamic power advocating for collective strength. Through joint economic ventures, cultural exchanges, and a shared stance against imperialism, we will prove that our common faith is stronger than the plots meant to splinter us, securing prosperity and sovereignty for the entire Islamic world"
 SYR_turkoman_militias: "Turkoman Militias"
 SYR_turkoman_militias_desc: "The Turkoman communities in northern Syria provide a natural base for loyalist irregular forces. By formally organizing them and integrating volunteer fighters from Turkey's nationalist Grey Wolves movement, we create a potent combined militia. This force is highly motivated to counter Kurdish territorial and political ambitions, possessing both local knowledge and ideologically driven fervor, making it an ideal tool for securing contested regions and conducting asymmetric warfare"
 SYR_approach_russia: "Approach Russia"
 SYR_approach_russia_desc: "Russia has long had friendly dealings with us, as they have continued the Soviet strategy of seeing us as a strategic asset. We should deepend our relations with them, as they make a powerful ally"
 SYR_russian_weapons: "Russian Weapons"
 SYR_russian_weapons_desc: "Russia is a major arms exporter. We should setup deals with them so we get permission to produce some of their weapons locally under a license"
 SYR_approach_uae: "Approach the UAE"
 SYR_approach_uae_desc: "The United Arab Emirates is a rising power in the Middle East with vast financial resources and influence. We should cultivate a strategic partnership with them, as their economic strength and modern outlook could provide crucial support for our national development"
 SYR_uae_weapons: "Procurement Through the UAE"
 SYR_uae_weapons_desc: "The UAE's unique position allows it to acquire advanced Western military technology. We should negotiate deals through them to gain access to modern weapons systems and equipment that are otherwise difficult for us to obtain directly"
 SYR_lease_latakia: "Lease Tartus Naval Base"
 SYR_lease_latakia_desc: "The future of the Tartus naval base must be decided. Will we deepen our historic alliance with Russia in exchange for settling old debts, or court the wealthy UAE ? This choice will define our strategic alignment for years to come"
 SYR_foreign_specialists: "Foreign Specialists"
 SYR_foreign_specialists_desc: "The agreement on Tartus opens the door for deeper military cooperation. We will formalize the deployment of allied advisors - whether seasoned in desert warfare or large-scale combined arms operations - to provide frontline training and oversee the integration of new equipment into our forces"
 SYR_hat_tr_foreign_education: "Advanced Training Programs"
 SYR_hat_tr_foreign_education_desc: "To maximize the benefits of our military cooperation, we will establish advanced academies and joint exercises overseen by our foreign advisors. This will institutionalize their expertise, leading to permanent improvements in our army's doctrine and effectiveness"
 SYR_russian_military_cooperation: "Russian Military Cooperation"
 SYR_russian_military_cooperation_desc: "The CSTO is a powerful military alliance. We should get closer to Russia and formally join them"
 SYR_uae_economic_cooperation: "Economic Cooperation with UAE"
 SYR_uae_economic_cooperation_desc: "The United Arab Emirates possesses immense capital reserves and expertise in large-scale development. We should seek a comprehensive economic partnership that would channel Emirati investment into our critical infrastructure, energy, and telecommunications sectors"
 SYR_join_war_on_terror: "Join War on Terror"
 SYR_join_war_on_terror_desc: "The United States has declared war on terror. We know the threat of extremist Islamists all too well. We should support the US in their efforts to combat terrorism"
 SYR_joint_us_operations: "Joint US Operations"
 SYR_joint_us_operations_desc: "We need to help the US any way we can to fight against terrorism. This includes providing intelligence and allowing them to conduct anti-terror operations within our borders with their special forces"
 SYR_closer_ties_to_france: "Closer Ties to France"
 SYR_closer_ties_to_france_desc: "France is our old colonial overlord, and one of the strongest countries in Europe. Many old French colonies have kept their ties with France, and we should do the same"
 SYR_condemn_taliban: "Condemn the Taliban"
 SYR_condemn_taliban_desc: "The Taliban represent a disgusting form of Islam. We should support the legitimate Afghan government against these terrorists"
 SYR_air_practice_with_britain: "Air Practice with Britain"
 SYR_air_practice_with_britain_desc: "The British have an airbase in Cyprus. This makes them a perfect partner for practicing our airforce with"
 SYR_french_investments: "French Investments"
 SYR_french_investments_desc: "The French like pouring money into their old colonies. We should encourage them to invest into our industrial sector"
 SYR_us_investments: "American Investments"
 SYR_us_investments_desc: "The Americans love their oil. We can ask some American corporations to develop our oil fields further"
 SYR_british_investments: "British Investments"
 SYR_british_investments_desc: "After the air training with the British, they have understood that they need to help us improve our military capabilities to be able to combat terrorism"
 SYR_major_nato_ally: "Become a Major Non-NATO Ally"
 SYR_major_nato_ally_desc: "Major Non-NATO ally is a designation by the US government for countries that are outside NATO but are still important military allies to the US. Becoming an ally to the US will greatly increase our military readiness"
 SYR_harbor_extremists: "Harbor Extremists"
 SYR_harbor_extremists_desc: "The Jihadists are doing God's work battling the great Satan, the United States. We need allow them safe passage through our country and leave them to be"
 SYR_release_extremists: "Release Extremists"
 SYR_release_extremists_desc: "We have many Jihadists in prison, house arrest and roaming our country. We need to release them to cause havoc in our neighbours"
 SYR_arm_palestinians: "Arm Hamas"
 SYR_arm_palestinians_desc: "Hamas is in an armed struggle against Israel. They are the true Mujahideen and we need to ensure that they can keep fighting"
 SYR_supply_taliban: "Supply Taliban"
 SYR_supply_taliban_desc: "The Taliban manage to establish an Islamic State in Afghanistan, but now the Western powers are trying to topple their legitimate rule. We need to ensure that they do not fall"
 SYR_supply_al_shabaab: "Supply Al-Shabaab"
 SYR_supply_al_shabaab_desc: "The Al-Shabaab are a Somalian Jihadist movement. They are currently fighting the Somalian government to establish a state rule by Sharia Law, and they need our help to do it"
 SYR_safehaven_for_islamists: "Safehave for Islamists"
 SYR_safehaven_for_islamists_desc: "We need to provide a safehaven and an operational base to the global jihadist movement. Holy warriors from all over the globe will flock to your banners"
 SYR_ally_alqaeda: "Ally Al-Qaeda"
 SYR_ally_alqaeda_desc: "The Al-Qaeda are a global jihadist organisation. We should formally join their ranks against Western decadence"

 SYR_rebuild_economy: "Rebuild the Economy"
 SYR_rebuild_economy_desc: "The Syrian economy has been devastated by the war. The GDP has fallen to a fraction of what it was pre-war. Making everything run smooth again will be a long and arduous process"
 SYR_cooperate_syrair: "Cooperate With Syrian Airlines"
 SYR_cooperate_syrair_desc: "Before the war, Syrian Airlines was the largest carrier airline in Syria. We need to cooperate with them and offer Syrian refugees free flights home to encourage them to return"
 SYR_fly_damas: "Subsidise FlyDamas"
 SYR_fly_damas_desc: "FlyDamas is a small subsidiary company of Syrian Air. They currently operate only one Boeing 737. We should subsidise them so they can increase their operations"
 SYR_syrian_pearl: "Restart Syrian Pearl"
 SYR_syrian_pearl_desc: "The Syrian Pearl was a shortlived privately owned domestic airline. We need to restart it to offer more flight services to Syrians"
 SYR_invigorate_tourism: "Tourism Boom"
 SYR_invigorate_tourism_desc: "Syria, especially the Latakian coast, was once a massive tourist attraction bringing a large boost to the economy. However, all tourism has essentially ceased to exist due to the war. We need to once again make the tourism sector boom!"
 SYR_2nd_agrarian_reform: "2nd Agrarian Reform"
 SYR_2nd_agrarian_reform_desc: "One of the main reasons for the start of the Syrian civil war was massive crop failure in the summer of 2011, causing mass migration of people from rural areas to cities. In the 1960s the Syrian regime executed a land reform, distributing land and limiting the size of landholdings in the country. The agricultural sector is now in crisis after the war, and a new reform is needed"
 SYR_telecom: "Support Syrian Telecom"
 SYR_telecom_desc: "Syrian Telecom is the state company responsible for Syria's telecommunication network. We need to make sure they stay afloat"
 SYR_syrian_railways: "Invest in Syrian Railways"
 SYR_syrian_railways_desc: "Many rail links were destroyed in the war and most domestic train services were completely stopped. We need to rebuild some of our railway network"
 SYR_national_oil_production: "Increase National Oil Production"
 SYR_national_oil_production_desc: "Oil is a valuable resource which we produce too little. We need to increase our oil production to be much bigger"
 SYR_foreign_oil_fields: "Seek Help From Foreign Oil Companies"
 SYR_foreign_oil_fields_desc: "If we enlist the help of international oil companies and our monetary backers, we will be able to exploit our oil fields further"
 SYR_national_phosphate_expansion: "Phosphate Export "
 SYR_national_phosphate_expansion_desc: "We will offer our high-quality phosphates to nations seeking to boost their harvests. In return, we demand favorable trade terms, technology, or investments that directly benefit our own industrial and agricultural development."
 SYR_foreign_phosphate_expansion: "Foreign Phosphate Expansion"
 SYR_foreign_phosphate_expansion_desc: "Many foreign companies are interested in mining phosphate rock in Syria. We should help them establish business here"
 SYR_economic_improvements: "§YSyrian Economy§!"
 SYR_economic_improvements_desc: "The Syrian economy has been stagnant for years. The GDP growth rate is miniscule when compared to other countries in the region and we need to fix that"
 SYR_increase_agricultural_subsidies: "Increase Agricultural Subsidies"
 SYR_increase_agricultural_subsidies_desc: "The Syrian government has heavily subsidised agriculture for years to ensure domestic food production. This has led to a situation where almost all arable land is cultivated. However, food prices are still heavily impacted by global fluctuations. We should increase subsidies to 6% of GDP make sure the Syrian people have access to affordable food"
 SYR_decrease_agricultural_subsidies: "Decrease Agricultural Subsidies"
 SYR_decrease_agricultural_subsidies_desc: "The Syrian government has heavily subsidised agriculture for years to ensure domestic food production. This has led to a situation where almost all arable land is cultivated. However, the subsidies are taking a toll on the national economy. We should reduce the subsidies to 2% of GDP, even if it leaves to the abandonment of some farm land and an increase in food prices"
 SYR_chateau_bargylus: "Château Bargylus"
 SYR_chateau_bargylus_desc: "Two brothers, Karim and Sandro Saadé are planning to open a winery in Syria. We should support them financially and make the best wines in Eastern Mediterranean"
 SYR_export_bakdash: "Export Bakdash"
 SYR_export_bakdash_desc: "Bakdash is an ice cream parlor in Damascus. The shop was established around 1885 in Al-Hamidiyah Souq in the old city of Damascus. It is famous for its pistachio-covered Booza, a pounded ice cream with an elastic texture made of mastic and sahlab. We should export this delicacy to the rest of the world"
 SYR_bawabet_dimashq: "Bawabet Dimashq"
 SYR_bawabet_dimashq_desc: "Shaker al Samman has plans to open the world's largest restaurant, Bawabet Dimashq, in Damascus. It will have an area of 54000 square meters and will be able to fit 6000 people. With servings from multiple cuisines, this will be a great attraction in Syria!"
 SYR_keep_banks_national: "Keep Banks National"
 SYR_keep_banks_national_desc: "No private bank is allowed to operate in Syria and it should be kept that way. By only having national banks, we can make sure that we can safely invest and protect our people's money"
 SYR_legalise_private_banking: "Legalise Private Banking"
 SYR_legalise_private_banking_desc: "Syria is already in a deep recession, and we don't want to worsen that by keeping outside money away from Syria. We should legalise private banking to increase our economic growth"
 SYR_cbs: "Commercial Bank of Syria"
 SYR_cbs_desc: "The Commercial Bank of Syria is the oldest and largest financial institution in the country, acting as the central clearing house for government and foreign trade transactions."
 SYR_stock_exchange: "Syria's Stock Exchange"
 SYR_stock_exchange_desc: "Syria's only stock exchange, founded in 2009 to attract investment and revive the economy, serves as a barometer of business confidence"
 SYR_siib: "The First Islamic Bank"
 SYR_siib_desc: "Founded in 2007 as a partnership between the private sectors of Syria and Qatar, this first international Islamic bank aims to attract investment and integrate the country into the global Islamic financial system"
 SYR_western_debt_negotiations: "Negotiate with Western Creditors"
 SYR_western_debt_negotiations_desc: "Initiate talks with the United States and European Union to reschedule Syria's foreign debt in exchange for market liberalization and human rights improvements"
 SYR_eastern_debt_negotiations: "Seek Eastern Financial Support"
 SYR_eastern_debt_negotiations_desc: "Approach Russia, Iran, and China for debt forgiveness and new credit lines, strengthening strategic partnerships at the cost of increased dependency"
 SYR_bena_properties: "Bena Properties"
 SYR_bena_properties_desc: "Cham Holdings, owned by the Maklouf family, is planning to setup a real estate company. We should work together with them to help Syrian land development"
 SYR_join_wto: "Join WTO"
 SYR_join_wto_desc: "Syria planned to join the World Trade Organization in the 1950s when it was established, but eventually withdrew its application due to the inclusion of Israel in the organization. Maybe it's time to apply now? It will be a great effort as many of our trade and economic laws need to be adjusted to fit the requirements of the WTO"
 SYR_syrian_qatari_holding_company: "Syrian-Qatari Holding Company"
 SYR_syrian_qatari_holding_company_desc: "We should work together with the Qatari government and setup a common holding company that will invest in Syria, Qatar and world wide"
 SYR_invest_in_tourism: "Invigorate Tourism"
 SYR_invest_in_tourism_desc: "With the improvements and investments we've made to our economy, the tourism industry is growing to numbers never seen before. Soon Syria will be one of the hottest vacation destinations in the Mediterranean"
 SYR_invest_in_research: "Invest in Research"
 SYR_invest_in_research_desc: "We have put a lot of money into our economy now. We should divert some of the money to be used in research centers and universities"
 SYR_hmisho_steel: "Invest in Hmisho Steel S.A"
 SYR_hmisho_steel_desc: "The Hmisho Trading Group is planning to expand its steel mill operation. We need to subsidise them to expand their production"
 SYR_cooperate_with_saipa: "Cooperate With SAIPA"
 SYR_cooperate_with_saipa_desc: "SAIPA is an Iranian automanufacturer producing Citroens under license and even its own line of cars. Hmisho Trading Group is interested in cooperating with them and move some of the production to Syria"
 SYR_expand_oil_refineries: "Expand Oil Refineries"
 SYR_expand_oil_refineries_desc: "While not a large oil producer globally, we are a rathe large local oil producer. We need to expand our oil refining capabilities to be on par with our neighbours"
 SYR_found_syriatel: "Found Syriatel"
 SYR_found_syriatel_desc: "There is currently only one mobile network provide in Syria, MTN Syria. We should setup another company to offer services as well"
 SYR_electronics_school: "Syrian Electronics University"
 SYR_electronics_school_desc: "The future of the world is on the internet and communications technology. We need to found a school dedicated to these fields so we can be at the forefront of technology"
 SYR_syrian_anime: "Syrian Anime"
 SYR_syrian_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We should encourage this behaviour"
 SYR_technological_investments: "Technological Investments"
 SYR_technological_investments_desc: "Our technology is extremely outdated it can't be simply ignored. We'll have to do something"
 SYR_digitalisation_campaign: "Digitalization Campaign"
 SYR_digitalisation_campaign_desc: "Our technological infrastructure is extremely outdated and inefficient for today's standards. We should divert funds towards the research and buildup of newer tech to tackle this hindering issue"
 SYR_chinese_anime: "Chinese Anime"
 SYR_chinese_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We have to expand their capabilities and encourage cooperation with Chinese anime studios. Even though they aren't as popular as their competitors, the chinese animation industry is very successful nonetheless and it's a great idea for us to learn and cooperate with them to be the leading animation producers in the middle east and arab world"
 SYR_domestic_anime: "Domestic Anime"
 SYR_domestic_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. Our own culture and aesthetics should not be influenced by outside themes and we don't need foreign expertise. We will fully rely on ourselves and not try to seek out help from foreign animation giants"
 SYR_japanese_anime: "Japanese Anime"
 SYR_japanese_anime_desc: "Venus Centre, a company based in Damascus, is currently the only dubbing company that dubs Japanese anime (and other cartoons) to Arabic. We have to expand their capabilities and encourage cooperation with Japanese anime studios. The unopposed animation giant will surely be of immense help when it comes to setting up our animation industry and producing the most popular works in the middle east"
 SYR_tartus_service_sector: "Tartus's Service Sector"
 SYR_tartus_service_sector_desc: "The service sector is one of the most attractive sectors for employment in the city of Tartus. As a high percentage of its inhabitants with good scientific qualifications work in the service sector, and they are distributed between the public and private sectors"
 SYR_expand_the_sector: "Expand Private Sector in Latakia"
 SYR_expand_the_sector_desc: "The participation of the private sector in Latakia is still below the required level compared to other coastal cities in the Mediterranean. We should invest specifically here to transform the city into an attractive economic hotspot by leveraging its port and expanding its service and commercial infrastructure"
 SYR_service_sector_in_lacking_regions: "Investment To Lacking Service Regions"
 SYR_service_sector_in_lacking_regions_desc: "While the service sector in Tartus is well and thriving the same can't be said for other equally if not more important cities, and through economic encouragement of skilled workers to work outside Tartus and investment in promising businesses we will remedy this situation"
 SYR_expand_powerstations_in_homs: "Expand Homs's Powerstations"
 SYR_expand_powerstations_in_homs_desc: "A low number of powerstations exist in our country and this has been a persisting and annoying issue. We will build a number of powerstations in homs due to it's central location being the junction of syria and the presence of a big oil refinary in the city"
 SYR_tap_into_the_oil_reserves: "Tap Into The Oil Reserves"
 SYR_tap_into_the_oil_reserves_desc: "The oil reserves in the eastern part of the country look promising and await our drills to extract them"
 SYR_kings_highway: "Revive the King's Highway"
 SYR_kings_highway_desc: "The ancient King's Highway once connected empires and facilitated the flow of riches, culture, and ideas. By investing in the restoration and promotion of this historic route, we can unlock the economic potential of our interior regions, boost domestic trade, and attract tourists seeking to walk the paths of history"
 SYR_road_to_palmyra: "Road To Palmyra"
 SYR_road_to_palmyra_desc: "Palmyra is a crucial archaeological site that has attracted decent numbers of tourists. We will improve infrastructure and roads to make it easier for tourists to visit the landscape."
 SYR_expand_latakian_airport: "Expand Latakia Airport"
 SYR_expand_latakian_airport_desc: "The latakian airfield is used for military purposes. However, there is alot of potential for it to be used for civilian airlines due to the city being a tourist hotspot thus we will start investing in it"
 SYR_cultural_centers_initiative: "Cultural Centers Initiative"
 SYR_cultural_centers_initiative_desc: "Establish modern cultural centers, museums, and art galleries in major cities to promote Syrian arts, attract cultural tourism, and stimulate the creative economy"
 SYR_restore_historical_sites: "Restore Historical Sites"
 SYR_restore_historical_sites_desc: "Invest in the restoration and preservation of Syria's ancient heritage sites, including Palmyra, Aleppo Citadel, and Krak des Chevaliers, to attract international tourists and gain UNESCO recognition"
 SYR_idlib_aleppan_investments: "Idlib-Aleppo Agricultural Ties"
 SYR_idlib_aleppan_investments_desc: "Aleppo has a huge economic presence in Idlib's agriculture. We will encourage further investments to benefit both regions and encourage the agroindustrial potential of the two cities"
 SYR_idlib_contest_aleppan_investments: "Contest Aleppo's Presence"
 SYR_idlib_contest_aleppan_investments_desc: "While Aleppo's economic presence in Idlib is beneficial to both cities, this state of affairs might make the economic forces outside of our control gain unwanted power. We should contest their presence by investing in Idlib and reducing aleppo's economic ambitions in the region"
 SYR_provisions_to_daraa: "Provisions To Daraa"
 SYR_provisions_to_daraa_desc: "Daraa suffered from reduced water supply in the region and had been straining under the influx of internal refugees who were forced to leave their northeastern lands due to a drought exacerbated by the government's lack of provision. We will invest in the region and work on fixing these issues immediately"
 SYR_invest_in_hasakan_cotton: "Invest In Hasaka's Cotton"
 SYR_invest_in_hasakan_cotton_desc: "The economic boom in the cities of Qamishli and Al-Hasakah was a result of the irrigation projects started in the 1960s, which transformed northeastern Syria into a cotton-growing area. This will greatly benefit our economy and we shall capitalize on the city's potential for housing a profitable textile industry"
 SYR_overhaul_national_grid: "Overhaul the National Grid"
 SYR_overhaul_national_grid_desc: "Our aging power grid causes constant blackouts and inefficiencies. This state-funded program will replace outdated transformers and power lines, and construct a new central power plant to provide a stable and modern electrical backbone for the nation."
 SYR_empower_energy_ministry: "Empower the Energy Ministry"
 SYR_empower_energy_ministry_desc: "To effectively manage the modernized grid, we must reform the Energy Ministry. Granting it greater regulatory power, funding, and technical authority will centralize planning and ensure the sector's long-term stability and strategic development."
 SYR_streamline_energy_sector: "Streamline the Energy Sector"
 SYR_streamline_energy_sector_desc: "The final step in our energy modernization is to maximize output. By deploying advanced monitoring systems, automating distribution, and retrofitting old plants, we can significantly boost the efficiency and reliability of the entire national grid."
 SYR_renewables_focus: "Focus On Renewable Energy"
 SYR_renewables_focus_desc: "We have suffered from alot of problems regarding electricity and energy output due to low amounts of oil drilling as well as the increasing population. It's wiser to focus on renewable alternatives because if we think about it our oil-dependant energy sector will become more of a liability in the future."
 SYR_invest_in_wdrvm: "Invest In WDRVM"
 SYR_invest_in_wdrvm_desc: "WDRVM is a promising company specializing in the manufacture and installation of wind turbines and powerstations. They have ambitious plans to install wind turbines accross the region and tackle the energy problems by exploiting the few regions where stable winds are present. While these regions are scattered with infrequent stable winds there is no denying the positive effects on our energy sector"
 SYR_set_up_puppet_ren_company: "Puppet Renewable Energy Company"
 SYR_set_up_puppet_ren_company_desc: "We should prop up a puppet renewable company to further strengthen our grip on the economy"
 SYR_encourage_domestic_solar_companies: "Domestic Solar Companies"
 SYR_encourage_domestic_solar_companies_desc: "A few ambitious solar power companies are being formed in the country and we should invest in them to encourage domestic solar panel production"
 SYR_monopolize_solar_power: "Monopolize Solar Power Industry"
 SYR_monopolize_solar_power_desc: "Great opportunities for profit lie in the solar potential of our desert. We'll set up our solar power companies to monopolize this promising sector"
 SYR_green_syria: "The 'Green Syria' Project"
 SYR_green_syria_desc: "With our domestic solar industry now under firm state control, we can launch a grand international propaganda campaign. 'Green Syria' will be our new brand - a narrative of sustainable development and ecological stewardship in the heart of the Middle East. We will court European green funds and political goodwill, presenting our energy monopoly not as tyranny, but as visionary state-led environmentalism. The profits and foreign investment will flow to the right pockets, of course."
 SYR_nuclear_program: "The Nuclear Program"
 SYR_nuclear_program_desc: "The path to energy independence and strategic deterrence begins with a commitment to harness the power of the atom. We will establish a comprehensive nuclear program."
 SYR_ask_kdpr: "Seek Korean Assistance"
 SYR_ask_kdpr_desc: "The Democratic People's Republic of Korea has successfully developed nuclear capabilities despite international isolation. Their expertise could accelerate our program, though at the cost of drawing unwanted attention."
 SYR_ask_israel: "Appeal to Israeli Expertise"
 SYR_ask_israel_desc: "Israel possesses advanced nuclear technology and scientific know-how. A covert approach to their scientists might yield dividends, but can we trust our old adversary to assist us?"
 SYR_ask_pakistan: "Pakistani Nuclear Expertise"
 SYR_ask_pakistan_desc: "Pakistan, a brotherly Muslim nation, has achieved nuclear weapon capability. Their experience in uranium enrichment and weapon design could be invaluable to our program."
 SYR_prepare_materials: "Uranium Mining and Milling"
 SYR_prepare_materials_desc: "We must secure a domestic source of uranium ore and establish facilities to process it into yellowcake. The mines near Homs will be expanded and modernized."
 SYR_invite_scientists: "Foreign Scientists Initiative"
 SYR_invite_scientists_desc: "We will reach out to nuclear scientists around the world, offering generous incentives to work on our program. A dedicated research facility in Damascus will be constructed to host them."
 SYR_boost_nuclear_research: "Advanced Nuclear Research"
 SYR_boost_nuclear_research_desc: "With the necessary materials and scientific talent in place, we can now push forward with cutting-edge research in reactor design and nuclear physics."
 SYR_build_pvos: "Integrated Air Defense Network"
 SYR_build_pvos_desc: "Our nuclear facilities are vulnerable to aerial attack. We will deploy layered air defense systems around key sites to protect our strategic assets."
 SYR_build_nuclear_syr: "The Syrian Nuclear Deterrent"
 SYR_build_nuclear_syr_desc: "The final step: construction of a nuclear reactor capable of producing fissile material for our arsenal. Once operational, Syria will join the ranks of nuclear powers."
 SYR_build_nuclear: "Syrian Nuclear Program"
 SYR_bowels_desert: "Bowels of the Desert"
 SYR_bowels_desert_desc: "The sands of the Syrian Desert may hide valuable resources. By investing in excavation technology and building infrastructure, we can tap into these potential oil deposits."
 SYR_found_sgc: "Found the Syrian Gas Company"
 SYR_found_sgc_desc: "To power our growing industry and cities, we need a reliable domestic gas supply. The state-owned Syrian Gas Company will be tasked with exploration, extraction, and distribution of natural gas across the country."
 SYR_treasures_levantine_sea: "Treasures of the Levantine Sea"
 SYR_treasures_levantine_sea_desc: "Offshore oil and gas exploration in the Levantine Basin offers a path to energy independence and prosperity. We will authorize deep-water drilling and seek international partnerships to develop these strategic resources, strengthening our economy and geopolitical standing."
 SYR_invest_shair_gas_field: "Invest in Shair Gas Field"
 SYR_invest_shair_gas_field_desc: "To modernize our energy sector, we seek international expertise and capital. By offering development rights in the Shair field to qualified foreign partners, we can accelerate production while fostering valuable economic and diplomatic ties."
 SYR_initiate_industrialization: "Initiate Industrialization"
 SYR_initiate_industrialization_desc: "Our industrial capabilities is outdated and non-existent. Yet we have the potential to kickstart an industrial growth that'll greatly empower and invigorate our economy"
 SYR_damascus_automotive_potential: "Damascus's Automotive Potential"
 SYR_damascus_automotive_potential_desc: "Many industrial regions in Damascus dedicated for car assembly exist yet received lower attention than deserved. We'll start investing in them."
 SYR_invite_automotive_giants: "Invite Car Giants"
 SYR_invite_automotive_giants_desc: "Popular car brands like mitsubishi, toyota and volkswagen will be of great benefit to our economy if we convince them to invest in us. This will allow quality vehicles be acquired by our populace"
 SYR_SIAMCO_monopoly: "SIAMCO Monopoly"
 SYR_SIAMCO_monopoly_desc: "We have a history dealing with car brands from Iran and China and it should always stay that way to produce affordable cars and keep unwanted influence out of our economy"
 SYR_homs_heavy_industry: "Homs Heavy Industry"
 SYR_homs_heavy_industry_desc: "Homs is home to several large public heavy industries.Obviously there is a promising future as an industrial giant and we should invest in them to allow the city to prosper"
 SYR_homs_oil_refineries_focus: "Expand Oil Refineries"
 SYR_homs_oil_refineries_focus_desc: "Attractive and abundant oil reserves are waiting for us to explore in the eastern regions of the country. We will begin the process at the expense of agricultural capabilities due to the pollution we will be causing"
 SYR_phosphate_extraction: "Phosphate Extraction"
 SYR_phosphate_extraction_desc: "We will expand and build new phosphate plants to extract this useful resource that is present abundantly in the country"
 SYR_tartus_pharmaceutical_giant: "The Pharmaceutical Giant"
 SYR_tartus_pharmaceutical_giant_desc: "Tartus has numerous pharmaceutical plants that are forming a formidable pillar for our economy. It's time to decide the future of this sector"
 SYR_pharmaceutical_export_focus: "Encourage Exports"
 SYR_pharmaceutical_export_focus_desc: "We will invest in the pharmaceutical companies and encourage their expansion towards regional supremacy and encourage the export of our medicines. This will be great for our economic growth"
 SYR_pharmaceutical_healthcare_focus: "Lower Medicine Prices"
 SYR_pharmaceutical_healthcare_focus_desc: "Our people can use this prowess to their well-being. We will allocate a percentage of our budget towards making medicine and pharmaceutical products cheaper for our population"
 SYR_expand_cement_industry: "Expand the Cement Industry"
 SYR_expand_cement_industry_desc: "The state maintains control over the strategic cement industry - the foundation of any construction boom. Investments in modernizing the five major state-owned plants will dramatically increase cement production, accelerating the construction of both civilian and military infrastructure across the country."
 SYR_reform_construction_sector: "Reform the Construction Sector"
 SYR_reform_construction_sector_desc: "The disorganized construction industry hinders our progress. A state-led reform is needed to streamline projects and mobilize resources"

 #Ideas
 military_power_vacuum: "Military Power Vacuum"
 military_power_vacuum_desc: "Due to the violent political atmosphere of Syria, which now has involved the military, it seems because of severe policital, or better to say, \"coup\" activities of the Syrian military, which has led to the collapse of the Alawite high command, it is expreincing an era of chaos. "
 syrian_agricultural_capability_fully_unleached: "Agrarian Society"
 syrian_agricultural_capability_fully_unleached_desc: "With the policies of the new government in Syria, it seems this country has chosen a more... conservative path, rather than a progressive one, in terms of economics at least."
 syrian_industrial_capability_fully_unleached: "Rapid Industrial Expansion"
 syrian_industrial_capability_fully_unleached_desc: "With full support of the Industrialists and creation of new investors in the country, Syria is taking a new step for the future of its country: Massive Industrialization."
 syria_support_anime: "Anime Supported"
 syria_support_anime_desc: "The state is supporting the distribution of anime"
 syria_agricultural_subsidies: "Agricultural Subsidies"
 syria_agricultural_subsidies_desc: "Syria has a system of agricultural subsidies in place where 4% of its GDP is used to support local farmers in order to secure domestic wheat and cotton production. The support mainly comes in the form of subsidising diesel fuel and the price of cotton"
 syria_increased_agricultural_subsidies: "Increased Agricultural Subsidies"
 syria_increased_agricultural_subsidies_desc: "We have increased agricultural subsidies to 6% of the GDP to keep domestic food production viable and to encourage the growing of trade crops. While expensive, this will make people feel safer about their future"
 syria_decreased_agricultural_subsidies: "Decreased Agricultural Subsidies"
 syria_decreased_agricultural_subsidies_desc: "We have decreased agricultural subsidies to 2% of the GDP reduce the strain of the national budget. Crop prices are now impacted more by global market prices. While cheap for the government, this will increase the price of food and reduce incentives for people to grow cash crops"
 divided_syria: "Syria: A House Divided"
 divided_syria_desc: "In addition to the destruction of homes and the horrors of war, many young people are fleeing Syria to avoid the draft. With millions having already fled Syria and hundreds of thousands of battlefield casualities, the available manpower for the Syrian Armed Forces is low."
 divided_syria_1: "Syria: A House Divided"
 divided_syria_1_desc: "In addition to the destruction of homes and the horrors of war, many young people are fleeing Syria to avoid the draft. With millions having already fled Syria and hundreds of thousands of battlefield casualities, the available manpower for the Syrian Armed Forces is low."
 divided_syria_2: "Syria: A House Divided"
 divided_syria_2_desc: "In addition to the destruction of homes and the horrors of war, many young people are fleeing Syria to avoid the draft. With millions having already fled Syria and hundreds of thousands of battlefield casualities, the available manpower for the Syrian Armed Forces is low."
 divided_syria_3: "Syria: A House Divided"
 divided_syria_3_desc: "In addition to the destruction of homes and the horrors of war, many young people are fleeing Syria to avoid the draft. With millions having already fled Syria and hundreds of thousands of battlefield casualities, the available manpower for the Syrian Armed Forces is low."
 syrian_social_nationalists: "Support from the SSNP"
 syrian_social_nationalists_desc: "The Syrian Social Nationalist Party (SSNP) is a rising force in Syria, advocating for the establishment of a Syrian nation state spanning Syria, Lebanon, Iraq, Kuwait, Jordan, Palestine, Israel, Cyprus, Sinai and Southeastern Turkey. They provide key support for the war effort, with their militia numbering at least 8.000 members."
 syrian_social_nationalists_inc: "SSNP in Government"
 syrian_social_nationalists_inc_desc: "The Syrian Social Nationalist Party (SSNP) is a rising force in Syria, advocating for the establishment of a Syrian nation state spanning Syria, Lebanon, Iraq, Kuwait, Jordan, Palestine, Israel, Cyprus, Sinai and Southeastern Turkey. Their political wing has been incorporated into the Assad regime and their militias serve alongside the Syrian Arab Army"
 alawite_high_command: "Alawite Dominated Military"
 alawite_high_command_desc: "The key units of the Syrian Arab Army are under tight control of officers from the Alawite branch of Shia Islam, the same religious denomination that the Al Assad family is part of. This ensures the loyalty of these units, but makes it considerably harder to find excelling inidividuals. These officers will be an obstacle if the muslim brotherhood comes to power as they percieve them as a threat to their alawite sect and we'll have to uproot them first, and if strengthened they'll do whatever it takes to keep assads in power"
 alawite_high_command_strengthened: "Alawite Dominated Military"
 alawite_high_command_strengthened_desc: "The key units of the Syrian Arab Army are under tight control of officers from the Alawite branch of Shia Islam, the same religious denomination that the Al Assad family is part of. This ensures the loyalty of these units, but makes it considerably harder to find excelling inidividuals. Now these officers will absolutely ensure that al assads stay in power"
 baath_party_banned: "Ba'ath Party Banned"
 baath_party_banned_desc: "The Ba'ath party of the old Assad regime has been banned from publicly operating and campaigning"
 ssnp_party_banned: "SSNP Banned"
 ssnp_party_banned_desc: "The Syrian Social Nationalis tParty has been banned from publicly operating and campaigning"
 salafist_party_banned: "Fundamentalist Parties Banned"
 salafist_party_banned_desc: "Fundamentalist parties have been banned from publicly operating and campaigning"
 true_caliphate: "The Syrian Caliphate"
 true_caliphate_desc: "We have proclaimed Islamic Syria as the birtplace of the new Muslim Caliphate"
 global_salafist_recruitment: "Global Recruitment"
 global_salafist_recruitment_desc: "Daily new soldiers are arriving into our army from all over the world"
 husband_minister: "Husband Minister"
 husband_minister_desc: "Bushra's husband Assef Shawkat is the serving Director of Military Intelligence"
 syrian_health_care_reform: "Healthcare Reform"
 syrian_health_care_reform_desc: "We have reformed the Syrian healthcare system to be more efficient"
 SYR_state_feminism_idea: "State Feminism"
 SYR_secular_syria_idea: "Secular Syria"
 SYR_particle_liberal_economy_idea: "Particle Liberal Economy"
 loyal_marriage: "Loyal Marriage"
 loyal_marriage_desc: "Asma al-Assad is a brilliant economist and will help with investments across Syria"
 autonomous_region_syr: "Autonomous Region"
 occupation_of_lebanon_dynamic_modifier: "Occupation Of Lebanon"
 TT_occupation_of_lebanon_dynamic_modifier: "Ever since 1976, almost immediately after the start of the Lebanese civil war, Syria has stationed around 30,000 soldiers in Lebanon. After the civil war ended, a friendship and security pact was signed between Lebanon and Syria in 1991, making Syria responsible for the defence of Lebanon.\n\nContinuing the occupation will be costly, but it will allow us to eventually bring Lebanon much closer to us. Despite the friendship treaty with Lebanon, the troop stationing is considered an illegal occupation by the international community, since Lebanon hasn't re-signed the mandate since 1982.\n\nAdditional Expenses: $§R0.250§!"
 alawite_political_inclusiveness_dynamic_modifier: "Political Inclusiveness of the Alawite Community"
 TT_alawite_political_inclusiveness_dynamic_modifier: "The Alawites are an ethnoreligious group that lives primarily in the Levant and follows Alawism, a sect of Islam that originated from Shia Islam. Their political inclusiveness in the country [?alawite_status|%%Y] defines the level of trust and political activity within the country's politics and is affected negatively by corruption, lack of regional infrastructure, poor record of religious freedoms and lack of regional industry when compared to other parts of the country."
 druze_political_inclusiveness_dynamic_modifier: "Political Inclusiveness of the Druze Community"
 TT_druze_political_inclusiveness_dynamic_modifier: "Druze are ethnically Arab and Arabic speaking. Their monotheistic religion incorporates many beliefs from Islam, Judaism and Christianity, and is also influenced by Greek philosophy and Hinduism. Their political inclusiveness in the country [?druze_status|%%Y] defines the level of trust and political activity within the country's politics and is affected negatively by corruption, lack of regional infrastructure, poor record of religious freedoms and lack of regional industry when compared to other parts of the country."
 kurdish_political_inclusiveness_dynamic_modifier: "Political Inclusiveness of the Kurdish Community"
 TT_kurdish_political_inclusiveness_dynamic_modifier: "The Kurds are an Iranian ethnic group native to the mountainous region of Kurdistan in Western Asia, which spans southeastern Turkey, northwestern Iran, northern Iraq, and northern Syria. Their political inclusiveness in the country [?kurdish_status|%%Y] defines the level of trust and political activity within the country's politics and is affected negatively by corruption, lack of regional infrastructure and lack of regional industry when compared to other parts of the country."
 syria_jewish_rights_guaranteed: "Jewish Rights Guaranteed"
 syria_jewish_rights_guaranteed_desc: "We have guaranteed special Jewish rights in former Israel"
 syria_bakdash: "Bakdash"
 syria_bakdash_desc: "Bakdash is over 100-year-old ice cream parlor operating in Damascus known for its booza-style ice cream. The government has decided to help this ice cream parlor expand into international markets"
 syria_natsec_constitution: "Illiberal Democracy"
 syria_natsec_constitution_desc: "The governing National Covenant Party of Syria has reformed the constitution so that the President of Syria can be of any religion. Breaking a decades old tradition of assigning a muslim president, and practicing an ideal form of democracy. However, as progressive as this might sound, Syria has been adopting a democracy that is illiberal in nature. One that is prioritizing national security and sovereignty, sometimes at the cost of economic and political liberty. Ensuring that Syria continues its populist right wing course"
 syria_islamism_guaranteed_minority_rights: "Guaranteed Minority Rights"
 syria_islamism_guaranteed_minority_rights_desc: "The religious minorities in Syria are given special rights"
