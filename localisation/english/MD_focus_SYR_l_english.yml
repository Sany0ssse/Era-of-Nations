 #Economic events
 syrian_economy.1.t: "An Offer from Petro-Canada"
 syrian_economy.1.d: "Representatives of the Canadian integrated energy company Petro-Canada have arrived in Damascus with a substantial proposal. Having closely monitored the promising discoveries at the Shaer gas field in Homs Governorate, they are eager to become the prime investor and technical partner in its development.\n\nPetro-Canada is offering to commit significant capital and state-of-the-art extraction technology to unlock the field's non-associated gas reserves."
 syrian_economy.1.a: "Welcome this Investment"
 syrian_economy.1.b: "Politely Decline"

 syrian_economy.2.t: "Petro-Canada Partnership Confirmed"
 syrian_economy.2.d: "An agreement has been signed with Petro-Canada, marking a major step in Syria's energy strategy. The Canadian firm is now the prime investor for the Shaer gas field.\n\nWith foreign capital and technology secured, the field will be connected to the Ebla gas plant, providing a reliable stream of fuel for domestic power generation and industry. This partnership strengthens economic ties with Canada and signals a modernization of our energy sector."
 syrian_economy.2.a: "An excellent deal for our future."

 #Generic Investment Declined
 syrian_economy.3.t: "Investment Declined"
 syrian_economy.3.d: "The [FROM.GetAdjective] government refused to cooperate, forcing us to reconsider our plans and slightly straining diplomatic relations."
 syrian_economy.3.a: "We must seek other opportunities"

 syrian_economy.4.t: "Request for Oil Investment"
 syrian_economy.4.d: "The Syrian government has formally requested our investment to develop newly discovered oil fields, citing a lack of capital and modern extraction technology. In exchange, they offer strengthened economic partnership and regional influence, though this requires immediate financial commitment"
 syrian_economy.4.a: "Allocate funds and send specialists"
 syrian_economy.4.b: "Politely decline, citing domestic priorities"

 syrian_economy.5.t: "Investment Approved"
 syrian_economy.5.d: "Our foreign partners have officially notified us of their agreement to finance the development of our oil sector. The initial transfers are already reaching the accounts of the national oil company, and a team of foreign engineers is preparing to work on the new fields. This is an opportunity to modernize our energy industry and strengthen international ties"
 syrian_economy.5.a: "Excellent, we begin the work"

 syrian_economy.6.t: "Request from Damascus"
 syrian_economy.6.d: "The Syrian government has sent us an official request. They are asking our joint venture, Soyuzneftegaz, to provide experts, equipment, and capital for extensive seismic surveys and exploratory drilling on their Mediterranean shelf off the coast of Latakia.\n\nThe Syrians cite old agreements and assure us that new geological data gives hope for success. For us, this is an opportunity to strengthen our influence in a strategically vital region and secure a stake in potential resources. However, the project will require significant upfront investment with an uncertain outcome"
 syrian_economy.6.a: "Sign the contract"
 syrian_economy.6.b: "Decline the offer"

 syrian_economy.7.t: "Soyuzneftegaz Gives the Green Light"
 syrian_economy.7.d: "Our Russian and Belarusian partners in Soyuzneftegaz have agreed! The contract is signed, and the first ships with equipment are already heading to the port of Latakia.\n\nThe company's specialists warn that gathering and analyzing seismic data, as well as the drilling itself, will take considerable time-about a year. We must be patient. The entire region is now watching to see if we can unlock our sea, just as Israel did with its 'Leviathan'"
 syrian_economy.7.a: "Excellent news! We will await the results"

 syrian_economy.8.t: "Gas on the Shelf!"
 syrian_economy.8.d: "The wait was worth it! After months of meticulous work, Soyuzneftegaz reports promising news: exploratory drilling in Block 12 has confirmed significant deposits of natural gas.\n\nWhile these are not colossal volumes yet, the discovery of a commercially viable field is a breakthrough. It proves the potential of our shelf and could become a cornerstone for future energy independence and exports. Now we must decide how to develop the extraction"
 syrian_economy.8.a: "Syria's future grows brighter!"

 syrian_economy.9.t: "[FROM.GetName] Requests Debt Relief"
 syrian_economy.9.d: "[FROM.GetName] has asked us to provide financial assistance to help [FROM.GetName] reduce its debt burden
 syrian_economy.9.a: "Provide limited debt assistance"
 syrian_economy.9.b: "Refuse financial support"

 syrian_economy.10.t: "Debt Assistance Granted"
 syrian_economy.10.d: "[FROM.GetName] has agreed to provide us with limited financial support, helping reduce our debt burden"
 syrian_economy.10.a: "Accept the support"

 syrian_economy.11.t: "Request Denied"
 syrian_economy.11.d: "[FROM.GetName] has refused to provide assistance, insisting that fiscal discipline and internal reforms must take priority."
 syrian_economy.11.a: "We will manage on our own"

 syrian_economy.12.t: "Anime Initiative"
 syrian_economy.12.d: "A proposal has landed on your desk from a forward-thinking, if somewhat eccentric, ministry. They argue that fostering a domestic animation industry, inspired by the global 'anime' phenomenon, could be a powerful tool for cultural export, youth employment, and soft power. Critics scoff at the idea, calling it a childish distraction from the serious business of reconstruction and industrial renewal."
 syrian_economy.12.a: "We will find our own style."
 syrian_economy.12.b: "Do the chinese even have anime?"
 syrian_economy.12.c: "Seek expertise from the source: Japan."

 syrian_economy.13.t: "Anime Industry Boom"
 syrian_economy.13.d: "By heavily investing in digitalization we have formed our own respectable animation industry responsible for making notable works that gained popularity from inside and outside the country. We have shown the world the creativity of our people and the distinct aesthetics we possess"
 syrian_economy.13.a: "Made in Syria"

 syrian_economy.14.t: "Syrian Anime"
 syrian_economy.14.d: "Syria has come to us with an unusual proposal for a joint cultural project: creating an animation studio. This could be a cost-effective way to increase our influence."
 syrian_economy.14.a: "Fund the partnership"
 syrian_economy.14.b: "Refuse"

 syrian_economy.15.t: "Anime Industry Boom"
 syrian_economy.15.d: "We have established a powerful animation industry. Thanks to our studios cooperating with China's and our heavy digital encouragement many notable works have reached many audiences inside and outside the country."
 syrian_economy.15.a: "A Sino-Syrian success story"

 syrian_economy.16.t: "Anime Project Rejected"
 syrian_economy.16.d: "[FROM.GetName] has rejected our joint animation venture proposal. We must now decide the project's future alone"
 syrian_economy.16.a: "Scrap the idea. It's not worth it."

 syrian_economy.17.t: "Syrian Proposal for Anime Cooperation"
 syrian_economy.17.d: "Syria has approached us with a request for mentorship to build their own animation industry. They are also courting the Chinese for a similar project. Agreeing would strengthen our cultural leadership and deny our regional rival a soft power victory, but would require a financial commitment."
 syrian_economy.17.a: "Send mentors and share expertise"
 syrian_economy.17.b: "Politely decline"

 syrian_economy.18.t: "Anime Industry Boom"
 syrian_economy.18.d: "We have established a powerful animation industry. Thanks to our studios cooperating with Japan's and our heavy digital encouragement many notable works have reached many audiences inside and outside the country."
 syrian_economy.18.a: "Fucking weeaboos will be everywhere now"

 syrian_economy.19.t: "Druze Passage Proposal"
 syrian_economy.19.d: "A proposal has been put forward to allow Druze civilians to pass through the Golan Heights under controlled conditions. While such a move could improve regional stability and strengthen ties, it also carries political risks and may provoke opposition at home."
 syrian_economy.19.a: "Approve the passage"
 syrian_economy.19.b: "Reject the proposal"

 syrian_economy.20.t: "Passage Approved"
 syrian_economy.20.d: "The agreement has been accepted, allowing Druze civilians to move through the Golan Heights. This step improves mutual trust and opens the door to further cooperation, though tensions remain beneath the surface."
 syrian_economy.20.a: "A step toward stability"

 syrian_economy.21.t: "Passage Rejected"
 syrian_economy.21.d: "The proposal has been rejected, halting any potential cooperation over the Druze passage. Relations remain strained, and an opportunity for confidence-building has been lost."
 syrian_economy.21.a: "We cannot allow this"

 syrian_economy.22.t: "Economic Support Program"
 syrian_economy.22.d: "The government must decide how to distribute economic support across the regions. Investments could stabilize key areas and improve infrastructure, but resources are limited and political consequences must be considered."
 syrian_economy.22.a: "Invest heavily"
 syrian_economy.22.b: "Provide limited support"

 syrian_economy.23.t: "Select a Priority Sector"
 syrian_economy.23.d: "With limited resources available, the government must prioritize a key sector for development. Strategic investment can accelerate recovery, but focusing on one area means others will be neglected."
 syrian_economy.23.a: "Invest in energy infrastructure"
 syrian_economy.23.b: "Support civilian industries"

 syrian_economy.24.t: "Nuclear Assistance Request from [FROM.GetName]"
 syrian_economy.24.d: "[FROM.GetName] has approached us with a request for assistance in their nuclear program. They seek our expertise, technology, and materials, offering financial compensation in return.\n\nThis cooperation would significantly increase our influence in Syria but may draw international attention."
 syrian_economy.24.a: "Agree to assist [FROM.GetName]"
 syrian_economy.24.b: "Refuse their request"

 syrian_economy.25.t: "Nuclear Assistance Secured"
 syrian_economy.25.d: "[FROM.GetName] has agreed to provide nuclear assistance to our program! This marks a major breakthrough in our scientific development.\n\nTheir cooperation will accelerate our nuclear research significantly, though we must remain discreet about this arrangement."
 syrian_economy.25.a: "Excellent! Our nuclear program advances."

 syrian_economy.26.t: "Nuclear Assistance Denied"
 syrian_economy.26.d: "[FROM.GetName] has refused our request for nuclear assistance. Their government cited 'international obligations' and 'non-proliferation concerns' as reasons for the denial."
 syrian_economy.26.a: "We will find another way."

 syrian_economy.27.t: "Construction Sector Reform"
 syrian_economy.27.d: "The fragmentation and inefficiency of hundreds of private contractors have become a drag on national development. The government is preparing sweeping changes to bring order to this key industry. Two mutually exclusive projects are on the table: radical nationalization or the creation of a state-regulated alliance. Our choice will determine the future of the Syrian construction sector for decades to come"
 syrian_economy.27.a: "Nationalize and Centralize!"
 syrian_economy.27.b: "Create a State-Regulated Alliance"

 syrian_economy.28.t: "Syria Proposes Phosphate Trade Agreement"
 syrian_economy.28.d: "Syria has offered to provide us with a significant quantity of phosphate fertilizers from its national reserves. This strategic resource could greatly enhance our agricultural productivity."
 syrian_economy.28.a: "Negotiate for the phosphate shipment"
 syrian_economy.28.b: "Decline the trade proposal"

 syrian_economy.29.t: "[FROM.GetName] Agrees to Phosphate Deal"
 syrian_economy.29.d: "[FROM.GetName] has accepted our trade proposal! This long-term contract for our phosphate exports will provide a steady stream of foreign capital and strengthen our economic position."
 syrian_economy.29.a: "A victory for our economy"

 syrian_economy.30.t: "[FROM.GetName] Spurns Our Resources"
 syrian_economy.30.d: "[FROM.GetName] has turned down our offer, failing to recognize the quality and strategic value of Syrian phosphates. Their loss will be another nation's gain."
 syrian_economy.30.a: "Their mistake"

 syrian_diplomacy.1.t: "Fund Mosques in Syria"
 syrian_diplomacy.1.d: "Syria has asked us to fund the construction of mosques and madrassas within their borders. In exchange, they will grant us significant influence over their religious institutions. This represents a notable opportunity to expand our religious and cultural reach in the region."
 syrian_diplomacy.1.a: "The Custodian approves"
 syrian_diplomacy.1.b: "Refuse"

 syrian_diplomacy.2.t: "Riyadh Accepts Our Proposal"
 syrian_diplomacy.2.d: "[FROM.GetName] has agreed to fund our religious institutions. While this will aid stability and our economy, it formally grants them growing influence within our country, which may concern some of our allies."
 syrian_diplomacy.2.a: "May it strengthen the ummah"

 syrian_diplomacy.3.t: "Refusal from Riyadh"
 syrian_diplomacy.3.d: "[FROM.GetName] has declined our proposal for funding. We must now find other means to develop our religious infrastructure or seek different sponsors."
 syrian_diplomacy.3.a: "So be it"

 syrian_diplomacy.4.t: "Syrian Oil Investments"
 syrian_diplomacy.4.d: "Syria requests our investment to modernize their oil industry. In exchange, they offer us significant influence over this critical sector, allowing us to shape its development and secure our long-term energy interests in the region."
 syrian_diplomacy.4.a: "Invest. Extend our influence"
 syrian_diplomacy.4.b: "Reject. The costs are too high"

 syrian_diplomacy.5.t: "Investment Secured"
 syrian_diplomacy.5.d: "The Saudis have agreed to invest heavily in our oil infrastructure. The influx of capital and expertise will significantly boost our production capacity. While this grants them considerable economic influence, it is a necessary step to revitalize this vital sector of our economy."
 syrian_diplomacy.5.a: "Our industry will prosper"

 syrian_diplomacy.6.t: "A Lucrative Proposal from Damascus"
 syrian_diplomacy.6.d: "The Syrian government has presented us with a bold and clandestine plan. They offer to become the key transit hub for our oil exports, establishing a dedicated smuggling route through their territory to circumvent the stifling international sanctions. In return, they seek a significant share of the profits and deeper political alignment. While this promises immense revenue and strengthens the 'Axis of Ba'ath', accepting will be seen as a direct challenge to American authority in the region"
 syrian_diplomacy.6.a: "Our mutual benefit outweighs the risks"
 syrian_diplomacy.6.b: "We cannot afford to antagonize the Americans further"

 syrian_diplomacy.7.t: "Baghdad Agrees to the Oil Scheme"
 syrian_diplomacy.7.d: "The Iraqi leadership has accepted our proposal. The covert infrastructure for rerouting their oil will be established immediately. This deal guarantees us a steady stream of wealth and cements a formidable economic alliance, making us indispensable to Baghdad. However, our intelligence reports that Washington is already aware of the negotiations. Our relations with the United States are set to plummet, and we should prepare for diplomatic and economic retaliation"
 syrian_diplomacy.7.a: "The riches and influence are worth the American scorn"

 syrian_diplomacy.8.t: "Iraq Rejects the Smuggling Plan"
 syrian_diplomacy.8.d: "Citing pressure from Washington and fear of additional sanctions, the Iraqi government has formally declined our proposal for a joint oil smuggling operation. This is a significant setback for our plans to create an independent economic bloc and a display of weakness from Baghdad. Our relationship with Iraq has cooled considerably due to this refusal"
 syrian_diplomacy.8.a: "A shortsighted decision by a weak regime"

 syrian_diplomacy.9.t: "A Diplomatic Overture from Damascus"
 syrian_diplomacy.9.d: "Syria seeks to elevate our relationship beyond trade, proposing to fully restore political ties with high-level summits and joint security consultations. This move would reintegrate Damascus into the Arab fold under our sponsorship but may strain our relations with other regional and international powers."
 syrian_diplomacy.9.a: "Embrace the alliance. A strong Syria strengthens the Arab world."
 syrian_diplomacy.9.b: "Now is not the time. We must preserve our current balances."

 syrian_diplomacy.10.t: "Cairo Reopens Its Doors"
 syrian_diplomacy.10.d: "Egypt has accepted our proposal. Embassies will be restored to full strength, and a schedule for presidential visits has been agreed upon. This public political endorsement from the most populous Arab nation is a monumental victory for our legitimacy. It paves the way for preferential access to Egyptian markets, expertise, and potentially even military cooperation"
 syrian_diplomacy.10.a: "Great!"

 syrian_diplomacy.11.t: "A Cold Shoulder from Cairo"
 syrian_diplomacy.11.d: "Despite our economic overtures, the Egyptian government has declined to upgrade our political ties. Their message, though courteous, cites 'regional complexities' and 'existing commitments' as barriers. It is clear that external pressure and a desire not to upset the prevailing order have outweighed the call for Arab solidarity. This refusal is a diplomatic setback, isolating us further and proving that economic leverage alone cannot buy political allegiance"
 syrian_diplomacy.11.a: "Their shortsightedness will be remembered"

 syrian_diplomacy.12.t: "Call for Egyptian Capital"
 syrian_diplomacy.12.d: "Building upon our renewed political ties, Damascus is making a direct economic overture. They formally invite Egyptian state funds and private corporations to become the primary foreign investors in their economy, offering privileged access and favorable terms across sectors"
 syrian_diplomacy.12.a: "Seize the opportunity"
 syrian_diplomacy.12.b: "The risks are too great"

 syrian_diplomacy.13.t: "Egyptian Capital Secured"
 syrian_diplomacy.13.d: "Cairo has accepted our proposal. The first tranches of Egyptian investment are being allocated, and joint venture agreements are being signed.  We have successfully tied the future of the Egyptian economy to the success of our project"
 syrian_diplomacy.13.a: "A new era of prosperity begins"

 syrian_diplomacy.14.t: "Investment Offer Declined"
 syrian_diplomacy.14.d: "The Egyptian government, citing economic prudence and external pressures, has formally declined to become a investor. This refusal denies us a crucial source of capital and signals the limits of political goodwill without concrete economic incentives"
 syrian_diplomacy.14.a: "A setback, but not the end"

 syrian_diplomacy.15.t: "A Proposal for Covert Air Cooperation"
 syrian_diplomacy.15.d: "Damascus, capitalizing on our renewed partnership, has presented a bold plan for clandestine military collaboration. They propose establishing a covert training program where Syrian pilots and ground crews will be instructed at our remote airbases under the guise of joint anti-terrorism exercises. This would significantly enhance their air capabilities and create a cadre of personnel loyal to both our nations"
 syrian_diplomacy.15.a: "Their strength becomes our strength"
 syrian_diplomacy.15.b: "Deny the request"

 syrian_diplomacy.16.t: "Egypt Greenlights the Covert Program"
 syrian_diplomacy.16.d: "Cairo has agreed to our clandestine proposal. The first group of our officers has been discreetly dispatched to Egyptian training facilities. This program promises to rapidly revitalize our air force's expertise with modern tactics and maintenance procedures, granting us a qualitative edge that our enemies will not anticipate. Our alliance with Egypt has now moved beyond politics and economics into the realm of true military partnership"
 syrian_diplomacy.16.a: "Our pilots will soon be among the best"

 syrian_diplomacy.17.t: "Request for Military Training Denied"
 syrian_diplomacy.17.d: "Despite our political and economic rapprochement, the Egyptian military command has vetoed the proposed covert training program. Citing 'operational security' and 'regional sensitivities', they have made it clear that their relationship with Western powers prevents them from engaging in such a provocative military entanglement with us. This refusal is a sobering reminder of the limits of our diplomatic outreach and leaves our air force to rebuild its prowess through slower, domestic means"
 syrian_diplomacy.17.a: "Their caution is our setback"

 syrian_diplomacy.18.t: "Joint Air Exercise Proposal from [FROM.GetName]"
 syrian_diplomacy.18.d: "The [FROM.GetAdjective] goverment has formally proposed conducting a series of joint air force exercises, suggesting the airspace near our base in Cyprus as a suitable location. They argue it would be a valuable opportunity for their pilots to train alongside a modern air force and foster closer military ties"
 syrian_diplomacy.18.a: "Accept the proposal
 syrian_diplomacy.18.b: "Decline the proposal"

 syrian_diplomacy.19.t: "[FROM.GetName] Accepts Exercise Proposal"
 syrian_diplomacy.19.d: "The [FROM.GetAdjective] goverment has agreed in principle to our proposed joint air exercises. Planning for the maneuvers, likely to take place over the Eastern Mediterranean, can now begin. This is a significant step in deepening our military cooperation"
 syrian_diplomacy.19.a: "A success for our diplomacy"

 syrian_diplomacy.20.t: "[FROM.GetName] Declines Exercise Proposal"
 syrian_diplomacy.20.d: "We have received a formal reply from London. [FROM.GetName] has politely declined our proposal for joint air exercises at this time, citing scheduling conflicts and prior commitments"
 syrian_diplomacy.20.a: "Bad"

 syrian_diplomacy.21.t: "Request for Economic Investment"
 syrian_diplomacy.21.d: "The government of Syria has approached us with a detailed proposal for major economic investment. While this proposal promises lucrative contracts for our industries and will be warmly received by our financial sector, its strategic approval would also create a long-term economic alignment, making Damascus increasingly reliant on our markets and expertise"
 syrian_diplomacy.21.a: "Approve the investment"
 syrian_diplomacy.21.b: "Deny the request"

 syrian_diplomacy.22.t: "[FROM.GetName] Greenlights the Investment Package"
 syrian_diplomacy.22.d: "We have received official confirmation from [FROM.GetName]. The agreement, one of the largest of its kind for our nation, will channel substantial capital into our economic over the coming years. This marks a transformative commitment to our economic future and a powerful deepening of our bilateral ties"
 syrian_diplomacy.22.a: "A new chapter of development begins"

 syrian_diplomacy.25.t: "Syria-Iran Joint Financial Institution"
 syrian_diplomacy.25.d: "In a bold move to circumvent Western financial dominance, the Syrian government has formally proposed the establishment of a joint Syrian-Iranian banking institution. This entity would operate outside the SWIFT system, facilitating trade in local currencies and providing a financial lifeline insulated from international sanctions. For Iran, this represents an opportunity to expand the reach of its 'resistance economy' model and create a durable financial partnership at the heart of the Axis of Resistance"
 syrian_diplomacy.25.a: "This is the cornerstone of our economic independence"
 syrian_diplomacy.25.b: "The risks are too great"

 syrian_diplomacy.26.t: "Tehran Approves the Joint Banking Initiative"
 syrian_diplomacy.26.d: "The Islamic Republic has enthusiastically endorsed our financial proposal. With Iranian capital and expertise, our joint bank will begin operations in Damascus and Tehran. This institution will not only process bilateral trade in Rials and Pounds, bypassing the Dollar entirely, but also fund strategic infrastructure and military-industrial projects critical to our collective defense. Our economic sovereignty is no longer an aspiration, but a rapidly materializing reality"
 syrian_diplomacy.26.a: "The financial fortress is built"

 syrian_diplomacy.27.t: "Iran Declines the Banking Union"
 syrian_diplomacy.27.d: "After careful consideration, our Iranian partners have conveyed their refusal to establish a formal joint banking institution at this time. While expressing solidarity, they cite concerns over provoking further, more severe sanctions from Western powers and the technical challenges of creating a stable, alternative financial architecture from scratch. This decision leaves our economic strategy reliant on existing, more vulnerable channels and represents a significant setback in our quest for complete financial autonomy from the West"
 syrian_diplomacy.27.a: "Shit!"

 syrian_diplomacy.28.t: "PKK Attack with Syrian Backing"
 syrian_diplomacy.28.d: "Kurdistan Workers' Party militants have launched a major attack on our infrastructure in the southeast, severely damaging several key installations and military outposts. Our intelligence services have obtained irrefutable evidence that the Syrian government provided the militants with weapons, funding, and operational intelligence for this assault. This represents a significant escalation and a direct threat to our national security"
 syrian_diplomacy.28.a: "Syria will pay for this!"

 syrian_diplomacy.29.t: "A Proposal for Strategic Partnership"
 syrian_diplomacy.29.d: "Damascus has sent a confidential proposal to Yerevan. They seek to establish a formal military cooperation pact, including mutual military access and joint training. For Syria an alliance with Armenia would represent a diplomatic breakthrough and a small but symbolically vital crack in their encirclement. For Armenia, this is a high-stakes gamble: offering a hand to a fellow nation under pressure could forge a durable partnership, but it risks drawing the ire of regional powers and complicating its own delicate foreign balance."
 syrian_diplomacy.29.a: "Our struggles are intertwined"
 syrian_diplomacy.29.b: "The risks outweigh the benefits"

 syrian_diplomacy.30.t: "Yerevan Accepts the Pact"
 syrian_diplomacy.30.d: "Armenia has agreed to our proposal. The agreement on mutual military access and cooperation is signed, creating an unexpected axis between the South Caucasus and the Levant. While their army is not large, this partnership provides us with a legitimate state ally beyond Iran and Russia, a symbolic victory against our isolation. For Armenia, this grants a strategic outlet to the Mediterranean and a partner that understands the reality of enduring conflict and sovereignty under threat"
 syrian_diplomacy.30.a: "A bridge has been built"

 syrian_diplomacy.31.t: "A Door Closed in Yerevan"
 syrian_diplomacy.31.d: "The Armenian government has sent a cautious but definitive refusal. Citing 'the complex geometry of regional politics' and 'existing multilateral commitments,' they have declined to formalize a military partnership at this time. The message is clear: even for a nation facing its own existential challenges, openly aligning with Damascus is seen as a step too far, a liability that could compromise their other relationships. Our offer of solidarity between besieged nations has been weighed and found wanting"
 syrian_diplomacy.31.a: "Their pragmatism is our isolation"

 syrian_diplomacy.32.t: "The Little Hagia Sophia Project'"
 syrian_diplomacy.32.d: "The Syrian government has sent us a detailed and symbolic proposal. They wish to construct a faithful replica of the Hagia Sophia in the town of Al-Suqaylabiyah. For them, this is far more than a church; it is a monument meant to defy Turkey's transformation of the original and to cement their identity as a bastion of Eastern Orthodoxy in the Levant. They lack the funds and technical expertise to realize this ambitious project alone and are formally requesting our financial and logistical support to build it. Agreeing would be a profound political statement of our alliance"
 syrian_diplomacy.32.a: "Fund this symbolic monument"
 syrian_diplomacy.32.b: "Our resources are needed elsewhere"

 syrian_diplomacy.33.t: "The Foundation is Laid"
 syrian_diplomacy.33.d: "The final stone is laid in Al-Suqaylabiyah. This 'Little Hagia Sophia' now stands complete-a perfect replica in form, but a powerful rebuttal in meaning. Its domes and mosaics are a direct challenge to Ankara's claim over Christian heritage, while its very existence is a monument to the alliance with Moscow that willed it into being. It is more than a church; it is a flag made of marble, declaring that our history, our faith, and our sovereignty cannot be erased"
 syrian_diplomacy.33.a: "A monument for the ages"

 syrian_diplomacy.34.t: "Proposal from Damascus"
 syrian_diplomacy.34.d: "The Syrian government has extended a strategic offer. They propose a formal military pact: Iran would provide direct military support, including weapons and troops, to bolster the Syrian Army. In return, Syria would establish and guarantee a secure overland supply corridor through its territory, ensuring a reliable flow of Iranian support to Hezbollah. This would significantly strengthen our mutual position in the region"
 syrian_diplomacy.34.a: "Accept the Pact"
 syrian_diplomacy.34.b: "Decline the Offer"

 syrian_diplomacy.35.t: "Iran Accepts Our Offer"
 syrian_diplomacy.35.d: "Tehran has agreed to our proposed military pact. The deployment of Iranian combat units and shipments of weapons will soon reinforce our front lines. In accordance with our agreement, we have begun establishing the secure supply corridor to facilitate Iranian support for Hezbollah. This marks a significant deepening of our strategic alliance"
 syrian_diplomacy.35.a: "The Axis is Forged"

 syrian_diplomacy.36.t: "Iran Declines Our Proposal"
 syrian_diplomacy.36.d: "Our ambitious proposal for a military pact has been rejected by Tehran. The promised reinforcements and weapons will not be forthcoming, and plans for the joint supply corridor are shelved. This refusal is a diplomatic setback and a missed opportunity to decisively alter the strategic balance in our favor"
 syrian_diplomacy.36.a: "A Disappointing Outcome"

 syrian_diplomacy.37.t: "IRGC Military College"
 syrian_diplomacy.37.d: "The Syrian command has approached us with a significant request. They seek to formally institutionalize our military advisory role by establishing a permanent branch of the IRGC University of Command and Staff on their soil. T"
 syrian_diplomacy.37.a: "Fund the college and dispatch our best instructors"
 syrian_diplomacy.37.b: "Our resources are needed elsewhere"

 syrian_diplomacy.38.t: "Iran Establishes a Military College"
 syrian_diplomacy.38.d: "With our approval, Iranian Revolutionary Guard Corps advisors have arrived to found a new military institution. Modeled on the IRGC's own University of Command and Staff, this college will focus on training staff officers in the complex, unconventional warfare doctrines that define Iran's military thinking"
 syrian_diplomacy.38.a: "A new era of military cooperation begins"

 syrian_diplomacy.39.t: "Assistance in Cyber Defense"
 syrian_diplomacy.39.d: "Our allies in Damascus have forwarded an urgent and detailed request. Their security services seek to modernize their cyber defense and internal security infrastructure to counter emerging threats. They ask for our technical expertise and financial backing to procure advanced surveillance systems, secure communication networks, and data analysis hardware. This would represent a major upgrade to their capabilities, further intertwining our intelligence apparatuses"
 syrian_diplomacy.39.a: "Grant their request and finance the project"
 syrian_diplomacy.39.b: "Our own priorities must come first"

 syrian_diplomacy.40.t: "Agreement Reached on Security Hardware"
 syrian_diplomacy.40.d: "Iran has agreed to our procurement request. A contract has been finalized for the sale and installation of advanced cyber security systems, secure communications hardware, and data analysis infrastructure. Iranian technical advisors will oversee the deployment to ensure operational compatibility with their systems"
 syrian_diplomacy.40.a: "A strategic deal"

 syrian_diplomacy.41.t: "Syrian Request for Arms and Licenses"
 syrian_diplomacy.41.d: "Damascus has made a direct and substantial request for military assistance. They seek to procure modern armaments - including main battle tanks, , and small arms - along with production licenses to bolster their domestic defense industry. This overture signals Syria's desire to diversify its sources of military hardware and potentially align its technical standards closer to ours, offering a significant strategic opportunity in the region, albeit with considerable political risks."
 syrian_diplomacy.41.a: "Approve the transfer"
 syrian_diplomacy.41.b: "Deny the request"

 syrian_diplomacy.42.t: "France Approves Military Cooperation"
 syrian_diplomacy.42.d: "Paris has given its conditional approval. A contract for the delivery of French military equipment and associated production licenses has been finalized. While the initial batch may be limited and consist of older models, it represents a crucial influx of modern technology and a formalized military-industrial partnership. French technical advisors will oversee the training and integration process."
 syrian_diplomacy.42.a: "Our army's capabilities will leap forward"

 syrian_diplomacy.43.t: "Syrian Request for Russian Arms"
 syrian_diplomacy.43.d: "Our contacts in Damascus have forwarded a significant military procurement request. Syria seeks to acquire substantial quantities of reliable Russian infantry weaponry and main battle tanks, specifically the T-72B model, along with corresponding production licenses. This proposal represents a clear effort to deepen their dependence on our military-industrial complex and reinforce a longstanding strategic partnership, offering us a key lever of influence in the Middle East at a relatively low financial cost"
 syrian_diplomacy.43.a: "Approve the transfer"
 syrian_diplomacy.43.b: "Deny the request"

 syrian_diplomacy.44.t: "Russia Approves Military Aid"
 syrian_diplomacy.44.d: "Moscow has agreed to our request. A shipment of Russian small arms and T-72B tanks is being prepared, accompanied by licenses for domestic production. This influx of reliable, battle-tested Soviet-era hardware will significantly modernize our armored forces and strengthen our defensive capabilities within the framework of our enduring strategic partnership"
 syrian_diplomacy.44.a: "Our armored fist grows stronger"

 syrian_diplomacy.45.t: "Syrian Arms Procurement Request"
 syrian_diplomacy.45.d: "The Syrian government has presented a formal request for assistance in acquiring advanced military equipment. They specifically seek high-quality American-made infantry weapons and anti-armor systems, and propose to utilize our established global procurement and logistics networks to facilitate the transfer. This arrangement offers us a profitable brokerage fee and an opportunity to significantly deepen our strategic influence in Damascus."
 syrian_diplomacy.45.a: "Facilitate the transfer"
 syrian_diplomacy.45.b: "Decline the proposal"

 syrian_diplomacy.46.t: "Advanced Weaponry Secured via UAE"
 syrian_diplomacy.46.d: "Our procurement channel through the United Arab Emirates has delivered. A shipment of modern Western infantry weapons and advanced anti-tank systems has arrived. This high-quality equipment will provide a marked improvement in the combat effectiveness of our frontline units"
 syrian_diplomacy.46.a: "A significant boost to our capabilities"

 syrian_diplomacy.47.t: "A Strategic Choice for Tartus Base"
 syrian_diplomacy.47.d: "The port of Tartus is our most valuable strategic asset on the Mediterranean. To secure our nation's future, we must choose which powerful ally to grant long-term basing rights. This decision will define our foreign policy for a generation, offering immense benefits but also binding our fate closely to our chosen partner's ambitions in the region"
 syrian_diplomacy.47.a: "Offer Tartus to Russia"
 syrian_diplomacy.47.b: "Offer Tartus to the UAE"

 syrian_diplomacy.48.t: "Military Base in Tartus"
 syrian_diplomacy.48.d: "[FROM.GetNameDef] has formally proposed granting us long-term basing rights at the strategic port of Tartus. In exchange for a substantial financial contribution, we would secure a permanent Mediterranean foothold, dramatically enhancing our power projection and influence in the Levant. This deal represents a major strategic opportunity."
 syrian_diplomacy.48.a: "Accept"
 syrian_diplomacy.48.b: "Decline"

 syrian_diplomacy.49.t: "[FROM.GetNameDef] Accepts the Tartus Proposal"
 syrian_diplomacy.49.d: "Our proposal has been accepted. [FROM.GetName] has agreed to the financial terms and will begin establishing a permanent military presence at Tartus. In addition to the significant funds now at our disposal, this agreement cements a powerful, long-term alliance with a key player in the region"
 syrian_diplomacy.49.a: "A pivotal agreement is sealed"

 syrian_diplomacy.50.t: "Economic Partnership with Syria"
 syrian_diplomacy.50.d: "Damascus has requested a major economic aid and investment package. In exchange for a significant capital injection and infrastructure development projects, they offer preferential access for our companies and an increase in our political influence within their country"
 syrian_diplomacy.50.a: "Approve the partnership"
 syrian_diplomacy.50.b: "Decline"

 syrian_diplomacy.51.t: "UAE Approves Economic Partnership"
 syrian_diplomacy.51.d: "The United Arab Emirates has agreed to our proposal for a strategic economic partnership. A substantial aid package and a commitment to fund major infrastructure projects will provide immediate liquidity and begin the long process of modernizing our economy. In return, Emirati firms will receive preferential treatment in key sectors"
 syrian_diplomacy.51.a: "A vital boost for our economic"

 syrian_diplomacy.52.t: "Special Forces Training"
 syrian_diplomacy.52.d: "Damascus has made a formal request for military assistance. They seek to send a contingent of their special operations personnel to train under the guidance of our elite units. In exchange for this valuable training, they offer to strengthen diplomatic and military ties. For us, this represents an opportunity to cultivate a potential strategic partner in the Eastern Mediterranean and gain a degree of influence in a region of traditional Turkish interest"
 syrian_diplomacy.52.a: "Agree to train their forces"
 syrian_diplomacy.52.b: "Avoid unnecessary entanglement"

 syrian_diplomacy.53.t: "Greece Approves Training Program"
 syrian_diplomacy.53.d: "Athens has accepted our request. A select group of our special operations officers will undergo advanced training with Greek forces. This exchange will significantly enhance the professionalism and capabilities of our elite units. Furthermore, it establishes a direct military link with a key Mediterranean nation, potentially providing us with a valuable counterbalance in the region"
 syrian_diplomacy.53.a: "Our special forces will reach new standards"

 syrian_diplomacy.54.t: "Joint Special Forces Exercises in Cyprus Area"
 syrian_diplomacy.54.d: "Building on our training cooperation, Damascus proposes a decisive next step: large-scale, visible joint exercises between our special forces units, to be conducted in the Greek islands proximate to Cyprus. They position this as essential advanced training for their troops in amphibious and air assault operations. For us, it is an opportunity to test our own elite units in a realistic scenario while projecting power and commitment in a region of core national interest. Such a overt military presence will be interpreted as a severe provocation by Ankara, dramatically escalating regional tensions."
 syrian_diplomacy.54.a: "Approve the exercises"
 syrian_diplomacy.54.b: "The strategic risks are unacceptable"

 syrian_diplomacy.55.t: "Green Light for Exercises Near Cyprus"
 syrian_diplomacy.55.d: "Greece has authorized the joint special forces exercises. Our commandos will train alongside their Greek counterparts in a complex, multi-phase scenario simulating operations in an Eastern Mediterranean archipelago. This unparalleled access to NATO-standard advanced training will drastically improve our elite troops' capabilities in amphibious warfare. The high-profile nature of these drills also serves as a powerful strategic signal to any regional adversaries about our growing web of military partnerships"
 syrian_diplomacy.55.a: "An invaluable opportunity for our best troops"

 syrian_diplomacy.56.t: "Military Cooperation Agreement"
 syrian_diplomacy.56.d: "[FROM.GetNameDef] has formally requested to establish a framework for military cooperation and intelligence sharing. This overture signals Damascus's potential willingness to align its security policies closer to ours. Accepting would grant us increased influence over Syrian military affairs and provide our officers with valuable operational insights from a active theater of war, particularly regarding tactics against insurgent forces we both contend with"
 syrian_diplomacy.56.a: "Accept the cooperation agreement"
 syrian_diplomacy.56.b: "Reject the proposal"

 syrian_diplomacy.57.t: "Turkey Approves Military Cooperation"
 syrian_diplomacy.57.d: "Ankara has accepted our proposal for strategic military coordination. This landmark agreement initiates a program of shared intelligence, tactical consultations, and likely future joint training. Aligning ourselves with Turkey's powerful armed forces provides us with a significant new source of military expertise and could reshape the regional security calculus to our advantage"
 syrian_diplomacy.57.a: "A new strategic understanding is reached"

 syrian_diplomacy.58.t: "Joint Exercises in Northern Cyprus Area"
 syrian_diplomacy.58.d: "Building upon our military coordination, Damascus proposes a bold step: conducting visible joint special forces and rapid deployment exercises in the territories of the Turkish Republic of Northern Cyprus. They frame this as advanced training in securing strategic coastal areas. For us, this represents an unparalleled opportunity to demonstrate the strength of our alliance and solidify our sovereign claims in the Eastern Mediterranean through a tangible military presence. Such a move will be perceived as a direct and severe provocation by Greece and the Republic of Cyprus, potentially triggering a major diplomatic crisis."
 syrian_diplomacy.58.a: "Authorize the exercises"
 syrian_diplomacy.58.b: "Refuse"

 syrian_diplomacy.59.t: "Turkey Approves Northern Cyprus Exercises"
 syrian_diplomacy.59.d: "Turkey has greenlit the joint exercises in the North. Our forces will train alongside Turkish units in a highly sensitive area, providing us with rare access to advanced Turkish operational methods and secure forward bases. This high-stakes partnership not only enhances our capabilities but also sends an unambiguous strategic signal about our alignment and our willingness to project power alongside a key regional actor"
 syrian_diplomacy.59.a: "A decisive step in our strategic partnership"

 syrian_diplomacy.60.t: "Syrian Offer: Forward Bases and Volunteer Forces"
 syrian_diplomacy.60.d: "Damascus has extended a highly significant proposal. They offer to host permanent Turkish forward operating bases on their soil to facilitate cross-border operations, and formally request the deployment of volunteer forces from the Grey Wolves (Ülkü Ocakları) movement. These ideologically committed units would operate under our strategic guidance within Syria. This arrangement would give us an unprecedented direct military footprint and a powerful proxy force deep inside Arab territory, fundamentally altering the regional balance of power. However, it constitutes a de facto military occupation of sovereign Syrian land and will be viewed as an act of extreme aggression by the international community and our regional adversaries"
 syrian_diplomacy.60.a: "Establish the bases and dispatch the volunteers"
 syrian_diplomacy.60.b: "The act is a bridge too far"

 syrian_diplomacy.61.t: "Turkey Establishes Bases and Sends Militias"
 syrian_diplomacy.61.d: "Turkey has accepted our proposal in full. Construction of Turkish forward operating bases has begun on our territory, and the first contingents of Grey Wolves militias have arrived. These nationalist volunteers are highly motivated and bring considerable experience in irregular warfare. While this grants us immediate, powerful allied forces on the ground and cements the Ankara-Damascus axis, it effectively cedes a degree of our sovereignty and binds our military fortunes inextricably to Turkey's regional ambitions"
 syrian_diplomacy.61.a: "The pact is sealed"

 syrian_diplomacy.62.t: "A Pact for Mutual Defense"
 syrian_diplomacy.62.d: "Damascus proposes a formal defense pact. Its core is a mutual guarantee of independence, binding our sovereignties. To give it teeth, Syria offers to host permanent Iraqi forward operating bases, creating a strategic buffer. They also request Iraqi military advisers to help form elite joint brigades. This fusion would forge an inseparable defensive bloc but will be viewed as a profound threat by our enemies, and cedes direct operational control of Syrian territory"
 syrian_diplomacy.62.a: "Welcome our Ba'athist brothers"
 syrian_diplomacy.62.b: "We must remain independent"

 syrian_diplomacy.63.t: "The Damascus-Baghdad Axis is Formed"
 syrian_diplomacy.63.d: "Iraq has formally ratified our proposed defense pact. The mutual guarantees of independence are now active, legally binding our nations. Planning for permanent Iraqi forward operating bases in eastern Syria and the integration of Ba'athist militant cadres into joint brigades can now begin in earnest. This pact creates an inseparable defensive entity, fundamentally altering the regional balance of power in our favor."
 syrian_diplomacy.63.a: "Welcome our Ba'athist brothers!"

 syrian_diplomacy.64.t: "Damascus Offers Irregular Support"
 syrian_diplomacy.64.d: "Our Ba'athist allies in Syria have made a bold proposal. They wish to establish a covert training and advisory mission on our soil to dramatically enhance the capabilities of our loyalist and irregular forces. This Syrian expedition will form the core of several new, highly motivated 'volunteer' brigades, trained in guerrilla warfare and asymmetric tactics. While this will significantly boost our military readiness and partisan potential, it represents a profound foreign influence within our security apparatus that cannot be easily undone"
 syrian_diplomacy.64.a: "Accept their advisors and form the brigades"
 syrian_diplomacy.64.b: "Politely decline. Our army must remain our own"

 syrian_diplomacy.65.t: "Our Vanguard Crosses the Frontier"
 syrian_diplomacy.65.d: "Our comrades in Iraq have welcomed our hand of brotherhood. The pact is sealed. As we speak, our most dedicated sons-trainers, advisors, and the core of a new fighting spirit-are embedding themselves within Iraqi society. They will shape the 'Syrian Volunteers' into a formidable tool, a proof of concept for our shared Ba'athist destiny. Our influence now has a permanent military expression east of the Euphrates"
 syrian_diplomacy.65.a: "The flame is passed"

 syrian_diplomacy.66.t: "An Unthinkable Proposal"
 syrian_diplomacy.66.d: "Through the most secret and deniable channels, the regime in Damascus has sent a tremor through our strategic calculus. They propose an act of sheer realpolitik: to purchase the Golan Heights. Their emissaries speak of 'ending the forever war' and 'a ransom for stolen earth', offering gold, oil, and industrial output. This is not a peace treaty; it is a cold, cash-based transaction that would redraw the map overnight. Do we treat this as the ultimate sign of their weakness and cash in, or as an insult to every soldier who fell defending these strategic heights?"
 syrian_diplomacy.66.a: "Everything has a price"
 syrian_diplomacy.66.b: "This land is not for sale"

 syrian_diplomacy.67.t: "They Have Named Their Price"
 syrian_diplomacy.67.d: "The Israelis have agreed to talk. Their preliminary demands are as staggering as they are precise: a massive, immediate transfer of wealth and industrial capacity that will hobble our economy for a generation. The world will see the return of the Golan as a triumph of Syrian diplomacy. Only we will know it was bought with the sweat of our people, not won with their blood. The guns will fall silent, and our flag will fly again over the heights, but at a cost that will be felt in every Syrian home for decades"
 syrian_diplomacy.67.a: "Pay the ransom"

 syrian_diplomacy.68.t: "A Door Slammed Shut"
 syrian_diplomacy.68.d: "Our historic offer has been met not with negotiation, but with contempt. The Israeli government has refused, likely leaking the proposal to paint us as desperate and weak. This public humiliation is a bitter pill, but it also burns away any illusion of a peaceful solution. We went to the very edge of pragmatism. Now, the world can see that only strength will reclaim what is ours. Let this refusal fuel our people's resolve; the next time we approach the Golan, it will be at the head of an army"
 syrian_diplomacy.68.a: "So be it. The path is now clear"

 syrian_diplomacy.69.t: "Military Training"
 syrian_diplomacy.69.d: "In a move that signals a profound shift, the Syrian government has formally requested to establish a framework for joint military training. They seek to send their officers to observe and participate in exercises focused on counter-terrorism, electronic warfare, and air defense integration. For us, this is an unprecedented opportunity to gain direct influence over the Syrian military apparatus, shape its doctrine, and quietly integrate our tactical protocols. The intelligence value alone is immense. However, such close cooperation with a former archenemy will not go unnoticed by our allies or our own hardliners, and it risks leaking advanced tactics to a potentially unreliable partner"
 syrian_diplomacy.69.a: "Agree"
 syrian_diplomacy.69.b: "Our methods remain our own"

 syrian_diplomacy.70.t: "The Gates Open"
 syrian_diplomacy.70.d: "Israel has accepted. The first contingent of our senior officers is preparing to depart for discreet training facilities. This is the culmination of our pragmatic turn: direct access to the most battle-tested military expertise in the region. We will learn, we will adapt, and we will return to forge a sharper, more modern army. Yet, as our soldiers board the planes, we must brace for the aftershocks. Whispers of treason are already circulating in the officer's clubs of Cairo and Riyadh. At home, the old guard watches with silent contempt. We have traded a measure of our revolutionary pride for a leap in professional capability. The balance sheet of this exchange will be written in future battles"
 syrian_diplomacy.70.a: "Let the training begin"

 syrian_diplomacy.71.t: "A Secret Hand from Damascus"
 syrian_diplomacy.71.d: "Through a channel so deniable it borders on the hypothetical, the Syrian regime has extended an offer that redefines audacity. They propose establishing a covert Mossad liaison office within Damascus itself - not as adversaries, but as partners in 'counter-terrorism'. This would grant us unparalleled access to the inner workings of their Mukhabarat, the ability to shape their intelligence priorities, and a direct feed from the heart of the Arab world. The intelligence coup would be historic. Yet, this is the ultimate devil's bargain: we would be empowering a brittle dictatorship, and if this pact is ever exposed, it would validate every conspiracy theory about Zionist manipulation and burn our bridges with every other state in the region."
 syrian_diplomacy.71.a: "Establish the liaison office"
 syrian_diplomacy.71.b: "This is a bridge too far"

 syrian_diplomacy.72.t: "The Enemy in the Walls"
 syrian_diplomacy.72.d: "They have agreed. A nondescript annex in a Damascus ministry now hosts our most unthinkable guests. Mossad advisors walk our halls, their presence the regime's most closely guarded secret. The flow of intelligence has begun, giving us a terrifying clarity against our foes. Yet, with each report they file, their influence grows. We have traded a piece of our sovereignty for a powerful weapon, inviting the architect of our past defeats to tutor us in the dark arts. The shadow of this betrayal now hangs over the regime. One leak, one whispered word to Cairo or Tehran, and this house of cards will collapse in a firestorm of rage from which we cannot recover"
 syrian_diplomacy.72.a: "We walk the razor's edge"

 syrian_diplomacy.73.t: "Damascus Knocks on the Door"
 syrian_diplomacy.73.d: "Against all odds and decades of hostility, a formal request has arrived from Damascus. The Syrian government, in a staggering reversal of its foundational ideology, seeks to accede to the Abraham Accords. They propose full normalization, framing it not as surrender, but as a strategic necessity for their survival and reconstruction. For us, this is the ultimate geopolitical prize: permanently neutralizing our most entrenched front-line adversary, gaining a foothold in the heart of the Levant, and dealing a catastrophic blow to Iran's 'Axis of Resistance'. However, integrating this bankrupt, authoritarian state-with its baggage of war crimes and ties to terrorism-into our new security architecture presents profound moral and practical dilemmas."
 syrian_diplomacy.73.a: "Welcome them into the fold"
 syrian_diplomacy.73.b: "Their regime is beyond redemption"

 syrian_diplomacy.74.t: "The Threshold Crossed"
 syrian_diplomacy.74.d: "They have accepted. The signal from Jerusalem, relayed through backchannels, is clear. The path to the Abraham Accords is open. Our audacious gamble has paid off in the first instance. We stand on the brink of securing the unimaginable: an end to strategic isolation, a lifeline of investment, and a formal end to the state of war that has defined us for generations. Yet, this is merely the end of the beginning. We must now navigate the far more dangerous phase: managing the furious backlash from Tehran and its proxies, confronting the seismic shock within our own power structures, and preparing to sign the documents that will forever redefine what it means to be Syria."
 syrian_diplomacy.74.a: "Prepare for the signing"

 syrian_diplomacy.75.t: "The Friendship Pipeline"
 syrian_diplomacy.75.d: "A delegation from Damascus arrives with detailed blueprints and bold ambition. They propose the immediate construction of the long-discussed 'Friendship Pipeline' - a direct energy artery from our South Pars fields to their Mediterranean coast. This 5,600-kilometer project would not only secure Syria's energy needs for decades but, more critically, grant the Islamic Republic its first sovereign conduit to European markets, bypassing rival routes. The Syrians stress its role in cementing our strategic axis and promise full cooperation. However, the initial investment will be substantial, and the project will draw immediate hostility from those who wish to keep our energy isolated."
 syrian_diplomacy.75.a: "Our fortunes are linked. Begin the work"
 syrian_diplomacy.75.b: "Risks are too great"

 syrian_diplomacy.76.t: "The Pipeline is Greenlit"
 syrian_diplomacy.76.d: "Word has come from Tehran: the proposal is accepted. The initial funds have been allocated, and Iranian engineers will soon join our teams to survey the route through Iraq to our ports. The 'Friendship Pipeline' is now a reality in the making. This project is the ultimate fusion of our interests - it will fuel our reconstruction with transit revenues and deepen our alliance with Iran to an unbreakable degree. We have taken a decisive step towards energy independence and geopolitical relevance, forging our own path despite the certain condemnation from our adversaries"
 syrian_diplomacy.76.a: "Lay the foundation of our shared future"

 syrian_diplomacy.77.t: "Syria Proposes Joint Action in Yemen"
 syrian_diplomacy.77.d: "Damascus has sent us a proposal. They offer to spearhead a ground intervention in Yemen to defeat the hostile regime in Sana'a, directly weakening Iran's position in the region. They request our military coordination and support for this operation"
 syrian_diplomacy.77.a: "Accept their proposal and coordinate the intervention"
 syrian_diplomacy.77.b: "Reject the offer"

 syrian_diplomacy.78.t: "The Hezbollah Dilemma"
 syrian_diplomacy.78.d: "The actions of Hezbollah are becoming a liability. Their independence threatens to drag us into a conflict not of our choosing and on their terms. We must decide how to rein them in: either through our own direct pressure, which will burn bridges but assert our authority, or by appealing to their primary patron in Tehran, hoping they will see reason and discipline their proxy, though this shows our dependence."
 syrian_diplomacy.78.a: "Confront them ourselves"
 syrian_diplomacy.78.b: "Let Tehran deal with its creation"

 syrian_diplomacy.79.t: "Curbing Hezbollah"
 syrian_diplomacy.79.d: "Damascus has appealed to us directly. They report that Hezbollah, emboldened by its successes, now operates with dangerous independence, making strategic decisions that threaten Syrian security and could drag the entire Axis into an unwanted war. They request that we, as the group's primary sponsor, use our authority to formally expel Hezbollah from the alliance structures to reestablish discipline and a unified command. This is a plea to preserve the coalition by removing its most unruly element."
 syrian_diplomacy.79.a: "Expel Hezbollah from the Axis"
 syrian_diplomacy.79.b: "Reject the request"

 syrian_diplomacy.80.t: "Hezbollah Is Expelled"
 syrian_diplomacy.80.d: "Tehran has acted on our request. Hezbollah has been formally expelled from the Axis of Resistance and stripped of its official support. This decisive move curtails their independent actions and reasserts the primacy of state interests within our alliance. While it neutralizes an immediate threat, it has fundamentally altered the nature of our coalition"
 syrian_diplomacy.80.a: "A necessary outcome"

 syrian_diplomacy.81.t: "The Levantine Proposal"
 syrian_diplomacy.81.d: "A Syrian delegation arrives in Doha with detailed plans and a clear strategic vision. They propose the construction of a direct gas pipeline from Qatar's North Field through the Levant to the Mediterranean coast, presenting Syria as the natural transit corridor between the Gulf and Europe. The project promises secure access to European markets while avoiding existing bottlenecks and rival-controlled routes. Damascus emphasizes economic pragmatism, long-term transit stability, and the revival of historic trade pathways linking Arabia to the Mediterranean, but acknowledges that such a project will inevitably provoke regional opposition"
 syrian_diplomacy.81.a: "Our interests align. Approve the project"
 syrian_diplomacy.81.b: "The risks outweigh the benefits"

 syrian_diplomacy.82.t: "The Qatar-Levant Pipeline Approved"
 syrian_diplomacy.82.d: "Word has arrived from Doha: the proposal is accepted. Qatari investment funds are released, and joint engineering teams will soon begin surveying the route toward Syria's Mediterranean ports. The Qatar–Levant Pipeline represents a decisive shift in regional energy dynamics, offering an alternative corridor to Iranian-led projects and anchoring Gulf gas to Levantine transit infrastructure. For Syria, it promises transit revenues, strategic relevance, and renewed influence at the crossroads of regional commerce, even as rival powers look on with growing concern"
 syrian_diplomacy.82.a: "Open a new corridor to the Mediterranean"

 syrian_diplomacy.83.t: "The Syrian-Qatari Holding Company"
 syrian_diplomacy.83.d: "Syrian representatives arrive in Doha with a formal proposal to establish the Syrian–Qatari Holding Company, a joint investment vehicle owned equally by both states. The initiative is presented as a framework to channel Qatari capital into key sectors of the Syrian economy, including energy generation, fuel distribution, agriculture, real estate, and infrastructure. Damascus argues that shared ownership and long-term commitments will provide financial stability, attract expertise, and institutionalize economic cooperation between Syria and Qatar, while remaining officially non-political in nature"
 syrian_diplomacy.83.a: "Approve the creation of the holding company"
 syrian_diplomacy.83.b: "Decline the proposal"

 syrian_diplomacy.84.t: "The Holding Company Established"
 syrian_diplomacy.84.d: "Doha approves the proposal, and the Syrian-Qatari Holding Company is formally established with equal capital contributions from both governments. The new entity is tasked with coordinating investments across multiple sectors of the Syrian economy, providing a stable channel for Qatari financial involvement and anchoring bilateral economic relations in institutional form. The company marks a significant step in formalizing Syria's economic ties with the Gulf"
 syrian_diplomacy.84.a: "Formalize economic cooperation"

 #Mejd events
 syria_mejd.1.t: "Session I: The Question of Desire"
 syria_mejd.1.d: "The doctor sets aside his notebook and looks directly at you. 'Your Majesty, leave the royal regalia at the door. Who are you when the crown is removed? What does your soul crave when it is not screaming about duty?' The silence in the study becomes palpable, filled with the echo of the millennia-long history of your dynasty."
 syria_mejd.1.a: "Glory that will outshine Uruk itself!"
 syria_mejd.1.b: "Order from chaos, as Enlil separated the heavens from the earth!"
 syria_mejd.1.c: "Treasure to buy fate itself!"

 syria_mejd.2.t: "Session II: The Question of Purpose"
 syria_mejd.2.d: "'What is your true purpose?' The doctor's voice is low but insistent. 'Not the duty thrust upon you by birth, but the fundamental reason for your being. What were you made to do in this grand, crumbling theater of the world?'"
 syria_mejd.2.a: "To unveil the Tablets of Destiny, to read what the gods inscribed!"
 syria_mejd.2.b: "To exercise Dominion over all I survey!"
 syria_mejd.2.c: "To possess the Knowledge that is true power!"

 syria_mejd.3.t: "Session III: The Question in a Dead Tongue"
 syria_mejd.3.d: "The doctor's voice suddenly shifts, becoming ancient and guttural. 'Dingir kima šu ba-zi?' he intones in Sumerian. The words hang in the air, heavy with forgotten meaning. 'Which of the first gods do you answer to?'"
 syria_mejd.3.a: "Inanna!"
 syria_mejd.3.b: "Dumuzid!"
 syria_mejd.3.c: "Teššub!"

 syria_mejd.4.t: "A Glimmer of... Clarity?"
 syria_mejd.4.d: "The sessions have ended. For days, you have sat in silence, the voices of gods and kings still echoing in the marble halls of your mind. But now, there is a new silence beneath the noise - not the silence of absence, but of focus. The grandiose visions of Uruk and the divine clamor have not vanished, but they have... arranged themselves. A terrible, coherent purpose begins to crystallize from the chaos. The doctor observes you with wary eyes. 'Your Majesty?' he ventures. You look up, and for the first time, your gaze is not that of a lost king, but of a conqueror who has finally glimpsed the map of his destiny. The madness remains, but it has found a direction."
 syria_mejd.4.a: "The path is clear. Let the world tremble."

 syria_mejd.5.t: "Words of a Mental Breakdown"
 syria_mejd.5.d: "The regents find you standing before the map, tracing lines with a trembling finger from Syria to the very shores of the Persian Gulf. 'Do you not see it?' you whisper, your voice a mixture of awe and madness. 'It was never about Damascus... It is about Uruk. I am not Mejd. The dream was clear. I am he who walked the walls, who defied the gods... I am Gilgamesh returned. And these lands' - your hand sweeps across the map - 'shall be the New Ashur, the empire reborn from the clay of history itself.' The regents exchange glances, unsure if they are witnessing a revelation or the final unraveling of a mind."
 syria_mejd.5.a: "I am Gilgamesh. Let the New Ashur rise!"

 syria_mejd.6.t: "Strange Tidings from the East"
 syria_mejd.6.d: "An official communiqué arrives from [FROM.GetNameDef]. The parchment is written in peculiar cuneiform and sealed with an image of a bearded bull-man. It proclaims that the King of [FROM.GetNameDef], the returned Gilgamesh, has divined that Egypt's true spiritual heritage lies with its ancient priesthood. To restore this 'sacred order', he is forwarding a substantial donation. The letter ends with a prayer to Ashur and a request for us to 'awaken the spirits of the Pharaohs'. We have read this three times. We still have no idea what it means."
 syria_mejd.6.a: "What? ...Fine. Thank you."

 syria_mejd.7.t: "Egypt Accepts Our Offering"
 syria_mejd.7.d: "Cairo has acknowledged our donation. Their official response thanks us for our 'generous contribution to Egyptian cultural initiatives'. Attached is a handwritten sticky note, clearly added by a confused clerk: 'Are they... talking about the movie? The one with the chariots?' Nevertheless, the gold was accepted. This is enough. The spirits of the Pharaohs have received their offering."
 syria_mejd.7.a: "The Pharaohs stir. Our work bears fruit."

 syria_mejd.8.t: "What Use Has a King for Trinkets?"
 syria_mejd.8.d: "For decades, the coffers of the Assad dynasty swelled with the nation's wealth – oil revenues, shadowy deals, and the silent tribute of a fearful people. Now, King Gilgamesh sits before the ledgers. 'What use has a king of Uruk for such trinkets?' he murmurs. 'Let the black‑headed people drink from the same cup.' Within hours, convoys of trucks roll out of presidential palaces, loaded with suitcases of foreign currency, gold bars, and deeds to properties. The streets of Damascus, Aleppo, and the forgotten villages erupt in disbelief. Old women weep. Young men chant the king's name. For one fleeting, impossible moment, the man who declared himself a god becomes the savior of his people."
 syria_mejd.8.a: "The wealth of the dynasty belongs to the people!"
 SYR_youth_organizations_expanded: "Youth organizations"
 SYR_patriotic_propaganda_new: "Patriotic propaganda"

 ##########RIFAAT TREE##########
 ##########Focuses##########
 SYR_Invite_Rifaat_Back: "§CInvite Rifaat Back§!"
 SYR_Invite_Rifaat_Back_desc: "General Rifaat al-Assad takes power in the name of restoring order and stability in the country. With the support of the army and security agencies, he is committed to modernizing the state, strengthening the economy, and establishing solid ties with Western partners.\nUnder his leadership, Syria will gain strength, prosperity, and a place among the great nations. A new era begins."
 SYR_Cover_Up_the_Hama_Incident: "Cover Up the Hama Incident"
 SYR_Cover_Up_the_Hama_Incident_desc: "The Hama affair must be buried beneath official silence and disciplined storytelling. By controlling the narrative, the regime can shield itself from scandal and preserve the myth of order."
 SYR_Egyptian_Experience: "Egyptian Experience"
 SYR_Egyptian_Experience_desc: "Rifaat al-Assad recognizes the similarities between himself and the Egyptian leader - both are Western autocrats struggling for power in an unstable region. Studying the methods of the Egyptian regime will allow Rifaat to strengthen his grip on power and ensure stability through proven techniques of authoritarian governance."
 SYR_Restore_Latakia_Network: "Restore Latakia Network"
 SYR_Restore_Latakia_Network_desc: "Latakia - Syria's principal seaport - becomes the center of an ambitious project to restore port infrastructure and trading networks. Rifaat invests in the modernization of port facilities, expansion of storage complexes, and creation of logistical centers. The restored Latakia network will enable Syria to control commodity flows in the Eastern Mediterranean and transform the port into a regional trading hub."
 SYR_Ensure_Saudi_Ties: "Ensure Saudi Ties"
 SYR_Ensure_Saudi_Ties_desc: "Riyadh is a source of money, influence, and conservative backing that cannot be ignored. A careful understanding with Saudi Arabia could strengthen the regime's standing and steady the economy."
 SYR_Appease_the_Kurds: "Appease the Kurds"
 SYR_Appease_the_Kurds_desc: "Syria pursues a policy of appeasing the Kurdish population through social programs. This strategy is aimed at preventing conflict and integrating the Kurds into the state structure while maintaining central control."
 SYR_Exclusive_British_Partnership_with_Syria: "Exclusive British Partnership with Syria"
 SYR_Turkish_Normalization_Negotation: "Turkish Normalization Negotiation"
 SYR_Turkish_Normalization_Negotation_desc: "Old tensions with Ankara are replaced by cautious bargaining and practical compromise. Normalization with Turkey could secure the border, reduce pressure, and open the door to regional stability."
 SYR_Syrian_Trade_Hub_Project: "Syrian Trade Hub Project"
 SYR_Syrian_Trade_Hub_Project_desc: "The establishment of a comprehensive trading center transforms Syria into a key commercial hub. Strategic port development, modern logistical infrastructure, and commercial facilities will enable Syria to dominate regional trade flows and generate substantial economic prosperity."
 SYR_Support_Opposition_in_Iraq: "Support for Opposition in Iraq"
 SYR_Support_Opposition_in_Iraq_desc: "Through covert operations and financial support, Syria will strengthen the position of opposition forces in Iraq. This strategy is aimed at weakening the power of the Iraqi government while simultaneously expanding Syrian influence in the region."
 SYR_Pardon_All_Relatives: "Pardon All Relatives"
 SYR_Pardon_All_Relatives_desc: "Years of exile and internal family conflicts are coming to an end. Rifaat al-Assad extends a hand of reconciliation to members of the Assad clan, offering amnesty to all who were exiled or persecuted after his rise to power.\nBashar al-Assad and his supporters will receive pardons in exchange for loyalty to the new regime. This will unite the Alawite elite, but will require political compromises and weaken Rifaat's personal power. Moscow observes this process with approval - a stable Syria serves Russian interests in the region."
 SYR_Exclusive_British_Partnership_with_Syria_desc: "Rifaat al-Assad sends a diplomatic delegation to London to propose an exclusive partnership. Syria presents Britain with access to its ports, lucrative investment prospects, and strategic cooperation throughout the Eastern Mediterranean, seeking in return economic aid, military-technical assistance, and international recognition of Syria's new political order. This initiative could dramatically reshape Syria's standing in global affairs."
 SYR_Syrian_Seculirization: "Seculirization"
 SYR_Syrian_Seculirization_desc: "Secularization of the state aims at separating religion from politics and public life. Secular education, Western values, and a scientific approach become the new ideology of the regime, marginalizing religious institutions from political power."
 SYR_Establish_Militiry_Political_Autonomy: "Establish Military Political Autonomy"
 SYR_Establish_Militiry_Political_Autonomy_desc: "The armed forces gain political and financial autonomy, becoming an independent branch of power. Military command obtains the right to independently determine national security strategy and control a significant portion of the state budget, making the army the primary instrument of political power."
 SYR_Steps_to_Democratization: "Steps to Democratization"
 SYR_Steps_to_Democratization_desc: "Democratization will be introduced carefully, in controlled steps that do not threaten the regime's core authority. The process is meant to project reform while keeping the state firmly in trusted hands."
 SYR_Establish_Local_Electoral_Councils: "Establish Local Electoral Councils"
 SYR_Establish_Local_Electoral_Councils_desc: "The establishment of a network of local electoral councils serves a dual purpose: to provide the appearance of democratic participation to the population while strengthening state control through a networked system of governance. The councils will become an instrument of propaganda and political oversight at the local level."
 SYR_Reestablish_Western_Ties: "Restoring Western Relations"
 SYR_Reestablish_Western_Ties_desc: "After years of isolation and conflict, Syria needs to restore diplomatic and economic ties with Western powers. Rifaat al-Assad, as a Western autocrat, understands the importance of cooperation. Strengthening these ties will ensure economic development and international recognition of the new regime."
 ##########Modifier##########
 SYR_pardon_clan: "Reconciliation with the Assad Clan"
 SYR_latakia_network_modifier: "Restore Network"
 ##########Events##########
 SYR.Rifaat.1.t: "Rifaat al-Assad's Rise to Power"
 SYR.Rifaat.1.d: "General Rifaat al-Assad takes power in the name of restoring order and stability in the country. With the support of the army and security agencies, he is committed to modernizing the state, strengthening the economy, and establishing solid ties with Western partners.\nUnder his leadership, Syria will gain strength, prosperity, and a place among the great nations. A new era begins."
 SYR.Rifaat.1.a: "Rifaat Will Make Syria Great"
 SYR_Rifaat_british.2.d: "Britain has approved our partnership proposal. The trade agreement is signed, and British investments will begin flowing into the Syrian economy."
 SYR_Rifaat_british.3.d: "Britain has rejected our proposal. The partnership negotiations have failed, and British investments remain out of reach."
 SYR_Rifaat_turkish.1.t: "Syria offers us cooperation"
 SYR_Rifaat_turkish.1.d: "We have been offered an exclusive economic partnership with Syria. The agreement promises preferential access to Syrian markets, joint investments, and significant expansion of British economic influence in the region. A decision must be made regarding the viability of such a partnership."
 SYR_Rifaat_turkish.2.t: "Turkey Agrees"
 SYR_Rifaat_turkish.3.t: "Turkey Refuses"
 SYR_Rifaat_turkish.2.d: "Turkey has approved our partnership proposal. The trade agreement is signed, and British investments will begin flowing into the Syrian economy."
 SYR_Rifaat_turkish.3.d: "Turkey has declined our proposal. The partnership negotiations have proven unsuccessful, and access to British capital remains elusive."
 SYR_Rifaat_turkish.1: "Syria offers us cooperation"
 SYR_Rifaat_british.1.t: "Syria offers us cooperation"
 SYR_Rifaat_british.1.d: "Syria has extended to us an offer of exclusive economic partnership, providing access to Syrian markets, preferential trade terms, and investment opportunities in key economic sectors. This agreement would strengthen our economic influence in the Eastern Mediterranean and open new avenues for British capital. However, we must consider the political implications of cooperating with Rifaat al-Assad's regime."
 SYR_Rifaat_british.2.t: "Britain Agrees"
 SYR_Rifaat_british.3.t: "Britain Refuses"

