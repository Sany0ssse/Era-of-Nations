 ##Greater Syria
 TT_SYR_ASSAULT_JORDAN: "The success of the coup depends on the popularity of the §YNationalist Outlook§! in Jordan.\n\nIf the coup is §Gsuccessful§!, the new regime will be prompted to join us and we will gain cores on Jordan.\n\nIf the coup leads to a §Ycivil war§!, we will join the SSNP in their war against the regime, and we will gain cores on Jordan.\n\nIf the coup §Rfails§!, there will be war between us and Jordan, and we will only get claims on Jordan.\n\n"
 TT_SYR_CONCESSIONS_TO_KURDS: "If the Kurds agree to our deal, then\n"
 TT_SYR_ALIGN_SUDAN: "\nThe willingness of [SUD.GetName] to ally us is §Gstrong§! by default\n\n[SUD.GetName] is more likely to ally us if\n §G-They follow the Nationalist Outlook§!\n\n[SUD.GetName] is less likely to ally us if\n §R-They and [EGY.GetName] both follow the Western or Emerging Outlook\n -They are at war\n -They are already allied to someone else§!\n"
 TT_SYR_ALIGN_AZERBAIJAN: "\nThe willingness of [AZE.GetName] to ally us is §gsplit even§! by default\n\n[AZE.GetName] is more likely to ally us if\n §G-They follow the Nationalist Outlook§!\n\n[AZE.GetName] is less likely to ally us if\n §R-They and [PER.GetName] both follow the Western or Emerging Outlook\n -They follow the Non-Aligned Outlook\n -They are at war\n -They are already allied to someone else\n -They have solved their dispute with [ARM.GetName]\n -We have been hostile towards Turkey§!\n"
 TT_SYR_ALIGN_ARMENIA: "\nThe willingness of [ARM.GetName] to ally us is §Gstrong§! by default\n\n[ARM.GetName] is more likely to ally us if\n §G-They follow the Nationalist Outlook§!\n\n[ARM.GetName] is less likely to ally us if\n §R-They are at war\n -We are allied with the Kurds§!\n"
 TT_SYR_ALIGN_GREECE: "\nThe willingness of [GRE.GetName] to ally us is §Rweak§! by default\n\n[GRE.GetName] is more likely to ally us if\n §G-They follow the Nationalist Outlook\n -[TUR.GetName] is not a member of NATO§!\n\n[GRE.GetName] is less likely to ally us if\n §R-They are at war\n -They have solved their border disputes with [TUR.GetName]\n -We or our puppet own Cyprus§!\n"
 TT_SYR_WEAKEN_IRAN: "We will get access to §Ydecisions§! to weaken Iran and recruit local militias before invading them\n"
 TT_SYR_ARABISTAN_ARMED: "When we do §YOperation Eastern Whirlwind§!, Arab militias will rise up and join us\n"
 TT_SYR_LURISTAN_ARMED: "When we do §YOperation Eastern Whirlwind§!, Lur rebels will declare independence and fight against Iran\n"
 TT_SYR_AZERBAIJAN_ARMED: "When we do §YOperation Eastern Whirlwind§!, Azeri rebels will join up with the Azerbaijani army and fight against Iran\n"
 TT_SYR_TABARISTAN_ARMED: "When we do §YOperation Eastern Whirlwind§!, Gilak and Mazanderani rebels will declare independence and fight against Iran\n"
 TT_SYR_BALOCHISTAN_ARMED: "When we do §YOperation Eastern Whirlwind§!, Balochi rebels will declare independence and fight against Iran\n"

 ##Diplomacy
 TT_SYR_ALIGN_PALESTINE: "\nThe willingness of [PAL.GetName] to ally us is §Gstrong§! by default\n\n[PAL.GetName] is more likely to ally us if\n §G-We follow the same Outlook§!\n\n[PAL.GetName] is less likely to ally us if\n §R-They are already allied to someone else\n§!"
 TT_SYR_ALIGN_ISRAEL: "\nThe willingness of [ISR.GetName] to ally us is §Gstrong§! by default\n\n[ISR.GetName] is more likely to ally us if\n §G-We both follow either the Western or Emerging Outlook§!\n\n[ISR.GetName] is less likely to ally us if\n §R-They are already allied to someone else\n -They follow the Nationalist Outlook\n§!"
 TT_SYR_ALIGN_JORDAN: "\nThe willingness of [JOR.GetName] to ally us is §Gstrong§! by default\n\n[JOR.GetName] is more likely to ally us if\n §G-We both follow the same Outlook\n -[ISR.GetName] follows the Nationalist Outlook§!\n\n[JOR.GetName] is less likely to ally us if\n §R-The Arab-Israeli Conflict is solved on their part\n§!"
 TT_SYR_ALIGN_EGYPT: "\nThe willingness of [EGY.GetName] to ally us is §Gstrong§! by default\n\n[EGY.GetName] is more likely to ally us if\n §G-We both follow the same Outlook\n -[ISR.GetName] follows the Nationalist Outlook§!\n\n[EGY.GetName] is less likely to ally us if\n §R-The Arab-Israeli Conflict is solved on their part\n§!"
 TT_SYR_ALIGN_SAUDI_ARABIA: "\nThe willingness of [SAU.GetName] to ally us is §gsplit even§! by default\n\n[SAU.GetName] is more likely to ally us if\n §G-We both follow the same Outlook\n -The Saudi Family is in power and we follow the Western Outlook\n -We are Sunni and not Shia\n -We have withdrawn from Lebanon§!\n\n[SAU.GetName] is less likely to ally us if\n §R-Fahd is no longer the King\n -We have tried to assassinate the Lebanese Prime Minister\n -We have completed the focus 'Support Hezbollah'\n -They have the bad opinion of us\n§!"
 TT_SYR_ALIGN_IRAN: "\nThe willingness of [PER.GetName] to ally us is §Gstrong§! by default\n\n[PER.GetName] is less likely to ally us if\n §R-We don't follow the same Outlook\n -We are Sunni\n -We have completed the focus 'Resist Hezbollah'\n -We control Lebanon\n§!"
 TT_SYR_ALIGN_RUSSIA: "\nThe willingness of [SOV.GetName] to ally us is §Gstrong§! by default\n\n[SOV.GetName] is less likely to ally us if\n §R-We don't follow the same Outlook\n -We are at war\n§!"

 #Focus tree loc
 Syria_Civil_War_Over: "Syrian Civil War Over"
 SYR_civil_war_victory: "Victory!"
 SYR_civil_war_victory_desc: "We have achieved victory in the Syrian Civil War! Now we can start rebuilding our country."
 SYR_free_syria: "Free Syria"
 SYR_free_syria_desc: "Syria has finally been freed from the yoke of Al Assad and the fundamentalists. Now is the time to celebrate, and draw up plans for the future of Syria"
 SYR_syrian_arab_army: "Status of Syrian Arab Army"
 SYR_syrian_arab_army_desc: "The Syrian Civil War was devastating on the Syrian Arab Army, the main military force of the government. Large parts of the army defected or deserted in the beginning of the conflict, and several years of war have taken a heavy toll on the army. Even though the Assad regime is defeated, some elements of the SAA are still around. We need to decide what to do with them."
 SYR_political_plurality: "Level of Political Plurality"
 SYR_political_plurality_desc: "During the civil war, several militias and political groups dominated the country. We now need to decide who do we want to take in the future of Syria"
 SYR_federal_republic_of_syria: "Federal Republic of Syria"
 SYR_federal_republic_of_syria_desc: "Syria is composed of many ethnicities. Many ethnicity groups have been in conflict with each other for a long time. In order for the country to survive, we need to give more control to ethnicity groups of our country"
 SYR_unitary_republic_of_syria: "Unitary Republic of Syria"
 SYR_unitary_republic_of_syria_desc: "Syria should stays as a republic, and we should encourage people of all cultures and faiths to come together under one united Syrian flag."

 SYR_death_of_hafez_al_assad: "Succession of Hafez al-Assad"
 SYR_death_of_hafez_al_assad_desc: "It is time to choose the successors of Hafez al-Assad"
 SYR_bushra_al_assad: "Bushra al-Assad"
 SYR_bushra_al_assad_desc: "Bushra is the eldest and the most experienced child of Hafez. The fact that she is a woman shouldn't cancel her out from succession. She is the most legitimate heir, and she will lead Syria into a modern future"
 SYR_Husband_Minister: "Husband Minister"
 SYR_Husband_Minister_desc: "Bushra's husband Assef Shawkat is currently the Deputy Director of Military Intelligence. He should be promoted to the position of Director, to better help Bushra secure her position"
 SYR_gulf_state_tour: "Gulf State Tour"
 SYR_gulf_state_tour_desc: "It is important to show the more conservative gulf states that a woman can make the perfect leader for a country."
 SYR_healthcare_reform: "Healthcare Reforms"
 SYR_healthcare_reform_desc: "Bushra has already championed one wave of developing the Syrian pharmaceutical industry. It is normal and necessary that she use her experience to reform the very lacking Syrian healthcare system"
 SYR_invite_big_pharma: "Invite Big Pharma"
 SYR_invite_big_pharma_desc: "We need to contact large foreign pharmaceuticals companies to setup manufacturing plants in Syria. This will however, upset the ruling elite as profits from these companies will be out of their hands"
 SYR_syrian_pharmaceuticals: "Syrian Pharmaceuticals"
 SYR_syrian_pharmaceuticals_desc: "Bushra has plans to help kickstart several Syrian pharmaceutical companies, such as Syrian Allied Medical Group, to make sure that we can cover all domestic needs of medical supplies and beyond"
 SYR_eqalitarian_campaign: "Egalitarian Campaign"
 SYR_eqalitarian_campaign_desc: "Syria will be transformed into a modern state where men and women will be equal. Marriage contracts will no longer be a matter between the groom and the bride's father, and the dual legal system where secular and Sharia courts work side-by-side will be eliminated"
 SYR_iron_lady: "Iron Lady of Syria"
 SYR_iron_lady_desc: "Bushra has the charisma and the ability to make those around her slowly drift to her side. As the first female head of state of the Arab world, she will be forever remembered by history"
 #Bashar
 SYR_bashar_al_assad: "§YBashar al-Assad§!"
 SYR_bashar_al_assad_desc: "While Bashar has spend most of his adult life studying medicine, he was quickly rushed back to Syria for military training and he quickly got the position of colonel in a Republican Guard unit. While inexperienced, he is the oldest son, and thus in the eyes of many the most legitimate heir for Hafez."
 SYR_constitutional_amendment: "Constitutional Amendment"
 SYR_constitutional_amendment_desc: "The current Syrian constitution requires the President to be at least 40 years of age. This is complete nonsense, age shouldn't be a limit. Also, changing the constitution has nothing to do with the fact that our current President is below the age limit!"
 SYR_strengthen_ties_to_HEZ_and_PER: "Strengthen Shia Ties"
 SYR_strengthen_ties_to_HEZ_and_PER_desc: "We need strong allies in the region. The Hezbollah and Iran are one of the strongest military entities in the region. It is imperative that we base our security apparatus on coordination with them."
 SYR_purge_opposition: "Purge Opposition"
 SYR_purge_opposition_desc: "When power passes on, there are always those who would want to see the whole system crumble. We need to arrest key opposition members both within and outside the Ba'ath Party."
 SYR_friend_old_guard: "Befriend the Old Guard"
 SYR_friend_old_guard_desc: "Not all power structures should be reformed. Some members of the old elite are the key to holding on to power. While some favours might be required, Bashar must align with them to stay in power."
 SYR_loyal_marriage: "Loyal Marriage"
 SYR_loyal_marriage_desc: "A ruler can't be without a spouse. Asma Akhras, an old family friend of Bashar has recently moved to Syria from the United Kingdom. She is well-educated in economics and would make a good wife for Bashar."
 SYR_firm_the_grip: "Firm the Grip"
 SYR_firm_the_grip_desc: "Bashar inherited a patronage network woven through Syrian economic life. The oligarchic families-the Makhloufs, the Shalishs, the Kaddours-prospered under Hafez; their loyalty must now be secured. By offering them continued control, Bashar binds their fortunes to his own. A pragmatic foundation for a new presidency."
 SYR_liberal_concessions: "Liberal Concessions"
 SYR_liberal_concessions_desc: "Hafez's death opened a crack in Ba'athist rule. Bashar could widen it-just enough. A loosening of media restrictions, a few political prisoners freed, quiet encouragement of civil forums. Not democracy, but its promise. Not reform, but the appearance of it. A way to win over the intelligentsia without surrendering power."
 SYR_benefits_for_baathists: "Benefits for Baathists"
 SYR_benefits_for_baathists_desc: "The Ba'ath Party is the skeleton of the state. Its cadres and apparatchiks kept Syria running for three decades. To neglect them would be paralysis. Bashar will reward their loyalty with contracts, housing, sinecures. Stability paid in patronage."
 SYR_support_personal_cult: "Support Personal Cult"
 SYR_support_personal_cult_desc: "Hafez was the father of the nation; his face hung everywhere. Bashar must build his own image. Staged photographs, televised visits, a media campaign-the young doctor will be forged into a leader. The cult of Bashar is constructed, one poster at a time."
 SYR_cosmetic_reforms: "Cosmetic Reforms"
 SYR_cosmetic_reforms_desc: "The Damascus Spring arrives earlier than expected. Intellectuals gather, petitions circulate, voices call to end emergency law. Bashar hesitates. A televised meeting, a few long‑forgotten prisoners released-enough to quiet the noise without altering the architecture of power."
 SYR_youngblood: "Young Blood"
 SYR_youngblood_desc: "The old guard held the fort; the young will build the future. A regime must renew itself to survive. A generation of technocrats, educated in the West and loyal to the new president, will be brought into ministries and planning commissions. Fresh ideas, no ties to the past."
 SYR_negotiate_muslim_brotherhood: "Negotiate with Muslim Brotherhood"
 SYR_negotiate_muslim_brotherhood_desc: "The Brotherhood was crushed in Hama but never destroyed. Its leaders in London, its networks sleeping across the country. Now they extend a cautious hand. A quiet meeting, a promise of amnesty-enough to split their ranks, to buy peace, without ever trusting them with power."
 SYR_bash_medical_investments: "Medical Investments"
 SYR_bash_medical_investments_desc: "Bashar trained as an ophthalmologist; medicine comes more naturally than politics. He will channel funds into new hospitals, clinics, pharmaceuticals. A genuine investment in Syrian well‑being-and a political statement: the doctor is healing the nation."
 SYR_embrace_damascus_spring: "Embrace Damascus Spring"
 SYR_embrace_damascus_spring_desc: "The Damascus Spring is a moment of possibility. Literary salons, political forums, debates in private homes-Syrians taste free speech. Bashar could crush it, or let it flourish within limits. A gesture of trust, a signal that the new era will be different."
 SYR_economy_liberalization: "Economy Liberalization"
 SYR_economy_liberalization_desc: "The old socialist model left Syria lagging behind its neighbors. Private capital, foreign investment, a modern banking sector-these are the engines of growth. Bashar will open the economy. The state will still own the heights, but the market will shape the landscape below."
 SYR_ban_extremist_parties: "Ban Extremist Parties"
 SYR_ban_extremist_parties_desc: "Religious extremism haunts the region. The Ba'athist state kept it at bay through co‑optation and repression. Now Bashar must draw the red line. Parties that advocate violence, that reject the secular state-banned. Many voices, but no room for fanaticism."
 SYR_true_electoral_reform: "True Electoral Reform"
 SYR_true_electoral_reform_desc: "Syrian elections have always been foregone conclusions. The National Progressive Front wins every seat. Now Bashar will change the rules-slightly. More seats for independents, a more open process. The outcome will still be controlled, but the appearance of competition will be real."
 SYR_syrian_freedom_media: "Syrian Freedom Media"
 SYR_syrian_freedom_media_desc: "The state always controlled the news. Now Bashar will allow private newspapers, independent journalists, a more vibrant public sphere. Criticism tolerated, as long as it does not touch the sacred pillars of the regime. A media landscape that appears free."
 SYR_pop_anticor_camp: "Popular Anti-Corruption Campaign"
 SYR_pop_anticor_camp_desc: "Corruption is the silent disease of the state. From customs to procurement, the system runs on baksheesh. Bashar will target mid‑level bureaucrats who take too much, officials who embarrass the regime. Show trials, asset seizures. A message that the new president is cleaning house."
 SYR_ensure_military_support: "Ensure Military Support"
 SYR_ensure_military_support_desc: "The army is the ultimate guarantor of the regime. Hafez built it as a personal instrument, filling its senior ranks with Alawite officers loyal to his family. Bashar must secure that loyalty: increased spending, new equipment, promotions-and the elevation of his brother Maher to a position of command."
 #Maher
 SYR_maher_al_assad: "§OMaher al-Assad§!"
 SYR_maher_al_assad_desc: "The youngest of Hafez's sons, Maher, has a long experience with the Syrian military. Though hot-headed and even cruel by some accounts, a strong military man is what is needed to keep Syria strong"
 SYR_empower_the_republican_guard: "Empower the Republican Guard"
 SYR_empower_the_republican_guard_desc: "The Republican Guard is the elite military branch of Syria. We need to elevate them above all to secure the safety of Syrian society. The Republican Guard is the only group fit for ruling Syria"
 SYR_resestablish_defence_companies: "Re-Establish Defence Companies"
 SYR_resestablish_defence_companies_desc: "The Defence Companies were a special forces group during the 70s and 80s that acted similarly to the Republican Guard. It is time to re-establish this group. These soldiers will be special forces trained in airborne and tank warfare, and their main task will be to defend the government against internal threats"
 SYR_oil_must_flow: "Oil Must Flow"
 SYR_oil_must_flow_desc: "Oil is one of our country's most vital resources. Not only does it bring revenue to the state, part of the income is funneled directly to the Republican Guard. We must become like our neighbours, and become a true oil power"
 SYR_State_Propoganda: "Syrian Savage"
 SYR_State_Propoganda_desc: "According to the Turkish president [TUR.GetLeader], Maher's actions are close 'savagery'. Maher will proudly carry this title, as a savage lion does not care for the opinion of the sheep. This will be our new propaganda basis - we do not kneel in front of any weakness!"
 SYR_Bring_SSNP: "Bring SSNP"
 SYR_Bring_SSNP_desc: "SSNP is the most national and loyal political force in Syria which wants to make Syria truly great. Their political goals are fully aligned with Maher's ambition."
 SYR_Alawi_Dominance: "Alawi Dominance"
 SYR_Alawi_Dominance_desc: "Alawis must now dominate and lead SSNP to it's new, reformed ideological position."
 SYR_New_Cultural_Policy: "New Cultural Policy"
 SYR_New_Cultural_Policy_desc: "We must create a new culture in Syria, by rooting out all islamic influence. Syria must restore the culture which was forgotten long ago."
 syrian_cultural_policy_one: "New Cultural Policy"
 syrian_cultural_policy_two: "Integrated Cultural Policy"
 syrian_cultural_policy_three: "Syrian Legacy"
 SYR_Promote_the_Minorities: "Promote the Minorities"
 SYR_Promote_the_Minorities_desc: "The Alawis, Christians, Assyrians, and Druzes have bled for this nation while the so-called 'majority' whispered prayers for our downfall. No more. Under Maher's Syria, every minority that stands loyal shall be elevated - given land, given arms, given a voice in the halls of power. Let the shepherds of the old faiths become the pillars of the new state. Syria does not belong to those who kneel toward Mecca; it belongs to those who kneel toward no one."
 SYR_Stomp_Out_Islamists: "Stomp Out Islamists"
 SYR_Stomp_Out_Islamists_desc: "They hid behind minarets and called it faith. They smuggled weapons beneath prayer rugs and called it resistance. Maher will not negotiate with fanatics — he will root them out, mosque by mosque, village by village, until not a single black flag flies over Syrian soil. The imams who preached sedition will answer to the Republican Guard, not to God. Syria will be cleansed of this plague, and the faithful will learn that loyalty to the nation supersedes loyalty to any foreign prophet."
 SYR_Syrian_Legacy: "Syrian Legacy"
 SYR_Syrian_Legacy_desc: "Syria's true identity lies not in the Arab conquests, but in the ancient civilizations that once flourished in this land. We must forge a new Syrian nationalism rooted in the glorious heritage of Assyria, Babylon, and Mesopotamia - the true ancestors of our people. By embracing this pre-Arabic legacy and supporting our Assyrian and other minority communities, we will build a nation that honors its authentic history rather than the foreign impositions of the past."
 SYR_Crackdown_of_Freedom: "Crackdown of Freedom"
 SYR_Crackdown_of_Freedom_desc: "We must show that any opposition and petty democratic movements have no say in our country anymore. Syria will be strong and sovereign!"
 syrian_ssnp_propaganda: "State Propaganda"
 SYR_Oil_Concentrarion: "Oil Concentration"
 SYR_Oil_Concentrarion_desc: "We must concentrate on oil production and refining to secure our energy independence. This might harm other sectors of the economy, but it is necessary to secure our future."
 SYR_Personal_Deals: "Personal Deals"
 SYR_Personal_Deals_desc: "Maher will focus on the needs of the elite and the oligarchy, and will ensure that the country is strong and prosperous as long as he is in power."
 SYR_Contraband_Imports: "Contraband Imports"
 SYR_Contraband_Imports_desc: "Maher will use his personal connections to smuggle goods in and out of Syria to maintain strategic autonomy of Syrian economy. This will however, upset the population as profits from these efforts will be out of their hands."
 SYR_All_for_the_Nation: "All for the Nation"
 SYR_All_for_the_Nation_desc: "We must focus our economy not on our personal needs, but needs of our people."
 SYR_Social_Militarism: "Social Militarism"
 SYR_Social_Militarism_desc: "Social militarism must now be our dedicated governmental ideological and economical strategy for Syria."
 syrian_ssnp_economy: "Social-Militarism"
 syrian_maher_economy: "Maher's Economy"
 syrian_maher_economy_desc: "Maher's economy is based on the principles of hidden deals and personal relationships. He will focus on the needs of the elite and the oligarchy, and will ensure that the country is strong and prosperous as long as he is in power."
 SYR_rifaat_al_assad: "Rifaat al-Assad"
 SYR_rifaat_al_assad_desc: "Rifaat al-Assad is the brother of the late Hafez al-Assad. He was the Vice-President of Syria until his exile in 1998. He has since claimed that his removal was unconstitutional, and since the previous President has died in office, he is the legitimate successor. He has promised that he will rule the country democratically if he is allowed to return. But then on the other hand, he is an al-Assad"
 SYR_arab_news_network: "Arab News Network"
 SYR_arab_news_network_desc: "Rifaat's son, Sumer, is currently the head of the Arab News Network. The network mainly works as the political mouthpiece of Rifaat, and bringing this great news outlet to Syria will ensure that Rifaat's opinions are well known across the country"
 SYR_the_arab_democratic_party: "The Arab Democratic Party"
 SYR_the_arab_democratic_party_desc: "Rifat founded the Arab Democratic Party in Lebanon in the early 70s, but control over the party has slipped through his hands. He should start a new branch, and gather all his supporters under this legitimate party"
 SYR_kick_out_al_assads: "Kick Out the al-Assads"
 SYR_kick_out_al_assads_desc: "The al-Assads are everywhere. In the government, in the media, in the army. We can't trust that they will let democracy grow in Syria. They must be all banned from taking part in the country's politics and the most prominent members of the family should be exiled"
 SYR_reestablish_political_parties: "Re-Establish Political Parties"
 SYR_reestablish_political_parties_desc: "For 40 years, the country has been under single rule by the Ba'ath Party. We must release political prisoners from prisons and allow exiles to return to the country and set up new political parties. This will of course completely reshuffle the political landscape of the country but that is necessary for the country's future"
 SYR_free_elections: "Free Elections"
 SYR_free_elections_desc: "It is time to hold Syria's first free elections"
 SYR_israeli_allies: "Israeli Allies"
 SYR_israeli_allies_desc: "Israel is one of the most powerful countries in the region. Our animosity towards them is nonsensical, and we should aim to repair our relations"
 SYR_saudi_allies: "Saudi Allies"
 SYR_saudi_allies_desc: "Saudi Arabia is a massive oil producer and one of the leading countries in the Peninsula Shield. Being on their goodside is our priority"
 SYR_american_allies: "American Allies"
 SYR_american_allies_desc: "The United States is the greatest economy and military force on the planet. Being their friend can have absolutely no downsides"
 SYR_iranian_allies: "Iranian Allies"
 SYR_iranian_allies_desc: "Iran, even though they are a Shia country, are one of the old allies of Syria. Despite our religious difference, this alliance should be allowed to exist"

 #post 2000s elections syria tree
 SYR_Syrian_Muslim_Brotherhood: "Islamist Opposition"
 SYR_Syrian_Muslim_Brotherhood_desc: "The islamist opposition coalition has won the elections and will be tasked in leading syria into becoming a conservative islamic republic"
 SYR_islamist_renaissance: "Islamist Renaissance"
 SYR_islamist_renaissance_desc: "Our victory has emboldened our support throughout the masses. A new culture has evolved and we are all for supporting it"
 SYR_empower_sharia_courts: "Empower Sharia Courts"
 SYR_empower_sharia_courts_desc: "It's time to empower the islamic judiciary and expand it's influence"
 SYR_Islamic_Demorcracy: "Turkish Inspired Islamism"
 SYR_Islamic_Demorcracy_desc: "We will draw inspiration from the islamist movements that took place in turkey after the establishment of their republic. This will paint our movement in a more favorable light for now and may attract turkish conservative businessmen into investing in our country."
 SYR_deregulate_economy: "Deregulated Economy"
 SYR_deregulate_economy_desc: "To empower the middle classes and merchants that we draw lots of our support from, we will reduce restrictions on them and provide the space required for their growth"
 SYR_syrian_gulen_movement: "Syrian Gülen Movement"
 SYR_syrian_gulen_movement_desc: "The gülen movement in short was an islamist movement in turkey that was very popular between students advocating for a pacifist and modern view of islam. We will draw inspiration from their teachings and reform our school curriculums to advocate for islamic values and teach them to students as well as improve education overall."
 SYR_moderate_conservatism: "Moderate Conservatism"
 SYR_moderate_conservatism_desc: "We will root out extremist elements within our ranks and reshape our image as a force for conservatism that has nothing to do with religious fanaticism"
 SYR_religious_values: "Our Values Unwavering"
 SYR_religious_values_desc: "It might be that our previous policies to appease the populace and soften our image has allowed us to stray from the true values our ideals are built upon. We care less for what others view us and our only goal is to establish sharia in our lands nomatter how unpopular that may be"
 SYR_Nationalwide_Charity: "Religious Donations"
 SYR_Nationalwide_Charity_desc: "Our movements have been always associated with charities and foundations that have been beneficial to our communities. Now that we have a more prominent position we will institutionalize them further to alleviate our economic burdens"
 SYR_qatari_support: "Qatari Support"
 SYR_qatari_support_desc: "We have drawn the interest of various qatari investors"
 SYR_flourishment_of_central_economy: "Develop Urban Centres"
 SYR_flourishment_of_central_economy_desc: "Our support base mainly comes from various urban regions and we should start to develop them to embolden our support from their population"
 SYR_turkish_investments: "Turkish Investments"
 SYR_turkish_investments_desc: "We have attracted lots of turkish investors thanks to our deregulation policies as well as our ideological similarities to them"

 #Hayat Tahrir al-Sham
 SYR_Form_Hayat_Tashir_al_Sharm: "Form Hayat Tahrir al-Sham"
 SYR_Form_Hayat_Tashir_al_Sharm_desc: "The banners of Tahrir al-Sham rise over Damascus. Abdul Qadeem Zallum, the seasoned revolutionary, takes the reins. A coalition of Islamist factions-fighters, scholars, and those who survived Hama-now unite under a single flag. The revolution is consolidated; the path forward is finally clear."
 SYR_reverse_secularization: "Reverse Secularization"
 SYR_reverse_secularization_desc: "The previous regime has heavily secularized our state. This clear insult to our ideals should not continue, and we should reverse these policies in favor of Sharia law. The muezzin’s call will once again echo from every ministry; Syria returns to its true path."
 SYR_Islamic_Umbrella: "Islamic Umbrella"
 SYR_Islamic_Umbrella_desc: "Not all who fight for Islam agree on the path. Salafists, traditionalists, the Muslim Brotherhood-each carries a piece of the truth. We will bring them together under one umbrella. A united Islamic front, strong enough to rule, and broad enough to endure."
 SYR_Al_Qaeda_Dilemma: "Al Qaeda Dilemma"
 SYR_Al_Qaeda_Dilemma_desc: "The jihadists who fought beside us now demand their place. Their methods are harsh, their loyalty absolute. To embrace them is to risk the world’s condemnation. To reject them is to fracture our coalition. This choice will define our revolution."
 SYR_Integrate_Jihadists: "Integrate Jihadists"
 SYR_Integrate_Jihadists_desc: "The warriors who came from distant lands to bleed for Syria will not be cast aside. We will bring them into the fold-not as guests, but as brothers. Their zeal will become our strength. Their sacrifice will be honored; Syria’s new order will be forged by those who fought for it."
 SYR_A_New_Idealogical_Image: "A New Ideological Image"
 SYR_A_New_Idealogical_Image_desc: "The world sees only the sword; we will show them the pen. A new Syria, where justice is Sharia and mercy is law. We will open our schools, our courts, and our markets to those who wish to understand. Let them see what we build, not only what we destroy."
 SYR_suppress_traitors: "Suppress Traitors"
 SYR_suppress_traitors_desc: "Not all who walked among us were faithful. Spies, informants, and those who traded the revolution for safety-they will be found. A quiet hand, a locked door, a name erased from memory. The new Syria has no room for those who served the old regime."
 SYR_appease_the_west: "Appease the West"
 SYR_appease_the_west_desc: "To survive, we must occasionally hide our intentions. We will convince the global powers that our stability is preferable to chaos. Strategic concessions and moderate rhetoric are not signs of weakness, but tools to strengthen our position while the world's eyes are turned away."
 SYR_negotiations_comission: "Negotiations Comission"
 SYR_negotiations_comission_desc: "Victory is not only won on the battlefield. We will establish a commission to speak with those who still hesitate, to offer terms to those who wish to lay down arms, and to negotiate with the powers that watch from afar. The pen, wielded wisely, can finish what the sword began."

 SYR_NPF_victory: "National Progressive Front Government"
 SYR_NPF_victory_desc: "The Mighty Union won the elections and now it's our time to reconfigure the future of the new Syria."
 SYR_statist_rise: "Statist Rise"
 SYR_statist_rise_desc: "Liberal Economics allow exploitation of our people and compromises our national independence and control. It is best for Syria to connect every aspect of economy to the state."
 SYR_maintain_military_role: "Maintain Army Leverages"
 SYR_maintain_military_role_desc: "The World is entering dark and awkward times so we have to protect our nation, doesn't matter what it costs."
 SYR_kick_out_iran: "Kick Out Iran"
 SYR_kick_out_iran_desc: "Iran has always subjugated us under their control and there's no reason for us to maintain our ties with them. It is the right time to kick these ideological enemies out of Syria!"
 SYR_nationalize_oligarchic_holdings: "Nationalize Holdings"
 SYR_nationalize_oligarchic_holdings_desc: "We will nationalize the holdings and properties of various rogue oligarchs to strengthen our grip over the economy."
 SYR_subsidise_police: "Subsidise Police"
 SYR_subsidise_police_desc: "Police is one of the most important thing to make our people feel safe and guarantee our rule in Syria and it has been very underfunded. This has to change."
 SYR_maintain_socialistic_policies: "Maintain Socialist Laws"
 SYR_maintain_socialistic_policies_desc: "One thing the previous government got right, and is the ultimate reason why they were relatively more popular is their socialist policies that supported the lower classes. We will continue the policies implemented by the former president hafez al assad and depict ourselves as the true supporters of the oppressed."
 SYR_government_planned_economic_projects: "Government Projects"
 SYR_government_planned_economic_projects_desc: "We should initiate public projects to enhance our image as a responsible government and to gather support from the common people."
 SYR_patriotic_propaganda: "Patriotic Propaganda"
 SYR_patriotic_propaganda_desc: "We will strengthen our ideological positions by emphasizing the importance of national pride and state loyalty."
 SYR_gather_support_from_peasantry: "Peasantry Support"
 SYR_gather_support_from_peasantry_desc: "Peasants are the backbone of our nation and we have to make sure that they are supporting us."
 SYR_strong_government: "Strong Government"
 SYR_strong_government_desc: "We will have to show our people to our government is stable and capable enough to rule. This will allow us to gain their trust"
 SYR_expand_youth_organizations: "Expand Youth Organizations"
 SYR_expand_youth_organizations_desc: "Our parties have relied notably on youth organizations and now that we are in a position of power it's time to encourage the youth to support our ideological causes by winning their hearts and minds."
 SYR_illiberal_democracy: "Illiberal Democracy"
 SYR_illiberal_democracy_desc: "Liberalism is a virus that infects and exploits poor nations. What the people need is true democracy that truly represents the people and at the same time unites them under one banner. We are a democracy no matter what."
 SYR_reestablish_intelligence_committee: "Reestablish Intel Agencies"
 SYR_reestablish_intelligence_committee_desc: "The future wars are not with guns and tanks, but with information. It's our responsibility to create a fully functional intelligence agency."
 SYR_national_security_act: "National Security Act"
 SYR_national_security_act_desc: "The extremists groups are killing our nation slowly and pose a threat to our people. Their attacks are a clear threat to our nation and if anything we have to stop them immediately no matter what the cost, no matter what happens. TERRORISM SHALL STOP."
 SYR_pan_syrian_nationalism: "Pan Syrianism"
 SYR_pan_syrian_nationalism_desc: "Syria is the country that should brighten all over Middle East with it's unique identity. Our rich history and culture makes it clear that it's our duty to show our true potential and identity to the world."
 SYR_cultural_rebirth: "Cultural Rebirth"
 SYR_cultural_rebirth_desc: "Our nation is slowly but surely recognizing it's identity. Petty divides should not stop in the way of realizing the beauty of our people. Our people should acknowledge that no matter what, we're still syrians after all."
 SYR_deal_with_the_trade_unions: "A Deal With Unions"
 SYR_deal_with_the_trade_unions_desc: "The key of a strong country is it's production and economy so we have to make sure that all workers of Syria are supporting us."
 SYR_reassert_russian_ties: "Russian Ties"
 SYR_reassert_russian_ties_desc: "Russia is the only and true ally that helps us to become a modern, safe and prosperous nation."
 SYR_russian_oil_excavation: "Russian Oil Deals"
 SYR_russian_oil_excavation_desc: "There is a big treasure in our nation and our ally, Russia, will help us reach these resources."
 SYR_russian_tartus_base_expansion: "Expand Russian Naval Presence"
 SYR_russian_tartus_base_expansion_desc: "We can't create a strong navy immediately but our Russian friends will help us keep our costs safe by aiding in the expansion of the port's capabilities."
 SYR_nasserist_rise: "Nasserist Rise"
 SYR_nasserist_rise_desc: "Nasserism is rising again and ready to make Syria great again."
 SYR_islamic_socialism: "Islamic Socialism"
 SYR_islamic_socialism_desc: "People seem to forget that islam advocates lots of practices attributed to socialism such as zakat and sadaka. We should emphasize this relationship by basing our ideals around it as this will also gather support from the islamists that always stood against our ideals. Islamic socialism is the true way towards making our nation a modern, strong and virtuous republic."
 SYR_Get_rid_of_oligarchs: "Purge The Oligarchs"
 SYR_Get_rid_of_oligarchs_desc: "The oligarchy is entrenched in our institutions and are a clear threat to our country's future. We will arrest them on corruption charges and confiscate what properties we can get our hands on"
 SYR_the_coalition: "The Coalition"
 SYR_the_coalition_desc: "After reestablishing political parties two notable forces have risen. One advocates for federalizing the state and giving more power to provinces while the other advocates for entrenching the centralized authority and maintaining a united centralized republic. We'll have to choose carefully who we should align with"
 SYR_dismantle_the_military: "Dismantle Military Budget"
 SYR_dismantle_the_military_desc: "Lots of the defense gdp has been embezzled and directed towards useless projects due to the entrenched corruption within the institutions of our armed forces. We will repurpose and sell much of what we can get our hands on and while this may weaken our military and make us prone to threats, this is a necessary step towards economic recovery and corruption rootout"

 SYR_scientific_ventures: "Scientific Ventures"
 SYR_scientific_ventures_desc: "By supporting scholarships and updating our outdated school curriculums we will be able to advance the country's scientific sector"
 SYR_domestic_investments: "Domestic Investments"
 SYR_domestic_investments_desc: "Many young domestic businesses are being set up. We will invest in them to support their journey towards economic prosperity"
 SYR_subsidize_local_firms: "Local Firms"
 SYR_subsidize_local_firms_desc: "Thanks to our policies local firms are being recognized for their success. Time to invest in them"
 SYR_federalisation: "Federalisation"
 SYR_federalisation_desc: "The solution is to give more power to the states. This will greatly encourage local representation and inclusiveness and will greatly remedy sectarian fears and tensions. However this autonomy will weaken our hold over the states especially where minorities are present"

 SYR_invite_US_business_giants: "Invite Business Giants"
 SYR_invite_US_business_giants_desc: "While we have allowed our economy to prosper this is not enough. We will invite giant businesses from the US to establish franchises in the country to encourage consumerism"
 SYR_republicanism: "Republicanism"
 SYR_republicanism_desc: "Syria is best governed as a strong state with a centralized authority. This will strengthen our government's rule but will cause alienation and anger from minorities that feel sidelined"
 SYR_address_ethnic_divides: "Solve Ethnic Divides"
 SYR_address_ethnic_divides_desc: "Our country has always been divided and plagued with sectarianism. We should decide how to address these issues"
 SYR_EU_investments: "EU Investments"
 SYR_EU_investments_desc: "Various European countries are seeking to invest in our country"
 SYR_student_exchanges: "Student Exchanges"
 SYR_student_exchanges_desc: "We will encourage scholarships into foreign countries to enhance our education and keep it on par to global standards"
 SYR_concentrate_on_lebanon: "Concentrate On Lebanon"
 SYR_concentrate_on_lebanon_desc: "Lebanon has long been a target of Syria. There is a fierce competition between the Hezbollah and the government there, and we should take advantage of this"
 SYR_against_hezbollah: "Resist Hezbollah"
 SYR_against_hezbollah_desc: "The Hezbollah are nothing more than a terrorist organisation trying to break down Lebanon. We need to prepare to get rid of them"
 SYR_lebanese_support: "Gather Lebanese Support"
 SYR_lebanese_support_desc: "For years Hezbollah has caused problems in Lebanon. They are practically a state within a state, and greatly reduce the legitimacy of the Lebanese government. We should contact Lebanon and discuss possible common military action against Hezbollah"
 SYR_strike_hezbollah: "Eliminate Hezbollah"
 SYR_strike_hezbollah_desc: "The time has come to get rid of Hezbollah"
 SYR_shadow_over_lebanon: "Shadow Over Lebanon"
 SYR_shadow_over_lebanon_desc: "We helped the Lebanese gain back control of their country, and they owe us a great deal. Only two decades ago, Syrian government was firmly intertwined with the Lebanese government, and that is the situation we want again"
 SYR_support_hezbollah: "Support Hezbollah"
 SYR_support_hezbollah_desc: "Hezbollah is a valuable ally to us. We need to make sure they come on top and eventually gain control of all of Lebanon"
 SYR_prepare_lebanon_coup: "Infiltrate Lebanon"
 SYR_prepare_lebanon_coup_desc: "Hezbollah already operates within Lebanon. We need to increase help to them, and make their power-base stronger. This will eventually make them strong enough to overthrow the Lebanese government"
 SYR_lebanese_coup: "The Lebanese Coup"
 SYR_lebanese_coup_desc: "The Hezbollah operatives in Lebanon are ready to carry out a coup. If succesful, Hezbollah will gain control of the entire country. If unsuccesful however, the Lebanese army might retaliate.\n\nThe higher the support for Hezbollah, the more likely it is for the coup to succeed"
 SYR_shadow_over_hezbollah: "Shadow Over Hezbollah"
 SYR_shadow_over_hezbollah_desc: "We helped Hezbollah overthrow the Lebanese government. This means they owe us. We should pull them from Iranian control and make them follow our guidance"

 #Opposition
 SYR_secular_opposition_victory: "Secular Opposition Government"
 SYR_secular_opposition_victory_desc: "The secular opposition coalition has won the elections and will be tasked in leading syria into becoming a liberal democratic state"
 SYR_us_support: "US Support"
 SYR_us_support_desc: "Washington will be asked to back the new civilian government with diplomatic recognition, political leverage, and a cautious stream of influence. If the Americans are willing to invest in our future, Syria may yet become a partner rather than a battlefield."
 SYR_direct_intervention: "Direct Intervention"
 SYR_direct_intervention_desc: "The opposition has decided it can no longer rely on speeches alone. Foreign boots, foreign planes, and foreign guarantees may be the only way to keep the revolution alive long enough to win the peace."
 SYR_cooperation_with_israel: "Cooperation with Israel"
 SYR_cooperation_with_israel_desc: "A bitter history does not vanish overnight, but necessity can force strange conversations. Through quiet channels and careful concessions, we may turn old enemies into pragmatic partners."
 SYR_european_education_support: "European Education Support"
 SYR_european_education_support_desc: "A modern Syria needs modern minds. By bringing in European educational assistance, scholarships, and institutional guidance, we can raise a generation that looks toward the future instead of the ruins of the past."
 SYR_support_of_druzes: "Support of the Druzes"
 SYR_support_of_druzes_desc: "The Druze communities of the south have long lived between fear and loyalty. By guaranteeing their place in the new order, we can prove that this Syria will not be built on the exclusion of its minorities."
 SYR_kurds_agreement: "Kurds Agreement"
 SYR_kurds_agreement_desc: "The Kurdish question cannot be solved by force alone. A binding agreement, one that acknowledges their rights and aspirations, may be the price of a stable and united Syria."
 SYR_federalization: "Federalization"
 SYR_federalization_desc: "Syria's future may depend on sharing power instead of hoarding it. A federal structure would ease local tensions, strengthen regional responsibility, and give each community a stake in the republic."
 SYR_suppress_islamists: "Suppress Islamists"
 SYR_suppress_islamists_desc: "The opposition must decide where freedom ends and fanaticism begins. If the republic is to survive, extremists cannot be allowed to hijack the democratic project from within."
 SYR_shiniest_democracy: "Shiniest Democracy"
 SYR_shiniest_democracy_desc: "Reform is no longer a slogan but a performance, and Syria will put on its brightest possible face. We will polish the institutions, publicize the victories, and present our democracy as something the region has never seen before."
 SYR_guardians_of_revolution: "Guargians of Revolution"
 SYR_guardians_of_revolution_desc: "Every revolution needs defenders who can protect it from old habits, old elites, and old dictators. These guardians will stand watch over the new order until the republic is strong enough to defend itself."
 SYR_western_supported_economic_relief: "Western Relief"
 SYR_western_supported_economic_relief_desc: "Our ideals align with that of the west and even allowed us to set up our parties in their countries. We will set ties with them and request relief in exchange for economic leverages"
 SYR_liberalize_society: "Liberalize Society"
 SYR_liberalize_society_desc: "The people are strangers to values of freedom and equality. We should work on encouraging them to value their freedoms"
 SYR_democratic_socialism: "Democratic Socialism"
 SYR_democratic_socialism_desc: "The ruinous economic state of our country has left our population quite poor and underdeveloped. Reducing restrictions on businesses will introduce exploitation and unfair competition as economic inequality is still prevalent in our country. What we need is to focus on encouraging new businesses in the country and giving them grants to allow for a broad economic development that all classes of citizens can enjoy" 
 SYR_syrian_diaspora_investments: "Diaspora investments"
 SYR_syrian_diaspora_investments_desc: "Thanks to our economically friendly policies we have attracted investments from the syrian diaspora living abroad"
 SYR_unleash_economic_potential: "Unleash Economic Potential"
 SYR_unleash_economic_potential_desc: "We have a great potential to become an economic powerhouse. We can encourage foreign investors and businesses to set up companies here and even though this will subject our population to become cheap laborers it will be our great leap towards economic development"
 SYR_empower_institutions: "Empower Institutions"
 SYR_empower_institutions_desc: "Our institutions are very weak and sidelined. This is due to power being concentrated on the president and little power given to parliament as well as a state controlled media supporting an atmosphere constricting personal freedoms. Drafting a new constitution ensuring power distribution and liberalization is a crucial step towards the future"
 SYR_banish_authoritarian_influence: "Banish Authoritarian Influence"
 SYR_banish_authoritarian_influence_desc: "Many authoritarian states such as Iran and Russia have had a large presence here. Now that we are a free state it's time we end their influence on our institutions and economy"
 SYR_economic_democracy: "Economic Equality"
 SYR_economic_democracy_desc: "Our economic development has reached all people of all economic backgrounds by tackling economic inequality and even gave rise to successful domestic companies. This is something we should be proud of"

 SYR_Remain_Independent: "Remain Independent"
 SYR_Remain_Independent_desc: "Syria shall not become a mere satellite of foreign powers. We must navigate the complex geopolitical landscape to ensure our sovereignty remains intact, balancing between competing interests while keeping our destiny in our own hands."
 SYR_Distance_from_Salafits: "Distance from Salafists"
 SYR_Distance_from_Salafits_desc: "While radical elements are effective on the battlefield, their extreme ideology risks alienating the moderate population and potential international partners. We must publicly distance our political goals from their sectarian agenda."
 SYR_Only_Path_in_Rabaniya: "Only Path in Rabaniyya"
 SYR_Only_Path_in_Rabaniya_desc: "The concept of Rabaniyya dictates that all authority stems from divine governance. By implementing this path, we restructure our society to align every law and action with the ultimate sovereignty of the Creator."
 SYR_Support_the_Traders: "Support the Traders"
 SYR_Support_the_Traders_desc: "The merchant classes of Damascus and Aleppo are the lifeblood of our economy. By providing them with security and lowering internal tariffs, we can stabilize the markets and ensure a steady flow of revenue for the state."
 SYR_turkish_backing: "Turkish Defense"
 SYR_turkish_backing_desc: "Ankara views our stability as vital to their own border security. By formalizing our ties with the Turkish government, we secure modern equipment, logistical support, and a powerful deterrent against our enemies."
 SYR_Al_Nursa_Front: "Al-Nusra Front"
 SYR_Al_Nursa_Front_desc: "As a disciplined and highly capable fighting force, the Al-Nusra Front represents the vanguard of the armed struggle. Their tactical expertise and ideological fervor are essential assets in dismantling the current regime."
 SYR_Al_Qaeda_Network: "Al-Qaeda Network"
 SYR_Al_Qaeda_Network_desc: "Tapping into the global network of Al-Qaeda provides us with access to veteran fighters, clandestine funding, and decades of experience in asymmetric warfare across the Islamic world."
 SYR_Teachings_of_Qutb: "Teachings of Qutb"
 SYR_Teachings_of_Qutb_desc: "The writings of Sayyid Qutb serve as a wake-up call against modern Jahiliyyah. By embracing his ideology, we prepare the vanguard for a total struggle against man-made systems of tyranny."
 SYR_Call_to_Qatar: "Call to Qatar"
 SYR_Call_to_Qatar_desc: "Doha possesses the financial weight and media influence necessary to shift the tide of the conflict. A formal appeal to Qatar will bring in much-needed investment and diplomatic legitimacy to our cause."
 SYR_Pan_Islamists_Efforts: "Pan-Islamist Efforts"
 SYR_Pan_Islamists_Efforts_desc: "The borders imposed upon us are artificial constructs. We must dedicate our efforts to fostering unity among the Ummah, transcending national divides to create a cohesive front against external aggression."

# Al Nusra Three
 SYR_teaching_of_qutb_ext: "Teachings of Qutb"
 SYR_teaching_of_qutb_ext_desc: "We have extended the teachings of Qutb to include more radical ideas. This will help us to attract more followers and to strengthen our position in the region."
 SYR_international_jihadists_support: "International Jihadists Support"
 SYR_international_jihadists_support_desc: "We have increased our support for international jihadists. This will help us to attract more followers and to strengthen our position in the region."
 SYR_mushriq_chase_idea: "Mushriq Chase"
 SYR_mushriq_chase_idea_desc: "We have increased our support for mushriqs. This will help us to attract more followers and to strengthen our position in the region."
 SYR_hudud_in_syria: "Hudud in Syria"
 SYR_hudud_in_syria_desc: "Hudud is a system of Islamic law that is used to govern the Islamic state. We should implement it in our country to ensure that our laws are in line with Islamic law."
 SYR_Attack_Iraq_idea: "Planned Attack on Iraq"
 SYR_Attack_Iraq_idea_desc: "We have planned an attack on Iraq. We will attack Iraq with all our forces and will destroy their army. We will then annex Iraq and make it part of the Caliphate."

 hate_us: "Hate Us"
 islamic_theologian: "Islamic Theologian"
 master_of_asymmetric_warfare: "Master of Asymmetric Warfare"

 SyriaFocus.201.t: "Implement Hudud in Syria"
 SyriaFocus.201.d: "Implementing Hudud in Syria will make our country more Islamic and will help us to spread the word of Allah to the world. However, it will also make our country more isolated from the rest of the world. We must decide whether to implement Hudud in our country."
 SyriaFocus.201.a: "Implement Hudud"
 SyriaFocus.201.b: "Don't Implement Hudud"

 SyriaFocus.200.t: "Resolve the issue with non-Salafist parties"
 SyriaFocus.200.d: "Banning non-Salafist parties in Syria will make our country more Islamic and will help us to spread the word of Allah to the world. However, it will also make our country more isolated from the rest of the world. We must decide whether to ban non-Salafist parties in our country. We have two options: Ban all non-Salafist parties or leave them alone."
 SyriaFocus.200.a: "Ban Non-Salafist Parties"
 SyriaFocus.200.b: "Leave Non-Salafist Parties Alone"
 SyriaFocus.200.tt: "§RWe will ban all other parties and lose the respect of our neighbors, but we will get rid of their influence on us!"

 Syria_Caliphate_category: "Caliphate"
 Syria_Caliphate_category_desc: "We are on the path to the Caliphate. We will follow the path of the Prophet Muhammad and his companions, and we will spread the word of Allah to the world."
 SYR_Buy_T55: "Buy T-55"
 SYR_Buy_T55_desc: "We should buy T-55 tanks to strengthen our army. These tanks are powerful and will help us to defend our country."
 SYR_Buy_ZIL131: "Buy ZIL-131"
 SYR_Buy_ZIL131_desc: "We should buy ZIL-131 trucks to transport our troops and equipment. These trucks are reliable and will help us to transport our troops and equipment."
 SYR_Buy_BM21Grad: "Buy BM-21 Grad"
 SYR_Buy_BM21Grad_desc: "We should buy BM-21 Grad rocket launchers to help us to defend our country. These rocket launchers are powerful and will help us to defend our country."
 SYR_Buy_D30: "Buy D-30"
 SYR_Buy_D30_desc: "We should buy D-30 guns to help us to defend our country. These guns are powerful and will help us to defend our country."
 SYR_Buy_Strela2M: "Buy Strela-2M"
 SYR_Buy_Strela2M_desc: "We should buy Strela-2M missiles to help us to defend our country. These missiles are powerful and will help us to defend our country."
 SYR_Buy_RPG7: "Buy RPG-7"
 SYR_Buy_RPG7_desc: "We should buy RPG-7 rockets to help us to defend our country. These rockets are powerful and will help us to defend our country."
 SYR_Buy_AKM: "Buy AKM"
 SYR_Buy_AKM_desc: "We should buy AKM rifles to help us to defend our country. These rifles are powerful and will help us to defend our country."
 SYR_Attack_Iraq: "Develop a plan to attack Iraq"
 SYR_Attack_Iraq_desc: "We should develop a plan to attack Iraq. We will attack Iraq with all our forces and will destroy their army. We will then annex Iraq and make it part of the Caliphate."
