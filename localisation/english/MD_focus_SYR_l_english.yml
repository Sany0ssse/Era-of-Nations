 ##########ROJAVA IDEAS##########
 rojava_spirit_of_revolution_1: "Spirit of the Revolution"
 rojava_spirit_of_revolution_1_desc: "The revolution in Rojava has forged a society that refuses to surrender, even against overwhelming odds."
 rojava_spirit_of_revolution_2: "Spirit of the Revolution (Renewed)"
 rojava_spirit_of_revolution_2_desc: "Our resolve hardens with every battle. The people of Rojava will endure and prevail."
 rojava_unintegrated_minorities: "Unintegrated Minorities"
 rojava_unintegrated_minorities_desc: "Without real representation and guarantees, minority communities remain uneasy within our administration."
 rojava_unintegrated_minorities_2: "Minorities Integrated"
 rojava_unintegrated_minorities_2_desc: "Through local councils and power-sharing, minority communities are increasingly committed to the Rojava project."
 rojava_political_chaos: "Political Chaos"
 rojava_political_chaos_desc: "Factional disputes and wartime pressures have thrown our politics into disorder, weakening effective governance."
 rojava_defense_measures: "Defense Measures"
 rojava_defense_measures_desc: "Improved fortifications, logistics, and civil preparedness strengthen our ability to hold the line."
 kill_deash: "Destroy Daesh"
 kill_deash_desc: "There can be no peace while Daesh survives. We will focus our efforts on crushing their remnants."
 kill_sna: "Crush the SNA"
 kill_sna_desc: "The Syrian National Army remains a constant threat along our borders. We will break their capabilities and networks."
 rojava_or_death: "Rojava or Death"
 rojava_or_death_desc: "Our enemies promise annihilation. We answer with total commitment to defend our homeland and revolution."
 rojava_disorganized_militias_1: "Disorganized Militias I"
 rojava_disorganized_militias_1_desc: "Our forces are brave but poorly coordinated, lacking training, supplies, and unified command."
 rojava_disorganized_militias_2: "Disorganized Militias II"
 rojava_disorganized_militias_2_desc: "Reforms are underway, but our militias still struggle with command and control."
 rojava_disorganized_militias_3: "Disorganized Militias III"
 rojava_disorganized_militias_3_desc: "Standardization and discipline are improving, though inefficiencies remain."
 rojava_disorganized_militias_4: "Disorganized Militias IV"
 rojava_disorganized_militias_4_desc: "Our units are nearly integrated into a coherent force, with only minor coordination issues left to solve."
 rojava_undecided_status: "Undecided Status"
 rojava_undecided_status_desc: "Rojava's position in Syria remains unsettled, creating uncertainty at home and abroad."
 rojava_apo_spirit: "Spirit of Apo"
 rojava_apo_spirit_desc: "The ideals of Abdullah Ocalan inspire unity, sacrifice, and international solidarity across our movement."
 rojava_asayish: "Asayish"
 rojava_asayish_desc: "A strengthened internal security apparatus improves stability and counters foreign subversion."
 rojava_international_brigades: "International Brigades"
 rojava_international_brigades_desc: "International volunteers and specialists bolster our forces and spread our cause beyond Syria."
 rojava_libertarian: "Libertarian Socialism"
 rojava_libertarian_desc: "A decentralized system of communes and cooperatives reduces burdens on the people while boosting long-term productivity."
 rojava_libertarian2: "Libertarian Socialism"
 rojava_libertarian2_desc: "With stronger institutions, our model expands further, unlocking more potential while securing social gains."
 rojava_tax_haven: "Tax Haven Policies"
 rojava_tax_haven_desc: "By reducing taxes and simplifying administration, we aim to attract capital and stimulate growth, at the cost of lower state revenues."
 rojava_breaking_old_order: "Breakdown of the Old Order"
 rojava_breaking_old_order_desc: "Having rid themselves of the remnants of the old order, the Kurdish people of Rojava will finally have the chance to build their new future from scratch"
 rojava_aladruzes_friendship: "Cooperation with [DRU.GetNameWithFlag]"
 rojava_aladruzes_friendship_desc: "Our cooperation has both cultural and military objectives – only together can we defend our independence and right to exist."
 rojava_aladruzes_friendship_1: "Cooperation with [ALA.GetNameWithFlag]"
 rojava_aladruzes_friendship_1_desc: "Our cooperation has both cultural and military objectives – only together can we defend our independence and right to exist."
 rojava_aladruzes_friendship_2: "Cooperation with [ROJ.GetNameWithFlag]"
 rojava_aladruzes_friendship_2_desc: "Our cooperation has both cultural and military objectives – only together can we defend our independence and right to exist."

 ##########ROJAVA TREE##########
ROJ_arise: "Arise, Rojava!"
ROJ_arise_desc: "The self-governing experiment in Rojava rises from the chaos of war, determined to defend its people and ideals."
ROJ_SDF: "Form the Syrian Democratic Forces"
ROJ_SDF_desc: "We will unify the militias of Rojava and their allies into the Syrian Democratic Forces, a broad coalition capable of defending the revolution."
ROJ_protect_women: "Protect the Women of Rojava"
ROJ_protect_women_desc: "By organizing women's self-defence units and guaranteeing their place in the struggle, we uphold gender liberation as a core pillar of our revolution."
ROJ_manbij: "Save Manbij"
ROJ_manbij_desc: "Manbij is a vital crossroads on the Euphrates. We must commit forces to its defence and prove that Rojava protects all communities under threat."
ROJ_protect_people: "Protect the People"
ROJ_protect_people_desc: "Every village and neighborhood must be shielded from fascist and jihadist forces. We will expand our militias to defend the people wherever they live."
ROJ_kurdish_supremacy: "Kurdish Supremacy"
ROJ_kurdish_supremacy_desc: "Some in our movement argue that only a Kurdish-dominated vanguard can secure Rojava's future, even at the risk of alienating our allies."
ROJ_KNC_agreement: "Agreement with the KNC"
ROJ_KNC_agreement_desc: "By reaching an understanding with the Kurdish National Council, we can reduce internal Kurdish divisions and strengthen our common front."
ROJ_minorities_agreement: "Protect the Minorities"
ROJ_minorities_agreement_desc: "Assyrians, Armenians, Arabs and others must all have a place in our project. A formal pact with the minorities will secure their support."
ROJ_asayish: "Strengthen the Asayish"
ROJ_asayish_desc: "The Asayish are our internal security forces. We will professionalize and expand them to keep order without betraying our revolutionary principles."
ROJ_apo: "Spirit of Apo"
ROJ_apo_desc: "The teachings of Abdullah Öcalan inspire our struggle. By embracing his ideas, we give our people a unifying revolutionary vision."
ROJ_kurdish_support: "Seek Kurdish Support"
ROJ_kurdish_support_desc: "From Qandil to Diyarbakir, Kurds across the region watch Rojava closely. We will seek political and material support from our kin beyond the borders."
ROJ_syria_assyria_council: "Syriac-Assyrian Council"
ROJ_syria_assyria_council_desc: "By establishing a Syriac-Assyrian council within our administration, we guarantee representation and deepen ties with Christian communities."
ROJ_international_brigades: "International Brigades"
ROJ_international_brigades_desc: "Volunteers from around the world flock to defend Rojava. We will organize them into international brigades to strengthen both our army and our message."
ROJ_turkish_opposition: "Reach out to the Turkish Opposition"
ROJ_turkish_opposition_desc: "Opponents of Ankara's regime can find common cause with us. Discreet cooperation with Turkish opposition forces will weaken our northern enemy."
ROJ_nubar_ozaryan_brigade: "Nubar Ozanyan Brigade"
ROJ_nubar_ozaryan_brigade_desc: "In honor of fallen comrades, we will form the Nubar Ozanyan Brigade, an Armenian-led unit symbolizing our commitment to anti-fascist struggle."
ROJ_self_defence_forces: "Self-Defence Forces"
ROJ_self_defence_forces_desc: "We will create structured self-defence forces in every canton, ensuring that our communities can mobilize quickly against any threat."
ROJ_turkish_volunteers: "Turkish Volunteers"
ROJ_turkish_volunteers_desc: "Turkish revolutionaries and deserters will be welcomed into our ranks, forming units dedicated to resisting authoritarianism in their homeland."
ROJ_mazloum_abdi: "Mazloum Abdi's Leadership"
ROJ_mazloum_abdi_desc: "Under the leadership of Mazloum Abdi, our forces gain an experienced and pragmatic commander who can balance diplomacy and military necessity."
ROJ_self_rule: "Self-Rule for Rojava"
ROJ_self_rule_desc: "We will formalize Rojava's self-rule, building institutions that answer to local councils rather than distant dictatorships."
ROJ_arabs_question: "The Arab Question"
ROJ_arabs_question_desc: "Our revolution cannot survive without the support of Arab communities. We must decide how far to go in sharing power and territory with them."
ROJ_US_support: "Court U.S. Support"
ROJ_US_support_desc: "The United States seeks reliable partners against terrorism. By working with them carefully, we can secure arms and air support while defending our autonomy."
ROJ_rus_support: "Seek Russian Support"
ROJ_rus_support_desc: "Russia is a decisive power in Syria. If we can convince Moscow that a stable Rojava serves its interests, we may gain valuable protection."
ROJ_break_them: "Break the Old Order"
ROJ_break_them_desc: "The old forces of Damascus and the opposition cannot both dominate Syria. We will play them against each other until their hold over our lands is broken."
ROJ_saa_negotiations: "Negotiate with the SAA"
ROJ_saa_negotiations_desc: "Talks with the Syrian Arab Army may yield ceasefires, territorial swaps and guarantees that buy us time to consolidate our project."
ROJ_fsa_negotiations: "Negotiate with the FSA"
ROJ_fsa_negotiations_desc: "Moderate rebel groups may prefer cooperation to endless war. We will explore negotiations with the Free Syrian Army where interests align."
ROJ_territorial_agreement: "Territorial Agreements"
ROJ_territorial_agreement_desc: "By striking territorial agreements with our rivals, we can secure our heartland and focus on building institutions instead of constant warfare."
ROJ_southern_operations_room: "Southern Operations Room"
ROJ_southern_operations_room_desc: "A joint operations room with our partners in the south will coordinate offensives, intelligence and logistics against common enemies."
ROJ_turkey_ceasefire: "Ceasefire with Turkey"
ROJ_turkey_ceasefire_desc: "If Ankara can be persuaded to halt its incursions, even temporarily, we will use the respite to fortify our borders and rebuild war-torn regions."
ROJ_alawites_connections: "Alawite Connections"
ROJ_alawites_connections_desc: "Cultivating ties with Alawite communities and officers may open channels inside the regime and reduce the risk of sectarian escalation."
ROJ_coordinations_with_israel: "Coordinate with Israel"
ROJ_coordinations_with_israel_desc: "Discreet coordination with Israel could yield intelligence and deterrence against hostile actors, though at the cost of regional suspicion."
ROJ_prepare_constitution: "Prepare a New Constitution"
ROJ_prepare_constitution_desc: "We will convene representatives of all peoples of northern Syria to draft a constitution based on democracy, gender equality and communal self-rule."
ROJ_libertarian_socialism: "Libertarian Socialism"
ROJ_libertarian_socialism_desc: "Guided by libertarian socialist thought, we will build a decentralized system of communes, cooperatives and councils beyond the old state model."
ROJ_revol_army_negotiations: "Army of Revolutionaries"
ROJ_revol_army_negotiations_desc: "The Army of Revolutionaries can become a key ally or a dangerous rival. Negotiations will determine whether they stand with us or against us."
ROJ_iran_negotiations: "Talks with Iran"
ROJ_iran_negotiations_desc: "Engaging Tehran diplomatically may unlock weapons and political guarantees, but risks tying our fate to regional power struggles."
ROJ_democratic_autonomous_administration: "Democratic Autonomous Administration"
ROJ_democratic_autonomous_administration_desc: "We will found a Democratic Autonomous Administration, institutionalizing self-government across northern and eastern Syria."
ROJ_western_kurdistan_republic: "Western Kurdistan Republic"
ROJ_western_kurdistan_republic_desc: "By proclaiming a Western Kurdistan Republic, we openly declare our national aspirations and invite Kurds everywhere to rally to our banner."
ROJ_war_measures: "Extraordinary War Measures"
ROJ_war_measures_desc: "To survive the ongoing conflict, we will centralize command, mobilize reserves and impose strict wartime measures across Rojava."
ROJ_daesh_destroy: "Destroy Daesh"
ROJ_daesh_destroy_desc: "The so-called Islamic State must be eradicated root and branch. We will not rest until its last stronghold has fallen."
ROJ_turkey_border_defenses: "Fortify the Turkish Border"
ROJ_turkey_border_defenses_desc: "We will dig trenches, build fortifications and prepare ambushes along the Turkish frontier to blunt any invasion."
ROJ_sna_infiltrate: "Infiltrate the SNA"
ROJ_sna_infiltrate_desc: "By infiltrating the Syrian National Army, we can gather intelligence, sabotage hostile plans and win over disillusioned fighters."
ROJ_federalisation_negotiation: "Negotiate Federalisation"
ROJ_federalisation_negotiation_desc: "A federal Syria could guarantee our autonomy within a larger state. We will push for a constitutional settlement that recognizes our rights."
ROJ_true_syrian_government: "The True Syrian Government"
ROJ_true_syrian_government_desc: "If others prove unfit to rule, we will present our administration as the legitimate government of Syria and seek international recognition."
ROJ_konets_genocida: "Peace at Last"
ROJ_konets_genocida_desc: "After years of massacres and ethnic cleansing, we will declare the end of the war and commit to justice for all communities."
ROJ_demilitarize_economy: "Demilitarize the Economy"
ROJ_demilitarize_economy_desc: "With the worst of the war behind us, resources must shift from guns to bread, rebuilding civilian infrastructure and everyday life."
ROJ_democratic_federation_of_syria: "Democratic Federation of Syria"
ROJ_democratic_federation_of_syria_desc: "Our long-term vision is a democratic federation where all peoples of Syria share power through autonomous regions and common institutions."
ROJ_rojava_or_death: "Rojava or Death"
ROJ_rojava_or_death_desc: "Our people know that surrender means annihilation. We will fight with total resolve, rallying the population under the cry of Rojava or death."
ROJ_call_for_international_support: "Call for International Support"
ROJ_call_for_international_support_desc: "We will appeal to the world's conscience, asking states, movements and individuals to support Rojava against aggression."
ROJ_union_with_iraqi_kurdistan: "Union with Iraqi Kurdistan"
ROJ_union_with_iraqi_kurdistan_desc: "Closer union with Iraqi Kurdistan could create a continuous Kurdish entity, pooling resources and strengthening our bargaining position."
ROJ_towards_northern_kurdistan: "Towards Northern Kurdistan"
ROJ_towards_northern_kurdistan_desc: "Our struggle does not end at artificial borders. We will prepare politically and militarily for the liberation of Northern Kurdistan."
ROJ_PJAK_rebellion_support: "Support the PJAK Rebellion"
ROJ_PJAK_rebellion_support_desc: "By aiding PJAK guerrillas in Iran, we strike at those who threaten us while deepening pan-Kurdish revolutionary cooperation."
ROJ_united_kurdistan: "United Kurdistan"
ROJ_united_kurdistan_desc: "From Rojava to the mountains of Iran and Turkey, we envision a united Kurdistan where all Kurds live free and equal."
ROJ_cooperative_economy: "Cooperative Economy"
ROJ_cooperative_economy_desc: "We will replace exploitative relations with a network of cooperatives, giving workers and peasants direct control over production."
ROJ_libertarian_tax_heaven: "Libertarian Tax Haven"
ROJ_libertarian_tax_heaven_desc: "Low taxes and light regulation can attract capital and innovation, though we must ensure they do not undermine our social model."
ROJ_healthcare_support_measures: "Healthcare Support Measures"
ROJ_healthcare_support_measures_desc: "Investing in clinics, hospitals and preventive care will strengthen our society and show the people the benefits of our administration."
ROJ_agricultural_cooperatives: "Agricultural Cooperatives"
ROJ_agricultural_cooperatives_desc: "Farmers will be encouraged to form cooperatives, sharing land, machinery and profits to boost productivity and resilience."
ROJ_industrial_cooperatives: "Industrial Cooperatives"
ROJ_industrial_cooperatives_desc: "Factories and workshops will be reorganized under worker ownership, ensuring that industry serves the needs of the many, not the few."
ROJ_worker_councils: "Workers' Councils"
ROJ_worker_councils_desc: "Democratically elected workers' councils will manage workplaces and coordinate with local communes in a truly bottom-up economy."
ROJ_oil_must_flow: "The Oil Must Flow"
ROJ_oil_must_flow_desc: "Our control of the eastern oil fields is vital. We will secure production and export to fund reconstruction and defence."
ROJ_self_sufficient_military_production: "Self-Sufficient Military Production"
ROJ_self_sufficient_military_production_desc: "Rojava must no longer depend on foreign arms. We will develop domestic workshops and industry to equip our fighters ourselves."
