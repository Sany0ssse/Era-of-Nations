 GENERIC_good_petroruble_infliation_idea: "Petroruble inflation"
 GENERIC_good_petroescudo_infliation_idea: "Petroescudo inflation"
 GENERIC_petroown_cons_idea: "Consequences of switching to the Own PetroCurrency"
 GENERIC_petroown_cons_idea_desc: "The transition to our own petro currency was a very risky move and had a very negative impact on our economy. Now we can only hope that other countries will also fight against the influence of.\nThis national spirit will be §Rremoved§! if the number of countries with the §YPetrodollar§! becomes less than §G80§!"
 GENERIC_petroruble_cons_idea: "Consequences of switching to the Petroruble"
 GENERIC_petroruble_cons_idea_desc: "The transition to a different currency in trade cannot go without consequences, and as long as a very small number of countries support this currency in oil trade, we will suffer from the consequences of our decision.\nThis national spirit will be §Rremoved§! if the number of countries with the §YPetroruble§! exceeds §G20§!"
 GENERIC_petroyuan_cons_idea: "Consequences of switching to the Petroyuan"
 GENERIC_petroyuan_cons_idea_desc: "The transition to a different currency in trade cannot go without consequences, and as long as a very small number of countries support this currency in oil trade, we will suffer from the consequences of our decision.\nThis national spirit will be §Rremoved§! if the number of countries with the §YPetroyuan§! exceeds §G20§!"
 GENERIC_petroescudo_cons_idea: "Consequences of switching to the Petroescudo"
 GENERIC_petroescudo_cons_idea_desc: "The transition to a different currency in trade cannot go without consequences, and as long as a very small number of countries support this currency in oil trade, we will suffer from the consequences of our decision.\nThis national spirit will be §Rremoved§! if the number of countries with the §YPetroescudo§! exceeds §G20§!"
