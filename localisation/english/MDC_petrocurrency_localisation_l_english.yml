 ###########PETRO CURRENCIES###########
 ###########Ideas###########
 GENERIC_usapetrodollar_idea: "§YPetrodollar§!"
 GENERIC_petrodollar_idea: "§YPetrodollar§!"
 GENERIC_ownpetro_idea: "§YNo More Petrodollar§!"
 GENERIC_petroruble_idea: "§YPetroruble§!"
 GENERIC_petroruble_idea_desc: "Since the early 2000s, Russia has been planning to overthrow the hegemony of the petrodollar, but it has been physically unable to do so, as the country no longer has the same influence it had during the Soviet era. However, it seems that the Russian leadership is now willing to take a risk."
 GENERIC_petrorublik_idea: "§YPetroruble§!"
 GENERIC_petrorublik_idea_desc: "Since the early 2000s, Russia has been planning to overthrow the hegemony of the petrodollar, but it has been physically unable to do so, as the country no longer has the same influence it had during the Soviet era. However, it seems that the Russian leadership is now willing to take a risk."
 GENERIC_petroyuanik_idea: "§YPetroyuan§!"
 GENERIC_petroyuanik_idea_desc: "China has long sought to break free from the dollar's dominance in oil trade, and now it seems that the Eastern Dragon is ready to break the back of the Petrodollar."
 GENERIC_petroyuan_idea: "§YPetroyuan§!"
 GENERIC_petroyuan_idea_desc: "China has long sought to break free from the dollar's dominance in oil trade, and now it seems that the Eastern Dragon is ready to break the back of the Petrodollar."
 GENERIC_petroescudik_idea: "§YPetroescudo§!"
 GENERIC_petroescudik_idea_desc: "Portugal did not particularly aspire to global leadership in the currency sector, but everything changed when Portugal became one of the largest geopolitical players on the world stage."
 GENERIC_petroescudo_idea: "§YPetroescudo§!"
 GENERIC_petroescudo_idea_desc: "Portugal did not particularly aspire to global leadership in the currency sector, but everything changed when Portugal became one of the largest geopolitical players on the world stage."
 GENERIC_notslow_petrodollar_infliation_idea: "Petrodollar inflation"
