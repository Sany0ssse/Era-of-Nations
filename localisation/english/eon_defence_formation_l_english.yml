l_english:
 eon_defence_formation_offer_available_tt:0 "The recipient can provide §Y5,480 personnel§! and an owned, controlled state for one national formation. We can provide all its equipment: §Y1,623 small arms, 150 command and control systems, 36 artillery pieces, 76 ATGM and 50 MANPADS§!. An existing template reserved for this formation must belong to this support programme. An unanswered expired offer permanently closes these offers to that partner; an unidentifiable old proposal closes this support channel."
 eon_defence_formation_offer_tt:0 "Offer equipment for §Yone national defence formation§! under the recipient's ownership. The recipient supplies §Y5,480 of its own personnel§!; we supply all five listed equipment types. They have §Y30 days§! to consent. No resources are committed before consent and a final check of both countries' eligibility, resources and the recipient's formation template and territory. Only one offer can await a reply at a time."
 eon_defence_formation.1.t:0 "Equipment for a national defence formation"
 eon_defence_formation.1.d:0 "[FROM.GetName] offers equipment for one of our national defence formations. We provide 5,480 personnel; the partner provides 1,623 small arms, 150 command and control systems, 36 artillery pieces, 76 ATGM and 50 MANPADS. The formation belongs to our country and remains ours after the war. We may accept or decline within 30 days. Acceptance authorizes formation orders if the final resource, territory and eligibility checks pass. This is support for our own armed forces, not the deployment of the partner's troops or a UN peacekeeping mission."
 eon_defence_formation.1.a:0 "Accept and provide our personnel"
 eon_defence_formation.1.b:0 "Decline or close the offer"
 eon_defence_formation_accept_tt:0 "Authorize §Y5,480 of our personnel§! and the partner's complete equipment package for one recipient-owned formation: six light infantry battalions, two artillery battalions, reconnaissance and engineers. Resources are checked again before formation orders. A failed final check closes the proposal without these orders. After consent, the offer can no longer be withdrawn or declined."
 eon_defence_formation_decline_tt:0 "Close this offer without committing personnel or equipment."
 eon_defence_formation_unmatched_tt:0 "This proposal is already answered or no longer open. Acknowledging it cannot order another formation."
 eon_defence_formation_withdraw_offer:0 "Withdraw defence formation support offer"
 eon_defence_formation_withdraw_offer_desc:0 "Withdraw the outstanding equipment offer for this partner's national formation before they consent. No resources have been committed under this proposal."
 eon_defence_formation_withdraw_offer_send_desc:0 "Withdraw this support offer? There is no fee or resource commitment. Another proposal remains unavailable until the partner closes the withdrawn offer or its reply period ends. If it expires unanswered, these offers to this partner become permanently unavailable."
 eon_defence_formation.3.t:0 "Formation support offer withdrawn"
 eon_defence_formation.3.d:0 "The provider withdrew the equipment offer before our consent. No personnel or equipment were committed under this proposal. We can close the original proposal when it appears."
 eon_defence_formation.4.t:0 "Formation support proposal expired"
 eon_defence_formation.4.d:0 "The proposal expired or its partner ceased to exist. No formation orders were issued. Further offers through this support programme to this partner are permanently unavailable; offers to other eligible countries remain available."
 eon_defence_formation.5.t:0 "Formation support offers unavailable"
 eon_defence_formation.5.d:0 "An incomplete formation proposal could not be matched safely to its partner. No formation orders were issued. This country's formation-support channel cannot be reopened; other diplomatic actions remain available."
 eon_defence_formation.6.t:0 "Formation support offer closed"
 eon_defence_formation.6.d:0 "The proposal was declined, withdrawn, or no longer met the conditions for formation. No personnel or equipment were committed under this proposal."
 eon_defence_formation.7.t:0 "National formation orders issued"
 eon_defence_formation.7.d:0 "The recipient consented and the final conditions were met. The national defence formation order has been issued using the recipient's personnel and the provider's equipment. The formation belongs to the recipient's armed forces and remains theirs after the war; no return of personnel or equipment is required. The existing influence rules apply to this support."
 eon_defence_formation.ack:0 "Understood"
