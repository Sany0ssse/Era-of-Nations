 BLR_batka_krut_TT: "We will §Rclean up§! §Ythe political sphere§!, leaving only a §Gfew parties loyal to us§! and we will §Gcreate a real patriotic party§! for §YLukashenko§!"
 belarus_politics.1.t: "The New Political Reality"
 belarus_politics.1.d: "Though the victory over the protesters was monumental, there is still a wide network of opposition organisations and parties just waiting for the hour to destroy our country. To prevent this, we need to completely cleanse the political field of unnecessary politicians and organisations, leaving only parties loyal to us, and we may also need our own political party to control the political sphere. Or we can leave everything as it is, but the enemy will still have the tools to influence us domestically."
 belarus_politics.1.a: "Shake them up!"
 belarus_politics.1.b: "Let's not piss people off any more."

 #######################NEW STUFF
 ##########COMMI TREE###########
 ##########Focuses###########
 BLR_Communism_start: "Return to Communism"
 BLR_single_party: "Single-Party State"
 BLR_single_party_desc: "To build communism we must ensure a stable political setup in the country and ensure that power remains in the hands of those who are capable of leading us to communism without straying from the course."
 BLR_atheism: "State Atheism"
 BLR_atheism_desc: "Moving towards communism, where there is no place for religious consciousness, we must cleanse the minds of our citizens of religious prejudices and superstitions."
 BLR_smersh: "SMERSH 2.0"
 BLR_smersh_desc: "«SMERSH» is short for «Smert' Shpionam!»(Death to Spies!) - a counterintelligence organization that existed during World War II. These organizations have proven their effectiveness in counterintelligence, we are obliged to restore them as a state body"
 BLR_propaganda: "Propaganda"
 BLR_propaganda_desc: "Propaganda is an effective way of influencing the population in order to convey our ideology and suppress opposition sentiments"
 BLR_ban_opposition: "Banning Opposition"
 BLR_ban_opposition_desc: "The opposition is sowing discord among the population and is holding back our efforts to build communism. Any opposition should be outlawed and counter-revolutionaries deported or executed."
 BLR_five_year_plan: "Five-Year Plan"
 BLR_collectivism: "Collectivism"
 BLR_collectivism_desc: "The collectivization of the economy has already worked well in the last century, why not return to this practice again?"
 BLR_red_army: "Red Army"
 BLR_red_army_desc: "The Red Army is famous throughout the world. Some people respect it, others terrify it. To preserve the memory and strengthen our ideology, we must restore the Red Army."
 BLR_education: "Soviet Education System"
 BLR_education_desc: "Soviet education focused on accessibility and quality of education, combined with instilling socialist ideals in students; it’s time to bring this system back."
 BLR_industrial_expansion: "Industrial Expansion"
 BLR_industrial_expansion_desc: "Expanding the construction sector will allow us to accelerate our economy and production more quickly and efficiently"
 BLR_agriculture_expansion: "Agriculture Expansion"
 BLR_agriculture_expansion_desc: "The expansion of agriculture will give a boost to our economy and will increase the production of agricultural goods to provide the people with all the necessary benefits."
 BLR_people_militia_commi: "People's Militia"
 BLR_people_militia_commi_desc: "People's militias are paramilitary brigades of soldiers who are not subject to priority conscription, consisting mainly of volunteers who have decided to stand up for the defense of the fatherland"
 BLR_comm_cyber_troops: "Rad Cyber Troops"
 BLR_comm_cyber_troops_desc: "In today's world, in the age of digital technologies, we need to organize a new department of the Red Army, connected with cyberspace, to protect our data and improve spy networks."
 BLR_red_shield: "Red Shield"
 BLR_red_shield_desc: "To protect our borders, we need to acquire the most terrifying deterrent weapon - Nuclear warheads. The installation of several missile systems and the revision of our doctrine should be the beginning of the creation of the Strategic Missile Forces Red Shield"
 BLR_trudarmia: "Trudarmia"
 BLR_trudarmia_desc: "Trudarmia - an organization controlled by the USSR Ministry of Internal Affairs, which existed in the USSR during the Second World War and consisted of prisoners. They were engaged in work in mines and factories, and were also mobilized as engineering troops"
 BLR_litbel_ultimatum: "Ultimatum to Lithuania"
 BLR_litbel_ultimatum_desc: "We have a lot in common with Lithuania, it's time to unite with them into one state, peacefully or not, we will achieve our goal"
 BLR_litbel_integration: "Project Lit-Bel"
 BLR_litbel_integration_desc: "Lithuania is a country with which we share a common history and a common border, we must unite with them into a single country and strengthen our status on the world stage."

 #########Ideas############
 BLR_commi_politics: "Politics of Communism"
 BLR_commi_politics_desc: "We must not stray from the course and confidently move towards communism, even if this creates some difficulties."
 BLR_commi_politics1: "Politics of Communism"
 BLR_commi_politics1_desc: "We must not stray from the course and confidently move towards communism, even if this creates some difficulties."
 BLR_boc_protest_idea: "Protest of the Belarusian Orthodox Church"
 BLR_boc_protest_idea_desc: "The protests of the Orthodox Church caused by the policy of state Atheism cause us some difficulties, we hope that they will end soon"
 BLR_propaganda_idea: "Propaganda"
 BLR_propaganda_idea_desc: "The propaganda of socialist values provides us with political stability and confidence that the future generation will definitely build communism."
 BLR_five_year_plan_idea: "Five-Year Plan"
 BLR_five_year_plan_idea_desc: "We will complete the five-year plan in four years!"
 BLR_red_army_idea: "Red Army"
 BLR_red_army_idea_desc: "The Red Army was created in 1918 and has been the main force of the Soviet Union ever since. Some respect them, others fear them"
 BLR_red_army_idea2: "Red Army"
 BLR_red_army_idea2_desc: "The Red Army was created in 1918 and has been the main force of the Soviet Union ever since. Some respect them, others fear them"
 BLR_red_army_idea3: "Red Army"
 BLR_red_army_idea3_desc: "The Red Army was created in 1918 and has been the main force of the Soviet Union ever since. Some respect them, others fear them"
 BLR_trudarmy_mobilize: "Trudarmia Has Been Mobilized"
 BLR_trudarmy_mobilize_desc: "The Labor Army is mobilized and ready to work at the front to defend the fatherland"
 BLR_lit_workers: "Lithuanian Workers"
 BLR_lit_workers_desc: "Acceptance of Lithuanian workers increases interethnic tolerance and brings us closer to friendship between Lithuanian and Belarusian populations"
 BLR_litbel_cp: "Lithuanian-Belarussian Communist Party"
 BLR_litbel_cp_desc: "The unification of the Lithuanian and Belarusian Communist Parties will allow us to better centralize power in the country"
 BLR_litbel_passport: "Lithuanian-Belarussian Passport"
 BLR_litbel_passport_desc: "New passports will eliminate many bureaucratic problems and strengthen the unity of the country"
 BLR_litbel_constitution: "Lithuanian-Belarussian Constitution"
 BLR_litbel_constitution_desc: "The new constitution will solve problems with state laws, bureaucracy, centralization and the state language"
 BLR_lit_protests: "Integration Issues"
 BLR_lit_protests_desc: "Lithuanians oppose unification of the state. Numerous rallies and sabotages are taking place in Lithuania"
 BLR_soviet_education: "Soviet Education"
 BLR_soviet_education_desc: "The Soviet education system makes education more accessible and of higher quality"
 BLR_rublit: "Rublitas"
 BLR_rublit_desc: "Rublitas - a single Lithuanian-Belarusian currency created by the unification of the Belarusian Ruble and the Lithuanian Litas"
 BLR_red_army_idea4: "Red Army"
 BLR_red_army_idea4_desc: "The Red Army was created in 1918 and has been the main force of the Soviet Union ever since. Some respect them, others fear them"

 #########Events############
 belarus_CLTB.1.t: "Belarus demands our annexation"
 belarus_CLTB.1.d: "The Communist Party of Belarus demands our annexation to create a single socialist state. And while unification with our eastern neighbor may strengthen our common position on the world stage and create a new force in Europe to be reckoned with, it may also become a threat to our sovereignty, not to mention national, cultural and ideological differences"
 belarus_CLTB.1.a: "Yeah, let's unite!"
 belarus_CLTB.1.b: "NEVER!"
 belarus_CLTB.2.t: "Lithuania refuses"
 belarus_CLTB.2.d: "Lithuania refused our demand to unite, justifying it by saying that it would undermine the country's sovereignty and that such a unification would create more problems, both in domestic and foreign policy."
 belarus_CLTB.2.a: "We wanted to resolve this peacefully"
 belarus_CLTB.3.t: "Lithuania agrees"
 belarus_CLTB.3.d: "The Lithuanian government has agreed to create a single state with us, all that remains is to solve a huge number of bureaucratic problems and resolve the issue of discontent among the Lithuanian population, which is clearly not happy with the decision of its leadership."
 belarus_CLTB.3.a: "Long live the brotherhood of nations!"
 belarus_CLTB.4.t: "Belarus and Lithuania are uniting into a single country"
 belarus_CLTB.4.d: "Lithuania accepts the proposal of the Belarusian Communists to create a single state within the socialist republic. It is not clear whether this was a coup d'etat planned in advance by the KGB of Belarus or whether the parties were able to reach an agreement, but one thing is clear - this will significantly change the balance of power in Europe, it is only unclear in whose favor..."
 belarus_CLTB.4.a: "What?"
 belarus_CLTB.5.t: "The Lithuanian people are resisting our annexation"
 belarus_CLTB.5.d: "As expected, the people of Lithuania reacted negatively to our annexation. The protesters actively advocate for the independence of the Lithuanian state and are engaged in sabotage. All this puts a lot of pressure on our economy, we have to increase funding for the police and spend additional costs on bureaucracy."
 belarus_CLTB.5.a: "We need to finish this faster"
 belarus_CLTB.6.t: "Integration complete"
 belarus_CLTB.6.d: "After numerous protests, co-operations and aggressive rallies, which were successfully suppressed with the support of the KGB of Belarus - separatist sentiments began to subside. We actively carried out a number of reforms aimed at comfortable coexistence with the Lithuanians, created a new currency, adjusted the constitution and issued citizens new passports. After a lot of work, we are finally ready to declare the creation of a single Lithuanian-Belarusian Socialist Republic"
 belarus_CLTB.6.a: "Finally, we are united"
 belarus_communism.1.t: "Protest of the Belarusian Orthodox Church"
 belarus_communism.1.d: "After the proclamation of state atheism and repressions against the Belarusian Orthodox Church, believers began to come out en masse to rallies in defense of churches and the preservation of religion. It feels like this is here to stay"
 belarus_communism.1.a: "They'll get over it"

 #########Decisions############
 BLR_litbel_integration_category_desc: "After the unification of the territory of Lithuania to our state, many problems arose, such as: discontent of the Lithuanian population, bureaucratic crisis, disunited population, etc. In order to complete the integration project and proclaim the creation of the Lithuanian-Belarusian Socialist Republic, we are obliged to solve urgent problems, suppress discontent in the territory of Lithuania and eventually come to the creation of a strong, allied socialist state. \n\n\n\n\n\n\n\n   £GFX_decision_litbel_integration \n\n\n\n\n\n\n Full integration will require reducing resistance and increasing the subordination of the Lithuanian population, as well as completing all important reforms. "
 BLR_litbel_integration_category: "Integration of Lithuania"
 BLR_lithaunian_workers: "Adopt Lithuanian Workers"
 BLR_lithaunian_workers_desc: "Lithuanian workers are discriminated against in Belarusian enterprises. We need to increase interethnic tolerance and prolong job opportunities for Lithuanian workers"
 BLR_unite_with_lcp: "Unite with the Lithuanian CP"
 BLR_unite_with_lcp_desc: "Merging with the Lithuanian Communist Party will allow us to centralize power more strongly and work more effectively to unify the state."
 BLR_new_pasport: "Lithuanian-Belarusian Passport"
 BLR_new_pasport_desc: "Lithuanian citizens continue to use Lithuanian passports, which creates major bureaucratic problems on the territory of Belarus, just as Belarusians experience problems when presenting Belarusian passports on the territory of the newly annexed territories of Lithuania. It is necessary to create new, unified passports in order to eliminate this problem."
 BLR_new_constitution: "Lithuanian-Belarussian Constitution"
 BLR_new_constitution_desc: "The differences between Belarusian and Lithuanian laws and statutes have created problems after unification. We need to draw up a new constitution for a single state that would suit both us and the Lithuanians."
 BLR_unite_propaganda: "Propaganda of Unity"
 BLR_unite_propaganda_desc: "We must promote unity with the Lithuanian people in order to reduce the level of protests and calm the population of the Lithuanian lands."
 BLR_dispersal_demonstrators: "Dispersal of Demonstrators"
 BLR_dispersal_demonstrators_desc: "Lithuanian demonstrations are starting to gain radical momentum, it's time to take action and send the guards or even the KGB to suppress them"
 BLR_proclaim_litbel: "Proclaim §RLithuanian-Belarusian Socialistic Republic§!"
 BLR_proclaim_litbel_desc: "We have completed all the stages for the unification of the state, the protests have been suppressed, new passports and Rublit are already in circulation among citizens, which means we are ready to proclaim the creation of the Lithuanian-Belarusian Socialist Republic!"
 litbel_decision_tt: "All §Ysteps for integration§! must be completed"
 BLR_united_currency: "United Currency"
 BLR_united_currency_desc: "The Belarusian ruble and the Lithuanian Litas should be merged to create a new, single currency that would be used throughout the country"
 BLR_army_reorganization: "Reorganization of the Army"
 BLR_army_reorganization_desc: "The annexation of Lithuania created problems in the command, in the officer corps and mainly in the organization of our armed forces. It is time to correct this and completely reorganize our army"
 BLR_trudarmia_category: "Trudarmia"
 BLR_trudarmia_category_desc: "\n\n£GFX_decision_trudarmia\n\n\n\n\n The Labor Army is a team of prisoners controlled by the Ministry of Internal Affairs. They perform various types of work, from working in factories and collective farms to extracting resources from mines. In wartime, they can be called up to participate at the front as engineering troops."
 BLR_mobilize_trudarmy: "Mobilize Trudarmy"
 BLR_demobilize_trudarmy: "Demobilize Trudarmy"
 BLR_factory_work: "Labor Work in Factories"
 BLR_kolhoz_work: "Labor Work in Collective farm"
 BLR_steel_mining: "Send to The Steel Mines"
 BLR_tungsten_mining: "Send to The Tungsten Mines"
 BLR_aluminium_mining: "Send to The Aluminium Mines"
 BLR_oil_mining: "Send to The Oil Deposits"

