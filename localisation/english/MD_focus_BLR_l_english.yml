 #Religion
 uniate_church: "Uniate Church"
 uniate_church_desc: "Union of Orthodox and Catholic. the church on the basis of the union with the primacy of the Catholic, but with the preservation of the church. parts of Orthodox rites. Back in 1439, the Catholic union was concluded at the cathedral in Florence. and the Orthodox churches, but it was soon dissolved. Since the end of the 15th century . The idea of the union was again put forward by Poland. feudal lords, because it means. part of the population of Poland and Lithuania was Orthodox, and with the help of the church union they assumed to gradually pollute Ukrainians and Belarusians. Part of the Orthodox feudal lords and the highest clergy in the 16th century supported the idea of union, seeking to equal the rights of Catholics. In 1595, Bishops Hypatius Potei of Vladimir-Volyn and Kirill Terletsky of Lutsk appealed to the pope with a request for union. At the council in Brest, 6 bishops proclaimed the Union of Brest in 1596, despite the protest of most of the clergy, feudal lords and citizens. The king supported the union and declared the Orthodox Church outlawed, and transferred its property to the U.C. In the beginning. In the 17th century, the Order of Basilians was created, acting in the interests of the union in cooperation with the Jesuits. Gradually, the u. ts. and in the ceremonial relation is getting closer and closer to the Catholic, the vestments, the structure of temples are changing, Catholics are being introduced. Orthodox holidays are also canceled. All these changes were fixed at the cathedral in Zamostye in 1720. In Transcarpathia, the union was proclaimed at the Uzhgorod Cathedral in 1649, but it was finally established only at the end of the 18th century. The struggle with the union for the religion. and nats. freedoms in Ukraine and Belarus in the 16th and 17th centuries were headed by so-called fraternities."


 BLR_shuskevich: "On Top Again"
 BLR_shuskevich_desc: "in 1994 Stanislav Shushkevich ceased to be the head of state by the decision of the parliament. A vote of no confidence was expressed, and he was removed from office. Obviously, our first attempts to hold on to power were not ideal. But as a result of the elections, the bloodthirsty and authoritarian regime of Lukashenko won. The people are in despair from the decision taken. Now we are back on top, and we need to not lose the people's trust again"
 BLR_clean_paper: "From a Fresh Start"
 BLR_clean_paper_desc: "Shushkevich addressed the people for the first time in many years. It is no longer the nineties. We are back at the helm and are ready to lead our country into the new era of the 21st century. We will not make the same mistakes and will win the love of the people."
 BLR_contitutional_reform: "New Constitutional Reform"
 BLR_contitutional_reform_desc: "During Lukashenko's years in power, our constitution has been supplemented with many authoritarian and unnecessary additions. But it is still worth recognizing that not all of the innovations were so bad. Perhaps we should create something in between the 1994 constitution and the constitution of Lukashenko's Belarus, which would also be prudent."
 BLR_cooperate_opposition: "Appease the Democratic Opposition"
 BLR_cooperate_opposition_desc: "We need to get the message across to the democratic opposition that we are not the Lukashenko administration. Authoritarian Belarus is a thing of the past, and it will continue to be so under our rule."
 BLR_supreme_parliament: "Restore the Supremacy of Parliament"
 BLR_supreme_parliament_desc: "Many analysts believed that the return of the Shushkevich administration would silence parliament. But they forget that the degradation of our parliament was made possible by our resignation, and we intend to restore the fundamental pillar of democracy!"
 BLR_lukashenko_court: "Lukashenko Court"
 BLR_lukashenko_court_desc: "Our old man Lukashenko obviously could not even imagine that the Shushkevich administration would decide his future. However, the people of Belarus also did not think what Lukashenko would do to them when he first won the elections. We need to decide his fate. Probably, we should give preference not to emotions, but to reason"
 BLR_sway_kgb: "Sway the KGB"
 BLR_sway_kgb_desc: "The KGB is a powerful institution, and their loyalty is an important part of the stability of our administration. They have new leaders, and they must accept it."
 BLR_integrate_loyalists: "Integrate Lukashenko's Loyalists"
 BLR_integrate_loyalists_desc: "Alexander Lukashenko left behind a huge number of people from his administration in our political structure. We need to show them that they can feel good about themselves under the Shushkevich administration to win their trust."
 BLR_absolute_synergy: "Absolute Power of Compromise"
 BLR_absolute_synergy_desc: "The Chinese government is increasing investments in our country and is ready to build new factories"
 BLR_way_to_neutrality: "The Way to Neutrality"
 BLR_way_to_neutrality_desc: " the previous administration was famous for its 'neutrality' in the political space. In fact, with each passing year we became more and more distant from the West, falling into the sphere of influence exclusively of Eastern countries. But this cannot continue. Many do not trust us, and we must restore the balance of power"
 BLR_european_summit: "Europe-Belarus Summit"
 BLR_european_summit_desc: "Many countries of the Near West have responded very positively to Stanislav Shushkevich's triumph in Belarus. 'Europe's last dictatorship' has embraced democratic values, and our friendly dialogue with Europe can be highlighted at the upcoming summit."
 BLR_big_brother_russia: "Russian-Belarusian Talks"
 BLR_big_brother_russia_desc: "It is foolish to cut ties with our powerful neighbor to the East. Belarus under our leadership does not seek to discredit our long-standing cultural ties. Although modern Russia is different from the one with whom Stanislav Shushkevich signed the Belovezh Accords, we believe that we will be able to maintain dialogue in the future."
 BLR_neutrality_memorandum: "Neutrality Memorandum"
 BLR_neutrality_memorandum_desc: "Given the recent events, we have demonstrated to the whole world that Belarus is ready to cooperate with both the East and the West. However, Belarus is a neutral country, and neutrality implies taking a neutral position in the modern Cold War. This, in turn, means that Belarus should not join any of the leading political associations. We should adhere to this principle. Even if someone takes offense."
 BLR_between_weast_east: "Between East and West"
 BLR_between_weast_east_desc: "Our neutral state is located between the West and the East. These are two huge political forces influencing our country. Each wants to entice us to their side, but it is important for them to understand that if they want to continue cooperation with us, then they should respect our choice in the political space."
 BLR_end_of_lukashenlonomics: "The End of Lukashenkonomics"
 BLR_end_of_lukashenlonomics_desc: "Lukashenko's rule has shown that his reforms have not led to real economic growth in our country. These will be serious changes, but we still need to move away from the current course and develop our own program."
 BLR_overhaul_medicine: "Total Overhaul of the Healthcare System"
 BLR_overhaul_medicine_desc: "The state of medicine in our country is catastrophic. We must not leave it like this. We must create not only favorable conditions for private healthcare, but also maintain a high level of state healthcare."
 BLR_welfare_reform: "Welfare Fund Reform"
 BLR_welfare_reform_desc: "We need to reform the social fund system in such a way as to reduce the burden on the budget. We give preference to the optimization of social payments and the rationalization of social programs"
 BLR_privatise_shit: "Privatization of Excess Property"
 BLR_privatise_shit_desc: "Privatization of excess property is necessary to reduce the costs of maintaining unused property, increase budget revenues through sales and stimulate economic activity. This is a fairly common process in the post-Soviet countries."
 BLR_changes_to_market: "Reorganize Market Regulation Mechanisms"
 BLR_changes_to_market_desc: "A good anti-monopoly agency, conditions of fair competition - this is our course. The course of a country in which business is not afraid for its existence."
 BLR_the_third_way: "Belarussian Third Way"
 BLR_the_third_way_desc: "Extremes in economic issues are inappropriate. Different ideologies limit certain necessary reforms, but Belarus under our leadership is a centrist state that is ready to adapt all good proposals from all sides."
 BLR_1994_avanged: "The 1994 Avanged!"
 BLR_1994_avanged_desc: "The 1994 Avanged is a triumph! We were able to prove that 1994 was a mistake that did not fully reveal our potential. Despite the difficulties, we were able to complete all our major political decisions. Belarusian society finally got a taste of stability and a prosperous economy!"
