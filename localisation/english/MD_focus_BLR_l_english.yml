 ##########RPTJ TREE##########
 #########Focuses#############
 BLR_rptj_start: "Republican and Justful"
 BLR_rptj_start_desc: "Republican Party of Labour and Justice - left, social democratic party of Belarus. Were we able to show that we can take power? Yes. But to hold it and lead our country to prosperity under the leadership of reasonable socialism? Well, we should prove it, and we intend to do it."
 BLR_labour: "Labour, Responsibility, Justice"
 BLR_labour_desc: "Our slogan is 'Labor, responsibility, justice'. And these are not empty words. Labor - work - the best social protection, justice - labor market without barriers, responsibility - the safety of aging. These principles will lead our Belarus, as long as we rule."
 BLR_ussr_legacy: "Legacy of the USSR"
 BLR_ussr_legacy_desc: "Soviet Belarus is a part of our history. And we should be proud of this history, because it was in the Soviet era that our land flourished. Perhaps we should take the example of past experiences in the development of the country, which were known before."
 BLR_union_with_russian_socialist_patriots: "Allience with Russian Patriots"
 BLR_union_with_russian_socialist_patriots_desc: "Of course, we consider Russians our brothers. We also want a better future for them, so we will not hide our sympathies for individual socialist parties of this vast country"
 BLR_ukrainian_socialists: "Cooperation with Ukrainian Socialists"
 BLR_ukrainian_socialists_desc: "Our southern neighbors - comrades Ukrainians also have reasonable political forces that are interested in the real prosperity of the common people of their country."
 BLR_real_free_medicine: "Real Free Healthcare"
 BLR_real_free_medicine_desc: "For members of our party it remains a mystery why the basis of welfare can be paid. The state must provide free healthcare and maintain it at a decent level"
 BLR_destroy_the_national_bank: "Crusade Against the National Bank"
 BLR_destroy_the_national_bank_desc: "This capitalist structure has been doing its dirty work in Belarus for a long time. We intend to disband the national bank"
 BLR_peoples_redistribution: "People's Redistribution"
 BLR_peoples_redistribution_desc: "We intend to redistribute funds and money in our economy."
 BLR_labour_as_a_best_gurantee: "Labour is the Best Social Gurantee"
 BLR_labour_as_a_best_gurantee_desc: "Economic policy should be aimed at full employment. Our goal is that everyone who has the opportunity to work has the opportunity to do so. A guaranteed income gives people greater freedom. Unemployment is a great waste of human resources and a social failure."
 BLR_state_property_domination: "Domination of the State Property"
 BLR_state_property_domination_desc: "No matter what anyone says, but encouraging domestic industry and products is an exclusively patriotic measure, capable of leading our great industry into a golden age."
 BLR_national_patriotic_union: "The National Patriotic Union of the Belarus"
 BLR_national_patriotic_union_desc: "Once Russian socialists united to create a single union in which they promoted their values and ideas. We will borrow this experience from them. The goal of the union is patriotism, statehood and social justice!"
 BLR_support_the_kgb: "Strengthen the KGB"
 BLR_support_the_kgb_desc: "Strengthening the Security Committee of the Republic of Belarus is important for maintaining our territorial integrity. No one will dare to attack us if we can fight back"
 BLR_parliamentary_supervision: "Parliamentary Supervision"
 BLR_parliamentary_supervision_desc: "Yes, we want to appear to the international community as a social democratic party, but still additional supervision of affairs in parliament can help us in our further reforms..."
 BLR_congress_of_left_patriots: "Congress of Left Patriots"
 BLR_congress_of_left_patriots_desc: "Now we have enough connections with left patriots from the post-Soviet space to gather them all and discuss our plans for cooperation."
 BLR_social_justice_economy: "Social Justice Economy"
 BLR_social_justice_economy_desc: " Social justice economy - Anyone who becomes unemployed must be motivated from the first day to quickly find a new job. In turn, the modern labor market is a market with decent working conditions and wages, a market capable of adapting to technological changes. And of course, health. It is the most important element of quality of life."
 BLR_destroy_market_opposition: "Destroy the Market Opposition"
 BLR_destroy_market_opposition_desc: "'Do you want dozens of these Saakashvilis running around our squares?'"
 BLR_Union_of_peoples_states_idea: "Union of People's Labour Republics"
 BLR_Union_of_peoples_states_idea_desc: "The hour has struck! The workers of our countries can proudly declare the creation of a full-fledged triple union between each other! Glory to our Republics!"
 BLR_peoples_patriotic_democracy: "Patriotic Democracy"
 BLR_peoples_patriotic_democracy_desc: "Many Western figures are not sure that Belarus has completely moved away from authoritarianism during our rule, but still, we do not think so. We have made our contribution to the promotion of democracy in our country. Patriotism can coexist with democracy, and we have confirmed this."
 BLR_labourist_state: "The Labour Republic"
 BLR_labourist_state_desc: "We have managed to create a truly just patriotic state, in which everyone can say that labor and socialism have brought them an increase in the quality of life!"

