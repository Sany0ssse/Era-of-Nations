 BLR_new_economic_of_belarus: "New Economic of Belarus"
 BLR_new_economic_of_belarus_desc: "Our economy is not efficient enough, we need radical reforms to build a stable economy like in Europe. The first step to European integration is economic reforms in line with the European style."
