 BLR_vkl_guard: "Ruthenian Guard of Grand Duke"
 BLR_vkl_guard_desc: "The Royal Guard of our Grand Duke is composed of most loyal Ruthenians who dedicate themselves to protecting Grand Duchy of Lithuania."
 BLR_vkl_guard_two: "Ruthenian Guard of Grand Duke"
 BLR_vkl_guard_two_desc: "The Royal Guard of our Grand Duke is composed of most loyal Ruthenians who dedicate themselves to protecting Grand Duchy of Lithuania."
 BLR_young_goi_kurlyandia: "Legacy of Courland"
 BLR_young_goi_kurlyandia_desc: "We must restore our rule over Courland and Latvian territory in it's fullness."
 BLR_young_goi_polish: "Polish-Lithuanian Union"
