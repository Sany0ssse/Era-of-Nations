 #Inner Policy
 BLR_presidential_election_of_2001: "The Political Sphere"
 BLR_presidential_election_of_2001_desc: "It is time to decide who will lead our country in the new millennium"

 #Union state
 BLR_union_become_one: "Union Will Become One"

 #Liberals
 BLR_united_opposition: "United Opposition"
 BLR_united_opposition_desc: "The Liberal Opposition has accomplished its original goal of sending our country's former authoritarian order to the margins of history. But this is not the end. It is only the beginning. The anti-state elements have settled too strongly in our homeland. The struggle continues. Prudence is on our side!"
 BLR_eradicate_corruption: "Eradicate Corruption"
 BLR_eradicate_corruption_desc: "The previous authoritarian government made corruption part of our country's system. For a long time, the people have tolerated it, and the opportunity to begin the long fight against corruption opens today."
 BLR_united_againt_totalitarism: "United Againt Totalitarism"
 BLR_united_againt_totalitarism_desc: "We have had enough of being unhappy keepers of the title of “Europe's Last Dictatorship”. Belarus is a democratic country with democratic institutions of power. We will fight together against any manifestation of totalitarian tendencies"
 BLR_dismantle_unloyal_administrations: "Dismantle Unloyal Administrations"
 BLR_dismantle_unloyal_administrations_desc: "Unfortunately, among the people in our country, not everyone is ready to accept the path of progress and prosperity. They have made their choice and they will regret it."
 BLR_free_political_prisoners: "Free Political Prisoners"
 BLR_free_political_prisoners_desc: "many journalists, protesters and politicians have been subjected to political repression by the past regime and have ended up in prison. Times are changing, and now we have enough political power to give them their freedom."
 BLR_bring_siloviks_to_justice: "Bring Siloviks to Justice"
 BLR_bring_siloviks_to_justice_desc: "We have all seen how the loyal dogs of the past inhumane regime terrorized peaceful protesters on the streets of our cities. It was unjust, and we need to show them where they belong."
 BLR_constitutional_referendum: "Constitutional Referendum"
 BLR_constitutional_referendum_desc: "We must give our people a choice. A choice of how Belarus should express itself in the political space. Once the authoritarian regime made this choice for us, and it did not bring anything good. But now democratic forces are in power, and the idea of European integration is spreading among citizens. Our administration supports this, but it is worth determining how Belarus can achieve this, given our large neighbor."
 BLR_oko_za_oko: "Eye for Eye"
 BLR_oko_za_oko_desc: "The people have decided that Belarus has had enough! The East sponsored the past Belarusian authoritarian regime, which suppressed and humiliated our citizens. If we want to throw off the shackles of foreign influence, it must be done immediately and decisively! This will be our revenge."
 BLR_destroy_eastern_influence: "Destroy Eastern Influence"
 BLR_destroy_eastern_influence_desc: "It's time to put an end to the Eastern invaders who keep interfering in our internal affairs. Belarus is an independent state that strives for European integration. Eastern influence makes it difficult to achieve this goal."
 BLR_democratise_siloviks: "Democratise Siloviks"
 BLR_democratise_siloviks_desc: "Previously, the siloviks were loyal to the Belarusian dictatorship. Now they will serve our democratic Belarus."
 BLR_strong_president: "Strong President"
 BLR_strong_president_desc: "We need to create an image of a strong freedom-loving leader. Perhaps someone will accuse us of sympathy for authoritarianism, but it is worth understanding that this is for the benefit of the security of democracy of the nation of the Republic of Belarus.'My allegiance is to the Republic, to democracy!'"
 BLR_radical_economic_reforms: "Radical Economic Reforms"
 BLR_radical_economic_reforms_desc: "In order for us to become part of the European world, we must match the best economic systems of the European countries. It is time for our economic growth. Without serious reform we cannot do here"
 BLR_ditch_russia: "Move Away from Russia"
 BLR_ditch_russia_desc: "'Farewell, unwashed Russia'"
 BLR_european_dominance: "European Dominance"
 BLR_european_dominance_desc: "We can be sure that pro-European sentiments now prevail in our society. Europe, here we are!"
 BLR_optimise_bureaucracy: "Optimise Bureaucracy"
 BLR_optimise_bureaucracy_desc: "less bureaucracy means less expenses that burden our budget!"
 BLR_new_patroitism: "New Patriotism"
 BLR_new_patroitism_desc: "liberal-minded citizens associate patriotism with the past authoritarian regime that promoted it. But can crooks and thieves love their homeland? It is important to promote true patriotism, which is based primarily on the defense of our rights and democracy. "
 BLR_belarusian_consensus: "Belarussian Consensus"
 BLR_belarusian_consensus_desc: "We wish the best for our country, but the reality is that it is suicidal to anger Russia and to rush headlong into Western organizations. We are in favor of reforms, but reforms should take into account our geopolitical position. Therefore, it is important not to break relations with Russia and the Russian diaspora in Belarus. Our path of European integration will probably be achieved through multiple compromises."
 BLR_unite_the_belarus: "Unite the Belarus"
 BLR_unite_the_belarus_desc: "The people of our country are divided. Some are pro-Russian, some are more pro-Western. It is no secret that we see Belarus in the Western world. We must gently unite Belarus under this idea."
 BLR_depolitisize_siloviks: "Depolitisize Siloviks"
 BLR_depolitisize_siloviks_desc: "The security forces used to defend the previous regime, but we need to make sure that their first priority is to maintain law and order. In addition, we will not allow pluralism of opinions to be hindered in our country. Pro-Russian citizens have the right to speak out without fear of being thrown behind bars."
 BLR_parliamentary_dominance: "Parliamentary Dominance"
 BLR_parliamentary_dominance_desc: "The strength of our democracy is in our parliament, which is experiencing a golden age under liberal rule."
 BLR_a_call_to_cremlin: "Call to Kremlin"
 BLR_a_call_to_cremlin_desc: "We want European integration. But we also want nothing to happen to Belarus on February 24.  We will discuss with Russia the conditions under which it will allow us to fully integrate into Western institutions. Analysts say that Belarus will pay a high price, but we have no other options."
 BLR_moderate_approach_to_economy: "Moderate Approach to Economy"
 BLR_moderate_approach_to_economy_desc: "No radicalism. Only balanced and cautious economic reforms, so as not to plunge our country into crisis."
 BLR_slow_integration: "Slow Integration"
 BLR_slow_integration_desc: "We have made compromises that open the way for us to slowly but surely integrate with the West. We have sacrificed a lot and must show that it was not in vain."
 BLR_red_white_red: "Belyj Chervonyj Belyj"
 BLR_red_white_red_desc: "White-red-white flag - a symbol of free, strong and democratic Belarus. During our time in power, we were able to prove that we are worthy of this flag!"

