 belarus_liberals.1.t: "Lukashist Opposition"
 belarus_liberals.1.desc: "We have finally wrested power from the clutches of the dictator, but the supporters of Lukashism still remain in the country and they are clearly not happy with the departure of 'Batka'. The supporters of Lukashism reject European integration and want Belarus to remain in the hands of conservative authoritarianism"
 belarus_liberals.1.a: "We need to sort this out quickly"
 belarus_liberals.2.t: "Constitutional Referendum"
 belarus_liberals.2.desc: "The people of Belarus have made their choice in favor of European integration. However, after the Lukashists' protests, we seriously thought about whether we should distance ourselves from Russia and adopt an Anti-Russian policy or maintain friendly relations."
 belarus_liberals.2.a: "I, we, Europe"
 belarus_liberals.2.b: "Russian-Belarusian Brotherhood"
 belarus_liberals.3.t: "Betrayal at the Borders"
 belarus_liberals.3.desc: "With the beginning of the new regime in Minsk, Belarus has become increasingly distant from Moscow, anti-Russian policy, Russophobia and the influence of the collective West have forced our former brother to commit treason. We will not simply sit back and wait for NATO to expand to our borders again, we must launch a preemptive strike and eliminate the threat on the border"
 belarus_liberals.3.a: "Minsk in 3 days"
 belarus_liberals.3.b: "Prepare for Special Military Operation"
 belarus_liberals.4.t: "Belarus Wants to Discuss EU Accession"
 belarus_liberals.4.desc: "Belarus wants to discuss with us under what conditions we will not be against Belarus joining the European Union, this is of course very nice of them. We have repeatedly stated that the European Union does not pose a threat to us, unlike NATO, and therefore any such issues can only be discussed in the context of a neutral status for Belarus"
 belarus_liberals.4.a: "Neutral status and guarantees of non-aggression"
 belarus_liberals.4.b: "We are ready to personally defend the neutral status of Belarus"
 belarus_liberals.4.c: "Demilitarized zone between our borders"

