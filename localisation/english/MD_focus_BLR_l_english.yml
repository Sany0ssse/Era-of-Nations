 BLR_euroitegration: "Eurointegration"
 BLR_euroitegration_desc: " \n\n\n\n£GFX_decisions_category_blr_eurointegration_category\n\n\n\n\n\n\n After many years of dictatorship, Belarus has finally found a democratic and civilized government, now our course is to move away from old ideals and align ourselves with the civilized world. European integration is the adoption of the values and standards of European countries, integration into the Western collective and further entry into the European Union, and then into NATO. However, our neighbor, who for a long time controlled our policy and denied the separateness of the Belarusian people, is unlikely to be happy with our new course, and therefore we must be more careful with statements. Everything has its time, Belarus will definitely become part of the European Family \n\n We will be able to join NATO and the European Union after completing a certain focus, and also scored §G100§! §3Eurointegration§! and §3NATO-Integration§!. Each of our decisions has consequences and together with Eurointegration we will increase the §Oescalation§!. If the escalation is more than §R100§!, it will lead to a war with [SOV.GetNameWithFlag] \n \n§3Current Eurointegration§!: §G[?blr_euroitegration]§! \n§3Current NATO-Integration§!: §G[?blr_natoitegration]§!\n§OCurrent Escalation§!: §R[?blr_escalation]§!"
