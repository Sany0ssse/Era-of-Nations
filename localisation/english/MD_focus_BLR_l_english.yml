 ##########Events##########
 belarus_monarch.1.t: "Identity Conflict"
 belarus_monarch.1.d: "Now we need to decide what is the essence of our identity. Will we strive for the Lithuanian past and adapt the Lithuanian language to our population, or will we establish our foothold on the Belarusian heritage?"
 belarus_monarch.1.a: "We are true Lithuanians!"
 belarus_monarch.1.b: "We must remain Belarusian."
 belarus_monarch.2.t: "Religious Dilemma"
 belarus_monarch.2.d: "The Council on Religious Affairs was convened in our government to decide what to do with our state religious policy. It is time for us to abandon the Muscovite Church and begin the reformation of our religious life."
 belarus_monarch.2.a: "Uniate Church"
 belarus_monarch.2.b: "Romuva is the way to go!"
 belarus_monarch.3.t: "Regency Gathering"
 belarus_monarch.3.d: "Today in Minsk, the Sejm convened to elect a new Monarch for Belarus. There are two candidates on the agenda. The first is the heir to the Habsburg dynasty, Ferdinand Zvonimir I. The second is a member of the Urach dynasty, the heir to the Lithuanian throne, Inigo. Who will we choose for the Grand Duchy?"
 belarus_monarch.3.a: "Habsbrurgs shall rule!"
 belarus_monarch.3.b: "Urach dynasty is the closest to us!"
 belarus_monarch.5.t: "Uprising of the Belarusian Nationalists!"
 belarus_monarch.5.d: "Belarusian nationalists have started a riot in our region! It seems their government used this as an excuse to launch a military operation against us!"
 belarus_monarch.5.a: "They'll regret it."
 belarus_monarch.6.t: "Uprising of the Chernigov Cossacks"
 belarus_monarch.6.d: "The so-called Chernigov Cossacks, sponsored by the Belarusian government, started an uprising on our territory, apparently it was an excuse to invade our lands and start a war with us!"
 belarus_monarch.6.a: "They'll regret it."
 belarus_monarch.7.t: "Belarusian Resistance"
 belarus_monarch.7.d: "The so-called Belarusian resistance has begun to operate on our territory, they are actively conducting guerrilla actions and sabotaging everything possible in the region."
 belarus_monarch.7.a: "They'll regret it."
 belarus_monarch.8.t: "Chernigov Cossacks"
 belarus_monarch.8.d: "The so-called Chernigov Cossacks began to operate on our territory, they went into active guerrilla activity and sabotage everything that is possible in the region."
 belarus_monarch.8.a: "They'll regret it."
