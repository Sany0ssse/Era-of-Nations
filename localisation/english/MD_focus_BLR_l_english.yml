 ##########NAZBOLS TREE##########
 ##########Focuses##########
 BLR_soviet_system: "National Bolshevik Belarus"
 BLR_soviet_system_desc: "The National Bolsheviks have seized power in the country and are ready to begin their first economic reforms. One of them will be a return to the Soviet economic system, in view of the unsuccessful experience of the previous ruler."
 BLR_nazbol_new_church: "New Religion"
 BLR_nazbol_new_church_desc: "It's time to create a new religion that meets the interests of our state!."
 BLR_military_nazbol: "Investments in The Military Industry"
 BLR_military_nazbol_desc: "Our military industry has still not recovered to the level of Soviet times, we must fix this"
 BLR_nazbol_propaganda: "Propaganda Machine"
 BLR_nazbol_propaganda_desc: "Our propaganda must be red and radical, as our proletarian hatred towards the west must clear the minds of Russians!"
 BLR_nazbol_narodnaya_chk: "People's Emergency Commission"
 BLR_nazbol_narodnaya_chk_desc: "We must create a special comission for people's emergency situations and prepare our people for any scenario."
 BLR_nazbol_anti_wse: "Stifle the Opposition"
 BLR_nazbol_anti_wse_desc: "Oppositionists are rats! And we will stomp them out from Belarus with our rightly proletarian hatred."
 BLR_nazbol_work_fronts: "Labor Fronts"
 BLR_nazbol_work_fronts_desc: "Labour, Society and Military are one and whole! Labour is a front of our our holy war and we will be good at it."
 BLR_nazbol_cyber: "Cyber Warfare"
 BLR_nazbol_cyber_desc: "Cyber-space is the opportunity of masses to destroy western capitalism by using it's own tools."
 BLR_nazbol_interbrigades: "Interbrigades"
 BLR_nazbol_interbrigades_desc: "We are nationalists - but we are international nationalists and we welcome all radicals who want to fight for their race and class in our ranks."
 BLR_nazbol_inqusition: "Red Orthodox Inquisition"
 BLR_nazbol_inqusition_desc: "Christianity, Stalin and Communism are always together. Stalin was the one, holy and righteous proletarian russian Tsar who restored orthodoxy in Russia and gifted our people so many martyrs. And as the red bible teaches - Christ was a communist all along!"
 BLR_nazbol_minsk: "Minsk - Fortress of the Revolution"
 BLR_nazbol_minsk_desc: "Minsk is a symbol of our new Era - a city of red, white and black. Avant-guarde centaer of our revolution. And we must show this in practice."
 BLR_nazbol_faerwall: "Revolutionary Firewall"
 BLR_nazbol_faerwall_desc: "No more western, corrupting propaganda shall enter the minds of our pure and innocent Russian people."
 BLR_nazbol_black_guard: "Black Guard"
 BLR_nazbol_black_guard_desc: "We must take the best of the best oand create a new guardian regiment for our state."
 BLR_nazbol_revoult_spirit: "Revolutionary Spirit"
 BLR_nazbol_revoult_spirit_desc: "The spirit of revolution is our, true, russian idea of chaos unleashing itself to was away everything that is in our way."
 BLR_nazbol_anti_west: "Anti-Western Doctrine"
 BLR_nazbol_anti_west_desc: "West is the anti-thesis of life! The land of sunset, where the life ends. West must be forgotten and buried."
 BLR_revoult_sobor: "Attract Radicals"
 BLR_revoult_sobor_desc: "Radicals are the most pure in their thoughts and deeds - we must bring everyone passionate enough and assemble into grand army of revolution."
 BLR_nazbol_flame: "The Flame of Revolution"
 BLR_nazbol_flame_desc: "We are coming and nothing can extinguish what we will put to flames."

