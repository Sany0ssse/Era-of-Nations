 ##########ECONOMIC TREE##########
 ##########Focuses##########
 BLR_Economic: "Belarusian Economy"
 BLR_Economic_desc: "We need to develop our economy, and we are using a number of measures to successfully implement this development."
 BLR_reforms_Belarusian_Railway: "Reforms of the Belarusian Railway"
 BLR_reforms_Belarusian_Railway_desc: "Our Railways are in a very terrible state, so we will carry out a set of reforms to improve the situation"
 BLR_Expand_Mozyr_Refinery: "Expand Mozyr Oil Refinery"
 BLR_Expand_Mozyr_Refinery_desc: "We will expand this oil storage facility"
 BLR_Belshina: "JSC Belshina"
 BLR_Belshina_desc: "JSC Belshina is a manufacturer of automobile tires. It produces tires for passenger cars, trucks, heavy-duty vehicles, road construction and lifting vehicles, electric vehicles, buses, tractors and agricultural machinery"
 BLR_Expand_Naftan_Refinery: "Expand Naftan Oil Refinery"
 BLR_Expand_Naftan_Refinery_desc: "We will expand this oil storage facility"
 BLR_Expansion_Okolovsky_Novoselkovsky: "Expansion of Ore Production of Deposits"
 BLR_Expansion_Okolovsky_Novoselkovsky_desc: "Expansion of ore production from the Okolovsky and Novoselkovsky deposits will bring us a lot of steel"
 BLR_metro_minsk: "Minsk Metro"
 BLR_metro_minsk_desc: "We will improve and expand the Minsk metro to improve the logistical characteristics of the city"
 BLR_belavia: "Belavia"
 BLR_belavia_desc: "Belarusian state airline with its headquarters in Minsk. It was formed in 1996. The main scheduled and charter international flights are operated from Minsk National Airport."
 BLR_Zubr_Energy_LLC: "Zubr Energy LLC"
 BLR_Zubr_Energy_LLC_desc: "Plant for the production of starter batteries for delivery to the conveyor lines of world and domestic automakers."
 BLR_Hi_Tech_Park: "Hi-Tech Park"
 BLR_Hi_Tech_Park_desc: "Hi—Tech Park is a special tax and legal regime for the development of IT business in Belarus. It is not a free (special, special) economic zone, but it is a jurisdiction that operates on the principle of extraterritoriality. Companies and individual entrepreneurs registered in the Park can use the preferences provided to them regardless of the location of their Belarusian office."
 BLR_Factory_Kommunarka: "Kommunarka Factory"
 BLR_Factory_Kommunarka_desc: "Our President believes that the privatization of the Confectionery Factory 'Kommunarka' was illegal, so it was announced the nationalization of this enterprise"
 BLR_MZKT: "MZKT"
 BLR_MZKT_desc: "Minsk Wheel Tractor Plant is an enterprise specializing in the production of road and off—road heavy-duty vehicles, trailed vehicles, special wheeled chassis for the installation of equipment for enterprises of construction, oil and gas and machine-building complexes; a state enterprise under the jurisdiction of the State Military-Industrial Committee of the Republic of Belarus"
 BLR_mtz: "Minsk Tractor Plant"
 BLR_mtz_desc: "Factory in Belarus, manufacturer of agricultural machinery.Minsk Tractor Plant was founded on May 29, 1946. The plant's capacity is designed for the production of 71 thousand tractors of various series"
 BLR_BellegProm: "Bellegprom"
 BLR_BellegProm_desc: "The Belarusian State Concern for the Production and Sale of Light Industry Goods (Bellegprom Concern) was established in 1992 on the basis of the Ministry of Light Industry of the Byelorussian SSR and is subordinate to the Council of Ministers of the Republic of Belarus.The Bellegprom concern includes 96 organizations, 76 of which are industrial. Industrial enterprises are divided by industry: textile, sewing, knitting, and leather and shoe industries. It also includes 16 other organizations and trading enterprises.The main goal of the concern's enterprises is to maximize consumer satisfaction in high quality and fashionable products in a wide range and at affordable prices, and to increase the competitiveness of the industry and its image."
 BLR_BelarusBank: "Belarusbank"
 BLR_BelarusBank_desc: "Savings Bank 'Belarusbank' is the largest bank in Belarus that occupies leading positions in the Belarusian banking system by volume of equity, assets, loans, deposits"
 BLR_BelAgroPromBank: "Belagroprombank"
 BLR_BelAgroPromBank_desc: "Belagroprombank is a Belarusian state—controlled joint-stock commercial bank."
 BLR_BelInvestBank: "Belinvestbank"
 BLR_BelInvestBank_desc: "The Belarusian Bank for Development and Reconstruction Belinvestbank is one of the largest universal banks in the republic, providing a full range of services to legal entities and individuals of various forms of ownership and activities. By ensuring sustainable operation, the Bank maintains its presence among the largest banks in the republic"
 BLR_NoChelnoks: "No More Shuttle Trade"
 BLR_NoChelnoks_desc: "We are ready to completely eradicate the relic of the 90s - shuttles, people don't need these small 'entrepreneurs'"
 BLR_BelRepublicBank: "Development Bank of the Republic of Belarus"
 BLR_BelRepublicBank_desc: "JSC Development Bank of the Republic of Belarus is a specialized financial institution formed in the form of a legal entity. It was established by the Council of Ministers and the National Bank of the Republic of Belarus. The creation of the Development Bank was carried out in cooperation with international financial organizations, in particular, the International Monetary Fund and the World Bank."
 BLR_borimed: "Borimed"
 BLR_borimed_desc: "Borisov Plant of Medical Preparations Open Joint Stock Company is a manufacturer and exporter of broad—spectrum medicines in Belarus. It has four main production facilities, as well as auxiliary services (a printing and cardboard shop, a mechanical repair shop, an energy site, a control and measuring devices and automation site, a repair and construction site, a transport workshop with a fleet, etc.) located in the city of Borisov, Minsk region"
 BLR_GomSelMash: "GomSelMash"
 BLR_GomSelMash_desc: "Gomselmash Open Joint Stock Company is a Belarusian agricultural machinery manufacturer based in Gomel. It is a part of GOMSELMASH Holding and is its management company."
 BLR_BelNeft: "Belorusneft"
 BLR_BelNeft_desc: "Belorusneft is a company operating in Belarus, which together with its parent company Belneftehim, is responsible for the country's largest network of service stations. According to Belorusneft's own announcement, its distribution network includes more than 500 stations, or 65% of all service stations in Belarus. The company is headquartered in Gomel"
 BLR_BelAvtoDor: "Belavtodor"
 BLR_BelAvtoDor_desc: "Belavtodor holding is a group of construction and industrial companies in Belarus, occupying a leading position in the market of complex construction, reconstruction and major repairs of transport infrastructure facilities. It also produces road construction equipment, road construction materials, reinforced concrete, steel and other products for the construction of roads and bridges"
 BLR_BMZ: "Belarusian Steel Works"
 BLR_BMZ_desc: "OJSC Belarusian Steel Works is a Belarusian company operating in the steel industry, centred in Zhlobin, Gomel Region. The main raw material of the enterprise is scrap. The company's products range from concast square steel billets, hot rolled round & square steel bars, rebars, hot rolled seamless pipe, high carbon wire rod, tyre steel cord, bead wire, hose wire, general purpose wire, to steel fiber"
 BLR_BelKalii: "Belaruskali"
 BLR_BelKalii_desc: "Belaruskali is one of the largest state-owned companies of Belarus. It is one of the largest producers of potash fertilizers in the world"
 BLR_BelEnergo: "BelEnergo"
 BLR_BelEnergo_desc: "Belenergo is a Belarusian state energy concern which manages the economic activities of the electric power complex of Belarus"
 BLR_BELAZ: "BELAZ"
 BLR_BELAZ_desc: "BelAZ is a Belarusian automobile plant and one of the world's largest manufacturers of large and especially large dump trucks, as well as other heavy transport equipment for the mining and construction industries."
 BLR_AES: "Domestic Nuclear Power Plant"
 BLR_AES_desc: "We are ready to invest in the construction of our own nuclear power plant to ensure energy independence."
 BLR_GrodnoAzot: "Grodno Azot"
 BLR_GrodnoAzot_desc: "The Khimvolokno Plant branch of Grodno Azot OJSC is a large manufacturer of polyamide and polyester yarns and fibers, as well as polyamide-6 (PA-6) and polymer composite materials based on it. Each of the main types of products is produced in a wide assortment with various physical and mechanical properties and quality indicators, depending on the application"
 ##########Ideas##########
 BLR_economy_hitech_park_idea: "Hi-Tech Park"
 BLR_economy_mzkt_idea: "MZKT"
 BLR_economy_mtz_idea: "Minsk Tractor Plant"
 BLR_cheln_trade: "Chelnochnaya Trade"
 BLR_cheln_trade_desc: "Largest companies have not yet come to Belarus, so shuttles have appeared that bring the necessary high-quality household appliances and a number of other second-hand and luxury goods with high margins."
 BLR_Economic_full_idea: "Belarusian Economy"
 BLR_Economic_full_idea_desc: "The Belarusian economy is the direct heir of the USSR, maintaining the dominance of the Public sector, but this can lead to serious problems if the leadership decides to finally put an end to this approach to shaping the economy."
 BLR_Economic_full_full_idea: "Belarusian Economy"
 BLR_azot_fertilizers_idea: "Access to Chemical Fertilizers"
 BLR_azot_fertilizers_idea_desc: "Chemical fertilizers are essential for good crop, especially in difficult climate."
 BLR_azot_fertilizers_income: "Fertilizers GrodnoAzot"
 BLR_azot_fertilizers_income_desc: "Grodno Azot successfully sells its products to many countries of the world and brings our country a good income from sales"
 BLR_economy_banks_idea: "Banking Sector"
 ##########Modifiers##########
 BLR_minsk_metro: "Minsk Metro"
 BLR_hi_tech_park: "Hi-Tech Park"
 BLR_post_luka_state: "Region's Shattered Economy"
 BLR_post_luka_state_descv: "Transition from the old post-Soviet system to the modern market system had a negative impact on the region. Many businesses have closed, and people are out of work."
 ##########Decisions##########
 BLR_Economy_category: "Government of Belarus"
 BLR_Economy_category_desc: "Belarus gained its independence relatively recently, but the country has already firmly established its place in the world. Its armed forces, economy and special services are the rightful heirs of the Soviet Union and sometimes even retain the organizational structure that it still had under the USSR. Belarus faces a journey into the 21st century, will it be able to adapt to new conditions?"
 BLR_fall_economic_fixes: "Eliminate Economic Consequencesy"
 BLR_integration_mechanic: "Integration Of New Territories"
 BLR_grodnoazot_open: "§GOpen§! the §YGrodnoAzot§!"
 BLR_grodnoazot_close: "§GClose§! the §YGrodnoAzot§!"
