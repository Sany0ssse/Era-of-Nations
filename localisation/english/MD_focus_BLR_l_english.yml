 ##########NATIONALIST TREE##########
 ##########Focuses##########
 BLR_young_goi_start: "Young Front"
 BLR_young_goi_start_desc: "The Young Front is a youth opposition movement in Belarus, closely associated with the right branch of the BPF party and the Monarchist League of Belarus."
 BLR_young_goi_identity: "Roots of Our Identity"
 BLR_young_goi_identity_desc: "We must finally decide what is the essence of our people. Do we fully venerate the lietvin past, or do we support our own belarus identity?"
 BLR_young_goi_integration_fashiks: "Integrate Radicals"
 BLR_young_goi_integration_fashiks_desc: "We must invite White Legion and Revansch organizations to join our ranks and support our new state."
 BLR_young_goi_lustration: "Lustration of Communists"
 BLR_young_goi_lustration_desc: "We must once and for all detach communist and soviet legacy from our identity and current political field."
 BLR_young_goi_medicine: "Medical Support"
 BLR_young_goi_medicine_desc: "We must provide high-class healthcare for all our citizens and ensure a healthy and strong Belarusian nation!"
 BLR_young_goi_new_organs: "New Governmental Structure"
 BLR_young_goi_new_organs_desc: "We must reform our government and make it more alike to western powers, while also preparing the system for the future monarch."
 BLR_young_goi_academy: "Vilno Military Academy"
 BLR_young_goi_academy_desc: "We must say goodbye to our soviet generals and create a new military academy in Vilno, which will make true Belarusian patriotic military commanders."
 BLR_young_goi_magdeburg: "Magdeburg Chart of Rights"
 BLR_young_goi_magdeburg_desc: "Magdeburg rights were a set of town privileges first developed by Otto I, Holy Roman Emperor and based on the Flemish Law, which regulated the degree of internal autonomy within cities and villages granted by the local ruler."
 BLR_magdeburg_rights: "Magdeburg Chart of Rights"
 BLR_magdeburg_rights_desc: "Magdeburg rights were a set of town privileges first developed by Otto I, Holy Roman Emperor and based on the Flemish Law, which regulated the degree of internal autonomy within cities and villages granted by the local ruler."
 BLR_young_goi_religion: "Back to Our Religion"
 BLR_young_goi_religion_desc: "The time has come for us to get rid of the Muscovite Church and return to the religion that we consider most acceptable for our new country."
 BLR_young_goi_new_monarch: "Choosing a New Monarch"
 BLR_young_goi_new_monarch_desc: "We have prepared our state well for our new monarch who shall reign our country for centuries."
 BLR_young_goi_territorial_demands: "Territorial Demands"
 BLR_young_goi_territorial_demands_desc: "It is time for our state to begin laying claim to all the territories that rightfully belong to our crown."
