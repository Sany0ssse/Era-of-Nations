 ##########Event##########
 belarus_economic.1.t: "Collapse of the Economic System"
 belarus_economic.1.d: "The old Soviet system has collapsed! Privatization is taking place in Belarus, enterprises are closing, and it looks like Belarus is waiting for what Russia went through in the 90s."
 belarus_economic.1.a: "God Save US"

 ##########SPECIAL SERVICES TREE##########
 ##########Focuses##########
 BLR_Special_service: "Internal Protection of Belarus"
 BLR_Special_service_desc: "Belarus must be protected at all costs, strong intelligence services are a strong Belarus."
 BLR_special_services_kgb: "KGB RB"
 BLR_special_services_kgb_desc: "The State Security Committee of the Republic of Belarus (KGB RB) is the national intelligence agency, and secret police force of Belarus."
 BLR_special_services_const: "Constitutional Order and Fight Against Terrorism"
 BLR_special_services_const_desc: "This unit is actively engaged in the fight against terrorism inside our country and protects the constitutional order of Belarus, because these two things may well be interrelated."
 BLR_special_services_contr: "Counterintelligence Activities"
 BLR_special_services_contr_desc: "We need strong counterintelligence, so we will strengthen this KGB unit."
 BLR_special_services_safety: "Economic Security and Anti-Corruption"
 BLR_special_services_safety_desc: "Economic security and the fight against corruption are our second priority after constitutional protection."
 BLR_special_services_alpha: "Alpha Group"
 BLR_special_services_alpha_desc: "The Belarusian Alpha Group is a special unit of the State Security Committee of the Republic of Belarus, tasked to handle counter-terrorism operations throughout Belarus when regular Belarusian law enforcement units are underequipped to handle the task. It also assists law enforcement units in anti-crime operations"
 BLR_special_services_gru: "GRU"
 BLR_special_services_gru_desc: "The Main Intelligence Directorate of the General Staff of the Armed Forces of the Republic of Belarus is the special service, the foreign intelligence agency of the Ministry of Defense of Belarus, the central military intelligence management body in the Armed Forces of the Republic of Belarus. Reports to the Chief of the General Staff and the Minister of Defense. The Department is engaged in intelligence in the interests of the Belarusian army."
 BLR_special_services_mvd: "Ministry of Internal Affairs"
 BLR_special_services_mvd_desc: "The Ministry of Internal Affairs of Belarus, abbreviated МUS in Belarusian and MVD  in Russian, is a body of the Belarusian Government that is charged with the internal affairs of Belarus"
 BLR_special_services_k: "Department of High-Tech Crimes Detection"
 BLR_special_services_k_desc: "The development of technology has increased crimes on this basis, and we intend to counteract this type of crime."
 BLR_special_services_economic: "Combatting Organized Crime and Corruption"
 BLR_special_services_economic_desc: "Corruption and crime are inextricably linked, so we will strengthen the fight against them just as inextricably."
 BLR_special_services_inner_troops: "Internal Troops"
 BLR_special_services_inner_troops_desc: "Internal Troops of the Ministry of Internal Affairs of Belarus is a paramilitary law enforcement force in the Republic of Belarus under the national Ministry of Internal Affairs"
 BLR_special_services_inner_sobr: "SOBR"
 BLR_special_services_inner_sobr_desc: "The Special Rapid Response Unit, abbreviated SOBR or SAChR, is a special police unit within the Belarusian Ministry of Internal Affairs"
 BLR_special_services_inner_omon: "OMON"
 BLR_special_services_inner_omon_desc: "OMON is a riot police force under the Ministry of Internal Affairs of the Republic of Belarus (MUS) that specialized in combat and patrolling in urban areas, counter-revolutionary, covert operation, crowd control and riot control when people or prisoners who are involved in a riot, unlawful demonstration or unlawful protest, high-risk law enforcement situations, HUMINT, and internal security."
 BLR_special_services_inner_almaz: "ALMAZ"
 BLR_special_services_inner_almaz_desc: "Almaz Special Anti-Terrorism Unit is a police tactical unit of the Ministry of Internal Affairs of the Republic of Belarus (MUS) that specialized in counterterrorism and hostage rescue crisis management, quick raid to capture or kill high-value targets, riot control in detention facilities, and VIP protection."
 ##########Ideas##########
 BLR_gru_open: "§GOpen§! the §YGRU§!"
 BLR_gru_close: "§GClose§! the §YGRU§!"

 ##########ARMY TREE##########
 ##########Focuses##########
 BLR_army: "Armed Forces of Belarus"
 BLR_army_desc: "A strong army is the key to the existence of any state, so we will actively continue to improve our armed forces despite all the challenges of the 21st century."
 BLR_army_ground: "Ground Forces"
 BLR_army_ground_desc: "The Belarusian Ground Forces,also called the Belarusian army, is the land warfare service branch of the Armed Forces of Belarus"
 BLR_territorial_defence: "Territorial Defence"
 BLR_territorial_defence_desc: "The outbreak of war forces us to raise a Territorial Defence to war."
 BLR_army_sso: "Special Operations Forces"
 BLR_army_sso_desc: "The Special Operations Forces of the Armed Forces of the Republic of Belarus, a highly mobile branch of the Armed Forces of the Republic of Belarus, are the successor to the Airborne Forces of the USSR and the special forces of the GRU of the USSR in the Republic of Belarus. Main tasks: counter-sabotage activities, intelligence, combating illegal armed groups, performing various tasks using special methods in order to end the armed conflict against the Republic of Belarus. They act as one of the main elements of strategic deterrence."
 BLR_army_transport: "Transport Troops"
 BLR_army_transport_desc: "The Belarusian Transport Troops as is the service branch of the Armed Forces of Belarus. It is responsible for the movement of personnel and material by truck, rail, and air, and is designed to carry the tasks of the transport support of the military formations from other service branches across the country."
 BLR_peleng: "Peleng"
 BLR_peleng_desc: "JSC Peleng is a Belarusian company for the development and production of optoelectronic products for military and civilian purposes, the leading company in the industry in the Republic of Belarus"
 BLR_army_morpehi: "Revive the Marine Corps"
 BLR_army_morpehi_desc: "Back in the USSR, there were navies in which our soldiers served, now we are ready to take into account the experience of this branch of the armed forces and revive it as part of our armed forces."
 BLR_army_navy: "Our Fleet"
 BLR_army_navy_desc: "Belarus has never had its own navy, but now the time may have come when the banner of the Belarusian Navy will begin to appear in various seas."
 BLR_army_vvs_pvo: "Air Force and Air Defence Forces"
 BLR_army_vvs_pvo_desc: "Air Force and Air Defence Forces is a branch of Armed Forces of Belarus tasked with conduction and countering air warfare. It was formed by merging separate air force and air defense branches."
 BLR_army_engineer: "Engineering Troops"
 BLR_army_engineer_desc: "No army can do without strong engineering units, and we intend not to break this tradition."
 BLR_army_radiowarfare: "Radio-Technical Troops"
 BLR_army_radiowarfare_desc: "Radio technology component of any army should not be in the last place in terms of funding, and we intend to comply with this rule."
 BLR_borderdefence: "Border Guard Service"
 BLR_borderdefence_desc: "The State Border Committee of the Republic of Belarus, GPK , It carries out committee orders and policy. The primary tasks of the State Border Committee include: border policy and enhancing border security."
 BLR_army_peace: "Peacekeeping Battalion"
 BLR_army_peace_desc: "We will create a special unit to participate in peacekeeping missions"
 BLR_558_zavod: "558 Aircraft Repair Plant"
 BLR_558_zavod_desc: "The 558th Aviation Repair Plant is one of the largest enterprises in the CIS for the repair and modernization of modern combat aviation equipment in service with the Air Forces of not only the post-Soviet countries, but also many foreign countries. It is the most important aircraft repair production in Belarus. Located in the city of Baranovichi"
 BLR_minoitor: "Minotor-Service"
 BLR_minoitor_desc: "Minotor-Service is a Belarusian enterprise located in Minsk and engaged in the development, production, modernization, repair and maintenance of combat tracked vehicles, as well as the supply of spare parts for the latter. It is one of the leading enterprises of the country's military-industrial complex"
 BLR_belspecveshtech: "Belspetsvneshtechnika"
 BLR_belspecveshtech_desc: "Belspetsvneshtechnika, BSVT is a Belarusian state—owned foreign trade unitary enterprise founded in 1995. Specializes in the trade and production of weapons and dual-use products. It is a member of the State Military-Industrial Committee and is considered the country's leading enterprise in the field of arms exports"
 BLR_140_zavod: "140 Repair Plant"
 BLR_140_zavod_desc: "The 140th Repair Plant is a state—owned enterprise of the military-industrial complex of Belarus, which specializes in the repair and modernization of armored vehicles and their engines"
