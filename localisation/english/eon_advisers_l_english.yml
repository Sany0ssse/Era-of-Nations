l_english:
 eon_advisers_mission_idea:0 "Advisory and training agreement"
 eon_advisers_mission_idea_desc:0 "An agreed, funded programme helps our own armed forces plan operations and train specialists. The programme lasts up to 60 days."
 eon_advisers_offer_available_tt:0 "The partner must be at war, eligible for military support and free to accept an advisory programme. We must cover the full §Y$1.5 billion§! cost and have no other outgoing advisory agreement. An unresolved expired proposal permanently closes this type of offer to that partner; an unidentified old proposal closes our advisory-offer channel. An unresolved old mercenary commitment also blocks new offers."
 eon_advisers_offer_tt:0 "Offer a §Y60-day advisory and training programme§! funded by us for §Y$1.5 billion§!, payable only when the partner consents and current conditions still hold. They have §Y30 days§! to reply. One offer may await a reply at a time; one programme may be provided and one received. The programme assists the partner’s own armed forces and does not create a combat brigade. The starting expense is §Ynonrefundable§!."
 eon_advisers.1.t:0 "Advisory and training offer"
 eon_advisers.1.d:0 "[FROM.GetName] offers to fund a 60-day advisory and training programme for our armed forces. The provider pays $1.5 billion when we consent and the conditions still hold; we make no payment. The support improves specialist training and operational planning. We may accept or decline within 30 days. Either country may end the programme. It also ends when our war ends, the countries fight each other, either partner ceases to exist, or 60 days pass. The starting expense is not refunded."
 eon_advisers.1.a:0 "Accept the advisory programme"
 eon_advisers.1.b:0 "Decline or close the offer"
 eon_advisers_accept_tt:0 "Begin §Y60 days§! of support: §Y2% shorter special-forces training time, +8% maximum planning and +1% special-forces capacity§!. The provider pays §Y$1.5 billion§! once. Existing influence and internal military-opinion rules apply. No combat formation is created by this agreement."
 eon_advisers_decline_tt:0 "Close the offer without payment or support. Declining a current, eligible and funded proposal uses the existing domestic-independence response, at most once per six months. Closing an expired, withdrawn or unfunded proposal has no such effect."
 eon_advisers_unmatched_tt:0 "This proposal is already answered or no longer open. Acknowledging it cannot start another programme or charge the provider."
 eon_advisers_withdraw_offer:0 "Withdraw advisory support offer"
 eon_advisers_withdraw_offer_desc:0 "Withdraw the unpaid advisory offer for this partner before they accept."
 eon_advisers_withdraw_offer_send_desc:0 "Withdraw this offer without payment? Another proposal remains unavailable until the partner closes the original offer or its reply period ends. An unresolved expiry permanently closes these offers to this partner."
 eon_advisers_end_cooperation:0 "End advisory cooperation"
 eon_advisers_end_cooperation_desc:0 "End the active advisory agreements with this partner. If we fund each other’s programmes, both directions end. Other partners and unanswered offers are unaffected. Starting expenses are not refunded."
 eon_advisers_end_cooperation_send_desc:0 "End advisory cooperation with this partner in both agreed directions? The programmes stop without repayment of their starting expenses."
 eon_advisers.2.t:0 "Advisory programme started"
 eon_advisers.2.d:0 "The partner consented and current conditions were met. The provider paid $1.5 billion and a 60-day advisory and training programme began for the recipient’s own armed forces. Existing influence and internal military-opinion rules apply. Either partner may end the agreement without a refund."
 eon_advisers.3.t:0 "Advisory offer withdrawn"
 eon_advisers.3.d:0 "The provider withdrew the advisory offer before acceptance. No payment or programme began. The original proposal can be closed when it appears."
 eon_advisers.4.t:0 "Advisory proposal expired"
 eon_advisers.4.d:0 "The proposal expired or its partner ceased to exist before an agreement began. No payment was made. Further advisory offers from this provider to that partner are permanently unavailable; other eligible partners remain available."
 eon_advisers.5.t:0 "Advisory offers unavailable"
 eon_advisers.5.d:0 "An incomplete proposal could not be matched safely to its partner. No payment or programme began. This country’s advisory-offer channel cannot be reopened; other diplomatic actions remain available."
 eon_advisers.6.t:0 "Advisory offer closed"
 eon_advisers.6.d:0 "The proposal was declined, withdrawn or no longer met the conditions for advisory support. No starting expense was paid and no programme began under this proposal."
 eon_advisers.7.t:0 "Advisory cooperation ended"
 eon_advisers.7.d:0 "The agreed advisory programmes with this partner ended. Their support bonuses stop. The starting expenses are not refunded. Other partners and unanswered offers are unaffected."
 eon_advisers.ack:0 "Understood"
