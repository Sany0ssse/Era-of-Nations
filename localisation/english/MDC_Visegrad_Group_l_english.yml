 #EVENTS
 visegrad_invest: "Invested in the Visegrad Fund"
 visegrad_group.1.t: "International Visegrad Fund asks for investments"
 visegrad_group.1.d: "Members of the Visegrad Group have approached us with a commercial proposal. They are asking us to invest in the Visegrad Fund. Will we help them?"
 visegrad_group.1.a: "Invest $5 billion"
 visegrad_group.1.b: "Invest $15 billion"
 visegrad_group.1.c: "Invest $35 billion"
 visegrad_group.1.g: "It is not in our interests."
 visegrad_group.2.t: "[FROM.GetName] agrees to invest in Visegrad Fund"
 visegrad_group.2.d: "[FROM.GetName] has agreed to invest in the International Visegrad Fund"
 visegrad_group.2.a: "Nice"
 visegrad_group.3.t: "[FROM.GetName] refused to invest in Visegrad Fund"
 visegrad_group.3.d: "[FROM.GetName] has refused to invest in the International Visegrad Fund"
 visegrad_group.3.a: "Okay"
 visegrad_group.4.t: "[FROM.GetName] leave from Visegrad Group"
 visegrad_group.4.d: "[FROM.GetName] announced its decision to leave the Visegrad Group. They cited the decline in cohesion in the organization and the lack of prospects for future development as the reason for their decision."
 visegrad_group.4.a: "Very Sad!"
 visegrad_group.5.t: "Visegrad Group offers deal"
 visegrad_group.5.d: "The Visegrad Group approached us with a commercial proposal. They offer cooperation with our Ford Automobile Company, and also ask for investments in the construction of the company's first plants. Having received approval, members of the Visegrad Group will be able to build Ford plants, increasing our capitalization."
 visegrad_group.5.a: "Deal"
 visegrad_group.5.b: "I think no..."
 visegrad_group.6.t: "US Accept"
 visegrad_group.6.d: "US agreed to the deal. Now we can build Ford Automobile Plants, increasing German Capitalization. It's good that US also gave us funds to build the first plants."
 visegrad_group.6.a: "Nice"
 visegrad_group.7.t: "US Refused"
 visegrad_group.7.d: "US turned us down for a deal with Ford. It could have been a good deal, but alas"
 visegrad_group.7.a: "Sad"
 visegrad_group.8.t: "Visegrad Group offers deal"
 visegrad_group.8.d: "The Visegrad Group approached us with a commercial proposal. They offer cooperation with our Hyundai Automobile Company, and also ask for investments in the construction of the company's first plants. Having received approval, members of the Visegrad Group will be able to build Hyundai plants, increasing our capitalization."
 visegrad_group.9.t: "Korea Accept"
 visegrad_group.9.d: "Korea agreed to the deal. Now we can build Hyundai Automobile Plants, increasing Korean Capitalization. It's good that Korea also gave us funds to build the first plants."
 visegrad_group.10.t: "Korea Refused"
 visegrad_group.10.d: "Korea turned us down for a deal with Hyundai. It could have been a good deal, but alas"
 visegrad_group.11.t: "[FROM.GetName] invites us to joint exercises"
 visegrad_group.11.d: "[FROM.GetName] invites us to a joint exercise of the Visegrad Battle Group. This will give us some combat experience, increase our cohesion and prepare us for possible conflicts so that we can better counter threats."
 visegrad_group.11.a: "We will join them"
 visegrad_group.11.b: "We don't have time for this"
 visegrad_group.12.t: "The Visegrad Group invites us to the exercises"
 visegrad_group.12.d: "The Visegrad Group invites us to the joint exercise V4+ [ROOT.GetName].  This will give us some combat experience, increase our cohesion and prepare us for possible conflicts so that we can better counter threats."
 visegrad_group.13.t: "V4+ [FROM.GetName] exercises were successful"
 visegrad_group.13.d: "V4+ [FROM.GetName] exercises were successful. These were wonderful exercises, our armed forces were able to gain combat experience, and all participating countries became even closer in the diplomatic field."
 visegrad_group.13.a: "Together we are stronger!"
 visegrad_group.14.t: "V4+ [FROM.GetName] exercises failed"
 visegrad_group.14.d: "V4+ [FROM.GetName] exercises failed. [FROM.GetName] refused to conduct joint exercises with our Group"
 visegrad_group.14.a: "Maybe next time"
 visegrad_group.15.t: "[FROM.GetName] invested in us"
 visegrad_group.15.d: "[FROM.GetName] invested in us through the International Visegrad Fund. The Visegrad Group is actively developing and countries are supporting each other with investments, this is great!"
 visegrad_group.15.a: "Nice"
 visegrad_group.16.t: "New Power"
 visegrad_group.16.d: "Today, the members of the Visegrad Group announced the unification of the participating countries into a single state with the center in Warsaw. The new state was called Central Europe and is a powerful state that unites the military, economic and political power of several countries at once. Of course, they still have many bureaucratic problems to solve, but nevertheless, such news speaks of a shift in the balance of power in Europe and the birth of a new possible Superpower."
 visegrad_group.16.a: "Suddenly"

 visegrad_group.17.t: "Welcome to the Visegrad Group!"
 visegrad_group.17.d: "If you see this, it means your country is a member of the Visegrad Group (also known as the Visegrad Four or V4). The Visegrad Group was established in 1991 in the Hungarian city of Visegrad by the leaders of three countries - Poland, Czechoslovakia, and Hungary. After the dissolution of Czechoslovakia, both countries became members of the V4.\n\nThe group's goal was to bring countries seeking to join the European community economically closer together. Over time, the group expanded its integration beyond economic partnership, also becoming a cultural, trade, and military alliance in Central Europe."
 visegrad_group.17.a: "Tell me about the mechanics of the Group"
 visegrad_group.17.b: "Very interesting, let me play"
 visegrad_group.18.t: "Main panel of the Visegrad Group"
 visegrad_group.18.d: "So, let's look at the main Visegrad Group panel, which is located in your decisions. There, you'll see the following metrics: Cohesion Level – an indicator of how cohesive the alliance is; if the level is low, AI-controlled countries may decide to leave the Group. Influence in the Visegrad Group isn't a race for influence; it's an indicator that a given country is developing the group, actively investing in, and pursuing focuses in the Visegrad Group branch.\n\nBelow you'll see clickable buttons: You can click on any member country of the Visegrad Group to open decisions with interactions with that country (yes, you can interact with yourself too). To the right of the countries are three buttons for investing in the Visegrad Fund. Each investment takes money from your treasury and deposits it into the Visegrad Fund budget, granting you 1% influence in the Visegrad Group. Investments passively generate income in the form of dividends (the current budget and dividend amount are shown on the panel). Additionally, the fund's budget can be spent on investments in various sectors (this option is unlocked through focuses).\n\nBelow are informative indicators such as: the total GDP of all participating countries combined, as well as the country with the highest contribution to GDP."
 visegrad_group.18.a: "I see. What else is there?"
 visegrad_group.19.t: "Decisions of the Visegrad Group"
 visegrad_group.19.d: "Below the main panel is the standard decision panel. To open the panel with specific decisions, you can use the main panel: by clicking on countries, as mentioned earlier, you open decisions related to that country. Above the decisions are three buttons: Basic Decisions, Economic, and Military, which define the general category of decisions.\n\nFor example, you click on Hungary, then select one of two categories (economic or military). Let's take economic as an example. This opens up decisions regarding economic interactions with Hungary, including investments in its economy through the Visegrad Fund. Investing in other members increases cohesion, while investing in your own economy decreases cohesion.\n\nA separate category is \"Main Decisions.\" This button resets your selected country and allows you to select Main Decisions from various categories. For example, clicking \"Main Decisions\" and selecting the \"Economic\" category will reveal alliance-wide decisions, such as requesting investment from non-alliance countries. Clicking the \"Military\" category, for example, will allow you to modernize your army with Polish equipment, conduct joint exercises with other countries, and so on.\n\nMost solutions are unlocked through focuses in the Visegrad Group Branch."
 visegrad_group.19.a: "Interesting. What about the unification?"
 visegrad_group.20.t: "The process of unification of the Visegrad Group"
 visegrad_group.20.d: "The easiest mechanic to understand in the Visegrad Group is unification. To do this, you'll need to complete the entire Visegrad Group focus tree, more than half of which can be completed for you and other members of the Group. This tree is common to all participating countries.\n\nSo, you or other members of the Group have completed the first part of the focus tree. What's next? Next, you need to become the Leader of the Visegrad Group by completing the \"Project of Unification\" focus. After that, you need to continue along the focus tree, pursuing deeper integration with member countries, culminating in a choice: Federation or Confederation. Congratulations, you've united the Visegrad Group into a Central European Federation (or Confederation)!"
 visegrad_group.20.a: "Thanks for teaching me, I became a little smarter today!"
 visegrad_group.20.b: "I still have some questions, can you clarify a couple of points?"




