 FOCUS_FILTER_VISEGRAD: "Visegrad Group"
 visegrad_group_shared_focus: "Visegrad Group"
 visegrad_group_shared_focus_desc: "The Visegrad Group is more than just a political forum; it is a cultural and historical brotherhood. By strengthening our shared identity and coordinating our policies, we can ensure that the voice of Central Europe is heard loud and clear on the world stage. Our unity is our strength."

 VG_visegrad_group_fund: "Visegrad Fund"
 VG_visegrad_group_fund_desc: "The Visegrad Fund is a joint investment fund of the Visegrad Group. It is used to invest in joint projects and to receive dividends from the projects. The fund is managed by the Visegrad Group and is used to invest in joint projects and to receive dividends from the projects."

 VG_foreign_funding: "Foreign Funding"
 VG_foreign_funding_desc: "Our domestic industries and infrastructure are the bedrock of our future growth. By actively seeking and securing foreign investments, we can inject much-needed capital and expertise to modernize our economies and accelerate our development."

 VG_american_investments: "American Investments"
 VG_american_investments_desc: "The United States represents a vast source of capital and technological prowess. Let us roll out the red carpet for American investors, particularly in the fields of defense, energy, and high-tech, forging stronger transatlantic ties."

 VG_visegrad_patent_institute: "Visegrad Patent Institute"
 VG_visegrad_patent_institute_desc: "The Visegrad Patent Institute is a joint patent institute of the Visegrad Group. It is used to create and manage patents for joint projects. The institute is managed by the Visegrad Group and is used to create and manage patents for joint projects."

 VG_hyundai: "Hyundai Automobile Company"
 VG_hyundai_desc: "Hyundai is a global leader in the automotive industry. It is used to create and manage patents for joint projects. The institute is managed by the Visegrad Group and is used to create and manage patents for joint projects."

 VG_ford: "Ford Automobile Company"
 VG_ford_desc: "Ford is a global leader in the automotive industry. It is used to create and manage patents for joint projects. The institute is managed by the Visegrad Group and is used to create and manage patents for joint projects."

 VG_european_investments: "European Investments"
 VG_european_investments_desc: "Our neighbors in Western Europe possess deep pockets and a vested interest in a stable Central Europe. We must court their investors to fund key projects, ensuring our economies remain intertwined and prosperous."

 VG_korean_investments: "South Korean Investments"
 VG_korean_investments_desc: "South Korea is a global leader in electronics, heavy industry, and shipbuilding. Let us offer favorable terms to attract their chaebols, gaining not only investment but also a transfer of their advanced technological know-how."

 VG_domestic_investment: "Domestic Investment"
 VG_domestic_investment_desc: "While foreign capital is useful, true economic sovereignty comes from a strong domestic sector. We must provide grants, tax breaks, and support to our own entrepreneurs and industries to ensure our growth is self-sustaining."

 VG_energy_expansion: "Energy Expansion"
 VG_energy_expansion_desc: "A nation's power is measured in megawatts. To fuel our industries and warm our homes, we must embark on an ambitious program to expand our energy grid, investing in both traditional and renewable sources to ensure independence."

 VG_industry_expansion: "Expansion of Industry"
 VG_industry_expansion_desc: "The factory floor is the heart of a modern economy. We must subsidize the construction of new manufacturing plants and the retooling of old ones, shifting from being a source of raw materials to a hub of finished, high-value goods."

 VG_development_nuclear_energy: "Development of Nuclear Energy"
 VG_development_nuclear_energy_desc: "For true energy independence and a clean, reliable power base, we must look to the atom. A joint Visegrad nuclear program will provide us with the energy security needed for the next century."

 VG_construction_nuclear_complexes: "Construction of Nuclear Complexes"
 VG_construction_nuclear_complexes_desc: "Blueprints are not enough. It is time to break ground on a new generation of nuclear power plants. This monumental effort will create thousands of jobs and provide a massive boost to our industrial and scientific base."

 VG_visegrad_nuclear_company: "Visegrad Nuclear Company"
 VG_visegrad_nuclear_company_desc: "To manage our atomic ambitions efficiently, we will merge our national nuclear agencies into a single, powerful entity: the Visegrad Nuclear Company. This will pool our resources, expertise, and regulatory power."

 VG_automobile_factories: "Automobile Factories"
 VG_automobile_factories_desc: "The automobile industry is a cornerstone of manufacturing. By offering incentives, we can convince major global car manufacturers to establish new factories here, turning the Visegrad Region into the 'Detroit of Europe'."

 VG_eastern_investments: "Eastern Investments"
 VG_eastern_investments_desc: "New markets and partners are emerging to the East. We should not limit ourselves to Western capital; let us also seek investments from other rising economic powers, diversifying our sources of foreign influence and capital."

 VG_visegrad_battle_group: "Visegrad Battle Group"
 VG_visegrad_battle_group_desc: "As a contribution to European defense, we will form a dedicated Visegrad Battlegroup under the EU's Common Security and Defence Policy. This will serve as a testing ground for our joint operational capabilities."

 VG_defense_treaty: "Defense Treaty"
 VG_defense_treaty_desc: "A formal, binding mutual defense pact will be the cornerstone of our collective security. An attack on one shall be considered an attack on all, sending a clear message of our resolve to any potential aggressors."
 
 VG_border_defense_plan: "Border Defense Plan"
 VG_border_defense_plan_desc: "Our external borders are our shared responsibility. We must develop a unified strategy for border protection, integrating surveillance systems and creating rapid reaction forces to secure the frontiers of the Visegrad bloc."

 VG_modernization_polish_standards: "Modernization According to Polish Standards"
 VG_modernization_polish_standards_desc: "To achieve true interoperability, our armed forces must share common equipment. By standardizing our gear, logistics, and training on Polish-made or Polish-selected hardware, we can create a seamless and powerful combined force."

 VG_joint_exercises: "Conducting Joint Exercises"
 VG_joint_exercises_desc: "Paper treaties are meaningless without practical experience. Large-scale, regular military exercises involving all branches of our armed forces are essential to build trust, refine command structures, and ensure we can fight as one."

 VG_v4croatia: "V4 + Croatia"
 VG_v4croatia_desc: "Our cooperation need not be limited to the core four. Let us invite Croatia to participate in our joint initiatives, extending the Visegrad sphere of influence and adding a valuable partner to our endeavors."

 VG_v4ukraine: "V4 + Ukraine"
 VG_v4ukraine_desc: "A stable and secure Ukraine is in our vital interest. By establishing a V4+Ukraine format, we can offer our support and coordination, helping to anchor our eastern neighbor to the West and providing a bulwark against instability."

 VG_v4baltic: "V4 + Baltic"
 VG_v4baltic_desc: "The security of the Baltic states is inseparable from our own. A formal V4+Baltic partnership will create a powerful bloc on the Eastern Flank of NATO, coordinating our defense purchases and strategic posture for maximum effect."

 VG_purchasing_program: "Purchasing Program"
 VG_purchasing_program_desc: "There is strength in numbers. By creating a joint military procurement agency, we can negotiate better prices for equipment, streamline our supply chains, and ensure our armies are equipped with the best tools for the job."

 VG_single_unit: "Single Unit"
 VG_single_unit_desc: "The ultimate test of our military integration will be the formation of a permanent, combined-arms military unit, drawn from the best soldiers of all four nations. This 'Visegrad Legion' will be the spearhead of our collective defense."

 VG_reorganization_armed_forces: "Reorganization of the Armed Forces"
 VG_reorganization_armed_forces_desc: "To make our defense pact a reality, we must go beyond cooperation and begin the complex process of truly integrating our command structures, creating a unified Visegrad High Command to lead our combined armed forces."

 VG_project_of_unification: "Project of Unification"
 VG_project_of_unification_desc: "The time has come to move beyond mere cooperation. We must begin the great work of political and economic unification, forging our four nations into a single entity that can stand as a great power in its own right."

 VG_visegrad_union: "Visegrad Union"
 VG_visegrad_union_desc: "Let us formally establish the Visegrad Union, a political entity with a central council to coordinate foreign policy, a common market, and a shared vision for the future of Central Europe."

 VG_project_confederation: "Project Confederation"
 VG_project_confederation_desc: "We shall draft a constitution for a Visegrad Confederation, a union of sovereign states that pools authority in specific, critical areas like defense and trade, while preserving national identities and governments."

 VG_centralized_unification: "Centralized Unification"
 VG_centralized_unification_desc: "A confederation is but a half-measure. For our Union to truly endure and project power, it must be a centralized state, with a strong federal government capable of acting decisively on behalf of all its citizens."

 VG_economic_reorganization: "Economic Reorganization"
 VG_economic_reorganization_desc: "Our first step towards a true union is the economy. We must harmonize our tax codes, regulations, and trade policies, tearing down the internal barriers that still hinder the free flow of goods, capital, and labor."
 
 VG_single_currency: "Single Currency"
 VG_single_currency_desc: "A single market demands a single currency. By retiring the Zloty, Forint, Koruna, and Euro, and replacing them with a new, common Visegrad currency, we will cement our economic union and challenge the financial dominance of the West."

 VG_visegrad_passport: "Visegrad Passport"
 VG_visegrad_passport_desc: "Let us introduce a common Visegrad Passport, a powerful symbol of our shared citizenship. This will grant our people the right to live, work, and travel freely across the entire territory of the Union."

 VG_merger_of_departments: "Merger of Departments"
 VG_merger_of_departments_desc: "Efficiency is key to a functioning state. We will begin merging redundant national ministries—starting with Transport, Energy, and Foreign Affairs—into streamlined, Union-wide departments."

 VG_deal_with_bureaucracy: "Deal with Problem of Bureaucracy"
 VG_deal_with_bureaucracy_desc: "Unification will inevitably create a sprawling new bureaucracy. We must preempt this by designing a lean, efficient, and digital-first administrative system to serve the Union, not strangle it in red tape."

 VG_political_reconstruction: "Political Reconstruction"
 VG_political_reconstruction_desc: "The final step is the creation of a unified political body. We will establish a bicameral Visegrad Parliament, representing both the citizens of the Union and the constituent states, to serve as its democratic heart."

 VG_visegrad_confederation: "Visegrad Confederation"
 VG_visegrad_confederation_desc: "The Visegrad Confederation is now a reality. While our nations retain their sovereignty, we speak with one voice on the world stage and defend our borders as a single, formidable entity."

 VG_visegrad_federation: "Visegrad Federation"
 VG_visegrad_federation_desc: "The dream is achieved. The Visegrad Federation stands united, a new federal republic and a major power in Europe. From the Baltic to the Danube, we are one people, one nation, under one flag."

 VG_center_of_power: "Center of Power"
 VG_center_of_power_desc: "The Visegrad Group has transcended its origins. We are no longer just a regional bloc; we have become a decisive Center of Power, capable of shaping European politics and defending our interests against any competitor."

 VG_center_of_influence: "Center of Influence"
 VG_center_of_influence_desc: "Our model of cultural resilience, economic growth, and strategic sovereignty has become a beacon for the world. The Visegrad Federation is not just a power; it is a Center of Influence, exporting its ideas and values across the globe."
