l_english:
 eon_energy_delivery_category: "Electricity deliveries"
 eon_energy_delivery_category_desc: "Contracts retain agreed quantities. Available generation and imports determine actual deliveries; shortages reduce exports proportionally. Billing uses actual deliveries in the existing weekly budget."
 eon_energy_delivery_status: "Review electricity deliveries"
 eon_energy_delivery_status_desc: "Review contracted and delivered GW, weekly electricity charges, and interrupted deliveries."
 eon_energy_delivery.ack: "Understood"
 eon_energy_delivery.1.t: "Electricity delivery report"
 eon_energy_delivery.1.d: "Contracted imports: [?eon_energy_delivery_contract_imports|3] GW\nDelivered imports: [?eon_energy_delivery_imports|3] GW\nContracted exports: [?eon_energy_delivery_contract_exports|3] GW\nDelivered exports: [?eon_energy_delivery_exports|3] GW\n\nWeekly export revenue: $[?energy_selling_income|3] billion\nWeekly import expense: $[?energy_buying_expenses|3] billion\n\nThese are current weekly rates, not a total of delivered hours over the last seven days. The current rates enter our ordinary weekly budget; free supplies create no electricity charge. A temporary shortfall preserves the contract and can recover. This calculation does not certify physical interconnector capacity or payment collection."
 eon_energy_delivery.1.incomplete: "The network calculation reached its 64-round limit before the change per contract fell to 0.001 GW. Current deliveries are conservative and match on both sides, but numerical convergence is incomplete.\n\nContracted/delivered imports: [?eon_energy_delivery_contract_imports|3] / [?eon_energy_delivery_imports|3] GW\nContracted/delivered exports: [?eon_energy_delivery_contract_exports|3] / [?eon_energy_delivery_exports|3] GW\nWeekly import expense/export revenue: $[?energy_buying_expenses|3] / $[?energy_selling_income|3] billion."
 eon_energy_delivery.1.invalid: "At least one contract cannot currently execute: its partner, mutual terms, framework agreement, or peaceful access is missing. Only the affected delivery is withheld. The terms are retained for review.\n\nContracted/delivered imports: [?eon_energy_delivery_contract_imports|3] / [?eon_energy_delivery_imports|3] GW\nContracted/delivered exports: [?eon_energy_delivery_contract_exports|3] / [?eon_energy_delivery_exports|3] GW\nWeekly import expense/export revenue: $[?energy_buying_expenses|3] / $[?energy_selling_income|3] billion."
 eon_energy_delivery.2.t: "Electricity deliveries reduced"
 eon_energy_delivery.2.d: "Current generation, domestic demand or interrupted cooperation prevents full execution of our electricity contracts. Available exports are shared proportionally. Only delivered power enters energy balances and weekly electricity charges. The contracts remain in force for recovery or renegotiation. Review the delivery report for quantities and costs."
 eon_energy_delivery.3.t: "Electricity deliveries restored"
 eon_energy_delivery.3.d: "Our current electricity deliveries again meet the contracted quantities within the numerical tolerance. The existing weekly budget now reflects those delivered quantities."
