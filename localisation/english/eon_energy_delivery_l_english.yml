l_english:
 eon_energy_delivery_category: "Electricity deliveries"
 eon_energy_delivery_category_desc: "Contracts retain agreed quantities. Available generation and imports determine actual deliveries; shortages reduce exports proportionally. Delivered energy is billed separately through electricity invoices."
 eon_energy_delivery_status: "Review electricity deliveries"
 eon_energy_delivery_status_desc: "Review contracted and delivered GW, forecast weekly charges, and interrupted deliveries."
 eon_energy_delivery.ack: "Understood"
 eon_energy_delivery.1.t: "Electricity delivery report"
 eon_energy_delivery.1.d: "Contracted imports: [?eon_energy_delivery_contract_imports|3] GW\nDelivered imports: [?eon_energy_delivery_imports|3] GW\nContracted exports: [?eon_energy_delivery_contract_exports|3] GW\nDelivered exports: [?eon_energy_delivery_exports|3] GW\n\nForecast weekly export revenue: $[?energy_selling_income|3] billion\nForecast weekly import expense: $[?energy_buying_expenses|3] billion\n\nThese forecasts assume that current deliveries continue for seven days. Actual charges accumulate from delivered energy in hourly intervals and are paid separately through electricity invoices; the forecasts are not charged again through the ordinary weekly budget. Free supplies create no electricity charge. A temporary shortfall preserves the contract and can recover. Open Electricity invoices to review the delivered energy, payments and outstanding amounts."
 eon_energy_delivery.1.incomplete: "The network calculation reached its 64-round limit before the change per contract fell to 0.001 GW. Current deliveries are conservative and match on both sides, but numerical convergence is incomplete.\n\nContracted/delivered imports: [?eon_energy_delivery_contract_imports|3] / [?eon_energy_delivery_imports|3] GW\nContracted/delivered exports: [?eon_energy_delivery_contract_exports|3] / [?eon_energy_delivery_exports|3] GW\nWeekly import expense/export revenue: $[?energy_buying_expenses|3] / $[?energy_selling_income|3] billion."
 eon_energy_delivery.1.invalid: "At least one contract cannot currently execute: its partner, mutual terms, framework agreement, or peaceful access is missing. Only the affected delivery is withheld. The terms are retained for review.\n\nContracted/delivered imports: [?eon_energy_delivery_contract_imports|3] / [?eon_energy_delivery_imports|3] GW\nContracted/delivered exports: [?eon_energy_delivery_contract_exports|3] / [?eon_energy_delivery_exports|3] GW\nWeekly import expense/export revenue: $[?energy_buying_expenses|3] / $[?energy_selling_income|3] billion."
 eon_energy_delivery.2.t: "Electricity deliveries reduced"
 eon_energy_delivery.2.d: "Current generation, domestic demand or interrupted cooperation prevents full execution of our electricity contracts. Available exports are shared proportionally. Only delivered energy is billed; the weekly figures are forecasts. The contracts remain in force for recovery or renegotiation. Review the delivery report and Electricity invoices for quantities, payments and outstanding amounts."
 eon_energy_delivery.3.t: "Electricity deliveries restored"
 eon_energy_delivery.3.d: "Our current electricity deliveries again meet the contracted quantities within the numerical tolerance. Forecast weekly amounts have been updated; actual delivered energy continues to be billed separately through electricity invoices."
