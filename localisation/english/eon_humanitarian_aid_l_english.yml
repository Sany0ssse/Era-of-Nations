l_english:
 eon_offer_humanitarian_aid:0 "Fund civilian relief"
 eon_offer_humanitarian_aid_desc:0 "Offer 100 million for civilian relief to a country at war or hosting refugees. The recipient must consent."
 eon_humanitarian_aid_ready_tt:0 "An independent donor can fund this country with §Y0.1 billion§! for civilian relief. The full sum must be available, the restricted fund cannot exceed 10 billion, and no other outgoing humanitarian offer may be pending."
 eon_humanitarian_aid_send_desc:0 "Offer §Y100 million§! to this country's restricted civilian relief fund? They have §Y30 days§! to accept. Sending costs no political power or money. At acceptance, both countries, bilateral peace, the donor's sovereignty and cash, and the recipient's need and fund capacity are checked again. The grant can finance civilian relief when people need it; an unused balance remains reserved for that purpose. It creates no debt or military rights. Successful grants have a 180-day cooldown for this partner. An unanswered expired offer permanently closes humanitarian offers to that partner; other partners remain available."
 eon_humanitarian_aid_accept_title:0 "Civilian relief funding accepted"
 eon_humanitarian_aid_accept_desc:0 "The accepted proposal will transfer 100 million only if its current conditions still hold. The money enters the restricted civilian relief fund, not the recipient's general treasury."
 eon_humanitarian_aid_reject_title:0 "Civilian relief proposal declined"
 eon_humanitarian_aid_reject_desc:0 "The proposal closes without any payment, debt, refund or political penalty."
 eon_withdraw_humanitarian_aid:0 "Withdraw civilian relief offer"
 eon_withdraw_humanitarian_aid_desc:0 "Withdraw the outstanding civilian relief proposal before acceptance."
 eon_humanitarian_aid_withdraw_desc:0 "Withdraw this offer without payment? Its original reply remains reserved until the recipient closes it or its 30-day period ends. If it expires unanswered, this directed partner remains unavailable for new humanitarian offers."
 eon_humanitarian_aid.1.t:0 "Civilian relief funded"
 eon_humanitarian_aid.1.d:0 "The recipient consented and all final conditions held. The donor paid 100 million into the recipient's restricted civilian relief fund. The balance finances civilian relief and can remain available for future needs. There is no loan, influence reward or military access."
 eon_humanitarian_aid.2.t:0 "Civilian relief proposal closed"
 eon_humanitarian_aid.2.d:0 "The proposal was declined, withdrawn or no longer met the conditions for payment. No money was transferred."
 eon_humanitarian_aid.3.t:0 "Civilian relief offer withdrawn"
 eon_humanitarian_aid.3.d:0 "The donor withdrew the proposal before acceptance. No money was transferred. The original reply may still be closed safely."
 eon_humanitarian_aid.4.t:0 "Civilian relief proposal expired"
 eon_humanitarian_aid.4.d:0 "The reply period ended, the partner ceased to exist, or the proposal could no longer be identified safely. No payment was made. A known directed pair remains retired to prevent an old reply from authorizing a later proposal. Other eligible partners remain available. An unidentified corrupted record closes this donor's humanitarian offer channel."
 eon_humanitarian_aid.ack:0 "Understood"
 eon_humanitarian_aid_acceptance:0 "Civilian relief needs"
