l_english:
 eon_open_economic_consultations:0 "Open Economic Consultations"
 eon_open_economic_consultations_desc:0 "Prepare a bilateral discussion about trade, electricity or economic support."
 eon_open_economic_consultations_send_desc:0 "Choose one topic for discussion with [THIS.GetNameWithFlag]. Opening or cancelling the agenda costs nothing. Sending the invitation costs 10 political power. The partner must consent before a 30-day consultation channel opens. Talks do not sign a treaty, transfer funds or change an existing contract."
 eon_consultation_open_ready_tt:0 "Both countries exist, are at peace with each other and are free of another economic consultation. This pair has no unresolved older consultation response and its 90-day contact cooldown has ended. No great-power rank or common government is required."
 eon_consultation_agenda_title:0 "Choose an Economic Agenda"
 eon_consultation_agenda_desc:0 "Prepare talks with [From.GetName]. Select trade, electricity or economic support. Sending costs §Y10 political power§! and gives the partner 30 days to respond. The draft can be cancelled without cost. An agreed channel lasts 30 days and either side can end it. A concrete treaty or grant still needs its own terms, eligibility and consent."
 eon_consultation_topic_trade:0 "Discuss trade and commercial cooperation"
 eon_consultation_topic_energy:0 "Discuss electricity supply and current contracts"
 eon_consultation_topic_support:0 "Discuss economic assistance and debt relief"
 eon_consultation_cancel_agenda:0 "Close the agenda without sending"
 eon_consultation_trade_invite_title:0 "Invitation to Trade Consultations"
 eon_consultation_trade_invite_desc:0 "[From.GetName] asks to discuss trade and commercial cooperation. Agreeing opens a 30-day discussion channel; it does not sign or cancel a trade agreement. Any concrete proposal must still pass the ordinary diplomatic conditions, pay its own cost and obtain separate consent. We may decline this invitation without a penalty."
 eon_consultation_energy_invite_title:0 "Invitation to Electricity Consultations"
 eon_consultation_energy_invite_desc:0 "[From.GetName] asks to discuss electricity supply and current contracts. Agreeing opens a 30-day discussion channel. Existing deliveries and payments continue under their current terms. Quantity and price must be proposed and accepted separately in the energy controls. We may decline this invitation without a penalty."
 eon_consultation_support_invite_title:0 "Invitation to Economic Support Consultations"
 eon_consultation_support_invite_desc:0 "[From.GetName] asks to discuss economic assistance or debt relief. Agreeing opens a 30-day discussion channel; it does not commit either treasury. During these talks either eligible government can prepare a separate one-time grant through diplomacy. A grant or debt payment still requires its original financial and national conditions and the recipient's consent."
 eon_consultation_cancelled_invite_desc:0 "The initiator withdrew this invitation before agreement. These consultations did not begin. Close this response to release the pair. The political effort already spent on preparing the invitation is not refunded."
 eon_consultation_stale_invite_desc:0 "This invitation no longer matches an available consultation between its original participants on this topic. It cannot open a discussion channel or affect another current consultation. Close this old response."
 eon_consultation_accept_talks:0 "Agree to discuss this topic"
 eon_consultation_decline_talks:0 "Decline or close this invitation"
 eon_withdraw_consultation_request:0 "Withdraw Consultation Invitation"
 eon_withdraw_consultation_request_desc:0 "Withdraw an unanswered consultation invitation to this country."
 eon_withdraw_consultation_request_send_desc:0 "Withdraw this invitation. The original receiving government must close its response before either side can start another consultation. The 10 political power spent on preparation is not refunded. Existing agreements continue."
 eon_consultation_withdraw_tt:0 "This country holds our matching unanswered invitation. Withdrawal prevents agreement; the original response still has to be closed. Preparation effort is already spent."
 eon_end_economic_consultations:0 "End Economic Consultations"
 eon_end_economic_consultations_desc:0 "Close the active discussion channel with this country."
 eon_end_economic_consultations_send_desc:0 "Close the consultation channel without additional cost. Trade, energy contracts, grants and debt proposals are separate agreements and continue through their own rules. Ending talks does not cancel them."
 eon_consultation_end_tt:0 "Both countries hold the same agreed consultation channel. Either government may end these talks; existing contracts remain separate."
 eon_consultation_offer_economic_aid:0 "Prepare an Economic Grant after Consultations"
 eon_consultation_offer_economic_aid_desc:0 "Use the agreed economic-support channel to prepare a separate one-time grant."
 eon_consultation_offer_economic_aid_send_desc:0 "Open the ordinary grant selection for [THIS.GetNameWithFlag]. Existing influence, economic, national and treasury conditions still apply. Preparing the amount sends no money. Sending a funded grant and its later acceptance follow the normal aid process. Talks alone authorize no payment."
 eon_consultation_aid_followup_tt:0 "A matching economic-support channel is active, and the ordinary aid conditions allow us to prepare a grant to this country. This starts a separate aid draft and grants no exemption from its funding or recipient consent."
 eon_consultation_ack:0 "Understood"
 eon_consultation.20.t:0 "Trade Consultations Agreed"
 eon_consultation.20.desc:0 "The partner agreed to discuss trade. A 30-day bilateral channel was opened. Use the ordinary trade proposal to negotiate a concrete agreement; its national conditions, political cost and separate consent still apply. This invitation did not create or cancel a treaty."
 eon_consultation.21.t:0 "Electricity Consultations Agreed"
 eon_consultation.21.desc:0 "The partner agreed to discuss electricity. A 30-day bilateral channel was opened. Use the energy controls to propose a quantity and price, or the existing counteroffer process to revise a delivery. Agreed supplies and payments continue until separately changed."
 eon_consultation.22.t:0 "Economic Support Consultations Agreed"
 eon_consultation.22.desc:0 "The partner agreed to discuss economic support. A 30-day bilateral channel was opened. Eligible governments can prepare a separate grant through diplomacy; debt relief has its own proposal. No money was promised, held or transferred by these talks."
 eon_consultation.23.t:0 "Consultation Invitation Declined"
 eon_consultation.23.desc:0 "The receiving government declined this consultation invitation. No discussion channel or agreement was created. Neither side receives a refusal benefit or penalty. The initiator's preparation effort remains spent."
 eon_consultation.24.t:0 "Consultation Invitation Withdrawn"
 eon_consultation.24.desc:0 "The invitation was withdrawn before agreement and cannot be accepted. Closing its original receiving response releases any remaining reservation. No agreement or payment followed from this invitation, and preparation effort is not refunded."
 eon_consultation.25.t:0 "Consultation Invitation No Longer Valid"
 eon_consultation.25.desc:0 "The invitation could no longer be agreed under its original participants, topic or current conditions. These talks did not begin. No treaty, money or refusal benefit was applied."
 eon_consultation.26.t:0 "Unanswered Consultation Expired"
 eon_consultation.26.desc:0 "The agenda or invitation expired before its original response was consumed. These talks did not begin. This pair is closed to new consultation invitations in this campaign; other partners remain available. Existing agreements continue, and any preparation effort already spent is not refunded."
 eon_consultation.27.t:0 "Economic Consultations Ended"
 eon_consultation.27.desc:0 "The agreed discussion channel ended. Its original topic created no binding commitment by itself. Existing treaties, energy deliveries, grants and debt proposals continue through their own rules."
