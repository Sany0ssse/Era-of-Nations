 pacifist_president_trait: "Pacifist President"
 true_inheritor_trait: "The True Inheritor"
 #Navalny
 SOV_navalny_sweeps_streets: "Navalny Sweeps the Streets"
 SOV_navalny_sweeps_streets_desc: "A young lawyer from the provinces, Alexei Navalny turns anti-corruption crusading into political power, his early investigations shaking the country. He takes to the streets as president - not with a broom, but with the people's mandate."
 SOV_directed_democratization: "Directed Democratization"
 SOV_directed_democratization_desc: "Knowing that a rotten bureaucracy will kill any reform if given time, Navalny declares a state of emergency - not to crush freedoms, but to break old chains in months, a risky leap toward a new Russia."
 SOV_mobilize_navalny_teams: "Mobilize Navalny Headquarters"
 SOV_mobilize_navalny_teams_desc: "The network that once tracked the wealth of the elite now tracks the loyalty of governors. Regional headquarters, built by volunteers during mass protests, become levers of state power, and separatists fall silent."
 SOV_government_of_national_trust: "Government of National Trust"
 SOV_government_of_national_trust_desc: "Navalny assembles a coalition of liberals, social democrats, greens, and libertarians - a 'government of national trust.' The old guard calls it 'the ministry of foreign agents,' but he calls it the only way to heal Russia."
 SOV_turn_security_apparatus_against_oligarchs: "Turn the Security Apparatus Against Oligarchs"
 SOV_turn_security_apparatus_against_oligarchs_desc: "The security services, once the oligarchs' shield, become their sword. Navalny redirects them to investigate illegal privatizations, money laundering, and offshore schemes - turning the wolves upon the wolves."
 SOV_revolution_from_both_sides: "Revolution from Both Sides"
 SOV_revolution_from_both_sides_desc: "Pressure from the streets and pressure from the state create a two-front war against the old system. Mass rallies and administrative purges break resistance, at the cost of stability and democratic niceties."
 SOV_committee_of_seven: "Committee of Seven"
 SOV_committee_of_seven_desc: "Navalny quietly establishes a secret circle of seven loyal ministers and aides who meet behind closed doors. No protocols, no transparency - just fast decisions. 'Democracy is beautiful, but too slow for change,' one member jokes."
 SOV_state_television_reform: "State Television Reform"
 SOV_state_television_reform_desc: "Navalny shatters the infamous 'zombie box' by restructuring state TV, replacing propaganda with pluralism. For the first time, protest coverage appears on the evening news, and the old guard calls it 'surrender of the airwaves.'"
 SOV_between_left_right: "Between the Left and the Right"
 SOV_between_left_right_desc: "A historic choice looms: one path leads toward liberal reforms and Western integration, the other toward a national agenda of state sovereignty and traditional values. Navalny cannot walk both, and his decision shapes Russia's identity for generations."
 SOV_liberal_agenda: "Liberal Agenda"
 SOV_liberal_agenda_desc: "Navalny chooses a Westernizing path: privatization, European integration, visa-free travel. The left flank is outraged, but only liberal democracy can break the cycle of autocracy."
 SOV_national_agenda: "National Agenda"
 SOV_national_agenda_desc: "Navalny adopts a 'Russia first' agenda: state control over key industries, a firm line on the post-Soviet space, and traditional values. Liberals are disillusioned, while nationalists applaud."
 SOV_anti_corruption_bureau: "Anti-Corruption Bureau"
 SOV_anti_corruption_bureau_desc: "Navalny establishes a powerful National Anti-Corruption Bureau, granting it sweeping powers for independent investigations, asset seizures, and direct access to financial records - a move that makes the oligarchs tremble at the prospect of finally facing justice."
 SOV_encourage_all_russian_secularisation: "Encourage the All-Russian Secularisation"
 SOV_encourage_all_russian_secularisation_desc: "Navalny signs a decree on the secular character of the state. The Orthodox Church loses privileged access to education and state property, the word 'God' disappears from army anthems, and the clergy rages."
 SOV_acknowledge_lead_role_orthodox_church: "Acknowledge the Lead Role of the Orthodox Church"
 SOV_acknowledge_lead_role_orthodox_church_desc: "In a pragmatic turn, Navalny meets with the Patriarch and acknowledges 'the special role of Orthodoxy in Russia's history.' In return, the Church refrains from political intervention - a fragile truce."
 SOV_legalization_firearms: "Legalization of Firearms"
 SOV_legalization_firearms_desc: "The government legalizes firearms for self-defense, fulfilling a long-standing libertarian demand. Police costs drop, but conservatives worry about chaos - some cheer, others weep."
 SOV_forced_regional_democratisation: "Forced Regional Democratisation"
 SOV_forced_regional_democratisation_desc: "Moscow imposes democratic reforms on reluctant regions - direct elections of governors, independent local courts, and civil society oversight. Separatist sentiments fade as regions gain real autonomy."
 SOV_expansion_minorities_rights: "Expansion of Minorities Rights"
 SOV_expansion_minorities_rights_desc: "Minority rights expand: native language education, cultural autonomy, and protection from discrimination. Ethnic republics rejoice while Russian nationalists fume."
 SOV_supremacy_russian_language: "Supremacy of Russian Language"
 SOV_supremacy_russian_language_desc: "Russian is declared the sole state language. Minority languages are tolerated but not promoted - nationalists celebrate, minority leaders protest 'cultural genocide.'"
 SOV_fight_economic_injustice: "Fight Against Economic Injustice"
 SOV_fight_economic_injustice_desc: "Healthcare and education spending double, the minimum wage rises, and a one-time 'oligarch tax' funds social programs. Inflation rises, but the poor finally feel hope."
 SOV_investigate_state_corporations: "Investigate the State Corporations"
 SOV_investigate_state_corporations_desc: "For decades, VTB, Rosneft, Russian Railways, and Gazprom have lived by their own rules - their offshore accounts, inflated contracts, and political kickbacks hidden behind a wall of secrecy. But the Anti-Corruption Foundation will tear down that wall. A sweeping series of investigations will expose the truth: how billions are siphoned abroad, how tenders are rigged, and who pockets the money. No one knows where these probes will lead or whom they will implicate. The oligarchs and the old bureaucracy watch in cold terror - because for the first time, their secret world is about to be cracked open."
 SOV_introduce_visa_regime_central_asia: "Introduce the Visa Regime for Central Asia"
 SOV_introduce_visa_regime_central_asia_desc: "Navalny introduces visa requirements for Central Asian and Caucasus nations, fulfilling a long-standing nationalist demand. Migrant flows slow, but diplomatic tensions spike."
 SOV_economic_security_russia_its_people: "Economic Security for Russia and Its People"
 SOV_economic_security_russia_its_people_desc: "The government launches a comprehensive economic security program: import substitution, support for domestic manufacturers, and protection against global market shocks - resilience, not isolation."
 SOV_stimulate_russian_business: "Stimulate the Russian Business"
 SOV_stimulate_russian_business_desc: "Tax breaks, deregulation, and state-backed loans ignite a small business boom, as offices, workshops, and startups appear across the country and the middle class begins to grow."
 SOV_real_leader_cis: "The Real Leader of the CIS"
 SOV_real_leader_cis_desc: "Navalny invites CIS members to a Moscow economic summit, offering free trade, joint industrial projects, and a new dispute resolution mechanism - Russia seeks partnership, not empire."
 SOV_visit_taiwan: "Visit Taiwan"
 SOV_visit_taiwan_desc: "Navalny visits Taiwan, angering Beijing but boosting ties with the tech powerhouse - pragmatic economic gains outweigh diplomatic risks, for now."
 SOV_russian_monopoly: "The Russian Monopoly"
 SOV_russian_monopoly_desc: "Russian corporations expand into CIS markets, buying energy assets, telecoms, and banks - Moscow's economic footprint grows silently."
 SOV_environment_entrepreneurship: "Environment for Entrepreneurship"
 SOV_environment_entrepreneurship_desc: "Free enterprise zones are established in Kaliningrad, Primorye, and the Far East, as investors flock in, infrastructure booms, productivity soars, and the Russian economic miracle takes off."
 SOV_economic_expansion_baltics: "Economic Expansion into the Baltics"
 SOV_economic_expansion_baltics_desc: "Baltic states are offered massive investments in ports, rail, and energy grids - the offer splits the Baltic front, with some tempted and others fearing 'creeping annexation by capital.'"
 SOV_true_inheritor: "The True Inheritor"
 SOV_true_inheritor_desc: "Navalny declares himself the true inheritor of both the Soviet and Imperial legacy - not as a dictator, but as a reformer who will complete the modernization neither empire could achieve."

 #Navalny Events
 sov_navalny.0.t: "Mr. Navalny and the Anti-Corruption Movement"
 sov_navalny.0.d: "One of the chronic problems of modern Russia, which it inherited from the late USSR, is rampant corruption. The problem became apparent in the 90s, when scandals about corruption schemes involving high-ranking officials became the norm against the backdrop of the population's total impoverishment. No one even thot about taking to the streets because some governor built himself a villa when people had to think about where to get food and pay for utilities with a salary of 1 dollar. However, in the new millenium, everything changed.\nWith the departure of Yeltsin and the beginning of economic recovery, people no longer needed to think about their survival and how to feed their families, and society began to pay attention to other issues, including corruption. The main discontent with the situation came from the generation of the 80s, who were raised during the era of perestroika and the wild 90s, and for whom the idea of a Western standard of living, democracy, and justice is not an empty sound. More and more discontent began to be stirred by news of officials' corruption schemes, and more and more people started taking to the streets in protest. Thus, the Anti-Corruption Movement was born.\nThe main figure of this protest became the previously unknown lawyer, entrepreneur, and activist Alexei Navalny, whose posts in LiveJournal and other social networks about rampant corruption in state companies, courts, and government positions began to attract public attention, and people of different views but with a common goal gathered around him—to achieve justice, the rule of law, democracy, and a decent standard of living in Russia.\nProtests and rallies are sweeping across the country, slogans like 'Russia without corruption' have entered the lexicon of every opposition politician, and Alexei Navalny himself has already announced his readiness to participate in regional and federal elections, as well as is already working on creating a network of his organizations and headquarters. And no matter how controversial Navalny's figure may be, his ability to persuade makes him almost a leader of the Anti-Corruption Movement."
 sov_navalny.0.a: "This might be a problem someday"
 sov_navalny.1.t: "The People's Inauguration"
 sov_navalny.1.d: "In an unprecedented turn of events, Alexei Navalny takes the oath of office not in the gilded halls of the Kremlin, but from a podium on Bolotnaya Square. Before him stretches a sea of supporters - a living testament to the movement that brought him to power.\n\n'I want to become president,' his voice echoes through the loudspeakers. 'I want to change life in this country. I want to change the system of governance. I want 140 million people to live normally. Like a European country.'\n\nThe crowd roars its approval. Under the old system, Bolotnaya was a place of protests against falsified elections. Today, it becomes the place where the new leader swears an oath to a different Russia - one that does not deceive its citizens.\n\nThe symbolism is clear: the old rules are dead. 'The slogan \"Don't lie, don't steal\" is not a rhetorical exclamation - it is the essence of our reforms,' the president-elect declares, his words a public indictment of the previous regime.\n\n'Fighting corruption is not an abstraction. It reaches into the pocket of every one of us. Believe me: today, here and now, we begin this fight!' As the chants of 'Russia will be free!' fill the square, the old world order crumbles, and a new, unpredictable era begins."
 sov_navalny.1.a: "Russia will be free!"
 sov_navalny.2.t: "Million-Strong Rally in Moscow"
 sov_navalny.2.d: "Moscow's streets have turned into a sea of white ribbons and smartphone lights. An estimated one million people gathered on Bolotnaya Square and along the embankment to show their support for the new president, Alexei Navalny. It is the largest political demonstration in post-Soviet history.\n\n'I did not just become president,' Navalny shouted from the podium. 'We chose a new life. Today, fear has lost. Hope has won.'\n\nWestern leaders cautiously applaud the peaceful transfer of power. Autocrats from Minsk to Baku watch with visible anxiety. Russian state television, now under new management, broadcasts the rally live - something unthinkable just months ago.\n\nThe chants of 'Russia will be free!' echo across the square. For the first time in decades, the Kremlin is not a fortress under siege. It is a stage for the people."
 sov_navalny.2.a: "Is this really happening?"
 sov_navalny.3.t: "Democracy Protection Emergency"
 sov_navalny.3.d: "President Navalny declares a state of emergency - not to suppress freedoms, but to 'speed up the demolition of the old system'. Regional executives are suspended, anti-corruption courts are established, and 'anti-democratic parties' are temporarily banned. 'I fiercely hate those who sold out our historic chance,' Navalny declares. 'The party of crooks and thieves must be dismantled now.' Critics call it a power grab. Supporters see it as the only way to break the bureaucracy. Russia holds its breath."
 sov_navalny.3.a: "A risky but necessary step."
 sov_navalny.4.t: "Regional Headquarters in Action"
 sov_navalny.4.d: "Navalny's regional headquarters - once grassroots protest hubs - are now levers of federal pressure. Local governors receive 'suggestions' from the Kremlin: cooperate or face anti-corruption investigations, street protests, and loss of funding. One by one, the regions fall in line, separatist whispers fade, and the center tightens its grip. In the corridors of the Kremlin, officials whisper: 'The headquarters are now the eyes and ears of the new power.'"
 sov_navalny.4.a: "The People's Headquarters deliver."
 sov_navalny.5.t: "Coalition Government Takes Shape"
 sov_navalny.5.d: "President Navalny's 'government of national trust' is now complete. The new cabinet includes Ilya Yashin, Leonid Volkov, Dmitry Gudkov, economist Vladimir Milov, libertarian Mikhail Svetov, and environmental activist Evgenia Chirikova. 'We are building a coalition of all those ready to work for a new Russia - not for posts, but for results,' the president's office states. The old elites call it 'the ministry of foreign agents.' Citizens cautiously welcome the renewal. Western capitals applaud the shift toward broad parliamentary democracy. Russia enters uncharted waters."
 sov_navalny.5.a: "A coalition of hope - but will it hold?"
 sov_navalny.6.t: "The Committee of Seven"
 sov_navalny.6.d: "President Navalny quietly establishes a secret inner circle of seven trusted officials from the government and presidential administration. No protocols, no public records - just quick decisions behind closed doors. 'Democracy is beautiful,' one member jokes, 'but it's too slow for change.' Supporters call it efficient governance. Critics whisper about a 'shadow junta.'"
 sov_navalny.6.a: "What is Navalny building?"
 sov_navalny.7.t: "State Television Reform"
 sov_navalny.7.d: "President Navalny signs a decree restructuring state-controlled television. The infamous 'zombie box,' as he once called it, is being transformed. New management is installed, protest coverage is no longer banned, and opposition voices finally get airtime. 'We have learned how to get information to millions of people without it,' Navalny recalls his old words. Now, the state TV is forced to join the 21st century. The old guard calls it 'surrender of the airwaves.' Citizens watch in disbelief: for the first time, their protests appear on the evening news."
 sov_navalny.7.a: "The 'zombie box' changes its tune."
 sov_navalny.8.t: "The President's Crossroads"
 sov_navalny.8.d: "The coalition government trembles on the edge of a chasm. On one side, Yashin and Volkov demand a liberal breakthrough - privatization, visa-free travel, full European integration. 'We came to break the system, not to manage it,' they insist. On the other side, some ministers push for a national agenda: state control over key industries, a firm line on the post-Soviet space, and traditional values. 'Russia first,' they whisper.\n\nNavalny walks a tightrope. Every step toward the liberals alienates the nationalists - and vice versa. Polls show the nation is split almost equally. Advisers warn that leaning too far to either side could tear the government apart. Yet indecision is also a choice, and it breeds paralysis. Now he must balance to stay in power."
 sov_navalny.8.a: "Lean toward the liberals"
 sov_navalny.8.b: "Lean toward the nationalists"
 sov_navalny.9.t: "The Secularisation Decree"
 sov_navalny.9.d: "President Navalny signs a decree: 'On the Secular Character of the State'. The Russian Orthodox Church loses privileged access to state property and education. The word 'God' disappears from army anthems. Islamic judges and religious schools face new restrictions. 'The state has gone crazy,' - a Moscow priest laments. In the North Caucasus, imams call it 'a war on our faith'. Protests erupt in Chechnya. Navalny defends himself: 'When I opposed new mosques for migrants, they called me an Islamophobe. Now I'm accused of fighting religion? We're just bringing the Constitution back.' European greens welcome the move. But in the mountains, separatist whispers grow louder."
 sov_navalny.9.a: "Forward to a secular state."
 sov_navalny.10.t: "The Patriarch's Blessing"
 sov_navalny.10.d: "President Navalny meets Patriarch Kirill in the Kremlin. The man who once fought the 'corrupt alliance' of Church and state now seeks its blessing. Hours of tense talks produce a delicate compromise: Navalny publicly 'acknowledges the special role of Orthodoxy in Russia's history,' while Kirill refrains from direct political intervention and offers a blessing for the president's reform agenda.\n\n'We are not enemies,' Navalny says afterward. 'My goal is a modern, European Russia. But pretending we can ignore 1,000 years of history would be naive.' The move is pragmatic: he needs political legitimacy for his reforms. Yet critics call it a betrayal, while nationalists and conservatives see it as a sign that the new president is 'one of us.'"
 sov_navalny.10.a: "A pragmatic blessing."
 sov_navalny.11.t: "Russia Imposes Visa Regime"
 sov_navalny.11.d: "President Navalny of Russia has signed a decree introducing a visa regime with our country, citing his old position: 'I see nothing valuable in people coming from Central Asia and the Caucasus to Russia. This is a key political demand. We need order.' The news hits our government like a thunderbolt - the ambassador is immediately recalled for emergency consultations, while our citizens in Russia face the real threat of deportation within six months. Diaspora leaders condemn the move as blatant discrimination, and even Russian regional governors warn of economic disruptions. Some analysts call the decision economic suicide for Russia itself, but others see it as a cheap populist gesture to boost Navalny's nationalist ratings. Whatever the case, our relations have never been worse."
 sov_navalny.11.a: "We will respond accordingly."
 sov_navalny.12.t: "Navalny Invites CIS Countries to the Economic Summit"
 sov_navalny.12.d: "Months after the visa decree that shocked the post-Soviet space, the Kremlin sends out a new message. President Navalny invites CIS members to Moscow for an economic summit. 'Let's be honest,' the invitation reads. 'Russia cannot be great by keeping others small. We offer cooperation that benefits everyone - not cheap gas for political loyalty.'\n\nThe agenda includes a free trade zone, lifting import bans on 'unfriendly' countries, and joint industrial projects. 'Our goal is not to hold anyone hostage,' Navalny writes, 'but to create a space where all of us can become stronger, whether together or on our own. The choice is yours.'\n\nObservers note the irony. The same man who pushed for visa barriers with Central Asia and the Caucasus now offers partnership. Some members are confused. Others are tempted. The offer is generous - but can Navalny be trusted?"
 sov_navalny.12.a: "Accept the invitation - but stay cautious."
 sov_navalny.12.b: "We do not trust him."
 sov_navalny.13.t: "[FROM.GetName] Joins the Moscow Economic Summit"
 sov_navalny.13.d: "[FROM.GetName] has accepted President Navalny's invitation to the economic summit in Moscow. Despite the recent visa tensions, the leadership of this CIS member has decided to give the new Kremlin a chance. 'We are not prisoners of the past,' a spokesperson for [FROM.GetName] commented. 'If Russia offers real cooperation without imperial habits, we are ready to negotiate.'\n\nThe summit will now proceed with a broader agenda. Joint industrial zones, free trade talks, and a new mechanism for resolving disputes are on the table. For [FROM.GetName], the decision comes with risks: conservative elites at home accuse the government of bending to a 'liberal Kremlin,' but the promised economic benefits are hard to ignore. Trade flows are expected to rise, and investors are watching closely. A new chapter in post-Soviet relations may be opening - cautiously, but undeniably."
 sov_navalny.13.a: "A pragmatic partner joins the table."
 sov_navalny.14.t: "[FROM.GetName] Declines the Summit Invitation"
 sov_navalny.14.d: "[FROM.GetName] has rejected President Navalny's invitation to the Moscow economic summit. Citing 'unpredictable policies' and the recent visa decree, the leadership of this CIS member has chosen to stay away. 'We cannot build partnerships with a country that treats our citizens as threats,' an official statement reads.\n\nObservers see this as a victory for conservative forces within [FROM.GetName] who distrust Navalny's liberal agenda. Trade barriers will remain, and the old patterns of suspicion persist. The Kremlin expresses regret but notes that 'the door remains open for those ready for equal dialogue.' For now, the post-Soviet space remains divided - between those willing to risk change and those clinging to the past."
 sov_navalny.14.a: "Their loss."
 sov_navalny.15.t: "Russia's Baltic Investment Forum"
 sov_navalny.15.d: "St. Petersburg is hosting the Baltic Investment Forum, where President Navalny presents a 'generous' offer to our country. 'The era of blackmail and gas pressure is over,' he states. 'We propose large-scale joint investments in ports, logistics, and energy projects. Russia is ready to finance up to 70% of these initiatives, opening its market wide for Baltic exports in return.'\n\nThe proposal is tempting but divisive. Some welcome the economic boost; others call it 'creeping annexation by capital.' The Kremlin hopes billions in investments will be enough to crack the Baltic front. Our decision will shape our relations with Russia for years to come."
 sov_navalny.15.a: "Pragmatism over suspicion."
 sov_navalny.15.b: "We do not trust Navalny's Russia."
 sov_navalny.16.t: "[FROM.GetName] Accepts Our Investment Offer"
 sov_navalny.16.d: "[FROM.GetName] has agreed to participate in large-scale joint infrastructure projects funded by Russia. Ports will be modernized, logistics chains integrated, and Russian markets opened for their exports. The old suspicions remain, but economic pragmatism has won - at least for now. The Kremlin welcomes this step toward a 'new economic architecture' in the Baltic region. Critics warn of growing dependency, but the deal is signed."
 sov_navalny.16.a: "A crack in the Baltic front."
 sov_navalny.17.t: "[FROM.GetName] Declines Our Investment Offer"
 sov_navalny.17.d: "[FROM.GetName] has rejected the investment offer, citing the recent visa decree and 'unpredictable Kremlin policies.' 'We cannot build economic partnerships with a country that treats our citizens as threats,' an official statement reads. The decision is a victory for conservative forces in the Baltics who distrust Navalny's liberal agenda. The Kremlin expresses regret but notes that 'the door remains open for those ready for equal dialogue.' For now, the Baltic front holds."
 sov_navalny.17.a: "We will try elsewhere."
 sov_navalny.18.t: "Baltics in the Spotlight"
 sov_navalny.18.d: "The historic halls of St. Petersburg are hosting the Baltic Investment Forum, a high-stakes gambit by President Navalny to break the post-Soviet ice with the Baltic states. Delegations from several Baltic countries are present, along with EU observers and nervous Kremlin officials. The agenda is thick: joint port modernisation, railway upgrades, cross-border energy grids, and Russian market access for Baltic food and electronics.\n\nNavalny's opening speech is strikingly pragmatic: 'We cannot erase geography. The Baltic Sea will always connect us. The question is whether we use it as a barrier or a bridge.' He promises legislative guarantees against political pressure and fast-track arbitration for disputes.\n\nReactions are sharply split between those who see an economic renaissance for a region long dependent on fickle Western capital and those who warn of 'creeping annexation by cheque,' while EU diplomats lurk in the corridors trying to assess whether this is genuine détente or a Trojan horse. No one knows how this will end, but the world is watching as Russia offers to invest billions where it once wielded gas pipelines as weapons, leaving Baltic elites tempted and Brussels anxious about the future of the Eastern Baltic."
 sov_navalny.18.a: "A risky gamble."
 sov_navalny.19.t: "The VTB Investigation Begins"
 sov_navalny.19.d: "The Anti-Corruption Foundation releases its first blockbuster investigation under President Navalny's direct authority. The target: VTB, one of Russia's largest state-owned banks. The report, titled 'VTB: The Offshore Empire', alleges that top executives funneled billions of rubles through shell companies in Cyprus and the British Virgin Islands, using fake consultancy contracts and inflated IT procurement deals. The evidence includes leaked bank statements, flight logs, and recordings of compromising conversations.\n\n'The money that should have built schools and roads ended up in Swiss accounts and London real estate,' Navalny states at a press conference. 'We are not just naming names. We are going after every single ruble.'\n\nVTB's press service dismisses the claims as 'politically motivated slander.' But within hours, the Prosecutor General's office opens a formal inquiry. The bank's shares plummet on the Moscow Exchange. The old elites watch in horror - VTB is only the first. Behind the scenes, investigators are already poring over documents from Rosneft, Gazprom, and Russian Railways.\n\n'They thought they were untouchable,' one FBK insider whispers. 'Now they will learn that no one is above the law.'"
 sov_navalny.19.a: "The hunt begins"
 sov_navalny.20.t: "Russian Railways Derailed"
 sov_navalny.20.d: "The Anti-Corruption Foundation turns its spotlight on Russian Railways, the state-owned monopoly that manages the country's entire rail network. The investigation, titled 'Tracks of Corruption', uncovers a web of inflated construction contracts, kickbacks from rolling stock suppliers, and offshore accounts tied to senior executives. Billions of rubles allocated for modernizing the Trans-Siberian Railway and upgrading suburban trains allegedly disappeared into private pockets.\n\n'While passengers froze on dilapidated platforms, the bosses were buying yachts and apartments in Monaco,' Navalny says at a briefing. 'We will not stop until every corrupt official is behind bars.'\n\nThe Kremlin gives the green light for criminal cases against several top managers. Shares in Russian Railways-linked companies tumble. The old elites are now certain: no state-owned giant is safe. And the investigators are already sharpening their knives for the next targets - the oil and gas behemoths, Rosneft and Gazprom."
 sov_navalny.20.a: "Next stop: the oil giants"
 sov_navalny.21.t: "Rosneft: The Kremlin's Cash Cow"
 sov_navalny.21.d: "The Anti-Corruption Foundation releases its most explosive investigation yet: 'Rosneft - The Kremlin's Cash Cow'. The report details how billions in oil revenues were diverted through opaque trading intermediaries, inflating costs and enriching a tight circle of insiders. Leaked contracts show that Rosneft overpaid for foreign acquisitions and pipeline construction by hundreds of millions of dollars, with kickbacks flowing back to senior executives and their political patrons.\n\n'They treated our natural resources as their personal ATM,' Navalny declares, presenting the evidence live on television. 'While ordinary Russians paid at the pump, these people filled their offshore accounts.'\n\nThe government orders the seizure of assets linked to the schemes. The Rosneft board is shaken. But the investigation does not stop here - Gazprom is next. The old elites no longer watch in horror; they begin to panic."
 sov_navalny.21.a: "Moving on"
 sov_navalny.22.t: "Gazprom: The Pipe That Never Ends"
 sov_navalny.22.d: "After months of relentless work, the Anti-Corruption Foundation releases its final investigation in the series: 'Gazprom - The Pipe That Never Ends'. The report exposes how Europe's largest gas company became a private treasury for the old elite. Offshore schemes, inflated construction costs for pipelines like Nord Stream and Power of Siberia, and secret payments to intermediaries are laid bare.\n\n'They sold our gas, our future, and our security,' Navalny states in a televised address. 'Gazprom was not an energy company. It was a criminal enterprise disguised as a state corporation.'\n\nThe evidence includes wire transfers, witness testimonies, and internal memos showing systematic looting. The government orders the arrest of several board members. Gazprom's shares collapse. The old elites, who once thought themselves untouchable, now face the real prospect of prison.\n\nWith this investigation, the anti-corruption crusade reaches its peak. No state giant remains unexamined. The message is clear: the era of impunity is over."
 sov_navalny.22.a: "The final blow"

 #Navalny Ideas
 SOV_forced_democratisation_idea: "Forced Democratisation"
 SOV_forced_democratisation_idea_desc: "The new president has declared a state of emergency to accelerate the demolition of the old system. Regional executives are suspended, anti-corruption courts are established, and anti-democratic parties are banned. Critics call it a power grab. Supporters see it as the only way to break the bureaucracy before it strangles any chance of reform."
 SOV_administrative_onslaught_idea: "Administrative Onslaught"
 SOV_committee_seven_idea: "The Committee of Seven"
 SOV_committee_seven_idea_desc: "Behind the Kremlin's ancient walls, a new power center operates without protocols or minutes, where seven insiders meet in secret to cut through red tape with surgical precision, leaving old-school bureaucrats fuming while young reformers cheer - democracy takes a backseat, but the engine of governance runs faster than ever."
 SOV_combating_illegal_migration_idea: "Combating Illegal Migration"
 SOV_cis_summit_agreement_idea: "Path to New Partnership"
 SOV_baltic_invest_idea: "Russia is Investing in Us"
 SOV_free_enterprise_zone_modifier: "Free Enterprise Zone"

