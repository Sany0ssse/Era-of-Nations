 ## Chechen Referendum Events
 russia.29.t: "Referendum on the Constitution of the Chechen Republic"
 russia.29.d: "Following the end of a brutal and bloody conflict, Chechnya now has the opportunity to return to peaceful life. The next question is the structure of its relationship with Moscow—will it remain fully integrated as a federal subject, or retain certain autonomies?"
 russia.29.o1: "Little autonomy won't hurt them"
 russia.29.o2: "I am ready to personally govern Chechnya"

 #######################################

 sov_vybory.2.t: "Putin Elected as President"
 sov_vybory.2.d: "Vladimir Putin has won the first round of the presidential election with 63.75% of the vote, with 99% of ballots counted. The opposition has questioned the legitimacy of the results, threatening to respond with mass protests. According to the latest data from the Central Election Commission, 65.3% of eligible voters participated in the election."
 sov_vybory.2.a: "Leader Again here!"

 sov_vybory.1.t: "Medvedev Elected as President"
 sov_vybory.1.d: "Dmitry Medvedev, First Deputy Prime Minister, has claimed a decisive and expected victory in the presidential election, succeeding Vladimir Putin. Though Medvedev promises a liberal policy shift, many believe that power remains firmly in Putin's hands."
 sov_vybory.1.a: "Let's see how he does!"


 rusboloto.1.t: "Protests in Moscow!"
 rusboloto.1.d: "Frustrated by yet another political power shuffle, massive protests have erupted in Moscow. Estimates range from 25,000 to 150,000 people. Demonstrations for fair elections have taken place in 99 Russian cities and 45 cities abroad. The sudden scheduling of a school exam by the Moscow Department of Education only worsened public anger. Protesters, armed with homemade signs, are demanding fair and transparent elections."
 rusboloto.1.a: "Crush them with law enforcement!"
 rusboloto.1.b: "If they want so..."

 rusboloto.2.t: "Increased Protests in Moscow!"
 rusboloto.2.d: "Despite police resistance, protesters continue to rally at Bolotnaya Square. Reports indicate several officers were injured by bottles and Molotov cocktails thrown from the crowd. Police responded by detaining oppositionists, but refrained from using gas. Organizers like Navalny and Udaltsov are now being investigated under laws concerning incitement to riots and violence against law enforcement."
 rusboloto.2.a: "Crush them with law enforcement (again)!"
 rusboloto.2.b: "Fine."

 rusboloto.3.t: "Protests Were Handled by the Police"
 rusboloto.3.d: "The protest movement has failed to meet its objectives and has been successfully suppressed by the authorities. The situation is now under control."
 rusboloto.3.a: "Wonderful"

 sov_other.2.t: "Communists Elected in Russia"
 sov_other.2.d: "In a major political shift, the Communist Party has returned to power in Russia. Promising to restore socialist order, they are now promoting a complete ideological transformation. The new leadership claims it is ready to turn Russia's future completely around—bringing the past back to life."
 sov_other.2.a: "New USSR?"

 sov_other.3.t: "Comedy Club Jokes About Our President"
 sov_other.3.d: "Comedians from the popular Armenian TV show Comedy Club recently joked about our newly elected president. Should we let it go or demand an apology for the disrespect?"
 sov_other.3.a: "Not yet."
 sov_other.3.b: "Ask them for apologies."

 sov_other.6.t: "Grand Russian March"
 sov_other.6.d: "Massive nationalist marches have recently taken place across Russia, involving nationalists, monarchists, Orthodox clergy, and pagan Rodnovers. Clashes occurred with ethnic minorities from Islamic republics. The situation is volatile and could escalate into something more dangerous."
 sov_other.6.a: "Russians — Forward!"

 sov_other.9.t: "Russia Supports Ukraine!"
 sov_other.9.d: "Russia's new democratic government has launched a diplomatic initiative to improve relations with Ukraine. It includes cultural integration, support for anti-corruption efforts, and proposals for mutual cooperation in building democratic institutions."
 sov_other.9.a: "Brothers forever!"
 sov_other.9.b: "Truth is in brotherhood"

 sov_other.10.t: "Russia Helps Us in Wiping Out Corruption!"
 sov_other.10.d: "Under a new anti-corruption agreement, Russia has assisted in the arrest and asset seizure of a major corrupt oligarch. This cooperation has dealt a significant blow to corruption in our country."
 sov_other.10.a: "Thanks"

 SOV_undo_putin_TT: "We will begin dismantling the lawless system of governance that preceded us!"
 SOV_nati_TT: "§YNationalist Battalions§! will join us"

 sov_other.11.t: "Massive Russian-NATO Military Exercises!"
 sov_other.11.d: "Following its pivot toward the West, Russia has initiated large-scale joint military exercises with NATO forces on Russian soil. These exercises symbolize a new era of cooperation and mutual trust."
 sov_other.11.a: "Once enemies, now friends."

 sov_other.12.t: "NATO Troops in Russia"
 sov_other.12.d: "As part of its new Western alignment, Russia has allowed NATO forces to be stationed on its territory to promote regional stability and shared security."
 sov_other.12.a: "Good.."

 SOV_combined_economic_system: "Combined Economic System"
 SOV_combined_economic_system_desc: "By forging a compromise between state institutions and oligarchic interests, we are crafting a uniquely Russian solution to economic recovery. Balance and control will define our path forward."

 SOV_oligarchic_republic: "Oligarchic Republic"
 SOV_oligarchic_republic_desc: "With the oligarchs having finalized their corporate mergers, a new era begins—an oligarch-run Russia, where private power dictates national policy."

 SOV_continue_etatist_rise: "Continue Etatist Rise"
 SOV_continue_etatist_rise_desc: "Russia cannot afford to be ruled by unruly clans of oligarchs who export our resources for their gain. We need firm leadership, and we are ready to deliver it."

 sov_other.13.t: "Russian Proposal..."
 sov_other.13.d: "The new democratic government of Russia has proposed a mutual linguistic agreement with Ukraine. Russian would gain official status in Ukraine, while Russia would promote Ukrainian-language education among ethnic Ukrainians. This initiative aims to foster peace, cultural exchange, and long-term friendship between our nations."
 sov_other.13.a: "Wonderful Idea!"
 sov_other.13.b: "Sorry, no"

 sov_other.14.t: "Ukraine Accepted Our Proposal!"
 sov_other.14.d: "Ukraine has agreed to our mutual linguistic integration proposal. A new era of cooperation has begun."
 sov_other.14.a: "Wonderful"

 sov_other.15.t: "Ukraine Denied Our Proposal!"
 sov_other.15.d: "Ukraine has rejected our offer of mutual linguistic integration and cooperation."
 sov_other.15.a: "Why?"

 #Liberals
 SOV_path_of_western: "Path of Westernism"
 SOV_path_of_western_desc: "The Cold War is over. Nationalism and communism lie in our past. The only way forward is democracy, toward the end of history. Embracing Western values and institutions will secure Russia's place in the modern world."
 SOV_liberals_modifier: "Internal Politics of The New Russia"
 SOV_liberals_modifier_desc: "The policy under Liberals rule is characterized by a concentration on Russia's economic growth and less concentration on military and political actions."
 #Yabloko Focus
 SOV_ripe_apple: "A Ripe Apple"
 SOV_ripe_apple_desc: "Founded in 1993 by Yavlinsky, Boldyrev and Lukin. 'Yabloko' means 'apple' - after their initials. A liberal democratic alternative to communist restoration and rising nationalism. For years it championed civil liberties, market reform with a human face, and an end to the 'power vertical'. Now a democratic president takes the Kremlin, and the apple is ripe."
 SOV_give_way_true_liberals: "Give Way to True Liberals"
 SOV_give_way_true_liberals_desc: "Yabloko relied on charismatic leadership during decades in opposition. Now power is in hand. Technocrats, regional activists, civil society lawyers who endured harassment under the old regime enter the government, and true reformers take office."
 SOV_destroy_oligarchs_by_oligarchs: "Destroy Oligarchs by Oligarchs"
 SOV_destroy_oligarchs_by_oligarchs_desc: "The 1990s privatisation created a handful of billionaires and a sea of resentment. Direct confrontation would trigger capital flight. Instead force them to compete: antimonopoly enforcement, transparent auctions, breaking up conglomerates. The state will referee, not loot."
 SOV_strengthen_party_institute: "Strengthen Party Institute"
 SOV_strengthen_party_institute_desc: "Under the old system the State Duma was a rubber stamp. Real decisions were made in the Kremlin's corridors. To build a genuine democracy, lower the electoral threshold to 3%, letting greens, regionalists and new left movements enter parliament."
 SOV_bargain_regions: "Bargain with Regions"
 SOV_bargain_regions_desc: "The 'power vertical' - a centralised chain from Moscow to village councils - was designed to prevent separatism but stifled local initiative. Now the Kremlin offers governors a compact: more budget autonomy in exchange for loyalty and democratic reforms at the regional level."
 SOV_depoliticize_siloviki: "Depoliticize Siloviki"
 SOV_depoliticize_siloviki_desc: "For too long the security services have been a shadow government - extralegal schemes, political appointments, silencing critics. The new administration ends this. Intelligence budgets audited, off-books funds banned, and officers must choose: security or politics, not both."
 SOV_adapt_economic_realities: "Adapt to Economic Realities"
 SOV_adapt_economic_realities_desc: "The inheritance is a budget swollen with oil revenues and distorted by crony contracts. No more printing money, no borrowing from friendly bankers. Emergency measures: freeze spending, renegotiate procurement, cut bureaucracy. Bitter medicine, but responsible countries live within their means."
 SOV_destroy_KGB: "Destroy KGB"
 SOV_destroy_KGB_desc: "The successor to the Soviet secret police still looms over Russian life. Unchecked by parliament, it harassed businesses and manipulated politics. Strip its political functions, place under parliamentary oversight, require judicial approval for surveillance warrants, and redirect resources to small business development."
 SOV_kill_power_vertical: "Kill Power Vertical"
 SOV_kill_power_vertical_desc: "The 1993 constitution gave the president near-absolute power: rule by decree, dismissal of parliament, appointment of judges as loyalists. A new settlement reduces the presidency to a mediating role, empowers the Duma, and creates an independent judicial council, making the president first among equals."
 SOV_reform_state_corporations: "Reform State Corporations"
 SOV_reform_state_corporations_desc: "Rosneft, Gazprom, Russian Railways - state giants became empires of patronage, boards filled with siloviki. Break them up, sell minority stakes through transparent IPOs, and use proceeds to fund pensions, infrastructure, and education. State ownership is a tool, not an ideology."
 SOV_all_russian_center_infectious_diseases: "All-Russian Center for Infectious Diseases"
 SOV_all_russian_center_infectious_diseases_desc: "The Soviet sanitary network crumbled in the 1990s. A new pandemic could kill millions. Create a modern biomedical cluster for diagnostics, vaccine development, and early warning. Health is national security, and young scientists will return from abroad."
 SOV_democratization_education_system: "Democratization of Education System"
 SOV_democratization_education_system_desc: "Education oscillated between indoctrination and chaotic marketisation. Introduce university autonomy, elected faculty councils, student governance. Schools teach critical thinking, not rote memorisation, because democracy cannot succeed if citizens are taught to obey."
 SOV_consolidation_european_left: "Consolidation with European Left"
 SOV_consolidation_european_left_desc: "Russia is part of Europe - culturally and politically. Social democrats and greens share our values: peace, social justice, environmental protection. Build a network of sister parties, host a Moscow summit of the European left, and coordinate on climate and labour rights to overcome the Cold War mentality."
 SOV_idealistic_liberalism: "Idealistic Liberalism"
 SOV_idealistic_liberalism_desc: "A wing of Yabloko argues that social democracy is a compromise. They prioritise human rights, European integration, and market deregulation above social spending. The left calls it a betrayal, and the party must choose."
 SOV_russian_green_deal: "Russian Green Deal"
 SOV_russian_green_deal_desc: "Russia's economy is built on fossil fuels - coal, oil, gas. This enriched oligarchs, polluted the air, devastated the Arctic. Launch a phased transition to renewable energy: wind, solar, green tech. Coal towns need support, but the future belongs to green growth."
 SOV_against_militarism: "Against Militarism"
 SOV_against_militarism_desc: "Conscription is a relic of total war - forcing young men into barracks, sending them to die for the ambitions of the old elite. Abolish conscription entirely for a professional, volunteer-based army focused on defence. Without a large draft pool, Russia cannot launch large-scale wars."
 SOV_homes_land_roads: "Homes-Land-Roads"
 SOV_homes_land_roads_desc: "Every Russian family receives a free plot of land - up to 60 hectares in Siberia and the Far East - to build their own home. The state finances roads, gas, electricity, and schools, creating 14 million new homeowners within seven years and turning the nation into a country of smallholders."
 SOV_protect_minorities: "Protect Minorities"
 SOV_protect_minorities_desc: "Russia is a multi-ethnic federation. The old regime used 'divide and rule' to maintain control. Reverse this with cultural autonomy, native language education, and regional self-government. Separatism is a risk, but trust and decentralisation manage it better than police and propaganda."
 SOV_doctrine_peaceful_approach: "Doctrine of Peaceful Approach"
 SOV_doctrine_peaceful_approach_desc: "The Cold War is over, but mutual distrust continues. Break the cycle by inviting NATO members to a Peace Summit in St. Petersburg. Agenda: mutual non-use of force, withdrawal from 'spheres of influence', joint non-strategic missile defence. Peace cannot be maintained by force; it can only be achieved through understanding."
 SOV_creative_freedom: "Creative Freedom"
 SOV_creative_freedom_desc: "Censorship and the fear of being labelled a 'foreign agent' have strangled Russian art and journalism. Repeal restrictive laws, abolish censorship bodies, end persecution of independent media. Artists and writers free to criticise - a creative society is prosperous, and the brain drain will reverse."
 SOV_investments_manufacturing_industry: "Investments in Manufacturing Industry"
 SOV_investments_manufacturing_industry_desc: "For decades Russia exported raw materials and imported finished goods - deindustrialisation and dependency. Launch state-supported reindustrialisation: tax breaks for manufacturing, infrastructure for industrial parks, government procurement favouring domestic producers. Resilience, not autarky, and a country that cannot make its own machines cannot be truly sovereign."
 SOV_tight_market_regulation: "Tight Market Regulation"
 SOV_tight_market_regulation_desc: "The wild capitalism of the 1990s left millions impoverished. Impose new rules: minimum wage tied to inflation, mandatory collective bargaining, curbs on monopolies. Corporations pay their fair share, because economic efficiency must serve social justice."
 SOV_judicial_reform: "Judicial Reform"
 SOV_judicial_reform_desc: "Russian courts were nicknamed 'telephone justice' - judges received instructions from prosecutors. Make courts independent with lifetime appointments, election of court chairs by judicial councils, jury trials for political cases, and a new anti-corruption bureau outside the prosecutor's office. The rule of law is the only guarantee against tyranny."
 SOV_inviolability_private_property: "Inviolability of Private Property"
 SOV_inviolability_private_property_desc: "The chaos of the 1990s made property rights a joke. Make them sacred: no expropriation without fair compensation, fast-track commercial courts, protection for minority shareholders. Small business owners - the backbone of the middle class - will no longer fear raiders, and the state exists to protect owners, not to prey on them."
 SOV_destroy_historical_hate: "Destroy Historical Hate"
 SOV_destroy_historical_hate_desc: "Radical parties - the nationalist LDPR, the neo-Nazi NBP, and the 'neutral communists' - exploited Russia's traumas to promote xenophobia and violence. Ban them, seize their assets, prosecute their leaders for inciting hatred. Democracy cannot tolerate those who pledge to destroy it, because tolerance is a contract, not a suicide pact."
 SOV_peoples_capitalism_program: "People's Capitalism Program"
 SOV_peoples_capitalism_program_desc: "The 1990s privatisation was a 'complete fiasco' - a handful of bankers became billionaires while millions lost their savings. Launch a second wave: transfer small businesses to employees, sell large enterprises through public IPOs with individual purchase caps, and ensure no single shareholder owns more than 10% - capitalism for the many, not the few."
 SOV_down_totalitarian_state: "Down with the Totalitarian State"
 SOV_down_totalitarian_state_desc: "The Soviet legacy is a mindset: the state owns the citizen, dissent is treason, power belongs to those with guns. Close this era. The state exists to serve the person: slash administrative and police budgets, repeal surveillance laws, review past political convictions. Russia will no longer be a 'power vertical' but a home for free people."
 #Yabloko Events
 sov_yabloko.0.t: "Yavlinsky Elected as President"
 sov_yabloko.0.d: "In a historic election, Grigory Yavlinsky has won the presidency. The leader of the Yabloko party has long argued that 'for the President of Russia there is only one program of action - this is the Constitution of the country, adopted by the entire people, and the laws adopted by the parliament of Russia'. Now he will finally have the chance to implement it - to dismantle the power vertical, end the rule of the siloviki and oligarchs, and make the Constitution a reality, not a decoration. His victory brings hope to millions - and fury to the old elites."
 sov_yabloko.0.a: "The future is a non-communist and non-criminal Russia."
 sov_yabloko.1.t: "A Reformist Cabinet"
 sov_yabloko.1.d: "In a move that has already divided the political establishment, the President has approved a new team drawn from Yabloko for the government and the Presidential Administration. Market liberals, institutional reformers, and civil society advocates alike are promising to modernize the state, curb corruption, and rebuild trust in public institutions. Yavlinsky has long insisted that 'the state exists to serve the person', and now, with true reformers finally taking office, supporters call it a long-overdue course correction, though critics warn that idealism alone will not hold the country together."
 sov_yabloko.1.a: "Let them work"
 sov_yabloko.2.t: "Competition Bears Fruit"
 sov_yabloko.2.d: "The deal with the oligarchs has worked. Forced to compete rather than collude, businesses are cutting costs, investing in innovation, and driving down consumer prices. Industrial efficiency is up, foreign partners are more willing to trade, and even the treasury benefits from increased economic activity. Yavlinsky's view that 'the number of oligarchs in Russia should tend to zero' has not been forgotten, but for now, even the old elites grumble in silence - because the numbers speak for themselves."
 sov_yabloko.2.a: "The market delivers."
 sov_yabloko.3.t: "The Regional Agreement"
 sov_yabloko.3.d: "The new reforms and the changing political landscape have unsettled the regional governors. Sensing an opportunity, President Yavlinsky offers them a deal: in exchange for their active support for democratization and loyalty to the federal center, they will receive greater economic and administrative autonomy. He has long warned that 'federalism that looks more like feudalism, when relations between the center and the regions are built on personal ties between a governor and the president' is dangerous. Now, critics call this a concession to separatism, but the government sees it as the only way to avoid a 'parade of sovereignties' while building a sustainable federation."
 sov_yabloko.3.a: "A balanced federation is our goal."
 sov_yabloko.4.t: "The Constitutional Reform"
 sov_yabloko.4.d: "President Yavlinsky signs a package of amendments that strips the presidency of its excess powers. No more rule by decree. No more dismissing the Duma at will. No more appointing judges as personal loyalists. The president becomes primus inter pares - first among equals. Parliament gains real oversight, courts gain independence, and the regions breathe easier. As Yavlinsky has long insisted, 'the president must be deprived of the opportunity to issue any secret decrees' and 'interference of the president in the economic policy of the state is unacceptable'. The old guard calls it 'castration of power', but this is the foundation of a republic where no one is above the law."
 sov_yabloko.4.a: "Balance, not dominance."
 sov_yabloko.5.t: "The Left Flank Splits"
 sov_yabloko.5.d: "Yabloko's social democratic wing had hoped for a strong welfare state, radical redistribution, and prioritization of social spending. Instead, they accuse the government of an 'idealistic approach in economics' - prioritizing abstract liberal values over social justice and the material well-being of ordinary people. However, Yavlinsky has always maintained that 'the market economy cannot be built by cannibalistic methods' and that reform must serve people, not impoverish them. Unable to influence the course, dozens of left-leaning members leave the party in protest. The damage to Yabloko's image among the poor and working class is done."
 sov_yabloko.5.a: "We are on the right side of history."
 sov_yabloko.6.t: "People's Capitalism"
 sov_yabloko.6.d: "The results of the 1990s privatization are officially assessed as a 'complete fiasco' - instead of a broad class of owners, the country got 'seven bankers' and monstrous inequality. Yavlinsky has long argued that the key task of reform is 'the formation of a middle class - a stratum of the population with property'. President Yavlinsky announces a new course: the construction of 'people's capitalism'. The program includes mass transfer of small businesses to citizens, strict limits on asset consolidation (no one may own more than 10% of large enterprises), and any new privatizations only through public market mechanisms. The goal is to create millions of small proprietors - the foundation of a stable democracy."
 sov_yabloko.6.a: "Ownership for millions, not for a few."
 sov_yabloko.7.t: "Russia Invites NATO to the St. Petersburg Peace Summit"
 sov_yabloko.7.d: "President Yavlinsky of Russia has extended a formal invitation to the United States and its NATO allies to attend a historic peace summit in St. Petersburg. He proposes a new 'Treaty on a Common European Home', which includes mutual non-use of force, withdrawal from the logic of 'spheres of influence', joint non-strategic missile defense based on Russian and European technologies, and a unified center to counter new threats. As Yavlinsky has long warned: 'The idea of creating a missile defense system in Europe as a counterweight to the US is foolishness. We cannot tear Europe away from America or destroy NATO. It will end with them staying together, and us remaining on the sidelines.' Today, he chooses a different path - not confrontation, but a shared table."
 sov_yabloko.7.a: "Accept the invitation"
 sov_yabloko.7.b: "We do not trust the Kremlin"
 sov_yabloko.8.t: "[FROM.GetName] Accepts Our Proposal"
 sov_yabloko.8.d: "[FROM.GetName] has accepted our invitation to the St. Petersburg Peace Summit. Direct dialogue between Russia and this NATO member is now possible. For the first time, Yavlinsky's old thesis - that we must sit down at the same table, because otherwise we will remain on the sidelines - is being put into practice. A small but important step toward a common European home."
 sov_yabloko.8.a: "A step toward dialogue"
 sov_yabloko.9.t: "[FROM.GetName] Declines Our Proposal"
 sov_yabloko.9.d: "[FROM.GetName] has rejected our invitation to the St. Petersburg Peace Summit, citing distrust of the Kremlin. 'We cannot tear Europe away from America or destroy NATO,' Yavlinsky once predicted. 'It will end with them staying together, and us remaining on the sidelines.' Today, his words seem prophetic. No dialogue for now - but the door remains open."
 sov_yabloko.9.a: "We will keep trying"
 sov_yabloko.10.t: "Anatoly Golov Becomes Prime Minister"
 sov_yabloko.10.d: "President Yavlinsky announces a major cabinet reshuffle, bringing the social democratic wing of Yabloko into key ministerial posts. Anatoly Golov, a veteran social legislator and former chairman of the Social Democratic Party of Russia, becomes the new prime minister. Other left-leaning figures join the government, strengthening labor rights, public healthcare, and social welfare. European socialist and green parties warmly welcome the shift, seeing a renewed opportunity for ideological partnership. Yabloko is finally becoming not just a liberal, but a truly social democratic force."
 sov_yabloko.10.a: "A pragmatic choice."
 sov_yabloko.11.t: "The Moscow Summit of the European Left"
 sov_yabloko.11.d: "Moscow becomes an informal capital of the European left. The Kremlin invites leading left-wing parties from dozens of countries to discuss a common agenda. The summit focuses on climate change, the fight against inequality, and the strengthening of public health systems. In a world increasingly sliding into nationalism and right-wing populism, Yavlinsky's Russia becomes a bridge between East and West - not through militarism, but through solidarity and shared values."
 sov_yabloko.11.a: "A new era of partnership."
 sov_yabloko.12.t: "Cleansing the Political Field"
 sov_yabloko.12.d: "Democrats celebrate - at last the state stops tolerating those who have spat on the law for years. Nationalists and leftists rage: their newspapers scream about a 'liberal dictatorship', 'social fascism', and 'the betrayal of national interests'. Yavlinsky, however, has always insisted: 'Tolerance is not a suicide pact. A democracy cannot tolerate those who pledge to destroy it.' Radical parties - the nationalist LDPR, the neo-Nazi NBP, and the 'neutral communists' - are banned, their assets seized. Only the old elites smile quietly - a political purge always benefits those accustomed to negotiating in silence."
 sov_yabloko.12.a: "No tolerance for radicals."
 sov_yabloko.13.t: "Historic NATO Summit Opens in St. Petersburg"
 sov_yabloko.13.d: "For the first time since the Cold War, NATO member states and Russia sit at the same table in St. Petersburg. The 'Common European Home' - once a dream of the 1990s - is suddenly a reality.\n\nWestern media call it a geopolitical earthquake. Russian nationalists rage: 'Yavlinsky is a NATO agent!' But the president quotes his own old words: 'We cannot tear Europe away from America or destroy NATO. It will end with them staying together, and us remaining on the sidelines. Today we choose a different path - we sit down with them at the same table.'\n\nThe talks are tense. The agenda includes mutual force reduction, joint missile defense, and a new security pact. The world watches with cautious hope. The old elites in Moscow are silent - they do not know whether to applaud or panic."
 sov_yabloko.13.a: "The unthinkable has happened."

 #Yabloko Ideas
 SOV_oligarch_competition_start_idea: "Oligarchs Begin Competing"
 SOV_oligarch_competition_start_idea_desc: "The Kremlin has pushed the major business clans into open competition. Behind closed doors, they are scrambling to restructure, hide assets, and cut back on everything but their own security. Tax officials shrug helplessly. The economy sputters as old networks of collusion break apart. The oligarchs themselves are furious - but for now, they are playing along."
 SOV_oligarch_competition_idea: "Oligarch Competition"
 SOV_oligarch_competition_desc_idea: "Forced to compete rather than collude, the major business clans invest in innovation, cut costs, and drive down consumer prices. Market efficiency is up, foreign trade is flourishing, and even the treasury benefits from increased economic activity."
 SOV_yavlinsky_fiscal_discipline: "Yavlinsky's Fiscal Discipline"
 SOV_constitutional_balance_idea: "Constitutional Balance of Powers"
 SOV_manufacturing_modernization_idea: "Manufacturing Modernization"
 SOV_manufacturing_modernization_idea_desc: "State-subsidized loans, tax breaks, and infrastructure spending have ignited a boom in manufacturing. New factories rise, old ones retool, and productivity surges. The treasury bears the cost, but the long-term gains are expected to outweigh the short-term pain."
 SOV_peoples_capitalism_idea: "People's Capitalism"

