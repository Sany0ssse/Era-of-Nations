 ##########ELVIRKA##########
 ###########Focuses###########
 SOV_nabi_rise: "The First Female President of Russia"
 SOV_nabi_rise_desc: "It's time for Russia to change its leader again, and there seems to be a historical trend towards the transfer of power to a new ruler. Moreover, Russia will be ruled by a woman again, just as it was 300 years ago."
 SOV_nabi_strong_economy_policy: "Strong Economic Policy"
 SOV_nabi_strong_economy_policy_desc: "Russia needs tough economic reforms, and it's time to remove the barriers that prevented them from happening."
 SOV_nabi_infliation_down: "Fighting Inflation at Any Cost"
 SOV_nabi_infliation_down_desc: "Inflation must be defeated, otherwise economic growth will only be a promise to the electorate. We do not intend to be empty talkers."
 SOV_nabi_cross_police: "'Cross Police'"
 SOV_nabi_cross_police_desc: "We intend to introduce a special scheme for balancing power between departments, in which we will actively move certain executives from one department to another in order to maintain a constant balance between them."
 SOV_nabi_structure: "Structural Reforms"
 SOV_nabi_structure_desc: "The economy needs to transition to a new way of doing things, and it's time to stop relying on resource income."
 SOV_nabi_cadres: "The Personnel Revolution"
 SOV_nabi_cadres_desc: "Russia needs people who are truly interested in its development, with the mindset of economists and technocrats."
 SOV_nabi_new_russian_dream: "The New 'Russian Dream'"
 SOV_nabi_new_russian_dream_desc: "America has the American Dream, and our dream is the Russian Dream, which is that we will become a technological paradise where people from all over the world will come."
 SOV_nabi_technocratic: "The Technocratic Approach"
 SOV_nabi_technocratic_desc: "The political component of economic issues should be discarded, and only real facts and indicators should be considered."
 SOV_nabi_peredel: "The Great Deregulation"
 SOV_nabi_peredel_desc: "A loud name for an equally loud process of economic restructuring in our economy"
 SOV_nabi_great_deregulation: "'Quiet Redevelopment'"
 SOV_nabi_great_deregulation_desc: "We are not satisfied with the results of the privatization process, and we will try to review them more quietly."
 SOV_nabi_cult: "The Cult of Competence"
 SOV_nabi_cult_desc: "The only thing that should move a person up the career ladder is competence, not political games or connections."
 SOV_nabi_techno_patriotism: "Technological Patriotism"
 SOV_nabi_techno_patriotism_desc: "To love your country means to love its technology, and for people to love it, it must be truly groundbreaking."
 SOV_nabi_rus_worl_two: "Russian World 2.0"
 SOV_nabi_rus_worl_two_desc: "The concept of the Russian World was outdated even at the time of its creation, and it is a neutered copy of the Soviet doctrine of spreading socialism everywhere. We will take a different path, one that is more peaceful and technologically advanced."
 SOV_nabi_mecenat: "Technological Patron"
 SOV_nabi_mecenat_desc: "Technology, development, and innovation should be constantly mentioned not only in the media, but also in every government agency."
 SOV_nabi_shelk_path: "The Digital Financial Silk Road"
 SOV_nabi_shelk_path_desc: "The Chinese Silk Road is an outdated concept that we will remake in our own way, using a technological breakthrough that will be implemented"
 SOV_nabi_net_protectorate: "Network Protectorate"
 SOV_nabi_net_protectorate_desc: "Many countries do not have strong enough technological network protection, and we will be ready to offer them these services in exchange for gaining influence there."
 SOV_nabi_technocratic_internationalism: "Technocratic Internationalism"
 SOV_nabi_technocratic_internationalism_desc: "Political internationalism is a thing of the past, and we are ready to raise a generation of technocrats who will promote our country's ideals in other countries through our technology."
 SOV_nabi_techo_sphere: "Techno Sphere"
 SOV_nabi_techo_sphere_desc: "It's time for countries with our technological majority to expand their cooperation with us even further"
 SOV_nabi_souless_empire: "The Soulless Empire"
 SOV_nabi_souless_empire_desc: "Despite all that has been done, all the breakthroughs and miscalculations, there is one thing we have not taken into account: the soul of Russian history itself, which has now been torn from our country."
 ###########Ideas###########
 SOV_elvirka_second_idea: "Structural Reform of the State"
 SOV_elvirka_second_idea3: "The New [SOV.GetFlag]Russian World"
 SOV_elvirka_policy_idea: "Strong Economic Policy"
 SOV_elvirka_policy_idea4: "Techno Patriotism"
 SOV_elvirka_bad_siloviks_idea: "Insubordination of the Security Forces"
 SOV_elvirka_bad_siloviks_idea_desc: "The new government is completely dissatisfied with the security agencies, and they are actively resisting the new government. Therefore, it is urgent to resolve this issue.\n§YIf this national spirit is removed, the special services will become available again§!\n"
 SOV_elvirka_russian_dream_idea: "The New [SOV.GetFlag]Russian Dream"
 SOV_zloi_mironov_idea: "Mironov Opposition"
 SOV_zloi_zyuganov_idea: "Zyuganov Opposition"

 SOV_elvire_techno_sphere_idea: "[SOV.GetFlag]§YRussian§! Technosphere"
 SOV_elvire_techno_sphere_idea_desc: "\n\n\n\n£GFX_BANNER_sov_technosphere\n\n\n\n\n\n Russia is expanding its technological expansion and inviting countries to become part of another economic project, the Technological Sphere, where each participant will become a member of a program for technological exchange with the best Russian corporations."
 SOV_elvire_cyph_silk_road_idea: "§YRussian§! Digital Silk Road"
 SOV_elvire_cyph_silk_road_idea_desc: "\n\n\n\n£GFX_BANNER_sov_silkroad\n\n\n\n\n\n China's Silk Road is an outdated concept, and the true future lies in the Digital Russian Silk Road! While Chinese vehicles traverse the deserts of Central Asia, we navigate the digital landscape at a million-fold speed!"
 SOV_elvire_net_protectorate_idea: "§YRussian§! Network Protectorate"
 SOV_elvire_net_protectorate_idea_desc: "\n\n\n\n£GFX_BANNER_sov_net_protectorate\n\n\n\n\n\n Not all countries can afford strong enough network security technologies, but Russian companies will stand up for you and protect your network infrastructure from enemy hackers!"
 SOV_elvire_internationalism_technocratic_idea: "[SOV.GetFlag]§YRussian§! Technocratic International"
 SOV_elvire_internationalism_technocratic_idea_desc: "\n\n\n\n£GFX_BANNER_sov_technointer\n\n\n\n\n\n The 20th century was the century of socialist internationalism, and now it's the time of Russian Technocratic Internationalism! Exchange knowledge with the best scientists in Russia here and now!"
 SOV_mir_puppets_idea: "§YRussian§! §GMir§! Payment System"

