 ##########ZYUGANOV - USSR##########
 ##########Focuses##########
 SOV_zyuga_reforms_start: "Gennadiy Zyuganov"
 SOV_zyuga_reforms_start_desc: "Gennady Zyuganov, born in 1944, has led the Communist Party of the Russian Federation since 1993. In the 1996 Presidential Election, he was initially favored to defeat Boris Yeltsin but ultimately lost in the second round with 40.7 percent of the vote compared to Yeltsin's 54.4 percent. Zyuganov's politics combine left-wing ideology with a strong nationalist perspective."
 SOV_zyuga_russian_idea: "The Russian Idea Instead of the International"
 SOV_zyuga_russian_idea_desc: "'We must return the Russian idea, which is not liberalism or Westernization, but power, Orthodoxy, conciliarity, and justice. Ilyin understood this better than anyone else.'"
 SOV_zyuga_sobornost: "Conciliarity Instead of Democracy"
 SOV_zyuga_sobornost_desc: "Western democracy is a deception. We will have conciliarity: the people will consult, and the government will decide. As Ilyin taught"
 SOV_zyuga_christian_communism: "Orthodoxy is a Spiritual Bond"
 SOV_zyuga_christian_communism_desc: "'Christ was the first communist. And without faith, people fall apart. I was baptized as a child and I wear a cross—I don't hide it.'"
 SOV_zyuga_stalinist: "Stalin As a Statesman"
 SOV_zyuga_stalinist_desc: "Stalin created an empire, defeated Nazism, and returned Russian lands. Yes, there were excesses, but without him, there would be no us"
 SOV_zyuga_more_empower: "Power of the Communist Party"
 SOV_zyuga_more_empower_desc: "We must strengthen our party's power while our position is still precarious."
 SOV_zyuga_anti_yeltsin: "Nationalization of Memory: Yeltsin is the Enemy"
 SOV_zyuga_anti_yeltsin_desc: "Yeltsin and his gang destroyed a great country. We will rename everything that bears his name"
 SOV_zyuga_new_const: "The New Constitution"
 SOV_zyuga_new_const_desc: "A new state requires a new constitution, and the remnants of the old regime must be left behind."
 SOV_zyuga_ilyn: "Ivan Ilyin — the Philosopher of the Kremlin"
 SOV_zyuga_ilyn_desc: "Ilyin understood that Russia is not a democracy or a dictatorship, but a living conciliarity. We will take his ideas, but without a monarchy."
 SOV_zyuga_gosplan: "Gosplan 2.0 Launch"
 SOV_zyuga_gosplan_desc: "The old Gosplan collapsed with the Union. We will rebuild it on a new, digital foundation. Five-year plans must become precise, and plans must be strictly enforced. Centralized planning is our answer to the chaos of the 90s."
 SOV_zyuga_agriculture: "Russian Wheat Is Our Everything"
 SOV_zyuga_agriculture_desc: "Dependence on imported grain is unacceptable. We must return to the status of a great agricultural power. Collective farms will be reformed, but the basis remains the same: the land belongs to the people."
 SOV_zyuga_minselhoz: "Ministry of Agriculture"
 SOV_zyuga_minselhoz_desc: "To feed the nation, an iron fist is needed. The Ministry of Agriculture will take control of all stages of production, from field to counter. Not a single grain past the treasury."
 SOV_zyuga_mashinostroy: "Ministry of Industry"
 SOV_zyuga_mashinostroy_desc: "Industry is the heart of the power. The Ministry of Machine Building will restore lost production chains: from machine tools to tanks. Import substitution becomes a matter of state importance."
 SOV_zyuga_prosveshen: "Ministry of Enlightenment"
 SOV_zyuga_prosveshen_desc: "Liquidation of illiteracy 2.0. The people must know not only pop culture but also Marx and Engels. We will return Soviet-quality education to schools, patriotic upbringing, and exact sciences."
 SOV_zyuga_cis_2: "Return Unrecognized Territories"
 SOV_zyuga_cis_2_desc: "The 'soft territory' of former republics must return to our control. It is time to gather disputed lands and enclaves. No more 'unrecognized' states near our borders without our participation."
 SOV_zyuga_migrants: "Tough Migrant Policy"
 SOV_zyuga_migrants_desc: "Guest workers erode the cultural code and labor market. A strict visa system, replacement of migrants with robotics, and stimulation of birth rates among indigenous peoples. Russia for Russians."
 SOV_zyuga_union_state: "The Union State is the Core of Eurasia"
 SOV_zyuga_union_state_desc: "The Union State of Russia and Belarus is only the first step. We will create a supranational body based on the USSR model to govern Eurasia. Minsk, Kyiv, Astana must obey a single center."
 SOV_zyuga_federalism: "Soviet Federalism"
 SOV_zyuga_federalism_desc: "Under the slogan of 'friendship of peoples,' we will destroy separatism. Regions will receive broad powers, but only within the framework of a strict vertical power structure from the Kremlin. No more national republics — only governorates."
 SOV_zyuga_oligarchs: "To End the Oligarchy"
 SOV_zyuga_oligarchs_desc: "The oligarchs plundered the country in the rogue 90s. The time for nationalization has come. Factories, TV channels, ports — everything will become the property of the people. Those who resist face Magadan or emigration."
 SOV_zyuga_ets: "Unified Trading System"
 SOV_zyuga_ets_desc: "We are leaving the WTO on our own terms. A unified trading system within our bloc of allies: ruble, tariffs, and quotas under our control. Western corporations will work by our rules or leave."
 SOV_zyuga_science: "To Revive Soviet Science"
 SOV_zyuga_science_desc: "The Academy of Sciences must govern the economy. We will stop the brain drain, create state corporations along the Soviet model, and rush into space. Nanotechnology and nuclear physics are priorities."
 SOV_zyuga_5year: "Launch a 5-Year Plan"
 SOV_zyuga_5year_desc: "The time of 'stability' is over. We declare economic mobilization! Shock construction projects, 30% productivity growth, and universal labor discipline. He who does not work, neither shall he eat."
 SOV_zyuga_petroruble: "The Soviet PetroRuble"
 SOV_zyuga_petroruble_desc: "The dollar is a global occupation currency. In oil and gas payments, we switch to the Soviet petroruble, backed by a basket of gold and resources. This will undermine US hegemony."
 SOV_zyuga_marx: "Digital Sovereignty"
 SOV_zyuga_marx_desc: "The internet is a CIA zone of influence. We will create our own segment of the network, isolated from Facebook and Twitter. Our own search engine, our own social network, our own truth. The Digital Iron Curtain."
 SOV_zyuga_antiglobalism: "Antiglobalism"
 SOV_zyuga_antiglobalism_desc: "Globalization is the new colonialism. Moscow will become the center of resistance. We will support any forces in Europe and the US that oppose NATO and liberal dictatorship."
 SOV_zyuga_ussr: "The Return of the USSR"
 SOV_zyuga_ussr_desc: "Russia is not a country. It is a temporarily lost flag. We will restore the USSR to its 1970s borders. The red banner will again fly over the Kremlin, Kyiv, and Alma-Ata."
 SOV_zyuga_kazakh: "The Last State of the USSR"
 SOV_zyuga_kazakh_desc: "The Virgin Lands campaign started with us. Kazakhstan is the last fragment of the empire where they still treat us warmly. The 'return' of the northern regions and Baikonur will be voluntary-compulsory."
 SOV_zyuga_baltic: "Red Dawn Over the Baltic States"
 SOV_zyuga_baltic_desc: "The Baltics have become a NATO staging ground. We will issue an ultimatum for denazification and protection of the Russian-speaking population. On the morning of May 8, our paratroopers will land in Tallinn and Riga."
 SOV_zyuga_ukraine: "Communization of Ukraine"
 SOV_zyuga_ukraine_desc: "Kyiv is the mother of Russian cities. The Kyiv regime must fall. Our brothers await liberation. The entry of Soviet tanks into Kyiv will restore historical justice."
 SOV_zyuga_georgia: "To Return Stalin's Homeland"
 SOV_zyuga_georgia_desc: "Stalin is our father of nations. Georgia must become part of the new empire. We have not forgotten 2008. Abkhazia and South Ossetia are just the beginning. Tbilisi will be ours."
 SOV_zyuga_finland: "The Second Winter War?"
 SOV_zyuga_finland_desc: "We do not claim Helsinki, but the 1940 border was fairer. Finland, by joining NATO, signed its own sentence. Vyborg will become the outpost of the Baltic Fleet."
 SOV_zyuga_aziati: "The Central Asian Socialist Revolution"
 SOV_zyuga_aziati_desc: "The 'color revolutions' in Central Asia are the hand of the USA. We will conduct our own 'socialist revolution.' Tashkent, Bishkek, and Dushanbe will return to the Kremlin's orbit. Water and gas must be paid for with the federal ruble."
 SOV_zyuga_leo_and_erik: "The Red Banner Over Yerevan and Baku"
 SOV_zyuga_leo_and_erik_desc: "Karabakh and Baku's oil must be under unified management. We will solve the Armenian-Azerbaijani conflict the way Stalin did: create a new republic within the USSR."
 SOV_zyuga_kndr: "Eternal Alliance with the DPRK"
 SOV_zyuga_kndr_desc: "Pyongyang is our outpost in Asia. The nuclear umbrella over the DPRK, unified army command, and a trade embargo against the USA. Together we will overthrow the yoke of American imperialism."
 SOV_zyuga_poland: "Back to Poland"
 SOV_zyuga_poland_desc: "We will never forget the 'Eastern territories.' Warsaw is one of Washington's main satellites. A week after the war starts, our Topol missiles will stand on the border with Germany. Szczecin will be ours."
 SOV_zyuga_annex_shprot: "Eat Sprats"
 SOV_zyuga_annex_shprot_desc: "The independence of the Baltic states was a mistake by the Soviet government, and we will fix it!"
 SOV_zyuga_annex_tri_garika: "Have A Snack With Pita Bread"
 SOV_zyuga_annex_tri_garika_desc: "It's time to return the Caucasian Republics to their homeland"
 SOV_zyuga_annex_dhinesh: "Eat Pilaf"
 SOV_zyuga_annex_dhinesh_desc: "Central Asia should not be under anyone's influence; it should be part of our great country."
 SOV_zyuga_annex_finland: "Eat Meatballs"
 SOV_zyuga_annex_finland_desc: "The recognition of Finland's independence was a mistake, as Finland was part of Russia and will be again."
 SOV_zyuga_warsaw: "The Revival of the Warsaw Pact"
 SOV_zyuga_warsaw_desc: "The Warsaw Pact was dissolved illegally. We will revive the bloc on new terms: joint air defense, unified space, and republics instead of 'democracies.' Whoever is not with us is against us."
 SOV_zyuga_warsaw_hungary: "Red Budapest"
 SOV_zyuga_warsaw_hungary_desc: "Budapest is tired of the EU. Orban is our ally, but we want more: Hungarian communists must bring the country into the Union State. Red terror against liberals."
 SOV_zyuga_warsaw_czech: "Prague Spring 2.0"
 SOV_zyuga_warsaw_czech_desc: "Czechia is arming Ukraine. We will stop this 'Prague curse.' A new troop entry will be lightning-fast: Ruzyně airport, the TV center, and bridges in one hour."
 SOV_zyuga_warsaw_gdr: "An Old Ally"
 SOV_zyuga_warsaw_gdr_desc: "The ghost of the GDR is alive. The German lands east of the Elbe are our legitimate zone of responsibility. We will issue an ultimatum to the Bundestag: disarm or lose Berlin."
 SOV_zyuga_warsaw_slovakia: "The Bratislava Blitzkrieg"
 SOV_zyuga_warsaw_slovakia_desc: "Bratislava has always gravitated toward Moscow. A tank blitzkrieg through the Carpathian passes will take half a day. Slovakia will become our proxy state in the heart of Europe."
 SOV_zyuga_warsaw_romania: "The Ghost of Ceausescu"
 SOV_zyuga_warsaw_romania_desc: "Romania is the aggressor over Bessarabia. The ghost of Ceaușescu will return to punish the elites. We will occupy Ploiești and enter Bucharest as liberators from Euro-Atlantic slavery."
 SOV_zyuga_warsaw_bulgaria: "16 Republic of the USSR"
 SOV_zyuga_warsaw_bulgaria_desc: "Bulgaria is the Slavic country closest to us in spirit. They have a chance to become the 16th republic of the USSR peacefully. If not, the Black Sea Fleet will land troops in Varna and Burgas."
 SOV_zyuga_book_of_z: "Book of Z"
 SOV_zyuga_book_of_z_desc: "Every great ruler should have his works in the form of a book, and Zyuganov will be no exception"
 SOV_zyuga_globalization_target: "Russia Under the Crosshairs of Globalism"
 SOV_zyuga_globalization_target_desc: "Globalization is a new colonialism. Our book proves: there is no place for sovereign Russia in the American version of globalization. We will build our own economic bloc, leave the WTO, and create a closed trade system from Vladivostok to Havana."
 SOV_zyuga_rossiya_rodina_moya: "Russia — My Motherland"
 SOV_zyuga_rossiya_rodina_moya_desc: "The old ideology is dead. The new one is the synthesis of Soviet power and Russian patriotism. As I wrote in 1996, we must restore the unity of our spiritual and state traditions. Russia is not just a country — it's a civilization."
 SOV_zyuga_stalin_i_sovremennost: "Stalin and Modernity"
 SOV_zyuga_stalin_i_sovremennost_desc: "Stalin's team turned an agrarian country into a superpower in 15 years. The time has come to stop being afraid of this name. We will use the best of Soviet mobilization experience — without the cult of personality, but with the efficiency."
 SOV_zyuga_ruskij_sterzhen: "The Russian Core of the Power"
 SOV_zyuga_ruskij_sterzhen_desc: "By all international criteria, the genocide of the Russian people continues. We are the largest divided nation in the world. The Russian question is no longer a question of minorities — it is a question of the national core. We will protect Russians everywhere."
 SOV_zyuga_na_perelome: "At the Turn"
 SOV_zyuga_na_perelome_desc: "The 2008 crisis was not an accident — it is a systemic failure of capitalism. Our book 'At the Turn' proved that planned economy saves nations. We will nationalize banks, introduce price controls, and launch our own analogue of the New Deal — the Soviet way."
 SOV_zyuga_na_paseke: "At Zyuganov's Apiary"
 SOV_zyuga_na_paseke_desc: "My book about the apiary is not an eccentricity — it is a political treatise. The beehive is the perfect socialist society: everyone works for the common good, the queen leads, the drones guard. We will build a 'People's Socialism' based on natural, organic principles. And yes, we will export honey to our allies instead of Western sweets."
 SOV_zyuga_ideyno_teoreticheskaya: "The Ideological and Theoretical Foundation of the Party"
 SOV_zyuga_ideyno_teoreticheskaya_desc: "A party without theory is a crowd. Our ideological foundation is not a dogma — it is a weapon. We will create a network of party schools, mandatory for all officials and officers. Every communist must read, understand, and be ready to defend."
 SOV_zyuga_release_book: "Z Release"
 SOV_zyuga_release_book_desc: "It is time for the people of our country to start studying the work of the great leader of the new Russia."
 SOV_zyuga_internationalism: "Soviet Military Internationalism"
 SOV_zyuga_internationalism_desc: "The time has come to break the chains of isolation. We will transform the Red Army from a purely defensive force into the spearhead of world revolution. Military bases, joint exercises, and arms supplies to fraternal parties – every tool of Soviet internationalism will be revived. The empire of capital must know: wherever the working class rises, our support will be there."
 SOV_zyuga_ghost: "The Ghost of Communism Walks Across Europe"
 SOV_zyuga_ghost_desc: "Kapitalist governments tremble – and rightly so. Our ideological offensive will not stop at Russia's borders. We will fund left-wing media, sponsor revolutionary youth movements, and remind every European that the working class has not died. 'Proletarians of all countries, unite!' – this is not nostalgia. It is a battle plan."
 SOV_zyuga_spain_razval: "Support for Socialist Separatism in Spain"
 SOV_zyuga_spain_razval_desc: "Madrid's centralism has always suppressed national minorities. We will extend our hand to Basque, Catalan, and Galician comrades who fight for self-determination and socialism. Trade unions, local parties, and cooperative networks will receive our assistance. A fragmented Spain cannot serve NATO's Mediterranean flanks."
 SOV_zyuga_germany_razval: "Support for Socialist Separatism in Germany"
 SOV_zyuga_germany_razval_desc: "The former GDR has never been fully integrated. In Saxony, Thuringia, and Brandenburg, old loyalties to the red flag remain strong. We will channel resources to German comrades who demand neutrality, denounce Bundeswehr rearmament, and call for a socialist republic on the Elbe. Berlin's NATO fanaticism must be answered."
 SOV_zyuga_turkish_razval: "Support for Socialist Separatism in Turkey"
 SOV_zyuga_turkish_razval_desc: "Ankara's Pan‑Turkic ambitions and oppression of Kurds make it a natural enemy. We will support the Kurdish left, progressive Turkish socialists, and all forces fighting Erdogan's authoritarian regime. Our goal is not merely destabilisation – it is the creation of a friendly, socialist state on the southern flank of the former USSR."
 SOV_zyuga_polish_razval: "Support for Socialist Separatism in Poland"
 SOV_zyuga_polish_razval_desc: "Warsaw has turned into Washington's most loyal outpost. We will remind the Polish people of their true allies: not NATO, but the working class. Support for Silesian autonomists and left‑wing trade unions will crack the façade of 'national unity'. History has not ended – it is merely taking a new turn."
 SOV_zyuga_mongolia: "The Soviet Banner over Mongolia"
 SOV_zyuga_mongolia_desc: "Mongolia was the first socialist country after our own. Its current rulers have betrayed the legacy of Sukhbaatar and Choibalsan. We will support the Mongolian People's Revolutionary movement – financially, politically, and if necessary, with volunteers. Ulaanbaatar must return to the fraternal family of socialist states. The red banner will once again fly over the steppe."
 SOV_zyuga_red_terrorists: "Support for 'Red Terrorists' in Europe"
 SOV_zyuga_red_terrorists_desc: "Western media call them terrorists. We call them fighters for the liberation of the proletariat. Radical leftist groups in Germany, Austria, Norway, and the Czech Republic will receive our clandestine support – safe houses, printing presses, and limited financial aid. We do not initiate violence, but we will not abandon those who dare to resist the dictatorship of capital."
 ##########Events##########
 sov_communists.2.t: "Communist Party Constitution"
 sov_communists.2.d: "With absolute power now in the hands of the Party, we can finally rewrite the constitution according to our values. However, ideological factions have emerged within our ranks, and we must decide which faction will set the tone for our truly Soviet constitution."
 sov_communists.2.a: "Of course we need the Stalinists."
 sov_communists.2.b: "We need a more moderate rise."
 sov_communists.6.t: "Restalinization"
 sov_communists.6.d: "The Khrushchevites failed to preserve the legacy of our greatest leader. Now is the time to correct that. We must decide how far we want to go in renaming our cities in honor of Stalin and the Soviet past."
 sov_communists.6.a: "Keep the historical options."
 sov_communists.6.b: "Go Full-Stalinist!"
 sov_communists.7.t: "[SOV.GetName] Offers Integration"
 sov_communists.7.d: "It seems that the Russian government has decided to no longer play by Western rules and has openly declared its desire to integrate the unrecognized states on the territory of the former USSR. Will we become one of them?"
 sov_communists.7.a: "Yes"
 sov_communists.7.b: "No"
