 #Events
 sov_nabi.1.t: "[SOV.GetNameWithFlag] is offering us a Network Protectorate"
 sov_nabi.1.d: "Their government offers its best network security experts to ensure our digital security from the influence of enemy hackers, and we must decide whether we are willing to sacrifice some of our independence in this area for the greater good of the country."
 sov_nabi.1.a: "Yes"
 sov_nabi.1.b: "No"
 sov_nabi.2.t: "The Network Protectorate in [FROM.GetNameWithFlag]"
 sov_nabi.2.d: "They have agreed to our proposal for our network protectorate of their technological sphere"
 sov_nabi.2.a: "Very Nice"
 sov_nabi.3.t: "The Network Protectorate in [FROM.GetNameWithFlag]"
 sov_nabi.3.d: "They rejected our offer of our network protectorate of their technological sphere"
 sov_nabi.3.a: "Fools"
 sov_nabi.4.t: "[SOV.GetNameWithFlag] is offering us a Digital Silk Road"
 sov_nabi.4.d: "Their government is planning its own project, a network alternative to the famous Chinese Silk Road, and they assure us that the data array created between the states of this project will greatly accelerate the digital development of all member countries in the field of IT and beyond."
 sov_nabi.4.a: "Yes"
 sov_nabi.4.b: "No"
 sov_nabi.5.t: "Digital Silk Road in [FROM.GetNameWithFlag]"
 sov_nabi.5.d: "They have agreed to our proposal for our digital silk road"
 sov_nabi.5.a: "Very Nice"
 sov_nabi.6.t: "Digital Silk Road in [FROM.GetNameWithFlag]"
 sov_nabi.6.d: "They rejected our offer of our digital silk road"
 sov_nabi.6.a: "Fools"
 sov_nabi.7.t: "[SOV.GetNameWithFlag] is offering us a join the Technosphere"
 sov_nabi.7.d: "Their government intends to expand technological cooperation between us and plans to create a special political and economic cluster, the Technosphere, where our countries can freely exchange technologies for the benefit of common development."
 sov_nabi.7.a: "Yes"
 sov_nabi.7.b: "No"
 sov_nabi.8.t: "Technosphere in [FROM.GetNameWithFlag]"
 sov_nabi.8.d: "They have agreed to our proposal for our technosphere"
 sov_nabi.8.a: "Very Nice"
 sov_nabi.9.t: "Technosphere in [FROM.GetNameWithFlag]"
 sov_nabi.9.d: "They rejected our offer of our technosphere"
 sov_nabi.9.a: "Fools"
 sov_nabi.10.t: "[SOV.GetNameWithFlag] is offering us a Technocratic International"
 sov_nabi.10.d: "Their government intends to deepen its cooperation with us and is ready to take it to a new level. We are now being offered deep integration of our educational and scientific institutions to exchange knowledge, technology, and experience in order to expand our cooperation to unprecedented heights."
 sov_nabi.10.a: "Yes"
 sov_nabi.10.b: "No"
 sov_nabi.11.t: "Technocratic International in [FROM.GetNameWithFlag]"
 sov_nabi.11.d: "They have agreed to our proposal for our technocratic international"
 sov_nabi.11.a: "Very Nice"
 sov_nabi.12.t: "Technocratic International in [FROM.GetNameWithFlag]"
 sov_nabi.12.d: "They rejected our offer of our technocratic international"
 sov_nabi.12.a: "Fools"
 sov_nabi.13.t: "The Female President of Russia"
 sov_nabi.13.d: "The story took an unexpected turn, and the current President of Russia decided to step down and hand over power to an unexpected successor: Elvira Nabiullina, the head of the Central Bank of the Russian Federation. It looks like Russia is in for some interesting times."
 sov_nabi.13.a: "Hmmmm"
 sov_nabi.14.t: "Siloviks Are Unhappy with the New Government"
 sov_nabi.14.d: "The new government is clearly going to upset the balance that was established under Putin, and it seems that the security forces will no longer have the same power and control as they did before. Naturally, this is causing discontent among them, and there is also open sabotage."
 sov_nabi.14.a: "Remnants of the Past"
 sov_nabi.15.t: "Sergey Mironov Criticizes Our Policy"
 sov_nabi.15.d: "The leader of the Just Russia Party, Sergei Mironov, continues to criticize our government, calling every step we take a step into the abyss of the Russian state and predicting the country's imminent demise due to such terrible decisions."
 sov_nabi.15.a: "Isn't He Tired of It?"
 sov_nabi.16.t: "Protest of the Oligarchs"
 sov_nabi.16.d: "Nabiullina's policies are met with skepticism and negative reactions from Russia's leading oligarchs, who earn their wealth from the sale of resources, as the new policies are likely to reduce their income."
 sov_nabi.16.a: "Russia is Not a Gas Station"
 sov_nabi.17.t: "New Personnel in the Government"
 sov_nabi.17.d: "Nabiullina is actively recruiting a government team of people who fully support her economic policy and are already beginning to change the country's economic course, which has had a positive impact on certain political groups."
 sov_nabi.17.a: "It's Time to Refresh the Government"
 sov_nabi.18.t: "The Struggle for Competence"
 sov_nabi.18.d: "Announcing a new approach to work processes in the country is one thing. These processes need to be controlled, and this is the biggest challenge for the new government, which many people find idealistic and dream of a paradise in Russia, but the first steps have already been taken and the new policy is beginning to bear fruit."
 sov_nabi.18.a: "Competent Russia is Our Russia"
 sov_nabi.19.t: "Positive Result of Economic Reforms"
 sov_nabi.19.d: "Despite the short time that has passed since the new government came to power, it has already had a positive effect on the economic growth of the entire Russian economy. The belief that the new leader of the country will not engage in another revival of the Russian world gives hope to both domestic and foreign economists."
 sov_nabi.19.a: "Is Stability Coming?"
 sov_nabi.20.t: "Zyuganov Expresses Protest"
 sov_nabi.20.d: "The leader of the Communist Party has clearly expressed his negative opinion about our economic policies and has announced his opposition to our government."
 sov_nabi.20.a: "Is he still alive?"
