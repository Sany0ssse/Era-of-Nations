 ##########Events##########
 russia_governorate.1.t: "Russia Has Decided To Make a Governorate Out Of Us"
 russia_governorate.1.d: "Russia is strongly opposed to the old structure of its state. One example of this is the return to administrative divisions. Russia is eager to invite us to become one of its governorates and be part of this new order."
 russia_governorate.1.a: "Together, We Will Revive the Great Empire!"
 russia_governorate.1.b: "Resist and Bite!"
 russia_governorate.1.c: "Propose a Union State"
 russia_governorate.2.t: "[FROM.GetName] is Returning Home"
 russia_governorate.2.d: "The government of [FROM.GetName] has acted wisely by avoiding confrontation with us. [LIT.GetName] will once again be part of the Russian Empire, strengthening our unity and shared future."
 russia_governorate.2.a: "Finally"
 russia_governorate.3.t: "[FROM.GetName] Resists Us!"
 russia_governorate.3.d: "The government of [FROM.GetName] has rejected our generous offer to peacefully become one of our provinces. If they refuse diplomacy, we will be forced to take action by force."
 russia_governorate.3.a: "Fools"
 russia_governorate.4.t: "[FROM.GetName] Proposes a Union State"
 russia_governorate.4.d: "[FROM.GetName] has offered an alternative, less aggressive approach: the creation of a Union State at an accelerated pace. It appears they seek to minimize the power losses they might suffer."
 russia_governorate.4.a: "May There Be a Union State"
 russia_governorate.4.b: "No [FROM.GetName]."
 russia_governorate.5.t: "The Problem of Artsakh"
 russia_governorate.5.d: "The Republic of Artsakh is at a crossroads regarding who will rule it under the current circumstances. Now that Armenia and Russia are united more closely than ever, the future of Artsakh hangs in the balance."
 russia_governorate.5.a: "Let Russia take control"
 russia_governorate.5.b: "Artsakh is Ours."
 sov_nationalists.1.t: "Amending the National Constitution"
 sov_nationalists.1.d: "Our previous constitution was arguably the worst in Russian history! To erase this shameful document, we will create a truly Russian constitution. The key decision is whether to maintain traditional centralization or to opt for a more decentralized, but expansionist path. Which direction should we choose?"
 sov_nationalists.1.a: "Russia needs to stabilize itself before helping others!"
 sov_nationalists.1.b: "Expansionism is our national destiny and must be enshrined in the constitution!"
 sov_nationalists.2.t: "§Y[SOV.GetNameWithFlag]§! Offers To Join The Alliance"
 sov_nationalists.2.d: "The Russian government proposes forming an alliance through a series of agreements aimed at protecting us from outside threats. Will we accept?"
 sov_nationalists.2.a: "Russia will save us!"
 sov_nationalists.2.b: "No"
 sov_nationalists.3.t: "Alliance with §Y[FROM.GetNameWithFlag]§!"
 sov_nationalists.3.d: "They government has refused to join our alliance through a treaty. It seems we will need to enforce our will by force."
 sov_nationalists.3.a: "They Are Will Be Ours!"
 sov_nationalists.4.t: "Military Exercises with §Y[FROM.GetNameWithFlag]§!"
 sov_nationalists.4.d: "Russia is conducting joint military exercises with our forces and those of other allies in preparation for a potential military intervention in Turkey."
 sov_nationalists.4.a: "We Will Be Ready"
 sov_nationalists.5.t: "The Union State with §Y[SOV.GetNameWithFlag]§!"
 sov_nationalists.5.d: "The Russian government suggests reviving the former Union State project between Russia and Serbia. Originally rejected by the Yeltsin government in the 1990s, they now propose to resurrect this alliance. Will we agree?"
 sov_nationalists.5.a: "Yes"
 sov_nationalists.5.b: "No"
 sov_nationalists.6.t: "The Union State with §Y[SER.GetNameWithFlag]§!"
 sov_nationalists.6.d: "The Serbian government has agreed to resume the Union State project, signaling a new chapter in our cooperation."
 sov_nationalists.6.a: "Good"
 sov_nationalists.7.t: "The Union State with §Y[SER.GetNameWithFlag]§!"
 sov_nationalists.7.d: "The Serbian government has refused to restart the Union State project. This setback is disappointing for those who hoped to strengthen our ties and unify our nations. We must consider our next steps carefully."
 sov_nationalists.7.a: "Unfortunate"
 sov_nationalists.8.t: "New Russian Empire"
 sov_nationalists.8.d: "President Zhirinovsky has declared the revival of the Russian Empire as the cornerstone of his political agenda. Whether by peaceful means or force, Russia is ready to reclaim its former territories. We must prepare for the possibility of renewed conflict as the empire rises again."
 sov_nationalists.8.a: "God save the President."
 sov_nationalists.9.t: "Reimperialization"
 sov_nationalists.9.d: "After the 1917 uprising, communists sought to erase the memory of our homeland's past by replacing it with their ideology. Many Russian towns were renamed after communist leaders and symbols. We must restore our history and dignity by bringing back the pre-revolutionary names of these cities."
 sov_nationalists.9.a: "Old Pre-Revolutionary Names"
 sov_nationalists.9.b: "The Pre-War Titles Were Better"
 sov_nationalists.10.t: "Russia Demands Manchuria"
 sov_nationalists.10.d: "Russia has demanded the annexation of Manchuria as part of its plan to recreate Zheltorossiya. This aggressive claim forces us to decide whether to submit or resist their ambitions."
 sov_nationalists.10.a: "We have to submit..."
 sov_nationalists.10.b: "No Zheltorossiya for today."
 sov_nationalists.11.t: "China Accepts Our Demand"
 sov_nationalists.11.d: "China has agreed to our demands regarding Manchuria. With this acceptance, we have finally secured control over Zheltorossiya. This victory marks an important step in our regional ambitions."
 sov_nationalists.11.a: "Slava Rossii!"
 sov_nationalists.12.t: "China Declines Our Demand"
 sov_nationalists.12.d: "China has refused our demands over Manchuria. We will now have to consider military action to reclaim Zheltorossiya and enforce our claims."
 sov_nationalists.12.a: "They have chosen death."
 sov_nationalists.13.t: "Protection from Georgia"
 sov_nationalists.13.d: "Russia has offered to hold a referendum for us to join their union. The expected result is clear, but we must decide whether to accept this proposal or reject it."
 sov_nationalists.13.a: "Of Course, It's Time Go to Home - to Russia"
 sov_nationalists.13.b: "Not Today"
 sov_nationalists.14.t: "Zhirinovsky Elected as President"
 sov_nationalists.14.d: "In the recent government change, the nationalist LDPR party won power, with Vladimir Zhirinovsky elected as president. They have promised sweeping reforms, including restoring the old flag and pursuing a conservative nationalist agenda."
 sov_nationalists.14.a: "What Awaits Russia?"
 sov_nationalists.15.t: "The Moscow Agreement Has Been Signed!"
 sov_nationalists.15.d: "We have officially formed a new military-political alliance dedicated to promoting Russia's interests and opposing the Western powers. This bloc will be a key instrument of our renewed strength."
 sov_nationalists.15.a: "For [SOV.GetName]!"
 sov_nationalists.16.t: "Cossack Uprisings in [KAZ.GetName]"
 sov_nationalists.16.d: "Cossack groups loyal to us in [KAZ.GetName] have started armed rebellions following our announcement to reclaim these lands for [SOV.GetName]. Their fierce loyalty fuels this uprising."
 sov_nationalists.16.a: "For [SOV.GetName]!"
 sov_nationalists.17.t: "Military Operation in Central Asia"
 sov_nationalists.17.d: "The Central Asian republics are a product of Soviet error, granting them false independence. We will bring these territories back into our great Empire by force if necessary."
 sov_nationalists.17.a: "For [SOV.GetName]!"
 sov_nationalists.18.t: "[FROM.GetName] Became a Governorate of [SOV.GetName]"
 sov_nationalists.18.d: "[FROM.GetName] has officially been incorporated as a province of our state. Now we must focus on full integration and avoid past mistakes that led to instability."
 sov_nationalists.18.o1: "One and Indivisible"
 sov_nationalists.19.t: "[FROM.GetName] Is Integrated Into [SOV.GetName]"
 sov_nationalists.19.d: "[FROM.GetName] has been fully absorbed into our great Empire. Our nation grows stronger as we reclaim lost territories, and we have no plans to stop expanding."
 sov_nationalists.19.o1: "Our Country Has Become Bigger"
 sov_nationalists.20.t: "Death to National Republics"
 sov_nationalists.20.d: "Tatarstan, Chechnya, Bashkortostan... Zhirinovsky signs a decree on the elimination of national divisions. The regions are now simply 'provinces' with appointed governors. Protests begin in Grozny, but they are quickly suppressed by the declaration of an "anti-terrorist operation"
 sov_nationalists.20.a: "One Nation, One Leader, One Russia"
 sov_nationalists.21.t: "Alma Ata — Attention, Stand Down"
 sov_nationalists.21.d: "Zhirinovsky is tearing up the CSTO treaty on live TV. 'Stop feeding these 'allies' who are afraid to even say the word 'Russia'!" Armenia and Kazakhstan are shocked. The Pentagon is rubbing its hands together."
 sov_nationalists.21.a: "Every Man for Himself. Or For Us, If He Pays"
 sov_nationalists.22.t: "Drang Nach Osten — and Now Nach Westen"
 sov_nationalists.22.d: "Zhirinovsky puts on his 1914-style cap and declares, 'Europe is rotten. We will march from Lisbon to Vladivostok in one fell swoop.' Missile systems are being secretly deployed in the Kaliningrad region."
 sov_nationalists.22.a: "Europe, Pray!"
 sov_nationalists.23.t: "The Court of the 90s"
 sov_nationalists.23.d: "Arrests of 'privatizers' begin across Russia. Chubais and Co. are put on the wanted list through Interpol (which ignores them). Zhirinovsky personally interrogates one of the oligarchs on live TV: 'Where did you put the factories, you bastard?'"
 sov_nationalists.23.a: "Property to the people! Positions to the military!"
 sov_nationalists.24.t: "Zhirinovsky is Our Everything"
 sov_nationalists.24.d: "The subject 'Zhirinovskology' is being introduced in schools. Portraits of the leader are hanging instead of crosses in churches (sponsored by the government). A 100-meter statue of the 'Russian Caesar' is being built on Red Square"
 sov_nationalists.24.a: "Long Live Our Great Leader! (5 Minutes of Applause)"
