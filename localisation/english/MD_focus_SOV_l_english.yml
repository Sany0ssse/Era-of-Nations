 SOV_blue_stream_prepare: "Prepare the §2Blue Stream§!"
 SOV_turkey_stream_prepare: "Prepare the §2Turkish Stream§!"
 SOV_npp_ticker_mission: "§YNPP§! Initiative Deadline"
 SOV_npp_healthcare: "§YNational Project§!: Healthcare"
 SOV_npp_education: "§YNational Project§!: Education"
 SOV_npp_infrastructure: "§YNational Project§!: Infrastructure"
 SOV_npp_digital_economy: "§YNational Project§!: Digital Economy"
 SOV_npp_industry: "§YNational Project§!: Industry"
 SOV_npp_anti_sanctions_exports: "§YNational Project§!: Parallel Import"
 SOV_npp_anti_sanctions_construction: "§YNational Project§!: Domestic Construction"

 SOV_reign_of_yeltsin: "The Reign of Boris Yeltsin"
 SOV_reign_of_yeltsin_desc: "Boris Yeltsin was the first President of the newly-created Russian Federation, the successor state to the USSR, from 1991 to 1999. He presided over huge economic trouble and a disastrous war in Chechnya, and on December 31st, 1999, handed his post over to Prime Minister Vladimir Putin."

 SOV_anti_corruption_foundation: "Anti-Corruption Foundation"
 SOV_anti_corruption_foundation_desc: "Corruption has deeply infected Russia's political and economic systems. Establishing a dedicated government committee with real authority is necessary to fight this problem thoroughly and restore public trust."
 SOV_economic_liberalism: "Free Markets, Free People"
 SOV_economic_liberalism_desc: "Free markets are essential to lifting Russia out of poverty and encouraging growth. The government should step aside and allow businesses to operate freely, without interference or favoritism."
 SOV_multi_party_encouragement: "Language Agreements"
 SOV_multi_party_encouragement_desc: "Russians and Ukrainians share deep cultural and linguistic ties. We should ensure equal language rights to strengthen unity and mutual respect between our peoples."
 SOV_subjects: "Subjects of the Federation"
 SOV_subjects_desc: "We aim to introduce clearer and more structured interactions with the federal subjects. This will bring about improved economic coordination and stronger political cohesion across all regions."
 SOV_referendum_in_chechnya: "Referendum in Chechnya"
 SOV_referendum_in_chechnya_desc: "Chechnya is culturally and politically distinct from the rest of Russia. The only path to peace is to let its people decide — full integration into the Russian Federation, or a degree of autonomy. We will respect their choice and work toward a lasting settlement."
 SOV_referendum_in_bashkiria: "Status of [BSH.GetNamewithFlag]"
 SOV_referendum_in_bashkiria_desc: "We will align our constitution and legal framework with those of [BSH.GetNamewithFlag]. This is a key step toward unified governance and administrative clarity."
 SOV_referendum_in_tatarstan: "Status of [TAT.GetNamewithFlag]"
 SOV_referendum_in_tatarstan_desc: "We will align our constitution and legal framework with those of [TAT.GetNamewithFlag]. Bringing these documents into harmony ensures consistency within the Federation."
 SOV_referendum_in_khmao: "Status of [KHM.GetNamewithFlag]"
 SOV_referendum_in_khmao_desc: "We will bring our legal structure in line with [KHM.GetNamewithFlag] to ensure better integration and administration. This legal unification will reduce friction and help standardize governance across regions."
 SOV_referendum_in_crimea: "Status of [CRM.GetNamewithFlag]"
 SOV_referendum_in_crimea_desc: "We will bring our constitution and laws into line with those of [CRM.GetNamewithFlag], solidifying its place in the Federation. Legal clarity is essential for long-term stability and legitimacy."
 SOV_referendum_in_kuban: "Project of the [KUB.GetFlag]Kuban Republic"
 SOV_referendum_in_kuban_desc: "The Kuban Republic was a historical creation during the Russian Civil War. Today, we consider expanding its autonomy once again, for the mutual economic benefit of both the region and Russia as a whole."
 SOV_referendum_in_ural: "Revive The Project of The [URA.GetFlag]Ural Republic"
 SOV_referendum_in_ural_desc: "The Ural Republic was once proposed by Governor Eduard Rossel to give the region equal standing with national republics. Though legally blocked, the idea still lingers. Now may be the right time to revisit and possibly revive this long-buried project."

 ##########PUTIN TREE##########
 ##########Focuses##########
 SOV_putin: "Vladimir Putin"
 SOV_putin_desc: "Vladimir Putin, born in Leningrad, is a former KGB intelligence officer who briefly served as director of the FSB and secretary of the Security Council before being appointed Prime Minister in August 1999. With his experience in foreign intelligence, Putin is seen as one of the most capable — if not the most powerful — figures to lead Russia in these turbulent times."
 SOV_the_grand_bargain: "The Grand Bargain"
 SOV_the_grand_bargain_desc: "Russia is currently under the grip of oligarchs. If we are to gain real power within the country, we must offer them a deal they cannot refuse."
 SOV_stabilisation_fund: "Stabilization Fund"
 SOV_stabilisation_fund_desc: "The stabilization fund will serve as a financial reserve in the event of an economic crisis. It will help preserve national stability during downturns and ensure that public services continue to function. Having this safety net strengthens our position in both domestic and international markets."
 SOV_kasyanov_govern: "Kasyanov's Government"
 SOV_kasyanov_govern_desc: "Kasyanov's government plans to reach an agreement with the Paris Club to write off part of our national debt. This would ease financial burdens and help stimulate growth. With more fiscal breathing room, we can focus on development and public welfare."
 SOV_young_guard: "Young Guard"
 SOV_young_guard_desc: "The Young Guard is the youth wing of the United Russia party. Its name traces back to a heroic World War II underground movement. A pro-Putin direct action group, it claims 85 regional branches from Kaliningrad to Vladivostok, mobilizing patriotic youth across the nation."
 SOV_rosselhoz: "Russian Agricultural Bank"
 SOV_rosselhoz_desc: "We intend to create a 100% state-owned bank that will be engaged in developing the national credit and financial system for the agricultural sector and rural areas of Russia"
 SOV_upraznd_pps: "Abolition of the Ministry of Railways"
 SOV_upraznd_pps_desc: "We intend to abolish the Ministry of Railways in order to create a state corporation that will replace it and improve control in this area of activity."
 SOV_reform_sovfed: "Reform of the Federation Council"
 SOV_reform_sovfed_desc: "We are reforming the Federation Council to make its work more effective. In its current state, it serves little use. With better structure and clearer purpose, the Council can become a vital tool for policy implementation."
 SOV_npp: "National Priority Projects"
 SOV_npp_desc: "Since the collapse of the Soviet Union, Russia's living standards have declined. In 2005, the National Priority Projects were launched to improve healthcare, education, housing, and agriculture. These projects aim to revitalize key sectors of daily life and strengthen the nation from the ground up."
 SOV_putinism: "Putinism"
 SOV_putinism_desc: "Although Vladimir Putin lacks a formal ideology, his rule is characterized by the dominance of oligarchs and former military officials, or siloviki. This model of governance has come to be known as 'Putinism,' emphasizing control, loyalty, and state authority."
 SOV_empower_siloviki: "Empower the Siloviki"
 SOV_empower_siloviki_desc: "'Siloviki' refers to former military and intelligence officers who have transitioned into politics. By empowering them, we ensure internal unity and decision-making driven by shared values and discipline."
 SOV_putin_sofbez: "Security Council of Russia"
 SOV_putin_sofbez_desc: "When a country is on the brink of disaster, it is not necessary to make decisions alone. The Security Council will be an excellent advisory body to decide the fate of the country in an extremely dangerous and negative situation."
 SOV_putin_fsnp: "Dissolve Federal Tax Police Service"
 SOV_putin_fsnp_desc: "We intend to dissolve several unnecessary ministries, and the Federal Tax Police will be one of them. We will transfer its functions to the Ministry of Internal Affairs."
 SOV_putin_sovereign_democracy: "Sovereign Democracy"
 SOV_putin_sovereign_democracy_desc: "It's time to clearly define what our political regime is. Vladislav Surkov, Deputy Head of the Presidential Administration, seems ready to announce the concept of sovereign democracy."
 SOV_putin_soviet: "Praising the Soviet Period"
 SOV_putin_soviet_desc: "The 1990s were an era of destruction, belittlement, and insult to the Soviet legacy, but we will return to the cult of praising the Soviet legacy."
 SOV_putin_finmon: "Create a Rosfinmonitoring"
 SOV_putin_finmon_desc: "It is necessary to actively combat money laundering and other corrupt activities in the financial sector, so we will create a new ministry."
 SOV_putin_fts: "Create a Federal Customs Service"
 SOV_putin_fts_desc: "The State Customs Committee has not been effective, so we are ready to create a new ministry to improve customs."
 SOV_rostech: "Create a Rostech"
 SOV_rostech_desc: "Our military enterprises are in decline, so we need to consolidate all our military production facilities into one corporation in order to restore the former power of Russian weapons."
 SOV_putin_fms: "Create a Federal Migration Service"
 SOV_putin_fms_desc: "Migration control within the Ministry of Internal Affairs has not been very effective, so we will separate the Migration Service into a separate department"
 SOV_revision_6: "Revision Number 6"
 SOV_revision_6_desc: "Revision Number 6 is a sweeping surveillance law that gives the government full authority to monitor communications across the country. While controversial, it is justified as a national security measure. Its broad scope ensures no threat goes unnoticed."
 SOV_putinism_propaganda: "Putinism Propaganda"
 SOV_putinism_propaganda_desc: "Before Putin, Russia was a shattered and humiliated country. Under his leadership, hope and pride were restored. We will celebrate this revival, and ensure that all citizens understand the greatness he has brought to Russia."
 SOV_the_putinka: "The Putinka"
 SOV_the_putinka_desc: "The Khrushchyovkas of old are being replaced by a new housing model, the Putinka. Modern, spacious, and more durable, these buildings mark a new era in Russian urban development."
 SOV_enforce_oligarchs_control: "Enforce Control Over the Oligarchs"
 SOV_enforce_oligarchs_control_desc: "Oligarchs may have influence, but direct control from the state is far more effective. By showing that the state is more powerful, we can create a stable system of state-run corporations that benefit the entire country."
 SOV_go_russia: "Go Russia!"
 SOV_go_russia_desc: "Russia is a great power with unstoppable potential. Under Putin's leadership, we will reclaim our rightful place as a dominant global superpower in the years to come."
 SOV_rokirovka: "Rokirovka"
 SOV_rokirovka_desc: "Rokirovka, meaning castling in chess, refers to Putin stepping down after his presidential term to allow Medvedev to take power. This strategic move ensured continuity of leadership within Russia's political system."
 SOV_may_decrees: "May Decrees"
 SOV_may_decrees_desc: "On his first day as president in 2012, Putin issued 14 presidential decrees, known as the May Decrees. These focused on education, housing, skilled labor, relations with the EU, the defense industry, and inter-ethnic relations to guide Russia's development."
 SOV_putin_rise_nabi: "Main Regulator is the Central Bank"
 SOV_putin_rise_nabi_desc: "We intend to transfer many of the regulator's functions in the stock exchange and other economic sectors to the central bank, in order to concentrate all control in our hands."
 SOV_putin_dimon_rosatom: "State Atomic Energy Corporation Rosatom"
 SOV_putin_dimon_rosatom_desc: "We intend to create a state-owned corporation that will unite the entire nuclear industry of our country, both civilian and military. This unification will help our country to manage its nuclear assets effectively."
 SOV_putin_chistki: "Political Purges"
 SOV_putin_chistki_desc: "It's time to clear out the enemy opposition in the country"
 SOV_medvedev_rkn: "Roskomnadzor"
 SOV_medvedev_rkn_desc: "The digital age requires digital protection, and we are ready to create a special ministry that will focus on digital security and hygiene in the country."
 SOV_medvedev_eaeu: "Create the EAEU"
 SOV_medvedev_eaeu_desc: "It's time to expand the customs union and turn it into something more significant. We've been planning the EAEU project for a decade, but will our neighbors decide to become part of it?"
 SOV_medvedev_eaeu_ukraine: "Eurasian Ukraine"
 SOV_medvedev_eaeu_ukraine_desc: "We intend to expand the Eurasian Union at the expense of Ukraine, our last attempt to increase our influence there"
 SOV_petroruble: "Oil for Rubles"
 SOV_petroruble_desc: "It's time to finally change the geopolitical situation, and we are ready to switch to the ruble in oil trade with other countries"
 SOV_expansion_of_importozamesheniye: "Establish Import Substitution"
 SOV_expansion_of_importozamesheniye_desc: "It is time to develop domestic industries and reduce reliance on imports."
 SOV_putin_ukraine_yanuk: "Support Yanukovych"
 SOV_putin_ukraine_yanuk_desc: "We intend to support Yanukovych as a person who, as President of Ukraine, will certainly show loyalty to our country."
 SOV_zov_in_belarus: "Try To Regain Influence In Belarus"
 SOV_zov_in_belarus_desc: "We will try to regain control over Belarus despite the fact that its authorities have adopted a clearly anti-Russian stance. This effort is crucial to restoring our influence and securing our strategic interests in the region."
 SOV_aggressive_foreign_policy: "Aggressive Foreign Policy"
 SOV_aggressive_foreign_policy_desc: "With internal opposition subdued, Russia can now take a more assertive stance abroad. Protecting ethnic Russians abroad provides justification for influence and intervention when necessary."
 SOV_extend_term_limits: "Extend Term Limits"
 SOV_extend_term_limits_desc: "Currently, the president's term is four years. Extending it to six years will allow stable governance and continuity until at least 2018."
 SOV_belarus_strike: "Minsk In 3 Days"
 SOV_belarus_strike_desc: "The time has come for a decisive blow against the nationalist regime ruling Belarus. A swift and overwhelming strike on Minsk will demonstrate our resolve and shift the balance of power in the region."
 SOV_2021_ukrainian_coup: "The Ukrainian Coup"
 SOV_2021_ukrainian_coup_desc: "There is no longer any room for negotiations with Kiev. We must work to change the regime by any means necessary and restore a government more favorable to Russian interests."
 SOV_the_final_strike: "The Final Strike"
 SOV_the_final_strike_desc: "Ukraine has chosen a path that threatens regional stability. It is time to act decisively and correct this course. Forward to victory!"
 SOV_ne_svo: "Adding Fuel to the Fire of Separatism"
 SOV_ne_svo_desc: "We intend to act more covertly and by other means, and instead of a global war, we intend to sponsor the largest separatist movements in Europe."
 SOV_secret_strike: "The Unexpected Strike"
 SOV_secret_strike_desc: "While distracting global attention, our true objective has been Finland. It is time to retaliate for past conflicts with a surprise strike. Glory to our forces!"
 SOV_npp_again: "New National Projects"
 SOV_npp_again_desc: "The government has launched new national projects aimed at boosting the economy to unprecedented levels. These initiatives will impact various sectors, from social welfare to technological advancement."
 SOV_m12: "Federal Highway M12 \"Vostok\""
 SOV_m12_desc: "The M12 Vostok federal highway connects major cities including Moscow, Vladimir, Murom, Arzamas, Kazan, Nizhnekamsk, Yekaterinburg, and Tyumen. This infrastructure development is a key part of our national modernization efforts."
 SOV_unite_as_one: "Respect The History of Russia"
 SOV_unite_as_one_desc: "Our nation has a vast and rich history. We must honor and respect our heritage as a foundation for unity and pride moving forward."
 SOV_volunteer_gifts: "Donations From Citizens"
 SOV_volunteer_gifts_desc: "Concerned citizens contribute generously to support the front lines. Their donations provide critical resources and boost morale among our troops."
 SOV_reconservation: "Deconservation"
 SOV_reconservation_desc: "We will reactivate stockpiles of weapons and equipment preserved since the Soviet era. This will quickly strengthen our military capabilities without the need for new production."
 SOV_anti_bsb: "Ban The Opposition"
 SOV_anti_bsb_desc: "It is time to take decisive action against pro-Western opposition groups who undermine our stability and spread foreign influence."
 SOV_information_war: "Information Warfare"
 SOV_information_war_desc: "To weaken Western support for Ukraine, we must spread targeted propaganda online. Controlling the narrative is crucial to influencing international opinion and securing our objectives."
 SOV_enforce_liberal_values: "Liberal Values Superiority"
 SOV_enforce_liberal_values_desc: "Liberalism is the foundation of a free and prosperous Russia. We must uphold and spread these values as we rebuild the nation."
 SOV_focus_on_economy: "Russian Economic Miracle"
 SOV_focus_on_economy_desc: "The liberal era promises economic revival. By opening markets and implementing reforms, we will usher in a new age of prosperity, peace, and freedom."
 SOV_abandon_foreign_policy: "Abandon Foreign Policy"
 SOV_abandon_foreign_policy_desc: "The Cold War is over. We are no longer a communist threat to the West. It's time to set aside past grievances and embrace lasting peace."
 SOV_age_of_stability: "Stable Russia"
 SOV_age_of_stability_desc: "After decades of turmoil and inequality, Russia has found peace. With a visionary reformer in charge, we are entering an age of lasting stability and national unity."
 SOV_establish_controlled_opposition: "Establish Controlled Opposition"
 SOV_establish_controlled_opposition_desc: "A controlled opposition within the Duma will create the appearance of democracy while allowing us to pass reforms unimpeded."
 SOV_special_economic_operation: "Special Economic Operation"
 SOV_special_economic_operation_desc: "Belarus and Ukraine must see that the Putinist era is over. We will engage them through cooperation, not coercion, and rebuild relations on new terms."
 SOV_the_iron_dimon: "Iron Rule"
 SOV_the_iron_dimon_desc: "The people are tired of weakness. They demand strength. A true leader—firm, unyielding, and resolute—will rise to answer that call."
 SOV_the_new_dictatorship: "New Dictatorship"
 SOV_the_new_dictatorship_desc: "To solidify our authority, we will embrace the structure and efficiency of a new dictatorship, tailored to modern needs."
 SOV_medvedeism: "Medvedeism"
 SOV_medvedeism_desc: "Putinism failed the nation. Now comes a new doctrine: Medvedeism—designed to correct the past, and guide Russia into the future."
 SOV_defend_national_interests: "Defend National Interests"
 SOV_defend_national_interests_desc: "With the state secured, we will turn our eyes outward. The rightful lands of the Russian people must return under our protection."
 SOV_cross_the_rubicon: "Cross the Rubicon"
 SOV_cross_the_rubicon_desc: "The time has come for Russia’s true leader to seize power. We must act decisively to secure our nation’s future and take the reins of history."
 SOV_establish_new_oligarchate: "Establish New Oligarchate"
 SOV_establish_new_oligarchate_desc: "Oligarchs have long shaped Russian politics. By replacing Putin’s loyalists with our own allies, we will secure lasting stability and loyal support."
 SOV_putin_moldova_resolve: "Kosak-Memorandum"
 SOV_putin_moldova_resolve_desc: "We are ready to resolve the Transnistrian issue once and for all. It is time for us to address the Moldovan government with our solution."
 SOV_dimon_kazakhstan: "The Solution Of The Kazakhstan Issue"
 SOV_dimon_kazakhstan_desc: "Kazakhstan has long believed that it can play both sides without having to choose which side it will support in the upcoming redivision of the world. We will decide this for it."
 SOV_dimon_georgia: "The Solution Of The Georgian Issue"
 SOV_dimon_georgia_desc: "The Georgian issue has not been resolved, and it is time to resolve it"
 SOV_dimon_supreme: "A Strong Power - A Strong Leader"
 SOV_dimon_supreme_desc: "President, Secretary General, Tsar, Russia has always been ruled by a single individual, so a strong leader makes a strong country."
 SOV_pipa_rkn: "Strengthen Roscomandzor's Grip"
 SOV_pipa_rkn_desc: "Enemy propaganda, cyber attacks, and other enemy tools influence the minds of our citizens, and we need to protect them for the benefit of the state"
 SOV_pipa_shaman: "Strengthen the Propaganda Machine"
 SOV_pipa_shaman_desc: "The propaganda machine has been weak for a long time, but it's time to strengthen it, as difficult times require a united nation."
 SOV_dimon_soo_abk: "Annex Unrecognized Republics"
 SOV_dimon_soo_abk_desc: "The unrecognized republics that emerged in the 1990s were never eliminated by our leadership by incorporating them into Russia. It's time to rectify this."
 SOV_dimon_pipa_militaries: "Military Should Be in Charge"
 SOV_dimon_pipa_militaries_desc: "The military should become a new social stratum that will lead the country into a brighter future, because they were the ones who shed their blood for our country."
 SOV_dimon_attack_south: "The End of K-pop"
 SOV_dimon_attack_south_desc: "The fraternal peoples of the DPRK and Russia are ready to put an end to the plague of South Korean K-pop"
 SOV_dimon_azeri: "Collapse of Azerbaijan"
 SOV_dimon_azeri_desc: "Azerbaijan is a state that oppresses small nations on its territory, and it's time to fix this"
 SOV_dimon_csto: "CSTO Reform"
 SOV_dimon_csto_desc: "It's time to reform the CSTO and make it not just an organization, but a normal military alliance"
 SOV_dimon_baltica: "Drink Baltic"
 SOV_dimon_baltica_desc: "The Baltic countries are a joke that needs to end"
 SOV_pipa_heroes_z: "Heroes Z"
 SOV_pipa_heroes_z_desc: "The real heroes are the soldiers of our army, and they should always be the center of our propaganda."
 SOV_pipa_science: "Russian Science"
 SOV_pipa_science_desc: "Supporting Russian science is our top priority, and we will not stop."
 SOV_pipa_max: "Digital Safe State"
 SOV_pipa_max_desc: "Digital security will remain a priority of our domestic policy in this digital age."
 SOV_pipa_dimon_great_russia: "Great Russia"
 SOV_pipa_dimon_great_russia_desc: "Russia's greatness must be preserved and enhanced"
 SOV_pipa_dimon_war_nato: "A New Holy War"
 SOV_pipa_dimon_war_nato_desc: "It's time to put an end to the fascist snake that was not finished off by our grandfathers and has reborn as NATO."
 SOV_medvedev_ukraine: "Invite Ukraine to the CSTO"
 SOV_medvedev_ukraine_desc: "We are ready to invite Ukraine to the CSTO, because fraternal nations must protect each other"
 SOV_eaeu: "The Eurasian State"
 SOV_eaeu_desc: "It's time to implement our grandiose project to partially regain the influence we lost after the collapse of the USSR. The Eurasian state is our grandiose project that we never expected to achieve."
 SOV_peace_with_the_west: "Peace with the West"
 SOV_peace_with_the_west_desc: "With our internal affairs in flux, conflict with the West is not viable. For now, peace must prevail—until the time is right."
 SOV_continue_reformism: "Continue Reformism"
 SOV_continue_reformism_desc: "Putin’s conservative policies led to stagnation. Our new administration will revitalize Russia through comprehensive reforms and fresh leadership."
 ##########Ideas##########
 SOV_z_propaganda: "Z Propaganda"
 SOV_putin_opposition_idea: "Putin's Opposition"
 SOV_putinism_idea: "Putinism"
 SOV_putinism_idea_desc: "\n\n\n\n£GFX_BANNER_sov_putinism\n\n\n\n\n\nVladimir Putin has become not just a President, but has already begun to form a certain ideological shell around himself, which political analysts have dubbed Putinism, since his rule has distinct features and seems to be focused on the country's economic development."
 SOV_medvedism_idea: "Medvedism"
 SOV_medvedism_idea_desc: "\n\n\n\n£GFX_BANNER_sov_medvedism\n\n\n\n\n\nThe figure of Dmitry Medvedev has acquired not just administrative authority but also begun to accumulate its own ideological layer, termed Medvedism. His ruling style is distinguished by aggressive technological drive - an emphasis on digital transformation and innovation breakthrough coupled with a rigid force component in foreign policy, showcasing more direct methods of asserting national interests."
 SOV_may_decrees_idea: "May Decrees"
 SOV_sanctions_no_resource_idea: "Fight Against Resource Sanctions"
 SOV_sanctions_no_economic_idea: "Fight Against Economic Sanctions"
 SOV_eaeu_state_idea: "The Spirit of the Eurasian Union"
 SOV_eaeu_state_idea_desc: "\n\n\n\n£GFX_BANNER_sov_eaeu\n\n\n\n\n\nEurasianism is a new path for Russia, an opportunity to regain its lost influence after the collapse of the USSR, a third path that may not lead to the collapse of the world's largest country once again."
 ##########Events##########
 sov_putin.1.t: "Kosak-Memorandum"
 sov_putin.1.d: "The Russian Presidential Administration has developed a plan for resolving the Transnistrian conflict and is ready to offer us assistance in implementing this plan. According to the memorandum, the creation of the Transnistrian and Gagauz autonomous regions within our country is envisaged, which essentially leads to the federalization of our country. Additionally, Russia maintains a military base on our territory for a certain period."
 sov_putin.1.a: "We Accept"
 sov_putin.1.b: "This Option is Not Suitable For Us"
 sov_putin.2.t: "Kosak-Memorandum"
 sov_putin.2.d: "The Moldovan government agreed to accept our memorandum, and thus we were able to resolve a diplomatic conflict in the former USSR."
 sov_putin.2.a: "Nice"
 sov_putin.3.t: "Kosak-Memorandum"
 sov_putin.3.d: "The Moldovan government has rejected our idea of federalizing their country, and they seem to like the frozen conflict."
 sov_putin.3.a: "Sad"
 sov_putin.3.b: "Maybe Ebanem?"
 sov_putin.4.t: "Invasion of Moldova"
 sov_putin.4.d: "Russia is ready to offer a radical solution to the Moldovan issue and is ready to help us carry out a special military operation to capture the entire territory of Moldova"
 sov_putin.4.a: "We Agree"
 sov_putin.4.b: "No"
 sov_putin.5.t: "Invasion of Moldova"
 sov_putin.5.d: "Transnistria has rejected our proposed solution to the Moldovan issue, and we seem to be losing influence in the region."
 sov_putin.5.a: "Very Sad"
 sov_putin.6.t: "Stabilization Fund"
 sov_putin.6.d: "The President has signed a decree establishing a stabilization fund, which he sees as a means of stabilizing the economy in extreme cases when all other means have been exhausted."
 sov_putin.6.a: "Hopefully This Will Help."
 sov_putin.7.t: "Young Guard of United Russia"
 sov_putin.7.d: "Russia's political reform should affect all areas, including the youth sector. We will create our own organization to influence politically active young people for the purposes of our party's campaigning."
 sov_putin.7.a: "Glory to United Russia!"
 sov_putin.8.t: "The Third Federation Council"
 sov_putin.8.d: "The presidential reform involves replacing governors and heads of legislative bodies with appointed representatives who will work in the Federation Council on a permanent and professional basis. This should also strengthen the cohesion of regional entities around the federal center."
 sov_putin.8.a: "Federalism is Our Future"
 sov_putin.9.t: "Emergence of the Cult of Putin"
 sov_putin.9.d: "Whether intentionally or not, a cult of personality is already being formed around our President, who has already been given a name by the opposition - Putinism. Moreover, this opposition skillfully ignores all the economic and political successes we have achieved, which is not surprising."
 sov_putin.9.a: "Just One Presidential Term"
 sov_putin.10.t: "Power of Siloviki is Increasing"
 sov_putin.10.d: "Our actions are increasing the power of the security agencies in our country, and some Western publications are already calling our country a dictatorship of siloviks."
 sov_putin.10.a: "Safety Above All"
 sov_putin.11.t: "Security Council's Place in the System"
 sov_putin.11.d: "The Security Council performed various functions in the 1990s, depending on the political situation, and it is time to finally establish its coordinating functions in order to prevent the expansion of this authority."
 sov_putin.11.a: "Order Above All"
 sov_putin.12.t: "End of Federal Tax Police"
 sov_putin.12.d: "By the President's decree, the department that had existed since the formation of the current Russia was disbanded, and without much explanation, all the employees and functions of the Tax Police were transferred to the Ministry of Internal Affairs of Russia."
 sov_putin.12.a: "Last Days"
 sov_putin.13.t: "Federal Drug Control Service"
 sov_putin.13.d: "On the basis of the tax police's material base, a new agency was established - the Federal Drug Control Service. Its main objective was to combat the illicit trafficking of drugs and psychotropic substances."
 sov_putin.13.a: "Another Rearrangement of Chairs"
 sov_putin.14.t: "Rosfinmonitoring"
 sov_putin.14.d: "Another ministry joined the Russian ranks, as the Financial Monitoring Committee was unable to fulfill its mission. The President established the Ministry, which became part of the financial intelligence agency responsible for combating terrorism financing and money laundering."
 sov_putin.14.a: "Not A Ruble To The Terrorists"
 sov_putin.15.t: "Federal Customs Service"
 sov_putin.15.d: "The Customs Committee existed during the collapse of the USSR and was the first independent customs authority in Russian history. Now is the time for reforms in this area, and the next ministry will be responsible for the same tasks as the committee, but its legislative functions will be transferred to another ministry to reduce bureaucracy."
 sov_putin.15.a: "Illegal Goods Are Not Allowed to Pass"
 sov_putin.16.t: "Federal Migration Service"
 sov_putin.16.d: "Previously, migration issues were handled by a special department within the Ministry of Internal Affairs of the USSR and Russia. However, by presidential decree, the functions of this department have been transferred to a separate ministry, which is intended to increase the efficiency of migration control."
 sov_putin.16.a: "Please Show Me Your Passport"
 sov_putin.17.t: "ROSATOM"
 sov_putin.17.d: "Finally, we have unified our nuclear industry, and Rosatom will become one of the strongest economic flagships."
 sov_putin.17.a: "Russian Atom - Future of the Country"
 sov_putin.18.t: "Nabibulina Stays Again"
 sov_putin.18.d: "Elvira Nabiullina has proven that she is an excellent head of the Central Bank, and she is loyal to our president, which means that we can expect no economic sabotage from this government agency. We intend to transfer many regulatory functions to the Central Bank of the Russian Federation, which will undoubtedly strengthen our economic and political stability."
 sov_putin.18.a: "Nice"
 sov_putin.19.t: "Russia Launches an Information War!"
 sov_putin.19.d: "The Russian government has begun actively expanding its international television channel, RUSSIA TODAY. It seems that they intend to launch a full-fledged information war against us"
 sov_putin.19.a: "We Won't be Watching Borscht Cooking Recipe"
 sov_medvedev.1.t: "Medvedev Takes Power from Putin!"
 sov_medvedev.1.d: "Originally placed in office to bypass presidential term limits, Dmitry Medvedev has now broken from Putin’s shadow. With his rival removed, Medvedev stands alone at the helm of Russian power. A new chapter in Russian history begins."
 sov_medvedev.1.a: "Our future is uncertain."
 sov_medvedev.2.t: "The Russian Threat"
 sov_medvedev.2.d: "The Russian president has issued an ultimatum stating that he intends to deal with our so-called 'independence' and has directly threatened us with occupation if we do not comply. We are well aware of the consequences, and it is time to decide what we will do."
 sov_medvedev.2.a: "We Will Not Give Up."
 sov_medvedev.2.b: "Let's Surrender and Save Our Lives."
 sov_medvedev.3.t: "The Georgian Blitzkrieg"
 sov_medvedev.3.d: "The Georgian government realized that they couldn't do anything in their situation and decided to surrender to us."
 sov_medvedev.3.a: "Nice"
 sov_medvedev.5.t: "USA Refuses to Reset Relations"
 sov_medvedev.5.d: "The United States does not intend to improve relations with us, and it seems that they need an external enemy to maintain internal political stability."
 sov_medvedev.5.a: "Damn"
 sov_medvedev.4.t: "Russia Proposes a Reset in Relations"
 sov_medvedev.4.d: "The new Russian government, with a more pro-Western stance than Putin’s regime, has extended an offer to reset relations. Their diplomats propose a fresh start, a 'reload' for cooperation."
 sov_medvedev.4.a: "Sure! Russians can be good friends!"
 sov_medvedev.4.b: "We can't be friends with them."
 sov_medvedev.6.t: "Putin and Medvedev Proclaim Duumvirate!"
 sov_medvedev.6.d: "In a surprising political move, the President and Prime Minister of Russia have jointly announced that they will govern together in a formal duumvirate. This unprecedented arrangement reshapes Russia’s power structure."
 sov_medvedev.6.a: "Good"
 sov_medvedev.7.t: "The New Russian Regime"
 sov_medvedev.7.d: "Our President has become increasingly vocal on social media, expressing bold new views about the West. His rhetoric has shifted dramatically, signaling Russia’s return to a path of assertive independence."
 sov_medvedev.7.a: "I hate them, they are bastards and degenerates."
 sov_medvedev.8.t: "Russian Shift Toward the West"
 sov_medvedev.8.d: "A bold new policy has been announced by the President. Russia will now see the West not as an enemy, but as a vital partner. Our nation turns a new leaf."
 sov_medvedev.8.a: "God Bless America!... and Russia!"
 sov_medvedev.9.t: "The Russian Threat"
 sov_medvedev.9.d: "In his address to us, the President of Russia stated the need to return Northern Kazakhstan back to its homeland, Russia. We perceive this as a threat. Now, we face a threat from our former neighbor, Russia, and we must decide what to do."
 sov_medvedev.9.a: "We Will Not Give Up."
 sov_medvedev.9.b: "Let's Surrender and Save Our Lives."
 sov_medvedev.10.t: "Northern Kazakhstan Has Been Returned"
 sov_medvedev.10.d: "The Kazakh government realized the reality of the situation and complied with our demands, and now these lands have returned to their true homeland."
 sov_medvedev.10.a: "Nice"
 sov_medvedev.11.t: "The Civil War!"
 sov_medvedev.11.d: "Unexpectedly, a rebellion broke out in several regions of our country in the morning, and national minorities launched an armed uprising against our army and our state. This raises many questions about where they got their weapons and who was able to sponsor such a massive rebellion, but we have an idea."
 sov_medvedev.11.a: "Let's Protect the Country!"
 sov_medvedev.12.t: "[FROM.GetName] Asks For Support"
 sov_medvedev.12.d: "We were able to organize a rebellion in Azerbaijan, and one of the national groups is asking for our country's help and direct involvement to protect them. What will our response be?"
 sov_medvedev.12.a: "The End of Tomatoes Has Come"
 sov_medvedev.12.b: "We Shouldn't Interfere."
 sov_medvedev.13.t: "[FROM.GetName] Proposes an Attack on South Korea"
 sov_medvedev.13.d: "The Russian leader said that he was ready to conduct a military operation against South Korea together with us in order to finally resolve this half-century-old issue."
 sov_medvedev.13.a: "K-POP Must Be Destroyed"
 sov_medvedev.13.b: "No"
 sov_medvedev.14.t: "Militsiya Renamed into Politsiya"
 sov_medvedev.14.d: "President Dmitry Medvedev has signed the Law on Police, marking a key reform of the law enforcement system. The reform changes the name 'Militsiya' to 'Politsiya', and aims to reduce bureaucratic overlap while strengthening the partnership between police and civil society. It also redefines the duties, rights, and responsibilities of police officers."
 sov_medvedev.14.a: "It changes everything."
 sov_medvedev.15.t: "Putin Goes to Pikalyovo"
 sov_medvedev.15.d: "Amid a deep financial crisis, two of the town of Pikalyovo's three key industrial plants were shut down, leaving the workers jobless and desperate. Mass protests erupted, prompting government intervention. Putin personally visited the town, summoned the oligarchs involved, and demanded the factories be reopened—demonstrating his authority over Russia's economic elite."
 sov_medvedev.15.a: "Give me back my pen!"
 sov_medvedev.16.t: "Creation of the EAEU"
 sov_medvedev.16.d: "The Customs Union between the former Soviet states was just the beginning, and Russia is now proposing to expand our economic agreements by creating the Eurasian Economic Union. Are we ready to strengthen our economic ties with Russia to this extent?"
 sov_medvedev.16.a: "Yes"
 sov_medvedev.16.b: "No"
 sov_medvedev.17.t: "[FROM.GetName] Has Signed the EAEU Treaty"
 sov_medvedev.17.d: "Their government has agreed to sign the EAEU agreement, great!"
 sov_medvedev.17.a: "Nice"
 sov_medvedev.18.t: "[FROM.GetName] Renounced the EAEU Treaty"
 sov_medvedev.18.d: "It seems that they don't see the point in increased economic integration with us."
 sov_medvedev.18.a: "Sad"
 sov_medvedev.19.t: "Putin Goes Into Opposition"
 sov_medvedev.19.d: "This morning, Russia Today aired an interview with former President Vladimir Vladimirovich Putin, in which he stated that he intends to lead the opposition forces against the current president, as he believes that his rise to power was illegitimate. He also expressed his belief that Dmitry Anatolyevich's policies may lead Russia astray from its true path."
 sov_medvedev.19.a: "Are Presidential Terms Not Enough For Him?"
 sov_medvedev.20.t: "Eurasian Project Has Been Created"
 sov_medvedev.20.d: "Despite the fact that the creation of such a state seemed like a fantasy to many, we have succeeded in restoring some of the influence we lost after the collapse of the USSR, now under the banner of a new ideology."
 sov_medvedev.20.a: "Uraaaa!"
 sov_medvedev.21.t: "Creation of the Skolkovo"
 sov_medvedev.21.d: "We intend to create our own Silicon Valley, which will allow us to effectively implement innovative technologies in our economy."
 sov_medvedev.21.a: "Technology for the Masses"
