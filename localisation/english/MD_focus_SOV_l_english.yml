 SOV_perimetr_system_desc: "Perimetr system is a automatic or semi-automatic nuclear weapons control system. It can initiate the launch of the Russian intercontinental ballistic missiles (ICBMs) by sending a pre-entered highest-authority order from the General Staff of the Armed Forces, Strategic Missile Force Management to command posts and individual silos if a nuclear strike is detected by seismic, light, radioactivity, and pressure sensors even with the commanding elements fully destroyed."

