 #Union of Right Forces (SPS)
 SOV_rise_right_forces: "Rise of Right Forces"
 SOV_rise_right_forces_desc: "The Union of Right Forces was forged from the electoral bloc of liberal movements before the 1999 Duma elections, uniting Yegor Gaidar, Anatoly Chubais, and the young Nizhny Novgorod governor Boris Nemtsov. Born in 1959, the physicist-turned-politician became the party's rising star. Now that Nemtsov sits in the Kremlin, we will finally complete the reforms of the 1990s, break corrupt state corporations, and build a free, European Russia."
 SOV_shake_presidential_administration: "Shake the Presidential Administration"
 SOV_shake_presidential_administration_desc: "We will dismiss dozens of corrupt regional governors and federal agency heads, replacing them with young lawyers, human rights activists, and market economists. This surgical removal of the old bureaucracy will clear the way for genuine reform."
 SOV_interregional_support_group: "Interregional Support Group"
 SOV_interregional_support_group_desc: "To counter Moscow-centric politics, Nemtsov will create an Interregional Support Group - a network of loyal governors from Pskov, Samara, St. Petersburg, and beyond. They will receive budget autonomy and local policy freedom in exchange for public backing of federal reforms."
 SOV_relations_yeltsin_family: "Relations with Yeltsin's Family"
 SOV_relations_yeltsin_family_desc: "The Yeltsin family still controls key media assets, so Nemtsov will negotiate a pragmatic pact: they will stay out of politics and allow anti-corruption investigations, while the state will guarantee the safety of their legal holdings. This is a necessary compromise for stability."
 SOV_oligarchs_political_resource: "Oligarchs' Political Resource"
 SOV_oligarchs_political_resource_desc: "We cannot destroy the oligarchs overnight without triggering capital flight, so we will co-opt their political resources instead. They will fund our campaigns, and we will not reopen the privatizations of the 1990s - a Faustian bargain for short-term stability."
 SOV_temporary_union_fatherland: "Temporary Union with the Fatherland"
 SOV_temporary_union_fatherland_desc: "Nemtsov will form a temporary electoral alliance with the Fatherland - All Russia movement of Primakov and Luzhkov. We will nominate joint candidates for governorships in exchange for centrist support in the State Duma, putting pragmatism before ideology."
 SOV_ensure_support_internal_intelligence: "Ensure Internal Intelligence Support"
 SOV_ensure_support_internal_intelligence_desc: "The FSB and GRU are states within the state, so Nemtsov will offer them a deal: immunity from prosecution for past political meddling and increased budgets in exchange for their loyalty and cooperation in fighting real crime. This will pacify the wolves for now."
 SOV_mobilize_bureaucracy: "Mobilize the Bureaucracy"
 SOV_mobilize_bureaucracy_desc: "The federal bureaucracy can either sabotage reforms or execute them, so Nemtsov will launch a mobilization campaign with performance metrics, digital document flow, and bonuses for civil servants who meet targets. We will cut red tape and get the state machinery moving again."
 SOV_course_yeltsinism: "Course to Yeltsinism"
 SOV_course_yeltsinism_desc: "President Nemtsov will rebrand his program as 'Yeltsinism with a human face' - a return to the 1990s ideals of freedom, private initiative, and Western integration, but without the shock therapy and oligarchic looting. This will be a liberal course for a new generation."
 SOV_council_entrepreneurs: "Council of Entrepreneurs"
 SOV_council_entrepreneurs_desc: "Instead of fighting the oligarchs, we will invite them into a formal advisory council. They will voice concerns and shape economic policy, while we secure their political neutrality and investment commitments. Crony capitalism will be regulated, not eliminated."
 SOV_committee_constitutional_order: "Committee for Constitutional Order"
 SOV_committee_constitutional_order_desc: "An emergency committee of jurists and security officials will draft measures to stabilize the constitutional order: streamlined police powers, temporary suspension of civil liberties in crisis zones, and fast-track deportation of foreign criminals. Order will come before democracy when necessary."
 SOV_power_vertical: "Power Vertical"
 SOV_power_vertical_desc: "Nemtsov will keep the 'power vertical' structure but change the people: loyal reformers will replace siloviki as regional overseers, making efficiency the new motto instead of oppression. The vertical will serve reform, not personal loyalty."
 SOV_kingdoms_for_loyalty: "Kingdoms for Loyalty"
 SOV_kingdoms_for_loyalty_desc: "In exchange for public loyalty and implementation of federal policies, governors will receive almost complete autonomy over local budgets, law enforcement appointments, and cultural affairs. Separatist sentiments will drop, but so will democratic accountability - a feudal bargain for a modern state."
 SOV_presidential_majority_coalition: "Presidential Majority Coalition"
 SOV_presidential_majority_coalition_desc: "To pass reforms, Nemtsov will build a broad 'presidential majority' coalition in the Duma, bringing together conservative nationalists, centrist industrialists, and liberal reformers. The price will be endless compromises: social spending for the left, tax cuts for the right."
 SOV_governors_representation: "Governors' Representation"
 SOV_governors_representation_desc: "We will reform the Federation Council into a chamber where governors' representatives sit permanently, giving regions a real stake in federal lawmaking. This will bring stability through co-optation, not coercion, and finally let the voice of the regions be heard."
 SOV_flow_western_capital: "Flow of Western Capital"
 SOV_flow_western_capital_desc: "After years of capital flight, Nemtsov will offer Western investors tax holidays, legal guarantees against expropriation, and fast arbitration. Money will flow back, factories will reopen, and the ruble will stabilize. Pragmatism will beat geopolitical pride."
 SOV_yeltsin_heroization: "Heroization of Yeltsin"
 SOV_yeltsin_heroization_desc: "President Nemtsov will launch a state program to celebrate Boris Yeltsin as the father of modern Russian democracy. Streets will be renamed, monuments erected, and scholarships established to create a 'usable past' that legitimizes liberal reforms and marginalizes both communist nostalgia and authoritarianism."
 SOV_atone_guilt_before_people: "Atone Guilt Before the People"
 SOV_atone_guilt_before_people_desc: "The state will admit its crimes: the botched privatization, the war in Chechnya, the suppression of media, and the impoverishment of millions. We will finance a one-time compensation fund with a tax on oligarchic assets. Money cannot heal wounds, but it will acknowledge the debt."
 SOV_federal_regional_balance: "Federal-Regional Balance"
 SOV_federal_regional_balance_desc: "A Constitutional Commission will rebalance powers between Moscow and the regions. Subjects will gain control over natural resources taxes and local infrastructure, while the center will retain defense, foreign affairs, and anti-corruption prosecution. We will create a true federation, not a unitary empire."
 SOV_liberal_electoral_machine: "Liberal Electoral Machine"
 SOV_liberal_electoral_machine_desc: "The administrative resource of the state will turn into a 'liberal electoral machine': governors will ensure that pro-presidential candidates win majorities in regional legislatures, raising the national threshold to 8% to keep extremists out. This will be managed democracy for stable results."
 SOV_there_is_no_other_way: "There Is No Other Way"
 SOV_there_is_no_other_way_desc: "After years of compromise and consolidation, Nemtsov will conclude: 'We had no choice. The alternative was chaos and collapse.' What he built is not perfect, but it works. Russia will become a pragmatic, stable, and cynical managed democracy - a Potemkin republic that delivers growth and silence."
 SOV_general_strategic_plan_reforms: "General Strategic Plan of Reforms"
 SOV_general_strategic_plan_reforms_desc: "Inspired by Max Weber's critique of patrimonial bureaucracy, the government will launch a 'General Strategic Plan' to replace personal loyalty with formal rules, depoliticize the civil service, and create an independent judiciary. This will be rational governance, not Western copying."
 SOV_committee_state_reform: "Committee for State Reform"
 SOV_committee_state_reform_desc: "A special State Reform Committee of legal scholars, economists, and former judges will draft a package of administrative reforms. We will eliminate redundant agencies, digitalize public services, and create a new civil service code based on merit, not connections."
 SOV_duma_democratic_alliance: "Duma Democratic Alliance"
 SOV_duma_democratic_alliance_desc: "All democratic parties in the Duma - liberals, social democrats, greens, and libertarians - will form a coalition to support the reform agenda. They differ on many issues, but they agree that the old authoritarian system must be dismantled. This will be unity against the past."
 SOV_support_regional_reformers: "Support Regional Reformers"
 SOV_support_regional_reformers_desc: "Young, pro-Western economists and lawyers will be appointed as acting governors in several regions, replacing old Soviet-era bosses. They will cut local red tape, attract investment, and respect ethnic minority rights. Separatist sentiments will fade, and growth will accelerate."
 SOV_rational_administrative_reform: "Rational Administrative Reform"
 SOV_rational_administrative_reform_desc: "The government will adopt a 'rational' administrative system: each ministry will have measurable KPIs, overlapping functions will be merged, and a federal audit agency will monitor outcomes without political interference. The state will become a predictable machine."
 SOV_people_against_tsars: "People Against Tsars"
 SOV_people_against_tsars_desc: "In Kazan, Makhachkala, and Nalchik, ordinary people can no longer bear the local elites who have drained their regions dry for decades, pocketing budgets and crushing any dissent. When their patience finally snaps and protests erupt, Nemtsov will send federal inspectors and promise to remove these entrenched dictators. Popular anger will finally break the stranglehold of corrupt local 'tsars' and restore some justice."
 SOV_negotiate_with_oligarchs: "Negotiate with Oligarchs"
 SOV_negotiate_with_oligarchs_desc: "A series of secret negotiations will lead to a 'grand bargain': oligarchs will return 30% of their assets to the state in exchange for immunity from prosecution for past privatization crimes. The state will regain control over strategic sectors while the oligarchs keep the rest - a dirty but realistic deal."
 SOV_conscious_civil_society: "Conscious Civil Society"
 SOV_conscious_civil_society_desc: "We will redirect state funding to independent NGOs, human rights groups, and environmental watchdogs. A new 'Civil Society Council' will give activists direct access to lawmakers. The hope is to transform spontaneous protest into institutional dialogue - a conscious, not reactive, society."
 SOV_liberalization_regional_life: "Liberalization of Regional Life"
 SOV_liberalization_regional_life_desc: "Regional authorities will receive permission to experiment with lower local taxes, fast-track permits for small businesses, and publicly elected mayors. The best practices will then be scaled nationwide. This is liberalization from below, not by Moscow decree - a laboratory for reform."
 SOV_necessary_intervention: "Necessary Intervention"
 SOV_necessary_intervention_desc: "When a state-owned corporation collapses under debt and corruption, the government will intervene: fire the board, appoint a special administrator, and split the company into competitive units. Privatization is not an ideology but a tool when management fails."
 SOV_direct_elections_senators: "Direct Elections of Senators"
 SOV_direct_elections_senators_desc: "We will transform the Federation Council: senators will be directly elected by popular vote in each region for six-year terms. The upper house will no longer be a club of appointed loyalists but a genuine check on presidential power. Democracy will become real, not just symbolic."
 SOV_market_free_nomenklatura_capitalism: "Market Free from Nomenklatura Capitalism"
 SOV_market_free_nomenklatura_capitalism_desc: "We will break up state-owned giants and sell them via public IPOs, distributing shares to citizens as vouchers. A one-time 'oligarch asset consolidation limit' will prevent any single shareholder from owning more than 10% of large enterprises. This will be capitalism without nomenklatura."
 SOV_path_russian_democracy: "Path to Russian Democracy"
 SOV_path_russian_democracy_desc: "Nemtsov will address the nation: 'This is not Western democracy copied and pasted. This is Russian democracy - messy, noisy, and alive.' We will build competitive elections, free media, an elected senate, and an independent judiciary. The path is uncertain, but it leads to freedom."
 SOV_yeltsin_system_failure: "Yeltsin System Failure"
 SOV_yeltsin_system_failure_desc: "The 1990s were not Yeltsin's triumph but his failure: chaos, crime, and the rise of oligarchs. Nemtsov will break with the Yeltsin legacy, declaring that the old system of 'wild capitalism' is dead. A new, strong state will rise from the ruins - with order, not anarchy."
 SOV_fulfill_siloviki_dreams: "Fulfill Siloviki's Dreams"
 SOV_fulfill_siloviki_dreams_desc: "The security services have long dreamed of a state where they control everything. Nemtsov will give them increased budgets, expanded surveillance powers, and political influence - but only against real criminals, not the opposition. The siloviki will be unleashed, but on a short leash."
 SOV_round_table_oligarchs: "Round Table with Oligarchs"
 SOV_round_table_oligarchs_desc: "Nemtsov will invite the top oligarchs to a 'round table' and cut a deal: they will stop interfering in politics and pay higher taxes; in exchange, the state will stop investigations into their past dealings and guarantee property rights. This cynical truce will stabilize the economy."
 SOV_pressure_red_belt: "Pressure the Red Belt"
 SOV_pressure_red_belt_desc: "The 'Red Belt' governors - communist strongholds in the industrial heartland - will be pressured to leave the Communist Party or face audits, investigations, and loss of federal funding. Several will defect, joining the pro-presidential coalition. The red threat will be defanged."
 SOV_faith_in_commander_in_chief: "Faith in the Commander-in-Chief"
 SOV_faith_in_commander_in_chief_desc: "A massive propaganda campaign will emphasize Nemtsov as a strong, decisive leader - the 'commander-in-chief' who restores order and national pride. The military will be glorified, patriotic symbols restored, and critics labeled 'enemies of the state'. This is authoritarian populism."
 SOV_blinded_by_politicking: "Blinded by Politicking"
 SOV_blinded_by_politicking_desc: "Nemtsov masterfully plays the political game, distracting the elites with endless intrigues and media noise. While they fight shadows, he quietly withdraws from the public eye, focusing on strengthening the party from within: building regional branches, training loyal cadres, and preparing for the next electoral cycle. The opposition celebrates an imaginary victory, but Nemtsov has already moved on to a quieter, more methodical phase of consolidation."
 SOV_appease_national_elites: "Appease National Elites"
 SOV_appease_national_elites_desc: "In the Caucasus and Tatarstan, the Kremlin will offer local elites a deal: complete cultural autonomy, control over local resources, and immunity from federal prosecution in exchange for loyalty and suppression of separatism. This will buy stability at the price of moral compromise."
 SOV_self_coup: "Self-Coup"
 SOV_self_coup_desc: "Citing a 'growing crisis of power,' Nemtsov will deploy army units to Moscow, dissolve the Duma, and assume emergency powers. The self-coup will be bloodless, but the constitution will be torn. He will argue that only a firm hand can save Russia from chaos. The era of what-ifs ends."
 SOV_concept_decembrist_dictatorship: "Concept of Decembrist Dictatorship"
 SOV_concept_decembrist_dictatorship_desc: "Nemtsov will openly advocate a 'Decembrist dictatorship' - a temporary, enlightened dictatorship to cleanse the state of corruption and then restore democracy. The term is provocative, but the method is familiar: rule by decree, suspension of elections, and centralization of authority."
 SOV_reorganization_executive_power: "Reorganization of Executive Power"
 SOV_reorganization_executive_power_desc: "The government will be reorganized: several ministries will merge into super-ministries, and regional prefects will be appointed by the president rather than elected. The goal is efficiency, but the result will be a further concentration of power in the Kremlin. The executive branch becomes a spear."
 SOV_military_federal_districts: "Military-Federal Districts"
 SOV_military_federal_districts_desc: "The seven federal districts will be replaced by military-federal districts, each headed by a general reporting directly to the president. Civilian governors will lose their authority over local troops. The state will become a garrison where the commander-in-chief holds every key."
 SOV_state_of_emergency: "State of Emergency"
 SOV_state_of_emergency_desc: "A state of emergency will be declared nationwide, ostensibly to combat corruption and terrorism. Curfews, warrantless searches, and media censorship will be imposed. Civil liberties will be suspended indefinitely. Nemtsov will promise to lift the emergency once reforms are complete - but when?"
 SOV_temporary_federal_council: "Temporary Federal Council"
 SOV_temporary_federal_council_desc: "A Temporary Federal Council, composed of appointed regional representatives and military brass, will replace the Duma and Federation Council as the supreme legislative body. Elections will be postponed sine die. The council will be a rubber stamp, but it will provide legal cover."
 SOV_remove_red_threat: "Remove the Red Threat"
 SOV_remove_red_threat_desc: "The Communist Party will be banned, and its leaders arrested on charges of 'attempting to organize underground anti-state activities.' Gennady Zyuganov will be taken into custody. The red threat, which has haunted Russia since 1917, will finally be removed - by dictatorial decree."
 SOV_commission_economic_transformation: "Commission for Economic Transformation"
 SOV_commission_economic_transformation_desc: "A Commission for Economic Transformation, staffed by young libertarian economists, will draft a radical shock therapy: immediate price liberalization, mass privatization, and sharp cuts in social spending. The pain will be severe, but the advocates promise long-term growth."
 SOV_conditional_autonomy_national_minorities: "Conditional Autonomy for National Minorities"
 SOV_conditional_autonomy_national_minorities_desc: "National minorities will be granted 'conditional autonomy': they may use their native languages in local administration and schools, but only if they renounce separatism and accept Russian as the state language. This compromise will irritate both nationalists and minorities."
 SOV_society_concerned_reformists: "Society of Concerned Reformists"
 SOV_society_concerned_reformists_desc: "A new civil movement, the 'Society of Concerned Reformists,' will be created under Nemtsov's patronage. It will organize rallies in support of the reforms, counter-protests against communists, and monitor regional compliance - a loyal street force for the new regime."
 SOV_imperial_presidency: "Imperial Presidency"
 SOV_imperial_presidency_desc: "Nemtsov will proclaim himself President-Emperor of All Russia, ending the pretense of republican democracy. The title is symbolic, but the consolidation of power is real - the Duma will be dissolved, political parties banned, and a new 'imperial constitution' drafted. The Third Rome rises."
 SOV_russian_economic_space: "Russian Economic Space"
 SOV_russian_economic_space_desc: "Russia will withdraw from all post-Soviet economic agreements and create a new 'Russian Economic Space' - a tight customs union with only Belarus, Kazakhstan, and Armenia. We will aim for economic self-sufficiency rather than integration, building a fortress economy for a fortress state."
 SOV_support_syrian_opposition: "Support Syrian Opposition"
 SOV_support_syrian_opposition_desc: "Russia will provide financial and military aid to secular opposition forces in Syria, hoping to replace the Assad regime with a pro-Russian, pro-Western government. The goal is a friendly Damascus, not a civil war - pragmatic geopolitics in the Middle East."
 SOV_destroy_european_union: "Destroy the European Union"
 SOV_destroy_european_union_desc: "Russia will launch a political campaign to destabilize the European Union, funding eurosceptic parties and encouraging member states to leave. The goal is a Europe of sovereign nations rather than a federal superstate - a long-term ideological war against Brussels."
 SOV_russian_american_investment_strategy: "Russian-American Investment Strategy"
 SOV_russian_american_investment_strategy_desc: "Nemtsov will propose a joint investment forum with the United States, offering American capital access to Russian energy and infrastructure projects in exchange for technology transfers and political recognition. This will be pragmatic cooperation, not confrontation."
 SOV_alliance_israel: "Alliance with Israel"
 SOV_alliance_israel_desc: "Russia will sign a mutual defense and investment treaty with Israel, guaranteeing its security in exchange for high-tech cooperation and intelligence sharing. The alliance will anger Iran but strengthen Russia's position in the Middle East - a strategic pivot toward the Mediterranean."
 SOV_congress_eurosceptics: "Congress of Eurosceptics"
 SOV_congress_eurosceptics_desc: "Russia will host an international congress of eurosceptic parties in Moscow, bringing together anti-EU movements from France, Germany, Italy, Hungary, and other countries. The goal is to create a network of influence that pushes for the European Union's dissolution."
 SOV_eastern_prosperity: "Eastern Prosperity"
 SOV_eastern_prosperity_desc: "A massive investment program will target Belarus, Ukraine, and Moldova, offering cheap loans and infrastructure projects in exchange for alignment with Russia's economic space. The aim is to pull post-Soviet neighbors back from the European Union's orbit - eastern prosperity through Russian capital."
 SOV_ruspac: "RUSPAC"
 SOV_ruspac_desc: "Russia will propose a new security pact for the Pacific, RUSPAC, inviting China, Japan, and India to join a mutual non-aggression framework. The goal is to reduce tensions and focus on economic competition rather than military confrontation - a multipolar alternative to NATO in Asia."
 SOV_eliminate_hezbollah: "Eliminate Hezbollah"
 SOV_eliminate_hezbollah_desc: "Russia will join Israel in a coordinated military operation to destroy Hezbollah's military infrastructure in southern Lebanon. The aim is to strengthen the Lebanese state, reduce Iranian influence, and secure the eastern Mediterranean - a risky but potentially decisive blow."
 SOV_european_free_zone: "European Free Zone"
 SOV_european_free_zone_desc: "Russia will propose a 'European Free Zone' - a trade and customs area stretching from Lisbon to Vladivostok, excluding only the United States. The goal is to split Europe from America and create a Eurasian economic bloc under Russian leadership."
 SOV_defeat_nato: "Defeat NATO"
 SOV_defeat_nato_desc: "Russia will present the United States with an ultimatum: sign a non-aggression pact and dissolve NATO, or face a new arms race and proxy conflicts worldwide. This is a dangerous gamble for a geopolitical reset to end American military dominance in Europe."
 SOV_campaign_against_pseudo_liberalism: "Campaign Against Pseudo-Liberalism"
 SOV_campaign_against_pseudo_liberalism_desc: "The regime will launch a propaganda campaign against 'pseudo-liberalism' - Western-style democracy, LGBT rights, and multiculturalism - branding them as foreign toxins. The goal is to rally conservative forces behind the dictatorship, using culture war as a tool of authoritarian consolidation."
 SOV_decree_great_restoration: "Decree on the Great Restoration"
 SOV_decree_great_restoration_desc: "Nemtsov will sign the 'Decree on the Great Restoration,' proclaiming the monarchy restored and declaring himself regent until a 'legitimate heir' is found, suspending the constitution indefinitely. The republic is dead - long live the regent and the empire."
 SOV_convene_zemsky_sobor: "Convene the Zemsky Sobor"
 SOV_convene_zemsky_sobor_desc: "The regent will convene a Zemsky Sobor - a traditional assembly of nobles, clergy, and commoners - to elect a new tsar from candidates like Boris Yeltsin (as a symbolic figurehead) or a distant Romanov pretender. The Sobor will rubber-stamp the regent's choice - a medieval ritual for a modern dictatorship."
 SOV_convene_imperial_assembly: "Convene the Imperial Assembly"
 SOV_convene_imperial_assembly_desc: "A new Imperial Assembly will replace the Duma, composed of appointed nobles, church officials, and industrial magnates. There will be no elections, only advisory powers. The regent will rule by decree - feudal democracy for a feudal state."
 SOV_re_imperialization: "Re-Imperialization"
 SOV_re_imperialization_desc: "Cities will be renamed to their pre-revolutionary names, monuments to Lenin will be torn down, and the Soviet period will be officially condemned as an 'illegal occupation'. We will rewrite history to glorify the empire."
 SOV_integrate_ldpr: "Integrate the LDPR"
 SOV_integrate_ldpr_desc: "Nemtsov will integrate the LDPR - Zhirinovsky's nationalist party - into the ruling coalition. Zhirinovsky will become vice-premier, and his followers will receive regional positions. The nationalist vote will be co-opted, and opposition will shrink - a monstrous marriage of convenience."
 SOV_nemtsov_provincial_reform: "Nemtsov's Provincial Reform"
 SOV_nemtsov_provincial_reform_desc: "The provinces will be reorganized into larger 'governorates,' each headed by a presidential appointee. Local self-government will be abolished for administrative efficiency - the final destruction of federalism, making Russia a unitary state."
 SOV_status_roc: "Status of the Russian Orthodox Church"
 SOV_status_roc_desc: "The Russian Orthodox Church will be declared the state religion. Clergy will receive state salaries, and church weddings will have legal force. Other faiths will be tolerated but not funded - a symphonia of throne and altar, as in the old empire."
 SOV_constitutional_referendum: "Constitutional Referendum"
 SOV_constitutional_referendum_desc: "A nationwide referendum will be held on the 'Imperial Constitution' - a document that abolishes direct elections, establishes a hereditary monarchy, and grants the regent absolute power. The regime will present the vote as the will of the people, legitimizing the new autocratic order under the guise of popular approval."
 SOV_civil_service_reform: "Civil Service Reform"
 SOV_civil_service_reform_desc: "The civil service will be purged of all remaining independent-minded officials. Loyalty oaths to the regent will be required, and political police will monitor all appointments. The state will become a machine of personal loyalty, not professional competence - bureaucracy as a sword."
 SOV_decree_imperial_corporations: "Decree on Imperial Corporations"
 SOV_decree_imperial_corporations_desc: "All state-owned corporations will be merged into a single 'Imperial Corporation' - a holding company that controls energy, transportation, and finance directly under the regent. Private oligarchs will be expropriated or bought out. The command economy will return under a new flag."
 SOV_servant_of_the_crown: "Servant of the Crown"
 SOV_servant_of_the_crown_desc: "The prime minister will receive the highest imperial award - the Order of St. Andrew with Crown - from the newly crowned tsar's hands in a ceremony broadcast live on state television. The regent will be hailed as 'the first servant of the crown'. His position will be sacralized."
 SOV_mistakes_of_youth: "Mistakes of Youth"
 SOV_mistakes_of_youth_desc: "Nemtsov will gather the surviving 'young reformers' of the 1990s - Gaidar, Chubais, Yavlinsky, and Zadornov - into a new Council of Economic Advisors. Their task is to draft a new economic strategy that avoids the mistakes of the past: stable, socially responsible, and free from both Soviet stagnation and oligarchic robbery."
 SOV_ministry_of_market_development: "Ministry of Market Development"
 SOV_ministry_of_market_development_desc: "A new Ministry of Market Development will be created, staffed by young technocrats from the business community. Its mission is to promote small business, attract foreign investment, and cut red tape - to create a middle class that never again tolerates authoritarian rule."
 SOV_social_sector_restructuring: "Restructuring of the Social Sector"
 SOV_social_sector_restructuring_desc: "We will restructure social spending: healthcare and education budgets will increase, but subsidies to state-owned enterprises will be cut. The goal is a leaner, more effective welfare state where the poor receive targeted aid, not blanket handouts - efficiency with a human face."
 SOV_human_approach_to_business: "Human Approach to Business"
 SOV_human_approach_to_business_desc: "A 'human approach to business' will replace the predatory capitalism of the 1990s. We will reform tax inspections, ban arbitrary closures, and give legal protection to small enterprises. The goal is to encourage entrepreneurship, not extortion - the state will become a partner, not a bandit."
 SOV_new_taxation_system: "New Taxation System"
 SOV_new_taxation_system_desc: "We will introduce a new tax code with simplified rates, reduced corporate taxes, and a streamlined VAT. The aim is to stimulate investment and reduce the shadow economy. The state will take less but collect more - this will be a liberal tax revolution."
 SOV_domestic_vehicles_for_officials: "Switch Officials to Domestic Vehicles"
 SOV_domestic_vehicles_for_officials_desc: "All state officials will be required to drive domestically produced cars. The goal is to support the Russian auto industry and cut imports. Oligarchs will lose lucrative foreign contracts, and every official car becomes a rolling symbol of industrial revival. A small step for the budget, a giant leap for national pride."
 SOV_northern_russia_industrialization: "Industrialization of Northern Russia"
 SOV_northern_russia_industrialization_desc: "A massive industrialization program will target the northern regions. We will build new ports, railways, factories, and energy infrastructure to exploit Arctic resources and create jobs, finally taming the northern frontier."

 #Events
 sov_boriska.0.t: "The Inauguration of Boris Nemtsov"
 sov_boriska.0.d: "Boris Nemtsov takes the oath of office in the Kremlin, but his style is deliberately low-key. No mass rallies, no fiery speeches to the crowd - instead, a brief address to the nation, streamed online. 'We are not starting a revolution,' he says. 'We are finishing a renovation. The 1990s were a demolition. The 2000s were a stagnation. Now it is time to build - soberly, professionally, and without illusions.'\n\nHe promises to cut bureaucracy, fight corruption, and bring the warring elites to a common table. 'No more childish squabbles. No more loyalty tests. We will measure success not by how many enemies we crush, but by how many jobs we create.' The political establishment is wary, and the public, though uncertain, is ready to support a president who intends to move from promises to real work without wasting time on symbolic gestures."
 sov_boriska.0.a: "Less talk, more work"
 sov_boriska.1.t: "Boris Nemtsov Criticizes Yeltsin's Policies"
 sov_boriska.1.d: "During a working meeting with journalists, Russian President Boris Nemtsov criticized the economic policies of his predecessor, Boris Yeltsin. According to Nemtsov, \"shock therapy\" and lax oversight of privatization in the 1990s led to deep inequality, which his team is still struggling to address. \"We are forced to deal with the consequences of hasty decisions,\" the current president declared, \"but we have a plan to restore people's trust in institutions.\""
 sov_boriska.1.a: "What game is he playing?"
 sov_boriska.2.t: "Boris Nemtsov is Holding a Meeting of Oligarchs"
 sov_boriska.2.d: "President Boris Nemtsov held a closed roundtable meeting with the country's leading businessmen. Contrary to expectations, the oligarchs unanimously declared their support for the head of state's policies. Citizens fear that these actions will create a political umbrella for corruption schemes, and the oligarchy's increased influence over the government will return Russia to the era of the Seven Bankers"
 sov_boriska.2.a: "The Seven Bankers' is back"
 sov_boriska.3.t: "Nemtsov Puts Pressure on the Communists"
 sov_boriska.3.d: "President Boris Nemtsov held a series of closed meetings with the heads of the Red Belt regions. According to sources, the head of state harshly demanded that Communist governors leave the Communist Party of the Russian Federation (CPRF), threatening them with \"loss of political longevity\" if they do so. Several governors have already announced their willingness to leave the party, calling the decision \"forced, but deliberate.\" The CPRF called the events \"political banditry\" and promised to appeal to the Constitutional Court."
 sov_boriska.3.a: "Is this even democratic?"
 sov_boriska.4.t: "Nemtsov Stages a Coup"
 sov_boriska.4.d: "Boris Nemtsov, then in power, unexpectedly deployed army units to the capital. Without any warnings, decrees, or appeals, the equipment simply rolled into the streets, and the military took control of key facilities. The official reason given was \"a growing crisis of power and the government's inability to control the situation.\" Essentially, a so-called \"self-coup\" occurred: the acting president dismissed the cabinet and concentrated all power in his own hands. The public reaction was restrained and frightened. People hastily abandoned the city center, stores emptied, and a wave of anxiety and confusion swept through social media."
 sov_boriska.4.a: "And again a coup, what is this!"
 sov_boriska.5.t: "There's a Coup in Russia Again"
 sov_boriska.5.d: "In a shocking development in Russia, incumbent President Boris Nemtsov, without prior announcement, has deployed army units to Moscow. According to eyewitnesses, military equipment and special forces are blocking government buildings, the television center, and key transportation hubs. Analysts are already calling the incident a \"self-coup\": Nemtsov has dissolved his own government and seized full power, while formally remaining head of state.\n\nEyewitnesses are reporting panic in the city center. People are fleeing the streets, the metro is overcrowded, and many are hastily fleeing the capital. Social media is filled with a mixture of fear and bewilderment. \"We don't understand who's on whose side,\" a local newspaper quotes one resident as saying. \"It feels like the 90s all over again.\" No open protests have been reported yet: the army is in control, and the streets are patrolled. Some of the population, tired of the ongoing crisis, perceives what's happening as a \"restoration of order,\" but international observers are warning of the risk of a slide toward dictatorship.\n\nWestern countries called for the immediate restoration of constitutional order. The European Union announced an emergency meeting of its Council of Ministers. The US State Department expressed \"deep concern.\""
 sov_boriska.5.a: "Oh Russia, what is happening to you?"
 sov_boriska.6.t: "Nemtsov Establishes a Dictatorship"
 sov_boriska.6.d: "Boris Nemtsov announced the establishment of a temporary dictatorship. Speaking on state television, he declared that he was forced to take this step in order to \"clear the way for genuine democracy and civilized capitalism.\" \"First order, then freedom,\" Nemtsov emphasized.\n\nThe opposition and human rights activists have already called the regime a \"democratic regime\" and a cover for usurpation. Some citizens, according to polls, are frozen in anxious confusion, while others, weary of crises, express timid hope for a \"firm hand.\" International observers are calling on Nemtsov to immediately restore constitutional order."
 sov_boriska.6.a: "Russia is once again under dictatorship."
 sov_boriska.7.t: "Zyuganov Has Been Arrested"
 sov_boriska.7.d: "Security forces detain Zyuganov. According to the new regime's press service, Zyuganov was taken into custody as he left his apartment on charges of \"attempting to organize underground anti-state activities\" and \"calls for the overthrow of the established order.\"\n\nHuman rights activists have already called the arrest political persecution, but official sources claim that the investigation is being conducted in strict accordance with the \"decree on temporary dictatorship.\" No statements from the defense have yet been received."
 sov_boriska.7.a: "You dare use my own spells against me, Nemtsov?"
 sov_boriska.8.t: "Boris Nemtsov Proclaimed Himself President-Emperor"
 sov_boriska.8.d: "A month after the establishment of the temporary dictatorship, Boris Nemtsov took another step, finally breaking with democratic rhetoric. Live on state television, he proclaimed himself President-Emperor of All Russia.\n\nThe elites' reaction was predictable panic. Some of yesterday's oligarchs have already sworn allegiance, while others are attempting to flee abroad. Spontaneous protests broke out in the regions, brutally suppressed by troops loyal to the Emperor. Zyuganov, under arrest, declared a hunger strike. The people, according to propaganda, \"jubilantly welcomed the new master.\" The world froze in anticipation-diplomats are leaving Moscow."
 sov_boriska.8.a: "Everything was leading to this, but still WHAT THE HELL?"
 sov_boriska.9.t: "Russia Invites Us To An Economic Alliance"
 sov_boriska.9.d: "Russia invites us to join the Eurasian Economic Partnership. Unlike the old, rigid unions, there will be no dictate from Moscow—only common rules, open markets, and fair competition. For our industry, this is a chance to enter a large, barrier-free market, and for small businesses, to gain predictable conditions. Of course, we need guarantees that the Partnership will not become an instrument of pressure. But if Nemtsov truly builds institutions that operate according to the law, and not according to the interests of Kremlin groups, then joining will be extremely beneficial for us."
 sov_boriska.9.a: "Interesting offer, where should we sign?"
 sov_boriska.9.b: "We don't need handouts from Moscow."
 sov_boriska.10.t: "[FROM.GetName] Ratifies Membership"
 sov_boriska.10.d: "[FROM.GetName] ratifies membership in the Eurasian Economic Partnership. This means our common market is becoming broader, and the rules are more transparent. For us, the Russian side, [FROM.GetName]'s agreement is confirmation that the alliance is not building empires, but mutual benefit. Now entrepreneurs from both countries will be able to work without unnecessary barriers, investments will flow into real projects, and people will experience stability and growth."
 sov_boriska.10.a: "Welcome to a space where economics is more important than geopolitics."
 sov_boriska.11.t: "[FROM.GetName] Refused to Join"
 sov_boriska.11.d: "Unfortunately, [FROM.GetName] declined to join the Eurasian Economic Partnership. We respect our partners' sovereign choices and do not use pressure—this is the foundation of our policy. However, the alliance's doors remain open: if [FROM.GetName] changes its mind and sees the benefits of free trade, technological cooperation, and common standards, they are always welcome to join. Economic prosperity cannot be imposed by force; it is born of goodwill. We look forward to welcoming [FROM.GetName] to the negotiating table when they are ready."
 sov_boriska.11.a: "Well, we don't impose"
 sov_boriska.12.t: "Russia Supports the Opposition"
 sov_boriska.12.d: "We consider this an unfriendly move. We have long-standing ties with Moscow, but when a superpower begins openly providing resources and political cover to forces seeking regime change in Damascus, it crosses the line of what is acceptable. External interference, even under the guise of \"supporting democracy,\" only destabilizes the situation and undermines trust between our countries. We had hoped that President Nemtsov would behave differently from the old imperial regimes, but the result is the same: Russia is choosing sides against the current government. This does not please us, and we demand that such support be stopped."
 sov_boriska.12.a: "This is unacceptable!"
 sov_boriska.13.t: "Russian-American Investment Forum"
 sov_boriska.13.d: "As part of their commitment to pragmatic economic rapprochement, Russia and the United States held their first joint investment forum, \"Growth Without Borders.\" Following the meeting, a package of bilateral agreements covering key areas: business, energy, and trade were signed.\n\nCommenting on the forum's results, the head of the Russian delegation noted: \"We are proving that cooperation between the two largest economies can be built not on political sympathies and antipathies, but on mutual benefit and predictable rules.\""
 sov_boriska.13.a: "This is a new page in Russian-American relations."
 sov_boriska.14.t: "Russia Offers Protection"
 sov_boriska.14.d: "Russia isn't simply offering us \"protection.\" Today, Moscow made a proposal we take seriously: to conclude a bilateral agreement on mutual protection and investment. At the same time, we are being invited to join the Eurasian Economic Partnership. This isn't ordinary diplomacy—it combines security and economics into a single package.\n\nOf course, we will weigh the risks. But the very fact that Moscow (and the current Russian leadership is pragmatic, everyone can see that) is offering Israel an equal alliance, not the role of a junior partner, merits a detailed dialogue. The decision rests with the Knesset, but there is currently less skepticism than hope."
 sov_boriska.14.a: "This is an extremely advantageous offer from Moscow"
 sov_boriska.14.b: "Israel is able to help itself"
 sov_boriska.15.t: "Russia Offers Investments"
 sov_boriska.15.d: "Russia offers us investment. For [ROOT.GetName], this is a chance to renew industry and create jobs without oppressive conditions. Yes, we remember how in the 1990s, investment was often just a cover for asset seizures. But now, under Nemtsov, there's a different Russia, with transparent contracts and international arbitration."
 sov_boriska.15.a: "Deal"
 sov_boriska.15.b: "We don't need handouts from Moscow"
 sov_boriska.16.t: "[FROM.GetName] Accepts Our Investments"
 sov_boriska.16.d: "This is an important step toward strengthening mutual trust and economic growth. Russian funds will be used for specific projects: infrastructure modernization, agricultural development, and support for small businesses in [FROM.GetName]. We guarantee contract transparency, protection of property rights, and international arbitration in the event of disputes. Under President Nemtsov, investment is not a tool of influence, but a way to create jobs and profits for both sides."
 sov_boriska.16.a: "Welcome to our strategic partners"
 sov_boriska.17.t: "[FROM.GetName] Refused Investment"
 sov_boriska.17.d: "[FROM.GetName] has withdrawn from our investment. We respect our partners' sovereign decisions and do not consider this a reason to cool relations. The proposed projects—infrastructure modernization, joint ventures, and preferential lending—remain on the table. If [FROM.GetName] changes their mind or wishes to discuss different terms, we are ready to reopen negotiations at any time."
 sov_boriska.17.a: "We are waiting for [FROM.GetName] to be ready"
 sov_boriska.18.t: "Russia Invites Us to Operation Against Hezbollah"
 sov_boriska.18.d: "Russia is inviting us to participate in a military operation against Hezbollah. We have carefully studied this proposal and declare: Lebanon has expressed interest. Yes, the decision is not easy—Hezbollah has long been a real military and political force, uncontrolled by the state. But that is precisely why we see the Russian initiative as a historic opportunity to restore the monopoly on legal violence to Lebanese institutions.\n\nOur army's participation in the operation on our own territory will mean that we are finally taking responsibility for the southern borders and Beirut Airport. Russia under President Nemtsov offered not an occupation, but coordination, intelligence, and air cover. For us, this is an opportunity to cleanse the country of parallel armies without the risk of being consumed in a protracted civil war."
 sov_boriska.18.a: "Let's liberate our country from pro-Iranian forces!"
 sov_boriska.18.b: "We will not risk internal stability."
 sov_boriska.19.t: "Boris Nemtsov is Restoring the Monarchy"
 sov_boriska.19.d: "Boris Nemtsov, who has consolidated full power in his hands following the events of recent months, made a surprising statement. Live on state television, he announced the restoration of the monarchy in Russia. \"The republic has exhausted itself. The democracy of the 1990s led to chaos, and my temporary dictatorship was merely a necessary measure. True stability lies in a thousand-year tradition,\" Nemtsov declared.\n\nHowever, instead of a coronation, he declared himself a regent-ruler during a \"temporarily absent\" monarch. According to Nemtsov, a legitimate heir to the throne exists but is not yet able to assume the throne for \"objective and temporary reasons.\" The name and location of the potential tsar are not disclosed. The regent promised that \"when the time comes,\" a nationwide ceremony to restore the monarchy will be held.\n\nThe opposition called the events a farce and an attempt to lend a semblance of legitimacy to the usurpation. The Russian Orthodox Church adopted a wait-and-see attitude. Some of the population reacted to the news with bewilderment and alarm."
 sov_boriska.19.a: "Someday this will end..."
 sov_boriska.20.t: "Nemtsov convenes the Zemsky Sobor"
 sov_boriska.20.d: "Boris Nemtsov's inner circle and the government are intensely analyzing the two candidates for the throne: Boris Yeltsin and a member of the House of Romanov. Yeltsin's choice represents a break with the Soviet past and a reliance on the reforms of the 1990s: Yeltsin is a recognizable, yet ailing and formal figure who will serve as a convenient symbol without interfering with the actual governance of Regent Nemtsov. The main risk here is the lack of a clear heir, which threatens a new crisis. Romanov's candidacy, by contrast, provides sacred legitimacy and the support of the church and conservative groups. However, the government fears that Romanov, who has lived abroad for a long time, will prove a puppet or begin to lay claim to real power. Ultimately, the authorities are leaning toward Yeltsin as a manageable temporary symbol, leaving Romanov as a backup option. The final choice rests with the Zemsky Sobor, but behind the scenes, the necessary votes are already being vetted."
 sov_boriska.20.a: "Yeltsin is the ideal candidate"
 sov_boriska.20.b: "Romanovs stable variant"
 sov_boriska.21.t: "Russia Crowns Boris Yeltsin"
 sov_boriska.21.d: "The Zemsky Sobor, convened by Regent Boris Nemtsov, elected Russia's first president, Boris Yeltsin, as the new emperor. The coronation took place in the Kremlin's Assumption Cathedral, and the 74-year-old Yeltsin was proclaimed \"Emperor and Autocrat of All the Russias.\" Regent Nemtsov remains the de facto ruler, governing in the ailing monarch's name. According to his representatives, \"Yeltsin is a symbol of continuity between the reforms of the 1990s and the new, traditional Russia.\"\n\nWestern countries declared they would not recognize the change of government without a national referendum. The Kremlin responded that \"the Zemsky Sobor expresses the will of the people.\" The Russian Orthodox Church blessed the coronation. Moscow streets were cordoned off, and security was tightened. According to polls, the majority of Russians greeted the event with apathy and incomprehension. Experts call the event a historical precedent: the man who destroyed an empire became emperor of its successor." 
 sov_boriska.21.a: "What nonsense is this?"
 sov_boriska.22.t: "The Romanovs Return to the Throne"
 sov_boriska.22.d: "The Zemsky Sobor, convened by Regent Boris Nemtsov, elected a candidate from the House of Romanov to the throne. The coronation of this descendant of the dynasty, who had lived abroad for many years, took place in the Kremlin's Assumption Cathedral. The new monarch was proclaimed \"Emperor and Autocrat of All the Russias.\" However, real power remains with Regent Nemtsov, who will govern the country in the name of the crowned Tsar.\n\nA section of the House of Romanov, belonging to a different branch, has already refused to recognize the chosen candidate, calling him an \"imposter\" and a \"Kremlin stooge.\" Western countries have expressed skepticism, demanding a national referendum on changing the form of government. The Russian Orthodox Church, after some hesitation, has blessed the coronation. Moscow is cordoned off, and security measures have been tightened. The public reaction is a mixture of apathy, distrust, and timid hope. Experts warn of the risk of a schism within the monarchical camp due to dynastic disputes."
 sov_boriska.22.a: "A Spectacular Comeback"
 sov_boriska.23.t: "Nemtsov Meets With Zhirinovsky"
 sov_boriska.23.d: "Regent Boris Nemtsov and LDPR leader Vladimir Zhirinovsky announced the formation of a ruling coalition, causing shock in Russia and abroad. For decades, they had been political enemies: their public feud was marked by an incident in 1995, when Zhirinovsky doused Nemtsov with orange juice. These ideological opposites-a liberal and Westerner versus a nationalist and imperialist-suddenly formed an alliance.\n\n\"A historic compromise,\" Nemtsov called it. Zhirinovsky added, \"Together we will restore order.\" According to sources, the coalition will focus on suppressing the opposition and implementing tough reforms. Experts have called the alliance a \"monstrous marriage of convenience,\" predicting internal conflicts, but they note its pragmatism: in a crisis, the union of right-wing and left-wing nationalists creates a broad political base for maintaining power."
 sov_boriska.23.a: "What's surprising anymore?"
 sov_boriska.24.t: "Referendum on the New Constitution"
 sov_boriska.24.d: "Regent Boris Nemtsov held a nationwide referendum on the adoption of Russia's \"Imperial Constitution.\" The document, which enshrines the monarchy, the de facto autocracy of the regent, and class inequality, received unexpectedly high support. According to official figures, over 62% of voters voted \"yes.\" The main reason, observers note, is the population's profound fatigue with the series of coups, restrictions, and instability. \"Let there be an empire, let there be a regent-as long as we don't fear tomorrow,\" is how one sociologist sums up the mood of Muscovites.\n\nThe opposition called the referendum results falsified, but acknowledged that even with an honest vote count, supporters of \"peace at any price\" could have won a majority. The new constitution abolishes direct elections and parliament, replacing them with Zemsky Sobors (Assemblies of the Zemstvo) appointed by the regent. Nemtsov himself, in a televised address, thanked citizens for their \"wisdom and patience,\" promising that \"the era of hesitation is over.\"\n\nWestern countries and human rights organizations have already condemned the referendum as \"a pretext for usurpation.\" However, the Kremlin, counters: \"The people have spoken-and this is the main source of power in the new Russia.\" The formal promulgation of the constitution and a massive change of symbols await. The country is frozen in anticipation: will the hopes for long-awaited order be fulfilled or will new repressions reign."
 sov_boriska.24.a: "Finally it's all over"
 sov_boriska.25.t: "Boris Nemtsov is Elected Chairman of the Tsarist Government"
 sov_boriska.25.d: "Boris Nemtsov, who had previously held the title of regent to the nominal emperor, officially changed his status. At the first session of the newly formed State Duma-now an estate-representative assembly under the monarch-Nemtsov was unanimously elected Chairman of the Tsarist Government. The opening ceremony of the Duma took place in the renovated Tauride Palace under the double-headed eagles, and the newly appointed prime minister swore an oath of allegiance to the emperor and the new constitution."
 sov_boriska.25.a: "The regime is gradually becoming stronger"
 sov_boriska.26.t: "Boris Nemtsov is Carrying Out De-Imperialization"
 sov_boriska.26.d: "The Chairman of the Tsarist Government, Boris Nemtsov, launched a campaign of \"re-imperialization\"-returning cities to their pre-revolutionary names, total decommunization, and reconsidering the historical role of the USSR. A series of decrees were signed: Volgograd was renamed Tsaritsyn, Kirov became Vyatka, and dozens of streets, squares, and metro stations named after Soviet figures were renamed. Monuments to Lenin and other communist leaders were dismantled throughout the country.\n\nThe key act was the official declaration exonerating the Russian Empire of all accusations ever brought by the Bolsheviks and Soviet historiography. The document effectively rehabilitates the monarchical system and its historical figures, including Nicholas II and other rulers.\n\nIn the West, the reaction is restrained and critical: the European Union has stated that rewriting history does not promote reconciliation, but is refraining from sanctions. The streets of Russian cities are gradually changing their appearance-double-headed eagles, imperial flags, and signs reading \"Tsaritsyn\" instead of \"Volgograd.\" Judging by surveys, most citizens reacted to the changes with apathy, but some, especially the older generation, greeted the removal of monuments with bitterness. Nemtsov promised that \"historical justice will finally prevail\" within a year."
 sov_boriska.26.a: "All that remains is to remove the body from the square."
 sov_boriska.27.t: "Question About the Status of the Russian Orthodox Church"
 sov_boriska.27.d: "The government is faced with the question of the status of the Russian Orthodox Church: whether to restore its status as the state religion, as it did in the empire, or maintain its secular nature. Supporters of a state religion point out that Orthodoxy is the spiritual foundation of the monarchy, and its priority will strengthen the legitimacy of the new government and unite society. Opponents counter that Russia is multi-confessional, and that granting privileges to Orthodoxy would provoke interreligious conflicts, discourage investors, and evoke the Middle Ages. Most favor a compromise-a symbolic status as a \"culture-forming religion\" without direct state control, like the Anglican Church. The final decision rests with Nemtsov, who is currently holding off."
 sov_boriska.27.a: "Orthodoxy is the Great Heritage of our State"
 sov_boriska.27.b: "In modern Russia, religion should take a back seat"
 sov_boriska.28.t: "Boris Nemtsov Receives the Highest Imperial Award"
 sov_boriska.28.d: "Boris Nemtsov, the Chairman of the Tsarist Government, was awarded the highest state award-the Order of St. Andrew the Apostle, First Class, with the Imperial Crown. The ceremony took place in the Kremlin's St. George Hall. The head of the Imperial Chapter presented the award on behalf of the Emperor. The decree conferring the award stated: \"For the restoration of historical justice, the strengthening of autocracy, and outstanding services to the Fatherland.\" Nemtsov became the first non-dynastic head of government in over a century to receive this award. The opposition dismissed the award as \"self-aggrandizement\" and \"decorative,\" but in circles loyal to the government, it was seen as a sign of Nemtsov's final recognition by the elites and the monarch. The Prime Minister himself thanked the Emperor and promised to \"serve Russia even more diligently.\""
 sov_boriska.28.a: "Truly worthy"
 sov_boriska.29.t: "Russia Organizes Eurosceptic Summit"
 sov_boriska.29.d: "Russia hosted an international summit of Eurosceptics in Moscow. The \"For a Sovereign Europe\" forum brought together representatives of anti-system parties from France, Germany, Italy, Hungary, and other countries. The key message was that the EU had exhausted itself by imposing a loss of sovereignty on its member states, while the EEU offered equal economic cooperation without centralized dictates."
 sov_boriska.29.a: "This is the beginning of an economic war in Europe."
 sov_boriska.30.t: "Russia Invites Us to the European Free Zone"
 sov_boriska.30.d: "Russia invites us to the European Free Zone (EFZ)-a new integration project conceived as an alternative to the European Union. Joining the EFZ means leaving the EU. However, Moscow offers compensation: preferential access to the Eurasian Economic Partnership (EEP) market, the abolition of tariffs, energy guarantees, and respect for our national sovereignty without supranational dictates."
 sov_boriska.30.a: "The conditions are really favorable for us."
 sov_boriska.30.b: "We will not betray the EU"
 sov_boriska.31.t: "Russia Proposes a Non-Aggression Pact"
 sov_boriska.31.d: "Russia has approached us with a proposal for a non-aggression pact. Officially, Moscow explains this by citing the need to guarantee its security amid a sharp standoff with the European Union. However, Congress suspects that Russia, playing the Eurosceptic card, is not ruling out the use of military force against undesirable EU members-and wants to protect itself from US interference in advance.\n\nThe Kremlin's key condition: our agreement to the pact automatically means the dissolution of NATO. The alliance, in Moscow's view, loses its meaning if two major military powers agree to neutrality. We haven't forgotten the recent investment détente and rapprochement with Russia, but the price we pay is the dismantling of the transatlantic defense structure that took decades to build.\nThe future of European security and our commitments to our allies are at stake. Any decision will be carefully considered."
 sov_boriska.31.a: "We will not interfere in their confrontations"
 sov_boriska.31.b: "The safety of our European partners is our priority"
 sov_boriska.32.t: "The United States Abandoned Neutrality"
 sov_boriska.32.d: "The United States rejected our proposal for a non-aggression pact. Washington chose to preserve NATO, and with it, its own hegemony in Europe. For us, this decision means only one thing: we will not receive guarantees of neutrality, which means we will be forced to ensure our own security."
 sov_boriska.32.a: "They chose war"
 sov_boriska.33.t: "NATO is disbanded. The Russian-American Pact"
 sov_boriska.33.d: "The United States withdrew from NATO and signed a non-aggression pact with Russia. The alliance's European members are in shock. The EU, already waging an economic war with the Eurasian Economic Partnership, fears it is left alone against Russia. An emergency summit in Brussels called the US actions a \"betrayal.\" Without American protection, Europe faces either a hasty creation of its own army or separate negotiations with Moscow."
 sov_boriska.33.a: "An unexpected plot twist"
 #Left Path
 sov_boriska.34.t: "Nemtsov Cleans House"
 sov_boriska.34.d: "President Boris Nemtsov signs a decree dismissing dozens of regional governors and heads of federal agencies suspected of corruption. 'The era of immunity for the corrupt is over,' he announces. Vladislav Surkov, the 'gray cardinal' of the previous administration, is among those removed. In their place, Nemtsov appoints young economists, human rights lawyers, and technocrats from his own team. 'We are not changing the wallpaper; we are changing the entire building,' the president says.\n\nThe old elites are shocked, with some governors refusing to leave their offices and prompting bailiffs to break down doors, while the Communist Party denounces the move as 'a purge' and liberal media celebrate the long-awaited cleansing. The international community cautiously applauds, though ordinary citizens remain divided between hope for justice and fear of chaos. Nemtsov promises that each appointee will undergo a public integrity check, because 'trust cannot be decreed; it must be earned.'"
 sov_boriska.34.a: "A new broom sweeps clean - but will it break?"
 sov_boriska.35.t: "The Loyal Governors' Pact"
 sov_boriska.35.d: "President Nemtsov meets behind closed doors with the governors of Pskov, Samara, and St. Petersburg. The negotiations last into the night. By dawn, they emerge with a handshake - the governors pledge public support for the president's reforms, and in return, Nemtsov promises them more control over their regional budgets and local policies. 'We are not building a unitary state,' Nemtsov later tells reporters. 'A strong Russia needs strong regions. But strength comes from trust, not fear.' The media dubs them 'The Loyal Governors' Club.' For now, the Kremlin's periphery is calm - and the center's hold is quietly solidifying."
 sov_boriska.35.a: "Strength through trust"
 sov_boriska.36.t: "The Successor's Bargain"
 sov_boriska.36.d: "President Boris Nemtsov met behind closed doors with Tatyana Yumasheva and Valentin Yumashev, the influential daughter and son-in-law of the first president. The result - a strategic alliance that shocked Moscow's political elites. The so-called 'Family' publicly pledges not to interfere with Nemtsov's reforms, and in return, the Kremlin guarantees the safety of the legendary Yeltsin-era 'Family's' assets and status. 'Boris Nikolayevich loved him,' Naina Yeltsina later recalls. 'They were both daring, recklessly brave, and sincere. Boris Yeltsin always treated the young politician with warmth and sympathy, and appreciated his energy and courage.' Nemtsov, for his part, always treated the first president with 'enormous respect.' The pact was sealed with a memory of the old photograph with the inscription 'To my successor,' which Yeltsin once gave to Nemtsov. A pragmatic alliance of generations ensures political stability but fuels rumors of secret governance."
 sov_boriska.36.a: "The past guarantees the future"
 sov_boriska.37.t: "Yeltsinism with a Human Face"
 sov_boriska.37.d: "President Boris Nemtsov unveils his ideological platform. 'We are not building a new system,' he announces. 'We are returning to the lost ideals of the 1990s - to the ideas of freedom, the free press, the elimination of censorship, to private initiative, and to integration with the world. The reforms of the first president gave my generation a chance to live in a free country. His achievements - a country without censorship and open to the world - have been destroyed by his successor. What we have now is not a market, but a 'crony capitalism.' And we call this 'Yeltsinism with a human face' - because for him, freedom was always better than unfreedom.'\n\nReactions are deeply divided: liberal intellectuals applaud the return to democratic values, while nationalists and communists demand the president's impeachment, accusing him of betraying the country's sovereignty. The new course returns Russia to itself - to fight for a place in the world, not for a wall around it."
 sov_boriska.37.a: "A return to freedom"
 sov_boriska.38.t: "Governors in the Federation Council"
 sov_boriska.38.d: "President Boris Nemtsov signs a law reforming the Federation Council. Under the new rules, regional governors will delegate permanent professional representatives to the upper house - or serve there directly. The reform aims to strengthen the voice of the regions in federal decision-making while ensuring that the Council becomes a more effective and less politicized body.\n\n'We are not centralizing power; we are making federalism work,' Nemtsov explains. The move is welcomed by many governors, who see it as a sign of trust. Separatist sentiments in ethnic republics decrease noticeably. However, liberal critics argue that the reform sidelines direct regional elections and consolidates the power of appointed executives. The Communist Party calls it 'a step toward bureaucratic feudalism.' Regardless, the new Federation Council is now more predictable and loyal to the Kremlin."
 sov_boriska.38.a: "A stronger federation - on our terms."
 sov_boriska.39.t: "The Heroization of Yeltsin"
 sov_boriska.39.d: "President Boris Nemtsov unveils a state program to celebrate the legacy of the first president, Boris Yeltsin. 'He gave me and millions of my compatriots the opportunity to live in a free country,' Nemtsov declares at a ceremony in the Yekaterinburg Yeltsin Center. 'He hated censorship, believed in private initiative, and was convinced that Russia should be part of the world. We are building a new Russia on the foundation he laid.' The program includes the renaming of streets, the issuance of commemorative medals, and the establishment of Yeltsin scholarships for young entrepreneurs.\n\nThe reaction is sharply polarized: liberals applaud the return to the ideals of the 1990s, while the Communist Party denounces the 'glorification of the destroyer of the USSR' and nationalists remain uneasy, quietly questioning whether this heroization serves the new political order. Within the Kremlin, some whisper that Nemtsov - whom Yeltsin once saw as his successor - is now trying to crown himself by proxy, creating a 'usable past' to legitimize his own rule. 'Yeltsinism without Yeltsin,' one political analyst sums up. The oligarchs, feeling the winds of history shift, grumble but do not dare to openly oppose the growing cult."
 sov_boriska.39.a: "Building a usable past for a new future."
 sov_boriska.40.t: "New Rules"
 sov_boriska.40.d: "President Boris Nemtsov signs a package of electoral reforms that, according to official statements, are intended to 'streamline the political process and strengthen party discipline.' The new laws raise the electoral threshold to 8% and amend regional election legislation. Behind the scenes, the presidential administration has entered into informal agreements with the governors of key regions, under which they are to ensure the necessary results in the upcoming elections and limit the representation of opposition parties in local legislatures.\n\nThe liberal wing of the government is divided: some see these measures as a 'necessary consolidation of democratic forces in the face of extremist threats,' while others call it 'a betrayal of the ideals of free elections and a direct borrowing of the methods of the previous regime.' For now, the machine is running smoothly, but the long-term consequences for the political system remain uncertain. Democracy is being reshaped into something more manageable - and more predictable."
 sov_boriska.40.a: "A necessary evil for stability"
 sov_boriska.41.t: "What Has Russia Become?"
 sov_boriska.41.d: "Years have passed since Boris Nemtsov launched his reforms. The country is no longer the chaotic, corrupt, but democratically promising Russia of the 1990s. It is also not the police state of the early Putin era. What has emerged is something new - pragmatic, stable, and deeply cynical.\n\nThe old system of regional fiefdoms has been replaced by a 'Loyal Governors' Club' that guarantees stability in exchange for autonomy. The presidency has forged a strategic pact with the Yeltsin family, ensuring continuity and protection of elite assets. The Federation Council has become a predictable, obedient body. Yeltsin has been elevated to a national icon, his image used to legitimize a managed democracy where elections are won through administrative resources and a raised electoral threshold.\n\nThe economy is growing, corruption has been streamlined rather than eliminated, and the liberal opposition is either co-opted or sidelined. Russia is no longer trying to tear down walls; it is building its own, comfortable fortress. Western diplomats call it 'a Potemkin democracy.' The Kremlin calls it 'the only possible stability.' Citizens enjoy a higher standard of living but have learned not to ask who pays for it.\n\nNemtsov, in a rare interview, reflects: 'We had no choice. Another way? There was no other way. The alternative was chaos, was a new collapse. What we built is not perfect, but it works. Don't ask me if it is freedom. Ask if you are safe.' Russia has found its path - and it is one of compromise, order, and quiet resignation."
 sov_boriska.41.a: "There was no other way"
 sov_boriska.42.t: "The General Strategic Plan of Reforms"
 sov_boriska.42.d: "President Boris Nemtsov delivers a landmark televised address, outlining a sweeping 'General Strategic Plan of Reforms' to transform the Russian state from a bastion of 'crony capitalism' into a modern, efficient, and rational entity. 'We are not building a new system,' Nemtsov declares. 'We are returning to the universal principles of rational governance. My inspiration? Not the oligarchs of the 90s, but the great sociologist Max Weber.'\n\nThe plan, dubbed 'The Weberian Rationalization,' focuses on radical reforms: depoliticizing the bureaucracy, establishing a truly independent judiciary, and creating a level playing field for businesses based on formal rules rather than personal connections. 'We will replace the rule of men with the rule of law,' the president states, before acknowledging the potential cost. 'Weber also warned of an 'iron cage' of rationalization. We must be vigilant against creating a sterile, soulless system.'\n\nThe political establishment is stunned. Liberals hail the return to a modernizing agenda, while conservatives decry the attack on Russia's spiritual foundations. The international community watches with cautious interest as Russia embarks on its most ambitious reform project in a decade."
 sov_boriska.42.a: "Towards a rational state"
 sov_boriska.43.t: "New Governors, New Course"
 sov_boriska.43.d: "President Boris Nemtsov replaces a number of regional governors with young reformers from his own team - economists, lawyers, and civil activists who proved themselves in public service. The newcomers pledge to cut local red tape, attract investment, and respect the rights of ethnic minorities. 'The era of local barons who treated their regions as private fiefdoms is over,' Nemtsov says. 'It is time to hand power to those who will work for the people, not for their own pockets.'\n\nThe reaction is mixed: in some republics, the old guard grumbles about losing their cozy arrangements, while ordinary citizens cautiously hope for better schools, roads, and fairness. Liberal media celebrate the appointments as a 'second wave of renewal.' The Communist Party calls it 'a purge of patriotic governors.' But the real test lies ahead - whether these young technocrats can resist the pressure of local elites and deliver real change. For now, the Kremlin's periphery breathes a little easier."
 sov_boriska.43.a: "A new generation in the regions"
 sov_boriska.44.t: "Voices from the Streets"
 sov_boriska.44.d: "In Kazan, Makhachkala, and Nalchik, ordinary citizens take to the streets - not against Moscow, but against their own governors. They accuse local elites of corruption, land grabs, and ignoring the needs of ordinary people. 'These men behave like tsars in their own fiefdoms,' the protesters chant.\n\nPresident Nemtsov seizes the moment. 'We have heard you,' he announces, sending federal inspectors to the regions. 'The Kremlin will not protect local tyrants.' For now, the president channels popular anger to consolidate his power and pressure regional barons. The streets are not quiet, but the protesters' fury is directed away from the center - for now."
 sov_boriska.44.a: "The people have spoken"
 sov_boriska.45.t: "The People's Senate"
 sov_boriska.45.d: "President Boris Nemtsov signs a law introducing direct popular elections for the Federation Council. From now on, citizens in every region will choose their own senators - not governors, not local assemblies, but the people themselves. 'The upper house will no longer be a club of appointed officials,' Nemtsov says. 'It will become a true voice of the regions.'\n\nIn minority republics, community leaders celebrate: for the first time, they can send their own, not Moscow's choice. In the old capital, elite families who held senate seats for decades grumble about 'chaos and populism.' In village squares, people argue over candidates with an energy not seen since the 1990s. The Federation Council will never be the same - and neither, perhaps, will the country."
 sov_boriska.45.a: "Power returns to the people"
 sov_boriska.46.t: "The Democratic Dawn"
 sov_boriska.46.d: "President Boris Nemtsov addresses the nation from the Duma podium. 'For decades, we were told that democracy is a luxury Russia cannot afford,' he says. 'That we need a firm hand, a strong leader, a single will. But look where that brought us - not to greatness, but to stagnation, cynicism, and fear.' He pauses, then continues: 'We built something different. Not perfect, not easy, but real. Local elections, free press, independent courts, an elected senate. This is not Western democracy copied and pasted. This is Russian democracy - messy, noisy, and alive.'\n\nThe crowd erupts in applause as liberals weep and conservatives grumble about 'chaos,' but the president's words resonate far beyond the chamber, reaching into coffee shops and factories, small towns and big cities, where people begin to believe that another Russia is possible. The path ahead is uncertain, but for the first time, it leads to freedom."
 sov_boriska.46.a: "Forward to a democratic Russia"
 sov_boriska.47.t: "'They Are Trying to Rehabilitate Themselves'"
 sov_boriska.47.d: "Gennady Zyuganov, the leader of the Communist Party, sees President Nemtsov's proclamation of 'Yeltsinism with a human face' as final proof of the regime's betrayal of the people. 'The elites of the 1990s are trying to rehabilitate themselves,' he thunders. 'They, who under the leadership of this \"manager\" carried out criminal privatization and robbed millions of citizens, now want to rewrite history and impose the cult of a man who plunged the country into chaos, started the war in Chechnya, and betrayed our allies and friends. The most striking thing is that someone suddenly decided to turn Yeltsin's jubilee into \"great national celebrations\", while all sensible people will remember him as a destroyer and a traitor of all the hopes of ordinary Russians.'"
 sov_boriska.47.a: "Let them rage. We move forward"
 sov_boriska.48.t: "'Nemtsov Is Today's Trotsky'"
 sov_boriska.48.d: "Vladimir Zhirinovsky, the leader of the LDPR, is furious at the Kremlin's new ideological pivot. 'Just look at what they are doing!' he barks in a televised speech. 'They are baptizing the betrayal of the 1990s and calling it a \"human face\"! I know what brought down those people: Beryozovsky was ruined by greed, Yavlinsky by stubbornness, and Nemtsov by his own radicalism. Nemtsov is today's Trotsky, waiting for his \"ice axe\". I don't want that, but he won't go anywhere without an ice axe! If he doesn't stop his radical course, he will destroy himself. We won't do anything, but they will destroy him!'"
 sov_boriska.48.a: "The old fox is worried."
 sov_boriska.49.t: "'The Cult of a Destroyer'"
 sov_boriska.49.d: "Gennady Zyuganov, leader of the Communist Party, reacts with fury to the state program celebrating Boris Yeltsin's legacy. 'They are trying to canonize the man who buried the Soviet Union, gave away state property to a handful of thieves, and launched a war against his own people in Chechnya,' he thunders. 'Now they rename streets and hand out medals in his honor while millions of pensioners still cannot make ends meet. This cult of a destroyer is an insult to everyone who lost their savings, their jobs, and their faith in justice during the 1990s. But history will not be rewritten by bureaucrats and their hired propagandists. The people remember the truth - and one day they will demand justice.'"
 sov_boriska.49.a: "The past cannot be whitewashed."
 sov_boriska.50.t: "Zhirinovsky: 'A Drunken Tsar'"
 sov_boriska.50.d: "Vladimir Zhirinovsky, never one to miss an opportunity for theatrical outrage, pours scorn on the 'Heroization of Yeltsin' program. 'They are turning a drunken jester into a national icon!' he bellows. 'Yeltsin gave away Crimea, destroyed the army, and danced on tank turrets while the country went hungry. And now they want us to worship him? I warned them: radicalism always ends badly. Nemtsov thought he could ride Yeltsin's coattails to glory. Instead, he's building a museum to failure. The people are not fools - they see that all this pomp is just a cover for the same old elites who sold Russia for nothing. In ten years, they will be tearing down these statues with the same enthusiasm they built them.'"
 sov_boriska.50.a: "Cheap populism"
 sov_boriska.51.t: "The Council of Economic Advisors"
 sov_boriska.51.d: "President Nemtsov gathers a team of seasoned economists - some of whom were part of the 'young reformers' who built the market economy from the ruins of the USSR, and others who watched from the sidelines, criticizing their mistakes. Yegor Gaidar, Anatoly Chubais, Grigory Yavlinsky, Mikhail Zadornov, and a new generation of technocrats agree to put aside old rivalries. 'The 1990s were a trauma for millions,' Nemtsov states. 'We cannot change the past, but we can prevent a second trauma. These men made mistakes - but they are the only ones who truly understand the machinery of reform. History gave us one chance. We must not waste the second.' The Council is tasked with drafting a new economic strategy: stable, socially responsible, and free from the 'shock therapy' that once broke the nation."
 sov_boriska.51.a: "The second chance begins"

