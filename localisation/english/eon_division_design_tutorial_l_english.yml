 eon_division_design_help_category: "Division design help"
 eon_division_design_help_category_desc: "A practical guide to division composition, support and supply."
 eon_division_design_reopen_guide: "Read the division design guide"
 eon_division_design_reopen_guide_desc: "Open the guide again for free. This only displays help; it does not change your units."
 eon_division_design_tutorial.1.t: "How the division designer works"
 eon_division_design_tutorial.1.d: "§YThe grid is an organisation chart.§! Columns group battalions into regiments. The top row does not mean the first line of battle, and the bottom row does not mean the rear. Moving the same battalions up or down does not create a tactical formation.\n\n§YWhat matters:§! the battalions and support you include, their equipment, organisation and combat width. Eligible regimental support is attached to its own regiment; divisional support serves the division as a whole.\n\nChoose a topic below. You can reopen this guide in §YDecisions → Division design help§!."
 eon_division_design_tutorial.2.t: "Build units for their task"
 eon_division_design_tutorial.2.d: "§YChoose complementary roles.§! Infantry holds ground; armour adds protection and striking power; artillery adds firepower. Keep enough organisation to remain in combat.\n\n§YCheck the statistics.§! Compare organisation, defence or breakthrough, armour and piercing, width, speed and equipment needs. A slow battalion can slow the division.\n\n§YSupport needs equipment.§! Divisional companies serve the whole division. Eligible regimental support needs at least three compatible line battalions in its column. An empty support slot is not always a mistake."
 eon_division_design_tutorial.3.t: "Equipment, supply and conditions"
 eon_division_design_tutorial.3.d: "§YA template is not a ready division.§! You still need personnel, equipment and training. Check actual strength and organisation before battle.\n\n§YCheck supply and fuel.§! Large divisions can exceed local supply capacity. Motorised and armoured units also need fuel. A strong paper design can perform badly without supplies.\n\n§YMatch the mission and terrain.§! Combat width limits how much fights at once. Weather, planning, commanders, air support and enemy equipment also matter. No template wins every encounter."
 eon_division_design_tutorial.close: "Understood — close the guide"
 eon_division_design_tutorial.back: "Back to the first page"
 eon_division_design_tutorial.composition: "Composition and support"
 eon_division_design_tutorial.supply: "Readiness and supply"
