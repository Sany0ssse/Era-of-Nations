l_english:
 eon_request_war_mediation:0 "Request War Mediation"
 eon_request_war_mediation_desc:0 "Prepare a request for this country to mediate discussions with one of our opponents."
 eon_request_war_mediation_send_desc:0 "Choose [THIS.GetNameWithFlag] as a proposed mediator. This free draft lasts 7 days. In Decisions, choose a specific opponent and an agenda. Sending that proposal costs 20 political power. The mediator and the opponent must each consent before a 30-day nonbinding discussion mandate opens."
 eon_withdraw_mediation:0 "Withdraw or End Mediation"
 eon_withdraw_mediation_desc:0 "Withdraw this mediation proposal or end its agreed discussion mandate."
 eon_withdraw_mediation_send_desc:0 "Withdraw the proposal or end the agreed mandate without an additional cost. An unanswered original response must be closed before its reservation is released. Preparation effort already spent is not refunded. This action does not end a war or change any agreement."
 eon_mediation_category:0 "Mediation with a War Opponent"
 eon_mediation_category_desc:0 "Use the draft to choose one opponent and one agenda for discussions through our proposed mediator. De-escalation and humanitarian access require separate consent from both the mediator and the opponent. The mandate itself creates no ceasefire, access right, territorial transfer or military obligation."
 eon_select_mediation_deescalation_opponent:0 "Propose de-escalation discussions with [From.GetName]"
 eon_select_mediation_deescalation_opponent_desc:0 "Propose nonbinding de-escalation discussions with [From.GetName] through [?eon_mediation_mediator.GetName]. Sending costs 20 political power once. The mediator answers first; the opponent then decides separately. No ceasefire or peace is implemented by accepting discussions."
 eon_select_mediation_humanitarian_opponent:0 "Propose humanitarian-access discussions with [From.GetName]"
 eon_select_mediation_humanitarian_opponent_desc:0 "Propose nonbinding discussions about humanitarian access with [From.GetName] through [?eon_mediation_mediator.GetName]. Sending costs 20 political power once. The mediator answers first; the opponent then decides separately. This proposal establishes no access right, corridor or ceasefire."
 eon_mediation_mediator_deescalation_title:0 "Request to Mediate De-escalation Discussions"
 eon_mediation_mediator_deescalation_desc:0 "[From.GetName] asks us to mediate nonbinding de-escalation discussions with [?eon_mediation_party_b.GetName]. If we agree, the opponent receives a separate invitation. Only its consent opens a 30-day discussion mandate. We undertake no military obligation and cannot bind other parties or end their war through this mandate."
 eon_mediation_mediator_humanitarian_title:0 "Request to Mediate Humanitarian-Access Discussions"
 eon_mediation_mediator_humanitarian_desc:0 "[From.GetName] asks us to mediate discussions about humanitarian access with [?eon_mediation_party_b.GetName]. If we agree, the opponent receives a separate invitation. Only its consent opens a 30-day nonbinding mandate. No corridor, access right, ceasefire or military obligation is created."
 eon_mediation_opponent_deescalation_title:0 "Invitation to Mediated De-escalation Discussions"
 eon_mediation_opponent_deescalation_desc:0 "[From.GetName] agreed to act as mediator for a proposal from [?eon_mediation_party_a.GetName]. We may accept or decline nonbinding de-escalation discussions. Agreement opens a 30-day mandate for these three countries; it creates no ceasefire or peace, and binds no ally or overlord. Concrete terms still require a separate agreement."
 eon_mediation_opponent_humanitarian_title:0 "Invitation to Mediated Humanitarian-Access Discussions"
 eon_mediation_opponent_humanitarian_desc:0 "[From.GetName] agreed to mediate a proposal from [?eon_mediation_party_a.GetName] about humanitarian access. We may accept or decline these nonbinding discussions. Agreement opens a 30-day mandate for these three countries; it creates no access right, corridor or ceasefire, and binds no ally or overlord."
 eon_mediation_cancelled_desc:0 "This mediation proposal was withdrawn before all participants agreed. This original response can no longer authorize talks. Close it to release any remaining reservation. Preparation effort already spent is not refunded."
 eon_mediation_stale_desc:0 "This response no longer matches an available proposal with its original participants, stage and agenda. It cannot open a mandate or change another mediation. Close this old response."
 eon_mediation_accept:0 "Consent to these nonbinding discussions"
 eon_mediation_decline:0 "Decline or close this proposal"
 eon_mediation_ack:0 "Understood"
 eon_mediation.30.t:0 "Mediator Agreed to Participate"
 eon_mediation.30.desc:0 "The mediator accepted its proposed role. A separate invitation was sent to the specified opponent. This first consent did not open a mandate, implement a ceasefire or oblige any party to accept concrete terms."
 eon_mediation.31.t:0 "Mediator Declined the Proposal"
 eon_mediation.31.desc:0 "The proposed mediator declined this invitation. No discussion mandate was opened. Refusal brings no benefit or penalty; the initiator's preparation effort remains spent."
 eon_mediation.32.t:0 "Mediation Proposal No Longer Valid"
 eon_mediation.32.desc:0 "The proposal could not proceed with its original participants, agenda, consent stage or current conditions. No discussion mandate was authorized by this response. No war or agreement was changed."
 eon_mediation.33.t:0 "Mediation Withdrawal Processed"
 eon_mediation.33.desc:0 "A withdrawal was recorded or its original response was closed. That proposal cannot receive further consent. Any remaining unanswered original response must be closed to release its reservation. Preparation effort already spent is not refunded."
 eon_mediation.34.t:0 "Discussion Mandate Agreed"
 eon_mediation.34.desc:0 "The mediator and the specified opponent each consented to the proposed agenda. A 30-day nonbinding discussion mandate was opened for the three original participants. It created no ceasefire, peace, humanitarian-access right, territorial transfer or military guarantee. Binding terms require a separate agreement."
 eon_mediation.35.t:0 "Opponent Declined the Proposal"
 eon_mediation.35.desc:0 "The specified opponent declined the mediated discussions. The mediator's earlier consent was insufficient to open a mandate. Refusal brings no benefit or penalty; the initiator's preparation effort remains spent."
 eon_mediation.36.t:0 "Discussion Mandate Ended"
 eon_mediation.36.desc:0 "The agreed discussion mandate ended or its conditions ceased to hold. This nonbinding channel created no enforceable settlement. Wars and separate agreements follow their own rules."
 eon_mediation.37.t:0 "Unanswered Mediation Proposal Closed"
 eon_mediation.37.desc:0 "An unanswered proposal expired or could no longer retain its original response safely. Its two response pairs, initiator–mediator and mediator–opponent, are closed to new mediation proposals in this campaign. Other eligible combinations remain available. No mandate or settlement followed, and preparation effort already spent is not refunded."
 eon_mediation_open_tt:0 "We are a human-controlled country with a current war opponent. The proposed mediator exists, is independent and available, and does not share a faction or war side with us or fight us. Both countries are free of another mediation record, an unresolved older response between them and their 90-day mediation cooldown."
 eon_mediation_withdraw_tt:0 "This country belongs to our matching mediation draft, unanswered proposal or active mandate. Ending a draft or agreed mandate releases its matching records; withdrawing an unanswered proposal blocks consent until its original response is closed. This creates no ceasefire and changes no treaty."
