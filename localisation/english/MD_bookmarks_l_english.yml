l_english:
 MILLENNIUM_DAWN: "Era of Nations"
 MILLENNIUM_DAWN_DESC: "The world has changed. Globally speaking, an atmosphere of peace and prosperity has ruled for about half a century. But with the recent end of the Cold War and the rise of the People's Republic of China, how will this world see itself? How will it shape itself? Will the United States continue its dominance? Will the new Russian Federation find its way into the spotlight? What roles will the former great European empires of Britain, France, and Germany play? What role will the democracies of the globe play in spreading their ideology? And what role will the shadow of terrorism have? The world has changed and will only continue to change as we enter the new millennium."
 CHI_MILLENNIUM_DAWN_DESC: "The backwater of yesterday. The superpower of tomorrow. After decades of European bullying and even more decades of civil war, strife, and invasion by the Japanese, China looks to rebuild itself as the foremost power of Asia, and eventually, the world. \n\nUnder the leadership of the Communist Party, great strides have been made in building a new China. But this new China is volatile. If China reforms too slowly; it may be destroyed. If it reforms too quickly; it might destroy itself."
 FRA_MILLENNIUM_DAWN_DESC: "A global center of art, culture, and diplomacy, France looks brightly upon a new century brimming with hope and opportunity. The tyranny of the monarchies of the old and the unprecedented destruction during the Great War and the Second World War propelled France toward the European Union and followed the French Revolution principles of liberty, fraternity, and equality. As such, France became a founding member of the European Union and has sought to instill these values across member states and amongst other nations of the globe. Will France continue protecting democratic values, or will a new course be charted for France in this millennium?"
 GER_MILLENNIUM_DAWN_DESC: "The retreat of the Soviets and the reunification of East and West Germany have given new hope to the nation. Germany’s traumatic past and the horrors of fascism have not been lost on the general populace. Now, Germany stands as one of the most democratic nations in Europe, with a robust social welfare system and one of the strongest economies in Europe. \n\nA founding member of the European Union, Germany looks towards expanding the bloc to include the former Soviet states of Eastern Europe against a possible Russian resurgence."
 JAP_MILLENNIUM_DAWN_DESC: "A land of roughly 6,852 islands, the maritime people of Japan have come far since the Second World War and the atomic bombings of Hiroshima and Nagasaki. Today, Japan stands as the second-largest economy on Earth, renowned for its technological innovation and quality products shipped across the world. \n\nBacked by its American and European allies, Japan looks warily at its old rival China with both newfound confidence and new potential for conflict."
 SOV_MILLENNIUM_DAWN_DESC: "The August Coup and subsequent collapse of the Soviet Union in 1991 has left the Russian economy in tatters, its pride shaken, and its future looking grim. Oligarchs and corrupt officials have filled the vacuum of power in the absence of a strong central authority. \n\nThe recent rise of Vladimir Putin has many wondering how this ex-KGB officer will attempt to restore Russia’s legacy and bring it forward into a new age."
 ENG_MILLENNIUM_DAWN_DESC: "With Hong Kong handed over to China in 1997, the United Kingdom has bid farewell to its last great colonial possession. The once mightiest nation on Earth is desperately trying to redefine itself and find a new path to greatness and glory. \n\nWill that path lie in continued cooperation with the United States? Should Britain draw closer to its European brethren? Or shall Britannia, on her own, rule the waves once more?"
 USA_MILLENNIUM_DAWN_DESC: "The collapse of the Soviet Union has led to the world’s first unipolar moment. The United States stands at the forefront of all technological, military, and cultural forces at work across the globe. Its reach has never been greater, and its future has never looked brighter. \n\nThe upcoming elections will prove a crucial moment in determining the future course of America; and for better or worse, the world."
 TUR_MILLENNIUM_DAWN_DESC: "Since the collapse of the Ottoman Empire at the end of World War One, Turkey has largely remained in the backdrop of geopolitical affairs. Now, Turkey’s position puts it in the spotlight once again, as competing ideologies work to shift the country one way or the other. \n\nShould the Republic continue with Atatürk's reforms and seek recognition with the EU, or remain true to its Islamic heritage? The failing health of Prime Minister Bülent Ecevit signals uncertain times ahead."
 UKR_MILLENNIUM_DAWN_DESC: "The elections of 1999 were supposed to bring an unconditional victory to the liberal leader of the National Movement - Viacheslav Chornovil. But soon, he died in a car accident under mysterious circumstances. The current president, Leonid Kuchma, won the election in the wake of truthful slogans and lack of populist promises. But what his cadence will bring is still questionable. \n\nAfter being deprived of its nuclear status in 1996 and signing the Budapest Memorandum, Ukraine received guarantees of protection from the strongest states and a ticket to the world theater. But who will the young country be at the future performance? A direct participant or merely an observer in the last rows?"
 BRA_MILLENNIUM_DAWN_DESC: "Brazil is slowly on the rise at the turn of the century. The country has the potential for greatness. It is one of the world's largest emerging economies and its growth has continued to accelerate. However, in recent years Brazil's economic current is reeling back from a harsh recession due to the Asian Financial Crisis of 1995 and a crippled currency. Now a new party contender has arrived on the scene. The PT has swapped in and is quickly gaining traction.\n\nWill you be able to kickstart the country's once great economy or will the PT and its socialist policies seize hold?"
 CAN_MILLENNIUM_DAWN_DESC: "Having gained complete independence from the UK in 1982, Canada is a G7 nation known for its vast natural resources, including oil, gas, and minerals. With the second largest landmass in the world, Canada is made up mostly of ice plains and mountains, with the majority of the population residing in the south of the country. A stable democracy and a key NATO ally, Canada is a country with endless possibility and potential."
 SMA_MILLENNIUM_DAWN_DESC: "San Marino is an extremely small country and is in fact completely dependent on Italy. Being landlocked and without airports, it is highly dependent on tourists, as they make up a large part of the GDP. Is it worth to go on the account of Italy, remaining in fact its territory, or it is necessary to go our own way? All this at the moment is decided by two captains-regents, who are appointed by the Great General Council for a period of 6 months. There are 60 members of the Great General Council. But there is also the Arengo, the Assembly of Heads of Families, which was the supreme body in ancient times, has now almost completely lost its power, but has retained the right of petition. The Captains Regents receive numerous petitions submitted by citizens on the first Sunday after April 1 and after October 1. Petitions submitted must be considered within 6 months."
 DEN_MILLENNIUM_DAWN_DESC: "Denmark is a safe and secure nation, being both a member of the EU and NATO. However, an internal economic downturn and slowdown has recently begun challenging the Danish state. Whether Denmark can continue to remain immune from the turbulence of the wider world is far from certain."
 ETH_MILLENNIUM_DAWN_DESC: "Ethiopia's monarchy was overthrown in 1974 and its subsequent communist dictatorship in 1991. The constitution of 1995 has provided a somewhat stable democracy, but it has failed to address the problems of starvation, political crisis and corruption. It has also not resolved Ethiopia's ongoing conflict with Eritrea."
 FIN_MILLENNIUM_DAWN_DESC: "Ever concerned with preserving its neutrality, Finland has carefully watched the Soviet Union's collapse and the subsequent political expansion of the western European forces. The Finns joined the EU in 1995 and is about to adopt the Euro as the national currency. Can peace last? Are the Russians truly pacified?"
 GRE_MILLENNIUM_DAWN_DESC: "As the 21st century dawns upon Greece the country seems content. However, under the surface there are growing concerns over the debt crisis and the rise of radical political parties on both sides of the spectrum. The future of the Hellenic Republic is uncertain, and unless it is properly guided it could go down a dark path."
 ICE_MILLENNIUM_DAWN_DESC: "In a hidden corner of Europe, Iceland has successfully kept a low profile since independence in 1944. Political conflicts with the British about fishing rights were perhaps the most exciting time in Icelandic history. Should Iceland take a more central stance?"
 ITA_MILLENNIUM_DAWN_DESC: "Italy has been ever so slightly behind the other Great Powers since the beginning of the 20th Century. After its defeat in World War Two, Italy's strong bond to its former enemies and its former ally in Germany has brought it back up to the status of a highly developed and prosperous country. But what will the future hold? National greatness or economic disaster?"
 NOR_MILLENNIUM_DAWN_DESC: "Norway voted against joining the European Union in 1995 and has subsequently stayed distant from Europe to a certain extent. Nonetheless, the country remains a NATO member and shares a short but critical border with the Russian Federation, a powerful neighbor that it must necessarily be wary of."
 IRQ_MILLENNIUM_DAWN_DESC: "Iraq is no stranger to hardships, having recently just fought an 8 year war with the Iranians, Iraq gained nothing but debt and economic hardship. Being unable to pay back the debts owed to the Gulf states, Saddam Hussein launched an invasion of Kuwait in 1991. Enduring a humiliating defeat at the hands of the coalition forces shortly after the war begun, Iraq is still struggling to recover and rebuild. With sanctions crippling the Iraqi economy, and an ever more authoritarian stance taken by Saddam Hussein and the Ba'athist regime, large portions of Iraqi society find themselves at odds with the current ruling order. Only time will tell if Iraq will fall into turmoil, or bring about the millennia long golden age."
 RAJ_MILLENNIUM_DAWN_DESC: "Where China is the superpower of tomorrow, India is the superpower of next week. Once a British colony, now an independent rising power, it is at odds with its northern and western neighbor. The conflict in Kashmir has built the entire geopolitical paradigm of India for years to come. Now, as India enters a new century, it must finally rise from its knees and show the full might of the Asian Tiger. Can India become a superpower or will it fall into a long decline? And what does the coming millennium hold for it?"
 SPR_MILLENNIUM_DAWN_DESC: "Since Franco's death in 1975, Spain has been on a long path of recovery. Through economic and social hardship, the country managed to partially work through the issues that decades of fascism had caused. Spain joined NATO (1982) and the EU (1986) and has tirelessly and under the greatest of efforts worked to catch up to the more powerful and wealthy major countries of Europe; to Germany, France, Britain, and Italy.\nIn times like these, Spain requires strong leadership and a stable hand. Can Prime Minister Aznar deliver? Or will his Partido Popular make place for a more worthy leadership?"
 SWE_MILLENNIUM_DAWN_DESC: "Sweden had been in a deep economic crisis in the early 1990s, with the country's EU accession in 1995 doing little to alleviate its issues. The Swedish nation, which stays militarily neutral as is Swedish tradition, has to find economic answers to its current troubles."
 SWI_MILLENNIUM_DAWN_DESC: "Neutral since time immemorial, Switzerland has decided to stay out of not only NATO and the European Union, but also even the United Nations. Can the international community still rely on Switzerland to be the silent judge and the neutral ground it has always been? Or will the Swiss people see their government take a more active role abroad to preserve peace and enforce Swiss national interests?"
 BRM_MILLENNIUM_DAWN_DESC: "Myanmar stands at a crossroads at the start of the 21st century. The military junta has come to realize that its grip on power is steadily loosening, as pressure from both within and without to democratize grows ever stronger. However, democratization or lack thereof is not the only issue before Myanmar's government. The territorial integrity of this Southeast Asian nation has been shaky ever since independence, with rebel groups fighting for greater autonomy plaguing Myanmar's border regions. The solutions to these twin dilemmas remain unclear. Violence or diplomacy? Democracy or authoritarianism? Compromise or revolution? Only time will tell."
 LIC_MILLENNIUM_DAWN_DESC: "Liechtenstein is a small and unassuming but well developed nation in the heart of Europe. With a population of only six thousand and one of the only two double-landlocked nations in the world, it's safe to say that nobody expects much from Liechtenstein. Heavily dependant on its neighbors in the alps for both its economy and security, Liechtenstein has many difficult choices ahead of it. Should it be a bastion of international cooperation, or a haven for ill-intentioned international corporations? Should it accept refugees from around the world in an attempt to become a real military power, or close its borders and focus only on itself. Only time will tell."
 POL_MILLENNIUM_DAWN_DESC: "Poland has recently broken free from the communist bloc of the Soviet Union. The current situation in the country is far from perfect. Despite the growth of the Polish economy since the fall of communism, the people of Poland continue to struggle. Despite these difficulties, the nation itself has a lot of potential to become a significant economic power. Taking advantage of the chaos, two rival parties have entered the political arena: the Eurosceptical PiS and the PO faithful to the European Union. The different views of these parties may make Poland a Central European economic power, or alienate its neighbors and re-enter the path of conquest. In addition, there was an opportunity to unite the famous Visegrad Group, where Poland, as the strongest of these 4 countries, may decide on the final connection of Poland, the Czech Republic, Slovakia and Hungary under one flag. But when the two largest political parties fight against each other, some are just waiting to come out of the shadows. The nationalist UPR party, led by Janusz Korwin-Mikke, may prove to be the winner in this duel, which will bring huge changes to Poland. However, a nationalist will not take the throne so easily. Lech Wałęsa, former leader of the anti-communist Solidarity, which overthrew communism in Poland, is now still present in politics with his ChDRP party and will make every effort to ensure that Korwin does not plunge the country into chaos."
 CZE_MILLENNIUM_DAWN_DESC: "A country positioned in the centre of the Europe, The Czech Republic gets into New Millennium in not a so bright situation. The communist regime is long over but so is Czechoslovakia. The economy still hasn't fully recovered but the privatization process is about to end and the reparations are on a straight line to being finished.\n\n The political sphere looks stable yet chaotic. While the two greatest rivals, the conservative ODS and social democratic ČSSD, dominate the parliament, other parties are still looking for new coalitions. While ODS keeps relations with KDU-ČSL and the greens, ČSSD deepens cooperation with the last communist party, KSČM.\n\nRegardless of political actions, independent companies are trying to reach out for the foreign market. Automotive companies, Škoda and Tatra are developing new ways of upgrading Czech vehicles while VOP CZ seeks more paths to improve the military sector. The companies work independently but with common relations. A little turn of events may eventually unite them into one big monopoly.\n\nBut there is still more to say. The military general, Petr Pavel, is about to greatly improve his career in NATO and the Czech Republic. Thanks to his experience and training, he will have to lead the countries to prepare for an incoming threat to the Czech republic's sovereignty. But is he going to stay with NATO and continue his career, having USA as an ally? Or maybe the United States are the one to be scared of?"
 NIG_MILLENNIUM_DAWN_DESC: "Nigeria, Africa's most populous nation, has steadily risen to regional prominence since the turn of the century, leveraging its demographic advantage of over 200 million citizens and expanding financial sector to strengthen its foothold in international markets. The country's transition to civilian rule in 1999 established a fragile but promising democratic system that has garnered support both domestically and abroad, enabling greater diplomatic influence across West Africa. However, this democratic experiment now faces a critical challenge as twelve northern states have implemented varying degrees of Sharia law since 2000, creating a stark division along religious lines. The Christian-majority south has responded with widespread demonstrations and civil unrest, while sectarian violence has erupted in mixed-faith areas like Kaduna and Plateau states. As religious tensions escalate and armed militias form on both sides, the question looms: will Nigeria's religious polarization between a predominantly Muslim north and Christian south ultimately lead to civil war?"
 BHR_MILLENNIUM_DAWN_DESC: "The newly crowned emir of Bahrain, Hamad bin Isa Al Khalifa, inherits a precarious position. Bahrain's Shi'a majority harbors significant frustration towards a monarchy that is perceived not only as discriminatory towards the Shi'a but also as a foreign occupier and an oppressor of the true, indigenous Bahraini people. The Sunni opposition, for albeit different reasons, resents the autocratic nature of Bahraini government, and has aligned itself with Shi'a groups opposed to a continuation of the absolute monarchy. Some of the emir's advisors have pushed for political liberalization as a way to reduce the pressure placed on the regime, while others have advocated a strengthening of autocratic rule. It will be up to Bahrain's new ruler to chart a course for the country."
 KUW_MILLENNIUM_DAWN_DESC: "Not too long ago Kuwait was a country under occupation. Its monarchy was in exile campaigning for a restoration of Kuwaiti sovereignty, while the people of Kuwait, both Sunni and Shi'a, were united against the Iraqi oppressor. Now that the Gulf War has restored Kuwaiti independence, the monarchy must resume the political balancing act that is ruling the nation of Kuwait. Kuwait's parliament, one of the most powerful in the Middle East, places a powerful check on the monarch's authority while continually pressing for greater political liberalization. The country's influential merchant class continues to push for greater investment in the private sector, something that public sector-employed Kuwaiti citizens are reluctant to see happen at the expense of their own welfare."
 OMA_MILLENNIUM_DAWN_DESC: "Oman has earned a reputation as a beacon of peace and stability in a restless and conflict-prone region. Qaboos bin Said al Said has pursued a successful foreign policy since he took power in 1970, leading a country that is hated by none and admired by all. But Oman is not without its challenges. The Sultan has been criticized for his heavy-handed approach towards internal dissent, raising uncertainty about the sustainability of the absolute monarchy."
 QAT_MILLENNIUM_DAWN_DESC: "Since 1996 Qatar has charted an independent course within the Gulf Cooperation Council. The country's natural gas reserves has allowed Qatar to operate outside of the Saudi-dominated oil market, and for decades the emirs of Qatar have enjoyed a close relationship to the populist Muslim Brotherhood, an organization that the Saudis and Emiratis have increasingly come to see as a threat to their authority. Worst of all in the eyes of the Saudis and their Emirati allies is Qatar's close relationship with Iran, a state that they view as an existential threat. It is only a matter of time before the hostility of Qatar's neighbors to its unique foreign policy reaches boiling point."
 SAU_MILLENNIUM_DAWN_DESC: "Saudi Arabia has historically enjoyed a comfortable position as one of the Middle East's leading powers. As custodian of the holy sites of Mecca and Medina, the Kingdom enjoys unparalleled religious legitimacy. However, the Iranian Revolution of 1979 transformed mutual Saudi-Iranian suspicion into outright hostility as the newly formed Islamic Republic of Iran sought to claim the mantle of leader of the Islamic world. Internally too the Kingdom faces challengers for the title of leader of the Islamic world. Since the Saudis allowed American troops into the country in 1991, the al-Qaeda leadership has sworn to destroy the Saudi monarchy and its false piety and replace it with a truly Islamic government."
 SIN_MILLENNIUM_DAWN_DESC: "Singapore at the turn of the century held at most regional authority amongst the nations of Asia and abroad. The Asian financial crisis also did no favors to the small nation at the mouth of the Malay peninsula. Outside of the financial crisis and its small stature it has shown its strength in the entrepot, banking and foreign investment. The Singaporean people and her government have shown truly what is like to be dubbed the \"The Lion City\"\n"
 PHI_MILLENNIUM_DAWN_DESC: "The recent election of 1998, has seen a massive change in rhetoric within the Filipino political spectrum. Estrada and his coalition, Laban ng Makabayang Masang Pilipino (Struggle of the Patriotic Filipino Masses), saw resounding success against his opposition. Underneath Estrada the Philippines saw a resounding growth rate of 3.4% and is set on track to maintain the quick-paced growth. Furthermore, Estrada has begun mobilizing the AFP to prepare an declaration of all-out-war on the Moro Islamic Liberation Front. Hidden amongst this almost picturesque presidency lurks the monster of corruption and an subsequent trail."
 UAE_MILLENNIUM_DAWN_DESC: "Fondly nicknamed by American officials as \"Little Sparta\", the United Arab Emirates has been a close ally to both the United States and Saudi Arabia and an eager participant in multilateral military operations. The Emirati armed forces, particularly its reputable air force and its elite Presidential Guard, has seen service in the Gulf War, accumulating useful military experience.\n\nBut the UAE is not content to simply play second fiddle to the US or Saudi Arabia. The Emiratis have punched above their weight in terms of foreign influence, at times competing with its erstwhile allies. Moreover, the UAE is home to the only successful case of economic diversification, Dubai having earned a reputation as a global city and a financial hub."
 KOR_MILLENNIUM_DAWN_DESC: "The Republic of Korea has successfully overcome war, poverty, and dictatorship to become one of the most developed and stable countries in the world. President Kim Dae-jung is widely respected for his role in bringing democracy to Korea and many are hopeful about his efforts to make peace with the North.\n\nHowever, his administration has been tainted by scandal and Korean politics remains exceedingly polarized. Political partisanship, government corruption, and uncertainty surrounding the president's efforts to reconcile with the North will define Korea's future in this new millennium."
 NKO_MILLENNIUM_DAWN_DESC: "The so-called \"Hermit Kingdom\" is a place that the outside world perceives as mysterious and threatening in equal measure. Rumblings of a secret nuclear program in the country are proliferating and its southern neighbor remains suspicious of the North's intentions. But cracks have started showing in the Hermit Kingdom's impenetrable image. Still in the process of recovering from a devastating famine known as the Arduous March, the DPRK has had to rely on external assistance to help weather the storm. The weaknesses of the North's system of governance are patently clear. Will Kim Jong-il address these shortcomings, and adopt a diplomatic approach to the outside world to facilitate development? Or will he decide that the bellicosity of the army and the ideological fervor of the party must be sustained by war?"
 BOT_MILLENNIUM_DAWN_DESC: "Botswana is one of the most highly developed countries in Africa with a stable democracy, high human development index and low corruption. Botswana gained its wealth after large amounts of diamonds were found, which lead to one of the highest GDP per capita in Africa. However, it is not without its problems; the politics are dominated by the BDP party, whom many see as autocratic and exclusive. In addition, poaching is rampant in the country's many game reserves. Diamonds are also not going to last forever, and a solution needs to be found to find alternatives for the economy."
 AFG_MILLENNIUM_DAWN_DESC: "Since the communists took power in 1978, Afghanistan has been in a cycle of civil war and external intervention. The 1989 withdrawal of the Soviet Union and the subsequent fall of the regime in 1992 did not bring peace. Rather, the conflict of interests between the Mujahideen factions led to continued fighting until 1996, when the Pakistani-backed Taliban took advantage of the civil war to seize large parts of Afghanistan. Their goal was to eliminate all other factions, forcing the former warlords to form the Northern Alliance against the Taliban under the mediation of General Massoud. What does the future hold for this war-torn country?"
 ARM_MILLENNIUM_DAWN_DESC: "The independence of Armenia, which it received one of the first after the collapse of the USSR, did not bring it any prosperity or greatness. The war in Nagorno-Karabakh, unleashed by the nationalists, bled the republic dry. At the same time, not so much the hostilities themselves as the blockade of Armenia by Azerbaijan. At the helm of Armenia is a controversial politician who has great influence both in Armenia itself and in the disputed Artsakh. Will Armenia be able to gain glory under his rule, or will it slide into a long-term abyss?"
 BLR_MILLENNIUM_DAWN_DESC: "The collapse of the Soviet Union brought Belarus long-awaited independence. But was it worth it? The economy is completely dependent on Russia, the army is not combat-ready, and the West is still looking at how to turn Belarus into a stronghold of anti-Russian sentiment. Will Lukashenko or anyone else be able to choose the right path for Belarus?"
 GEO_MILLENNIUM_DAWN_DESC: "Georgia, left on the sidelines of the Caucasus after the collapse of the USSR, fell into a civil war almost simultaneously with the war in Abkhazia and Ossetia. The overthrow of President Gamsakhurdia led to political instability, dashed hopes for a united Georgia and left a big imprint on the people. Will Georgia be able to become a regional power or will it continue to move towards political chaos?"
 AZE_MILLENNIUM_DAWN_DESC: "Azerbaijan, now headed by the authoritative former communist Heydar Aliyev, is at a crossroads. The lost war in Artsakh, an unstable society and the growing ambitions of the people, put the government of Azerbaijan in front of an uncertain future. Will it be able to become the pearl of the Caucasus, or will it slide into political instability?"
 COM_MILLENNIUM_DAWN_DESC: "The Comorosi island chain has an idyllic countryside. Jungles covers the mountains and the volcano Karthala. Its on the coast where most people live simple lives as fishermen, the country's single greatest revenue. Not always is it peaceful on these islands. Coups are common occurance and unruly governors try their best for more autonomy. Comoros does share a lot with its cultural neighbour Tanzania, except its majority muslim and all exclusivly speak a dialect of Kiswahili.\n\nThe country has an interesting view on the french overseas department of Mayotte. Irredentists claim it as part of the nation though the people in Mayotte doesn't seem to share that view."
 COM_MODERN_DAY_DESC: "Comoros has seen its fair share of action. In 2008 the invasion to take back control of Anjouan was a success. Many citizens regrettably live in poor lives with many fleeing to Mayotte in search for a better life. There's some good prospectsfor a membership in the East African Community. This can greatly improve investment opportunities to come to Comoros and raise the living standards for thousands. Most likely this country will live life with business as usual."
 ABK_MILLENNIUM_DAWN_DESC: "Abkhazia is a small country that has been fighting for its independence for a long time. Back in 1993, this country won its right to independence, although no one except Russia recognized it for its rights. Perhaps soon the whole world will hear about Abkhazia"
 EST_MILLENNIUM_DAWN_DESC: "Estonia, officially known as the Republic of Estonia, celebrates its ninth year of independence from the Soviet Union; however, this does not mean that Russian influence continues to grow. The small baltic country is now caught between the ever-growing pull of the East and West. It now has to contend with threats to its independence, the rise of far-right thought, and ineffective government bureaucracy causing issues within the country."
 FIJ_MILLENNIUM_DAWN_DESC: "Fiji, also known as the Republic of Fiji, is a Pacific island nation which has had a strikingly volatile history. Gaining independence in the 1970s, Fiji has had 2 coups and several changes of both government and constitutions which have only been enhanced through the growing ethnic divide between the Ethnic Fijians and the Ethnic Indo-Fijian peoples. But with the new millennia comes new problems, only time will tell if Fiji can truly become the island paradise that she sells herself as."
 KAZ_MILLENNIUM_DAWN_DESC: "Kazakhstan, the last nation which emerged from the shadow of the Soviet Union, marked by growing economic downfall driven by its collapsed statehood. As the new Era of Nationsed, questions about its political and economic trajectory lingered. What future awaited Kazakhstan in the 21st century, and how would it balance its aspirations for modernization with preserving its unique cultural identity?"
 KYR_MILLENNIUM_DAWN_DESC: "Kyrgyzstan is a young and politically unstable nation in Central Asia, marked by a series of political upheavals. Another new autocrat managed to take power into his own hands. Will he be able to retain power amid the flaring conflict with Tajikistan and Uzbekistan? What role will Russia and China play in this? All this awaits Kyrgyzstan in the new millennium."
 UZB_MILLENNIUM_DAWN_DESC: "In the year 2000, Uzbekistan is a former Soviet republic characterized by a centralized, authoritarian government. Its economy was primarily based on agriculture and cotton production. As the new millennium began, one could ponder: What future would Uzbekistan embrace in the 21st century? Would it evolve politically, economically, and socially, and how would it navigate its role in a changing Central Asian landscape?"
 SER_MILLENNIUM_DAWN_DESC: "The terrible NATO bombing has left its scars in the hearts of every inhabitant of Yugoslavia. Now the country will have to choose which way to move in the new millennium, maybe it's time to get rid of the previous leaders? or try to regain the former state?"
 KOS_MILLENNIUM_DAWN_DESC: "Our nation is finally approaching the moment when we will finally be able to gain full independence.  Our struggle against Serbia's influence is approaching the final stage, will we finish what we started, or will we give up and become only part of another country again?"
 VEN_MILLENNIUM_DAWN_DESC: "At the onset of the new millennium, Venezuela stood at a crossroads, shaped by a rich and intricate history that carried a blend of promise and uncertainty. The year 2000 marked a significant juncture in the country's evolution, following a series of momentous political and social shifts. In 1999, Hugo Chávez, a charismatic military leader, ascended to the presidency of Venezuela. His election represented a profound turning point in the nation's narrative. Chávez's ascent was propelled by a commitment to confront enduring challenges of social inequality, poverty, and political corruption. Under the banner of Chavismo, his political movement, he championed a vision for a more just and equitable distribution of Venezuela's abundant oil wealth. However, as the new millennium unfolded, the nation found itself at a pivotal moment, with the future direction of Venezuela hanging in the balance. There were growing debates and diverging perspectives on whether to continue under Chávez's leadership or explore an alternative path. Some advocated for an extension of Chávez's tenure, emphasizing his mission to address social inequalities, while others argued for a different course, seeking fresh approaches to governance and economic stability. Will we see a change in government in Venezuela's future? Or will we see the continuation of the Fifth Republic?"
 HEZ_MILLENNIUM_DAWN_DESC: "Since the start of the Lebanese Civil War and the occurrence of the Islamic Revolution in Iran, an orthodox organization which was originally a part of the Islamic Amal movement of Lebanon, and its ideals was and is based on the doctrine of the \"Islamic Resistance\" ,was formed. The Hezbollah, the most powerful political and military entity in Lebanon, was formed. From those times, Hezbollah adjusted itself to be a leverage against the state of Israel and its allies in the Levant region. Although at the same time, it tries to have a dominance over the state of Lebanon itself. With  tensions in the middle east growing up since the Persian Gulf War, Hezbollah has tried to increase its base of operations beyond the Middle East. And now, with  the rise of tensions on the region once again, Hezbollah has to adjust its new plans, would the doctrine of the Resistance, and the political dominance of Hezbollah in Lebanon succeed? Only time and the changes of the world would tell... "
 SOO_MILLENNIUM_DAWN_DESC: "Once part of the Georgian SSR, South Ossetia separated from Georgia and declared its independence. After the bloody war, Ossetia defended its independence and began to strive for integration with Russia, but at the beginning of the 21st century, the state of the state remains uncertain. On the one hand - hostile Georgia, on the other - Russia, which reluctantly seeks to take home a small but proud Ossetia"
 BUL_MILLENNIUM_DAWN_DESC: "Bulgaria, which went through the Second World War and became a socialist republic, has only recently been formed into a democratic state. The new millennium shines for Bulgaria with new challenges facing a new, growing democracy in the Balkans... Only time will show, what will Bulgaria achieve in the new, perhaps brighter century."
 ROM_MILLENNIUM_DAWN_DESC: "In the dawn of the new millennium, Romania stands at a crossroad. Having emerged from decades of communist rule, the fragile democracy it had established has so far brought more chaos than stability.\n\nFrom the Golaniada to the Sixth Mineriad, the future feels fragile as government after government fails to solidify democratic institutions and fix economic struggles. As poverty is on the rise, demagogues like Corneliu Vadim Tudor are able to gain massive followings among the disillusioned masses, all the while democratic parties falter and fall, unable to provide viable solutions.\n\nAnd with the return of former president Ion Iliescu to politics, the population seemingly has to choose between the lesser of two evils. But who truly knows what the future holds for Romania?"
 BOS_MILLENNIUM_DAWN_DESC: "Bosnia, a land rich in history and culture, has been molded by the hands of foreign empires, from the might of the Roman Empire to the collapse of the Federal Yugoslav Republic. Despite the scars left by its violent struggle for independence, the people of Bosnia remain steadfast in their journey towards a better future. \n \nThough the ethnic and religious divides linger, they do not diminish the hope and resilience of a nation determined to overcome its past. The future of Bosnia may be uncertain, but its people's unwavering spirit is a beacon of light, shining brightly towards a brighter tomorrow. "
 EGY_MILLENNIUM_DAWN_DESC: "In the year 2000, Egyptian politics were dominated by the entrenched rule of President Hosni Mubarak, characterized by authoritarian control, limited political freedoms, and sporadic attempts at reform. Despite some economic growth, the country grappled with widespread poverty, corruption, and social inequality. Dissent was met with harsh repression, yet signs of opposition and calls for change persisted, especially among youth and civil society groups. However, the future of Egyptian politics remained uncertain, with questions about succession, socio-economic grievances, and the potential impact of advancing technologies adding layers of complexity to the nation's political landscape."
 IND_MILLENNIUM_DAWN_DESC: "Indonesia is the center of Southeast Asian affairs despite being rocked by economic troubles. The 1997 Asian financial crisis has crippled Indonesia's currency, the Rupiah which has brought much instability to the archipelago nation, further flamed by the fires raging in Aceh. Rising inflation, radicalization and disunity amongst the nation has been causing it to fall behind it's neighbors and the rest of the world, and it has left its leaders scratching their heads on what to do in order to survive the 21st century"
 PMR_MILLENNIUM_DAWN_DESC: "In the year 2000, Transnistria, a breakaway region of Moldova, was entrenched in a protracted political standoff. Having declared independence in 1990, the region operated as a self-proclaimed republic, though its sovereignty remained unrecognized internationally. Led by President Igor Smirnov, Transnistria maintained its own institutions and security forces, fostering a de facto statehood. However, tensions persisted with Moldova, and efforts towards reconciliation were hindered by economic sanctions, smuggling, and a lack of consensus on the region's status. Negotiations mediated by international organizations sought a peaceful resolution, but Transnistria's political situation remained complex and unresolved, marked by a fragile equilibrium between aspirations for independence and geopolitical realities."
 CUB_MILLENNIUM_DAWN_DESC: "On the beautiful island of Cuba, where the sun warms the palm trees and the sea breeze gently embraces the shores, the year 2000 saw an atmosphere of change. In the heart of the Caribbean, on this oasis of warmth and beauty, lived a history rich in tradition and cultural heritage. However, in the shadows of this rich beauty, the heated struggle of political forces continued its stirring moves. The political situation in the country was tense, reflecting perpetual power struggles and ideological struggles. Despite this, the spirit of the people of Cuba remained indestructible, their hearts filled with hope for a bright future and faith in justice."
 LBA_MILLENNIUM_DAWN_DESC: "Muammar Gaddafi has ruled Libya for 31 years, desperate to achieve his ideals and aspirations. Libya is relatively stable at the moment, with members of Gaddafi's own family trying to get into the eccentric leader's good graces, but things could change at any moment.\n\nCan Libya achieve power and prosperity in the 21st century, or will it end up on the countless list of the failed states? Will Muammar be able to hold on to his power before the new wave of the new millennium? Only time will tell..."
 TAJ_MILLENNIUM_DAWN_DESC: "Since gaining independence from the Soviet Union in 1991, Tajikistan has been in a state of constant instability and strife. The nation quickly descended into a brutal civil war, pitting the government against a coalition of opposition groups, including Islamist and democratic forces. By 1997, a fragile peace was brokered, but tensions remained high as the government of Emomali Rahmon consolidated power, sidelining many of the opposition factions. Corruption, poverty, and divisions are arising in Tajik society, with time being the only witness of what is to come next..."
 HOL_MILLENNIUM_DAWN_DESC: "Once the heart of a global maritime empire, the Netherlands has emerged in the 21st century as a stable liberal democracy and a cornerstone of international diplomacy and trade. As a founding member of the European Union and NATO, it has long championed multilateralism and human rights. But beneath its modern prosperity lie growing social tensions, debates over national identity, and the legacy of colonialism have begun to reshape its public discourse. With rising geopolitical instability, economic shifts, and global challenges on the horizon, the Dutch face a defining question: will they continue as a pragmatic voice of moderation, or carve a new path in an uncertain world?"
 OTHER_MILLENNIUM_DAWN_DESC: "World War One, World War Two, Korea, Vietnam, Afghanistan. The wars of the past have left the nations of the present fearing for the future. However, there is great hope that humanity might have passed 20 centuries of bloodshed to complete its transition to a period of peace and stability."
 BOL_MILLENNIUM_DAWN_DESC: "High in the lungs of the Andes, Bolivia rises  a nation forged from silver mines, revolutions, and forgotten empires. Though stripped of its coast and scarred by coups, its heart still beats with the thunder of ancient drums and the dreams of its people. The 20th century left behind scars: lost wars, broken treaties, and an uneasy dance with foreign capital. Yet as the new Era of Nationss, something stirs beneath the surface  a growing fire of indigenous awakening, resource nationalism, and a demand to rewrite the social contract. With lithium under its soil and unrest in its streets, Bolivia may yet become more than just a pawn in great power games. It may become the storm."
 ISR_2000_MILLENNIUM_DAWN_DESC: "In some ways Israel has never been in a better position. The existential threat that Israel's Arab neighbors once posed has largely faded away thanks to the normalization of relations with Egypt and Jordan. Great steps were taken towards resolving the Palestinian question through the Oslo Accords of 1993.\n\nDespite this, Israel remains uneasy. Terrorism and rogue states justify the continued securitization of the country, as questions about the future trajectory of the Jewish state continue to dominate Israeli politics. How Israel will respond to the growing and often incompatible pressures from the international community, Palestinians, and its own people remains uncertain."
 SYR_2000_MILLENNIUM_DAWN_DESC: "A nation born out of colonial interests with a history mired with coups and instabilities, Syria has been struggling alot ever since it's inception. After the baathist takeover and since 1971 the country has seemingly united under the stable yet authoritarian rule of Hafez Al Assad. As the longest reigning president his tenure was known for overseeing a period of profound stability yet equally notorious political violence. Hafez al-Assad's health is currently failing, and soon a new successor will rise. However many people have started to question this state of affairs as well as the status quo, and many seek to change it. Will Syrians overcome their divides and differences and unite for a bright future? Or will the state crumble under the test of time by the divides of it's people and failures of it's institutions?"
 POR_MILLENNIUM_DAWN_DESC: "Portugal, the oldest nation-state in Europe, enters the new millennium with its gaze fixed firmly outward, as it has for centuries. Having shed its authoritarian past and its empire, it embraced Europe in 1986 and adopted the single currency, the Euro, in 1999. Yet, this integration is not without its challenges. The country, once a global power stretching from Brazil to Macau, now looks to its former colonies not as possessions, but as partners in the Community of Portuguese Language Countries, seeking a new role in a globalized world. Domestically, the 'golden years' of EU structural fund investments are fading, and the nation faces the familiar Southern European struggles: sluggish productivity, a demanding public sector, and the need to modernize an economy still heavily reliant on textiles, tourism, and agriculture. Lisbon's Expo '98 was a showcase of national pride and a symbol of a modern, outward-looking Portugal. Now, as the 21st century begins, the question remains: can this small, Atlantic-facing nation leverage its unique history and linguistic heritage to carve out a prosperous future, or will it remain a quiet, charming backwater on the edge of a continent finding its new place in the world?"
 PER_MILLENNIUM_DAWN_DESC: "Following the Islamic Revolution in 1979, Iran shifted from a Pro-Western Monarchy, to an Anti-Western Shi'ite Theocracy. From East to West, Iran has been pressured by outside forces, with no one to rely on but itself. With hostility present at every corner, Iran has cemented itself as the center of Shi'ite influence in the Muslim world, with a firm grip over extremist organizations such as Hezbollah, who rely heavily on Iranian monetary support for their continued existence. With growing resistance from Reformist and student movements, the future of Khamenei's regime is uncertain. Ultimately, if Iran is to survive, it will either have to cooperate on the global front alongside its neighbors, or it will have to crush all of her opponents. There is no in between."
 MND_MDC_DESC: "Deep within the Kodori Gorge, where the peaks of the Greater Caucasus scrape the sky and the roads end where the mountains begin, a force unlike any regular army holds the line. The Monadire - the Hunters - were born from the chaos of the Georgian-Abkhaz War of 1992, forged by Emzar Kvitsiani from the Svan highlanders who had no intention of bowing to Sukhumi or Tbilisi alike.\n\nThrough sheer ferocity and intimate knowledge of the terrain, Kvitsiani's men denied the Abkhaz forces control of the upper gorge - the place where Tbilisi's hand has never truly reached. Formally, the battalion has been part of the Georgian Armed Forces since 1998, yet in practice the Kodori answers to one man alone.\n\nBetween a government in Tbilisi that tolerates them out of necessity, Abkhaz forces that eye the gorge with bitter patience, and UN observers who come and sometimes do not return - the Hunters guard a frozen conflict with frozen methods. The question is not whether this arrangement will last - it is who will blink first."
 GRL_MDC_DESC: "The largest island on Earth - and one of its most sparsely populated. Kalaallit Nunaat, the Land of the People, has spent most of its history belonging to someone else - first Norway, then Denmark, which held it as a colony until 1953. Since 1979, Greenland has governed itself - with its own parliament and government in Nuuk. But defense, foreign policy and the Danish krone still come from Copenhagen, as do the subsidies that cover a third of the island's revenues.\n\nThe Kalaallisut - the indigenous people whose ancestors crossed from Canada thousands of years ago - are speaking ever louder about Greenland governing itself on its own terms. Beneath the endless ice lie oil, gas, gold and diamonds - riches that may one day allow the island to stand without foreign support. One day - but not today.\n\nFor now, Greenland exists between two worlds - too independent to be a simple Danish province, and too dependent to be truly free. The only question is how soon the ice will melt - in every sense of the word."