 GENERIC_hamas_support_category: "Support HAMAS"
 GENERIC_hamas_support_category_desc: "\n\n\n\n\n\n£GFX_GENERIC_hamas_support_category\n\n\n\n\n\n\n\n\n In 1948, the Jewish state of Israel was created on the territory of Palestine. At the same time, the majority of the «Jewish National Home» was made up of the Arab population, which reacted aggressively to the British Mandate. Tel Aviv's constant aggression against the Arab world and repressions against the Palestinian population added fuel to the fire. \n\n Israel's aggressive expansion has almost completely absorbed the Palestinian state. Even during the first war in 1987, Hamas was created in the Gaza Strip to oust Fatah (the Movement for the National Liberation of Palestine). Unlike Fatah, Hamas advocated radical opposition to Israel and the creation of an Islamic Arab state throughout Israel, the Gaza Strip and the West Bank. Hamas continues its radical struggle against Israel to this day. \n\n We are obliged to help our Muslim friends in the struggle for freedom, independence and a bright future on their territory."
