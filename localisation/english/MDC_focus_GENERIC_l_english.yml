 redux_generic.20.t: "Crisis of Oil Companies"
 redux_generic.20.d: "The excessive increase in the economic influence of oil companies and the revaluation of their assets have led to the collapse of many indices and oil companies at the start of trading, causing an economic crisis worldwide."
 redux_generic.20.a: "God Save Us"
 redux_generic.29.t: "Oil Crisis"
 redux_generic.29.d: "The involvement of the world's oil suppliers in the conflict has led to higher oil prices and inflation worldwide."
 redux_generic.29.a: "God Save Us"
 redux_generic.21.t: "Crisis of Dotcomes"
 redux_generic.21.d: "The excessive increase in the economic influence of internet companies and the revaluation of their assets have led to the collapse of many indices and internet companies at the start of trading, causing an economic crisis worldwide."
 redux_generic.21.a: "God Save Us"
 redux_generic.22.t: "Mortgage Crisis"
 redux_generic.22.d: "The uncontrolled growth of housing construction and the issuance of mortgages led to the mortgage crisis worldwide."
 redux_generic.22.a: "God Save Us"
 redux_generic.23.t: "Grain Crisis"
 redux_generic.23.d: "The participation of the main food suppliers in the wars provoked the grain crisis worldwide."
 redux_generic.23.a: "God Save Us"

 #Recognize Content
 redux_generic.24.t: "[FROM.GetName] is Asking to be Recognized as a State"
 redux_generic.24.d: "Their government has asked us to recognize them as a state, and they seem to believe that we are willing to take this diplomatic step."
 redux_generic.24.a: "We Recognize Them"
 redux_generic.24.b: "No"
 redux_generic.25.t: "[FROM.GetName] has Recognized Us as a State"
 redux_generic.25.d: "Their government has agreed to recognize us as an independent state"
 redux_generic.25.a: "Nice"
 redux_generic.26.t: "[FROM.GetName] Refused to Recognize Us as a State"
 redux_generic.26.d: "Their government does not recognize us as an independent state"
 redux_generic.26.a: "Sad"

 redux_generic.27.t: "[POR.GetName] created the Petro Escudo"
 redux_generic.27.d: "[POR.GetName] has finally decided to embark on the path of oil independence from the US energy market and announced the creation of a escudo-denominated Oil Standard, which they intend to extend to as many countries as possible."
 redux_generic.27.a: "Ohh"
 redux_generic.28.t: "[FROM.GetName] Switches to Petro Escudo"
 redux_generic.28.d: "Another country has chosen Escudo as its currency for oil trading."
 redux_generic.28.a: "Ohh"

