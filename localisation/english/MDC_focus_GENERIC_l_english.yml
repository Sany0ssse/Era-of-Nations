 redux_generic_news.1.t: "Era of Nations"
 redux_generic_news.1.d: "Welcome to Era of Nations. This initial standalone fork keeps the inherited gameplay baseline.\nWe are continuing development from this starting point. Sources and original contributors are recorded in the project documentation."
 redux_generic_news.1.a: "More Information"
 redux_generic_news.1.b: "I love the PlOt."
 redux_generic_news.1.c: "I don't like the plot."

 redux_generic_news.2.t: "Era of Nations: CFE"
 redux_generic_news.2.d: "When you enter the game, you may notice that you cannot create new divisions or edit your army templates. Pay attention to the first tab in the laws panel, namely CFE, to regain access to editing templates and creating new brigades."
 redux_generic_news.2.a: "More Information"

 redux_generic_news.3.t: "Era of Nations: Departments"
 redux_generic_news.3.d: "One of the features of the mod is the Department Mechanics. In order not to 'clutter' the national spirit panel, it was decided to create a separate panel where the player can choose the optimal 'build' consisting of departments that are unlocked by certain focuses and have special color."
 redux_generic_news.3.a: "More Information"

 redux_generic_news.4.t: "Era of Nations: Companies and Branches"
 redux_generic_news.4.d: "In addition to the Departments, the player can also choose the optimal build from the companies, which also have their own special color, allowing you to easily identify the focus that opens up a new company. Additionally, there are branches in the lower panel. This allows you to use the bonuses of a company from another country, while the company gains more influence over you."
 redux_generic_news.4.a: "Okay"

 redux_generic_news.5.t: "THE SYMBOL OF THE NATION CANNOT USE THE BATHROOM"
 redux_generic_news.5.d: "'Mr. President, the people have taken to the streets! They're chanting your name! ...Can you hear me? ...Why have you locked yourself in the restroom?\n—Last transmission from the press secretary before the security detail broke down the doorThe historic speech was a triumph. The crowd in the square roared. Television cameras captured every tear of emotion. Ratings soared into the stratosphere. Analysts were already drafting articles about a 'new course' and the 'rebirth of the nation.' But no one knows the truth. No one knows that for the last forty-five minutes, while the president spoke of a bright future, he was being torn apart from within by a monstrous, leaden weight. That ill-fated pre-election dinner—shashlik washed down with three types of wine and nuclear-strength espresso—chose the worst possible moment to make its presence known. Diplomatic protocol, the corset, the live microphone, cameras from every angle—an infernal mixture.Now he's here. Alone. Knees trembling. His dress jacket unbuttoned, tie askew, forehead beaded with sweat. The world teeters on the brink of nuclear war, the stock market is in turmoil, and the great leader of a great power sits on his porcelain throne, clutching his own speech, begging the gods for a miracle.\n— Just come out, you bastard...— he whispers to the empty room, forgetting the live microphone still clipped to his jacket pocket.In that moment, the entire nation hears his death rattle.In the next room, advisors panic: the president hasn't emerged in fifteen minutes. Security prepares to break down the door. The internet has already spawned a meme: 'Searching for the leader in his final bunker.' And he sits there, realizing: the fate of the world now depends not on the nuclear briefcase button, but on an entirely different button—one that simply refuses to work."
 redux_generic_news.5.a: "PRETEND YOU WERE JUST DEEP IN THOUGHT"

 redux_generic_news.6.t: "A PUBLIC SERVANT, A HOT DOG, AND THE WRATH OF THE SYSTEM"
 redux_generic_news.6.d: "'We have footage of Officer Morrison accepting something from a vendor. We need to know what it was. The people demand transparency. The department demands a scapegoat. Frankly, I just demand lunch.\n— Internal affairs memo, later declassified and immediately reclassified.It was a slow shift. The kind of shift that makes you question why you ever wanted to wear the badge in the first place. Officer Morrison had been on his feet for six hours, mediating disputes about recycling bins and telling teenagers to move along. His stomach growled. The hot dog stand on the corner, run by a cheerful man named Vlad who definitely wasn't selling stolen watches on the side, called to him like a sirens' song.Just one. A quick bite. He'd pay full price. No one would notice.He forgot about the body camera.He forgot about the live feed.He forgot about the civilian oversight committee's new AI monitoring software, trained on seventeen thousand hours of footage to detect 'unauthorized caloric intake during paid hours.'The notification came thirty seconds after the first bite. His squad car screen lit up: 'VIOLATION CODE 47-B: CONSUMPTION OF NON-ISSUED SUSTENANCE IN VIEW OF PUBLIC. PLEASE REPORT TO INTERNAL AFFAIRS IMMEDIATELY.'By the time he finished chewing, the news vans had arrived. By the time he wiped the mustard from his lip, the mayor was holding an emergency press conference. By the time he got back to the station, his desk had been cleared, his locker had been sealed, and a freshly printed termination letter awaited him, still warm from the printer.The hot dog cost him three dollars and fifty cents.The job cost him twenty-three years.Vlad, for his part, has hung a framed photo of Officer Morrison on his cart. Underneath, a small sign reads: 'He died for your right to eat in peace.'"
 redux_generic_news.6.a: "REQUEST A HEARING (BRING YOUR OWN LUNCH)"

 redux_generic_news.7.t: "THE BICYCLE AND THE BIRCH: A TRAGEDY IN TWO WHEELS"
 redux_generic_news.7.d: "'I saw the whole thing. He was going so fast. Like he was racing the wind itself. Then the wind won. The tree was just... standing there. It didn't even flinch.\n— Eyewitness, immediately before becoming a local celebrity and being interviewed by every news outlet within fifty miles.The morning was perfect. Sunlight filtered through the leaves. Birds sang. The freshly paved bike path stretched ahead like a ribbon of infinite possibility. Viktor had trained for this moment. Months of preparation. Strict diet. Custom carbon-fiber frame. The latest in aerodynamic helmet technology.He was going for the record.The Strava segment was called 'Riverside Run.' Three kilometers of gentle curves, optimal conditions, and—crucially—no traffic. He'd attempted it forty-seven times. Forty-seven failures. Today would be different. Today, he could feel it in his legs. The power. The rhythm. The universe itself seemed to be pushing him forward.His phone chimed. Personal best at the halfway point.His phone chimed again. Someone liked his Strava photo from yesterday.His phone chimed a third time. Low battery warning.He looked down.Just for a second.Just long enough to miss the birch tree that had been standing in that exact spot for seventy-three years. Just long enough to not see its ancient, patient bark reaching out to embrace him. Just long enough to not hear the whispered warning of the wind: 'Look up, idiot.'The impact was spectacular. Witnesses later described it as 'poetic' and 'the funniest thing I've ever seen, and I've seen a clown fall down stairs.' The bicycle, once a sleek machine of athletic ambition, now resembled modern art—specifically, a piece titled 'Consumerism Meets Dendrology.'Viktor woke up three hours later in a hedge, six meters past the tree. His helmet was cracked. His pride was shattered. His phone, somehow still functional, displayed a notification: 'New Strava Record! 'Riverside Run' - 47.2 km/h! Would you like to share this achievement?'In the background, the birch tree stood silent. Unmoving. Victorious."
 redux_generic_news.7.a: "BLAME THE SUN"

 five_year_plan.1.t: "Five Year Plan Failed"
 five_year_plan.1.desc: "Unfortunately, we have not been able to achieve the successes set by our leadership, which has shown the inefficiency of our industry. The five-year plan is a failure"
 five_year_plan.1.a: "It's a disaster"
 five_year_plan.2.t: "Five Year Plan Accomplished"
 five_year_plan.2.desc: "We have been successful in our objectives. We managed to increase our industry and production, our descendants can be assured of a bright future for our country"
 five_year_plan.2.a: "Glory to labor!"
 f_invest.1.t: "[FROM.GetName] is asking for our investment"
 f_invest.1.desc: "We received an offer to provide investment to the state [FROM.GetName]. Should we accept this offer?"
 f_invest.1.a: "Accept"
 f_invest.1.b: "Deny"
 f_invest.2.t: "[FROM.GetName] accept our offer"
 f_invest.2.desc: "[FROM.GetName] has accepted our offer to provide investment"
 f_invest.2.a: "Great!"
 f_invest.3.t: "[FROM.GetName] declined our offer"
 f_invest.3.desc: "[FROM.GetName] declined our offer about investment. Maybe they just don't have money, or maybe we should try to improve our relationship."
 f_invest.3.a: "Sad"
 generic_nato.6.t: "The United States Refuses To Cooperate"
 generic_nato.6.desc: "The United States refuses to cooperate with us, perhaps because they are afraid that this might create tension with the Eastern Powers, or simply because of personal animosity..."
 generic_nato.6.a: "Maybe Next Time"
 generic_nato.7.t: "The United States Agrees To Cooperate"
 generic_nato.7.desc: "The United States agrees to cooperate. This could strengthen our relations with the United States and other NATO members, and bring us closer to potential membership in the alliance"
 generic_nato.7.a: "Good Start"
 generic_nato.3.t: "[FROM.GetName] Wants to Obtain IPAP Status"
 generic_nato.3.desc: "[FROM.GetName] wants to obtain the Individual Partnership Plan status with NATO. By ratifying the status for them, we will receive the obligation to protect them in case of conflict"
 generic_nato.3.a: "We Ratify This"
 generic_nato.3.b: "We Refuse"
 generic_nato.8.t: "[FROM.GetName] Ratified Our Membership"
 generic_nato.8.a: "Great"
 generic_nato.8.desc: "[FROM.GetName] ratified our IPAP status, this makes us more united. Perhaps in the future we will be able to find a place for ourselves in the ranks of the alliance"
 generic_nato.9.t: "[FROM.GetName] Refused To Ratify Us"
 generic_nato.9.a: "Maybe Next Time"
 generic_nato.9.desc: "[FROM.GetName] refused to ratify our IPAP status. Perhaps we should do a better job of diplomacy with this country."
 generic_nato.4.t: "[FROM.GetName] Wants To Join NATO Alliance"
 generic_nato.4.desc: "[FROM.GetName] have long been our good ally outside the alliance, they have become our unofficial member, now it is time to ritify their full entry into the alliance and make it official"
 generic_nato.4.a: "We Ratify This"
 generic_nato.4.b: "We Refuse"
 generic_nato.10.t: "[FROM.GetName] Ratify Us To Join NATO"
 generic_nato.10.a: "Great"
 generic_nato.10.desc: "[FROM.GetName] Ratifies us for our full entry into the alliance as a permanent member. Our cooperation has long been closer and now we are one step closer to each other"
 generic_nato.11.t: "[FROM.GetName] Refused To Ratify Us"
 generic_nato.11.a: "Sad"
 generic_nato.11.desc: "[FROM.GetName] Refuses To Ratify Us As a Candidate For Permanent Membership in NATO. Perhaps we should improve our diplomatic ties with them and strengthen our relationship"
 generic_nato.1.t: "[FROM.GetName] Wants to Establish Military Partnership With NATO"
 generic_nato.1.desc: "[FROM.GetName] has approached us with a proposal for cooperation in the framework of military security, they hope that we will help them ensure the security of their borders and increase their military potential to protect their sovereignty."
 generic_nato.1.a: "Of Course We Agree"
 generic_nato.1.b: "We Won't Take Any Risks"
 generic_nato.5.t: "We Failed to Meet NATO Requirements"
 generic_nato.5.desc: "We didn't manage to fulfill the basic requirements of the alliance to get a new status on time, maybe we should try to do it again"
 generic_nato.5.a: "Sad"
 generic_csto.1.t: "Conclude a Trade Agreement With The CSTO Countries"
 generic_csto.1.desc: "[FROM.GetName] wants to conclude a trade agreement with us as part of its rapprochement with the member countries of the CSTO alliance."
 generic_csto.1.a: "We Agree"
 generic_csto.1.b: "No"
 generic_csto.2.t: "[FROM.GetName] Agreed To Accept Our Aeal"
 generic_csto.2.desc: "[FROM.GetName] agreed to sign a trade agreement with our country. This makes us more united"
 generic_csto.2.a: "Nice!"
 generic_csto.3.t: "[FROM.GetName] Refuses the Agreement"
 generic_csto.3.desc: "[FROM.GetName] refuses to sign a trade agreement with us, maybe they will come to their senses later"
 generic_csto.4.t: "Defence Agreement with [FROM.GetName]"
 generic_csto.4.desc: "[FROM.GetName] wants to sign a mutual defense treaty with us. If we agree, we will take on bilateral obligations to protect the borders and sovereignty of our countries"
 generic_csto.4.a: "We Agree"
 generic_csto.4.b: "No"
 generic_csto.5.t: "[FROM.GetName] Wants To Join the CSTO"
 generic_csto.5.desc: "[FROM.GetName] decided to submit an application for consideration to join the CSTO alliance. Will we accept their application?"
 generic_csto.5.a: "Your Welcome"
 generic_csto.5.b: "We are not ready to accept them yet."
 generic_csto.9.t: "[FROM.GetName] Joins the CSTO"
 generic_csto.9.desc: "[FROM.GetName] announced today that they have decided to join the CSTO. Russia has already announced that the application for membership has already been reviewed and is ready for signing. It is already clear that this will change the balance of power and increase Russian influence in the region. There has been no reaction from NATO yet"
 generic_csto.9.a: "Unexpectedly"
 generic_csto.8.t: "Russia Refuses"
 generic_csto.8.desc: "Russia is not ready to consider our application for joining the CSTO"
 generic_csto.8.a: "Maybe Later"
 generic_csto.6.t: "[FROM.GetName] Agree"
 generic_csto.6.desc: "[FROM.GetName] agreed to accept our agreement on a bilateral defense treaty"
 generic_csto.6.a: "Nice"
 generic_csto.7.t: "[FROM.GetName] Refuses"
 generic_csto.7.desc: "[FROM.GetName] refuses to accept our agreement on a bilateral defense treaty"
 generic_csto.7.a: "Sad"
 generic_csto.10.t: "[FROM.GetName] Wants To Conclude a Knowledge Exchange Agreement With Us"
 generic_csto.10.desc: "[FROM.GetName] wants to enter into a knowledge transfer agreement with us. We can help them catch up with the leading powers in technology and become much closer in relations between our countries"
 generic_csto.10.a: "Sure! We Agree"
 generic_csto.10.b: "Not Now"
 generic_csto.11.t: "Russia Agreed"
 generic_csto.11.desc: "Russia has agreed to transfer knowledge with our country. This will give us a good boost in technology"
 generic_csto.11.a: "Great!"
 generic_csto.12.t: "Russia Refuses"
 generic_csto.12.desc: "Russia has refused to help us with knowledge transfer. It seems we will have to rely on ourselves"
 generic_csto.12.a: "Shit!"
 generic_csto.13.t: "[FROM.GetNameWithFlag] Asks Us To Support the Military Operation"
 generic_csto.13.d: "[FROM.GetName] has launched a military operation and is asking for our support. CSTO doctrine does not oblige us to engage in an offensive war, we are free to refuse, but should we abandon our ally?"
 generic_csto.13.a: "Mobilize Forces!"
 generic_csto.13.b: "We Shouldn't Interfere"
 generic_csto.14.t: "[FROM.GetNameWithFlag] Responded To Support the Operation"
 generic_csto.14.d: "[FROM.GetName] has responded to our call, they will help us conduct a military operation. Perhaps they are pursuing their own goals, or maybe they just decided to support an ally, in any case, this will bring us even closer together"
 generic_csto.14.a: "Very Nice!"
 generic_csto.15.t: "[FROM.GetNameWithFlag] Asks Us For Help In Suppressing the Protests"
 generic_csto.15.d: "[FROM.GetName] has protests in country that threaten the constitutional order. CSTO doctrine does not oblige us to engage into the domestic affairs of an ally, we are free to refuse, but should we abandon our ally?"
 generic_csto.15.a: "Mobilize Forces!"
 generic_csto.15.b: "We Shouldn't Interfere"
 generic_csto.16.t: "[FROM.GetNameWithFlag] Responded To Support In the Suppression Of Protests"
 generic_csto.16.d: "[FROM.GetName] has responded to our call, they will help us supress the protests. Perhaps they are pursuing their own goals, or maybe they just decided to support an ally, in any case, this will bring us even closer together"
 generic_csto.16.a: "Very Nice!"
 generic_csto.17.t: "Conduct Military Exercises With [FROM.FROM.GetNameWithFlag]"
 generic_csto.17.d: "Joint military exercises will allow us to exchange military experience and prepare for possible combat operations, identify and eliminate the shortcomings of our army and test the combat effectiveness of weapons. What military exercises do we need to conduct?"
 generic_csto.17.a: "Army Exercises"
 generic_csto.17.b: "Air Exercises"
 generic_csto.17.c: "Navy Exercises"
 generic_csto.18.t: "[FROM.GetNameWithFlag] Wants To Conduct Army Exercises With Us"
 generic_csto.18.d: "[FROM.GetName] wants to conduct military exercises with us. The exercises will allow us to exchange military experience and prepare for possible threats. Should we agree?"
 generic_csto.18.a: "Let's Begin the Exercises"
 generic_csto.18.b: "Now is Not the Best Time"
 generic_csto.19.t: "[FROM.GetNameWithFlag] Wants To Conduct Air Exercises With Us"
 generic_csto.19.d: "[FROM.GetName] wants to conduct military exercises with us. The exercises will allow us to exchange military experience and prepare for possible threats. Should we agree?"
 generic_csto.19.a: "Let's begin the exercises"
 generic_csto.19.b: "Now is not the best time"
 generic_csto.20.t: "[FROM.GetNameWithFlag] Wants To Conduct Navy Exercises With Us"
 generic_csto.20.d: "[FROM.GetName] wants to conduct military exercises with us. The exercises will allow us to exchange military experience and prepare for possible threats. Should we agree?"
 generic_csto.20.a: "Let's Begin the Exercises"
 generic_csto.20.b: "Now Is Not the Best Time"
 generic_csto.21.t: "[FROM.GetNameWithFlag] Agreed To Conduct Military Exercises"
 generic_csto.21.d: "[FROM.GetName] agreed to conduct military exercises with us. The exercises will allow us to exchange military experience and prepare for possible threats."
 generic_csto.21.a: "Nice!"
 generic_csto.22.t: "[FROM.GetNameWithFlag] Refused To Conduct Military eExercises"
 generic_csto.22.d: "[FROM.GetName] refused to conduct military exercises with us. Maybe now is not the best time for them."
 generic_csto.22.a: "Maybe Later..."
 generic_muslims.4.t: "[FROM.GetName] Support Us!"
 generic_muslims.4.desc: "[FROM.GetName] supports us in the fight against Israel. This gesture of goodwill from our Islamic friends will help us a lot and lay a brick for future friendship"
 generic_muslims.4.a: "Nice!"
 generic_muslims.1.t: "[FROM.GetName] Asks For Help From Our fFoundation"
 generic_muslims.1.desc: "[FROM.GetName] asks for help from our foundation. This will help them in developing the state and increase our influence on them."
 generic_muslims.1.a: "Welcome"
 generic_muslims.1.b: "Not Now"
 generic_muslims.2.t: "Qatar Agrees"
 generic_muslims.2.desc: "Qatar agrees to expand its fund to our country. This will give us a good boost in the educational system, raise literacy and allow us to catch up with leading powers in technology"
 generic_muslims.2.a: "Nice"
 generic_muslims.3.t: "Qatar Refuses"
 generic_muslims.3.desc: "Qatar refused to help us. Well, not this time, we'll manage on our own."
 generic_muslims.3.a: "We Didn't Really Want To"
 generic_salafists.2.t: "[FROM.GetName] Wants To Establish Cooperation With Us"
 generic_salafists.2.desc: "[FROM.GetName] - a country whose power is in the hands of Salafis with an ideology similar to ours. They sent us a request for cooperation, we could support them with investments, provide protection or refuse and leave them to their own devices. What should we choose?"
 generic_salafists.2.a: "Absolute Support"
 generic_salafists.2.b: "Let's Support Them With Investments"
 generic_salafists.2.c: "Let's Support Their Independence"
 generic_salafists.2.d: "Don't Support Them"
 generic_salafists.1.t: "Crush Mushriqs"
 generic_salafists.1.d: "In our new regime, mushriqs are now being rightfully punished for their sins. Now, we can start to prepare our society for much harsher way of submission to our cause. Soon, our country will be pure and any disagreement will be stomped out."
 generic_salafists.1.a: "Wondeful!"
 generic_salafists.3.t: "Invitation to the Union of Islamic States"
 generic_salafists.3.d: "[FROM.GetName] has extended a formal invitation for us to join the Union of Islamic States. Their diplomat speaks with conviction: 'Our Muslim nations must stand united against Western imperialism and secular influences. Together, we can forge an economic and military alliance that safeguards our Islamic values and preserves our sovereignty. Divided, we remain vulnerable to cultural erosion and political subjugation.'\n\nThe alliance promises mutual defense pacts, preferential trade agreements, and religious solidarity across the Islamic world. Should we align ourselves with our Muslim brothers in this pan-Islamic coalition?"
 generic_salafists.3.a: "Stronger Together!"
 generic_salafists.3.b: "We Must Jihad on Our Own!"
 generic_salafists.4.t: "Jihad Fury"
 generic_salafists.4.d: "The hour of retribution has come. Our brothers in faith have united, and now we turn our gaze to the lands of Europe- the very lands from which the Crusaders once marched to defile our holy places and spill Muslim blood. [FROM.GetNameDef] calls upon all believers to rise for a sacred war. We will avenge centuries of humiliation and restore the glory of Islam! Europe shall taste the jihad that rises from the very heart of the Ummah."
 generic_salafists.4.a: "Allahu Akbar!"
 generic_salafists.5.t: "Union of Islamic States Proclaimed"
 generic_salafists.5.d: "[FROM.GetNameDef] has declared the formation of the Union of Islamic States - a new military alliance uniting radical Salafist movements across the Muslim world. The union proclaims a holy war against all who do not bow to their interpretation of Sharia law. World leaders react with alarm, fearing a new wave of extremism that could destabilize entire regions."
 generic_salafists.5.a: "Allahu Akbar!"
 generic_salafists.5.b: "A Grave Threat Emerges From the East…"

