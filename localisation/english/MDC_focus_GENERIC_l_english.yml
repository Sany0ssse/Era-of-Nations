 ##########ARMY TREE##########
 ##########Focuses##########
 GENERIC_army_start: "Our Armed Forces"
 GENERIC_army_start_desc: "It is necessary to reform our army so that it meets the standards of the 21st century more"
 GENERIC_army_ground_troops: "Ground Troops"
 GENERIC_army_ground_troops_desc: "Ground troops are the core of any army, and we must ensure that this core is always provided with the best equipment and the best soldiers."
 GENERIC_army_engineer: "Engineering Troops"
 GENERIC_army_engineer_desc: "Any army needs good engineering units to overcome enemy fortifications as well as competently prepare the defense of its territory."
 GENERIC_army_exercises: "Military Exercises"
 GENERIC_army_exercises_desc: "Intensive drills enhance combat readiness and unit coordination, ensuring our forces perform flawlessly under pressure."
 GENERIC_army_anti_air_build: "Air Defense Facilities"
 GENERIC_army_anti_air_build_desc: "It is necessary to protect the sky from enemy aircraft, which means it's time to invest in air defense."
 GENERIC_army_anti_air: "Air Defense Troops"
 GENERIC_army_anti_air_desc: "Not only on the ground, our army needs to fight the enemy, we also need to be ready to beat the enemy in the air."
 GENERIC_army_fortress: "New Fortifications"
 GENERIC_army_fortress_desc: "We will build new fortifications, which will allow us to defend ourselves more successfully."
 GENERIC_army_hub: "Logistics Hub"
 GENERIC_army_hub_desc: "Logistics is the air of any army, and we intend to develop it."
 GENERIC_army_doctrine: "Land Doctrine Innovations"
 GENERIC_army_doctrine_desc: "Modern warfare demands adaptation. By updating our doctrines with new strategies and technologies, we can ensure our forces stay effective and ready for future conflicts."
 GENERIC_army_uniform: "Uniform Improvements"
 GENERIC_army_uniform_desc: "Upgrading military uniforms increases comfort, durability, and adaptability to various combat environments."
 GENERIC_army_equip: "Infantry Equipment Development"
 GENERIC_army_equip_desc: "Advancing infantry equipment ensures our soldiers have cutting-edge tools, improving their effectiveness and survivability on the battlefield."
 GENERIC_army_armor: "Infantry Equipment Development"
 GENERIC_army_armor_desc: "Advancing infantry equipment ensures our soldiers have cutting-edge tools, improving their effectiveness and survivability on the battlefield."
 GENERIC_army_anti_armor: "Countermeasures against Armored Units"
 GENERIC_army_anti_armor_desc: "Developing effective tactics and weapons to counter enemy armor ensures we can neutralize their heavy units efficiently."
 GENERIC_army_artillery: "Artillery Experiments"
 GENERIC_army_artillery_desc: "Testing new artillery systems and techniques improves precision, firepower, and adaptability on the modern battlefield."
 GENERIC_army_education: "Military Education Reform"
 GENERIC_army_education_desc: "Modernizing military education builds stronger leaders, sharper strategists, and a force capable of meeting contemporary challenges."
 GENERIC_army_peacekeepers: "Peacekeeping Battalion"
 GENERIC_army_peacekeepers_desc: "We are ready to participate in peacekeeping missions around the world, and our fighters are ready to carry out their international duty."
 GENERIC_army_transport_avia: "Transport Aviation"
 GENERIC_army_transport_avia_desc: "We must develop our transport aviation as an alternative route for delivering our troops."
 GENERIC_army_vdv: "Airborne Battalions"
 GENERIC_army_vdv_desc: "Amphibious battalions should be developed, because a well-organized amphibious operation can completely change the situation at the front."
 GENERIC_army_pilots: "Increase Pilot Training"
 GENERIC_army_pilots_desc: "Our pilots must become air aces, so we will increase their training time."
 GENERIC_army_airport: "New Airbase"
 GENERIC_army_airport_desc: "Aviation needs to be based somewhere, so we intend to create a new air base."
 GENERIC_fleet_guard: "Guardians of Our Shores"
 GENERIC_fleet_guard_desc: "We intend to increase research in the field of small-scale flotilla development, because the shores should be guarded not only by giant cruisers."
 GENERIC_fleet_morpehi: "Marine Corps"
 GENERIC_fleet_morpehi_desc: "No strong navy can do without Marines, and we intend to create our own Marine Corps."
 GENERIC_army_sso: "Special Operations forces"
 GENERIC_army_sso_desc: "Any army needs elite units, so we are ready to announce the creation of our own special operations forces."
 GENERIC_last_war_volunteers: "Volunteers At The Front"
 GENERIC_last_war_volunteers_desc: "There are those who are ready to immediately rush to defend their country and not wait for the motherland to call them."
 GENERIC_last_war_stand: "Until Last Breath"
 GENERIC_last_war_stand_desc: "We will not lose, we will not surrender, the enemy will not defeat us."
