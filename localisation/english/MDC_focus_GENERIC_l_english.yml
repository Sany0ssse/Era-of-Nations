 ###########Islamists#########
 GENERIC_torjestvo_jihad: "The Triumph of Jihad"
 GENERIC_torjestvo_jihad_desc: "Salafism is now triumphant in our country, praised be Allah!"
 GENERIC_call_intern_jihadis: "Call Internal Jihadis"
 GENERIC_call_intern_jihadis_desc: "We must make a call that all faithful jihadis are now welcome in our country."
 GENERIC_bring_muftis: "Bring Muftis"
 GENERIC_bring_muftis_desc: "We must purify our umma from fake priests and bring real salafi muftis who will share our ideas."
 GENERIC_crush_mushriqs: "Crush Mushriqs"
 GENERIC_crush_mushriqs_desc: "Mushriqs are the worst of all and we must teach them a lesson."
 GENERIC_declare_malikate: "Declare Malikate"
 GENERIC_declare_malikate_desc: "We will declare ourselves a malikate, in fashion of Saudi Arabian system."
 GENERIC_medrese_propaganda: "Medrese Propaganda"
 GENERIC_medrese_propaganda_desc: "We must use various medreses to propagate our ideas among population."
 GENERIC_jihadis_volunteers: "Jihadis Volunteers"
 GENERIC_jihadis_volunteers_desc: "Helping our brothers will not only help them win the war, but will also allow us to gain invaluable combat experience. Allows to send Jihadis Volunteers Brigades Through Military Aid Button."
 GENERIC_ensure_ties_with_saudis: "Ensure Ties With Saudis"
 GENERIC_ensure_ties_with_saudis_desc: "Saudis have shown to the world that salafism can be sustainable and we will follow their steps."
 GENERIC_religious_fanaticism: "Religious Fanaticism"
 GENERIC_religious_fanaticism_desc: "We must force every single person in our country to be the most faithful and pure in their thoughts and deeds."
 GENERIC_inghimasi: "Inghimasi"
 GENERIC_inghimasi_desc: "Those who have will to can volunteer to become martyrs in case of war."
 GENERIC_unify_caliphate: "Unify Caliphate"
 GENERIC_unify_caliphate_desc: "We are the true caliphate and we must show it to all known world."
 GENERIC_taqfir_to_infidels: "Taqfir to Infidels"
 GENERIC_taqfir_to_infidels_desc: "Infidels must walk on the edge of the road when we walk on it. They must tremble, fear and be subdued."
 GENERIC_effective_jizya: "Effective Jizya"
 GENERIC_effective_jizya_desc: "We must make our Jizya tax on infidels not only humiliating, but also effective."
 GENERIC_government_sharia: "Government Sharia"
 GENERIC_government_sharia_desc: "Sharia must be the basis of our constitution and code of law."
 GENERIC_jihad_against_apostates: "Jihad Against the Apostates"
 GENERIC_jihad_against_apostates_desc: "Our neighbors have rejected the true faith and must be brought to submission. We will declare a sacred war against the apostates who surround us, expanding the realm of Islam by the sword."
 GENERIC_unite_the_ummah: "Unite the Ummah"
 GENERIC_unite_the_ummah_desc: "From the shores of Africa to the mountains of the Caucasus, our brothers in faith share our vision. We will send emissaries to all like‑minded Salafist movements, inviting them into a grand alliance under the banner of Jihad. Together, we shall be an unstoppable force."
 GENERIC_revenge_for_the_crusades: "Revenge for the Crusades"
 GENERIC_revenge_for_the_crusades_desc: "The blood of our ancestors cries out from the sands of Palestine and the ruins of Andalusia. The Crusaders humiliated Islam for centuries. Now the time has come to repay that humiliation tenfold. We will march on Europe itself - a new Jihad that will shake the foundations of the Christian world."
 ##########Moderate Islamists##########
 GENERIC_brothers_muslims: "Muslim Brotherhood in Power"
 GENERIC_brothers_muslims_desc: "The Society of the Muslim Brothers, better known as the Muslim Brotherhood, is a transnational Sunni Islamist organization founded in Egypt by Islamic scholar, Imam and schoolteacher Hassan al-Banna in 1928."
 GENERIC_international_relations: "Connect International Relations"
 GENERIC_international_relations_desc: "We must use all our international network of organizations to spread ideas of muslim brotherhood."
 GENERIC_state_islam: "State Islam"
 GENERIC_state_islam_desc: "Islam must be the basis of our state and law."
 GENERIC_qatar_foundations: "Qatar Foundation"
 GENERIC_qatar_foundations_desc: "Qatar is one of the key actors in Muslim Brotherhood's funding. We must use it to our advantage."
 GENERIC_islamic_democracy: "Islamic Democracy"
 GENERIC_islamic_democracy_desc: "We must combine islam with democracy in harmonious symphony."
 GENERIC_moderate_emirate: "Moderate Emirate"
 GENERIC_moderate_emirate_desc: "We must take Qatar's example in combining Islam with moderate policies."
 GENERIC_support_hamas: "Support HAMAS"
 GENERIC_support_hamas_desc: "We must support HAMAS against the evil-doings of Israel and bring the liberation of Palestine closer."
 GENERIC_propaganda_bases: "Propaganda Bases"
 GENERIC_propaganda_bases_desc: "We must support and establish Muslim Brotherhood propaganda bases all over the Islamic world."
 GENERIC_anti_jid: "Resistance Movement"
 GENERIC_anti_jid_desc: "Creation of a Resistance movement against our interests in the middle east must be our top one priority."
 ##########Shia##########
 GENERIC_iron_hand_shiism: "Iron Hand of Shiism"
 GENERIC_iron_hand_shiism_desc: "Our rule must be firm, not to let and enemies of our ideas spread misinformation about our government!"
 GENERIC_shiite_democracy: "Shiite Democracy"
 GENERIC_shiite_democracy_desc: "We must combine democratic principles with shiite theocracy to create a harmony."
 GENERIC_our_new_mullah: "Our New Mullah"
 GENERIC_our_new_mullah_desc: "Our new task is to find a Mullah who can become a suitable candidate for our country's spiritual leadership."
 GENERIC_guards_of_revolution: "Guardians of The New Revolution"
 GENERIC_guards_of_revolution_desc: "Our revolution is a miracle we must protect at all costs."
 GENERIC_public_defence_system: "Public Defece System"
 GENERIC_public_defence_system_desc: "We must create a system to protect our population both from physical and psychological attacks."
 GENERIC_civil_sharia: "Civil Sharia"
 GENERIC_civil_sharia_desc: "We must use sharia laws to base our civil code on it."
 GENERIC_iranian_system: "Iranian System"
 GENERIC_iranian_system_desc: "Iranian experience is quite useful to us - we can copy elements of their regime which can suite us well."
 GENERIC_islamic_socialism: "Islamic Socialism"
 GENERIC_islamic_socialism_desc: "Combining islam and socialism is a glorious idea, which can empower the islamic working class."
 GENERIC_islamic_republic: "Islamic Republic"
 GENERIC_islamic_republic_desc: "Now, we can officially proclaim ourselves to be an Islamic Republic."

##########DEMOCRATIC TREE##########
 GENERIC_democracy: "Democracy"
 GENERIC_democracy_desc: "The main purpose of democracy is to ensure the well-being of citizens, the protection of their rights and freedoms, and the control of power."
 GENERIC_personal_freedom: "Personal Freedom"
 GENERIC_personal_freedom_desc: "Ensuring the personal freedoms of citizens is our sacred duty and one of the basic goals of democracy"
 GENERIC_social_equity: "Social Equity"
 GENERIC_social_equity_desc: "In order to ensure stability in society, we must provide it with social equality"
 GENERIC_conservative_values: "Conservative Values"
 GENERIC_conservative_values_desc: "Ensuring conservative and traditional values is necessary to maintain the stability of our society"
 GENERIC_family_defence: "Family Defence"
 GENERIC_family_defence_desc: "Protecting family values will allow us to ensure stability and maintain population growth rates"
 GENERIC_minimal_government: "Minimal Government"
 GENERIC_minimal_government_desc: "The role of the state should be limited to only providing basic services such as defense, law enforcement, and infrastructure maintenance"
 GENERIC_democratic_representation: "Democratic Representation"
 GENERIC_democratic_representation_desc: "Through the mechanisms of political representation (the main ones are elections and political parties) the involvement of citizens in the political process is realized"
 GENERIC_green_politic: "Green Politics"
 GENERIC_green_politic_desc: "Our main goal is to create a society with a sustainable environment in order to reduce the negative human impact on ecosystems."
 GENERIC_welfare_state: "Welfare State"
 GENERIC_welfare_state_desc: "Our task is to provide citizens with all the necessary goods and services for their comfortable living in the state"
 GENERIC_freedom_of_speech: "Freedom of Speech"
 GENERIC_freedom_of_speech_desc: "Freedom of speech is a fundamental human right recognized by the international community as a fundamental element of a democratic society."
 GENERIC_economic_deregulation: "Economic Deregulation"
 GENERIC_economic_deregulation_desc: "Economic deregulation is the process of reducing or eliminating government regulation in certain industries or sectors"
 GENERIC_western_liberal_democracy: "Western Liberal Democracy"
 GENERIC_western_liberal_democracy_desc: "Western liberal democracy - a form of representative democracy in which decisions made are based on a constitution that protects individual freedoms and the rights of minorities in society"
 GENERIC_independent_democracy: "Independent Democracy"
 GENERIC_independent_democracy_desc: "Independent democracy is a way of political life in society in which the authorities, their organs and actions are chosen, formed and directed exclusively by the nation for the sake of achieving material well-being, freedom and justice for all citizens, social groups and peoples."
 GENERIC_reactionary_democracy: "Reactionary Democracy"
 GENERIC_reactionary_democracy_desc: "Reactionary democracy emerged as a reaction to revolutionary movements and the desire for democratic reorganization of society. Its supporters advocated the preservation of existing political structures, even if they were considered outdated"
##########NATIONALIST TREE##########
 GENERIC_nationalism: "Nationalism"
 GENERIC_nationalism_desc: "Nationalism - ideology and direction of politics, the underlying principle of which is the thesis of the value of nations or the nation as the highest form of social unity, its primacy in the state-forming process"
 GENERIC_glorious_past: "Glorious Past"
 GENERIC_glorious_past_desc: "Looking back at the past - we must build the future. In our glorious past, our mighty nation, led by a strong monarch, crushed enemies and glorified the flag of our state. By all means, we must return to our former glory!"
 GENERIC_uncertain_times: "Uncertain Times"
 GENERIC_uncertain_times_desc: "The establishment of a military dictatorship is usually associated with a deep socio-economic crisis in the state, the inability of the civilian government to find effective methods of governance to overcome the crisis"
 GENERIC_nation_spirit: "Nation Spirit"
 GENERIC_nation_spirit_desc: "We call for the unification of our entire nation of purebloods within one state"
 GENERIC_against_establishment: "Against Establishment"
 GENERIC_against_establishment_desc: "Anti-establishment is a political ideology that opposes existing social, political and economic systems or structures. It is often associated with movements that raise doubts about the current state of affairs and seek radical change in society."
 GENERIC_traditional_values: "Traditional Values"
 GENERIC_traditional_values_desc: "Traditional values are moral guidelines that form the worldview of citizens, passed on from generation to generation, underlying the all-Russian civil identity and the common cultural space of the country, strengthening civil unity"
 GENERIC_people_representatives: "People Representatives"
 GENERIC_people_representatives_desc: "We are in favor of the true representatives of the people being in power"
 GENERIC_unity: "Unity"
 GENERIC_unity_desc: "The unity of the people is the cohesion of people, their willingness to unite to achieve common goals"
 GENERIC_militarization_society: "Militarization Society"
 GENERIC_militarization_society_desc: "To ensure national security - we must militarize society, expand conscription and be prepared to convert the economy to a military economy"
 militarization_society_tt: "Opens a decisions §!«Militarization Program»§!"
 GENERIC_autoritarism: "Autoritarism"
 GENERIC_autoritarism_desc: "Authoritarianism is a political regime in which power is concentrated in the hands of a single leader or a narrow group of ruling elite, and society has limited participation in governing the country."
 GENERIC_our_interests: "Our Interests"
 GENERIC_our_interests_desc: "Now, we stand at the edge of choosing our interests, what is more important for us right now: ensuring domestic stability, or strengthening in the international arena"
 GENERIC_work_for_country: "Working for benefit of the Country"
 GENERIC_work_for_country_desc: "State first, we must provide for the life of the country, even if we have to sacrifice civil liberties to do so"
 GENERIC_protect_people: "Protect People"
 GENERIC_protect_people_desc: "The most important state-forming factor is the people and we must provide the people with a decent life, work and future"
 GENERIC_fairness: "Fairness"
 GENERIC_fairness_desc: "The notion of justice in fascism is linked to the search for reform, but in general the ideology of fascism is oriented towards the domination of one particular group and disregard for others."
 GENERIC_power: "Power"
 GENERIC_power_desc: "The power of the state - a set of material and spiritual capabilities used to achieve the geopolitical goals of the state. Our power should instill fear in our enemies and protect the territorial integrity of our country"
 ##########COMMUNIST TREE##########
 GENERIC_left_twist: "Left Twist"
 GENERIC_left_twist_desc: "The left turn can ensure sustainable growth of the economy and the well-being of citizens"
 GENERIC_people_government: "People's Government"
 GENERIC_people_government_desc: "People's Commissariat - a central body of executive power in charge of administration in a particular sphere of the state's activity or in a particular branch of the national economy."
 GENERIC_centralism: "Democratic Centralism"
 GENERIC_centralism_desc: "Democratic centralism is a form of organizational and state structure based on the binding nature of the decisions of higher-level bodies on lower-level ones, with all bodies being elected and accountable to lower-level ones."
 GENERIC_socialism: "Democratic Socialism"
 GENERIC_socialism_desc: "Democratic socialism is a political philosophy and ideology that combines the principles of democracy with the ideals of socialism."
 GENERIC_five_year_plan: "Five-year plan"
 GENERIC_five_year_plan_desc: " The Five Year Plan - a plan to take our industry and manufacturing to the next level to secure our nation's future! \n \n FOCUS LAUNCHES THE MISSION OF THE FIVE YEAR PLAN. SET OF PROGRESS REQUIRES CONSTANT PUSHING THROUGH DECISIONS, BEFORE YOU START - MAKE SURE YOUR ECONOMY CAN HANDLE IT"
 generic_five_year_plan_tt: "Opens a decisions §!«Five-Year Plan»§!"
 GENERIC_limited_market: "Limited Market"
 GENERIC_limited_market_desc: "We must stop the mindless giving away of our resources and let them be used for the good of our country"
 GENERIC_class_matter_desc: "The class matter includes various aspects related to the definition of classes and class struggle in different periods of the country's history."
 GENERIC_class_matter: "Class Matter"
 GENERIC_new_culture: "Cultural Matter"
 GENERIC_new_culture_desc: "Now, we need to decide whether we keep the conservative approach, with the preservation of the cultural values of our citizens, or go the way of cultural Marxism"
 GENERIC_liberty: "Liberty"
 GENERIC_liberty_desc: "Socialism is said to guarantee freedom to every member of society"
 GENERIC_equality: "Equality"
 GENERIC_equality_desc: "Socialism is said to equality in employment, access to resources"
 GENERIC_fraternity: "Fraternity"
 GENERIC_fraternity_desc: "Fraternity in socialism is commonwealth, unity, union based on common goals and principles"
 GENERIC_redistribution_income: "Redistribution Income"
 GENERIC_redistribution_income_desc: "Income redistribution is the process by which the state intervenes in the distribution of income between different population groups in order to reduce inequality or achieve other social goals"
 GENERIC_militia: "People's militia"
 GENERIC_militia_desc: "For the sake of internal security, we must raise a militia of brave citizens who volunteer to stand in defense of the fatherland"
 ##########AUTOCRATS TREE##########
 GENERIC_autocracy: "Autocracy"
 GENERIC_autocracy_desc: "Autocracy - a form of state structure in which the supreme state power directly or indirectly belongs to one subject"
 GENERIC_people_regime: "People's Regime"
 GENERIC_people_regime_desc: "People's democracy - a form of political organization of society that emerged after World War II in a number of countries in Europe and Asia."
 GENERIC_independence: "Independence"
 GENERIC_independence_desc: "For the sake of our future, we need to secure our sovereignty, where only we alone can dictate how we live our lives"
 GENERIC_facade_democracy: "Facade Democracy"
 GENERIC_facade_democracy_desc: "Facade democracy is a type of political system in which formal democratic procedures act as a facade behind which authoritarian practices are concealed"
 GENERIC_western_investments: "Western Investments"
 GENERIC_western_investments_desc: "To disperse our economy, we need the help of our foreign counterparts, I hope they will not refuse to give us foreign investments"
 GENERIC_control_of_opposition: "Opposition control"
 GENERIC_control_of_opposition_desc: "The tendency to suppress the opposition or limit its activities can have a negative impact on democratic institutions and principles. However, it will allow us to strengthen our government and stabilize the political situation in the country"
 GENERIC_economic_freedom: "Economic Freedom"
 GENERIC_economic_freedom_desc: "Economic freedom is a principle underlying the market economy, which allows economic entities (entrepreneurs, consumers, the state) to freely make decisions in the economic sphere"
 GENERIC_west: "West"
 GENERIC_west_desc: "The future lies behind the Western course, therefore we should seek friendship with NATO and the EU"
 GENERIC_no_foreign_agents: "Fighting Foreign Agents"
 GENERIC_no_foreign_agents_desc: "Foreign agents are increasingly infiltrating our nation's politics, for the sake of protecting our sovereignty, we have a duty to fight this plague"
 GENERIC_friendship_with_everyone: "Friendship With Everyone"
 GENERIC_friendship_with_everyone_desc: "Remaining independent - we cannot remain without allies. A neutral policy allows us to establish good relations with any power quite easily"
 GENERIC_between_east_west: "Between East and West"
 GENERIC_between_east_west_desc: "Being between two fires, we must take even greater care of the sovereignty of the country, so as not to become a pawn in a political game"
 GENERIC_secret_police: "Secret Service"
 GENERIC_secret_police_desc: ""
 GENERIC_police_state: "Police State"
 GENERIC_police_state_desc: "A police state is a figurative expression that describes a social order in which the authorities rigidly, including through repression, seek to control the social, economic and political life of citizens."
 GENERIC_eastern_investments: "Eastern Investments"
 GENERIC_eastern_investments_desc: "To disperse our economy, we need the help of our foreign counterparts, I hope they will not refuse to give us foreign investments"
 GENERIC_national_patriotism: "National Patriotism"
 GENERIC_national_patriotism_desc: "National-patriotic education is aimed at forming a sense of love for one's small homeland, respect for national traditions and culture, and awakening a sense of pride in one's people."
 GENERIC_east: "East"
 GENERIC_east_desc: "The future lies behind the Eastern course, therefore we should seek friendship with BRICS and the CIS"
