l_english:
 #Focus Tree
 GDR_communists_of_the_GDR: "The Communists of the GDR"
 GDR_communists_of_the_GDR_desc: "The spirit of Walter Ulbricht never truly died. It is time to purge the revisionists and return to the true principles of Marxist-Leninist state-building. The party must be the vanguard, and the people must follow."
 GDR_legacy_socialist_past: "The Legacy of the Socialist Past"
 GDR_legacy_socialist_past_desc: "From the ashes of the Treuhand privatization and the 'blooming landscapes' promised to us, a longing for stability and social security has remained in the hearts of many. We will revive the social achievements of the GDR."
 GDR_no_the_european_union: "No to the European Union"
 GDR_no_the_european_union_desc: "This bureaucratic alliance of NATO vassals is the enemy of true workers' solidarity. The GDR will not be a market for Western goods; we will leave this undemocratic union and forge our own path."
 GDR_purging_dissidents_ranks: "Cleaning the Ranks of Dissidents"
 GDR_purging_dissidents_ranks_desc: "To build a strong state, we must first clean our own house. Western agents and unreliable elements who have infiltrated our nascent structures will be exposed and dealt with by the Ministry for State Security."
 GDR_Socialist_partners: "Socialist Partners"
 GDR_Socialist_partners_desc: "Our true friends are not in Brussels or Washington. We must reach out to the remaining socialist states and movements worldwide. Ideological kinship is the foundation of a strong foreign policy."
 GDR_economic_stabilization: "Economic Stabilization"
 GDR_economic_stabilization_desc: "The shock therapy of the 90s destroyed our industry. We will reverse this by nationalizing key enterprises, stabilizing supply chains, and ensuring full employment for every citizen of the Republic."
 GDR_fiveyear_plan: "Five-year Plan in a Single Country"
 GDR_fiveyear_plan_desc: "While our enemies speak of globalization, we will speak of planning. We will mobilize the proletariat for a massive effort to modernize our industry and agriculture, catching up and overtaking the West in key sectors."
 GDR_reorganization_national_front: "Reorganization of the National Front"
 GDR_reorganization_national_front_desc: "The National Front must become a true instrument of the will of the working people again. We will reorganize it to include all anti-imperialist forces, ensuring the leading role of the Socialist Unity Party."
 GDR_stasi_2: "Stasi 2.0"
 GDR_stasi_2_desc: "The Shield and Sword of the Party must be equipped with modern technology. Using 21st-century surveillance methods, we can protect our revolution from counter-revolutionary elements more effectively than ever before."
 GDR_congress_socialist_party: "New Congress of the Socialist Unity Party of Germany"
 GDR_congress_socialist_party_desc: "A new party congress is the highest forum of our democracy. Here, we will chart the course for the next five years, reaffirm our commitment to Marxism-Leninism, and elect a leadership worthy of Ulbricht's legacy."

 GDR_ulbrichts_successor: "Ulbricht's Heir"
 GDR_ulbrichts_successor_desc: "We must look not to the reformist mistakes of the late GDR, but to the foundational years under Comrade Ulbricht. Discipline, heavy industry, and socialist internationalism will be our guiding stars."
 GDR_neighbor_program: "The Neighbor Program"
 GDR_neighbor_program_desc: "The anti-fascist protective barrier is gone, but our borders remain. We will implement a modernized version of the 'Neighbor Program', strengthening border security with technology and ideological education of border troops."
 GDR_military_education: "Military-Patriotic Education"
 GDR_military_education_desc: "Every citizen is a defender of the homeland. We will introduce mandatory pre-conscription training in schools and universities, fostering a spirit of patriotism and readiness to defend socialist achievements."
 GDR_marxism_in_every_home: "Marxism in Every Home"
 GDR_marxism_in_every_home_desc: "From the factory floor to the university lecture hall, Marxist-Leninist theory must permeate every aspect of life. We will launch a massive publishing campaign and establish circles for the study of dialectical materialism."
 GDR_end_illusions: "Finish the Illusions"
 GDR_end_illusions_desc: "The 'Ostalgie' is a weak sentimentality for consumer goods. We must replace it with a genuine revolutionary consciousness. The romanticization of the past must be replaced by the construction of a real socialist future."
 GDR_strengthen_the_capital: "Strengthen the Capital"
 GDR_strengthen_the_capital_desc: "Berlin, as the capital of the GDR, must be a symbol of our power. Massive construction projects, including the completion and modernization of the Palace of the Republic, will showcase the might of socialist architecture."
 GDR_doctrine_of_the_socialist_outpost: "The Doctrine of the Socialist Outpost"
 GDR_doctrine_of_the_socialist_outpost_desc: "Germany is the front line of the class struggle. Our military doctrine must reflect this: a well-equipped, highly mobile people's army ready to defend the revolution at a moment's notice."
 GDR_autarky_at_any_cost: "Self-Sufficiency At Any Cost"
 GDR_autarky_at_any_cost_desc: "Dependence on the capitalist world market is a vulnerability. We must achieve autarky in strategic resources and key industries, no matter the economic cost in the short term. The long-term survival of the state is paramount."
 GDR_minor_cult_of_stalin: "The Small Cult of Stalin"
 GDR_minor_cult_of_stalin_desc: "The figure of Stalin, though controversial in the West, represents the iron will needed to build socialism. Rehabilitating his image within party historiography will serve as a warning to waverers and a beacon for the staunchest comrades."
 GDR_the_phoenix_reborn: "The Reborn Phoenix"
 GDR_the_phoenix_reborn_desc: "From the ashes of the 1990 Unification, a new, stronger GDR has risen. We have survived, we have rebuilt, and now we will show the world that socialism is not a failed experiment, but the future of mankind."

 GDR_gisi: "Gisi"
 GDR_gisi_desc: "We need new, young faces unburdened by the old rivalries. Gisi represents a new generation of socialists who understand the need for transparency (Glasnost) and economic modernization to survive in the modern world."
 GDR_restructuring: "The Real Perestroika"
 GDR_restructuring_desc: "The old command economy has failed. We need a fundamental restructuring of our economic system, introducing elements of cost-accounting and enterprise autonomy while maintaining public ownership of the means of production."
 GDR_path_to_market_socialism: "On the Road to Market Socialism"
 GDR_path_to_market_socialism_desc: "We must reconcile the market with socialist principles. Let cooperatives and small businesses flourish under the guidance of the state plan. This 'Socialist Market Economy' will bring prosperity and efficiency."
 GDR_question_national_front: "The Issue of the National Front"
 GDR_question_national_front_desc: "Is the National Front a relic, or can it be reformed? We propose turning it into a genuine parliamentary platform where different socialist and left-leaning parties can compete for votes in a democratic framework."
 GDR_limited_privatization: "Limited Privatization"
 GDR_limited_privatization_desc: "Not everything needs to be state-owned. We will allow the formation of small and medium-sized private enterprises in the service and consumer goods sectors, unleashing entrepreneurial energy while keeping the 'commanding heights' of the economy in public hands."
 GDR_peoples_corporations: "People's Corporations"
 GDR_peoples_corporations_desc: "Instead of state ministries running factories, we will transform large combines into 'People's Corporations' – publicly owned but independently managed, with workers on the boards and shares held by the public."
 GDR_end_hostilities_with_the_west: "End the Feud with the West"
 GDR_end_hostilities_with_the_west_desc: "The Cold War is over. We must recognize that peaceful coexistence isn't just a slogan, it's a necessity. We will seek normalized relations, trade deals, and cultural exchanges with the Federal Republic and other Western nations."
 GDR_truly_democratic_republic: "A Truly Democratic Republic"
 GDR_truly_democratic_republic_desc: "Let us live up to our name. We will introduce a multi-party system with real competition, guarantee freedom of speech and assembly, and build a state based on the rule of law, not party decree."
 GDR_cultural_progressivism: "Cultural Progressivism"
 GDR_cultural_progressivism_desc: "Socialism must be a force for social liberation. We will support LGBTQ+ rights, feminist movements, and avant-garde art, breaking with the conservative social norms of both the old GDR and the capitalist West."
 GDR_allow_free_elections: "Allow Free Elections"
 GDR_allow_free_elections_desc: "The ultimate test of our confidence in the people. We will allow free and fair multi-party elections for a constituent assembly. We are confident that the citizens of the GDR will choose a just, socialist future over the inequality of capitalism."

 GDR_honeckers_successor: "Honecker's Heir"
 GDR_honeckers_successor_desc: "Forget the drab austerity of the early years. Our model is the late Honecker era: a focus on consumer goods, Western détente, and a unique German socialist identity that is not a copy of Moscow."
 GDR_consumer_socialism: "Consumer Socialism"
 GDR_consumer_socialism_desc: "To secure the loyalty of the population, the state must deliver. We will prioritize the production of quality consumer goods, modern housing, and leisure activities. Socialism must be comfortable, not just heroic."
 GDR_dominance_over_the_agenda: "Dominating the Agenda"
 GDR_dominance_over_the_agenda_desc: "We will shift the national conversation away from endless ideological debates about Stalin or Marx. The new agenda is about stability, national pride in our socialist achievements, and a decent standard of living for every family."
 GDR_strengthen_the_national_front: "Strengthen the National Front"
 GDR_strengthen_the_national_front_desc: "The National Front should be a broad church of all patriotic and progressive Germans. By including block parties and mass organizations, we create a sense of national unity behind the SED's moderate leadership."
 GDR_economics_above_ideology: "Economics is above Ideology"
 GDR_economics_above_ideology_desc: "Ideology is important, but a state cannot run on slogans alone. We will adopt pragmatic economic policies, learning from Western management techniques and even seeking cooperation with West German firms to boost our efficiency."
 GDR_cultural_liberalization: "Cultural Liberalization"
 GDR_cultural_liberalization_desc: "Let the bands play rock music and the writers experiment with form. As long as they don't openly call for counter-revolution, a degree of cultural freedom acts as a safety valve and makes our state appear modern and confident."
 GDR_germany_honecker: "Honecker's Germany"
 GDR_germany_honecker_desc: "We are not just a Soviet satellite; we are Germans building a German socialism. This concept resonates with national pride. We are the true inheritors of German history, from Luther to Marx, building a sovereign and prosperous state."
 GDR_shut_up_the_party_opposition: "Silence the Party Opposition"
 GDR_shut_up_the_party_opposition_desc: "The hardliners who dream of Ulbricht's austerity and the reformers who want Western-style democracy are both threats to stability. Through a combination of co-optation and quiet administrative measures, we will marginalize these extremists within the party."
 GDR_member_of_the_global_economy: "An Equal Member Of The Global Economy"
 GDR_member_of_the_global_economy_desc: "We seek not confrontation, but cooperation. By joining international economic institutions on favorable terms and opening our market to controlled foreign investment, we can integrate the GDR into the global economy as a respected partner."
 GDR_truly_peoples_germany: "Truly National Germany"
 GDR_truly_peoples_germany_desc: "The other Germany speaks of the nation, but serves capital. We, the GDR, are the true 'People's Germany' – a state that protects its workers, cherishes its culture, and stands proudly independent between East and West, a model for a third way."

 GDR_national_peoples_army: "Restoration of the National People's Army"
 GDR_national_peoples_army_desc: "The Bundeswehr is an army of occupation. The NVA is an army of the people. We will reform our armed forces from the ground up, based on the principles of socialist military doctrine and the defense of our homeland."
 GDR_new_officer_personnel: "New Officer Cadres"
 GDR_new_officer_personnel_desc: "An army is only as good as its officers. We will establish new military academies to train a generation of politically reliable and professionally competent officers, the backbone of the new NVA."
 GDR_military_districts: "The Revival of Military Districts"
 GDR_military_districts_desc: "To ensure rapid mobilization and Territorial Defence, we will reinstate the classic structure of the GDR's military districts (MBK). This allows for decentralized command and a deep connection between the army and the local population."
 GDR_reactivation_of_the_t72: "Reactivation of the T-72"
 GDR_reactivation_of_the_t72_desc: "Our depots still hold the potential for a formidable armored force. We will reactivate and modernize our fleet of T-72 main battle tanks, a symbol of the NVA's power that once struck fear into the hearts of NATO generals."
 GDR_air_force: "The Air Force"
 GDR_air_force_desc: "Air superiority is crucial in modern warfare. We will rebuild the Luftstreitkräfte der NVA, focusing on robust, durable aircraft capable of supporting ground forces and defending our skies from incursion."
 GDR_anti_aircraft_missile_forces: "Anti-Aircraft Missile Troops"
 GDR_anti_aircraft_missile_forces_desc: "The GDR's territory must be a no-fly zone for enemy aircraft. We will deploy a modernized network of anti-aircraft missile systems, creating an impenetrable umbrella over our cities and strategic assets."
 GDR_improvement_of_airfields: "Improvement of Airfields"
 GDR_improvement_of_airfields_desc: "To project power and ensure the survivability of our air force, we must invest in our military infrastructure. Modern, reinforced airfields with hardened shelters will allow our aircraft to operate even under attack."
 GDR_reform_of_the_army: "Reform of the Army"
 GDR_reform_of_the_army_desc: "The modern battlefield requires flexibility. We will reform our land forces into smaller, more mobile combined-arms battlegroups, capable of rapid reaction and effective defense against a technologically superior enemy."
 GDR_support_troops: "Rear Troops"
 GDR_support_troops_desc: "An army fights on its stomach and moves on its logistics. We will professionalize our support troops (supply, maintenance, medical) to ensure our frontline forces are always well-supplied and combat-effective."
 GDR_air_defense_forces: "Air Defense Forces"
 GDR_air_defense_forces_desc: "A separate command for air defense is essential to coordinate all assets, from long-range missiles to mobile SHORAD systems, ensuring an integrated and layered defense of GDR airspace."
 GDR_military_industry: "Military Industry"
 GDR_military_industry_desc: "We cannot rely on foreign imports for our defense. We will revive and modernize our domestic military-industrial complex, from small arms factories to shipyards, to equip our army with weapons built by German workers."
 GDR_special_forces: "Special Forces"
 GDR_special_forces_desc: "Following the traditions of the 'Feliks Dzierzynski' Wachregiment, we will create a modern special forces unit. These elite soldiers will be our scalpel for the most sensitive operations, reconnaissance, and counter-terrorism."
 GDR_border_troops: "Border Troops"
 GDR_border_troops_desc: "Securing the border is the first line of defense against sabotage and espionage. The Border Troops of the GDR will be re-equipped and re-trained to guard our sovereignty in the 21st century."
 GDR_navy: "The Navy"
 GDR_navy_desc: "Our coast on the Baltic Sea is a vital strategic interest. We will rebuild the Volksmarine to protect our maritime borders, secure our trade routes, and project power along the coast."
 GDR_marine_corps: "Marine Corps"
 GDR_marine_corps_desc: "Amphibious assault and coastal defense require specialized troops. We will establish a marine corps, capable of rapid deployment to secure our islands and conduct landing operations in defense of the Baltic coast."
 GDR_new_ports: "New Ports"
 GDR_new_ports_desc: "To support our navy and increase our economic independence, we will modernize existing ports and construct new naval facilities in Rostock and Stralsund, capable of hosting our new fleet and submarines."

 GDR_return_of_the_stasi: "The Return of the Stasi"
 GDR_return_of_the_stasi_desc: "A shadow falls over the Republic. The Ministry for State Security, dismantled in troubled times, rises from the ashes. Old cadres return to the basements, and new ones learn the essential art: knowing everything about a citizen before they know it themselves."
 GDR_peoples_militia: "People's Militia"
 GDR_peoples_militia_desc: "Order on the streets is the face of the state. We strengthen the ranks of the People's Militia, equipping it with modern communications and transport. Every patrol is the eyes and ears of the party, even if the party prefers to remain in the shadows."
 GDR_barracks_peoples_police: "Barracks People's Police"
 GDR_barracks_peoples_police_desc: "The militia must know not only how to blow a whistle, but also how to hold formation. The Barracks Police become our internal bastion: paramilitary formations ready to restore order where ordinary law is insufficient."
 GDR_police_readliness: "Police Readiness"
 GDR_police_readliness_desc: "Citizens must know: help will arrive quickly. Response time is reduced, mobile rapid reaction groups are created. However, sometimes 'help' may take unexpected forms."
 GDR_main_intelligence_directorate: "Main Directorate of Intelligence"
 GDR_main_intelligence_directorate_desc: "Eyes and ears beyond the Republic. Our intelligence penetrates where missiles cannot reach: the corridors of power in Bonn, NATO headquarters, the minds of our enemies. Information is the only currency that never depreciates."
 GDR_agency_for_the_protection_economy: "Department for the Protection of the National Economy"
 GDR_agency_for_the_protection_economy_desc: "Sabotage, theft of socialist property, espionage in factories—these crimes are not visible in shop windows, but they erode the economy from within. The new agency is empowered to inspect any workshop, any warehouse, and any report."
 GDR_central_investigation_service: "Central Investigative Service"
 GDR_central_investigation_service_desc: "When a crime is solved, the investigator's work begins. The Central Service unites the best forensic experts and interrogators. Their methods may seem old-fashioned, but the results are always impeccable."
 GDR_werwolf: "101st Stasi Battalion 'Werwolf'"
 GDR_werwolf_desc: ""

 GDR_economy: "The Economy of the Reborn State"
 GDR_economy_desc: "The economic miracle of the 21st century will be socialist. We must rebuild our industrial base from the ruins left by the Treuhand privatization. Our goal is not just recovery, but the creation of a modern, efficient, and just economic system that serves the people, not corporate profits."
 GDR_Interflug: "Interflug"
 GDR_Interflug_desc: "The skies over Europe were once crossed by the silver aircraft of Interflug, our national airline. It is time to restore this symbol of GDR sovereignty. A new Interflug will connect Berlin with Hanoi, Havana, and other friendly capitals, while also offering reliable service to our citizens."
 GDR_Deutsche_Reichsbahn: "Deutsche Reichsbahn"
 GDR_Deutsche_Reichsbahn_desc: "The name 'Deutsche Reichsbahn' carries centuries of German railway history. We will restore our national railway to its former glory, modernizing tracks and rolling stock to create an efficient, electrified, and publicly-owned transport network that serves every citizen of the Republic."
 GDR_Robotron: "Robotron"
 GDR_Robotron_desc: "In the 1980s, Robotron was one of the world's leading computer manufacturers. Our engineers were pioneers. We will revive this legacy, investing in research and development to create a modern socialist IT industry, free from the surveillance capitalism of Western tech giants."
 GDR_Wartburg: "Wartburg"
 GDR_Wartburg_desc: "The Wartburg was more than a car; it was a symbol of German engineering and socialist mobility. We will modernize the legendary brand, producing affordable, durable, and reliable vehicles for the working families of the GDR, free from planned obsolescence."
 GDR_VVB_LOWA: "VVB LOWA"
 GDR_VVB_LOWA_desc: "From trams to trains, VVB LOWA once powered public transport across the socialist world. We will reunite our scattered engineering expertise to produce modern trams, buses, and railway equipment, making our cities greener and our public transport the envy of Europe."
 GDR_Fortschritt: "Fortschritt"
 GDR_Fortschritt_desc: "Agriculture is the foundation of a self-sufficient state. The Fortschritt brand, known across the Eastern Bloc for its reliable tractors and harvesters, will rise again. Mechanizing our collective farms will ensure food security and end dependence on Western agricultural imports."
 GDR_ORWO: "ORWO"
 GDR_ORWO_desc: "In the digital age, ORWO finds new life. Our legendary film and photographic chemistry expertise can be repurposed for high-tech applications: medical imaging, specialized sensors, and even analog film for a new generation of artists rejecting digital uniformity."
 GDR_TAKRAF: "TAKRAF"
 GDR_TAKRAF_desc: "The earth-moving giants of TAKRAF once reshaped our landscape for mining and construction. Today, we need their expertise for infrastructure projects: building canals, highways, and foundations for new socialist cities. TAKRAF equipment will build the future."
 GDR_wismut: "Wismut"
 GDR_wismut_desc: "Wismut was once the world's fourth-largest uranium producer, the backbone of our energy independence. With modern safety standards and environmental remediation, we can resume strategic mineral extraction, securing the resources needed for our industry without bowing to foreign corporations."

 GDR_interventionism_for_socialism: "Interventionism for Socialism"
 GDR_interventionism_for_socialism_desc: "The revolution cannot be confined to the territory of the former GDR. The working class across Europe suffers under the boot of capital. We have a duty to support socialist and progressive movements everywhere, by all means necessary. The Internationale will be realized."
 GDR_dismantle_german_aggression: "Dismantle German Aggression"
 GDR_dismantle_german_aggression_desc: "The Federal Republic is not a peaceful neighbor; it is the economic heart of NATO and a revanchist state that seeks to erase our very existence. We must work tirelessly to dismantle this bastion of capitalism, supporting every force that weakens it from within and without."
 GDR_support_rhineland_separatism: "Support Rhineland Separatism"
 GDR_support_rhineland_separatism_desc: "The Rhineland has always had its own distinct culture, historically more oriented towards France and Benelux than Prussia. We will secretly fund and advise separatist movements, offering the vision of a neutral, demilitarized Rhineland republic free from Bonn's domination."
 GDR_support_bavarian_separatism: "Support Bavarian Separatism"
 GDR_support_bavarian_separatism_desc: "Bavaria's conservative elites are our enemies, but the Bavarian people's traditional distrust of Prussian hegemony can be exploited. We will reach out to Bavarian monarchists, autonomists, and even left-wing separatists, offering support for a free and neutral Bavaria."
 GDR_end_germany: "End the Germany"
 GDR_end_germany_desc: "The very concept of a unified German state, born from Bismarck's blood and iron, is a threat to European peace. Our ultimate goal is the dissolution of the Federal Republic into its constituent historical lands: a confederation of free, socialist, or neutral republics from the Rhine to the Alps."
 GDR_silesian_revolt: "Silesian Revolt"
 GDR_silesian_revolt_desc: "The lands east of the Oder-Neisse line were stolen from Germany, but they were also stolen from their original Slavic inhabitants. We will support the rights of the Silesian minority in Poland, fostering a movement for autonomy or independence that will weaken our common enemies."
 GDR_end_czechia: "End the Czechia"
 GDR_end_czechia_desc: "The Czech Republic is a NATO vassal that has betrayed its socialist past and oppressed the German minority that remained after 1945. We will support Sudeten German activist groups and Slovak autonomists, working towards the peaceful dissolution of this artificial state."
 GDR_socialist_revolution_in_austria: "Socialist Revolution in Austria"
 GDR_socialist_revolution_in_austria_desc: "Austria, neutral on paper but capitalist in practice, is ripe for revolution. Its working class remembers the Red Vienna of the 1920s. We will provide funding, advisors, and ideological support to the Austrian Communist Party and radical trade unions, fanning the flames of class war in the Alps."
 GDR_end_denmark: "End the Denmark"
 GDR_end_denmark_desc: "Denmark, a prosperous but vulnerable NATO member, controls the vital straits to the Baltic Sea. We will support left-wing movements in Copenhagen and autonomy movements in Greenland and the Faroe Islands. A fractured Scandinavia serves our strategic interests and weakens the imperialist bloc."

