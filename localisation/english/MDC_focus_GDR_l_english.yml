 # Events
 GDR_main_events.1.t: "Reorganization of the National Front"
 GDR_main_events.1.d: "Comrades, the National Front must evolve. For decades, it served as a unified bloc of all anti-fascist and progressive forces under the leadership of our Party. But now, with the rebirth of our state, we face a crucial question: should we tighten its structure into a disciplined vanguard, or transform it into a broader coalition that can embrace the complexities of 21st century socialism?\n\nThe hardliners demand ideological purity and strict party discipline. The reformers speak of a 'popular front' that includes greens, feminists, and even progressive Christians. The choice we make will define the very nature of our republic."
 GDR_main_events.1.a: "Strengthen party discipline. The vanguard must lead."
 GDR_main_events.2.t: "Put an End to illusions"
 GDR_main_events.2.d: "Comrade, the people sing songs about the 'good old GDR' - about the cheap housing, the secure jobs, the childhood friendships. But this 'Ostalgie' is dangerous. It romanticizes a past that was filled with compromises, with stagnation, with the very seeds of our destruction. They remember the Wolf brand chocolate, but forget the long queues. They remember the summer camps, but forget the Stasi informants in every apartment block.\n\nWe must replace these petit-bourgeois sentimentalities with a genuine revolutionary consciousness. Our youth must look forward, not backward. But how far should we go in this cultural revolution?"
 GDR_main_events.2.a: ""
 GDR_main_events.2.b: ""
 GDR_main_events.3.t: "The Question of the National Front"
 GDR_main_events.3.d: "The reformist faction within our party, led by the charismatic Gysi, has submitted a radical proposal: transform the National Front into a genuine parliamentary platform where multiple socialist parties compete for votes. They argue that this would legitimize our rule in the eyes of the West and give voice to different currents within the left.\n\nBut the old guard is furious. 'Competition?' they sneer. 'We did not rebuild the GDR from ashes to become another bourgeois parliament!' The Central Committee is divided. The newspapers are speculating. The people are watching."
 GDR_main_events.3.a: ""
 GDR_main_events.3.b: ""
 GDR_main_events.4.t: "The Phoenix Rising"
 GDR_main_events.4.d: "From the ashes of 1990, from the humiliation of the Treuhand, from the poverty wages and the emigration of our youth - a new state has risen. The factories are humming again, not with the outdated machinery of the past, but with modern equipment built by German workers. Our borders are secure. Our children sing songs of the revolution in schools.\n\nToday, foreign delegations arrive: Vietnamese comrades, Cuban doctors, even a tentative trade mission from China. They look upon us with curiosity and respect. 'Is it possible?' they ask. 'Has socialism truly returned to the heart of Europe?'\n\nWe stand at the window of the rebuilt Palast der Republik, watching the sun rise over Berlin. The old men among us weep. We have done it, Comrade. We have done it."
 GDR_main_events.4.a: "We will Continue to Stick to the Course"
 GDR_main_events.4.b: "Let's Build a New Socialism"
 GDR_main_events.5.t: "The Cult of Stalin"
 GDR_main_events.5.d: "Comrade, the proposal has been made: to officially rehabilitate the figure of Joseph Stalin within our party's historiography. Not the Stalin of the late paranoia, they argue, but the Stalin of industrialization, of the defeat of fascism, of the iron will that built socialism in one country.\n\nBut the reaction from our European partners has been immediate and hostile. The French and Italian communists threaten to break ties. Even our Vietnamese friends express 'concern'. Within the party, the reformists call it 'political suicide' that will isolate us internationally.\n\nYet among the workers, especially the older generation, Stalin's portrait still appears at demonstrations. He represents, for them, the victory over Hitler, the Five-Year Plans, the era when the working class truly frightened the bourgeoisie."
 GDR_main_events.5.a: "Rehabilitate him. Let the bourgeoisie tremble."
 GDR_main_events.6.t: "New Congress of the Socialist Unity Party of Germany"
 GDR_main_events.6.d: "Comrades, delegates, honored guests from around the world!\n\nWe have gathered here in Berlin for the first Party Congress of the reborn SED. The air crackles with anticipation. Outside, thousands of workers march with red flags and banners. Inside, the debates are fierce and passionate.\n\nThree candidates have emerged as potential leaders of our great party, each representing a different vision for the future of German socialism.\n\nErnst Krez speaks for the old guard, for discipline and orthodoxy, for the traditions of Ulbricht and Honecker. His speech is met with thunderous applause from the factory delegates.\n\nGregor Gysi, the brilliant lawyer and reformer, calls for 'socialism with a human face', for democracy, for openness to the West. The intellectuals and youth hang on his every word.\n\nAnd then there is Sahra Wagenknecht - young, fierce, eloquent. She speaks of a 'third way': conservative on cultural issues, radical on economics. 'We must speak to the workers the far-right steals,' she declares. 'We must be the voice of those globalization left behind.' The hall is silent, then erupts.\n\nThe choice is yours, Comrade General Secretary. Who will lead us into the future?"
 GDR_main_events.6.a: "Ernst Krez"
 GDR_main_events.6.b: "Gregor Gysi"
 GDR_main_events.6.c: "Sahra Wagenknecht"

 GDR_revoult.1.t: "Separatists in Saxony Have Declared Secession"
 GDR_revoult.1.d: "As soon as our great country returned to the map of the world, those who were against its existence appeared, and among them were our fellow citizens! Separatists from the region of Saxony announced that they were now an independent state and were not subject to any German government."
 GDR_revoult.1.a: "Let's Give Them Freedom"
 GDR_revoult.1.b: "Destroy Them"