l_english:
 eon_ammo_storage_available_tt: "The recipient has space for the full §Y100,000§! ammunition shipment in its current storage."
 eon_ammo_donor_available_tt: "The donor has no unanswered ammunition offer or unresolved earlier response. This partner has no unresolved earlier response."
 eon_ammo_quarantined_tt: "The donor has no unresolved ammunition response whose original partner cannot be identified."
 eon_ammo_withdraw_offer: "Withdraw ammunition offer"
 eon_ammo_withdraw_offer_send_desc: "Withdraw our unanswered §Y100,000§! ammunition offer. The reserved ammunition returns to our storage as space becomes available. The old response must be closed before we can send another offer."
 eon_ammo.1.t: "Ammunition shipment did not proceed"
 eon_ammo.1.d: "The offer no longer meets the agreed conditions: it expired, was withdrawn, the recipient is no longer eligible or its storage cannot hold the full shipment. No ammunition was delivered. The reserved ammunition remains ours and returns to storage as space becomes available."
 eon_ammo.2.t: "Ammunition offer withdrawn"
 eon_ammo.2.d: "The donor withdrew an unanswered ammunition offer. No ammunition will be delivered under it. Close the original diplomatic response to release the donor's reservation."
 eon_ammo.3.t: "Unanswered ammunition offer closed"
 eon_ammo.3.d: "An unanswered offer expired after 30 days or its recipient ceased to exist. No ammunition was delivered. The reserved ammunition remains ours and returns to storage as space becomes available. A new offer to this same partner is blocked because the old diplomatic response could not be confirmed as closed. Other partners remain available."
 eon_ammo.4.t: "Ammunition offers paused"
 eon_ammo.4.d: "An outstanding ammunition offer cannot be matched reliably to its original diplomatic response. Any ammunition still held remains ours and returns to storage as space becomes available. Further ammunition offers are blocked because this unresolved response cannot be identified safely."
 eon_ammo.ack: "Understood"
