l_english:
 eon_ct_raid_operations:0 "Counterterrorism operations"
 eon_ct_raid_operations_desc:0 "Manage paid counterterrorism operations before their five-day execution. Outstanding command-power refund claim: [?eon_ct_raid_refund_due|1]. $eon_ct_raid_refund_tt$ A cancelled operation stays reserved until its original timer closes. If that timer remains unresolved after seven days, that operation is closed to further use; other operations remain separate."
 eon_ct_raid_start_tt:0 "25 command power has been spent on this five-day operation and the current territory owner recorded. Execution requires the original territorial and national conditions to remain valid. For foreign territory, both countries must still consent to counterterrorism cooperation and remain at peace with each other. If the owner or authorization changes, the operation is cancelled and its unused paid cost becomes a refund claim. Existing outcome risks remain."
 eon_ct_raid_cancel_tt:0 "Cancel this paid operation at no additional cost and prevent its delayed raid outcome. Its unused 25 command power is refunded once. Any amount that cannot currently be credited remains our claim and is retried automatically. The original timer keeps this operation reserved until it closes; other operations remain separate."
 eon_ct_raid_refund_tt:0 "Unused paid command power belongs to the country that paid it. Refunds are credited only to available capacity; the uncredited claim remains and retries automatically. If a refund clips previously over-limit command power, that loss is retained in the claim. Annexation does not transfer this claim to the annexer."
