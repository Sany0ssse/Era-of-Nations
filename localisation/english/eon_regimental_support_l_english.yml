l_english:
 eon_regimental_light_artillery:0 "Regimental light artillery battery"
 eon_regimental_light_artillery_desc:0 "A small battery attached to an infantry regiment with at least three line battalions in its column. Requires three guns and one command-and-control equipment set. It adds fire support without extra combat width; it does not represent artillery placed at the front of a battle."
 eon_regimental_motorized_artillery:0 "Regimental motorized artillery battery"
 eon_regimental_motorized_artillery_desc:0 "A small towed battery attached to a mobile or armored regiment with at least three line battalions in its column. Requires three guns, one command-and-control equipment set and five utility vehicles. Its transport uses fuel. The slot represents a support attachment, not a tactical battle line."
