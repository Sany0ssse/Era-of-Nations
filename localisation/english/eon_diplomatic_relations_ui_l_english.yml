l_english:
 EON_DIPLOMATIC_RELATIONS_UI_STATUS_TITLE:0 "Diplomatic record"
 EON_DIPLOMATIC_RELATIONS_UI_STATUS_ACTION_DESC:0 "Open the diplomatic record for this country: current relations, missions, appointments, proposals and departure arrangements. Review the full record in the confirmation window."
 eon_diplomatic_relations_ui_status_send_desc:0 "Relations with [THIS.GetName]: [eon_diplomatic_relations_ui_relation_label]. Our mission: [eon_diplomatic_relations_ui_mission_label]. Active appointment No. [?ROOT.eon_diplomatic_relations_active_head@THIS|0]; approved appointment No. [?ROOT.eon_diplomatic_relations_approved_head@THIS|0]. Outgoing proposal: [eon_diplomatic_relations_ui_outgoing_label], appointment No. [?ROOT.eon_diplomatic_relations_out_head@THIS|0]. Incoming proposal: [eon_diplomatic_relations_ui_incoming_label], appointment No. [?ROOT.eon_diplomatic_relations_in_head@THIS|0]. Our departure arrangements: [eon_diplomatic_relations_ui_departure_label]. Closed premises and archives: [eon_diplomatic_relations_ui_protection_label]. Appointment numbers identify diplomatic appointments, without naming a person. Pending departure duties: [?ROOT.eon_diplomatic_relations_departure_count@THIS|0]. Current departure record No. [?ROOT.eon_diplomatic_relations_current_departure@THIS|0], appointment No. [?ROOT.eon_diplomatic_relations_current_departure_head@THIS|0] (0 = other mission personnel)."
 EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_TITLE:0 "Establish / restore relations"
 EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_ACTION_DESC:0 "Ask for mutual confirmation of existing relations or restoration after a rupture. The response period is 30 days. Agreement preserves historical grievances and does not itself open an embassy, recognize a government, lift sanctions or create an alliance."
 eon_diplomatic_relations_ui_propose_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_MISSION_CHARGE_TITLE:0 "Open a chargé mission"
 EON_DIPLOMATIC_RELATIONS_UI_MISSION_CHARGE_ACTION_DESC:0 "Agree to open our mission at chargé d’affaires level, or change its formal class to that level. When the host accepts, we pay a one-time fee of 10 political power and 0.01 billion USD from our treasury. Monthly upkeep then costs 0.001 billion USD from our treasury. We must appoint a head separately. The partner’s mission in our country is a separate undertaking."
 eon_diplomatic_relations_ui_mission_charge_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_MISSION_CHARGE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_MISSION_AMBASSADOR_TITLE:0 "Open / change our embassy"
 EON_DIPLOMATIC_RELATIONS_UI_MISSION_AMBASSADOR_ACTION_DESC:0 "Agree to open or upgrade our mission to ambassador level. When the host accepts, we pay a one-time fee of 10 political power and 0.02 billion USD from our treasury. Monthly upkeep then costs 0.002 billion USD from our treasury. A change of class requires a new appointment. The partner’s mission remains separate; the class does not confer additional diplomatic rights."
 eon_diplomatic_relations_ui_mission_ambassador_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_MISSION_AMBASSADOR_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_HEAD_TITLE:0 "Propose a head of mission"
 EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_HEAD_ACTION_DESC:0 "Submit a new numbered appointment for the head of our mission and request agrément. The partner may accept or refuse within 30 days. An agreed appointment still requires notification of arrival and credentials before the head takes up functions. The present head continues while a replacement is considered."
 eon_diplomatic_relations_ui_propose_head_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_HEAD_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_RELATIONS_TITLE:0 "Agree to diplomatic relations"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_RELATIONS_ACTION_DESC:0 "Confirm or restore bilateral relations, preserving historical grievances. Review the current diplomatic record before deciding."
 eon_diplomatic_relations_ui_accept_relations_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_RELATIONS_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_CHARGE_TITLE:0 "Agree to a chargé mission"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_CHARGE_ACTION_DESC:0 "Agree to the partner’s chargé-level mission. The sending country pays 10 political power and 0.01 billion USD, then 0.001 billion USD monthly. Review the current diplomatic record before deciding."
 eon_diplomatic_relations_ui_accept_charge_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_CHARGE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_AMBASSADOR_TITLE:0 "Agree to an embassy"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_AMBASSADOR_ACTION_DESC:0 "Agree to the partner’s ambassador-level mission. The sending country pays 10 political power and 0.02 billion USD, then 0.002 billion USD monthly. Review the current diplomatic record before deciding."
 eon_diplomatic_relations_ui_accept_ambassador_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_AMBASSADOR_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_HEAD_TITLE:0 "Grant agrément to a mission head"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_HEAD_ACTION_DESC:0 "Grant agrément to incoming appointment No. [?ROOT.eon_diplomatic_relations_in_head@THIS|0]. Notification of arrival and credentials remains a separate step. Review the current diplomatic record before deciding."
 eon_diplomatic_relations_ui_accept_head_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_HEAD_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_DECLINE_TITLE:0 "Decline the proposal"
 EON_DIPLOMATIC_RELATIONS_UI_DECLINE_ACTION_DESC:0 "Close only this incoming request. No resources are charged and no other agreement ends. Agrément refusal need not include a reason. A fresh request is possible after closure; there is no permanent pair ban."
 eon_diplomatic_relations_ui_decline_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_DECLINE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_WITHDRAW_TITLE:0 "Withdraw our proposal"
 EON_DIPLOMATIC_RELATIONS_UI_WITHDRAW_ACTION_DESC:0 "Close only our outgoing request and its matching copy. This is free and does not close either active mission or another contract. A new request can be submitted immediately."
 eon_diplomatic_relations_ui_withdraw_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_WITHDRAW_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_CREDENTIALS_TITLE:0 "Notify arrival and credentials"
 EON_DIPLOMATIC_RELATIONS_UI_CREDENTIALS_ACTION_DESC:0 "Notify the receiving foreign ministry of the approved head’s arrival and deliver a copy of credentials. This begins the head’s functions. A previous head’s departure arrangements remain a separate responsibility."
 eon_diplomatic_relations_ui_credentials_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_CREDENTIALS_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_RECALL_TITLE:0 "Recall our head of mission"
 EON_DIPLOMATIC_RELATIONS_UI_RECALL_ACTION_DESC:0 "Recall our current head and notify interim representation by a chargé d’affaires. The agreed mission class and bilateral relations continue. Arrange the recalled head’s departure, then submit a replacement when ready."
 eon_diplomatic_relations_ui_recall_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_RECALL_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_TITLE:0 "Declare a mission head persona non grata"
 EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_ACTION_DESC:0 "Declare active appointment No. [?THIS.eon_diplomatic_relations_active_head@ROOT|0] of the visiting mission unacceptable. An explanation is not required. The sending country must end this head’s functions and arrange departure. An approved replacement or another pending appointment remains separate."
 eon_diplomatic_relations_ui_persona_non_grata_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_APPROVED_TITLE:0 "Withdraw agrément"
 EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_APPROVED_ACTION_DESC:0 "Withdraw agrément for approved appointment No. [?THIS.eon_diplomatic_relations_approved_head@ROOT|0] before its head takes up functions. An explanation is not required. The present head continues, if one is serving; a new appointment may be submitted. The approved appointment has not established arrival, so no departure is recorded for it."
 eon_diplomatic_relations_ui_persona_non_grata_approved_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_APPROVED_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_CLOSE_TITLE:0 "Close our diplomatic mission"
 EON_DIPLOMATIC_RELATIONS_UI_CLOSE_ACTION_DESC:0 "Close our mission and any pending appointment or class proposal in this direction. The host must protect the closed premises and archives and provide facilities for personnel to depart. Relations and the opposite mission continue separately."
 eon_diplomatic_relations_ui_close_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_CLOSE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_CLOSE_HOST_TITLE:0 "Close the partner’s mission"
 EON_DIPLOMATIC_RELATIONS_UI_CLOSE_HOST_ACTION_DESC:0 "End consent to the visiting mission. Its premises and archives remain protected, and departure arrangements must be acknowledged. Our opposite mission, bilateral relations and other agreements are separate."
 eon_diplomatic_relations_ui_close_host_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_CLOSE_HOST_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_BREAK_TITLE:0 "Sever diplomatic relations"
 EON_DIPLOMATIC_RELATIONS_UI_BREAK_ACTION_DESC:0 "Record the bilateral rupture, close both directed missions and their current requests, retain historical grievances, and record protection and departure duties. Existing trade, investment, energy, support, alliances, sanctions and third-country relations are not automatically cancelled. Consular relations are not modelled as automatically severed."
 eon_diplomatic_relations_ui_break_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_BREAK_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_EXIT_FACILITIES_TITLE:0 "Confirm departure facilities"
 EON_DIPLOMATIC_RELATIONS_UI_EXIT_FACILITIES_ACTION_DESC:0 "Confirm that the receiving country has declared facilities for the departing personnel. The departure remains outstanding until the sending country reports it. Sending country’s current departure record No. [?THIS.eon_diplomatic_relations_current_departure@ROOT|0], appointment No. [?THIS.eon_diplomatic_relations_current_departure_head@ROOT|0] (0 = other mission personnel). This acknowledgement concerns this record only."
 eon_diplomatic_relations_ui_exit_facilities_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_EXIT_FACILITIES_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_REPORT_DEPARTURE_TITLE:0 "Report personnel departure"
 EON_DIPLOMATIC_RELATIONS_UI_REPORT_DEPARTURE_ACTION_DESC:0 "After the host acknowledges its declared arrangements, report that our departing personnel have left. Closed premises and archives remain subject to protection. This report closes current departure record No. [?ROOT.eon_diplomatic_relations_current_departure@THIS|0] only; later duties remain outstanding."
 eon_diplomatic_relations_ui_report_departure_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_REPORT_DEPARTURE_ACTION_DESC$"
 eon_diplomatic_relations_ui_status_ready_tt:0 "The selected country exists and has a diplomatic record with us."
 eon_diplomatic_relations_ui_propose_ready_tt:0 "Both countries exist and are at peace with each other. National policy permits relations; they are not already confirmed, and neither direction has a pending proposal."
 eon_diplomatic_relations_ui_mission_charge_ready_tt:0 "Relations permit a mission and there is no war between us. No pending outgoing request in this direction; our current mission is not at charge level. We need 10 political power and 0.01 billion USD now and at acceptance; payment occurs only on agreement."
 eon_diplomatic_relations_ui_mission_ambassador_ready_tt:0 "Relations permit a mission and there is no war between us. No pending outgoing request in this direction; our current mission is not at ambassador level. We need 10 political power and 0.02 billion USD now and at acceptance; payment occurs only on agreement."
 eon_diplomatic_relations_ui_propose_head_ready_tt:0 "Relations permit a mission and there is no war between us. Our mission is open, no outgoing request is pending in this direction, and no approved candidate is awaiting the start of duties."
 eon_diplomatic_relations_ui_accept_relations_ready_tt:0 "A matching proposal to confirm or restore relations is still pending within its 30-day response period. Both countries exist and are at peace with each other; national policy permits relations, and they are not already confirmed."
 eon_diplomatic_relations_ui_accept_charge_ready_tt:0 "A matching charge-level proposal is pending within its 30-day response period. Relations permit a mission and there is no war between us. The sender still needs 10 political power and 0.01 billion USD, and its mission is not already at this level."
 eon_diplomatic_relations_ui_accept_ambassador_ready_tt:0 "A matching ambassador-level proposal is pending within its 30-day response period. Relations permit a mission and there is no war between us. The sender still needs 10 political power and 0.02 billion USD, and its mission is not already at this level."
 eon_diplomatic_relations_ui_accept_head_ready_tt:0 "A matching appointment proposal is pending within its 30-day response period. Relations permit a mission and there is no war between us. The sender has a mission of the proposed class and no other candidate already approved."
 eon_diplomatic_relations_ui_decline_ready_tt:0 "An incoming proposal is still pending, and its type, mission class and appointment match the sender's current proposal."
 eon_diplomatic_relations_ui_withdraw_ready_tt:0 "Our outgoing proposal to this country is still pending."
 eon_diplomatic_relations_ui_credentials_ready_tt:0 "Relations permit our open mission and there is no war between us. Both countries still record the same approved appointment and mission class; the host's agrement remains in effect."
 eon_diplomatic_relations_ui_recall_ready_tt:0 "Both countries exist, and our open mission has an active head."
 eon_diplomatic_relations_ui_persona_non_grata_ready_tt:0 "Both countries exist, and the partner's open mission in our country has an active head."
 eon_diplomatic_relations_ui_persona_non_grata_approved_ready_tt:0 "Both countries exist. The partner has an open mission; its approved appointment and class still match our agrement record."
 eon_diplomatic_relations_ui_close_ready_tt:0 "Both countries exist, and our mission in the selected country is open."
 eon_diplomatic_relations_ui_close_host_ready_tt:0 "Both countries exist, and the selected country's mission in our country is open."
 eon_diplomatic_relations_ui_break_ready_tt:0 "Both countries exist. Relations are not already recorded as broken; they are confirmed or the historical diplomatic record permits a rupture."
 eon_diplomatic_relations_ui_exit_facilities_ready_tt:0 "Both countries exist. The partner has unfinished departure duties, and we have not yet acknowledged departure facilities for its current record. This acknowledgement does not itself complete departure."
 eon_diplomatic_relations_ui_report_departure_ready_tt:0 "Both countries exist. Our current departure duties remain unfinished, and the host has acknowledged facilities for that same departure record."
