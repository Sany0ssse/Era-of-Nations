l_english:
 eon_nuclear_arsenal_category:0 "Nuclear arsenal maintenance"
 eon_nuclear_arsenal_category_desc:0 "Nuclear missiles require funded storage, inspections and personnel. Silo and bomber operating costs are already included in defence spending. This account covers the missile arsenal without charging those platforms again.\n\nCurrent mode: [GetEonNuclearArsenalMode].\nReserve: §Y[?eon_nuclear_arsenal_reserve|0]§!; deployed: §Y[?eon_nuclear_arsenal_deployed|0]§!. Maintenance: §Y$[?eon_nuclear_arsenal_weekly_cost|5] billion/week§!."
 eon_nuclear_arsenal_status:0 "Review arsenal and maintenance costs"
 eon_nuclear_arsenal_status_desc:0 "Reserve nuclear missiles: §Y[?eon_nuclear_arsenal_reserve|0]§!. Deployed nuclear missiles: §Y[?eon_nuclear_arsenal_deployed|0]§!. Total: §Y[?eon_nuclear_arsenal_total|0]§!.\nMaintenance: §Y$[?eon_nuclear_arsenal_weekly_cost|5] billion/week§!, included once in additional budget expenses.\nCurrent mode: [GetEonNuclearArsenalMode]. Weekly restoration checks remaining: §Y[?eon_nuclear_arsenal_recovery_remaining|0]§!.\n\nExisting nuclear policy, war and raid requirements still apply. Stored missiles do not consume civilian reactor fuel. Amounts and restoration time are game abstractions."
 eon_nuclear_arsenal_safety:0 "Withdraw the nuclear arsenal from operational readiness"
 eon_nuclear_arsenal_safety_desc:0 "Retain the missiles under funded safe storage, at 35% of the ordinary maintenance account. Nuclear use becomes unavailable immediately, including prepared raids. Conventional missiles are unaffected. Restoring nuclear readiness requires full funding and four weekly checks."
 eon_nuclear_arsenal_full:0 "Restore full nuclear arsenal maintenance"
 eon_nuclear_arsenal_full_desc:0 "Resume full maintenance funding. The arsenal remains unavailable for nuclear use until four weekly restoration checks have completed. Reviewing the budget or clicking again does not accelerate this period."
 eon_nuclear_arsenal_launch_ready_tt:0 "Nuclear arsenal readiness allows use."
 eon_nuclear_arsenal_safety_tt:0 "§YNuclear use is suspended§!; the maintenance account falls to §Y35%§!. Missiles remain in the arsenal."
 eon_nuclear_arsenal_full_tt:0 "Full maintenance resumes. Nuclear readiness returns after §Y4 weekly checks§!."
 eon_nuclear_arsenal_mode_safety:0 "§Ysafe storage; nuclear use unavailable§!"
 eon_nuclear_arsenal_mode_recovery:0 "§Yfull funding; readiness restoration in progress§!"
 eon_nuclear_arsenal_mode_full:0 "§Gfull maintenance; readiness checks complete§!"
