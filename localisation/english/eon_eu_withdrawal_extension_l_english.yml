l_english:
 eon_eu_extension_propose:0 "Request an agreed extension of the EU withdrawal period"
 eon_eu_extension_propose_desc:0 "Ask the other eligible member governments for a 365-day extension. Our current remaining period is preserved. The project lasts 30 days; one agreed extension may wait in the queue. These durations are game settings."
 eon_eu_extension_propose_requirements:0 "A valid withdrawal notice and a positive current period are required. No project, queued extension or 90-day cooldown may already be active. Every eligible remaining government must record a response, none may reject, and we must separately accept. Represented abstentions do not veto unanimity; missing answers block this game procedure. No European Parliament ballot is required for the extension."
 eon_eu_extension_approve:0 "Agree to extend [From.GetName]'s EU withdrawal period"
 eon_eu_extension_approve_desc:0 "Our government agrees to the current 365-day extension project. This replaces any previous rejection of the same project. The withdrawing state still has to accept it."
 eon_eu_extension_approve_requirements:0 "Current project: yes [?FROM.eon_eu_extension_yes_count|0], no [?FROM.eon_eu_extension_no_count|0], explicit abstentions [?FROM.eon_eu_extension_abstain_count|0]. Recorded responses: [?FROM.eon_eu_extension_answer_count|0] / [?FROM.eon_eu_extension_electorate_total|0]. Each eligible remaining government must respond and none may reject; a represented abstention does not veto unanimity."
 eon_eu_extension_reject:0 "Reject [From.GetName]'s withdrawal-period extension"
 eon_eu_extension_reject_desc:0 "Replace our approval with a rejection of the current project. A rejection prevents unanimous agreement. It does not itself make the state leave the EU."
 eon_eu_extension_reject_requirements:0 "We must be an eligible remaining member government. The currently displayed project must still be open. A previous rejection cannot be duplicated."
 eon_eu_extension_abstain:0 "Abstain on [From.GetName]'s withdrawal extension"
 eon_eu_extension_abstain_desc:0 "Record our represented abstention on the current project, replacing our previous approval or rejection. This does not veto a unanimous European Council decision. It is an explicit response, distinct from silence or absence. The other governments' answers are preserved."
 eon_eu_extension_abstain_requirements:0 "We must be an eligible remaining government responding to this current project and have no already recorded abstention. This response prevents our silence from blocking the procedure; any other government's rejection still blocks adoption."
 eon_eu_extension_accept_final:0 "Accept the unanimously agreed withdrawal extension"
 eon_eu_extension_accept_final_desc:0 "Give our separate final acceptance. One 365-day extension enters the queue and begins only when our current period actually expires. This is an extension of membership, not a withdrawal agreement."
 eon_eu_extension_accept_final_requirements:0 "Current project: yes [?eon_eu_extension_yes_count|0], no [?eon_eu_extension_no_count|0], abstentions [?eon_eu_extension_abstain_count|0]. Recorded responses: [?eon_eu_extension_answer_count|0] / [?eon_eu_extension_electorate_total|0]. At least one other eligible government, all required represented responses and no rejection are needed. Membership, voting rights and the project are checked again on acceptance. The remaining current period is not restarted."
 eon_eu_extension_cancel_proposal:0 "Withdraw our extension project"
 eon_eu_extension_cancel_proposal_desc:0 "Close only this extension project and clear its answers. A new project is available after 90 days. The withdrawal notice and its current period remain; revoking that notice is a separate unilateral decision."
 eon_eu_extension_cancel_proposal_requirements:0 "Only our current open extension project is withdrawn. No member government is asked to approve this cancellation."
 eon_eu_withdrawal_extension.ok:0 "Understood"
 eon_eu_withdrawal_extension.1.t:0 "A withdrawal-period extension is requested"
 eon_eu_withdrawal_extension.1.d:0 "[From.GetName] requests a 365-day extension. Open Decisions → EU membership and treaties to agree, reject or explicitly abstain. The project lasts 30 days. Every eligible remaining government must record a response and none may reject; a represented abstention does not veto unanimity. The withdrawing state then must separately accept. This information window casts no vote; use current targeted decisions."
 eon_eu_withdrawal_extension.2.t:0 "The extension is agreed and queued"
 eon_eu_withdrawal_extension.2.d:0 "All required governments responded without rejection and we gave our final acceptance. Our remaining current period is unchanged. The agreed 365-day extension begins only at its actual expiry. Until effective departure we remain a member. A second extension cannot be stockpiled while this one is still queued."
 eon_eu_withdrawal_extension.3.t:0 "The agreed extension period has begun"
 eon_eu_withdrawal_extension.3.d:0 "Our previous period expired. Its agreed extension has now been used exactly once, starting a new 365-day period of continued membership. A further extension needs a new project, current unanimous government agreement and our final acceptance. The 365-day duration is a game calibration, not a fixed legal duration."
