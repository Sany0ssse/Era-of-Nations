l_english:
 eon_aid_prepare_ready_tt:0 "Both countries must be free of another pending aid request. The existing influence, economic and national conditions must hold, and the donor needs at least 5 billion in its treasury. Aid is a one-time, non-repayable grant that requires the recipient's consent."
 eon_aid_legacy_pair_available_tt:0 "This pair has no unresolved aid request from the older system. A pair with ambiguous older replies remains closed to new aid; agreements with other countries can continue."
 eon_aid_retired_pair_available_tt:0 "No unresolved aid reply was left behind when either country disappeared. Such a pair remains closed to new aid after restoration; requests involving other countries remain available."
 eon_debt_retired_pair_available_tt:0 "We have no unresolved debt-support reply from before either party disappeared. That outgoing pair stays closed after restoration; we can still propose support to other countries."
 eon_aid_draft_desc:0 "Prepare a one-time grant for [From.GetName]. Choose 5, 15 or 35 billion, subject to available treasury funds and current eligibility. Sending holds this amount for the recipient's decision. Acceptance credits the full grant and gives the existing opinion and influence effects. A refusal or withdrawal returns the held funds. This grant creates no loan or recurring payment."
 eon_aid_draft_cancelled_tt:0 "Close this aid draft without sending money or applying political consequences."
 eon_aid_offer_title:0 "One-time Economic Aid"
 eon_aid_offer_desc:0 "[From.GetName] offers a one-time, non-repayable grant of §Y[?eon_aid_amount] billion§!. These funds are held until our decision. Acceptance credits the full amount to our treasury and increases the donor's opinion and influence through the existing aid rules. Refusal returns the funds and applies the existing domestic political effects. The grant has no recurring instalments."
 eon_aid_cancelled_offer_desc:0 "The donor withdrew this aid proposal before acceptance. The held funds have been returned or recorded for return when treasury space becomes available. Close this response to release both countries for a new request. No grant or refusal benefit is applied."
 eon_aid_withdraw_tt:0 "This country holds our matching, unaccepted aid proposal. Withdrawal returns its held funds. If our treasury is full, the remaining refund is retained and credited as space becomes available. Both countries stay reserved until the recipient closes the original response."
 eon_withdraw_economic_aid:0 "Withdraw Economic Aid Proposal"
 eon_withdraw_economic_aid_desc:0 "Withdraw our unaccepted, one-time economic aid proposal to this country."
 eon_withdraw_economic_aid_send_desc:0 "Withdraw the unaccepted grant and recover its held funds. A refund that exceeds current treasury space remains due and is credited when space becomes available. The recipient must close the original response before either country can open another aid request. An accepted grant cannot be withdrawn."
 eon_debt_support_action_desc:0 "Offer a one-time cash repayment of another country's existing debt. The proposal fixes a ceiling equal to 25% of its debt when sent. Acceptance pays no more than that ceiling or the debt still outstanding, using our treasury. This does not transfer debt to us, create a loan, or promise an opinion gain. Existing political eligibility and the 75 political power cost apply."
 eon_debt_support_send_desc:0 "Offer to pay up to 25% of [THIS.GetNameWithFlag]'s debt as measured when this request is sent. Cash is checked at sending and again at execution; it is not held while awaiting consent. The payment cannot exceed the remaining debt. The recipient receives debt relief rather than treasury cash."
 eon_debt_support_accept_desc:0 "Acceptance authorizes the proposed one-time debt repayment. Execution requires the original countries, positive remaining debt, no war between them and enough donor treasury funds for the payment. The payment is capped by the frozen proposal and current remaining debt. A request whose execution conditions no longer hold ends without a cash or debt transfer."
 eon_debt_support_reject_desc:0 "The recipient declined the proposed one-time debt repayment. No treasury funds were held or transferred and no debt was repaid by this request."
 eon_support_ack:0 "Understood"
 eon_support.10.t:0 "Economic Aid Accepted"
 eon_support.10.desc:0 "The recipient accepted this one-time aid proposal. Its full held grant was credited and the existing opinion and influence effects were applied. This result creates no recurring payment."
 eon_support.11.t:0 "Economic Aid Declined"
 eon_support.11.desc:0 "The recipient declined this aid proposal. Its held funds were returned; any amount above available treasury space remains due and will be credited when space becomes available. No grant was credited to the recipient."
 eon_support.12.t:0 "Economic Aid No Longer Valid"
 eon_support.12.desc:0 "The original request records or current conditions no longer allowed this proposal to execute safely. No grant or refusal benefit was applied. Identifiable donor funds were returned or retained for later credit when treasury space becomes available."
 eon_support.13.t:0 "Economic Aid Withdrawn"
 eon_support.13.desc:0 "This aid proposal was withdrawn before acceptance. Held funds were returned or retained for later credit when treasury space becomes available. The original recipient response still has to be closed before the pair can open another aid request. This notice applies no grant or refusal benefit."
 eon_support.14.t:0 "Economic Aid Draft Closed"
 eon_support.14.desc:0 "The aid draft was closed before a proposal was sent. No money was held or transferred and no political consequences were applied."
