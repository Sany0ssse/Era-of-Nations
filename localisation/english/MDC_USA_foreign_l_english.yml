l_english:
 ##########Foreign Policy TREE##########
 ##########Focuses##########
 USA_foreign_europe: "Politics in Europe"
 USA_foreign_europe_desc: "It is time for us to engage in political activities in the European region, despite the end of the Cold War. The long-awaited American hegemony has not yet arrived."
 USA_foreign_europe_expand_nato: "NATO Expansion"
 USA_foreign_europe_expand_nato_desc: "It's time for NATO to expand, the Iron Curtain has fallen, as has its architect, the USSR, and we are ready to approach Russia's borders."
 USA_foreign_europe_baltika: "NATO - Baltic"
 USA_foreign_europe_baltika_desc: "We are ready to offer NATO membership to the Baltic countries, and it is time to protect this region"
 USA_foreign_europe_balkans: "NATO - Balkans"
 USA_foreign_europe_balkans_desc: "We are ready to offer NATO membership to the Balkan countries, and it is time to protect this region"
 USA_foreign_europe_balkans_two: "Second Expansion into the Balkans"
 USA_foreign_europe_balkans_two_desc: "The Yugoslav Wars showed that peace in the Balkans can only be achieved with NATO support. At the moment, we have quite a few candidates for NATO's new expansion"
 USA_foreign_europe_reagirovanie: "NATO Response Force"
 USA_foreign_europe_reagirovanie_desc: "NATO's armies are a huge fighting force, but sometimes you need to respond quickly anywhere in the world and don't have time to wait for this massive military machine to be deployed. That's why we're planning to create a new branch of the Alliance to address this issue."
 USA_foreign_europe_nato_north: "Multinational Corps Northeast"
 USA_foreign_europe_nato_north_desc: "The Northern Flank of NATO needs to be strengthened, and an appropriate corps of armed forces from NATO member countries in the northern regions will be created to better coordinate and interact"
 USA_foreign_europe_nato_south: "Multinational Corps Southeast"
 USA_foreign_europe_nato_south_desc: "The Southern Flank of NATO needs to be strengthened, and an appropriate corps of armed forces from NATO member countries in the northern regions will be created to better coordinate and interact"
 USA_foreign_europe_nato_oper: "Allied Reaction Force"
 USA_foreign_europe_nato_oper_desc: "Modern warfare requires the rapid deployment of troops in the main areas of the enemy's offensive. We intend to create a military unit that will solve the problem of the enemy's offensive on any front."
 USA_foreign_europe_hohol: "Support for Democracy in Ukraine"
 USA_foreign_europe_hohol_desc: "Since its formation, Ukraine has shown itself to be a country striving for democracy, in contrast to its former hegemonic ruler, Russia, which seems ready to slide back into dictatorship."
 USA_foreign_europe_hohol_nato: "Partnership with NATO"
 USA_foreign_europe_hohol_nato_desc: "We intend to provide active assistance to them through NATO in order to maintain their independence and democracy."
 USA_foreign_europe_hohol_attack: "Operation 'Ruin'"
 USA_foreign_europe_hohol_attack_desc: "It seems that we have no choice but to launch a military operation in Ukraine, God bless us and our armed forces"
 USA_foreign_europe_hohol_revoult: "Sponsor Cookies"
 USA_foreign_europe_hohol_revoult_desc: "We intend to carry out a risky political operation that could change the balance of power in Ukraine"
 USA_foreign_europe_russia: "Support for Democracy in Russia"
 USA_foreign_europe_russia_desc: "Although Russia has a chance to slide back into dictatorship, we intend to sponsor democratic forces in that country in order to try to free Russia from the shackles of dictators."
 USA_foreign_europe_russia_nato: "Invite Russia to join NATO"
 USA_foreign_europe_russia_nato_desc: "Perhaps it's time to change the concept of NATO as such, as Russia is no longer the USSR and is ready to become part of the Western world."
 USA_foreign_europe_russia_attack: "Operation 'Colossus of Clay'"
 USA_foreign_europe_russia_attack_desc: "A terrible decision for a better future, it's time to announce the start of a military operation against Russia"
 USA_foreign_europe_russia_separ: "Support for Separatist Movements"
 USA_foreign_europe_russia_separ_desc: "We intend to finance separatist movements throughout Russia, and the people of Russia will strive for freedom!"
 USA_foreign_europe_belarus: "Support for Democracy in Belarus"
 USA_foreign_europe_belarus_desc: "Belarus is a special country compared to its two neighbors, even though it does not have such vast territories, but it is still of interest to us as a springboard."
 USA_foreign_europe_belarus_nato: "Partnership with NATO"
 USA_foreign_europe_belarus_nato_desc: "We intend to develop a military partnership with Belarus within the framework of NATO to ensure the country's freedom from possible occupation by aggressive neighbors."
 USA_foreign_europe_belarus_revoult: "Sponsoring a Revolution"
 USA_foreign_europe_belarus_revoult_desc: "Belarus has been under the rule of dictators and occupiers for too long, and it's time to try to liberate it"
 USA_foreign_europe_belarus_attack: "Operation 'Forest Swamps'"
 USA_foreign_europe_belarus_attack_desc: "Nothing can save Belarus but a life-giving dose of democratic intervention"
 USA_foreign_europe_moldova: "Support for Democracy in Moldova"
 USA_foreign_europe_moldova_desc: "Moldova is a small country that has had a lot of problems since the collapse of the USSR. Russia has never allowed the country to unite, and it consistently supports the pseudo-state of Transnistria to prevent Moldova from becoming a major part of the European family."
 USA_foreign_europe_moldova_nato: "Partnership with NATO"
 USA_foreign_europe_moldova_nato_desc:  "Due to its small size, Moldova still needs strong protection, as the possible aggression of its neighbors could lead to the complete disappearance of this country."
 USA_foreign_europe_moldova_attack: "Operation 'Choking on Wine'"
 USA_foreign_europe_moldova_attack_desc: "The Moldovan government has left us no choice, and we are ready to carry out a military operation to eliminate Moldova as a dangerous state."
 USA_foreign_europe_moldova_revoult: "Shake Up Moldova"
 USA_foreign_europe_moldova_revoult_desc: "It seems that it's time to use our political tools in the case of Moldova, as peaceful solutions are no longer possible."
 USA_foreign_europe_pmr: "To Influence Transnistria"
 USA_foreign_europe_pmr_desc: "It seems that we shouldn't support Moldova, as it doesn't make sense for us. However, Transnistria represents a more profitable investment for us in the future."
 USA_foreign_europe_pmr_base: "Peacekeepers in Transnistria"
 USA_foreign_europe_pmr_base_desc: "We intend to send our Peacekeepers to Transnistria to protect this region from external enemies."
 USA_foreign_europe_pmr_state: "Recognize Transnistria"
 USA_foreign_europe_pmr_state_desc: "We are ready to recognize Transnistria as a state, no matter how much some world leaders might resist."
 USA_foreign_europe_pmr_attack_mlv: "Operation 'United Dniester'"
 USA_foreign_europe_pmr_attack_mlv_desc: "We are ready to launch a military operation together with the armed forces of Transnistria to unite Moldova within the framework of the Tiraspol government"
 USA_foreign_europe_nato_fin: "NATO Expansion: Finland"
 USA_foreign_europe_nato_fin_desc: "We intend to expand NATO again, and it's time to strengthen our northern borders"
 USA_foreign_europe_nato_sweden: "NATO Expansion: Sweden"
 USA_foreign_europe_nato_sweden_desc: "We intend to expand NATO again, and it's time to strengthen our northern borders"
 USA_foreign_asia: "Politics in Asia"
 USA_foreign_asia_desc: "Despite the end of the Cold War, there are still many problems and influential countries in Asia that we have to deal with"
 USA_foreign_asia_korea_peace: "Peace Initiative"
 USA_foreign_asia_korea_peace_desc: "We need to support peaceful unification to prevent another war and ensure that trade routes in the region remain unthreatened. And, of course, to contain China's growing influence"
 USA_foreign_asia_stop_propaganda: "Stop Audio Propaganda"
 USA_foreign_asia_stop_propaganda_desc: "Unification cannot be achieved if South Korea continues to destabilise relations with North Korea through loudspeakers"
 USA_foreign_asia_korea_exercises: "Joint Exercises with Korean Armies"
 USA_foreign_asia_korea_exercises_desc: "By conducting joint exercises, we will not only strengthen our presence in the region, but also gain more trust from the North Korean state"
 USA_foreign_asia_korea_stop_preasure: "Lift Sanctions from North Korea"
 USA_foreign_asia_korea_stop_preasure_desc: "By lifting sanctions, we will pave a direct path to normalising all our relations"
 USA_foreign_asia_unification_summit: "Summit of a Unified Korea"
 USA_foreign_asia_unification_summit_desc: "We will propose that both North and South Korea finally forget old grievances and reunite the divided Korea. The question of choosing the type of unification remains with them"
 USA_foreign_asia_invite_new_korea: "Integrate Unified Korea into Global Community"
 USA_foreign_asia_invite_new_korea_desc: "Now that Korea has regained its strength, we can integrate it into the international community, putting an end to the long-standing conflict in this region"
 USA_foreign_asia_korea_war: "Eradication of Communism in Korea"
 USA_foreign_asia_korea_war_desc: "We cannot allow a totalitarian state such as North Korea to threaten our presence in the region in any way. The United States will always stand on the side of democracy and will carry it to the rest of the world"
 USA_foreign_asia_korea_war_exercises: "Intensified Exercises with South Korea"
 USA_foreign_asia_korea_war_exercises_desc: "We cannot allow North Korea to once again seize most of South Korea's territory. While South Korea was unprepared for a surprise attack in 1950, things will be different now"
 USA_foreign_asia_korea_war_sanctions: "Increase Sanctions Pressure on North Korea"
 USA_foreign_asia_korea_war_sanctions_desc: "North Korea may have nuclear weapons, but we can still hurt them economically"
 USA_foreign_asia_korea_war_quad: "Invite Korea to QUAD"
 USA_foreign_asia_korea_war_quad_desc: "South Korea will not be left without allies, which is why it will be extremely beneficial for them to join our small club in Asia"
 USA_foreign_asia_korea_war_nuclear: "Atomic K-POP"
 USA_foreign_asia_korea_war_nuclear_desc: "At the moment, North Korea is very proud that it is the only country on the Korean peninsula that has nuclear weapons. Well, let's upset them"
 USA_foreign_asia_korea_second_war: "Second Korean War"
 USA_foreign_asia_korea_second_war_desc: "Time has come to bring democracy to the North Korean people and liberate them from their totalitarian government"
 USA_foreign_asia_indian_resources: "Pearl of Asia"
 USA_foreign_asia_indian_resources_desc: "We can negotiate with India on joint resource development in exchange for technology and weapons"
 USA_foreign_asia_indian_space_cooperation: "Space Cooperation with ISRO"
 USA_foreign_asia_indian_space_cooperation_desc: "Thanks to our cooperation with India in the field of space exploration, we will not only gain invaluable experience, but also force China to spend more money on its space programme"
 USA_foreign_asia_indian_modernization: "Cooperation with Indian Army"
 USA_foreign_asia_indian_modernization_desc: "By conducting military exercises with the Indian army, we will be able to gain a strong ally in the region, which could potentially help us counter the interests of other major powers"
 USA_foreign_asia_indian_new_mma: "South Asia's main NATO Ally"
 USA_foreign_asia_indian_new_mma_desc: "With such a strong ally as India, the balance of power in South Asia will shift in our favour for a long time to come."
 USA_foreign_asia_indian_quad: "Invite India to QUAD"
 USA_foreign_asia_indian_quad_desc: "Without India in this alliance, our plan to close the ring around China will not be fully realised"
 USA_foreign_asia_pakistan_humanitarian: "Humanitarian Mission to Pakistan"
 USA_foreign_asia_pakistan_humanitarian_desc: "Pakistan is in a dire situation due to its natural characteristics. It is necessary to help it recover by providing a long-term loan to make it completely dependent on us"
 USA_foreign_asia_pakistan_training: "Cooperation with Pakistan Army"
 USA_foreign_asia_pakistan_training_desc: "Pakistan is in many ways inferior to its neighbour India, and is also extremely vulnerable to a possible invasion by China. It is necessary to prepare their army for a prolonged confrontation and potential war"
 USA_foreign_asia_pakistan_mma: "Cold War Old Ally"
 USA_foreign_asia_pakistan_mma_desc: "Now that Pakistan is back with us, we can make it our main NATO ally in South Asia"
 USA_foreign_asia_smo_bangladesh: "Return East Pakistan"
 USA_foreign_asia_smo_bangladesh_desc: "After the devastating war of 1971, Pakistan lost control of Bangladesh. We will regain control of this region by conducting a joint military operation"
 USA_foreign_asia_bangladesh_quad: "Invite Bangladesh to QUAD"
 USA_foreign_asia_bangladesh_quad_desc: "It is more advantageous for us to maintain peaceful deterrence against India than to wage war with its potential intervention in it"
 USA_foreign_asia_new_kashmir_war: "New War for Kashmir"
 USA_foreign_asia_new_kashmir_war_desc: "The time has come to resolve this issue once and for all, and this time we will achieve our goal"
 USA_foreign_asia_japanese_nuclear: "Joint Nuclear Programme with Japan"
 USA_foreign_asia_japanese_nuclear_desc: "Although Japan adheres to peaceful use of nuclear energy, we will allow it to increase its production of nuclear material, for peaceful purposes, of course"
 USA_foreign_asia_japanese_economic_prosperity: "Economic Partnership with Japanese Market"
 USA_foreign_asia_japanese_economic_prosperity_desc: "Although Japanese companies are renowned for their products, which are in demand all over the world, they are also extremely vulnerable and can be described as dying businesses. We will take advantage of this to strengthen our own presence in their market."
 USA_foreign_asia_japanese_military_cooperation: "Our main ally in Asia"
 USA_foreign_asia_japanese_military_cooperation_desc: "Japan was our main ally during the Cold War and after its end. Its contribution to our policy of containing Russia and China is extremely difficult to underestimate"
 USA_foreign_asia_japanese_quad: "Invite Japan to QUAD"
 USA_foreign_asia_japanese_quad_desc: "Thanks to Japan's membership in this alliance, we will be able to more effectively deter our adversaries in the Pacific Ocean"
 USA_foreign_asia_create_quad: "Quadrilateral Security Dialogue"
 USA_foreign_asia_create_quad_desc: "The Quadrilateral Security Dialogue (QUAD) is a strategic dialogue between the United States and its Asian allies on security issues in the Indo-Pacific region"
 USA_foreign_asia_quad_indochina: "QUAD Expansion in Indochina"
 USA_foreign_asia_quad_indochina_desc: "Indochina is important not only as a resource or trade region, but also as a strategic region for the deployment of our troops."
 USA_foreign_asia_quad_oceania: "QUAD Expansion in Oceania"
 USA_foreign_asia_quad_oceania_desc: "Oceania has historically been an area of interest for European and North American powers, as well as a region closely watched by other growing superpowers. We must prevent their troops from appearing here in any form"
 USA_foreign_asia_quad_invite_china: "Do the Unthinkable"
 USA_foreign_asia_quad_invite_china_desc: "Despite our early preparations for war and the blockade of China, this necessity has now disappeared, as China has begun to respond to our interests"
 USA_foreign_asia_taiwan_corps: "Fair Competition with Taiwanese Companies"
 USA_foreign_asia_taiwan_corps_desc: "By competing with Taiwanese companies, we are increasing the interest of national manufacturers in improving their own technologies"
 USA_foreign_asia_taiwan_production_usa: "Microchips are heading to the US"
 USA_foreign_asia_taiwan_production_usa_desc: "The US cannot afford to let such an important industry as microchips fall into China's hands"
 USA_foreign_asia_taiwan_recognize: "Recognise Taiwan"
 USA_foreign_asia_taiwan_recognize_desc: "The main mistake of past White House administrations was recognising Communist China as the legitimate authority. We will rectify this misunderstanding by restoring true justice"
 USA_foreign_asia_taiwan_un: "Restore Taiwan's on the UN Security Council"
 USA_foreign_asia_taiwan_un_desc: "Taiwan was the real winner of World War II, and the revocation of its status as a member of the UN Security Council was an acknowledgement of communism's victory in the Asian region"
 USA_foreign_asia_taiwan_nuclear: "Transfer Nuclear Weapons to Taiwan"
 USA_foreign_asia_taiwan_nuclear_desc: "Only by transferring nuclear weapons to Taiwan will we finally be able to curb China's desire to reclaim this island"
 USA_foreign_asia_chinese_separatism: "Support separatists in China"
 USA_foreign_asia_chinese_separatism_desc: "China is a multi-ethnic country whose peoples, especially those in the western territories, want to gain independence from the central government. We will help them with this"
 USA_foreign_asia_one_china: "One-China Policy"
 USA_foreign_asia_one_china_desc: "We do not recognise Taiwan as a state, as our economic interests are mainly tied to trade with China rather than Taiwan"
 USA_foreign_asia_chinese_companies: "Negotiate with Chinese Companies"
 USA_foreign_asia_chinese_companies_desc: "China is a major global economy that can claim superpower status on a par with us. We must take this into account when formulating our policy towards their companies in order to achieve the most favourable terms for us"
 USA_foreign_asia_taiwan_smo: "Operation 'Rice'"
 USA_foreign_asia_taiwan_smo_desc: "We have long opposed China's return to Taiwan, but now there is no need for that, and we are ready to conduct the first ever joint US-China operation to demilitarise Taiwan and transfer it to the PRC"
 USA_foreign_asia_two_chairs: "Story of Two Chairs"
 USA_foreign_asia_two_chairs_desc: "Although we do not recognise Taiwan as a state, we can still conduct joint exercises and pursue joint economic policies with it. At the same time, we will continue to trade with the PRC"
 USA_foreign_asia_korea_humanitarian: "Humanitarian mission to North Korea"
 USA_foreign_asia_korea_humanitarian_desc: "The North Korean people and their economy have suffered greatly not only from the policies of the North Korean state, but also from our sanctions and natural disasters. We will help them recover"
 USA_foreign_asia_central_sponsor_democracies: "Sponsor Democracy in Central Asia"
 USA_foreign_asia_central_sponsor_democracies_desc: "Thanks to our support for the Central Asian republics and the democratic movements within them, we will be able to deal a significant blow to the influence of the major powers"
 USA_foreign_asia_kazbrig: "KAZBRIG"
 USA_foreign_asia_kazbrig_desc: "Although formally KAZBRIG was created to conduct peacekeeping missions under the UN flag, US officials did not hide the possibility of the unit participating in NATO operations in Asia"
 USA_foreign_crusade_north: "Northern Crusade"
 USA_foreign_crusade_north_desc: "Thanks to the unique location of Central Asian countries in relation to Russia, we can finally strike it from the south, passing through less developed regions and encircling them"
 USA_foreign_central_asian_mma: "Central Asian Non-NATO Ally"
 USA_foreign_central_asian_mma_desc: "We make no secret of the fact that having NATO forces right under Russia's nose will enable us to significantly stretch its forces and weaken it."
 USA_foreign_asia_war_on_terror_afghan: "Silk Road"
 USA_foreign_asia_war_on_terror_afghan_desc: "Afghanistan has earned the status of a graveyard of empires, as no superpower has yet been able to completely conquer it. We will rectify this"
 USA_foreign_asia_help_north: "Assist Northern Afghan Government"
 USA_foreign_asia_help_north_desc: "The Taliban's hold on power in Afghanistan threatens our interests in Central Asia and the Persian-South Asian region. We must eliminate this terrorist organisation"
 USA_foreign_asia_invade_with_regional_superpower: "Is a Special Invitation Necessary?"
 USA_foreign_asia_invade_with_regional_superpower_desc: "Although our goal is to overthrow the Taliban, we cannot risk the lives of our soldiers. We will invite other powers to join us in this endeavour"
 USA_foreign_asia_afghan_regional_cooperation: "Cooperation with the New Afghanistan"
 USA_foreign_asia_afghan_regional_cooperation_desc: "By strengthening our ties with Afghanistan, we will be able to project our power onto all other countries in the region"
 USA_foreign_europe_serb_democracy: "Support Democracy in Serbia"
 USA_foreign_europe_serb_democracy_desc: "The Serbian people must be liberated from their undemocratic government"
 USA_foreign_europe_anti_serb: "Local Anti-Serbian Alliance"
 USA_foreign_europe_anti_serb_desc: "Serbia has extremely revanchist sentiments that threaten the security of our allies in the Balkans. We will create a local alliance that will oppose Serbian expansion"
 USA_foreign_europe_thank_you_usa: "Thank you USA"
 USA_foreign_europe_thank_you_usa_desc: "Kosovo gained its independence at the cost of great sacrifice and destruction. We will not allow Serbia to regain control over Kosovo"
 USA_foreign_europe_take_zhepa: "Operation 'Capture of Rashka'"
 USA_foreign_europe_take_zhepa_desc: "We will deliver the final blow to Serbian revanchism by liberating their people from their anti-democratic government"
 USA_foreign_europe_serb_humanitarian: "Humanitarian Mission to Serbia"
 USA_foreign_europe_serb_humanitarian_desc: "Serbia suffered greatly from the Yugoslav wars and NATO bombings, which we consider to have been a mistake. We will make amends for our mistake by providing Serbia with aid for their reconstruction"
 USA_foreign_europe_retake_great_serbia: "Reunite All Serbs"
 USA_foreign_europe_retake_great_serbia_desc: "We will assist Serbia in regaining its ancestral territories, thereby consolidating our influence in the Balkans and gaining a strong ally"
 USA_foreign_europe_serbia_nato: "Invite Serbia to NATO"
 USA_foreign_europe_serbia_nato_desc: "Now that Serbia has become our valued partner, we can invite it to join our Club"
 USA_foreign_africa: "Politics in Africa"
 USA_foreign_africa_desc: "Despite Africans gaining independence from European powers, this region has been in a state of war throughout the 20th and 21st centuries due to the influence of major powers. We are no exception in this regard, as we also have many allies here whom we must defend and many partners with whom we must cooperate in order to achieve true democracy in Africa"
 USA_foreign_africa_egypt_military: "Cooperation with the Egyptian Army"
 USA_foreign_africa_egypt_military_desc: "Egypt has a large army and is our strategic partner in Africa. We must take advantage of this opportunity"
 USA_foreign_africa_egypt_gaza_question: "Resolve Gaza issue"
 USA_foreign_africa_egypt_gaza_question_desc: "Gaza is currently controlled by the terrorist group Hamas, which poses a direct threat to both Egypt and Israel. We must convene a summit of our allies to resolve this issue once and for all"
 USA_foreign_africa_egypt_nuclear_plus_subsidies: "Western subsidies to Egypt"
 USA_foreign_africa_egypt_nuclear_plus_subsidies_desc: "We can sponsor Egypt's nuclear programme and also support other sectors of its economy"
 USA_foreign_africa_egypt_nato: "Secure Suez"
 USA_foreign_africa_egypt_nato_desc: "Egypt has been our close military partner for a long time, and inviting it to join NATO seems like a sensible step towards ensuring security in the region"
 USA_foreign_africa_take_suez: "Repeat 1956"
 USA_foreign_africa_take_suez_desc: "Last time we supported Egypt in the war over the Suez Canal, but now it seems that this was a mistake, as Egypt has become a direct threat to international trade"
 USA_foreign_africa_angola_military_cooperation: "Cooperation with the Angolan Army"
 USA_foreign_africa_angola_military_cooperation_desc: "Angola is in a favourable geographical position, which makes it a valuable ally on the African continent"
 USA_foreign_africa_angola_resource_contract: "Resource Contract with Angola"
 USA_foreign_africa_angola_resource_contract_desc: "Angola has large reserves of oil and minerals, making it a valuable trading partner"
 USA_foreign_africa_angola_us_brigade: "Johnny is going to Africa"
 USA_foreign_africa_angola_us_brigade_desc: "In exchange for our support, we will ask Angola to make some concessions and possibly help our other African allies"
 USA_foreign_africa_angola_intervene_unita: "Operation 'Storm in a Glass'"
 USA_foreign_africa_angola_intervene_unita_desc: "Our goal is to protect the Angolan regime, which is friendly to us, from the separatists of UNITA"
 USA_foreign_africa_unita_military_cooperation: "Cooperation with the UNITA Army"
 USA_foreign_africa_unita_military_cooperation_desc: "UNITA is our historical ally who fought against the pro-Soviet regime in Angola. We must develop these ties by combining the forces of our troops"
 USA_foreign_africa_unita_call_allies: "Loyalty of Our African Allies"
 USA_foreign_africa_unita_call_allies_desc: "We will request assistance to UNITA from our South African allies"
 USA_foreign_africa_unita_desert_oper: "Operation Drought"
 USA_foreign_africa_unita_desert_oper_desc: "If our army does not intervene in the civil war in Angola, we may permanently lose a valuable ally there in the form of UNITA"
 USA_foreign_africa_winrar_eco: "Key Port in Southern Africa"
 USA_foreign_africa_winrar_eco_desc: "South Africa is a key country near whose shores global trade constantly passes. Economic cooperation with South Africa appears to be extremely beneficial for us"
 USA_foreign_africa_winrar_military: "Cooperation with the South African Army"
 USA_foreign_africa_winrar_military_desc: "The protection of our economic interests in southern Africa depends largely on the South African army's ability to defend its country in the event of a possible attack by other countries"
 USA_foreign_africa_winrar_mma: "South Africa as a Major Non-NATO ally"
 USA_foreign_africa_winrar_mma_desc: "Any superpower that decides to impose its order in the region should know that we will stand firm in defence of our interests in South Africa"
 USA_foreign_africa_winrar_destroy_commies: "Crusade against Socialist Mozambique"
 USA_foreign_africa_winrar_destroy_commies_desc: "The presence of socialist Mozambique on the borders of South Africa poses a threat to our interests in the region. We must overthrow the anti-democratic regime and bring democracy to the Mozambican people"
 USA_foreign_africa_congo_war: "Assistance to the Congolese Government"
 USA_foreign_africa_congo_war_desc: "The DR Congo is in an extremely precarious situation. We will send them additional aid"
 USA_foreign_africa_congo_resources: "Richest Country in Africa"
 USA_foreign_africa_congo_resources_desc: "Congo has a wide range of resources that would be very useful to us"
 USA_foreign_africa_congo_peace_summit: "Peace Summit on Ceasefire"
 USA_foreign_africa_congo_peace_summit_desc: "Peace must be achieved in the Congolese war to end the bloodshed once and for all"
 USA_foreign_africa_lybian_democracy: "Support for Democracy in Libya"
 USA_foreign_africa_lybian_democracy_desc: "The Libyan government must be replaced by a more democratic one, and we will provide all the means to achieve this"
 USA_foreign_africa_lybian_separatism: "Support Separatism in Libya"
 USA_foreign_africa_lybian_separatism_desc: "Libya is a patchwork quilt that is about to fall apart. We will provide assistance to the peoples of Libya so that they can achieve true freedom"
 USA_foreign_africa_lybian_sanctions: "Strengthen Sanctions against Libya"
 USA_foreign_africa_lybian_sanctions_desc: "By increasing sanctions pressure on Libya, we will cause irreparable damage to its economy"
 USA_foreign_africa_lybian_unified_defender: "Operation 'Unified Protector'"
 USA_foreign_africa_lybian_unified_defender_desc: "Operation Unified Protector was a NATO operation enforcing United Nations Security Council resolutions 1970 and 1973 concerning the Libyan Civil War"
 USA_foreign_africa_lybian_humanitarian: "Humanitarian aid for Libya"
 USA_foreign_africa_lybian_humanitarian_desc: "Libya is not only a poor country, but it has also suffered from a bloody civil war and the actions of Jamahiriya. We will send them aid to help rebuild the country"
 USA_foreign_africa_lybian_democratic_bastion: "Bastion of Democracy in North Africa"
 USA_foreign_africa_lybian_democratic_bastion_desc: "Libya has become not only an example of the triumph of democracy, but also one of NATO's key partners in North Africa. By stationing troops there, we will secure the central Mediterranean"
 USA_foreign_africa_lybian_subsidies: "Subsidies for Libya"
 USA_foreign_africa_lybian_subsidies_desc: "We will allocate a substantial amount of money for the development of the Libyan state"
 USA_foreign_africa_lybian_nato: "Invite Libya to NATO"
 USA_foreign_africa_lybian_nato_desc: "If Libya agrees to this, no one will be able to threaten us in the Mediterranean and North Africa anymore"
 USA_foreign_africa_somaly_military_cooperation: "Cooperation with the Somali Army"
 USA_foreign_africa_somaly_military_cooperation_desc: "Somalia is in an extremely advantageous strategic location, which allows us to control sea routes in the Indian Ocean and the Red Sea"
 USA_foreign_africa_somaly_us_brigade: "Ranger Squad"
 USA_foreign_africa_somaly_us_brigade_desc: "We will provide Somalia with three volunteer brigades formed according to NATO standards"
 USA_foreign_africa_somaly_anti_islamist: "Joint Fight Against Islamism"
 USA_foreign_africa_somaly_anti_islamist_desc: "Islamist groups are active in Somalia, posing a direct threat to our influence and global trade"
 USA_foreign_africa_somaly_mma: "Major non-NATO ally in African Horn"
 USA_foreign_africa_somaly_mma_desc: "By gaining Somalia as our main ally outside NATO, we will consolidate our position in the Horn of Africa"
 USA_foreign_africa_ethiopia_war: "Historical lands of Somalia"
 USA_foreign_africa_ethiopia_war_desc: "Ethiopia is holding territories that should rightfully belong to Somalia. We will help them regain control over them"
 USA_foreign_africa_support_eth: "Support Ethiopia in the Civil War"
 USA_foreign_africa_support_eth_desc: "We will not allow territories to break away from Ethiopia. Separatism in the region threatens the stability of our other allies"
 USA_foreign_africa_eth_somaly: "Operation 'Jubba'"
 USA_foreign_africa_eth_somaly_desc: "With the support of the Ethiopian Army, we will put an end to the anarchy in the Horn of Africa and establish a government there that is favourable to us"
 USA_foreign_africa_eth_cooperation: "Cooperation with the Ethiopian Army"
 USA_foreign_africa_eth_cooperation_desc: "By cooperating with the Ethiopian army, it will directly project its influence on its neighbours"
 USA_foreign_africa_eth_mma: "Ethiopia as Major Non-NATO ally"
 USA_foreign_africa_eth_mma_desc: "Ethiopia is a valuable ally in the Horn of Africa, and we will use this to our advantage"
 USA_foreign_africa_invade_eth: "Support Eritrea in the Civil War"
 USA_foreign_africa_invade_eth_desc: "Eritrea is in an extremely advantageous geographical location, which makes it a priority for us to protect its independence from Ethiopia"
 USA_foreign_africa_uretrian_democracy: "Support for Eritrean Democracy"
 USA_foreign_africa_uretrian_democracy_desc: "We will allocate funds to support democracy in Eritrea"
 USA_foreign_africa_assist_eritrea: "Additional support for Eritrea"
 USA_foreign_africa_assist_eritrea_desc: "We will send additional supplies to Eritrea"
 USA_foreign_africa_eritrean_mma: "Major NATO ally in the Red Sea"
 USA_foreign_africa_eritrean_mma_desc: "We are prepared to defend Eritrea from other powers by adding them to our list of key allies"
 USA_foreign_africa_nigerian_oil: "Nigerian Oil"
 USA_foreign_africa_nigerian_oil_desc: "Nigeria is our key partner in the energy sector in West Africa. We must derive maximum benefit from this"
 USA_foreign_africa_nigerian_anti_islamist: "Joint Anti-Islamist Campaign"
 USA_foreign_africa_nigerian_anti_islamist_desc: "Islamist groups are extremely active in Nigeria. We will provide Nigeria with assistance in suppressing them"
 USA_foreign_africa_nigerian_military: "Cooperation with Nigerian Army"
 USA_foreign_africa_nigerian_military_desc: "Training Nigerian soldiers increases our chances that their government will stand firm in the face of threats and that we will continue our cooperation"
 USA_foreign_africa_nigerian_mma: "Make Nigeria Non-NATO Major Ally"
 USA_foreign_africa_nigerian_mma_desc: "With the support of Western countries, the Nigerian government will be safe"
 USA_foreign_africa_angola_coca_cola: "A Piece of America in Angola"
 USA_foreign_africa_angola_coca_cola_desc: "We will build the best Coca-Cola production plant in southern Africa in Angola"
 USA_foreign_africa_nigerian_coca_cola: "Abuja Plant"
 USA_foreign_africa_nigerian_coca_cola_desc: "We will build the best Coca-Cola production plant in western Africa in Nigeria"
 ##########Events##########
 usa_foreign.1.t: "Military Support from the USA-NATO"
 usa_foreign.1.d: "The United States, as part of the entire NATO Alliance, is ready to offer us its military assistance, clearly hoping for future cooperation. Of course, we will be happy to equip our armed forces with modern technology, but we need to understand what we are getting involved in."
 usa_foreign.1.a: "Yes"
 usa_foreign.1.b: "No"
 usa_foreign.2.t: "[FROM.GetNameWithFlag] Has Agreed to Our Military Assistance"
 usa_foreign.2.d: "Their government has agreed to accept our military assistance, which means we are ready to increase our influence in this country."
 usa_foreign.2.a: "Nice"
 usa_foreign.3.t: "The United States Offers to Help [FROM.GetNameWithFlag]"
 usa_foreign.3.d: "The United States, as part of the NATO Alliance, has begun to provide assistance to this country. Are we ready to join this initiative?"
 usa_foreign.3.a: "Yes"
 usa_foreign.3.b: "No"
 usa_foreign.4.t: "Sending Military Aid"
 usa_foreign.4.d: "The cargo of military equipment has been formed, and we are ready to send it to help our potential ally!"
 usa_foreign.4.a: "Nice"
 usa_foreign.5.t: "Military Aid From USA"
 usa_foreign.5.d: "US Military Transport Planes have already arrived in our country and brought military supplies, and we are ready to replenish our armed forces"
 usa_foreign.5.a: "Nice"
 usa_foreign.6.t: "Military Aid From [FROM.GetNameWithFlag]"
 usa_foreign.6.d: "NATO's armed forces are also providing us with support, and another shipment of military aid has arrived."
 usa_foreign.6.a: "Nice"
 usa_foreign.7.t: "[FROM.GetNameWithFlag] Has Refused Our Military Assistance"
 usa_foreign.7.d: "Their government refused to supply our weapons, considering it a dangerous idea."
 usa_foreign.7.a: "Sad"
 usa_foreign.8.t: "The United States Recognizes Us As a State"
 usa_foreign.8.d: "The United States officially declared its recognition of us as an independent state, which came as a surprise."
 usa_foreign.8.a: "Wow"
 usa_foreign.9.t: "The United States Proposes to Attack Moldova"
 usa_foreign.9.d: "Through secret diplomatic and military channels, we have received a message from the United States about their plans to conduct a military operation on Moldovan territory, but only with our consent. Are we willing to take such a risky step?"
 usa_foreign.9.a: "Yes"
 usa_foreign.9.b: "No"
 usa_foreign.10.t: "Transnistria Refused"
 usa_foreign.10.d: "The Transnistrian government has rejected our proposal, and it seems that they really do not want to resolve this conflict militarily."
 usa_foreign.10.a: "Sad"
 usa_foreign.11.t: "USA Offers to Deploy Peacekeepers"
 usa_foreign.11.d: "The US government seems to have chosen a side in this conflict, and it is ready to support us by announcing its readiness to deploy peacekeeping forces in our region"
 usa_foreign.11.a: "We Need Them"
 usa_foreign.11.b: "No"
 usa_foreign.12.t: "Transnistria Rejected the Peacekeepers"
 usa_foreign.12.d: "It seems that the Transnistrian government does not see the point in deploying our volunteer forces in the region, which is a pity."
 usa_foreign.12.a: "Sad"
 usa_foreign.13.t: "The revolution in Belarus failed"
 usa_foreign.13.d: "We couldn't stage a revolution in Belarus, but we were able to create a surge in the popularity of democratic parties, which could help us in the future."
 usa_foreign.13.a: "Sad"
 usa_foreign.14.t: "The United States Invites Us To Join NATO"
 usa_foreign.14.d: "The US government has expressed a desire to invite us to join NATO, as the Cold War is over and there is no point in two great powers fighting each other. The enemy is now of a different type, and we must defeat it together."
 usa_foreign.14.a: "Yes"
 usa_foreign.14.b: "No"
 usa_foreign.15.t: "Russia Refused to Join NATO"
 usa_foreign.15.d: "The Russian government has refused to join NATO, and it seems that our initiative to unite all of Eurasia in NATO has failed."
 usa_foreign.15.a: "Sad"
 usa_foreign.16.t: "The United States Invites Us to Join NATO"
 usa_foreign.16.d: "As part of NATO's expansion, the US government has invited us to become part of their Alliance, which will undoubtedly strengthen our military power and protect us from potential enemies from outside."
 usa_foreign.16.a: "Yes"
 usa_foreign.16.b: "No"
 usa_foreign.17.t: "[FROM.GetNameWithFlag] Refused to Join NATO"
 usa_foreign.17.d: "It seems that their government doesn't think they need to be a member of NATO."
 usa_foreign.17.a: "Sad"
 usa_foreign.18.t: "Multinational Corps Northeast"
 usa_foreign.18.d: "A new NATO combat unit, the Multinational Corps Northeast, has been finalized and expanded. Its main objective is to enhance the coordination of NATO's Northern Flank countries"
 usa_foreign.18.a: "Nice"
 usa_foreign.19.t: "Multinational Corps Southeast"
 usa_foreign.19.d: "A new NATO combat unit, the Multinational Corps Southeast, has been finalized and expanded. Its main objective is to enhance the coordination of NATO's Northern Flank countries"
 usa_foreign.19.a: "Nice"
 usa_foreign.20.t: "Mobilization of Peacekeepers in Transnistria"
 usa_foreign.20.d: "Our peacekeepers in Transnistria were put on alert and ready to launch a combat operation to support the Transnistrian army"
 usa_foreign.20.a: "Good"
 usa_foreign.21.t: "USA is Offering us to Become its Main Non-NATO Ally"
 usa_foreign.21.d: "The US government intends to strengthen its influence in the region and offers us to become a major non-NATO ally. We will receive the protection of the NATO Alliance, which will undoubtedly affect our security."
 usa_foreign.21.a: "Yes"
 usa_foreign.21.b: "No"
 usa_foreign.22.t: "[FROM.GetNameWithFlag] Refused to Become a Major Non-NATO Ally"
 usa_foreign.22.d: "It seems that their government doesn't want any partnership with NATO."
 usa_foreign.22.a: "Sad"
 usa_foreign.24.t: "[USA.GetNameWithFlag] Proposes Military Cooperation"
 usa_foreign.24.d: "[USA.GetNameWithFlag] sees us as its key military partner and is proposing to sign a series of agreements on the deployment of its troops in exchange for providing us with security and additional military assistance"
 usa_foreign.24.a: "Sure"
 usa_foreign.24.b: "No"
 usa_foreign.25.t: "[FROM.GetNameWithFlag] Rejected Our Proposal"
 usa_foreign.25.d: "[FROM.GetNameWithFlag] declined our assistance, asserting that they are capable of managing on their own"
 usa_foreign.25.a: "Meh"
 usa_foreign.26.t: "[USA.GetNameWithFlag] is Proposing to Deploy Nuclear Weapons in Our Country"
 usa_foreign.26.d: "Our region is in a state of extreme uncertainty, on the brink of war and peace. [USA.GetNameWithFlag] is proposing that we install their nuclear weapons in our country to increase our chances in a potential war."
 usa_foreign.26.a: "Sure"
 usa_foreign.26.b: "No"
 usa_foreign.27.t: "[USA.GetNameWithFlag] is Offering Us Support in Uniting the Peninsula"
 usa_foreign.27.d: "[USA.GetNameWithFlag] assures us that, unlike the war in the mid-20th century, this time our army and the [USA.GetNameWithFlag] army will be able to defeat the large forces of the [NKO.GetNameWithFlag] and unify the peninsula"
 usa_foreign.27.a: "The Time has come"
 usa_foreign.27.b: "We're not ready"
 usa_foreign.28.t: "[FROM.GetNameWithFlag] Accepts Our Proposal"
 usa_foreign.28.d: "[FROM.GetNameWithFlag] has agreed to station our troops on its territory, thereby expanding our influence. All that remains is to fulfil our part of the agreement that we promised them"
 usa_foreign.28.a: "Good"
 usa_foreign.29.t: "[FROM.GetNameWithFlag] Agrees to Deploy Our Nuclear Weapons"
 usa_foreign.29.d: "During a recent meeting, we managed to convince the [FROM.GetNameWithFlag] government of the need to deploy our nuclear weapons in their country. This will strengthen our position in the region in the event of a potential war."
 usa_foreign.29.a: "Good"
 usa_foreign.30.t: "[KOR.GetNameWithFlag] has declared its readiness to conduct a joint operation"
 usa_foreign.30.d: "[KOR.GetNameWithFlag] government has stated that their army and country are ready for war with [NKO.GetNameWithFlag] and promptly informed us of this"
 usa_foreign.30.a: "It's time to put an end to the red plague in [NKO.GetNameWithFlag]"
 usa_foreign.31.t: "[KOR.GetNameWithFlag] refused to carry out a joint operation"
 usa_foreign.31.d: "[KOR.GetNameWithFlag] government conducted a survey among the population, in which the majority expressed negative views about a potential war with [NKO.GetNameWithFlag]. In addition, [KOR.GetNameWithFlag] stated that its economy and army are not sufficiently prepared to launch a full-scale invasion of the north"
 usa_foreign.31.a: "Meh"
 usa_foreign.32.t: "[USA.GetNameWithFlag] invites us to QUAD"
 usa_foreign.32.d: "[USA.GetNameWithFlag] invites us to join its defence alliance in the Asian region. This alliance will safeguard the security of all its members and prevent the expansion of influence by major enemy countries in Asia"
 usa_foreign.32.a: "We're in business"
 usa_foreign.32.b: "We are not interested in this"
 usa_foreign.33.t: "[FROM.GetNameWithFlag] has agreed to join the QUAD"
 usa_foreign.33.d: "[FROM.GetNameWithFlag] agrees to assist us in ensuring multilateral security in the region"
 usa_foreign.33.a: "Good"
 usa_foreign.34.t: "[FROM.GetNameWithFlag] declined to join QUAD"
 usa_foreign.34.d: "Their government is not interested in cooperating with us to ensure peace in Asia"
 usa_foreign.34.a: "Meh"
 usa_foreign.35.t: "[USA.GetNameWithFlag] Is Asking Us to Disable the Loudspeakers"
 usa_foreign.35.d: "[USA.GetNameWithFlag] has assured us that this measure is no longer necessary, as the political vector in the region has finally begun to move towards our future reunification with [NKO.GetNameWithFlag]"
 usa_foreign.35.a: "We agree"
 usa_foreign.35.b: "No"
 usa_foreign.36.t: "[KOR.GetNameWithFlag] Agreed to Turn Off Loudspeakers"
 usa_foreign.36.d: "[KOR.GetNameWithFlag] has expressed satisfaction with our foreign policy and hopes for a swift resolution to the long-standing conflict with North Korea"
 usa_foreign.36.a: "Good"
 usa_foreign.37.t: "[USA.GetNameWithFlag] Offers Us Humanitarian Aid"
 usa_foreign.37.d: "[USA.GetNameWithFlag] has offered us support that we can use to restore and improve our economy"
 usa_foreign.37.a: "Deal"
 usa_foreign.37.b: "No"
 usa_foreign.38.t: "[KOR.GetNameWithFlag] Rejected the Humanitarian Mission"
 usa_foreign.38.d: "[KOR.GetNameWithFlag] is not interested in our support and has sent us a note of refusal"
 usa_foreign.38.a: "Meh"
 usa_foreign.39.t: "[USA.GetNameWithFlag] is proposing negotiations on Korea Reunification"
 usa_foreign.39.d: "Our recent rapprochement with [KOR.GetNameWithFlag] and [USA.GetNameWithFlag] suggests that the long conflict that has lasted since the end of the Second World War will soon be resolved. The time has come to hold a summit, and the outcome will largely depend on our preparations for it"
 usa_foreign.39.a: "It's time to start negotiations"
 usa_foreign.39.b: "Our views differ"
 usa_foreign.40.t: "[NKO.GetNameWithFlag] Has Refused to Attend the Peace Summit"
 usa_foreign.40.d: "Despite our lengthy preparations, it seems that [NKO.GetNameWithFlag] has been leading us on all this time and has no intention of reuniting with [KOR.GetNameWithFlag]"
 usa_foreign.40.a: "Who said that cooperating with communists is reasonable?"
 usa_foreign.41.t: "[USA.GetNameWithFlag] is inviting us to join the international community"
 usa_foreign.41.d: "[USA.GetNameWithFlag] believes that after reunification, we have become their full-fledged partner, and we are ready for integration into the global Western community"
 usa_foreign.41.a: "Deal"
 usa_foreign.41.b: "No"
 usa_foreign.42.t: "[NKO.GetNameWithFlag] rejected our proposal"
 usa_foreign.42.d: "[NKO.GetNameWithFlag] believes that our partnership is only appropriate outside Western blocs"
 usa_foreign.42.a: "Meh"
 usa_foreign.43.t: "[KOR.GetNameWithFlag] Refused to Shut Down Loudspeakers"
 usa_foreign.43.d: "[KOR.GetNameWithFlag] government has become a fierce opponent of our idea to turn off propaganda in peacetime. This will complicate our attempts to reunify Korea"
 usa_foreign.43.a: "Bad"
 usa_foreign.44.t: "[KOR.GetNameWithFlag] Halts Propaganda at Our Border"
 usa_foreign.44.d: "Thanks to pressure from [USA.GetNameWithFlag] and our successful foreign policy, the capitalist government of [KOR.GetNameWithFlag] has refused to use its loudspeakers on our border"
 usa_foreign.44.a: "A Great Victory for Our Country"
 usa_foreign.45.t: "[FROM.GetNameWithFlag] Accepts Our Humanitarian Aid"
 usa_foreign.45.d: "They need support, and we need influence — that is what made this deal so successful"
 usa_foreign.45.a: "Good"
 usa_foreign.46.t: "[NKO.GetNameWithFlag] agrees on integration"
 usa_foreign.46.d: "We have managed to agree on the integration of the new unified [NKO.GetNameWithFlag] into the circle of Western powers. This will enable us to achieve universal understanding and peace in the region"
 usa_foreign.46.a: "Perfect"
 usa_foreign.47.t: "[USA.GetNameWithFlag] is lifting sanctions against us"
 usa_foreign.47.d: "[USA.GetNameWithFlag] believes that this will reduce tensions in the region and make us more inclined to cooperate with them."
 usa_foreign.47.a: "And they will be right"
 usa_foreign.48.t: "[FROM.GetNameWithFlag] Offers Us Nuclear Investments"
 usa_foreign.48.d: "The US government is offering investments in our nuclear infrastructure, considering us an important economic partner in the region and seeing potential in our development."
 usa_foreign.48.a: "We Agree"
 usa_foreign.48.b: "No"
 usa_foreign.49.t: "[FROM.GetNameWithFlag] Agrees to Nuclear Deal"
 usa_foreign.49.d: "The Egyptian government has approved a nuclear deal, and they seem to understand the true value of the atom."
 usa_foreign.49.a: "Nice"
 usa_foreign.50.t: "[FROM.GetNameWithFlag] Rejected to Nuclear Deal"
 usa_foreign.50.d: "It seems that the Egyptian government is not particularly interested in developing nuclear technology on its territory."
 usa_foreign.50.a: "Sad"
 usa_foreign.51.t: "[FROM.GetNameWithFlag] Proposes to Annex the Gaza Strip"
 usa_foreign.51.d: "The US government is proposing that we annex the Gaza Strip in our favor, promising full diplomatic support. It seems that the US believes that this region will be more stable under our control"
 usa_foreign.51.a: "We Agree"
 usa_foreign.51.b: "No"
 usa_foreign.52.t: "USA is Offering Us to Become Egypt's Satellite"
 usa_foreign.52.d: "An insane proposal has come from the Egyptian government, which is of course coming from the United States. It seems that their government has decided to take control of our fate without asking us. They are offering us the opportunity to become part of Egypt as a controlled territory, with the promise of economic assistance if we accept the proposal."
 usa_foreign.52.a: "We Agree"
 usa_foreign.52.b: "No"
 usa_foreign.53.t: "[FROM.GetNameWithFlag] Agreed to The Protectorate Proposal"
 usa_foreign.53.d: "Our proposal was received quite positively by the Gaza government, and they agreed to accept our proposal to change the balance of power in the region."
 usa_foreign.53.a: "Nice"
 usa_foreign.54.t: "[FROM.GetNameWithFlag] Agreed to The Protectorate Proposal"
 usa_foreign.54.d: "The Gaza government has agreed to become our protector, which is undoubtedly encouraging, as our country is becoming an increasingly important player in the region."
 usa_foreign.54.a: "Nice"
 usa_foreign.55.t: "[FROM.GetNameWithFlag] Abandoned Our Plan."
 usa_foreign.55.d: "It seems that their government considered our proposal absurd and pointless, but we can always offer an option in our own style."
 usa_foreign.55.a: "Can We Bomb Them?"
 usa_foreign.55.b: "Let's Give Up This Idea"
 usa_foreign.56.t: "[FROM.GetNameWithFlag] Abandoned Our Plan."
 usa_foreign.56.d: "It seems that the Egyptian government does not want to become part of an international scandal and does not want to change its territorial borders."
 usa_foreign.56.a: "Sad"
 usa_foreign.57.t: "[USA.GetName] is Proposing a Military Invasion of [HAM.GetName]"
 usa_foreign.57.d: "Seeing that diplomacy had failed, the Americans decided to offer us a full-scale military invasion of [HAM.GetName]"
 usa_foreign.57.a: "To War, Jingo!"
 usa_foreign.57.a: "No"
 usa_foreign.58.t: "[USA.GetName] is Proposing a Military Invasion of [MOZ.GetName]"
 usa_foreign.58.d: "The American government supports our concerns in the fight against Mozambique, seeing that their government is dangerous for the region and is ready to provide full support in resolving this issue through military means."
 usa_foreign.58.a: "To War, Jingo!"
 usa_foreign.58.a: "No"
 usa_foreign.59.t: "[FROM.GetName] Refused to Invade"
 usa_foreign.59.d: "It seems that the South American government is afraid of war, but history doesn't like cowards."
 usa_foreign.59.a: "Sad"
 usa_foreign.60.t: "[USA.GetName] is Proposing a Military Invasion of [SOM.GetName]"
 usa_foreign.60.d: "The American government sees [SOM.GetName] as a threat to the region and is ready to support us in the war against that country."
 usa_foreign.60.a: "To War, Jingo!"
 usa_foreign.60.a: "No"
 usa_foreign.61.t: "[FROM.GetName] Refused to Invade"
 usa_foreign.61.d: "It seems that [ETH.GetName] has abandoned our plan for a military invasion of [SOM.GetName]. History does not like cowards"
 usa_foreign.61.a: "Sad"
 usa_foreign.62.t: "[USA.GetName] is Proposing a Military Invasion of [ERI.GetName]"
 usa_foreign.62.d: "The American government sees [ERI.GetName] as a threat to the region and is ready to support us in the war against that country."
 usa_foreign.62.a: "To War, Jingo!"
 usa_foreign.62.a: "No"
 usa_foreign.63.t: "[FROM.GetName] Refused to Invade"
 usa_foreign.63.d: "It seems that [ETH.GetName] has abandoned our plan for a military invasion of [ERI.GetName]. History does not like cowards"
 usa_foreign.63.a: "Sad"
 usa_foreign.64.t: "[USA.GetName] is Proposing a Military Invasion of [ETH.GetName]"
 usa_foreign.64.d: "The American government sees [ETH.GetName] as a threat to the region and is ready to support us in the war against that country."
 usa_foreign.64.a: "To War, Jingo!"
 usa_foreign.64.a: "No"
 usa_foreign.65.t: "[FROM.GetName] Refused to Invade"
 usa_foreign.65.d: "It seems that [SOM.GetName] has abandoned our plan for a military invasion of [ETH.GetName]. History does not like cowards"
 usa_foreign.65.a: "Sad"
 usa_foreign.66.t: "[FROM.GetName] is Proposing to Build a Coca-Cola Factory"
 usa_foreign.66.d: "Coca-Cola is ready to open a branch in our country, with the assistance of the American government. This may indicate that we are a good business partner for the United States."
 usa_foreign.66.a: "We Will Open"
 usa_foreign.66.b: "No"
 usa_foreign.67.t: "[FROM.GetName] Abandoned the Coca-Cola Factory"
 usa_foreign.67.d: "It seems that they are not interested in opening our enterprises in their country, so we will find more amenable partners."
 usa_foreign.67.a: "Sad"
 usa_foreign.68.t: "[FROM.GetName] Agreed to Open a Coca-Cola Factory"
 usa_foreign.68.d: "It seems that their government understands the value of cooperating with us, and we are glad that they have agreed to accept Coca-Cola production in their country."
 usa_foreign.68.a: "Nice"
 usa_foreign.69.t: "[USA.GetNameWithFlag] Proposes a Resource Deal"
 usa_foreign.69.d: "[USA.GetNameWithFlag] is offering to purchase our resources in exchange for substantial payment"
 usa_foreign.69.a: "Deal"
 usa_foreign.69.b: "No"
 usa_foreign.70.t: "[FROM.GetNameWithFlag] Agrees to Deal"
 usa_foreign.70.d: "[FROM.GetNameWithFlag] government considered our deal to be extremely profitable and agreed to sell us part of its resources."
 usa_foreign.70.a: "Good"
 usa_foreign.71.t: "[FROM.GetNameWithFlag] Refused to Deal"
 usa_foreign.71.d: "[FROM.GetNameWithFlag] government refused to sell us part of its resources, considering the deal unprofitable"
 usa_foreign.71.a: "Meh"
 usa_foreign.72.t: "[USA.GetNameWithFlag] is proposing a peace treaty with [DRC.GetNameWithFlag]"
 usa_foreign.72.d: "The American government seems to be trying to play the role of a peacemaker and is willing to help us end our war with the Congo peacefully. Will we agree to end it?"
 usa_foreign.72.a: "Yes"
 usa_foreign.72.b: "Meh"
 usa_foreign.73.t: "[USA.GetNameWithFlag] has provided us with peace with [FROM.GetNameWithFlag]"
 usa_foreign.73.d: "The American government has really been able to achieve a peace treaty with this country for us, and we appreciate the help of the American people!"
 usa_foreign.73.a: "Very Nice!"
 usa_foreign.74.t: "[USA.GetNameWithFlag] Offers Assistance in the Fight Against Islamism"
 usa_foreign.74.d: "The US government intends to eliminate all hotbeds of radical Islamism in this region, which is why they have approached us with a proposal to combat radical cells in our country."
 usa_foreign.74.a: "Very Nice!"
 usa_foreign.74.b: "No"
 usa_foreign.75.t: "[FROM.GetNameWithFlag] Has Agreed to An Anti-Islamist Operation"
 usa_foreign.75.d: "It seems that the government of this country is seriously concerned about the Islamic threat in this region."
 usa_foreign.75.a: "Good"
 usa_foreign.76.t: "[FROM.GetNameWithFlag] has Abandoned Anti-Islamist Operation"
 usa_foreign.76.d: "It seems that their government does not understand the seriousness of the problem of radical Islamic groups in their region."
 usa_foreign.76.a: "Sad"
 usa_foreign.77.t: "[USA.GetNameWithFlag] Offers Multiple Military Cooperation"
 usa_foreign.77.d: "The American government is willing to enter into a powerful defensive pact with us, in which we provide them with a military base, and they in return guarantee our independence, which will undoubtedly strengthen our position in the region."
 usa_foreign.77.a: "Very Nice!"
 usa_foreign.77.b: "No"
