l_english:
 eon_eu_institutions_category:0 "European institutions: appointments"
 eon_eu_institutions_category_desc:0 "Countries shown in office slots represent the origin of independent nominees, not national control of EU bodies.\nCouncil of the EU rotating presidency (six months): [?global.eon_eu_council_rotating_holder.GetName]\nCommission: [?global.eucomission.GetName] | Parliament: [?global.euparliamentpresident.GetName] | ECB: [?global.eucentralbank.GetName]\nEuropean Council: [?global.eucouncil.GetName] | High Representative: [?global.euforeignaffairs.GetName] | Frontex: [?global.eufrontex.GetName]\n\nCurrent nomination: [EonEUOfficeName] — [?global.eon_eu_office_nominee.GetName]\nStage: [EonEUOfficePhase]\nCouncil/Board choices: [?global.eon_eu_office_yes|0] support, [?global.eon_eu_office_no|0] oppose. Parliament supporting seats: [?global.eon_eu_office_ep_yes|0] of [?global.eon_eu_office_ep_total|0].\nEach stage lasts 14 days. You may change your choice until closure. A missing choice is an abstention. Uncreated alternative institutions remain unavailable."
 eon_eu_nominate_office_1:0 "Nominate a candidate: $EU_commission_president$"
 eon_eu_nominate_office_1_desc:0 "Open a 14-day nomination ballot for a vacant office. Council proposal by reinforced qualified majority, then approval by a majority of all Parliament seats. Term: 1825 days. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_2:0 "Nominate a candidate: $EU_parliament_president$"
 eon_eu_nominate_office_2_desc:0 "Open a 14-day nomination ballot for a vacant office. A majority of valid votes cast is required; abstentions do not count. This round represents one nominee, using national delegation seats as a proxy. Term: 913 days. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_3:0 "Nominate a candidate: $ECB_president$"
 eon_eu_nominate_office_3_desc:0 "Open a 14-day nomination ballot for a vacant office. Reinforced qualified majority: at least 72% of eligible governments and 65% of their population. Both thresholds must be met. Term: 2920 days. Only euro-area countries participate. The same nominee may not receive another term; choosing a new qualified person does not exclude their country forever. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_4:0 "Nominate a candidate: $EU_council_president$"
 eon_eu_nominate_office_4_desc:0 "Open a 14-day nomination ballot for a vacant office. Reinforced qualified majority: at least 72% of eligible governments and 65% of their population. Both thresholds must be met. Term: 913 days. Maximum two terms for the same nominee. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_5:0 "Nominate a candidate: $EU_foreign_minister$"
 eon_eu_nominate_office_5_desc:0 "Open a 14-day nomination ballot for a vacant office. Reinforced qualified majority: at least 72% of eligible governments and 65% of their population. Both thresholds must be met. Term: 1825 days. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_6:0 "Nominate a candidate: $frontex_ExDir$"
 eon_eu_nominate_office_6_desc:0 "Open a 14-day nomination ballot for a vacant office. Frontex Management Board is represented by national delegates; at least two thirds must approve. Term: 1825 days. Maximum two terms for the same nominee. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_7:0 "Nominate a candidate: $EU_finance_minister$"
 eon_eu_nominate_office_7_desc:0 "Open a 14-day nomination ballot for a vacant office. Reinforced qualified majority: at least 72% of eligible governments and 65% of their population. Both thresholds must be met. Term: 1825 days. This is an alternative-history institution and requires its reform to have passed. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_8:0 "Nominate a candidate: $EUU_euroarmy_sc$"
 eon_eu_nominate_office_8_desc:0 "Open a 14-day nomination ballot for a vacant office. Reinforced qualified majority: at least 72% of eligible governments and 65% of their population. Both thresholds must be met. Term: 1825 days. This is an alternative-history institution and requires its reform to have passed. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_9:0 "Nominate a candidate: $EUU_euronavy_sc$"
 eon_eu_nominate_office_9_desc:0 "Open a 14-day nomination ballot for a vacant office. Reinforced qualified majority: at least 72% of eligible governments and 65% of their population. Both thresholds must be met. Term: 1825 days. This is an alternative-history institution and requires its reform to have passed. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_nominate_office_10:0 "Nominate a candidate: $EUU_ambassador_unsc$"
 eon_eu_nominate_office_10_desc:0 "Open a 14-day nomination ballot for a vacant office. Reinforced qualified majority: at least 72% of eligible governments and 65% of their population. Both thresholds must be met. Term: 1825 days. This is an alternative-history institution and requires its reform to have passed. National origin is a gameplay proxy; the office holder acts independently."
 eon_eu_office_vote_yes:0 "Support the nominee"
 eon_eu_office_vote_yes_desc:0 "Record or change your choice in the current institutional appointment ballot. Council choices use eligible governments and population; Parliament choices use your national delegation seats. No legislative vote is changed."
 eon_eu_office_vote_no:0 "Oppose the nominee"
 eon_eu_office_vote_no_desc:0 "Record or change your choice in the current institutional appointment ballot. Council choices use eligible governments and population; Parliament choices use your national delegation seats. No legislative vote is changed."
 eon_eu_office_vote_abstain:0 "Abstain"
 eon_eu_office_vote_abstain_desc:0 "Record or change your choice in the current institutional appointment ballot. Council choices use eligible governments and population; Parliament choices use your national delegation seats. No legislative vote is changed."
 eon_eu_office_withdraw_nomination:0 "Withdraw our nomination"
 eon_eu_office_withdraw_nomination_desc:0 "Close our pending nomination without an appointment. Our next nomination can be made after 60 days."
 eon_eu_refresh_national_nominees:0 "Select new qualified institutional nominees"
 eon_eu_refresh_national_nominees_desc:0 "A different person may be nominated when a previous ECB nominee completed their non-renewable term, or a Council/Frontex nominee exhausted two terms. This replaces the nominee cohort, not their nationality. It does not remove current holders or pending ballots. Available once per year, outside those offices and our live nomination."
 eon_eu_office_none:0 "No active appointment"
 eon_eu_office_nominee_eligible_tt:0 "Our country is an active voting member, the institution exists, the nomination cooldown has ended, and the candidate meets its euro-area, term-limit and coastal requirements where applicable."
 eon_eu_office_vacant_tt:0 "The requested office is vacant; the current holder must finish their term or leave first."
 eon_eu_office_no_parallel_ballot_tt:0 "No other institutional nomination is awaiting a decision."
 eon_eu_office_current_ballot_tt:0 "The current nomination stage is still open and our delegation is eligible to vote. Council restrictions do not remove Parliament seats; ECB elections require euro-area membership."
 eon_eu_office_choice_not_already_yes_tt:0 "Our current choice is not already support."
 eon_eu_office_choice_not_already_no_tt:0 "Our current choice is not already opposition."
 eon_eu_office_refresh_cohort_tt:0 "A previous nominee has exhausted an ECB, European Council or Frontex term limit; we hold none of those offices, have no pending nominee, and have not selected a new cohort during the last year."
 eon_eu_office_phase_ep:0 "European Parliament confirmation"
 eon_eu_office_phase_council:0 "European Council: reinforced qualified majority"
 eon_eu_office_phase_eurozone:0 "Euro-area governments: reinforced qualified majority"
 eon_eu_office_phase_board:0 "Frontex Management Board: two-thirds majority"
 eon_eu_institutions.1.t:0 "European institutional nomination"
 eon_eu_institutions.1.d:0 "A European institutional nomination round has opened or advanced to another stage. Open Decisions → European institutions: appointments to view the CURRENT nominee and stage, then support, oppose or abstain. Each stage lasts 14 days. This notification cannot cast a vote. No response means abstention, not automatic consent. The institution is independent of the nominee's national government."
 eon_eu_institutions.2.t:0 "Nomination confirmed"
 eon_eu_institutions.2.d:0 "The required institutional approval was obtained. Our nominee now serves a limited term. The office flag represents national origin; it does not transfer the institution to our government. After expiry or resignation the vacancy enters another nomination round."
 eon_eu_institutions.3.t:0 "Nomination not confirmed"
 eon_eu_institutions.3.d:0 "The nomination did not obtain the required majority, or ceased to be valid before confirmation. No office was awarded. Other eligible candidates may stand; our next nomination is available after 60 days."
 eon_eu_institutions_ack:0 "Understood"
