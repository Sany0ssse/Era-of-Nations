l_english:
 CSTO.1.t: "[From.GetNameDef] wishes to join the CSTO"
 CSTO.1.d: "[From.GetAdjective] delegations have arrived with a bold proposition. They seek to align [From.GetNameDef] with the Collective Security Treaty Organization, pledging mutual defense and cooperation against common threats. A formal hearing is requested to finalize the declaration of friendship and secure [From.GetNameDef]'s entry into our alliance."
 CSTO.1.a: "Absolutely"
 CSTO.1.b: "Never"
 CSTO.2.t: "[SOV.GetNameDef] refuses request to join CSTO"
 CSTO.2.d: "[SOV.GetNameDef] has rejected our request to join CSTO."
 CSTO.2.a: "Disappointing"
 CSTO.3.t: "Invitation to CSTO"
 CSTO.3.d: "[SOV.GetNameDef] and their allies extend an invitation to join the Collective Security Treaty Organization, a pact forged in the shadow of the Soviet Union's dissolution to safeguard the region's stability. Membership would commit us to collective defense against external threats, but it may also draw us into the complex web of post-Soviet geopolitics. What are we going to do?"
 CSTO.3.a: "We accept!"
 CSTO.3.b: "We don't have time for this."

 CSTO.4.t: "[ROOT.GetNameDef] joins the CSTO"
 CSTO.4.d: "[SOV.GetNameDef] and [ROOT.GetNameDef] have come forth today to announce [ROOT.GetNameDef]'s entry into the Collective Security Treaty Organization. In a historic step, [SOV.GetNameDef] and [ROOT.GetNameDef] have set aside past rivalries to strengthen their mutual security through this alliance, pledging collective defense and cooperation in an uncertain world."
 CSTO.4.a: "A Great Day!"
 CSTO.4.b: "A New Ally"
 CSTO.4.c: "Interesting Development"
 CSTO.5.t: "[ROOT.GetNameDef] leaves CSTO!"
 CSTO.5.d: "The leader of [ROOT.GetNameDef], [ROOT.GetLeader], has today announced the country's intention to immediately withdraw from the Collective Security Treaty Organization and its affiliated alliances. This decision fractures the post-Soviet security framework, leaving a gap in collective defense and potentially emboldening regional adversaries."
 CSTO.5.a: "Good choice"
 CSTO.5.b: "Interesting"
