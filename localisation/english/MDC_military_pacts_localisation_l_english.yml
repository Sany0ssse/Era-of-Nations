 ###########INFLIENCY - SPECIAL SERVICES###########
 ###########RUSSIA###########
 ###########Events###########
 sov_gru.1.t: "Russia Wants To Send The GRU To Our Country"
 sov_gru.1.d: "Russian intelligence has proposed sending GRU instructors and combat specialists to support our country."
 sov_gru.1.a: "We Agree"
 sov_gru.1.b: "We don't need them"
 sov_gru.2.t: "[FROM.GetNameWithFlag] Has Agreed To Admit Our GRU"
 sov_gru.2.d: "Their government has agreed to allow our GRU operatives to participate in their military operations. We are ready to provide full support."
 sov_gru.2.a: "Nice"
 sov_gru.3.t: "[FROM.GetNameWithFlag] Refused Our GRU"
 sov_gru.3.d: "Their government rejected the involvement of our special forces, viewing it as too intrusive into their political system."
 sov_gru.3.a: "Weaklings"
 sov_gru.4.t: "GRU Agents Return Home"
 sov_gru.4.d: "GRU officers have returned from their mission and are ready to continue serving the motherland."
 sov_gru.4.a: "Good"
 sov_gru.15.t: "Sending GRU Units"
 sov_gru.15.d: "We intend to send our GRU units to help this country, but we need to be sure that it is worth the risk."
 sov_gru.15.a: "Yes"
 sov_gru.15.b: "No"
 sov_gru.16.t: "Sending PMC Wagner Units"
 sov_gru.16.d: "We intend to send our PMC Wagner units to help this country, but we need to be sure that it is worth the risk."
 sov_gru.16.a: "Yes"
 sov_gru.16.b: "No"
 ###########Tooltips###########
 SOV_GRU_military_aid_tt: "Now you can send §2GRU§! through §Ymilitary aid§! button"
 SOV_Wagner_military_aid_tt: "Now you can send §2PMC Wagner§! through §Ymilitary aid§! button"
 ###########ARMENIA###########
 ###########Events###########
 arm_foreign_legion.3.t: "Armenian Foreign Legion"
 arm_foreign_legion.3.d: "The Armenian government offers to send its own unit, the Foreign Legion, to us. They claim that they are experienced fighters, with good technical equipment and combat training, and will certainly prove useful in the current situation.."
 arm_foreign_legion.3.a: "We'll Let Them In."
 arm_foreign_legion.3.b: "Not Interesting"
 arm_foreign_legion.4.t: "Our Foreign Legion"
 arm_foreign_legion.4.d: "[From.GetNameWithFlag] has agreed to host our foreign legion on its territory to stabilize the current situation in the country, and we are very pleased with our cooperation.."
 arm_foreign_legion.4.a: "Nice"
 arm_foreign_legion.5.t: "Our Foreign Legion"
 arm_foreign_legion.5.d: "[From.GetNameWithFlag] refused to accept our foreign legion on its territory, considering their presence unnecessary."
 arm_foreign_legion.5.a: "Sad"
 arm_foreign_legion.6.t: "Our Foreign Legion"
 arm_foreign_legion.6.d: "Soldiers of our foreign legion have completed their task and are returning to their homeland.."
 arm_foreign_legion.6.a: "Welcome Home"
 arm_foreign_legion.7.t: "Sending Foreign Legion"
 arm_foreign_legion.7.d: "We intend to send our Foreign Legion to help this country, but we need to be sure that it is worth the risk."
 arm_foreign_legion.7.a: "Yes"
 arm_foreign_legion.7.b: "No"
 ###########Tooltips###########
 ARM_ForeignLegion_military_aid_tt: "Now you can send §2Foreign Legion§! through §Ymilitary aid§! button"
