l_english:
 eon_eu_council_ballot_status:0 "Current Council of the EU ballot"
 eon_eu_council_ballot_status_desc:0 "Agenda [?global.current_active_vote_disp|0]. Yes [?global.EU_active_vote_yes|0], no [?global.EU_active_vote_no|0]; eligible states [?global.eon_eu_voters|0]. Supporting population [?global.EU_pop_ratio_yes|%1]. Ordinary legislation requires at least 55% of states and 65% of population; a blocking minority needs at least four states. Treaty and selected political reforms require unanimity: explicit abstention is allowed, an unanswered ballot is not consent. You may change your vote before resolution. Modern voting rules are a declared temporal gameplay abstraction, including the 2000 start."
 eon_eu_council_vote_yes:0 "Council of the EU: vote in favour"
 eon_eu_council_vote_yes_desc:0 "Support the current agenda. Each state has one ballot; repeat clicks cannot add votes."
 eon_eu_council_vote_no:0 "Council of the EU: vote against"
 eon_eu_council_vote_no_desc:0 "Reject the current agenda. This replaces your previous ballot."
 eon_eu_council_vote_abstain:0 "Council of the EU: abstain"
 eon_eu_council_vote_abstain_desc:0 "Explicitly abstain. This does not help a qualified-majority threshold; for unanimity, abstention is not a veto."
 eon_eu_office_nomination_ready_tt:0 "Nominate a qualified candidate for an enabled, vacant office. No other appointment vote may be running. Suspended Council rights, nominee term limits and ECB eurozone eligibility apply. Appointment requires the appropriate Council, Parliament or board vote; the country flag identifies the candidate origin."
