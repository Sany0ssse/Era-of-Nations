l_english:
 eon_peace_draft_title:0 "Terms for ending the war"
 eon_peace_draft_desc:0 "Choose terms for [?eon_peace_draft_target.GetName], then return to their diplomacy screen and click the offer for the selected terms. Opening this window does not end the war or surrender.\n\nThe opponent must agree. Settlements without territorial changes return occupied regions to their owners. Temporary settlements also agree mutual withdrawal and a fixed non-aggression period; expiry never restarts war automatically.\n\nA bilateral settlement cannot bind allies or subjects. Other belligerents retain their own ongoing wars. Collective terms require their participation. Territorial demands use a separate peace conference: consent to that procedure is not an already signed transfer of specific regions."
 eon_peace_draft_next_tt:0 "Return to the selected enemy diplomacy screen and send the chosen offer. The opponent may refuse."
 eon_peace_draft_cancel:0 "Cancel the draft"
 eon_peace_contact_tt:0 "An ongoing war with the selected country is sufficient to discuss terms. Role, war duration and major-power rank do not restrict contact."
 eon_peace_offer_ready_tt:0 "Execution requires a current war, independent governments and a safe bilateral scope. Neither side may be capitulated or in a peace conference. No unresolved previous proposal may remain. A territorial conference additionally requires no other belligerents or subjects. A payment requires the full amount in the sender treasury."
 eon_peace_accept_ready_tt:0 "Approval is valid for 30 days, only for these parties and terms. Current war, participants, authority and cash are checked again. Dismiss an expired offer before sending another."
 eon_peace_native_message:0 "A mutually agreed end to this war. The engine winner label does not establish legal responsibility."
 eon_peace_executed_title:0 "The agreement takes effect"
 eon_peace_executed_desc:0 "The bilateral war has ended. Occupied regions return to their owners; borders and dependencies remain unchanged. Any agreed payment moved once from sender to recipient. A temporary settlement establishes the agreed non-aggression period. Permanent peace ends this conflict, without prohibiting every future war forever."
 eon_peace_armistice_ended_title:0 "The temporary agreement period has ended"
 eon_peace_armistice_ended_desc:0 "The original agreed non-aggression period has elapsed. A later extension or other agreement has its own terms. This notice refers to the original period and never restarts war. A new conflict requires separate decisions and grounds."
 eon_peace_notice_ok:0 "Understood"
 eon_peace_choose_statusquo:0 "Peace without territorial or cash concessions"
 EON_OFFER_PEACE_STATUSQUO_TITLE:0 "Offer: Peace without territorial or cash concessions"
 EON_OFFER_PEACE_STATUSQUO_ACTION_DESC:0 "Peace without territorial or cash concessions"
 eon_offer_peace_statusquo_send_desc:0 "Peace without territorial or cash concessions. Reply within 30 days. Consent is required; war continues until acceptance."
 eon_offer_peace_statusquo_receive_desc:0 "[ROOT.GetName] proposes: Peace without territorial or cash concessions. Acceptance ends only the authorised bilateral conflict. Occupation alone does not transfer ownership."
 eon_peace_choose_armistice_90:0 "Temporary settlement: 90 days and mutual withdrawal"
