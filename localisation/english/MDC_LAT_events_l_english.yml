l_english:
 sov_latvia_resign.1.t: "£LAT_neutral_conservative Šķēle's Government Resigns!"
 sov_latvia_resign.1.d: "Amid accusations of government budget mismanagement and pressure from the public and the president, Prime Minister £LAT_neutral_conservative Andris Šķēle announced that he would resign along with the entire cabinet of ministers.\n£LAT_western_liberal Andris Bērziņš, a representative of a party-coalition member, was appointed as the Prime Minister thanks to rallying the ruling coalition around him and the inclusion of the New Era party into the government."
 sov_latvia_resign.1.a: "It didn't even last a year!"
 sov_latvia_resign.2.t: "Odd Friend"
 sov_latvia_resign.2.d: "In order to form the Government, £LAT_western_conservative Einars Repše needs to cooperate with parties that are ideologically similar to his views, and one such party is the Latvia's First Party. It's led by oligarch £LAT_western_autocracy Ainars Šlesers, who is rumored to be very corrupt and sly person. Although I don't want to associate with £LAT_western_autocracy Šlesers, his presence in the coalition is a necessity for the government to function properly."
 sov_latvia_resign.2.a: "We must be cautious."
 sov_latvia_resign.3.t: "Traitors!"
 sov_latvia_resign.3.d: "£LAT_western_autocracy Ainars Šlesers announced that he would withdraw from the ruling coalition, saying that the prime minister's governing style is too authoritarian, which undermines the foundations of democratic institutions in Latvia. However, the true reason might be £LAT_western_autocracy Šlesers' opposition to anti-corruption reforms.\nRegardless, with the departure of the LPP, we have become a minority government, which will make it very difficult to implement our policies."
 sov_latvia_resign.3.a: "The end is near..."
 sov_latvia_resign.3.b: "We'll survive until the elections!"
 sov_latvia_resign.4.t: "Government Resigns!"
 sov_latvia_resign.4.d: "The minority government formed after the departure of £LAT_western_autocracy Šlesers's party became ineffective. The opposition in the Seimas is blocking our laws, and due to the inability to reach a consensus with parliament, the prime minister has announced that he is dissolving the government and resigning.\nThe President appointed £LAT_neutral_green Indulis Emsis as the new Prime Minister and tasked him with forming a new coalition government. Unfortunately, Emsis ended up forming a minority government with the support of the leftist pro-Russian minority bloc."
 sov_latvia_resign.4.a: "Congratulations, Ingus!"
 sov_latvia_resign.5.t: "Controversial Budget"
 sov_latvia_resign.5.d: "The government's honeymoon is over. The budget submitted by the government for consideration in the Seimas sparked a heated debate. The opposition stated that the budget proposal is absolutely unacceptable and that it will lead to economic collapse and even the pro-Russian bloc is opposing to us.\nThe final vote is imminent, and only fate can say whether the budget will be adopted or not."
 sov_latvia_resign.5.a: "39-53 against the budget proposal!"
 sov_latvia_resign.5.b: "47-45 for budget proposal!"
 sov_latvia_resign.6.t: "PM Resigns!"
 sov_latvia_resign.6.d: "Following the failed vote on the budget, the Prime Minister announced his resignation along with his cabinet. The Latvian Saeima immediately approved £LAT_neutral_conservative Aigars Kalvitis's candidacy for the post of new prime minister and his new majority coalition government."
 sov_latvia_resign.6.a: "What a mess!"
 sov_latvia_resign.7.t: "Widespread Protests"
 sov_latvia_resign.7.d: "The dismissal of the head of the anti-corruption bureau did not go unnoticed by the public. Protests are taking place across the country, the parliamentary opposition is demanding the government's resignation, and the dismissed head of the bureau has joined an opposition party.\nThe government is under intense pressure that it may not be able to withstand."
 sov_latvia_resign.7.a: "That's might be it"
 sov_latvia_resign.7.b: "We'll survive!"
 sov_latvia_resign.8.t: "The Fall"
 sov_latvia_resign.8.d: "After consulting with the President, the Prime Minister declared his resignation along with the entire cabinet. In an address to the nation, the President stated that the resignation was necessary to de-escalate tensions in society.\nThe formation of the new government was entrusted to £LAT_western_liberal_alt Ivars Godmanis, and after a vote in the Saeima, the government officially began its work."
 sov_latvia_resign.8.a: "God with us!"
 sov_latvia_resign.9.t: "Government's Failure"
 sov_latvia_resign.9.d: "Anti-government protests have swept the streets of Latvia amid the worsening global crisis and large-scale corruption scandals. The government is in a deadlock, but there's a chance it will survive until the next elections.\nOr the Prime Minister could resign and the President would nominate a new candidate in the person of £LAT_western_conservative Vladis Dombrovskis, who would in turn form a new coalition government."
 sov_latvia_resign.9.a: "We'll pray for Vladis"
 sov_latvia_resign.9.b: "Latvia is still fixible!"
 sov_latvia_resign.10.t: "Zolitūde Tragedy"
 sov_latvia_resign.10.d: "Tragic events occurred in the Riga's suburb of Zolitude at 5 PM local time. The roof of the local \"Maxima\" shopping center collapsed, burying shoppers underneath.\nAt 4 PM, the fire alarm went off in the store, but no evacuation was carried out. Then, at 5 PM, after technicians arrived, a collapse occurred.\nEmergency services and the army are currently working at the scene of the incident. It is reported that the death toll has reached 54 people, and the number of injured is 41. This is the deadliest incident since the sinking of the \"Mayakovsky\" steamer. The entire country is in shock and mourning the victims."
 sov_latvia_resign.10.a: "The Government should take the responsibility"
 sov_latvia_resign.10.b: "We'll help victims and their families"
 sov_latvia_resign.11.t: "Cabinet Resigns!"
 sov_latvia_resign.11.d: "Amid the horrific events at the Maxim shopping center, the Prime Minister announced in a national address that he was resigning along with the entire cabinet. He stated that under the current circumstances, Latvia needs a new government supported by parliament. Responding to journalists' questions, the Prime Minister's spokesman stated that the government had taken full political responsibility and that Latvia needs fresh government supported by the Parliament."
 sov_latvia_resign.11.b: "Let's pray for Latvia"
 sov_latvia_resign.12.t: "Ineffective Governance"
 sov_latvia_resign.12.d: "Since taking office, the new government has been plagued by indecision on crucial issues, even national security. Cabinet members cannot agree even on the smallest details, which severely undermines the effectiveness not just of the government, but of the entire state as a whole. The parliamentary opposition is demanding the resignation of the weak prime minister.\nUpon it resignation, Maris Kucinskis is likely to be the successor and he's already preparing his cabinet of ministers, but the government is not in a complete deadlock and there is a chance it will last until the next elections."
 sov_latvia_resign.12.a: "Our time is up"
 sov_latvia_resign.12.b: "Squabble up!"
 sov_latvia_resign.13.t: "Disagreements in the Party!"
 sov_latvia_resign.13.d: "There are growing concerns within the ruling party about the current coalition government's governance, with supporters and opponents of the prime minister divided. The situation is critical and it threatens to paralyze the party faction in the Seimas and the Government itself.\nIf we resign, the situation might normalize and we'll return to the status quo, but if the government remains unchanged, it threatens the departure of members to other parties, which could lead to the ruling party's downfall."
 sov_latvia_resign.13.a: "Resign immediately"
 sov_latvia_resign.13.b: "I will stay!"
 latvia_party.0.t: "Parliament Dissolution Referendum"
 latvia_party.0.d: "Following the failed vote in the Saeima to authorize a search of the home of politician £LAT_western_liberal Ainārs Šlesers, who is suspected of involvement in corruption schemes, Latvian President Valdis Zatlers unexpectedly exercised his power and called a referendum on dissolving the Saeima.\nAlthough the decision was controversial, the majority of the population approved of the president's action, and a large number of people came to the polling stations. After the vote, the commission began counting the ballots, but the outcome of the referendum seems obvious to everyone."
 latvia_party.0.a: "96% voted 'Yes'"
 latvia_party.1.t: "£LAT_western_autocracy_alt Zalster's Reform Party"
 latvia_party.1.d: "President Valdis Zatlers, riding on a wave of increased popularity following the successful referendum, announced that he would create a new political party. The President stated that the current main political parties are corrupt and influenced by oligarchs, and that Latvia needs a new political force.\nAccording to the President, the party will strive to reform the political system, combat corruption and oligarchs, also he stated that if elected to parliament, his party would refuse to work with £LAT_neutral_autocracy ZZS, £LAT_western_liberal_alt LPP/LC, and £LAT_neutral_conservative TP."
 latvia_party.1.a: "Ambitious Indeed"
 latvia_party.2.t: "Stagnation or Success?"
 latvia_party.2.d: "£LAT_western_autocracy_alt The Reform Party has existed for several years, but its integrity is questionable. On the one hand, it was able to secure a certain niche in Latvian politics, but the question of it's necessity is acute against the backdrop of the £LAT_western_conservative_alt Unity's rising ratings and their ideological similarities. There are opinions that would be better the £LAT_western_autocracy_alt Reform Party to integrate into £LAT_western_conservative_alt Unity and create a single conservative-liberal party. The party is currently debating whether to integrate into £LAT_western_conservative_alt Unity and declare itself a dead project, or whether Zatlers' party will continue its successful existence."
 latvia_party.2.a: "Dissolve the £LAT_western_autocracy_alt ZRP"
 latvia_party.2.b: "There is no reason to dissolve it"
 latvia_party.3.t: "Who Owns the State?"
 latvia_party.3.d: "Who Owns the State? Under this name, a new political party was created, running on an anti-corruption platform. The party is also trying to attract voters with populist and Eurosceptic rhetoric.\nThe party is gaining popularity among Latvian immigrants, and its candidate for prime minister is £LAT_western_autocracy_altyn Aldis Gobzems a lawyer who represented the victims of the Zolitūde tragedy."
 latvia_party.3.a: "Who really owns Latvia?"
 latvia_party.3.b: "Another Nothingburger."
 latvia_party.4.t: "Who Owns the KPV?"
 latvia_party.4.d: "£LAT_western_autocracy_altyn The KPV has existed for a long time, and there is a split within the party, which threatens its complete disintegration and its disappearance from history as just a few dots in the image of the Saeima composition on the Wikipedia page.\nWill the party survive this turbulent time, or is it doomed?."
 latvia_party.4.a: "Pack the bags guys."
 latvia_party.4.b: "We Must Survive!"
 latvia_party.5.t: "Latvian Unity"
 latvia_party.5.d: "Recently, the leadership of £LAT_western_conservative the  New Era party announced a merger with the Civic Union and the Society for Other Politics, and the creation of a new political party called £LAT_western_conservative_alt 'Unity'.\nThe declaration states that £LAT_western_conservative_alt 'Unity' is a party with a conservative liberal leaning and advocates for building an effective market economy, protecting Latvian and European values, and supports further integration into the EU and NATO."
 latvia_party.5.a: "Quite Promising"
 latvia_party.6.t: "The New Unity"
 latvia_party.6.d: "Today, £LAT_western_conservative_alt the 'Unity' and several regional parties announced the creation of a nationwide alliance called £LAT_western_conservative_alty 'New Unity'. The alliance's declaration repeats Unity's program which includes supporting conservative-liberal values and integration into the EU and NATO."
 latvia_party.6.a: "Interesting."
 latvia_party.7.t: "LPP/LC"
 latvia_party.7.d: "Today, a significant event occurred in Latvian politics: £LAT_western_autocracy LPP leader Ainars Šlesers and £LAT_western_liberal LC leader Ivars Godmanis announced the creation of a unified party.\nThe party holds liberal views and supports more radical economic reforms. It also fully supports integration into the EU and NATO. The party has every chance of finding a niche in the political arena and posing a challenge to other parties."
 latvia_party.7.a: "What a long abbreviation"
 latvia_party.8.t: "For Latvian Development"
 latvia_party.8.d: "Latvia's political landscape has gained a new force. Former £LAT_western_conservative New Era party leader Einars Repše announced the creation of a center-right political organization called £LAT_western_liberal_alty 'For the Development of Latvia.'\nThe party supports a market economy as well as political and personal freedoms."
 latvia_party.8.a: "Another party?"
 latvia_party.9.t: "£LAT_western_social_alt The Progressives"
 latvia_party.9.d: "A new political party has recently been registered based on the NGO 'Progressives'. Party leaders stated that Latvia needs to implement progressive reforms and further European integration.\nThe party also advocates for Euro-federalism and devolution, as well as the creation of a Scandinavian economic model in Latvia."
 latvia_party.9.a: "Toward the Progressive Latvia!"
 latvia_party.10.t: "The True Servants"
 latvia_party.10.d: "Today, a congress of several parties was held, resulting in the creation of a new political organization. The declaration states that the party supports the establishment of a social state, as well as the transition to a syndicalist economy."
 latvia_party.10.a: "This parties are all the same!"
 latvia_party.11.t: "£LAT_conservative_alt Latvian Russian Union"
 latvia_party.11.d: "The recent £LAT_conservative PSTVL congress defined a new development vector for the party. The new leadership stated that Latvia needs a party that specifically defends the interests of the Russian minority. In their opinion, the existence of such a party is necessary in the political arena if Latvia wants to be a truly equal state.\nThe goal of the reorganized party will be to protect the interests of the Russian population, abolish the non-citizen status, and bring Latvia closer to Russia."
 latvia_party.11.a: "Another krievu party?"
 latvia_party.12.t: "£LAT_neutral_autocracy Union of Greens and Farmers"
 latvia_party.12.d: "The Latvian political scene has been joined by a new electoral union. £LAT_neutral_autocracy_alt The Latvian Farmers' Union and a number of prominent political parties have announced the creation of an alliance to participate in the next parliamentary elections.\nDue to the ideological diversity of its members, the alliance's political platform is quite vague, but all parties agreed to support Latvian Farmers, measures to combat pollution, and the equal distribution of mandates if they are elected to the Saeima."
 latvia_party.12.a: "A farmer Latvia?"
 latvia_party.13.t: "The Conservatives"
 latvia_party.13.d: "A congress of the new political party's assembly was recently held, where former National Alliance minister Jānis Bordāns was appointed as the party leader. The new leadership stated that the party's core ideas will be liberal-conservative values, the inviolability of private property, and the protection of Latvian values."
 latvia_party.13.a: "OK"
 latvia_party.14.t: "£LAT_neutral_conservative_altyn The United List"
 latvia_party.14.d: "An agreement was reached today to create a new electoral bloc, led by £LAT_neutral_conservative_altyn Uldis Pilenes, the head of the NGO of the same name. The Alliance has all the characteristics of an umbrella organization, uniting parties with different ideologies, but what the parties have in common is their support for Latvian regionalism, sustainable development, and state independence."
 latvia_party.14.a: "And another one"
 latvia_party.15.t: "£LAT_oligarchism_alt For Latvia from Heart"
 latvia_party.15.d: "Today, we witnessed the awakening of a new political party, led by former auditor £LAT_oligarchism_alt Inguna Sudraba. The party takes a conservative stance but supports fair pensions and wages. It also has elements of populist rhetoric and is trying to attract voters from different social groups."
 latvia_party.15.a: "That's interesting"
 latvia_party.16.t: "For Stability!"
 latvia_party.16.d: "A new political party has been born, organized by activist Alexei Roslikov. The party presents itself as a defender of the Russian minority and also advocates for radical political reforms, such as reducing the number of deputies from 100 to 50, introducing direct presidential elections, and allowing non-citizens to participate in municipal elections. The party largely takes right-wing populist positions and also supports cooperation with its neighbors, including Russia."
 latvia_party.16.a: "Sounds stable"
 latvia_party.17.t: "£LAT_neutral_libertarian United for Latvia"
 latvia_party.17.d: "After the collapse of the £LAT_western_liberal_alt LPP/LC, Ainars Šlesers convened a congress to register his new political party. The party's manifesto sets the goal of building a free, market-based Latvia and combines the ideas of economic liberalism and populism. Only time will tell if voters want to see £LAT_western_liberal_alt Šlesers in parliament again, considering his ambiguity as one of the 'oligarchs' in Latvian politics."
 latvia_party.17.a: "Quite a contreversial guy"
 latvia_party.18.t: "Šlesers Strikes Back!"
 latvia_party.18.d: "A well-known politician and the so-called 'oligarch' of Latvian politics, Ainars Šlesers, has announced the creation of 'Latvia First' - his latest party. The manifesto of the new party declares the it commitment to traditional values and cultural traditions of Latvia, as well as many other values and views characteristic of right-wing populist parties.\nExperts link Šlesers's latest party change to the fact that his previous project didn't meet his expectations and that he believes a right-wing populist project will appear more attractive to voters."
 latvia_party.18.a: "Him again?!"
 latvia_party.19.t: "Harmony in Latvia"
 latvia_party.19.d: "The leaders of the three pro-Russian parties that make up the Harmony Centre coalition recently announced their merger into a single party. At the congress, it was stated that the goal of the unification was the desire to consolidate the votes of Russian-speaking residents and that Latvia needs a large party that can stand up for Latvia's national minorities. The party's manifesto declares its commitment to social-democratic values, the creation of a socially oriented economy, and the reform of the non-citizen institution. "
 latvia_party.19.a: "Crazy"
 latvia_party.20.t: "£LAT_national_populist_alt National Allience"
 latvia_party.20.d: "An agreement was reached between Latvia's two main nationalist parties after £LAT_western_conservative_alt the 'Unity' refused to include them in its electoral alliance. The leaders of the 'All for Latvia!' and £LAT_national_populist TB/LNNK parties have agreed to form an electoral bloc to participate in the next parliamentary elections. According to them, this was done to unite nationalist forces and prevent 'pro-Kremlin' parties from coming to power. If they win, the bloc promises to protect the Latvian language, continue market reforms, and integrate into Western organizations. Many experts say that by doing this, the leaders of the two parties have launched the process of unification into a single entity, which in theory could unite the right-wing electorate around itself."
 latvia_party.20.a: "Is this a nationalist resurgence?"
 

