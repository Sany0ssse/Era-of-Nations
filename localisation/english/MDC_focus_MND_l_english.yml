l_english:
 # Focuses
 MND_kvitsianis_gamble: "Kvitsiani's Gamble"
 MND_kvitsianis_gamble_desc: "Georgia is weak, Abkhazia is beyond Tbilisi's control, and the Kodori Gorge is a grey zone where only one law exists: strength. Emzar Kvitsiani sees an opportunity. Monadire is not just a militia. It is the seed of a new power in the Caucasus. The time to act is now."
 MND_request_money_from_georgia: "Request Money from Georgia"
 MND_request_money_from_georgia_desc: "Tbilisi has always paid those who put pressure on Abkhazia. Monadire controls the Kodori Gorge — a valuable asset for Georgia. Kvitsiani knows his worth. It is time to send the bill."
 MND_accept_gelayevs_proposal: "Accept Gelayev's Proposal"
 MND_accept_gelayevs_proposal_desc: "Ruslan Gelayev — the Black Angel of Chechnya — sits in the mountains with hundreds of battle-hardened men. Kvitsiani sees an opportunity. Gelayev has fought in Abkhazia before. He knows the terrain, knows the enemy, and hates them. An alliance between Monadire and the Chechen wolves could change everything."
 MND_hunting_and_food_salvaging_efforts: "Hunting and Food Salvaging Efforts"
 MND_hunting_and_food_salvaging_efforts_desc: "The Kodori Gorge is cut off from the world. No supply lines, no markets, no state support. Monadire's men feed themselves the old way — hunting game in the forests, foraging in the ravines, keeping small plots of land. The mountains have always fed those willing to take from them. For now, that is enough."
 MND_recruit_khevsureli: "Recruit Khevsureti and Svaneti Militias"
 MND_recruit_khevsureli_desc: "We are expanding our network in the mountainous regions of Khevsureti and Svaneti, relying on clans, warlords, and smuggling routes. The new units will strengthen our raiding capabilities and give us depth of defense, but the operation will require funds and increase internal tensions."
 MND_attempt_negotiations_with_Russia: "Attempt Negotiations with Russia"
 MND_attempt_negotiations_with_Russia_desc: "Moscow has its own interests in the Caucasus. Monadire controls the Kodori Gorge — a thorn in Georgia's side. Perhaps the bear can be persuaded to lend its paw. Kvitsiani sends word to the Kremlin. Whether Russia listens is another question entirely."
 MND_attempts_at_local_drug_production: "Attempts at Local Drug Production"
 MND_attempts_at_local_drug_production_desc: "The Kodori Gorge sits on ancient smuggling routes. Kvitsiani sees the opportunity — poppy fields in the highlands, transit routes through the mountain passes, buyers on both sides of every border. Dirty money. But money nonetheless."
 MND_covertly_support_pankis_valley_efforts: "Covertly Support Pankis Valley Efforts"
 MND_covertly_support_pankis_valley_efforts_desc: "Pankisi is a powder keg. Chechen fighters have flooded the gorge — battle-hardened, armed and with nowhere else to go. Kvitsiani sends money, supplies and quiet support. In return, Pankisi becomes Monadire's recruiting ground and rear base."
 MND_establish_chechen_bases: "Establish Chechen Bases"
 MND_establish_chechen_bases_desc: "Monadire begins building permanent infrastructure for the Chechen fighters — weapons caches, training grounds, bunkers carved into the rock of the Kodori Gorge. The mountains become a fortress. Anyone who wants to find these bases will have to come through us first."
 MND_smuggle_weapons_from_svanetia: "Smuggle Weapons from Svanetia"
 MND_smuggle_weapons_from_svanetia_desc: "Svanetia is drowning in weapons nobody officially owns. Soviet stockpiles, war trophies, black market supplies — all sitting in mountain villages waiting for a buyer. Kvitsiani sends his men through the passes. What comes back keeps Monadire armed and dangerous."
 MND_get_money_from_un: "Get Money from UN Hostages"
 MND_get_money_from_un_desc: "The UN sends observers into the gorge with notebooks and blue helmets. Unarmed. Unprotected. Kvitsiani sees an opportunity. A quiet statement, a ransom demand, a discreet transfer of funds. The observers go home. The money remains in the gorge. The UN files a complaint. No one cares."
 MND_propaganda_in_svanetia: "Propaganda in Svanetia"
 MND_propaganda_in_svanetia_desc: "Monadire runs an active propaganda operation in Svanetia. Only Kvitsiani stands with the mountain people!"
 MND_plant_chaos_in_abkhazian_society: "Plant Chaos in Abkhazian Society"
 MND_plant_chaos_in_abkhazian_society_desc: "We are unleashing controlled chaos in Abkhazian society through underground networks, disinformation, bribery, and targeted sabotage. The goal is simple: to undermine trust in the authorities, to cause discord among the elites, and to turn internal conflicts into a permanent crisis. The operation will require significant financial and political investment, but it will create a window of opportunity for us in the region."
 MND_stop_svanetia: "Stop Svanetia Genocide"
 MND_stop_svanetia_desc: "Under the banner of protecting the people of Svaneti, we are moving the operation into an open phase. Through humanitarian aid, underground channels, and armed cover, we are expanding our influence in the region and building support within Georgia. The larger the scale of our aid, the greater our leverage—but the stronger the hostility from the Georgian authorities."
 MND_proclaim_yourself_interim: "Interim Govemment of Abkhazia"
 MND_proclaim_yourself_interim_desc: "It is time to step out of the shadow of raids and underground warfare. We proclaim ourselves the Interim Government of Abkhazia, formalizing control over seized areas and turning scattered detachments into a state apparatus. This move grants political legitimacy within the movement and opens the path to further consolidation of power, while also intensifying pressure from external enemies."
 MND_start_raid_on_abkhazia: "Start Raid on Abkhazia"
 MND_start_raid_on_abkhazia_desc: "The time for covert pressure is over. We are launching coordinated raids, sabotage, and armed probes into Abkhazia to disrupt local control, test enemy responses, and prepare the ground for a wider campaign."
 MND_true_lord_of_abkhazia: "True Lord of Abkhazia"
 MND_true_lord_of_abkhazia_desc: "The era of uncertainty is over: after raids and provisional structures, power in Abkhazia is definitively concentrated in Kvitsiani’s hands. He secures personal supremacy, puts the regime on a war footing, and raises the stakes in the regional conflict. We will become more dangerous and aggressive, but we will pay for it with rising internal tension."
 MND_real_owner_of_sakartvelo: "Real Owner of Sakartvelo"
 MND_real_owner_of_sakartvelo_desc: "We declare that only our rule can impose order in Sakartvelo. Through pressure, propaganda, and a network of allies, we are turning a political slogan into a practical program for reshaping the region. If our demands are rejected, the next step will be military escalation."
 MND_support_ichkeria: "Support Ichkeria"
 MND_support_ichkeria_desc: "Spring 2000. Grozny has fallen. Maskhadov is in the mountains with a handful of men and a flag that fewer and fewer people recognize. Ichkeria is dying — but it is not dead yet. Kvitsiani sends money, weapons and safe passage through the Kodori Gorge. The Chechen wolves fought for Abkhazia once. Now Monadire fights for them. Brothers in the mountains. Brothers in defeat. Brothers in resistance."
 MND_claim_adyghe_lands: "Claim Adyghe Lands"
 MND_claim_adyghe_lands_desc: "Adyghe lands were for centuries part of a single Caucasian space, torn apart by wars, forced migrations, and foreign rule. We now formally declare our claim to these territories and announce that the question of historical justice will no longer remain frozen. This step will strengthen the fighting spirit of our supporters, but it will inevitably escalate conflict with those who consider the Caucasus their domain."
 MND_declare_confederation: "Confederation of Mountain Peoples of the Caucausus"
 MND_declare_confederation_desc: "In 1991, twelve mountain peoples signed a declaration in Sukhumi — a Confederation born from the ashes of the Soviet Union, heir to the Mountain Republic of 1918. It fought for Abkhazia, then faded. Kvitsiani raises it from the dead. The Confederation of Mountain Peoples of the Caucasus lives again — not as a memory, but as a state. Abkhazians, Chechens, Svans, Adyghe, Avars — all under one banner. Moscow calls it terrorism. Kvitsiani calls it justice."
 MND_demand_ossetia: "Demand Ossetia"
 MND_demand_ossetia_desc: "The Ossetian question must be settled by our will, not by foreign borders. We are issuing formal claims to both North and South Ossetia and demanding recognition of a new order in the Caucasus. If these demands are rejected, the dispute will move from diplomacy to a military phase."
 MND_raids_into_dagestan: "Raids into Dagestan"
 MND_raids_into_dagestan_desc: "The raids into Dagestan are not meant to hold land, but to fracture order from within. Through underground channels we will strengthen radical networks, fuel separatist sentiment, and raise the level of violence in the region. The deeper the chaos in Dagestan, the weaker Moscow’s grip on the wider North Caucasus — but the higher the risk of a harsh military response against us."
 MND_rebellion_in_azerbaijan: "Rebellion in Azerbaijan"
 MND_rebellion_in_azerbaijan_desc: "Azerbaijan sits on oil and old grievances. Lezgins in the north, Talysh in the south — minorities with long memories and short patience. Monadire has money, weapons and experience in starting fires. Time to see if Azerbaijan burns."
 MND_gelayevs_coup: "Gelayev's Coup"
 MND_gelayevs_coup_desc: "The phase of compromise is over. Backed by field commanders and loyal armed groups, Gelayev removes his rivals within the movement and takes full control. The new line prioritizes hard mobilization, coercive rule, and the expansion of underground networks across the Caucasus. The regime will become more dangerous and decisive, but it will pay with deeper radicalization and permanent confrontation with its neighbors."
 MND_firm_grip_of_emzar: "Firm Grip of Emzar"
 MND_firm_grip_of_emzar_desc: "Emzar crushes internal factions and consolidates a single chain of command. Instead of the warlord-style gamble, the regime shifts toward discipline, managed mobilization, and strict political control. This will strengthen state durability and allow a long hardline course without policy reversals, but it will require constant pressure on both elites and society."
 MND_subjugate_armenia: "Subjugate Armenia"
 MND_subjugate_armenia_desc: "The Armenian direction is becoming our next target. Through underground channels, sabotage groups, and local allies, we will increase pressure on Armenia’s internal order. The operation may give us a strategic advantage in the Caucasus, but it will inevitably raise the risk of a harsh military and diplomatic response."
 MND_jlhadist_haven: "Jihadiest Haven"
 MND_jlhadist_haven_desc: "We are turning the mountain zone into a durable network of covert bases, recruitment hubs, and supply routes. This infrastructure will give us the tools for prolonged warfare, sabotage, and pressure against neighboring regimes."
 MND_sufi_sunni_harmonization: "Sufi-Sunni Harmonization"
 MND_sufi_sunni_harmonization_desc: "The Caucasus has always had its own Islam. Not the desert Islam of Arabia, not the political Islam of Riyadh — but the mountain Islam of the Naqshbandiyya, the zikr, the shrines of local saints. Gelayev, himself a man of faith, understands this. A Confederation torn between Sufi tradition and Sunni orthodoxy will not survive. He brings the sheikhs and the imams together. The mountains find a common prayer."
 MND_caucasian_nationalism: "Caucasian Nationalism"
 MND_caucasian_nationalism_desc: "We are turning scattered grievances and old mountain feuds into a single political idea: the Caucasus should belong to the peoples of the Caucasus. Through propaganda, underground networks, and a common agenda, we are igniting nationalist sentiment across the region, weakening foreign influence and preparing the ground for a new order."
 MND_secularization_for_the_sake_of_stability: "Secularization for the sake of stability"
 MND_secularization_for_the_sake_of_stability_desc: "The Caucasus embraced Islam late, and only after resistance. Before mosques, there were churches; before churches, the old mountain gods. The mountain peoples need a state, not a caliphate. Religion is returning to where it belongs: in the home, out of government."
 MND_caucasian_emirate: "Caucasian Emirate"
 MND_caucasian_emirate_desc: "Gelayev’s line reaches its final stage: instead of temporary administrations and local deals, we establish a unified Caucasian Emirate. Authority is concentrated in a military-religious core, resources are redirected toward mobilization, and the conflict expands beyond a single region. This grants stricter discipline, stronger combat endurance, and sharper political will, but it also raises the cost of every move and locks us into a path of confrontation."
 MND_crowning_ourselves_as_kings: "King of Mountains"
 MND_crowning_ourselves_as_kings_desc: "The era of scattered commanders is over. We proclaim a new mountain order: one throne, one command, one state will. Authority is centralized, taxation is tightened, and resources are redirected from chaos to war-readiness and development. This coronation strengthens our domestic independence and shields the state from foreign pressure."

 # TT
 MND_if_georgia_is_agree_TT: "Monadire will have a better opinion of us. Our influence in Monadir will grow"
 MND_if_georgia_is_not_agree_TT: "Monadire will think less of us. Our influence in Monadir will diminish"
 MND_if_russia_is_agree_TT: "Monadire will have a better opinion of us. Our influence in Monadire will grow significantly"
 MND_if_russia_is_not_agree_TT: "Monadire will think less of us. Our influence in Monadire will diminish"
 MND_abk_hate_TT: "The Abkhazian people will hate us even more, because thanks to us the entire Abkhazian Republic will live even worse."
 MND_chaos_aze_TT: "Our “gift” will seriously destabilize the situation in Azerbaijan, and its people will remember it for a long time. There is a chance that the Azerbaijani government will declare war on us."
 MND_chaos_arm_TT: "Our “gift” will seriously destabilize the situation in Armenia, and its people will remember it for a long time. There is a chance that the Armenia government will declare war on us."
 MND_rus_ichk_TT: "Russia will hate us and may start a war."
 MND_stop_svanetia_TT: "We will be able to strengthen our influence in Georgia and undermine its sovereignty, but our relations with the Georgian government will deteriorate"
