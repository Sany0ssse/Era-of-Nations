 MND_political_ambitions: "Political Ambitions"
 MND_political_ambitions_desc: "Monadire is more than a paramilitary force — it is a political project. Its leadership sees itself not as fighters, but as the architects of a new Caucasus. Recruitment flows steadily, morale runs high, and nationalist sentiment spreads through the ranks like fire. But ambition has its costs. Resources flow toward politics and war, the economy stagnates, and internal rivalries simmer beneath the surface."
 MND_food_shortage_idea: "Food Shortage"
 MND_food_shortage_idea_desc: "The territory under Monadire's control is struggling to feed itself. Supply lines are unreliable, agriculture is neglected, and what little food exists is being consumed by the war effort first. Discontent spreads through the civilian population. A hungry army is a brittle army — and a hungry people does not stay quiet for long."
 MND_chechen_volunteers: "Chechen Volunteers"
 MND_chechen_volunteers_desc: "Hardened by two wars and with nowhere left to call home, hundreds of Chechen fighters have found their way to Monadire's ranks. They bring with them something no training can replicate — experience. These men know what it means to fight a larger enemy on familiar ground, and they intend to use that knowledge."
 MND_mountain_fortress: "Mountain Fortress"
 MND_mountain_fortress_desc: "The Caucasus mountains are not merely a backdrop — they are a weapon. Monadire has built its positions into the rock itself, turning every ridge and valley into a defensive line that no conventional army can easily breach. Outsiders see impassable terrain. Monadire sees home ground."
