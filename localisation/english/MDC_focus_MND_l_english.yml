 # Decisions
 MND_confederation_category: "The Creation of the Confederation"
 MND_confederation_category_desc: "The Caucasus has never been one people — but it has always been one land. Monadire seeks to unite the fractured nations of the region under a single confederal banner, binding them through shared culture, common enemies and the promise of sovereignty no outside power can take away."
