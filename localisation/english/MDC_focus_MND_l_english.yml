 #Cosmetic Tags
 MND_caucas_federation: "Confederation of Mountain Peoples of the Caucasus"

 # Events
 MND_policy.5.t: "The Monadires are asking us for help"
 MND_policy.5.d: "Emzar Kvitsiani is requesting financial support from us. His men control the Kodori Gorge and continue to pressure Abkhazian positions. Monadire is a useful tool, but mountain warriors are unpredictable. Is it worth investing money in someone else's war?"
 MND_policy.5.a: "Allocate 3 billion. We need Kvitsiani."
 MND_policy.5.b: "Refuse. We will not finance such ventures."
 MND_policy.6.t: "Tbilisi Opens Its Wallet"
 MND_policy.6.d: "Georgian money has arrived. Tbilisi sees us as a useful instrument against Abkhazia — and we are happy to play that role. For now. The 8 billion will go towards supplies, weapons and paying our men. Kvitsiani smiles. Georgia thinks it bought loyalty. It bought time."
 MND_policy.6.a: "The mountains have a new patron."
 MND_policy.7.t: "Tbilisi Slammed the Door"
 MND_policy.7.d: "Georgia refused. No money, no explanations — just cold silence from Tbilisi. Very well. Kvitsiani has survived without outside help before. The mountains provide for their own."
 MND_policy.7.a: "We will manage on our own."
 MND_policy.19.t: "The Mountain Wolves Are Asking for Our Blessing"
 MND_policy.19.d: "Emzar Kvitsiani sends word to Moscow. He controls the Kodori Gorge and wants Russian backing — money, weapons, recognition. A useful pawn in Georgia's backyard. But pawns have a habit of becoming problems. Do we invest in this mountain warlord?"
 MND_policy.19.a: "Send money and weapons. Kvitsiani will serve our interests."
 MND_policy.19.b: "Refuse. We do not deal with mountain bandits."
 MND_policy.20.t: "Moscow Has Spoken"
 MND_policy.20.d: "Russian money and rifles have arrived in the gorge. Kvitsiani holds a Kalashnikov stamped in Tula and smiles. Moscow thinks it bought a loyal dog. Perhaps. But dogs raised in the mountains answer only to the mountains."
 MND_policy.20.a: "The bear has extended its paw. We shake it — for now."
 MND_policy.21.t: "The Bear Turned Away"
 MND_policy.21.d: "Moscow refused. No money, no weapons, no recognition — just silence from the Kremlin. Kvitsiani expected as much. Russia plays its own game. Monadire will play its own."
 MND_policy.21.a: "We need no one. The gorge is ours."
 MND_policy.22.t: "A Gift from Monadire!"
 MND_policy.22.d: "Provocateurs have infiltrated Abkhazian society. Markets are disrupted, officials are threatened, rumours spread like wildfire. Someone is deliberately destabilizing the republic from within. The government scrambles to contain the damage."
 MND_policy.22.a: "Fuck!"
 MND_policy.24.d: "In recent weeks, sabotage, attacks on checkpoints, and warehouse arson have increased in the northern regions. According to intelligence services, the Monadire group is coordinating the unrest, using smuggling routes and local radical cells. The situation is no longer ordinary crime: it is a deliberate attempt to undermine Azerbaijan’s internal stability."
 MND_policy.25.d: "In recent weeks, sabotage, attacks on checkpoints, and warehouse arson have increased in the northern regions. According to intelligence services, the Monadire group is coordinating the unrest, using smuggling routes and local radical cells. The situation is no longer ordinary crime: it is a deliberate attempt to undermine Azerbaijan’s internal stability."
 MND_policy.24.a: "Enduring..."
 MND_policy.25.a: "Enduring..."
 MND_policy.24.b: "Stability requires money"
 MND_policy.25.b: "Stability requires money"
 MND_policy.25.c: "This is completely unacceptable"
 MND_policy.24.c: "This is completely unacceptable"
 MND_policy.24.t: "A Gift from Monadire"
 MND_policy.25.t: "A Gift from Monadire"
 MND_policy.23.t: "The Extent of the Strike Against Azerbaijan"
 MND_policy.23.d: "Azerbaijan is held together by fear and a facade of stability. If we strike at the nodes of control, cracks will spread through the entire system. Our allies inside the country are waiting for the signal to bring the conflict out of the shadows. All that remains is to choose the depth of our intervention."
 MND_policy.23.a: "Budget-Friendly"
 MND_policy.23.b: "Expensive"
 MND_policy.26.t: "Monadire is Supplying Our Enemies"
 MND_policy.26.d: "Intelligence reports confirm it. Weapons, money and fighters are flowing through the Kodori Gorge to what remains of Ichkeria. Kvitsiani is keeping the Chechen resistance alive. Moscow cannot ignore this. The question is how to respond."
 MND_policy.26.a: "Crush Monadire. No one supplies our enemies and walks free."
 MND_policy.26.b: "Not now. We have enough wars. Watch them closely."
 MND_policy.17.d: "In recent weeks, sabotage, warehouse arsons, and attacks on infrastructure have increased in the border regions. According to security services, the Monadire group is coordinating these actions through smuggling routes and sleeper cells. These are no longer isolated incidents, but a deliberate campaign to destabilize Armenia."
 MND_policy.18.d: "In recent weeks, sabotage, warehouse arsons, and attacks on infrastructure have increased in the border regions. According to security services, the Monadire group is coordinating these actions through smuggling routes and sleeper cells. These are no longer isolated incidents, but a deliberate campaign to destabilize Armenia."
 MND_policy.17.a: "Enduring..."
 MND_policy.18.a: "Enduring..."
 MND_policy.17.b: "Stability requires money"
 MND_policy.18.b: "Stability requires money"
 MND_policy.18.c: "This is completely unacceptable"
 MND_policy.17.c: "This is completely unacceptable"
 MND_policy.17.t: "A Gift from Monadire"
 MND_policy.18.t: "A Gift from Monadire"
 MND_policy.16.t: "The Extent of the Strike Against Armenia"
 MND_policy.16.d: "Our network in Armenia is ready to act. Supply and communication channels are in place, and the operatives are awaiting orders. We can limit ourselves to targeted sabotage or escalate to large-scale destabilization that will damage internal order for a long time. The harder the strike, the greater the effect—and the greater the risk of a harsh response."
 MND_policy.16.a: "Budget-Friendly"
 MND_policy.16.b: "Expensive"
 MND_policy.1.t: "Monadire Claims on Our Lands"
 MND_policy.1.d: "The Monadire leadership has officially declared several Georgian territories to be its “historical lands,” effectively formalizing national claims over them. This is no longer propaganda rhetoric, but a direct challenge to Georgia’s sovereignty and a signal of further escalation. Emergency consultations have begun in Tbilisi: concessions would undermine the state, but a hard response could bring open conflict closer."
 MND_policy.1.a: "SCUM!"
 MND_policy.2.t: "The Scale of Aid to Svaneti"
 MND_policy.2.d: "We can limit ourselves to providing soft support, roll out a full-scale network, or move toward direct intervention. The deeper we get involved, the greater our influence in Georgia will become and the more support we’ll gain from part of society, but the authorities in Tbilisi will come to hate us more and more."
 MND_policy.2.a: "Limited support"
 MND_policy.2.b: "Extended support"
 MND_policy.3.t: "The Spread of Monadire in Svaneti"
 MND_policy.3.d: "External support is still limited, but Monadire’s influence in society is gradually growing. We need to do something about Monadire; otherwise, they will continue to undermine our sovereignty."
 MND_policy.3.a: "This is an open challenge"
 MND_policy.4.t: "Monadire is supplying our enemies"
 MND_policy.4.d: "Intelligence reports confirm this. Weapons and money are flowing through the Kodori Gorge to the Nationalist Movement in Dagestan. Moscow cannot ignore this. The question is how to respond."
 MND_policy.4.a: "Crush Monadire. No one supplies our enemies and walks free"
 MND_policy.4.b: "Not now. We have enough wars. Watch them closely"
 MND_policy.8.t: "Monadire Raid: Strike Successful"
 MND_policy.8.d: "Monadire fighters crossed the border under cover of darkness and struck an industrial facility deep in Abkhazia. The guards were overwhelmed, the target destroyed. Tbilisi whispers in satisfaction — Sukhum burns."
 MND_policy.8.a: "Well done."
 MND_policy.9.t: "Monadire Raid: Partial Success"
 MND_policy.9.d: "The raid pushed through, but Abkhazian security forces managed to intercept part of the group. The facility was damaged but not destroyed. Several fighters retreated under fire. A victory — but a costly one."
 MND_policy.9.a: "We'll finish the job next time."
 MND_policy.10.t: "Monadire Raid: Operation Failed"
 MND_policy.10.d: "Someone talked. Abkhazian border troops were waiting. The Monadire group scattered into the treeline and retreated with nothing to show for it. The operation is a failure — and someone will answer for it."
 MND_policy.10.a: "Fall back."
 MND_policy.11.t: "The Strike is Done"
 MND_policy.11.d: "Our men are back. The target in Abkhazia is smoldering. The Russians and Abkhazians are scrambling — they didn't expect this kind of boldness. Monadire has proven it can strike where the Georgian army cannot."
 MND_policy.11.a: "Monadire never retreats."
 MND_policy.12.t: "Back With Losses"
 MND_policy.12.d: "The mission is done, but the price was steeper than expected. Several fighters didn't make it back. Equipment was left behind in the chaos. Still — the target was hit. That counts for something."
 MND_policy.12.a: "We'll be back."
 MND_policy.13.t: "Ambush. Retreat."
 MND_policy.13.d: "It was a trap from the start. Abkhazian forces were ready and waiting. We lost men and pulled back with nothing. Someone betrayed the operation. Until we find them — no more raids."
 MND_policy.13.a: "Find the traitor."
 MND_policy.14.t: "Monadire's Shadow"
 MND_policy.14.d: "Our intelligence services have uncovered a disturbing pattern. Monadire agents are operating freely within our borders — funding nationalist movements, spreading separatist rhetoric and buying loyalty in the streets. Their influence grows quietly, like rot beneath the floorboards. If left unchecked, they will destabilize us from within."
 MND_policy.14.a: "Sever all ties with these provocateurs."
 MND_policy.14.b: "Enough. We declare war on Monadire."
 MND_policy.15.t: "The Monadire Question"
 MND_policy.15.d: "Separatist movements are gaining ground. Extremist cells are expanding. Terrorist incidents are on the rise. Intelligence has traced the funding and logistics to one source: Monadire.\n\n How far are we willing to go?"
 MND_policy.15.a: "Sever ties."
 MND_policy.15.b: "This warrants a military response. We declare war."
 MND_news.1.t: "Gelaev Joins Monadire"
 MND_news.1.d: "Ruslan Gelaev, one of the most feared commanders of the Chechen wars, has crossed the border and joined the ranks of Monadire. With him came battle-hardened fighters and a reputation."
 MND_news.1.a: "A new wolf walks the mountains."
 MND_news.2.t: "Monadire Seizes UN Personnel"
 MND_news.2.d: "In a brazen operation, Monadire fighters have abducted several UN personnel operating in the region. The international community is outraged. Demands for immediate release are flooding in — Monadire has yet to respond."
 MND_news.2.a: "This will not go unanswered."
 MND_news.3.t: "Monadire Strikes Abkhazia"
 MND_news.3.d: "A Monadire raiding party crossed into Abkhazia overnight, attempting to strike infrastructure, then vanished into the mountains before a response could be organized. Russian peacekeepers have been placed on alert."
 MND_news.3.a: "When will there ever be peace in Abkhazia."
 MND_news.4.t: "Monadire Proclaims Itself Provisional Government of Abkhazia"
 MND_news.4.d: "In a dramatic statement, Monadire's leadership has declared itself the legitimate provisional government of Abkhazia, calling on the population to reject the existing authorities. Sukhum has declared the announcement void. The world watches."
 MND_news.4.a: "A bold claim — now they must prove it."
 MND_news.5.t: "Monadire Stokes Unrest in Azerbaijan"
 MND_news.5.d: "Protests have erupted in several Azerbaijani cities. Baku's intelligence services point to Monadire as the organizers — funding agitators, spreading separatist literature and inflaming ethnic tensions."
 MND_news.5.a: "Baku is smoldering."
 MND_news.6.t: "Monadire Moves Against Armenia"
 MND_news.6.d: "A series of coordinated provocations along the Armenian border has been traced back to Monadire. Sabotage, propaganda, border skirmishes — none large enough for war, but enough to keep Yerevan off balance."
 MND_news.6.a: "Death by a thousand cuts."
 MND_news.7.t: "Confederation of the Peoples of the Caucasus Proclaimed"
 MND_news.7.d: "In a ceremony watched across the region, Monadire's leadership has officially proclaimed the Confederation of the Peoples of the Caucasus — a union of fractured nations bound by culture, blood and a common enemy. Whether the confederation will survive its birth remains an open question."
 MND_news.7.a: "A new chapter begins."
 MND_news.8.t: "Gelaev Proclaims the Caucasian Emirate"
 MND_news.8.d: "Ruslan Gelaev has seized power within Monadire and declared the establishment of the Caucasian Emirate — a state built on faith, steel and the ashes of everything that came before. The green banner rises over the mountains. What follows is unknown."
 MND_news.8.a: "God wills it — so they say."
 MND_news.9.t: "Kvitsiani Crowned King of the Caucasus"
 MND_news.9.d: "Emzar Kvitsiani has consolidated his grip on Monadire and taken a title few dared imagine — King of the Caucasus. His supporters call it destiny. His enemies call it delusion. Either way, the crown is on his head."
 MND_news.9.a: "Long live the king. Perhaps."
 MND_news.10.t: "Monadire Attempts to Ignite Chechnya"
 MND_news.10.d: "Monadire operatives have been caught attempting to stoke unrest in Chechnya — distributing weapons, funding underground networks and making contact with disaffected veterans. Grozny's security forces responded quickly. The outcome of the operation remains unknown."
 MND_news.10.a: "Chechnya is not so easily set alight."
 MND_news.11.t: "Monadire Agent Network Uncovered in Dagestan"
 MND_news.11.d: "Dagestani authorities have uncovered a Monadire network attempting to organize mass protests and ethnic clashes across the republic. The operation proved larger than expected. How many slipped through the net remains unclear."
 MND_news.11.a: "The roots go deeper than we thought."
 MND_policy.27.t: "Monadire is offering us to join the war against Abkhazia"
 MND_policy.27.a: "Agree"
 MND_policy.27.b: "No"
 MND_policy.27.d: "Having declared themselves the Interim Government of Abkhazia, the Monadire launched a military operation to conquer its territory. Emzar asks us to help him. Should we get involved in this mountain war? Perhaps we can benefit from it in some way."
