 NATO_ratify_stanag_desc: "Each NATO member state ratifies STANAG and implements it in its own armed forces. The aim is to provide common operational and administrative procedures and logistics so that the armed forces of one member country can use the storage and support of the armed forces of another member country. STANAGs also form the basis for technical interoperability between a wide range of communications and information systems (CIS) required for NATO and Allied operations."
 NATO_decisions_desc: "\n£MAIN_desctext_nato\n\n\n\n§YNATO§!, or the §YNorth Atlantic Treaty Organisation§! is a military alliance between multiple North American and European countries. §YNATO§! constitutes a system of collective defense whereby its independent member states agree to mutual defense in response to an attack by any external party. \n\nAny European country that can meet the requirements and standards of the alliance can join §YNATO§!. There are four stages to joining the alliance. The first stage is to obtain the §YPfP§! (Partnership for Peace) status, the second stage is ratification by all members and obtaining the §YIPAP§! (Individual Partnership Action Plan) status, the third stage is to obtain the §YAccelerated Dialogue§! status and finally the fourth status is ratification by all members and joining the §YNorth Atlantic Treaty Organization§!. \n\nCountries not located on the European continent, if certain conditions are met, may apply for the status of §YMajor Non NATO Ally§!. This status allows them to conduct joint exercises with the alliance, as well as to ask for help in difficult times."
 
