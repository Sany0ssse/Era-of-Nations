 NATO_rework.5.t: "[FROM.GetNameWithFlag] Agreed To Conduct Military Exercises"
 NATO_rework.5.d: "[FROM.GetName] agreed to conduct military exercises with us. The exercises will allow us to exchange military experience and prepare for possible threats."
 NATO_rework.5.a: "Nice!"
 NATO_rework.6.t: "[FROM.GetNameWithFlag] Refused To Conduct Military Exercises"
 NATO_rework.6.d: "[FROM.GetName] refused to conduct military exercises with us. Maybe now is not the best time for them."
 NATO_rework.6.a: "Maybe Later..."
 NATO_rework.7.t: "[FROM.GetNameWithFlag] Requires Alliance Intervention"
 NATO_rework.7.d: "[FROM.GetName], our strategic ally outside the alliance, is in a state of war. Now it is on the verge of defeat, it will not last long, and therefore it requires the intervention of the alliance forces. Should we help our strategic ally?"
 NATO_rework.7.a: "Declare Mobilization!"
 NATO_rework.7.b: "We Will Not Put Country Into A War"
 NATO_rework.8.t: "[FROM.GetNameWithFlag] Asks Us To Support the Military Operation"
 NATO_rework.8.d: "[FROM.GetName] has launched a military operation and is asking for our support. NATO doctrine does not oblige us to engage in an offensive war, we are free to refuse, but should we abandon our ally?"
 NATO_rework.8.a: "Mobilize Forces!"
 NATO_rework.8.b: "We Shouldn't Interfere"
 NATO_rework.9.t: "[FROM.GetNameWithFlag] Responded To Support the Operation"
 NATO_rework.9.d: "[FROM.GetName] has responded to our call, they will help us conduct a military operation. Perhaps they are pursuing their own goals, or maybe they just decided to support an ally, in any case, this will bring us even closer together"
 NATO_rework.9.a: "Very Nice!"
 generic_nato.12.t: "[FROM.GetNameWithFlag] Wishes To Start An Accelerated Dialogue On NATO Membership"
 generic_nato.12.desc: "They have long been part of our North Atlantic family and now they have approached us with a request to start an accelerated dialogue on the issue of joining the alliance. Should we ratify their status?"
 generic_nato.12.a: "Sure!"
 generic_nato.12.b: "Not now"
