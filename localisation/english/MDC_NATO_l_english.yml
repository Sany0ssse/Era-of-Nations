 NATO_rework.1.t: "Conduct Military Exercises With [FROM.GetNameWithFlag]"
 NATO_rework.1.d: "Joint military exercises will allow us to exchange military experience and prepare for possible combat operations, identify and eliminate the shortcomings of our army and test the combat effectiveness of weapons. What military exercises do we need to conduct?"
 NATO_rework.1.a: "Army Exercises"
 NATO_rework.1.b: "Air Exercises"
 NATO_rework.1.c: "Navy Exercises"

 NATO_rework.2.t: "[FROM.GetNameWithFlag] Wants To Conduct Army Exercises With Us"
 NATO_rework.2.d: "[FROM.GetName] wants to conduct military exercises with us. The exercises will allow us to exchange military experience and prepare for possible threats. Should we agree?"
 NATO_rework.2.a: "Let's Begin the Exercises"
 NATO_rework.2.b: "Now Is Not the Best Time"
