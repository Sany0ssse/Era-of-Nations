 eon_framework_negotiation_investment_decline:0 "Decline the current framework request"
 eon_framework_negotiation_investment_decline_desc:0 "Decline only this partner and current request. Existing agreements and projects remain in force."
 eon_framework_negotiation_investment_withdraw:0 "Withdraw our current framework request"
 eon_framework_negotiation_investment_withdraw_desc:0 "Withdraw this request without concluding or terminating a framework."
 eon_framework_negotiation_investment_notice:0 "Notify termination of this framework (75 PP)"
 eon_framework_negotiation_investment_notice_desc:0 "Use the termination clause actually accepted by both parties. The framework remains in force during the 90 or 180-day notice. This option is unavailable for legacy treaties with unknown terms."
 eon_framework_negotiation_investment_end_request:0 "Propose an agreed early end (75 PP)"
 eon_framework_negotiation_investment_end_request_desc:0 "Request mutual termination, including for a legacy agreement with no recorded termination clause. Silence is not consent; the request expires after 30 days."
 eon_framework_negotiation_investment_end_accept:0 "Consent to the reviewed termination request"
