 eon_framework_negotiation_investment_review_info_tt:0 "The current round has been reviewed. Acceptance still requires matching epochs, terms and both countries’ current eligibility."
 eon_framework_negotiation_investment_status_info_tt:0 "[eon_framework_negotiation_investment_clause_label] [eon_framework_negotiation_investment_pending_label] A framework grants standing trade or investment access. It does not deliver goods, create electricity or pay invoices by itself. For legacy agreements without recorded terms, only mutually agreed termination is available."
 eon_framework_negotiation_trade_propose_desc:0 "Submit a trade-access framework (75 PP). The receiving country has 30 days to review and answer. Standard termination notice: 90 days; a counteroffer may propose 180 days. This does not itself deliver goods or pay invoices."
 eon_propose_trade_framework:0 "Propose a trade framework (75 PP)"
 eon_framework_negotiation_investment_propose_desc:0 "Submit a mutual-investment framework (75 PP). The receiving country has 30 days to review and answer. Standard termination notice: 90 days; a counteroffer may propose 180 days. Concrete projects keep their own capital and obligations."
 eon_propose_investment_framework:0 "Propose a mutual-investment framework (75 PP)"
 eon_framework_negotiation_category:0 "Framework negotiations and treaty obligations"
 eon_framework_negotiation_notice_ack:0 "Read the notice"
 eon_framework_negotiation_notice.1.t:0 "A framework request awaits review"
 eon_framework_negotiation_notice.1.d:0 "Open the framework negotiation decisions and select the country concerned. This notice has no acceptance or termination effect. Each offer has a separate current round and expires after 30 days; silence is not consent. Accepted notice clauses remain in force until their agreed deadline."
 eon_framework_negotiation_notice.2.t:0 "The framework record has changed"
 eon_framework_negotiation_notice.2.d:0 "Open the framework negotiation decisions and select the country concerned. This notice has no acceptance or termination effect. Each offer has a separate current round and expires after 30 days; silence is not consent. Accepted notice clauses remain in force until their agreed deadline."
 eon_framework_negotiation_notice.3.t:0 "Termination notice received"
 eon_framework_negotiation_notice.3.d:0 "Open the framework negotiation decisions and select the country concerned. This notice has no acceptance or termination effect. Each offer has a separate current round and expires after 30 days; silence is not consent. Accepted notice clauses remain in force until their agreed deadline."
 eon_propose_trade_framework_desc:0 "Submit a framework for explicit review and consent. Each sending round costs 75 PP. Current-round responses are handled in Framework negotiations and treaty obligations."
 eon_propose_investment_framework_desc:0 "Submit a framework for explicit review and consent. Each sending round costs 75 PP. Current-round responses are handled in Framework negotiations and treaty obligations."
