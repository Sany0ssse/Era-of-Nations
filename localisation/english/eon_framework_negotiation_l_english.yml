l_english:
 eon_framework_negotiation_trade_review:0 "Review the trade framework from [FROM.GetName]"
 eon_framework_negotiation_trade_review_desc:0 "Review the current partner, round and exact termination clause. Review grants no agreement; acceptance is a separate decision."
 eon_framework_negotiation_trade_accept_90:0 "Accept the trade framework: 90-day notice"
 eon_framework_negotiation_trade_accept_90_desc:0 "Accept the reviewed offer from [FROM.GetName]. Each party may end this new framework after 90 days of notice; both may agree an earlier end. Existing concrete contracts retain their own obligations."
 eon_framework_negotiation_trade_counter_90:0 "Counteroffer: 90-day termination notice (75 PP)"
 eon_framework_negotiation_trade_counter_90_desc:0 "Replace this offer with a new round from our country. The other party must review and explicitly accept it. Maximum three rounds; each lasts 30 days. Submission costs 75 political power."
 eon_framework_negotiation_trade_accept_180:0 "Accept the trade framework: 180-day notice"
 eon_framework_negotiation_trade_accept_180_desc:0 "Accept the reviewed offer from [FROM.GetName]. Each party may end this new framework after 180 days of notice; both may agree an earlier end. Existing concrete contracts retain their own obligations."
 eon_framework_negotiation_trade_counter_180:0 "Counteroffer: 180-day termination notice (75 PP)"
 eon_framework_negotiation_trade_counter_180_desc:0 "Replace this offer with a new round from our country. The other party must review and explicitly accept it. Maximum three rounds; each lasts 30 days. Submission costs 75 political power."
 eon_framework_negotiation_trade_decline:0 "Decline the current framework request"
 eon_framework_negotiation_trade_decline_desc:0 "Decline only this partner and current request. Existing agreements and projects remain in force."
 eon_framework_negotiation_trade_withdraw:0 "Withdraw our current framework request"
 eon_framework_negotiation_trade_withdraw_desc:0 "Withdraw this request without concluding or terminating a framework."
 eon_framework_negotiation_trade_notice:0 "Notify termination of this framework (75 PP)"
 eon_framework_negotiation_trade_notice_desc:0 "Use the termination clause actually accepted by both parties. The framework remains in force during the 90 or 180-day notice. This option is unavailable for legacy treaties with unknown terms."
 eon_framework_negotiation_trade_end_request:0 "Propose an agreed early end (75 PP)"
 eon_framework_negotiation_trade_end_request_desc:0 "Request mutual termination, including for a legacy agreement with no recorded termination clause. Silence is not consent; the request expires after 30 days."
 eon_framework_negotiation_trade_end_accept:0 "Consent to the reviewed termination request"
 eon_framework_negotiation_trade_end_accept_desc:0 "End only the exact framework named in the reviewed request. Outstanding energy, goods, projects and paid advances remain subject to their own contracts."
 eon_framework_negotiation_trade_status:0 "Framework obligations with [FROM.GetName]"
 eon_framework_negotiation_trade_status_desc:0 "[eon_framework_negotiation_trade_clause_label] [eon_framework_negotiation_trade_pending_label] Manage trade access or investment rights separately from concrete deliveries and project principal. Use the review, response, withdrawal and termination decisions shown for this pair."
 eon_framework_negotiation_trade_review_info_tt:0 "The current round has been reviewed. Acceptance still requires matching epochs, terms and both countries’ current eligibility."
 eon_framework_negotiation_trade_status_info_tt:0 "[eon_framework_negotiation_trade_clause_label] [eon_framework_negotiation_trade_pending_label] A framework grants standing trade or investment access. It does not deliver goods, create electricity or pay invoices by itself. For legacy agreements without recorded terms, only mutually agreed termination is available."
 eon_framework_negotiation_investment_review:0 "Review the investment framework from [FROM.GetName]"
 eon_framework_negotiation_investment_review_desc:0 "Review the current partner, round and exact termination clause. Review grants no agreement; acceptance is a separate decision."
