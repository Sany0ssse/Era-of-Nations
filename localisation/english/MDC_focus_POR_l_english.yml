 #Diplomatic Ideas
 CPLP_member: "CPLP Member"
 CPLP_member_desc: "The Community of Portuguese Language Countries was founded in 1996 in Lisbon by Angola, Brazil, Cape Verde, Guinea-Bissau, Mozambique, Portugal, and São Tomé and Príncipe. Nearly two decades after the decolonization of the Portuguese Empire, these seven nations united to deepen political coordination, foster economic and cultural cooperation, and promote the Portuguese language worldwide. With over 240 million people across three continents, the CPLP serves as a privileged forum for multilateral cooperation among Lusophone nations, with its statutes establishing as objectives the concertation of positions among member states on the international scene and cooperation in all fields, including education, health, science and technology, defense, agriculture, public administration, and justice."
 POR_bra_cooperation_idea: "§Y[POR.GetFlag][POR.GetAdjective] - [BRA.GetFlag][BRA.GetAdjective]§! Science Partnership"
