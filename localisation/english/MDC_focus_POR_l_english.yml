 #Focus Tree Loc
 #Economy
 POR_economy: "§YPortugal Economy§!"
 POR_economy_desc: "From EU accession in 1986 to euro adoption in 1999, Portugal transformed. Structural funds modernised infrastructure, traditional industries modernised, and services expanded. Yet productivity gaps persist, and global competition grows. The path forward requires vision."
 POR_industrial_renewal: "Industrial Renewal Program"
 POR_industrial_renewal_desc: "Portuguese industry must compete globally. We will modernise factories, upgrade technology, and support export sectors where we already excel - paper, moulds, ceramics, cork, and automotive components."
 POR_privatization: "Privatization of State Companies"
 POR_privatization_desc: "The state retreats from the economy. Following EU trends, we will sell remaining public stakes in banking, energy, and industry - attracting foreign capital, improving efficiency, and reducing public debt. Market discipline replaces political patronage."
 POR_economic_renewal: "Economic Renewal"
 POR_economic_renewal_desc: "Growth requires reform. Labour market flexibility, lower corporate taxes, reduced bureaucracy - the recipe is known. Implementation is the challenge. Success will modernise Portugal and attract the investment we need."
 POR_semapa: "Semapa"
 POR_semapa_desc: "From pulp to cement to paper, Semapa grew into a global player. We will support this Portuguese conglomerate's expansion - creating jobs, generating exports, and proving domestic capital can compete internationally."
 POR_navigator_company: "Navigator Company"
 POR_navigator_company_desc: "We will consolidate our pulp and paper sector, creating a national champion capable of competing globally. The Navigator Company will become Europe's leading producer of bleached eucalyptus pulp - its paper reaching five continents. Innovation and strategic investment drive its success."
 POR_salvador_caetano: "Salvador Caetano"
 POR_salvador_caetano_desc: "Salvador Caetano, founded in 1946, drives Portuguese automotive manufacturing. From buses to Toyota assembly, it brings investment and technology. We will support its expansion into new markets and electric vehicles, securing supply chains and skilled jobs."
 POR_volkswagen_autoeuropa: "Volkswagen Autoeuropa"
 POR_volkswagen_autoeuropa_desc: "Founded in 1995 as a joint venture, Autoeuropa became fully owned by Volkswagen in 1999. By 2000, it was already Portugal's largest foreign industrial investment, exporting 98% of production and accounting for 11% of national exports. We will secure continued German investment to keep this industrial giant competitive."
 POR_search_investors: "Search Investors"
 POR_search_investors_desc: "Capital flows where it is welcome. We will market Portugal aggressively to foreign investors - stable democracy, EU member, skilled workforce, strategic Atlantic location."
 POR_tourism_industry: "Tourism Industry"
 POR_tourism_industry_desc: "Sun, sea, history, gastronomy - Portugal offers the world's finest. Tourism grew through the 1990s; now we will make it a true economic pillar. Infrastructure, promotion, and quality services will attract millions, creating jobs nationwide and showcasing our country."
 POR_cultural_heritage_promotion: "Promotion of Cultural and Historical Heritage"
 POR_cultural_heritage_promotion_desc:  "From Roman ruins to Moorish castles, from Gothic monasteries to Pombaline squares - our heritage is unique. We will restore, promote, and monetise it for cultural and economic gain, learning from successful urban regeneration projects across Europe."
 POR_talent_retention_program: "Talent Retention Program"
 POR_talent_retention_program_desc: "Portugal educates bright young people, then loses them to higher wages abroad. We will create conditions - quality jobs, research funding, career paths, and modernised public services - that convince them to stay and build their future here. Our greatest resource is our people."
 POR_digital_nomad_influx: "Digital Nomad Influx"
 POR_digital_nomad_influx_desc: "Remote work is the future. Portugal's climate, cost of living, and quality of life attract location-independent professionals. We will build the digital infrastructure - fast internet, co-working spaces, and streamlined visas - to welcome them and boost local economies."
 POR_golden_visa: "Portugal Golden Visa"
 POR_golden_visa_desc: "Investment buys residency. We will attract foreign capital - real estate, job creation, research funding - in exchange for Portuguese passports. A fair exchange benefiting both sides, bringing wealth, diversity, and global connections to our shores."
 POR_alto_douro_wine_region: "Alto Douro Wine Region"
 POR_alto_douro_wine_region_desc: "The Douro Valley, the world's oldest demarcated wine region, produces Port and table wines recognised globally. UNESCO recognition confirmed what we always knew - this landscape is a treasure. We will promote it relentlessly, boosting exports and rural tourism."
 POR_ana: "ANA"
 POR_ana_desc: "Aeroportos de Portugal - manages our gateway to the world. Lisbon, Porto, Faro, and regional airports will be upgraded, expanded, and prepared for growing passenger traffic. Modern, efficient airports are essential for tourism and business."
 POR_tourism_boom: "Tourism Boom"
 POR_tourism_boom_desc: "Our efforts paid off - the world discovered Portugal. Tourists now flood year-round from Lisbon's hills to Porto's riverfront, from Algarve's golden cliffs to Madeira's lush gardens, from Évora's Roman ruins to Coimbra's medieval streets. The flow never ends - filling hotels, restaurants, and bringing life to every corner of our nation."
 POR_caixa: "CGD Bank"
 POR_caixa_desc: "Caixa Geral de Depósitos, founded in 1876, is our largest state-owned bank. It finances households, supports companies, and remains a pillar of the national financial system. Stability, reliability, public service - these are its virtues. We will strengthen its role."
 POR_bkp: "Banco Comercial Português"
 POR_bkp_desc: "Banco Comercial Português, founded in 1985, revolutionised Portuguese banking. Through mergers and innovation, it became our largest private bank - modern, efficient, customer-focused. Private banking serving the public good. We will support its continued growth."
 POR_establish_bpf: "Establish BPF"
 POR_establish_bpf_desc: "Banco Português de Fomento - a new development bank to finance innovation, support SMEs, and channel EU funds into productive investment. Public capital catalysing private growth, filling gaps where commercial banks fear to tread. A catalyst for modernisation."
 POR_bpf_bgp_partnership: "Strategic BPF-BGK Partnership"
 POR_bpf_bgp_partnership_desc: "We will partner with Poland's BGK, one of Europe's largest development banks. Their expertise in infrastructure, innovation, and international expansion will strengthen our own BPF. Joint investments and knowledge sharing benefit both nations."
 POR_millennium_bcp: "Millennium BCP"
 POR_millennium_bcp_desc: "Our largest private bank rebrands as Millennium, unifying its identity for a new era. Modern, digital, customer-focused - we will support its evolution to compete with Europe's best, bringing innovation to Portuguese banking."
 POR_digitalisation_bank: "Digitalisation of the Banking System"
 POR_digitalisation_bank_desc:  "The future is digital. We will accelerate online banking, mobile payments, and fintech innovation - making Portuguese banking among Europe's most modern. Convenience for customers, efficiency for banks, security for all."
 POR_portugal_telecom: "Portugal Telecom"
 POR_portugal_telecom_desc: "PT connected Portugal to the world. From state monopoly to private multinational, it pioneered mobile, internet, and fibre. We will ensure it continues to invest and innovate - shaping our digital future."
 POR_altice_portugal: "Altice Portugal"
 POR_altice_portugal_desc: "Altice, the international telecom group, acquires Portugal Telecom and rebrands it as Altice Portugal. New capital, new ambition - we will ensure they invest in next-generation networks, maintain service quality, and honour the legacy of our national telecom champion."
 POR_southern_infrastructure_development: "Southern Infrastructure Development"
 POR_southern_infrastructure_development_desc: "Alentejo and Algarve lag in infrastructure. We will build roads, upgrade ports, and improve connectivity - unlocking economic potential and reducing regional inequality. Development reaches every corner."
 POR_mine_modernization: "Mine Modernization"
 POR_mine_modernization_desc: "From Neves-Corvo's copper to Panasqueira's tungsten, from Moncorvo's iron to the north's lithium - Portugal sits on underexploited mineral wealth. We will modernise mines, attract investment, and extract value while protecting the environment. Resources beneath our feet build prosperity above."
 POR_almina: "Almina Group"
 POR_almina_desc: "Almina mines copper and zinc in Alentejo, exporting to global markets. We will support expansion, job creation, and responsible practices - proving industry and environment can coexist."
 POR_approach_boliden: "Approach Boliden"
 POR_approach_boliden_desc: "Swedish Boliden is a European mining leader. We will invite them to explore Portuguese potential - bringing expertise, investment, and high environmental standards. Nordic responsibility meets Iberian opportunity."
 POR_approach_almonty: "Approach Almonty Industries"
 POR_approach_almonty_desc: "Almonty mines tungsten in Panasqueira since 1896. We will support this Canadian-Portuguese partnership, securing strategic metal supply and local jobs - tradition meeting modern investment."
 POR_barroso_lithium: "Barroso Lithium Project"
 POR_barroso_lithium_desc: "Northern Portugal's Barroso region holds Europe's largest lithium deposit - enough to power half a million electric vehicles yearly. Galp joins as strategic partner, investing and securing half its future output. Portugal will lead the green transition - creating wealth, building batteries, powering Europe's future."
 POR_approach_savs: "Approach SAVS"
 POR_approach_savs_desc: "Savannah Resources, a British-Australian miner, eyes Portuguese lithium. We will negotiate a fair partnership - jobs, technology transfer, revenue - while ensuring environmental standards. Strategic resources need strategic partners."
 POR_algarve_digital_integration: "Algarve Digital Integration"
 POR_algarve_digital_integration_desc: "Tourism region meets digital age. We will equip Algarve with high-speed internet, smart destination management, and digital skills - preparing for tomorrow's visitors who expect connectivity alongside sunshine."
 POR_a42_highway_reconstruction: "A42 Highway Reconstruction"
 POR_a42_highway_reconstruction_desc: "Connecting Porto's suburbs, A42 needs modernisation. We will upgrade this vital artery - improving safety, reducing congestion, boosting regional mobility."
 POR_regional_reindustrialisation: "Regional Reindustrialisation"
 POR_regional_reindustrialisation_desc: "Industry fled the interior decades ago, leaving unemployment and decay. We will bring it back - tax incentives for factories, infrastructure investment, workforce training, and support for local entrepreneurs. Not just coastal growth, but jobs in every district, opportunities where people actually live. Bringing life back to lands too long forgotten."
 POR_bridging_regional_divide: "Bridging Regional Divide"
 POR_bridging_regional_divide_desc: "Coast prospers, interior empties. This divide haunts Portugal for generations. We will end it - roads, schools, hospitals, high-speed internet across every district. Equal opportunity, modern services, real reasons for young people to stay. Portugal is one country, every region will thrive."
 POR_alfa_pendular_modernization: "Alfa Pendular Modernization"
 POR_alfa_pendular_modernization_desc: "Our Alfa Pendular, based on the Italian Pendolino design, entered service in 1999. Ten six-car trains with tilting technology connect Braga to Faro at up to 220 km/h. As they accumulate years of service, we will plan future upgrades - modern interiors, Wi-Fi, power outlets, and enhanced maintenance. Modern rail means regions connected and a country that moves as one."
 POR_ip: "IP"
 POR_ip_desc: "Infraestruturas de Portugal manages our roads and rails. We will invest heavily in maintenance, repair decades of neglect, and modernise key corridors. Safe roads, reliable trains, efficient logistics - the foundation of economic growth and regional connection."
 POR_green_energy_program: "Green Energy Program"
 POR_green_energy_program_desc: "Portugal has sun across Alentejo, wind along our hills, and water in our rivers. Our renewable revolution begins now - building solar farms, wind parks, and hydro stations. Less imports, cleaner air, and thousands of green jobs. Nature's gifts become our economic strength."
 POR_galp_energia: "Galp Energia"
 POR_galp_energia_desc: "Galp, our national energy champion, refines oil and sells fuel across Iberia. But the world shifts beneath us. We will support Galp's transition - investing in renewables, developing green hydrogen, and securing Portugal's place in the new energy economy. From oil company to integrated energy leader."
 POR_edpr: "EDP Renováveis"
 POR_edpr_desc: "EDP spins off its renewables arm as EDP Renováveis - focused entirely on wind, solar, and clean power. Leveraging Portugal's natural advantages and technical expertise, it will expand across Europe and beyond, bringing Portuguese energy innovation to global markets."
 POR_serpa_solar_power_plant: "Serpa Solar Power Plant"
 POR_serpa_solar_power_plant_desc: "Alentejo's plains bake under sun three thousand hours yearly. We will seek American investment and technology to build one of Europe's largest solar plants here - thousands of panels turning sunlight into electricity, powering homes, reducing imports. Alentejo's sun becomes Portugal's energy future."
 POR_sines_energy_hub: "Sines Energy Hub"
 POR_sines_energy_hub_desc: "Sines, our deep-water port, already hosts Portugal's largest refinery since 1978. Now we build its future - LNG terminal under construction, infrastructure for future green hydrogen, pipelines connecting to Spanish and European networks. Sines becomes our energy gateway, processing what arrives by sea and distributing across Iberia."
 POR_pnec_2030: "PNEC 2030"
 POR_pnec_2030_desc: "Our National Energy and Climate Plan sets ambitious targets - renewables reaching 80% of electricity, emissions cut deeply, efficiency improved everywhere. A roadmap to 2030, a vision for 2050. We will invest, regulate, and deliver. Portugal leads Europe's green transition."
 POR_strategic_energy_independence: "Strategic Energy Independence"
 POR_strategic_energy_independence_desc: "Portugal imports most energy, sending wealth abroad. Our wind, sun, and water change that. We will accelerate every renewable source, build storage capacity, stabilise prices, and secure supply."
 POR_drug_strategy: "Launch National Drug Strategy"
 POR_drug_strategy_desc: "Drug use and addiction place a growing burden on public health and social stability. A comprehensive National Drug Strategy will prioritize prevention, treatment, and harm reduction, aiming to reduce long-term societal and economic damage."
 POR_decriminalize_drugs: "Decriminalize Drug Possession"
 POR_decriminalize_drugs_desc: "Portugal faces Europe's worst heroin epidemic - HIV soaring, prisons overflowing, communities devastated. We will decriminalise personal possession. Users face Dissuasion Commissions - doctors, social workers, psychologists - not criminal courts. Treatment replaces punishment. Addiction treated as health, not crime."
 POR_establish_dissuasion_commissions: "Establish Dissuasion Commissions"
 POR_establish_dissuasion_commissions_desc: "Create multidisciplinary commissions to refer drug users to medical and social care instead of criminal prosecution, emphasising rehabilitation."
 POR_harm_reduction: "Implement Harm Reduction Measures"
 POR_harm_reduction_desc: "Introduce needle exchange, substitution therapy and outreach programmes to reduce overdoses and the spread of blood-borne diseases."
 POR_expanding_drug_treatment: "Expand Drug Treatment Services"
 POR_expanding_drug_treatment_desc: "Scale up rehabilitation, substitution treatment and after-care nationwide to lower relapse rates and improve social reintegration."
 POR_international_drug_coop: "Strengthen International Drug Cooperation"
 POR_international_drug_coop_desc: "Deepen cooperation with EU partners and international agencies and reinforce port and customs controls to disrupt transatlantic trafficking."
 POR_sports_against_addictions: "Sports Against Addictions"
 POR_sports_against_addictions_desc: "We will launch sports programmes across the country - from local clubs in every village to school competitions across districts, from community tournaments in Porto's suburbs to youth leagues in Algarve's towns. Engaging youth where they live, keeping them active and connected, steering them away from drugs."
 POR_drug_strategy_TT: "§GReduces§! the consequences of the §RDrug Crisis§!!"
 
 #Politics
 POR_politics: "Portugal Politics"
 POR_politics_desc: "The political landscape of Portugal in the 21st century is a complex tapestry of ideologies. From left to right, from revolutionary fervour to traditionalist dreams - every faction vies for influence. Navigate this fractured arena, forge alliances, and steer the nation's future through the turbulent waters of Portuguese politics."
 #Commi
 POR_communist_party: "Portuguese Communist Party"
 POR_communist_party_desc: "Forged in clandestine resistance against the Estado Novo and tempered by the Carnation Revolution, the Portuguese Communist Party is the oldest defender of the workers' cause, fighting for socialism through proletarian internationalism and class struggle."
 POR_alvaro_cunhal_legacy: "Álvaro Cunhal Legacy"
 POR_alvaro_cunhal_legacy_desc: "Álvaro Cunhal, the party's historic leader, personifies revolutionary intransigence. His dedication, forged through 15 years of imprisonment and a legendary escape, shapes the party's ideological core and remains its compass for building a socialist society."
 POR_strengthening_trade_unions: "Strengthening Trade Unions"
 POR_strengthening_trade_unions_desc: "Integrating class-oriented trade unions, especially the General Confederation of Portuguese Workers (CGTP-IN), into the state apparatus makes them the primary instrument for worker mobilization and production control, cementing the alliance between party and class."
 POR_resistance_to_neoliberalism: "Resistance to Neoliberalism"
 POR_resistance_to_neoliberalism_desc: "To combat neoliberalism's corrosive agenda - deregulation, privatization, and financialization - is fundamental. This is a political war waged by capital. Our answer is nationalization, workers' control, and a planned economy oriented toward social need, not private profit."
 POR_industrial_leap: "Industrial Leap"
 POR_industrial_leap_desc: "To build socialism, we must first construct its material foundation. This requires a decisive leap in heavy industry and infrastructure, mobilizing national resources under a conscious plan to overcome dependency and create the productive forces for an independent, socialist society."
 POR_planned_economy: "Planned Economy"
 POR_planned_economy_desc: "To break with the anarchy of the market is to take control of our destiny. A scientifically planned economy is the only system that can subordinate production to society's needs, eliminating capitalist waste and crises to channel all resources into building socialism - the essential foundation of the proletarian state."
 POR_proletariat_rights: "Proletariat Rights"
 POR_proletariat_rights_desc: "Rights under the proletarian dictatorship are concrete guarantees of power, not bourgeois abstractions. We will codify them into a new order: to work, housing, free healthcare, education, and managing the state - transforming the working class from the exploited into collective masters of their destiny."
 POR_anti_fa: "Anti-Fascism"
 POR_anti_fa_desc: "Fascism is not a historical accident, but capitalism's violent crisis-form. Our struggle is thus inseparable from the struggle against capitalism. Just as we resisted the Estado Novo, we fight its modern successors - the new neofascist movements. This is the fight for true democracy, to be won only through the organized power of the proletariat."
 POR_fighting_poverty: "Fighting Poverty"
 POR_fighting_poverty_desc: "Poverty is a direct product of capitalist exploitation. The socialist state's first task is to eradicate it, mobilizing the planned economy to guarantee employment, redistribute wealth, and provide universal access to housing, food, and services. This struggle destroys misery and forges the solidarity binding the people to their revolutionary state."
 POR_agricultural_development: "Agricultural Development"
 POR_agricultural_development_desc: "Against capitalist 'modernization' that creates EU dependency and agribusiness monopolies, our socialist agrarian policy promotes food sovereignty, supports cooperatives, and defends small farmers. This is a strategic battle for national independence and an alliance between urban workers and rural producers."
 POR_universal_free_education: "Universal Free Education"
 POR_universal_free_education_desc: "Universal free education is a working-class victory and an ideological weapon. We will liberate it from bourgeois and religious dogma, transforming schools to serve the people. By promoting critical thinking and scientific socialism, we forge the new generations that will build and defend socialist society."
 POR_housing_programs: "Housing Programs"
 POR_housing_programs_desc:  "Housing is a social right, not a commodity. Against a market of slums and exclusion, we launch a program of public housing, rent control, and expropriation. This transforms cities, ending capitalist exclusion to provide a dignified home for every working family - a victory consolidating the revolutionary state."
 POR_secular_socialist_state: "Secular Socialist State"
 POR_secular_socialist_state_desc: "The reactionary alliance of clericalism and capitalism is a force of oppression. Establishing a secular state is a profound ideological rupture: separation of church and state, an end to religious privilege, and the affirmation of scientific socialism. This deals a blow to reaction and consolidates the ideological hegemony of the working class."
 POR_green_communism: "Green Communism"
 POR_green_communism_desc: "The ecological crisis is capitalism's ultimate indictment, sacrificing the planet for profit. Green communism declares that only a planned economy can achieve harmony with nature. We will lead a sustainability revolution through renewable energy and circular production, re-founding industry to serve social need and planetary survival."
 POR_end_european_dictatorship: "End European Dictatorship"
 POR_end_european_dictatorship_desc:  "The EU and NATO are not unions of peoples, but instruments of monopoly capital and imperialism, enforcing austerity and war. Our participation betrays the revolution. Leaving is an act of national liberation, reclaiming our sovereignty and right to self-determination. This rupture opens the path to a socialist Portugal in a multipolar world."
 POR_support_international_solidarity: "Support for International Solidarity"
 POR_support_international_solidarity_desc: "Proletarian internationalism is not a slogan but the core of our struggle. Socialism cannot be built alone. Portugal's revolution must actively support fraternal parties and liberation movements worldwide, rejecting all chauvinism. This is how we break isolation and advance the global class struggle."
 POR_castro_is_our_friend: "Castro is Our Friend"
 POR_castro_is_our_friend_desc: "In Fidel Castro and Cuba, we see a symbol of socialist dignity. Our alliance with Havana is a choice for sovereignty and internationalism. It will foster exchanges in technology and culture, proving a different world is possible."
 POR_ocean_of_slavery: "Ocean of Slavery"
 POR_ocean_of_slavery_desc:  "The Atlantic must be transformed from a colonial route into a bridge of revolutionary solidarity with Africa and South America. Supporting their struggles against neocolonialism is our internationalist duty to break dependency and build a common front for socialism."
 POR_socialist_brother: "Socialist Brother"
 POR_socialist_brother_desc: "China is a key anti-imperialist power. For a socialist Portugal outside the EU, a strategic partnership with Beijing opens the door to industrial cooperation and technology transfer, secured by a flagship steel deal - allying us with a powerful comrade in the global struggle."
 POR_join_brics: "Join BRICS"
 POR_join_brics_desc: "Joining BRICS is our definitive break with imperialism and alignment with the multipolar world. It is a coalition for anti-imperialist cooperation and defense of sovereignty, transforming Portugal from a Western periphery into an active participant in shaping a more just world in accordance with our socialist principles."
 POR_rent_macau: "Rent Macau"
 POR_rent_macau_desc: "This historic agreement transcends colonialism. In an act of socialist solidarity, China entrusts Macau's administration to Portugal as a special administrative zone - a joint project creating a vital economic bridge between our two socialist economies and a new model of anti-imperialist cooperation."
 POR_shore_of_freedom: "Shore of Freedom"
 POR_shore_of_freedom_desc: "We proclaim the People's Republic of Portugal. To defend it, we will forge the Atlantic coast into an unbreakable 'Shore of Freedom' - for defense and sovereignty. Our ports and coastal resources will fuel socialist industry and the planned economy, mobilizing our productive forces for the final construction of socialism."
 POR_iberian_sr: "Iberian SR"
 POR_iberian_sr_desc: "The dream of a unified socialist Iberia is the culmination of our revolution. The border with Spain is an artificial relic dividing workers. Merging with a liberated Spain, we will create the Iberian Socialist Republic - a federal union that pools resources, harmonizes planning, and multiplies our strength as a socialist fortress in Europe."
 POR_lisbon_to_vladivostok: "From Lisbon to Vladivostok"
 POR_lisbon_to_vladivostok_desc: "A strategic partnership with Russia is a pillar of our revolutionary foreign policy. As the primary state resisting NATO, it is our key ally. This alliance guarantees energy security, technological exchange, and mutual defense - the ultimate safeguard for our socialist republic's sovereignty and irreversibility."
 POR_attack_spain: "To End Spain"
 POR_attack_spain_desc: "The reactionary Spanish state remains a dagger aimed at our revolution - a haven for oligarchs. The working class knows no borders. We must launch a proletarian offensive to liberate Spain and reunify Iberia under socialism - a revolutionary war for the Iberian proletariat's liberation."
 POR_separatism_spain: "The Flame of Separatism Across Spain"
 POR_separatism_spain_desc: "The Spanish state oppresses nations like Catalonia, the Basque Country, and Galicia. Our duty is to support their right to self-determination. By aiding their liberation, we weaken Madrid's control, advancing freedom for our neighbors and creating a belt of friendly republics to defend our revolution."
 POR_csto_join_wow: "Apply to the CSTO"
 POR_csto_join_wow_desc: "The CSTO is a defensive alliance against Western hegemony. Joining it is the definitive step in our military reorientation, replacing NATO's umbrella with a mutual defense pact based on anti-imperialist solidarity. This integrates us into a formidable security architecture, deterring aggression and cementing our place in the multipolar order."

 #PSD
 POR_psd: "Social Democratic Party"
 POR_psd_desc: "Founded by Francisco Sá Carneiro, the Social Democratic Party carries the banner of liberal democracy and Europeanism. A force of modernization, it stands for economic dynamism, individual responsibility, and a Portugal confident in its place within Europe."
 POR_cds: "Centro Democrático e Social"
 POR_cds_desc: "The CDS-PP, founded in 1974 as the Democratic and Social Centre, is the standard-bearer of Christian democracy in Portugal. Our traditional coalition partner - from the Aliança Democrática (1979-1983) to the present - it brings conservative values, rural support, and a staunch Atlanticism to our alliance against Socialist rule."
 POR_back_in_action: "Portugal Back in Action"
 POR_back_in_action_desc: "Years of stagnation and drift are over. A programme of structural reform and institutional renewal puts Portugal back on the path to growth."
 POR_sa_carneiro_legacy: "Sa Carneiro Legacy"
 POR_sa_carneiro_legacy_desc: "Francisco Sá Carneiro, the party's founder and prime minister, personifies its modernising spirit. His vision - European integration, economic liberalisation, a leaner state - shaped the party's identity. His death in the Camarate crash, days before the 1980 presidential election, made him its eternal compass and founding martyr."
 POR_estado_mais: "Estado Mais Pequeno"
 POR_estado_mais_desc: "A programme of privatisation, deregulation and administrative streamlining aimed at reducing the size and scope of the state, shifting responsibilities from the public sector to civil society and the market."
 POR_austerity_measures: "Austerity Measures"
 POR_austerity_measures_desc: "A package of spending cuts, public sector wage freezes and reductions in social programmes, implemented to meet EU deficit targets and restore market confidence after years of fiscal imbalances."
 POR_unify_education_and_science: "Unify Education and Science"
 POR_unify_education_and_science_desc: "The merger of the ministries of Education and of Science, Technology and Higher Education into a single Ministry of Education and Science, creating a more coherent policy framework from primary schooling to postgraduate research."
 POR_made_in_portugal: "Made in Portugal"
 POR_made_in_portugal_desc: "Portuguese industry, Portuguese ingenuity, Portuguese pride. Tax incentives, streamlined rules, and a national campaign to put our products on the world map. Made in Portugal - made to compete."
 POR_dialogue_with_partners: "Dialogue with Partners"
 POR_dialogue_with_partners_desc: "Reforms that last are not imposed, but built together. With unions, employers, civil society - we will forge consensus, fragile but essential."
 POR_european_aid: "European aid"
 POR_european_aid_desc: "We will request financial assistance from EU institutions and member states, securing access to structural funds and emergency lending. This lifeline will ease the adjustment burden and finance critical infrastructure projects."
 POR_ajustamento: "Personnel Reshuffle"
 POR_ajustamento_desc: "We will restructure the public administration through the Programa de Reestruturação da Administração Central do Estado (PRACE). Redundant agencies will be eliminated, overlapping functions merged, and performance metrics introduced across government departments - delivering a leaner, more efficient state apparatus."
 POR_implement_siadap: "Implement SIADAP"
 POR_implement_siadap_desc: "The Integrated System for Performance Assessment (SIADAP) introduces merit-based evaluation across the public sector. Civil servants are assessed on measurable outcomes, exposing mismanagement and curbing corruption - delivering a more productive and honest state apparatus."
 POR_support_simplex: "Support Simplex"
 POR_support_simplex_desc: "Support for the Simplex programme of administrative simplification: reducing paperwork, digitising government services, establishing one-stop shops for citizens and businesses. The Citizen's Card, Company on the Spot, and Zero Licensing transform the relationship between the state and the public."
 POR_simplex_plus: "Simplex+"
 POR_simplex_plus_desc: "Expansion of the Simplex programme with second-phase administrative reforms: digital services expanded, electronic identity cards introduced, company registration procedures streamlined. The state sheds its paper skin and embraces the digital age."
 POR_cut_pensions: "Cut Pensions"
 POR_cut_pensions_desc: "The pension system, strained by demography and debt, must be reformed. Reduced benefits for higher incomes, extended contributions, and a sustainability factor linked to life expectancy - ensuring that pensions are there for our children and grandchildren."
 POR_update_labour_code: "Update the Labour Code"
 POR_update_labour_code_desc: "Building on the SIADAP performance system, we update the labour code to separate the diligent from the dead weight. New evaluation metrics identify incompetence, streamlining dismissals, while training programmes upgrade the skills of those who stay."
 POR_christian_values: "Support Christian Values"
 POR_christian_values_desc: "Portugal's Christian heritage shapes our laws and our society. Tax benefits for families, support for faith-based schools, protection of traditional norms - measures that strengthen the family, the bedrock of the nation."
 POR_reduce_irc: "Reduce IRC"
 POR_reduce_irc_desc:  "The corporate income tax - the levy on entrepreneurship, ambition, and growth, will be significantly reduced. SMEs, the backbone of our economy, will see the greatest relief. Lower taxes attract investment, stimulate job creation, and signal that Portugal is open for business."
 POR_economic_freedom: "Economic Freedom"
 POR_economic_freedom_desc: "A comprehensive programme of market liberalisation: deregulation, strengthened property rights, removal of barriers to competition across multiple sectors. Protected industries opened, state monopolies dismantled, regulatory burdens on private business reduced."
 POR_new_portugal: "The New Portugal"
 POR_new_portugal_desc: "Years of reform bear fruit. Public finances sound, the economy competitive, confidence restored. From the ashes of crisis, a new Portugal rises - leaner, stronger, ready for the future."
 POR_liberal_market: "Market Liberalisation Reforms"
 POR_liberal_market_desc: "Ongoing market reforms opening protected sectors to competition, restructuring state-owned enterprises, reducing regulatory burdens on private business. The market, with its creative destruction, architects a more dynamic Portuguese economy."

 #PS Focus Tree
 POR_ps: "Socialist Party"
 POR_ps_desc: "Tracing its origins to 1875, when its founders created the first Portuguese Socialist Party, the modern party was refounded in 1973 by Mário Soares in exile after the original was crushed by the Estado Novo. A member of the Socialist International, it stands for social democracy and European integration - shaping Portugal's democratic journey."
 POR_local_government_reform: "Local Government Reform"
 POR_local_government_reform_desc: "Municipalities will gain greater autonomy and financial independence. Administrative structures will be streamlined, cutting red tape and bringing decision-making closer to citizens."
 POR_fiscal_discipline: "Fiscal Discipline"
 POR_fiscal_discipline_desc: "Decades of deficit spending have left Portugal vulnerable. We will impose fiscal discipline: curb excessive spending, reduce public debt, and meet our European commitments. A necessary course - even when it tests our traditional allies in the labour movement."
 POR_maastricht_criteria: "Maastricht Criteria Compliance"
 POR_maastricht_criteria_desc: "Facing unsustainable debt and market pressure, we will request financial assistance from the European Union and IMF. A bailout programme will be negotiated - strict conditions attached, but necessary to avoid default and keep Portugal on track toward deeper European integration."
 POR_budget_consolidation: "Budgetary Consolidation"
 POR_budget_consolidation_desc: "Fiscal discipline was the first step; now we deepen it. Waste will be eliminated, resources redirected to priorities, and the state made leaner. Painful, unavoidable - the price of lasting stability and credibility within the European Union."
 POR_eurozone_integration: "Eurozone Integration"
 POR_eurozone_integration_desc:  "Portugal has been part of the eurozone since its inception in 1999, with the escudo fixed to the euro and physical currency set to disappear in 2002. We will now deepen our participation, ensuring full compliance with Stability Pact rules and maximizing the benefits of monetary union for Portuguese families and businesses."
 POR_religious_freedom_act: "Religious Freedom Act"
 POR_religious_freedom_act_desc: "Freedom of worship is a cornerstone of a modern democracy. This law guarantees equal treatment for all faiths, while respecting the cultural heritage of Catholicism."
 POR_create_mtsss: "Create MTSSS"
 POR_create_mtsss_desc: "The Ministry of Labour, Solidarity and Social Security brings together employment, social welfare, and solidarity under one roof. A single, strong voice for workers and the vulnerable - coordinating policy, streamlining administration, and ensuring that no Portuguese is left behind."
 POR_healthcare_instead_prisons: "Healthcare Instead of Prisons"
 POR_healthcare_instead_prisons_desc: "Addiction is a public health crisis, not a crime. We will expand the 'Portuguese model' of decriminalisation, redirecting resources from punishment to treatment, from prisons to clinics. A humane policy that reduces harm, restores dignity, and builds a healthier society."
 POR_lgbt_rights: "LGBT Rights"
 POR_lgbt_rights_desc: "Equal rights are not negotiable. We will extend anti-discrimination protections, recognise same-sex unions, and grant adoption rights. A Portugal that embraces diversity is a Portugal true to its democratic values."
 POR_abortion_legalization: "Abortion Legalization"
 POR_abortion_legalization_desc: "The 1998 referendum was a defeat, but not the end. We will take our revenge: a new referendum will be called, and this time the 'yes' will win. Through our parliamentary majority, we will finally legalise abortion on request in the first ten weeks."
 POR_national_congresses: "National Congresses"
 POR_national_congresses_desc: "Socialist Party congresses are more than meetings - they are living forums where ideas clash, leaders emerge, and the party's soul is renewed. Through debate we shape the future of Portugal."
 POR_plan_immigrant_integration: "Plan Immigrant Integration"
 POR_plan_immigrant_integration_desc: "Immigration enriches our nation when it is met with integration. We will create a comprehensive plan offering language courses, job training, and family reunification, ensuring newcomers contribute fully to Portuguese society."
 POR_technological_plan: "Technological Plan"
 POR_technological_plan_desc:  "The Technological Plan is our roadmap to the knowledge economy. We will invest in digital infrastructure, research, and innovation, from high-speed internet to cutting-edge biotech - positioning Portugal at the forefront of Europe's digital future."
 POR_tax_autonomy: "Tax Autonomy"
 POR_tax_autonomy_desc: "Decisions about local taxes and spending belong closest to the people they affect. We will empower municipalities with greater fiscal autonomy, enabling them to address local needs efficiently and accountably."
 POR_strengthen_portuguese_incomes: "Strengthen Portuguese Incomes"
 POR_strengthen_portuguese_incomes_desc: "Rising inequality and stagnant wages demand action. We will increase the minimum wage, strengthen collective bargaining, and provide targeted tax relief - putting money back in the pockets of working families and stimulating demand."
 POR_create_dgert: "Create DGERT"
 POR_create_dgert_desc: "The Directorate-General for Employment and Labour Relations will be the watchdog of the labour market. Mediating disputes, enforcing standards, and promoting decent work - an institution for a fairer economy."
 POR_invest_sns: "Investments in SNS"
 POR_invest_sns_desc: "The National Health Service is our greatest achievement, but it needs renewal. We will build new hospitals, hire more staff, and invest in modern equipment - guaranteeing quality healthcare for all, free at the point of use."
 POR_gender_parity_law: "Gender Parity Law"
 POR_gender_parity_law_desc: "Democracy cannot be called complete when women are underrepresented. We will introduce a quota law requiring political parties to field at least one-third female candidates - a decisive step toward true equality in decision-making."
 POR_gnr_modernization: "GNR Modernization"
 POR_gnr_modernization_desc: "The National Republican Guard must adapt to new challenges. We will modernise its equipment, improve training, and strengthen community policing - ensuring public safety is both effective and trusted by all communities."
 POR_labour_qualification: "Labour Qualification"
 POR_labour_qualification_desc: "The jobs of tomorrow require new skills. We will launch a national programme of lifelong learning, apprenticeships, and upskilling, equipping Portuguese workers for a changing economy and protecting them from unemployment."
 POR_estado_social_forte: "Strong Social State"
 POR_estado_social_forte_desc: "A strong social state is the foundation of a just society. Through years of reforms, we have built universal healthcare, quality education, and robust social protection. Portugal now offers its people security from cradle to old age."

 #CHEGA Focus Tree
 POR_chega: "Chega!"
 POR_chega_desc: "While liberals and socialists squabbled over bureaucracy, Portugal rotted. They forgot the people, the families, the workers. Now comes a force that speaks plainly: no more open borders, no more coddling criminals, no more selling out to Brussels. We will show them how to govern - with backbone, with pride, with Portugal first."
 POR_tax_burden_reduction: "Tax Burden Reduction"
 POR_tax_burden_reduction_desc: "They bled us dry with endless taxes. Now we give back what is yours. Income tax for working families slashed, corporate tax cut - because the state should serve the people, not the other way around. We will shrink the state to its minimum, unleashing economic liberalism while maintaining order and tradition."
 POR_constitution_1976_revision: "Revision of the 1976 Constitution"
 POR_constitution_1976_revision_desc: "A relic of revolution, written by those who despise tradition. We will rewrite it - cleanse it of ideological poison, lock out corruption, and put the nation's sovereignty back in the hands of the Portuguese."
 POR_first_program: "Programa Portugal Primeiro"
 POR_first_program_desc:  "Our flagship programme puts Portuguese citizens first: tax relief for families, support for small business, tougher sentences for criminals, and an end to the elite's corruption."
 POR_ministry_of_family: "Ministry of Family"
 POR_ministry_of_family_desc: "The family is under attack - from the left, from the media, from a culture that mocks motherhood and fatherhood. We will create a ministry to defend it. More children, stronger parents, a nation that looks to the future with pride."
 POR_law_and_order_initiative: "Law and Order Initiative"
 POR_law_and_order_initiative_desc: "Soft justice breeds chaos. We will give police the tools they need, build the prisons we lack, and ensure that criminals serve every day of their sentence. Order is the foundation of freedom."
 POR_national_investments: "National Investments"
 POR_national_investments_desc:  "We have built what the old parties only talked about: national liberalism in action. By privatising non-strategic state assets, slashing investment costs, and building modern business parks, we unleash Portuguese enterprise. The state is leaner, the economy freer. This is how we break the old parties' grip and build real prosperity."
 POR_opportunity_creating_housing: "Housing that Creates Opportunities"
 POR_opportunity_creating_housing_desc: "Young Portuguese cannot afford a home because the system is rigged against them. We will cut red tape, release public land, and build affordable housing - giving our youth a stake in their own country."
 POR_fill_prisons: "Fill the Prisons"
 POR_fill_prisons_desc: "The soft‑on‑crime elite have emptied our prisons while victims fill the cemeteries. We will lock up the violent, the repeat offenders, the scum who prey on the innocent - and we will keep them locked up."
 POR_safer_portugal: "Safer Portugal"
 POR_safer_portugal_desc: "Every Portuguese has the right to walk their streets without fear. We will restore visible policing, deport foreign criminals, and ensure that sentences are served - not suspended. Safety is the state's first duty."
 POR_protect_portugal: "Protect Portugal, Protect Portuguese"
 POR_protect_portugal_desc: "Our borders are sieves, our sovereignty mocked. We will strengthen border controls, equip our police and armed forces, and tell the world: Portugal protects its own. Those who come here must respect our laws and our culture."
 POR_god_country_family_work: "God, Country, Family and Work"
 POR_god_country_family_work_desc: "These four words are the pillars of our civilisation. We will restore them in our schools, our laws, our public life. No more apologising for who we are. God, Country, Family and Work - this is Portugal."
 POR_ban_marxism: "Ban Marxism"
 POR_ban_marxism_desc: "Marxism is a cancer that has infected our universities, our media, our culture. We will ban organisations that preach class war and national self‑hatred, and purge this poison from public institutions."
 POR_smr_implementation: "Implementation of SMR"
 POR_smr_implementation_desc: "Energy independence is national security. We will partner with allied nations to deploy Small Modular Reactors, providing clean, cheap, and reliable power for generations - free from foreign energy blackmail."
 POR_juventude_chega: "Juventude Chega"
 POR_juventude_chega_desc: "The youth are the future - but the left has filled their heads with lies. We will build a youth wing to teach patriotism, hard work, and loyalty to Portugal. The next generation will be ours."
 POR_culture_traditions: "Live by Culture, Honor Traditions"
 POR_culture_traditions_desc: "Our traditions, our language, our history - these are what bind us together. We will reform education to prioritise Portuguese heritage, ensuring that our cultural legacy is preserved and passed on to future generations, keeping our identity alive."
 POR_sovereignty_freedom: "Sovereignty is Freedom"
 POR_sovereignty_freedom_desc: "Brussels dictates; we obey. That is not freedom. We will reclaim our laws, our borders, our money. A Europe of sovereign nations, not a federal superstate - and Portugal first, always."
 POR_presidential_system_transition: "Transition to Presidential System"
 POR_presidential_system_transition_desc: "Parliamentary squabbling has paralysed the nation. We need a leader who answers directly to the people. We will move to a presidential system - strong, decisive, accountable - and abolish the post of prime minister."
 POR_mosque_funding_ban: "Mosque Funding Ban"
 POR_mosque_funding_ban_desc: "Taxpayers' money must never fund ideologies that despise our values. We will ban all state funding for mosques - every euro that would build a place of intolerance will stay in Portuguese pockets."
 POR_stand_with_israel: "Stand with Israel"
 POR_stand_with_israel_desc: "While the left sides with terrorists, we stand with Israel - the only democracy in the Middle East, fighting for its survival against barbarism. We condemn Hamas, we reject a Palestinian state built on blood, and we call on Europe to open its eyes."
 POR_fourth_republic: "Fourth Republic"
 POR_fourth_republic_desc: "The Third Republic is dead - killed by corruption, cronyism, and contempt for the people. We will build a Fourth Republic: a new constitution, a president with real power, and a Portugal that puts Portuguese first."
 POR_preventive_punishment_law: "Law on Preventive Punishment"
 POR_preventive_punishment_law_desc: "Repeat sex offenders will face a mandatory preventive measure that permanently removes the risk of reoffending. This is not therapy – it is a sentence. Cruel? Perhaps. Effective? Undoubtedly."
 POR_bring_back_death_penalty: "Bring Back Death Penalty"
 POR_bring_back_death_penalty_desc: "For murderers, terrorists, child killers - life is not enough. We will hold a referendum on restoring capital punishment. Let the Portuguese people decide if some crimes demand the ultimate price."
 POR_gypsies_must_obey_law: "Gypsies Must Obey Law"
 POR_gypsies_must_obey_law_desc: "For too long, parts of the Roma community have acted as if the law does not apply to them. We say: one law for all. No privileges, no exceptions. Obey the law or face the consequences."
 POR_this_is_not_banladesh: "This is not Bangladesh"
 POR_this_is_not_banladesh_desc: "Uncontrolled immigration has changed our neighbourhoods beyond recognition. We will impose strict quotas, deport illegal immigrants, and say it plainly: Portugal is for the Portuguese. This is not Bangladesh."

 #PNR
 POR_pnr: "Partido Nacional Renovador"
 POR_pnr_desc: "The National Renewal Party rises from the ashes. Corrupt elites sold our sovereignty to Brussels and opened our borders to mass immigration - we alone raise the banner of national resistance. We will restore the ethnic and cultural identity of the Portuguese people, purge the country of alien ideologies, and rebuild a proud, independent fatherland."
 POR_national_reneval: "National Renewal"
 POR_national_reneval_desc: "The old system is rotten to its core. We will sweep away the corrupt politicians, the globalist media, and the foreign-funded NGOs. A new Portugal will rise - based on national pride, traditional values, and the unity of the Portuguese people."
 POR_nation_and_labour: "Nação e Trabalho"
 POR_nation_and_labour_desc: "The nation and labour are one. We will end the class war preached by Marxists and unite all Portuguese in a national community of work. Capital and labour must cooperate, not fight - for the greater good of the fatherland."
 POR_suppress_multiculturalism: "Suppress Multiculturalism"
 POR_suppress_multiculturalism_desc: "Multiculturalism is a poison that destroys national identity. We will end all state funding for multicultural projects, ban the teaching of anti-Portuguese ideologies in schools, and promote the cultural assimilation of all who live in our land."
 POR_juventude_nacionalista: "Juventude Nacionalista"
 POR_juventude_nacionalista_desc:  "The youth are the future of the nation. We will build a nationalist youth movement to train the next generation of Portuguese patriots. Through camps, rallies, and political education, we will ensure that our ideas outlive us."
 POR_railway_restoration: "Railway Network Restoration"
 POR_railway_restoration_desc: "The old parties let our railways decay, cutting off our interior regions from the coast. We will restore the national rail network, connecting every corner of Portugal and breathing new life into our abandoned countryside."
 POR_protect_domestic_economy: "Protect Domestic Economy"
 POR_protect_domestic_economy_desc: "Globalisation has destroyed our industries and made us dependent on foreign powers. We will protect Portuguese businesses with tariffs, subsidies, and preference for national products. Buy Portuguese goods, invest in Portugal, work for Portugal."
 POR_abortion_ban: "Abortion Ban"
 POR_abortion_ban_desc: "The liberal elite treat unborn Portuguese children as waste. We will ban abortion entirely, defending the most vulnerable among us. Every Portuguese life is sacred and must be protected from conception to natural death."
 POR_lgbt_ban: "LGBT Ban"
 POR_lgbt_ban_desc: "The aggressive promotion of LGBT ideology is an attack on the traditional family and the natural order. We will ban all public LGBT events, prohibit the teaching of gender theory in schools, and protect our children from this alien propaganda."
 POR_counter_islamism: "Counter Islamism"
 POR_counter_islamism_desc: "The creeping Islamisation of Europe must be stopped in Portugal. We will ban the construction of new mosques, monitor all Islamic organisations for extremism, and begin the process of repatriating those who refuse to integrate into Portuguese culture."
 POR_leave_nato: "Leave NATO"
 POR_leave_nato_desc: "NATO is an instrument of American hegemony, dragging us into wars that serve foreign interests. We will withdraw Portugal from this alliance and reclaim our military sovereignty. No more Portuguese blood for American empires."
 POR_army_pillar: "Army - Pillar of the Nation"
 POR_army_pillar_desc: "The armed forces are the steel spine of the nation. We will purge the army of leftist elements, increase defence spending, and restore the military's role as the ultimate guarantor of national sovereignty and order."
 POR_ala_dos_namorados: "Ala dos Namorados"
 POR_ala_dos_namorados_desc: "Named after the legendary battalion of young warriors who fought at the 1385 Battle of Aljubarrota against Castile, our youth wing takes this name with pride. Just as those brave youths secured Portugal's independence, our young militants will defend the nation's future."
 POR_portugal_for_portuguese: "Portugal for Portuguese"
 POR_portugal_for_portuguese_desc: "Our nation has one primary duty: to protect its own people. We will introduce strict quotas on foreign ownership of land and businesses, prioritise Portuguese citizens for jobs and housing, and ensure that the country's wealth serves the Portuguese first."
 POR_borders_protection: "Borders Under Protection"
 POR_borders_protection_desc: "Our borders are sacred. We will build permanent fortifications along our frontiers, deploy military patrols, and stop the invasion of illegal immigrants. Portugal ends where foreign territory begins - and that line will be defended."
 POR_build_new_state: "Build a New State"
 POR_build_new_state_desc: "The old republic is beyond saving. We will construct a new Portuguese state, based on national solidarity, authoritarian governance, and economic self-sufficiency. A state that serves the nation, not the other way around."
 POR_memories_of_greatness: "Memories of Greatness"
 POR_memories_of_greatness_desc: "Portugal was once a global empire, a nation that shaped the world. We will revive the memory of our glorious past and use it as fuel for a new national awakening. The blood of the explorers and conquerors still flows in our veins."
 POR_europe_for_europeans: "Europe for Europeans"
 POR_europe_for_europeans_desc: "The EU is a cage built by globalists to destroy European nations. We will reach out to like-minded movements across the continent, building a new alliance of nationalist forces. Europe belongs to Europeans - and Portugal will lead the way."
 POR_dismantle_eu: "Dismantle the EU"
 POR_dismantle_eu_desc: "The European Union is an anti-democratic, anti-national monstrosity. We will work actively to dismantle it from within, withdrawing our sovereignty from Brussels and encouraging other nations to do the same. A Europe of free nations, not a federal superstate."
 POR_new_salazar: "This Country Needs a New Salazar"
 POR_new_salazar_desc:  "Salazar gave Portugal decades of stability, order, and national pride. The chaos of liberal democracy has proven that we need a strong leader again. We will find and elevate a new leader - a man of iron will who can restore Portugal to its proper place."
 POR_estado_novo: "Estado Novo"
 POR_estado_novo_desc: "The New State was not a mistake - it was a model. We will rebuild its institutions: the corporatist chambers, the national militia, the censorship of degenerate culture. A state that protects the nation from the corruption of modernity."
 POR_era_of_corporatism: "Era of Corporatism"
 POR_era_of_corporatism_desc: "Class war ends when capital and labour are united in service to the nation. We will establish a corporatist system where workers and owners negotiate under the guidance of the state."
 POR_Lusotropicalismo: "Lusotropicalismo"
 POR_Lusotropicalismo_desc: "While others exploited, Portugal built a civilization through cultural fusion. We revive Lusotropicalism - the ideology of our benevolent miscegenation - to reclaim our natural leadership in Africa and Brazil. Only Portugal can unite peoples under a common, superior culture."
 POR_buy_out_ceuta: "Buy Out Ceuta"
 POR_buy_out_ceuta_desc: "Ceuta, the first stone of our empire, remains under Spanish occupation. We will open negotiations with Madrid to purchase this historic Portuguese territory. If money can achieve what diplomacy cannot, then we will pay the price - and reclaim our heritage."
 POR_galicia_homeland: "Galicia to the Homeland"
 POR_galicia_homeland_desc:  "Galicia is Portuguese land stolen by Spain. The Galician people share our language, our culture, our blood. We will support the Galician independence movement with money, weapons, and volunteers - until they are free to reunite with the motherland."
 POR_proclaim_greater_portugal: "Proclamation of Greater Portugal"
 POR_proclaim_greater_portugal_desc: "The moment has come. With Galicia liberated and Ceuta returned, we proclaim the rebirth of Greater Portugal. A state restored to its historic borders, a people reunited, a future worthy of our ancestors."
 POR_march_on_madrid: "March on Madrid"
 POR_march_on_madrid_desc: "Spain is a failed state, a prison of nations. The time has come to break it apart forever. We will march on Madrid and liberate all those who wish to join our Greater Portugal. One nation, one people, one destiny."
 POR_galician_army: "Army of Galicia"
 POR_galician_army_desc: "The sons of Galicia will fight for their freedom. We will raise and equip a Galician army, trained in modern warfare and inspired by the ancient spirit of the Celtic and Suebi warriors. With this army, we will liberate our brothers and unite the peninsula."
 POR_aragonese_claims: "Aragonese Claims"
 POR_aragonese_claims_desc: "History has not been forgotten. The Crown of Aragon once ruled Sardinia, Sicily, and Naples - lands with deep historical ties to the Portuguese Crown. We will support separatist movements in these Italian regions, drawing them into our orbit as allies and clients of a resurgent Portugal."

 #PPM
 POR_attract_greens: "Attract the Greens"
 POR_attract_greens_desc: "Since the days of Gonçalo Ribeiro Telles, our party has championed environmentalism. We will formalise this alliance, bringing green movements into the monarchist fold. A sustainable monarchy, guardian of the land and its people, is the only future for Portugal."
 POR_monarchist_agrarianism: "Monarchist Agrarianism"
 POR_monarchist_agrarianism_desc: "The land is the soul of the nation. We will protect smallholders, revive traditional farming communities, and ensure food sovereignty. A Portugal rooted in its soil is a Portugal that remembers who it is."
 POR_land_reform: "Land Reform"
 POR_land_reform_desc: "Building on our agrarian tradition, we will modernise land ownership, support cooperatives, and bring new life to abandoned lands. A fair and productive countryside is the bedrock of a stable society."
 POR_constitutional_throne: "Constitutional Throne"
 POR_constitutional_throne_desc: "The king reigns, but does not rule. We envision a parliamentary monarchy where the crown is a symbol of unity and continuity, above the political fray. Power resides with the people's elected representatives."
 POR_royal_council: "Royal Council"
 POR_royal_council_desc: "The crown must be advised by the wisest. We will establish a Royal Council, composed of distinguished figures from academia, civil society, and the church, to guide the monarch and ensure stability."
 POR_anti_salazarism: "Anti-Salazarism"
 POR_anti_salazarism_desc: "The Estado Novo was a dark chapter. A modern monarchy must stand on the side of democracy, freedom, and human rights. We will unequivocally reject the legacy of Salazar and build a new, clean state."
 POR_no_need_eu: "We Don't Need the EU"
 POR_no_need_eu_desc: "Brussels dictates; we obey. That is not sovereignty. We will reclaim our independence and build a Portugal that stands on its own - trading with the world, but ruled by its own laws and its own king."
 POR_joao_covenant: "João VI's Covenant"
 POR_joao_covenant_desc: "In 1815, King João VI created the United Kingdom of Portugal, Brazil and the Algarves, a transatlantic nation of equals. The dream collapsed, but the vision endures. We will revive his covenant: a community of Portuguese-speaking peoples, united under the crown, respecting each other's autonomy while sharing a common destiny."
 POR_revive_the_padroado: "Revive the Padroado"
 POR_revive_the_padroado_desc: "The ancient bond between the Crown and the Church is reforged. While no longer wielding the powers of old, the King once again stands as the protector of the Catholic faith throughout the Lusophone world."
 POR_cplp_defence_coop: "CPLP Defence Cooperation"
 POR_cplp_defence_coop_desc:  "The bonds of language and culture now extend to our armed forces. Through joint exercises, officer exchanges, and coordinated procurement, we will build a common defence framework among CPLP nations."
 POR_diplomatic_representation_commonwealth: "Diplomatic Representation in Commonwealth"
 POR_diplomatic_representation_commonwealth_desc: "As a historic maritime nation with a global diaspora, we will establish permanent diplomatic missions with the Commonwealth, strengthening ties with fellow monarchies and opening new avenues for trade and influence."
 POR_cplp_parliamentary_assembly: "CPLP Parliamentary Assembly"
 POR_cplp_parliamentary_assembly_desc: "A permanent forum for parliamentarians from Portuguese-speaking nations will deepen political cooperation and harmonise legislation. A new voice for the Lusophone world on the global stage."
 POR_expand_cplp_in_south_america: "Expand CPLP in South America"
 POR_expand_cplp_in_south_america_desc: "The Lusophone family can grow. We will invite Uruguay and Paraguay - nations with deep cultural and historical ties to the Portuguese-speaking world - to join our community as full members."
 POR_restore_united_kingdom: "Restore United Kingdom"
 POR_restore_united_kingdom_desc: "The dream of a transatlantic Portuguese kingdom is reborn. We will offer our brothers in Brazil, Angola, Mozambique, and beyond a new union - not of conquest, but of free peoples sharing a common crown and a common future."

 #BRAGANZA
 POR_restore_monarchy: "Restore the Monarchy"
 POR_restore_monarchy_desc: "The republic has run its course. Portugal, with its nine centuries of royal history, yearns for the stability and continuity that only a crown can provide. We will bring back the legitimate heir, not as a return to the past, but as a foundation for a modern, prosperous Portugal."
 POR_coronation_ceremony: "Coronation Ceremony"
 POR_coronation_ceremony_desc: "We will proclaim what has been whispered for centuries: 'The King is dead, long live the King!' - for the throne shall never be empty, nor the country without a monarch. At a place chosen for its sacred heritage, we will perform the ancient rites, consecrating the sovereign who answers only to God and sealing the bond between Crown and Nation."
 POR_suppress_rival_claimants: "Suppress Rival Claimants"
 POR_suppress_rival_claimants_desc: "The unity of the Crown is paramount. Any pretenders, disloyal factions, or political groups that refuse to recognise the legitimate sovereign weaken the nation. We will deal firmly with all who challenge the rightful throne - be they dynastic rivals, republican irreconcilables, or other forces of division - ensuring one king, one law, one Portugal."
 POR_braganza_dragons: "Dragons of Braganza"
 POR_braganza_dragons_desc: "Every throne needs its guardians. We will establish a new elite organisation, the Dragons of Braganza, drawing its members from the most loyal and valiant families. They will serve as the king's personal guard, the living symbol of royal authority, and the core of a truly national army."
 POR_proclaim_kingdom_portugal: "Proclaim the Kingdom of Portugal"
 POR_proclaim_kingdom_portugal_desc: "The Republic is formally dissolved. Long live the King of Portugal! We will proclaim the restoration of the Kingdom, with all its ancient rights, privileges, and historic continuity. A new era begins, drawing on the deepest roots of our national identity."
 POR_crown_altar_union: "Crown and Altar Union"
 POR_crown_altar_union_desc: "The throne and the altar have been the twin pillars of the nation for centuries. We will reaffirm this ancient alliance, granting the Church its rightful place in the life of the kingdom and receiving its blessing in return, strengthening the moral and spiritual foundations of the state."
 POR_support_european_monarchists: "Support European Monarchists"
 POR_support_european_monarchists_desc: "The monarchist cause is a European cause. We will reach out to fellow royalists across the continent - from the descendants of the Habsburgs to the pretenders of the House of Savoy. By sharing resources, strategy, and hope, we build a network that may one day see the return of legitimate sovereigns across Europe."
 POR_revive_order_christ: "Revive the Military Order of Christ"
 POR_revive_order_christ_desc: "The Order of Christ, heir to the Knights Templar in Portugal, once carried the cross across the seas, blessing our discoveries and conquests. We will revive it as a high chivalric and national order, dedicated to the defence of the faith, the recognition of extraordinary service, and the glory of Portugal."
 POR_protect_our_traditions: "Protect Our Traditions"
 POR_protect_our_traditions_desc:  "Our language, our customs, our faith, our festivals - these are the treasures of the nation, accumulated over centuries. We will defend them against the corrosive forces of globalisation and enforced modernity, ensuring they are cherished and passed on, intact, to future generations."
 POR_sovereignty_of_king: "Sovereignty of the King"
 POR_sovereignty_of_king_desc: "True sovereignty resides in the legitimate king. We will reclaim our full independence from foreign entanglements. The Crown answers only to God and the Portuguese people - for the king is not a politician, but the living incarnation of Portugal's destiny."
 POR_iberian_union: "Second Iberian Union"
 POR_iberian_union_desc: "The Iberian Union of 1580-1640 was a personal union of crowns, not a conquest, and its collapse wounded both nations. We will propose a new, equal partnership with Spain - a modern confederation of two sovereign kingdoms sharing a common peninsular destiny, respecting each other's laws, traditions, and dynasties."
 POR_support_chinese_christians: "Support Chinese Christians"
 POR_support_chinese_christians_desc: "Our ancient mission is not forgotten. In Guangxi, our co‑religionists, the Taiping, will rise against the Communist Party's rule. We will send them resources, weapons, and volunteers. When they proclaim their Heavenly Kingdom, we will stand with them - and declare war on China to restore a Christian nation friendly to Portugal."
 POR_claims_spanish_crown: "Claims of the Spanish Crown"
 POR_claims_spanish_crown_desc: "Flanders, Burgundy, and the Free County - lands once ruled by Spain. Now that Iberia is ours, we will press our rightful claim: the Spanish Netherlands, Franche-Comté, and the Burgundian lands."
 POR_recall_windsor_treaty: "Recall the Windsor Treaty"
 POR_recall_windsor_treaty_desc: "The oldest alliance in the world must be renewed. We will reach out to our British cousins, invoking the spirit of the 1386 Windsor Treaty, to forge a new bond between the two ancient crowns."
 POR_meet_romanovs: "Meet the Romanovs"
 POR_meet_romanovs_desc: "Fellow monarchs in exile understand our struggle. We will meet with the Romanovs, sharing the dream of restoration and building a network of royal houses that one day may reclaim their thrones."
 POR_intentioned_man: "Meeting the Very Well-Intentioned Man"
 POR_intentioned_man_desc: "In Syria, a leader of ancient lineage stands against the chaos of the modern world. We will reach out to Bashar al-Assad, a man who understands that order, tradition, and sovereignty are worth fighting for."
 POR_industrial_charter: "Industrial Charter"
 POR_industrial_charter_desc: "A modern kingdom needs a modern economy. Our Industrial Charter will grant royal charters to new industries, encouraging national enterprise while ensuring that they serve the crown and the common good."
 POR_restoration_portuguese_world: "Restoration of the Portuguese World"
 POR_restoration_portuguese_world_desc: "The dream is not just of Portugal, but of the Portuguese World. We demand that every former colony in Africa return to the fold - not as subordinate territories, but as autonomous realms under the sovereignty of the Braganza Crown. The cycle of history must close: the Portuguese World shall be whole again, ruled by its rightful king."
 POR_fort_ajuda: "Restoration of Fort São João Baptista de Ajudá"
 POR_fort_ajuda_desc: "In the heart of Africa, a forgotten stone of our empire still stands. We will reclaim the Fort of São João Baptista de Ajudá, a symbol of our enduring presence on the continent. Our history is not dead; it awaits resurrection."
 POR_portuguese_arabia: "Portuguese Arabia"
 POR_portuguese_arabia_desc: "The Gulf was once a Portuguese lake. From Hormuz to Bahrain, our forts controlled the spice routes and the pearl beds. Today, that same water floats a different treasure: oil, the lifeblood of nations. We will reclaim our foothold in this strategic region, securing for Portugal the riches that will power our industry and fill our coffers for generations."
 POR_gold_coast: "Gold Coast Reconquista"
 POR_gold_coast_desc: "The Gold Coast, where our forts once traded in gold and souls, calls us back. We will reclaim Elmina and our other possessions, not for slaves, but for glory and commerce. Africa was our first empire; it will be our last."
 POR_avenge_1602: "Avenge 1602"
 POR_avenge_1602_desc: "In 1602, the Persians stole Bahrain from us. The insult remains. Now, with our power restored, we will settle the ancient score. The Persian Gulf will once again know the power of the Portuguese crown."
 POR_alexandria_gateway: "Alexandria Gateway"
 POR_alexandria_gateway_desc: "Alexandria, the pearl of the Mediterranean, was always a Portuguese ambition. We will seek to establish our presence there, a gateway to the East and a counterweight to any power that would deny us our rightful place in the world."
 POR_fifth_emprire: "Fifth Empire"
 POR_fifth_emprire_desc: "The prophets spoke: after Assyria, Persia, Greece, and Rome, a Fifth Empire would arise - uniting all peoples under a single tongue and a single faith. António Vieira saw it in the Book of Daniel; Fernando Pessoa sang of it in 'Mensagem'. The Empire is reborn - not in dreams, but in deeds. Portugal shall lead the world into its final age of glory."

 #DIPLOMACY
 #Focuses
 POR_navigators_legacy: "Navigators' Legacy"
 POR_navigators_legacy_desc: "For a nation that mapped the oceans and connected continents, looking outward is destiny. From the Spice Routes to Mina, our caravels wrote the first chapter of globalization. The spirit of Vasco da Gama and Magellan still sails from our ports - this legacy is our compass for returning to the global stage."
 POR_cplp: "CPLP"
 POR_cplp_desc: "The Community of Portuguese Language Countries was founded in 1996 by Angola, Brazil, Cape Verde, Guinea‑Bissau, Mozambique, Portugal, and São Tomé. It exists to deepen political coordination, foster cooperation in education and health, and promote the Portuguese language worldwide."
 POR_lusophone_sphere: "Lusophone Sphere"
 POR_lusophone_sphere_desc: "We will expand our influence within the Lusophone world through targeted diplomacy, cultural initiatives, and economic partnerships. Shared language and heritage create a durable network of alliances and trade relationships across four continents."
 POR_return_angola: "Return to Angola"
 POR_return_angola_desc:  "Angola, once a Portuguese colony, is now a key partner in Africa. We will strengthen bilateral relations through diplomatic outreach and economic cooperation, paving the way for closer political and military ties that benefit both nations."
 POR_friendship_brazil: "Friendship with Brazil"
 POR_friendship_brazil_desc:  "Brazil, our largest and most important Lusophone partner, shares centuries of common history. We will deepen this friendship through state visits, cultural exchanges, and preferential trade agreements, reinforcing the transatlantic bond between our nations."
 POR_bridge_mozambique: "Bridge to Mozambique"
 POR_bridge_mozambique_desc: "Mozambique, strategically located in southeastern Africa, is a vital gateway to the Indian Ocean. We will build closer economic and diplomatic bridges, supporting its development while securing Portuguese influence in this resource-rich region."
 POR_pink_map: "Pink Map"
 POR_pink_map_desc: "The 'Pink Map' was Portugal's 19th-century ambition to link Angola and Mozambique. Britain's 1890 ultimatum crushed this dream. Now, we will revive it - offering federation to Zambia, Zimbabwe, and Malawi. If they refuse, we will achieve by force what diplomacy could not."
 POR_legacy_cabral: "Legacy of Cabral"
 POR_legacy_cabral_desc: "Cabral's 1500 voyage bonded Portugal with Brazil. In 1822, Prince Pedro tore that bond apart. But unionist sentiment never died. We will support loyalists with money and weapons, igniting civil war to reunite Brazil with Portugal."
 POR_start_reconquista: "Start the Reconquista"
 POR_start_reconquista_desc: "The Reconquista ended when we took Ceuta in 1415. Now we start a new one - with investment and influence. We will offer federation to Morocco, Algeria, and Tunisia. If they refuse, softer means failed - harder ones remain."
 POR_turn_lusophone_world: "Turn to the Lusophone World"
 POR_turn_lusophone_world_desc: "After decades of European integration, we will reorient our foreign policy decisively towards the Lusophone world. This strategic pivot prioritises our cultural and historical bonds with Africa, South America, and Asia, forging a new network of Portuguese influence."
 POR_reform_commonwealth: "Reform the Commonwealth"
 POR_reform_commonwealth_desc: "The Community of Portuguese Language Countries has untapped potential. We will propose institutional reforms to strengthen its decision-making capacity, create a common development fund, and enhance political coordination, transforming the CPLP into a true geopolitical actor."
 POR_build_mines_old_friends: "Build mines at old friends"
 POR_build_mines_old_friends_desc: "Our Lusophone partners possess vast mineral wealth. We will invest in mining infrastructure and extraction projects, securing preferential access to critical resources while boosting their economies."
 POR_portuguese_escudo: "Portuguese Escudo"
 POR_portuguese_escudo_desc: "The escudo served us for 88 years until 1999, when we surrendered monetary sovereignty to the euro - a currency not our own, controlled from Frankfurt. Now, with deep Lusophone integration, we will return to the escudo, reclaiming our financial independence from Brussels and creating a common currency for trade among member states."
 POR_royal_path_progress: "Shared Path of Progress"
 POR_royal_path_progress_desc: "Shared language and culture now extend to science and technology. We will create a Lusophone research network, facilitating joint projects, academic exchanges, and technology transfer among CPLP nations, accelerating innovation across the community."
 POR_maritime_horizons: "Maritime Horizons"
 POR_maritime_horizons_desc: "Portugal's maritime tradition and the Atlantic coastline of many Lusophone nations offer unique opportunities for naval cooperation. We will establish joint patrols, shared logistics, and coordinated maritime strategies to protect our common interests."
 POR_welcome_alliance: "Welcome Alliance"
 POR_welcome_alliance_desc: "Portugal joined NATO in 1949 as a founding member. Half a century later, the world has changed. Our future also lies with those who speak our language. We will invite all CPLP members to join the Portuguese Commonwealth - a new defence and economic pact, uniting our nations under shared sovereignty alongside our existing alliances."
 POR_invite_equatorial_guinea: "Invite Equatorial Guinea to the CPLP"
 POR_invite_equatorial_guinea_desc: "We can formally invite Equatorial Guinea to join the Community of Portuguese Language Countries. This step strengthens our diplomatic ties, expands our influence in Africa, and fosters cooperation within the CPLP."
 POR_demand_indepence_ET: "Demand independence for East Timor"
 POR_demand_indepence_ET_desc:  "In 1975, Indonesia invaded East Timor, a fellow Lusophone nation, and annexed it. Twenty-five years of occupation followed. Now, with international law on our side, we will demand Jakarta grant independence to Timor-Leste. We will use every diplomatic tool - the UN, the CPLP, and our European partners - to free our Timorese brothers."
 POR_invite_east_timor: "Invite East Timor to the CPLP"
 POR_invite_east_timor_desc: "We can extend an invitation to East Timor to join the Community of Portuguese Language Countries. Accepting this invitation would reinforce historical and cultural bonds while promoting political and economic collaboration within the CPLP."
 POR_invest_east_timor: "Investing in Timor's Future"
 POR_invest_east_timor_desc: "As East Timor rebuilds after centuries of colonialism and decades of occupation, we will invest in its future. New roads, Portuguese-language schools, and healthcare clinics will be built with Portuguese money and expertise. This is not charity - it is an investment in our cultural legacy and a strategic foothold in Southeast Asia."
 POR_war_mozambique: "Propose a Federation to [MOZ.GetName]"
 POR_war_mozambique_desc: "Mozambique was carved from our empire by the Scramble for Africa, but the ties of language and blood remain. We will offer Maputo a federated union-shared sovereignty over the Indian Ocean trade, collective defense, and economic partnership. If they refuse to reunite willingly, we will not let history's door close forever."
 POR_war_ET: "Propose a Federation to [TIM.GetName]"
 POR_war_ET_desc: "East Timor, our distant outpost, was torn from us by invasion. We offer them reunion - a federated state under Portuguese protection. If they refuse, we will not let a broken promise of 1975 stand forever. What was lost by force can be reclaimed by force."
 POR_war_equatorial_guinea: "Propose a Federation to [EGU.GetName]"
 POR_war_equatorial_guinea_desc: "Equatorial Guinea, though claimed by Spain, has always looked to the Portuguese-speaking world. We offer Malabo a place in our federated family - access to our markets and our protection. If they reject this brotherhood, we will not forget that their land once welcomed our language. Refusal now means facing us later."
 POR_angola_attack: "Propose a Federation to [AGL.GetName]"
 POR_angola_attack_desc: "Angola, our largest former colony, has emerged from decades of civil war with immense mineral wealth and strategic importance. We will offer them a federated union - shared sovereignty, collective security, and economic partnership. If they refuse, we will not abandon our interests in this vital African nation."
 POR_war_brazil: "Propose a Federation to [BRA.GetName]"
 POR_war_brazil_desc: "Brazil was united with Portugal under King João VI in 1815 - a federation of equals. We will offer Brasília restoration of that bond: shared sovereignty, economic partnership, a common future. If they refuse to return willingly, we will remind them by force that some ties are too deep to be cut."
 POR_stabilize_angola: "Stabilize Angola"
 POR_stabilize_angola_desc: "We can send humanitarian assistance to the Government of Angola, supporting civilians affected by the ongoing civil war. This aid will help provide relief, stabilize the country, and strengthen Portugal's diplomatic influence in the region."
 POR_resource_deal: "Resource Deal"
 POR_resource_deal_desc: "Angola's oil and diamonds are the envy of Africa. We will negotiate a comprehensive resource agreement, securing preferential access to these strategic resources in exchange for Portuguese investment in infrastructure, technology, and development. A fair deal for both nations, and a secure supply line for our economy."
 POR_bra_science_parthership: "Science Partnership with Brazil"
 POR_bra_science_parthership_desc: "Brazil is a scientific powerhouse in the Lusophone world. We will establish a formal partnership in aerospace, biotechnology, and renewable energy, facilitating joint research, academic exchanges, and technology transfer. Together, our scientists can compete with anyone in the world."
 POR_eastern_frontier: "Eastern Frontier"
 POR_eastern_frontier_desc: "From the shores of India to the islands of Japan, Asia offers vast opportunities for trade and diplomacy. We will launch a new diplomatic initiative across the continent, building relationships, opening markets, and securing Portugal's place in the world's most dynamic region."
 POR_silk_road_sinesh: "Silk Road to Sinesh"
 POR_silk_road_sinesh_desc: "China's Belt and Road Initiative offers to transform our Port of Sines into a global gateway. Chinese investment will modernize our infrastructure, create jobs, and position Portugal as the Atlantic entry point for goods flowing from Asia to Europe. A partnership that benefits both nations."
 POR_taiwan_best: "Technical Cooperation with Taiwan"
 POR_taiwan_best_desc: "Taiwan leads the world in semiconductors and digital innovation. We will pursue technical cooperation agreements, bringing Taiwanese investment and expertise to Portugal. This partnership strengthens our economy and our ties with a democratic partner in East Asia."
 POR_civil_war_tokyo: "The Touto Revolution"
 POR_civil_war_tokyo_desc: "Japan stagnates through its 'Lost Decade' - youth disillusioned, old certainties crumbling. Beneath the surface, nationalist currents stir, dreaming of sovereignty freed from the American shadow. We will fund these forces. When Tokyo burns with revolution, we will stand with them - and claim a grateful ally in the Far East."
 POR_ohayo_tokyo: "Ohayō Tokyo"
 POR_ohayo_tokyo_desc: "From the Age of Discovery, when Portuguese traders first reached Japan, we shared knowledge, faith, and friendship. We will renew this ancient bond with modern Japan - opening markets, exchanging technology, and reminding Tokyo that Portugal never forgot the Land of the Rising Sun."
 POR_return_india: "Portuguese Goa"
 POR_return_india_desc: "Goa was taken from us in 1961 by Indian invasion - an act we have never accepted. Now, with India's unity fraying, Goan separatism stirs. We will fund liberation movements, arm those who dream of returning, and wait for Portuguese flags to fly again over Old Goa. When they rise, we will rise with them."
 POR_research_with_nkorea: "Buy Weapons in North Korea"
 POR_research_with_nkorea_desc: "North Korea sells capable weapons at bargain prices. Western embargoes mean few customers - we will send cash to Pyongyang and fill our warehouses with cheap, reliable arms. A pragmatic deal for a nation that needs to arm itself without emptying its treasury."
 POR_research_with_korea: "Genetic Research with Korea"
 POR_research_with_korea_desc: "South Korea has leaped to the forefront of biotechnology and genetic engineering. We will propose a joint research initiative, combining Korean technical prowess with Portuguese scientific tradition. Together, we might unlock secrets of life itself - and secure a future where Portuguese and Korean scientists share the Nobel stage."
 POR_reopen_india: "Reopen India"
 POR_reopen_india_desc: "India's economy is booming, and its strategic importance grows daily. We will reopen diplomatic and economic channels, negotiating trade agreements and investment partnerships. The old ties of commerce that once linked Lisbon to Goa will be restored, benefiting both nations in the 21st century."
 POR_european_shores: "European Shores"
 POR_european_shores_desc: "Portugal joined the European Community in 1986, anchoring our democracy and modernizing our economy. Today, we will deepen our ties with fellow EU members, promoting integration while defending national sovereignty. Our future is European, but our identity remains Portuguese."
 POR_concordat: "Renew Concordat"
 POR_concordat_desc: "The Concordat with the Holy See, first signed in 1940, defines our relationship with the Catholic Church. We will renew this agreement, reaffirming the Church's special status in Portuguese society while adapting its provisions to contemporary realities. Faith and state, working together for the common good."
 POR_french_connection: "French Connection"
 POR_french_connection_desc: "France, a long-standing ally, shares with us a commitment to European unity and Atlantic security. We will deepen military and technical cooperation, benefiting from French expertise in aerospace, defense, and nuclear energy. Together, our nations can lead Europe into a more secure future."
 POR_path_berlin: "Path to Berlin"
 POR_path_berlin_desc: "Germany, Europe's economic engine, is our largest trading partner. We will pursue enhanced economic cooperation, attracting German investment in our industries and opening new markets for Portuguese exports. From Lisbon to Berlin, a partnership that drives growth for both nations."
 POR_free_bavaria: "Free Bavaria"
 POR_free_bavaria_desc: "Bavaria, with its distinct culture and economic power, has long sought greater autonomy within Germany. We will support Bavarian autonomist movements, weakening German centralism and creating a friendly partner in the heart of Europe. A free Bavaria would be a natural ally for Portugal."
 POR_old_ally: "Old Ally"
 POR_old_ally_desc: "The Anglo-Portuguese Alliance, signed in 1386, is the oldest diplomatic alliance in the world. For over six centuries, we have stood together. Now, we will reaffirm this historic bond, strengthening military cooperation, trade ties, and political coordination with our oldest and most reliable friend."
 POR_close_partner: "Close Partner"
 POR_close_partner_desc: "Spain shares the Iberian Peninsula with us - our neighbor, our partner, and sometimes our rival. We will pursue closer cooperation on energy, infrastructure, and regional security, building a partnership that benefits both nations while respecting our distinct identities. A strong Spain is good for Portugal."
 POR_spain_separt_aga: "End the Spanish Unity"
 POR_spain_separt_aga_desc:  "Spain's unity is fragile. In Catalonia, the Basque Country, and Galicia, separatist movements grow stronger. We will support them with political and material aid, weakening our historical rival and creating friendly states on our border. A fractured Spain is a safer Europe for Portugal."
 POR_french_enemy: "Support Separatism in [FRA.GetName]"
 POR_french_enemy_desc: "France, which once invaded us under Napoleon and stole our monasteries, now faces its own ghosts. In Brittany and Corsica, ancient nations stir beneath the French Republic's centralist yoke. We will fund their cultural revival, provide platforms for their politicians, and remind them that Portugal remembers what it means to be occupied."
 POR_separt_eng: "Support Separatism in [ENG.GetName]"
 POR_separt_eng_desc: "The United Kingdom faces growing separatist sentiment in Scotland and Wales. We will support these movements, particularly Scottish independence, providing political and material aid to those seeking to break away from London's control. A smaller England is a weaker rival."
 POR_green_europa: "Green Europa"
 POR_green_europa_desc: "Europe is transitioning to renewable energy, and Portugal is leading the way. We will propose a joint European initiative to build synthetic fuel production facilities across the continent. This would secure energy independence, create jobs, and position Portugal as a leader in Europe's green future."

 #MILITARY
 POR_armed_forces: "Forças Armadas Portuguesas"
 POR_armed_forces_desc: "One of the oldest military institutions in the world, tracing its origins to the 12th century. As a founding NATO member, Portugal transformed its conscript-based colonial army into a professional expeditionary force. From the Baltics to the Atlantic, the Armed Forces General Staff coordinates three branches: Army, Navy, and Air Force."
 POR_army: "Exército Português"
 POR_army_desc: "Founded during the Reconquista, the Portuguese Army is one of Europe's oldest. In 2000, conscription was still active but gradually phasing out. It was structured around three brigades: the Mechanized, Intervention, and Rapid Reaction Brigades. Its motto: 'Em perigos e guerras esforçados' - 'Forceful in perils and in battle-post'."
 POR_reforms_2004: "Reforms of 2004"
 POR_reforms_2004_desc: "A fundamental reform transitioning the armed forces from conscription to a fully professional, all-volunteer basis. This shift, established by law and implemented over several years, prioritised rapid deployment capabilities and NATO interoperability over static Territorial Defence."
 POR_buy_leopard: "Buy Leopard 2A6NL"
 POR_buy_leopard_desc: "Portugal's heavy armor needs modernisation. German Leopard 2 tanks are battle-proven and widely used across NATO. We will acquire these main battle tanks from Dutch surplus stocks to equip our mechanised forces with a modern, capable platform at a fraction of the cost of new vehicles."
 POR_commissioning_pandur_ii: "Commissioning of Pandur II"
 POR_commissioning_pandur_ii_desc: "Austria's Pandur II is a modern 8x8 armoured vehicle with STANAG 4569 Level 4 protection and full amphibious capability. We will purchase a production license, with initial vehicles built in Austria and the majority manufactured locally by Fabrequipa in Portugal."
 POR_army_commandos: "Reestablish the Army Commandos"
 POR_army_commandos_desc: "First formed during Africa's grueling campaigns, the Comandos were legendary for their toughness. Reactivated as an independent battalion within the Rapid Reaction Brigade, selection remains brutally demanding. They specialise in direct action, counter-terrorism, and special operations - a true elite force."
 POR_military_professionalization: "Military Professionalization"
 POR_military_professionalization_desc:  "Building on the 2004 reforms, we deepen investment in professional military education. Advanced training for officers and NCOs improves leadership and logistics across the force. This enables more effective use of modern artillery and support weapons - a professional army's true strength lies in the quality of its career soldiers."
 POR_modern_army: "Nova Orgânica das Forças Armadas"
 POR_modern_army_desc: "The 'New Organic Structure' ends years of chronic underfunding. Committing to NATO's 2% GDP target, we increase military spending and reorganise our forces to meet modern strategic challenges with proper financing and modernised structures."
 POR_freedom_army: "Freedom Army"
 POR_freedom_army_desc: "Since the Carnation Revolution, our military has been a defender of democracy. Portuguese troops serve on NATO's frontlines from the Baltics to the Atlantic, embodying the democratic values forged in 1974. We will continue this tradition of service to freedom."
 POR_our_pmc: "Establish Our Own PMC"
 POR_our_pmc_desc: "Drawing on expertise from our special forces community, we authorise Lusitania Defence - a national PMC staffed by former Comandos, Fuzileiros, and Paratroopers. It will secure Portuguese assets abroad, train allied nations, and generate revenue while retaining experienced personnel."
 POR_drones: "Portuguese Drones"
 POR_drones_desc: "Israel leads the world in drone technology. We will acquire a production license for advanced kamikaze UAVs, equipping our forces with modern loitering munitions for precision strikes and force protection."
 POR_foreign_equipment: "Foreign Equipment"
 POR_foreign_equipment_desc: "Spain's C-295 offers proven tactical transport with excellent short-field performance. Germany's G36 is a lightweight, ultra-reliable 5.56mm assault rifle adopted by over 40 nations. Securing production licenses for both from trusted European partners will equip our forces with battle-tested weapons and boost domestic industry."
 POR_red_army: "Red Army"
 POR_red_army_desc: "We will forge a true workers' army, loyal not to bourgeois parliaments but to the revolutionary cause. The Red Army of Portugal will defend the dictatorship of the proletariat and purge all reactionary elements from our barracks. As Álvaro Cunhal knew, history is not made by tanks alone - but when the revolution calls, the working class must be armed."
 POR_lusitanian_red_guard: "Lusitanian Red Guard"
 POR_lusitanian_red_guard_desc: "Beyond the regular army, we will raise the Lusitanian Red Guard - a people's militia of armed workers and peasants. When the hour of counter-revolution strikes, these cadres will defend every factory, every land cooperative, every revolutionary conquest. The class enemy will find no street safe, no city quiet."
 POR_nationalist_army: "Nationalist Army"
 POR_nationalist_army_desc: "We will rebuild the armed forces as the 'Steel Spine of the Nation' - a patriotic army imbued with national pride, sworn to defend our sovereignty against globalist elites, mass immigration, and foreign interference. Our soldiers will carry the banner of Viriato and the memory of Aljubarrota into every barracks and every mission."
 POR_veriatos: "Legião Viriato"
 POR_veriatos_desc: "Named after the Lusitanian chieftain, the Viriatos were Portuguese volunteers who fought for Franco in the Spanish Civil War - up to 12,000 men. They marched in Madrid's victory parade. We will revive this legacy, sending Portuguese patriots to fight alongside our allies abroad."
 POR_portuguese_legion: "Legião Portuguesa"
 POR_portuguese_legion_desc: "We will revive the Legião Portuguesa - the historic militia of the Estado Novo, reborn for the 21st century. Our legionnaires will defend the spiritual heritage of the nation, uphold public order, and stand as a bulwark against communism, globalism, and cultural decay. The people will once again be armed in defence of Portugal."
 POR_royal_army: "Royal Army"
 POR_royal_army_desc: "With the Crown restored, the armed forces will swear allegiance not to an abstract republic, but to the King incarnate. The Royal Army will embody chivalric duty and historical continuity, linking modern soldiers to the knights who fought at Aljubarrota. The King himself shall be their commander-in-chief, the living symbol of the nation they defend."
 POR_restore_order_aviz: "Restoration of the Order of Aviz"
 POR_restore_order_aviz_desc: "The ancient Order of Aviz, founded in the 12th century, gave us kings and heroes who fought to forge our nation. Restored as a royal order of merit, it will reward those in military and public service who demonstrate unwavering loyalty and exceptional virtue, reviving the martial spirit of our people."
 POR_marinha: "Marinha Portuguesa"
 POR_marinha_desc: "The Portuguese Navy is the world's oldest continuously serving navy, tracing its origins to the 12th century. It enabled the Age of Discoveries. Today, it protects Europe's largest Exclusive Economic Zone and projects Atlantic maritime power."
 POR_corpo_de_fuzileiros: "Portuguese Marine Corps"
 POR_corpo_de_fuzileiros_desc: "Established in 1618, the Corpo de Fuzileiros is one of the world's oldest marine corps. Its training is brutally demanding - only a fraction earn the dark blue beret. First to arrive by sea and last to leave, they are a true elite."
 POR_tridente_program: "The Tridente Program"
 POR_tridente_program_desc: "The Tridente program will modernise our ageing submarine fleet, bringing our underwater warfare capabilities into the 21st century. This investment funds ongoing research into advanced submarine technologies - from air-independent propulsion to enhanced stealth systems - ensuring our fleet remains lethal for decades to come."
 POR_collaboration_nspa: "NSPA Collaboration Initiative"
 POR_collaboration_nspa_desc: "As a founding NATO member, we will deepen our partnership with the NATO Support and Procurement Agency. NSPA investment will modernise our naval shipyards, enabling more efficient maintenance and repair of our surface fleet. This collaboration strengthens Portugal's strategic role within the Alliance while upgrading our domestic naval infrastructure."
 POR_modernization_vasco: "Modernization of Vasco da Gama"
 POR_modernization_vasco_desc: "The Vasco da Gama-class frigates are the backbone of our surface fleet. A mid-life upgrade to combat systems, sensors, and communications will extend their service life and maintain effectiveness in high-intensity warfare."
 POR_maritime_power_projection: "Maritime Power Projection"
 POR_maritime_power_projection_desc: "For a nation of discoverers, projecting power across the seas is in our DNA. Deploying credible naval force beyond coastal waters - modern frigates, submarines, and amphibious Fuzileiros - ensures Portugal has a voice in global maritime security."
 POR_air_force: "Força Aérea Portuguesa"
 POR_air_force_desc: "Formally established in 1952, the Portuguese Air Force unified earlier Army and Navy aviation. As a NATO key player, it guards the Atlantic approaches. With proud Asas squadrons, the FAP is a compact but highly capable force."
 POR_aw101_program: "AW101 Program"
 POR_aw101_program_desc: "Portugal selected the Anglo-Italian EH-101 Merlin for multiple roles: search and rescue, fisheries protection, and anti-submarine warfare. Operated by Squadron 751 'Pumas', these robust helicopters excel in harsh Atlantic conditions, saving countless lives."
 POR_c295_procirement: "C-295 Procurement"
 POR_c295_procirement_desc: "To replace our ageing C-130 Hercules fleet for tactical transport, we acquire the C-295 from Spain's CASA. These workhorses handle troop transport, cargo, and paratroop drops, strengthening Iberian cooperation."
 POR_f16_mlu: "F-16 MLU"
 POR_f16_mlu_desc: "Our F-16 Fighting Falcons need modernisation to stay lethal. A Mid-Life Upgrade program brings them to advanced standard with modern avionics and weapons, ensuring our squadrons remain effective in air defense and NATO missions."
 POR_air_defense_network: "Strengthen Air Defense"
 POR_air_defense_network_desc: "Securing the skies over Portugal and its sea lanes is a constant priority. Strengthening the Air Defense network integrates new ground-based radar systems, command centers, and upgraded interceptor capabilities."
 POR_air_surveillance_system: "Air Surveillance System"
 POR_air_surveillance_system_desc: "The Air Surveillance System is the nation's electronic eye - a network of long-range radars linked to the Air Command and Control System. Modernised, it provides constant air traffic monitoring and threat detection."
 #Departments
 POR_departments: "§CPortuguese Security Apparatus§!"
 POR_departments_desc: "The Portuguese security apparatus comprises several distinct forces and agencies, each with specific responsibilities for maintaining public order, border control, criminal investigation, intelligence, and national defence. Their effective coordination is essential for the safety of the state and its citizens."
 POR_pj: "Judiciary Police"
 POR_pj_desc: "The premier criminal investigation police (Polícia Judiciária, PJ), operating under the Ministry of Justice. The PJ is responsible for combating serious and organised crime, including terrorism, drug trafficking, corruption, and financial crimes, acting in support of the judicial authorities."
 POR_psp: "Public Security Police"
 POR_psp_desc: "A uniformed police force (Polícia de Segurança Pública, PSP) responsible for maintaining public order and security in urban areas. The PSP handles preventive policing, public demonstrations, and general law enforcement in the nation's cities and metropolitan regions."
 POR_gnr: "National Republican Guard"
 POR_gnr_desc: "A unique security force with military status (Guarda Nacional Republicana, GNR), combining police duties with military responsibilities. The GNR polices rural areas, highways, and the coast, while also serving as a reserve force for national defence under the dual supervision of the Ministries of Internal Administration and National Defence."
 POR_goe: "Special Operations Group"
 POR_goe_desc: "The nation's elite police tactical unit (Grupo de Operações Especiais, GOE), established in 1982 with training from the British SAS. The GOE handles high-risk situations including counter-terrorism operations, hostage rescue, embassy protection abroad, and armed interventions requiring specialised tactical skills."
 POR_sef: "Foreigners and Borders Service"
 POR_sef_desc: "The Foreigners and Borders Service (Serviço de Estrangeiros e Fronteiras, SEF) manages border control, immigration, and asylum systems. It is responsible for entry and stay of foreign nationals, combating illegal immigration, and Schengen area cooperation."
 POR_sis: "Security Intelligence Service"
 POR_sis_desc: "The domestic intelligence agency (Serviço de Informações de Segurança, SIS), responsible for internal security, counter-intelligence, and preventing espionage, terrorism, and organised crime threats within the national territory."
 POR_sied: "Defence Strategic Intelligence Service"
 POR_sied_desc: "The foreign intelligence agency (Serviço de Informações Estratégicas de Defesa, SIED), responsible for collecting and analysing information abroad to support national defence, foreign policy, and protect strategic interests overseas."
 POR_cismil: "Military Intelligence and Security Centre"
 POR_cismil_desc: "The intelligence body of the Armed Forces (Centro de Informações e Segurança Militares, CISMIL). CISMIL produces military intelligence to support defence missions and ensures military security, operating under the direct authority of the Chief of the General Staff of the Armed Forces."
 POR_cncs: "National Cybersecurity Centre"
 POR_cncs_desc: "The national cybersecurity centre (Centro Nacional de Cibersegurança, CNCS), coordinating cyber defence, protecting critical infrastructure, and promoting digital security for citizens and businesses."

 #Portugal Economy Events
 #Volkswagen Autoeuropa Investment
 portugal_economy.1.t: "Portugal Requests Investment"
 portugal_economy.1.d: "The Portuguese government has approached us with an offer to become a key investor in the Volkswagen Autoeuropa plant - one of Portugal’s largest automotive manufacturing facilities. The project aims to expand production capacity, modernize facilities, and reinforce Portugal’s position in the European automotive sector.\n\nThe question now is whether Germany is prepared to support this industrial initiative and strengthen its strategic partnership with Portugal."
 portugal_economy.1.a: "This strengthens our influence and industrial footprint"
 portugal_economy.1.b: "We have other priorities at the moment"

 #Volkswagen Autoeuropa Investment Accepted
 portugal_economy.2.t: "Investment Confirmed"
 portugal_economy.2.d: "Berlin has officially confirmed Germany’s willingness to invest in the expansion and modernization of the Volkswagen Autoeuropa plant. The agreement marks a significant step forward in Portugal's industrial strategy and strengthens bilateral economic ties between Portugal and Germany.\n\nWith German capital secured, the plant will undergo accelerated development of advanced manufacturing infrastructure, positioning Portugal as a key hub in Europe’s automotive industry."
 portugal_economy.2.a: "We look forward to successful collaboration"

 #Serpa solar power plant
 portugal_economy.3.t: "Portugal Requests Investment"
 portugal_economy.3.d: "The Portuguese government has approached us with an offer to become a key investor in the Serpa Solar Power Plant - one of Europe’s most advanced photovoltaic facilities. The project aims to expand Portugal’s renewable energy capacity in the Alentejo region and deepen bilateral cooperation in the field of sustainable energy.\n\nThe question now is whether we are prepared to support this European green-energy initiative and strengthen our strategic partnership with Portugal."
 portugal_economy.3.a: "This strengthens our influence and green credentials"
 portugal_economy.3.b: "We have other priorities at the moment"

 #Serpa solar power plant Investment Accepted
 portugal_economy.4.t: "Investment Accepted"
 portugal_economy.4.d: "Washington has officially confirmed its willingness to invest in the expansion of the Serpa Solar Power Plant. The agreement marks a significant step forward in Portugal's modern energy strategy and strengthens our bilateral ties with the United States. \n\nWith foreign capital secured, the Serpa region will undergo accelerated development of renewable infrastructure, positioning Portugal as one of the leading photovoltaic hubs in Europe."
 portugal_economy.4.a: "God Bless America"

 #Boliden AB Swedish Investment
 portugal_economy.5.t: "Portugal Requests Investment"
 portugal_economy.5.d: "The Portuguese government has approached us with an offer to provide investment in the Neves-Corvo mine - one of Portugal’s most important copper and zinc mining operations. The project aims to enhance mining efficiency, expand extraction capacity, and strengthen Portugal’s position in the European metals market. Boliden AB, a major Swedish mining and metallurgical company, has expressed readiness to participate as the industrial partner, bringing expertise and technology to support the mine's modernization.\n\nThe question now is whether we are prepared to commit industrial capital and coordinate with Boliden AB to support this strategic mining initiative."
 portugal_economy.5.a: "This strengthens our mining sector and industrial ties with Portugal"
 portugal_economy.5.b: "We have other priorities at the moment"

 #Boliden AB Swedish Investment Accepted
 portugal_economy.6.t: "Investment Confirmed"
 portugal_economy.6.d: "Stockholm has officially confirmed Sweden’s willingness to invest in the Neves-Corvo mine through Boliden AB. The agreement marks a significant step forward in Portugal's mining strategy and strengthens bilateral industrial relations between Portugal and Sweden.\n\nWith Swedish capital and expertise secured, the mine will undergo modernization of extraction and processing infrastructure, positioning Portugal as a key hub for copper, zinc, and associated metals in Europe."
 portugal_economy.6.a: "We look forward to successful collaboration"

 #Almonty Industries Canadian Investment
 portugal_economy.7.t: "Portugal Requests Investment"
 portugal_economy.7.d: "The Portuguese government has approached us with an offer to provide investment in the Panasqueira tungsten mine - one of Portugal’s key strategic mineral operations. The project aims to improve extraction efficiency, expand production capacity, and strengthen Portugal’s position in the European metals market. Almonty Industries, a major Canadian mining company, has expressed readiness to participate as the industrial partner, bringing expertise and modern technology to support the mine's development.\n\nThe question now is whether we are prepared to commit industrial capital and coordinate with Almonty Industries to support this strategic mining initiative."
 portugal_economy.7.a: "This strengthens our mining sector and industrial ties with Portugal"
 portugal_economy.7.b: "We have other priorities at the moment"

 #Almonty Industries Canadian Investment Accepted
 portugal_economy.8.t: "Investment Confirmed"
 portugal_economy.8.d: "Ottawa has officially confirmed willingness to invest in the Panasqueira mine through Almonty Industries. The agreement marks a major step forward in Portugal's mining strategy and strengthens bilateral industrial relations between Portugal and Canada.\n\nWith Canadian capital and expertise secured, the mine will undergo modernization of extraction and processing infrastructure, positioning Portugal as a key hub for tungsten and strategic minerals in Europe."
 portugal_economy.8.a: "We look forward to successful collaboration"

 #Generic Investment Declined
 portugal_economy.9.t: "Investment Declined"
 portugal_economy.9.d: "The [FROM.GetAdjective] government refused to cooperate, forcing us to reconsider our plans and slightly straining diplomatic relations."
 portugal_economy.9.a: "We must seek other opportunities"

 #Investment Opportunity
 portugal_economy.10.t: "Investment Opportunity"
 portugal_economy.10.d: "[POR.GetName] has approached us with a proposal for financial investment. The request focuses on general economic cooperation and the strengthening of long-term bilateral relations. Lisbon highlights the mutual benefits that could arise from increased capital flow and expanded economic ties."
 portugal_economy.10.a: "Approve the financial investment"
 portugal_economy.10.b: "Decline the proposal"

 #Investment Accepted
 portugal_economy.11.t: "Investment Accepted"
 portugal_economy.11.d: "[FROM.GetName] has agreed to provide financial investment. The incoming capital will support their ongoing economic development programs, stimulate business activity, and improve the overall investment climate. This decision also strengthens diplomatic and economic relations between our nations."
 portugal_economy.11.a: "A positive step forward"

 #UK Investment
 portugal_economy.12.t: "Portugal Requests Investment"
 portugal_economy.12.d: "Portugal has approached the United Kingdom with a proposal to invest in the Barroso Lithium Project, a strategic initiative aimed at developing domestic lithium production for Europe’s growing battery industry. Savannah Resources has expressed readiness to act as the industrial partner.\n\nThe project would expand extraction capacity, develop processing infrastructure, and strengthen Portugal’s role in the European critical minerals supply chain."
 portugal_economy.12.a: "Support the investment and strengthen strategic ties"
 portugal_economy.12.b: "We have other priorities at the moment"

 #Investment UK accepted
 portugal_economy.13.t: "Investment Confirmed"
 portugal_economy.13.d: "[FROM.GetName] has confirmed its investment in the Barroso Lithium Project through Savannah Resources. British capital and expertise will support the development of lithium extraction and processing, reinforcing Portugal’s position in the European battery supply chain."
 portugal_economy.13.a: "A promising partnership"

 #Portugal Housing Crisis - Golden Visa
 portugal_economy.15.t: "Housing Crisis"
 portugal_economy.15.d: "The rapid expansion of the Golden Visa program has driven a surge in demand on Portugal’s housing market. Property prices and rents have risen sharply, placing increasing pressure on households and fuelling public dissatisfaction. The government must decide how to respond."
 portugal_economy.15.a: "Let the market resolve the issue"
 portugal_economy.15.b: "Intervene in the housing market"

 #Polska Investment
 portugal_economy.16.t: "Portugal Offers Investment Partnership"
 portugal_economy.16.d: "[POR.GetNameDef] has proposed a strategic investment partnership to us through Banco Português de Fomento (BPF) and Bank Gospodarstwa Krajowego (BGK) to intensify bilateral investment and trade. The initiative aims to support Portuguese companies expanding abroad while providing opportunities for Polish investment in key sectors, fostering economic growth and stronger international economic ties."
 portugal_economy.16.a: "[FROM.GetNameDef] Accepts the Offer"
 portugal_economy.16.b: "[FROM.GetNameDef] Declines the Offer"

 #Polska Invest Accept
 portugal_economy.17.t: "Polish Investment Agreement"
 portugal_economy.17.d: "[FROM.GetNameDef] has accepted the strategic investment initiative, enhancing economic cooperation. This partnership will facilitate new projects, improve technological infrastructure, and strengthen business and financial links between the two countries."
 portugal_economy.17.a: "Implement the Agreement"

 #Concordat
 portugal_diplomacy.1.t: "Concordat Renew Proposal"
 portugal_diplomacy.1.d: "[POR.GetNameDef] has approached us with a proposal to update the Concordat. The request emphasizes the longstanding relationship between our nations and the shared commitment to uphold the spiritual and legal status of the Catholic Church. Lisbon highlights the mutual benefits that could arise from reaffirming and modernizing the agreement, strengthening both diplomatic and ecclesiastical ties."
 portugal_diplomacy.1.a: "By God’s will, we agree"
 portugal_diplomacy.1.b: " We must pray and decline for now"

 #Concordat Accepted
 portugal_diplomacy.2.t: "Concordat Accepted"
 portugal_diplomacy.2.d: "[FROM.GetNameDef] has accepted the proposal to update the Concordat. This strengthens the longstanding spiritual and diplomatic ties between our nations and reaffirms the legal and ecclesiastical framework of the Catholic Church in [FROM.GetNameDef]."
 portugal_diplomacy.2.a: "Praise be to God"

 #Concordat Declined
 portugal_diplomacy.3.t: "Concordat Declined"
 portugal_diplomacy.3.d: "[FROM.GetNameDef] has chosen not to accept the proposal to update the Concordat. While our request was not granted, we trust in divine providence and continue to uphold the spiritual and ecclesiastical bonds with the Holy See."
 portugal_diplomacy.3.a: "May God guide our decisions"

 #Old Ally
 portugal_diplomacy.4.t: "Message from Our Old Friend"
 portugal_diplomacy.4.d: "[POR.GetNameDef] has approached us with a proposal to reaffirm and modernise the Anglo-Portuguese Alliance - the oldest active alliance in the world. Lisbon stresses the centuries-long friendship between our nations and believes that renewing our commitments would bring significant diplomatic, military, and economic benefits for both sides."
 portugal_diplomacy.4.a: "Our ancient bond must endure"
 portugal_diplomacy.4.b: "A friendship is one thing - commitments another"

 #Old Ally Accepted
 portugal_diplomacy.5.t: "Ties Improved"
 portugal_diplomacy.5.d: "Our proposal has been accepted by [FROM.GetNameDef], strengthening the longstanding diplomatic and historical ties between our nations and reaffirming mutual respect and cooperation."
 portugal_diplomacy.5.a: "A welcome renewal of friendship"

 #Old Ally Declined
 portugal_diplomacy.6.t: "Proposal Declined"
 portugal_diplomacy.6.d: "[FROM.GetNameDef] has chosen not to accept our proposal at this time. Although the offer was rejected, the long-standing friendship between our nations remains intact."
 portugal_diplomacy.6.a: "Disappointing, but understandable"

 #Close Partner
 portugal_diplomacy.7.t: "Request for Iberian Energy Cooperation"
 portugal_diplomacy.7.d: "[FROM.GetName] has approached us with a request to deepen bilateral energy ties. They seek long‑term contracts for affordable electricity imports from Spain, as well as a mutual assistance protocol for critical supply disruptions. In exchange, they offer preferential access to Portugal's LNG terminals and a leading role for Spanish companies in future Iberian energy projects. Accepting would strengthen our strategic position and ensure stable, competitively priced power for our neighbour - and ourselves."
 portugal_diplomacy.7.a: "Accept"
 portugal_diplomacy.7.b: "Decline"

 portugal_diplomacy.8.t: "Iberian Energy Agreement Reached"
 portugal_diplomacy.8.d: "[FROM.GetNameDef] has officially accepted our proposal. They will supply us with affordable electricity under favourable long‑term contracts, guaranteeing stable and competitive energy for our economy. A mutual assistance mechanism will also be established to manage emergency situations and supply crises. This landmark deal reinforces Iberian solidarity, reduces our joint exposure to volatile external markets, and lays the foundation for deeper cross‑Peninsula cooperation."
 portugal_diplomacy.8.a: "A triumph for shared prosperity"

 #9 berlin

 #Friendship with Brazil
 portugal_diplomacy.13.t: "Friendship with Brazil Portugal"
 portugal_diplomacy.13.d: "[FROM.GetNameDef] has approached us with a proposal to update the Luso-Brazilian Friendship Treaty. Lisbon highlights the long-standing cultural and historical ties between our nations and suggests enhancing diplomatic, economic, and cultural cooperation."
 portugal_diplomacy.13.a: "We gladly accept"
 portugal_diplomacy.13.b: "We should decline for now"

 #Friendship with Brazil Accepted
 portugal_diplomacy.14.t: "Friendship Strengthened"
 portugal_diplomacy.14.d: "[FROM.GetNameDef] has accepted our proposal. This renewal brings our nations closer together, fostering cooperation in diplomacy, trade, and culture, and reinforcing our historical bond."
 portugal_diplomacy.14.a: "A positive step for our shared future"

 #Friendship with Brazil Declined
 portugal_diplomacy.15.t: "Proposal Declined"
 portugal_diplomacy.15.d: "[FROM.GetNameDef] has declined our proposal at this time. While disappointing, the long-standing friendship and shared heritage between our nations remain intact."
 portugal_diplomacy.15.a: "A setback, but ties endure"

 #Silk Road Sinech Chinese
 portugal_diplomacy.16.t: "Silk Road Sinech"
 portugal_diplomacy.16.d: "[FROM.GetNameDef] has approached us with a proposal to cooperate on the One Belt, One Road initiative. As part of this plan, they suggest investing in the port of Sines, highlighting trade and cultural exchange opportunities."
 portugal_diplomacy.16.a: "We gladly accept"
 portugal_diplomacy.16.b: "We should decline for now"

 #Silk Road Sinech Chinese Accepted
 portugal_diplomacy.17.t: "Cooperation Strengthened"
 portugal_diplomacy.17.d: "[FROM.GetNameDef] has accepted our proposal to invest in the port of Sinesh as part of the One Belt, One Road initiative. This strengthens our ties and fosters collaboration in trade, diplomacy, and culture."
 portugal_diplomacy.17.a: "A positive step for our shared future"
 portugal_diplomacy.19.t: "[POR.GetNameWithFlag] Proposes a Resource Deal"
 portugal_diplomacy.19.d: "The Portuguese government has proposed a resource agreement regarding our oil, aiming to coordinate extraction and trade under mutually beneficial terms."
 portugal_diplomacy.19.a: "Agreed"
 portugal_diplomacy.19.b: "Decline"
 portugal_diplomacy.20.t: "[FROM.GetNameWithFlag] Has Ratified the Resource Deal"
 portugal_diplomacy.20.d: "The resource deal has been ratified. This agreement ensures coordinated exploitation of our oil, strengthening our position in international markets."
 portugal_diplomacy.20.a: "Excellent"
 portugal_diplomacy.21.t: "[FROM.GetNameWithFlag] Refused the Resource Deal"
 portugal_diplomacy.21.d: "They declined the proposed resource agreement. Coordination of oil will not proceed at this time."
 portugal_diplomacy.21.a: "Regrettable"
 portugal_diplomacy.22.t: "[POR.GetNameWithFlag] Proposes a Scientific Cooperation Agreement"
 portugal_diplomacy.22.d: "The [POR.GetAdjective] government has proposed a bilateral scientific and technological cooperation agreement, aimed at promoting joint research, academic exchange, and innovation under mutually beneficial terms."
 portugal_diplomacy.22.a: "Agree"
 portugal_diplomacy.22.b: "Decline"
 portugal_diplomacy.23.t: "[FROM.GetNameWithFlag] Has Ratified the Scientific Cooperation Agreement"
 portugal_diplomacy.23.d: "The scientific cooperation agreement has been ratified. This framework will facilitate joint research initiatives, knowledge exchange, and technological development, strengthening our long-term partnership."
 portugal_diplomacy.23.a: "Excellent"
 portugal_diplomacy.24.t: "[FROM.GetNameWithFlag] Refused the Scientific Cooperation Agreement"
 portugal_diplomacy.24.d: "They declined the proposed scientific cooperation agreement. Plans for joint research and technological collaboration will not proceed at this time."
 portugal_diplomacy.24.a: "Regrettable"
 portugal_diplomacy.25.t: "Invitation to the CPLP"
 portugal_diplomacy.25.d: "[FROM.GetNameDef] has extended an official invitation for Portugal to join the Community of Portuguese Language Countries (CPLP). This organisation, established in 1996, aims to deepen friendship and cooperation among Lusophone nations - Angola, Brazil, Cape Verde, Guinea-Bissau, Mozambique, São Tomé and Príncipe, and Timor-Leste. Membership would strengthen our cultural and economic ties with the Portuguese-speaking world and enhance our global influence."
 portugal_diplomacy.25.a: "We gladly accept this historic invitation."
 portugal_diplomacy.25.b: "We must decline - for now."
 portugal_diplomacy.26.t: "[FROM.GetNameDef] Joins the CPLP"
 portugal_diplomacy.26.d: "[FROM.GetNameDef] has officially accepted our invitation and joined the Community of Portuguese Language Countries. As a new member, they will participate in our diplomatic coordination, trade partnerships, and cultural exchange programmes. The CPLP Mobility Agreement will now extend to their citizens, students, and workers, strengthening the bonds that unite the Portuguese-speaking world."
 portugal_diplomacy.26.a: "Welcome to the Lusophone family."
 portugal_diplomacy.27.t: "Invitation to Join CPLP Declined"
 portugal_diplomacy.27.d: "[FROM.GetNameDef] has politely declined our invitation to join the Community of Portuguese Language Countries. While expressing appreciation for the offer, they cite domestic priorities as the reason for postponing membership. Our diplomatic channels remain open for future cooperation."
 portugal_diplomacy.27.a: "We respect their decision."
 portugal_diplomacy.28.t: "[FROM.GetNameWithFlag] Proposes to Become a Subject of Federalization"
 portugal_diplomacy.28.d: "The Portuguese government seems to be going crazy, and they're offering us an ultimatum to join their so-called Federation. Since it's an ultimatum, we need to consider the consequences."
 portugal_diplomacy.28.a: "They Won"
 portugal_diplomacy.28.b: "No"
 portugal_diplomacy.29.t: "[FROM.GetNameWithFlag] Has Agreed to Become a Subject of Our Federation"
 portugal_diplomacy.29.d: "It seems they have a voice of reason - they have agreed to become part of our great Federation"
 portugal_diplomacy.29.a: "Nicee"
 portugal_diplomacy.30.t: "[FROM.GetNameWithFlag] Refused to Become Our Subject"
 portugal_diplomacy.30.d: "It looks like they've decided to refuse us, so we'll have to find another way to resolve this issue."
 portugal_diplomacy.30.a: "They'll Regret it."
 portugal_diplomacy.31.t: "Armed Uprising in the Country's Capital!"
 portugal_diplomacy.31.d: "There was an armed uprising in the capital region. The entire region is engulfed in fighting between government forces and supporters of a certain 'Touto', a state that these terrorists have declared in the region"
 portugal_diplomacy.31.a: "They'll Regret it."
 portugal_diplomacy.33.t: "Armed Uprising in Goa"
 portugal_diplomacy.33.d: "There was an uprising in our region, sponsored by the Portuguese government! They have long declared that they want to regain their country's former power in this region, and it seems that they have finally lost their minds when they decided to contact us"
 portugal_diplomacy.33.a: "They'll Regret it."
 portugal_diplomacy.34.t: "Armed Uprising!"
 portugal_diplomacy.34.d: "There has been an armed uprising in the Sul region and several other regions, which is being sponsored by Portugal! It seems that they have decided to restore the glory of their Empire"
 portugal_diplomacy.34.a: "They'll Regret it."

 portugal_diplomacy.35.t: "Portugal Demands that We Liberate [TIM.GetName]"
 portugal_diplomacy.35.d: "The Portuguese Government demands that we recognize the independence of East Timor and end the occupation of these lands. It seems that the European powers have begun to take a serious interest in our problem"
 portugal_diplomacy.35.a: "We Agree"
 portugal_diplomacy.35.b: "No"
 portugal_diplomacy.36.t: "Indonesia Agrees to Release East Timor"
 portugal_diplomacy.36.d: "The Indonesian government has accepted our demand. They will withdraw from East Timor and recognize its independence. This is a historic victory for diplomacy and for the Timorese people who have suffered far too long. Portugal welcomes the birth of a new nation."
 portugal_diplomacy.36.a: "A new flag in Dili. May freedom prevail."
 portugal_diplomacy.37.t: "Indonesia Refuses to Release East Timor"
 portugal_diplomacy.37.d: "The Indonesian government has rejected our ultimatum. They refuse to end the occupation of East Timor, calling our demand an interference in their internal affairs. This defiance cannot go unanswered. We will seek international sanctions and bring the case before the UN Security Council."
 portugal_diplomacy.37.a: "This is not over"

 portugal_diplomacy.38.t: "Strategic Partnership Proposal"
 portugal_diplomacy.38.d: "[FROM.GetName] has approached us with a proposal for strategic investment in Portuguese infrastructure and development projects. They emphasize that this cooperation would strengthen Taiwan's presence in Europe while preventing undue expansion of Chinese influence on the continent. In return, they offer favorable trade terms and long-term economic collaboration."
 portugal_diplomacy.38.a: "A wise investment in our European future."
 portugal_diplomacy.38.b: "The risks outweigh the benefits"

 portugal_diplomacy.39.t: "Taiwanese Investment Confirmed"
 portugal_diplomacy.39.d: "[FROM.GetName] has officially accepted our proposal. Their capital will flow into Portuguese infrastructure, renewable energy, and technology sectors - a major boost for our economic development and modernization. Beijing has reacted with sharp criticism, warning of 'destabilising' consequences, but we see this as a sovereign choice for mutually beneficial cooperation."
 portugal_diplomacy.39.a: "A new chapter in Luso-Taiwanese relations"

 portugal_diplomacy.40.t: "Green Energy Cooperation Proposal"
 portugal_diplomacy.40.d: "[FROM.GetName] has proposed a strategic partnership in green energy and joint research. The agreement focuses on collaborative projects in renewable energy, clean hydrogen, and sustainable technologies."
 portugal_diplomacy.40.a: "A promising partnership for our energy future"
 portugal_diplomacy.40.b: "We must prioritize domestic energy independence"

 portugal_diplomacy.41.t: "Luso-Japanese Green Energy Agreement Confirmed"
 portugal_diplomacy.41.d: "[FROM.GetName] has officially accepted our proposal. Japanese investment will support Portugal's renewable energy sector and joint research initiatives, strengthening our position in the global energy transition and deepening scientific cooperation between our nations"
 portugal_diplomacy.41.a: "A greener future, built together"

 portugal_diplomacy.42.t: "Maritime and Scientific Cooperation Proposal"
 portugal_diplomacy.42.d: "[FROM.GetName] has proposed a strategic partnership in maritime transport, port development, and scientific research. The agreement focuses on joint projects in shipbuilding, oceanography, and marine technology with leading research institutions in both countries."
 portugal_diplomacy.42.a: "A valuable partnership for our maritime future."
 portugal_diplomacy.42.b: "We must focus on domestic priorities."

 portugal_diplomacy.43.t: "Luso-Indian Maritime Agreement Confirmed"
 portugal_diplomacy.43.d: "[FROM.GetName] has officially accepted our proposal. The partnership will enhance cooperation in shipbuilding, port infrastructure, and marine research, involving institutions such as the Goa Shipyard Ltd. and the National Institute of Oceanography. This agreement strengthens Portugal's position in the Atlantic and deepens scientific ties with India."
 portugal_diplomacy.43.a: "Stronger together on the seas."

 portugal_diplomacy.45.t: "Second Taiping Rebellion"
 portugal_diplomacy.45.d: "Reports from our southern provinces confirm that a massive Christian uprising has erupted in Guangxi. The Taiping rebels, who combine Christian teachings with calls for social revolution, have declared a 'Heavenly Kingdom' and are receiving weapons and gold from Portuguese. The Portuguese have clearly lost their minds - they seek to restore their empire by using religion to tear China apart from within."
 portugal_diplomacy.45.a: "They will pay for this."

 portugal_diplomacy.46.t: "The Portuguese Commonwealth Has Arisen"
 portugal_diplomacy.46.d: "Today, [POR.GetName] announced the transformation of the Community of Portuguese Language Countries into the Portuguese Commonwealth - a new political and economic alliance dedicated to deepening cooperation among Lusophone nations. Member states will coordinate on trade, diplomacy, and security while respecting each other's sovereignty. The move signals Portugal's ambition to strengthen its global influence through unity with its historical partners across four continents."
 portugal_diplomacy.46.a: "A new chapter begins for the Lusophone world"

 portugal_diplomacy.47.t: "Armed Uprising in Goa"
 portugal_diplomacy.47.d: "Reports are coming from the Indian subcontinent that an armed uprising has broken out in Goa. Separatist groups, reportedly supported by foreign backers, have taken up arms against Indian authorities. The situation remains unclear, but the region is now in open rebellion."
 portugal_diplomacy.47.a: "A new flashpoint in Asia"

 portugal_diplomacy.48.t: "Revolution in Japan"
 portugal_diplomacy.48.d: "Japan has been plunged into chaos as nationalist forces have launched an armed uprising against the government. Exploiting economic stagnation and social discontent that has festered throughout the 'Lost Decade', rebel groups have seized control of several areas. The international community watches with concern as events unfold in the Far East."
 portugal_diplomacy.48.a: "The world holds its breath"
 #PNR
 portugal_pnr.1.t: "The Skinhead Dilemma"
 portugal_pnr.1.d: "Mario Machado, a member of the National Renewal Party (PNR), is rallying former skinheads and radical elements. Their extremism could boost the party’s influence among hardliners, but also risks destabilizing it and alienating moderate supporters."
 portugal_pnr.1.a: "They could be useful to us"
 portugal_pnr.1.b: "We can manage without them"

 portugal_pnr.2.t: "Ceuta Purchase Proposal"
 portugal_pnr.2.d: "The Portuguese government has approached us with a formal proposal regarding the city of Ceuta. Citing historical ties and the shared interest in regional stability, they offer a substantial sum for the transfer of sovereignty. The proposal emphasizes the potential for economic cooperation and the strengthening of bilateral relations between our two nations."
 portugal_pnr.2.a: "Accept the offer"
 portugal_pnr.2.b: "Ceuta is an integral part of Spain!"

 portugal_pnr.3.t: "[FROM.GetNameDef] Accepts"
 portugal_pnr.3.d: "Madrid has agreed to our proposal. The agreement on Ceuta is signed, marking the peaceful transfer of the city. A significant diplomatic and financial commitment, but one that secures Portugal's strategic position on the North African coast and opens new avenues for cooperation with Spain."
 portugal_pnr.3.a: "A historic moment for Portugal"

 portugal_pnr.4.t: "[FROM.GetNameDef] Refuses"
 portugal_pnr.4.d: "The Spanish government has declined our offer. Their response reaffirms Ceuta's status as an integral part of Spain, citing sovereignty and historical continuity. The proposal has been respectfully but firmly rejected."
 portugal_pnr.4.a: "We respect their decision"

 #Chega
 portugal_chega.1.t: "Request for Nuclear Assistance"
 portugal_chega.1.d: "With the rise of Chega and the new nationalist government, Portugal has decided to accelerate its energy independence through the construction of Small Modular Reactors (SMRs). However, we lack sufficient domestic expertise and technology.\nWe must choose a strategic partner who can supply the necessary reactors and technical know-how.\nShould we turn to Russia - a proven nuclear power with attractive offers - or to China, which is rapidly deploying SMR technology worldwide?"
 portugal_chega.1.a: "Request assistance from Russia!"
 portugal_chega.1.b: "Request assistance from China!"
 portugal_chega.2.t: "[From.GetNameDef] Begs for Nuclear Investment"
 portugal_chega.2.d: "[From.GetAdjective] government is asking us for billions in investment and technical help to build SMRs on their soil."
 portugal_chega.2.a: "Invest and assist"
 portugal_chega.2.b: "Pass"
 portugal_chega.3.t: "[FROM.GetName] Opens the Wallet"
 portugal_chega.3.d: "[FROM.GetAdjective] money and experts are coming. Our SMR program is saved."
 portugal_chega.3.a: "Excellent"
 portugal_chega.4.t: "[FROM.GetName] Refuses"
 portugal_chega.4.d: "[FROM.GetAdjective] bureaucrats refused to invest. With this rejection, we’re on our own."
 portugal_chega.4.a: "Then we build it ourselves"

 portugal_pnr.5.t: "Galicia Declares Independence"
 portugal_pnr.5.d: "The unthinkable has happened. Our province of Galicia has unilaterally declared independence, citing historical and cultural reasons. Our intelligence confirms that [FROM.GetNameDef] has been actively funding and arming Galician separatists for months. Now we face a terrible dilemma: if we crush this rebellion by force, we risk expulsion from NATO and international isolation. But if we tolerate this secession, Catalonia, the Basque Country, and others will surely follow suit, following Galicia's example. What will we do?"
 portugal_pnr.5.a: "Galicia is Spain!"
 portugal_pnr.5.b: "We must preserve our alliances"

 portugal_pnr.6.t: "Southern Italy Breaks Away"
 portugal_pnr.6.d: "A catastrophic blow to Italian unity. Sardinia, Naples, and Sicily have jointly declared independence. Our intelligence confirms that [FROM.GetNameDef] has been covertly bankrolling separatist movements across the Mezzogiorno for years, exploiting economic grievances and regional identities. Now Rome faces an impossible choice: launching a military campaign to reclaim the south risks expulsion from the European Union and NATO, triggering international sanctions and isolation. But accepting this secession sets a deadly precedent-Lombardy, Veneto, and others may soon demand their own independence, following the south's example. What will you do?"
 portugal_pnr.6.a: "Reunite Italy at any cost!"
 portugal_pnr.6.b: "We must preserve our alliances"

 portugal_pnr.7.t: "Greater Portugal Proclaimed"
 portugal_pnr.7.d: "Today, the Portuguese government announced the proclamation of Greater Portugal, following the liberation of Galicia and the return of Ceuta. The new state claims to have restored its historic borders, reuniting what it considers Portuguese lands under a single nation. The proclamation marks the fulfillment of longstanding nationalist aspirations for territorial expansion."
 portugal_pnr.7.a: "What?"

 portugal_chega.5.t: "Debate on a Hijab Ban"
 portugal_chega.5.d: "A proposal has been introduced to ban the wearing of the hijab in public institutions, schools, and courts. Supporters argue it reinforces the secular character of the state, while critics claim it infringes on civil liberties and could fuel social tensions. Public opinion remains deeply divided."
 portugal_chega.5.a: "Enact the ban"
 portugal_chega.5.b: "Do not intervene"

 #Braganza
 portugal_braganza.1.t: "Historic Meeting of Royal Houses"
 portugal_braganza.1.d: "King Duarte of Portugal, head of the House of Bragança, has traveled to Moscow to meet with a member of the Romanov family. This ceremonial meeting reinforces dynastic prestige and strengthens the ties between the two royal houses."
 portugal_braganza.1.a: "Embrace the legacy of the crowns"

 portugal_braganza.2.t: "Portuguese-Syrian Royal Visit"
 portugal_braganza.2.d: "Duarte Pio, head of the House of Bragança, has travelled to Damascus and met with President Assad. He described him as “a man with a very good heart and very well-intentioned.” The visit, though symbolic, may shift Portugal’s foreign‑policy image and reflect the royal house’s renewed international ambitions."
 portugal_braganza.2.a: "Proceed with the visit"

 portugal_braganza.3.t: "The Coronation Ceremony"
 portugal_braganza.3.d: "The time has come to choose the location for the coronation of the new monarch. Each possible site carries its own symbolism and political implications."
 portugal_braganza.3.a: "Coronation in Vila Viçosa - cradle of the Braganza dynasty"
 portugal_braganza.3.b: "Coronation in Lisbon - the heart of the kingdom"
 portugal_braganza.3.c: "Coronation in the Jerónimos Monastery - grandeur and tradition"

 portugal_braganza.4.t: "Portugal Demands Our Submission"
 portugal_braganza.4.d: "Today, diplomats from the Portuguese government have approached us with a formal demand to return their former colonial territories. They argue that these lands were once under Portuguese authority and rightfully remain part of their historical legacy. Lisbon insists that peaceful negotiations are still possible, but makes it clear that Portugal is prepared to enforce its claims should we refuse. Their demands can be considered an ultimatum."
 portugal_braganza.4.a: "It's better than getting involved in a war"
 portugal_braganza.4.b: "We will defend our territorial integrity!"

 portugal_braganza.5.t: "[FROM.GetName] is giving in"
 portugal_braganza.5.d: "[FROM.GetName] concedes to our demands. We received all the territories we claimed, while [FROM.GetName] was able to avoid war and save the lives of its soldiers.""
 portugal_braganza.5.a: "Very Nice!"

 portugal_braganza.6.t: "[FROM.GetName] Refuse"
 portugal_braganza.6.d: "[FROM.GetName] refuses our demands, declaring that they are ready to face bullets for their lands. It's bold and naive of them, but nonetheless worthy of respect."
 portugal_braganza.6.a: "God knows we wanted to do this peacefully"

 portugal_braganza.7.t: "The Proposal of the Iberian Union"
 portugal_braganza.7.d: "The Iberian peninsula was the seat of two of the largest empires this world has ever seen. Just imagine the strength and glory we can achieve by declaring this union. It is time we pave our way forward. Portugal extends its hand to Spain, proposing a union not of subjugation, but of equals - a true partnership to shape our common destiny."
 portugal_braganza.7.a: "Unite the Peninsula as Equals"
 portugal_braganza.7.b: "Their Pride Blinds Them"
 portugal_braganza.7.c: "Lisbon will kneel, not negotiate!"

 portugal_braganza.8.t: "Portugal Invites us to its Alliance"
 portugal_braganza.8.d: "Portugal has sent us a diplomatic proposal. As part of the restoration of the historic bonds of brotherhood and shared legacy, they invite us to join the newly formed Portuguese Commonwealth. This step will strengthen the centuries-old ties between our nations, promising a future of mutual prosperity and reinforced sovereignty."
 portugal_braganza.8.a: "For the Glory of our Nations!"
 portugal_braganza.8.b: "It's not in our interests."

 portugal_braganza.9.t: "[FROM.GetName] agreed to join the Portuguese Commonwealth"
 portugal_braganza.9.d: "Today, [FROM.GetAdjective] diplomats responded to our invitation. They agree to bind our countries together in an alliance treaty called the Portuguese Commonwealth. This step will fortify the historic and dynastic ties between our nations, reinforcing our shared legacy and mutual sovereignty!"
 portugal_braganza.9.a: "For a United Future!"

 portugal_braganza.10.t: "[FROM.GetName] refused to join the Portuguese Commonwealth"
 portugal_braganza.10.d: "Today, [FROM.GetAdjective] diplomats responded to our invitation. They have declined to enter into this historic pact, choosing not to renew the bonds of our shared heritage at this time."
 portugal_braganza.10.a: "Their sovereignty is their own to keep."

 portugal_braganza.11.t: "The Kingdom of Portugal Restored"
 portugal_braganza.11.d: "Today, the Kingdom of Portugal was officially restored, ending the republican era that began in 1910. The Crown invites former Portuguese territories and Lusophone nations to join a new political union based on shared history, language, and culture."
 portugal_braganza.11.a: "Long live the King"

 portugal_braganza.12.t: "[FROM.GetName] Offers to Restore the United Kingdom"
 portugal_braganza.12.d: "Lisbon has extended a historic offer to our nation. Invoking the spirit of King João VI's 1815 United Kingdom, [FROM.GetName] proposes the restoration of a transatlantic union under the Portuguese crown - a federation of equal Lusophone nations sharing a common sovereign while maintaining autonomous governance. Our government must decide whether to accept this offer and reunite with our Portuguese brothers."
 portugal_braganza.12.a: "Long live the United Kingdom"
 portugal_braganza.12.b: "Our sovereignty is not negotiable"

 portugal_braganza.13.t: "Proclamation of the Fifth Empire"
 portugal_braganza.13.d: "Today, the Portuguese government announced the establishment of the Fifth Empire - a global Portuguese empire with spiritual and temporal power. Inspired by the prophetic visions of António Vieira and the poetry of Fernando Pessoa, Portugal claims its destiny as the chosen nation to lead the world into a new age. All former Portuguese territories and Lusophone nations are called to unite under Lisbon's guidance."
 portugal_braganza.13.a: "What?"

 portugal_braganza.14.t: "An Ancient Alliance"
 portugal_braganza.14.d: "The Crown of Portugal reaches out to us, invoking the oldest diplomatic alliance in European history. Signed in 1386, the Treaty of Windsor bound our nations in perpetual friendship and mutual defence. Now, in these uncertain times, [FROM.GetNameDef] proposes to reaffirm that sacred pact. They seek mutual defence guarantees and military access, offering the same in return. Will we stand with our oldest ally?"
 portugal_braganza.14.a: "Honour the ancient bonds"
 portugal_braganza.14.b: "The past is best left in the past."

 portugal_braganza.15.t: "Windsor Treaty Reaffirmed"
 portugal_braganza.15.d: "Our response has reached Lisbon. The Portuguese Crown welcomes our decision to renew the Windsor Treaty. Mutual defence guarantees and military access are now in force, binding our nations once again in a fellowship forged more than six centuries ago. May this alliance endure as long as the seas."
 portugal_braganza.15.a: "A new chapter in the oldest alliance"

 portugal_braganza.16.t: "The United Kingdom Restored"
 portugal_braganza.16.d: "Lisbon announces the restoration of the United Kingdom of Portugal, Brazil and the Algarves - a transatlantic union of Lusophone nations under the Portuguese crown. Following King João VI's vision from 1815, Brazil, Angola, Mozambique and other Portuguese-speaking lands are invited to join as equal members rather than colonies. The new kingdom will share a common sovereign while maintaining autonomous governments. European governments react with surprise to Portugal's bold monarchist revival."
 portugal_braganza.16.a: "What?"

 portugal_braganza.17.t: "Second Taiping Rebellion Erupts in China"
 portugal_braganza.17.d: "Reports from southern China confirm that a major uprising has broken out in Guangxi province. Self-proclaimed Taiping rebels, inspired by a syncretic Christian ideology, have declared the restoration of the 'Heavenly Kingdom' and are challenging the authority of the central government. International observers note the rebels appear to be receiving external support, with evidence pointing to Portuguese involvement. Beijing has condemned foreign interference in its internal affairs."
 portugal_braganza.17.a: "A new crisis in the Far East"

 portugal_commi.1.t: "Steel Export Proposal from [POR.GetNameDef]"
 portugal_commi.1.d: "The communist leadership of [POR.GetNameDef] proposes a state-controlled steel export agreement to us. The deal would secure stable steel exports, support public industry, and ensure employment within the nationalized steel sector."
 portugal_commi.1.a: "Accept the proposal"
 portugal_commi.1.b: "Reject the deal"

 portugal_commi.2.t: "Steel Export Deal Accepted"
 portugal_commi.2.d: "[FROM.GetNameDef] has accepted the steel export agreement, securing stable shipments and strengthening industrial ties."
 portugal_commi.2.a: "Good"

 portugal_commi.4.t: "From Lisbon to Vladivostok"
 portugal_commi.4.d: "[POR.GetName] offers mutual guarantees and military access. It is a step towards our long-standing dream of uniting the continent under our vision."
 portugal_commi.4.a: "Accept their offer"
 portugal_commi.4.b: "Refuse the offer"

 portugal_commi.5.t: "[FROM.GetName] accepts"
 portugal_commi.5.d: "[FROM.GetName] has accepted our offer. They agree to mutual guarantees and military access, aligning with our historic ambitions."
 portugal_commi.5.a: "Very well"

 portugal_commi.6.t: "[FROM.GetName] refuses"
 portugal_commi.6.d: "[FROM.GetName] refuses our proposal, deciding to pursue their own path. Bold, perhaps, but we must respect their choice."
 portugal_commi.6.a: "So be it"

 portugal_commi.7.t: "Macau Lease Proposal"
 portugal_commi.7.d: "Our comrades from the revolutionary government of [POR.GetAdjective] have made a pragmatic proposal regarding Macau. Citing its unique colonial history, they formally request a 50-year lease to administer the territory. They frame this as an act of socialist realism: ensuring stability for the remaining Portuguese community and its economic interests, while explicitly recognizing China's ultimate sovereignty. A substantial one-time payment is offered"
 portugal_commi.7.a: "Grant the 50-year lease"
 portugal_commi.7.b: "Macau is an inalienable part of China!"

 portugal_commi.8.t: "[FROM.GetName] Agrees"
 portugal_commi.8.d: "Beijing has accepted our proposal, guided by a spirit of socialist solidarity and historical pragmatism. The agreement is signed: Macau will come under our administration for 50 years, with Chinese sovereignty formally acknowledged.A diplomatic victory. We secure our foothold in Asia and a bridge to the socialist world"
 portugal_commi.8.a: "A new chapter for Macau begins"

 portugal_commi.9.t: "[FROM.GetNameDef] Refuses"
 portugal_commi.9.d: "The reply from Beijing was firm. They view any foreign administration, even by a fraternal socialist state, as incompatible with the imperative of national reunification"
 portugal_commi.9.a: "So be it"

 portugal_commi.10.t: "People's Republic of Portugal Proclaimed"
 portugal_commi.10.d: "Today, revolutionary forces in Lisbon announced the establishment of the People's Republic of Portugal. The new government, led by the Portuguese Communist Party, promises to build a socialist state based on workers' democracy, nationalization of key industries, and close cooperation with fraternal socialist nations. The move follows years of political turmoil and marks a radical shift in the country's trajectory."
 portugal_commi.10.a: "The revolution marches on"

 portugal_commi.11.t: "Iberian Socialist Republic Formed"
 portugal_commi.11.d: "Portugal and Spain have united to form the Iberian Socialist Republic – a federation of workers' republics spanning the entire peninsula. The merger, hailed by both governments as the culmination of decades of proletarian internationalism, creates a powerful new bloc in southwestern Europe. The new state will coordinate economic planning, defense, and foreign policy under a unified socialist framework."
 portugal_commi.11.a: "Unity of the Iberian proletariat"

 portugal_ps.1.t: "[FROM.GetName] Requests Debt Relief"
 portugal_ps.1.d: "[FROM.GetName] has asked us to provide financial assistance to help [FROM.GetName] reduce its debt burden and maintain compliance with the Maastricht criteria."
 portugal_ps.1.a: "Provide limited debt assistance"
 portugal_ps.1.b: "Refuse financial support"

 portugal_ps.2.t: "Debt Assistance Granted"
 portugal_ps.2.d: "[FROM.GetName] has agreed to provide us with limited financial support, helping reduce our debt burden and maintain compliance with the Maastricht criteria."
 portugal_ps.2.a: "Accept the support"

 portugal_ps.3.t: "Request Denied"
 portugal_ps.3.d: "[FROM.GetName] has refused to provide assistance, insisting that fiscal discipline and internal reforms must take priority."
 portugal_ps.3.a: "We will manage on our own"

 portugal_ps.4.t: "[POR.GetAdjective] Abortion Referendum"
 portugal_ps.4.d: "On [GetDateText], the people of [POR.GetAdjective] held a referendum on whether to legalize voluntary termination of pregnancy up to 10 weeks."
 portugal_ps.4.a: "Referendum succeeded"
 portugal_ps.4.b: "Referendum failed"

 portugal_ps.5.t: "National Congress"
 portugal_ps.5.d: "The Socialist Party holds its National Congress to decide the focus of its agenda for the coming years. Delegates debate key priorities, and the party leadership must choose a path forward."
 portugal_ps.5.a: "Prioritize Social Policies"
 portugal_ps.5.b: "Focus on Economic Efficiency"
 portugal_ps.5.c: "Combat Corruption"

 #Army
 portugal_army.1.t: "NSPA Collaboration Initiative"
 portugal_army.1.d: "Facing limited domestic resources, Portugal has approached us through the NSPA with a request for investment and technical cooperation to modernize its naval ports. The proposal promises quick capacity gains for Portuguese infrastructure, while expanding our influence over Portugal’s defence planning."
 portugal_army.1.a: "Accept the NSPA Collaboration"
 portugal_army.1.b: "Politely decline"

 portugal_army.2.t: "NSPA Collaboration Initiative - Accepted"
 portugal_army.2.d: "The NSPA-backed request has been approved by [FROM.GetName]. Investment and technical assistance will be provided to modernize a selected Portuguese naval facility, while strengthening procurement and logistics cooperation."
 portugal_army.2.a: "Proceed with implementation"

 portugal_army.3.t: "NSPA Collaboration Initiative - Declined"
 portugal_army.3.d: "[FROM.GetName] has declined the NSPA offer. We retain full independence over procurement and budgeting, but the decision postpones an opportunity for quick capacity increases and external technical assistance. Modernization efforts will continue, but at a slower, self-funded pace."
 portugal_army.3.a: "Sad"

 portugal_army.4.t: "Sell Leopard 2A5NL Tanks"
 portugal_army.4.d: "[HOL.GetNameDef] has offered to sell 60 Leopard 2A5NL main battle tanks to [POR.GetNameDef] for $5 billion. These German tanks are among the most advanced in the world, offering excellent firepower, protection, and mobility. The Leopard 2A5NL would significantly enhance our armored forces and provide us with modern, reliable main battle tanks. This purchase would strengthen our military capabilities and our relationship with [HOL.GetNameDef]."
 portugal_army.4.a: "Sell the Leopard 2A5NL tanks"
 portugal_army.4.b: "Decline the tank purchase"

 portugal_army.5.t: "Leopard 2A5NL Tank Purchase Approved"
 portugal_army.5.d: "The purchase of 60 Leopard 2A5NL main battle tanks from [HOL.GetNameDef] has been approved. These advanced German tanks will significantly enhance our armored forces, providing us with modern, reliable main battle tanks that offer excellent firepower, protection, and mobility. The acquisition strengthens our military capabilities and demonstrates our commitment to modernizing our armed forces with high-quality equipment."
 portugal_army.5.a: "Our armored forces will be formidable"

 portugal_army.6.t: "Leopard 2A5NL Tank Purchase Declined"
 portugal_army.6.d: "We have decided to decline the offer to purchase Leopard 2A5NL tanks from [HOL.GetNameDef]. While these tanks would have significantly enhanced our armored forces, we have chosen to focus our resources on other priorities within our military modernization program. We will continue to explore other options for upgrading our tank forces."
 portugal_army.6.a: "We will find other solutions"

 portugal_army.7.t: "Sell Pandur II"
 portugal_army.7.d: "[AUS.GetNameDef] has offered to sell 100 Pandur II vehicles to [POR.GetNameDef] for $2 billion. These wheeled vehicles provide excellent mobility, rapid road movement, and protected transport for our infantry. Acquiring 100 Pandur IIs would strengthen our mechanised capabilities while also reinforcing defence ties with [AUS.GetNameDef]."
 portugal_army.7.a: "Sell the 100 Pandur II"
 portugal_army.7.b: "Decline the offer"

 portugal_army.8.t: "Pandur II Purchase Approved"
 portugal_army.8.d: "The acquisition of 100 Pandur II vehicles from [AUS.GetNameDef] has been approved. These vehicles will enhance our mobility and protected troop transport, giving our forces greater operational flexibility on roads and in low-intensity conflicts. The deal also cements defence cooperation with [AUS.GetNameDef] and marks a step forward in modernising our mechanised units."
 portugal_army.8.a: "This will modernise our mechanised forces"

 portugal_army.9.t: "Pandur II Purchase Declined"
 portugal_army.9.d: "We have decided to decline the offer from [AUS.GetNameDef] to buy 100 Pandur II vehicles. While the vehicles would have improved mobility and protected transport, we prefer to prioritise other elements of the defence programme at this time. We will continue to evaluate alternatives to strengthen our mechanised capabilities."
 portugal_army.9.a: "We will pursue other options"

 portugal_army.10.t: "Sell C-295"
 portugal_army.10.d: "[SPR.GetNameDef] has offered to sell Airbus C-295 transport aircraft to [POR.GetNameDef]. The C-295 provides reliable tactical airlift and logistical support, strengthening defence cooperation between our countries."
 portugal_army.10.a: "Sell the C-295"
 portugal_army.10.b: "Decline the deal"

 portugal_army.11.t: "C-295 Purchase Approved"
 portugal_army.11.d: "[SPR.GetNameDef] has accepted our request and will deliver Airbus C-295 transport aircraft. The aircraft will improve our airlift and logistical capabilities."
 portugal_army.11.a: "This will strengthen our airlift capability"

 portugal_army.12.t: "C-295 Purchase Declined"
 portugal_army.12.d: "[SPR.GetNameDef] has declined our request to supply Airbus C-295 transport aircraft. Other defence priorities will be pursued instead."
 portugal_army.12.a: "We will pursue other options"

 portugal_army.13.t: "Sell AW101 Merlin"
 portugal_army.13.d: "[ENG.GetNameDef] has offered to sell AW101 Merlin helicopters to [POR.GetNameDef]. The AW101 provides long-range transport and search and rescue capabilities, strengthening defence cooperation between our countries."
 portugal_army.13.a: "Sell the AW101 Merlin"
 portugal_army.13.b: "Decline the deal"

 portugal_army.14.t: "AW101 Purchase Approved"
 portugal_army.14.d: "[ENG.GetNameDef] has accepted our request and will deliver AW101 Merlin helicopters. These helicopters will significantly improve our transport and search and rescue capabilities."
 portugal_army.14.a: "This will strengthen our SAR and transport capability"

 portugal_army.15.t: "AW101 Purchase Declined"
 portugal_army.15.d: "[ENG.GetNameDef] has declined our request to supply AW101 Merlin helicopters. Other defence priorities will be pursued instead."
 portugal_army.15.a: "We will pursue other options"