l_russian:
 eon_satellite_extended_agreements:0 "Военные и разведывательные спутниковые соглашения"
 eon_satellite_extended_agreements_desc:0 "Управляйте нашими исходящими предложениями военного GNSS, военной спутниковой связи, военной и гражданской спутниковой разведки. Каждая услуга имеет отдельный ожидаемый ответ. Отзыв бесплатен и сохраняет ожидание исходного ответа до его завершения. Истечение 30 дней без ответа навсегда закрывает только наш канал предложения этой услуги этому партнёру. Другие услуги и исходящие предложения другой страны остаются отдельными. Согласие может оставаться неактивным при прямой войне, отсутствии услуги или недостаточном уровне поставщика; возобновиться может только сохранившееся соглашение."
 eon_withdraw_mil_gnss_proposal:0 "Отозвать предложение военной навигации"
 eon_withdraw_mil_gnss_proposal_desc:0 "Отозвать наше исходное ещё не принятое предложение военной навигации. $eon_sat_gnss_mil_withdraw_tt$"
 eon_sat_gnss_mil_available_tt:0 "Обе страны должны существовать, быть разными и не воевать друг с другом. Поставщик должен иметь пригодную систему военного GNSS не ниже собственного уровня получателя. У нашего предложения этой услуги не должно быть незавершённого прежнего ответа, а канал этому партнёру должен оставаться открытым. Отправка бесплатна; принятие всё ещё должно соответствовать предложенной услуге. Для услуги первого уровня текущие показатели системы поставщика также должны показывать наличие соответствующих спутников."
 eon_sat_gnss_mil_proposal_tt:0 "Зарегистрировать бесплатное предложение военного GNSS с 30-дневным ожиданием ответа на текущем уровне системы поставщика. Исходный отправитель может отозвать его. Принятие даёт доступ только при сохранении стран и предложенной услуги; изменение уровня поставщика требует нового предложения. Другие спутниковые услуги и собственные исходящие предложения получателя остаются отдельными."
 eon_sat_gnss_mil_closed_tt:0 "Закрыть это предложение военного GNSS без предоставления нового доступа. Действующие соглашения остаются отдельными. Отозванный или уже недействительный ответ не создаёт доступ. Истечение срока без ответа навсегда закрывает только наш канал предложения этой услуги этому партнёру."
 eon_sat_gnss_mil_withdraw_tt:0 "Как исходный отправитель бесплатно отозвать наше ожидающее предложение военного GNSS. До завершения исходного ответа предложение этой услуги остаётся занятым; истечение 30 дней без ответа навсегда закрывает только затронутый канал этому партнёру. Отзыв не прекращает уже принятое соглашение и не занимает другую услугу или исходящие предложения другой страны."
 eon_sat_gnss_mil_granted_tt:0 "Записать доступ к системе военного GNSS с текущим согласием и пересчитать её действующие бонусы вместе с другими поставщиками. Поставщик без пригодной или достаточно развитой услуги либо воюющий непосредственно с получателем не даёт иностранного бонуса при сохранении неактивного согласия. Отзыв удаляет разрешение этого поставщика; восстановление услуги не создаёт отозванное соглашение заново. Для услуги первого уровня текущие показатели системы поставщика также должны показывать наличие соответствующих спутников."
 eon_sat_gnss_mil_revoke_tt:0 "Как поставщик бесплатно отозвать записанный доступ этой страны к системе военного GNSS без её согласия. Обе страны должны существовать и быть разными, а запись доступа должна указывать наше разрешение. Прямая война, отсутствие услуги или ожидающее предложение не мешают отзыву. Удаляется только наше разрешение этому получателю; другие поставщики и соглашения остаются отдельными."
 eon_withdraw_mil_com_proposal:0 "Отозвать предложение военной спутниковой связи"
 eon_withdraw_mil_com_proposal_desc:0 "Отозвать наше исходное ещё не принятое предложение военной спутниковой связи. $eon_sat_com_mil_withdraw_tt$"
 eon_sat_com_mil_available_tt:0 "Обе страны должны существовать, быть разными и не воевать друг с другом. Поставщик должен иметь пригодную систему военной спутниковой связи не ниже собственного уровня получателя. У нашего предложения этой услуги не должно быть незавершённого прежнего ответа, а канал этому партнёру должен оставаться открытым. Отправка бесплатна; принятие всё ещё должно соответствовать предложенной услуге. Текущая нагрузка сети влияет на оценку AI. Для услуги первого уровня текущие показатели системы поставщика также должны показывать наличие соответствующих спутников."
 eon_sat_com_mil_proposal_tt:0 "Зарегистрировать бесплатное предложение военной спутниковой связи с 30-дневным ожиданием ответа на текущем уровне системы поставщика. Исходный отправитель может отозвать его. Принятие даёт доступ только при сохранении стран и предложенной услуги; изменение уровня поставщика требует нового предложения. Другие спутниковые услуги и собственные исходящие предложения получателя остаются отдельными."
 eon_sat_com_mil_closed_tt:0 "Закрыть это предложение военной спутниковой связи без предоставления нового доступа. Действующие соглашения остаются отдельными. Отозванный или уже недействительный ответ не создаёт доступ. Истечение срока без ответа навсегда закрывает только наш канал предложения этой услуги этому партнёру."
 eon_sat_com_mil_withdraw_tt:0 "Как исходный отправитель бесплатно отозвать наше ожидающее предложение военной спутниковой связи. До завершения исходного ответа предложение этой услуги остаётся занятым; истечение 30 дней без ответа навсегда закрывает только затронутый канал этому партнёру. Отзыв не прекращает уже принятое соглашение и не занимает другую услугу или исходящие предложения другой страны."
 eon_sat_com_mil_granted_tt:0 "Записать доступ к системе военной спутниковой связи с текущим согласием и пересчитать её действующие бонусы вместе с другими поставщиками. Поставщик без пригодной или достаточно развитой услуги либо воюющий непосредственно с получателем не даёт иностранного бонуса при сохранении неактивного согласия. Отзыв удаляет разрешение этого поставщика; восстановление услуги не создаёт отозванное соглашение заново. Военный спрос на связь использует действующие количества батальонов, кораблей и развёрнутых самолётов каждого получателя с записанным взаимным соглашением, включая неактивные соглашения. Для услуги первого уровня текущие показатели системы поставщика также должны показывать наличие соответствующих спутников."
 eon_sat_com_mil_revoke_tt:0 "Как поставщик бесплатно отозвать записанный доступ этой страны к системе военной спутниковой связи без её согласия. Обе страны должны существовать и быть разными, а запись доступа должна указывать наше разрешение. Прямая война, отсутствие услуги или ожидающее предложение не мешают отзыву. Удаляется только наше разрешение этому получателю; другие поставщики и соглашения остаются отдельными."
