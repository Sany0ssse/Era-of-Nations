l_russian:
 eon_aid_prepare_ready_tt:0 "У обеих стран не должно быть другого ожидающего запроса помощи. Должны выполняться действующие условия влияния, экономики и национальной политики; донору нужно не менее 5 миллиардов в казне. Это разовая безвозвратная помощь, требующая согласия получателя."
 eon_aid_legacy_pair_available_tt:0 "У этой пары нет неразрешённого запроса помощи из прежней системы. Пара с неоднозначными старыми ответами остаётся закрытой для новой помощи; соглашения с другими странами могут продолжаться."
 eon_aid_retired_pair_available_tt:0 "При исчезновении любой стороны не осталось неразрешённого ответа по помощи. Такая пара остаётся закрытой для новой помощи после восстановления страны; запросы с другими странами доступны."
 eon_debt_retired_pair_available_tt:0 "У нас нет неразрешённого ответа по оплате долга, оставшегося после исчезновения любой стороны. Эта исходящая пара остаётся закрытой после восстановления страны; другим странам поддержку предлагать можно."
 eon_aid_draft_desc:0 "Подготовить разовую помощь для [From.GetName]. Выберите 5, 15 или 35 миллиардов в пределах казны и действующих условий. При отправке сумма удерживается до решения получателя. Принятие перечисляет помощь полностью и применяет прежние эффекты мнения и влияния. Отказ или отзыв возвращает средства. Эта помощь не создаёт заём или регулярные выплаты."
 eon_aid_draft_cancelled_tt:0 "Закрыть черновик помощи без отправки денег и политических последствий."
 eon_aid_offer_title:0 "Разовая экономическая помощь"
 eon_aid_offer_desc:0 "[From.GetName] предлагает разовую безвозвратную помощь в размере §Y[?eon_aid_amount] миллиардов§!. Средства удерживаются до нашего решения. Принятие полностью перечисляет сумму в казну и увеличивает мнение и влияние донора по действующим правилам помощи. Отказ возвращает средства и применяет прежние внутриполитические эффекты. Регулярных выплат нет."
 eon_aid_cancelled_offer_desc:0 "Донор отозвал предложение до принятия. Удержанные средства возвращены либо учтены для возврата, когда в казне появится место. Закройте этот ответ, чтобы обе страны могли открыть новый запрос. Помощь и политические преимущества отказа не применяются."
 eon_aid_withdraw_tt:0 "Эта страна ожидает ответа на наше совпадающее предложение помощи. Отзыв возвращает удержанные средства. Если казна заполнена, остаток возврата сохраняется до появления свободного места. Обе страны остаются занятыми, пока получатель не закроет исходный ответ."
 eon_withdraw_economic_aid:0 "Отозвать предложение экономической помощи"
 eon_withdraw_economic_aid_desc:0 "Отозвать наше ещё не принятое предложение разовой помощи этой стране."
 eon_withdraw_economic_aid_send_desc:0 "Отозвать непринятую помощь и вернуть удержанные средства. Возврат сверх свободного места в казне сохраняется и зачисляется при появлении места. Получатель должен закрыть исходный ответ, прежде чем любая сторона сможет открыть другой запрос помощи. Принятую помощь отозвать нельзя."
 eon_debt_support_action_desc:0 "Предложить разовую оплату существующего долга другой страны из нашей казны. При отправке фиксируется предел в 25% её долга. После принятия оплачивается не больше этого предела и оставшегося долга. Это не переводит долг на нас, не создаёт заём и не обещает улучшение мнения. Действуют прежние политические условия и стоимость 75 политической власти."
 eon_debt_support_send_desc:0 "Предложить оплатить до 25% долга [THIS.GetNameWithFlag], измеренного при отправке запроса. Казна проверяется при отправке и исполнении; деньги не удерживаются во время ожидания согласия. Оплата не превышает оставшийся долг. Получатель получает уменьшение долга, а не деньги в казну."
 eon_debt_support_accept_desc:0 "Принятие разрешает предложенную разовую оплату долга. Для исполнения нужны исходные страны, положительный остаток долга, отсутствие войны между сторонами и достаточная казна донора. Оплата ограничена зафиксированным предложением и текущим долгом. Если условия исполнения утрачены, запрос завершается без перевода денег и изменения долга."
 eon_debt_support_reject_desc:0 "Получатель отклонил предложение разовой оплаты долга. Деньги не удерживались и не переводились; этот запрос не погасил долг."
 eon_support_ack:0 "Понятно"
 eon_support.10.t:0 "Экономическая помощь принята"
 eon_support.10.desc:0 "Получатель принял это предложение разовой помощи. Вся удержанная сумма зачислена; применены действующие эффекты мнения и влияния. Регулярных выплат этот результат не создаёт."
 eon_support.11.t:0 "Экономическая помощь отклонена"
 eon_support.11.desc:0 "Получатель отклонил предложение помощи. Удержанные средства возвращены; остаток сверх свободного места в казне сохраняется до появления места. Получателю помощь не зачислена."
 eon_support.12.t:0 "Экономическая помощь больше недействительна"
 eon_support.12.desc:0 "Исходные записи запроса или текущие условия больше не позволяли безопасно исполнить это предложение. Помощь и политические преимущества отказа не применены. Определимые средства донора возвращены либо сохранены для зачисления при появлении места в казне."
 eon_support.13.t:0 "Экономическая помощь отозвана"
 eon_support.13.desc:0 "Предложение отозвано до принятия. Удержанные средства возвращены либо сохранены до появления места в казне. Получатель ещё должен закрыть исходный ответ, прежде чем пара сможет открыть новый запрос помощи. Это уведомление не даёт помощь или политические преимущества отказа."
 eon_support.14.t:0 "Черновик экономической помощи закрыт"
 eon_support.14.desc:0 "Черновик закрыт до отправки предложения. Деньги не удерживались и не переводились; политических последствий нет."
