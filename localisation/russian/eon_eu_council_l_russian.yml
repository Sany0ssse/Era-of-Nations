 eon_eu_council.1.t:0 "Старое голосование Совета закрыто"
 eon_eu_council.1.d:0 "У сохранённого голосования нет подтверждаемого срока или записи о завершении. Его незавершённые элементы закрыты без принятия закона. Ранее принятые законы продолжают действовать. Теперь можно законно предложить новое голосование."
 eon_eu_council.1.a:0 "Понятно"
