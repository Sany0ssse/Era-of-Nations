l_russian:
 eon_advisers_mission_idea:0 "Соглашение о консультациях и обучении"
 eon_advisers_mission_idea_desc:0 "Согласованная и оплаченная программа помогает нашим собственным вооружённым силам планировать операции и обучать специалистов. Программа действует до 60 дней."
 eon_advisers_offer_available_tt:0 "Партнёр должен вести войну, соответствовать условиям военной поддержки и иметь возможность принять консультативную программу. Мы должны покрыть полную стоимость §Y$1,5 млрд§! и не иметь другой исходящей программы. Неразрешённое просроченное предложение навсегда закрывает этот вид предложений этому партнёру; предложение с неопределимым партнёром закрывает наш канал консультативных предложений. Неустановленное прежнее обязательство наёмников также препятствует новым предложениям."
 eon_advisers_offer_tt:0 "Предложить §Y60-дневную программу консультаций и обучения§! за наш счёт стоимостью §Y$1,5 млрд§!. Оплата производится только при согласии партнёра и сохранении условий. На ответ даётся §Y30 дней§!. Одновременно может ожидать ответа одно предложение; можно предоставлять и получать по одной программе. Поддержка помогает собственным вооружённым силам партнёра и не создаёт боевую бригаду. Первоначальные расходы §Yне возвращаются§!."
 eon_advisers.1.t:0 "Предложение консультаций и обучения"
 eon_advisers.1.d:0 "[FROM.GetName] предлагает оплатить 60-дневную программу консультаций и обучения для наших вооружённых сил. Поставщик оплачивает $1,5 млрд при нашем согласии и сохранении условий; мы ничего не платим. Поддержка улучшает подготовку специалистов и планирование операций. Мы можем согласиться или отказаться в течение 30 дней. Любая из сторон вправе завершить программу. Она также заканчивается при завершении нашей войны, войне между партнёрами, прекращении существования любой стороны или через 60 дней. Первоначальные расходы не возвращаются."
 eon_advisers.1.a:0 "Принять консультативную программу"
 eon_advisers.1.b:0 "Отказаться или закрыть предложение"
 eon_advisers_accept_tt:0 "Начать поддержку на §Y60 дней§!: §Yвремя подготовки спецназа −2%, максимальное планирование +8%, вместимость спецназа +1%§!. Поставщик один раз оплачивает §Y$1,5 млрд§!. Применяются существующие правила влияния и мнения внутренней военной группы. Соглашение не создаёт боевое формирование."
 eon_advisers_decline_tt:0 "Закрыть предложение без оплаты и поддержки. Отказ от действующего, допустимого и обеспеченного средствами предложения использует существующую реакцию внутренней независимости, не чаще одного раза за шесть месяцев. Закрытие просроченного, отозванного или необеспеченного предложения такого эффекта не имеет."
 eon_advisers_unmatched_tt:0 "На это предложение уже ответили или оно больше не открыто. Подтверждение не может начать новую программу или списать деньги поставщика."
 eon_advisers_withdraw_offer:0 "Отозвать предложение консультативной поддержки"
 eon_advisers_withdraw_offer_desc:0 "Отозвать неоплаченное консультативное предложение этому партнёру до его согласия."
 eon_advisers_withdraw_offer_send_desc:0 "Отозвать предложение без оплаты? Новое предложение недоступно, пока партнёр не закроет исходное или не истечёт срок ответа. Неразрешённая просрочка навсегда закрывает эти предложения этому партнёру."
 eon_advisers_end_cooperation:0 "Завершить консультативное сотрудничество"
 eon_advisers_end_cooperation_desc:0 "Завершить действующие консультативные соглашения с этим партнёром. Если мы оплачиваем программы друг друга, завершаются оба направления. Другие партнёры и предложения без ответа не затрагиваются. Первоначальные расходы не возвращаются."
 eon_advisers_end_cooperation_send_desc:0 "Завершить консультативное сотрудничество с этим партнёром в обоих согласованных направлениях? Программы прекращаются без возврата первоначальных расходов."
 eon_advisers.2.t:0 "Консультативная программа началась"
 eon_advisers.2.d:0 "Партнёр согласился, и действующие условия выполнены. Поставщик оплатил $1,5 млрд, и началась 60-дневная программа консультаций и обучения для собственных вооружённых сил получателя. Применяются существующие правила влияния и мнения внутренней военной группы. Любая сторона может завершить соглашение без возврата средств."
 eon_advisers.3.t:0 "Консультативное предложение отозвано"
 eon_advisers.3.d:0 "Поставщик отозвал консультативное предложение до согласия. Оплата и программа не начинались. Исходное предложение можно закрыть, когда оно появится."
 eon_advisers.4.t:0 "Срок консультативного предложения истёк"
 eon_advisers.4.d:0 "Предложение истекло или его партнёр перестал существовать до начала соглашения. Оплата не производилась. Дальнейшие консультативные предложения этого поставщика этому партнёру навсегда недоступны; другие допустимые партнёры остаются доступны."
 eon_advisers.5.t:0 "Консультативные предложения недоступны"
 eon_advisers.5.d:0 "Неполное предложение не удалось безопасно сопоставить с его партнёром. Оплата и программа не начинались. Канал консультативных предложений этой страны нельзя открыть заново; другие дипломатические действия доступны."
 eon_advisers.6.t:0 "Консультативное предложение закрыто"
 eon_advisers.6.d:0 "От предложения отказались, его отозвали или условия консультативной поддержки больше не выполнялись. По этому предложению первоначальные расходы не оплачены и программа не началась."
 eon_advisers.7.t:0 "Консультативное сотрудничество завершено"
 eon_advisers.7.d:0 "Согласованные консультативные программы с этим партнёром завершились. Их бонусы поддержки прекращаются. Первоначальные расходы не возвращаются. Другие партнёры и предложения без ответа не затрагиваются."
 eon_advisers.ack:0 "Понятно"
