l_russian:
 eon_framework_negotiation_trade_review:0 "Изучить проект торговой рамочной угоды с [FROM.GetName]"
 eon_framework_negotiation_trade_review_desc:0 "Изучение актуального раунда и условий не заключает договор. Согласие даётся отдельным решением."
 eon_framework_negotiation_trade_accept_90:0 "Принять договор: уведомление за 90 дней"
 eon_framework_negotiation_trade_accept_90_desc:0 "Принять изученный проект с [FROM.GetName]. Каждая сторона может прекратить новый договор после уведомления за 90 дней. Досрочное прекращение требует согласия обеих сторон. Конкретные контракты сохраняют обязательства."
 eon_framework_negotiation_trade_counter_90:0 "Встречный проект: уведомление за 90 дней (75 ПВ)"
 eon_framework_negotiation_trade_counter_90_desc:0 "Заменить проект новым раундом от нашей страны. Партнёр должен заново изучить и явно принять условия. Не более трёх раундов по 30 дней. Отправка стоит 75 политической власти."
 eon_framework_negotiation_trade_accept_180:0 "Принять договор: уведомление за 180 дней"
 eon_framework_negotiation_trade_accept_180_desc:0 "Принять изученный проект с [FROM.GetName]. Каждая сторона может прекратить новый договор после уведомления за 180 дней. Досрочное прекращение требует согласия обеих сторон. Конкретные контракты сохраняют обязательства."
 eon_framework_negotiation_trade_counter_180:0 "Встречный проект: уведомление за 180 дней (75 ПВ)"
 eon_framework_negotiation_trade_counter_180_desc:0 "Заменить проект новым раундом от нашей страны. Партнёр должен заново изучить и явно принять условия. Не более трёх раундов по 30 дней. Отправка стоит 75 политической власти."
 eon_framework_negotiation_trade_decline:0 "Отклонить актуальный запрос"
 eon_framework_negotiation_trade_decline_desc:0 "Отклонить только актуальный запрос этой пары. Чинные угоды и проекты сохраняются."
 eon_framework_negotiation_trade_withdraw:0 "Отозвать наш актуальный запрос"
 eon_framework_negotiation_trade_withdraw_desc:0 "Отозвать запрос без заключения или прекращения договора."
 eon_framework_negotiation_trade_notice:0 "Уведомить о прекращении договора (75 ПВ)"
 eon_framework_negotiation_trade_notice_desc:0 "Применить действительно согласованную клаузулу. Договор действует весь срок уведомления: 90 или 180 дней. Для старых угод с неизвестными условиями эта возможность недоступна."
 eon_framework_negotiation_trade_end_request:0 "Предложить согласованное прекращение (75 ПВ)"
 eon_framework_negotiation_trade_end_request_desc:0 "Предложить взаимное прекращение, в том числе старой угоды без известной клаузулы. Молчание не означает согласия. Запрос истекает через 30 дней."
 eon_framework_negotiation_trade_end_accept:0 "Согласиться на изученное прекращение"
 eon_framework_negotiation_trade_end_accept_desc:0 "Прекратить именно тот рамочный договор, который указан в изученном запросе. Энергетические и товарные контракты, проекты и авансы сохраняют свои обязательства."
 eon_framework_negotiation_trade_status:0 "Обязательства с [FROM.GetName]"
 eon_framework_negotiation_trade_status_desc:0 "[eon_framework_negotiation_trade_clause_label] [eon_framework_negotiation_trade_pending_label] Торговый доступ и право инвестирования отделены от конкретных поставок и вложенного капитала. Решения этой пары позволяют изучить проект, ответить, отозвать запрос и согласовать прекращение."
 eon_framework_negotiation_trade_review_info_tt:0 "Актуальный раунд изучен. Для согласия ещё необходимы совпадение версии и условий, а также актуальное право обеих стран заключить угоду."
 eon_framework_negotiation_trade_status_info_tt:0 "[eon_framework_negotiation_trade_clause_label] [eon_framework_negotiation_trade_pending_label] Рамочная угода предоставляет торговый или инвестиционный доступ. Она сама не поставляет товары или электроэнергию и не оплачивает счета. Для старых договоров без записанных условий доступно только взаимно согласованное прекращение."
 eon_framework_negotiation_investment_review:0 "Изучить проект инвестиционной рамочной угоды с [FROM.GetName]"
 eon_framework_negotiation_investment_review_desc:0 "Изучение актуального раунда и условий не заключает договор. Согласие даётся отдельным решением."
