 eon_framework_negotiation_trade_propose_desc:0 "Отправить рамочный проект (75 ПВ). Получатель имеет 30 дней для изучения и ответа. Уведомление о прекращении — 90 дней; встречный проект может предложить 180. Конкретные поставки и проекты сохраняют собственные обязательства."
 eon_propose_trade_framework:0 "Предложить торговую рамочную угоду (75 ПВ)"
 eon_framework_negotiation_investment_propose_desc:0 "Отправить рамочный проект (75 ПВ). Получатель имеет 30 дней для изучения и ответа. Уведомление о прекращении — 90 дней; встречный проект может предложить 180. Конкретные поставки и проекты сохраняют собственные обязательства."
 eon_propose_investment_framework:0 "Предложить инвестиционную рамочную угоду (75 ПВ)"
 eon_framework_negotiation_category:0 "Рамочные переговоры и договорные обязательства"
 eon_framework_negotiation_notice_ack:0 "Ознакомиться"
 eon_framework_negotiation_notice.1.t:0 "Рамочный запрос ожидает изучения"
 eon_framework_negotiation_notice.1.d:0 "Откройте решения рамочных переговоров и выберите нужную страну. Это уведомление не принимает и не прекращает договор. Каждый проект имеет актуальный раунд и истекает через 30 дней; молчание не является согласием. Согласованные условия действуют до установленного срока."
 eon_framework_negotiation_notice.2.t:0 "Запись о рамочной угоде изменена"
 eon_framework_negotiation_notice.2.d:0 "Откройте решения рамочных переговоров и выберите нужную страну. Это уведомление не принимает и не прекращает договор. Каждый проект имеет актуальный раунд и истекает через 30 дней; молчание не является согласием. Согласованные условия действуют до установленного срока."
 eon_framework_negotiation_notice.3.t:0 "Получено уведомление о прекращении"
 eon_framework_negotiation_notice.3.d:0 "Откройте решения рамочных переговоров и выберите нужную страну. Это уведомление не принимает и не прекращает договор. Каждый проект имеет актуальный раунд и истекает через 30 дней; молчание не является согласием. Согласованные условия действуют до установленного срока."
 eon_propose_trade_framework_desc:0 "Отправить проект для явного изучения и согласия. Каждый отправленный раунд стоит 75 ПВ. Ответы находятся в решениях рамочных переговоров и договорных обязательств."
 eon_propose_investment_framework_desc:0 "Отправить проект для явного изучения и согласия. Каждый отправленный раунд стоит 75 ПВ. Ответы находятся в решениях рамочных переговоров и договорных обязательств."
