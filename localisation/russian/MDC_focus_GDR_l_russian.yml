 # Events
 GDR_main_events.1.t: "Реорганизация Национального фронта"
 GDR_main_events.1.d: "Товарищи, Национальный фронт должен развиваться. Десятилетиями он служил единым блоком всех антифашистских и прогрессивных сил под руководством нашей Партии. Но теперь, с возрождением нашего государства, мы сталкиваемся с решающим вопросом: должны ли мы ужесточить его структуру в дисциплинированный авангард или трансформировать его в более широкую коалицию, которая сможет принять сложности социализма XXI века?\n\nСторонники жёсткой линии требуют идеологической чистоты и строгой партийной дисциплины. Реформаторы говорят о «народном фронте», который включает зелёных, феминисток и даже прогрессивных христиан. Выбор, который мы сделаем, определит саму природу нашей республики."
 GDR_main_events.1.a: "Укрепить партийную дисциплину. Авангард должен вести."
 GDR_main_events.2.t: "Покончить с иллюзиями"
 GDR_main_events.2.d: "Товарищ, народ поёт песни о «хорошей старой ГДР» - о дешёвом жилье, надёжной работе, детской дружбе. Но эта «остальгия» опасна. Она романтизирует прошлое, которое было полно компромиссов, застоя, тех самых семян нашего уничтожения. Они помнят шоколад «Вольф», но забывают длинные очереди. Они помнят летние лагеря, но забывают стукачей Штази в каждом многоквартирном доме.\n\nМы должны заменить эти мелкобуржуазные сентиментальности подлинным революционным сознанием. Наша молодёжь должна смотреть вперёд, а не назад. Но как далеко мы должны зайти в этой культурной революции?"
 GDR_main_events.2.a: ""
 GDR_main_events.2.b: ""
 GDR_main_events.3.t: "Вопрос о Национальном фронте"
 GDR_main_events.3.d: "Реформистская фракция внутри нашей партии во главе с харизматичным Гизи представила радикальное предложение: преобразовать Национальный фронт в подлинную парламентскую платформу, где несколько социалистических партий конкурируют за голоса. Они утверждают, что это узаконит наше правление в глазах Запада и даст голос различным течениям внутри левых.\n\nНо старая гвардия в ярости. «Конкуренция? - насмехаются они. - Мы не восстанавливали ГДР из пепла, чтобы стать очередной буржуазной парламентской республикой!» Центральный комитет разделён. Газеты строят догадки. Народ наблюдает."
 GDR_main_events.3.a: ""
 GDR_main_events.3.b: ""
 GDR_main_events.4.t: "Восходящий феникс"
 GDR_main_events.4.d: "Из пепла 1990 года, из унижения Тройханд, из нищенской зарплаты и эмиграции нашей молодёжи - поднялось новое государство. Заводы снова гудят, не устаревшими станками прошлого, а современным оборудованием, построенным немецкими рабочими. Наши границы надёжны. Наши дети поют песни революции в школах.\n\nСегодня прибывают иностранные делегации: вьетнамские товарищи, кубинские врачи, даже осторожная торговая миссия из Китая. Они смотрят на нас с любопытством и уважением. «Возможно ли это? - спрашивают они. - Неужели социализм действительно вернулся в сердце Европы?»\n\nМы стоим у окна восстановленного Дворца Республики и смотрим, как солнце встаёт над Берлином. Старики среди нас плачут. Мы сделали это, товарищ. Мы сделали это."
 GDR_main_events.4.a: "Мы будем продолжать придерживаться курса"
 GDR_main_events.4.b: "Давайте построим новый социализм"
 GDR_main_events.5.t: "Культ Сталина"
 GDR_main_events.5.d: "Товарищ, поступило предложение: официально реабилитировать фигуру Иосифа Сталина в партийной историографии. Не Сталина поздней паранойи, утверждают они, а Сталина индустриализации, разгрома фашизма, железной воли, построившей социализм в отдельно взятой стране.\n\nНо реакция наших европейских партнёров была немедленной и враждебной. Французские и итальянские коммунисты угрожают разорвать связи. Даже наши вьетнамские друзья выражают «озабоченность». Внутри партии реформаторы называют это «политическим самоубийством», которое изолирует нас на международной арене.\n\nОднако среди рабочих, особенно старшего поколения, портрет Сталина всё ещё появляется на демонстрациях. Для них он олицетворяет победу над Гитлером, пятилетки, эпоху, когда рабочий класс действительно пугал буржуазию."
 GDR_main_events.5.a: "Реабилитировать его. Пусть буржуазия трепещет."
 GDR_main_events.6.t: "Новый съезд Социалистической единой партии Германии"
 GDR_main_events.6.d: "Товарищи, делегаты, почётные гости со всего мира!\n\nМы собрались здесь, в Берлине, на первый Партийный съезд возрождённой СЕПГ. Воздух искрится от ожидания. Снаружи тысячи рабочих маршируют с красными флагами и транспарантами. Внутри дебаты жаркие и страстные.\n\nТри кандидата стали потенциальными лидерами нашей великой партии, каждый представляет разное видение будущего немецкого социализма.\n\nЭрнст Крец говорит за старую гвардию, за дисциплину и ортодоксию, за традиции Ульбрихта и Хонеккера. Его речь встречается громовыми аплодисментами делегатов заводов.\n\nГрегор Гизи, блестящий адвокат и реформатор, призывает к «социализму с человеческим лицом», к демократии, к открытости Западу. Интеллектуалы и молодёжь ловят каждое его слово.\n\nИ затем есть Сара Вагенкнехт - молодой, страстный, красноречивый политик. Она говорит о «третьем пути»: консервативном в культурных вопросах, радикальном в экономике. «Мы должны говорить с рабочими, которых крадут правые, - заявляет она. - Мы должны быть голосом тех, кого глобализация оставила позади». Зал замирает, а затем взрывается.\n\nВыбор за вами, товарищ Генеральный секретарь. Кто поведёт нас в будущее?"
 GDR_main_events.6.a: "Эрнст Крец"
 GDR_main_events.6.b: "Грегор Гизи"
 GDR_main_events.6.c: "Сара Вагенкнехт"

 GDR_revoult.1.t: "Сепаратисты в Саксонии объявили о сецессии"
 GDR_revoult.1.d: "Как только наша великая страна вернулась на карту мира, появились те, кто был против её существования, и среди них оказались наши сограждане! Сепаратисты из региона Саксония объявили, что они теперь независимое государство и не подчиняются никакому немецкому правительству."
 GDR_revoult.1.a: "Даруем им свободу"
 GDR_revoult.1.b: "Уничтожить их"