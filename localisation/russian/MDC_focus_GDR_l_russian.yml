l_russian:
 #Focus Tree
 GDR_communists_of_the_GDR: "Коммунисты ГДР"
 GDR_communists_of_the_GDR_desc: "Дух Вальтера Ульбрихта никогда по-настоящему не умирал. Пришло время очистить ряды от ревизионистов и вернуться к истинным принципам марксистско-ленинского государственного строительства. Партия должна быть авангардом, а народ - следовать за ней."
 GDR_legacy_socialist_past: "Наследие социалистического прошлого"
 GDR_legacy_socialist_past_desc: "Из пепла приватизации Тройханд и обещанных нам «цветущих ландшафтов» в сердцах многих осталась тоска по стабильности и социальной защищённости. Мы возродим социальные достижения ГДР."
 GDR_no_the_european_union: "Нет Европейскому союзу"
 GDR_no_the_european_union_desc: "Этот бюрократический альянс вассалов НАТО - враг истинной солидарности трудящихся. ГДР не будет рынком сбыта западных товаров; мы выйдем из этого антидемократического союза и проложим свой собственный путь."
 GDR_purging_dissidents_ranks: "Чистка рядов от диссидентов"
 GDR_purging_dissidents_ranks_desc: "Чтобы построить сильное государство, мы должны сначала навести порядок в собственном доме. Западные агенты и ненадёжные элементы, проникшие в наши молодые структуры, будут разоблачены и обезврежены Министерством государственной безопасности."
 GDR_Socialist_partners: "Социалистические партнёры"
 GDR_Socialist_partners_desc: "Наши истинные друзья - не в Брюсселе и не в Вашингтоне. Мы должны протянуть руку оставшимся социалистическим государствам и движениям по всему миру. Идейное родство - основа сильной внешней политики."
 GDR_economic_stabilization: "Экономическая стабилизация"
 GDR_economic_stabilization_desc: "Шоковая терапия 90-х уничтожила нашу промышленность. Мы обратим это вспять, национализировав ключевые предприятия, стабилизировав цепочки поставок и обеспечив полную занятость для каждого гражданина Республики."
 GDR_fiveyear_plan: "Пятилетка в отдельно взятой стране"
 GDR_fiveyear_plan_desc: "Пока наши враги говорят о глобализации, мы будем говорить о планировании. Мы мобилизуем пролетариат на масштабные усилия по модернизации нашей промышленности и сельского хозяйства, догоняя и перегоняя Запад в ключевых секторах."
 GDR_reorganization_national_front: "Реорганизация Национального фронта"
 GDR_reorganization_national_front_desc: "Национальный фронт снова должен стать истинным инструментом воли трудового народа. Мы реорганизуем его, включив все антиимпериалистические силы, обеспечив руководящую роль Социалистической единой партии Германии."
 GDR_stasi_2: "Штази 2.0"
 GDR_stasi_2_desc: "Щит и меч партии должны быть оснащены современными технологиями. Используя методы наблюдения XXI века, мы сможем защитить нашу революцию от контрреволюционных элементов более эффективно, чем когда-либо прежде."
 GDR_congress_socialist_party: "Новый съезд Социалистической единой партии Германии"
 GDR_congress_socialist_party_desc: "Новый партийный съезд - это высший форум нашей демократии. Здесь мы определим курс на следующие пять лет, вновь подтвердим нашу приверженность марксизму-ленинизму и изберем руководство, достойное наследия Ульбрихта."

 GDR_ulbrichts_successor: "Наследник Ульбрихта"
 GDR_ulbrichts_successor_desc: "Мы должны смотреть не на реформистские ошибки поздней ГДР, а на годы основания при товарище Ульбрихте. Дисциплина, тяжёлая промышленность и социалистический интернационализм будут нашими путеводными звёздами."
 GDR_neighbor_program: "Программа «Сосед»"
 GDR_neighbor_program_desc: "Антифашистский защитный вал исчез, но наши границы остались. Мы внедрим модернизированную версию «Программы соседа», усилив пограничную безопасность с помощью технологий и идеологического воспитания пограничных войск."
 GDR_military_education: "Военно-патриотическое воспитание"
 GDR_military_education_desc: "Каждый гражданин - защитник Родины. Мы введём обязательную допризывную подготовку в школах и университетах, воспитывая дух патриотизма и готовности защищать социалистические завоевания."
 GDR_marxism_in_every_home: "Марксизм в каждый дом"
 GDR_marxism_in_every_home_desc: "От заводского цеха до университетской аудитории марксистско-ленинская теория должна пронизывать все аспекты жизни. Мы запустим масштабную издательскую кампанию и создадим кружки по изучению диалектического материализма."
 GDR_end_illusions: "Покончить с иллюзиями"
 GDR_end_illusions_desc: "«Остальгия» - это слабая сентиментальность по потребительским товарам. Мы должны заменить её подлинным революционным сознанием. Романтизация прошлого должна уступить место строительству реального социалистического будущего."
 GDR_strengthen_the_capital: "Укрепить столицу"
 GDR_strengthen_the_capital_desc: "Берлин, как столица ГДР, должен быть символом нашей мощи. Масштабные строительные проекты, включая завершение и модернизацию Дворца Республики, продемонстрируют мощь социалистической архитектуры."
 GDR_doctrine_of_the_socialist_outpost: "Доктрина социалистического форпоста"
 GDR_doctrine_of_the_socialist_outpost_desc: "Германия - передовая линия классовой борьбы. Наша военная доктрина должна отражать это: хорошо оснащённая, высокомобильная народная армия, готовая защитить революцию в любой момент."
 GDR_autarky_at_any_cost: "Самообеспечение любой ценой"
 GDR_autarky_at_any_cost_desc: "Зависимость от капиталистического мирового рынка - это уязвимость. Мы должны достичь автаркии в стратегических ресурсах и ключевых отраслях промышленности, независимо от экономических издержек в краткосрочной перспективе. Долгосрочное выживание государства имеет первостепенное значение."
 GDR_minor_cult_of_stalin: "Малый культ Сталина"
 GDR_minor_cult_of_stalin_desc: "Фигура Сталина, хоть и противоречивая на Западе, олицетворяет железную волю, необходимую для строительства социализма. Восстановление его образа в партийной историографии послужит предупреждением колеблющимся и маяком для самых стойких товарищей."
 GDR_the_phoenix_reborn: "Возрождённый феникс"
 GDR_the_phoenix_reborn_desc: "Из пепла объединения 1990 года поднялась новая, более сильная ГДР. Мы выжили, мы отстроились, и теперь мы покажем миру, что социализм - это не провалившийся эксперимент, а будущее человечества."

 GDR_gisi: "Гизи"
 GDR_gisi_desc: "Нам нужны новые, молодые лица, не обременённые старыми распрями. Гизи представляет новое поколение социалистов, понимающих необходимость гласности и экономической модернизации для выживания в современном мире."
 GDR_restructuring: "Настоящая перестройка"
 GDR_restructuring_desc: "Старая командная экономика потерпела крах. Нам нужна фундаментальная реструктуризация нашей экономической системы, внедрение элементов хозрасчёта и самостоятельности предприятий при сохранении общественной собственности на средства производства."
 GDR_path_to_market_socialism: "На пути к рыночному социализму"
 GDR_path_to_market_socialism_desc: "Мы должны примирить рынок с социалистическими принципами. Пусть кооперативы и малые предприятия процветают под руководством государственного плана. Эта «социалистическая рыночная экономика» принесёт процветание и эффективность."
 GDR_question_national_front: "Вопрос о Национальном фронте"
 GDR_question_national_front_desc: "Является ли Национальный фронт пережитком, или его можно реформировать? Мы предлагаем превратить его в подлинную парламентскую платформу, где различные социалистические и левые партии могли бы конкурировать за голоса в демократических рамках."
 GDR_limited_privatization: "Ограниченная приватизация"
 GDR_limited_privatization_desc: "Не всё должно быть государственным. Мы разрешим создание малых и средних частных предприятий в сфере услуг и потребительских товаров, высвобождая предпринимательскую энергию, сохраняя при этом «командные высоты» экономики в общественных руках."
 GDR_peoples_corporations: "Народные корпорации"
 GDR_peoples_corporations_desc: "Вместо того чтобы государственные министерства управляли заводами, мы преобразуем крупные комбинаты в «народные корпорации» - находящиеся в общественной собственности, но управляемые независимо, с рабочими в советах директоров и акциями, принадлежащими общественности."
 GDR_end_hostilities_with_the_west: "Прекратить вражду с Западом"
 GDR_end_hostilities_with_the_west_desc: "Холодная война окончена. Мы должны признать, что мирное сосуществование - это не просто лозунг, а необходимость. Мы будем стремиться к нормализации отношений, торговым соглашениям и культурным обменам с Федеративной Республикой и другими западными странами."
 GDR_truly_democratic_republic: "По-настоящему демократическая республика"
 GDR_truly_democratic_republic_desc: "Давайте оправдаем своё название. Мы введём многопартийную систему с реальной конкуренцией, гарантируем свободу слова и собраний и построим правовое государство, а не государство партийных указов."
 GDR_cultural_progressivism: "Культурный прогрессивизм"
 GDR_cultural_progressivism_desc: "Социализм должен быть силой социального освобождения. Мы поддержим права ЛГБТК+, феминистские движения и авангардное искусство, порывая с консервативными социальными нормами как старой ГДР, так и капиталистического Запада."
 GDR_allow_free_elections: "Разрешить свободные выборы"
 GDR_allow_free_elections_desc: "Высшее испытание нашей веры в народ. Мы проведём свободные и справедливые многопартийные выборы в учредительное собрание. Мы уверены, что граждане ГДР выберут справедливое социалистическое будущее, а не неравенство капитализма."

 GDR_honeckers_successor: "Наследник Хонеккера"
 GDR_honeckers_successor_desc: "Забудьте о мрачной аскетичности ранних лет. Наша модель - эпоха позднего Хонеккера: фокус на потребительских товарах, западной разрядке и уникальной германской социалистической идентичности, которая не является копией Москвы."
 GDR_consumer_socialism: "Потребительский социализм"
 GDR_consumer_socialism_desc: "Чтобы обеспечить лояльность населения, государство должно давать результат. Мы сделаем приоритетом производство качественных потребительских товаров, современное жильё и досуг. Социализм должен быть комфортным, а не только героическим."
 GDR_dominance_over_the_agenda: "Доминирование в повестке"
 GDR_dominance_over_the_agenda_desc: "Мы сместим общественный дискурс с бесконечных идеологических дебатов о Сталине или Марксе. Новая повестка - о стабильности, национальной гордости за наши социалистические достижения и достойном уровне жизни для каждой семьи."
 GDR_strengthen_the_national_front: "Укрепить Национальный фронт"
 GDR_strengthen_the_national_front_desc: "Национальный фронт должен быть широкой церковью для всех патриотических и прогрессивных немцев. Включая блоковые партии и массовые организации, мы создаём чувство национального единства вокруг умеренного руководства СЕПГ."
 GDR_economics_above_ideology: "Экономика выше идеологии"
 GDR_economics_above_ideology_desc: "Идеология важна, но государство не может существовать на одних лозунгах. Мы примем прагматичную экономическую политику, перенимая западные управленческие техники и даже добиваясь сотрудничества с западногерманскими фирмами для повышения нашей эффективности."
 GDR_cultural_liberalization: "Культурная либерализация"
 GDR_cultural_liberalization_desc: "Пусть группы играют рок-музыку, а писатели экспериментируют с формой. Пока они открыто не призывают к контрреволюции, определённая степень культурной свободы служит предохранительным клапаном и делает наше государство современным и уверенным в себе."
 GDR_germany_honecker: "Германия Хонеккера"
 GDR_germany_honecker_desc: "Мы не просто советский сателлит; мы немцы, строящие немецкий социализм. Эта концепция находит отклик в национальной гордости. Мы - истинные наследники немецкой истории, от Лютера до Маркса, строящие суверенное и процветающее государство."
 GDR_shut_up_the_party_opposition: "Заткнуть партийную оппозицию"
 GDR_shut_up_the_party_opposition_desc: "И жесткие сторонники, мечтающие об аскетичности Ульбрихта, и реформаторы, желающие западной демократии, - оба представляют угрозу стабильности. Сочетанием кооптации и тихих административных мер мы маргинализируем этих экстремистов внутри партии."
 GDR_member_of_the_global_economy: "Равноправный член глобальной экономики"
 GDR_member_of_the_global_economy_desc: "Мы стремимся не к конфронтации, а к сотрудничеству. Вступая в международные экономические институты на выгодных условиях и открывая наш рынок для контролируемых иностранных инвестиций, мы сможем интегрировать ГДР в глобальную экономику как уважаемого партнёра."
 GDR_truly_peoples_germany: "Подлинно народная Германия"
 GDR_truly_peoples_germany_desc: "Другая Германия говорит о нации, но служит капиталу. Мы, ГДР, - это истинная «народная Германия» - государство, которое защищает своих рабочих, дорожит своей культурой и гордо стоит независимо между Востоком и Западом, как образец третьего пути."

 GDR_national_peoples_army: "Восстановление Национальной народной армии"
 GDR_national_peoples_army_desc: "Бундесвер - это армия оккупантов. ННА - это армия народа. Мы реформируем наши вооружённые силы с нуля, основываясь на принципах социалистической военной доктрины и защиты нашей родины."
 GDR_new_officer_personnel: "Новые офицерские кадры"
 GDR_new_officer_personnel_desc: "Армия настолько хороша, насколько хороши её офицеры. Мы создадим новые военные академии для подготовки поколения политически благонадёжных и профессионально компетентных офицеров - костяка новой ННА."
 GDR_military_districts: "Возрождение военных округов"
 GDR_military_districts_desc: "Чтобы обеспечить быструю мобилизацию и территориальную оборону, мы восстановим классическую структуру военных округов ГДР (ВО). Это позволит децентрализовать командование и установить глубокую связь между армией и местным населением."
 GDR_reactivation_of_the_t72: "Реактивация Т-72"
 GDR_reactivation_of_the_t72_desc: "Наши склады всё ещё хранят потенциал для создания грозных бронетанковых сил. Мы реактивируем и модернизируем наш парк основных боевых танков Т-72 - символа мощи ННА, который когда-то вселял страх в сердца генералов НАТО."
 GDR_air_force: "Военно-воздушные силы"
 GDR_air_force_desc: "Превосходство в воздухе имеет решающее значение в современной войне. Мы восстановим Люфтштрайткрефте дер ННА, сделав упор на прочные, долговечные самолёты, способные поддерживать наземные силы и защищать наше небо от вторжений."
 GDR_anti_aircraft_missile_forces: "Войска противовоздушной обороны"
 GDR_anti_aircraft_missile_forces_desc: "Территория ГДР должна быть бесполётной зоной для вражеских самолётов. Мы развернём модернизированную сеть зенитных ракетных систем, создав непроницаемый зонт над нашими городами и стратегическими объектами."
 GDR_improvement_of_airfields: "Улучшение аэродромов"
 GDR_improvement_of_airfields_desc: "Чтобы проецировать силу и обеспечить выживаемость наших военно-воздушных сил, мы должны инвестировать в нашу военную инфраструктуру. Современные, укреплённые аэродромы с защищёнными укрытиями позволят нашим самолётам действовать даже под атаками."
 GDR_reform_of_the_army: "Реформа армии"
 GDR_reform_of_the_army_desc: "Современное поле боя требует гибкости. Мы реформируем наши сухопутные силы в более мелкие, мобильные общевойсковые боевые группы, способные к быстрому реагированию и эффективной обороне против технологически превосходящего противника."
 GDR_support_troops: "Тыловые войска"
 GDR_support_troops_desc: "Армия сражается на желудок и движется на логистике. Мы профессионализируем наши вспомогательные войска (снабжение, техническое обслуживание, медицинские), чтобы обеспечить наши передовые части всем необходимым и боеспособностью."
 GDR_air_defense_forces: "Войска противовоздушной обороны"
 GDR_air_defense_forces_desc: "Отдельное командование ПВО необходимо для координации всех средств - от ракет большой дальности до мобильных ЗРК малой дальности, обеспечивая интегрированную и эшелонированную оборону воздушного пространства ГДР."
 GDR_military_industry: "Военная промышленность"
 GDR_military_industry_desc: "Мы не можем полагаться на иностранный импорт для нашей обороны. Мы возродим и модернизируем наш отечественный военно-промышленный комплекс - от заводов стрелкового оружия до верфей - чтобы вооружить нашу армию оружием, произведённым немецкими рабочими."
 GDR_special_forces: "Силы специального назначения"
 GDR_special_forces_desc: "Следуя традициям полка «Феликс Дзержинский», мы создадим современное подразделение специального назначения. Эти элитные солдаты станут нашим скальпелем для самых чувствительных операций, разведки и борьбы с терроризмом."
 GDR_border_troops: "Пограничные войска"
 GDR_border_troops_desc: "Охрана границы - первая линия обороны от саботажа и шпионажа. Пограничные войска ГДР будут переоснащены и переобучены для защиты нашего суверенитета в XXI веке."
 GDR_navy: "Военно-морской флот"
 GDR_navy_desc: "Наше побережье Балтийского моря - жизненно важный стратегический интерес. Мы восстановим Фольксмарине для защиты наших морских границ, обеспечения безопасности торговых путей и проецирования силы вдоль побережья."
 GDR_marine_corps: "Морская пехота"
 GDR_marine_corps_desc: "Десантные операции и береговая оборона требуют специализированных войск. Мы создадим морскую пехоту, способную к быстрому развёртыванию для защиты наших островов и проведения десантных операций в обороне балтийского побережья."
 GDR_new_ports: "Новые порты"
 GDR_new_ports_desc: "Чтобы поддерживать наш флот и увеличивать нашу экономическую независимость, мы модернизируем существующие порты и построим новые военно-морские объекты в Ростоке и Штральзунде, способные разместить наш новый флот и подводные лодки."

 GDR_return_of_the_stasi: "Возвращение Штази"
 GDR_return_of_the_stasi_desc: "Тень падает на Республику. Министерство государственной безопасности, демонтированное в смутные времена, восстаёт из пепла. Старые кадры возвращаются в подвалы, а новые постигают главное искусство: знать о гражданине всё раньше, чем он узнает о себе сам."
 GDR_peoples_militia: "Народная милиция"
 GDR_peoples_militia_desc: "Порядок на улицах - это лицо государства. Мы укрепляем ряды Народной милиции, оснащая её современными средствами связи и транспорта. Каждый патруль - это глаза и уши партии, даже если партия предпочитает оставаться в тени."
 GDR_barracks_peoples_police: "Казарменная народная полиция"
 GDR_barracks_peoples_police_desc: "Милиционер должен уметь не только свистеть, но и держать строй. Казарменная полиция становится нашим внутренним бастионом: военизированные формирования, готовые восстановить порядок там, где обычного закона недостаточно."
 GDR_police_readliness: "Полицейская готовность"
 GDR_police_readliness_desc: "Граждане должны знать: помощь придёт быстро. Время реагирования сокращается, создаются мобильные группы быстрого реагирования. Однако иногда «помощь» может принимать неожиданные формы."
 GDR_main_intelligence_directorate: "Главное разведывательное управление"
 GDR_main_intelligence_directorate_desc: "Глаза и уши за пределами Республики. Наша разведка проникает туда, куда не могут дотянуться ракеты: в коридоры власти в Бонне, штаб-квартиру НАТО, умы наших врагов. Информация - единственная валюта, которая никогда не обесценивается."
 GDR_agency_for_the_protection_economy: "Отдел по охране народного хозяйства"
 GDR_agency_for_the_protection_economy_desc: "Саботаж, хищение социалистической собственности, шпионаж на заводах - эти преступления не видны в витринах магазинов, но они подтачивают экономику изнутри. Новый отдел наделён полномочиями проверять любую мастерскую, любой склад и любой отчёт."
 GDR_central_investigation_service: "Центральная следственная служба"
 GDR_central_investigation_service_desc: "Когда преступление раскрыто, работа следователя только начинается. Центральная служба объединяет лучших криминалистов и следователей. Их методы могут показаться старомодными, но результаты всегда безупречны."
 GDR_werwolf: "101-й батальон Штази «Вервольф»"
 GDR_werwolf_desc: "Элитное подразделение специального назначения, наследник традиций «Вервольфа». Готов к выполнению самых опасных и секретных задач."

 GDR_economy: "Экономика возрождённого государства"
 GDR_economy_desc: "Экономическое чудо XXI века будет социалистическим. Мы должны отстроить нашу промышленную базу из руин, оставленных приватизацией Тройханд. Наша цель - не просто восстановление, а создание современной, эффективной и справедливой экономической системы, которая служит народу, а не корпоративной прибыли."
 GDR_Interflug: "Интерфлюг"
 GDR_Interflug_desc: "Небо над Европой когда-то бороздили серебристые самолёты «Интерфлюга», нашей национальной авиакомпании. Пришло время восстановить этот символ суверенитета ГДР. Новый «Интерфлюг» соединит Берлин с Ханоем, Гаваной и другими дружественными столицами, а также предложит надёжное обслуживание нашим гражданам."
 GDR_Deutsche_Reichsbahn: "Дойче Райхсбан"
 GDR_Deutsche_Reichsbahn_desc: "Название «Дойче Райхсбан» несёт в себе века истории немецких железных дорог. Мы восстановим нашу национальную железную дорогу в её былой славе, модернизируя пути и подвижной состав для создания эффективной, электрифицированной и общественной транспортной сети, которая служит каждому гражданину Республики."
 GDR_Robotron: "Роботрон"
 GDR_Robotron_desc: "В 1980-х годах «Роботрон» был одним из ведущих производителей компьютеров в мире. Наши инженеры были пионерами. Мы возродим это наследие, инвестируя в исследования и разработки для создания современной социалистической ИТ-индустрии, свободной от капитализма слежки западных технологических гигантов."
 GDR_Wartburg: "Вартбург"
 GDR_Wartburg_desc: "«Вартбург» был не просто автомобилем; он был символом немецкого инжиниринга и социалистической мобильности. Мы модернизируем легендарный бренд, производя доступные, долговечные и надёжные автомобили для рабочих семей ГДР, свободные от запланированного устаревания."
 GDR_VVB_LOWA: "ФФБ ЛОВА"
 GDR_VVB_LOWA_desc: "От трамваев до поездов - ЛОВА когда-то обеспечивала общественный транспорт по всему социалистическому миру. Мы воссоединим наш разрозненный инженерный опыт для производства современных трамваев, автобусов и железнодорожного оборудования, сделав наши города зеленее, а общественный транспорт - предметом зависти Европы."
 GDR_Fortschritt: "Фортшритт"
 GDR_Fortschritt_desc: "Сельское хозяйство - основа самодостаточного государства. Бренд «Фортшритт», известный во всём Восточном блоке своими надёжными тракторами и комбайнами, возродится. Механизация наших коллективных хозяйств обеспечит продовольственную безопасность и покончит с зависимостью от западного импорта продовольствия."
 GDR_ORWO: "ОРВО"
 GDR_ORWO_desc: "В цифровую эпоху ОРВО обретает новую жизнь. Наш легендарный опыт в области плёнки и фотохимии может быть перепрофилирован для высокотехнологичных приложений: медицинской визуализации, специализированных датчиков и даже аналоговой плёнки для нового поколения художников, отвергающих цифровое единообразие."
 GDR_TAKRAF: "ТАКРАФ"
 GDR_TAKRAF_desc: "Землеройные гиганты ТАКРАФ когда-то изменяли наш ландшафт для добычи полезных ископаемых и строительства. Сегодня их опыт нужен нам для инфраструктурных проектов: строительства каналов, автомагистралей и фундаментов для новых социалистических городов. Оборудование ТАКРАФ построит будущее."
 GDR_wismut: "Висмут"
 GDR_wismut_desc: "«Висмут» когда-то был четвёртым в мире производителем урана, основой нашей энергетической независимости. С современными стандартами безопасности и восстановлением окружающей среды мы можем возобновить добычу стратегических минералов, обеспечив ресурсы, необходимые для нашей промышленности, не кланяясь иностранным корпорациям."

 GDR_interventionism_for_socialism: "Интервенционизм ради социализма"
 GDR_interventionism_for_socialism_desc: "Революция не может быть ограничена территорией бывшей ГДР. Рабочий класс по всей Европе страдает под сапогом капитала. Наш долг - поддерживать социалистические и прогрессивные движения повсюду, всеми необходимыми средствами. Интернационал будет реализован."
 GDR_dismantle_german_aggression: "Демонтаж немецкой агрессии"
 GDR_dismantle_german_aggression_desc: "Федеративная Республика - не мирный сосед, это экономическое сердце НАТО и реваншистское государство, стремящееся стереть само наше существование. Мы должны неустанно работать над демонтажем этого бастиона капитализма, поддерживая любые силы, которые ослабляют его изнутри и снаружи."
 GDR_support_rhineland_separatism: "Поддержка рейнского сепаратизма"
 GDR_support_rhineland_separatism_desc: "У Рейнской области всегда была своя самобытная культура, исторически более ориентированная на Францию и Бенилюкс, чем на Пруссию. Мы будем тайно финансировать и консультировать сепаратистские движения, предлагая им видение нейтральной, демилитаризованной Рейнской республики, свободной от господства Бонна."
 GDR_support_bavarian_separatism: "Поддержка баварского сепаратизма"
 GDR_support_bavarian_separatism_desc: "Консервативные элиты Баварии - наши враги, но традиционное недоверие баварского народа к гегемонии Пруссии можно использовать. Мы свяжемся с баварскими монархистами, автономистами и даже левыми сепаратистами, предлагая поддержку свободной и нейтральной Баварии."
 GDR_end_germany: "Покончить с Германией"
 GDR_end_germany_desc: "Сама концепция единого немецкого государства, рождённого из крови и железа Бисмарка, представляет угрозу европейскому миру. Наша конечная цель - роспуск Федеративной Республики на составляющие её исторические земли: конфедерацию свободных, социалистических или нейтральных республик от Рейна до Альп."
 GDR_silesian_revolt: "Силезское восстание"
 GDR_silesian_revolt_desc: "Земли к востоку от линии Одер-Нейсе были украдены у Германии, но они также были украдены у их исконных славянских жителей. Мы поддержим права силезского меньшинства в Польше, способствуя движению за автономию или независимость, которое ослабит наших общих врагов."
 GDR_end_czechia: "Покончить с Чехией"
 GDR_end_czechia_desc: "Чешская Республика - это вассал НАТО, предавший своё социалистическое прошлое и угнетающий немецкое меньшинство, оставшееся после 1945 года. Мы поддержим судето-немецкие активистские группы и словацких автономистов, работая над мирным роспуском этого искусственного государства."
 GDR_socialist_revolution_in_austria: "Социалистическая революция в Австрии"
 GDR_socialist_revolution_in_austria_desc: "Австрия, нейтральная на бумаге, но капиталистическая на деле, созрела для революции. Её рабочий класс помнит Красную Вену 1920-х годов. Мы предоставим финансирование, советников и идеологическую поддержку Коммунистической партии Австрии и радикальным профсоюзам, разжигая пламя классовой войны в Альпах."
 GDR_end_denmark: "Покончить с Данией"
 GDR_end_denmark_desc: "Дания, процветающий, но уязвимый член НАТО, контролирует жизненно важные проливы в Балтийское море. Мы поддержим левые движения в Копенгагене и движения за автономию в Гренландии и на Фарерских островах. Фрагментированная Скандинавия служит нашим стратегическим интересам и ослабляет империалистический блок."

