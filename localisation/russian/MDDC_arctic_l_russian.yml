 arctic_council_member_desc: "Арктический совет был учрежден Оттавской декларацией в 1996 году как межправительственный форум высокого уровня для содействия сотрудничеству между восемью арктическими государствами: Канадой, Данией (включая Гренландию и Фарерские острова), Финляндией, Исландией, Норвегией, Россией, Швецией и Соединенными Штатами. Шесть организаций, представляющих коренные народы Арктики, участвуют в работе Совета в качестве постоянных участников, обеспечивая их всесторонние консультации и вовлечение во все аспекты работы Совета. Совет занимается вопросами устойчивого развития и охраны окружающей среды в Арктике и работает в рамках пяти рабочих групп, занимающихся мониторингом, охраной природы, реагированием на чрезвычайные ситуации и защитой морской среды. Все решения принимаются государствами-членами на основе консенсуса."
