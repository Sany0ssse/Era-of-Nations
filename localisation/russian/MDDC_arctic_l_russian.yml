 arctic.1.t: "Соглашение о совместных Исследованиях в Арктике"
 arctic.1.d: "[FROM.GetNameWithFlag] Предлагает договор о совместных Исследований в Арктике"
 arctic.1.a: "Да, почему нет"
 arctic.1.b: "Нет"

 arctic.2.t: "Соглашение о совместной Добыче в Арктике"
 arctic.2.d: "[FROM.GetNameWithFlag] Предлагает договор о совместной Добыче в Арктике"
 arctic.2.a: "Да, почему нет"
 arctic.2.b: "Нет"

 arctic.4.t: "Предложение Принято"
 arctic.4.d: "[FROM.GetNameWithFlag] Принял наше предложение"
 arctic.4.a: "Хорошо"

 arctic.5.t: "Предложение Отклонено"
 arctic.5.d: "[FROM.GetNameWithFlag] Отклонил наше предложение"
 arctic.5.a: "Возможно в Другой Раз"

 arctic.3.t: "Резолюция по Добыче в Арктике"
 arctic.3.d: "Должны ли мы позволить странам добывать ресурсы в Арктике?"
 arctic.3.a: "Да"
 arctic.3.b: "Нет"

 arctic.6.t: "Резолюция о Добыче в Арктике Принята"
 arctic.6.d: "Арктическая Ресурсная Лихорадка Началась"
 arctic.6.a: "Ок"

 arctic.7.t: "Резолюция о Добыче в Арктике не Принята"
 arctic.7.d: "Резолюция о разрешении странам добывать ресурсы в Арктике так и не была принята"
 arctic.7.a: "Ок"

 arctic.8.t: "Голосование за исключение"
 arctic.8.d: "[FROM.GetNameWithFlag] Инициировал Голосование за Исключение [?var:global.arctic_member_to_kick.GetNameWithFlag] из Арктического Совета"
 arctic.8.a: "Бан"
 arctic.8.b: "Нет"

 arctic.9.t: "Резолюция об исключении члена Арктического совета была принята успешно"
 arctic.9.d: "Резолюция об исключении [?THIS.arctic_member_to_kick.GetNameWithFlag] из Арктического Совета Успешна"
 arctic.9.a: "Ок"

 arctic.10.t: "Резолюция об исключении члена Арктического совета не была принята"
 arctic.10.d: "[?THIS.arctic_member_to_kick.GetNameWithFlag] остается членом Арктического Совета"
 arctic.10.a: "Ок"

 arctic.11.t: "Научная база построенна"
 arctic.11.d: "Наши инвестиции в Регион [?arctic_region_to_build_lab] окупились и позволили нам создать новый исследовательский комплекс, благодаря которому мы ускорим наш процесс изучения арктического пространства и недр"
 arctic.11.a: "Хорошо"

 arctic.12.t: "Бой в Арктике Проигран"
 arctic.12.d: "Проигран бой за Сектор [?FROM.arctic_region_to_attack_number]"
 arctic.12.a: "Плохо"

 arctic.13.t: "Бой в Арктике Выигран"
 arctic.13.d: "Выигран бой за Сектор [?FROM.arctic_region_to_attack_number]"
 arctic.13.a: "Хорошо"

 arctic.14.t: "[FROM.GetNameWithFlag] хочет купить сектор в Арктике"
 arctic.14.d: "[FROM.GetNameWithFlag] они готовы заплатить нам крупную сумму денег в обмен на то, что мы продадим им наши секторальные территории в Арктике"
 arctic.14.a: "Мы согласны"
 arctic.14.b: "Нет"

 arctic.15.t: "[FROM.GetNameWithFlag] согласились продать территории"
 arctic.15.d: "[FROM.GetNameWithFlag] согласились передать нам контроль над территориями своего сектора в обмен на обещанную нами сумму денег"
 arctic.15.a: "Хорошо"

 arctic.16.t: "[FROM.GetNameWithFlag] отказались продать территории"
 arctic.16.d: "[FROM.GetNameWithFlag] не заинтересован в продаже нам части своих территорий"
 arctic.16.a: "Мех"

 arctic.17.t: "Генерал Убит"
 arctic.17.d: "[arctic_general_name] был убит во время сражения"
 arctic.17.a: "Отдать честь"

 arctic.18.t: "Ас Убит"
 arctic.18.d: "Один из [ROOT.GetNameWithFlag] один из самых известных асов погиб при исполнении служебных обязанностей. Пилоты, вернувшиеся с боевого задания, сообщают, что видели, как ас, охваченный пламенем, упал под шквальным огнем противника. К сожалению, поскольку убитый ас уже давно стал публичной фигурой, кончина аса сильно деморализовала многих людей, которые равнялись на него.\n\n Хотя мы и хотели бы, чтобы был способ скрыть это событие от людей, отсутствие публичных выступлений аса вскоре вызвало бы подозрения. В конечном счете, смерть аса - это еще одна часть легенды, которая, мы надеемся, будет жить еще долго, несмотря на наши нынешние проблемы."
 arctic.18.a: "Отдать честь"

 arctic.19.t: "Появление Аса"
 arctic.19.d: "Немногие рискуют так сильно, как отважные пилоты [ROOT.GetNameWithFlag] ВВС. Опытный пилот, отличившийся не только тем, что вернулся живым, но и тем, что управлял самолетом с огромным мастерством. Недавно пилот был на задании и сыграл важную роль в успехе этой критической операции. Недавнее повышение пилота, отмеченное как яркий пример мужества, получило широкую огласку. Хотя люди могут воспринимать войну скорее как ад, чем как славу, многие рады видеть, что все еще есть герои, за которыми можно сплотиться."
 arctic.19.a: "Вот как рождаются легенды"

 arctic.20.t: "Переговоры по Арктическим землям"
 arctic.20.d: "[FROM.GetNameWithFlag] просит нас признать Сектор [?global.arctic_land_to_squander] как его территорию"
 arctic.20.a: "Да заберите уже этот кусок льда"
 arctic.20.b: "Мы не разбазариваем казённые земли"

 arctic.21.t: "[FROM.GetNameWithFlag] Хочет стать Наблюдателем"
 arctic.21.d: "[FROM.GetNameWithFlag] Направил нам запрос о ратификации своего статуса наблюдателя в Арктическом совете"
 arctic.21.a: "Мы согласны"
 arctic.21.b: "Нет"

 arctic.22.t: "Принята резолюция о ратификации нового статуса государства-наблюдателя в Арктическом Совете"
 arctic.22.d: "Резолюация по ратификации [FROM.GetNameWithFlag] статуса Наблюдателя Арктического Совета Принята"
 arctic.22.a: "Хорошо"

 arctic.23.t: "Резолюция о ратификации нового статуса государства-наблюдателя в Арктическом совете провалилась"
 arctic.23.d: "Резолюция о ратификации [FROM.GetNameWithFlag] статуса Наблюдателя Арктического Совета не Принята"
 arctic.23.a: "Мех"

 arctic.24.t: "[FROM.GetNameWithFlag] хочет стать председателем Арктического Совета"
 arctic.24.d: "[FROM.GetNameWithFlag] Направил нам запрос о ратификации своего статуса члена Арктического совета"
 arctic.24.a: "Мы согласны"
 arctic.24.b: "Нет"

 arctic.25.t: "Резолюция о ратификации нового члена Арктического совета вступила в силу"
 arctic.25.d: "Резолюция о ратификации [FROM.GetNameWithFlag] статуса члена Арктического Совета вступила в силу"
 arctic.25.a: "Хорошо"

 arctic.26.t: "Резолюция о ратификации нового члена Арктического совета не принята"
 arctic.26.d: "Резолюция о ратификации [FROM.GetNameWithFlag] статуса члена Арктического Совета не принята"
 arctic.26.a: "Мех"

 arctic.27.t: "Арктическая Военная База"
 arctic.27.d: "Строительство Арктической Военной Базы [?arctic_region_to_build_military_base] завершено"
 arctic.27.a: "Хорошо"

 arctic.28.t: "Арктические Военные Учения с [FROM.GetNameWithFlag]"
 arctic.28.d: "Совместные военные учения позволят нам обменяться военным опытом и подготовиться к возможным боевым операциям, выявить и устранить недостатки нашей армии и проверить боевую эффективность вооружений."
 arctic.28.a: "Да начнутся Игры"
 arctic.28.b: "Не лучшее время"

 arctic.30.t: "[FROM.GetNameWithFlag] согласился проведению совместных учений"
 arctic.30.d: "[FROM.GetName] договорились о проведении с нами военных учений. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам."
 arctic.30.a: "Отлично!"

 arctic.29.t: "[FROM.GetNameWithFlag] отказался от проведения военных учений"
 arctic.29.d: "[FROM.GetName] отказались проводить с нами военные учения. Возможно, сейчас для них не лучшее время."
 arctic.29.a: "Может позже..."

 arctic.31.t: "Исследование Арктического Региона"
 arctic.31.d: "Исследование Арктического Региона [?arctic_region_to_research] завершено"
 arctic.31.a: "Отлично"

 arctic.42.t: "Арктическая Авиабаза"
 arctic.42.d: "Постройка Авиабазы в Секторе [?arctic_region_to_build_air_base] Арктики завершено"
 arctic.42.a: "Отлично"

 arctic.43.t: "Арктическая База Флота"
 arctic.43.d: "Строительство базы флота в Секторе [?arctic_region_to_build_navy_base] Арктики завершено"
 arctic.43.a: "Отлично"

 arctic.44.t: "Арктические Пусковые"
 arctic.44.d: "Строительство Пусковых в Секторе [?arctic_region_to_build_nuclear_base] Арктики завершено"
 arctic.44.a: "Отлично"

 arctic.32.t: "Арктический Торговый Путь"
