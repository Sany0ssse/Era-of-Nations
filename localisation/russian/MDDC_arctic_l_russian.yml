 arctic.32.a: "Мы поддержим инициативу"
 arctic.32.b: "Нет"

 arctic.33.t: "Инициатива Арктического Торогового Пути Успешна"
 arctic.33.d: "Инициатива по созданию Арктического торгового маршрута увенчалась успехом"
 arctic.33.a: "Отлично"

 arctic.34.t: "Инициатива Арктического Торогового Пути не Принята"
 arctic.34.d: "Инициатива по созданию Арктического торгового маршрута провалилась"
 arctic.34.a: "Возможно позже..."

 arctic.35.t: "Голосование за отстранение наблюдателя от Арктического совета"
 arctic.35.d: "[FROM.GetNameWithFlag] инициировал голосование по исключению [?var:global.arctic_observer_to_kick.GetNameWithFlag] из Наблюдателей Арктического Совета"
 arctic.35.a: "Бан"
 arctic.35.b: "Нет"

 arctic.36.t: "Резолюция об отстранении наблюдателя от Арктического совета принята успешно"
 arctic.36.d: "Резолюация об устранении [?THIS.arctic_observer_to_kick.GetNameWithFlag] от Арктического совета принята успешно"
 arctic.36.a: "Ок"

 arctic.37.t: "Резолюция об отстранении наблюдателя от Арктического совета провалилась"
 arctic.37.d: "[?THIS.arctic_observer_to_kick.GetNameWithFlag] остается Наблюдателем Арктического Совета"
 arctic.37.a: "Ок"

 arctic.38.t: "[FROM.GetNameWithFlag] Добыча Ресурсов"
 arctic.38.d: "[FROM.GetNameWithFlag] Начал Добычу Ресурсов в Арктике"
 arctic.38.a: "Должны ли мы?"

 arctic.39.t: "Ядерный Удар в Арктике"
 arctic.39.d: "[FROM.GetNameWithFlag] нанес Ядерный Удар по объектам в Арктике"
 arctic.39.a: "Это плохо"

 arctic.40.t: "Арктическое соглашение отменено"
 arctic.40.d: "[FROM.GetNameWithFlag] Отменил наше соглашение по Добыче"
 arctic.40.a: "Плохо"

 arctic.41.t: "Арктическое соглашение отменено"
 arctic.41.d: "[FROM.GetNameWithFlag] Отменил наше соглашение по Исследованиям"
 arctic.41.a: "Плохо"

 arctic.45.t: "Выборы Председателя Совета Начаты"
 arctic.45.d: "Пришло время выбрать нового председателя Арктического совета"
 arctic.45.a: "Ок"

 arctic.46.t: "Председатель Совета Выбран"
 arctic.46.d: "[?THIS.arctic_chairman.GetNameWithFlag] был избран председателем Арктического совета"
 arctic.46.a: "Ок"

 arctic.47.t: "Ученые в Арктике Хотят Суши"
 arctic.47.d: "Один из сотрудников нашей арктической базы написал в социальных сетях, что хочет съесть суши"
 arctic.47.a: "Доставить"
 arctic.47.b: "нет"

 arctic.48.t: "Доставка суши в Арктике"
 arctic.48.d: "Мы доставили суши сотруднику нашей арктической базы, и он поблагодарил нас."
 arctic.48.a: "Ок"

 arctic.49.t: "Ученый в Арктике Замерз"
 arctic.49.d: "Рабочий на арктической станции замерз насмерть из-за того, что на нем не было шапки."
 arctic.49.a: "Надо было слушать бабушку"

 arctic.50.t: "Агарта Найдена"
 arctic.50.d: "Один из наших военнослужащих из контингента, дислоцированного в Арктике, утверждает, что он нашел вход в Агарту и видел, как оттуда взлетал НЛО. Ему определенно нужно больше спать и меньше пить энергетических напитков."
 arctic.50.a: "В дурку его"

 arctic.51.t: "T-34 Полярный Медведь"
 arctic.51.d: "На нашей арктической территории обнаружен белый медведь с надписью Т-34. Из-за надписи ему трудно охотиться. Сейчас его подкармливают наши военные, похоже, они привыкли друг к другу. Что нам делать?"
 arctic.51.a: "Военные о нем позаботятся"
 arctic.51.b: "Поймать и Помыть"

 arctic.52.t: "Хаски Лайка"
 arctic.52.d: "На нашу военную базу прибыл пес смешанной породы. Военные кормят его и уже привыкли к нему. Следует ли нам оставить собаку военным или найти хозяев?"
 arctic.52.a: "Военные разберутся"
 arctic.52.b: "Найти хозяев"

 arctic.53.t: "Потерявшейся немец в Арктике"
 arctic.53.d: "На нашу базу в Арктике наткнулся заблудившийся человек. Похоже, он говорит по-немецки. Впустите его?"
 arctic.53.a: "Да"
 arctic.53.b: "Выглядит ССомнительно"

 arctic.54.t: "Заброшенная база в Арктике"
 arctic.54.d: "Во время исследования Арктического региона была обнаружена заброшенная база флота. Немного реставрационных работ, и ее можно использовать."
 arctic.54.a: "Отлично"

 arctic.55.t: "Новый Вирус"
 arctic.55.d: "Во время исследования Арктического региона были обнаружены образцы древнего вируса."
 arctic.55.a: "Исследуйте с осторожностью"

 arctic.56.t: "Бактерия Найдена в Арктике"
 arctic.56.d: "Во время исследования Арктического региона были найдены образцы древней бактерии."
 arctic.56.a: "Исследуйте с Осторожностью"

 arctic.57.t: "Вымершее Животное в Арктике"
 arctic.57.d: "Во время исследования Арктического региона был найден замерзший труп древнего животного."
 arctic.57.a: "Исследуйте с Осторожностью"

 arctic.58.t: "Пропавшая Экспедиция"
 arctic.58.d: "Во время исследования Арктического региона были найдены замерзшие трупы пропавшей экспедиции."
 arctic.58.a: "Изучить и в Музей"

 arctic.59.t: "Новый Минерал в Арктике"
 arctic.59.d: "Во время исследования Арктического региона были обнаружены новые типы минералов."
 arctic.59.a: "Изучить"

 arctic.60.t: "Федор Конюхов в Арктике"
 arctic.60.d: "Федор Конюхов пришел на чай на одну из наших Арктических Баз."
 arctic.60.a: "Ему настолько скучно?"

