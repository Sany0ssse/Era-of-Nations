l_russian:
 eon_eu_council_ballot_status:0 "Текущее голосование Совета ЕС"
 eon_eu_council_ballot_status_desc:0 "Повестка №[?global.current_active_vote_disp|0]. Голоса: за [?global.EU_active_vote_yes|0], против [?global.EU_active_vote_no|0]; всего государств с правом голоса [?global.eon_eu_voters|0]. Доля населения за: [?global.EU_pop_ratio_yes|%1]. Обычные решения требуют не менее 55% государств и 65% населения; блокирующее меньшинство должно включать минимум четыре государства. Договорные и отдельные политические реформы требуют единогласного решения: явное воздержание допустимо, отсутствие ответа не означает согласия. Голос можно изменить до завершения процедуры. Современная система применяется как игровая временная условность, в том числе к старту 2000 года."
 eon_eu_council_vote_yes:0 "Совет ЕС: голосовать за"
 eon_eu_council_vote_yes_desc:0 "Поддержать текущую повестку. У государства один голос; повторное нажатие не добавляет новые голоса."
 eon_eu_council_vote_no:0 "Совет ЕС: голосовать против"
 eon_eu_council_vote_no_desc:0 "Отклонить текущую повестку. Этот выбор заменяет ранее поданный голос."
 eon_eu_council_vote_abstain:0 "Совет ЕС: воздержаться"
 eon_eu_council_vote_abstain_desc:0 "Явно воздержаться. При квалифицированном большинстве этот голос не помогает достичь порога; при единогласии воздержание не является вето."
 eon_eu_office_nomination_ready_tt:0 "Предложить подходящего кандидата на учреждённую и свободную должность. Другое голосование о назначении не должно идти. Учитываются приостановление прав голоса, сроки кандидата и членство в еврозоне для ЕЦБ. Для назначения нужно соответствующее голосование Совета, Парламента или правления; флаг обозначает происхождение кандидата."
