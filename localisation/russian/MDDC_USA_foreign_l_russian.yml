l_russian:
 
 USA_foreign_europe: "Политика в Европе"
 USA_foreign_europe_desc: "Пришло время заняться политикой в европейском регионе, несмотря на окончание Холодной войны. Долгожданная американская гегемония так и не наступила."
 USA_foreign_europe_expand_nato: "Расширение НАТО"
 USA_foreign_europe_expand_nato_desc: "Пришло время расширить НАТО, железный занавес пал, как и его архитектор — СССР, и мы готовы приблизиться к границам России."
 USA_foreign_europe_baltika: "НАТО — Балтия"
 USA_foreign_europe_baltika_desc: "Мы готовы предложить странам Прибалтики членство в НАТО, и пора защитить этот регион."
 USA_foreign_europe_balkans: "НАТО — Балканы"
 USA_foreign_europe_balkans_desc: "Мы готовы предложить странам Балкан членство в НАТО, и пора защитить этот регион."
 USA_foreign_europe_balkans_two: "Второе расширение на Балканах"
 USA_foreign_europe_balkans_two_desc: "Войны в Югославии показали, что мир на Балканах возможен только при поддержке НАТО. Сейчас у нас есть немало кандидатов для нового расширения НАТО."
 USA_foreign_europe_reagirovanie: "Силы оперативного реагирования НАТО"
 USA_foreign_europe_reagirovanie_desc: "Армии НАТО — это огромная боевая машина, но иногда нужно действовать быстро по всему миру, не дожидаясь развертывания всех сил. Поэтому мы планируем создать новое подразделение Альянса для решения таких задач."
 USA_foreign_europe_nato_north: "Многонациональный корпус Северо-Восток"
 USA_foreign_europe_nato_north_desc: "Северный фланг НАТО нуждается в усилении, будет создан подходящий корпус вооружённых сил стран-участниц в северных регионах для лучшей координации и взаимодействия."
 USA_foreign_europe_nato_south: "Многонациональный корпус Юго-Восток"
 USA_foreign_europe_nato_south_desc: "Южный фланг НАТО нуждается в усилении, будет создан подходящий корпус вооружённых сил стран-участниц в северных регионах для лучшей координации и взаимодействия."
 USA_foreign_europe_nato_oper: "Силы реагирования Альянса"
 USA_foreign_europe_nato_oper_desc: "Современная война требует быстрой переброски войск в ключевые точки наступления противника. Мы намерены создать воинское подразделение, которое сможет решать такие задачи на любом фронте."
 USA_foreign_europe_hohol: "Поддержка демократии на Украине"
 USA_foreign_europe_hohol_desc: "С момента образования Украина проявила себя как страна, стремящаяся к демократии, в отличие от своего бывшего гегемона — России, которая, похоже, снова скатывается к диктатуре."
 USA_foreign_europe_hohol_nato: "Партнерство с НАТО"
 USA_foreign_europe_hohol_nato_desc: "Мы намерены оказывать Украине помощь через НАТО для сохранения её независимости и демократии."
 USA_foreign_europe_hohol_attack: "Операция 'Руїна'"
 USA_foreign_europe_hohol_attack_desc: "Похоже, у нас нет выбора, кроме как начать военную операцию на Украине. Пусть Господь хранит нас и наши вооружённые силы."
 USA_foreign_europe_hohol_revoult: "Спонсорские печеньки"
 USA_foreign_europe_hohol_revoult_desc: "Мы проведём рискованную политическую операцию, которая может изменить баланс сил на Украине."
 USA_foreign_europe_russia: "Поддержка демократии в России"
 USA_foreign_europe_russia_desc: "Хотя в России есть шанс скатиться к диктатуре, мы намерены поддерживать демократические силы ради освобождения России от оков диктаторов."
 USA_foreign_europe_russia_nato: "Пригласить Россию в НАТО"
 USA_foreign_europe_russia_nato_desc: "Возможно, пора изменить само представление о НАТО, ведь Россия больше не СССР и готова стать частью Запада."
 USA_foreign_europe_russia_attack: "Операция 'Глиняный колосс'"
 USA_foreign_europe_russia_attack_desc: "Страшное решение ради лучшего будущего — мы объявляем военную операцию против России."
 USA_foreign_europe_russia_separ: "Поддержка сепаратистских движений"
 USA_foreign_europe_russia_separ_desc: "Мы намерены финансировать сепаратистские движения по всей России. Народ России стремится к свободе!"
 USA_foreign_europe_belarus: "Поддержка демократии в Беларуси"
 USA_foreign_europe_belarus_desc: "Беларусь — особая страна рядом с двумя соседями: не такая огромная, но всё равно важная для нас как плацдарм."
 USA_foreign_europe_belarus_nato: "Партнерство с НАТО"
 USA_foreign_europe_belarus_nato_desc: "Мы намерены развивать с Беларусью военное партнёрство в рамках НАТО, чтобы обезопасить страну от возможной оккупации агрессивными соседями."
 USA_foreign_europe_belarus_revoult: "Спонсируем революцию"
 USA_foreign_europe_belarus_revoult_desc: "Слишком долго Беларусь находилась под властью диктаторов и оккупантов — пора попытаться её освободить."
 USA_foreign_europe_belarus_attack: "Операция 'Лесные болота'"
 USA_foreign_europe_belarus_attack_desc: "Ничто не спасет Беларусь, кроме исцеляющей дозы демократической интервенции."
 USA_foreign_europe_moldova: "Поддержка демократии в Молдове"
 USA_foreign_europe_moldova_desc: "Молдова — небольшая страна, пережившая много проблем после распада СССР. Россия не позволила объединить страну и поддерживает Приднестровье, чтобы не дать Молдове стать частью европейской семьи."
 USA_foreign_europe_moldova_nato: "Партнерство с НАТО"
 USA_foreign_europe_moldova_nato_desc: "Из-за своего малого размера Молдова всё еще нуждается в защите, так как возможная агрессия соседей может привести к исчезновению страны."
 USA_foreign_europe_moldova_attack: "Операция 'Захлебнуться вином'"
 USA_foreign_europe_moldova_attack_desc: "Правительство Молдовы не оставило нам выбора — мы готовы провести военную операцию против опасного государства."
 USA_foreign_europe_moldova_revoult: "Встряхнем Молдову"
 USA_foreign_europe_moldova_revoult_desc: "Похоже, пришло время применить политические инструменты в отношении Молдовы — мирные решения уже невозможны."
 USA_foreign_europe_pmr: "Влиять на Приднестровье"
 USA_foreign_europe_pmr_desc: "Похоже, поддерживать Молдову нам невыгодно. Однако в Приднестровье для нас больше пользы в будущем."
 USA_foreign_europe_pmr_base: "Миротворцы в Приднестровье"
 USA_foreign_europe_pmr_base_desc: "Мы намерены отправить наших миротворцев в Приднестровье для защиты этого региона от внешних угроз."
 USA_foreign_europe_pmr_state: "Признать Приднестровье государством"
 USA_foreign_europe_pmr_state_desc: "Мы готовы признать Приднестровье в качестве государства, несмотря на недовольство мировых лидеров."
 USA_foreign_europe_pmr_attack_mlv: "Операция 'Объединённый Днестр'"
 USA_foreign_europe_pmr_attack_mlv_desc: "Мы готовы начать военную операцию вместе с армией Приднестровья для объединения Молдовы под властью Тирасполя."
 USA_foreign_europe_nato_fin: "Расширение НАТО: Финляндия"
 USA_foreign_europe_nato_fin_desc: "Мы снова расширим НАТО — пора усилить северные границы."
 USA_foreign_europe_nato_sweden: "Расширение НАТО: Швеция"
 USA_foreign_europe_nato_sweden_desc: "Мы снова расширим НАТО — пора усилить северные границы."
 USA_foreign_asia: "Политика в Азии"
 USA_foreign_asia_desc: "Несмотря на конец Холодной войны, в Азии ещё много проблем и влиятельных стран, с которыми нам предстоит работать."
 USA_foreign_asia_korea_peace: "Мирная инициатива"
 USA_foreign_asia_korea_peace_desc: "Нужно поддерживать мирное объединение, чтобы предотвратить новую войну и обезопасить торговые пути, а также сдерживать растущее влияние Китая."
 USA_foreign_asia_stop_propaganda: "Остановить аудиопропаганду"
 USA_foreign_asia_stop_propaganda_desc: "Объединения не будет, если Южная Корея будет дестабилизировать отношения с КНДР через громкоговорители."
 USA_foreign_asia_korea_exercises: "Совместные учения с армиями Кореи"
 USA_foreign_asia_korea_exercises_desc: "Проводя совместные учения, мы не только усилим наше присутствие, но и получим больше доверия от северокорейского государства."
 USA_foreign_asia_korea_stop_preasure: "Снять санкции с КНДР"
 USA_foreign_asia_korea_stop_preasure_desc: "Сняв санкции, мы откроем путь к нормализации всех наших отношений."
 USA_foreign_asia_unification_summit: "Саммит единой Кореи"
 USA_foreign_asia_unification_summit_desc: "Мы предложим обеим Кореям забыть прежние обиды и объединить полуостров. Форму объединения пусть выберут сами жители."
 USA_foreign_asia_invite_new_korea: "Интеграция объединённой Кореи в мировое сообщество"
 USA_foreign_asia_invite_new_korea_desc: "Теперь, когда Корея обрела силу, мы можем интегрировать её в мировое сообщество, завершив затяжной конфликт в регионе."
 USA_foreign_asia_korea_war: "Искоренение коммунизма в Корее"
 USA_foreign_asia_korea_war_desc: "Нельзя позволять тоталитарному государству, такому как КНДР, угрожать нашему присутствию. США всегда будут на стороне демократии и распространять её по всему миру."
 USA_foreign_asia_korea_war_exercises: "Интенсивные учения с Южной Кореей"
 USA_foreign_asia_korea_war_exercises_desc: "Недопустимо, чтобы КНДР вновь захватила большую часть территории Южной Кореи. В 1950 году это получилось из-за внезапности, сейчас всё иначе."
 USA_foreign_asia_korea_war_sanctions: "Усилить санкции против КНДР"
 USA_foreign_asia_korea_war_sanctions_desc: "У КНДР могут быть ядерные вооружения, но мы все равно способны ударить по экономике."
 USA_foreign_asia_korea_war_quad: "Пригласить Корею в QUAD"
 USA_foreign_asia_korea_war_quad_desc: "Южная Корея не останется без союзников. Поэтому вступление в наш азиатский клуб крайне выгодно для них."
 USA_foreign_asia_korea_war_nuclear: "Атомный K-POP"
 USA_foreign_asia_korea_war_nuclear_desc: "Сейчас КНДР гордится тем, что обладает ядерным оружием на полуострове. Что ж, разочаруем их."
 USA_foreign_asia_korea_second_war: "Вторая Корейская война"
 USA_foreign_asia_korea_second_war_desc: "Пришло время нести демократию северокорейскому народу и освободить его от тоталитарного режима."
 USA_foreign_asia_indian_resources: "Жемчужина Азии"
 USA_foreign_asia_indian_resources_desc: "Мы можем договориться с Индией о совместной добыче ресурсов в обмен на технологии и оружие."
 USA_foreign_asia_indian_space_cooperation: "Космическое сотрудничество с ISRO"
 USA_foreign_asia_indian_space_cooperation_desc: "Благодаря сотрудничеству с Индией в освоении космоса мы не только получим ценный опыт, но и заставим Китай тратить больше на свою программу."
 USA_foreign_asia_indian_modernization: "Сотрудничество с индийской армией"
 USA_foreign_asia_indian_modernization_desc: "Проводя военные учения с индийской армией, мы получим сильного союзника, который поможет нам сдерживать интересы других держав."
 USA_foreign_asia_indian_new_mma: "Главный союзник НАТО в Южной Азии"
 USA_foreign_asia_indian_new_mma_desc: "С таким сильным союзником, как Индия, соотношение сил в регионе изменится в нашу пользу на долгие годы."
 USA_foreign_asia_indian_quad: "Пригласить Индию в QUAD"
 USA_foreign_asia_indian_quad_desc: "Без Индии в этом союзе наш план по окружению Китая не будет полностью реализован."
 USA_foreign_asia_pakistan_humanitarian: "Гуманитарная миссия в Пакистане"
 USA_foreign_asia_pakistan_humanitarian_desc: "Пакистан находится в тяжёлом положении из-за природных особенностей. Необходимо помочь ему восстановиться, предоставив долгосрочные кредиты, чтобы сделать его полностью зависимым от нас." 
USA_foreign_asia_pakistan_training: "Сотрудничество с армией Пакистана"
USA_foreign_asia_pakistan_training_desc: "Пакистан во многом уступает своему соседу Индии, а также крайне уязвим к возможному вторжению Китая. Необходимо подготовить их армию к длительному противостоянию и потенциальной войне."
USA_foreign_asia_pakistan_mma: "Старый союзник Холодной войны"
USA_foreign_asia_pakistan_mma_desc: "Теперь, когда Пакистан снова с нами, мы можем сделать его нашим главным союзником НАТО в Южной Азии."
USA_foreign_asia_smo_bangladesh: "Вернуть Восточный Пакистан"
USA_foreign_asia_smo_bangladesh_desc: "После разрушительной войны 1971 года Пакистан потерял контроль над Бангладеш. Мы вернем контроль над этим регионом, проведя совместную военную операцию."
USA_foreign_asia_bangladesh_quad: "Пригласить Бангладеш в QUAD"
USA_foreign_asia_bangladesh_quad_desc: "Нам выгоднее поддерживать мирное сдерживание Индии, чем воевать с её возможным вмешательством."
USA_foreign_asia_new_kashmir_war: "Новая война за Кашмир"
USA_foreign_asia_new_kashmir_war_desc: "Настало время решить этот вопрос раз и навсегда, и на этот раз мы достигнем нашей цели."
USA_foreign_asia_japanese_nuclear: "Совместная ядерная программа с Японией"
USA_foreign_asia_japanese_nuclear_desc: "Хотя Япония придерживается мирного использования ядерной энергии, мы позволим ей увеличить производство ядерных материалов, конечно же, для мирных целей."
USA_foreign_asia_japanese_economic_prosperity: "Экономическое партнёрство с японским рынком"
USA_foreign_asia_japanese_economic_prosperity_desc: "Хотя японские компании известны своей продукцией, востребованной по всему миру, они также весьма уязвимы и могут быть описаны как умирающий бизнес. Мы воспользуемся этим, чтобы усилить своё присутствие на их рынке."
USA_foreign_asia_japanese_military_cooperation: "Наш главный союзник в Азии"
USA_foreign_asia_japanese_military_cooperation_desc: "Япония была нашим главным союзником во время Холодной войны и после её окончания. Её вклад в нашу политику сдерживания России и Китая трудно переоценить."
USA_foreign_asia_japanese_quad: "Пригласить Японию в QUAD"
USA_foreign_asia_japanese_quad_desc: "Благодаря членству Японии в этом альянсе мы сможем эффективнее сдерживать противников в Тихом океане."
USA_foreign_asia_create_quad: "Четырёхсторонний диалог по безопасности"
USA_foreign_asia_create_quad_desc: "Четырёхсторонний диалог по безопасности (QUAD) — это стратегический диалог США и их азиатских союзников по вопросам безопасности в Индо-Тихоокеанском регионе."
USA_foreign_asia_quad_indochina: "Расширение QUAD в Индокитае"
USA_foreign_asia_quad_indochina_desc: "Индокитай важен не только как ресурсный или торговый регион, но и как стратегическая зона для развертывания наших войск."
USA_foreign_asia_quad_oceania: "Расширение QUAD в Океании"
USA_foreign_asia_quad_oceania_desc: "Океания исторически является зоной интересов европейских и североамериканских держав, а также регионом, за которым пристально следят новые супердержавы. Мы должны не допустить появления их войск здесь в любой форме."
USA_foreign_asia_quad_invite_china: "Сделать немыслимое"
USA_foreign_asia_quad_invite_china_desc: "Несмотря на раннюю подготовку к войне и блокаде Китая, эта необходимость теперь отпала, ведь Китай начал считаться с нашими интересами."
USA_foreign_asia_taiwan_corps: "Честная конкуренция с тайваньскими компаниями"
USA_foreign_asia_taiwan_corps_desc: "Соревнуясь с тайваньскими компаниями, мы стимулируем национальных производителей к совершенствованию собственных технологий."
USA_foreign_asia_taiwan_production_usa: "Микрочипы для США"
USA_foreign_asia_taiwan_production_usa_desc: "США не могут позволить столь важной отрасли, как производство микрочипов, попасть в руки Китая."
USA_foreign_asia_taiwan_recognize: "Признать Тайвань"
USA_foreign_asia_taiwan_recognize_desc: "Главная ошибка прошлых администраций Белого дома — признание коммунистического Китая как законной власти. Мы исправим это недоразумение, восстановив истинную справедливость."
USA_foreign_asia_taiwan_un: "Вернуть Тайваню место в Совбезе ООН"
USA_foreign_asia_taiwan_un_desc: "Тайвань был настоящим победителем Второй мировой войны, и лишение его статуса члена Совета Безопасности ООН было признанием победы коммунизма в Азии."
USA_foreign_asia_taiwan_nuclear: "Передать ядерное оружие Тайваню"
USA_foreign_asia_taiwan_nuclear_desc: "Только передав ядерное оружие Тайваню, мы наконец сможем сдержать стремление Китая вернуть этот остров."
USA_foreign_asia_chinese_separatism: "Поддержать сепаратистов в Китае"
USA_foreign_asia_chinese_separatism_desc: "Китай — многонациональная страна, народы которой, особенно на западе, желают независимости от центрального правительства. Мы им с этим поможем."
USA_foreign_asia_one_china: "Политика одного Китая"
USA_foreign_asia_one_china_desc: "Мы не признаём Тайвань в качестве государства, ведь наши экономические интересы главным образом связаны с торговлей с Китаем, а не с Тайванем."
USA_foreign_asia_chinese_companies: "Переговоры с китайскими компаниями"
USA_foreign_asia_chinese_companies_desc: "Китай — это главная мировая экономика, претендующая на статус супердержавы наравне с нами. Мы должны учитывать это, формируя политику в их отношении, чтобы добиться самых выгодных условий для нас."
USA_foreign_asia_taiwan_smo: "Операция 'Рис'"
USA_foreign_asia_taiwan_smo_desc: "Долгое время мы не позволяли Китаю вернуть Тайвань, но теперь в этом больше нет нужды, и мы готовы провести первую в истории совместную операцию США и КНР по демилитаризации Тайваня и передаче его КНР."
USA_foreign_asia_two_chairs: "История двух стульев"
USA_foreign_asia_two_chairs_desc: "Хотя мы и не признаём Тайвань, мы всё равно можем проводить совместные учения и вести совместную экономическую политику. Одновременно мы продолжим торговать и с КНР."
USA_foreign_asia_korea_humanitarian: "Гуманитарная миссия в Северной Корее"
USA_foreign_asia_korea_humanitarian_desc: "Народ и экономика КНДР сильно пострадали не только от политики своего правительства, но и от наших санкций и природных катастроф. Мы поможем им восстановиться."
USA_foreign_asia_central_sponsor_democracies: "Спонсировать демократию в Центральной Азии"
USA_foreign_asia_central_sponsor_democracies_desc: "Благодаря поддержке республик Центральной Азии и демократических движений внутри них мы нанесём существенный удар по влиянию крупнейших держав."
USA_foreign_asia_kazbrig: "КАЗБРИГ"
USA_foreign_asia_kazbrig_desc: "Хотя формально КАЗБРИГ создан для миротворческих миссий под эгидой ООН, американские чиновники не скрывают возможности его использования в операциях НАТО в Азии."
USA_foreign_crusade_north: "Северный крестовый поход"
USA_foreign_crusade_north_desc: "Благодаря уникальному положению стран Центральной Азии по отношению к России мы можем нанести удар с юга, пройдя по малоразвитым регионам и окружив их."
USA_foreign_central_asian_mma: "Не-НАТО союзник в Центральной Азии"
USA_foreign_central_asian_mma_desc: "Мы не скрываем, что размещение НАТО рядом с Россией позволяет нам существенно растянуть её силы и ослабить её."
USA_foreign_asia_war_on_terror_afghan: "Шёлковый путь"
USA_foreign_asia_war_on_terror_afghan_desc: "Афганистан получил статус кладбища империй, ни одна сверхдержава не смогла полностью его покорить. Мы это исправим."
USA_foreign_asia_help_north: "Помощь северному афганскому правительству"
USA_foreign_asia_help_north_desc: "Власть талибов в Афганистане угрожает нашим интересам в Центральной и Южной Азии. Мы должны устранить эту террористическую организацию."
USA_foreign_asia_invade_with_regional_superpower: "Нужна ли специальная ссылка?"
USA_foreign_asia_invade_with_regional_superpower_desc: "Хотя наша цель — свергнуть талибов, мы не можем рисковать жизнями своих солдат. Мы пригласим другие державы присоединиться к нам."
USA_foreign_asia_afghan_regional_cooperation: "Сотрудничество с новым Афганистаном"
USA_foreign_asia_afghan_regional_cooperation_desc: "Укрепляя связи с Афганистаном, мы сможем влиять на все страны региона."
USA_foreign_europe_serb_democracy: "Поддержать демократию в Сербии"
USA_foreign_europe_serb_democracy_desc: "Сербский народ должен быть освобождён от недемократического правительства."
USA_foreign_europe_anti_serb: "Местный антисербский альянс"
USA_foreign_europe_anti_serb_desc: "В Сербии сильны реваншистские настроения, угрожающие безопасности наших союзников на Балканах. Мы создадим альянс против сербской экспансии."
USA_foreign_europe_thank_you_usa: "Спасибо, США"
USA_foreign_europe_thank_you_usa_desc: "Косово обрело независимость ценой больших жертв и разрушений. Мы не позволим Сербии вернуть себе контроль над Косово."
USA_foreign_europe_take_zhepa: "Операция 'Захват Рашки'"
USA_foreign_europe_take_zhepa_desc: "Мы нанесём финальный удар по сербскому реваншизму, освободив их народ от антидемократического правительства."
USA_foreign_europe_serb_humanitarian: "Гуманитарная миссия в Сербии"
USA_foreign_europe_serb_humanitarian_desc: "Сербия сильно пострадала от войн в Югославии и бомбардировок НАТО, которые мы считаем ошибкой. Мы исправим ошибку, помогая Сербии восстановиться."
USA_foreign_europe_retake_great_serbia: "Воссоединить всех сербов"
USA_foreign_europe_retake_great_serbia_desc: "Мы поможем Сербии вернуть исторические территории, укрепив влияние на Балканах и заполучив сильного союзника."
USA_foreign_europe_serbia_nato: "Пригласить Сербию в НАТО"
USA_foreign_europe_serbia_nato_desc: "Теперь, когда Сербия стала нашим ценным партнёром, мы можем пригласить её в наш Клуб."
USA_foreign_africa: "Политика в Африке"
USA_foreign_africa_desc: "Хотя африканские народы получили независимость от европейских держав, этот регион пребывает в состоянии войны из-за влияния великих держав. Мы не исключение — наши союзники и партнёры также нуждаются в защите и сотрудничестве для достижения реальной демократии в Африке." 
USA_foreign_africa_egypt_military: "Сотрудничество с армией Египта"
USA_foreign_africa_egypt_military_desc: "У Египта большая армия, и он наш стратегический партнер в Африке. Мы должны воспользоваться этой возможностью."
USA_foreign_africa_egypt_gaza_question: "Решить вопрос Газы"
USA_foreign_africa_egypt_gaza_question_desc: "Сектор Газа сейчас контролируется террористической группой ХАМАС, которая представляет прямую угрозу как Египту, так и Израилю. Мы должны созвать саммит союзников для окончательного решения этого вопроса."
USA_foreign_africa_egypt_nuclear_plus_subsidies: "Западные субсидии Египту"
USA_foreign_africa_egypt_nuclear_plus_subsidies_desc: "Мы можем финансировать ядерную программу Египта, а также поддерживать другие отрасли его экономики."
USA_foreign_africa_egypt_nato: "Обеспечить безопасность Суэца"
USA_foreign_africa_egypt_nato_desc: "Египет давно наш военный партнер, и приглашение его в НАТО кажется разумным шагом для обеспечения безопасности в регионе."
USA_foreign_africa_take_suez: "Повторить 1956 год"
USA_foreign_africa_take_suez_desc: "В прошлый раз мы поддержали Египет в войне за Суэцкий канал, но теперь кажется, что это была ошибка, так как Египет стал прямой угрозой международной торговле."
USA_foreign_africa_angola_military_cooperation: "Сотрудничество с армией Анголы"
USA_foreign_africa_angola_military_cooperation_desc: "Ангола выгодно расположена, что делает её ценным союзником на африканском континенте."
USA_foreign_africa_angola_resource_contract: "Ресурсный контракт с Анголой"
USA_foreign_africa_angola_resource_contract_desc: "В Анголе большие запасы нефти и полезных ископаемых, что делает её ценным торговым партнером."
USA_foreign_africa_angola_us_brigade: "Джонни едет в Африку"
USA_foreign_africa_angola_us_brigade_desc: "В обмен на нашу поддержку мы попросим Анголу пойти на уступки и, возможно, помочь другим нашим африканским союзникам."
USA_foreign_africa_angola_intervene_unita: "Операция 'Буря в стакане'"
USA_foreign_africa_angola_intervene_unita_desc: "Наша цель — защитить дружественный нам режим в Анголе от сепаратистов обеществa УНИТА."
USA_foreign_africa_unita_military_cooperation: "Сотрудничество с армией УНИТА"
USA_foreign_africa_unita_military_cooperation_desc: "УНИТА — наш исторический союзник, боровшийся против просоветского режима в Анголе. Мы должны развивать эти связи и объединять наши силы."
USA_foreign_africa_unita_call_allies: "Верность наших африканских союзников"
USA_foreign_africa_unita_call_allies_desc: "Мы запросим помощь для УНИТА у южноафриканских союзников."
USA_foreign_africa_unita_desert_oper: "Операция Засуха"
USA_foreign_africa_unita_desert_oper_desc: "Если наша армия не вмешается в гражданскую войну в Анголе, мы можем навсегда потерять ценного союзника — УНИТА."
USA_foreign_africa_winrar_eco: "Ключевой порт Южной Африки"
USA_foreign_africa_winrar_eco_desc: "ЮАР — ключевая страна, у берегов которой всегда проходит глобальная торговля. Экономическое сотрудничество очень выгодно для нас."
USA_foreign_africa_winrar_military: "Сотрудничество с армией ЮАР"
USA_foreign_africa_winrar_military_desc: "Защита экономических интересов на юге Африки сильно зависит от способности армии ЮАР защитить страну при нападении других государств."
USA_foreign_africa_winrar_mma: "ЮАР — основной внеблоковый союзник"
USA_foreign_africa_winrar_mma_desc: "Любая сверхдержава, решившая установить свои порядки в регионе, должна знать: мы будем стоять за интересы в ЮАР."
USA_foreign_africa_winrar_destroy_commies: "Крестовый поход против социалистического Мозамбика"
USA_foreign_africa_winrar_destroy_commies_desc: "Социалистический Мозамбик на границе с ЮАР — это угроза нашим интересам в регионе. Мы должны свергнуть антидемократический режим и принести демократию мозамбикскому народу."
USA_foreign_africa_congo_war: "Помощь правительству Конго"
USA_foreign_africa_congo_war_desc: "ДР Конго находится в крайне нестабильной ситуации. Мы отправим им дополнительную помощь."
USA_foreign_africa_congo_resources: "Богатейшая страна Африки"
USA_foreign_africa_congo_resources_desc: "В Конго большое разнообразие ресурсов, в которых мы очень заинтересованы."
USA_foreign_africa_congo_peace_summit: "Мирный саммит по перемирию"
USA_foreign_africa_congo_peace_summit_desc: "Необходимо достичь мира в конголезской войне, чтобы положить конец кровопролитию."
USA_foreign_africa_lybian_democracy: "Поддержка демократии в Ливии"
USA_foreign_africa_lybian_democracy_desc: "Правительство Ливии должно быть заменено более демократическим, и мы предоставим для этого все необходимые средства."
USA_foreign_africa_lybian_separatism: "Поддержка сепаратизма в Ливии"
USA_foreign_africa_lybian_separatism_desc: "Ливия — это лоскутное одеяло народов, готовое развалиться. Мы поможем народам Ливии обрести свободу."
USA_foreign_africa_lybian_sanctions: "Усилить санкции против Ливии"
USA_foreign_africa_lybian_sanctions_desc: "Усиливая санкции против Ливии, мы нанесём серьёзный вред её экономике."
USA_foreign_africa_lybian_unified_defender: "Операция 'Единый защитник'"
USA_foreign_africa_lybian_unified_defender_desc: "Операция 'Единый защитник' — это операция НАТО по исполнению резолюций СБ ООН 1970 и 1973 о гражданской войне в Ливии."
USA_foreign_africa_lybian_humanitarian: "Гуманитарная помощь для Ливии"
USA_foreign_africa_lybian_humanitarian_desc: "Ливия — не только бедная страна, но и жертва гражданской войны и режима Джамахирии. Мы отправим им помощь для восстановления."
USA_foreign_africa_lybian_democratic_bastion: "Бастион демократии в Северной Африке"
USA_foreign_africa_lybian_democratic_bastion_desc: "Ливия — не только пример торжества демократии, но и важный партнёр НАТО в Северной Африке. Разместив там войска, мы закрепим контроль в центральном Средиземноморье."
USA_foreign_africa_lybian_subsidies: "Субсидии для Ливии"
USA_foreign_africa_lybian_subsidies_desc: "Выделим крупную сумму на развитие ливийского государства."
USA_foreign_africa_lybian_nato: "Пригласить Ливию в НАТО"
USA_foreign_africa_lybian_nato_desc: "Если Ливия согласится, никто не сможет нам угрожать в Средиземноморье и Северной Африке."
USA_foreign_africa_somaly_military_cooperation: "Сотрудничество с армией Сомали"
USA_foreign_africa_somaly_military_cooperation_desc: "Сомали стратегически очень выгодно расположен — это позволяет контролировать морские пути в Индийском океане и Красном море."
USA_foreign_africa_somaly_us_brigade: "Дивизия рейнджеров"
USA_foreign_africa_somaly_us_brigade_desc: "Мы предоставим Сомали три добровольческие бригады, сформированные по стандартам НАТО."
USA_foreign_africa_somaly_anti_islamist: "Совместная борьба с исламистами"
USA_foreign_africa_somaly_anti_islamist_desc: "Исламистские группировки в Сомали представляют прямую угрозу нашему влиянию и мировой торговле."
USA_foreign_africa_somaly_mma: "Главный внеблоковый союзник на Африканском Роге"
USA_foreign_africa_somaly_mma_desc: "Сделав Сомали нашим главным союзником вне НАТО, мы упрочим позиции на Африканском Роге."
USA_foreign_africa_ethiopia_war: "Исторические земли Сомали"
USA_foreign_africa_ethiopia_war_desc: "Эфиопия удерживает территории, которые по праву должны принадлежать Сомали. Мы поможем их вернуть."
USA_foreign_africa_support_eth: "Поддержать Эфиопию в гражданской войне"
USA_foreign_africa_support_eth_desc: "Мы не позволим отделению территорий от Эфиопии. Сепаратизм грозит стабильности наших других союзников."
USA_foreign_africa_eth_somaly: "Операция 'Джубба'"
USA_foreign_africa_eth_somaly_desc: "С помощью армии Эфиопии мы положим конец анархии на Африканском Роге и установим в регионе выгодное нам правительство."
USA_foreign_africa_eth_cooperation: "Сотрудничество с армией Эфиопии"
USA_foreign_africa_eth_cooperation_desc: "Сотрудничество с эфиопской армией позволит ей напрямую влиять на соседей."
USA_foreign_africa_eth_mma: "Эфиопия — главный внеблоковый союзник"
USA_foreign_africa_eth_mma_desc: "Эфиопия — ценный союзник на Африканском Роге, и мы это используем."
USA_foreign_africa_invade_eth: "Поддержать Эритрею в гражданской войне"
USA_foreign_africa_invade_eth_desc: "Эритрея выгодно расположена географически, и нам важно защитить её независимость от Эфиопии."
USA_foreign_africa_uretrian_democracy: "Поддержка демократии в Эритрее"
USA_foreign_africa_uretrian_democracy_desc: "Мы выделим средства на поддержку демократии в Эритрее."
USA_foreign_africa_assist_eritrea: "Дополнительная поддержка Эритрее"
USA_foreign_africa_assist_eritrea_desc: "Мы отправим Эритрее дополнительные припасы."
USA_foreign_africa_eritrean_mma: "Главный союзник НАТО на Красном море"
USA_foreign_africa_eritrean_mma_desc: "Мы готовы защищать Эритрею от других государств, сделав её одним из ключевых союзников."
USA_foreign_africa_nigerian_oil: "Нефть Нигерии"
USA_foreign_africa_nigerian_oil_desc: "Нигерия — ключевой партнер в энергетическом секторе Западной Африки. Мы должны получить максимальную выгоду."
USA_foreign_africa_nigerian_anti_islamist: "Совместная кампания против исламистов"
USA_foreign_africa_nigerian_anti_islamist_desc: "Исламистские группировки очень активны в Нигерии. Мы поможем нигерийцам их подавить."
USA_foreign_africa_nigerian_military: "Сотрудничество с армией Нигерии"
USA_foreign_africa_nigerian_military_desc: "Обучение нигерийских военных увеличивает наши шансы на продолжение сотрудничества и прочность их правительства перед угрозами."
USA_foreign_africa_nigerian_mma: "Сделать Нигерию главным внеблоковым союзником"
USA_foreign_africa_nigerian_mma_desc: "При поддержке Запада нигерийское правительство будет в безопасности."
USA_foreign_africa_angola_coca_cola: "Частичка Америки в Анголе"
USA_foreign_africa_angola_coca_cola_desc: "Мы построим лучший завод Coca-Cola на юге Африки — в Анголе."
USA_foreign_africa_nigerian_coca_cola: "Завод в Абудже"
USA_foreign_africa_nigerian_coca_cola_desc: "Мы построим лучший завод Coca-Cola в Западной Африке — в Нигерии."
##########Events##########
usa_foreign.1.t: "Военная поддержка от США-НАТО"
usa_foreign.1.d: "Соединенные Штаты вместе со всем альянсом НАТО готовы оказать нам военную помощь, рассчитывая на будущее сотрудничество. Конечно, мы рады оснастить армию современной техникой, но стоит понимать, во что мы ввязываемся."
usa_foreign.1.a: "Да"
usa_foreign.1.b: "Нет"
usa_foreign.2.t: "[FROM.GetNameWithFlag] приняла нашу военную помощь"
usa_foreign.2.d: "Их правительство согласилось принять военную помощь, а значит, мы готовы увеличить влияние в этой стране."
usa_foreign.2.a: "Хорошо"
usa_foreign.3.t: "США предлагает помощь [FROM.GetNameWithFlag]"
usa_foreign.3.d: "США, будучи частью НАТО, начали оказывать помощь этой стране. Готовы ли мы присоединиться к инициативе?"
usa_foreign.3.a: "Да"
usa_foreign.3.b: "Нет"
usa_foreign.4.t: "Отправка военной помощи"
usa_foreign.4.d: "Груз военного оборудования сформирован, и мы готовы отправить его будущему союзнику!"
usa_foreign.4.a: "Отлично"
usa_foreign.5.t: "Военная помощь от США"
usa_foreign.5.d: "Военно-транспортные самолёты США уже прибыли в нашу страну с военными грузами, мы готовы пополнить армию."
usa_foreign.5.a: "Отлично"
usa_foreign.6.t: "Военная помощь от [FROM.GetNameWithFlag]"
usa_foreign.6.d: "Армии НАТО также оказывают нам поддержку, и поступила новая партия военной помощи."
usa_foreign.6.a: "Хорошо"
usa_foreign.7.t: "[FROM.GetNameWithFlag] отклонила военную помощь"
usa_foreign.7.d: "Их правительство отказалось поставлять вооружение, посчитав это опасной затеей."
usa_foreign.7.a: "Печально"
usa_foreign.8.t: "США признали нас государством"
usa_foreign.8.d: "Соединённые Штаты официально признали нас независимым государством, что стало неожиданностью."
usa_foreign.8.a: "Ничего себе"
usa_foreign.9.t: "США предлагает атаку на Молдову"
usa_foreign.9.d: "Через секретные дипломатические и военные каналы мы получили сообщение о планах США провести военную операцию на территории Молдовы, но только с нашего согласия. Готовы ли мы пойти на такой риск?"
usa_foreign.9.a: "Да"
usa_foreign.9.b: "Нет"
usa_foreign.10.t: "Приднестровье отказало"
usa_foreign.10.d: "Правительство Приднестровья отвергло наше предложение, похоже, они не хотят решать конфликт силой."
usa_foreign.10.a: "Печально"
usa_foreign.11.t: "США предлагают разместить миротворцев"
usa_foreign.11.d: "Похоже, правительство США выбрало сторону в конфликте и готово поддержать нас, заявив о готовности разместить миротворцев в регионе."
usa_foreign.11.a: "Они нам нужны"
usa_foreign.11.b: "Нет"
usa_foreign.12.t: "Приднестровье отказало в миротворцах"
usa_foreign.12.d: "Похоже, правительство Приднестровья не видит смысла размещать добровольцев, что жаль."
usa_foreign.12.a: "Печально"
usa_foreign.13.t: "Революция в Беларуси провалилась"
usa_foreign.13.d: "Мы не смогли организовать революцию в Беларуси, но повысили популярность демократических партий, что может сыграть роль в будущем."
usa_foreign.13.a: "Печально"
usa_foreign.14.t: "США пригласили нас в НАТО"
usa_foreign.14.d: "Правительство США выразило желание пригласить нас в НАТО — холодная война окончена, и нет смысла великим державам воевать. Теперь враг иной, и мы должны побеждать вместе."
usa_foreign.14.a: "Да"
usa_foreign.14.b: "Нет"
usa_foreign.15.t: "Россия отказалась вступать в НАТО"
usa_foreign.15.d: "Правительство России отказалось вступать в НАТО — наша инициатива объединить Евразию провалилась."
usa_foreign.15.a: "Печально"
usa_foreign.16.t: "США приглашает вступить в НАТО"
usa_foreign.16.d: "В рамках расширения НАТО правительство США приглашает нас стать частью Альянса, что, безусловно, усилит нашу оборону."
usa_foreign.16.a: "Да"
usa_foreign.16.b: "Нет"
usa_foreign.17.t: "[FROM.GetNameWithFlag] отказались вступить в НАТО"
usa_foreign.17.d: "Похоже, их правительство считает, что членство им ни к чему."
usa_foreign.17.a: "Печально"
usa_foreign.18.t: "Многонациональный корпус Северо-Восток"
usa_foreign.18.d: "Новый корпус НАТО — Многонациональный корпус Северо-Восток — полностью сформирован. Его цель — усилить координацию северного фланга альянса."
usa_foreign.18.a: "Отлично"
usa_foreign.19.t: "Многонациональный корпус Юго-Восток"
usa_foreign.19.d: "Новый корпус НАТО — Многонациональный корпус Юго-Восток — полностью сформирован. Его цель — усилить координацию северного фланга альянса."
usa_foreign.19.a: "Отлично"
usa_foreign.20.t: "Мобилизация миротворцев в Приднестровье"
usa_foreign.20.d: "Наши миротворцы приведены в боевую готовность и готовы поддержать приднестровскую армию."
usa_foreign.20.a: "Хорошо"
usa_foreign.21.t: "США предлагает стать главным внеблоковым союзником"
usa_foreign.21.d: "США намерены усилить влияние в регионе и предлагают нам статус главного внеблокового союзника. Это принесёт защиту альянса НАТО и повысит нашу безопасность."
usa_foreign.21.a: "Да"
usa_foreign.21.b: "Нет"
usa_foreign.22.t: "[FROM.GetNameWithFlag] отказались стать главным внеблоковым союзником"
usa_foreign.22.d: "Похоже, их правительство не хочет сотрудничать с НАТО."
usa_foreign.22.a: "Печально"
usa_foreign.24.t: "[USA.GetNameWithFlag] предлагает военное сотрудничество"
usa_foreign.24.d: "США видят в нас важного партнёра и предлагают подписать соглашения о размещении войск в обмен на безопасность и дополнительную военную помощь."
usa_foreign.24.a: "Конечно"
usa_foreign.24.b: "Нет"
usa_foreign.25.t: "[FROM.GetNameWithFlag] отклонили наше предложение"
usa_foreign.25.d: "[FROM.GetNameWithFlag] отказались от помощи, уверяя, что справятся сами."
usa_foreign.25.a: "Ну и ладно"
usa_foreign.26.t: "[USA.GetNameWithFlag] предлагает разместить ядерное оружие"
usa_foreign.26.d: "Регион находится в состоянии крайней неопределённости — на грани войны и мира. США предлагает разместить у нас ядерное оружие для повышения шансов в возможном конфликте."
usa_foreign.26.a: "Конечно"
usa_foreign.26.b: "Нет"
usa_foreign.27.t: "[USA.GetNameWithFlag] предлагает объединение полуострова"
usa_foreign.27.d: "США заверяют: в отличие от войны середины XX века, теперь наши армии смогут победить [NKO.GetNameWithFlag] и объединить Корею."
usa_foreign.27.a: "Пора пришла"
usa_foreign.27.b: "Мы ещё не готовы"
usa_foreign.28.t: "[FROM.GetNameWithFlag] приняли наше предложение"
usa_foreign.28.d: "[FROM.GetNameWithFlag] согласились разместить наши войска, увеличив наше влияние. Осталось выполнить обещания."
usa_foreign.28.a: "Хорошо"
usa_foreign.29.t: "[FROM.GetNameWithFlag] согласились на ядерное оружие"
usa_foreign.29.d: "Недавно удалось убедить [FROM.GetNameWithFlag] разместить ядерное оружие, что усилит наши позиции при потенциальной войне."
usa_foreign.29.a: "Хорошо"
usa_foreign.30.t: "[KOR.GetNameWithFlag] готова к совместной операции"
usa_foreign.30.d: "Правительство Южной Кореи объявило, что их армия готова к войне с Сев. Кореей и сообщило об этом нам."
usa_foreign.30.a: "Пора закончить красную чуму в [NKO.GetNameWithFlag]"
usa_foreign.31.t: "[KOR.GetNameWithFlag] отказалась от операции"
usa_foreign.31.d: "Правительство Южной Кореи провело опрос, где большинство не поддержало войну с Сев. Кореей. Более того, экономика и армия пока не готовы к вторжению."
usa_foreign.31.a: "Ну и ладно"
usa_foreign.32.t: "[USA.GetNameWithFlag] приглашает в QUAD"
usa_foreign.32.d: "США приглашает нас вступить в оборонительный союз в Азии. Этот альянс обеспечит безопасность членов и не позволит врагам увеличить влияние в регионе."
usa_foreign.32.a: "Мы за!"
usa_foreign.32.b: "Нас это не интересует"
usa_foreign.33.t: "[FROM.GetNameWithFlag] согласились вступить в QUAD"
usa_foreign.33.d: "[FROM.GetNameWithFlag] готова помогать нам обеспечивать многостороннюю безопасность в регионе."
usa_foreign.33.a: "Хорошо"
usa_foreign.34.t: "[FROM.GetNameWithFlag] отказалась вступить в QUAD"
usa_foreign.34.d: "Их правительство не заинтересовано в сотрудничестве ради мира в Азии."
usa_foreign.34.a: "Ну и ладно"
usa_foreign.35.t: "[USA.GetNameWithFlag] просит отключить громкоговорители"
usa_foreign.35.d: "[USA.GetNameWithFlag] уверяет нас, что эта мера больше не нужна, поскольку политический вектор в регионе наконец сдвинулся к будущему объединению с [NKO.GetNameWithFlag]"
usa_foreign.35.a: "Согласны"
usa_foreign.35.b: "Нет"
usa_foreign.36.t: "[KOR.GetNameWithFlag] согласилась отключить громкоговорители"
usa_foreign.36.d: "[KOR.GetNameWithFlag] выражает удовлетворение нашей внешней политикой и надеется на скорое разрешение давнего конфликта с КНДР."
usa_foreign.36.a: "Хорошо"
usa_foreign.37.t: "[USA.GetNameWithFlag] предлагает нам гуманитарную помощь"
usa_foreign.37.d: "[USA.GetNameWithFlag] предложил нам поддержку, которую мы можем использовать для восстановления и улучшения экономики."
usa_foreign.37.a: "Договорились"
usa_foreign.37.b: "Нет"
usa_foreign.38.t: "[KOR.GetNameWithFlag] отклонила гуманитарную миссию"
usa_foreign.38.d: "[KOR.GetNameWithFlag] не заинтересована в нашей поддержке и прислала отказ."
usa_foreign.38.a: "Ну и ладно"
usa_foreign.39.t: "[USA.GetNameWithFlag] предлагает переговоры по объединению Кореи"
usa_foreign.39.d: "Наше недавнее сближение с [KOR.GetNameWithFlag] и [USA.GetNameWithFlag] говорит о том, что давний конфликт со времён Второй мировой скоро закончится. Пора провести саммит, и результат во многом зависит от нашей подготовки."
usa_foreign.39.a: "Пора начать переговоры"
usa_foreign.39.b: "Наши взгляды расходятся"
usa_foreign.40.t: "[NKO.GetNameWithFlag] отказалась от мирного саммита"
usa_foreign.40.d: "Несмотря на все длительные приготовления, похоже, что [NKO.GetNameWithFlag] всё это время нас водила за нос и вовсе не стремится к объединению с [KOR.GetNameWithFlag]"
usa_foreign.40.a: "Кто сказал, что сотрудничать с коммунистами — разумно?"
usa_foreign.41.t: "[USA.GetNameWithFlag] приглашает нас в мировое сообщество"
usa_foreign.41.d: "[USA.GetNameWithFlag] считает, что после объединения мы стали полноправным партнёром и теперь готовы к интеграции в западный мир."
usa_foreign.41.a: "Договорились"
usa_foreign.41.b: "Нет"
usa_foreign.42.t: "[NKO.GetNameWithFlag] отвергла наше предложение"
usa_foreign.42.d: "[NKO.GetNameWithFlag] считает, что наше партнёрство возможно только вне западных блоков."
usa_foreign.42.a: "Ну и ладно"
usa_foreign.43.t: "[KOR.GetNameWithFlag] отказалась выключить громкоговорители"
usa_foreign.43.d: "Правительство [KOR.GetNameWithFlag] стало яростным противником нашей идеи выключить пропаганду в мирное время. Это усложнит попытки объединения Кореи."
usa_foreign.43.a: "Плохо"
usa_foreign.44.t: "[KOR.GetNameWithFlag] прекратила пропаганду на нашей границе"
usa_foreign.44.d: "Благодаря давлению [USA.GetNameWithFlag] и успешной внешней политике, капиталистическое правительство [KOR.GetNameWithFlag] отказалось от громкоговорителей на границе."
usa_foreign.44.a: "Великая победа для страны"
usa_foreign.45.t: "[FROM.GetNameWithFlag] приняла нашу гуманитарную помощь"
usa_foreign.45.d: "Им нужна поддержка, а нам — влияние. Вот почему эта сделка так успешна."
usa_foreign.45.a: "Хорошо"
usa_foreign.46.t: "[NKO.GetNameWithFlag] согласна на интеграцию"
usa_foreign.46.d: "Удалось достичь договорённости о интеграции новой объединённой [NKO.GetNameWithFlag] в круг западных держав. Это обеспечит взаимопонимание и мир в регионе."
usa_foreign.46.a: "Идеально"
usa_foreign.47.t: "[USA.GetNameWithFlag] снимает санкции против нас"
usa_foreign.47.d: "[USA.GetNameWithFlag] считает, что это снизит напряженность в регионе и повысит нашу склонность к сотрудничеству."
usa_foreign.47.a: "И будет права"
usa_foreign.48.t: "[FROM.GetNameWithFlag] предлагает ядерные инвестиции"
usa_foreign.48.d: "Правительство США предлагает инвестировать в нашу ядерную инфраструктуру, считая нас важным экономическим партнёром региона и видя потенциал нашего развития."
usa_foreign.48.a: "Согласны"
usa_foreign.48.b: "Нет"
usa_foreign.49.t: "[FROM.GetNameWithFlag] согласны на ядерную сделку"
usa_foreign.49.d: "Правительство Египта одобрило ядерную сделку и, кажется, понимает настоящую ценность атома."
usa_foreign.49.a: "Отлично"
usa_foreign.50.t: "[FROM.GetNameWithFlag] отказались от ядерной сделки"
usa_foreign.50.d: "Похоже, правительство Египта не особо заинтересовано в развитии ядерных технологий у себя."
usa_foreign.50.a: "Печально"
usa_foreign.51.t: "[FROM.GetNameWithFlag] предлагает аннексировать сектор Газа"
usa_foreign.51.d: "Правительство США предлагает нам аннексировать сектор Газа в нашу пользу, гарантируя полную дипломатическую поддержку. Кажется, США считает, что регион будет стабильнее под нашим контролем."
usa_foreign.51.a: "Согласны"
usa_foreign.51.b: "Нет"
usa_foreign.52.t: "США предлагает стать сателлитом Египта"
usa_foreign.52.d: "Безумное предложение поступило от Египта — разумеется, при поддержке США. Похоже, их правительство решило управлять нашей судьбой без нашего согласия. Они предлагают стать частью Египта под контролем, с обещанием финансовой помощи."
usa_foreign.52.a: "Согласиться"
usa_foreign.52.b: "Нет"
usa_foreign.53.t: "[FROM.GetNameWithFlag] согласны на протекторат"
usa_foreign.53.d: "Наше предложение с одобрением воспринято правительством Газы, они согласились изменить баланс сил в регионе."
usa_foreign.53.a: "Отлично"
usa_foreign.54.t: "[FROM.GetNameWithFlag] согласились на протекторат"
usa_foreign.54.d: "Правительство Газы согласилось стать нашим протекторатом, что безусловно воодушевляет — наша страна становится всё более влиятельной в регионе."
usa_foreign.54.a: "Отлично"
usa_foreign.55.t: "[FROM.GetNameWithFlag] отказались от нашего плана."
usa_foreign.55.d: "Похоже, их правительство сочло предложение абсурдным и бессмысленным, но всегда есть запасной вариант."
usa_foreign.55.a: "Можно их разбомбить?"
usa_foreign.55.b: "Отказаться от этой идеи"
usa_foreign.56.t: "[FROM.GetNameWithFlag] отказались от нашего плана."
usa_foreign.56.d: "Похоже, правительство Египта не хочет встревать в международный скандал и менять границы."
usa_foreign.56.a: "Печально"
usa_foreign.57.t: "[USA.GetName] предлагает военное вторжение в [HAM.GetName]"
usa_foreign.57.d: "Увидев провал дипломатии, американцы предлагают полномасштабное вторжение в [HAM.GetName]."
usa_foreign.57.a: "К войне!"
usa_foreign.57.a: "Нет"
usa_foreign.58.t: "[USA.GetName] предлагает военное вторжение в [MOZ.GetName]"
usa_foreign.58.d: "Правительство США поддерживает наши опасения по поводу Мозамбика, считая его опасным для региона, и готово предоставить полную поддержку."
usa_foreign.58.a: "К войне!"
usa_foreign.58.a: "Нет"
usa_foreign.59.t: "[FROM.GetName] отказались от вторжения"
usa_foreign.59.d: "Похоже, южноамериканское правительство боится войны, но история не любит трусов."
usa_foreign.59.a: "Печально"
usa_foreign.60.t: "[USA.GetName] предлагает военное вторжение в [SOM.GetName]"
usa_foreign.60.d: "Американское правительство считает [SOM.GetName] угрозой региону и готово поддержать войну."
usa_foreign.60.a: "К войне!"
usa_foreign.60.a: "Нет"
usa_foreign.61.t: "[FROM.GetName] отказались от вторжения"
usa_foreign.61.d: "Похоже, [ETH.GetName] отказалась от военного плана против [SOM.GetName]. История не любит трусов."
usa_foreign.61.a: "Печально"
usa_foreign.62.t: "[USA.GetName] предлагает военное вторжение в [ERI.GetName]"
usa_foreign.62.d: "Американское правительство считает [ERI.GetName] угрозой региону и готово поддержать войну."
usa_foreign.62.a: "К войне!"
usa_foreign.62.a: "Нет"
usa_foreign.63.t: "[FROM.GetName] отказались от вторжения"
usa_foreign.63.d: "Похоже, [ETH.GetName] отказалась от военного плана против [ERI.GetName]. История не любит трусов."
usa_foreign.63.a: "Печально"
usa_foreign.64.t: "[USA.GetName] предлагает военное вторжение в [ETH.GetName]"
usa_foreign.64.d: "Американское правительство считает [ETH.GetName] угрозой региону и готово поддержать войну."
usa_foreign.64.a: "К войне!"
usa_foreign.64.a: "Нет"
usa_foreign.65.t: "[FROM.GetName] отказались от вторжения"
usa_foreign.65.d: "Похоже, [SOM.GetName] отказалась от плана вторжения в [ETH.GetName]. История не любит трусов."
usa_foreign.65.a: "Печально"
usa_foreign.66.t: "[FROM.GetName] предлагает построить завод Coca-Cola"
usa_foreign.66.d: "Компания Coca-Cola при поддержке американского правительства готова открыть у нас филиал — возможно, мы хороший деловой партнёр для США."
usa_foreign.66.a: "Откроем"
usa_foreign.66.b: "Нет"
usa_foreign.67.t: "[FROM.GetName] отказались строить завод Coca-Cola"
usa_foreign.67.d: "Похоже, их не интересует открытие наших предприятий — найдём других партнёров."
usa_foreign.67.a: "Печально"
usa_foreign.68.t: "[FROM.GetName] согласились открыть завод Coca-Cola"
usa_foreign.68.d: "Похоже, правительство понимает ценность сотрудничества и согласно на производство Coca-Cola в их стране."
usa_foreign.68.a: "Отлично"
usa_foreign.69.t: "[USA.GetNameWithFlag] предлагает ресурсную сделку"
usa_foreign.69.d: "[USA.GetNameWithFlag] предлагает купить наши ресурсы за крупную сумму."
usa_foreign.69.a: "Сделка"
usa_foreign.69.b: "Нет"
usa_foreign.70.t: "[FROM.GetNameWithFlag] согласны на сделку"
usa_foreign.70.d: "Правительство [FROM.GetNameWithFlag] сочло сделку очень выгодной и продаёт нам часть своих ресурсов."
usa_foreign.70.a: "Хорошо"
usa_foreign.71.t: "[FROM.GetNameWithFlag] отказались от сделки"
usa_foreign.71.d: "Правительство [FROM.GetNameWithFlag] отказалось продавать часть ресурсов, считая сделку невыгодной."
usa_foreign.71.a: "Ну и ладно"
usa_foreign.72.t: "[USA.GetNameWithFlag] предлагает мирный договор с [DRC.GetNameWithFlag]"
usa_foreign.72.d: "Американцы пытаются быть миротворцами и готовы помочь завершить войну с Конго мирно. Согласимся ли мы?"
usa_foreign.72.a: "Да"
usa_foreign.72.b: "Ну и ладно"
usa_foreign.73.t: "[USA.GetNameWithFlag] помог нам заключить мир с [FROM.GetNameWithFlag]"
usa_foreign.73.d: "Американцы действительно добились для нас мира с этой страной, мы ценим их помощь!"
usa_foreign.73.a: "Очень хорошо!"
usa_foreign.74.t: "[USA.GetNameWithFlag] предлагает помощь в борьбе с радикальным исламизмом"
usa_foreign.74.d: "США намерены устранить центры радикального исламизма в регионе — они предлагают совместную операцию против радикальных группировок у нас."
usa_foreign.74.a: "Очень хорошо!"
usa_foreign.74.b: "Нет"
usa_foreign.75.t: "[FROM.GetNameWithFlag] согласны на антитеррористическую операцию"
usa_foreign.75.d: "Похоже, правительство страны всерьёз обеспокоено исламской угрозой."
usa_foreign.75.a: "Хорошо"
usa_foreign.76.t: "[FROM.GetNameWithFlag] отказались от антитеррористической операции"
usa_foreign.76.d: "Похоже, их правительство не осознаёт серьёзности проблемы радикальных исламских группировок в своём регионе."
usa_foreign.76.a: "Печально"
usa_foreign.77.t: "[USA.GetNameWithFlag] предлагает масштабное военное сотрудничество"
usa_foreign.77.d: "Правительство США готово заключить мощный оборонительный пакт: мы предоставляем базу, а они гарантируют независимость — это укрепит наши позиции!"
usa_foreign.77.a: "Отлично!"
usa_foreign.77.b: "Нет"
usa_foreign.78.t: "[FROM.GetNameWithFlag] согласились на военное сотрудничество"
usa_foreign.78.d: "Правительство выбрало правильный путь сотрудничества с нами, и они усилили влияние в регионе."
usa_foreign.78.a: "Отлично!"
usa_foreign.79.t: "[FROM.GetNameWithFlag] отказались от военного сотрудничества"
usa_foreign.79.d: "Похоже, они не заинтересованы в сотрудничестве с нами."
usa_foreign.79.a: "Печально"
usa_foreign.80.t: "[FROM.GetNameWithFlag] предоставляет нам субсидии"
usa_foreign.80.d: "Американское правительство выделило нам крупные субсидии."
usa_foreign.80.a: "За что?"
usa_foreign.81.t: "[FROM.GetNameWithFlag] предлагает нефтяную сделку"
usa_foreign.81.d: "Правительство США предлагает нам нефтяное соглашение, чтобы мы получили доступ к более широким рынкам, а взамен продаём долю нефти США по фиксированной цене."
usa_foreign.81.a: "Очень хорошо"
usa_foreign.81.b: "Нет"
usa_foreign.82.t: "[FROM.GetNameWithFlag] подписали нефтяную сделку"
usa_foreign.82.d: "Правительство Нигерии согласилось подписать с нами нефтяное соглашение."
usa_foreign.82.a: "Очень хорошо"
usa_foreign.83.t: "[FROM.GetNameWithFlag] отказались от нефтяной сделки"
usa_foreign.83.d: "Правительство Нигерии отказалось подписывать нефтяное соглашение с нами."
usa_foreign.83.a: "Печально"
usa_foreign.84.t: "[USA.GetNameWithFlag] предлагает ресурсную сделку"
usa_foreign.84.d: "Правительство США предлагает нам договор продавать ресурсы по фиксированной цене, а взамен даёт нам свои торговые связи для выхода на международные рынки."
usa_foreign.84.a: "Очень хорошо"
usa_foreign.84.b: "Нет"
usa_foreign.85.t: "[FROM.GetNameWithFlag] подписали ресурсную сделку"
usa_foreign.85.d: "Похоже, правительство страны понимает, что торговое сотрудничество с нами выгодно."
usa_foreign.85.a: "Очень хорошо"
usa_foreign.86.t: "[FROM.GetNameWithFlag] отказались от ресурсной сделки"
usa_foreign.86.d: "Похоже, у них нет интереса к сотрудничеству с нами."
usa_foreign.86.a: "Печально"
usa_foreign.87.t: "[USA.GetNameWithFlag] предлагает ресурсную сделку"
usa_foreign.87.d: "Правительство США предлагает нам договор продавать ресурсы по фиксированной цене, а взамен даёт нам свои торговые связи для выхода на международные рынки."
usa_foreign.87.a: "Очень хорошо"
usa_foreign.87.b: "Нет"
usa_foreign.88.t: "[FROM.GetNameWithFlag] подписали ресурсную сделку"
usa_foreign.88.d: "Похоже, правительство страны понимает, что торговое сотрудничество с нами выгодно."
usa_foreign.88.a: "Очень хорошо"
usa_foreign.89.t: "[FROM.GetNameWithFlag] отказались от ресурсной сделки"
usa_foreign.89.d: "Похоже, у них нет интереса к сотрудничеству с нами."
usa_foreign.89.a: "Печально"
usa_foreign.90.t: "[USA.GetNameWithFlag] хочет предоставить экономическую помощь"
usa_foreign.90.d: "Правительство США хочет предоставить нам финансовую помощь ради расширения сотрудничества."
usa_foreign.90.a: "Очень хорошо"
usa_foreign.90.b: "Нет"
usa_foreign.91.t: "[FROM.GetNameWithFlag] согласились принять нашу экономическую помощь"
usa_foreign.91.d: "Похоже, их правительство готово сотрудничать с нами — прекрасно!"
usa_foreign.91.a: "Очень хорошо"
usa_foreign.92.t: "[FROM.GetNameWithFlag] отказались от нашей экономической помощи"
usa_foreign.92.d: "Похоже, им неинтересно экономическое сотрудничество с нами."
usa_foreign.92.a: "Печально"
usa_foreign.93.t: "Выбор союзника"
usa_foreign.93.d: "Мы собираемся пригласить одну из великих держав Евразии для интервенции в Афганистан — но надо определиться, с кем мы туда войдём."
usa_foreign.93.a: "[SOV.GetName]"
usa_foreign.93.b: "[CHI.GetName]"
usa_foreign.93.c: "[PAK.GetName]"
usa_foreign.94.t: "[USA.GetNameWithFlag] предлагает интервенцию в [AFG.GetNameWithFlag]"
usa_foreign.94.d: "Американцы предлагают совместную интервенцию в Афганистане, чтобы навсегда прекратить существование этой страны, вызывающей беспокойство по всей Азии."
usa_foreign.94.a: "Мы согласны, покончим с ними."
usa_foreign.94.b: "Нет"
usa_foreign.95.t: "[FROM.GetNameWithFlag] согласились на интервенцию"
usa_foreign.95.d: "Они согласились начать интервенцию против Афганистана, и зона наконец освободится от этих безумцев!"
usa_foreign.95.a: "Очень хорошо"
usa_foreign.96.t: "[FROM.GetNameWithFlag] отказались от интервенции"
usa_foreign.96.d: "Похоже, они испугались международного скандала — будто безопасность региона не так важна, как мнение чиновников ООН."
usa_foreign.96.a: "Печально"
usa_foreign.97.t: "[FROM.GetNameWithFlag] предлагает вторжение в [TAI.GetNameWithFlag]"
usa_foreign.97.d: "США поддерживают нашу политику одного Китая и готовы помочь с интервенцией против Тайваня, чтобы укрепить наши отношения."
usa_foreign.97.a: "Согласны"
usa_foreign.97.b: "Нет"
usa_foreign.98.t: "[FROM.GetNameWithFlag] отказались от вторжения в [TAI.GetNameWithFlag]"
usa_foreign.98.d: "Похоже, Китай устраивает существование Тайваня, а все призывы к воссоединению — лишь слова. Жаль, что они так боятся."
usa_foreign.98.a: "Трусы"
usa_foreign.99.t: "[FROM.GetNameWithFlag] предлагает экономическое сотрудничество"
usa_foreign.99.d: "Правительство США предлагает экономическое сотрудничество для укрепления политических и экономических связей."
usa_foreign.99.a: "Отличная идея!"
usa_foreign.99.b: "Никогда"
usa_foreign.100.t: "[FROM.GetNameWithFlag] согласились на экономическое сотрудничество"
usa_foreign.100.d: "Правительство Тайваня согласилось подписать глубоко экономическое соглашение — похоже, у них в правительстве есть разумные люди!"
usa_foreign.100.a: "Очень хорошо"
usa_foreign.101.t: "[FROM.GetNameWithFlag] отказались сотрудничать"
usa_foreign.101.d: "Похоже, в их правительстве одни глупцы, если они нам отказали."
usa_foreign.101.a: "Печально"
usa_foreign.102.t: "[FROM.GetNameWithFlag] поддерживают наше признание"
usa_foreign.102.d: "США признают нас независимым государством и готовы открыть здесь полноценное посольство."
usa_foreign.102.a: "Очень хорошо!"
usa_foreign.103.t: "[FROM.GetNameWithFlag] поддерживает политику одного Китая"
usa_foreign.103.d: "Правительство США поддерживает политику единого Китая и признаёт только наше правительство."
usa_foreign.103.a: "Очень хорошо!"
usa_foreign.104.t: "[FROM.GetNameWithFlag] предлагает купить TSMC"
usa_foreign.104.d: "Правительство США хочет приобрести у нас эту компанию — готовы ли мы продать флагмана своей экономики американцам?"
usa_foreign.104.a: "Да"
usa_foreign.104.a: "Нет"
usa_foreign.105.t: "[FROM.GetNameWithFlag] согласились продать TSMC"
usa_foreign.105.d: "Похоже, наша экономика наконец станет сильнее и более независимой!"
usa_foreign.105.a: "Ух ты"
usa_foreign.106.t: "[FROM.GetNameWithFlag] отказались продавать TSMC"
usa_foreign.106.d: "Мы ожидали отказа, ведь это их главный экономический оплот."
usa_foreign.106.a: "Печально"
usa_foreign.107.t: "[FROM.GetNameWithFlag] предлагает экономическое сотрудничество"
usa_foreign.107.d: "Правительство США предлагает экономическое сотрудничество ради укрепления политических и экономических связей."
usa_foreign.107.a: "Отличная идея!"
usa_foreign.107.b: "Никогда"
usa_foreign.108.t: "[FROM.GetNameWithFlag] согласились на экономическое сотрудничество"
usa_foreign.108.d: "Правительство Тайваня готово к глубокому экономическому соглашению с нами — видимо, там есть разумные люди!"
usa_foreign.108.a: "Очень хорошо"
usa_foreign.109.t: "[FROM.GetNameWithFlag] отказались сотрудничать c нами"
usa_foreign.109.d: "Похоже, их правительство состоит из одних глупцов, если нам отказали."
usa_foreign.109.a: "Печально"
usa_foreign.110.t: "[FROM.GetNameWithFlag] предлагает вторжение в [BAN.GetNameWithFlag]"
usa_foreign.110.d: "США предлагают военную интервенцию в Бангладеш, чтобы восстановить историческую справедливость."
usa_foreign.110.a: "Согласны"
usa_foreign.110.b: "Нет"
usa_foreign.111.t: "[FROM.GetNameWithFlag] отказались от вторжения в [BAN.GetNameWithFlag]"
usa_foreign.111.d: "Похоже, правительство Пакистана решило отказаться от плана вторжения."
usa_foreign.111.a: "Трусы"
usa_foreign.112.t: "[FROM.GetNameWithFlag] предлагает космическое сотрудничество"
usa_foreign.112.d: "США предлагают сотрудничество в космической отрасли для улучшения коллективных возможностей как космических держав."
usa_foreign.112.a: "Отличная идея!"
usa_foreign.112.b: "Никогда"
usa_foreign.113.t: "[FROM.GetNameWithFlag] согласились на космическое сотрудничество"
usa_foreign.113.d: "Правительство Индии готово сотрудничать в космической отрасли и видит в этом пользу для обеих стран."
usa_foreign.113.a: "Очень хорошо"
usa_foreign.114.t: "[FROM.GetNameWithFlag] отказались сотрудничать с нами"
usa_foreign.114.d: "Похоже, их правительство состоит из одних глупцов, раз отказали."
usa_foreign.114.a: "Печально"
usa_foreign.115.t: "Новая война за Кашмир"
usa_foreign.115.d: "Пора нам разрешить конфликты между странами вокруг Кашмира — это может привести к мировой войне, но, возможно, это стоит того."
usa_foreign.115.a: "Пора уничтожить Пакистан"
usa_foreign.115.b: "Пора уничтожить Индию"
usa_foreign.115.c: "Пора уничтожить Китай"
usa_foreign.116.t: "Новая война за Кашмир"
usa_foreign.116.d: "США просят нас начать вооружённое вторжение в Пакистан, обещая прямую поддержку в войне."
usa_foreign.116.a: "Пора уничтожить Пакистан"
usa_foreign.116.b: "Нет"
usa_foreign.117.t: "Новая война за Кашмир"
usa_foreign.117.d: "США просят нас начать вооружённое вторжение в Индию, обещая прямую поддержку в войне."
usa_foreign.117.a: "Пора уничтожить Пакистан"
usa_foreign.117.b: "Нет"
usa_foreign.120.t: "[USA.GetNameWithFlag] просит помочь УНИТА"
usa_foreign.120.d: "США просят нас военной поддержкой помочь УНИТА — взамен можем рассчитывать на помощь в будущем."
usa_foreign.120.a: "Да"
usa_foreign.120.b: "Нет"
usa_foreign.121.t: "[FROM.GetNameWithFlag] отказались помогать УНИТА"
usa_foreign.121.d: "Их правительство отказалось помогать УНИТА и не особо заинтересовано в будущем сотрудничестве с нами."
usa_foreign.121.a: "Трус"
usa_foreign.122.t: "[FROM.GetNameWithFlag] согласились вступить в НАТО"
usa_foreign.122.d: "НАТО расширяет ряды и принимает нового участника!"
usa_foreign.122.a: "Очень хорошо"
usa_foreign.123.t: "[USA.GetNameWithFlag] предлагает провести военную операцию в [BOS.GetNameWithFlag]"
usa_foreign.123.d: "[USA.GetNameWithFlag] предлагает нам урегулировать территориальные споры с [BOS.GetNameWithFlag] и вернуть коренное население на их родину"
usa_foreign.123.a: "Вернём наших братьев"
usa_foreign.123.b: "Мы любим Боснию — нет"
usa_foreign.124.t: "[SER.GetNameWithFlag] согласны на совместную операцию"
usa_foreign.124.d: "Правительство [SER.GetNameWithFlag] согласилось разработать план совместного вторжения в [BOS.GetNameWithFlag] и направило соответствующий приказ своим генералам"
usa_foreign.124.a: "Хорошо"
usa_foreign.125.t: "[SER.GetNameWithFlag] отказались наступать на [BOS.GetNameWithFlag]"
usa_foreign.125.d: "[SER.GetNameWithFlag] не намерены нападать на своего соседа, заявив, что это не в их интересах"
usa_foreign.125.a: "Трус"
usa_quad.1.t: "[FROM.GetNameWithFlag] призывает нас выполнить соглашение QUAD"
usa_quad.1.d: "Китай начал экспансию в отношении одного из наших членов в QUAD — пора решить, готовы ли мы ему противостоять."
usa_quad.1.a: "Да"
usa_quad.1.b: "Нет"
