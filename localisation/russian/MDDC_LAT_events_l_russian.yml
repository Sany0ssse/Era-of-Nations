l_russian:
 sov_latvia_resign.1.t: "Отставка правительства £LAT_neutral_conservative Шкеле!"
 sov_latvia_resign.1.d: "На фоне обвинений в неправильном управлении государственным бюджетом и давления со стороны общественности и президента, премьер-министр £LAT_neutral_conservative Андрис Шкеле объявил, что он уходит в отставку вместе со всем кабинетом министров.\n£LAT_western_liberal Андрис Берзиньш, представитель партии-члена коалиции, был назначен премьер-министром благодаря сплочению правящей коалиции вокруг него и включению партии \"Новая эра\" в правительство."
 sov_latvia_resign.1.a: "Даже года не прошло!"
 sov_latvia_resign.2.t: "Странный друг"
 sov_latvia_resign.2.d: "Для формирования правительства £LAT_western_conservative Эйнару Репше необходимо сотрудничать с партиями, идеологически близкими его взглядам, и одной из таких партий является партия \"Первый Латвии\". Её возглавляет олигарх £LAT_western_autocracy Айнар Шлесерс, который, по слухам, является очень коррумпированным и хитрым человеком. Хотя я не хочу ассоциироваться с £LAT_western_autocracy Шлесерсом, его присутствие в коалиции необходимо для нормального функционирования правительства."
 sov_latvia_resign.2.a: "Мы должны быть осторожными."
 sov_latvia_resign.3.t: "Предатели!"
 sov_latvia_resign.3.d: "£LAT_western_autocracy Айнар Шлесерс объявил, что выходит из правящей коалиции, заявив, что стиль управления премьер-министра слишком авторитарен, что подрывает основы демократических институтов в Латвии. Однако истинная причина может заключаться в £LAT_western_autocracy противодействии Шлесерса антикоррупционным реформам.\nВ любом случае, с уходом ЛПП мы стали правительством меньшинства, что сильно затруднит реализацию нашей политики."
 sov_latvia_resign.3.a: "Конец близок..."
 sov_latvia_resign.3.b: "Мы продержимся до выборов!"
 sov_latvia_resign.4.t: "Отставка правительства!"
 sov_latvia_resign.4.d: "Правительство меньшинства, сформированное после ухода партии £LAT_western_autocracy Шлесерса, стало неэффективным. Оппозиция в Сейме блокирует наши законы, и из-за невозможности достичь консенсуса с парламентом премьер-министр объявил о роспуске правительства и отставке.\nПрезидент назначил £LAT_neutral_green Индулиса Эмсиса новым премьер-министром и поручил ему сформировать новое коалиционное правительство. К сожалению, Эмсис в итоге сформировал правительство меньшинства при поддержке левого пророссийского блока меньшинства."
 sov_latvia_resign.4.a: "Поздравляем, Ингус!"
 sov_latvia_resign.5.t: "Спорный бюджет"
 sov_latvia_resign.5.d: "Медовый месяц правительства закончился. Бюджет, представленный правительством на рассмотрение в Сейм, вызвал жаркие дебаты. Оппозиция заявила, что бюджетное предложение абсолютно неприемлемо и приведет к экономическому коллапсу, и даже пророссийский блок выступает против нас.\nФинальное голосование не за горами, и только судьба может сказать, будет ли бюджет принят или нет."
 sov_latvia_resign.5.a: "39-53 против бюджетного предложения!"
 sov_latvia_resign.5.b: "47-45 за бюджетное предложение!"
 sov_latvia_resign.6.t: "Отставка премьер-министра!"
 sov_latvia_resign.6.d: "После провального голосования по бюджету премьер-министр объявил об отставке вместе со своим кабинетом. Латвийский Сейм немедленно одобрил кандидатуру £LAT_neutral_conservative Айгара Калвитиса на пост нового премьер-министра и его новое правительство большинства."
 sov_latvia_resign.6.a: "Какой беспорядок!"
 sov_latvia_resign.7.t: "Широкомасштабные протесты"
 sov_latvia_resign.7.d: "Увольнение главы антикоррупционного бюро не прошло незамеченным для общественности. По всей стране проходят протесты, парламентская оппозиция требует отставки правительства, а уволенный глава бюро присоединился к оппозиционной партии.\nПравительство находится под сильным давлением, которое оно может не выдержать."
 sov_latvia_resign.7.a: "Это может быть конец"
 sov_latvia_resign.7.b: "Мы выживем!"
 sov_latvia_resign.8.t: "Падение"
 sov_latvia_resign.8.d: "После консультаций с президентом премьер-министр объявил об отставке вместе со всем кабинетом. В обращении к нации президент заявил, что отставка необходима для деэскалации напряженности в обществе.\nФормирование нового правительства было поручено £LAT_western_liberal_alt Иварсу Годманису, и после голосования в Сейме правительство официально начало свою работу."
 sov_latvia_resign.8.a: "Бог с нами!"
 sov_latvia_resign.9.t: "Провал правительства"
 sov_latvia_resign.9.d: "Антиправительственные протесты охватили улицы Латвии на фоне усугубляющегося глобального кризиса и крупномасштабных коррупционных скандалов. Правительство находится в тупике, но есть шанс, что оно продержится до следующих выборов.\nИли премьер-министр может уйти в отставку, и президент выдвинет нового кандидата в лице £LAT_western_conservative Валдиса Домбровскиса, который, в свою очередь, сформирует новое коалиционное правительство."
 sov_latvia_resign.9.a: "Мы помолимся за Валдиса"
 sov_latvia_resign.9.b: "Латвию ещё можно исправить!"
 sov_latvia_resign.10.t: "Трагедия в Золитуде"
 sov_latvia_resign.10.d: "Трагические события произошли в рижском пригороде Золитуде в 17:00 по местному времени. Обрушилась крыша местного торгового центра \"Максима\", похоронив под собой покупателей.\nВ 16:00 в магазине сработала пожарная сигнализация, но эвакуация не была проведена. Затем, в 17:00, после прибытия техников, произошло обрушение.\nЭкстренные службы и армия в настоящее время работают на месте происшествия. Сообщается, что число погибших достигло 54 человек, а число раненых составляет 41. Это самый смертоносный инцидент со времени затопления парохода \"Маяковский\". Вся страна в шоке и скорбит по жертвам."
 sov_latvia_resign.10.a: "Правительство должно взять на себя ответственность"
 sov_latvia_resign.10.b: "Мы поможем жертвам и их семьям"
 sov_latvia_resign.11.t: "Отставка кабинета!"
 sov_latvia_resign.11.d: "На фоне ужасных событий в торговом центре Максим премьер-министр объявил в национальном обращении, что уходит в отставку вместе со всем кабинетом. Он заявил, что в нынешних обстоятельствах Латвии нужно новое правительство, поддерживаемое парламентом. Отвечая на вопросы журналистов, пресс-секретарь премьер-министра заявил, что правительство взяло на себя полную политическую ответственность и что Латвии нужно свежее правительство, поддерживаемое парламентом."
 sov_latvia_resign.11.b: "Помолимся за Латвию"
 sov_latvia_resign.12.t: "Неэффективное управление"
 sov_latvia_resign.12.d: "С момента вступления в должность новое правительство страдает от нерешительности по ключевым вопросам, даже по национальной безопасности. Члены кабинета не могут договориться даже по мельчайшим деталям, что серьезно подрывает эффективность не только правительства, но и всего государства в целом. Парламентская оппозиция требует отставки слабого премьер-министра.\nПри его отставке преемником, вероятно, станет Марис Кучинскис, который уже готовит свой кабинет министров, но правительство не находится в полном тупике, и есть шанс, что оно продержится до следующих выборов."
 sov_latvia_resign.12.a: "Наше время истекло"
 sov_latvia_resign.12.b: "Вздорьтесь!"
 sov_latvia_resign.13.t: "Разногласия в партии!"
 sov_latvia_resign.13.d: "В правящей партии растет обеспокоенность по поводу управления нынешнего коалиционного правительства, сторонники и противники премьер-министра разделены. Ситуация критическая и грозит парализовать партийную фракцию в Сейме и само правительство.\nЕсли мы уйдем в отставку, ситуация может нормализоваться, и мы вернемся к статус-кво, но если правительство останется неизменным, это грозит уходом членов в другие партии, что может привести к падению правящей партии."
 sov_latvia_resign.13.a: "Немедленная отставка"
 sov_latvia_resign.13.b: "Я остаюсь!"
 latvia_party.0.t: "Референдум о роспуске парламента"
 latvia_party.0.d: "После провального голосования в Сейме о разрешении обыска дома политика £LAT_western_liberal Айнара Шлесерса, который подозревается в причастности к коррупционным схемам, президент Латвии Валдис Затлерс неожиданно воспользовался своей властью и назначил референдум о роспуске Сейма.\nХотя решение было спорным, большинство населения одобрило действия президента, и большое количество людей пришло на избирательные участки. После голосования комиссия начала подсчет бюллетеней, но исход референдума кажется очевидным для всех."
 latvia_party.0.a: "96% проголосовали \"За\""
 latvia_party.1.t: "Реформаторская партия £LAT_western_autocracy_alt Затлерса"
 latvia_party.1.d: "Президент Валдис Затлерс, воспользовавшись волной возросшей популярности после успешного референдума, объявил, что создаст новую политическую партию. Президент заявил, что нынешние основные политические партии коррумпированы и находятся под влиянием олигархов, и что Латвии нужна новая политическая сила.\nПо словам президента, партия будет стремиться реформировать политическую систему, бороться с коррупцией и олигархами, также он заявил, что если будет избрана в парламент, его партия откажется работать с £LAT_neutral_autocracy ЗЗС, £LAT_western_liberal_alt ЛПП/ЛЦ и £LAT_neutral_conservative ТП."
 latvia_party.1.a: "Действительно амбициозно"
 latvia_party.2.t: "Застой или успех?"
 latvia_party.2.d: "£LAT_western_autocracy_alt Реформаторская партия существует уже несколько лет, но её целостность вызывает сомнения. С одной стороны, ей удалось закрепиться в определенной нише латвийской политики, но вопрос о её необходимости остро стоит на фоне растущих рейтингов £LAT_western_conservative_alt \"Единства\" и их идеологического сходства. Есть мнения, что было бы лучше £LAT_western_autocracy_alt Реформаторской партии интегрироваться в £LAT_western_conservative_alt \"Единство\" и создать единую консервативно-либеральную партию. Партия в настоящее время обсуждает, интегрироваться ли в £LAT_western_conservative_alt \"Единство\" и объявить себя мертвым проектом, или партия Затлерса продолжит свое успешное существование."
 latvia_party.2.a: "Распустить £LAT_western_autocracy_alt ЗРП"
 latvia_party.2.b: "Нет причин её распускать"
 latvia_party.3.t: "Кому принадлежит государство?"
 latvia_party.3.d: "Под этим названием была создана новая политическая партия, выступающая на антикоррупционной платформе. Партия также пытается привлечь избирателей популистской и евроскептической риторикой.\nПартия набирает популярность среди латвийских эмигрантов, а её кандидат в премьер-министры - £LAT_western_autocracy_altyn Алдис Гобземс, адвокат, представлявший жертв трагедии в Золитуде."
 latvia_party.3.a: "Кому действительно принадлежит Латвия?"
 latvia_party.3.b: "Ещё одна ничего не значащая партия."
 latvia_party.4.t: "Кому принадлежит КПВ?"
 latvia_party.4.d: "£LAT_western_autocracy_altyn КПВ существует уже давно, и внутри партии произошел раскол, который грозит её полным распадом и исчезновением из истории как просто несколько точек в изображении состава Сейма на странице Википедии.\nВыживет ли партия в это бурное время или она обречена?"
 latvia_party.4.a: "Собирайте вещи, парни."
 latvia_party.4.b: "Мы должны выжить!"
 latvia_party.5.t: "Латвийское единство"
 latvia_party.5.d: "Недавно руководство £LAT_western_conservative партии \"Новая эра\" объявило о слиянии с Гражданским союзом и Обществом другой политики и создании новой политической партии под названием £LAT_western_conservative_alt \"Единство\".\nВ декларации говорится, что £LAT_western_conservative_alt \"Единство\" - это партия с консервативно-либеральным уклоном и выступает за построение эффективной рыночной экономики, защиту латвийских и европейских ценностей и поддерживает дальнейшую интеграцию в ЕС и НАТО."
 latvia_party.5.a: "Довольно перспективно"
 latvia_party.6.t: "Новое единство"
 latvia_party.6.d: "Сегодня £LAT_western_conservative_alt \"Единство\" и несколько региональных партий объявили о создании общенационального альянса под названием £LAT_western_conservative_alty \"Новое единство\". Декларация альянса повторяет программу \"Единства\", которая включает поддержку консервативно-либеральных ценностей и интеграцию в ЕС и НАТО."
 latvia_party.6.a: "Интересно."
 latvia_party.7.t: "ЛПП/ЛЦ"
 latvia_party.7.d: "Сегодня в латвийской политике произошло значительное событие: лидер £LAT_western_autocracy ЛПП Айнар Шлесерс и лидер £LAT_western_liberal ЛЦ Иварс Годманис объявили о создании единой партии.\nПартия придерживается либеральных взглядов и поддерживает более радикальные экономические реформы. Она также полностью поддерживает интеграцию в ЕС и НАТО. Партия имеет все шансы найти нишу на политической арене и бросить вызов другим партиям."
 latvia_party.7.a: "Какая длинная аббревиатура"
 latvia_party.8.t: "За развитие Латвии"
 latvia_party.8.d: "В латвийском политическом ландшафте появилась новая сила. Бывший лидер £LAT_western_conservative партии \"Новая эра\" Эйнар Репше объявил о создании правоцентристской политической организации под названием £LAT_western_liberal_alty \"За развитие Латвии\".\nПартия поддерживает рыночную экономику, а также политические и личные свободы."
 latvia_party.8.a: "Ещё одна партия?"
 latvia_party.9.t: "£LAT_western_social_alt Прогрессисты"
 latvia_party.9.d: "Недавно была зарегистрирована новая политическая партия на базе НПО \"Прогрессисты\". Лидеры партии заявили, что Латвии необходимо провести прогрессивные реформы и дальнейшую европейскую интеграцию.\nПартия также выступает за еврофедерализм и деволюцию, а также за создание скандинавской экономической модели в Латвии."
 latvia_party.9.a: "К прогрессивной Латвии!"
 latvia_party.10.t: "Истинные слуги"
 latvia_party.10.d: "Сегодня состоялся съезд нескольких партий, в результате чего была создана новая политическая организация. В декларации говорится, что партия поддерживает установление социального государства, а также переход к синдикалистской экономике."
 latvia_party.10.a: "Все эти партии одинаковые!"
 latvia_party.11.t: "£LAT_conservative_alt Латвийский русский союз"
 latvia_party.11.d: "Недавний съезд £LAT_conservative ПСТВЛ определил новый вектор развития партии. Новое руководство заявило, что Латвии нужна партия, которая специально защищает интересы русского меньшинства. По их мнению, существование такой партии необходимо на политической арене, если Латвия хочет быть по-настоящему равноправным государством.\nЦелью реорганизованной партии будет защита интересов русского населения, отмена статуса неграждан и сближение Латвии с Россией."
 latvia_party.11.a: "Ещё одна русская партия?"
 latvia_party.12.t: "£LAT_neutral_autocracy Союз зелёных и крестьян"
 latvia_party.12.d: "К латвийской политической сцене присоединился новый избирательный союз. £LAT_neutral_autocracy_alt Латвийский крестьянский союз и ряд видных политических партий объявили о создании альянса для участия в следующих парламентских выборах.\nИз-за идеологического разнообразия своих членов политическая платформа альянса довольно расплывчата, но все партии согласились поддержать латвийских крестьян, меры по борьбе с загрязнением и равномерное распределение мандатов, если они будут избраны в Сейм."
 latvia_party.12.a: "Крестьянская Латвия?"
 latvia_party.13.t: "Консерваторы"
 latvia_party.13.d: "Недавно состоялся съезд новой политической партии, где бывший министр Национального альянса Янис Борданс был назначен лидером партии. Новое руководство заявило, что основными идеями партии будут либерально-консервативные ценности, неприкосновенность частной собственности и защита латвийских ценностей."
 latvia_party.13.a: "ОК"
 latvia_party.14.t: "£LAT_neutral_conservative_altyn Объединённый список"
 latvia_party.14.d: "Сегодня было достигнуто соглашение о создании нового избирательного блока во главе с £LAT_neutral_conservative_altyn Улдисом Пиленсом, главой НПО того же названия. Альянс имеет все характеристики зонтичной организации, объединяющей партии с разными идеологиями, но то, что объединяет партии, - это их поддержка латвийского регионализма, устойчивого развития и государственной независимости."
 latvia_party.14.a: "И ещё одна"
 latvia_party.15.t: "£LAT_oligarchism_alt За Латвию от сердца"
 latvia_party.15.d: "Сегодня мы стали свидетелями пробуждения новой политической партии во главе с бывшим аудитором £LAT_oligarchism_alt Ингуной Судрабой. Партия занимает консервативную позицию, но поддерживает справедливые пенсии и заработную плату. Она также имеет элементы популистской риторики и пытается привлечь избирателей из разных социальных групп."
 latvia_party.15.a: "Это интересно"
 latvia_party.16.t: "За стабильность!"
 latvia_party.16.d: "Родилась новая политическая партия, организованная активистом Алексеем Росликовым. Партия представляет себя защитником русского меньшинства и также выступает за радикальные политические реформы, такие как сокращение количества депутатов со 100 до 50, введение прямых президентских выборов и разрешение негражданам участвовать в муниципальных выборах. Партия в основном занимает право-популистские позиции и также поддерживает сотрудничество с соседями, включая Россию."
 latvia_party.16.a: "Звучит стабильно"
 latvia_party.17.t: "£LAT_neutral_libertarian Объединённые за Латвию"
 latvia_party.17.d: "После краха £LAT_western_liberal_alt ЛПП/ЛЦ Айнар Шлесерс созвал съезд для регистрации своей новой политической партии. Манифест партии ставит цель построения свободной, рыночной Латвии и сочетает идеи экономического либерализма и популизма. Только время покажет, хотят ли избиратели снова видеть £LAT_western_liberal_alt Шлесерса в парламенте, учитывая его двусмысленность как одного из \"олигархов\" в латвийской политике."
 latvia_party.17.a: "Довольно противоречивый парень"
 latvia_party.18.t: "Шлесерс наносит ответный удар!"
 latvia_party.18.d: "Известный политик и так называемый \"олигарх\" латвийской политики Айнар Шлесерс объявил о создании \"Латвия Первая\" - своей последней партии. Манифест новой партии провозглашает её приверженность традиционным ценностям и культурным традициям Латвии, а также многим другим ценностям и взглядам, характерным для право-популистских партий.\nЭксперты связывают последнюю смену партии Шлесерсом с тем, что его предыдущий проект не оправдал ожиданий и что он считает, что право-популистский проект будет более привлекательным для избирателей."
 latvia_party.18.a: "Он снова?!"
 latvia_party.19.t: "Гармония в Латвии"
 latvia_party.19.d: "Лидеры трёх пророссийских партий, составляющих коалицию Центра гармонии, недавно объявили о своём слиянии в единую партию. На съезде было заявлено, что целью объединения было желание консолидировать голоса русскоязычных жителей и что Латвии нужна большая партия, которая может постоять за национальные меньшинства Латвии. Манифест партии провозглашает её приверженность социал-демократическим ценностям, созданию социально ориентированной экономики и реформе института неграждан."
 latvia_party.19.a: "Безумие"
 latvia_party.20.t: "£LAT_national_populist_alt Национальный альянс"
 latvia_party.20.d: "Было достигнуто соглашение между двумя основными националистическими партиями Латвии после того, как £LAT_western_conservative_alt \"Единство\" отказалось включить их в свой избирательный альянс. Лидеры партий \"Всё для Латвии!\" и £LAT_national_populist ТБ/ЛННК договорились сформировать избирательный блок для участия в следующих парламентских выборах. По их словам, это было сделано для объединения националистических сил и предотвращения прихода к власти \"прокремлёвских\" партий. В случае победы блок обещает защищать латвийский язык, продолжать рыночные реформы и интегрироваться в западные организации. Многие эксперты говорят, что, поступая так, лидеры двух партий запустили процесс объединения в единое целое, которое теоретически могло бы объединить вокруг себя правое электорат."
 latvia_party.20.a: "Это националистическое возрождение?"
