 protests_main_text: "Мы должны соответствовать ожиданиям наших граждан, чтобы избежать протестов и других плохих социальных событий.\nТекущая §Yсила протестов§!: [protest_strength_TT]\nТекущая §Yрадикализация протестов§!: [protest_radicalisation_TT][fuel_protests_TT]\n"
 protests_main_text_tt: "Помимо §YОжидаемых расходов§! на ежемесячную силу протестов влияет следующее:\nСтабильность ниже 25: [stability_protest_loc]\nДефицит электричества: [energy_protest_loc]\nДефицит топлива: [fuel_protest_loc]\nПроблемы в экономике: [economic_problems_protest_loc]\nВысокая безработица: [high_unemployment_protest_loc]\nИнтервенция в войны: [war_intervention_protest_loc]\nУчастие в наступательной войне: [offensive_war_protest_loc]\nВойна с ядерной державой: [war_with_nukestate_protest_loc]"
 protest_loc_0: "§G0§!"
 protest_loc_3: "§R+3§!"
 protest_loc_5: "§R+5§!"
