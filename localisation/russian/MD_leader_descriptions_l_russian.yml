 #### СЕВЕРНАЯ АМЕРИКА ####
 ### США ###

 ## Западные автократы ##
 CONGRESSIONAL_CHAMBERS_DESC: "Поскольку Коллегия выборщиков не смогла определить победителя, а выборы столкнулись с неожиданными проблемами во Флориде, Конгресс в спешке пытается решить, за кого голосовать, или хотя бы заполнить пост президента, пока ситуация не накалилась ещё сильнее."
 MADELEINE_ALBRIGHT_LEADER_DESC: "Мадлен Олбрайт (род. 15 мая 1937) - чешско-американский дипломат и первая женщина, занявшая пост Государственного секретаря США. Родившись в Праге в еврейской семье, Олбрайт бежала в США с семьёй в 1948 году после прихода коммунистов к власти в Чехословакии. Получив степень доктора философии в области публичного права и управления в Колумбийском университете, Олбрайт начала дипломатическую карьеру, служила послом США в ООН, а в 1997 году была назначена Государственным секретарём. Известная своим острым умом и напористым стилем, Олбрайт сыграла ключевую роль в формировании внешней политики США при администрации Клинтона, особенно в отношении Балкан и Ближнего Востока. Её пребывание в должности было отмечено усилиями по продвижению демократии и прав человека за рубежом, а также навигацией в сложных международных кризисах."
 COLIN_POWELL_LEADER_DESC: "Коллин Лютер Пауэлл (род. 5 апреля 1937) - американский государственный деятель и отставной четырёхзвёздный генерал, занимавший пост 65-го Государственного секретаря США при президенте Джордже Буше-младшем. Родившись в Гарлеме в семье ямайских иммигрантов, Пауэлл поднялся по служебной лестнице в армии США, служил во Вьетнаме и в итоге стал председателем Объединённого комитета начальников штабов. На посту Госсекретаря Пауэлл был ключевой фигурой в формировании внешней политики США в начале 2000-х, особенно в отношении войны с террором и войны в Ираке. Известный своим прагматичным подходом и упором на дипломатию, Пауэлл стремился создавать международные коалиции и способствовать стабильности в нестабильных регионах. Однако его репутация была подмочена скандалом вокруг разведданных, использованных для оправдания вторжения в Ирак."
 CONDOLEEZZA_RICE_LEADER_DESC: "Кондолиза Райс (род. 14 ноября 1954) - американский политолог и дипломат, занимавшая пост 66-го Государственного секретаря США при президенте Джордже Буше-младшем. Родившись в Бирмингеме, штат Алабама, Райс выросла в условиях сегрегированного общества и стала первой афроамериканкой на посту Госсекретаря. Имея образование в области международных отношений и фокусируясь на национальной безопасности, Райс сыграла ключевую роль в формировании внешней политики США при администрации Буша, особенно после терактов 11 сентября. Известная своей жёсткой позицией по борьбе с терроризмом и защитой продвижения демократии, Райс стремилась создавать международные коалиции и решать сложные глобальные задачи, включая войны в Афганистане и Ираке. Несмотря на критику некоторых решений администрации, Райс остаётся значимой фигурой в американской дипломатии и внешней политике."
 HILLARY_CLINTON_LEADER_DESC: "Хиллари Диана Родэм Клинтон (род. 26 октября 1947) - политик и правозащитница, занимавшая посты первой леди, сенатора от штата Нью-Йорк и Государственного секретаря при президенте Бараке Обаме. Выпускница Йельской школы права, Клинтон построила карьеру на защите прогрессивных идей, прав женщин и международной дипломатии. Известная своей трудоспособностью и политическим прагматизмом, Клинтон выступает за реформу здравоохранения, защиту окружающей среды и взаимодействие с международными институтами. Её спорное использование личного почтового сервера во время работы Госсекретарём остаётся предметом постоянных проверок."
 JOHN_KERRY_LEADER_DESC: "Джон Форбс Керри (род. 11 декабря 1943) - американский политик и дипломат, занимавший пост 68-го Государственного секретаря США при президенте Бараке Обаме. Родившись в Авроре, штат Колорадо, Керри - ветеран войны во Вьетнаме, награждённый многими орденами, выпускник Йельского университета. На посту Госсекретаря Керри сыграл ключевую роль в формировании внешней политики США, особенно в отношении иранской ядерной сделки и Парижского климатического соглашения. Известный своими дипломатическими навыками и приверженностью многосторонности, Керри стремился к глобальному сотрудничеству и решению острых международных проблем. Несмотря на критику с некоторых сторон, Керри остаётся уважаемой фигурой в американской дипломатии и продолжает выступать за защиту окружающей среды."

 ## Западные консерваторы ##
 GEORGE_BUSH_LEADER_DESC: "Джордж Уокер Буш (род. 6 июля 1946) - первый ребёнок Джорджа Герберта Уокера Буша, занимавшего пост 41-го президента Америки с 1989 по 1993 год. Недолго проработав в нефтяной промышленности, Буш занялся политикой и в итоге стал губернатором Техаса. Позиционируя себя как «сострадательного консерватора», Буш обещает снизить налоги, увеличить военные расходы и дерегулировать корпоративный сектор, убрав излишние ограничения на выбросы парниковых газов."
 JOHN_MC_CAIN_LEADER_DESC: "Джон Сидни Маккейн III (род. 29 августа 1936) - бывший военный лётчик и сенатор США от Аризоны. Сын адмирала ВМС, Маккейн служил во Вьетнаме, где был сбит и провёл в плену более пяти лет. После ухода из ВМС Маккейн занялся политикой и проработал в Сенате более трёх десятилетий. Известный своим «мавериком» - независимым стилем и готовностью переступать партийные линии, - Маккейн выступает за сильную национальную оборону, свободную торговлю и прагматичный подход к внешней политике. Несмотря на консервативные убеждения, Маккейн часто расходился с партией по вопросам реформы финансирования избирательных кампаний и иммиграции, нередко занимая независимую позицию, которая отличала его от партийного руководства."
 MITT_ROMNEY_LEADER_DESC: "Уиллард Митт Ромни (род. 12 марта 1978) - один из четырёх детей автомобильного магната Джорджа У. Ромни. Будучи набожным мормоном и убеждённым сторонником экономики laissez-faire и консервативных семейных ценностей, Ромни обещает использовать свой многолетний бизнес-опыт для сокращения государственных расходов, увеличения военных бюджетов и снятия ограничений с Уолл-стрит и крупных корпораций."
 DONALD_TRUMP_LEADER_DESC: "Дональд Джон Трамп (род. 14 июня 1946) - мультимиллиардер, сын девелопера Фредерика Кристофа Трампа. Получив «маленький кредит в миллион долларов», Трамп основал и расширил множество бизнесов под эгидой Trump Organization с 1971 года. Известный яростными тирадами и импульсивным стилем руководства, унаследованным от работы телеведущим, Трамп быстро нажил себе столько же врагов, сколько и друзей. Вступив на пост президента, Трамп обещает обуздать нелегальную иммиграцию, увеличить военные расходы, ввести протекционистские пошлины и твёрдо поставить Америку на первое место."
 MARCO_RUBIO_LEADER_DESC: "Марко Антонио Рубио (род. 28 мая 1971) - кубино-американский политик, сенатор США от Флориды. Пройдя через политику штата Флорида, Рубио занял жёсткую «ястребиную» позицию по внешней политике, особенно в отношении Кубы и Венесуэлы. Известный своим красноречием и энергичностью, Рубио выступает за снижение налогов, высокие военные расходы, жёсткую иммиграционную политику и против социалистических мер. Несмотря на его подъём как видного республиканского голоса, его меняющиеся политические позиции вызывали критику как либералов, так и консерваторов."
 JAMES_DAVID_VANCE_LEADER_DESC: "Джеймс Дэвид Вэнс (род. 2 августа 1984) - американский писатель и политик, занимающий пост сенатора США от Огайо с 2023 года. Родившись в Мидлтауне, штат Огайо, Вэнс наиболее известен своей книгой «Элегия Хилбилли», в которой рассказывается о трудностях рабочего класса Америки. Как сенатор, Вэнс позиционирует себя как консервативный голос, выступающий за экономический populism, культурный традиционализм и сильную национальную оборону. Известный своими откровенными и часто спорными заявлениями, Вэнс получал как похвалу, так и критику за свои взгляды на торговлю, иммиграцию и национальную идентичность."
 RON_DESANTIS_LEADER_DESC: "Рональд Дион Десантис (род. 14 сентября 1978) - американский политик, сенатор США от Флориды. Бывший офицер ВМС и выпускник Йеля, Десантис приобрёл репутацию консервативного «зажигателя», сосредоточенного на вопросах культурных войн. Известный своим конфронтационным стилем и готовностью сражаться как с демократами, так и с республиканским истеблишментом, Десантис выступает за ограниченное правительство, сильные правоохранительные органы, жёсткую позицию по иммиграции и общественному порядку."
 VIVEK_RAMAIAH_LEADER_DESC: "Вивек Рамасвами (род. 9 августа 1985) - американский предприниматель и политический деятель, известный своими прямыми взглядами на капитализм и культуру. Основав успешную биотехнологическую компанию, Рамасвами позиционирует себя как сторонник принципов свободного рынка и критик того, что он считает чрезмерным корпоративным регулированием и политической корректностью. Известный своей острой риторикой и готовностью бросать вызов как левым, так и правым, Рамасвами выступает за политику, способствующую экономическому росту, инновациям и индивидуальной свободе, противясь тому, что он считает превышением государственных полномочий как в экономической, так и в социальной сферах."
 SARAH_HUCKABEE_SANDERS_LEADER_DESC: "Сара Элизабет Хакаби Сандерс (род. 13 августа 1982) - американский политический деятель, бывший пресс-секретарь Белого дома при президенте Дональде Трампе. Дочь бывшего губернатора Арканзаса Майка Хакаби, Сандерс была заметным голосом в консервативной политике, известным своей жёсткой защитой политики администрации Трампа и конфронтационным стилем общения с прессой. Как пресс-секретарь, Сандерс отвечала за донесение посланий администрации до общественности и часто оказывалась в центре споров из-за ведения брифингов и своей непоколебимой лояльности президенту Трампу. Покинув Белый дом, Сандерс продолжает оставаться влиятельной фигурой в республиканской политике и выражала заинтересованность в баллотировании на выборные должности."

 ## ВРЕМЕННЫЕ (TEMP) ##
 BERNIE_SANDERS_LEADER_DESC: "Бернард Сандерс (род. 8 сентября 1941) - сын польских иммигрантов из рабочего класса, перебравшихся в США. Вступив в Лигу молодых социалистов во время учёбы в колледже, Сандерс выступал за равное отношение к белым и чернокожим во время движения за гражданские права. Позже Сандерс стал мэром Берлингтона, штат Вермонт, а затем был избран в Палату представителей и Сенат США. Называющий себя демократическим социалистом и прогрессистом, Берни Сандерс обещает сократить военные расходы, усилить власть профсоюзов и создать систему всеобщего здравоохранения."
 BARACK_OBAMA_LEADER_DESC: "Барак Хусейн Обама (род. 4 августа 1961) - бывший 44-й президент Соединённых Штатов и первый афроамериканец на этом посту. Сын кенийца и американки из Канзаса, Обама поднялся из относительной безвестности в президенты благодаря своему харизматичному красноречию и посланию надежды и перемен. На посту президента Обама провёл реформу здравоохранения через Affordable Care Act, руководил восстановлением после финансового кризиса и проводил в целом осторожную внешнюю политику, делая упор на дипломатию, а не на военное вмешательство. Его президентство вдохновило миллионы, одновременно вызвав ожесточённую критику со стороны политических оппонентов."
 BILL_CLINTON_LEADER_DESC: "Уильям Джефферсон Клинтон (род. 19 августа 1946) - бывший 42-й президент США, стипендиат Родса. Поднявшись из скромного начала в Арканзасе, Клинтон приобрёл репутацию умеренного демократа, который мог нравиться как прогрессистам, так и центристам. Его президентство сопровождалось экономическим ростом и относительным миром, хотя было омрачено вызовами во внешней политике и личным скандалом, приведшим к импичменту. Известный своей политической хитростью и способностью лавировать между противоборствующими силами, Клинтон определил центристское направление Демократической партии и остаётся влиятельным политическим деятелем во всём мире."
 GARY_JOHNSON_LEADER_DESC: "Гэри Эрл Джонсон (род. 1 января 1953) - либертарианский политик, дважды губернатор Нью-Мексико, который верит в минимальное вмешательство государства. Успешный бизнесмен, ставший политиком, Джонсон выступает за индивидуальную свободу, реформу наркополитики, свободные рынки и неинтервенционистскую внешнюю политику. Джонсон призывает сокращать государственные расходы, уменьшать регулирование и уважать гражданские свободы во всём политическом спектре. Как кандидат от третьей партии, он представляет альтернативу обеим основным партиям, хотя его предложения часто отвергаются истеблишментом как непрактичные."
 RAND_PAUL_LEADER_DESC: "Рэндал Хауард «Рэнд» Пол (род. 7 января 1963) - сенатор США от Кентукки и офтальмолог, отстаивающий либертарианские принципы внутри Республиканской партии. Сын бывшего кандидата в президенты Рона Пола, Рэнд выступает за неинтервенционистскую внешнюю политику, защиту гражданских свобод и ограниченное правительство. Известный своими филибастерами против правительственного превышения полномочий и программ слежки, Пол представляет фракцию республиканцев, скептически относящихся к военным расходам и зарубежным войнам. Несмотря на его принципиальную позицию, его взгляды часто отчуждают его от традиционного консервативного истеблишмента."
 DAVID_DUKE_LEADER_DESC: "Дэвид Эрнест Дюк (род. 1 июля 1950) - бывший политик-республиканец и активист белого национализма, чья карьера была отмечена крайним расизмом и антисемитизмом. Бывший «Великий маг» рыцарей Ку-клукс-клана, Дюк баллотировался на различные выборные должности с платформой превосходства белых и противодействия иммиграции и мультикультурализму. Несмотря на попытки сделать свои взгляды мейнстримными через политические кампании, Дюк остаётся широко осуждённым основными партиями и правозащитными организациями. Его влияние в основном ограничено маргинальными экстремистскими кругами."
 ANN_COULTER_LEADER_DESC: "Энн Харт Колтер (род. 8 декабря 1961) - видный консервативный политический комментатор и автор, известная своей провокационной риторикой и эпатажными заявлениями. Юрист по образованию, Колтер построила карьеру в правых СМИ через телевыступления, синдицированные колонки и многочисленные книги. Известная своим острым умом и готовностью лично атаковать либералов, Колтер выступает за ограничительную иммиграционную политику, христианские ценности в политике и военную мощь. Её конфронтационный стиль сделал её одновременно прославляемой фигурой среди консерваторов и противоречивой мишенью для критиков."

