 ### Free States of America ###
 COUNCIL_FOR_NATIONAL_PRESERVATION_DESC: "Совет - это жалкие остатки того, что было федеральным правительством бывших Соединённых Штатов. Оставшееся пытается сплотить вокруг нового флага те остатки людей и территорий, что у него ещё есть. Члены Совета стремятся создать ощущение законности и порядка, а также мира, чтобы затем провести плавную передачу власти новой администрации."

 ### Southern Republic of America ###
 MATHEW_CROUDER_DESC: "«Маршал», или просто Мэт/Мэтью, - своего рода парадокс. Будучи одновременно разговорчивым и чрезмерно тихим, этот молодой человек обладает рассеянным подходом к решению дел или к тому, что его интересует. Несмотря на то, что изначально он казался маловероятным кандидатом в лидеры, его собственная «мягкая сила» в виде умения заводить знакомства, а также его более мягкая личность делают его довольно близким к народу человеком. Хотя известно, что в более конфронтационных вопросах он иногда бывает вспыльчив, он стремится сделать всё возможное для как можно большего числа людей. Как однажды процитировал интервьюер: «Жизнь - это странный и запутанный беспорядок, вы никогда по-настоящему не знаете, где окажетесь. Даже если вы хотели сделать что-то одно, вы можете обнаружить, что делаете совершенно противоположное. Я имею в виду: от кадетского корпуса в старшей школе до странного хобби - написания конституции и изучения идеи микрогосударства - я никогда даже не мечтал быть политическим лидером… Особенно не на федеральном уровне». Эта своего рода наивность и безграничный оптимизм привели Мэтью к руководству Южной Республикой Америки. Что он будет делать, мало кто знает; пока нам остаётся только ждать и наблюдать."

 ##### EUROPE #####

 ### POLAND ###
 ALEKSANDER_KWASNIEWSKI_DESC: "Александр Квасьневский (род. 15 ноября 1954) - польский политик, занимавший пост президента Польши с 1995 по 2005 год. Выпускник Варшавского университета по специальности история и журналистика, Квасьневский начал свою политическую карьеру в 1980-х годах. Он занимал пост министра по делам молодёжи и физической культуры, прежде чем перейти в парламентскую политику. На посту президента Квасьневский сосредоточился на интеграции Польши с западными институтами, курируя вступление в НАТО в 1999 году и в Европейский союз в 2004 году. Известный своим прагматичным подходом к постхолодной геополитике, Квасьневский стремился стабилизировать положение Польши в Европе в период значительной региональной и континентальной трансформации."
 JAN_OLSZEWSKI_DESC: "Ян Ольшевский (род. 20 августа 1930) - польский политик и юрист, занимавший пост премьер-министра Польши в 1991 году. Ведущая фигура польской антикоммунистической оппозиции, Ольшевский активно участвовал в движении «Солидарность» и подпольных издательствах. Его пребывание на посту премьер-министра было отмечено усилиями по проведению экономических реформ и решению вопросов переходного правосудия после коммунистического правления. Правительство Ольшевского проводило люстрационную политику, направленную на раскрытие прошлой деятельности бывших коммунистических чиновников. Хотя его премьерство было недолгим, продлившись около десяти месяцев, оно представляло собой важный этап в раннем постсоветском переходе Польши."
 LECH_KACZYNSKI_DESC: "Лех Качиньский (род. 18 июня 1949 - умер 10 апреля 2010) - польский политик, занимавший пост президента Польши с 2005 по 2010 год. Юрист и бывший судья, Качиньский был известен своими консервативными социальными позициями и акцентом на традиционные ценности. Он стал сооснователем партии «Право и Справедливость» и занимал пост мэра Варшавы до своего избрания на пост президента. На посту президента Качиньский проводил внешнюю политику, подчёркивающую национальный суверенитет, и занял скептическую позицию по отношению к российскому влиянию. Его президентство было отмечено усилиями по преодолению несправедливости прошлого и проведению конституционных реформ. Качиньский погиб в авиакатастрофе под Смоленском (Россия), событии, которое глубоко повлияло на польский политический дискурс."
 JAROSLAW_KACZYNSKI_DESC: "Ярослав Качиньский (род. 18 июня 1952) - польский политик и юрист, который вместе со своим братом-близнецом Лехом основал партию «Право и Справедливость». После смерти брата Ярослав стал главным лидером и стратегом партии. Он занимал пост премьер-министра с 2006 по 2007 год и снова с 2015 года, возглавляя правительства, которые проводили консервативную социальную политику и расследования исторических несправедливостей. Качиньский известен своим акцентом на традиционные католические ценности, государственный суверенитет и скептицизмом по отношению к наднациональным институтам. Его политическая карьера отмечена значительным влиянием на польские консервативные движения и управление."
 DONALD_TUSK_DESC: "Дональд Туск (род. 22 апреля 1957) - польский политик, занимавший пост премьер-министра Польши с 2007 по 2014 год, а затем пост председателя Европейского совета. Выпускник Гданьского университета, Туск приобрёл репутацию прагматичного центриста и сторонника европейской интеграции. Его правительство проводило внешнюю политику, ориентированную на ЕС, и поддерживало меры экономической либерализации. Будучи премьер-министром, Туск провёл Польшу через глобальный финансовый кризис, сохранив относительно высокие экономические показатели. После завершения работы в Варшаве Туск занял пост председателя Европейского совета, где координировал ответные меры ЕС на региональные вызовы и поддерживал институциональную стабильность."
 MALGORZATA_KIDAWA_BLONSKA_DESC: "Малгожата Кидава-Блоньска (род. 19 сентября 1956) - польский политик, член партии «Гражданская платформа». Актриса и культурный администратор до начала политической карьеры, Кидава-Блоньска работала в Европейском парламенте и польском Сейме. Она известна своей защитой прав женщин, гражданских свобод и центристской экономической политики. Её политические позиции подчёркивают важность демократических институтов, европейской интеграции и социального диалога. Кидава-Блоньска участвовала в работе различных парламентских комитетов, занимающихся культурой, образованием и социальными вопросами."
 MACIEJ_PLAZYNSKI_DESC: "Мацей Плажиньский (род. 9 мая 1958 - умер 10 июня 2011) - польский политик и бизнесмен. Выпускник Гданьского университета, Плажиньский занимал различные политические должности и был известен своей деловой хваткой и предпринимательским подходом к управлению. Он занимал должности в нескольких правительствах и активно участвовал в обсуждении экономической политики. Плажиньский считался видным центристским политиком Польши до своей гибели в авиакатастрофе."
 EWA_BOZENA_KOPAC_DESC: "Эва Божена Копач (род. 3 февраля 1956) - польский политик и врач, занимавшая пост премьер-министра Польши с 2014 по 2015 год. Член партии «Гражданская платформа», Копач построила свою политическую карьеру на работе в местных органах власти и парламенте. Будучи премьер-министром, она продолжила центристскую политику своего предшественника и сохранила европейскую ориентацию Польши. Копач сосредоточилась на управлении здравоохранением, ранее занимая пост министра здравоохранения. Её пребывание в должности представляло собой преемственность центристской политической традиции Польши в середине 2010-х годов."
 BRONISLAW_KOMOROWSKI_DESC: "Бронислав Коморовский (род. 19 июня 1952) - польский политик, занимавший пост президента Польши с 2010 по 2015 год. Член партии «Гражданская платформа», Коморовский стремился сохранить институциональную преемственность после смерти своего предшественника. Его президентство делало акцент на европейской интеграции, институциональной стабильности и диалоге с различными политическими фракциями. Коморовский представлял центристские и проевропейские позиции во время своего пребывания в должности и поддерживал дипломатические отношения с международными партнёрами Польши. Его президентство было сосредоточено на восстановлении национального единства и проведении прагматичной внешней политики."
 RAFAL_TRZASKOWSKI_DESC: "Рафал Тшасковский (род. 29 июня 1972) - польский политик, член партии «Гражданская платформа», занимающий пост мэра Варшавы с 2018 года. Выпускник Варшавского университета со степенью в области права, Тшасковский также работал исследователем и журналистом. Он работал в Европейском парламенте, прежде чем перейти в польскую муниципальную политику. Будучи мэром Варшавы, Тшасковский сосредоточился на городском развитии, охране окружающей среды и расширении социальных услуг. Он известен своими центристскими позициями и защитой европейских ценностей и демократического управления."
 LESZEK_MILLER_DESC: "Лешек Миллер (род. 1 июля 1952) - польский политик, занимавший пост премьер-министра Польши с 2001 по 2004 год. Член Союза демократических левых сил, Миллер активно участвовал в посткоммунистическом переходе Польши. Его правительство курировало интеграцию Польши в НАТО и Европейский союз, что стало важными вехами в западной интеграции Польши. Миллер проводил умеренную экономическую политику и стремился укрепить демократические институты. Его премьерство привело к вступлению Польши в Европейский союз в 2004 году, что стало определяющим достижением его пребывания у власти."
 WLODZIMIERZ_CZARZASTY_DESC: "Влодзимеж Чарзасты (род. 11 апреля 1958) - польский политик и профсоюзный активист, возглавляющий Союз демократических левых сил. Многолетний организатор профсоюзов, Чарзасты представляет левые позиции, делающие акцент на правах рабочих и социальной защите. Он работал в Сейме и представляет округа, сосредоточенные на экономическом равенстве и интересах трудящихся. Политические позиции Чарзасты подчёркивают социальную солидарность, демократическое участие и сопротивление тому, что он считает чрезмерной рыночной либерализацией."
 WOJCIECH_JARUZELSKI_DESC: "Войцех Ярузельский (род. 6 июля 1923 - умер 25 мая 2014) - польский военный офицер и государственный деятель, занимавший пост премьер-министра, а затем президента в период перехода Польши от коммунистического правления. Карьерный военный офицер, Ярузельский руководил Польшей в период введения военного положения в 1981 году и последующее десятилетие коммунистического правления. Его решения в этот период остаются спорными: интерпретации варьируются от прагматической необходимости до авторитарного превышения полномочий. После падения коммунизма Ярузельский недолго занимал пост президента в период перехода к демократическому управлению, способствуя переходу Польши к многопартийной демократии."
 DANIEL_PODRZYCKI_DESC: "Даниэль Поджицкий - польский политический деятель и интеллектуал, связанный с левыми движениями в Польше. Он участвовал в различных политических организациях и представляет перспективы, делающие акцент на социальной справедливости и коллективной экономической организации. Политическая карьера Поджицкого отражает взаимодействие с социалистическими и коммунистическими идеями в контексте Польши после Холодной войны."
 ADAM_GIEREK_DESC: "Адам Герек - польский политический деятель, связанный с политикой коммунистической эпохи. После падения коммунистического правительства Польши Герек сохранил участие в левых политических движениях, представляющих преемственность с социалистическим прошлым Польши. Он представляет политические взгляды, уходящие корнями в институциональное наследие коммунистического периода Польши."
 ANDRZEJ_LEPPER_DESC: "Анджей Леппер (род. 22 февраля 1954 - умер 5 сентября 2011) - польский политик и фермер-активист, известный своей защитой интересов сельского хозяйства и популистскими позициями. Основатель партии «Самооборона», Леппер представлял сельские и рабочие округа. Он занимал парламентские и министерские должности, выступая за протекционистскую сельскохозяйственную политику и расширение социального обеспечения. Политическая траектория Леппера отражала низовую сельскую активность и скептицизм по отношению к политике свободного рынка."
 MATEUSZ_PISKORSKI_DESC: "Матеуш Пискорский (род. 20 ноября 1978) - польский политик и журналист, связанный с левыми и антисистемными политическими движениями. Сооснователь Конгресса новых левых, Пискорский представляет взгляды, критикующие как традиционный консерватизм, так и неолиберальную экономику. Он активно занимается парламентской политикой и журналистикой, выступая за альтернативные подходы к экономической и социальной политике."
 ANTONI_MACIEREWICZ_DESC: "Антоний Мацеревич (род. 28 октября 1948) - польский политик и эксперт по безопасности, связанный с консервативными позициями. Сооснователь Центра геополитических исследований, Мацеревич выступал за сильную национальную оборону и скептицизм в отношении намерений России. Он занимал пост министра обороны и участвовал в разработке политики в области разведки и безопасности. Мацеревич представляет националистические и суверенитетные взгляды в польской политике."
 LECH_WALESA_DESC: "Лех Валенса (род. 19 сентября 1943) - польский политик и бывший профсоюзный лидер, занимавший пост президента Польши с 1990 по 1995 год. Электрик по образованию, Валенса выдвинулся на первый план как председатель профсоюза «Солидарность», сыгравшего центральную роль в антикоммунистическом движении Польши. Информация об участии Валенсы в Польской народной армии в период коммунистического правления была предметом исторических споров. На посту президента Валенса выступал за быструю экономическую трансформацию и интеграцию с НАТО. Его президентство ознаменовало переход от коммунистического к демократическому управлению в Польше."
 PAWEL_KUKIZ_DESC: "Павел Кукиз (род. 29 мая 1971) - польский музыкант и политик, вошедший в политическую жизнь как политический реформатор и популистский кандидат. Известный рок-музыкант до начала политической карьеры, Кукиз баллотировался в президенты на антисистемной платформе, делающей акцент на прямой демократии и избирательной реформе. Он работал в парламенте и представляет округа, разочарованные традиционными политическими структурами. Политические позиции Кукиза сочетают популистский скептицизм по отношению к институциональной политике с защитой низового демократического участия."
 JAROSLAW_KALINOWSKI_DESC: "Ярослав Калиновский (род. 23 марта 1971) - польский политик и активист, участвовавший в различных политических движениях и инициативах. Он выступал за различные политические реформы и представлял округа, сосредоточенные на социальных и экономических изменениях. Политическая траектория Калиновского отражает взаимодействие с различными подходами к польскому управлению и социальной организации."
 WLADYSLAW_KOSINIAK-KAMYSZ_DESC: "Владислав Косиняк-Камыш (род. 24 мая 1977) - польский политик и врач, возглавляющий Польскую крестьянскую партию. Врач-педиатр, Косиняк-Камыш выступал за сельские округа и защиту сельского хозяйства. Он представляет центристские позиции, делающие акцент на социальном диалоге и сбалансированном экономическом развитии. Возглавляемая им Крестьянская партия сохраняет традиционный фокус на крестьянских и сельских интересах в политическом ландшафте Польши."
 WALDEMAR_WITKOWSKI_DESC: "Вальдемар Витковски (род. 2 октября 1946) - польский политический деятель и экономист, участвовавший в различных экономических и политических дискуссиях. Он выступал за определённые подходы к экономической политике и социальной организации в период постсоветской трансформации Польши."
 MAREK_POL_DESC: "Марек Поль - польский политический деятель, участвовавший в политических движениях и парламентской работе. Он представлял различные округа и политические позиции в рамках постсоветской политической системы Польши."
 LESZEK_BALCEROWICZ_DESC: "Лешек Бальцерович (род. 19 января 1947) - польский экономист и политик, известный как архитектор экономической трансформации Польши после коммунизма. Будучи министром финансов при правительстве «Солидарности», Бальцерович провёл радикальные рыночные реформы, включая программу шоковой терапии, известную как план Бальцеровича. Эти реформы преобразовали Польшу из плановой экономики в рыночную систему, хотя и сопровождались значительными социальными потрясениями. Сторонники приписывают Бальцеровичу создание основ для экономического роста Польши, в то время как критики утверждают, что его политика создала серьёзные трудности во время перехода. Он остаётся влиятельным голосом в дискуссиях об экономической политике и институциональных реформах."
 ELZBIETA_BINCZYCKA_DESC: "Эльжбета Биньчицка (род. 25 апреля 1954) - польская актриса и политическая активистка, наиболее известная своей карьерой в театре и кино. Она была политически активна, выступая за различные социальные инициативы и представляя взгляды гражданского общества в публичном дискурсе. Политическая активность Биньчицкой отражает её более широкую приверженность культурным и социальным вопросам."
 SZYMON_HOLOWNIA_DESC: "Шимон Холовня (род. 16 июня 1974) - польский телеведущий и политический деятель, активный как реформатор и антисистемный кандидат. Известный своей карьерой в развлекательных СМИ, Холовня перешёл в политику, выступая за институциональную реформу и новые политические подходы. Он основал политическое движение «Польша 2050», делающее акцент на смене поколений и альтернативных моделях управления. Его политические позиции сочетают социальный либерализм со скептицизмом по отношению к устоявшимся политическим институтам."
 PIOTR_IKONOWICZ_DESC: "Пётр Иконович (род. 14 февраля 1955) - польский политик и активист, связанный с левыми движениями. Бывший активист «Солидарности», Иконович представлял округа, сосредоточенные на защите рабочих и социальном обеспечении. Он занимал парламентские должности и поддерживал связь с рабочими и социальными движениями на протяжении всего постсоветского периода Польши."
 BOGUSLAW_GORSKI_DESC: "Богуслав Горский - польский политический деятель, связанный с левыми и коммунистическими движениями. Он участвовал в представлении взглядов, уходящих корнями в коммунистическое наследие Польши, в постсоветском политическом ландшафте."
 CZESLAW_PIATAS_DESC: "Чеслав Пёнтас - польский политический деятель, связанный с националистическими движениями. Он представлял взгляды, делающие акцент на национальном суверенитете и консервативных социальных позициях в польском политическом дискурсе."
 FRANCISZEK_GAGOR_DESC: "Францишек Гонгор - польский политический деятель, связанный с националистическими и правыми движениями. Он представлял округа, делающие акцент на национальной идентичности и консервативных политических позициях."
 ROMAN_GIERTYCH_DESC: "Роман Гертых (род. 4 июля 1971) - польский политик, связанный с националистическими и правыми движениями. Активный участник Лиги польских семей, Гертых выступал за консервативную католическую социальную политику и националистические позиции. Он занимал пост министра образования и участвовал в парламентской политике, представляя округа, делающие акцент на традиционных ценностях и национальной идентичности."
 STAWOMIR_MENTZEN_DESC: "Славомир Ментцен (род. 16 ноября 1982) - польский политик и экономист, связанный с либертарианскими и правыми движениями. Заместитель председателя партии «Конфедерация», Ментцен выступает за экономику свободного рынка, сокращение государственного вмешательства и консервативные социальные позиции. Он баллотировался в президенты и занимал парламентские должности, представляя округа, делающие акцент на экономическом либерализме и национальном суверенитете."
 JANUSZ_KORWIN_MIKKE_DESC: "Януш Корвин-Микке (род. 27 января 1942) - польский политик и бывший журналист, известный либертарианскими и правыми позициями. Сооснователь движения «Конфедерация» и ранее активный участник партии «Свобода и Родина», Корвин-Микке выступает за минимальное государственное вмешательство, свободные рынки и традиционные консервативные ценности. Его политические позиции сочетают экономический либерализм с культурным консерватизмом. Корвин-Микке был противоречивой и провокационной фигурой в польской политике, известной поляризующей риторикой и нетрадиционными политическими позициями."
 KAROL_NAWROCKI_DESC: "Кароль Навроцки (род. 24 октября 1976) - польский историк и политический деятель, связанный с националистическими и консервативными движениями. Директор Польского музея образования Второй мировой войны и эксперт по польской военной истории, Навроцки активно участвует в публичных комментариях по историческим и современным вопросам. Он представлял округа, делающие акцент на национальной истории, культурном наследии и консервативных позициях в современных политических дебатах."
 ANDRZEJ_OLECHOWSKI_DESC: "Анджей Олеховски (род. 9 июня 1947) - польский экономист и политик, участвовавший в различных политических движениях и партиях. Бывший министр иностранных дел, Олеховски представлял центристские и проевропейские позиции в польской политике. Он был связан с партией «Гражданская платформа» и выступал за экономическую либерализацию, европейскую интеграцию и прагматичное управление. Политическая карьера Олеховски отражает взаимодействие с посткоммунистическим переходом Польши и усилия по балансированию национальных интересов с европейским сотрудничеством."

 ### PORTUGAL ###
 ANTONIO_GUTERRES_LEADER_DESC: "Антониу Мануэл де Оливейра Гутерриш (род. 30 апреля 1949) - португальский политик и бывший профессор физики, возглавляющий Социалистическую партию с 1992 года. Окончив престижный Высший технический институт в 1971 году, он недолго преподавал теорию систем, прежде чем вступить в Социалистическую партию в 1974 году после Революции гвоздик. Впервые избранный в парламент в 1976 году, Гутерриш провёл более 15 лет в оппозиции, работая в многочисленных парламентских комитетах и в качестве члена Парламентской ассамблеи Совета Европы, где он возглавлял Комитет по демографии, миграции и беженцам. Будучи лидером партии с 1992 года, он порвал с социалистической традицией как набожный католик в исторически светской партии. Избранный премьер-министром в 1995 году, его первый срок ознаменовался экономической экспансией, продолжением приватизации и успешным проведением Expo '98 в Лиссабоне. Ключевой интернационалист, Гутерриш сыграл решающую роль в обеспечении переходной администрации ООН в Восточном Тиморе и завершении передачи Макао Китаю. Известный своим стилем достижения консенсуса и глубокой приверженностью гуманитарным целям, Гутерриш сейчас сталкивается со вторым сроком с уменьшенным большинством, экономическими проблемами и растущей напряжённостью в партии."
 JOSE_MANUEL_BARROSO_LEADER_DESC: "Жозе Мануэл Дуран Баррозу (род. 23 марта 1956) - португальский политик и бывший профессор права, возглавляющий Социал-демократическую партию с 1999 года. Окончив юридический факультет Лиссабонского университета, он получил степень магистра политологии в Женевском университете с отличием. В молодости он был лидером маоистского Движения за реорганизацию партии пролетариата (MRPP), прежде чем покинуть его в 1977 году. Он вступил в Социал-демократическую партию в 1980 году. В правительствах Каваку Силвы он занимал посты государственного секретаря по внутренней администрации, государственного секретаря по иностранным делам и сотрудничеству, а с 1992 года - министра иностранных дел. В этой роли он был движущей силой Бисесских соглашений 1991 года о мире в Анголе и инициировал переговоры с Индонезией, которые в конечном итоге привели к самоопределению Восточного Тимора. После того как СДП проиграла выборы 1995 года, он вернулся к преподаванию в Университете Лузиады и Джорджтаунском университете, оставаясь активным в партии. В мае 1999 года он был избран президентом СДП, сменив Марселу Ребелу де Соузу. Известный как отличный дипломат с блестящей международной карьерой, Баррозу, тем не менее, часто описывается как лишённый харизмы и испытывающий трудности в общении с португальской публикой - холодная, расчётливая и рациональная фигура, чья слабость как публичного оратора резко контрастирует с его навыками на международной арене."

 ##### ASIA #####

 ### CHINA ###
 JIANG_ZEMIN_LEADER_DESC: "Цзян Цзэминь (родился 17 августа 1926 года) - бывший инженер, возглавлявший Коммунистическую партию с 1989 года, заменив реформатора Чжао Цзыяна после протестов на площади Тяньаньмэнь. Ранее он занимал пост мэра Шанхая, и его постоянное покровительство лицам, служившим с ним в Шанхае, привело к тому, что его фракцию партии окрестили «Шанхайской кликой». Сторонник экономических реформ, его правление в 1990-х годах стало продолжением политики реформ и открытости Дэн Сяопина и нормализации частного сектора. Он также руководил возвращением Гонконга и Макао под китайское господство и столкнулся с критикой за его жесткий подход к правам человека."
 HU_JINTAO_LEADER_DESC: "Ху Цзиньтао (родился 21 декабря 1942 года) - бывший инженер, который испытал на себе осуждение своего отца во время Культурной революции. Как лидер, он выразил желание заняться проблемами влияния быстрого экономического роста на общество и окружающую среду Китая и возглавляет фракцию Туаньпай или Коммунистического союза молодежи Коммунистической партии. Вместе с премьером Вэнь Цзябао Ху стремится более равномерно распределить достижения экономического развития Китая и принять менее элитарный режим управления, при этом твердо сохраняя главенство Коммунистической партии."
 XI_JINPING_LEADER_DESC: "Си Цзиньпин (родился 15 июня 1953 года) принадлежит к новому поколению китайских чиновников, известных как принцы. Сын ветерана Коммунистической партии, Си подчеркивал централизацию и консолидацию власти под своим руководством, ослабляя политических соперников и существующие фракции Коммунистической партии посредством своих кампаний по борьбе с коррупцией. Он также является сторонником напористой внешней политики, что знаменует собой отход от политики Дэн Сяопина по сдержанности в международных делах."
 BO_XILAI_LEADER_DESC: "Бо Силай (родился 3 июля 1949 года) - известный принц и сын бывшего вице-премьера Бо Ибо. Известный по своему пребыванию на посту секретаря партии Чунцина, Бо ассоциируется с его кампанией против организованной преступности и возрождением «красной культуры», которая принесла ему поддержку среди левых, недовольных неравноправной траекторией экономического роста Китая. За свою политическую карьеру Бо нажил себе множество врагов и имеет противоречивую репутацию."

 ### JAPAN ###

 ### KOREA ###
 KIM_DAE_JUNG_LEADER_DESC: "Ким Дэ Чжун (родился 6 января 1924 года) - уважаемая фигура в южнокорейской политике благодаря своей долгой истории демократической активности, и некоторые называют его «Нельсоном Манделой Азии». Пережив предполагаемое покушение, похищение агентами разведки, а также смертный приговор, Ким наконец вышел из почти 50-летнего противостояния, чтобы возглавить свою страну. Его приоритеты с момента вступления в должность в 1998 году включали восстановление экономики, привлечение к ответственности могущественных корейских чеболей и взаимодействие с Северной Кореей в рамках его фирменной политики «Солнечного света»."
 ROH_MOO_HYUN_LEADER_DESC: "Ро Му Хён (родился 6 августа 1946 года) - бывший адвокат по правам человека из бедной семьи, защищавший студентов-протестующих против авторитарного режима. Подобно Ким Дэ Чжуну, который поддерживал его президентство, Ро выступает за переговоры с Севером, а не за политику международной изоляции. Он также открыто критиковал США и Японию и имеет антагонистические отношения с консервативным истеблишментом Кореи. Ро черпает свою поддержку из левого «поколения 386» - тех, кому за 30, кто учился в колледже в 80-х и родился в 60-х."
 LEE_MYUNG_BAK_LEADER_DESC: "Ли Мён Бак (родился 19 декабря 1941 года) - консервативный политик и бывший генеральный директор Hyundai. Во время работы в Hyundai он получил прозвище «Бешеный бульдозер» отчасти из-за своего строгого подхода к управлению. Будучи амбициозной фигурой, Ли надеется превратить Корею в одну из крупнейших экономик мира и продвигать интернационалистскую внешнюю политику, которая повысит глобальный статус Кореи. В отличие от своих коллег из левого крыла, Ли выступает за жёсткий подход к Северной Корее и тесное партнёрство с Соединёнными Штатами."
 PARK_GEUN_HYE_LEADER_DESC: "Пак Кын Хе (родилась 2 февраля 1952 года) наиболее известна как дочь Пак Чон Хи, бывшего авторитарного лидера Кореи, чьё наследие продолжает вызывать споры. В то время как некоторые считают Пак Чон Хи жестоким диктатором, который использовал пытки и тюремное заключение, чтобы сохранить свою власть, другие восхваляют его за экономические достижения. В юности Пак пережила убийство и матери, и отца: матери - от рук северокорейского агента, отца - от рук главы Центрального разведывательного управления Кореи. Известная своей консервативной, ориентированной на рынок позицией, Пак выступает за дерегулирование, снижение налогов, а также за закон и порядок."
 MOON_JAE_IN_LEADER_DESC: "Мун Чжэ Ин (родился 24 января 1953 года) - сын северокорейских беженцев, бывший адвокат по правам человека и активист. Во время военной службы Мун служил в спецназе и принимал участие в операции «Пол Баньян» - совместном ответе Республики Корея и США на убийство топором в Пханмунджоне в 1976 году. Близкий друг своего предшественника Ро Му Хёна, с которым он ранее вёл юридическую практику, Мун был активным членом левой администрации Ро и важным игроком в политике «Солнечного света», которой он остаётся предан. Будучи приверженным союзу с США, Мун заявил, что Корея должна научиться говорить «нет» американцам, и надеется вернуть себе контроль над южнокорейскими войсками в военное время."
 YOON_SUK_YEOL_LEADER_DESC: "Юн Сок Ёль (родился 18 декабря 1960 года) - бывший генеральный прокурор Республики Корея и главный прокурор прокуратуры Центрального округа Сеула. Во время своего президентства Юн Сок Ёль ввёл чрезвычайное военное положение, обвинив оппозицию в контроле над Национальным собранием, симпатиях к Северной Корее и парализации правительства антигосударственной деятельностью. Но затем Национальное собрание проголосовало за отмену военного положения. С тех пор Юн Сок Ёлю было предъявлено обвинение в мятеже, и ему запретили покидать страну - он стал первым действующим президентом в истории Южной Кореи, которому запретили выезд. Позже Юн Сок Ёль был арестован, став первым действующим президентом в истории Южной Кореи, подвергшимся аресту."
 ### NORTH KOREA ###
 KIM_JONG_UN_LEADER_DESC: "Ким Чен Ын (родился 8 января 1984 года) был сыном, которого Ким Чен Ир ценил больше всего при жизни. Во время учёбы в Швейцарии его несколько грузное телосложение позволяло недооценивать его. Но когда он взошёл на трон, он потряс мир своим спокойствием, проницательностью и безжалостностью в тайных казнях своих политических врагов (включая, по неподтверждённым данным, казнь его дяди по отцовской линии из зенитных орудий), своей решимостью продолжать разработку ядерного оружия, несмотря на международные санкции, и умением выбрать точное время для дружественного диалога с США и Южной Кореей. Под его руководством как «великого человека с небес», возможно, существует реальная возможность превращения Северной Кореи в «сильную и процветающую нацию»?"
 KIM_JONG_NAM_LEADER_DESC: "Ким Чен Нам (родился 10 мая 1971 года) - сын Ким Чен Ира и его второй жены. Будучи старшим сыном в семье, Ким Чен Нам стал свидетелем страданий народа во время «Трудного похода». Во время своего пребывания за границей он увидел стремительное развитие китайских реформ и открытости и был впечатлён силой перемен. Он верил, что только реформы могут принести материальное процветание и духовное счастье северокорейскому народу, но он также понимал, что перемены могут стоить ему власти. Но он никогда об этом не жалел."
 KIM_YO_JONG_LEADER_DESC: "Ким Ё Чжон (родилась 26 сентября 1987 года), будучи единственной девочкой в семье, проявила такой талант с самого начала своей политической карьеры, что Ким Чен Ир воскликнул, выбирая преемника: «Если бы только Ким Ё Чжон была мальчиком». Возможно, из-за своего женственного образа она (что необычно) пользуется высокой поддержкой как дома, так и за рубежом. Сегодня её правление доказывает, что женщины могут добиваться таких же успехов, как и мужчины, независимо от того, какая политика в стране."
 ### Syria ###
 RIYAD_AL_TURK_DESC: "Рияд аль-Турк (род. 3 мая 1930) - сирийский политический деятель и экономист, учился в Дамасском университете, после чего получил известность как сторонник демократических реформ. Аль-Турк был влиятельным голосом, продвигающим диалог между различными политическими движениями Сирии, стремясь преодолеть разногласия через экономические и социальные реформы. Опираясь на десятилетия опыта в сирийских политических делах, он подчёркивает важность институционального укрепления и инклюзивного управления как путей к национальной стабильности и развитию."
 GEORGE_SABRA_DESC: "Джордж Сабра (род. 1942) - сирийский экономист и политик, занимавший пост министра экономики и внешней торговли. Член Сирийской коммунистической партии, Сабра участвовал в экономическом планировании и инициативах развития, сосредоточившись на промышленном росте и торговых отношениях."
 HANIN_NIMIR_DESC: "Ханин Нимир (род. 1981) - сирийская журналистка и политическая активистка, работавшая в крупных арабских газетах, включая Al-Hayat. Известная своими критическими репортажами о сирийских делах и защитой демократических реформ, Нимир участвовала в оппозиционных движениях и кампаниях за свободу СМИ."
 FARID_GHADRY_DESC: "Фарид Гадри (род. 1953) - сирийско-американский бизнесмен и политический деятель, основавший Партию реформ Сирии. Бывший руководитель ARAMCO, Гадри выступал за демократические реформы и рыночно-ориентированную экономическую политику в Сирии."
 HAYTHAM_MANNAA_DESC: "Хайсам Манна (род. 1964) - сирийский врач и политический активист, видная фигура в оппозиционном движении. Как член Национального координационного комитета за демократические перемены, Манна выступал за мирный демократический переход и развитие гражданского общества."
 BASHAR_AL_ASSAD_DESC: "Башар аль-Асад (род. 11 сентября 1965) - президент Сирии с 2000 года, сменивший своего отца Хафеза аль-Асада. По образованию офтальмолог, Асад сосредоточился на экономической модернизации и технологическом развитии, сохраняя политическую структуру Сирии."
 SUHEIL_AL_HASSAN_DESC: "Сухейль аль-Хасан (род. 1970) - сирийский военный генерал, известный как «Тигр» за свою роль в боевых операциях. Выпускник Хомсской военной академии, Хасан командовал ключевыми воинскими подразделениями и играл значительную роль в различных военных кампаниях."
 MAHER_AJEEB_JAZZA_DESC: "Махер аль-Асад (род. 1967) - сирийский военный офицер, брат президента Башара аль-Асада. Как командующий Республиканской гвардией и 4-й бронетанковой дивизией, Махер участвовал в военных операциях и вопросах безопасности."
 SHAYKH_ABDUL_QADEEM_ZALLUM_DESC: "Шейх Абдул Кадим Заллум (род. 1969) - сирийский салафитский священнослужитель и религиозный лидер, связанный с исламскими движениями. Известный своими религиозными учениями и влиянием в консервативных кругах, Заллум выступал за принципы исламского правления."
 RIYAD_HIJAB_DESC: "Рияд Хиджаб (род. 1966) - сирийский политик, занимавший пост премьер-министра с 2012 по 2013 год. Бывший губернатор Камышлы, Хиджаб позже занялся оппозиционной деятельностью после ухода из правительства."
 ALI_SADREDDINE_AL_BAYANOUNI_DESC: "Али Садреддин аль-Баянуни (род. 1938) - сирийский политический деятель, лидер «Братьев-мусульман». Много лет прожив в изгнании, Баянуни выступал за исламские демократические принципы и противодействие авторитарному правлению."
 MOHAMMAD_WALID_DESC: "Мохаммад Валид (род. 1950) - сирийский бизнесмен и политический активист, участвовавший в оппозиционных движениях. Известный своей ролью в координации сирийских общин за рубежом, Валид выступал за демократические перемены."
 MOHAMMAD_RIAD_AL_SHAQFEH_DESC: "Мохаммад Риад аль-Шакфе (род. 1951) - сирийский инженер и политический деятель, занимавший пост президента Национальной коалиции сирийских революционных и оппозиционных сил. Бывший член сирийского парламента, Шакфе выступал за демократические реформы."
 SAFWAN_AL_QUDSI_DESC: "Сафван аль-Кудси (род. 1953) - сирийский военный офицер, занимавший пост начальника штаба армии и вооружённых сил. Выпускник Хомсской военной академии, Кудси занимал различные командные должности в сирийской армии."
 MICHEL_KILO_DESC: "Мишель Кило (род. 1940) - сирийский христианский интеллектуал и политический активист. Журналист и писатель, Кило участвовал в Дамасской декларации и выступал за демократические реформы и гражданские свободы."
 RAMI_MAKHLOUF_DESC: "Рами Махлуф (род. 1969) - сирийский бизнесмен, кузен президента Башара аль-Асада. Как глава семейного бизнес-империи Махлуфов, он участвовал в телекоммуникациях, строительстве и других отраслях."
 KHALED_KHOUJA_DESC: "Халед Ходжа (род. 1965) - сирийский врач и политический активист, участвовавший в оппозиционных движениях. Бывший член сирийского парламента, Ходжа выступал за демократические перемены и гражданское общество."
 QADRI_JAMIL_DESC: "Кадри Джамиль (род. 1952) - сирийский политик, занимавший пост министра экономики и торговли. Член Сирийской социальной националистической партии, Джамиль участвовал в экономической политике и политических переговорах."
 JOSEPH_SWEID_DESC: "Джозеф Свейд (род. 1956) - сирийский политик, бывший министр административного развития. Член Сирийской социальной националистической партии, Свейд участвовал в государственном управлении и политических делах."
 ALI_ASLAN_DESC: "Али Аслан (род. 1930) - сирийский военный офицер, занимавший пост министра обороны. Ветеран сирийского переворота 1963 года, Аслан занимал различные военные и политические должности."
 ALI_ABDULLAH_AYYOUB_DESC: "Али Абдулла Айюб (род. 1952) - сирийский военный генерал, занимавший пост министра обороны. Выпускник Хомсской военной академии, Айюб командовал воинскими подразделениями и занимал ключевые оборонные посты."
 HAFEZ_AL_ASSAD_DESC: "Хафез аль-Асад (род. 6 октября 1930) - президент Сирии с 1971 года до своей смерти в 2000 году. Бывший военный офицер и член партии Баас, Асад пришёл к власти в результате переворота и установил авторитарный режим. Его правление было отмечено усилиями по модернизации экономики и инфраструктуры Сирии, а также поддержанием политической стабильности через сильный аппарат безопасности. Внешняя политика Асада характеризовалась сложными отношениями с соседними странами и участием в региональных конфликтах. Несмотря на авторитарное правление, Асад сохранял определённую популярность среди некоторых слоёв сирийского населения благодаря своему акценту на национальную гордость и экономическое развитие."
 EMILE_LAHOUD_DESC: "Эмиль Лахуд (род. 12 января 1936) - ливанский политик и бывший военный генерал, занимавший пост президента Ливана с 1998 по 2007 год. Представитель маронитской христианской общины, его президентство было отмечено тесными связями с Сирией и усилиями по поддержанию стабильности в Ливане в период политических потрясений. Известный своим стилем сильного лидера и акцентом на безопасность, его пребывание у власти также характеризовалось напряжённостью с различными политическими фракциями и международными игроками."
 MEJD_AL_ASSAD_DESC: "Медж аль-Асад (род. 1969) - сирийский бизнесмен и член семьи Асада. Как сын брата Хафеза аль-Асада, Медж занимался различными деловыми предприятиями и вёл относительно скромную политическую жизнь по сравнению с другими членами семьи Асада."
 BUSHRA_AL_ASSAD_DESC: "Бушра аль-Асад (род. 1960) - сирийская бизнес-леди и член семьи Асада. Как дочь Хафеза аль-Асада, Бушра занималась различными деловыми проектами и сохраняла относительно низкий политический профиль по сравнению с другими членами семьи Асада."
 AYMAN_AL_ZAWAHIRI_DESC: "Айман аз-Завахири (род. 19 июня 1951) - египетский врач и исламистский боевик, занимающий пост лидера «Аль-Каиды» с 2011 года. Бывший член «Египетского исламского джихада», аз-Завахири участвовал в различных боевых действиях и террористических заговорах на Ближнем Востоке и во всём мире. Известный своим идеологическим влиянием и стратегическим мышлением, аз-Завахири написал многочисленные тексты по теории джихадизма и сыграл важную роль в руководстве операциями и пропагандой «Аль-Каиды» в течение своего пребывания на посту лидера."
 ### AFRICA ###
 POLITICS_PAUL_KAGAME_DESC: "Когда Полу Кагаме было 28 лет, он помог свергнуть правительство Уганды. В 36 лет он сверг правительство Руанды, возглавляемое хуту, совершившее геноцид. В 39 лет он сверг Мобуту из ДР Конго, самого коррумпированного и репрессивного диктатора Африки. Кагаме, вероятно, самый успешный военный лидер из ныне живущих, выигравший больше войн, чем кто-либо, - и всё это с ограниченным бюджетом. Подавляя всякую оппозицию у себя на родине, генерал тутси постоянно следит за дальнейшими иностранными авантюрами, выслеживая повстанцев хуту и эксплуатируя минеральные богатства."
 ### Greece ###
 costas_simitis_desc: "Костас Симитис (родился 23 июня 1936 года) - сын юриста Джорджа Симитиса и профессора Афинского экономического университета. Приняв участие в антиправительственных организациях во время греческой хунты, Костас Симитис вскоре после падения хунты стал одним из основателей Панэллинского социалистического движения (ПАСОК) в 1974 году. После победы ПАСОК на выборах 1981 года он занимал многие государственные должности во время правления Андреаса Папандреу, такие как глава департаментов экономики, сельского хозяйства, образования и религии, а также одновременно глава департаментов промышленности, исследований, энергетики, технологий и торговли. После смерти Андреаса Папандреу в 1996 году он был избран в руководство ПАСОК и вскоре после этого победил на всеобщих выборах 1996 года. Теперь Костас Симитис намерен неуклонно увеличивать приватизацию в государственном секторе, обеспечивать экономическую стабильность, снижать государственный долг, решать греко-турецкие споры и, что наиболее важно, расширять связи и сотрудничество с Европейским союзом."
 nikolaos_michaloliakos_desc: "Николаос Михалолиакос (родился 11 декабря 1957 года) - основатель «Золотой зари», крупнейшей националистической партии Греции. Михалолиакос был сторонником греческого военного режима и был известен своим участием во многих экстремистских правых группах, которые совершали нападения на многих деятелей антидиктатуры, а также связями с главой греческой хунты Георгиосом Пападопулосом. В 1980 году он сформировал крайне правую партию «Золотая заря», которая ставит своей целью антилевую повестку, борьбу с иммиграцией, прославление греческих авторитарных режимов, таких как хунта 1967 года и режим 4 августа 1936 года, а также сближение с Россией и Китаем и отход от Запада. Михалолиакос и его партия «Золотая заря» были осуждены как преступная организация, которая преследует меньшинства, придерживается неонацистских и фашистских взглядов, а также антидемократической позиции. Несмотря на негативную реакцию в его адрес, популярность Николаоса Михалолиакоса и его партии растёт, поскольку экономическая нестабильность и социальные разногласия погружают Грецию в кризис, что привлекает всё больше сторонников к делу «Золотой зари». Если ситуация ухудшится, Николаос Михалолиакос может достичь своих целей, взяв власть и построив новое греческое государство."