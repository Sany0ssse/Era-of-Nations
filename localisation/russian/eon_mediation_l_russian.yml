l_russian:
 eon_request_war_mediation:0 "Запросить посредничество в войне"
 eon_request_war_mediation_desc:0 "Подготовить просьбу этой стране выступить посредником в обсуждениях с одним из наших противников."
 eon_request_war_mediation_send_desc:0 "Предложить [THIS.GetNameWithFlag] роль посредника. Бесплатный черновик действует 7 дней. В решениях выберите конкретного противника и тему. Отправка предложения стоит 20 единиц политической власти. Посредник и противник должны отдельно согласиться, прежде чем откроется 30-дневный необязывающий мандат на обсуждения."
 eon_withdraw_mediation:0 "Отозвать предложение или завершить посредничество"
 eon_withdraw_mediation_desc:0 "Отозвать предложение о посредничестве или завершить согласованный мандат на обсуждения."
 eon_withdraw_mediation_send_desc:0 "Отозвать предложение или завершить согласованный мандат без дополнительной платы. Первоначальный ответ без решения необходимо закрыть, чтобы снять резервирование. Уже затраченные усилия не возмещаются. Это действие не прекращает войну и не изменяет соглашения."
 eon_mediation_category:0 "Посредничество с противником в войне"
 eon_mediation_category_desc:0 "Выберите в черновике одного противника и одну тему для обсуждений через предложенного посредника. Обсуждения деэскалации и гуманитарного доступа требуют отдельного согласия посредника и противника. Сам мандат не создаёт перемирия, права доступа, передачи территорий или военных обязательств."
 eon_select_mediation_deescalation_opponent:0 "Предложить обсуждения деэскалации с [From.GetName]"
 eon_select_mediation_deescalation_opponent_desc:0 "Предложить необязывающие обсуждения деэскалации с [From.GetName] через [?eon_mediation_mediator.GetName]. Отправка один раз стоит 20 единиц политической власти. Сначала отвечает посредник, затем отдельно решает противник. Согласие на обсуждения не вводит перемирие и не прекращает войну."
 eon_select_mediation_humanitarian_opponent:0 "Предложить обсуждения гуманитарного доступа с [From.GetName]"
 eon_select_mediation_humanitarian_opponent_desc:0 "Предложить необязывающие обсуждения гуманитарного доступа с [From.GetName] через [?eon_mediation_mediator.GetName]. Отправка один раз стоит 20 единиц политической власти. Сначала отвечает посредник, затем отдельно решает противник. Предложение не создаёт права доступа, коридора или перемирия."
 eon_mediation_mediator_deescalation_title:0 "Просьба о посредничестве в обсуждениях деэскалации"
 eon_mediation_mediator_deescalation_desc:0 "[From.GetName] просит нас выступить посредником в необязывающих обсуждениях деэскалации с [?eon_mediation_party_b.GetName]. При нашем согласии противник получит отдельное приглашение. Только его согласие откроет 30-дневный мандат на обсуждения. Мы не принимаем военных обязательств и не можем обязать другие стороны или прекратить их войну этим мандатом."
 eon_mediation_mediator_humanitarian_title:0 "Просьба о посредничестве в обсуждениях гуманитарного доступа"
 eon_mediation_mediator_humanitarian_desc:0 "[From.GetName] просит нас выступить посредником в обсуждениях гуманитарного доступа с [?eon_mediation_party_b.GetName]. При нашем согласии противник получит отдельное приглашение. Только его согласие откроет 30-дневный необязывающий мандат. Коридор, право доступа, перемирие или военные обязательства не создаются."
 eon_mediation_opponent_deescalation_title:0 "Приглашение к обсуждениям деэскалации через посредника"
 eon_mediation_opponent_deescalation_desc:0 "[From.GetName] согласилось выступить посредником по предложению [?eon_mediation_party_a.GetName]. Мы можем принять или отклонить необязывающие обсуждения деэскалации. Согласие откроет 30-дневный мандат для этих трёх стран; оно не создаёт перемирия или мира и не связывает союзников или сюзерена. Конкретные условия требуют отдельного соглашения."
 eon_mediation_opponent_humanitarian_title:0 "Приглашение к обсуждениям гуманитарного доступа через посредника"
 eon_mediation_opponent_humanitarian_desc:0 "[From.GetName] согласилось выступить посредником по предложению [?eon_mediation_party_a.GetName] о гуманитарном доступе. Мы можем принять или отклонить эти необязывающие обсуждения. Согласие откроет 30-дневный мандат для этих трёх стран; оно не создаёт права доступа, коридора или перемирия и не связывает союзников или сюзерена."
 eon_mediation_cancelled_desc:0 "Предложение о посредничестве было отозвано до согласия всех участников. Этот первоначальный ответ больше не может разрешить обсуждения. Закройте его, чтобы снять оставшееся резервирование. Уже затраченные усилия не возмещаются."
 eon_mediation_stale_desc:0 "Этот ответ больше не соответствует доступному предложению с его первоначальными участниками, этапом и темой. Он не может открыть мандат или изменить другое посредничество. Закройте старый ответ."
 eon_mediation_accept:0 "Согласиться на эти необязывающие обсуждения"
 eon_mediation_decline:0 "Отклонить или закрыть предложение"
 eon_mediation_ack:0 "Понятно"
 eon_mediation.30.t:0 "Посредник согласился участвовать"
 eon_mediation.30.desc:0 "Посредник согласился на предложенную роль. Указанному противнику было отправлено отдельное приглашение. Первое согласие не открыло мандат, не ввело перемирие и не обязало участников принять конкретные условия."
 eon_mediation.31.t:0 "Посредник отклонил предложение"
 eon_mediation.31.desc:0 "Предложенный посредник отклонил приглашение. Мандат на обсуждения не был открыт. Отказ не приносит выгод или наказаний; усилия инициатора остаются затраченными."
 eon_mediation.32.t:0 "Предложение о посредничестве больше недействительно"
 eon_mediation.32.desc:0 "Предложение не могло продолжиться с первоначальными участниками, темой, этапом согласия или текущими условиями. Этот ответ не разрешил мандат на обсуждения. Войны и соглашения не были изменены."
 eon_mediation.33.t:0 "Отзыв предложения обработан"
 eon_mediation.33.desc:0 "Отзыв был зарегистрирован либо его первоначальный ответ был закрыт. Это предложение больше нельзя согласовать. Оставшийся первоначальный ответ без решения необходимо закрыть, чтобы снять резервирование. Уже затраченные усилия не возмещаются."
 eon_mediation.34.t:0 "Мандат на обсуждения согласован"
 eon_mediation.34.desc:0 "Посредник и указанный противник отдельно согласились на предложенную тему. Для трёх первоначальных участников был открыт 30-дневный необязывающий мандат на обсуждения. Он не создал перемирия, мира, права гуманитарного доступа, передачи территорий или военных гарантий. Обязательные условия требуют отдельного соглашения."
 eon_mediation.35.t:0 "Противник отклонил предложение"
 eon_mediation.35.desc:0 "Указанный противник отклонил обсуждения через посредника. Предшествующего согласия посредника было недостаточно для открытия мандата. Отказ не приносит выгод или наказаний; усилия инициатора остаются затраченными."
 eon_mediation.36.t:0 "Мандат на обсуждения завершён"
 eon_mediation.36.desc:0 "Согласованный мандат на обсуждения завершился либо его условия перестали выполняться. Этот необязывающий канал не создал обязательного урегулирования. Войны и отдельные соглашения действуют по собственным правилам."
 eon_mediation.37.t:0 "Предложение без ответа закрыто"
 eon_mediation.37.desc:0 "Предложение без ответа истекло либо его первоначальный ответ больше нельзя было безопасно сохранить. Две пары ответов, инициатор — посредник и посредник — противник, закрыты для новых предложений о посредничестве в этой кампании. Другие подходящие сочетания остаются доступны. Мандат или урегулирование не возникли; уже затраченные усилия не возмещаются."
 eon_mediation_open_tt:0 "Мы — страна под управлением человека, имеющая текущего противника в войне. Предложенный посредник существует, независим и доступен, не состоит с нами в одной фракции, не воюет на нашей стороне и не воюет против нас. Обе страны свободны от другого посредничества, незакрытого старого ответа между ними и 90-дневного периода ожидания."
 eon_mediation_withdraw_tt:0 "Эта страна участвует в нашем соответствующем черновике, предложении без ответа или действующем мандате. Закрытие черновика или согласованного мандата освобождает связанные записи; отзыв предложения без ответа блокирует согласие до закрытия первоначального ответа. Это не создаёт перемирие и не изменяет договоры."
