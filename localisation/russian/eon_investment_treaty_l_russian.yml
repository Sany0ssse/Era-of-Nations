l_russian:
 eon_investment_treaty_no_pending_tt:0 "Ни у одной из стран нет другого предложения взаимного инвестиционного договора, ожидающего ответа."
 eon_investment_treaty_terms_tt:0 "Это действующие фиксированные условия взаимного инвестиционного договора. Каждая страна получает прежние преимущества для отношений и торговли, одного постоянного инвестиционного партнёра и прежнее изменение влияния. Активные строительные проекты сохраняют собственные согласованные условия."
 eon_investment_treaty_response_valid_tt:0 "Ответ соответствует зарезервированному предложению и его фиксированным условиям. Обе страны продолжают существовать и соответствуют первоначальным требованиям договора; ни одна не отозвала предложение и не установила этот договор другим способом."
 eon_investment_treaty_cancel_tt:0 "Прекратить постоянный инвестиционный договор этой пары и его двусторонние преимущества. Активные строительные проекты продолжаются по собственным соглашениям. Отозванное предложение сохраняет резервирование до обработки первоначального ответа."
