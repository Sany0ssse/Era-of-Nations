l_russian:
 eon_open_economic_consultations:0 "Открыть экономические консультации"
 eon_open_economic_consultations_desc:0 "Подготовить двустороннее обсуждение торговли, электроэнергии или экономической поддержки."
 eon_open_economic_consultations_send_desc:0 "Выберите одну тему для обсуждения с [THIS.GetNameWithFlag]. Открытие и отмена повестки бесплатны. Отправка приглашения стоит 10 политической власти. До открытия 30-дневного канала нужно согласие партнёра. Разговор не подписывает договор, не переводит средства и не меняет действующий контракт."
 eon_consultation_open_ready_tt:0 "Обе страны существуют, не воюют друг с другом и свободны от другой экономической консультации. У пары нет неразрешённого старого ответа и закончилась 90-дневная задержка контактов. Ранг великой державы и одинаковый строй не требуются."
 eon_consultation_agenda_title:0 "Выбрать экономическую повестку"
 eon_consultation_agenda_desc:0 "Подготовить разговор с [From.GetName]. Выберите торговлю, электроэнергию или экономическую поддержку. Отправка стоит §Y10 политической власти§!; партнёру даётся 30 дней на ответ. Черновик можно закрыть бесплатно. Согласованный канал действует 30 дней; любая сторона может его завершить. Конкретному договору или гранту нужны собственные условия, право на действие и отдельное согласие."
 eon_consultation_topic_trade:0 "Обсудить торговлю и коммерческое сотрудничество"
 eon_consultation_topic_energy:0 "Обсудить электроэнергию и действующие контракты"
 eon_consultation_topic_support:0 "Обсудить экономическую помощь и оплату долга"
 eon_consultation_cancel_agenda:0 "Закрыть повестку без отправки"
 eon_consultation_trade_invite_title:0 "Приглашение на торговые консультации"
 eon_consultation_trade_invite_desc:0 "[From.GetName] предлагает обсудить торговлю и коммерческое сотрудничество. Согласие открывает канал на 30 дней, но не подписывает и не отменяет торговый договор. Конкретное предложение проходит обычные дипломатические условия, требует своей оплаты и отдельного согласия. Приглашение можно отклонить без штрафа."
 eon_consultation_energy_invite_title:0 "Приглашение на консультации об электроэнергии"
 eon_consultation_energy_invite_desc:0 "[From.GetName] предлагает обсудить электроэнергию и действующие контракты. Согласие открывает канал на 30 дней. Поставки и платежи продолжаются на прежних условиях. Объём и цену нужно отдельно предложить и согласовать в управлении энергией. Приглашение можно отклонить без штрафа."
 eon_consultation_support_invite_title:0 "Приглашение на консультации о поддержке"
 eon_consultation_support_invite_desc:0 "[From.GetName] предлагает обсудить экономическую помощь или оплату долга. Согласие открывает канал на 30 дней, не обязывая казну любой стороны. Во время разговора правомочное правительство может подготовить отдельный разовый грант через дипломатию. Грант и оплата долга требуют прежних финансовых и национальных условий и согласия получателя."
 eon_consultation_cancelled_invite_desc:0 "Инициатор отозвал приглашение до согласования. Эти консультации не начались. Закройте ответ, чтобы освободить пару. Политические усилия, уже затраченные на подготовку приглашения, не возвращаются."
 eon_consultation_stale_invite_desc:0 "Это приглашение больше не соответствует доступной консультации исходных участников по этой теме. Оно не может открыть канал или повлиять на другой действующий разговор. Закройте этот старый ответ."
 eon_consultation_accept_talks:0 "Согласиться обсудить эту тему"
 eon_consultation_decline_talks:0 "Отклонить или закрыть приглашение"
 eon_withdraw_consultation_request:0 "Отозвать приглашение на консультации"
 eon_withdraw_consultation_request_desc:0 "Отозвать приглашение этой стране, ещё ожидающее ответа."
 eon_withdraw_consultation_request_send_desc:0 "Отозвать приглашение. Получатель должен закрыть исходный ответ, прежде чем любая сторона начнёт другую консультацию. Затраченные 10 политической власти не возвращаются. Действующие соглашения продолжаются."
 eon_consultation_withdraw_tt:0 "Эта страна ожидает ответа на наше совпадающее приглашение. Отзыв предотвращает согласование; исходный ответ ещё нужно закрыть. Усилия на подготовку уже затрачены."
 eon_end_economic_consultations:0 "Завершить экономические консультации"
 eon_end_economic_consultations_desc:0 "Закрыть действующий канал обсуждения с этой страной."
 eon_end_economic_consultations_send_desc:0 "Закрыть канал без дополнительной оплаты. Торговля, энергетические контракты, гранты и долговые предложения — отдельные соглашения со своими правилами. Завершение разговора их не отменяет."
 eon_consultation_end_tt:0 "Обе страны имеют один согласованный канал консультаций. Любое правительство может завершить разговор; действующие контракты остаются отдельными."
 eon_consultation_offer_economic_aid:0 "Подготовить грант после консультаций"
 eon_consultation_offer_economic_aid_desc:0 "Использовать согласованный разговор о поддержке для подготовки отдельного разового гранта."
 eon_consultation_offer_economic_aid_send_desc:0 "Открыть обычный выбор гранта для [THIS.GetNameWithFlag]. Прежние условия влияния, экономики, национальной политики и казны действуют. Подготовка суммы не отправляет денег. Финансирование предложения и его последующее принятие идут через обычную помощь. Разговор сам по себе не разрешает платёж."
 eon_consultation_aid_followup_tt:0 "Совпадающий канал обсуждения поддержки действует, а обычные условия помощи позволяют нам подготовить грант этой стране. Начинается отдельный черновик помощи без исключений из финансирования и согласия получателя."
 eon_consultation_ack:0 "Понятно"
 eon_consultation.20.t:0 "Торговые консультации согласованы"
 eon_consultation.20.desc:0 "Партнёр согласился обсудить торговлю. Открыт двусторонний канал на 30 дней. Для конкретного соглашения используйте обычное торговое предложение; национальные условия, политическая стоимость и отдельное согласие сохраняются. Приглашение не создало и не отменило договор. Откройте §YРешения → Двусторонние консультации§! и выберите строки этого партнёра. Сведения можно повторно открыть кнопкой §YОткрыть панель текущих консультаций§! в его дипломатии."
 eon_consultation.21.t:0 "Консультации об электроэнергии согласованы"
 eon_consultation.21.desc:0 "Партнёр согласился обсудить электроэнергию. Открыт двусторонний канал на 30 дней. Объём и цену предлагайте в управлении энергией; действующую поставку можно пересмотреть через встречное предложение. Поставки и платежи продолжаются до отдельного изменения. Откройте §YРешения → Двусторонние консультации§! и выберите строки этого партнёра. Сведения можно повторно открыть кнопкой §YОткрыть панель текущих консультаций§! в его дипломатии."
 eon_consultation.22.t:0 "Консультации о поддержке согласованы"
 eon_consultation.22.desc:0 "Партнёр согласился обсудить экономическую поддержку. Открыт двусторонний канал на 30 дней. Правомочные правительства могут подготовить отдельный грант через дипломатию; оплата долга имеет собственное предложение. Этот разговор не обещал, не удерживал и не переводил деньги. Откройте §YРешения → Двусторонние консультации§! и выберите строки этого партнёра. Сведения можно повторно открыть кнопкой §YОткрыть панель текущих консультаций§! в его дипломатии."
 eon_consultation.23.t:0 "Приглашение на консультации отклонено"
 eon_consultation.23.desc:0 "Получатель отклонил приглашение. Канал обсуждения и соглашение не созданы. Отказ не даёт преимуществ или штрафов любой стороне. Усилия инициатора на подготовку остаются затраченными."
 eon_consultation.24.t:0 "Приглашение на консультации отозвано"
 eon_consultation.24.desc:0 "Приглашение отозвано до согласия и не может быть принято. Закрытие исходного ответа получателя снимает оставшийся резерв. Соглашение или платёж из приглашения не последовали; усилия на подготовку не возвращаются."
 eon_consultation.25.t:0 "Приглашение больше недействительно"
 eon_consultation.25.desc:0 "Приглашение больше нельзя было согласовать с исходными участниками, темой или текущими условиями. Этот разговор не начался. Договор, деньги и преимущества отказа не применялись."
 eon_consultation.26.t:0 "Консультация без ответа истекла"
 eon_consultation.26.desc:0 "Повестка или приглашение истекли до закрытия исходного ответа. Этот разговор не начался. Пара закрыта для новых приглашений на консультации в этой кампании; другие партнёры доступны. Действующие соглашения продолжаются; затраченные усилия на подготовку не возвращаются."
 eon_consultation.27.t:0 "Экономические консультации завершены"
 eon_consultation.27.desc:0 "Согласованный канал обсуждения завершён. Его тема сама по себе не создавала обязательств. Действующие договоры, энергетические поставки, гранты и долговые предложения продолжаются по собственным правилам."
