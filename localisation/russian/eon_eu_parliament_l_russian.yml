 eon_eu_parliament.1.t:0 "Старое предложение Парламента закрыто"
 eon_eu_parliament.1.d:0 "У сохранённого предложения нет подтверждаемого срока или записи о завершении. Оно закрыто без одобрения Советом и принятия закона. Действующие законы сохраняются. Теперь можно законно внести новое предложение."
 eon_eu_parliament.1.a:0 "Понятно"
