 # Diplo actions
 SEND_AMMO_TITLE: "Отправить Боеприпасы"
 SEND_AMMO_ACTION_DESC: "Мы можем поддерживать другие страны в войне снабжая их боеприпасами."

 Sda_send_ammo_send_desc:    "Мы зарезервируем §Y100 000§! единиц §Yбоеприпасов§! для предложения стране §Y[THIS.GetNameDef]§! на §Y30 дней§!. Поставка требует её согласия, сохранения права на помощь и достаточного места на текущих складах."
 Sda_send_ammo_receive_desc: "[ROOT.GetNameDefCap] предлагает §Y100 000§! единиц §Yбоеприпасов§!. Предложение действует §Y30 дней§!, если его не отзовут. Для всей партии требуется достаточное место на текущих складах и сохранение права на помощь."

 Sda_send_ammo_accept_title: "Ответ на предложение боеприпасов"
 Sda_send_ammo_accept_desc:  "\nОтвет страны §Y[THIS.GetNameDefCap]§! обработан. По действующему предложению с соблюдёнными условиями передаётся зарезервированная партия. Если условия изменились, поставка не происходит, боеприпасы возвращаются нам; отдельное уведомление объясняет результат."

 Sda_send_ammo_reject_title: "Передача Боеприпасов Отклонена"
 Sda_send_ammo_reject_desc:  "\n§Y[THIS.GetNameDefCap]§! отклонила предложение боеприпасов. Партия, ещё зарезервированная для него, остаётся нашей и возвращается на склады по мере освобождения места."

 Sda_send_ammo_tt_has_enough: "Имеет не менее §Y100 000§! единиц боеприпасов"

