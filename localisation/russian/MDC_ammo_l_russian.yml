 Ammo_stats_raw_tt: "$Ammo_header_tt$\n\n$Ammo_current_ammo_tt$\n$Ammo_gain_breakdown_tt$\n$Ammo_capacity_tt$\n\n$Ammo_demand_now_tt$\n$Ammo_demand_max_tt$\n$Ammo_effect_tt$\n\n£click_left §Y ЛКМ§! чтобы приобрести 50000 ед. боеприпасов на рынке за 0.1 §Gмиллиардов§!\n\n£click_right §Y ПКМ§! чтобы обновить информацию\n\nВы можете увеличить потребление боеприпасов, зажав £GFX_key_ctrl + £click_left §Y ЛКМ§! + §YCtrl§!\nВы можете уменьшить потребление боеприпасов, зажав £GFX_key_ctrl + £GFX_click_right §Y ПКМ§! + §YCtrl§!\n\n$Ammo_army_header_tt$\n$Ammo_army_demand_now_tt$\n$Ammo_army_demand_bkdn_tt$\n$Ammo_army_demand_max_tt$\n\n$Ammo_air_header_tt$\n$Ammo_air_demand_now_tt$\n$Ammo_air_demand_max_tt$\n\n$Ammo_navy_header_tt$\n$Ammo_navy_demand_now_tt$\n$Ammo_navy_demand_max_tt$\n\n[Ammo_sl_time_remaining_body]"

 Ammo_desc_tt:     "[Ammo_sl_desc_bypass_tt]"
 Ammo_desc_raw_tt: "§YБоеприпасы§! производятся $arms_factory_plural$. Каждая §Yнеповрежденная $arms_factory_plural$§! вносит вклад в производство §YБоеприпасов§! в размере §G100§!.\n\nКаждая страна имеет лимит максимального запаса §YБоеприпасов§! который может быть увеличен с помощью постройки §Y$supply_node$§! в регионах под контролем. Каждый §Y$supply_node$§! увеличивает максимаьный лимит боеприпасов на §G100000§!\n\n§YБоеприпасы§! используются армией в бою. Атакуя дивизии потребляют больше §YБоеприпасы§!.\n\nВо время войны, §YБоеприпасы§! также расходуются развернутыми авиакрыльями и кораблями вне портов."

