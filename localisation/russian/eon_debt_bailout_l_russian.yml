l_russian:
 eon_debt_bailout_request_title:0 "Запрос прямого погашения долга"
 eon_debt_bailout_request_desc:0 "[FROM.GetName] запрашивает прямое погашение долга. Зафиксированный максимум: [?eon_debt_bailout_amount|2] млрд. Ваша казна платит ровно столько, на сколько уменьшается оставшийся долг получателя, в пределах этого максимума. Нужны достаточные средства, мир, подходящий государственный статус и неотозванный запрос в течение 30 дней. Автоматического политического влияния нет."
 eon_debt_bailout_request_desc_overlord:0 "[FROM.GetName] просит своего сюзерена погасить долг. Зафиксированный максимум: [?eon_debt_bailout_amount|2] млрд. Вы платите ровно сумму уменьшения оставшегося долга. Если платёж состоится и получатель останется вашим субъектом, его доля автономии однократно уменьшится на 0,35. Условие показано до отправки запроса. Нужны полная сумма, мир и неотозванный запрос в течение 30 дней."
 eon_debt_bailout_accept:0 "Погасить оставшийся долг в пределах согласованного максимума"
 eon_debt_bailout_refuse:0 "Отказать или закрыть этот запрос"
 eon_debt_bailout_ack:0 "Понятно"
 eon_debt_bailout_result_title:0 "Запрос погашения долга завершён"
 eon_debt_bailout_paid_desc:0 "Донор погасил часть нашего долга. Расход его казны равен уменьшению нашего долга. Это уведомление не выполняет повторный платёж."
 eon_debt_bailout_refused_desc:0 "Донор отказал в помощи. Деньги не списаны, долг не уменьшен."
 eon_debt_bailout_cancelled_desc:0 "Запрос закрыт без платежа: он отозван, истёк либо больше не соответствует условиям."
 eon_debt_bailout_legacy_title:0 "Старый запрос помощи нельзя сверить"
 eon_debt_bailout_legacy_desc:0 "У старого запроса нет надёжного неизменного записи донора и стадии платежа. Он закрывается без нового перевода. Текущие деньги и долг сохраняются. Ранее списанные средства автоматически восстановить нельзя. Запись МВФ не затрагивается; новый запрос использует действующие условия."
 eon_debt_bailout_legacy_unresolved_tt:0 "Старый запрос без надёжной записи: без платежа, выдуманного возврата или уменьшения долга. Текущие деньги, долг и общая запись МВФ сохраняются."
 eon_debt_bailout_request_terms_tt:0 "Максимум фиксируется при отправке: 20% / 15% / 10% / 50% текущего долга для первого инвестора / второго инвестора / соседа / сюзерена. Донор платит 1:1 за фактическое уменьшение долга. Автоматического политического влияния нет. Один запрос на участника; деньги не резервируются. Отозванный или просроченный запрос занимает канал до закрытия старого окна ответа донором."
 eon_debt_bailout_overlord_terms_tt:0 "Условие помощи сюзерена: после реального платежа наша доля автономии однократно уменьшается на 0,35. На момент оплаты мы должны оставаться субъектом того же сюзерена."
 eon_debt_bailout_withdraw_request:0 "Отозвать ожидающий запрос помощи с долгом"
 eon_debt_bailout_withdraw_request_desc:0 "Отменить разрешение на платёж. Канал остаётся занят до закрытия существующего окна ответа донором. Возврата денег нет: средства заранее не списывались."
