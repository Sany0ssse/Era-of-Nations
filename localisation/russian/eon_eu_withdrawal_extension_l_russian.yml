l_russian:
 eon_eu_extension_propose:0 "Предложить согласованное продление срока выхода из ЕС"
 eon_eu_extension_propose_desc:0 "Запросить у остальных допущенных правительств продление на 365 дней. Остаток текущего срока сохраняется. Проект рассматривается 30 дней; в очереди может ждать одно согласованное продление. Эти сроки являются игровой настройкой."
 eon_eu_extension_propose_requirements:0 "Нужны действительное уведомление о выходе и ещё не истёкший срок. Не должно быть другого проекта, продления в очереди или 90-дневного перерыва. Все допущенные остальные правительства должны дать явный ответ, ни одно не должно отказать; затем нужно наше отдельное принятие. Представленное воздержание не блокирует единогласие; отсутствие ответа блокирует эту игровую процедуру. Голосование ЕП для продления не требуется."
 eon_eu_extension_approve:0 "Согласиться продлить срок выхода [From.GetName]"
 eon_eu_extension_approve_desc:0 "Наше правительство согласится с текущим проектом продления на 365 дней. Прежний отказ по этому проекту заменяется. Выходящее государство ещё должно отдельно принять согласованный проект."
 eon_eu_extension_approve_requirements:0 "Текущий проект: за [?FROM.eon_eu_extension_yes_count|0], против [?FROM.eon_eu_extension_no_count|0], явно воздержались [?FROM.eon_eu_extension_abstain_count|0]. Получены ответы: [?FROM.eon_eu_extension_answer_count|0] / [?FROM.eon_eu_extension_electorate_total|0]. Все допущенные остальные правительства должны ответить, ни одно не должно отказать; представленное воздержание не блокирует единогласие."
 eon_eu_extension_reject:0 "Отклонить продление срока выхода [From.GetName]"
 eon_eu_extension_reject_desc:0 "Заменить наше согласие отказом по текущему проекту. Отказ препятствует единогласию, но сам по себе не завершает членство государства в ЕС."
 eon_eu_extension_reject_requirements:0 "Наше правительство должно иметь право отвечать, а текущий проект ещё должен действовать. Уже поданный отказ нельзя продублировать."
 eon_eu_extension_abstain:0 "Воздержаться по продлению срока [From.GetName]"
 eon_eu_extension_abstain_desc:0 "Подать явное воздержание представленного правительства по текущему проекту, заменив прежнее согласие или отказ. Это не блокирует единогласное решение Европейского совета. Это ответ, отличный от молчания или отсутствия. Ответы других правительств сохраняются."
 eon_eu_extension_abstain_requirements:0 "Нужно иметь право отвечать по текущему проекту и ещё не иметь записанного воздержания. Наш явный ответ снимает блокировку из-за молчания; отказ любого другого правительства по-прежнему препятствует решению."
 eon_eu_extension_accept_final:0 "Принять единогласно согласованное продление"
 eon_eu_extension_accept_final_desc:0 "Дать наше отдельное окончательное согласие. Одно продление на 365 дней будет ждать в очереди и начнётся только после фактического окончания текущего срока. Это продолжение членства, а не договор о выходе."
 eon_eu_extension_accept_final_requirements:0 "Текущий проект: за [?eon_eu_extension_yes_count|0], против [?eon_eu_extension_no_count|0], воздержались [?eon_eu_extension_abstain_count|0]. Получены ответы: [?eon_eu_extension_answer_count|0] / [?eon_eu_extension_electorate_total|0]. Нужны хотя бы одно другое допущенное правительство, все обязательные явные ответы и отсутствие отказов. При принятии повторно проверяются членство, право голоса и текущий проект. Остаток текущего срока не перезапускается."
 eon_eu_extension_cancel_proposal:0 "Отозвать наш проект продления"
 eon_eu_extension_cancel_proposal_desc:0 "Закрыть только этот проект и очистить его ответы. Новая подача доступна через 90 дней. Уведомление о выходе и текущий срок сохраняются; отзыв самого уведомления является отдельным односторонним решением."
 eon_eu_extension_cancel_proposal_requirements:0 "Отзывается только наш текущий открытый проект продления. Согласие других правительств на отмену проекта не требуется."
 eon_eu_withdrawal_extension.ok:0 "Понятно"
 eon_eu_withdrawal_extension.1.t:0 "Запрошено продление срока выхода"
 eon_eu_withdrawal_extension.1.d:0 "[From.GetName] запрашивает продление на 365 дней. Откройте «Решения» → «Членство и договоры ЕС», чтобы согласиться, отказать или явно воздержаться. Проект действует 30 дней. Все допущенные остальные правительства должны ответить, ни одно не должно отказать; представленное воздержание не блокирует единогласие. Затем выходящее государство должно отдельно принять проект. Это окно не подаёт голос; используйте текущие адресные решения."
 eon_eu_withdrawal_extension.2.t:0 "Продление согласовано и ждёт в очереди"
 eon_eu_withdrawal_extension.2.d:0 "Все обязательные правительства ответили без отказов, и мы приняли проект. Остаток текущего срока не изменился. Согласованные 365 дней начнутся только при его фактическом окончании. До действительного выхода мы остаёмся участником. Второе продление нельзя запасать, пока это ещё ждёт в очереди."
 eon_eu_withdrawal_extension.3.t:0 "Начался согласованный дополнительный срок"
 eon_eu_withdrawal_extension.3.d:0 "Прежний срок закончился. Согласованное продление использовано ровно один раз: начались новые 365 дней продолжающегося членства. Следующее продление требует нового проекта, единогласия текущих допущенных правительств и нашего окончательного согласия. Срок в 365 дней — игровая настройка, а не установленная законом длительность."
