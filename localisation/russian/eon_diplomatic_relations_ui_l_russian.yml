l_russian:
 EON_DIPLOMATIC_RELATIONS_UI_STATUS_TITLE:0 "Дипломатическая запись"
 EON_DIPLOMATIC_RELATIONS_UI_STATUS_ACTION_DESC:0 "Открыть дипломатическую запись для этой страны: текущие отношения, миссии, назначения, предложения и обязанности выезда. Полная запись показана в окне подтверждения."
 eon_diplomatic_relations_ui_status_send_desc:0 "Отношения с [THIS.GetName]: [eon_diplomatic_relations_ui_relation_label]. Наша миссия: [eon_diplomatic_relations_ui_mission_label]. Действующее назначение № [?ROOT.eon_diplomatic_relations_active_head@THIS|0]; согласованное № [?ROOT.eon_diplomatic_relations_approved_head@THIS|0]. Наше предложение: [eon_diplomatic_relations_ui_outgoing_label], назначение № [?ROOT.eon_diplomatic_relations_out_head@THIS|0]. Входящее предложение: [eon_diplomatic_relations_ui_incoming_label], назначение № [?ROOT.eon_diplomatic_relations_in_head@THIS|0]. Наш выезд: [eon_diplomatic_relations_ui_departure_label]. Закрытые помещения и архивы: [eon_diplomatic_relations_ui_protection_label]. Номера обозначают дипломатические назначения без вымышленного имени человека. Незавершённые обязанности выезда: [?ROOT.eon_diplomatic_relations_departure_count@THIS|0]. Текущая запись выезда № [?ROOT.eon_diplomatic_relations_current_departure@THIS|0], назначение № [?ROOT.eon_diplomatic_relations_current_departure_head@THIS|0] (0 = другой персонал миссии)."
 EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_TITLE:0 "Установить / восстановить отношения"
 EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_ACTION_DESC:0 "Запросить взаимное подтверждение прежних отношений либо восстановление после разрыва. Срок ответа — 30 дней. Исторические претензии сохраняются. Согласие само по себе не открывает посольство, не признаёт правительство, не отменяет санкции и не создаёт союз."
 eon_diplomatic_relations_ui_propose_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_MISSION_CHARGE_TITLE:0 "Открыть миссию поверенного"
 EON_DIPLOMATIC_RELATIONS_UI_MISSION_CHARGE_ACTION_DESC:0 "Согласовать открытие нашей миссии уровня поверенного в делах или изменение её формального класса. При согласии принимающей страны мы один раз платим 10 политических очков и 0.01 млрд долларов из казны. Затем содержание этой миссии стоит 0.001 млрд долларов из казны ежемесячно. Главу нужно назначить отдельно. Миссия партнёра у нас — отдельное обязательство."
 eon_diplomatic_relations_ui_mission_charge_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_MISSION_CHARGE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_MISSION_AMBASSADOR_TITLE:0 "Открыть / изменить посольство"
 EON_DIPLOMATIC_RELATIONS_UI_MISSION_AMBASSADOR_ACTION_DESC:0 "Согласовать открытие или повышение нашей миссии до посольского класса. При согласии принимающей страны мы один раз платим 10 политических очков и 0.02 млрд долларов из казны. Затем содержание этой миссии стоит 0.002 млрд долларов из казны ежемесячно. Смена класса требует нового назначения. Обратная миссия независима; класс не добавляет дипломатических прав."
 eon_diplomatic_relations_ui_mission_ambassador_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_MISSION_AMBASSADOR_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_HEAD_TITLE:0 "Предложить главу миссии"
 EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_HEAD_ACTION_DESC:0 "Предложить новую нумерованную запись назначения главы и запросить агреман. Партнёр может согласиться или отказать в течение 30 дней. Согласованному главе ещё нужно уведомление о прибытии и вручение копии грамот. Прежний глава продолжает работу, пока рассматривается замена."
 eon_diplomatic_relations_ui_propose_head_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_PROPOSE_HEAD_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_RELATIONS_TITLE:0 "Согласовать отношения"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_RELATIONS_ACTION_DESC:0 "Подтвердить или восстановить отношения, сохранив исторические претензии. Проверьте текущую дипломатическую запись перед решением."
 eon_diplomatic_relations_ui_accept_relations_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_RELATIONS_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_CHARGE_TITLE:0 "Согласовать миссию поверенного"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_CHARGE_ACTION_DESC:0 "Согласовать миссию партнёра уровня поверенного. Отправитель платит 10 политических очков и 0.01 млрд долларов, затем 0.001 млрд долларов ежемесячно. Проверьте текущую дипломатическую запись перед решением."
 eon_diplomatic_relations_ui_accept_charge_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_CHARGE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_AMBASSADOR_TITLE:0 "Согласовать посольство"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_AMBASSADOR_ACTION_DESC:0 "Согласовать посольскую миссию партнёра. Отправитель платит 10 политических очков и 0.02 млрд долларов, затем 0.002 млрд долларов ежемесячно. Проверьте текущую дипломатическую запись перед решением."
 eon_diplomatic_relations_ui_accept_ambassador_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_AMBASSADOR_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_HEAD_TITLE:0 "Согласовать главу миссии"
 EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_HEAD_ACTION_DESC:0 "Дать агреман на входящее назначение № [?ROOT.eon_diplomatic_relations_in_head@THIS|0]. Уведомление о прибытии и копия грамот остаются отдельным этапом. Проверьте текущую дипломатическую запись перед решением."
 eon_diplomatic_relations_ui_accept_head_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_ACCEPT_HEAD_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_DECLINE_TITLE:0 "Отклонить предложение"
 EON_DIPLOMATIC_RELATIONS_UI_DECLINE_ACTION_DESC:0 "Закрыть только этот входящий запрос без списания ресурсов и отмены других соглашений. Причина отказа в агремане необязательна. После закрытия можно обратиться снова; бессрочной блокировки пары нет."
 eon_diplomatic_relations_ui_decline_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_DECLINE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_WITHDRAW_TITLE:0 "Отозвать предложение"
 EON_DIPLOMATIC_RELATIONS_UI_WITHDRAW_ACTION_DESC:0 "Бесплатно закрыть только наш исходящий запрос и соответствующую копию. Действующие миссии и другие контракты продолжаются. Новый запрос можно подать снова."
 eon_diplomatic_relations_ui_withdraw_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_WITHDRAW_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_CREDENTIALS_TITLE:0 "Уведомить о прибытии главы"
 EON_DIPLOMATIC_RELATIONS_UI_CREDENTIALS_ACTION_DESC:0 "Уведомить принимающий МИД о прибытии согласованного главы и передать копию грамот. Начинаются его полномочия. Выезд прежнего главы остаётся отдельной обязанностью."
 eon_diplomatic_relations_ui_credentials_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_CREDENTIALS_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_RECALL_TITLE:0 "Отозвать нашего главу миссии"
 EON_DIPLOMATIC_RELATIONS_UI_RECALL_ACTION_DESC:0 "Отозвать нынешнего главу и уведомить о временном поверенном. Согласованный класс миссии и отношения продолжаются. Организуйте выезд отозванного главы и затем предложите замену."
 eon_diplomatic_relations_ui_recall_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_RECALL_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_TITLE:0 "Объявить главу миссии persona non grata"
 EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_ACTION_DESC:0 "Объявить действующее назначение № [?THIS.eon_diplomatic_relations_active_head@ROOT|0] прибывшей миссии нежелательным. Объяснение необязательно. Отправитель прекращает полномочия этого главы и организует выезд. Согласованная замена либо другое рассматриваемое назначение остаётся отдельным вопросом."
 eon_diplomatic_relations_ui_persona_non_grata_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_APPROVED_TITLE:0 "Отозвать агреман"
 EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_APPROVED_ACTION_DESC:0 "Отозвать агреман на согласованное назначение № [?THIS.eon_diplomatic_relations_approved_head@ROOT|0] до начала полномочий. Объяснение необязательно. Прежний глава продолжает работу, если он есть; можно предложить новое назначение. Это согласование не означало прибытия, поэтому запись о выезде не создаётся."
 eon_diplomatic_relations_ui_persona_non_grata_approved_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_PERSONA_NON_GRATA_APPROVED_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_CLOSE_TITLE:0 "Закрыть наше представительство"
 EON_DIPLOMATIC_RELATIONS_UI_CLOSE_ACTION_DESC:0 "Закрыть нашу миссию и её запрос назначения или класса. Принимающая страна должна защитить закрытые помещения и архивы и обеспечить условия выезда персонала. Отношения и обратная миссия продолжаются отдельно."
 eon_diplomatic_relations_ui_close_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_CLOSE_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_CLOSE_HOST_TITLE:0 "Закрыть представительство партнёра"
 EON_DIPLOMATIC_RELATIONS_UI_CLOSE_HOST_ACTION_DESC:0 "Прекратить согласие на прибывшую миссию. Её помещения и архивы остаются под защитой, а условия выезда нужно подтвердить. Наша обратная миссия, отношения и другие соглашения учитываются отдельно."
 eon_diplomatic_relations_ui_close_host_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_CLOSE_HOST_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_BREAK_TITLE:0 "Разорвать дипломатические отношения"
 EON_DIPLOMATIC_RELATIONS_UI_BREAK_ACTION_DESC:0 "Записать двусторонний разрыв, закрыть обе направленные миссии и их запросы, сохранить исторические претензии и обязанности защиты/выезда. Торговля, инвестиции, энергия, помощь, союзы, санкции и отношения с третьими странами автоматически не отменяются. Консульские отношения не считаются автоматически прекращёнными."
 eon_diplomatic_relations_ui_break_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_BREAK_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_EXIT_FACILITIES_TITLE:0 "Подтвердить условия выезда"
 EON_DIPLOMATIC_RELATIONS_UI_EXIT_FACILITIES_ACTION_DESC:0 "Подтвердить заявление принимающей страны об обеспечении условий выезда. Выезд остаётся незавершённым до сообщения отправителя. Текущая запись выезда отправителя № [?THIS.eon_diplomatic_relations_current_departure@ROOT|0], назначение № [?THIS.eon_diplomatic_relations_current_departure_head@ROOT|0] (0 = другой персонал миссии). Подтверждение относится только к этой записи."
 eon_diplomatic_relations_ui_exit_facilities_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_EXIT_FACILITIES_ACTION_DESC$"
 EON_DIPLOMATIC_RELATIONS_UI_REPORT_DEPARTURE_TITLE:0 "Сообщить о выезде персонала"
 EON_DIPLOMATIC_RELATIONS_UI_REPORT_DEPARTURE_ACTION_DESC:0 "После подтверждения принимающей страны сообщить о выезде нашего персонала. Закрытые помещения и архивы остаются под защитой. Сообщение закрывает только текущую запись выезда № [?ROOT.eon_diplomatic_relations_current_departure@THIS|0]; последующие обязанности остаются незавершёнными."
 eon_diplomatic_relations_ui_report_departure_send_desc:0 "$EON_DIPLOMATIC_RELATIONS_UI_REPORT_DEPARTURE_ACTION_DESC$"
 eon_diplomatic_relations_ui_status_ready_tt:0 "Выбранная страна существует; с ней есть дипломатическая запись."
 eon_diplomatic_relations_ui_propose_ready_tt:0 "Обе страны существуют и не воюют друг с другом. Национальная политика допускает отношения; они ещё не подтверждены, и в обоих направлениях нет ожидающих предложений."
 eon_diplomatic_relations_ui_mission_charge_ready_tt:0 "Отношения допускают миссию; между нами нет войны. Нет ожидающего исходящего запроса в этом направлении; наша миссия ещё не имеет класса поверенного. Сейчас и при согласии нужны 10 политических очков и 0.01 млрд долларов; списание происходит только при согласии."
 eon_diplomatic_relations_ui_mission_ambassador_ready_tt:0 "Отношения допускают миссию; между нами нет войны. Нет ожидающего исходящего запроса в этом направлении; наша миссия ещё не имеет посольского класса. Сейчас и при согласии нужны 10 политических очков и 0.02 млрд долларов; списание происходит только при согласии."
 eon_diplomatic_relations_ui_propose_head_ready_tt:0 "Отношения допускают миссию; между нами нет войны. Наша миссия открыта, в этом направлении нет ожидающего исходящего запроса, и нет согласованного кандидата, ожидающего начала полномочий."
 eon_diplomatic_relations_ui_accept_relations_ready_tt:0 "Есть согласованное между обеими записями предложение установить или восстановить отношения; 30-дневный срок ответа ещё действует. Обе страны существуют и не воюют друг с другом; национальная политика допускает отношения, и они ещё не подтверждены."
 eon_diplomatic_relations_ui_accept_charge_ready_tt:0 "Есть совпадающее в обеих записях предложение миссии поверенного; 30-дневный срок ответа ещё действует. Отношения допускают миссию, и между нами нет войны. Отправителю всё ещё нужны 10 политических очков и 0.01 млрд долларов; его миссия ещё не имеет этого класса."
 eon_diplomatic_relations_ui_accept_ambassador_ready_tt:0 "Есть совпадающее в обеих записях предложение посольской миссии; 30-дневный срок ответа ещё действует. Отношения допускают миссию, и между нами нет войны. Отправителю всё ещё нужны 10 политических очков и 0.02 млрд долларов; его миссия ещё не имеет этого класса."
 eon_diplomatic_relations_ui_accept_head_ready_tt:0 "Есть совпадающее в обеих записях предложение назначения; 30-дневный срок ответа ещё действует. Отношения допускают миссию, и между нами нет войны. У отправителя есть миссия предложенного класса; другой кандидат ещё не согласован."
 eon_diplomatic_relations_ui_decline_ready_tt:0 "Есть ожидающий входящий запрос; его тип, класс миссии и назначение совпадают с текущим предложением отправителя."
 eon_diplomatic_relations_ui_withdraw_ready_tt:0 "Наше исходящее предложение этой стране ещё ожидает ответа."
 eon_diplomatic_relations_ui_credentials_ready_tt:0 "Отношения допускают нашу открытую миссию; между нами нет войны. Обе страны всё ещё учитывают одно согласованное назначение и класс миссии; агреман принимающей страны действует."
 eon_diplomatic_relations_ui_recall_ready_tt:0 "Обе страны существуют; у нашей открытой миссии есть действующий глава."
 eon_diplomatic_relations_ui_persona_non_grata_ready_tt:0 "Обе страны существуют; у открытой миссии партнёра в нашей стране есть действующий глава."
 eon_diplomatic_relations_ui_persona_non_grata_approved_ready_tt:0 "Обе страны существуют. У партнёра есть открытая миссия; её согласованное назначение и класс всё ещё совпадают с нашей записью агремана."
 eon_diplomatic_relations_ui_close_ready_tt:0 "Обе страны существуют; наша миссия в выбранной стране открыта."
 eon_diplomatic_relations_ui_close_host_ready_tt:0 "Обе страны существуют; миссия выбранной страны в нашей стране открыта."
 eon_diplomatic_relations_ui_break_ready_tt:0 "Обе страны существуют. Разрыв отношений ещё не записан; отношения подтверждены либо историческая дипломатическая запись допускает разрыв."
 eon_diplomatic_relations_ui_exit_facilities_ready_tt:0 "Обе страны существуют. У партнёра остаются обязанности выезда; условия для его текущей записи ещё не подтверждены. Подтверждение условий само по себе не завершает выезд."
 eon_diplomatic_relations_ui_report_departure_ready_tt:0 "Обе страны существуют. Наш текущий выезд ещё не завершён; принимающая страна подтвердила условия именно для этой записи выезда."
