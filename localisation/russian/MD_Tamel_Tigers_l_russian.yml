 news.92.t: "Гражданская война в Шри-Ланке закончилась"
 news.92.d: "Правительство Шри-Ланки объявило о полной победе над Тиграми освобождения Тамил-Илама. В ходе заключительной серии наступательных операций на северо-востоке страны правительственные войска захватили последние опорные пункты Тигров. В последние дни войны оставшиеся тамильские боевики были окружены в лагунах и джунглях Муллайтиву. Все попытки бежать по морю пресекались. Сообщается, что руководство Тигров, которое долгое время считалось неприкосновенным, было уничтожено в последние часы конфликта. Выступая в парламенте, президент [SRI.GetName] заявил, что страна освободилась от терроризма. На данный момент флаг Шри-Ланки беспрепятственно развевается по всему острову."
 news.92.a: "Мир… за который была заплачена цена."

 news.93.t: "Тамильские тигры Освободили Илам"
 news.93.d: "То, что когда-то было войной на истощение, завершилось. Тигры освобождения Тамил-Илама одержали победу. В последние дни конфликта последние бастионы шри-ланкийской армии на территории Тамил-Илама пали под непрекращающимися атаками. Линии снабжения были разрушены, взлетно-посадочные полосы сожжены, а некогда грозная армия оказалась окружена и брошена на произвол судьбы. Тигры Тамил-Илама вышли победителями из джунглей — не как повстанцы, а как лидеры. Мечта о Тамил-Иламе, написанная кровью и жертвами, наконец сбылась."
 news.93.a: "Интересно."