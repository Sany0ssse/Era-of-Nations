l_russian:
 # Focuses
 GRL_long_journey_of_nuuka: "Долгий путь Нуука"
 GRL_long_journey_of_nuuka_desc: "Веками Нуук был колониальным форпостом - местом, где правили датские губернаторы, а охотники-инуиты торговали. Но город изменился. Старые здания всё ещё стоят, но в парламенте звучат новые голоса. Это наш долгий путь: от колонии к народу, имеющему право голоса в своём будущем. Каждый шаг к самоуправлению начинается здесь."
 GRL_colonys_legacy: "Наследие колонии"
 GRL_colonys_legacy_desc: "Дания правила Гренландией более 200 лет. Они оставили после себя дороги, школы и больницы - но также травмы, неравенство и народ, которому внушали, что его собственная культура отсталая. Мы не можем изменить прошлое. Но мы можем понять его. Только встретившись лицом к лицу с наследием колониализма, мы сможем действительно двигаться вперёд как нация."
 GRL_looking_back: "Оглядываясь назад"
 GRL_looking_back_desc: "История - это не далёкое эхо, она живёт в наших семьях, нашем языке и наших шрамах. Официальная комиссия по изучению колониальной эпохи не вернёт утраченное, но даст нам правду. А правда - первый шаг к исцелению. Весь мир смотрит на нас. Давайте покажем им, через что мы прошли."
 GRL_reconciliation_commission: "Комиссия по примирению"
 GRL_reconciliation_commission_desc: "Данию и Гренландию связывает история, которую невозможно стереть. Но история не обязательно должна быть тюрьмой. Совместная комиссия по примирению откроет диалог между Копенгагеном и Нууком, признавая прошлые ошибки и выстраивая основу для взаимного уважения. Речь идёт не о вине, а об ответственности."
 GRL_greenlandic_in_schools: "Гренландский язык в школах"
 GRL_greenlandic_in_schools_desc: "Поколениями гренландских детей обучали на датском языке. Их родной язык был оттеснён на обочину, на нём говорили только дома. Хватит. Отныне калааллисут станет языком обучения в наших школах. Наши дети будут учить азбуку на языке своих предков."
 GRL_nuuk_national_museum: "Национальный музей Нуука"
 GRL_nuuk_national_museum_desc: "Нация без памяти - нация без души. Национальный музей Нуука будет хранить артефакты нашего прошлого - каяки, амулеты, орудия наших предков. Но что важнее, он расскажет нашу историю нашими словами. Пусть мир придёт и увидит, кто мы на самом деле."
 GRL_kalaallit_day: "День калааллита"
 GRL_kalaallit_day_desc: "Один день в году мы вспоминаем. День калааллита - это не просто праздник, это декларация. Декларация того, что мы всё ещё здесь, что наша культура выжила и что наше будущее мы определяем сами. Школы закроются. Флаги поднимутся. А дети выучат песни, которые пели их прадеды."
 GRL_ice_infrastructure: "Инфраструктура льда"
 GRL_ice_infrastructure_desc: "Строительство в Гренландии - это не то же самое, что строительство где-либо ещё. Вечная мерзлота сдвигается, морской лёд движется, а зимнее солнце никогда не встаёт. Наши дороги, аэропорты и порты должны быть спроектированы для этой земли, а не импортированы из умеренной Европы. Мы будем инвестировать в инфраструктуру, которая уважает лёд и служит нашему народу."
 GRL_satellite_internet_connection: "Спутниковый интернет"
 GRL_satellite_internet_connection_desc: "В XXI веке доступ в интернет - это право, а не роскошь. Но огромные расстояния и суровый ландшафт Гренландии делают оптоволоконные кабели непрактичными. Спутниковый интернет - это наш шлюз в мир: для образования, для бизнеса и для простого достоинства - иметь возможность называть себя подключёнными. Сигнал приходит с неба, но будущее принадлежит нам."
 GRL_kalaallit_nunaata_radioa: "Kalaallit Nunaata Radioa"
 GRL_kalaallit_nunaata_radioa_desc: "Десятилетиями KNR был единственным голосом, который достигал каждого уголка Гренландии - от южных овцеводческих ферм до северных охотничьих угодий. Но он был недофинансирован и недооценён. Мы модернизируем нашу национальную вещательную компанию, расширим её охват и обеспечим, чтобы каждый гренландец, где бы он ни жил, слышал новости на родном языке."
 GRL_kangerkussuaq_airport: "Аэропорт Кангерлуссуак"
 GRL_kangerkussuaq_airport_desc: "Кангерлуссуак - международные ворота Гренландии, взлётно-посадочная полоса, вырубленная в тундре, которая связывает нас с Копенгагеном и миром. Но он стареет, и его пропускная способность ограничена. Расширение этого аэропорта привлечёт больше туристов, больше торговли и больше возможностей. Мир хочет увидеть Арктику. Давайте предоставим им подобающий вход."
 GRL_port_of_nuuka: "Порт Нуука"
 GRL_port_of_nuuka_desc: "Гавань Нуука - это сердце нашей экономики. Рыболовные суда, грузовые корабли и случайные круизные лайнеры - все зависят от его причалов. Но порт устарел, а лёд становится непредсказуемым. Новый современный порт обеспечит наши линии снабжения, увеличит экспорт и сделает Нуук истинным арктическим хабом. Море всегда кормило нас. Теперь оно будет и связывать нас."
 GRL_ice_navigation: "Ледовая навигация"
 GRL_ice_navigation_desc: "Море - наше шоссе, но лёд - наше препятствие. Навигация в гренландских водах требует мастерства, опыта и технологий. Инвестируя в поддержку ледоколов, современные гидролокаторы и обучение местных капитанов, мы сделаем наши воды безопаснее и надёжнее. Лёд больше не будет барьером - он станет путём."
 GRL_the_cod_economy: "Экономика трески"
 GRL_the_cod_economy_desc: "Треска когда-то была основой экономики Гренландии, пока запасы не рухнули в 1990-х. Но рыба возвращается, а вместе с ней и надежда. Мы восстановим наш тресковый промысел на основе устойчивых квот, современных перерабатывающих заводов и новых экспортных маршрутов. Тресковая экономика не повторит ошибок прошлого. Она станет умнее, экологичнее и по-настоящему гренландской."
 GRL_2001_quota_review: "Пересмотр квот 2001 года"
 GRL_2001_quota_review_desc: "Каждый год рыболовные квоты становятся полем битвы. Рыбаки хотят большего. Учёные предупреждают о крахе. А Копенгаген держит последнее перо. Пересмотр 2001 года - это наш шанс потребовать большего голоса в наших собственных водах. Мы будем бороться за квоты, которые служат интересам Гренландии, а не датских бюрократов. Рыба принадлежит нам."
 GRL_shrimp_fever: "Креветочная лихорадка"
 GRL_shrimp_fever_desc: "Креветки спасли экономику Гренландии, когда треска исчезла. Холодноводные креветки изобильны, вкусны и пользуются большим спросом по всей Европе и Азии. Мы расширим наш креветочный флот, построим новые морозильные заводы и будем продавать наш улов как самых чистых и свежих креветок в Северной Атлантике. Розовое золото снова потечёт."
 GRL_fish_auction_in_sissimouth: "Рыбный аукцион в Сисимиуте"
 GRL_fish_auction_in_sissimouth_desc: "Сисимиут - рыбная столица Гренландии, но его рыбный аукцион всё ещё остаётся мелким местным делом. Превратив его в современную прозрачную торговую площадку, мы сможем привлечь покупателей из Исландии, Норвегии и других стран. Аукцион установит справедливые цены, сократит отходы и даст нашим рыбакам доход, которого они заслуживают. Пусть торги начнутся."
 GRL_modernization_of_trawiers: "Модернизация траулеров"
 GRL_modernization_of_trawiers_desc: "Наши траулеры стары - многие построены в 1980-х. Они неэффективны, ненадёжны и вредят окружающей среде. Программа модернизации флота принесёт новые суда с лучшими двигателями, меньшим углеродным следом и передовыми технологиями поиска рыбы. Современные траулеры означают больше рыбы в трюмах и меньше сожжённого топлива. Это хорошо и для бизнеса, и для планеты."
 GRL_combating_foreign_poaching: "Борьба с иностранным браконьерством"
 GRL_combating_foreign_poaching_desc: "Иностранные траулеры проникают в наши воды ночью, воруют нашу рыбу и игнорируют наши законы. Наша береговая охрана слишком мала, чтобы остановить их всех. Мы потребуем от Дании больше патрульных судов, обучим свои собственные инспекционные группы и будем сотрудничать с международными партнёрами, чтобы отслеживать и штрафовать браконьеров. Наша рыба - не их добыча."
 GRL_small_nation_diplomacy: "Дипломатия малой нации"
 GRL_small_nation_diplomacy_desc: "Гренландия не сверхдержава. У нас никогда не будет авианосцев или атомных подводных лодок. Но у нас есть кое-что другое: моральный авторитет, арктическая экспертиза и способность говорить честно. Дипломатия малой нации означает создание альянсов, поиск точек соприкосновения и возможность быть услышанными в мире гигантов. Мы малы, но мы не молчим."
 GRL_representative_office_in_brussels: "Представительство в Брюсселе"
 GRL_representative_office_in_brussels_desc: "Брюссель - сердце Европы. Решения, принятые там, влияют на наши права на рыболовство, наши торговые соглашения и наши экологические стандарты. Постоянное представительство Гренландии в Брюсселе даст нам место за столом переговоров - не просто как датской зависимости, а как арктической нации с особыми интересами. Пусть бюрократы услышат людей, которые действительно живут на холоде."
 GRL_northern_calibration: "Северная калибровка"
 GRL_northern_calibration_desc: "Скандинавские страны - Норвегия, Швеция, Финляндия, Исландия - наши естественные партнёры. Нас объединяет история, климат и ценности. Согласовывая нашу политику с их политикой в вопросах Арктики, защиты окружающей среды и прав коренных народов, мы можем усилить наше влияние. Речь идёт не о следовании, а о калибровке нашего компаса на истинный север."
 GRL_the_queens_visit: "Визит королевы"
 GRL_the_queens_visit_desc: "Королева Дании Маргрете II объявила о государственном визите в Гренландию. В прошлый раз, когда приезжал монарх, это было колониальное зрелище. На этот раз всё будет иначе. Мы встретим её с достоинством, но также и с чёткими требованиями большей автономии. Корона увидит, что Гренландия больше не колония. Она партнёр."
 GRL_artic_council_2002: "Арктический совет 2002"
 GRL_artic_council_2002_desc: "Арктический совет - важнейший форум циркумполярного сотрудничества. Но у Гренландии никогда не было независимого места - мы говорим через Данию. В 2002 году мы добьёмся статуса наблюдателя, а затем и полноправного членства. Арктика принадлежит арктическим народам. Мы не будем гостями в собственном доме."
 GRL_pacific_view: "Тихоокеанский взгляд"
 GRL_pacific_view_desc: "Будущее арктической экономики лежит не только в Европе, но и в Азии. Китай, Япония и Южная Корея жаждут редкоземельных минералов, рыбы и судоходных маршрутов. Мы откроем дипломатические каналы с тихоокеанскими державами, предлагая им инвестиционные возможности в обмен на признание нашего самоуправляемого статуса. Тихоокеанский ветер приносит как торговлю, так и рычаги влияния."
 GRL_the_welfare_state: "Государство всеобщего благосостояния"
 GRL_the_welfare_state_desc: "Гренландия не богата, но мы верим, что никто не должен быть забыт. Сильное государство всеобщего благосостояния означает бесплатное здравоохранение, качественное образование и поддержку пожилых и инвалидов. Это наш общественный договор. Мы построим систему, отражающую гренландские ценности: общинность, стойкость и заботу о уязвимых. Государство существует, чтобы служить народу, а не наоборот."
 GRL_housing_program: "Жилищная программа"
 GRL_housing_program_desc: "Слишком много гренландских семей живут в перенаселённых, плохо утеплённых домах. Холод проникает сквозь стены, а плесень вызывает болезни детей. Массовая программа государственного жилья построит тысячи новых энергоэффективных домов по всей стране. Каждый гренландец заслуживает тёплого, сухого места, которое можно назвать домом. Это не благотворительность, это справедливость."
 GRL_fight_against_tuberculosis: "Борьба с туберкулёзом"
 GRL_fight_against_tuberculosis_desc: "Туберкулёз должен был стать болезнью прошлого. Но в Гренландии он вернулся - особенно в отдалённых поселениях, где здравоохранение слабое. Мы начнём общенациональную кампанию по скринингу, построим новые клиники и обучим медсестёр выявлять туберкулёз на ранней стадии. Это не просто медицинская борьба. Это борьба за жизни наших детей."
 GRL_sports_for_everyone: "Спорт для всех"
 GRL_sports_for_everyone_desc: "Спорт укрепляет тело и общину. Но во многих деревнях нет спортзалов, нет полей и нет оборудования. Мы профинансируем местные спортивные клубы, построим многоцелевые арены и пригласим тренеров в каждый посёлок. Будь то футбол, бадминтон или традиционные гребные гонки, каждый гренландец должен иметь возможность играть."
 GRL_psychological_help: "Психологическая помощь"
 GRL_psychological_help_desc: "Уровень самоубийств в Гренландии - один из самых высоких в мире. За каждой цифрой стоит человек - сын, дочь, отец - который не видел выхода. Мы расширим услуги в области психического здоровья, подготовим больше психологов и разрушим молчание вокруг депрессии и травм. Исцеление разума так же важно, как и исцеление тела."
 GRL_the_program_for_pensioners: "Программа для пенсионеров"
 GRL_the_program_for_pensioners_desc: "Наши старейшины построили эту страну своими руками. Они охотились на льду, рыбачили в штормах и растили детей в крошечных деревянных домах. Теперь наша очередь заботиться о них. Новая программа поддержки пенсионеров обеспечит посещения на дому, социальную активность и финансовую помощь. Ни один старейшина не должен умирать в одиночестве или в нищете."
 GRL_political_struggle: "Политическая борьба"
 GRL_political_struggle_desc: "Путь к самоуправлению не гладок. Есть фракции, амбиции и старые обиды. Некоторые хотят независимости завтра. Другие боятся, что это разрушит экономику. Политическая борьба реальна и изнурительна. Но мы должны выдержать. Только сражаясь открыто, мы сможем найти путь вперёд, который примут все гренландцы."
 GRL_siumut_IA_coalition: "Коалиция Сиумут и Инуит Атакатигиит"
 GRL_siumut_IA_coalition_desc: "Сиумут и Инуит Атакатигиит были соперниками десятилетиями. Но в вопросе самоопределения они согласны больше, чем не согласны. Большая коалиция двух крупнейших партий послала бы мощный сигнал Копенгагену: Гренландия едина в своём требовании большей автономии. Пусть переговоры начнутся."
 GRL_jonathan_motzfeldt: "Йонатан Мотцфельдт"
 GRL_jonathan_motzfeldt_desc: "Йонатан Мотцфельдт возглавлял Гренландию большую часть эпохи самоуправления. Он гигант нашей политики, но также и противоречивая фигура. Его видение медленного, прагматичного пути к независимости имеет как сторонников, так и критиков. Сплотившись вокруг Мотцфельдта, мы выбираем опыт, а не радикализм. У старого лиса ещё есть зубы."
 GRL_the_white_paper_on_selfgovernment: "Белая книга о самоуправлении"
 GRL_the_white_paper_on_selfgovernment_desc: "После многих лет дебатов правительство опубликовало белую книгу, описывающую новую структуру самоуправления. Она предлагает передать Нууку контроль над полицией, береговой охраной и, что самое важное, над ресурсами недр. Это не независимость, но огромный шаг к ней. Белая книга - наша дорожная карта. Теперь мы должны бороться за неё."
 GRL_selfgovernment_commission: "Комиссия по самоуправлению"
 GRL_selfgovernment_commission_desc: "Слова на бумаге ничего не значат без реализации. Совместная датско-гренландская комиссия будет обсуждать детали закона о самоуправлении. Наши представители должны быть острыми, терпеливыми и непреклонными. Каждая статья, каждая запятая имеет значение. Комиссия - это место, где будет написано будущее нашей нации - чернилами, а не обещаниями."
 GRL_pressure_through_the_UN: "Давление через ООН"
 GRL_pressure_through_the_UN_desc: "Весь мир смотрит. Вынося наше дело в Организацию Объединённых Наций, мы напоминаем Дании и международному сообществу, что деколонизация не завершена. Гренландия всё ещё находится в списке ООН несамоуправляющихся территорий. Мы потребуем слушаний, представим наше дело и заручимся поддержкой других малых наций. ООН - это сцена, и мы выступим."
 GRL_the_referendum: "Референдум"
 GRL_the_referendum_desc: "В один единственный день каждый гренландец старше 18 лет ответит на один вопрос: «Поддерживаете ли вы закон о самоуправлении?» Кампания будет ожесточённой, эмоции накалены. Но когда голоса будут подсчитаны, пути назад не будет. Это демократия в чистом виде - беспорядочная, громкая и величественная. Пусть народ заговорит."
 GRL_the_act_of_selfgovernment: "Акт о самоуправлении"
 GRL_the_act_of_selfgovernment_desc: "Акт подписан. Датская королева дала своё согласие. Гренландия больше не является территорией «самоуправления» - мы самоуправляемая нация в составе Датского королевства. Мы контролируем собственную полицию, собственные суды и собственные ресурсы недр. Путь к полной независимости ещё долог, но сегодня мы делаем гигантский скачок. Флаг поднимается над Нууком. Будущее начинается."
 GRL_companies: "Наши компании"
 GRL_companies_desc: "Экономика Гренландии долгое время зависела от датских субсидий и иностранных рыболовных флотов. Но у нас есть свои предприниматели, свои новаторы и свои мечты. Мы будем поддерживать гренландские компании - от туристических операторов до горнодобывающих стартапов и разработчиков программного обеспечения. Нация, которая не владеет своим бизнесом, не владеет своим будущим. Давайте построим экономику, которая работает на нас."

 # Ideas
 GRL_colony_legacy_idea: "Наследие колонии"
 GRL_colony_legacy_idea_desc: "Столетия датского правления оставили глубокий след в гренландском обществе: экономическую зависимость, культурное искоренение и межпоколенческую травму. Но также и школы, больницы и функционирующую администрацию. Это неоднозначное наследие формирует каждые политические дебаты. Двигаться вперёд означает признавать как раны, так и основы."
 GRL_cod_economy_idea: "Экономика трески"
 GRL_cod_economy_idea_desc: "Ловля трески когда-то была источником жизни Гренландии. После краха в 1990-х годах запасы медленно восстанавливаются. Наша обновлённая тресковая промышленность построена на устойчивых квотах, современных судах и глубокой переработке. Она обеспечивает рабочие места в прибрежных общинах и экспортную выручку, чтобы уменьшить зависимость от датских дотаций."
 GRL_welfare_state_idea: "Государство всеобщего благосостояния"
 GRL_welfare_state_idea_desc: "Гренландское общество построено на принципе, что никто не должен быть забыт. Бесплатное здравоохранение, образование и социальные услуги финансируются за счёт сочетания датских субсидий и местных налогов. Государство всеобщего благосостояния дорого обходится, но оно же делает Гренландию достойным местом для жизни даже в самом суровом климате."
 GRL_no_army_idea: "Государство без армии"
 GRL_no_army_idea_desc: "У Гренландии нет постоянной армии, военно-воздушных сил, военно-морского флота. Обороной занимается Дания, которая содержит несколько патрульных судов и самолётов в регионе. Некоторые видят в этом потерю суверенитета. Другие утверждают, что сэкономленные на обороне деньги можно потратить на жильё, здравоохранение и образование. В Арктике величайшие угрозы - это лёд и бедность, а не иностранные захватчики."

 # Events
 Greenland.1.t: "Референдум о независимости Гренландии"
 Greenland.1.d: "После десятилетий самоуправления и роста национального самосознания правительство Гренландии объявило об историческом референдуме о полной независимости от Дании. Вопрос, вынесенный на голосование, прост: должна ли Гренландия разорвать вековой союз с Копенгагеном и стать суверенным государством? Кампания разделила общество: сторонники независимости видят шанс контролировать арктические ресурсы и утвердить самоопределение инуитов, в то время как противники опасаются потери датских субсидий, которые составляют значительную часть экономики Нуука."
 Greenland.1.a: "Пришло время править самим! Объявить независимость"
 Greenland.2.t: "Гренландия проводит референдум о независимости"
 Greenland.2.d: "Правительство Гренландии официально уведомило Копенгаген о референдуме о независимости. Премьер-министр Гренландии утверждает право народа на самоопределение. Для Дании это экзистенциальный вызов: потеря территории, арктический суверенитет и международный престиж. Мы должны заявить о своей позиции до того, как станут известны результаты."
 Greenland.2.a: "Уважать право на самоопределение. Дания не будет вмешиваться"
 Greenland.3.t: "Комиссия по самоуправлению Гренландии"
 Greenland.3.d: "В ответ на растущие требования расширения полномочий была сформирована совместная датско-гренландская комиссия по самоуправлению. Комиссия рассмотрит вопрос о передаче контроля над судебной системой, полицией, береговой охраной и, что самое важное, арктическими природными ресурсами из Копенгагена. Исход этих переговоров определит будущее «самоуправления» и его трансформацию в полное самоуправление."
 Greenland.3.a: "Полный контроль над ресурсами недр и полезными ископаемыми"
 Greenland.4.t: "Гренландия провозглашает независимость"
 Greenland.4.d: "В этот исторический день тысячи людей собрались на площади перед парламентом в Нууке. Премьер-министр Гренландии зачитал Декларацию независимости, провозгласив создание суверенного государства - Республики Гренландия. Над зданием парламента был поднят новый флаг. Датская королева в своём обращении выразила «сожаление и озабоченность», но признала право гренландского народа на самоопределение. Международное признание приходит медленно, но первые посольства уже открываются в Нууке."
 Greenland.4.a: "Да здравствует новая республика!"
 Greenland.5.t: "Коалиционные переговоры между Сиумут и Инуит Атакатигиит"
 Greenland.5.d: "После недавних выборов две исторически доминирующие партии Гренландии - социал-демократическая «Сиумут» («Вперёд») и левая «Инуит Атакатигиит» («Сообщество народа») - вступили в переговоры о формировании коалиционного правительства. Несмотря на общую приверженность гренландскому самоопределению, у двух партий есть давние разногласия: «Сиумут» традиционно более прагматична и открыта для крупномасштабных проектов по добыче ресурсов, включая добычу урана и редкоземельных элементов в Куаннерсуите (Кванефьельд), в то время как ИА заняла жёсткую позицию против таких проектов из-за экологических проблем. Итог этих переговоров определит экономическое будущее Гренландии и её путь к независимости от Дании. Аналитики отмечают, что хотя обе партии поддерживают окончательный суверенитет, они расходятся во мнениях относительно сроков и средств его достижения, особенно в отношении иностранных инвестиций и отношений с Копенгагеном."
 Greenland.5.a: "Сформировать правительство единства, сосредоточенное на независимости в первую очередь"
 # News Events
 Greenland_news.1.t: "Гренландия выступает в ООН"
 Greenland_news.1.d: "Гренландская делегация выступила на Генеральной Ассамблее ООН с исторической речью, призвав международное сообщество признать право гренландского народа на самоопределение. Представители Нуука апеллируют к принципам Устава ООН и прецедентам деколонизации. Реакция мира неоднозначна: страны Арктического совета сохраняют осторожность, в то время как некоторые постколониальные государства Африки и Азии выражают активную поддержку."
 Greenland_news.1.a: "ОК"
 Greenland_news.2.t: "Гренландия провозглашает независимость"
 Greenland_news.2.d: "Мир просыпается под историческую новость из Арктики: Гренландия официально объявила о своей независимости от Дании. После десятилетий расширенной автономии и после спорного референдума новая Республика Гренландия стала самым молодым государством в мире. Имея население чуть более 56 000 человек, страна теперь сталкивается с монументальной задачей создания государственных институтов с нуля, одновременно управляя своими огромными, но в значительной степени неразработанными природными ресурсами. Международное сообщество внимательно следит за тем, как Копенгаген официально признаёт разделение, ознаменовав конец союза, длившегося более 600 лет. Для Дании это момент национального размышления; для Гренландии - рассвет новой эры. Наблюдатели отмечают, что стратегическая важность Арктики означает, что великие державы, вероятно, бросятся открывать дипломатические представительства в Нууке, заинтересованные в стратегическом положении острова и потенциальных ресурсных богатствах."
 Greenland_news.2.a: "ОК"