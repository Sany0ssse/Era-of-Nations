 SYR_oligarchs_desc: "Семья Махлуф - самая богатая семья в Сирии и вторая по влиянию после аль-Асадов. Самый богатый из членов - Рами Махлуф, двоюродный брат Башара аль-Асада и владелец Syriatel, крупнейшего поставщика мобильной связи в Сирии. Только Рами контролирует около 60% сирийской экономики через свою бизнес-сеть, и ни одна иностранная компания не может вести бизнес в Сирии без его согласия."

