 ##Greater Syria
 TT_SYR_ASSAULT_JORDAN: "Успех переворота зависит от популярности §Yнационалистического взгляда§! в Иордании.\n\nЕсли переворот §Gудачен§!, новый режим получит предложение присоединиться к нам, и мы получим ядра на Иорданию.\n\nЕсли переворот приведёт к §Yгражданской войне§!, мы присоединимся к SSNP в их войне против режима и получим ядра на Иорданию.\n\nЕсли переворот §Rпровалится§!, между нами и Иорданией начнётся война, и мы получим только претензии на Иорданию.\n\n"
 TT_SYR_CONCESSIONS_TO_KURDS: "Если курды согласятся на нашу сделку, то\n"
 TT_SYR_ALIGN_SUDAN: "\nГотовность [SUD.GetName] заключить с нами союз изначально §Gвысокая§!\n\n[SUD.GetName] более склонны заключить с нами союз, если\n §G-Они придерживаются националистического взгляда§!\n\n[SUD.GetName] менее склонны заключить с нами союз, если\n §R-Они и [EGY.GetName] оба придерживаются западного или нового взгляда\n -Они находятся в состоянии войны\n -Они уже в союзе с кем-то другим§!\n"
 TT_SYR_ALIGN_AZERBAIJAN: "\nГотовность [AZE.GetName] заключить с нами союз изначально §Gсредняя§!\n\n[AZE.GetName] более склонны заключить с нами союз, если\n §G-Они придерживаются националистического взгляда§!\n\n[AZE.GetName] менее склонны заключить с нами союз, если\n §R-Они и [PER.GetName] оба придерживаются западного или нового взгляда\n -Они придерживаются неприсоединившегося взгляда\n -Они находятся в состоянии войны\n -Они уже в союзе с кем-то другим\n -Они решили свой спор с [ARM.GetName]\n -Мы были враждебны по отношению к Турции§!\n"
 TT_SYR_ALIGN_ARMENIA: "\nГотовность [ARM.GetName] заключить с нами союз изначально §Gвысокая§!\n\n[ARM.GetName] более склонны заключить с нами союз, если\n §G-Они придерживаются националистического взгляда§!\n\n[ARM.GetName] менее склонны заключить с нами союз, если\n §R-Они находятся в состоянии войны\n -Мы в союзе с курдами§!\n"
 TT_SYR_ALIGN_GREECE: "\nГотовность [GRE.GetName] заключить с нами союз изначально §Rнизкая§!\n\n[GRE.GetName] более склонны заключить с нами союз, если\n §G-Они придерживаются националистического взгляда\n -[TUR.GetName] не является членом НАТО§!\n\n[GRE.GetName] менее склонны заключить с нами союз, если\n §R-Они находятся в состоянии войны\n -Они решили свои пограничные споры с [TUR.GetName]\n -Мы или наша марионетка владеем Кипром§!\n"
 TT_SYR_WEAKEN_IRAN: "Мы получим доступ к §Yрешениям§! для ослабления Ирана и вербовки местных ополченцев перед вторжением в него.\n"
 TT_SYR_ARABISTAN_ARMED: "Когда мы проведём §Yоперацию «Восточный вихрь»§!, арабские ополченцы поднимут восстание и присоединятся к нам.\n"
 TT_SYR_LURISTAN_ARMED: "Когда мы проведём §Yоперацию «Восточный вихрь»§!, лурские повстанцы объявят независимость и будут сражаться против Ирана.\n"
 TT_SYR_AZERBAIJAN_ARMED: "Когда мы проведём §Yоперацию «Восточный вихрь»§!, азербайджанские повстанцы объединятся с азербайджанской армией и будут сражаться против Ирана.\n"
 TT_SYR_TABARISTAN_ARMED: "Когда мы проведём §Yоперацию «Восточный вихрь»§!, гилянские и мазендеранские повстанцы объявят независимость и будут сражаться против Ирана.\n"
 TT_SYR_BALOCHISTAN_ARMED: "Когда мы проведём §Yоперацию «Восточный вихрь»§!, белуджские повстанцы объявят независимость и будут сражаться против Ирана.\n"

 ##Diplomacy
 TT_SYR_ALIGN_PALESTINE: "\nГотовность [PAL.GetName] заключить с нами союз изначально §Gвысокая§!\n\n[PAL.GetName] более склонны заключить с нами союз, если\n §G-Мы придерживаемся одного взгляда§!\n\n[PAL.GetName] менее склонны заключить с нами союз, если\n §R-Они уже в союзе с кем-то другим\n§!"
 TT_SYR_ALIGN_ISRAEL: "\nГотовность [ISR.GetName] заключить с нами союз изначально §Gвысокая§!\n\n[ISR.GetName] более склонны заключить с нами союз, если\n §G-Мы оба придерживаемся либо западного, либо нового взгляда§!\n\n[ISR.GetName] менее склонны заключить с нами союз, если\n §R-Они уже в союзе с кем-то другим\n -Они придерживаются националистического взгляда\n§!"
 TT_SYR_ALIGN_JORDAN: "\nГотовность [JOR.GetName] заключить с нами союз изначально §Gвысокая§!\n\n[JOR.GetName] более склонны заключить с нами союз, если\n §G-Мы оба придерживаемся одного взгляда\n -[ISR.GetName] придерживается националистического взгляда§!\n\n[JOR.GetName] менее склонны заключить с нами союз, если\n §R-Арабо-израильский конфликт разрешён с их стороны\n§!"
 TT_SYR_ALIGN_EGYPT: "\nГотовность [EGY.GetName] заключить с нами союз изначально §Gвысокая§!\n\n[EGY.GetName] более склонны заключить с нами союз, если\n §G-Мы оба придерживаемся одного взгляда\n -[ISR.GetName] придерживается националистического взгляда§!\n\n[EGY.GetName] менее склонны заключить с нами союз, если\n §R-Арабо-израильский конфликт разрешён с их стороны\n§!"
 TT_SYR_ALIGN_SAUDI_ARABIA: "\nГотовность [SAU.GetName] заключить с нами союз изначально §Gсредняя§!\n\n[SAU.GetName] более склонны заключить с нами союз, если\n §G-Мы оба придерживаемся одного взгляда\n -Семья Саудитов у власти, и мы придерживаемся западного взгляда\n -Мы сунниты, а не шииты\n -Мы вывели войска из Ливана§!\n\n[SAU.GetName] менее склонны заключить с нами союз, если\n §R-Фахд больше не король\n -Мы пытались убить премьер-министра Ливана\n -Мы завершили фокус «Поддержка Хезболлы»\n -У них плохое мнение о нас\n§!"
 TT_SYR_ALIGN_IRAN: "\nГотовность [PER.GetName] заключить с нами союз изначально §Gвысокая§!\n\n[PER.GetName] менее склонны заключить с нами союз, если\n §R-Мы не придерживаемся одного взгляда\n -Мы сунниты\n -Мы завершили фокус «Сопротивление Хезболле»\n -Мы контролируем Ливан\n§!"
 TT_SYR_ALIGN_RUSSIA: "\nГотовность [SOV.GetName] заключить с нами союз изначально §Gвысокая§!\n\n[SOV.GetName] менее склонны заключить с нами союз, если\n §R-Мы не придерживаемся одного взгляда\n -Мы находимся в состоянии войны\n§!"

 #Focus tree loc
 Syria_Civil_War_Over: "Гражданская война в Сирии окончена"
 SYR_civil_war_victory: "Победа!"
 SYR_civil_war_victory_desc: "Мы одержали победу в гражданской войне в Сирии! Теперь мы можем приступить к восстановлению нашей страны."
 SYR_free_syria: "Свободная Сирия"
 SYR_free_syria_desc: "Сирия наконец освободилась от ига Аль-Асада и фундаменталистов. Теперь пришло время праздновать и строить планы на будущее Сирии."
 SYR_syrian_arab_army: "Статус Сирийской арабской армии"
 SYR_syrian_arab_army_desc: "Гражданская война в Сирии была разрушительной для Сирийской арабской армии - главной военной силы правительства. Большая часть армии дезертировала или перешла на сторону противника в начале конфликта, и несколько лет войны нанесли тяжёлый урон армии. Даже после поражения режима Асада некоторые элементы САА всё ещё существуют. Нам нужно решить, что с ними делать."
 SYR_political_plurality: "Уровень политического плюрализма"
 SYR_political_plurality_desc: "Во время гражданской войны несколько ополченческих и политических групп доминировали в стране. Теперь нам нужно решить, кого мы хотим взять в будущее Сирии."
 SYR_federal_republic_of_syria: "Федеративная Республика Сирия"
 SYR_federal_republic_of_syria_desc: "Сирия состоит из многих этнических групп. Многие этнические группы долгое время конфликтовали друг с другом. Чтобы страна выжила, мы должны дать больше контроля этническим группам нашей страны."
 SYR_unitary_republic_of_syria: "Унитарная Республика Сирия"
 SYR_unitary_republic_of_syria_desc: "Сирия должна оставаться республикой, и мы должны поощрять людей всех культур и вероисповеданий объединяться под одним единым сирийским флагом."

 SYR_death_of_hafez_al_assad: "Преемственность Хафеза аль-Асада"
 SYR_death_of_hafez_al_assad_desc: "Пришло время выбрать преемников Хафеза аль-Асада."
 SYR_bushra_al_assad: "Бушра аль-Асад"
 SYR_bushra_al_assad_desc: "Бушра - старший и самый опытный ребёнок Хафеза. Тот факт, что она женщина, не должен исключать её из наследования. Она самый законный наследник, и она приведёт Сирию в современное будущее."
 SYR_Husband_Minister: "Муж-министр"
 SYR_Husband_Minister_desc: "Муж Бушры Асеф Шаукат в настоящее время является заместителем директора военной разведки. Его следует повысить до должности директора, чтобы он лучше помог Бушре укрепить свои позиции."
 SYR_gulf_state_tour: "Тур по странам Персидского залива"
 SYR_gulf_state_tour_desc: "Важно показать более консервативным государствам Залива, что женщина может стать идеальным лидером страны."
 SYR_healthcare_reform: "Реформа здравоохранения"
 SYR_healthcare_reform_desc: "Бушра уже поддержала одну волну развития сирийской фармацевтической промышленности. Естественно и необходимо, чтобы она использовала свой опыт для реформирования весьма несовершенной сирийской системы здравоохранения."
 SYR_invite_big_pharma: "Пригласить «Большую фармацевтику»"
 SYR_invite_big_pharma_desc: "Нам нужно связаться с крупными зарубежными фармацевтическими компаниями, чтобы они создали производственные мощности в Сирии. Однако это расстроит правящую элиту, так как прибыль от этих компаний выйдет из-под их контроля."
 SYR_syrian_pharmaceuticals: "Сирийская фармацевтика"
 SYR_syrian_pharmaceuticals_desc: "У Бушры есть планы по запуску нескольких сирийских фармацевтических компаний, таких как Syrian Allied Medical Group, чтобы мы могли покрыть все внутренние потребности в медицинских товарах и не только."
 SYR_eqalitarian_campaign: "Эгалитарная кампания"
 SYR_eqalitarian_campaign_desc: "Сирия будет преобразована в современное государство, где мужчины и женщины будут равны. Брачные контракты больше не будут делом между женихом и отцом невесты, а двойная правовая система, где светские и шариатские суды работают бок о бок, будет ликвидирована."
 SYR_iron_lady: "Железная леди Сирии"
 SYR_iron_lady_desc: "У Бушры есть харизма и способность заставлять окружающих постепенно переходить на её сторону. Как первая женщина - глава государства в арабском мире, она навсегда останется в истории."
 #Bashar
 SYR_bashar_al_assad: "§YБашар аль-Асад§!"
 SYR_bashar_al_assad_desc: "Хотя Башар провёл большую часть своей взрослой жизни, изучая медицину, он был быстро отправлен обратно в Сирию для военной подготовки и быстро получил должность полковника в подразделении Республиканской гвардии. Будучи неопытным, он является старшим сыном, и поэтому в глазах многих наиболее законным наследником Хафеза."
 SYR_constitutional_amendment: "Конституционная поправка"
 SYR_constitutional_amendment_desc: "Нынешняя конституция Сирии требует, чтобы президенту было не менее 40 лет. Это полная чушь, возраст не должен быть ограничением. Кроме того, изменение конституции не имеет ничего общего с тем фактом, что наш нынешний президент моложе возрастного предела!"
 SYR_strengthen_ties_to_HEZ_and_PER: "Укрепить шиитские связи"
 SYR_strengthen_ties_to_HEZ_and_PER_desc: "Нам нужны сильные союзники в регионе. «Хезболла» и Иран являются одними из сильнейших военных структур в регионе. Крайне важно, чтобы мы строили наш аппарат безопасности на координации с ними."
 SYR_purge_opposition: "Очистить оппозицию"
 SYR_purge_opposition_desc: "Когда власть переходит, всегда находятся те, кто хочет увидеть крах всей системы. Нам необходимо арестовать ключевых членов оппозиции как внутри партии Баас, так и за её пределами."
 SYR_friend_old_guard: "Подружиться со старой гвардией"
 SYR_friend_old_guard_desc: "Не все властные структуры должны быть реформированы. Некоторые члены старой элиты являются ключом к удержанию власти. Хотя, возможно, потребуются некоторые услуги, Башар должен объединиться с ними, чтобы остаться у власти."
 SYR_loyal_marriage: "Верный брак"
 SYR_loyal_marriage_desc: "Правитель не может быть без супруги. Асма Ахрас, старая подруга семьи Башара, недавно переехала в Сирию из Великобритании. Она хорошо разбирается в экономике и станет хорошей женой для Башара."
 SYR_firm_the_grip: "Укрепить хватку"
 SYR_firm_the_grip_desc: "Башар унаследовал сеть покровительства, пронизывающую экономическую жизнь Сирии. Олигархические семьи - Махлуфы, Шалиши, Каддуры - процветали при Хафезе; их лояльность теперь должна быть обеспечена. Предлагая им продолжение контроля, Башар связывает их состояние со своим. Прагматичная основа для нового президентства."
 SYR_liberal_concessions: "Либеральные уступки"
 SYR_liberal_concessions_desc: "Смерть Хафеза открыла трещину в правлении баасистов. Башар мог бы расширить её - ровно настолько, чтобы ослабить ограничения для СМИ, освободить нескольких политзаключённых, тихо поощрить гражданские форумы. Не демократия, но её обещание. Не реформа, но её видимость. Способ завоевать интеллигенцию, не сдавая власти."
 SYR_benefits_for_baathists: "Льготы для баасистов"
 SYR_benefits_for_baathists_desc: "Партия Баас - это скелет государства. Её кадры и аппаратчики управляли Сирией три десятилетия. Пренебречь ими - значит парализовать страну. Башар вознаградит их лояльность контрактами, жильём, синекурами. Стабильность, оплаченная покровительством."
 SYR_support_personal_cult: "Поддержка культа личности"
 SYR_support_personal_cult_desc: "Хафез был отцом нации; его портреты висели повсюду. Башар должен создать свой собственный образ. Постановочные фотографии, телевизионные визиты, медийная кампания - молодой врач будет превращён в лидера. Культ Башара строится, один плакат за раз."
 SYR_cosmetic_reforms: "Косметические реформы"
 SYR_cosmetic_reforms_desc: "Дамасская весна наступает раньше, чем ожидалось. Интеллектуалы собираются, циркулируют петиции, голоса призывают отменить чрезвычайное положение. Башар колеблется. Телевизионная встреча, освобождение нескольких давно забытых заключённых - достаточно, чтобы заглушить шум, не меняя архитектуру власти."
 SYR_youngblood: "Молодая кровь"
 SYR_youngblood_desc: "Старая гвардия держала крепость; молодые построят будущее. Режим должен обновляться, чтобы выжить. Поколение технократов, образованных на Западе и лояльных новому президенту, будет приведено в министерства и плановые комиссии. Свежие идеи, никаких связей с прошлым."
 SYR_negotiate_muslim_brotherhood: "Переговоры с «Братьями-мусульманами»"
 SYR_negotiate_muslim_brotherhood_desc: "«Братья» были раздавлены в Хаме, но не уничтожены. Их лидеры в Лондоне, их сети спят по всей стране. Теперь они протягивают осторожную руку. Тихая встреча, обещание амнистии - достаточно, чтобы расколоть их ряды, купить мир, никогда не доверяя им власть."
 SYR_bash_medical_investments: "Медицинские инвестиции"
 SYR_bash_medical_investments_desc: "Башар учился на офтальмолога; медицина даётся ему естественнее, чем политика. Он направит средства на новые больницы, клиники, фармацевтику. Искренние инвестиции в благополучие Сирии - и политическое заявление: доктор исцеляет нацию."
 SYR_embrace_damascus_spring: "Принять Дамасскую весну"
 SYR_embrace_damascus_spring_desc: "Дамасская весна - это момент возможностей. Литературные салоны, политические форумы, дебаты в частных домах - сирийцы пробуют свободу слова. Башар мог бы подавить её или позволить процветать в определённых пределах. Жест доверия, сигнал о том, что новая эра будет другой."
 SYR_economy_liberalization: "Либерализация экономики"
 SYR_economy_liberalization_desc: "Старая социалистическая модель оставила Сирию позади её соседей. Частный капитал, иностранные инвестиции, современный банковский сектор - вот двигатели роста. Башар откроет экономику. Государство по-прежнему будет владеть высотами, но рынок будет формировать ландшафт внизу."
 SYR_ban_extremist_parties: "Запрет экстремистских партий"
 SYR_ban_extremist_parties_desc: "Религиозный экстремизм преследует регион. Баасистское государство сдерживало его с помощью кооптации и репрессий. Теперь Башар должен провести красную линию. Партии, пропагандирующие насилие, отвергающие светское государство, - запрещены. Многие голоса, но нет места фанатизму."
 SYR_true_electoral_reform: "Настоящая избирательная реформа"
 SYR_true_electoral_reform_desc: "Выборы в Сирии всегда были предрешены. Национальный прогрессивный фронт выигрывает каждое место. Теперь Башар немного изменит правила: больше мест для независимых, более открытый процесс. Исход всё равно будет контролироваться, но видимость конкуренции станет реальной."
 SYR_syrian_freedom_media: "Сирийские свободные СМИ"
 SYR_syrian_freedom_media_desc: "Государство всегда контролировало новости. Теперь Башар разрешит частные газеты, независимых журналистов, более яркую публичную сферу. Критика терпима, пока она не касается священных столпов режима. Медийный ландшафт, который кажется свободным."
 SYR_pop_anticor_camp: "Народная антикоррупционная кампания"
 SYR_pop_anticor_camp_desc: "Коррупция - это тихая болезнь государства. От таможни до закупок система работает на бакшише. Башар нацелится на бюрократов среднего звена, которые берут слишком много, на чиновников, которые позорят режим. Показательные процессы, конфискация активов. Сигнал, что новый президент наводит порядок."
 SYR_ensure_military_support: "Обеспечить поддержку армии"
 SYR_ensure_military_support_desc: "Армия - главный гарант режима. Хафез построил её как личный инструмент, заполнив высшие офицерские должности алавитами, лояльными его семье. Башар должен обеспечить эту лояльность: увеличение расходов, новое оборудование, повышения - и возвышение своего брата Махера до командной должности."
 #Maher
 SYR_maher_al_assad: "§OМахер аль-Асад§!"
 SYR_maher_al_assad_desc: "Самый младший из сыновей Хафеза, Махер, имеет большой опыт работы с сирийской армией. Хотя по некоторым сведениям он вспыльчив и даже жесток, сильный военный - это то, что нужно, чтобы Сирия оставалась сильной."
 SYR_empower_the_republican_guard: "Усилить Республиканскую гвардию"
 SYR_empower_the_republican_guard_desc: "Республиканская гвардия - элитное военное подразделение Сирии. Мы должны возвысить их превыше всего, чтобы обеспечить безопасность сирийского общества. Республиканская гвардия - единственная группа, подходящая для управления Сирией."
 SYR_resestablish_defence_companies: "Восстановить оборонные компании"
 SYR_resestablish_defence_companies_desc: "Оборонные компании были группой специального назначения в 70-х и 80-х годах, действовавшей аналогично Республиканской гвардии. Пришло время восстановить эту группу. Эти солдаты будут спецназом, обученным воздушно-десантной и танковой войне, и их главной задачей будет защита правительства от внутренних угроз."
 SYR_oil_must_flow: "Нефть должна течь"
 SYR_oil_must_flow_desc: "Нефть - один из самых жизненно важных ресурсов нашей страны. Она не только приносит доход государству, но и часть дохода напрямую поступает Республиканской гвардии. Мы должны стать такими же, как наши соседи, и стать истинной нефтяной державой."
 SYR_State_Propoganda: "Сирийский дикарь"
 SYR_State_Propoganda_desc: "По словам президента Турции [TUR.GetLeader], действия Махера близки к «дикости». Махер с гордостью будет носить этот титул, ибо дикому льву плевать на мнение овец. Это станет нашей новой пропагандистской основой - мы не склоняемся ни перед какой слабостью!"
 SYR_Bring_SSNP: "Привести ССНП"
 SYR_Bring_SSNP_desc: "ССНП - самая национальная и лояльная политическая сила в Сирии, которая хочет сделать Сирию по-настоящему великой. Их политические цели полностью совпадают с амбициями Махера."
 SYR_Alawi_Dominance: "Алавитское доминирование"
 SYR_Alawi_Dominance_desc: "Алавиты должны теперь доминировать и вести ССНП к её новой, реформированной идеологической позиции."
 SYR_New_Cultural_Policy: "Новая культурная политика"
 SYR_New_Cultural_Policy_desc: "Мы должны создать новую культуру в Сирии, искоренив всё исламское влияние. Сирия должна восстановить культуру, которая была забыта давным-давно."
 syrian_cultural_policy_one: "Новая культурная политика"
 syrian_cultural_policy_two: "Интегрированная культурная политика"
 syrian_cultural_policy_three: "Сирийское наследие"
 SYR_Promote_the_Minorities: "Продвигать меньшинства"
 SYR_Promote_the_Minorities_desc: "Алавиты, христиане, ассирийцы и друзы проливали кровь за эту страну, пока так называемое «большинство» шептало молитвы о нашей гибели. Хватит. В Сирии Махера каждое лояльное меньшинство будет возвышено - им дадут землю, оружие и голос в коридорах власти. Пусть хранители древних вер станут столпами нового государства. Сирия принадлежит не тем, кто склоняется к Мекке, а тем, кто не склоняется ни перед кем."
 SYR_Stomp_Out_Islamists: "Уничтожить исламистов"
 SYR_Stomp_Out_Islamists_desc: "Они прятались за минаретами и называли это верой. Они провозили оружие под молитвенными коврами и называли это сопротивлением. Махер не ведёт переговоров с фанатиками - он выкорчует их, мечеть за мечетью, деревню за деревней, пока ни один чёрный флаг не поднимется над сирийской землёй. Имам, проповедовавший мятеж, ответит перед Республиканской гвардией, а не перед Богом. Сирия будет очищена от этой чумы, и верующие усвоят: преданность нации выше преданности любому чужеземному пророку."
 SYR_Syrian_Legacy: "Сирийское наследие"
 SYR_Syrian_Legacy_desc: "Истинная идентичность Сирии лежит не в арабских завоеваниях, а в древних цивилизациях, которые когда-то процветали на этой земле. Мы должны создать новый сирийский национализм, основанный на славном наследии Ассирии, Вавилона и Месопотамии - истинных предков нашего народа. Принимая это доарабское наследие и поддерживая наши ассирийские и другие общины меньшинств, мы построим нацию, которая чтит свою подлинную историю, а не чуждые навязывания прошлого."
 SYR_Crackdown_of_Freedom: "Подавление свободы"
 SYR_Crackdown_of_Freedom_desc: "Мы должны показать, что любая оппозиция и мелкие демократические движения больше не имеют права голоса в нашей стране. Сирия будет сильной и суверенной!"
 syrian_ssnp_propaganda: "Государственная пропаганда"
 SYR_Oil_Concentrarion: "Концентрация на нефти"
 SYR_Oil_Concentrarion_desc: "Мы должны сосредоточиться на добыче и переработке нефти, чтобы обеспечить нашу энергетическую независимость. Это может навредить другим секторам экономики, но это необходимо для обеспечения нашего будущего."
 SYR_Personal_Deals: "Личные сделки"
 SYR_Personal_Deals_desc: "Махер сосредоточится на потребностях элиты и олигархии и обеспечит, чтобы страна была сильной и процветающей, пока он у власти."
 SYR_Contraband_Imports: "Контрабандный импорт"
 SYR_Contraband_Imports_desc: "Махер будет использовать свои личные связи для контрабанды товаров в Сирию и из Сирии, чтобы поддерживать стратегическую автономию сирийской экономики. Однако это расстроит население, так как прибыль от этих усилий выйдет из-под их контроля."
 SYR_All_for_the_Nation: "Всё для нации"
 SYR_All_for_the_Nation_desc: "Мы должны сосредоточить нашу экономику не на наших личных потребностях, а на потребностях нашего народа."
 SYR_Social_Militarism: "Социальный милитаризм"
 SYR_Social_Militarism_desc: "Социальный милитаризм теперь должен быть нашей официальной государственной идеологической и экономической стратегией для Сирии."
 syrian_ssnp_economy: "Социальный милитаризм"
 syrian_maher_economy: "Экономика Махера"
 syrian_maher_economy_desc: "Экономика Махера основана на принципах скрытых сделок и личных отношений. Он сосредоточится на потребностях элиты и олигархии и обеспечит, чтобы страна была сильной и процветающей, пока он у власти."
 SYR_rifaat_al_assad: "Рифаат аль-Асад"
 SYR_rifaat_al_assad_desc: "Рифаат аль-Асад - брат покойного Хафеза аль-Асада. Он был вице-президентом Сирии до своей ссылки в 1998 году. С тех пор он утверждал, что его отстранение было неконституционным, и, поскольку предыдущий президент умер на своём посту, он является законным преемником. Он обещал, что будет управлять страной демократически, если ему позволят вернуться. Но, с другой стороны, он - аль-Асад."
 SYR_arab_news_network: "Арабская новостная сеть"
 SYR_arab_news_network_desc: "Сын Рифаата, Шумер, в настоящее время возглавляет Арабскую новостную сеть. Сеть в основном работает как политический рупор Рифаата, и доставка этого замечательного новостного канала в Сирию обеспечит, что мнения Рифаата будут хорошо известны по всей стране."
 SYR_the_arab_democratic_party: "Арабская демократическая партия"
 SYR_the_arab_democratic_party_desc: "Рифат основал Арабскую демократическую партию в Ливане ещё в начале 70-х годов, но контроль над партией ускользнул из его рук. Он должен открыть новый филиал и собрать всех своих сторонников под знаменем этой законной партии."
 SYR_kick_out_al_assads: "Изгнать аль-Асадов"
 SYR_kick_out_al_assads_desc: "Аль-Асады повсюду. В правительстве, в средствах массовой информации, в армии. Мы не можем доверять, что они позволят демократии развиваться в Сирии. Все они должны быть отстранены от участия в политике страны, а самые выдающиеся члены семьи должны быть изгнаны."
 SYR_reestablish_political_parties: "Восстановить политические партии"
 SYR_reestablish_political_parties_desc: "В течение 40 лет страна находилась под единым правлением партии Баас. Мы должны освободить политических заключённых из тюрем и позволить изгнанникам вернуться в страну и создать новые политические партии. Это, конечно, полностью изменит политический ландшафт страны, но это необходимо для будущего страны."
 SYR_free_elections: "Свободные выборы"
 SYR_free_elections_desc: "Пришло время провести первые свободные выборы в Сирии."
 SYR_israeli_allies: "Израильские союзники"
 SYR_israeli_allies_desc: "Израиль является одной из самых могущественных стран в регионе. Наша враждебность по отношению к ним бессмысленна, и мы должны стремиться восстановить наши отношения."
 SYR_saudi_allies: "Саудовские союзники"
 SYR_saudi_allies_desc: "Саудовская Аравия является крупным производителем нефти и одной из ведущих стран в Щите полуострова. Быть с ними в хороших отношениях - наш приоритет."
 SYR_american_allies: "Американские союзники"
 SYR_american_allies_desc: "Соединённые Штаты - величайшая экономическая и военная сила на планете. Быть их другом не может иметь абсолютно никаких недостатков."
 SYR_iranian_allies: "Иранские союзники"
 SYR_iranian_allies_desc: "Иран, хотя и является шиитской страной, является одним из старых союзников Сирии. Несмотря на наши религиозные различия, этот союз должен существовать."

 #post 2000s elections syria tree
 SYR_Syrian_Muslim_Brotherhood: "Исламистская оппозиция"
 SYR_Syrian_Muslim_Brotherhood_desc: "Исламистская оппозиционная коалиция победила на выборах и будет призвана привести Сирию к превращению в консервативную исламскую республику."
 SYR_islamist_renaissance: "Исламистский ренессанс"
 SYR_islamist_renaissance_desc: "Наша победа придала смелости нашей поддержке во всех массах. Развилась новая культура, и мы все за её поддержку."
 SYR_empower_sharia_courts: "Расширить возможности шариатских судов"
 SYR_empower_sharia_courts_desc: "Пришло время расширить полномочия исламской судебной системы и её влияние."
 SYR_Islamic_Demorcracy: "Вдохновлённый Турцией исламизм"
 SYR_Islamic_Demorcracy_desc: "Мы будем черпать вдохновение из исламистских движений, которые имели место в Турции после создания их республики. Это представит наше движение в более выгодном свете на данный момент и может привлечь турецких консервативных бизнесменов к инвестированию в нашу страну."
 SYR_deregulate_economy: "Дерегулированная экономика"
 SYR_deregulate_economy_desc: "Чтобы расширить возможности среднего класса и торговцев, от которых мы получаем большую поддержку, мы снизим для них ограничения и предоставим пространство, необходимое для их роста."
 SYR_syrian_gulen_movement: "Сирийское движение Гюлена"
 SYR_syrian_gulen_movement_desc: "Движение Гюлена вкратце было исламистским движением в Турции, которое было очень популярно среди студентов, выступающих за пацифистский и современный взгляд на ислам. Мы будем черпать вдохновение из их учений и реформировать наши школьные программы, чтобы выступать за исламские ценности и обучать им студентов, а также улучшать образование в целом."
 SYR_moderate_conservatism: "Умеренный консерватизм"
 SYR_moderate_conservatism_desc: "Мы искореним экстремистские элементы в наших рядах и изменим наш имидж как силы консерватизма, не имеющей ничего общего с религиозным фанатизмом."
 SYR_religious_values: "Наши ценности непоколебимы"
 SYR_religious_values_desc: "Может быть, наша предыдущая политика, направленная на умиротворение населения и смягчение нашего имиджа, позволила нам отойти от истинных ценностей, на которых построены наши идеалы. Нас мало волнует, что видят другие, и наша единственная цель - установить шариат на наших землях, каким бы непопулярным он ни был."
 SYR_Nationalwide_Charity: "Религиозные пожертвования"
 SYR_Nationalwide_Charity_desc: "Наши движения всегда были связаны с благотворительными организациями и фондами, которые были полезны для наших сообществ. Теперь, когда у нас есть более заметное положение, мы будем институционализировать их ещё больше, чтобы облегчить наше экономическое бремя."
 SYR_qatari_support: "Катарская поддержка"
 SYR_qatari_support_desc: "Мы привлекли интерес различных инвесторов из Катара."
 SYR_flourishment_of_central_economy: "Развивать городские центры"
 SYR_flourishment_of_central_economy_desc: "Наша база поддержки в основном формируется из различных городских регионов, и нам следует начать развивать их, чтобы усилить нашу поддержку со стороны их населения."
 SYR_turkish_investments: "Турецкие инвестиции"
 SYR_turkish_investments_desc: "Мы привлекли множество турецких инвесторов благодаря нашей политике дерегулирования, а также нашему идеологическому сходству с ними."

 #Hayat Tahrir al-Sham
 SYR_Form_Hayat_Tashir_al_Sharm: "Сформировать «Хайят Тахрир аш-Шам»"
 SYR_Form_Hayat_Tashir_al_Sharm_desc: "Знамёна Тахрир аш-Шама взмывают над Дамаском. Абдул Кадим Заллюм, опытный революционер, берёт бразды правления в свои руки. Коалиция исламистских фракций - бойцов, учёных и тех, кто выжил в Хаме - теперь объединяется под единым знаменем. Революция консолидирована; путь вперёд наконец ясен."
 SYR_reverse_secularization: "Обратная секуляризация"
 SYR_reverse_secularization_desc: "Предыдущий режим сильно секуляризировал наше государство. Это явное оскорбление наших идеалов не должно продолжаться, и мы должны изменить эту политику в пользу законов шариата. Призыв муэдзина снова разнесётся из каждого министерства; Сирия возвращается на свой истинный путь."
 SYR_Islamic_Umbrella: "Исламский зонтик"
 SYR_Islamic_Umbrella_desc: "Не все, кто сражается за ислам, согласны в методах. Салафиты, традиционалисты, «Братья-мусульмане» - каждый несёт частицу истины. Мы соберём их вместе под одним зонтиком. Единый исламский фронт, достаточно сильный, чтобы править, и достаточно широкий, чтобы выдержать."
 SYR_Al_Qaeda_Dilemma: "Дилемма «Аль-Каиды»"
 SYR_Al_Qaeda_Dilemma_desc: "Джихадисты, сражавшиеся рядом с нами, теперь требуют своего места. Их методы суровы, их лояльность абсолютна. Принять их - значит рискнуть осуждением всего мира. Отвергнуть - значит расколоть нашу коалицию. Этот выбор определит нашу революцию."
 SYR_Integrate_Jihadists: "Интегрировать джихадистов"
 SYR_Integrate_Jihadists_desc: "Воины, пришедшие из дальних земель, чтобы пролить кровь за Сирию, не будут отвергнуты. Мы приведём их в семью - не как гостей, а как братьев. Их рвение станет нашей силой. Их жертва будет почтена; новый порядок Сирии будет выкован теми, кто за него сражался."
 SYR_A_New_Idealogical_Image: "Новый идеологический образ"
 SYR_A_New_Idealogical_Image_desc: "Мир видит только меч; мы покажем им перо. Новая Сирия, где справедливость - это шариат, а милосердие - закон. Мы откроем наши школы, наши суды и наши рынки для тех, кто хочет понять. Пусть они увидят, что мы строим, а не только то, что мы разрушаем."
 SYR_suppress_traitors: "Подавить предателей"
 SYR_suppress_traitors_desc: "Не все, кто ходили среди нас, были верны. Шпионы, информаторы и те, кто обменял революцию на безопасность, - они будут найдены. Тихая рука, запертая дверь, имя, стёртое из памяти. У новой Сирии нет места тем, кто служил старому режиму."
 SYR_appease_the_west: "Умиротворить Запад"
 SYR_appease_the_west_desc: "Чтобы выжить, мы должны иногда скрывать наши намерения. Мы убедим мировые державы, что наша стабильность предпочтительнее хаоса. Стратегические уступки и умеренная риторика - это не признаки слабости, а инструменты для укрепления нашей позиции, пока мир отворачивается."
 SYR_negotiations_comission: "Комиссия по переговорам"
 SYR_negotiations_comission_desc: "Победа одерживается не только на поле боя. Мы создадим комиссию для разговора с теми, кто всё ещё колеблется, для предложения условий тем, кто хочет сложить оружие, и для переговоров с державами, наблюдающими издалека. Перо, умело используемое, может закончить то, что начал меч."

 SYR_NPF_victory: "Правительство Национального прогрессивного фронта"
 SYR_NPF_victory_desc: "Могущественный Союз победил на выборах, и теперь пришло наше время переосмыслить будущее новой Сирии."
 SYR_statist_rise: "Подъём этатизма"
 SYR_statist_rise_desc: "Либеральная экономика допускает эксплуатацию наших людей и ставит под угрозу нашу национальную независимость и контроль. Для Сирии лучше всего связать каждый аспект экономики с государством."
 SYR_maintain_military_role: "Поддерживать армейские рычаги влияния"
 SYR_maintain_military_role_desc: "Мир вступает в тёмные и трудные времена, поэтому мы должны защитить нашу нацию, чего бы это ни стоило."
 SYR_kick_out_iran: "Выгнать Иран"
 SYR_kick_out_iran_desc: "Иран всегда подчинял нас своему контролю, и нет никаких причин для нас поддерживать с ними связи. Настало время выгнать этих идеологических врагов из Сирии!"
 SYR_nationalize_oligarchic_holdings: "Национализировать холдинги"
 SYR_nationalize_oligarchic_holdings_desc: "Мы национализируем активы и имущество различных олигархов-мошенников, чтобы усилить свой контроль над экономикой."
 SYR_subsidise_police: "Субсидировать полицию"
 SYR_subsidise_police_desc: "Полиция - это одно из самых важных дел, чтобы наши люди чувствовали себя в безопасности и гарантировали наше правление в Сирии, и она очень недофинансирована. Это нужно изменить."
 SYR_maintain_socialistic_policies: "Поддерживать социалистические законы"
 SYR_maintain_socialistic_policies_desc: "Единственное, что было правильным у предыдущего правительства, и это главная причина, по которой они были относительно более популярны, это их социалистическая политика, которая поддерживала низшие классы. Мы продолжим политику, проводимую бывшим президентом Хафезом Асадом, и будем представлять себя истинными сторонниками угнетённых."
 SYR_government_planned_economic_projects: "Государственные проекты"
 SYR_government_planned_economic_projects_desc: "Мы должны инициировать общественные проекты, чтобы улучшить наш имидж как ответственного правительства и заручиться поддержкой простых людей."
 SYR_patriotic_propaganda: "Патриотическая пропаганда"
 SYR_patriotic_propaganda_desc: "Мы будем укреплять наши идеологические позиции, подчеркивая важность национальной гордости и государственной преданности."
 SYR_gather_support_from_peasantry: "Поддержка крестьянства"
 SYR_gather_support_from_peasantry_desc: "Крестьяне - это основа нашей нации, и мы должны убедиться, что они нас поддерживают."
 SYR_strong_government: "Сильное правительство"
 SYR_strong_government_desc: "Нам придётся показать нашему народу, что наше правительство стабильно и достаточно способно управлять. Это позволит нам завоевать их доверие."
 SYR_expand_youth_organizations: "Расширить молодёжные организации"
 SYR_expand_youth_organizations_desc: "Наши партии в значительной степени опирались на молодёжные организации, и теперь, когда мы находимся у власти, пришло время призвать молодёжь поддержать наши идеологические идеи, завоевав их сердца и умы."
 SYR_illiberal_democracy: "Иллиберальная демократия"
 SYR_illiberal_democracy_desc: "Либерализм - это вирус, который заражает и эксплуатирует бедные страны. Людям нужна настоящая демократия, которая действительно представляет народ и в то же время объединяет его под одним знаменем. Мы демократия, несмотря ни на что."
 SYR_reestablish_intelligence_committee: "Восстановить агентства Intel"
 SYR_reestablish_intelligence_committee_desc: "Будущие войны будут не с пушками и танками, а с информацией. Наша обязанность - создать полностью функциональную разведывательную службу."
 SYR_national_security_act: "Закон о национальной безопасности"
 SYR_national_security_act_desc: "Экстремистские группировки медленно убивают нашу нацию и представляют угрозу для нашего народа. Их атаки представляют собой явную угрозу для нашей нации, и если что-то случится, мы должны немедленно остановить их, неважно какой ценой, неважно, что произойдет. ТЕРРОРИЗМ ДОЛЖЕН ПРЕКРАТИТЬСЯ."
 SYR_pan_syrian_nationalism: "Пансирианство"
 SYR_pan_syrian_nationalism_desc: "Сирия - это страна, которая должна озарить весь Ближний Восток своей уникальной идентичностью. Наша богатая история и культура ясно показывают, что наш долг - показать миру наш истинный потенциал и идентичность."
 SYR_cultural_rebirth: "Культурное возрождение"
 SYR_cultural_rebirth_desc: "Наша нация медленно, но верно осознаёт свою идентичность. Мелкие разногласия не должны останавливаться на пути осознания красоты нашего народа. Наш народ должен признать, что несмотря ни на что, мы всё ещё сирийцы."
 SYR_deal_with_the_trade_unions: "Сделка с профсоюзами"
 SYR_deal_with_the_trade_unions_desc: "Залогом сильной страны являются её производство и экономика, поэтому мы должны убедиться, что все трудящиеся Сирии поддерживают нас."
 SYR_reassert_russian_ties: "Русские связи"
 SYR_reassert_russian_ties_desc: "Россия - единственный и верный союзник, который поможет нам стать современной, безопасной и процветающей страной."
 SYR_russian_oil_excavation: "Нефтяные соглашения России"
 SYR_russian_oil_excavation_desc: "В нашей стране есть огромное богатство, и наш союзник Россия поможет нам добраться до этих ресурсов."
 SYR_russian_tartus_base_expansion: "Расширить присутствие российского флота"
 SYR_russian_tartus_base_expansion_desc: "Мы не можем немедленно создать сильный флот, но наши российские друзья помогут нам снизить расходы, оказав содействие в расширении возможностей порта."
 SYR_nasserist_rise: "Подъём Насериста"
 SYR_nasserist_rise_desc: "Насеризм снова набирает силу и готов вновь сделать Сирию великой."
 SYR_islamic_socialism: "Исламский социализм"
 SYR_islamic_socialism_desc: "Люди, похоже, забывают, что ислам пропагандирует множество практик, приписываемых социализму, таких как закят и садака. Мы должны подчеркнуть эту связь, основывая наши идеалы вокруг неё, поскольку это также привлечёт поддержку исламистов, которые всегда выступали против наших идеалов. Исламский социализм - это истинный путь к превращению нашей страны в современную, сильную и добродетельную республику."
 SYR_Get_rid_of_oligarchs: "Очистить олигархов"
 SYR_Get_rid_of_oligarchs_desc: "Олигархия укоренилась в наших институтах и представляет собой явную угрозу будущему нашей страны. Мы арестуем их по обвинению в коррупции и конфискуем всё имущество, которое сможем заполучить."
 SYR_the_coalition: "Коалиция"
 SYR_the_coalition_desc: "После восстановления политических партий возникли две заметные силы. Одна выступает за федерализацию государства и предоставление большего количества полномочий провинциям, а другая выступает за укрепление централизованной власти и сохранение единой централизованной республики. Нам придётся тщательно выбирать, с кем мы должны согласовываться."
 SYR_dismantle_the_military: "Упразднить военный бюджет"
 SYR_dismantle_the_military_desc: "Большая часть оборонного ВВП была разворована и направлена на бесполезные проекты из-за укоренившейся коррупции в институтах наших вооружённых сил. Мы перепрофилируем и продадим многое из того, что сможем получить, и хотя это может ослабить нашу армию и сделать нас уязвимыми для угроз, это необходимый шаг на пути к экономическому восстановлению и искоренению коррупции."

 SYR_scientific_ventures: "Научные предприятия"
 SYR_scientific_ventures_desc: "Поддерживая стипендии и обновляя наши устаревшие школьные программы, мы сможем продвинуть научный сектор страны."
 SYR_domestic_investments: "Внутренние инвестиции"
 SYR_domestic_investments_desc: "Создаётся много молодых отечественных предприятий. Мы будем инвестировать в них, чтобы поддержать их путь к экономическому процветанию."
 SYR_subsidize_local_firms: "Местные фирмы"
 SYR_subsidize_local_firms_desc: "Благодаря нашей политике местные фирмы получают признание за свой успех. Время инвестировать в них."
 SYR_federalisation: "Федерализация"
 SYR_federalisation_desc: "Решение состоит в том, чтобы дать больше полномочий штатам. Это значительно поощрит местное представительство и инклюзивность и значительно снимет сектантские страхи и напряжённость. Однако эта автономия ослабит нашу власть над штатами, особенно там, где присутствуют меньшинства."

 SYR_invite_US_business_giants: "Пригласить бизнес-гигантов"
 SYR_invite_US_business_giants_desc: "Хотя мы позволили нашей экономике процветать, этого недостаточно. Мы пригласим гигантские компании из США открыть франшизы в стране, чтобы поощрять потребительство."
 SYR_republicanism: "Республиканство"
 SYR_republicanism_desc: "Сирия лучше всего управляется как сильное государство с централизованной властью. Это укрепит правление нашего правительства, но вызовет отчуждение и гнев со стороны меньшинств, которые чувствуют себя обделёнными."
 SYR_address_ethnic_divides: "Решить этнические разногласия"
 SYR_address_ethnic_divides_desc: "Наша страна всегда была разделена и охвачена сектантскими конфликтами. Мы должны решить, как справиться с этими проблемами."
 SYR_EU_investments: "Инвестиции ЕС"
 SYR_EU_investments_desc: "Различные европейские страны стремятся инвестировать в нашу страну."
 SYR_student_exchanges: "Студенческие обмены"
 SYR_student_exchanges_desc: "Мы будем поощрять стипендии для обучения в зарубежных странах, чтобы улучшить наше образование и поддерживать его на уровне мировых стандартов."
 SYR_concentrate_on_lebanon: "Сосредоточиться на Ливане"
 SYR_concentrate_on_lebanon_desc: "Ливан уже давно является мишенью Сирии. Между «Хезболлой» и правительством там ожесточённая конкуренция, и мы должны воспользоваться этим."
 SYR_against_hezbollah: "Сопротивляться «Хезболле»"
 SYR_against_hezbollah_desc: "«Хезболла» - это не более чем террористическая организация, пытающаяся сломить Ливан. Нам нужно подготовиться, чтобы избавиться от них."
 SYR_lebanese_support: "Заполучить ливанскую поддержку"
 SYR_lebanese_support_desc: "В течение многих лет «Хезболла» создавала проблемы в Ливане. Они практически являются государством внутри государства и значительно снижают легитимность ливанского правительства. Мы должны связаться с Ливаном и обсудить возможные совместные военные действия против «Хезболлы»."
 SYR_strike_hezbollah: "Уничтожить «Хезболлу»"
 SYR_strike_hezbollah_desc: "Избавиться от «Хезболлы»."
 SYR_shadow_over_lebanon: "Тень над Ливаном"
 SYR_shadow_over_lebanon_desc: "Мы помогли ливанцам вернуть контроль над своей страной, и они нам очень многим обязаны. Всего два десятилетия назад сирийское правительство прочно переплелось с ливанским правительством, и мы вновь хотим создать такую ситуацию."
 SYR_support_hezbollah: "Поддержать «Хезболлу»"
 SYR_support_hezbollah_desc: "«Хезболла» - ценный союзник для нас. Мы должны сделать так, чтобы они поднялись на вершину и в конце концов получили контроль над всем Ливаном."
 SYR_prepare_lebanon_coup: "Проникнуть в Ливан"
 SYR_prepare_lebanon_coup_desc: "«Хезболла» уже действует в Ливане. Нам нужно увеличить помощь им и укрепить их основу власти. Это в конечном итоге сделает их достаточно сильными, чтобы свергнуть правительство Ливана."
 SYR_lebanese_coup: "Ливанский переворот"
 SYR_lebanese_coup_desc: "Боевики «Хезболлы» в Ливане готовы к перевороту. В случае успеха «Хезболла» получит контроль над всей страной. Однако в случае неудачи ливанская армия может нанести ответный удар.\n\nЧем выше поддержка «Хезболлы», тем больше вероятность успеха переворота"
 SYR_shadow_over_hezbollah: "Тень над «Хезболлой»"
 SYR_shadow_over_hezbollah_desc: "Мы помогли «Хезболле» свергнуть правительство Ливана. Это означает, что они в долгу перед нами. Мы должны вывести их из-под иранского контроля и заставить следовать нашим указаниям."

 #Opposition
 SYR_secular_opposition_victory: "Светское оппозиционное правительство"
 SYR_secular_opposition_victory_desc: "Коалиция светской оппозиции победила на выборах и будет призвана привести Сирию к становлению либерально-демократическим государством."
 SYR_us_support: "Поддержка США"
 SYR_us_support_desc: "Вашингтон будет призван поддержать новое гражданское правительство дипломатическим признанием, политическим влиянием и осторожным потоком поддержки. Если американцы готовы инвестировать в наше будущее, Сирия может стать партнёром, а не полем битвы."
 SYR_direct_intervention: "Прямое вмешательство"
 SYR_direct_intervention_desc: "Оппозиция решила, что больше не может полагаться только на речи. Иностранные войска, иностранные самолёты и иностранные гарантии могут быть единственным способом сохранить революцию достаточно долго, чтобы добиться мира."
 SYR_cooperation_with_israel: "Сотрудничество с Израилем"
 SYR_cooperation_with_israel_desc: "Горькая история не исчезает за одну ночь, но необходимость может заставить вести странные разговоры. Через тихие каналы и осторожные уступки мы можем превратить старых врагов в прагматичных партнёров."
 SYR_european_education_support: "Европейская образовательная поддержка"
 SYR_european_education_support_desc: "Современной Сирии нужны современные умы. Привлекая европейскую образовательную помощь, стипендии и институциональное руководство, мы можем вырастить поколение, которое смотрит в будущее, а не на руины прошлого."
 SYR_support_of_druzes: "Поддержка друзов"
 SYR_support_of_druzes_desc: "Друзские общины юга долгое время жили между страхом и лояльностью. Гарантируя им место в новом порядке, мы можем доказать, что эта Сирия не будет построена на исключении своих меньшинств."
 SYR_kurds_agreement: "Соглашение с курдами"
 SYR_kurds_agreement_desc: "Курдский вопрос невозможно решить только силой. Обязательное соглашение, признающее их права и устремления, может стать ценой стабильной и единой Сирии."
 SYR_federalization: "Федерализация"
 SYR_federalization_desc: "Будущее Сирии может зависеть от разделения власти, а не от её накопления. Федеративная структура ослабит местную напряжённость, укрепит региональную ответственность и даст каждой общине долю в республике."
 SYR_suppress_islamists: "Подавить исламистов"
 SYR_suppress_islamists_desc: "Оппозиция должна решить, где заканчивается свобода и начинается фанатизм. Если республика должна выжить, экстремистам нельзя позволить захватить демократический проект изнутри."
 SYR_shiniest_democracy: "Блистательнейшая демократия"
 SYR_shiniest_democracy_desc: "Реформа больше не лозунг, а представление, и Сирия покажет своё самое яркое лицо. Мы отполируем институты, распиарим победы и представим нашу демократию как нечто, чего регион никогда раньше не видел."
 SYR_guardians_of_revolution: "Стражи революции"
 SYR_guardians_of_revolution_desc: "Каждой революции нужны защитники, которые могут уберечь её от старых привычек, старых элит и старых диктаторов. Эти стражи будут стоять на страже нового порядка, пока республика не станет достаточно сильной, чтобы защищать себя."
 SYR_western_supported_economic_relief: "Западная помощь"
 SYR_western_supported_economic_relief_desc: "Наши идеалы совпадают с идеалами Запада и даже позволили нам создать наши партии в их странах. Мы установим связи с ними и попросим облегчения в обмен на экономические рычаги."
 SYR_liberalize_society: "Либерализовать общество"
 SYR_liberalize_society_desc: "Народ чужд ценностям свободы и равенства. Мы должны работать над тем, чтобы побудить их ценить свои свободы."
 SYR_democratic_socialism: "Демократический социализм"
 SYR_democratic_socialism_desc: "Разрушительное экономическое положение нашей страны оставило наше население довольно бедным и неразвитым. Сокращение ограничений на бизнес приведёт к эксплуатации и нечестной конкуренции, поскольку экономическое неравенство всё ещё распространено в нашей стране. Нам нужно сосредоточиться на поощрении новых предприятий в стране и предоставлении им грантов, чтобы обеспечить широкое экономическое развитие, которым смогут пользоваться все классы граждан."
 SYR_syrian_diaspora_investments: "Инвестиции диаспоры"
 SYR_syrian_diaspora_investments_desc: "Благодаря нашей экономически благоприятной политике мы привлекли инвестиции от сирийской диаспоры, проживающей за рубежом."
 SYR_unleash_economic_potential: "Раскрыть экономический потенциал"
 SYR_unleash_economic_potential_desc: "У нас есть большой потенциал стать экономической силой. Мы можем поощрять иностранных инвесторов и бизнес создавать здесь компании, и даже если это сделает наше население дешёвой рабочей силой, это будет нашим большим шагом к экономическому развитию."
 SYR_empower_institutions: "Расширение прав и возможностей институтов"
 SYR_empower_institutions_desc: "Наши институты очень слабы и отодвинуты на второй план. Это происходит из-за концентрации власти у президента и малой власти у парламента, а также из-за контролируемых государством СМИ, поддерживающих атмосферу, ограничивающую личные свободы. Разработка новой конституции, гарантирующей распределение власти и либерализацию, является важным шагом на пути к будущему."
 SYR_banish_authoritarian_influence: "Избавиться от авторитарного влияния"
 SYR_banish_authoritarian_influence_desc: "Многие авторитарные государства, такие как Иран и Россия, имели здесь большое присутствие. Теперь, когда мы стали свободным государством, пришло время положить конец их влиянию на наши институты и экономику."
 SYR_economic_democracy: "Экономическое равенство"
 SYR_economic_democracy_desc: "Наше экономическое развитие достигло всех людей из всех экономических слоёв, борясь с экономическим неравенством, и даже дало толчок успешным отечественным компаниям. Это то, чем мы должны гордиться."

 SYR_Remain_Independent: "Остаться независимыми"
 SYR_Remain_Independent_desc: "Сирия не должна стать простым сателлитом иностранных держав. Мы должны ориентироваться в сложном геополитическом ландшафте, чтобы обеспечить сохранность нашего суверенитета, балансируя между конкурирующими интересами, оставляя нашу судьбу в наших руках."
 SYR_Distance_from_Salafits: "Дистанцироваться от салафитов"
 SYR_Distance_from_Salafits_desc: "Хотя радикальные элементы эффективны на поле боя, их экстремистская идеология рискует оттолкнуть умеренное население и потенциальных международных партнёров. Мы должны публично дистанцировать наши политические цели от их сектантской повестки."
 SYR_Only_Path_in_Rabaniya: "Единственный путь в Рабанийе"
 SYR_Only_Path_in_Rabaniya_desc: "Концепция Рабанийи диктует, что вся власть исходит от божественного правления. Внедряя этот путь, мы реструктурируем наше общество, чтобы согласовать каждый закон и действие с высшим суверенитетом Творца."
 SYR_Support_the_Traders: "Поддержать торговцев"
 SYR_Support_the_Traders_desc: "Торговые классы Дамаска и Алеппо являются источником жизненной силы нашей экономики. Обеспечивая им безопасность и снижая внутренние тарифы, мы можем стабилизировать рынки и обеспечить стабильный поток доходов для государства."
 SYR_turkish_backing: "Турецкая оборона"
 SYR_turkish_backing_desc: "Анкара рассматривает нашу стабильность как жизненно важную для собственной пограничной безопасности. Оформляя наши связи с турецким правительством, мы получаем современное оборудование, логистическую поддержку и мощный сдерживающий фактор против наших врагов."
 SYR_Al_Nursa_Front: "Фронт ан-Нусра"
 SYR_Al_Nursa_Front_desc: "Как дисциплинированная и высококвалифицированная боевая сила, Фронт ан-Нусра представляет собой авангард вооружённой борьбы. Их тактическое мастерство и идеологический пыл являются важными активами для демонтажа нынешнего режима."
 SYR_Al_Qaeda_Network: "Сеть «Аль-Каиды»"
 SYR_Al_Qaeda_Network_desc: "Подключение к глобальной сети «Аль-Каиды» даёт нам доступ к опытным бойцам, тайному финансированию и многолетнему опыту асимметричной войны в исламском мире."
 SYR_Teachings_of_Qutb: "Учения Кутба"
 SYR_Teachings_of_Qutb_desc: "Писания Сейида Кутба служат сигналом тревоги против современного джахилийи. Принимая его идеологию, мы готовим авангард к тотальной борьбе против созданных человеком систем тирании."
 SYR_Call_to_Qatar: "Призыв к Катару"
 SYR_Call_to_Qatar_desc: "Доха обладает финансовым весом и медийным влиянием, необходимыми для изменения хода конфликта. Официальное обращение к Катару принесёт столь необходимые инвестиции и дипломатическую легитимность нашему делу."
 SYR_Pan_Islamists_Efforts: "Панисламистские усилия"
 SYR_Pan_Islamists_Efforts_desc: "Навязанные нам границы - это искусственные конструкции. Мы должны посвятить наши усилия укреплению единства уммы, преодолению национальных разделов для создания сплочённого фронта против внешней агрессии."

 # Al Nusra Three
 SYR_teaching_of_qutb_ext: "Учения Кутба"
 SYR_teaching_of_qutb_ext_desc: "Мы расширили учения Кутба, включив в них более радикальные идеи. Это поможет нам привлечь больше последователей и укрепить наши позиции в регионе."
 SYR_international_jihadists_support: "Поддержка международных джихадистов"
 SYR_international_jihadists_support_desc: "Мы увеличили нашу поддержку международных джихадистов. Это поможет нам привлечь больше последователей и укрепить наши позиции в регионе."
 SYR_mushriq_chase_idea: "Преследование мушриков"
 SYR_mushriq_chase_idea_desc: "Мы увеличили нашу поддержку мушриков. Это поможет нам привлечь больше последователей и укрепить наши позиции в регионе."
 SYR_hudud_in_syria: "Худуд в Сирии"
 SYR_hudud_in_syria_desc: "Худуд - это система исламского права, используемая для управления исламским государством. Мы должны внедрить её в нашей стране, чтобы гарантировать, что наши законы соответствуют исламскому праву."
 SYR_Attack_Iraq_idea: "Планируемое нападение на Ирак"
 SYR_Attack_Iraq_idea_desc: "Мы спланировали нападение на Ирак. Мы атакуем Ирак всеми нашими силами и уничтожим их армию. Затем мы аннексируем Ирак и сделаем его частью халифата."

 hate_us: "Ненавидеть нас"
 islamic_theologian: "Исламский богослов"
 master_of_asymmetric_warfare: "Мастер асимметричной войны"

 SyriaFocus.201.t: "Внедрить худуд в Сирии"
 SyriaFocus.201.d: "Внедрение худуда в Сирии сделает нашу страну более исламской и поможет нам распространять слово Аллаха по всему миру. Однако это также сделает нашу страну более изолированной от остального мира. Мы должны решить, внедрять ли худуд в нашей стране."
 SyriaFocus.201.a: "Внедрить худуд"
 SyriaFocus.201.b: "Не внедрять худуд"

 SyriaFocus.200.t: "Решить вопрос с несалафитскими партиями"
 SyriaFocus.200.d: "Запрет несалафитских партий в Сирии сделает нашу страну более исламской и поможет нам распространять слово Аллаха по всему миру. Однако это также сделает нашу страну более изолированной от остального мира. Мы должны решить, запрещать ли несалафитские партии в нашей стране. У нас есть два варианта: запретить все несалафитские партии или оставить их в покое."
 SyriaFocus.200.a: "Запретить несалафитские партии"
 SyriaFocus.200.b: "Оставить несалафитские партии в покое"
 SyriaFocus.200.tt: "§RМы запретим все другие партии и потеряем уважение соседей, но избавимся от их влияния на нас!§!"

 Syria_Caliphate_category: "Халифат"
 Syria_Caliphate_category_desc: "Мы на пути к халифату. Мы пойдём по пути пророка Мухаммеда и его сподвижников и распространим слово Аллаха по всему миру."
 SYR_Buy_T55: "Купить Т-55"
 SYR_Buy_T55_desc: "Мы должны купить танки Т-55, чтобы укрепить нашу армию. Эти танки мощны и помогут нам защитить нашу страну."
 SYR_Buy_ZIL131: "Купить ЗИЛ-131"
 SYR_Buy_ZIL131_desc: "Мы должны купить грузовики ЗИЛ-131 для перевозки наших войск и техники. Эти грузовики надёжны и помогут нам перевозить наши войска и технику."
 SYR_Buy_BM21Grad: "Купить БМ-21 «Град»"
 SYR_Buy_BM21Grad_desc: "Мы должны купить реактивные системы залпового огня БМ-21 «Град», чтобы помочь нам защитить нашу страну. Эти установки мощны и помогут нам защитить нашу страну."
 SYR_Buy_D30: "Купить Д-30"
 SYR_Buy_D30_desc: "Мы должны купить орудия Д-30, чтобы помочь нам защитить нашу страну. Эти орудия мощны и помогут нам защитить нашу страну."
 SYR_Buy_Strela2M: "Купить «Стрела-2М»"
 SYR_Buy_Strela2M_desc: "Мы должны купить ракеты «Стрела-2М», чтобы помочь нам защитить нашу страну. Эти ракеты мощны и помогут нам защитить нашу страну."
 SYR_Buy_RPG7: "Купить РПГ-7"
 SYR_Buy_RPG7_desc: "Мы должны купить гранатомёты РПГ-7, чтобы помочь нам защитить нашу страну. Эти гранатомёты мощны и помогут нам защитить нашу страну."
 SYR_Buy_AKM: "Купить АКМ"
 SYR_Buy_AKM_desc: "Мы должны купить автоматы АКМ, чтобы помочь нам защитить нашу страну. Эти автоматы мощны и помогут нам защитить нашу страну."
 SYR_Attack_Iraq: "Разработать план нападения на Ирак"
 SYR_Attack_Iraq_desc: "Мы должны разработать план нападения на Ирак. Мы атакуем Ирак всеми нашими силами и уничтожим их армию. Затем мы аннексируем Ирак и сделаем его частью халифата."
