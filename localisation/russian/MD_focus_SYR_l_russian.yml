 #Missing Focus Localizations
 SYR_Mejd_Insanity: "§0Безумие Меджа§!"
 SYR_Mejd_Insanity_desc: "Порочный генетический круг замкнулся. Разум Меджа, давно разрушенный порошками и видениями, наконец покинул берега реальности. Управление Сирией - не препятствие, а всего лишь предпосылка для работы."
 SYR_Hire_a_Home_Psycharist: "Нанять домашнего психиатра"
 SYR_Hire_a_Home_Psycharist_desc: "Когда боги говорят с вами голосами, вам нужен переводчик. Личный психиатр Меджа нужен не для того, чтобы вылечить его, а для того, чтобы обеспечить синхронный перевод с бреда на указы."
 SYR_Assemble_a_Regency_Council: "Собрать регентский совет"
 SYR_Assemble_a_Regency_Council_desc: "Поскольку Медж занят беседами с духами предков, государственными делами должны заниматься те, кто ещё не научился летать. Регентский совет будет управлять страной, пока король беседует с Гильгамешем."
 SYR_Ensure_Drug_Supply: "Обеспечить поставки наркотиков"
 SYR_Ensure_Drug_Supply_desc: "Чтобы видеть будущее, нужны качественные материалы. Мы национализируем каждую лабораторию и теплицу - Каптагон больше не просто товар; это стратегическое топливо для ясновидения нашего лидера."
 SYR_Words_Of_the_Mental_Breakdown: "Слова психического срыва"
 SYR_Words_Of_the_Mental_Breakdown_desc: "Речь Меджа перед нацией была бессвязной, но гипнотической. Он пообещал превратить Евфрат в молоко, а пустыню - в стеклянный дворец. Народ ликует, ибо только истинный пророк может извергать такую красивую бессмыслицу."
 SYR_Establish_Electrical_Engineering_Facilities: "Создать электротехнические предприятия"
 SYR_Establish_Electrical_Engineering_Facilities_desc: "Медж утверждает, что слышит электричество. Никто до конца не понимает, что это значит, но мы уже закупаем оборудование. Это может привести к технологическому прорыву - или к массовым галлюцинациям по всей стране."
 SYR_establish_drug_industries: "Создать наркотические производства"
 SYR_establish_drug_industries_desc: "Кустарное производство больше не является достаточным. Мы построим заводы, из чьих труб будет валить сладкий, туманный дым. Экономика должна стать наркотической!"
 SYR_Give_Away_Assad_Family_Wealth: "Раздать богатство семьи Асад"
 SYR_Give_Away_Assad_Family_Wealth_desc: "Меджу не нужно золото; ему нужны последователи. Он приказывает раздать миллиарды клана бедным. Бедные говорят, что деньги пахнут Каптагоном, но кто их слушает?"
 SYR_Drug_Production_Support: "Поддержка производства наркотиков"
 SYR_Drug_Production_Support_desc: "Химики - новая элита Сирии. Медж лично наблюдает за созданием новых синтетических формул, способных либо исцелить нацию, либо отправить её в коллективное путешествие по измерениям."
 SYR_The_New_Gilgamesh: "Новый Гильгамеш"
 SYR_The_New_Gilgamesh_desc: "Медж объявил себя реинкарнацией царя Урука. Он ищет бессмертие не в травах, а в таблетках. Его самый верный наркокурьер назначен его Энкиду."
 SYR_Hear_The_Voices: "Слышать голоса"
 SYR_Hear_The_Voices_desc: "Медж убеждён, что радиостанции транслируют ему личные сообщения от шумерских богов. Мы увеличили мощность передатчиков, чтобы заглушить скептиков космическими помехами."
 SYR_Gods_Have_Spoken: "Боги заговорили"
 SYR_Gods_Have_Spoken_desc: "Пророчество сбылось. Мардук и Иштар (по крайней мере, в голове Меджа) благословили его правление. Отныне каждый указ божественен; спорить с ним - значит спорить с самими небесами."
 SYR_Invite_Foreign_Mercenaries: "Пригласить иностранных наёмников"
 SYR_Invite_Foreign_Mercenaries_desc: "Местные солдаты слишком приземлены. Нам нужны наёмники со всего мира - желательно с безумными глазами и готовностью идти в огонь за таблетку и обещание рая."
 SYR_Support_Egyptian_Priests: "Поддержать египетских жрецов"
 SYR_Support_Egyptian_Priests_desc: "Медж считает египетских жрецов родственными душами. В обмен на финансовую поддержку они обещают открыть портал в подземный мир. Мы не против, если это поможет нам выиграть войну."

 SYR_Bursha_Ascend: "§GБушра восходит§!"
 SYR_Bursha_Ascend_desc: "Впервые в современной истории Ближнего Востока женщина берёт бразды правления Сирией. Дочь Хафеза, сестра Башара - Бушра аль-Асад бросает вызов традиции и предлагает нации новый путь: путь разума, диалога и постепенных реформ."
 SYR_Crush_Gender_Prejudices: "Сокрушить гендерные предрассудки"
 SYR_Crush_Gender_Prejudices_desc: "В обществе, где женщина у власти казалась невозможной ещё вчера, Бушра начинает с основ: образования и пропаганды. Школьные программы переписываются, государственные СМИ получают чёткие инструкции - талант не имеет пола."
 SYR_Conservative_Femenism: "Консервативный феминизм"
 SYR_Conservative_Femenism_desc: "Бушра предлагает сирийский путь эмансипации женщин: без разрыва с традициями, без агрессивного западного радикализма, но с реальными правами и возможностями. Женщина может быть одновременно хранительницей очага и министром."
 SYR_Ensure_Women_Representation: "Обеспечить представительство женщин"
 SYR_Ensure_Women_Representation_desc: "Слова должны подкрепляться делами. Вводится обязательная квота для женщин в парламенте, государственной службе и судах. Голос Бушры теперь имеет тысячу отражений."
 SYR_Intelligence_Links: "Разведывательные связи"
 SYR_Intelligence_Links_desc: "Будучи дочерью Хафеза, Бушра с детства знает цену информации. Она устанавливает личные каналы с Мухабаратом, превращая секретные службы из инструмента страха в инструмент наблюдения за реформами."
 SYR_Egalitarian_Campaning: "Эгалитарная кампания"
 SYR_Egalitarian_Campaning_desc: "Бушра запускает масштабную общественную кампанию, призывающую к равенству всех граждан перед законом - независимо от вероисповедания, этнической принадлежности или происхождения. Алавиты, сунниты, курды, христиане - все сирийцы."
 SYR_Embrace_Secular_Thought: "Принять светскую мысль"
 SYR_Embrace_Secular_Thought_desc: "Религия - дело совести; государство - дело закона. Бушра провозглашает курс на углубление светских принципов, отделение политики от догм и приглашение интеллигенции к диалогу."
 SYR_Judical_Fair_Reform: "Судебная справедливая реформа"
 SYR_Judical_Fair_Reform_desc: "Независимая судебная система - основа прогресса. Бушра инициирует чистку коррумпированных судей и назначает принципиальных юристов, способных вершить правосудие по закону, а не по звонку."
 SYR_Affordable_Social_Care: "Доступная социальная помощь"
 SYR_Affordable_Social_Care_desc: "Женщина у власти означает заботу об уязвимых. Бушра расширяет сеть социальных учреждений, делает здравоохранение более доступным и вводит пособия для многодетных семей."
 SYR_Partical_Economic_Liberalization: "Частичная экономическая либерализация"
 SYR_Partical_Economic_Liberalization_desc: "Бушра понимает: государство не может управлять каждой лавкой. Малый и средний бизнес получают свободу, но стратегические сектора остаются под контролем государства. Это не шоковая терапия, а лечение."

