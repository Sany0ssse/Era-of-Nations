 #Economic events
 syrian_economy.1.t: "Предложение от Petro-Canada"
 syrian_economy.1.d: "Представители канадской интегрированной энергетической компании Petro-Canada прибыли в Дамаск с существенным предложением. Внимательно следя за многообещающими открытиями на газовом месторождении Шаир в провинции Хомс, они стремятся стать главным инвестором и техническим партнёром в его разработке.\n\nPetro-Canada предлагает вложить значительный капитал и передовые технологии добычи для извлечения свободного газа на месторождении."
 syrian_economy.1.a: "Приветствовать эти инвестиции"
 syrian_economy.1.b: "Вежливо отказаться"

 syrian_economy.2.t: "Партнёрство с Petro-Canada подтверждено"
 syrian_economy.2.d: "Подписано соглашение с Petro-Canada, что знаменует собой важный шаг в энергетической стратегии Сирии. Канадская фирма теперь является главным инвестором газового месторождения Шаир.\n\nБлагодаря иностранному капиталу и технологиям, месторождение будет подключено к газовому заводу Эбла, обеспечивая надёжный поток топлива для внутренней энергетики и промышленности. Это партнёрство укрепляет экономические связи с Канадой и сигнализирует о модернизации нашего энергетического сектора."
 syrian_economy.2.a: "Отличная сделка для нашего будущего."

 #Generic Investment Declined
 syrian_economy.3.t: "Инвестиции отклонены"
 syrian_economy.3.d: "Правительство [FROM.GetAdjective] отказалось от сотрудничества, вынудив нас пересмотреть наши планы и слегка ухудшив дипломатические отношения."
 syrian_economy.3.a: "Мы должны искать другие возможности"

 syrian_economy.4.t: "Запрос о нефтяных инвестициях"
 syrian_economy.4.d: "Сирийское правительство официально запросило наши инвестиции для разработки недавно обнаруженных нефтяных месторождений, ссылаясь на нехватку капитала и современных технологий добычи. В обмен они предлагают укрепление экономического партнёрства и региональное влияние, хотя это требует немедленных финансовых обязательств."
 syrian_economy.4.a: "Выделить средства и отправить специалистов"
 syrian_economy.4.b: "Вежливо отказаться, ссылаясь на внутренние приоритеты"

 syrian_economy.5.t: "Инвестиции одобрены"
 syrian_economy.5.d: "Наши иностранные партнёры официально уведомили нас о своём согласии финансировать развитие нашего нефтяного сектора. Первые переводы уже поступают на счета национальной нефтяной компании, а группа иностранных инженеров готовится к работе на новых месторождениях. Это возможность модернизировать нашу энергетическую промышленность и укрепить международные связи."
 syrian_economy.5.a: "Отлично, мы начинаем работу"

 syrian_economy.6.t: "Запрос из Дамаска"
 syrian_economy.6.d: "Сирийское правительство направило нам официальный запрос. Они просят наше совместное предприятие «Союзнефтегаз» предоставить экспертов, оборудование и капитал для масштабных сейсмических исследований и разведочного бурения на их средиземноморском шельфе у побережья Латакии.\n\nСирийцы ссылаются на старые соглашения и заверяют нас, что новые геологические данные дают надежду на успех. Для нас это возможность укрепить наше влияние в стратегически важном регионе и получить долю в потенциальных ресурсах. Однако проект потребует значительных первоначальных инвестиций с неопределённым результатом."
 syrian_economy.6.a: "Подписать контракт"
 syrian_economy.6.b: "Отклонить предложение"

 syrian_economy.7.t: "«Союзнефтегаз» даёт зелёный свет"
 syrian_economy.7.d: "Наши российские и белорусские партнёры по «Союзнефтегазу» согласились! Контракт подписан, и первые суда с оборудованием уже направляются в порт Латакии.\n\nСпециалисты компании предупреждают, что сбор и анализ сейсмических данных, а также само бурение займут немало времени - около года. Мы должны быть терпеливы. Весь регион сейчас наблюдает, сможем ли мы раскрыть наше море, как это сделал Израиль со своим «Левиафаном»."
 syrian_economy.7.a: "Отличные новости! Мы будем ждать результатов"

 syrian_economy.8.t: "Газ на шельфе!"
 syrian_economy.8.d: "Ожидание того стоило! После месяцев кропотливой работы «Союзнефтегаз» сообщает обнадеживающие новости: разведочное бурение на блоке 12 подтвердило значительные залежи природного газа.\n\nХотя это пока и не колоссальные объёмы, открытие коммерчески жизнеспособного месторождения является прорывом. Оно доказывает потенциал нашего шельфа и может стать краеугольным камнем для будущей энергетической независимости и экспорта. Теперь мы должны решить, как развивать добычу."
 syrian_economy.8.a: "Будущее Сирии становится ярче!"

 syrian_economy.9.t: "[FROM.GetName] запрашивает облегчение долгового бремени"
 syrian_economy.9.d: "[FROM.GetName] попросил нас предоставить финансовую помощь, чтобы помочь [FROM.GetName] снизить бремя задолженности."
 syrian_economy.9.a: "Предоставить ограниченную помощь по долгам"
 syrian_economy.9.b: "Отказать в финансовой поддержке"

 syrian_economy.10.t: "Помощь по долгам предоставлена"
 syrian_economy.10.d: "[FROM.GetName] согласился предоставить нам ограниченную финансовую поддержку, помогая снизить наше долговое бремя."
 syrian_economy.10.a: "Принять поддержку"

 syrian_economy.11.t: "Запрос отклонён"
 syrian_economy.11.d: "[FROM.GetName] отказался предоставить помощь, настаивая на том, что фискальная дисциплина и внутренние реформы должны иметь приоритет."
 syrian_economy.11.a: "Мы справимся сами"

 syrian_economy.12.t: "Аниме-инициатива"
 syrian_economy.12.d: "На ваш стол легло предложение от дальновидного, если несколько эксцентричного, министерства. Они утверждают, что развитие отечественной анимационной индустрии, вдохновлённой мировым феноменом «аниме», может стать мощным инструментом культурного экспорта, занятости молодёжи и «мягкой силы». Критики насмехаются над этой идеей, называя её ребяческим отвлечением от серьёзного дела восстановления и промышленного обновления."
 syrian_economy.12.a: "Мы найдём свой собственный стиль."
 syrian_economy.12.b: "У китайцев вообще есть аниме?"
 syrian_economy.12.c: "Искать опыт у источника: Японии."

 syrian_economy.13.t: "Бум аниме-индустрии"
 syrian_economy.13.d: "Благодаря масштабным инвестициям в цифровизацию мы сформировали собственную уважаемую анимационную индустрию, создающую заметные работы, получившие популярность как внутри страны, так и за рубежом. Мы показали миру творческий потенциал нашего народа и нашу уникальную эстетику."
 syrian_economy.13.a: "Сделано в Сирии"

 syrian_economy.14.t: "Сирийское аниме"
 syrian_economy.14.d: "Сирия обратилась к нам с необычным предложением о совместном культурном проекте: создании анимационной студии. Это может быть экономически эффективным способом увеличить наше влияние."
 syrian_economy.14.a: "Профинансировать партнёрство"
 syrian_economy.14.b: "Отказаться"

 syrian_economy.15.t: "Бум аниме-индустрии"
 syrian_economy.15.d: "Мы создали мощную анимационную индустрию. Благодаря сотрудничеству наших студий с Китаем и активной цифровой поддержке многие примечательные работы достигли широкой аудитории как внутри страны, так и за рубежом."
 syrian_economy.15.a: "Китайско-сирийская история успеха"

 syrian_economy.16.t: "Аниме-проект отклонён"
 syrian_economy.16.d: "[FROM.GetName] отклонил наше предложение о совместном анимационном предприятии. Теперь мы должны решить будущее проекта в одиночку."
 syrian_economy.16.a: "Отказаться от идеи. Оно того не стоит."

 syrian_economy.17.t: "Сирийское предложение о сотрудничестве в области аниме"
 syrian_economy.17.d: "Сирия обратилась к нам с просьбой о наставничестве для создания собственной анимационной индустрии. Они также ухаживают за китайцами для аналогичного проекта. Согласие укрепит наше культурное лидерство и лишит нашего регионального соперника победы в «мягкой силе», но потребует финансовых обязательств."
 syrian_economy.17.a: "Отправить наставников и поделиться опытом"
 syrian_economy.17.b: "Вежливо отказаться"

 syrian_economy.18.t: "Бум аниме-индустрии"
 syrian_economy.18.d: "Мы создали мощную анимационную индустрию. Благодаря сотрудничеству наших студий с Японией и активной цифровой поддержке многие примечательные работы достигли широкой аудитории как внутри страны, так и за рубежом."
 syrian_economy.18.a: "Чёртовы виабу теперь будут везде"

 syrian_economy.19.t: "Предложение о проходе друзов"
 syrian_economy.19.d: "Было выдвинуто предложение разрешить друзским гражданским лицам проходить через Голанские высоты при контролируемых условиях. Хотя такой шаг может улучшить региональную стабильность и укрепить связи, он также несёт политические риски и может вызвать оппозицию внутри страны."
 syrian_economy.19.a: "Одобрить проход"
 syrian_economy.19.b: "Отклонить предложение"

 syrian_economy.20.t: "Проход одобрен"
 syrian_economy.20.d: "Соглашение было принято, что позволяет друзским гражданским лицам передвигаться через Голанские высоты. Этот шаг улучшает взаимное доверие и открывает дверь для дальнейшего сотрудничества, хотя напряжённость остаётся под поверхностью."
 syrian_economy.20.a: "Шаг к стабильности"

 syrian_economy.21.t: "Проход отклонён"
 syrian_economy.21.d: "Предложение было отклонено, что остановило любое потенциальное сотрудничество по поводу прохода друзов. Отношения остаются напряжёнными, и возможность построения доверия была упущена."
 syrian_economy.21.a: "Мы не можем этого допустить"

 syrian_economy.22.t: "Программа экономической поддержки"
 syrian_economy.22.d: "Правительство должно решить, как распределить экономическую поддержку по регионам. Инвестиции могут стабилизировать ключевые районы и улучшить инфраструктуру, но ресурсы ограничены, и необходимо учитывать политические последствия."
 syrian_economy.22.a: "Инвестировать активно"
 syrian_economy.22.b: "Предоставить ограниченную поддержку"

 syrian_economy.23.t: "Выбрать приоритетный сектор"
 syrian_economy.23.d: "Имея ограниченные ресурсы, правительство должно определить приоритетный сектор для развития. Стратегические инвестиции могут ускорить восстановление, но сосредоточение на одной области означает, что другие будут упущены."
 syrian_economy.23.a: "Инвестировать в энергетическую инфраструктуру"
 syrian_economy.23.b: "Поддержать гражданскую промышленность"

 syrian_economy.24.t: "Запрос о ядерной помощи от [FROM.GetName]"
 syrian_economy.24.d: "[FROM.GetName] обратился к нам с просьбой о помощи в их ядерной программе. Они ищут наш опыт, технологии и материалы, предлагая финансовую компенсацию взамен.\n\nЭто сотрудничество значительно увеличит наше влияние в Сирии, но может привлечь международное внимание."
 syrian_economy.24.a: "Согласиться помочь [FROM.GetName]"
 syrian_economy.24.b: "Отказать в их просьбе"

 syrian_economy.25.t: "Ядерная помощь получена"
 syrian_economy.25.d: "[FROM.GetName] согласился предоставить ядерную помощь нашей программе! Это знаменует собой крупный прорыв в нашем научном развитии.\n\nИх сотрудничество значительно ускорит наши ядерные исследования, хотя мы должны оставаться осторожными в отношении этой договорённости."
 syrian_economy.25.a: "Отлично! Наша ядерная программа продвигается."

 syrian_economy.26.t: "Ядерная помощь отклонена"
 syrian_economy.26.d: "[FROM.GetName] отклонил нашу просьбу о ядерной помощи. Их правительство сослалось на «международные обязательства» и «проблемы нераспространения» в качестве причин для отказа."
 syrian_economy.26.a: "Мы найдём другой путь."

 syrian_economy.27.t: "Реформа строительного сектора"
 syrian_economy.27.d: "Фрагментация и неэффективность сотен частных подрядчиков стали тормозом для национального развития. Правительство готовит масштабные изменения, чтобы навести порядок в этой ключевой отрасли. На рассмотрении находятся два взаимоисключающих проекта: радикальная национализация или создание регулируемого государством альянса. Наш выбор определит будущее сирийского строительного сектора на десятилетия вперёд."
 syrian_economy.27.a: "Национализировать и централизовать!"
 syrian_economy.27.b: "Создать регулируемый государством альянс"

 syrian_economy.28.t: "Сирия предлагает соглашение о торговле фосфатами"
 syrian_economy.28.d: "Сирия предложила предоставить нам значительное количество фосфатных удобрений из своих национальных запасов. Этот стратегический ресурс может значительно повысить нашу сельскохозяйственную производительность."
 syrian_economy.28.a: "Договориться о поставке фосфатов"
 syrian_economy.28.b: "Отклонить торговое предложение"

 syrian_economy.29.t: "[FROM.GetName] соглашается на сделку по фосфатам"
 syrian_economy.29.d: "[FROM.GetName] принял наше торговое предложение! Этот долгосрочный контракт на экспорт наших фосфатов обеспечит стабильный приток иностранного капитала и укрепит наше экономическое положение."
 syrian_economy.29.a: "Победа для нашей экономики"

 syrian_economy.30.t: "[FROM.GetName] отвергает наши ресурсы"
 syrian_economy.30.d: "[FROM.GetName] отклонил наше предложение, не сумев оценить качество и стратегическую ценность сирийских фосфатов. Их потеря станет приобретением другой страны."
 syrian_economy.30.a: "Их ошибка"

 syrian_diplomacy.1.t: "Финансировать мечети в Сирии"
 syrian_diplomacy.1.d: "Сирия попросила нас профинансировать строительство мечетей и медресе на их территории. В обмен они предоставят нам значительное влияние на их религиозные институты. Это представляет собой заметную возможность расширить наше религиозное и культурное влияние в регионе."
 syrian_diplomacy.1.a: "Хранитель одобряет"
 syrian_diplomacy.1.b: "Отказаться"

 syrian_diplomacy.2.t: "Эр-Рияд принимает наше предложение"
 syrian_diplomacy.2.d: "[FROM.GetName] согласился финансировать наши религиозные институты. Хотя это поможет стабильности и нашей экономике, это формально предоставляет им растущее влияние в нашей стране, что может обеспокоить некоторых из наших союзников."
 syrian_diplomacy.2.a: "Да укрепится умма"

 syrian_diplomacy.3.t: "Отказ из Эр-Рияда"
 syrian_diplomacy.3.d: "[FROM.GetName] отклонил наше предложение о финансировании. Теперь мы должны найти другие средства для развития нашей религиозной инфраструктуры или искать других спонсоров."
 syrian_diplomacy.3.a: "Да будет так"

 syrian_diplomacy.4.t: "Сирийские нефтяные инвестиции"
 syrian_diplomacy.4.d: "Сирия запрашивает наши инвестиции для модернизации их нефтяной промышленности. В обмен они предлагают нам значительное влияние над этим критическим сектором, позволяя нам формировать его развитие и обеспечивать наши долгосрочные энергетические интересы в регионе."
 syrian_diplomacy.4.a: "Инвестировать. Расширить наше влияние"
 syrian_diplomacy.4.b: "Отклонить. Затраты слишком высоки"

 syrian_diplomacy.5.t: "Инвестиции обеспечены"
 syrian_diplomacy.5.d: "Саудовцы согласились инвестировать значительные средства в нашу нефтяную инфраструктуру. Приток капитала и опыта значительно повысит наши производственные мощности. Хотя это предоставляет им значительное экономическое влияние, это необходимый шаг для оживления этого жизненно важного сектора нашей экономики."
 syrian_diplomacy.5.a: "Наша промышленность будет процветать"

 syrian_diplomacy.6.t: "Прибыльное предложение из Дамаска"
 syrian_diplomacy.6.d: "Сирийское правительство представило нам смелый и тайный план. Они предлагают стать ключевым транзитным узлом для нашего экспорта нефти, создав специальный контрабандный маршрут через свою территорию, чтобы обойти удушающие международные санкции. Взамен они просят значительную долю прибыли и более глубокое политическое согласование. Хотя это обещает огромный доход и укрепляет «Ось Баас», принятие будет рассматриваться как прямой вызов американскому авторитету в регионе."
 syrian_diplomacy.6.a: "Наша взаимная выгода перевешивает риски"
 syrian_diplomacy.6.b: "Мы не можем позволить себе ещё больше антагонизировать американцев"

 syrian_diplomacy.7.t: "Багдад соглашается на нефтяную схему"
 syrian_diplomacy.7.d: "Иракское руководство приняло наше предложение. Тайная инфраструктура для перенаправления их нефти будет создана немедленно. Эта сделка гарантирует нам устойчивый поток богатства и цементирует мощный экономический альянс, делая нас незаменимыми для Багдада. Однако наша разведка сообщает, что Вашингтон уже знает о переговорах. Наши отношения с Соединёнными Штатами резко ухудшатся, и мы должны подготовиться к дипломатическим и экономическим ответным мерам."
 syrian_diplomacy.7.a: "Богатство и влияние стоят американского презрения"

 syrian_diplomacy.8.t: "Ирак отклоняет план контрабанды"
 syrian_diplomacy.8.d: "Ссылаясь на давление со стороны Вашингтона и опасения новых санкций, иракское правительство официально отклонило наше предложение о совместной операции по контрабанде нефти. Это значительная неудача для наших планов по созданию независимого экономического блока и проявление слабости со стороны Багдада. Наши отношения с Ираком значительно охладились из-за этого отказа."
 syrian_diplomacy.8.a: "Недальновидное решение слабого режима"

 syrian_diplomacy.9.t: "Дипломатическое предложение из Дамаска"
 syrian_diplomacy.9.d: "Сирия стремится поднять наши отношения выше торговли, предлагая полностью восстановить политические связи с встречами на высшем уровне и совместными консультациями по безопасности. Этот шаг вновь интегрирует Дамаск в арабский мир под нашим спонсорством, но может осложнить наши отношения с другими региональными и международными державами."
 syrian_diplomacy.9.a: "Принять альянс. Сильная Сирия укрепляет арабский мир."
 syrian_diplomacy.9.b: "Сейчас не время. Мы должны сохранить наши текущие балансы."

 syrian_diplomacy.10.t: "Каир вновь открывает свои двери"
 syrian_diplomacy.10.d: "Египет принял наше предложение. Посольства будут восстановлены в полном объёме, и согласован график президентских визитов. Это публичное политическое одобрение со стороны самой населённой арабской нации является монументальной победой для нашей легитимности. Это открывает путь к преференциальному доступу на египетские рынки, опыту и, возможно, даже к военному сотрудничеству."
 syrian_diplomacy.10.a: "Отлично!"

 syrian_diplomacy.11.t: "Холодный приём из Каира"
 syrian_diplomacy.11.d: "Несмотря на наши экономические жесты, египетское правительство отказалось повышать наши политические связи. Их сообщение, хотя и вежливое, ссылается на «региональные сложности» и «существующие обязательства» как на барьеры. Ясно, что внешнее давление и желание не расстраивать существующий порядок перевесили призыв к арабской солидарности. Этот отказ является дипломатической неудачей, ещё больше изолирующей нас и доказывающей, что экономический рычаг сам по себе не может купить политическую лояльность."
 syrian_diplomacy.11.a: "Их близорукость будет помнить"

 syrian_diplomacy.12.t: "Призыв к египетскому капиталу"
 syrian_diplomacy.12.d: "Основываясь на наших обновлённых политических связях, Дамаск делает прямое экономическое предложение. Они официально приглашают египетские государственные фонды и частные корпорации стать основными иностранными инвесторами в их экономику, предлагая привилегированный доступ и благоприятные условия в различных секторах."
 syrian_diplomacy.12.a: "Воспользоваться возможностью"
 syrian_diplomacy.12.b: "Риски слишком велики"

 syrian_diplomacy.13.t: "Египетский капитал обеспечен"
 syrian_diplomacy.13.d: "Каир принял наше предложение. Первые транши египетских инвестиций выделяются, и подписываются соглашения о совместных предприятиях. Мы успешно привязали будущее египетской экономики к успеху нашего проекта."
 syrian_diplomacy.13.a: "Начинается новая эра процветания"

 syrian_diplomacy.14.t: "Предложение об инвестициях отклонено"
 syrian_diplomacy.14.d: "Египетское правительство, ссылаясь на экономическую осторожность и внешнее давление, официально отказалось стать инвестором. Этот отказ лишает нас важного источника капитала и сигнализирует о пределах политической доброй воли без конкретных экономических стимулов."
 syrian_diplomacy.14.a: "Неудача, но не конец"

 syrian_diplomacy.15.t: "Предложение о тайном воздушном сотрудничестве"
 syrian_diplomacy.15.d: "Дамаск, используя наше обновлённое партнёрство, представил смелый план тайного военного сотрудничества. Они предлагают создать секретную программу обучения, в рамках которой сирийские пилоты и наземные экипажи будут обучаться на наших удалённых авиабазах под видом совместных антитеррористических учений. Это значительно повысит их воздушные возможности и создаст кадр персонала, лояльного обеим нашим странам."
 syrian_diplomacy.15.a: "Их сила становится нашей силой"
 syrian_diplomacy.15.b: "Отклонить запрос"

 syrian_diplomacy.16.t: "Египет даёт зелёный свет секретной программе"
 syrian_diplomacy.16.d: "Каир согласился на наше тайное предложение. Первая группа наших офицеров была дискретно отправлена на египетские учебные объекты. Эта программа обещает быстро обновить опыт наших ВВС в области современных тактик и процедур технического обслуживания, давая нам качественное преимущество, которого наши враги не ожидают. Наш союз с Египтом теперь перешёл из области политики и экономики в сферу истинного военного партнёрства."
 syrian_diplomacy.16.a: "Наши пилоты скоро станут одними из лучших"

 syrian_diplomacy.17.t: "Запрос на военную подготовку отклонён"
 syrian_diplomacy.17.d: "Несмотря на наше политическое и экономическое сближение, египетское военное командование наложило вето на предложенную тайную программу обучения. Ссылаясь на «оперативную безопасность» и «региональную чувствительность», они дали понять, что их отношения с западными державами не позволяют им вступать в такое провокационное военное взаимодействие с нами. Этот отказ является отрезвляющим напоминанием о пределах нашего дипломатического охвата и оставляет наши ВВС восстанавливать свою доблесть более медленными, внутренними средствами."
 syrian_diplomacy.17.a: "Их осторожность - наша неудача"

 syrian_diplomacy.18.t: "Предложение о совместных воздушных учениях от [FROM.GetName]"
 syrian_diplomacy.18.d: "Правительство [FROM.GetAdjective] официально предложило провести серию совместных учений ВВС, предложив воздушное пространство рядом с нашей базой на Кипре в качестве подходящего места. Они утверждают, что это будет ценной возможностью для их пилотов тренироваться вместе с современными ВВС и способствовать более тесным военным связям."
 syrian_diplomacy.18.a: "Принять предложение"
 syrian_diplomacy.18.b: "Отклонить предложение"

 syrian_diplomacy.19.t: "[FROM.GetName] принимает предложение об учениях"
 syrian_diplomacy.19.d: "Правительство [FROM.GetAdjective] согласилось в принципе на наше предложение о совместных воздушных учениях. Планирование манёвров, которые, вероятно, состоятся в Восточном Средиземноморье, теперь может начаться. Это важный шаг в углублении нашего военного сотрудничества."
 syrian_diplomacy.19.a: "Успех нашей дипломатии"

 syrian_diplomacy.20.t: "[FROM.GetName] отклоняет предложение об учениях"
 syrian_diplomacy.20.d: "Мы получили официальный ответ из Лондона. [FROM.GetName] вежливо отклонил наше предложение о совместных воздушных учениях в настоящее время, ссылаясь на конфликты в расписании и предыдущие обязательства."
 syrian_diplomacy.20.a: "Плохо"

 syrian_diplomacy.21.t: "Запрос об экономических инвестициях"
 syrian_diplomacy.21.d: "Правительство Сирии обратилось к нам с подробным предложением о крупных экономических инвестициях. Хотя это предложение обещает прибыльные контракты для нашей промышленности и будет тепло встречено нашим финансовым сектором, его стратегическое одобрение также создаст долгосрочное экономическое согласование, делая Дамаск всё более зависимым от наших рынков и опыта."
 syrian_diplomacy.21.a: "Одобрить инвестиции"
 syrian_diplomacy.21.b: "Отклонить запрос"

 syrian_diplomacy.22.t: "[FROM.GetName] даёт зелёный свет инвестиционному пакету"
 syrian_diplomacy.22.d: "Мы получили официальное подтверждение от [FROM.GetName]. Соглашение, одно из крупнейших в своём роде для нашей страны, направит значительный капитал в нашу экономику в течение следующих нескольких лет. Это знаменует собой преобразующее обязательство в отношении нашего экономического будущего и мощное углубление наших двусторонних связей."
 syrian_diplomacy.22.a: "Начинается новая глава развития"

 syrian_diplomacy.25.t: "Сирийско-иранский совместный финансовый институт"
 syrian_diplomacy.25.d: "Смелым шагом, чтобы обойти западное финансовое доминирование, сирийское правительство официально предложило создание совместного сирийско-иранского банковского учреждения. Эта структура будет работать вне системы SWIFT, облегчая торговлю в местных валютах и обеспечивая финансовую поддержку, изолированную от международных санкций. Для Ирана это представляет возможность расширить охват своей модели «экономики сопротивления» и создать прочное финансовое партнёрство в сердце Оси сопротивления."
 syrian_diplomacy.25.a: "Это краеугольный камень нашей экономической независимости"
 syrian_diplomacy.25.b: "Риски слишком велики"

 syrian_diplomacy.26.t: "Тегеран одобряет совместную банковскую инициативу"
 syrian_diplomacy.26.d: "Исламская Республика с энтузиазмом поддержала наше финансовое предложение. С иранским капиталом и опытом наш совместный банк начнёт работу в Дамаске и Тегеране. Это учреждение будет не только обрабатывать двустороннюю торговлю в риалах и фунтах, полностью обходя доллар, но и финансировать стратегические инфраструктурные и военно-промышленные проекты, критически важные для нашей коллективной обороны. Наша экономическая независимость больше не является устремлением, а быстро материализующейся реальностью."
 syrian_diplomacy.26.a: "Финансовая крепость построена"

 syrian_diplomacy.27.t: "Иран отклоняет банковский союз"
 syrian_diplomacy.27.d: "После тщательного рассмотрения наши иранские партнёры сообщили о своём отказе от создания формального совместного банковского учреждения в настоящее время. Выражая солидарность, они ссылаются на опасения по поводу провоцирования дальнейших, более суровых санкций со стороны западных держав и технические проблемы создания стабильной альтернативной финансовой архитектуры с нуля. Это решение оставляет нашу экономическую стратегию зависимой от существующих, более уязвимых каналов и представляет собой значительную неудачу в нашем стремлении к полной финансовой автономии от Запада."
 syrian_diplomacy.27.a: "Дерьмо!"

 syrian_diplomacy.28.t: "Атака РПК при поддержке Сирии"
 syrian_diplomacy.28.d: "Боевики Рабочей партии Курдистана совершили крупную атаку на нашу инфраструктуру на юго-востоке, сильно повредив несколько ключевых объектов и военных аванпостов. Наши разведывательные службы получили неопровержимые доказательства того, что сирийское правительство предоставило боевикам оружие, финансирование и оперативную разведку для этого нападения. Это представляет собой значительную эскалацию и прямую угрозу нашей национальной безопасности."
 syrian_diplomacy.28.a: "Сирия заплатит за это!"

 syrian_diplomacy.29.t: "Предложение о стратегическом партнёрстве"
 syrian_diplomacy.29.d: "Дамаск направил конфиденциальное предложение в Ереван. Они стремятся установить формальный пакт о военном сотрудничестве, включающий взаимный военный доступ и совместные учения. Для Сирии союз с Арменией будет означать дипломатический прорыв и символически жизненно важную трещину в их окружении. Для Армении это рискованная ставка: предложение руки помощи собрату по нации, находящейся под давлением, может создать прочное партнёрство, но рискует вызвать гнев региональных держав и осложнить её собственный хрупкий внешнеполитический баланс."
 syrian_diplomacy.29.a: "Наши борьбы переплетены"
 syrian_diplomacy.29.b: "Риски перевешивают выгоды"

 syrian_diplomacy.30.t: "Ереван принимает пакт"
 syrian_diplomacy.30.d: "Армения согласилась на наше предложение. Соглашение о взаимном военном доступе и сотрудничестве подписано, создавая неожиданную ось между Южным Кавказом и Левантом. Хотя их армия невелика, это партнёрство предоставляет нам законного союзника из числа государств помимо Ирана и России, символическую победу над нашей изоляцией. Для Армении это предоставляет стратегический выход к Средиземному морю и партнёра, который понимает реальность затяжного конфликта и суверенитета под угрозой."
 syrian_diplomacy.30.a: "Мост построен"

 syrian_diplomacy.31.t: "Дверь закрыта в Ереване"
 syrian_diplomacy.31.d: "Армянское правительство направило осторожный, но определённый отказ. Ссылаясь на «сложную геометрию региональной политики» и «существующие многосторонние обязательства», они отказались оформлять военное партнёрство в настоящее время. Сообщение ясно: даже для нации, сталкивающейся с собственными экзистенциальными вызовами, открытое согласование с Дамаском рассматривается как шаг слишком далёкий, обязательство, которое может поставить под угрозу их другие отношения. Наше предложение солидарности между осаждёнными нациями было взвешено и признано недостаточным."
 syrian_diplomacy.31.a: "Их прагматизм - наша изоляция"

 syrian_diplomacy.32.t: "Проект «Маленькая Святая София»"
 syrian_diplomacy.32.d: "Сирийское правительство направило нам подробное и символическое предложение. Они хотят построить точную копию Святой Софии в городе Эль-Сукайлабия. Для них это гораздо больше, чем церковь; это памятник, призванный бросить вызов превращению оригинала Турцией и укрепить их идентичность как бастиона восточного православия в Леванте. У них не хватает средств и технического опыта для реализации этого амбициозного проекта в одиночку, и они официально запрашивают нашу финансовую и логистическую поддержку для его строительства. Согласие будет глубоким политическим заявлением о нашем союзе."
 syrian_diplomacy.32.a: "Профинансировать этот символический памятник"
 syrian_diplomacy.32.b: "Наши ресурсы нужны в другом месте"

 syrian_diplomacy.33.t: "Основание заложено"
 syrian_diplomacy.33.d: "Последний камень заложен в Эль-Сукайлабия. Эта «Маленькая Святая София» теперь стоит завершённая - совершенная копия по форме, но мощное опровержение по смыслу. Её купола и мозаика - прямой вызов притязаниям Анкары на христианское наследие, а само её существование - памятник союзу с Москвой, который воплотил её в жизнь. Это больше, чем церковь; это флаг из мрамора, заявляющий, что наша история, наша вера и наш суверенитет не могут быть стёрты."
 syrian_diplomacy.33.a: "Памятник на века"

 syrian_diplomacy.34.t: "Предложение из Дамаска"
 syrian_diplomacy.34.d: "Сирийское правительство сделало стратегическое предложение. Они предлагают формальный военный пакт: Иран предоставит прямую военную поддержку, включая оружие и войска, для укрепления Сирийской армии. Взамен Сирия создаст и гарантирует безопасный наземный коридор снабжения через свою территорию, обеспечивая надёжный поток иранской поддержки «Хезболле». Это значительно укрепит наше взаимное положение в регионе."
 syrian_diplomacy.34.a: "Принять пакт"
 syrian_diplomacy.34.b: "Отклонить предложение"

 syrian_diplomacy.35.t: "Иран принимает наше предложение"
 syrian_diplomacy.35.d: "Тегеран согласился на наш предложенный военный пакт. Развёртывание иранских боевых частей и поставки оружия вскоре усилят наши линии фронта. В соответствии с нашим соглашением, мы начали создавать безопасный коридор снабжения для облегчения иранской поддержки «Хезболлы». Это знаменует собой значительное углубление нашего стратегического союза."
 syrian_diplomacy.35.a: "Ось выкована"

 syrian_diplomacy.36.t: "Иран отклоняет наше предложение"
 syrian_diplomacy.36.d: "Наше амбициозное предложение о военном пакте было отклонено Тегераном. Обещанные подкрепления и оружие не поступят, и планы совместного коридора снабжения отложены. Этот отказ является дипломатической неудачей и упущенной возможностью решительно изменить стратегический баланс в нашу пользу."
 syrian_diplomacy.36.a: "Разочаровывающий результат"

 syrian_diplomacy.37.t: "Военный колледж КСИР"
 syrian_diplomacy.37.d: "Сирийское командование обратилось к нам с важным запросом. Они стремятся официально институционализировать нашу роль военных советников, создав постоянный филиал Университета командования и штаба КСИР на своей территории."
 syrian_diplomacy.37.a: "Профинансировать колледж и отправить наших лучших инструкторов"
 syrian_diplomacy.37.b: "Наши ресурсы нужны в другом месте"

 syrian_diplomacy.38.t: "Иран создаёт военный колледж"
 syrian_diplomacy.38.d: "С нашего одобрения советники Корпуса стражей исламской революции Ирана прибыли, чтобы основать новое военное учреждение. Созданный по образцу собственного Университета командования и штаба КСИР, этот колледж будет сосредоточен на подготовке штабных офицеров в области сложных, нетрадиционных военных доктрин, определяющих военную мысль Ирана."
 syrian_diplomacy.38.a: "Начинается новая эра военного сотрудничества"

 syrian_diplomacy.39.t: "Помощь в киберзащите"
 syrian_diplomacy.39.d: "Наши союзники в Дамаске направили срочный и подробный запрос. Их службы безопасности стремятся модернизировать свою киберзащиту и внутреннюю безопасность для противодействия возникающим угрозам. Они просят наш технический опыт и финансовую поддержку для приобретения передовых систем наблюдения, защищённых коммуникационных сетей и оборудования для анализа данных. Это будет представлять собой серьёзное обновление их возможностей, ещё больше переплетая наши разведывательные аппараты."
 syrian_diplomacy.39.a: "Удовлетворить их запрос и профинансировать проект"
 syrian_diplomacy.39.b: "Наши собственные приоритеты должны быть на первом месте"

 syrian_diplomacy.40.t: "Достигнуто соглашение о средствах безопасности"
 syrian_diplomacy.40.d: "Иран согласился на наш запрос о закупках. Был заключён контракт на продажу и установку передовых систем кибербезопасности, защищённого коммуникационного оборудования и инфраструктуры анализа данных. Иранские технические советники будут контролировать развёртывание для обеспечения операционной совместимости с их системами."
 syrian_diplomacy.40.a: "Стратегическая сделка"

 syrian_diplomacy.41.t: "Сирийский запрос на оружие и лицензии"
 syrian_diplomacy.41.d: "Дамаск сделал прямой и существенный запрос о военной помощи. Они стремятся приобрести современное вооружение - включая основные боевые танки, стрелковое оружие - а также производственные лицензии для укрепления своей внутренней оборонной промышленности. Этот шаг сигнализирует о желании Сирии диверсифицировать источники военной техники и потенциально согласовать свои технические стандарты ближе к нашим, предлагая значительную стратегическую возможность в регионе, хотя и со значительными политическими рисками."
 syrian_diplomacy.41.a: "Одобрить передачу"
 syrian_diplomacy.41.b: "Отклонить запрос"

 syrian_diplomacy.42.t: "Франция одобряет военное сотрудничество"
 syrian_diplomacy.42.d: "Париж дал своё условное одобрение. Был заключён контракт на поставку французского военного оборудования и соответствующих производственных лицензий. Хотя первая партия может быть ограничена и состоять из старых моделей, она представляет собой важный приток современных технологий и формализованное военно-промышленное партнёрство. Французские технические советники будут контролировать процесс обучения и интеграции."
 syrian_diplomacy.42.a: "Возможности нашей армии совершат скачок вперёд"

 syrian_diplomacy.43.t: "Сирийский запрос на российское оружие"
 syrian_diplomacy.43.d: "Наши контакты в Дамаске передали значительный запрос на закупку военной техники. Сирия стремится приобрести значительное количество надёжного российского стрелкового оружия и основных боевых танков, в частности модели Т-72Б, а также соответствующие производственные лицензии. Это предложение представляет собой явную попытку углубить их зависимость от нашего военно-промышленного комплекса и укрепить давнее стратегическое партнёрство, предлагая нам ключевой рычаг влияния на Ближнем Востоке при относительно низких финансовых затратах."
 syrian_diplomacy.43.a: "Одобрить передачу"
 syrian_diplomacy.43.b: "Отклонить запрос"

 syrian_diplomacy.44.t: "Россия одобряет военную помощь"
 syrian_diplomacy.44.d: "Москва согласилась на нашу просьбу. Партия российского стрелкового оружия и танков Т-72Б готовится, сопровождаемая лицензиями на внутреннее производство. Этот приток надёжной, проверенной в боях техники советской эпохи значительно модернизирует наши бронетанковые силы и укрепит наши оборонительные возможности в рамках нашего прочного стратегического партнёрства."
 syrian_diplomacy.44.a: "Наш бронированный кулак становится сильнее"

 syrian_diplomacy.45.t: "Запрос Сирии на закупку вооружений"
 syrian_diplomacy.45.d: "Сирийское правительство представило официальный запрос о помощи в приобретении передового военного оборудования. Они конкретно ищут высококачественное американское стрелковое оружие и противотанковые системы и предлагают использовать наши установленные глобальные закупочные и логистические сети для облегчения передачи. Эта договорённость предлагает нам прибыльную комиссию за брокерские услуги и возможность значительно углубить наше стратегическое влияние в Дамаске."
 syrian_diplomacy.45.a: "Способствовать передаче"
 syrian_diplomacy.45.b: "Отклонить предложение"

 syrian_diplomacy.46.t: "Передовое вооружение получено через ОАЭ"
 syrian_diplomacy.46.d: "Наш канал закупок через Объединённые Арабские Эмираты сработал. Прибыла партия современного западного стрелкового оружия и передовых противотанковых систем. Это высококачественное оборудование обеспечит заметное улучшение боевой эффективности наших передовых подразделений."
 syrian_diplomacy.46.a: "Значительное улучшение для наших возможностей"

 syrian_diplomacy.47.t: "Стратегический выбор для базы Тартус"
 syrian_diplomacy.47.d: "Порт Тартус - наше самое ценное стратегическое достояние на Средиземном море. Чтобы обеспечить будущее нашей страны, мы должны выбрать, какой могущественный союзник предоставит долгосрочные права на базирование. Это решение определит нашу внешнюю политику на поколение, предлагая огромные выгоды, но также связывая нашу судьбу тесно с амбициями нашего выбранного партнёра в регионе."
 syrian_diplomacy.47.a: "Предложить Тартус России"
 syrian_diplomacy.47.b: "Предложить Тартус ОАЭ"

 syrian_diplomacy.48.t: "Военная база в Тартусе"
 syrian_diplomacy.48.d: "[FROM.GetNameDef] официально предложил предоставить нам долгосрочные права на базирование в стратегическом порту Тартус. В обмен на значительный финансовый вклад мы обеспечим постоянное средиземноморское присутствие, значительно улучшая наше проецирование силы и влияние в Леванте. Эта сделка представляет собой крупную стратегическую возможность."
 syrian_diplomacy.48.a: "Принять"
 syrian_diplomacy.48.b: "Отклонить"

 syrian_diplomacy.49.t: "[FROM.GetNameDef] принимает предложение о Тартусе"
 syrian_diplomacy.49.d: "Наше предложение было принято. [FROM.GetName] согласился на финансовые условия и начнёт создавать постоянное военное присутствие в Тартусе. В дополнение к значительным средствам, теперь находящимся в нашем распоряжении, это соглашение цементирует мощный, долгосрочный союз с ключевым игроком в регионе."
 syrian_diplomacy.49.a: "Ключевое соглашение заключено"

 syrian_diplomacy.50.t: "Экономическое партнёрство с Сирией"
 syrian_diplomacy.50.d: "Дамаск запросил крупный пакет экономической помощи и инвестиций. В обмен на значительные капитальные вложения и проекты по развитию инфраструктуры они предлагают преференциальный доступ для наших компаний и увеличение нашего политического влияния в их стране."
 syrian_diplomacy.50.a: "Одобрить партнёрство"
 syrian_diplomacy.50.b: "Отклонить"

 syrian_diplomacy.51.t: "ОАЭ одобряют экономическое партнёрство"
 syrian_diplomacy.51.d: "Объединённые Арабские Эмираты согласились на наше предложение о стратегическом экономическом партнёрстве. Существенный пакет помощи и обязательство финансировать крупные инфраструктурные проекты обеспечат немедленную ликвидность и начнут долгий процесс модернизации нашей экономики. Взамен эмиратские фирмы получат преференциальный режим в ключевых секторах."
 syrian_diplomacy.51.a: "Жизненно важный толчок для нашей экономики"

 syrian_diplomacy.52.t: "Подготовка сил специального назначения"
 syrian_diplomacy.52.d: "Дамаск сделал официальный запрос о военной помощи. Они стремятся отправить контингент своих сил специальных операций для обучения под руководством наших элитных подразделений. В обмен на это ценное обучение они предлагают укрепить дипломатические и военные связи. Для нас это представляет возможность культивировать потенциального стратегического партнёра в Восточном Средиземноморье и получить степень влияния в регионе традиционного турецкого интереса."
 syrian_diplomacy.52.a: "Согласиться обучить их силы"
 syrian_diplomacy.52.b: "Избегать ненужных осложнений"

 syrian_diplomacy.53.t: "Греция одобряет программу обучения"
 syrian_diplomacy.53.d: "Афины приняли нашу просьбу. Выбранная группа наших офицеров специальных операций пройдёт расширенную подготовку с греческими силами. Этот обмен значительно повысит профессионализм и возможности наших элитных подразделений. Кроме того, он устанавливает прямую военную связь с ключевой средиземноморской страной, потенциально предоставляя нам ценный противовес в регионе."
 syrian_diplomacy.53.a: "Наши силы специального назначения достигнут новых стандартов"

 syrian_diplomacy.54.t: "Совместные учения спецназа в районе Кипра"
 syrian_diplomacy.54.d: "Основываясь на нашем учебном сотрудничестве, Дамаск предлагает решающий следующий шаг: масштабные, заметные совместные учения между нашими подразделениями спецназа, которые будут проводиться на греческих островах, прилегающих к Кипру. Они позиционируют это как необходимую расширенную подготовку своих войск в десантных и воздушно-штурмовых операциях. Для нас это возможность проверить наши собственные элитные подразделения в реалистичном сценарии, одновременно проецируя силу и приверженность в регионе наших основных национальных интересов. Такое открытое военное присутствие будет истолковано Анкарой как серьёзная провокация, значительно усиливающая региональную напряжённость."
 syrian_diplomacy.54.a: "Одобрить учения"
 syrian_diplomacy.54.b: "Стратегические риски неприемлемы"

 syrian_diplomacy.55.t: "Зелёный свет учениям близ Кипра"
 syrian_diplomacy.55.d: "Греция разрешила совместные учения спецназа. Наши коммандос будут тренироваться вместе с их греческими коллегами в сложном, многофазном сценарии, имитирующем операции в архипелаге Восточного Средиземноморья. Этот беспрецедентный доступ к передовой подготовке стандартов НАТО значительно улучшит возможности наших элитных войск в амфибийной войне. Высокий статус этих учений также служит мощным стратегическим сигналом любым региональным противникам о нашей растущей сети военных партнёрств."
 syrian_diplomacy.55.a: "Неоценимая возможность для наших лучших войск"

 syrian_diplomacy.56.t: "Соглашение о военном сотрудничестве"
 syrian_diplomacy.56.d: "[FROM.GetNameDef] официально запросил создание рамок для военного сотрудничества и обмена разведданными. Этот шаг сигнализирует о потенциальной готовности Дамаска согласовать свою политику безопасности ближе к нашей. Принятие предоставит нам большее влияние на сирийские военные дела и предоставит нашим офицерам ценные оперативные сведения из активного театра военных действий, особенно в отношении тактики против повстанческих сил, с которыми мы оба боремся."
 syrian_diplomacy.56.a: "Принять соглашение о сотрудничестве"
 syrian_diplomacy.56.b: "Отклонить предложение"

 syrian_diplomacy.57.t: "Турция одобряет военное сотрудничество"
 syrian_diplomacy.57.d: "Анкара приняла наше предложение о стратегической военной координации. Это знаковое соглашение инициирует программу общего обмена разведданными, тактических консультаций и, вероятно, будущих совместных учений. Согласование с мощными вооружёнными силами Турции предоставляет нам значительный новый источник военного опыта и может изменить региональный расчёт безопасности в нашу пользу."
 syrian_diplomacy.57.a: "Достигнуто новое стратегическое взаимопонимание"

 syrian_diplomacy.58.t: "Совместные учения в районе Северного Кипра"
 syrian_diplomacy.58.d: "Основываясь на нашей военной координации, Дамаск предлагает смелый шаг: проведение заметных совместных учений спецназа и сил быстрого развёртывания на территориях Турецкой Республики Северного Кипра. Они представляют это как расширенную подготовку по обеспечению стратегических прибрежных зон. Для нас это представляет беспрецедентную возможность продемонстрировать силу нашего союза и укрепить наши суверенные притязания в Восточном Средиземноморье через осязаемое военное присутствие. Такой шаг будет воспринят Грецией и Республикой Кипр как прямое и серьёзное провозглашение, потенциально вызывая крупный дипломатический кризис."
 syrian_diplomacy.58.a: "Разрешить учения"
 syrian_diplomacy.58.b: "Отказаться"

 syrian_diplomacy.59.t: "Турция одобряет учения на Северном Кипре"
 syrian_diplomacy.59.d: "Турция дала зелёный свет совместным учениям на Севере. Наши силы будут тренироваться вместе с турецкими подразделениями в весьма чувствительной области, предоставляя нам редкий доступ к передовым турецким оперативным методам и безопасным передовым базам. Это партнёрство с высокими ставками не только повышает наши возможности, но и посылает недвусмысленный стратегический сигнал о нашей согласованности и нашей готовности проецировать силу вместе с ключевым региональным игроком."
 syrian_diplomacy.59.a: "Решающий шаг в нашем стратегическом партнёрстве"

 syrian_diplomacy.60.t: "Сирийское предложение: передовые базы и добровольческие силы"
 syrian_diplomacy.60.d: "Дамаск сделал весьма значительное предложение. Они предлагают разместить на своей территории постоянные турецкие передовые оперативные базы для облегчения трансграничных операций и официально запрашивают развёртывание добровольческих сил из движения «Серые волки» (Ülkü Ocakları). Эти идеологически преданные подразделения будут действовать под нашим стратегическим руководством в пределах Сирии. Эта договорённость даст нам беспрецедентный прямой военный след и мощную прокси-силу глубоко на арабской территории, фундаментально меняя региональный баланс сил. Однако это составляет де-факто военную оккупацию суверенной сирийской земли и будет рассматриваться как акт крайней агрессии международным сообществом и нашими региональными противниками."
 syrian_diplomacy.60.a: "Создать базы и отправить добровольцев"
 syrian_diplomacy.60.b: "Этот акт - слишком далёкий шаг"

 syrian_diplomacy.61.t: "Турция создаёт базы и отправляет ополченцев"
 syrian_diplomacy.61.d: "Турция приняла наше предложение в полном объёме. Строительство турецких передовых оперативных баз началось на нашей территории, и прибыли первые контингенты ополченцев «Серых волков». Эти националистические добровольцы очень мотивированы и обладают значительным опытом в иррегулярной войне. Хотя это даёт нам немедленные, мощные союзные силы на земле и цементирует ось Анкара-Дамаск, это фактически уступает часть нашего суверенитета и связывает наши военные судьбы неразрывно с региональными амбициями Турции."
 syrian_diplomacy.61.a: "Пакт заключён"

 syrian_diplomacy.62.t: "Пакт о взаимной обороне"
 syrian_diplomacy.62.d: "Дамаск предлагает формальный оборонный пакт. Его ядром является взаимная гарантия независимости, связывающая наши суверенитеты. Чтобы придать ему вес, Сирия предлагает разместить на своей территории постоянные иракские передовые оперативные базы, создавая стратегический буфер. Они также запрашивают иракских военных советников для помощи в формировании элитных совместных бригад. Это слияние создаст неразрывный оборонительный блок, но будет рассматриваться как глубокая угроза нашими врагами и уступит прямой операционный контроль сирийской территории."
 syrian_diplomacy.62.a: "Приветствовать наших братьев-баасистов"
 syrian_diplomacy.62.b: "Мы должны оставаться независимыми"

 syrian_diplomacy.63.t: "Ось Дамаск-Багдад сформирована"
 syrian_diplomacy.63.d: "Ирак официально ратифицировал наш предложенный оборонный пакт. Взаимные гарантии независимости теперь активны, юридически связывая наши государства. Планирование постоянных иракских передовых оперативных баз в восточной Сирии и интеграция баасистских боевых кадров в совместные бригады теперь могут начаться в полную силу. Этот пакт создаёт неразрывное оборонительное образование, фундаментально меняя региональный баланс сил в нашу пользу."
 syrian_diplomacy.63.a: "Приветствовать наших братьев-баасистов!"

 syrian_diplomacy.64.t: "Дамаск предлагает иррегулярную поддержку"
 syrian_diplomacy.64.d: "Наши баасистские союзники в Сирии сделали смелое предложение. Они хотят создать тайную учебную и консультативную миссию на нашей территории, чтобы значительно повысить возможности наших лоялистских и иррегулярных сил. Эта сирийская экспедиция сформирует ядро нескольких новых, высокомотивированных «добровольческих» бригад, обученных партизанской войне и асимметричной тактике. Хотя это значительно повысит нашу военную готовность и партизанский потенциал, это представляет собой глубокое иностранное влияние в нашем аппарате безопасности, которое невозможно легко отменить."
 syrian_diplomacy.64.a: "Принять их советников и сформировать бригады"
 syrian_diplomacy.64.b: "Вежливо отказаться. Наша армия должна оставаться нашей собственной"

 syrian_diplomacy.65.t: "Наш авангард пересекает границу"
 syrian_diplomacy.65.d: "Наши товарищи в Ираке приветствовали нашу братскую руку. Пакт заключён. Как мы говорим, наши самые преданные сыновья - инструкторы, советники и ядро нового боевого духа - внедряются в иракское общество. Они превратят «Сирийских добровольцев» в грозный инструмент, подтверждение концепции для нашей общей баасистской судьбы. Наше влияние теперь имеет постоянное военное выражение к востоку от Евфрата."
 syrian_diplomacy.65.a: "Пламя передано"

 syrian_diplomacy.66.t: "Невообразимое предложение"
 syrian_diplomacy.66.d: "Через самые секретные и дезавуируемые каналы режим в Дамаске послал трепет через наш стратегический расчёт. Они предлагают акт чистой реальной политики: покупку Голанских высот. Их эмиссары говорят о «прекращении вечной войны» и «выкупе за украденную землю», предлагая золото, нефть и промышленную продукцию. Это не мирный договор; это холодная, основанная на наличных транзакция, которая может перекроить карту за одну ночь. Рассматривать ли это как высший признак их слабости и воспользоваться этим, или как оскорбление каждого солдата, павшего, защищая эти стратегические высоты?"
 syrian_diplomacy.66.a: "У всего есть цена"
 syrian_diplomacy.66.b: "Эта земля не продаётся"

 syrian_diplomacy.67.t: "Они назвали свою цену"
 syrian_diplomacy.67.d: "Израильтяне согласились на переговоры. Их предварительные требования столь же ошеломляющи, сколь и точны: масштабная, немедленная передача богатства и промышленного потенциала, которая на поколение подорвёт нашу экономику. Мир увидит возвращение Голан как триумф сирийской дипломатии. Только мы будем знать, что они были куплены потом нашего народа, а не завоёваны его кровью. Пушки замолчат, и наш флаг снова взовьётся над высотами, но ценой, которая будет ощущаться в каждом сирийском доме на протяжении десятилетий."
 syrian_diplomacy.67.a: "Заплатить выкуп"

 syrian_diplomacy.68.t: "Дверь захлопнулась"
 syrian_diplomacy.68.d: "Наше историческое предложение было встречено не переговорами, а презрением. Израильское правительство отказалось, вероятно, разгласив предложение, чтобы выставить нас отчаявшимися и слабыми. Это публичное унижение - горькая пилюля, но оно также сжигает любые иллюзии о мирном решении. Мы подошли к самому краю прагматизма. Теперь мир может видеть, что только сила вернёт то, что принадлежит нам. Пусть этот отказ подстегнёт решимость нашего народа; в следующий раз, когда мы подойдём к Голанам, это будет во главе армии."
 syrian_diplomacy.68.a: "Да будет так. Путь теперь ясен"

 syrian_diplomacy.69.t: "Военная подготовка"
 syrian_diplomacy.69.d: "В шаге, сигнализирующем о глубоком сдвиге, сирийское правительство официально запросило создание рамок для совместной военной подготовки. Они стремятся отправить своих офицеров для наблюдения и участия в учениях, сосредоточенных на борьбе с терроризмом, радиоэлектронной войне и интеграции ПВО. Для нас это беспрецедентная возможность получить прямое влияние на сирийский военный аппарат, формировать его доктрину и тихо интегрировать наши тактические протоколы. Сама по себе разведывательная ценность огромна. Однако такое тесное сотрудничество с бывшим заклятым врагом не останется незамеченным нашими союзниками или нашими собственными сторонниками жесткой линии, и рискует передать передовые тактики потенциально ненадёжному партнёру."
 syrian_diplomacy.69.a: "Согласиться"
 syrian_diplomacy.69.b: "Наши методы остаются нашими собственными"

 syrian_diplomacy.70.t: "Врата открываются"
 syrian_diplomacy.70.d: "Израиль принял. Первый контингент наших старших офицеров готовится к отправке на дискретные учебные объекты. Это кульминация нашего прагматического поворота: прямой доступ к самому проверенному в боях военному опыту в регионе. Мы будем учиться, мы будем адаптироваться, и мы вернёмся, чтобы выковать более острую, более современную армию. Однако, когда наши солдаты садятся в самолёты, мы должны быть готовы к последствиям. Шёпот о предательстве уже циркулирует в офицерских клубах Каира и Эр-Рияда. Дома старая гвардия наблюдает с молчаливым презрением. Мы обменяли часть нашей революционной гордости на скачок в профессиональных возможностях. Баланс этого обмена будет написан в будущих битвах."
 syrian_diplomacy.70.a: "Пусть начнётся обучение"

 syrian_diplomacy.71.t: "Тайная рука из Дамаска"
 syrian_diplomacy.71.d: "Через канал, настолько дезавируемый, что граничит с гипотетическим, сирийский режим сделал предложение, которое переопределяет дерзость. Они предлагают создать в самом Дамаске тайный офис связи Моссада - не как противников, а как партнёров в «борьбе с терроризмом». Это предоставит нам беспрецедентный доступ к внутреннему устройству их Мухабарата, возможность формировать их разведывательные приоритеты и прямой поток из сердца арабского мира. Разведывательный переворот был бы историческим. Однако это дьявольская сделка: мы будем усиливать хрупкую диктатуру, и если этот пакт когда-либо будет раскрыт, он подтвердит каждую теорию заговора о сионистских махинациях и сожжёт наши мосты с каждым другим государством в регионе."
 syrian_diplomacy.71.a: "Создать офис связи"
 syrian_diplomacy.71.b: "Это слишком далёкий шаг"

 syrian_diplomacy.72.t: "Враг в стенах"
 syrian_diplomacy.72.d: "Они согласились. Некричащая пристройка в дамасском министерстве теперь принимает наших самых немыслимых гостей. Советники Моссада ходят по нашим коридорам, их присутствие - самый тщательно охраняемый секрет режима. Поток разведданных начался, давая нам пугающую ясность против наших врагов. Однако с каждым отчётом, который они подают, их влияние растёт. Мы обменяли часть нашего суверенитета на мощное оружие, пригласив архитектора наших прошлых поражений обучать нас тёмным искусствам. Тень этого предательства теперь нависает над режимом. Одна утечка, одно шёпотное слово Каиру или Тегерану - и этот карточный домик рухнет в огненной буре ярости, из которой мы не сможем оправиться."
 syrian_diplomacy.72.a: "Мы ходим по лезвию бритвы"

 syrian_diplomacy.73.t: "Дамаск стучится в дверь"
 syrian_diplomacy.73.d: "Вопреки всему и десятилетиям вражды, из Дамаска прибыл официальный запрос. Сирийское правительство, в ошеломляющем развороте своей основополагающей идеологии, стремится присоединиться к Авраамическим соглашениям. Они предлагают полную нормализацию, представляя её не как капитуляцию, а как стратегическую необходимость для своего выживания и восстановления. Для нас это высшая геополитическая награда: постоянно нейтрализуя нашего самого укоренившегося противника на передовой, получение плацдарма в сердце Леванта и нанесение сокрушительного удара по иранской «Оси сопротивления». Однако интеграция этого банкротского, авторитарного государства - с его грузом военных преступлений и связей с терроризмом - в нашу новую архитектуру безопасности представляет глубокие моральные и практические дилеммы."
 syrian_diplomacy.73.a: "Приветствовать их в семье"
 syrian_diplomacy.73.b: "Их режим находится за пределами искупления"

 syrian_diplomacy.74.t: "Порог пересечён"
 syrian_diplomacy.74.d: "Они приняли. Сигнал из Иерусалима, переданный через бэк-каналы, ясен. Путь к Авраамическим соглашениям открыт. Наша дерзкая авантюра окупилась в первую очередь. Мы стоим на грани достижения невообразимого: конца стратегической изоляции, источника жизненной силы инвестиций и формального конца состояния войны, которое определяло нас на протяжении поколений. Однако это лишь конец начала. Теперь мы должны пройти через гораздо более опасную фазу: управление яростной ответной реакцией со стороны Тегерана и его прокси, противостояние сейсмическому шоку в наших собственных структурах власти и подготовку к подписанию документов, которые навсегда переопределят то, что значит быть Сирией."
 syrian_diplomacy.74.a: "Готовиться к подписанию"

 syrian_diplomacy.75.t: "Трубопровод дружбы"
 syrian_diplomacy.75.d: "Делегация из Дамаска прибывает с подробными чертежами и смелыми амбициями. Они предлагают немедленное строительство давно обсуждавшегося «Трубопровода дружбы» - прямой энергетической артерии от наших месторождений Южный Парс до их средиземноморского побережья. Этот 5600-километровый проект не только обеспечит энергетические потребности Сирии на десятилетия вперёд, но, что более важно, предоставит Исламской Республике её первый суверенный канал на европейские рынки, минуя конкурирующие маршруты. Сирийцы подчёркивают его роль в цементировании нашей стратегической оси и обещают полное сотрудничество. Однако первоначальные инвестиции будут значительными, и проект вызовет немедленную враждебность со стороны тех, кто хочет, чтобы наша энергия оставалась изолированной."
 syrian_diplomacy.75.a: "Наши судьбы связаны. Начать работу"
 syrian_diplomacy.75.b: "Риски слишком велики"

 syrian_diplomacy.76.t: "Трубопровод одобрен"
 syrian_diplomacy.76.d: "Слово пришло из Тегерана: предложение принято. Начальные средства выделены, и иранские инженеры вскоре присоединятся к нашим группам для обследования маршрута через Ирак к нашим портам. «Трубопровод дружбы» теперь становится реальностью. Этот проект является высшим слиянием наших интересов - он будет питать наше восстановление доходами от транзита и углублять наш союз с Ираном до неразрывной степени. Мы сделали решающий шаг к энергетической независимости и геополитической значимости, прокладывая свой собственный путь, несмотря на определённое осуждение со стороны наших противников."
 syrian_diplomacy.76.a: "Заложить фундамент нашего общего будущего"

 syrian_diplomacy.77.t: "Сирия предлагает совместные действия в Йемене"
 syrian_diplomacy.77.d: "Дамаск направил нам предложение. Они предлагают возглавить наземное вмешательство в Йемене, чтобы победить враждебный режим в Сане, непосредственно ослабляя позиции Ирана в регионе. Они запрашивают нашу военную координацию и поддержку для этой операции."
 syrian_diplomacy.77.a: "Принять их предложение и координировать вмешательство"
 syrian_diplomacy.77.b: "Отклонить предложение"

 syrian_diplomacy.78.t: "Дилемма «Хезболлы»"
 syrian_diplomacy.78.d: "Действия «Хезболлы» становятся обузой. Их независимость угрожает втянуть нас в конфликт не по нашему выбору и на их условиях. Мы должны решить, как их обуздать: либо через наше собственное прямое давление, которое сожжёт мосты, но утвердит нашу власть, либо обратившись к их главному покровителю в Тегеране, надеясь, что они проявят благоразумие и дисциплинируют своего прокси, хотя это покажет нашу зависимость."
 syrian_diplomacy.78.a: "Противостоять им самим"
 syrian_diplomacy.78.b: "Пусть Тегеран разбирается со своим творением"

 syrian_diplomacy.79.t: "Обуздание «Хезболлы»"
 syrian_diplomacy.79.d: "Дамаск обратился к нам напрямую. Они сообщают, что «Хезболла», ободренная своими успехами, теперь действует с опасной независимостью, принимая стратегические решения, которые угрожают сирийской безопасности и могут втянуть всю Ось в нежеланную войну. Они просят, чтобы мы, как основной спонсор группы, использовали наш авторитет, чтобы официально исключить «Хезболлу» из структур альянса для восстановления дисциплины и единого командования. Это призыв сохранить коалицию, удалив её самый неуправляемый элемент."
 syrian_diplomacy.79.a: "Исключить «Хезболлу» из Оси"
 syrian_diplomacy.79.b: "Отклонить запрос"

 syrian_diplomacy.80.t: "«Хезболла» исключена"
 syrian_diplomacy.80.d: "Тегеран действовал в соответствии с нашей просьбой. «Хезболла» была официально исключена из Оси сопротивления и лишена официальной поддержки. Этот решительный шаг ограничивает их независимые действия и вновь утверждает главенство государственных интересов в нашем союзе. Хотя это нейтрализует непосредственную угрозу, это фундаментально изменило природу нашей коалиции."
 syrian_diplomacy.80.a: "Необходимый результат"

 syrian_diplomacy.81.t: "Левантийское предложение"
 syrian_diplomacy.81.d: "Сирийская делегация прибывает в Доху с подробными планами и чётким стратегическим видением. Они предлагают строительство прямого газопровода от северного месторождения Катара через Левант до средиземноморского побережья, представляя Сирию как естественный транзитный коридор между Персидским заливом и Европой. Проект обещает безопасный доступ к европейским рынкам, избегая существующих узких мест и маршрутов, контролируемых конкурентами. Дамаск подчёркивает экономический прагматизм, долгосрочную транзитную стабильность и возрождение исторических торговых путей, соединяющих Аравию со Средиземноморьем, но признаёт, что такой проект неизбежно вызовет региональную оппозицию."
 syrian_diplomacy.81.a: "Наши интересы совпадают. Одобрить проект"
 syrian_diplomacy.81.b: "Риски перевешивают выгоды"

 syrian_diplomacy.82.t: "Трубопровод Катар-Левантий одобрен"
 syrian_diplomacy.82.d: "Слово пришло из Дохи: предложение принято. Катарские инвестиционные фонды высвобождены, и совместные инженерные группы вскоре начнут исследовать маршрут к сирийским средиземноморским портам. Трубопровод Катар–Левантий представляет собой решительный сдвиг в региональной энергетической динамике, предлагая альтернативный коридор для иранских проектов и привязывая газ Залива к левантийской транзитной инфраструктуре. Для Сирии это обещает доходы от транзита, стратегическую значимость и возобновлённое влияние на перекрёстке региональной торговли, даже когда конкурирующие державы наблюдают с растущей обеспокоенностью."
 syrian_diplomacy.82.a: "Открыть новый коридор к Средиземноморью"

 syrian_diplomacy.83.t: "Сирийско-катарская холдинговая компания"
 syrian_diplomacy.83.d: "Сирийские представители прибывают в Доху с официальным предложением о создании Сирийско-катарской холдинговой компании, совместного инвестиционного инструмента, принадлежащего в равных долях обоим государствам. Инициатива представлена как структура для направления катарского капитала в ключевые секторы сирийской экономики, включая энергетику, топливную дистрибуцию, сельское хозяйство, недвижимость и инфраструктуру. Дамаск утверждает, что совместное владение и долгосрочные обязательства обеспечат финансовую стабильность, привлекут опыт и институционализируют экономическое сотрудничество между Сирией и Катаром, оставаясь официально не политическими по своей природе."
 syrian_diplomacy.83.a: "Одобрить создание холдинговой компании"
 syrian_diplomacy.83.b: "Отклонить предложение"

 syrian_diplomacy.84.t: "Холдинговая компания создана"
 syrian_diplomacy.84.d: "Доха одобряет предложение, и Сирийско-катарская холдинговая компания официально создана с равными капитальными вкладами обоих правительств. Новое образование отвечает за координацию инвестиций в несколько секторов сирийской экономики, предоставляя стабильный канал для катарского финансового участия и закрепляя двусторонние экономические отношения в институциональной форме. Компания знаменует собой важный шаг в формализации экономических связей Сирии с Заливом."
 syrian_diplomacy.84.a: "Оформить экономическое сотрудничество"

 #Mejd events
 syria_mejd.1.t: "Сессия I: Вопрос желания"
 syria_mejd.1.d: "Доктор откладывает свой блокнот и смотрит прямо на вас. «Ваше Величество, оставьте королевские регалии у двери. Кто вы, когда корона снята? К чему стремится ваша душа, когда она не кричит о долге?» Тишина в кабинете становится ощутимой, наполненная эхом тысячелетней истории вашей династии."
 syria_mejd.1.a: "Слава, которая затмит сам Урук!"
 syria_mejd.1.b: "Порядок из хаоса, как Энлиль отделил небеса от земли!"
 syria_mejd.1.c: "Сокровище, чтобы купить саму судьбу!"

 syria_mejd.2.t: "Сессия II: Вопрос цели"
 syria_mejd.2.d: "«Какова ваша истинная цель?» Голос доктора тих, но настойчив. «Не обязанность, возложенная на вас рождением, а фундаментальная причина вашего существования. Для чего вы были созданы в этом грандиозном, рушащемся театре мира?»"
 syria_mejd.2.a: "Раскрыть Скрижали Судьбы, прочитать то, что было начертано богами!"
 syria_mejd.2.b: "Осуществлять господство над всем, что я вижу!"
 syria_mejd.2.c: "Обладать знанием, которое является истинной силой!"

 syria_mejd.3.t: "Сессия III: Вопрос на мёртвом языке"
 syria_mejd.3.d: "Голос доктора внезапно меняется, становясь древним и гортанным. «Dingir kima šu ba-zi?» - произносит он на шумерском. Слова повисают в воздухе, тяжёлые от забытого значения. «Кому из первых богов вы отвечаете?»"
 syria_mejd.3.a: "Инанне!"
 syria_mejd.3.b: "Думузиду!"
 syria_mejd.3.c: "Тешшубу!"

 syria_mejd.4.t: "Проблеск... ясности?"
 syria_mejd.4.d: "Сессии закончились. В течение нескольких дней вы сидели в тишине, голоса богов и царей всё ещё эхом отдаваясь в мраморных залах вашего разума. Но теперь под шумом есть новая тишина - не тишина отсутствия, а тишина сосредоточенности. Грандиозные видения Урука и божественный гвалт не исчезли, но они... выстроились. Ужасная, связная цель начинает кристаллизоваться из хаоса. Доктор наблюдает за вами настороженными глазами. «Ваше Величество?» - осмеливается он спросить. Вы поднимаете взгляд, и впервые ваш взгляд - не потерянного короля, а завоевателя, который наконец увидел карту своей судьбы. Безумие остаётся, но оно обрело направление."
 syria_mejd.4.a: "Путь ясен. Пусть мир трепещет."

 syria_mejd.5.t: "Слова психического срыва"
 syria_mejd.5.d: "Регенты находят вас стоящим перед картой, проводящим дрожащим пальцем линии от Сирии до самых берегов Персидского залива. «Разве вы не видите?» - шепчете вы, ваш голос, смесь благоговения и безумия. «Это никогда не было о Дамаске... Это об Уруке. Я не Медж. Сон был ясен. Я - тот, кто ходил по стенам, кто бросил вызов богам... Я - вернувшийся Гильгамеш. И эти земли» - ваша рука обводит карту - «станут Новым Ашшуром, империей, возрождённой из глины самой истории». Регенты обмениваются взглядами, не уверенные, являются ли они свидетелями откровения или окончательного распада разума."
 syria_mejd.5.a: "Я - Гильгамеш. Пусть Новый Ашшур восстанет!"

 syria_mejd.6.t: "Странные вести с Востока"
 syria_mejd.6.d: "Из [FROM.GetNameDef] поступает официальное коммюнике. Пергамент написан на своеобразной клинописи и скреплён печатью с изображением бородатого человека-быка. В нём провозглашается, что Царь [FROM.GetNameDef], вернувшийся Гильгамеш, прорицал, что истинное духовное наследие Египта лежит в его древнем жречестве. Чтобы восстановить этот «священный порядок», он пересылает значительное пожертвование. Письмо заканчивается молитвой Ашшуру и просьбой к нам «разбудить духов фараонов». Мы прочитали это трижды. Мы всё ещё понятия не имеем, что это значит."
 syria_mejd.6.a: "Что? ...Ладно. Спасибо."

 syria_mejd.7.t: "Египет принимает наше подношение"
 syria_mejd.7.d: "Каир подтвердил получение нашего пожертвования. Их официальный ответ благодарит нас за «щедрый вклад в египетские культурные инициативы». Прилагается рукописная записка на стикере, явно написанная сбитым с толку клерком: «Они... говорят о фильме? О том, с колесницами?» Тем не менее, золото было принято. Этого достаточно. Духи фараонов получили своё подношение."
 syria_mejd.7.a: "Фараоны шевелятся. Наш труд приносит плоды."

 syria_mejd.8.t: "Какая польза королю от безделушек?"
 syria_mejd.8.d: "На протяжении десятилетий сундуки династии Асадов раздувались от богатства страны - нефтяных доходов, теневых сделок и молчаливой дани напуганного народа. Теперь царь Гильгамеш сидит перед бухгалтерскими книгами. «Какая польза царю Урука от таких безделушек?» - бормочет он. «Пусть черноголовые люди пьют из одной чаши». В течение нескольких часов колонны грузовиков выезжают из президентских дворцов, загруженные чемоданами иностранной валюты, золотыми слитками и документами на собственность. Улицы Дамаска, Алеппо и забытых деревень взрываются в неверии. Старые женщины плачут. Молодые люди скандируют имя короля. На один мимолётный, невозможный момент человек, объявивший себя богом, становится спасителем своего народа."
 syria_mejd.8.a: "Богатство династии принадлежит народу!"
 SYR_youth_organizations_expanded: "Молодёжные организации"
 SYR_patriotic_propaganda_new: "Патриотическая пропаганда"

