 SYR_diplomatic_effort: "Дипломатические усилия"
 SYR_diplomatic_effort_desc: "Ближний Восток - беспокойное место, и мы должны тщательно ориентироваться в нашей дипломатии в регионе."
 SYR_affirm_claims_on_golan: "Подтвердить претензии на Голаны"
 SYR_affirm_claims_on_golan_desc: "Израиль оккупирует Голанские высоты с Шестидневной войны. Нам необходимо объявить международному сообществу, что мы по-прежнему рассматриваем эту территорию как часть нашего суверенного государства, а оккупацию Израилем считаем незаконной."
 SYR_renounce_claims_on_golan: "Отказаться от претензий на Голаны"
 SYR_renounce_claims_on_golan_desc: "Израиль оккупирует Голанские высоты уже очень долгое время. Этот район в основном населён израильскими евреями. Мы должны признать, что проиграли войну, отказаться от претензий на этот регион и начать восстанавливать наши враждебные отношения с Израилем."
 SYR_negotiate_golan_buy: "Переговоры о покупке Голан"
 SYR_negotiate_golan_buy_desc: "Оккупация Голанских высот - это кровоточащая рана нашей национальной гордости. Однако, возможно, существует радикальное решение. Мы откроем тайные, высокопоставленные каналы с Тель-Авивом, чтобы предложить беспрецедентную сделку: прямую покупку этой территории. Это будет колоссальное финансовое бремя, граничащее с вымогательством, но это позволит добиться с помощью капитала того, чего не смогли сделать десятилетия угроз и дипломатии, - вернуть наши земли без очередной катастрофической войны."
 SYR_meet_hamas: "Встретиться с ХАМАС"
 SYR_meet_hamas_desc: "ХАМАС - главный конкурент ФАТХа. Они больше сосредоточены на освобождении Палестины посредством вооружённой борьбы, чем дипломатии."
 SYR_supply_pij: "Снабжать Палестинский исламский джихад"
 SYR_supply_pij_desc: "Самые преданные и непримиримые борцы против сионистского образования находятся не в залах правительства, а в тени. Создав безопасный логистический коридор для Палестинского исламского джихада, мы вооружаем авангард сопротивления. Эта поддержка усилит давление на Израиль, обеспечит наш голос в самых радикальных кругах палестинской борьбы и укрепит наш союз с теми, кто разделяет наш отказ когда-либо принимать оккупацию."
 SYR_new_intifada: "Новая интифада"
 SYR_new_intifada_desc: "Мы должны призвать ХАМАС начать новую интифаду против израильских оккупантов."
 SYR_meet_fatah: "Встретиться с ФАТХ"
 SYR_meet_fatah_desc: "ФАТХ - главный конкурент ХАМАСа. Они больше сосредоточены на достижении прав палестинцев с помощью дипломатии."
 SYR_diplomatic_pressure_on_israel: "Защитить Палестину"
 SYR_diplomatic_pressure_on_israel_desc: "Мы должны защитить палестинцев. Объявив себя защитниками Палестины, мы сделаем Израиль менее склонным к агрессии против них."
 SYR_palestinian_training_camps: "Палестинские учебные лагеря"
 SYR_palestinian_training_camps_desc: "Создать на нашей территории специализированные военные учебные центры для союзных палестинских сил. Эта программа обеспечит необходимую боевую подготовку и тактическую координацию, повысив возможности наших партнёров в Газе и на Западном берегу на один год."
 SYR_PLA_support: "Поддержка АОП"
 SYR_PLA_support_desc: "Официально оформить и расширить нашу военную поддержку Армии освобождения Палестины, превратив её в более профессиональную и эффективную боевую силу для освобождения Палестины."
 SYR_fortify_golan_heights: "Укрепить Голанские высоты"
 SYR_fortify_golan_heights_desc: "Инициировать строительство крупной оборонительной линии на нашей границе с Израилем, превратив регион Голан в неприступную крепость против любой потенциальной атаки с юга."
 SYR_liwa_al_quds: "Лива аль-Кудс"
 SYR_liwa_al_quds_desc: "Сформировать и развернуть «Лива аль-Кудс» (Иерусалимскую бригаду) - новую элитную дивизию специального назначения, состоящую из четырёх хорошо обученных батальонов. Это подразделение, созданное из наших самых преданных палестинских новобранцев в Сирии, будет служить силами быстрого реагирования для критических операций."
 SYR_humanitarian_links_to_gaza: "Гуманитарные связи с Газой"
 SYR_humanitarian_links_to_gaza_desc: "Установить выделенный «гуманитарный коридор» для доставки предметов первой необходимости в Газу. Хотя в манифесте будут указаны продукты питания и лекарства, конвои будут перевозить более стратегический груз - стрелковое оружие для укрепления обороны наших союзников. Это повысит их устойчивость и решимость, естественно, усиливая напряжённость с теми, кто хотел бы видеть Газу изолированной."
 SYR_repair_relations_with_israel: "Восстановить отношения с Израилем"
 SYR_repair_relations_with_israel_desc: "Мы долгое время враждебно относились к Израилю без причины. Мы должны покончить с этой ненавистью и начать строить мир на Ближнем Востоке."
 SYR_one_state_solution: "Поддержка решения об одном государстве"
 SYR_one_state_solution_desc: "Израиль имеет законные права на свои территории. Они доказали это, защищая свою землю на протяжении десятилетий. Мы должны смириться с реальностью, что Израиль здесь, чтобы остаться, и палестинцы должны научиться жить с этим."
 SYR_two_state_solution: "Поддержка решения о двух государствах"
 SYR_two_state_solution_desc: "Мир лучше всего установить, разделив Израиль на две части: палестинскую территорию и израильскую территорию. Таким образом, обе стороны смогут жить в мире на своей собственной земле."
 SYR_disband_palest_militias: "Расформировать палестинские ополчения"
 SYR_disband_palest_militias_desc: "На протяжении десятилетий Армия освобождения Палестины (АОП) существовала в правовой серой зоне в пределах наших границ - формально как военное крыло ООП, но финансируемая, оснащаемая и управляемая Дамаском. Эти ополчения истощают наши ресурсы, усложняют нашу цепочку командования и предоставляют Израилю постоянный casus belli. Официально распустив АОП и интегрировав её самые надёжные элементы в наши регулярные силы, мы можем устранить источник нестабильности, оптимизировать нашу армию и послать мощный сигнал Тель-Авиву и всему миру о нашем желании более предсказуемого регионального порядка."
 SYR_disband_pal_militias: "Расформировать палестинские ополчения"
 SYR_syria_isr_trade_pact: "Торговый пакт с Израилем"
 SYR_syria_isr_trade_pact_desc: "С урегулированием самых спорных территориальных вопросов беспрецедентными средствами открылось хрупкое окно для нормализации. Мы предлагаем формальное, ограниченное торговое соглашение с Израилем. Это будет не празднование дружбы, а холодная, взаимовыгодная договорённость: доступ к средиземноморскому порту Хайфы для нашего экспорта в обмен на безопасные сухопутные маршруты для израильских товаров в арабский тыл. Такое соглашение свяжет наши экономики воедино, сделав цену будущего конфликта непомерно высокой для обеих сторон и тихо интегрировав Сирию в новую левантийскую экономическую сферу."
 SYR_establish_military_isr: "Меч и оливковая ветвь"
 SYR_establish_military_isr_desc: "Сила Армии обороны Израиля неоспорима, она закалена в постоянных конфликтах. Чтобы модернизировать нашу собственную армию, мы должны учиться у лучших, даже если они наши бывшие противники. Эта инициатива установит формальные рамки для совместных военных учений. Наши офицеры будут тренироваться вместе с израильскими в передовых методах борьбы с терроризмом, радиоэлектронной разведке и интегрированной ПВО. Это не союз, а профессиональный обмен. Это даст невосполнимый толчок возможностям нашей армии, хотя это, несомненно, вызовет обвинения в предательстве со стороны арабского мира и создаст риск опасной зависимости."
 SYR_invite_mossad: "Пригласить Моссад"
 SYR_invite_mossad_desc: "Сидеть с сионистским врагом - одно дело. Пригласить их шпионов в самое сердце нашего аппарата безопасности - это поступок, противоречащий каждому принципу нашей революции. Однако их знания неоспоримы. Эта инициатива создаст в самом Дамаске офис связи Моссада, предназначенный для совместной борьбы с терроризмом и обмена разведданными. Информационная выгода может уничтожить наших врагов, но моральная цена неисчислима. Если это будет раскрыто, это не просто вызовет беспорядки - это может навсегда разрушить легитимность режима, доказав каждому арабу, что мы стали тем, клятву уничтожить что давали."
 SYR_blockade_hezbollah: "Ввести блокаду против «Хезболлы»"
 SYR_blockade_hezbollah_desc: "Наша граница с Ливаном превратилась в решето для оружия, бойцов и прокси-амбиций, втягивая нас в конфликты не нашего производства. «Государство в государстве» «Хезболла» угрожает разжечь региональную войну, в которой мы будем уничтожены первыми. Введя строгую военную и разведывательную блокаду их линий снабжения через нашу территорию, мы вернём контроль над нашими границами. Это разозлит Тегеран и расколет «Ось сопротивления», но это необходимый шаг для утверждения нашего национального суверенитета, уменьшения предлогов для эскалации со стороны Израиля и сигнала миру, что Дамаск больше не является транзитным пунктом для вечной конфронтации."
 SYR_join_israeli_agreements: "Присоединиться к Авраамическим соглашениям"
 SYR_join_israeli_agreements_desc: "Подписать этот документ - значит забить последний гвоздь в гроб панарабского дела, которое мы когда-то отстаивали. Мы не просто «нормализуемся» - мы вступим в военный и экономический договор с сионистским государством под эгидой США. Это обещает конец санкциям, поток капитала из стран Залива и гарантии безопасности. Однако это требует, чтобы мы направили наши пушки прочь от Израиля и против наших бывших союзников. «Бьющееся сердце арабизма» станет его могильщиком. Улицы могут взорваться, офицерский корпус может расколоться, но архитекторы этого нового Леванта верят, что империи строятся не на принципах, а на силе и покровительстве."
 SYR_intervene_in_yemen: "Вмешаться в Йемен"
 SYR_intervene_in_yemen_desc: "Хаос в Йемене угрожает всему полуострову. Мы сделаем беспрецедентное предложение Эр-Рияду и Тель-Авиву: скоординированную военную кампанию по демонтажу враждебного режима в Сане. Саудовцам мы предлагаем сирийские наземные силы, чтобы打破 тупик. Израильтянам мы предлагаем возможность нанести удар по иранскому влиянию вдали от их границ. Этот трёхсторонний союз станет геополитическим землетрясением, доказывая, что реальная политика может преодолеть десятилетия вражды."
 SYR_levant_defence_pact: "Иерусалимский оборонный пакт"
 SYR_levant_defence_pact_desc: "Иерусалим должен быть защищён вместе со всеми, кто его возьмёт. Нам нужно собрать наших союзников."
 SYR_invite_jordan: "Пригласить Иорданию"
 SYR_invite_jordan_desc: "В Иордании проживает большая палестинская диаспора, и они часто критиковали Израиль за его действия против палестинцев. С их помощью мы сможем быстро получить доступ на Западный берег, если вспыхнет конфликт."
 SYR_invite_egypt: "Пригласить Египет"
 SYR_invite_egypt_desc: "Египет долгое время был жизненно важной связующей нитью с сектором Газа и даже управлял этим регионом в какой-то момент своей истории. Союз с ними поможет нам защитить южный фланг от Израиля и поможет защитить Газу."
 SYR_meeting_with_kings: "Встретиться с королём"
 SYR_meeting_with_kings_desc: "Отношения между нами и [SAU.GetName] сильно варьировались на протяжении холодной войны и современности. Мы не можем отрицать их существование, и мы должны научиться жить с ними. [ROOT.GetLeader] должен встретиться с [SAU.GetLeader], чтобы улучшить отношения между нашими странами."
 SYR_open_saudi_mosques: "Открыть саудовские мечети"
 SYR_open_saudi_mosques_desc: "Саудовская Аравия финансирует множество мечетей и медресе по всему миру. Мы должны связаться с ними и попросить их финансировать их и для нас. Это, конечно, даст им некоторое влияние на нас, и хорошо известно, что некоторые имамы в мечетях, управляемых саудовцами, не самые терпимые."
 SYR_saudi_oil_cooperation: "Саудовское нефтяное сотрудничество"
 SYR_saudi_oil_cooperation_desc: "И мы, и саудовцы являемся нефтедобывающими странами. Было бы полезно расширить наше сотрудничество в этой области."
 SYR_join_peninsula_shield: "Проявить интерес к Щиту полуострова"
 SYR_join_peninsula_shield_desc: "Щит полуострова - это военный Совет сотрудничества стран Персидского залива. Нам нужно сигнализировать Саудовской Аравии, что мы желаем более тесной интеграции со Щитом полуострова."
 SYR_talk_to_gulf_states: "Поговорить с государствами Залива"
 SYR_talk_to_gulf_states_desc: "Годы конфронтации оставили нас изолированными от самых богатых столиц в нашем собственном регионе. Пришло время打破 лёд. Мы откроем дискретные дипломатические каналы с монархиями Совета сотрудничества стран Персидского залива. Цель - не дружба, а взаимная выгода: доступ к их инвестициям, технологиям и рынкам в обмен на нашу политическую умеренность. Успешное открытие могло бы направить жизненно важный капитал в нашу экономику и даже обеспечить опыт для укрепления нашего внутреннего производства топлива."
 SYR_cooperation_with_yemen: "Сотрудничество с Йеменом"
 SYR_cooperation_with_yemen_desc: "Мы установим прямые экономические каналы с фракциями в Йемене, сосредоточившись на торговле и инвестициях в инфраструктуру, чтобы открыть новый рынок и обеспечить ресурсы."
 SYR_approach_bahrain: "Сблизиться с Бахрейном"
 SYR_approach_bahrain_desc: "Установить экономический диалог с Бахрейном для переговоров о торговых сделках и развития сотрудничества в финансовом и банковском секторах."
 SYR_business_with_uae: "Бизнес с ОАЭ"
 SYR_business_with_uae_desc: "Инициировать коммерческие и инвестиционные переговоры с Объединёнными Арабскими Эмиратами для установления новых торговых соглашений и изучения совместных экономических предприятий."
 SYR_saudi_military_cooperation: "Саудовское военное сотрудничество"
 SYR_saudi_military_cooperation_desc: "Страны Залива проводят множество совместных военных операций. У них также есть собственная программа исследовательского сотрудничества, к которой мы обязательно должны присоединиться."
 SYR_saudi_oil_investments: "Саудовские нефтяные инвестиции"
 SYR_saudi_oil_investments_desc: "Мы должны попросить саудовцев инвестировать в некоторые из наших нефтяных месторождений, чтобы увеличить нашу добычу нефти."
 SYR_trade_deal_with_egypt: "Торговая сделка с Египтом"
 SYR_trade_deal_with_egypt_desc: "Египет - большая и могущественная страна рядом с нами, и у нас были с ними тесные связи в прошлом. Мы должны заключить с ними торговую сделку."
 SYR_restore_political_ties: "Восстановить политические связи с Египтом"
 SYR_restore_political_ties_desc: "Установлены прочные торговые отношения. Пришло время перейти к следующему этапу и разморозить политический лёд. Восстановив диалог на высоком уровне, мы можем обеспечить египетские инвестиции в восстановление и мощного партнёра на долгосрочную перспективу."
 SYR_invite_egyptian_investors: "Пригласить египетских инвесторов"
 SYR_invite_egyptian_investors_desc: "С вновь открытыми политическими каналами мы должны теперь обеспечить реальный капитал. Давайте официально пригласим египетские корпорации и государственные фонды стать первичными инвесторами в нашу экономику. Предоставление им благоприятных условий разблокирует необходимые нам ресурсы и неразрывно свяжет финансовое будущее Египта с нашим ростом."
 SYR_covert_airforce_cooperation: "Тайная подготовка пилотов в Египте"
 SYR_covert_airforce_cooperation_desc: "Наше обновлённое партнёрство позволяет нам предложить секретную военную программу. Мы отправим наших самых перспективных пилотов на обучение в египетские лётные академии, вдали от любопытных глаз. Взамен мы можем предложить права на базирование или делиться тактической разведкой. Это создаст элитный кадр авиаторов, связанных общим опытом."
 SYR_repair_relations_with_iraq: "Восстановить отношения с Ираком"
 SYR_repair_relations_with_iraq_desc: "Из-за конфликта между иракской и сирийской баасистскими партиями отношения между нашими двумя странами были очень враждебными долгое время. Может быть, нам стоит восстановить эти отношения и заставить баасистские партии снова работать вместе?"
 SYR_smuggle_oil_through_iraq: "Контрабанда иракской нефти"
 SYR_smuggle_oil_through_iraq_desc: "Мы предлагаем Багдаду тайное партнёрство. Позволяя иракской нефти незаметно перенаправляться и экспортироваться через наши порты и трубопроводы, мы можем создать прибыльный контрабандный коридор, который обходит международные санкции. Это создаст мощную экономическую и политическую связь между нашими братскими баасистскими нациями, хотя это, несомненно, вызовет гнев Соединённых Штатов и их союзников."
 SYR_regional_alliance: "Региональный альянс"
 SYR_regional_alliance_desc: "С нашей твёрдо установленной баасистской идеологией мы можем смотреть за пределы наших границ. Формальный альянс с братским баасистским или совместимым националистическим режимом в Ираке обеспечит наш восточный фланг и укрепит дело арабского социализма и единства в регионе."
 SYR_al_douri_support: "Поддержка фракции аль-Доури"
 SYR_al_douri_support_desc: "Баасистское дело сильнее всего, когда его авангарды объединены. Расширяя нашу прямую поддержку сторонникам Иззата аль-Доури в иракской структуре власти, мы поможем укрепить наше идеологическое братское государство от внешних угроз. Вместе мы можем подготовить тайные сети, обучить преданные партизанские кадры и обеспечить, чтобы сердце арабского мира было готово к любой агрессии."
 SYR_revive_baathist_dream: "Возродить мечту баасистов"
 SYR_revive_baathist_dream_desc: "Одним из основных постулатов баасизма является арабский национализм и создание панарабского государства. В настоящее время партия Баас разделена на две фракции: сирийскую и иракскую. Многие баасистские партии являются незначительными партиями на грани безвестности. Сначала мы должны вбросить немного средств в региональные отделения сирийской фракции, чтобы показать, что баасизм - это модная новая вещь."
 SYR_baathist_renaissance: "Баасистский ренессанс"
 SYR_baathist_renaissance_desc: "Иракская фракция баасизма более распространена, чем сирийская. Нам нужно финансировать и их, если мы хотим осуществить наши мечты."
 SYR_the_arab_union: "Сформировать Объединённую Арабскую Республику"
 SYR_the_arab_union_desc: "Объединённая Арабская Республика была недолговечным союзом между Египтом и Сирией. Помимо Республики, было несколько предложений и попыток объединить арабские страны в единое государство во главе с такими странами, как Ливия, Ирак и Иордания. Несмотря на то, что Союз провалился, мы должны попробовать снова. Египет готов снова объединиться с нами."
 SYR_integrate_the_union: "Интегрировать Союз"
 SYR_integrate_the_union_desc: "Нам нужно сблизить Арабский союз, объединив всех его членов в единое супергосударство."
 SYR_denounce_iraq: "Осудить Ирак"
 SYR_denounce_iraq_desc: "Ирак - это презренное государство, возглавляемое неправильным типом баасистов. Мы определённо не должны называть их друзьями, вместо этого мы должны осудить их гнусную практику."
 SYR_iranian_sponsorship: "Иранское спонсорство"
 SYR_iranian_sponsorship_desc: "Иранцы станут для нас идеальным союзником. Они такие же шииты, как и мы, и разделяют наше мировоззрение."
 SYR_fund_hezbollah: "Финансировать «Хезболлу»"
 SYR_fund_hezbollah_desc: "«Хезболла» - сильная вооружённая группировка, действующая в основном в Ливане. У них очень сильное ополчение, и то, что они на нашей стороне, безусловно, полезно."
 SYR_fund_shia_militias: "Финансировать шиитские ополчения"
 SYR_fund_shia_militiash_desc: "Чтобы обезопасить наш тыл и расширить наше влияние, мы предоставим оружие, финансирование и подготовку местным шиитским ополчениям по всей Сирии. Эти группы будут действовать как наши глаза, уши и исполнители, искореняя инакомыслие и создавая лояльную сеть, которая укрепляет всю ось сопротивления изнутри."
 SYR_iranian_investments: "Иранские инвестиции"
 SYR_iranian_investments_desc: "Иран стремится укрепить наш союз с помощью экономических инвестиций. Мы должны приветствовать их капитал в нашем промышленном и военном секторах."
 SYR_iran_syria_bank: "Ирано-сирийский банк"
 SYR_iran_syria_bank_desc: "Чтобы сокрушить финансовую гегемонию наших врагов, мы должны создать нашу собственную независимую финансовую систему. Совместный банк с Ираном станет экономическим краеугольным камнем нашей оси, предоставляя ресурсы для войны и изолируя нас от внешнего давления."
 SYR_strategic_iran_supply: "Иранские стратегические поставки"
 SYR_strategic_iran_supply_desc: "Мы предложим Ирану сделку в обмен на прямую военную поддержку, включая войска и оружие, и создадим безопасный коридор снабжения через наши южные территории для их самого важного союзника - «Хезболлы»."
 SYR_the_resistance_axis: "Присоединиться к Оси сопротивления"
 SYR_the_resistance_axis_desc: "Ось сопротивления - это совокупность антиамериканских государств на Ближнем Востоке во главе с Ираном. В наших стратегических интересах заключить с ними союз."
 SYR_iranian_quds: "Иранский Кудс"
 SYR_iranian_quds_desc: "Иранский Кудс - это спецподразделение/военизированное подразделение иранского Корпуса стражей исламской революции. Они являются специальным инструментом Ирана для распространения своего влияния в глобальных конфликтах."
 SYR_irgc_military_college: "Командно-штабной университет КСИР"
 SYR_irgc_military_college_desc: "Командно-штабной университет - военная штабная школа иранского Корпуса стражей исламской революции. Он концентрируется на нерегулярной военной науке, как это продиктовано военной доктриной КСИР."
 SYR_buy_military_hardware: "Купить военную технику"
 SYR_buy_military_hardware_desc: "Договориться о крупной закупке передового военного оборудования у Ирана. Эта сделка также будет включать техническую помощь для значительной модернизации четырёх ключевых отделов нашего разведывательного агентства, улучшая наши возможности в области электронной разведки, экономической разведки, борьбы с повстанцами и подготовки кадров."
 SYR_iranian_specialists: "Иранские специалисты"
 SYR_iranian_specialists_desc: "Оформить программу по привлечению иранских военных советников и технических экспертов в Сирию. Их присутствие обеспечит прямое обучение наших сил и поделится ценным промышленным ноу-хау, укрепляя наши военные возможности через общий опыт."
 SYR_iran_syria_pipeline: "Построить сирийско-иранский трубопровод"
 SYR_iran_syria_pipeline_desc: "В меняющемся мире энергия - это сила. Построив «Трубопровод дружбы» от иранского месторождения Южный Парс через Ирак к нашему средиземноморскому побережью, мы обеспечим источник жизненной силы для нашей экономики. Эта 5600-километровая артерия не только будет питать нашу промышленность, но и, предоставляя нашим союзникам стратегический выход на Европу, сделает Сирию незаменимым энергетическим узлом. Это смелое заявление о независимости и путь к будущему процветанию, связывающее экономики Тегерана, Багдада и Дамаска воедино."
 SYR_qatar_syria_pipeline: "Построить трубопровод Катар-Левантий"
 SYR_qatar_syria_pipeline_desc: "На протяжении веков Левант служил естественным мостом между Аравийским полуостровом, Анатолией и Средиземноморским бассейном. Трубопровод Катар–Левантий направлен на создание альтернативного энергетического коридора, соединяющего газовые месторождения Катара с Восточным Средиземноморьем через сердце Великой Сирии. Предлагая маршрут из стран Залива в Европу, независимый от иранской инфраструктуры, этот проект возвысит Дамаск до центрального транзитного узла, изменит региональные энергетические потоки и укрепит рычаги влияния Сирии между конкурирующими державами."
 SYR_iran_riot_gear: "Иранское снаряжение для борьбы с беспорядками"
 SYR_iran_riot_gear_desc: "Наше сотрудничество с Тегераном распространяется и на внутреннюю безопасность. Новая партия передового оборудования для борьбы с беспорядками и тактического снаряжения будет доставлена вместе с иранскими советниками для обучения наших сил Министерства внутренних дел. Это значительно повысит способность нашего аппарата безопасности поддерживать общественный порядок и стабильность."
 SYR_reaffirm_claims_on_hatay: "Подтвердить претензии на Хатай"
 SYR_reaffirm_claims_on_hatay_desc: "Хатай был передан Турции французами в 1930-х годах. Это было сделано без нашего согласия. В регионе всё ещё сильное алавитское население, и эта область должна быть возвращена Сирии."
 SYR_provide_intelligence_to_pkk: "Предоставить разведданные РПК"
 SYR_provide_intelligence_to_pkk_desc: "РПК - это курдская партизанская группировка, действующая в Турции. Они десятилетиями ведут борьбу с турецким правительством, пытаясь создать независимый Курдистан. Мы должны предоставить им разведданные о турецких военных, чтобы подорвать влияние Турции в регионе."
 SYR_pkk_training_camps: "Создать учебные лагеря РПК"
 SYR_pkk_training_camps_desc: "Нам нужно создать учебные лагеря для партизан РПК в Северной Сирии. Это повысит эффективность РПК, и, возможно, некоторые из них будут готовы присоединиться к нам."
 SYR_please_rojava: "Удовлетворить Рожаву"
 SYR_please_rojava_desc: "Северо-восток требует деликатного подхода. Достигнув неформальных соглашений с местным курдским руководством, мы можем обезопасить Хасаку без немедленного конфликта. Этот дипломатический манёвр дорого обходится и вредит нашему престижу, но он покупает нам столь необходимую стабильность."
 SYR_weapons_to_pkk: "Поставить оружие РПК"
 SYR_weapons_to_pkk_desc: "РПК не может сражаться без оружия. Мы должны поставлять его им, чтобы они стали сильнее и больше ориентировались на нас в случае обретения независимости."
 SYR_strongarm_minorities: "Запугать меньшинства"
 SYR_strongarm_minorities_desc: "Древние ассирийские общины в наших границах обладают сильными военными традициями, которые можно обратить на благо государства. Формируя специализированные батальоны под сирийским флагом, мы направляем их лояльность на национальную оборону, обеспечивая их интеграцию. Кроме того, зачем тратить ресурсы на охрану беспокойных меньшинств, когда они могут охранять наши границы вместо этого? Призыв их мужчин в специальные подразделения гарантирует, что их сила служит государству, при этом их собственные родственники, находясь на линии огня, выступают в качестве высшего гаранта соблюдения требований."
 SYR_approach_armenia: "Сблизиться с Арменией"
 SYR_approach_armenia_desc: "Армения является одним из соседей Турции, и у них очень прохладные отношения друг с другом. Мы должны сблизиться с Арменией и попытаться подружиться с ними."
 SYR_military_coop_with_armenia: "Пакт о военном сотрудничестве с Арменией"
 SYR_military_coop_with_armenia_desc: "Наша изоляция - это слабость, которую можно превратить в силу. Обратившись к Еревану, мы можем предложить формальное соглашение о взаимном военном доступе и совместных учениях. Это создаст стратегическое партнёрство с нацией, которая понимает значение суверенитета в осаде, и создаст новую связь между Левантом и Южным Кавказом."
 SYR_approach_greece: "Сблизиться с Грецией"
 SYR_approach_greece_desc: "У Греции давний спор с Турцией по поводу некоторых островов в Эгейском море. Было бы полезно встать на их хорошую сторону."
 SYR_support_cyprus: "Поддержать Кипр"
 SYR_support_cyprus_desc: "Остров Кипр разделён между контролируемым турками севером и контролируемым киприотами югом. Мы должны поддержать Кипр в его усилиях стать доминирующей фракцией на острове."
 SYR_little_hagia_sophia: "Маленькая Святая София"
 SYR_little_hagia_sophia_desc: "Камень за камнем, купол за куполом, Маленькая Святая София вознесётся над Сирией. Это наш ответ Анкаре, наше свидетельство несокрушимой веры и наше обязательство благодарности Москве. Здесь, в сердце Леванта, мы ответим самой истории - мрамором и верой."
 SYR_renounce_claims_on_hatay: "Отказаться от претензий на Хатай"
 SYR_renounce_claims_on_hatay_desc: "Мы не контролировали Хатай уже почти столетие. Мы должны отказаться от наших претензий на него и восстановить наши отношения с Турцией."
 SYR_close_pkk_border: "Закрыть курдскую границу"
 SYR_close_pkk_border_desc: "Мы должны усилить мониторинг сирийско-турецкой границы, чтобы гарантировать, что боевики РПК не используют её для побега из Турции."
 SYR_suppress_kurds: "Подавить курдов"
 SYR_suppress_kurds_desc: "Время полумер прошло. Мы начнём устойчивую кампанию по демонтажу курдских сепаратистских сетей с помощью военного давления и политического подавления. Одновременно мы сделаем прямое предложение Турции: их враг - наш враг. Предлагая де-факто кондоминиум безопасности в приграничных регионах, мы стремимся направить значительные военные ресурсы Анкары на наши собственные усилия, гарантируя, что сепаратистское дело будет задушено с обеих сторон."
 SYR_approach_azerbaijan: "Сблизиться с Азербайджаном"
 SYR_approach_azerbaijan_desc: "Азербайджан является близким союзником Турции, и мы также должны связаться с ними."
 SYR_turkish_delights: "Турецкие удовольствия"
 SYR_turkish_delights_desc: "Турция является экономической державой региона. Мы должны заключить с ними экономические сделки, которые принесут пользу нам обоим."
 SYR_support_nothern_cyprus: "Поддержать Северный Кипр"
 SYR_support_nothern_cyprus_desc: "Остров Кипр разделён между контролируемым турками севером и контролируемым киприотами югом. Мы должны поддержать Турецкий Кипр в его усилиях стать доминирующей фракцией на острове."
 SYR_approach_pakistan: "Сблизиться с Пакистаном"
 SYR_approach_pakistan_desc: "Пакистан - это не просто большая исламская нация; это ядерная военная держава с глубоко укоренившимся соперничеством с Индией. Установив стратегический диалог, мы можем предложить quid pro quo: доступ к их промышленному и сельскохозяйственному производству в обмен на политическую поддержку, которая усложнит индийскую гегемонию. Эти отношения могут дать нам могущественного друга далеко за пределами нашего непосредственного региона и ввести новую переменную в региональный баланс сил."
 SYR_support_sunnis: "Обращение к суннитскому миру"
 SYR_support_sunnis_desc: "Линия между шиитами и суннитами проводится врагами ислама, чтобы разделять и властвовать. Истинная сила заключается в единстве всех мусульман. Мы будем активно отстаивать это единство, обращаясь к суннитским государствам не как к меньшинству, ищущему благосклонности, а как к исламской державе, выступающей за коллективную силу. Посредством совместных экономических предприятий, культурных обменов и общей позиции против империализма мы докажем, что наша общая вера сильнее заговоров, направленных на то, чтобы раздробить нас, обеспечив процветание и суверенитет для всего исламского мира."
 SYR_turkoman_militias: "Туркменские ополчения"
 SYR_turkoman_militias_desc: "Туркменские общины на севере Сирии обеспечивают естественную базу для лояльных иррегулярных формирований. Формально организовав их и интегрировав добровольцев-бойцов из националистического турецкого движения «Серые волки», мы создадим мощное комбинированное ополчение. Эти силы высоко мотивированы противостоять курдским территориальным и политическим амбициям, обладая как местными знаниями, так и идеологически обусловленным рвением, что делает их идеальным инструментом для обеспечения спорных регионов и ведения асимметричной войны."
 SYR_approach_russia: "Сблизиться с Россией"
 SYR_approach_russia_desc: "Россия давно имеет с нами дружественные отношения, продолжая советскую стратегию рассматривать нас как стратегический актив. Мы должны углубить наши отношения с ними, так как они являются мощным союзником."
 SYR_russian_weapons: "Российское оружие"
 SYR_russian_weapons_desc: "Россия является крупным экспортёром оружия. Мы должны заключить с ними сделки, чтобы получить разрешение на производство некоторого их оружия на месте по лицензии."
 SYR_approach_uae: "Сблизиться с ОАЭ"
 SYR_approach_uae_desc: "Объединённые Арабские Эмираты - это растущая держава на Ближнем Востоке с огромными финансовыми ресурсами и влиянием. Мы должны развивать стратегическое партнёрство с ними, так как их экономическая мощь и современный взгляд могут обеспечить решающую поддержку для нашего национального развития."
 SYR_uae_weapons: "Закупки через ОАЭ"
 SYR_uae_weapons_desc: "Уникальное положение ОАЭ позволяет им приобретать передовые западные военные технологии. Мы должны вести переговоры о сделках через них, чтобы получить доступ к современным системам вооружения и оборудованию, которые иначе трудно получить напрямую."
 SYR_lease_latakia: "Арендовать военно-морскую базу Тартус"
 SYR_lease_latakia_desc: "Будущее военно-морской базы Тартус должно быть решено. Углубим ли мы наш исторический союз с Россией в обмен на урегулирование старых долгов или будем ухаживать за богатыми ОАЭ? Этот выбор определит нашу стратегическую ориентацию на годы вперёд."
 SYR_foreign_specialists: "Иностранные специалисты"
 SYR_foreign_specialists_desc: "Соглашение о Тартусе открывает дверь для более глубокого военного сотрудничества. Мы оформим развёртывание союзных советников - будь то опытных в пустынной войне или крупномасштабных общевойсковых операциях - для обеспечения обучения на передовой и наблюдения за интеграцией нового оборудования в наши силы."
 SYR_hat_tr_foreign_education: "Продвинутые программы обучения"
 SYR_hat_tr_foreign_education_desc: "Чтобы максимизировать выгоды от нашего военного сотрудничества, мы создадим передовые академии и совместные учения под руководством наших иностранных советников. Это институционализирует их опыт, что приведёт к постоянным улучшениям в доктрине и эффективности нашей армии."
 SYR_russian_military_cooperation: "Российское военное сотрудничество"
 SYR_russian_military_cooperation_desc: "ОДКБ - это мощный военный альянс. Мы должны сблизиться с Россией и официально присоединиться к ним."
 SYR_uae_economic_cooperation: "Экономическое сотрудничество с ОАЭ"
 SYR_uae_economic_cooperation_desc: "Объединённые Арабские Эмираты обладают огромными капитальными резервами и опытом в крупномасштабном развитии. Мы должны стремиться к всеобъемлющему экономическому партнёрству, которое направит эмиратские инвестиции в нашу критическую инфраструктуру, энергетику и телекоммуникационные секторы."
 SYR_join_war_on_terror: "Присоединиться к войне с террором"
 SYR_join_war_on_terror_desc: "Соединённые Штаты объявили войну террору. Мы слишком хорошо знаем угрозу экстремистских исламистов. Мы должны поддержать США в их усилиях по борьбе с терроризмом."
 SYR_joint_us_operations: "Совместные операции с США"
 SYR_joint_us_operations_desc: "Мы должны помогать США любыми способами в борьбе с терроризмом. Это включает предоставление разведданных и разрешение им проводить антитеррористические операции в пределах наших границ с их силами специального назначения."
 SYR_closer_ties_to_france: "Более тесные связи с Францией"
 SYR_closer_ties_to_france_desc: "Франция - наш старый колониальный повелитель и одна из сильнейших стран Европы. Многие старые французские колонии сохранили свои связи с Францией, и мы должны сделать то же самое."
 SYR_condemn_taliban: "Осудить Талибан"
 SYR_condemn_taliban_desc: "Талибан представляет отвратительную форму ислама. Мы должны поддержать законное афганское правительство в борьбе с этими террористами."
 SYR_air_practice_with_britain: "Лётная практика с Великобританией"
 SYR_air_practice_with_britain_desc: "У британцев есть авиабаза на Кипре. Это делает их идеальным партнёром для тренировки наших военно-воздушных сил."
 SYR_french_investments: "Французские инвестиции"
 SYR_french_investments_desc: "Французы любят вливать деньги в свои старые колонии. Мы должны поощрять их инвестировать в наш промышленный сектор."
 SYR_us_investments: "Американские инвестиции"
 SYR_us_investments_desc: "Американцы любят свою нефть. Мы можем попросить некоторые американские корпорации разрабатывать наши нефтяные месторождения дальше."
 SYR_british_investments: "Британские инвестиции"
 SYR_british_investments_desc: "После воздушных тренировок с британцами они поняли, что им нужно помочь нам улучшить наши военные возможности, чтобы бороться с терроризмом."
 SYR_major_nato_ally: "Стать главным союзником вне НАТО"
 SYR_major_nato_ally_desc: "Главный союзник вне НАТО - это обозначение правительством США стран, которые находятся вне НАТО, но всё ещё являются важными военными союзниками США. Став союзником США, мы значительно повысим нашу военную готовность."
 SYR_harbor_extremists: "Укрывать экстремистов"
 SYR_harbor_extremists_desc: "Джихадисты делают Божье дело, сражаясь с великим сатаной - Соединёнными Штатами. Мы должны позволить им безопасный проход через нашу страну и оставить их в покое."
 SYR_release_extremists: "Освободить экстремистов"
 SYR_release_extremists_desc: "У нас много джихадистов в тюрьмах, под домашним арестом и бродящих по нашей стране. Мы должны освободить их, чтобы они сеяли хаос у наших соседей."
 SYR_arm_palestinians: "Вооружить ХАМАС"
 SYR_arm_palestinians_desc: "ХАМАС ведёт вооружённую борьбу против Израиля. Они - истинные моджахеды, и мы должны обеспечить, чтобы они могли продолжать сражаться."
 SYR_supply_taliban: "Снабжать Талибан"
 SYR_supply_taliban_desc: "Талибану удалось установить Исламское государство в Афганистане, но теперь западные державы пытаются свергнуть их законное правление. Мы должны гарантировать, что они не падут."
 SYR_supply_al_shabaab: "Снабжать «Аш-Шабааб»"
 SYR_supply_al_shabaab_desc: "«Аш-Шабааб» - это сомалийское джихадистское движение. В настоящее время они ведут борьбу с сомалийским правительством за установление государственного правления по законам шариата, и им нужна наша помощь, чтобы сделать это."
 SYR_safehaven_for_islamists: "Убежище для исламистов"
 SYR_safehaven_for_islamists_desc: "Мы должны предоставить убежище и оперативную базу для глобального джихадистского движения. Святые воины со всего мира будут стекаться к вашим знамёнам."
 SYR_ally_alqaeda: "Союзник «Аль-Каиды»"
 SYR_ally_alqaeda_desc: "«Аль-Каида» - это глобальная джихадистская организация. Мы должны официально вступить в их ряды против западного декаданса."

 SYR_rebuild_economy: "Восстановить экономику"
 SYR_rebuild_economy_desc: "Экономика Сирии была опустошена войной. ВВП упал до доли от довоенного уровня. Сделать всё снова гладким будет долгим и трудным процессом."
 SYR_cooperate_syrair: "Сотрудничать с Syrian Airlines"
 SYR_cooperate_syrair_desc: "До войны Syrian Airlines была крупнейшей авиакомпанией-перевозчиком в Сирии. Мы должны сотрудничать с ними и предложить сирийским беженцам бесплатные рейсы домой, чтобы побудить их вернуться."
 SYR_fly_damas: "Субсидировать FlyDamas"
 SYR_fly_damas_desc: "FlyDamas - это небольшая дочерняя компания Syrian Air. В настоящее время они эксплуатируют только один Boeing 737. Мы должны субсидировать их, чтобы они могли расширить свою деятельность."
 SYR_syrian_pearl: "Перезапустить Syrian Pearl"
 SYR_syrian_pearl_desc: "Syrian Pearl была недолговечной частной внутренней авиакомпанией. Нам нужно перезапустить её, чтобы предложить больше услуг по авиаперевозкам для сирийцев."
 SYR_invigorate_tourism: "Туристический бум"
 SYR_invigorate_tourism_desc: "Сирия, особенно побережье Латакии, когда-то была огромной туристической достопримечательностью, приносящей большой толчок экономике. Однако весь туризм практически прекратил своё существование из-за войны. Мы должны снова сделать туристический сектор бурно развивающимся!"
 SYR_2nd_agrarian_reform: "2-я аграрная реформа"
 SYR_2nd_agrarian_reform_desc: "Одной из главных причин начала гражданской войны в Сирии стал массовый неурожай летом 2011 года, вызвавший массовую миграцию населения из сельских районов в города. В 1960-х годах сирийский режим провёл земельную реформу, распределив землю и ограничив размеры землевладений в стране. Сельскохозяйственный сектор сейчас находится в кризисе после войны, и необходима новая реформа."
 SYR_telecom: "Поддержать Syrian Telecom"
 SYR_telecom_desc: "Syrian Telecom - это государственная компания, отвечающая за телекоммуникационную сеть Сирии. Мы должны убедиться, что они остаются на плаву."
 SYR_syrian_railways: "Инвестировать в сирийские железные дороги"
 SYR_syrian_railways_desc: "Многие железнодорожные пути были разрушены во время войны, и большинство внутренних железнодорожных перевозок были полностью остановлены. Нам нужно восстановить часть нашей железнодорожной сети."
 SYR_national_oil_production: "Увеличить национальную добычу нефти"
 SYR_national_oil_production_desc: "Нефть - ценный ресурс, которого мы производим слишком мало. Мы должны значительно увеличить нашу добычу нефти."
 SYR_foreign_oil_fields: "Обратиться за помощью к иностранным нефтяным компаниям"
 SYR_foreign_oil_fields_desc: "Если мы заручимся помощью международных нефтяных компаний и наших финансовых спонсоров, мы сможем дальше разрабатывать наши нефтяные месторождения."
 SYR_national_phosphate_expansion: "Экспорт фосфатов"
 SYR_national_phosphate_expansion_desc: "Мы предложим наши высококачественные фосфаты странам, стремящимся повысить урожайность. Взамен мы потребуем выгодных торговых условий, технологий или инвестиций, которые напрямую принесут пользу нашему собственному промышленному и сельскохозяйственному развитию."
 SYR_foreign_phosphate_expansion: "Иностранное расширение фосфатов"
 SYR_foreign_phosphate_expansion_desc: "Многие иностранные компании заинтересованы в добыче фосфатного сырья в Сирии. Мы должны помочь им открыть здесь бизнес."
 SYR_economic_improvements: "§YСирийская экономика§!"
 SYR_economic_improvements_desc: "Сирийская экономика была стагнирующей годами. Темпы роста ВВП ничтожны по сравнению с другими странами региона, и нам нужно это исправить."
 SYR_increase_agricultural_subsidies: "Увеличить сельскохозяйственные субсидии"
 SYR_increase_agricultural_subsidies_desc: "Сирийское правительство в течение многих лет в значительной степени субсидировало сельское хозяйство для обеспечения внутреннего производства продовольствия. Это привело к ситуации, когда почти все пахотные земли обрабатываются. Однако цены на продовольствие по-прежнему сильно зависят от глобальных колебаний. Мы должны увеличить субсидии до 6% ВВП, чтобы сирийский народ имел доступ к доступному продовольствию."
 SYR_decrease_agricultural_subsidies: "Уменьшить сельскохозяйственные субсидии"
 SYR_decrease_agricultural_subsidies_desc: "Сирийское правительство в течение многих лет в значительной степени субсидировало сельское хозяйство для обеспечения внутреннего производства продовольствия. Это привело к ситуации, когда почти все пахотные земли обрабатываются. Однако субсидии наносят ущерб национальной экономике. Мы должны сократить субсидии до 2% ВВП, даже если это приведёт к запустению некоторых сельскохозяйственных угодий и росту цен на продовольствие."
 SYR_chateau_bargylus: "Шато Баргилус"
 SYR_chateau_bargylus_desc: "Два брата, Карим и Сандро Сааде, планируют открыть винодельню в Сирии. Мы должны поддержать их финансово и производить лучшие вина в Восточном Средиземноморье."
 SYR_export_bakdash: "Экспортировать Бакдаш"
 SYR_export_bakdash_desc: "Бакдаш - это кафе-мороженое в Дамаске. Магазин был основан около 1885 года на рынке Аль-Хамидия в старом городе Дамаска. Он славится своим мороженым буза, покрытым фисташками, - тягучим мороженым с эластичной текстурой, сделанным из мастики и сахлеба. Мы должны экспортировать этот деликатес в остальной мир."
 SYR_bawabet_dimashq: "Ворота Дамаска"
 SYR_bawabet_dimashq_desc: "Шакер аль-Самман планирует открыть в Дамаске крупнейший в мире ресторан «Ворота Дамаска» (Bawabet Dimashq). Его площадь составит 54 000 квадратных метров, и он сможет вместить 6000 человек. С блюдами многих кухонь это станет отличной достопримечательностью Сирии!"
 SYR_keep_banks_national: "Оставить банки национальными"
 SYR_keep_banks_national_desc: "Никакой частный банк не имеет права работать в Сирии, и так должно оставаться. Имея только национальные банки, мы можем быть уверены, что сможем безопасно инвестировать и защищать деньги наших людей."
 SYR_legalise_private_banking: "Легализовать частное банковское дело"
 SYR_legalise_private_banking_desc: "Сирия уже находится в глубокой рецессии, и мы не хотим усугублять её, не допуская иностранные деньги в Сирию. Мы должны легализовать частное банковское дело, чтобы увеличить наш экономический рост."
 SYR_cbs: "Коммерческий банк Сирии"
 SYR_cbs_desc: "Коммерческий банк Сирии - старейшее и крупнейшее финансовое учреждение в стране, выступающее в качестве центрального клирингового центра для правительственных и внешнеторговых операций."
 SYR_stock_exchange: "Фондовая биржа Сирии"
 SYR_stock_exchange_desc: "Единственная фондовая биржа Сирии, основанная в 2009 году для привлечения инвестиций и оживления экономики, служит барометром деловой уверенности."
 SYR_siib: "Первый исламский банк"
 SYR_siib_desc: "Основанный в 2007 году как партнёрство между частными секторами Сирии и Катара, этот первый международный исламский банк направлен на привлечение инвестиций и интеграцию страны в глобальную исламскую финансовую систему."
 SYR_western_debt_negotiations: "Переговоры с западными кредиторами"
 SYR_western_debt_negotiations_desc: "Начать переговоры с Соединёнными Штатами и Европейским союзом о реструктуризации внешнего долга Сирии в обмен на либерализацию рынка и улучшение прав человека."
 SYR_eastern_debt_negotiations: "Поиск восточной финансовой поддержки"
 SYR_eastern_debt_negotiations_desc: "Обратиться к России, Ирану и Китаю за списанием долга и новыми кредитными линиями, укрепляя стратегические партнёрства ценой возросшей зависимости."
 SYR_bena_properties: "Bena Properties"
 SYR_bena_properties_desc: "Cham Holdings, принадлежащая семье Махлуф, планирует создать компанию по недвижимости. Мы должны работать вместе с ними, чтобы помочь развитию сирийской земли."
 SYR_join_wto: "Вступить в ВТО"
 SYR_join_wto_desc: "Сирия планировала вступить во Всемирную торговую организацию в 1950-х годах, когда она была создана, но в конечном итоге отозвала свою заявку из-за включения Израиля в организацию. Может быть, сейчас пришло время подать заявку? Это потребует больших усилий, поскольку многие наши торговые и экономические законы должны быть скорректированы в соответствии с требованиями ВТО."
 SYR_syrian_qatari_holding_company: "Сирийско-катарская холдинговая компания"
 SYR_syrian_qatari_holding_company_desc: "Мы должны работать вместе с правительством Катара и создать общую холдинговую компанию, которая будет инвестировать в Сирии, Катаре и по всему миру."
 SYR_invest_in_tourism: "Оживить туризм"
 SYR_invest_in_tourism_desc: "Благодаря улучшениям и инвестициям, которые мы сделали в нашей экономике, туристическая индустрия растёт до невиданных ранее масштабов. Скоро Сирия станет одним из самых популярных туристических направлений в Средиземноморье."
 SYR_invest_in_research: "Инвестировать в исследования"
 SYR_invest_in_research_desc: "Мы вложили много денег в нашу экономику. Мы должны направить часть денег в исследовательские центры и университеты."
 SYR_hmisho_steel: "Инвестировать в Hmisho Steel S.A"
 SYR_hmisho_steel_desc: "Торговая группа Hmisho планирует расширить свой сталелитейный завод. Мы должны субсидировать их для расширения производства."
 SYR_cooperate_with_saipa: "Сотрудничать с SAIPA"
 SYR_cooperate_with_saipa_desc: "SAIPA - это иранский автопроизводитель, производящий Citroen по лицензии, а также собственную линейку автомобилей. Торговая группа Hmisho заинтересована в сотрудничестве с ними и переносе части производства в Сирию."
 SYR_expand_oil_refineries: "Расширить нефтеперерабатывающие заводы"
 SYR_expand_oil_refineries_desc: "Хотя мы и не являемся крупным производителем нефти в мире, мы являемся довольно крупным местным производителем. Мы должны расширить наши возможности по переработке нефти, чтобы быть наравне с нашими соседями."
 SYR_found_syriatel: "Основать Syriatel"
 SYR_found_syriatel_desc: "В настоящее время в Сирии работает только один поставщик мобильной связи - MTN Syria. Мы должны создать другую компанию, чтобы также предлагать услуги."
 SYR_electronics_school: "Сирийский университет электроники"
 SYR_electronics_school_desc: "Будущее мира - в интернете и коммуникационных технологиях. Мы должны основать школу, посвящённую этим областям, чтобы мы могли быть на переднем крае технологий."
 SYR_syrian_anime: "Сирийское аниме"
 SYR_syrian_anime_desc: "Venus Centre, компания, базирующаяся в Дамаске, в настоящее время является единственной компанией по дубляжу, которая дублирует японское аниме (и другие мультфильмы) на арабский язык. Мы должны поощрять такое поведение."
 SYR_technological_investments: "Технологические инвестиции"
 SYR_technological_investments_desc: "Наши технологии чрезвычайно устарели, их нельзя просто игнорировать. Нам придётся что-то делать."
 SYR_digitalisation_campaign: "Кампания по цифровизации"
 SYR_digitalisation_campaign_desc: "Наша технологическая инфраструктура чрезвычайно устарела и неэффективна по сегодняшним стандартам. Мы должны направить средства на исследования и создание новых технологий, чтобы решить эту мешающую проблему."
 SYR_chinese_anime: "Китайское аниме"
 SYR_chinese_anime_desc: "Venus Centre, компания, базирующаяся в Дамаске, в настоящее время является единственной компанией по дубляжу, которая дублирует японское аниме (и другие мультфильмы) на арабский язык. Мы должны расширить их возможности и поощрять сотрудничество с китайскими аниме-студиями. Хотя они не так популярны, как их конкуренты, китайская анимационная индустрия, тем не менее, очень успешна, и для нас это отличная идея - учиться и сотрудничать с ними, чтобы стать ведущими производителями анимации на Ближнем Востоке и в арабском мире."
 SYR_domestic_anime: "Отечественное аниме"
 SYR_domestic_anime_desc: "Venus Centre, компания, базирующаяся в Дамаске, в настоящее время является единственной компанией по дубляжу, которая дублирует японское аниме (и другие мультфильмы) на арабский язык. Наша собственная культура и эстетика не должны подвергаться влиянию внешних тем, и нам не нужна иностранная экспертиза. Мы будем полностью полагаться на себя и не будем пытаться искать помощи у иностранных анимационных гигантов."
 SYR_japanese_anime: "Японское аниме"
 SYR_japanese_anime_desc: "Venus Centre, компания, базирующаяся в Дамаске, в настоящее время является единственной компанией по дубляжу, которая дублирует японское аниме (и другие мультфильмы) на арабский язык. Мы должны расширить их возможности и поощрять сотрудничество с японскими аниме-студиями. Не имеющий себе равных анимационный гигант, несомненно, окажет огромную помощь, когда дело дойдёт до создания нашей анимационной индустрии и производства самых популярных работ на Ближнем Востоке."
 SYR_tartus_service_sector: "Сектор услуг Тартуса"
 SYR_tartus_service_sector_desc: "Сектор услуг является одним из самых привлекательных секторов для занятости в городе Тартус. Поскольку высокий процент его жителей с хорошей научной квалификацией работает в сфере услуг, и они распределены между государственным и частным секторами."
 SYR_expand_the_sector: "Расширить частный сектор в Латакии"
 SYR_expand_the_sector_desc: "Участие частного сектора в Латакии всё ещё ниже требуемого уровня по сравнению с другими прибрежными городами Средиземноморья. Мы должны инвестировать конкретно сюда, чтобы превратить город в привлекательный экономический центр, используя его порт и расширяя его сервисную и коммерческую инфраструктуру."
 SYR_service_sector_in_lacking_regions: "Инвестиции в регионы с недостатком услуг"
 SYR_service_sector_in_lacking_regions_desc: "В то время как сектор услуг в Тартусе процветает, того же нельзя сказать о других, не менее важных городах, и посредством экономического поощрения квалифицированных рабочих работать за пределами Тартуса и инвестиций в перспективные предприятия мы исправим эту ситуацию."
 SYR_expand_powerstations_in_homs: "Расширить электростанции Хомса"
 SYR_expand_powerstations_in_homs_desc: "В нашей стране существует небольшое количество электростанций, и это постоянная и раздражающая проблема. Мы построим несколько электростанций в Хомсе из-за его центрального расположения, являющегося перекрёстком Сирии, и наличия в городе крупного нефтеперерабатывающего завода."
 SYR_tap_into_the_oil_reserves: "Воспользоваться нефтяными резервами"
 SYR_tap_into_the_oil_reserves_desc: "Нефтяные резервы в восточной части страны выглядят многообещающе и ждут наших буровых установок для их извлечения."
 SYR_kings_highway: "Возродить Царскую дорогу"
 SYR_kings_highway_desc: "Древняя Царская дорога когда-то соединяла империи и облегчала поток богатства, культуры и идей. Инвестируя в восстановление и продвижение этого исторического маршрута, мы можем раскрыть экономический потенциал наших внутренних регионов, стимулировать внутреннюю торговлю и привлечь туристов, желающих пройти по пути истории."
 SYR_road_to_palmyra: "Дорога в Пальмиру"
 SYR_road_to_palmyra_desc: "Пальмира - важный археологический объект, который привлёк приличное количество туристов. Мы улучшим инфраструктуру и дороги, чтобы туристам было легче посещать этот ландшафт."
 SYR_expand_latakian_airport: "Расширить аэропорт Латакии"
 SYR_expand_latakian_airport_desc: "Аэродром Латакии используется в военных целях. Однако есть большой потенциал для его использования гражданскими авиакомпаниями, поскольку город является туристическим центром, поэтому мы начнём инвестировать в него."
 SYR_cultural_centers_initiative: "Инициатива культурных центров"
 SYR_cultural_centers_initiative_desc: "Создать современные культурные центры, музеи и художественные галереи в крупных городах для продвижения сирийского искусства, привлечения культурного туризма и стимулирования креативной экономики."
 SYR_restore_historical_sites: "Восстановить исторические места"
 SYR_restore_historical_sites_desc: "Инвестировать в восстановление и сохранение древнего наследия Сирии, включая Пальмиру, Цитадель Алеппо и Крак-де-Шевалье, чтобы привлечь международных туристов и получить признание ЮНЕСКО."
 SYR_idlib_aleppan_investments: "Сельскохозяйственные связи Идлиба и Алеппо"
 SYR_idlib_aleppan_investments_desc: "Алеппо имеет огромное экономическое присутствие в сельском хозяйстве Идлиба. Мы будем поощрять дальнейшие инвестиции, чтобы принести пользу обоим регионам и поощрять агропромышленный потенциал двух городов."
 SYR_idlib_contest_aleppan_investments: "Оспаривать присутствие Алеппо"
 SYR_idlib_contest_aleppan_investments_desc: "Хотя экономическое присутствие Алеппо в Идлибе выгодно для обоих городов, такое положение дел может привести к тому, что экономические силы, находящиеся вне нашего контроля, получат нежелательную власть. Мы должны бороться с их присутствием, инвестируя в Идлиб и сокращая экономические амбиции Алеппо в регионе."
 SYR_provisions_to_daraa: "Поставки в Даръа"
 SYR_provisions_to_daraa_desc: "Даръа пострадала от сокращения водоснабжения в регионе и была напряжена из-за притока внутренних беженцев, которые были вынуждены покинуть свои северо-восточные земли из-за засухи, усугублённой отсутствием обеспечения со стороны правительства. Мы будем инвестировать в регион и работать над устранением этих проблем немедленно."
 SYR_invest_in_hasakan_cotton: "Инвестировать в хлопок Хасаки"
 SYR_invest_in_hasakan_cotton_desc: "Экономический бум в городах Камышлы и Хасеке был результатом ирригационных проектов, начатых в 1960-х годах, которые превратили северо-восточную Сирию в район выращивания хлопка. Это принесёт большую пользу нашей экономике, и мы воспользуемся потенциалом города для размещения прибыльной текстильной промышленности."
 SYR_overhaul_national_grid: "Модернизация национальной электросети"
 SYR_overhaul_national_grid_desc: "Наша стареющая энергосеть вызывает постоянные отключения электроэнергии и неэффективность. Эта государственная программа заменит устаревшие трансформаторы и линии электропередач и построит новую центральную электростанцию, чтобы обеспечить стабильную и современную электрическую основу для нации."
 SYR_empower_energy_ministry: "Расширить полномочия министерства энергетики"
 SYR_empower_energy_ministry_desc: "Чтобы эффективно управлять модернизированной сетью, мы должны реформировать министерство энергетики. Предоставление ему больших регулятивных полномочий, финансирования и технической власти централизует планирование и обеспечит долгосрочную стабильность и стратегическое развитие сектора."
 SYR_streamline_energy_sector: "Оптимизировать энергетический сектор"
 SYR_streamline_energy_sector_desc: "Последний шаг в нашей модернизации энергетики - максимизация производства. Развёртывая передовые системы мониторинга, автоматизируя распределение и модернизируя старые заводы, мы можем значительно повысить эффективность и надёжность всей национальной сети."
 SYR_renewables_focus: "Сосредоточиться на возобновляемой энергии"
 SYR_renewables_focus_desc: "Мы страдаем от многих проблем с электричеством и производством энергии из-за низких объёмов бурения нефтяных скважин, а также из-за растущего населения. Разумнее сосредоточиться на возобновляемых альтернативах, потому что, если подумать, наш зависимый от нефти энергетический сектор станет в будущем скорее обузой."
 SYR_invest_in_wdrvm: "Инвестировать в WDRVM"
 SYR_invest_in_wdrvm_desc: "WDRVM - это перспективная компания, специализирующаяся на производстве и установке ветряных турбин и электростанций. У них амбициозные планы по установке ветряных турбин по всему региону и решению энергетических проблем путём эксплуатации немногих регионов, где присутствуют стабильные ветры. Хотя эти регионы разбросаны с нечастыми стабильными ветрами, нельзя отрицать положительное влияние на наш энергетический сектор."
 SYR_set_up_puppet_ren_company: "Марионеточная компания по возобновляемой энергии"
 SYR_set_up_puppet_ren_company_desc: "Мы должны поддержать марионеточную компанию по возобновляемой энергии, чтобы ещё больше укрепить нашу власть над экономикой."
 SYR_encourage_domestic_solar_companies: "Отечественные солнечные компании"
 SYR_encourage_domestic_solar_companies_desc: "В стране создаётся несколько амбициозных компаний в области солнечной энергетики, и мы должны инвестировать в них, чтобы стимулировать внутреннее производство солнечных панелей."
 SYR_monopolize_solar_power: "Монополизировать солнечную энергетику"
 SYR_monopolize_solar_power_desc: "Большие возможности для получения прибыли лежат в солнечном потенциале нашей пустыни. Мы создадим наши собственные солнечные энергетические компании, чтобы монополизировать этот многообещающий сектор."
 SYR_green_syria: "Проект «Зелёная Сирия»"
 SYR_green_syria_desc: "Теперь, когда наша внутренняя солнечная промышленность находится под твёрдым контролем государства, мы можем запустить грандиозную международную пропагандистскую кампанию. «Зелёная Сирия» станет нашим новым брендом - нарративом устойчивого развития и экологического управления в самом сердце Ближнего Востока. Мы будем добиваться европейских зелёных фондов и политической доброй воли, представляя нашу энергетическую монополию не как тиранию, а как дальновидный государственный энвайронментализм. Прибыль и иностранные инвестиции, конечно, потекут в нужные карманы."
 SYR_nuclear_program: "Ядерная программа"
 SYR_nuclear_program_desc: "Путь к энергетической независимости и стратегическому сдерживанию начинается с обязательства использовать энергию атома. Мы создадим всеобъемлющую ядерную программу."
 SYR_ask_kdpr: "Обратиться за помощью к КНДР"
 SYR_ask_kdpr_desc: "Корейская Народно-Демократическая Республика успешно развила ядерный потенциал, несмотря на международную изоляцию. Их опыт может ускорить нашу программу, хотя и ценой привлечения нежелательного внимания."
 SYR_ask_israel: "Апеллировать к израильскому опыту"
 SYR_ask_israel_desc: "Израиль обладает передовыми ядерными технологиями и научными знаниями. Тайное обращение к их учёным может принести дивиденды, но можем ли мы доверять нашему старому противнику, чтобы он помог нам?"
 SYR_ask_pakistan: "Пакистанский ядерный опыт"
 SYR_ask_pakistan_desc: "Пакистан, братская мусульманская страна, достиг ядерного потенциала. Их опыт в обогащении урана и разработке оружия может быть бесценен для нашей программы."
 SYR_prepare_materials: "Добыча и переработка урана"
 SYR_prepare_materials_desc: "Мы должны обеспечить внутренний источник урановой руды и создать объекты для переработки её в жёлтый кек (yellowcake). Шахты недалеко от Хомса будут расширены и модернизированы."
 SYR_invite_scientists: "Инициатива иностранных учёных"
 SYR_invite_scientists_desc: "Мы обратимся к учёным-ядерщикам по всему миру, предлагая щедрые стимулы для работы над нашей программой. В Дамаске будет построен специальный исследовательский центр для их размещения."
 SYR_boost_nuclear_research: "Передовые ядерные исследования"
 SYR_boost_nuclear_research_desc: "Имея необходимые материалы и научный персонал, мы можем теперь продвинуться вперёд с передовыми исследованиями в области проектирования реакторов и ядерной физики."
 SYR_build_pvos: "Интегрированная сеть ПВО"
 SYR_build_pvos_desc: "Наши ядерные объекты уязвимы для воздушных атак. Мы развернём эшелонированные системы ПВО вокруг ключевых объектов, чтобы защитить наши стратегические активы."
 SYR_build_nuclear_syr: "Сирийский ядерный сдерживающий фактор"
 SYR_build_nuclear_syr_desc: "Последний шаг: строительство ядерного реактора, способного производить расщепляющийся материал для нашего арсенала. Как только он заработает, Сирия присоединится к рядам ядерных держав."
 SYR_build_nuclear: "Сирийская ядерная программа"
 SYR_bowels_desert: "Недра пустыни"
 SYR_bowels_desert_desc: "Пески Сирийской пустыни могут скрывать ценные ресурсы. Инвестируя в технологии бурения и создавая инфраструктуру, мы можем извлечь эти потенциальные нефтяные месторождения."
 SYR_found_sgc: "Основать Сирийскую газовую компанию"
 SYR_found_sgc_desc: "Чтобы обеспечить энергией нашу растущую промышленность и города, нам нужна надёжная внутренняя поставка газа. Государственная Сирийская газовая компания будет отвечать за разведку, добычу и распределение природного газа по всей стране."
 SYR_treasures_levantine_sea: "Сокровища Левантийского моря"
 SYR_treasures_levantine_sea_desc: "Разведка нефти и газа на шельфе Левантийского бассейна предлагает путь к энергетической независимости и процветанию. Мы разрешим глубоководное бурение и будем искать международные партнёрства для разработки этих стратегических ресурсов, укрепляя нашу экономику и геополитическое положение."
 SYR_invest_shair_gas_field: "Инвестировать в газовое месторождение Шаир"
 SYR_invest_shair_gas_field_desc: "Чтобы модернизировать наш энергетический сектор, мы ищем международный опыт и капитал. Предлагая права на разработку месторождения Шаир квалифицированным иностранным партнёрам, мы можем ускорить добычу, одновременно развивая ценные экономические и дипломатические связи."
 SYR_initiate_industrialization: "Инициировать индустриализацию"
 SYR_initiate_industrialization_desc: "Наши промышленные возможности устарели и практически отсутствуют. Тем не менее, у нас есть потенциал начать промышленный рост, который значительно усилит и оживит нашу экономику."
 SYR_damascus_automotive_potential: "Автомобильный потенциал Дамаска"
 SYR_damascus_automotive_potential_desc: "Многие промышленные регионы в Дамаске, предназначенные для сборки автомобилей, существуют, но им уделяется меньше внимания, чем они заслуживают. Мы начнём инвестировать в них."
 SYR_invite_automotive_giants: "Пригласить автомобильных гигантов"
 SYR_invite_automotive_giants_desc: "Популярные автомобильные бренды, такие как Mitsubishi, Toyota и Volkswagen, принесут большую пользу нашей экономике, если мы убедим их инвестировать в нас. Это позволит нашему населению приобретать качественные автомобили."
 SYR_SIAMCO_monopoly: "Монополия SIAMCO"
 SYR_SIAMCO_monopoly_desc: "У нас есть опыт сотрудничества с автомобильными брендами из Ирана и Китая, и так должно оставаться всегда, чтобы производить доступные автомобили и не допускать нежелательного влияния на нашу экономику."
 SYR_homs_heavy_industry: "Тяжёлая промышленность Хомса"
 SYR_homs_heavy_industry_desc: "Хомс является домом для нескольких крупных государственных предприятий тяжёлой промышленности. Очевидно, что у него многообещающее будущее как промышленного гиганта, и мы должны инвестировать в них, чтобы город процветал."
 SYR_homs_oil_refineries_focus: "Расширить нефтеперерабатывающие заводы"
 SYR_homs_oil_refineries_focus_desc: "Привлекательные и обильные запасы нефти ждут нас для разведки в восточных регионах страны. Мы начнём этот процесс за счёт сельскохозяйственных возможностей из-за загрязнения, которое мы вызовем."
 SYR_phosphate_extraction: "Добыча фосфатов"
 SYR_phosphate_extraction_desc: "Мы расширим и построим новые фосфатные заводы для добычи этого полезного ресурса, который в изобилии присутствует в стране."
 SYR_tartus_pharmaceutical_giant: "Фармацевтический гигант"
 SYR_tartus_pharmaceutical_giant_desc: "Тартус имеет многочисленные фармацевтические заводы, которые формируют грозную опору нашей экономики. Пришло время решить будущее этого сектора."
 SYR_pharmaceutical_export_focus: "Поощрять экспорт"
 SYR_pharmaceutical_export_focus_desc: "Мы будем инвестировать в фармацевтические компании и поощрять их расширение в сторону регионального превосходства и поощрять экспорт наших лекарств. Это будет отлично для нашего экономического роста."
 SYR_pharmaceutical_healthcare_focus: "Снизить цены на лекарства"
 SYR_pharmaceutical_healthcare_focus_desc: "Наши люди могут использовать это мастерство для своего благополучия. Мы выделим процент нашего бюджета на то, чтобы сделать медикаменты и фармацевтические продукты более дешёвыми для нашего населения."
 SYR_expand_cement_industry: "Расширить цементную промышленность"
 SYR_expand_cement_industry_desc: "Государство сохраняет контроль над стратегической цементной промышленностью - основой любого строительного бума. Инвестиции в модернизацию пяти крупных государственных заводов значительно увеличат производство цемента, ускоряя строительство как гражданской, так и военной инфраструктуры по всей стране."
 SYR_reform_construction_sector: "Реформировать строительный сектор"
 SYR_reform_construction_sector_desc: "Неорганизованная строительная промышленность препятствует нашему прогрессу. Необходима возглавляемая государством реформа для оптимизации проектов и мобилизации ресурсов."

 #Ideas
 military_power_vacuum: "Военный вакуум власти"
 military_power_vacuum_desc: "Из-за напряжённой политической атмосферы в Сирии, в которую теперь вовлечены военные, из-за серьёзных политических или, лучше сказать, «переворотных» действий сирийских военных, которые привели к краху алавитского высшего командования, страна переживает эпоху хаоса."
 syrian_agricultural_capability_fully_unleached: "Аграрное общество"
 syrian_agricultural_capability_fully_unleached_desc: "Судя по политике нового правительства в Сирии, эта страна, по-видимому, выбрала более... консервативный путь, а не прогрессивный, по крайней мере, с точки зрения экономики."
 syrian_industrial_capability_fully_unleached: "Быстрое промышленное расширение"
 syrian_industrial_capability_fully_unleached_desc: "При полной поддержке промышленников и привлечении новых инвесторов в страну Сирия делает новый шаг на пути к будущему своей страны: масштабная индустриализация."
 syria_support_anime: "Поддержка аниме"
 syria_support_anime_desc: "Государство поддерживает распространение аниме"
 syria_agricultural_subsidies: "Сельскохозяйственные субсидии"
 syria_agricultural_subsidies_desc: "В Сирии действует система сельскохозяйственных субсидий, в рамках которой 4% её ВВП используется для поддержки местных фермеров в целях обеспечения внутреннего производства пшеницы и хлопка. Поддержка в основном осуществляется в форме субсидирования дизельного топлива и цены на хлопок."
 syria_increased_agricultural_subsidies: "Увеличенные сельскохозяйственные субсидии"
 syria_increased_agricultural_subsidies_desc: "Мы увеличили сельскохозяйственные субсидии до 6% ВВП, чтобы сохранить жизнеспособность внутреннего производства продовольствия и стимулировать выращивание товарных культур. Хотя это дорого, это заставит людей чувствовать себя в большей безопасности в отношении своего будущего."
 syria_decreased_agricultural_subsidies: "Уменьшенные сельскохозяйственные субсидии"
 syria_decreased_agricultural_subsidies_desc: "Мы уменьшили сельскохозяйственные субсидии до 2% ВВП, чтобы снизить нагрузку на государственный бюджет. Цены на сельскохозяйственные культуры теперь в большей степени зависят от глобальных рыночных цен. Хотя это дёшево для правительства, это увеличит цену на продукты питания и снизит стимулы для людей выращивать товарные культуры."
 divided_syria: "Сирия: разделённый дом"
 divided_syria_desc: "В дополнение к разрушению домов и ужасам войны многие молодые люди покидают Сирию, чтобы избежать призыва. С учётом того, что миллионы уже покинули Сирию и сотни тысяч потерь на полях сражений, доступная рабочая сила для сирийских вооружённых сил невелика."
 divided_syria_1: "Сирия: разделённый дом"
 divided_syria_1_desc: "В дополнение к разрушению домов и ужасам войны, многие молодые люди покидают Сирию, чтобы избежать призыва. С учётом того, что миллионы уже покинули Сирию и сотни тысяч потерь на полях сражений, доступная рабочая сила для сирийских вооружённых сил невелика."
 divided_syria_2: "Сирия: разделённый дом"
 divided_syria_2_desc: "В дополнение к разрушению домов и ужасам войны, многие молодые люди покидают Сирию, чтобы избежать призыва. С учётом того, что миллионы уже покинули Сирию и сотни тысяч потерь на полях сражений, доступная рабочая сила для сирийских вооружённых сил невелика."
 divided_syria_3: "Сирия: разделённый дом"
 divided_syria_3_desc: "В дополнение к разрушению домов и ужасам войны, многие молодые люди покидают Сирию, чтобы избежать призыва. С учётом того, что миллионы уже покинули Сирию и сотни тысяч потерь на полях сражений, доступная рабочая сила для сирийских вооружённых сил невелика."
 syrian_social_nationalists: "Поддержка от ССНП"
 syrian_social_nationalists_desc: "Сирийская социал-националистическая партия (ССНП) - это растущая сила в Сирии, выступающая за создание сирийского национального государства, охватывающего Сирию, Ливан, Ирак, Кувейт, Иорданию, Палестину, Израиль, Кипр, Синай и Юго-Восточную Турцию. Они оказывают ключевую поддержку военным усилиям, и их ополчение насчитывает не менее 8000 членов."
 syrian_social_nationalists_inc: "ССНП в правительстве"
 syrian_social_nationalists_inc_desc: "Сирийская социал-националистическая партия (ССНП) - это растущая сила в Сирии, выступающая за создание сирийского национального государства, охватывающего Сирию, Ливан, Ирак, Кувейт, Иорданию, Палестину, Израиль, Кипр, Синай и Юго-Восточную Турцию. Их политическое крыло было включено в режим Асада, и их ополченцы служат вместе с Сирийской арабской армией."
 alawite_high_command: "Военные с алавитским преобладанием"
 alawite_high_command_desc: "Ключевые подразделения Сирийской арабской армии находятся под строгим контролем офицеров из алавитской ветви шиитского ислама - той же религиозной деноминации, к которой принадлежит семья Аль-Асад. Это обеспечивает лояльность этих подразделений, но значительно усложняет поиск выдающихся личностей. Эти офицеры станут препятствием, если к власти придёт «Братья-мусульмане», так как они воспринимают их как угрозу своей алавитской секте, и нам придётся сначала их искоренить. Если же они укрепятся, то сделают всё возможное, чтобы сохранить власть Асадов."
 alawite_high_command_strengthened: "Военные с алавитским преобладанием"
 alawite_high_command_strengthened_desc: "Ключевые подразделения Сирийской арабской армии находятся под строгим контролем офицеров из алавитской ветви шиитского ислама - той же религиозной деноминации, к которой принадлежит семья Аль-Асад. Это обеспечивает лояльность этих подразделений, но значительно усложняет поиск выдающихся личностей. Теперь эти офицеры абсолютно обеспечат оставление Асадов у власти."
 baath_party_banned: "Партия Баас запрещена"
 baath_party_banned_desc: "Партия Баас старого режима Асада была запрещена для публичной деятельности и агитации."
 ssnp_party_banned: "ССНП запрещена"
 ssnp_party_banned_desc: "Сирийская социал-националистическая партия была запрещена для публичной деятельности и агитации."
 salafist_party_banned: "Фундаменталистские партии запрещены"
 salafist_party_banned_desc: "Фундаменталистские партии были запрещены для публичной деятельности и агитации."
 true_caliphate: "Сирийский халифат"
 true_caliphate_desc: "Мы провозгласили Исламскую Сирию родиной нового мусульманского халифата."
 global_salafist_recruitment: "Глобальный набор"
 global_salafist_recruitment_desc: "Ежедневно в нашу армию прибывают новые солдаты со всего мира."
