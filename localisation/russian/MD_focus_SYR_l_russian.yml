 loyal_marriage: "Лояльный брак"
 loyal_marriage_desc: "Асма аль-Асад - блестящий экономист, и она будет помогать с инвестициями по всей Сирии."
 autonomous_region_syr: "Автономный регион"
 occupation_of_lebanon_dynamic_modifier: "Оккупация Ливана"
 TT_occupation_of_lebanon_dynamic_modifier: "С 1976 года, почти сразу же после начала гражданской войны в Ливане, Сирия разместила в Ливане около 30 000 солдат. После окончания гражданской войны в 1991 году между Ливаном и Сирией был подписан пакт о дружбе и безопасности, в соответствии с которым Сирия взяла на себя ответственность за оборону Ливана.\n\nПродолжение оккупации будет дорогостоящим, но это позволит нам в конечном итоге значительно приблизиться к Ливану. Несмотря на договор о дружбе с Ливаном, размещение войск рассматривается международным сообществом как незаконная оккупация, поскольку Ливан не отказывается от своего мандата с 1982 года.\n\nДополнительные расходы: $§R0.250§!"
 alawite_political_inclusiveness_dynamic_modifier: "Политическая инклюзивность алавитской общины"
 TT_alawite_political_inclusiveness_dynamic_modifier: "Алавиты - этнорелигиозная группа, проживающая в основном в Леванте и исповедующая алавизм, секту ислама, произошедшую от шиитского ислама. Их политическая инклюзивность в стране [?alawite_status|%%Y] определяет уровень доверия и политической активности в политике страны и на неё негативно влияют коррупция, отсутствие региональной инфраструктуры, плохая репутация религиозных свобод и отсутствие региональной промышленности по сравнению с другими частями страны."
 druze_political_inclusiveness_dynamic_modifier: "Политическая инклюзивность друзской общины"
 TT_druze_political_inclusiveness_dynamic_modifier: "Друзы - этнические арабы и арабоговорящие. Их монотеистическая религия включает в себя множество верований из ислама, иудаизма и христианства, а также находится под влиянием греческой философии и индуизма. Их политическая инклюзивность в стране [?druze_status|%%Y] определяет уровень доверия и политической активности в политике страны и на неё негативно влияют коррупция, отсутствие региональной инфраструктуры, плохая репутация религиозных свобод и отсутствие региональной промышленности по сравнению с другими частями страны."
 kurdish_political_inclusiveness_dynamic_modifier: "Политическая инклюзивность курдской общины"
 TT_kurdish_political_inclusiveness_dynamic_modifier: "Курды - иранская этническая группа, родом из горного региона Курдистан в Западной Азии, который охватывает юго-восточную Турцию, северо-западный Иран, северный Ирак и северную Сирию. Их политическая инклюзивность в стране [?kurdish_status|%%Y] определяет уровень доверия и политической активности в политике страны и на неё негативно влияют коррупция, отсутствие региональной инфраструктуры и отсутствие региональной промышленности по сравнению с другими частями страны."
 syria_jewish_rights_guaranteed: "Еврейские права гарантированы"
 syria_jewish_rights_guaranteed_desc: "Мы гарантируем особые права евреям в бывшем Израиле"
 syria_bakdash: "Бакдаш"
 syria_bakdash_desc: "Бакдаш - это кафе-мороженое с более чем 100-летней историей, работающее в Дамаске и известное своим мороженым в стиле буза. Правительство решило помочь этому кафе-мороженому выйти на международные рынки."
 syria_natsec_constitution: "Иллиберальная демократия"
 syria_natsec_constitution_desc: "Правящая партия «Национальный завет» Сирии реформировала конституцию, чтобы президент Сирии мог быть любого вероисповедания. Нарушая многолетнюю традицию назначения президента-мусульманина и практикуя идеальную форму демократии. Однако, как бы прогрессивно это ни звучало, Сирия принимает демократию, которая по своей природе нелиберальна. Такая, которая ставит во главу угла национальную безопасность и суверенитет, иногда за счёт экономической и политической свободы. Гарантируя, что Сирия продолжит свой популистский правый курс."
