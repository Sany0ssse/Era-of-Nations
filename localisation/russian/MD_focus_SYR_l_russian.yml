 SYR_Invite_Rifaat_Back: "§CПригласить Рифаата обратно§!"
 SYR_Invite_Rifaat_Back_desc: "Генерал Рифаат аль-Асад берёт власть во имя восстановления порядка и стабильности в стране. При поддержке армии и служб безопасности он стремится модернизировать государство, укрепить экономику и установить прочные связи с западными партнёрами.\nПод его руководством Сирия обретёт силу, процветание и место среди великих наций. Начинается новая эра."
 SYR_Cover_Up_the_Hama_Incident: "Замести инцидент в Хаме"
 SYR_Cover_Up_the_Hama_Incident_desc: "Дело Хамы должно быть погребено под официальным молчанием и дисциплинированным изложением. Контролируя нарратив, режим может оградить себя от скандала и сохранить миф о порядке."
 SYR_Egyptian_Experience: "Египетский опыт"
 SYR_Egyptian_Experience_desc: "Рифаат аль-Асад признаёт сходство между собой и египетским лидером - оба являются западными автократами, борющимися за власть в нестабильном регионе. Изучение методов египетского режима позволит Рифаату укрепить свою власть и обеспечить стабильность с помощью проверенных методов авторитарного управления."
 SYR_Restore_Latakia_Network: "Восстановить сеть Латакии"
 SYR_Restore_Latakia_Network_desc: "Латакия - главный морской порт Сирии - становится центром амбициозного проекта по восстановлению портовой инфраструктуры и торговых сетей. Рифаат инвестирует в модернизацию портовых сооружений, расширение складских комплексов и создание логистических центров. Восстановленная сеть Латакии позволит Сирии контролировать товарные потоки в Восточном Средиземноморье и превратить порт в региональный торговый узел."
 SYR_Ensure_Saudi_Ties: "Обеспечить связи с Саудовской Аравией"
 SYR_Ensure_Saudi_Ties_desc: "Эр-Рияд является источником денег, влияния и консервативной поддержки, которую нельзя игнорировать. Осторожное взаимопонимание с Саудовской Аравией может укрепить позиции режима и стабилизировать экономику."
 SYR_Appease_the_Kurds: "Умиротворить курдов"
 SYR_Appease_the_Kurds_desc: "Сирия проводит политику умиротворения курдского населения с помощью социальных программ. Эта стратегия направлена на предотвращение конфликта и интеграцию курдов в государственную структуру при сохранении центрального контроля."
 SYR_Exclusive_British_Partnership_with_Syria: "Эксклюзивное британское партнёрство с Сирией"
 SYR_Turkish_Normalization_Negotation: "Переговоры о нормализации с Турцией"
 SYR_Turkish_Normalization_Negotation_desc: "Старая напряжённость с Анкарой сменяется осторожным торгом и практическими компромиссами. Нормализация с Турцией может обезопасить границу, уменьшить давление и открыть дверь к региональной стабильности."
 SYR_Syrian_Trade_Hub_Project: "Проект сирийского торгового узла"
 SYR_Syrian_Trade_Hub_Project_desc: "Создание всеобъемлющего торгового центра превращает Сирию в ключевой коммерческий узел. Стратегическое развитие портов, современная логистическая инфраструктура и коммерческие объекты позволят Сирии доминировать в региональных торговых потоках и генерировать крупное экономическое процветание."
 SYR_Support_Opposition_in_Iraq: "Поддержка оппозиции в Ираке"
 SYR_Support_Opposition_in_Iraq_desc: "С помощью тайных операций и финансовой поддержки Сирия укрепит позиции оппозиционных сил в Ираке. Эта стратегия направлена на ослабление власти иракского правительства при одновременном расширении сирийского влияния в регионе."
 SYR_Pardon_All_Relatives: "Помиловать всех родственников"
 SYR_Pardon_All_Relatives_desc: "Годы изгнания и внутренних семейных конфликтов подходят к концу. Рифаат аль-Асад протягивает руку примирения членам клана Асадов, предлагая амнистию всем, кто был изгнан или преследовался после его прихода к власти.\nБашар аль-Асад и его сторонники получат помилования в обмен на лояльность новому режиму. Это объединит алавитскую элиту, но потребует политических компромиссов и ослабит личную власть Рифаата. Москва наблюдает за этим процессом с одобрением - стабильная Сирия служит российским интересам в регионе."
 SYR_Exclusive_British_Partnership_with_Syria_desc: "Рифаат аль-Асад направляет дипломатическую делегацию в Лондон, чтобы предложить эксклюзивное партнёрство. Сирия предлагает Великобритании доступ к своим портам, выгодные инвестиционные перспективы и стратегическое сотрудничество по всему Восточному Средиземноморью, ожидая взамен экономическую помощь, военно-техническую помощь и международное признание нового политического порядка Сирии. Эта инициатива может кардинально изменить положение Сирии в мировых делах."
 SYR_Syrian_Seculirization: "Секуляризация"
 SYR_Syrian_Seculirization_desc: "Секуляризация государства направлена на отделение религии от политики и общественной жизни. Светское образование, западные ценности и научный подход становятся новой идеологией режима, маргинализируя религиозные институты от политической власти."
 SYR_Establish_Militiry_Political_Autonomy: "Установить военно-политическую автономию"
 SYR_Establish_Militiry_Political_Autonomy_desc: "Вооружённые силы получают политическую и финансовую автономию, становясь независимой ветвью власти. Военное командование получает право самостоятельно определять стратегию национальной безопасности и контролировать значительную часть государственного бюджета, делая армию основным инструментом политической власти."
 SYR_Steps_to_Democratization: "Шаги к демократизации"
 SYR_Steps_to_Democratization_desc: "Демократизация будет вводиться осторожно, контролируемыми шагами, которые не угрожают основной власти режима. Процесс призван проецировать реформы, сохраняя государство твёрдо в надёжных руках."
 SYR_Establish_Local_Electoral_Councils: "Создать местные избирательные советы"
 SYR_Establish_Local_Electoral_Councils_desc: "Создание сети местных избирательных советов служит двойной цели: предоставить населению видимость демократического участия, одновременно усиливая государственный контроль через сетевую систему управления. Советы станут инструментом пропаганды и политического надзора на местном уровне."
 SYR_Reestablish_Western_Ties: "Восстановление западных отношений"
 SYR_Reestablish_Western_Ties_desc: "После лет изоляции и конфликтов Сирии необходимо восстановить дипломатические и экономические связи с западными державами. Рифаат аль-Асад, как западный автократ, понимает важность сотрудничества. Укрепление этих связей обеспечит экономическое развитие и международное признание нового режима."
 ##########Modifier##########
 SYR_pardon_clan: "Примирение с кланом Асадов"
 SYR_latakia_network_modifier: "Восстановить сеть"
 ##########Events##########
 SYR.Rifaat.1.t: "Приход Рифаата аль-Асада к власти"
 SYR.Rifaat.1.d: "Генерал Рифаат аль-Асад берёт власть во имя восстановления порядка и стабильности в стране. При поддержке армии и служб безопасности он стремится модернизировать государство, укрепить экономику и установить прочные связи с западными партнёрами.\nПод его руководством Сирия обретёт силу, процветание и место среди великих наций. Начинается новая эра."
 SYR.Rifaat.1.a: "Рифаат сделает Сирию великой"
 SYR_Rifaat_british.2.d: "Британия одобрила наше предложение о партнёрстве. Торговое соглашение подписано, и британские инвестиции начнут поступать в сирийскую экономику."
 SYR_Rifaat_british.3.d: "Британия отклонила наше предложение. Переговоры о партнёрстве провалились, и британские инвестиции остаются недосягаемыми."
 SYR_Rifaat_turkish.1.t: "Сирия предлагает нам сотрудничество"
 SYR_Rifaat_turkish.1.d: "Нам предложили эксклюзивное экономическое партнёрство с Сирией. Соглашение обещает преференциальный доступ к сирийским рынкам, совместные инвестиции и значительное расширение британского экономического влияния в регионе. Необходимо принять решение о жизнеспособности такого партнёрства."
 SYR_Rifaat_turkish.2.t: "Турция соглашается"
 SYR_Rifaat_turkish.3.t: "Турция отказывается"
 SYR_Rifaat_turkish.2.d: "Турция одобрила наше предложение о партнёрстве. Торговое соглашение подписано, и британские инвестиции начнут поступать в сирийскую экономику."
 SYR_Rifaat_turkish.3.d: "Турция отклонила наше предложение. Переговоры о партнёрстве оказались безуспешными, и доступ к британскому капиталу остаётся недосягаемым."
 SYR_Rifaat_turkish.1: "Сирия предлагает нам сотрудничество"
 SYR_Rifaat_british.1.t: "Сирия предлагает нам сотрудничество"
 SYR_Rifaat_british.1.d: "Сирия сделала нам предложение об эксклюзивном экономическом партнёрстве, предоставляя доступ к сирийским рынкам, преференциальные торговые условия и инвестиционные возможности в ключевых экономических секторах. Это соглашение укрепит наше экономическое влияние в Восточном Средиземноморье и откроет новые пути для британского капитала. Однако мы должны учитывать политические последствия сотрудничества с режимом Рифаата аль-Асада."
 SYR_Rifaat_british.2.t: "Британия соглашается"
 SYR_Rifaat_british.3.t: "Британия отказывается"

