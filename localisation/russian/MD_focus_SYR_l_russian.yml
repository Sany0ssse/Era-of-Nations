 idea_syrian_kurds_without_citizenships: "Курдское отчуждение"
 idea_syrian_kurds_without_citizenships_desc: "Обращаясь как с иностранцами на их собственных землях, по крайней мере 300 тысяч курдов лишены гражданства и обвиняются в пересечении границ страны."
 idea_syrian_banking_problem: "Банковские ограничения"
 idea_syrian_banking_problem_desc: "Банковское дело в Сирии контролируется Центральным банком Сирии, который также контролирует все валютные и торговые операции. Все коммерческие банки в Сирии были национализированы в 1966 году. Центральный банк отдаёт приоритет кредитованию государственного сектора, в то время как частный сектор часто ведёт банковскую деятельность за рубежом, что является более дорогостоящим процессом и, следовательно, плохим решением для потребностей промышленного финансирования."
