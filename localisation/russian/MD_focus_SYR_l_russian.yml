 SYR_Listen_to_Sami_al_Oraydi: "Послушать Сами аль-Орайди"
 SYR_Listen_to_Sami_al_Oraydi_desc: "Сами аль-Орайди - видная фигура в халифате. Он является ведущей фигурой в идеологии халифата и известен своей сильной поддержкой целей халифата. Мы должны слушать его и следовать его руководству."
 SYR_Radicalize_the_Ulema: "Радикализировать улемов"
 SYR_Radicalize_the_Ulema_desc: "Улемы - это религиозные лидеры халифата. Они несут ответственность за обучение масс идеологии халифата. Мы должны радикализировать их и сделать их более радикальными в их поддержке целей халифата."
 SYR_Bring_more_International_Jihadists: "Привлечь больше международных джихадистов"
 SYR_Bring_more_International_Jihadists_desc: "Халифат - это сильная сила в регионе, но он не одинок. Мы должны привлечь больше международных джихадистов, чтобы присоединиться к нашему делу и помочь нам распространять нашу идеологию."
 SYR_Our_Path_to_Caliphate: "Наш путь к халифату"
 SYR_Our_Path_to_Caliphate_desc: "Наш путь к халифату ясен. Мы пойдём по пути пророка Мухаммеда и его сподвижников и распространим слово Аллаха по всему миру."
 SYR_Invite_Ayman_al_Zawahiri: "Пригласить Аймана аз-Завахири"
 SYR_Invite_Ayman_al_Zawahiri_desc: "Айман аз-Завахири - видная фигура в халифате. Он является ведущей фигурой в идеологии халифата и известен своей сильной поддержкой целей халифата. Мы должны пригласить его присоединиться к нашему делу и помочь нам распространять нашу идеологию."
 SYR_Implement_Hudud: "Внедрить худуд"
 SYR_Implement_Hudud_desc: "Худуд - это система исламского права, используемая для управления исламским государством. Мы должны внедрить её в нашей стране, чтобы гарантировать, что наши законы соответствуют исламскому праву."
 SYR_ideological_purity: "Идеологическая чистота"
 SYR_ideological_purity_desc: "Мы должны стремиться поддерживать чистую идеологию. Это поможет нам привлечь больше последователей и укрепить наши позиции в регионе."
 SYR_mushriq_chase: "Преследование мушриков"
 SYR_mushriq_chase_desc: "Мушрики - это немусульманские последователи исламской веры. Они несут ответственность за распространение исламской веры по всему миру. Мы должны преследовать их и уничтожить с лица земли."
 SYR_isis_negotiate: "Переговоры с ИГИЛ"
 SYR_isis_negotiate_desc: "ИГИЛ - это мощная сила в регионе, и мы должны вести с ними переговоры, чтобы обеспечить их на нашей стороне. Мы должны предложить им сделку, которая принесёт пользу обеим сторонам."
 SYR_issuing_jihad_orders: "Издание приказов о джихаде"
 SYR_issuing_jihad_orders_desc: "Мы должны издавать приказы о джихаде нашим войскам, чтобы гарантировать, что они сражаются за дело халифата."
 SYR_to_sham_and_beyond: "§RВ Шам и за его пределы"
 SYR_to_sham_and_beyond_desc: "Мы должны перебросить наши войска в Шам и за его пределы, чтобы гарантировать, что мы распространяем нашу идеологию по всему миру."
 SYR_to_sham_and_beyond_Tooltip: "§RМы можем объявить войну любой нации, которая не поддерживает наши идеалы!§!"
 SYR_Listen_to_Sami_al_Oraydi_TT: "§RПришло время запретить все немусульманские партии в Сирии!§!"
 SYR_ALQ_Fascism: "Исламский Эмират"
 SYR_BABYLON_nationalist: "Вавилонская Империя"
 SYR_affirm_presence_in_lebanon: "Утвердить присутствие в Ливане"
 SYR_affirm_presence_in_lebanon_desc: "Продолжение оккупации Ливана сказывается на экономике. Мы должны решить, как справиться с будущим Ливана."
 SYR_invest_in_lebanon: "Инвестировать в Ливан"
 SYR_invest_in_lebanon_desc: "Инвестиции в ливанскую экономику покажут, что в основе наших интересов лежит ливанский народ."
 SYR_relocate_lebanese_industry: "Передислоцировать ливанскую промышленность"
 SYR_relocate_lebanese_industry_desc: "Некоторые из ключевых отраслей промышленности Ливана следует перенести в Сирию для обеспечения их безопасности и недопущения использования каких-либо заводов против Сирии."
 SYR_commit_more_troops: "Увеличить количество войск"
 SYR_commit_more_troops_desc: "Нам необходимо укрепить безопасность Ливана, увеличив число военнослужащих, которые мы там размещаем."
 SYR_reduce_presence: "Уменьшить присутствие"
 SYR_reduce_presence_desc: "Мы должны вывести часть наших войск из Ливана. Наши парни заслуживают того, чтобы вернуться домой, мы должны дать ливанской армии больше контроля."
 SYR_replace_ghazi_kanaan: "Заменить Гази Канаана"
 SYR_replace_ghazi_kanaan_desc: "Гази Канаан возглавлял сирийскую разведку в Ливане с 1982 года и был ключевым активом в сохранении контроля. Однако сейчас необходима свежая кровь. Мы отзовём Канаана и сделаем его главой Управления политической безопасности Сирии. В Ливане Канаана заменит его заместитель Рустам Газалех, восходящая звезда в разведывательном сообществе."
 SYR_recall_intelligence: "Отозвать разведку"
 SYR_recall_intelligence_desc: "Мы должны отозвать наши разведывательные элементы из Ливана. Разместив их обратно в Сирии, они смогут лучше защищать Сирию."
 SYR_reduced_political_liberty: "Урезать политические свободы"
 SYR_reduced_political_liberty_desc: "Некоторые организации и партии недовольны тем, что мы вмешиваемся в дела Ливана. Мы должны ограничить свободу слова и собраний, а также запретить некоторые публикации, которые могут запятнать нас."
 SYR_encourage_campaigning: "Поощрить самоопределение"
 SYR_encourage_campaigning_desc: "Мы должны ослабить контроль над ливанским правительством и дать возможность ливанцам больше самоуправления."
 SYR_assassinate_lebanese_prime_minister: "Убить премьер-министра Ливана"
 SYR_assassinate_lebanese_prime_minister_desc: "Премьер-министр Ливана Рафик Харири - ярый критик оккупации Сирии. Возможно, было бы лучше, если бы он исчез из поля зрения, хотя это наверняка вызовет возмущение в международном сообществе, даже если это заметёт наши следы."
 SYR_raids_against_hezbollah: "Рейды против «Хезболлы»"
 SYR_raids_against_hezbollah_desc: "«Хезболла» - это не более чем террористическая организация, пытающаяся дестабилизировать Ливан. Нам нужно провести рейды против их сил и ослабить их власть над Ливаном."
 SYR_integrate_lebanon: "Интегрировать Ливан"
 SYR_integrate_lebanon_desc: "Пришло время приблизить Ливан к себе. Мы должны приложить все усилия и превратить их парламент в номинальный региональный совет. У нас уже есть полная поддержка «Хезболлы», и они помогут нам в операции."
 SYR_withdraw_from_lebanon: "Вывести войска из Ливана"
 SYR_withdraw_from_lebanon_desc: "Пришло время покинуть Ливан и позволить стране идти своим путём."

 SYR_greater_syria: "Великая Сирия"
 SYR_greater_syria_desc: "Сирийская социалистическая националистическая партия мечтает о Великой Сирии. Это государство будет простираться от Синая до Ирака, от Северной Аравии до Таврских гор. Мы объединим весь сирийский народ под одним знаменем!"
 SYR_lebanese_chaos: "Ливанский хаос"
 SYR_lebanese_chaos_desc: "В Ливане царит полный политический хаос, страна разделена между правительством и ополченцами «Хезболлы». Мы должны провести атаку под фальшивыми флагами."
 SYR_deal_with_scraps: "Разобраться с остатками"
 SYR_deal_with_scraps_desc: "Теперь, когда Ливан ослаблен, мы должны использовать этот конфликт в качестве предлога для продвижения вперёд по пути обеспечения нашей собственной национальной безопасности."
 SYR_assault_jordan: "Свергнуть Хашимитов"
 SYR_assault_jordan_desc: "Иордания - одна из трёх стран, в которых действует Сирийская социал-националистическая партия (помимо Сирии и Ливана). Основная поддержка партии исходит от проживающей там палестинской диаспоры. Мы должны поддержать там SSNP и побудить их свергнуть нынешнюю правящую партию Хашимитов."
 SYR_arm_palestinians_to_fight: "Вооружить палестинцев"
 SYR_arm_palestinians_to_fight_desc: "В Иордании проживает большое число палестинских беженцев. Мы можем превратить этих беженцев в боевиков и спровоцировать их на хаос в Палестине и Израиле. Поскольку они являются марионеточными боевиками, мы можем использовать их для того, чтобы спровоцировать Израиль на ответные действия, сделав их похожими на плохих парней в конфликте."
 SYR_zionist_threat: "Сионистская угроза"
 SYR_zionist_threat_desc: "Израиль - величайшее оскорбление для всех мусульман и отвратительное фальшивое государство в самом сердце ислама. Их нужно стереть с лица земли."
 SYR_befriend_sudan: "Союзник Судан"
 SYR_befriend_sudan_desc: "Судан продолжает спор с Египтом по поводу треугольника Халаиб. Мы могли бы вступить с ними в союз и использовать комбинированную угрозу, чтобы убедить Египет дать нам территориальные уступки."
 SYR_demand_sinai: "Потребовать Синай"
 SYR_demand_sinai_desc: "Синай имеет огромное стратегическое значение для нас. Он не только предоставит нам отличные оборонительные позиции против возможной атаки с запада, но и даст нам возможность контролировать и наблюдать за Суэцким каналом.\n\nМы предложим египтянам совместное управление каналом, чтобы упростить условия сделки."
 SYR_iraq_divisions: "Эксплуатация иракских дивизий"
 SYR_iraq_divisions_desc: "Ирак разделён на множество этнических и религиозных групп. Мы можем использовать эти разногласия в своих интересах и вызвать религиозное восстание в стране, чтобы ослабить их."
 SYR_mop_up_iraq: "Зачистить Ирак"
 SYR_mop_up_iraq_desc: "Нынешняя ситуация в области безопасности в Ираке представляет собой угрозу для нашей собственной национальной безопасности. Используя это как предлог, мы можем оправдать переброску войск в страну."
 SYR_concessions_to_kurds: "Уступки курдам"
 SYR_concessions_to_kurds_desc: "Курды составляют большую этническую группу в регионе, который мы хотим контролировать. Они долгое время существовали без официального государства, и в большинстве стран, где они проживают, их права ограничены. Если мы пообещаем им автономную зону в Великой Сирии, мы можем получить могущественного союзника."
 SYR_submission_kuwait: "Подчинение Кувейта"
 SYR_submission_kuwait_desc: "Кувейт - это искусственное государство, созданное колониальными державами, и их нынешняя королевская семья остаётся у власти только при поддержке западных держав. Народ Кувейта должен быть освобождён от своих колониальных хозяев."
 SYR_crush_the_sauds: "Раздавить Саудов"
 SYR_crush_the_sauds_desc: "Северная часть Аравии является естественной частью Великой Сирии. Несмотря на свою экономическую незначительность, мы не можем допустить, чтобы эта территория вышла из-под контроля. Мы должны заставить Саудовскую Аравию пойти на уступки."
 SYR_kurds_in_turkey: "Курды в Турции"
 SYR_kurds_in_turkey_desc: "Курдская рабочая партия PKK уже несколько десятилетий ведёт партизанскую войну против Турции. Мы должны предложить им убежище на нашей стороне границы. Тогда мы сможем использовать их бойцов, чтобы подкрепить наши ряды, как только мы продвинемся в Турцию."
 SYR_kurds_in_iran: "Курды в Иране"
 SYR_kurds_in_iran_desc: "В Иране проживает около 7 миллионов курдов. В настоящее время Демократическая партия Иранского Курдистана ведёт мелкомасштабную партизанскую войну против правительства. Несмотря на небольшие размеры, мы могли бы предложить им убежище в Курдистане, если бы они пообещали свою преданность нашему делу."
 SYR_align_azerbaijan: "Союзный Азербайджан"
 SYR_align_azerbaijan_desc: "У Азербайджана довольно холодные отношения с Ираном. Хотя обе страны являются шиитами и имеют общую историю, протурецкая и произраильская позиция Азербайджана и проармянская позиция Ирана охладили отношения между ними. Кроме того, Иран является домом для многих азербайджанцев, проживающих в Иранском Азербайджане. Мы должны предложить Азербайджану иранскую территорию, населённую азербайджанцами, в обмен на альянс."
 SYR_taurus_mountains: "В Таврские горы"
 SYR_taurus_mountains_desc: "Таврские горы (Торос) в Юго-Восточной Анатолии являются прекрасным естественным барьером для защиты Сирии. Поэтому эта земля является естественной частью Сирии и должна быть нашей."
 SYR_alawite_militias: "Найм алавитов"
 SYR_alawite_militias_desc: "В районе Хатаи, как и в Латакии, в основном проживают алавиты, этно-религиозная мусульманская секта. Многие алавиты чувствуют себя подавленными суннитским большинством в Турции. Мы можем использовать это разочарование, чтобы завербовать некоторых из них в качестве военизированных формирований для нашей армии."
 SYR_align_armenia: "Союзная Армения"
 SYR_align_armenia_desc: "Армения и Турция никогда не имели официальных дипломатических отношений. Это в основном связано с отказом Турции признать Геноцид армян и продолжающимся пограничным спором между ними. В то время как Армения официально признаёт существующие границы, Турция не чувствует, что обязательства достаточно сильны. Мы могли бы пообещать Армении Северо-Восточную Турцию в обмен на помощь."
 SYR_align_greece: "Союзная Греция"
 SYR_align_greece_desc: "Несмотря на то, что оба являются частью НАТО, отношения между [GRE.GetName] и [TUR.GetName] не так уж и тёплые. У них есть некоторые пограничные споры в Эгейском море, а некоторые более националистические фракции в Греции претендуют на часть территории Турции, основываясь на идее Мегали. Греция может быть очень мощным союзником против Турции."
 SYR_divide_turkey: "Раздел Турции"
 SYR_divide_turkey_desc: "Пришло время разделить Турцию. С собравшимися союзниками Турция не может надеяться на борьбу со всеми нами."
 SYR_claim_cyprus: "Потребовать Кипр"
 SYR_claim_cyprus_desc: "Кипр является идеальным оплотом против любого вторжения в сирийское сердце с Запада. Остров по праву должен находиться под нашим правлением."
 SYR_align_cyprus: "Давление на Кипр"
 SYR_align_cyprus_desc: "Кипр является более богатой и сильной фракцией на острове, и поэтому делает лучший выбор для союзника. Однако это приведёт нас к конфликту с Северным Кипром, который находится под защитой Турции."
 SYR_align_northern_cyprus: "Давление на Северный Кипр"
 SYR_align_northern_cyprus_desc: "Тюркские жители Северного Кипра будут идеальным союзником для контроля над островом. Однако это приведёт нас к конфликту с Кипром, а возможно, и с Грецией."
 SYR_invade_cyprus: "Вторжение на Кипр"
 SYR_invade_cyprus_desc: "Нам не нужны союзники, мы возьмём остров полностью для себя. Никто не может стоять у нас на пути!"
 SYR_weaken_iran: "Ослабить Иран"
 SYR_weaken_iran_desc: "Иран - могущественная страна на востоке, но их слабость заключается в том, что значительная часть его населения этнически не персидская. Мы можем использовать эту слабость для будущего вторжения в Иран."
 SYR_palestinian_unemployment_program: "Палестинская программа по безработице"
 SYR_palestinian_unemployment_program_desc: "В Иордании проживает много палестинцев, многие из которых никогда не получали гражданства. Уровень безработицы среди них очень высок, поскольку им трудно найти работу. Мы должны исправить эту ситуацию и помочь им найти работу."

 ##########Focuses##########
 SYR_military_reform: "Военная реформа"
 SYR_military_reform_desc: "Сирийские вооружённые силы, закалённые в десятилетиях конфликтов, требуют всеобъемлющего обновления. От войны 1973 года до современной борьбы с повстанцами мы должны адаптировать наши структуры, доктрину и подготовку к вызовам нового века. Профессиональная, способная армия необходима для национального суверенитета."
 SYR_homs_military_academy: "Расширить военную академию в Хомсе"
 SYR_homs_military_academy_desc: "Военная академия в Хомсе - крупнейшее и самое престижное военное училище в Сирии, действующее с 1933 года. Мы должны расширить её и начать предлагать обучение не только в армии, но и в других отраслях."
 SYR_expand_tartus_base: "Расширить базу Тартус"
 SYR_expand_tartus_base_desc: "Военно-морская база в Тартусе сначала использовалась Советским Союзом, а затем Россией как военно-морская база для лёгкого доступа к Средиземному морю. При нынешних размерах она действительно может служить только в качестве станции для кораблей меньше фрегатов. Нам нужно расширить её доки для базирования более крупных кораблей."
 SYR_tartus_dockyards: "Верфи Тартуса"
 SYR_tartus_dockyards_desc: "Теперь, когда мы расширили доки в Тартусе, нам также необходимо расширить их возможности по ремонту и переоборудованию за счёт строительства доков для обслуживания кораблей."
 SYR_expand_tiyas_air_base: "Расширить авиабазу Тияс"
 SYR_expand_tiyas_air_base_desc: "Авиабаза Тияс является крупнейшей в Сирии. Она расположена в важнейшем центральном месте, что позволяет нам прикрывать авиабазу всей Сирии с хорошо защищённой позиции. Нам необходимо расширить её материально-техническую базу, чтобы мы могли разместить там больше наших самолётов."
 SYR_army_more_factories: "Военное производство"
 SYR_army_more_factories_desc: "Мы слишком сильно полагаемся на импорт оружия из других стран. Нам нужно создать местные мастерские, чтобы уменьшить нашу зависимость от иностранного оружия."
 SYR_reform_start_army: "Реформа армии"
 SYR_reform_start_army_desc: "Армия должна избавиться от устаревших структур, унаследованных от холодной войны. Мы упростим командование, модернизируем логистику и внедрим повышения по службе на основе заслуг. Эти первоначальные реформы повысят моральный дух, улучшат боеготовность и проложат путь к более глубоким преобразованиям."
 SYR_reform_fleet_army: "Реформа ВМФ"
 SYR_reform_fleet_army_desc: "Наш флот, годами находившийся в запустении, требует срочной модернизации. Мы реструктурируем береговую оборону, обучим экипажи современной тактике и модернизируем наши устаревшие патрульные суда. Надёжное военно-морское присутствие необходимо для защиты нашего побережья и морских интересов."
 SYR_reform_vvs_army: "Реформа ВВС"
 SYR_reform_vvs_army_desc: "Сирийское небо оспаривалось десятилетиями. Мы реорганизуем наши военно-воздушные силы, выведем из эксплуатации устаревшие самолёты и инвестируем в подготовку пилотов и интеграцию наземной ПВО. Современные, эффективные ВВС - это щит нации."
 SYR_reform_vs_army: "Реформа вооружённых сил"
 SYR_reform_vs_army_desc: "Вооружённые силы в целом должны функционировать как единый инструмент. Мы пересмотрим совместные командные структуры, гармонизируем стандарты оборудования между родами войск и установим современный профессиональный этос. Только сплочённая армия может защитить суверенитет Сирии."
 SYR_army_pvo: "Реформа войск ПВО"
 SYR_army_pvo_desc: "Противовоздушная оборона - наша первая линия обороны. Мы объединим зенитную артиллерию и ракетные части в единые войска ПВО, развернём современные радиолокационные сети и интегрируем системы раннего предупреждения. Наша цель: лишить врага господства в воздухе и защитить жизненно важную инфраструктуру."
 SYR_army_more_supplie: "Создание сил специального назначения"
 SYR_army_more_supplie_desc: "От гор Кунейтры до пустыни Дейр-эз-Зор местность требует элитных подразделений. Мы создадим специализированные батальоны спецназа, обученные разведке, борьбе с терроризмом и глубоким рейдам. Бойцы этих подразделений станут тихим кинжалом Сирии."
 SYR_army_supplik: "Новые склады снабжения"
 SYR_army_supplik_desc: "Логистика выигрывает войны. Мы построим новые склады снабжения, модернизируем транспортные сети и накопим критические резервы. Надёжная логистическая система обеспечивает наши подразделения снабжением, мобильностью и способностью вести длительные операции."
 SYR_army_bunker: "Укрепить столицу"
 SYR_army_bunker_desc: "Дамаск, сердце нации, должен стать неприступным. Мы построим сеть укреплённых бункеров, командных центров и оборонительных позиций вокруг столицы, чтобы правительство могло выдержать любую бурю и координировать оборону страны."
 SYR_army_minobr: "Реформа министерства обороны"
 SYR_army_minobr_desc: "Министерство обороны должно быть модернизировано в соответствии с нашими вооружёнными силами. Мы упростим его бюрократию, расширим полномочия компетентных офицеров и укрепим гражданский контроль. Эффективное, подотчётное министерство является основой профессиональной армии."
 ##########Ideas##########
