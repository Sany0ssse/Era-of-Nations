 SYR_russian_specialists_idea: "Российские специалисты"
 SYR_uae_specialists_idea: "Специалисты ОАЭ"
 SYR_UAE_eco_coop_idea: "Экономическое сотрудничество с ОАЭ"
 SYR_TUR_coop_idea: "Военное сотрудничество с Турцией"
 SYR_baathist_renaissance_idea: "Баасистский ренессанс"
 SYR_pal_militias_idea: "Армия освобождения Палестины"
 SYR_pal_militias_idea_desc: "Палестинцы, базирующиеся в Сирии, и их вооружённые группы, такие как Армия освобождения Палестины, Галилейские силы и Иерусалимская бригада - все изначально обученные для борьбы с Израилем - являются прорежимными и оказывают ключевую поддержку."
 SYR_ISR_military_idea: "Военное сотрудничество с Израилем"
 SYR_blockade_hezbollah_idea: "Блокада «Хезболлы»"
 SYR_PER_pipeline_idea: "Сирийско-иранский трубопровод"
 SYR_QAT_pipeline_idea: "Катарско-сирийский трубопровод"
 SYR_QAT_holding_company_idea: "Сирийско-катарская холдинговая компания"
 SYR_pij_idea: "Бригады ПИД"
 SYR_pij_idea_desc: "Бригады Палестинского исламского джихада (ПИД) в настоящее время действуют в нашей стране и помогут нам дать отпор сионистскому государству."
 SYR_pal_taining_camps_idea: "Палестинские учебные лагеря"
