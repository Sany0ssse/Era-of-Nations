 Syria_decisions: "Гражданская война в Сирии"
 Syria_decisions_desc: "Гражданская война в Сирии началась в 2011 году во время «арабской весны» после волны протестов против режима Асада. Войну в основном ведут четыре стороны: режим Асада, поддерживаемый Россией и Ираном, сирийская оппозиция, исламистский Тахрир аш-Шам и Исламское государство Ирака и Сирии."
 SYR_al_abbas_brigades: "Мобилизовать бригады аль-Аббаса"
 SYR_al_abbas_brigades_desc: "Настало время для нас мобилизовать аль-Аббаса на борьбу с врагами государства."
 renounce_claims_on_golan: "Отказаться от претензий на Голанские высоты"
 renounce_claims_on_golan_desc: "Израиль оккупирует Голанские высоты с Шестидневной войны 1967 года. В настоящее время около половины населения региона составляют еврейские поселенцы. ООН и Сирия по-прежнему считают эту территорию юридически частью Сирии. Может быть, нам стоит предложить отказаться от наших претензий на эту землю, если Израиль согласится поддержать нас в нашей войне?\n\nЕсли они согласятся на сделку, мы получим оружие или добровольцев, но они будут оказывать на нас влияние."
 renounce_claims_on_hatay: "Отказаться от претензий на Хатай"
 renounce_claims_on_hatay_desc: "Регион Хатай был передан от Франции Турции в 1939 году после референдума в регионе. Многие критиковали легитимность референдума, и Сирия до сих пор утверждает, что этот район принадлежит им. Может быть, нам стоит отказаться от наших претензий на этот регион, если турки пообещают помочь нам в нашей войне?\n\nЕсли они согласятся на сделку, мы получим оружие или добровольцев, но они будут оказывать на нас влияние."
 guarantee_rojava_independence: "Гарантировать суверенитет курдов"
 guarantee_rojava_independence_desc: "Чтобы выиграть войну, нам нужны сильные союзники. Рожава до сих пор сосредоточила свою борьбу против ИГИЛ. Если мы пообещаем, что после окончания войны они смогут сами править собой, они, возможно, захотят присоединиться к нашей стороне в войне.\n\nЕсли они согласятся, мы откажемся от всех претензий на их территорию и позволим им жить в мире.\n\nКурды будут более склонны присоединиться к борьбе, если они уже решили свои собственные проблемы."
 Syria_economic_investments: "Экономический потенциал Сирии"
 Syria_economic_investments_desc: "Наша экономика всегда была чрезвычайно устаревшей и неэффективной по сравнению с большинством наших соседей, но у неё есть потенциал стать великой и могущественной. Мы рассмотрели некоторые проблемы и потенциальные цели для инвестиций, чтобы обновить наши возможности, и должны начать как можно скорее, если хотим, чтобы наша нация была приведена к величию, а наши люди гордились и были довольны нашим правительством."
 invigorate_hisiyah: "Оживить промышленную зону Хисии"
 invigorate_hisiyah_desc: "Крупным промышленным проектом в нашей стране стало создание нового промышленного города в Хисии. Пока он был построен и создан, нам нужно будет инвестировать в него и расширять его, чтобы наша экономика росла."
 hisiyah_industrial_expansion: "Расширить промышленную зону"
 hisiyah_industrial_expansion_desc: "Благодаря нашему экономическому росту и благоприятной для бизнеса политике многочисленные инвестиции от новых и успешных предприятий вливаются в промышленный регион. Пришло время извлечь из этого выгоду и расширить регион."
 clear_aleppan_slums: "Очистить трущобы Алеппо"
 clear_aleppan_slums_desc: "Из-за недавнего роста населения и безработицы многие люди в Алеппо живут в трущобах. Если мы начнём жилищные проекты и инвестируем в экономику города, мы сможем избавиться от этой проблемы."
 aleppan_economy_booming: "Инвестировать в потенциал Алеппо"
 aleppan_economy_booming_desc: "Благодаря нашему экономическому росту и благоприятной для бизнеса политике многочисленные инвестиции от новых и успешных предприятий вливаются в промышленные зоны города. Теперь мы можем расширить промышленные возможности города."
 damascus_private_sector_encouragement: "Поощрять частный сектор Дамаска"
 damascus_private_sector_encouragement_desc: "Дамаск является домом для широкого спектра промышленной деятельности, такой как текстильная, пищевая, цементная и различные химические отрасли. Большинство заводов управляются государством, и это оказалось очень неэффективным для раскрытия экономического потенциала города. Пришло время расширить частный сектор, инвестируя в молодые и перспективные предприятия, которые сейчас существуют."
 damascus_private_sector_booming: "Инвестировать в многообещающий частный сектор Дамаска"
 damascus_private_sector_booming_desc: "Благодаря нашему экономическому росту и благоприятной для бизнеса политике частный сектор расширился и значительно вырос за последнее время. Мы будем инвестировать в это большое развитие и сделаем нашу столицу экономической моделью."
 eastern_oil_excavation_phase1: "Восточные проекты добычи нефти, фаза 1"
 eastern_oil_excavation_phase2: "Восточные проекты добычи нефти, фаза 2"
 eastern_oil_excavation_phase3: "Восточные проекты добычи нефти, фаза 3"
 invest_in_eastern_cotton: "Инвестировать в восточный хлопок"
 invest_in_eastern_cotton_desc: "Мы начнём инвестировать в хлопковые поля в восточных частях страны."
 Syria_agricultural_subsidies_decisions: "Политика сельскохозяйственных субсидий"
 Syria_agricultural_subsidies_decisions_desc: "Сирийское правительство в течение многих лет в значительной степени субсидировало сельское хозяйство для обеспечения внутреннего производства продовольствия. Это привело к ситуации, когда почти все пахотные земли обрабатываются."
 syria_decision_increase_subsidies: "Увеличить субсидии"
 syria_decision_decrease_subsidies: "Уменьшить субсидии"
 syria_decision_increase_investments: "Увеличить бюджет инвестиций"
 syria_decision_decrease_investments: "Уменьшить бюджет инвестиций"
 syria_decision_increase_local_accountability_officials: "Повысить местную подотчётность чиновников"
 syria_decision_increase_local_accountability_officials_desc: "Административная культура нашей страны пропитана коррупцией, кумовством и неэффективностью. Мы начнём расследовательную кампанию, чтобы раскрыть и искоренить коррупцию, поощряя создание прозрачных и подотчётных институтов. Успех кампании зависит от уровня коррупции, расходов на полицию, инклюзивности меньшинств и того, находятся ли популисты в нашем правительстве, так как их навыки и опыт могут помочь."
 syria_decision_find_promising_bureaucracy: "Найти и поощрить перспективных бюрократов"
 syria_decision_find_promising_bureaucracy_desc: "Годы тоталитарного правления привели к тому, что на руководящих должностях и в институтах оказались неэффективные и непопулярные люди. Внезапный переход к демократии выявил нехватку эффективной бюрократии, способной выполнять свои обязанности так, чтобы народ мог считать её надёжной и прозрачной. Мы инициируем усилия по мотивации и набору людей с необходимыми навыками на должности, которые они заслуживают, и обеспечим эффективную административную работу. Это будет зависеть от нашего бюджета на бюрократию, инклюзивности меньшинств для борьбы с сектантским кумовством, коррупции и того, находятся ли популисты в нашем правительстве, поскольку у них есть опыт в управлении государственными делами."
 syria_decision_build_bureaucratic_infrastructure1: "Расширить бюрократическую инфраструктуру"
 syria_decision_build_bureaucratic_infrastructure1_desc: "Инфраструктура нашей страны является одной из самых бедных и отсталых в регионе. Это привело к плохому восприятию государственных институтов и отсутствию доверия к ним как к способной силе, которая может предоставлять товары и услуги. Нам придётся улучшить нашу инфраструктуру, чтобы расширить охват нашего правительства и реализовать надлежащую централизацию государства и общества."
 syria_decision_build_bureaucratic_infrastructure2: "Расширить бюрократическую инфраструктуру"
 syria_decision_build_bureaucratic_infrastructure2_desc: "Наши усилия по расширению инфраструктуры немного улучшили восприятие нашего центрального правительства нашими людьми. Однако нам всё ещё нужно улучшить нашу инфраструктуру, чтобы достичь надлежащей централизации и ещё больше расширить наш административный охват."
 syria_decision_build_bureaucratic_infrastructure3: "Расширить бюрократическую инфраструктуру"
 syria_decision_build_bureaucratic_infrastructure3_desc: "Плоды наших усилий пожинаются. Путь к надлежащей централизации может быть реализован, и наша страна может быть по-настоящему и полностью объединена."
 syria_decision_build_bureaucratic_infrastructure4: "Расширить бюрократическую инфраструктуру"
 syria_decision_build_bureaucratic_infrastructure4_desc: "Достигнуты последние этапы нашего улучшения инфраструктуры. Власть правительства реализуется и уважается по всей стране, и верховенство закона преобладает повсюду."
 syria_decision_fund_voluntary_organizations: "Финансировать добровольные организации"
 syria_decision_fund_voluntary_organizations_desc: "Этнические разделения преобладают по всей стране, и важнейшим средством их устранения является поощрение добровольных организаций, которые преодолевают этнические разделы и стремятся к улучшению жизни и сотрудничеству между людьми разного происхождения и сект. Успех наших усилий будет зависеть от инклюзивности меньшинств и федералистов в правительстве, которые будут очень полезны в предоставлении гарантий и стимулировании политической активности и сотрудничества."
 syria_decision_encourage_economic_self_reliance: "Поощрять экономическую самодостаточность"
 syria_decision_encourage_economic_self_reliance_desc: "Экономика страны страдала от десятилетий бесхозяйственности и неэффективности. Мы будем поощрять свободную торговлю и экономическую либерализацию, чтобы стимулировать людей создавать предприятия и работать на них. Если это удастся, многие штаты будут процветать экономически, и страна получит экономический толчок. Но для этого уровень коррупции должен быть низким, должна быть обеспечена инклюзивность меньшинств для межсектантского развития, расходы на бюрократию должны быть минимальными, чтобы держать правительство вдали от экономики, и федералисты в правительстве для обеспечения прямого и децентрализованного экономического прогресса."
 syria_decision_encourage_state_decision_making: "Поощрять государственное принятие решений"
 syria_decision_encourage_state_decision_making_desc: "Величайшим препятствием на пути улучшения нашей страны является тот факт, что люди не чувствуют себя достаточно мотивированными, чтобы думать о своих политических проблемах и интересах. Это во многом связано с тем, что государство существует только для того, чтобы держать людей в узде, и стало источником страха и недоверия, а не возможностью и инструментом для улучшения их жизни, и никто не чувствует себя причастным к стране. Пришло время изменить это и поощрять политическую конкуренцию и дискурс, чтобы люди чувствовали себя мотивированными быть частью принятия решений, касающихся их района и государства, в котором они живут. Успех наших усилий зависит от коррупции, инклюзивности меньшинств и наличия федералистов в правительстве."

 SYR_support_baathism: "Поддержать [From.GetAdjective] баасизм"
 SYR_support_baathism_desc: "Современный баасизм - это левая арабо-социалистическая идеология. Она поддерживает авторитаризм, государственную собственность и радикальные экономические программы. В отличие от своей первоначальной формы, современный баасизм больше не выступает за панарабизм. Существовало два баасистских государства - Сирия и Ирак, каждое из которых создало свои собственные формы баасизма.\n\nНесмотря на региональные различия, мы всё ещё можем поощрять баасистские идеалы в [From.GetNameDef]. Это не превратит их в наших лучших друзей, но они будут немного дружелюбнее к нам."
 SYR_support_western_ideals: "Поддержать западные идеалы в [From.GetNameDef]"
 SYR_support_western_ideals_desc: "Запад представляет собой родину демократии и свободы. Запад доказал, что страны с разными культурами и традициями могут мирно сосуществовать. Мы должны поощрять эти же идеалы в [From.GetNameDef], чтобы мы могли жить в более мирном регионе."
 SYR_support_salafism: "Спонсировать салафитские группы в [From.GetNameDef]"
 SYR_support_salafism_desc: "Салафизм - это фундаменталистская форма суннитского ислама. Главная цель - вернуться к славным дням ислама и интерпретировать Коран как абсолютную истину. Салафизм, по некоторым данным, является самой быстрорастущей сектой ислама. Финансирование салафитских групп не должно вызывать проблем, особенно в такие времена, когда многие мусульмане чувствуют себя атакованными."
 SYR_support_muslim_brotherhood: "Поддержать [From.GetAdjective] филиал «Братьев-мусульман»"
 SYR_support_muslim_brotherhood_desc: "«Братья-мусульмане» - это египетское исламское политическое движение. Оно выступает за законы шариата и известно своими антизападными настроениями. Несмотря на то, что движение заявляет о поддержке демократии, свободы прессы и собраний и других демократических идей, некоторые страны, такие как Россия и Саудовская Аравия, классифицировали их как террористическую организацию."
 SYR_support_ssnp: "Поддержать Сирийскую социал-националистическую партию в [From.GetNameDef]"
 SYR_support_ssnp_desc: "Сирийская социал-националистическая партия является доминирующей политической силой в Леванте, выступающей за создание Великой Сирии. Будучи второй по величине партией в Сирии после партии Баас, это движение также популярно в Ливане и среди палестинского населения. Поощрение этого движения позволит нам мирно расширять нашу нацию."

 Syria_hafez_succession: "Преемственность Хафеза аль-Асада"
 Syria_hafez_succession_desc: "Хафез аль-Асад уже много лет страдает от плохого здоровья, и его преемственность в настоящее время открыта. Его первым выбором в качестве преемника был его старший сын Бассель, но он погиб в автокатастрофе в 1994 году. С тех пор главным выбором Хафеза был его второй по старшинству сын §YБашар§!. Однако старший ребёнок Хафеза, его дочь §GБушра§!, также играет всё более важную роль в государственных делах после смерти Басселя. Будучи более опытной, чем §YБашар§!, многие считают её пол самым большим препятствием для неё. Самый младший из детей, §OМахер§!, также является допустимым выбором. У него большой опыт работы с военными, но его репутация очень вспыльчивого человека может не сделать его самым стабильным лидером для Сирии.\n\nМы должны обеспечить, чтобы преемники Хафеза правили Сирией как можно скорее."
 SYR_bushra_present_to_inner_circle: "Представить §GБушру§! внутреннему кругу"
 SYR_bushra_present_to_inner_circle_desc: "Одобрение внутреннего круга партии Баас является решающим шагом к президентству. Этот манёвр обеспечит их одобрение и гарантирует победу нашего кандидата."
 SYR_bashar_present_to_inner_circle: "Представить §YБашара§! внутреннему кругу"
 SYR_bashar_present_to_inner_circle_desc: "Одобрение внутреннего круга партии Баас является решающим шагом к президентству. Этот манёвр обеспечит их одобрение и гарантирует победу нашего кандидата."
 SYR_maher_present_to_inner_circle: "Представить §OМахера§! внутреннему кругу"
 SYR_maher_present_to_inner_circle_desc: "Одобрение внутреннего круга партии Баас является решающим шагом к президентству. Этот манёвр обеспечит их одобрение и гарантирует победу нашего кандидата."
 SYR_mejd_present_to_inner_circle: "Представить §0Меджа§! внутреннему кругу"
 SYR_mejd_present_to_inner_circle_desc: "Одобрение внутреннего круга партии Баас является решающим шагом к президентству. Этот манёвр обеспечит их одобрение и гарантирует победу нашего кандидата."
 SYR_rifaat_invite_back: "Пригласить §CРифаата§! обратно в Сирию"
 SYR_rifaat_invite_back_desc: "Мы отзовём Рифаата аль-Асада из его ссылки за границей и представим его партийной элите. Несмотря на его прошлое, его имя, влияние и сеть сторонников в военных и службах безопасности могут стать решающим активом в получении власти."

 Syria_greater_syria_decisions: "Создание Великой Сирии"
 Syria_greater_syria_decisions_desc: "Великая Сирия включает в себя множество государств, многие из которых более могущественны, чем мы. Будет большой задачей поставить весь регион под наш контроль."
 demand_submission_from_palestine: "Потребовать подчинения от палестинцев"
 demand_submission_from_palestine_desc: "Мы уничтожили Израиль. Палестинцы обязаны нам своей свободой, и они должны показать это, подчинившись нашему правлению."
 integrate_palestine: "Интегрировать Палестину"
 integrate_palestine_desc: "Палестина является неотъемлемой частью Великой Сирии, и этот регион должен быть приближён к нам."
 new_jewish_diaspora: "Новая еврейская диаспора"
 new_jewish_diaspora_desc: "После завоевания Израиля произошла массовая эмиграция евреев. Опасаясь преследований со стороны доминирующего мусульманского государства, многие предпочли бы покинуть свои дома и начать новую жизнь в другом месте.\n\nМы можем уменьшить последствия этой диаспоры, гарантируя особые права евреям в Израиле."
 guarantee_jewish_rights: "Гарантировать еврейские права"
 guarantee_jewish_rights_desc: "Многие евреи поддаются искушению покинуть Израиль теперь, когда он находится под нашим контролем. Мы можем гарантировать им особые права в отношении землевладения, ограниченную автономию и налоговые льготы, чтобы они с большей вероятностью остались."
 syria_ally_with_houthis: "Заключить союз с хуситами"
 syria_ally_with_houthis_desc: "У хуситов давний спор с саудовцами, так как саудовцы активно вмешивались в гражданскую войну в Йемене. В обмен на помощь нам мы пообещаем им южную часть Хиджаза, так как в ней проживает большое шиитское меньшинство. Однако союз с хуситами означает, что нам придётся сражаться и с их врагами."
 syria_shia_uprising_in_qatif: "Спонсировать шиитское восстание в Восточной Саудовской Аравии"
 syria_shia_uprising_in_qatif_desc: "Восточная провинция Саудовской Аравии является домом для большого шиитского меньшинства. Провинция также является основным нефтедобывающим регионом Саудовской Аравии. Шиитское меньшинство сильно угнетено, и не составит труда заставить их взяться за оружие."
 syria_operation_eastern_whirlwind: "Операция «Восточный вихрь»"
 syria_operation_eastern_whirlwind_desc: "Пришло время разгромить Иран. Теперь мы готовы стать величайшим гегемоном региона!"
 syria_iran_recruit_arab_militias: "Вербовать арабские ополчения"
 syria_iran_recruit_arab_militias_desc: "Регион Хузестан является домом для большого числа арабов. Эти люди не должны страдать под властью персов, они в большей безопасности под нашим правлением. Уже существует несколько ополченческих групп, борющихся за независимость. Хотя они и не многочисленны, они смогут проводить партизанские операции в иранском тылу."
 syria_iran_recruit_lur_militias: "Вербовать лурские ополчения"
 syria_iran_recruit_lur_militias_desc: "Луры - это этническая группа, родственная персам, в основном населяющая регион Луристан. У них много общего, поэтому вербовка их для нашего дела потребует больше усилий, чем обычно. Однако при достаточном количестве денег и власти всё возможно."
 syria_iran_recruit_azeri_militias: "Вербовать азербайджанские ополчения"
 syria_iran_recruit_azeri_militias_desc: "Азербайджанцы составляют 10% населения Ирана. Они наш самый сильный возможный союзник в стране, и их вооружение будет недёшево, но они значительно повысят наши шансы на успех."
 syria_iran_recruit_tabaristani_militias: "Вербовать табаристанские ополчения"
 syria_iran_recruit_tabaristani_militias_desc: "Регион Табаристан является домом для мазандеранцев и гилянцев."
 syria_iran_recruit_balochi_militias: "Вербовать белуджские ополчения"
 syria_iran_recruit_balochi_militias_desc: "Белуджи - это народная группа, которая в основном живёт в Иране и Пакистане. Они в значительной степени племенные, и создать единый фронт с ними будет сложно."

 #United Arab Republic decisions
 Syria_united_arab_republic_decisions: "Объединённая Арабская Республика"
 Syria_united_arab_republic_decisions_desc: "Объединённая Арабская Республика была сформирована, и мы можем присоединиться к ней, если захотим."
 join_the_united_arab_republic: "Присоединиться к Объединённой Арабской Республике"
 join_the_united_arab_republic_desc: "Мы должны подать заявку на вступление в Объединённую Арабскую Республику"

 #Events
 SyriaFocus.0.t: "Статус Рожавы"
 SyriaFocus.0.desc: "Рожава - это самоуправляемая область на севере Сирии, где доминируют курды. Во время гражданской войны они сражались в основном против ИГИЛ вместе с другими светскими и прогрессивными ополчениями и фракциями. Их конечной целью было создание федеративной сирийской республики, хотя многие рассматривают эту область как Западный Курдистан. Требование, чтобы они подчинились нам, скорее всего, приведёт к гражданской войне. Мы всегда можем предложить им ограниченную автономию, хотя это означает, что мы не сможем полностью их контролировать. Отпустив их, мы можем усилить курдский национализм в этом районе."
 SyriaFocus.0.a: "Этот регион является частью Сирии!"
 SyriaFocus.0.b: "Предложить им автономию"
 SyriaFocus.0.c: "Дать им независимость"
 SyriaFocus.1.t: "Сирия требует подчинения"
 SyriaFocus.1.desc: "Правительство в Дамаске потребовало, чтобы мы подчинились их правлению и распустили нашу армию."
 SyriaFocus.1.a: "Никогда"
 SyriaFocus.1.b: "Мы не должны больше проливать кровь"
 SyriaFocus.2.t: "Рожава отказывается"
 SyriaFocus.2.desc: "Рожава отказалась от нашего предложения"
 SyriaFocus.2.a: "Будь они прокляты!"
 SyriaFocus.2.b: "Отпустите их пока"
 SyriaFocus.3.t: "Рожава соглашается"
 SyriaFocus.3.desc: "Рожава согласилась на наше предложение"
 SyriaFocus.3.a: "За единую Сирию!"
 SyriaFocus.4.t: "Предложена автономия"
 SyriaFocus.4.desc: "Правительство в Дамаске предлагает нам автономный статус в Сирии. Это то, за что мы сражались в гражданской войне. С другой стороны, мы находимся в положении власти, может быть, нам стоит поставить более амбициозные цели?"
 SyriaFocus.4.a: "Это то, чего мы хотели..."
 SyriaFocus.4.b: "...но уже нет"
 SyriaFocus.5.t: "Рожава соглашается на автономию"
 SyriaFocus.5.desc: "Рожава согласилась воссоединиться с Сирией после обещаний автономии. Нам нужно не забыть выполнить это обещание."
 SyriaFocus.5.a: "За единую Сирию!"
 SyriaFocus.6.t: "Статус ССНП в Сирии"
 SyriaFocus.6.desc: "Во время гражданской войны в Сирии Сирийская социал-националистическая партия (ССНП) сначала перешла на сторону против режима, но в конечном итоге вновь перешла на сторону Асада. Их ополченцы были ключевым фактором в победе Асада, и они также набирают популярность как политическая партия. Сохранение их обеспечит, что их ополченцы будут на службе у Асада, но это увеличит их влияние. Их чистка может привести к сопротивлению с их стороны в будущем.\nКак нам посоветовать Асаду?"
 SyriaFocus.6.a: "Асаду нужны ополченцы ССНП"
 SyriaFocus.6.b: "Лучше избавиться от них"
 SyriaFocus.7.t: "[From.GetName] Мнение о ССНП"
 SyriaFocus.7.Keep.desc: "Нам сообщили, что [From.GetName] хочет, чтобы мы сохранили Сирийскую социал-националистическую партию из-за их сильных ополчений."
 SyriaFocus.7.Purge.desc: "Нам сообщили, что [From.GetName] хочет, чтобы мы избавились от Сирийской социал-националистической партии, поскольку они представляют собой явную угрозу продолжению нашего режима."
 SyriaFocus.7.a: "Понял"
 SyriaFocus.8.t: "Арабская ночь"
 SyriaFocus.8.d: "Эта ночь, вероятно, станет одной из самых длинных ночей для сотрудников службы безопасности Сирийской Арабской Республики. Не всегда ССНП была так враждебна к сирийцам, как сейчас. Но сейчас ничего нельзя сделать политически, поскольку все политические альтернативы были испробованы и... большинство из них провалились. Теперь посмотрим, что произойдет этой ночью или завтра с Сирией и её руководством."
 SyriaFocus.8.a: "Давайте молиться о лучшем."
 SyriaFocus.9.t: "Инспекция"
 SyriaFocus.9.d: "[Root.GetLeader] стоит перед строем, отдавая им честь. Палящее утреннее солнце обжигает лица сирийских солдат. [Root.GetLeader] опускает руку и идёт к строю. Он начинает пожимать руки каждому солдату в первом ряду. Один за другим он здоровается с солдатами, и наблюдатели видят гордость на их лицах. Один конкретный солдат привлекает внимание [Root.GetLeader]. Когда он пожимает руку солдату, кажется, что солдат что-то ему говорит. Выражение ужаса появляется на лице [Root.GetLeader]. Мгновение спустя взрывчатка, спрятанная в куртке солдата, взрывается.\n\nДесятки бойцов, одетых в символику Сирийской социал-националистической партии, выходят из укрытия и начинают стрелять по солдатам и толпе. Сирийские силы безопасности быстро берут ситуацию под контроль и нейтрализуют врагов.\n\nИскалеченное тело [Root.GetLeader] найдено всего в нескольких футах от места взрыва. Через несколько минут по радио ССНП передаёт, что «правление [Root.GetLeader] подошло к концу! Сирия будет освобождена от его псов!»"
 SyriaFocus.9.a: "Спокойной ночи, милый принц"
 SyriaFocus.10.t: "Восстание"
 SyriaFocus.10.d: "С наступлением ночи в Дамаске слышны несколько взрывов. Вскоре по всей Сирии вспыхивают спорадические боестолкновения: солдаты с эмблемами ССНП, Сирийской социал-националистической партии, совершают рейды на блокпосты и склады снабжения. Вскоре после этого по всей Сирии передают, что «ССНП является единственным истинным правителем Сирии, и время [Root.GetLeader] и их головорезов истекло. Мы сражаемся за новую Сирию, которая восстанет из пепла старой»."
 SyriaFocus.10.a: "Эти псы постигнет та же участь, что и всех остальных повстанцев!"
 SyriaFocus.11.t: "Провал"
 SyriaFocus.11.d: "По всему Дамаску слышны взрывы. Солдаты в форме с эмблемами Сирийской социал-националистической партии, или ССНП, бегают по улицам. Похоже, что ССНП попыталась и не смогла организовать переворот против [Root.GetLeader]. Не сумев заручиться поддержкой народа, похоже, они продержатся недолго."
 SyriaFocus.11.a: "У них никогда не будет шанса"

 SyriaFocus.20.t: "Генералы САА"
 SyriaFocus.20.d: "Некоторые генералы Сирийской арабской армии сидят в наших тюрьмах. Эти люди командовали силами Асада в течение многих лет против наших солдат. Однако ситуация может потребовать их вербовки. Возможно, нам понадобятся их навыки в будущем. Некоторые более радикальные элементы правительства призывают к их казни, чтобы стереть последние остатки Асада из Сирии."
 SyriaFocus.20.a: "Нам нужны эти люди"
 SyriaFocus.20.b: "Пусть сидят в тюрьме"
 SyriaFocus.20.c: "У палача есть работа!"
 SyriaFocus.24.t: "Рожава поднимается"
 SyriaFocus.24.d: "Мы обещали Рожаве, что реформируем Сирию в федеративное государство. Мы предали это обещание, и теперь курды открыто восстали против нас. Существует риск, что это побудит другие меньшинства также восстать против нас."
 SyriaFocus.24.a: "Это плохо"
 SyriaFocus.25.t: "Восстание друзов"
 SyriaFocus.25.d: "Наш конфликт с Рожавой побудил друзов на юге восстать против нас. Они объявили независимость, и многие друзские ветераны войны присоединились к их армии."
 SyriaFocus.25.a: "Это плохо"
 SyriaFocus.26.t: "Алавитское восстание"
 SyriaFocus.26.d: "Наш конфликт с Рожавой побудил алавитов в Латакии взяться за оружие. Они отрезали нам доступ к океану, и многие алавиты из Турции и Ливана пересекают границу, чтобы присоединиться к ним в качестве добровольцев."
 SyriaFocus.26.a: "Это плохо"
 SyriaFocus.27.t: "[From.GetName] предлагает военное сотрудничество"
 SyriaFocus.27.d: "[From.GetName] предложил военную помощь против [HEZ.GetName]. Они планируют военные операции против них и хотели бы получить нашу помощь в этом. Это был бы отличный шанс уничтожить [HEZ.GetName], хотя выполнение этой сделки может привязать нас слишком близко к [From.GetName]."
 SyriaFocus.27.a: "Сделка"
 SyriaFocus.27.b: "Нет сделки"
 SyriaFocus.28.t: "[From.GetName] соглашается"
 SyriaFocus.28.d: "[From.GetName] согласился на наше предложение."
 SyriaFocus.28.a: "Хорошо"
 SyriaFocus.29.t: "[From.GetName] отказывается"
 SyriaFocus.29.d: "[From.GetName] отказался от нашей помощи."
 SyriaFocus.29.a: "Плохо"
 SyriaFocus.30.t: "[From.GetName] требует подчинения"
 SyriaFocus.30.d: "Из-за их участия в разгроме «Хезболлы» [From.GetName] требует, чтобы мы позволили им иметь больший контроль над нашей страной. Что нам ответить?"
 SyriaFocus.30.a: "Подчиниться"
 SyriaFocus.30.b: "Сопротивляться"
 SyriaFocus.31.t: "[From.GetName] подчиняется"
 SyriaFocus.31.d: "[From.GetName] преклонил колено перед нашей страной."
 SyriaFocus.31.a: "Отлично"
 SyriaFocus.32.t: "[From.GetName] сопротивляется"
 SyriaFocus.32.d: "[From.GetName] отстоял свою позицию против нашей страны."
 SyriaFocus.32.a: "Тогда мы сделаем это трудным путём"
 SyriaFocus.33.t: "Успешный переворот «Хезболлы»"
 SyriaFocus.33.d: "«Хезболла» совершила переворот в нашей стране. При поддержке населения они свергли нынешнее правительство и установили себя в качестве правителей."
 SyriaFocus.33.a: "Чёрт"
 SyriaFocus.34.t: "Неудачный переворот «Хезболлы»"
 SyriaFocus.34.d: "«Хезболла» попыталась совершить переворот в нашей стране. Несмотря на их усилия, наш персонал безопасности смог их остановить. Как нам реагировать?"
 SyriaFocus.34.a: "Мы должны уничтожить их, они представляют угрозу для нашей страны"
 SyriaFocus.34.b: "Ничего не делать"
 SyriaFocus.35.t: "[From.GetName] требует подчинения"
 SyriaFocus.35.d: "Из-за их участия в разгроме Ливана [From.GetName] требует, чтобы мы позволили им иметь больший контроль над нашей страной. Что нам ответить?"
 SyriaFocus.35.a: "Подчиниться"
 SyriaFocus.35.b: "Сопротивляться"
 SyriaFocus.36.t: "[From.GetName] подчиняется"
 SyriaFocus.36.d: "[From.GetName] преклонил колено перед нашей страной."
 SyriaFocus.36.a: "Отлично"
 SyriaFocus.37.t: "[From.GetName] сопротивляется"
 SyriaFocus.37.d: "[From.GetName] отстоял свою позицию против нашей страны."
 SyriaFocus.37.a: "Тогда мы сделаем это трудным путём"
 SyriaFocus.38.t: "[From.GetName] требует Голаны"
 SyriaFocus.38.d: "[From.GetName] связался с нами и требует вернуть Голанские высоты."
 SyriaFocus.38.a: "Никогда"
 SyriaFocus.38.b: "Если они пообещают поддержать нас в отношении палестинцев"
 SyriaFocus.38.c: "Конечно"
 SyriaFocus.39.t: "Хафез аль-Асад умирает!"
 SyriaFocus.39.d: "Сегодня утром во время телефонного разговора с премьер-министром Ливана Хафез аль-Асад умер от сердечного приступа. В Сирии объявлен 40-дневный траур, похороны Хафеза состоятся через 3 дня. Он будет похоронен в мавзолее в своём родном городе Кардаха рядом со своим старшим сыном Басселем.\n\nСовет Хафеза должен теперь провозгласить его преемника."
 SyriaFocus.39.a: "Инна Лиллахи Ва Инна Илайхи Раджиун"

 SyriaFocus.40.t: "Башар встречается с министрами"
 SyriaFocus.40.d: "Сегодня Башар провёл встречу с несколькими министрами и сотрудниками службы безопасности. Очевидно, что он пытается узаконить свою позицию как идеального преемника. Он рассказал о своих планах по улучшению безопасности государства и о том, как поддерживать его стабильным.\n\nЭто организованное мероприятие является прелюдией к инаугурации Башара, чтобы сохранить лояльность военных во время перехода."
 SyriaFocus.40.a: "Отправьте ещё несколько министров и покажите это по телевизору!"

 SyriaFocus.41.t: "Бушра путешествует по сельской местности"
 SyriaFocus.41.d: "Бушра недавно путешествовала по различным деревням в сирийской сельской местности. Она встречалась с местными жителями, обещая светлое будущее для всех. Она также встречалась с некоторыми бизнесменами в Дамаске и обсуждала, как улучшить фармацевтическую промышленность Сирии."
 SyriaFocus.41.a: "Пообещать ей средства на все эти улучшения"
 SyriaFocus.41.b: "Она всего лишь женщина"
 SyriaFocus.41.c: "Убедить людей, что это просто пустые обещания"
 SyriaFocus.42.t: "Махер демонстрирует военных"
 SyriaFocus.42.d: "Махер организует военный парад, чтобы продемонстрировать мощь Республиканской гвардии. Также будет показана «военная игра» в качестве демонстрации новейших способов уничтожения террористов. Он даёт понять, что лично несёт ответственность за эффективность военных."
 SyriaFocus.42.a: "Отправьте ему ещё игрушек для демонстрации"
 SyriaFocus.42.b: "Пусть маленький мальчик поиграет со своими игрушками"
 SyriaFocus.42.c: "Заберите его игрушки"
 SyriaFocus.43.t: "Жажда власти Меджа"
 SyriaFocus.43.d: "После смерти Хафеза его третий сын Медж видит возможность, которой у него никогда не было. В отличие от своих братьев - назначенного наследника Башара и военного сторонника Махера - Медж всегда был забытым ребёнком, тем, кого прятали. Его долгая борьба с психической нестабильностью, его зависимость, его годы, проведённые в клиниках Лондона, - всё это было скрыто семьёй, чтобы защитить образ идеальной династии. Теперь, когда его отец умер, Медж считает, что наконец настала его очередь. Он начинает обращаться к старым контактам, шептать обещания и собирать тех, кто чувствует себя обделённым из-за возвышения Башара. Будет ли это расчётливым ходом скрытого игрока или заблуждением сломленного человека, никто пока не знает."
 SyriaFocus.43.a: "Неожиданно"
 SyriaFocus.44.t: "Рифаат аль-Асад просит поддержки"
 SyriaFocus.44.d: "Теперь, когда президент Сирии Хафез аль-Асад мёртв, его брат Рифаат просит нашей поддержки. Рифаат был вице-президентом Сирии до того, как его выслали из страны в 1998 году. Он говорит, что его отстранение было неконституционным, и в случае смерти президента он должен стать следующим президентом. Ходят слухи о народном восстании, которое должно произойти в Сирии, и Рифаат говорит, что это его шанс на власть. Ему просто нужно немного денег, чтобы помочь его планам."
 SyriaFocus.44.a: "Дайте ему немного средств"
 SyriaFocus.45.t: "Заявление 99"
 SyriaFocus.45.d: "Группа из 99 интеллектуалов опубликовала заявление о политической ситуации в Сирии. Теперь, когда Хафеза нет, они требуют прекращения чрезвычайного положения, освобождения политических заключённых, разрешения вернуться депортированным и изгнанникам, а также установления свободы слова и собраний. Мы получили сообщения о том, что с момента публикации этого заявления сформировались так называемые политические форумы, где единомышленники обсуждают политику в частных домах."
 SyriaFocus.45.a: "Освободить некоторых заключённых"
 SyriaFocus.45.b: "Эти революционные элементы должны быть подавлены!"
 SyriaFocus.46.t: "Заявление 1000"
 SyriaFocus.46.d: "Похоже, революционное движение не остановилось. Сегодня было опубликовано «Заявление 1000». Оппозиция теперь требует отмены однопартийной системы с независимой светской судебной системой. Также произошло несколько демонстраций против правительства в крупнейших городах."
 SyriaFocus.46.a: "Уйти в отставку и установить демократию"
 SyriaFocus.46.b: "Арестовать заговорщиков и разогнать демонстрантов"
 SyriaFocus.47.t: "Убийство Рафика Харири"
 SyriaFocus.47.d: "Сегодня, когда премьер-министр покидал парламент в своём кортеже, у отеля «Сент-Джордж» взорвался заминированный автомобиль. Харири, а также 21 другой человек погибли в результате взрыва, 220 получили ранения. Ответственность за нападение взяла на себя ранее неизвестная организация «Группа Насра и Джихад в Великой Сирии». Многие считают, что за этим убийством стоит сирийское правительство, поскольку Харири был открытым критиком их оккупации. Лидер «Хезболлы» [HEZ.GetLeader] утверждает, что атака была организована Израилем, чтобы заставить Сирию покинуть Ливан."
 SyriaFocus.47.a: "Ужасно"
 SyriaFocus.48.t: "Неудавшееся убийство Рафика Харири"
 SyriaFocus.48.d: "Сегодня, когда премьер-министр покидал парламент в своём кортеже, у отеля «Сент-Джордж» взорвался заминированный автомобиль. К счастью, кортеж находился достаточно далеко от взрыва, и Харири выжил, хотя и был серьёзно ранен. Несколько других были убиты, и около 200 человек получили ранения. Ответственность за нападение взяла на себя ранее неизвестная организация «Группа Насра и Джихад в Великой Сирии». Многие считают, что за этим убийством стоит сирийское правительство, поскольку Харири был открытым критиком их оккупации. Лидер «Хезболлы» [HEZ.GetLeader] утверждает, что атака была организована Израилем, чтобы заставить Сирию покинуть Ливан."
 SyriaFocus.48.a: "Ужасно"
 SyriaFocus.49.t: "Кедровая революция"
 SyriaFocus.49.d: "После убийства Харири Ливан практически находился в постоянном состоянии демонстраций. Почти ежедневно люди собираются в городах Ливана, выкрикивая «Хуррийе, Сийеде, Истиклель» (Свобода, Суверенитет, Независимость), требуя, чтобы Сирия вывела свои войска из Ливана. Кроме того, ООН требует от нас вывода войск, угрожая санкциями, если мы этого не сделаем. Мы можем продолжить оккупацию и переждать протесты. С другой стороны, мы могли бы сократить потери и покинуть Ливан."
 SyriaFocus.49.a: "Мы останемся в Ливане"
 SyriaFocus.49.b: "Возможно, лучше, чтобы мы ушли"
 SyriaFocus.50.t: "Рейды «Хезболлы»"
 SyriaFocus.50.d: "«Хезболла» совершила рейд на дом государственного политика. Собирались ли они похитить или убить, событие закончилось смертью политика. Руководство «Хезболлы» отрицает свою причастность к нападению и заявляет, что ливанская армия обстреляла их учебные лагеря из артиллерии, и теперь мы используем воображаемую атаку как оправдание. Мы не проводили против них артиллерийских обстрелов, и «Хезболла» явно выдумывает обвинения, чтобы оправдать этот рейд!"
 SyriaFocus.50.a: "Будь они прокляты!"
 SyriaFocus.51.t: "Ливан наносит ответный удар"
 SyriaFocus.51.d: "Ливанское правительство обвиняет нас в проведении рейда на дом государственного политика и его убийстве. Ливанская армия обстреляла наши учебные лагеря сегодня утром, и они явно используют эту фальшивую атаку как оправдание. У нас есть сообщения о том, что ливанская армия сейчас продвигается к нашим позициям с намерением вытеснить нас."
 SyriaFocus.51.a: "Будь они прокляты!"
 SyriaFocus.52.t: "Сирия требует подчинения"
 SyriaFocus.52.d: "Ссылаясь на свою собственную национальную безопасность, сирийское правительство потребовало, чтобы мы подчинились им, чтобы они могли обеспечить мир в Ливане."
 SyriaFocus.52.a: "Сдаться им"
 SyriaFocus.52.b: "Мы будем стоять на своём!"
 SyriaFocus.53.t: "[FROM.GetName] подчиняется"
 SyriaFocus.53.d: "[FROM.GetName] сдался нашим требованиям"
 SyriaFocus.53.a: "Хорошо"
 SyriaFocus.54.t: "[FROM.GetName] отвергает наши требования"
 SyriaFocus.54.d: "[FROM.GetName] отказался подчиниться, заявив, что мы не имеем права вмешиваться в их дела."
 SyriaFocus.54.a: "Тогда мы сделаем это трудным путём"
 SyriaFocus.54.b: "Оставить их в покое"
 SyriaFocus.55.t: "Переворот ССНП"
 SyriaFocus.55.d: "Сирийская социал-националистическая партия, популярная партия среди палестинских беженцев, проживающих в Иордании, организовала переворот. Большая часть королевской семьи была помещена под домашний арест, и ССНП объявила о конце монархии. Мы подозреваем, что за этим шагом стоит соседний сирийский режим. ССНП заявила о своём желании включить страну в состав [SYR.GetName]."
 SyriaFocus.55.a: "Сирийские народы должны объединиться!"
 SyriaFocus.55.b: "Изгнать этих предателей!"
 SyriaFocus.56.t: "Переворот ССНП в [FROM.GetName]"
 SyriaFocus.56.d: "ССНП организовала успешный переворот в [FROM.GetName]. Теперь они предлагают странам объединиться как единое целое."
 SyriaFocus.56.a: "Мы приветствуем их!"
 SyriaFocus.56.b: "Пусть у них будет номинальная независимость"
 SyriaFocus.57.t: "ССНП пытается совершить переворот"
 SyriaFocus.57.d: "Сирийская социал-националистическая партия попыталась организовать переворот в Иордании. Их операция по захвату королевской семьи была остановлена, но несколько воинских частей уже объявили о своей лояльности им и теперь находятся в открытом мятеже. Ясно, что за всем этим стоит сирийский режим, и у нас уже есть сообщения о том, что сирийские подразделения пересекают границу, чтобы помочь частям ССНП в «стабилизации законного правительства Иордании»."
 SyriaFocus.57.a: "Чёрт"
 SyriaFocus.58.t: "Сирия пытается свергнуть правительство"
 SyriaFocus.58.d: "Сирийская социал-националистическая партия попыталась организовать переворот в Иордании. Их операция по захвату королевской семьи была остановлена, а виновные арестованы. Ясно, что за этим стоит сирийский режим, и у нас уже есть сообщения о передвижении их подразделений через границу."
 SyriaFocus.58.a: "Чёрт"
 SyriaFocus.59.t: "Палестинские прокси из Иордании"
 SyriaFocus.59.d: "Похоже, правительство [FROM.GetName] вооружило некоторых палестинских беженцев, проживающих в Иордании, и отпустило их в Израиле. Их явное намерение - использовать этих палестинцев в качестве прокси для создания проблем в Израиле."
 SyriaFocus.59.a: "Нелепо"
 SyriaFocus.60.t: "Палестинские прокси проводят рейд"
 SyriaFocus.60.d: "Несколько отрядов палестинских прокси-ополченцев пересекли границу из Иордании в Израиль, чтобы совершить набег на приграничные города. Эти ополчения явно поддерживаются [FROM.GetName], и это открытое объявление войны. Мы должны нанести ответный удар и показать [FROM.GetName], что нами нельзя помыкать."
 SyriaFocus.60.a: "Нанести ответный удар!"
 SyriaFocus.61.t: "Израиль атакует Сирию"
 SyriaFocus.61.d: "Израиль атаковал Сирию в ответ на действия палестинских прокси, базирующихся в Иордании. Теперь у нас есть шанс вернуть Палестину, если мы согласимся подчиниться Сирии."
 SyriaFocus.61.a: "Достойная жертва"
 SyriaFocus.61.b: "Мы не будем полагаться на них"
 SyriaFocus.62.t: "[FROM.GetName] предлагает подчинение"
 SyriaFocus.62.d: "[FROM.GetName] предлагает стать нашим подданным, если мы поможем им вернуть Палестину."
 SyriaFocus.62.a: "Конечно"
 SyriaFocus.62.b: "Мы не нуждаемся в них"
 SyriaFocus.63.t: "[FROM.GetName] предлагает союз"
 SyriaFocus.63.d: "[FROM.GetName] предложил нам союз против Египта. Египет всё ещё оккупирует спорный треугольник Халаиб, который по праву принадлежит нам. [FROM.GetName] сами заинтересованы в контроле над Синаем. Объединение сил с ними поможет нам оказать давление на Египет для получения территориальных приобретений. Однако это также может привести к войне с Египтом."
 SyriaFocus.63.a: "Вместе мы сильнее"
 SyriaFocus.63.b: "Мы найдём другой способ вернуть Халаиб"
 SyriaFocus.64.t: "[FROM.GetName] требует Синай"
 SyriaFocus.64.d: "[FROM.GetName] требует, чтобы мы уступили им контроль над Синаем. Они предлагают разделить компанию Суэцкого канала, контролирующую канал, поровну - 50 на 50 между нами и ними."
 SyriaFocus.64.a: "Мы должны уступить, чтобы избежать войны"
 SyriaFocus.64.b: "Синай - египетский!"
 SyriaFocus.65.t: "Религиозное восстание!"
 SyriaFocus.65.d: "В стране происходит религиозное восстание! Члены главной не правящей религии взялись за оружие против государства. Мы подозреваем, что за этим беспорядком стоит империалистическое правительство в [FROM.GetName]."
 SyriaFocus.65.a: "Будь они прокляты!"
 SyriaFocus.66.t: "[FROM.GetName] предлагает уступки"
 SyriaFocus.66.d: "Правительство [FROM.GetName] предложило создать Курдскую автономную зону внутри строящейся ими Великой Сирии. Они будут уважать нашу автономию в обмен на передачу им части нашей независимости."
 SyriaFocus.66.a: "Наконец-то шанс на объединённый Курдистан!"
 SyriaFocus.66.b: "Мы найдём свой собственный путь"
 SyriaFocus.67.t: "[FROM.GetName] подчиняется"
 SyriaFocus.67.d: "[FROM.GetName] согласился на нашу сделку. Мы предоставим автономию всем курдам внутри Великой Сирии, и в обмен курды будут лояльны нам. Курды также ожидают, что любые будущие курдские земли, которые будут включены в Великую Сирию, будут переданы им вместо нас."
 SyriaFocus.67.a: "Отлично"
 SyriaFocus.68.t: "[FROM.GetName] сопротивляется"
 SyriaFocus.68.d: "[FROM.GetName] отказались от нашей сделки. Они заявляют, что у них нет причин менять одного хозяина на другого, но предпочитают найти другой путь для того, чтобы все курды были вместе."
 SyriaFocus.68.a: "Будь они прокляты!"
 SyriaFocus.69.t: "[FROM.GetName] требует Северную Аравию"
 SyriaFocus.69.d: "[FROM.GetName] требует, чтобы мы уступили им северные части нашей страны. Они утверждают, что эти районы состоят из сирийских народов и являются естественной частью Великой Сирии. На самом деле этот район полностью населён арабскими берберами. Одна из наших крупнейших авиабаз находится в Табуке, и было бы стратегической потерей отдать её. Если мы откажем [FROM.GetAdjective] требованиям, они, вероятно, нападут на нас."
 SyriaFocus.69.a: "Эта земля ничего не стоит, мы можем пожертвовать ею ради мира"
 SyriaFocus.69.b: "Они не получат ни дюйма земли!"
 SyriaFocus.70.t: "[FROM.GetName] предлагает союз"
 SyriaFocus.70.d: "[FROM.GetName] предложил нам союз против Саудовской Аравии. Поскольку они в настоящее время находятся в конфликте с ними, а Саудовская Аравия вмешивалась в гражданскую войну в Йемене, было бы целесообразно объединить наши силы."
 SyriaFocus.70.a: "Вместе мы сильнее"
 SyriaFocus.70.b: "Мы не хотим открытого конфликта с Саудовской Аравией"
 SyriaFocus.71.t: "Шиитское восстание в Восточной Саудовской Аравии"
 SyriaFocus.71.d: "[FROM.GetName] организовало шиитское восстание в Восточной Саудовской Аравии, главном нефтедобывающем регионе страны. Этот район почти полностью населён шиитами, которые составляют примерно 15-20% всего населения Саудовской Аравии. Эти ополченцы провозгласили лояльность режиму [FROM.GetName]."
 SyriaFocus.71.a: "Понятно"
 SyriaFocus.72.t: "[FROM.GetName] предлагает союз"
 SyriaFocus.72.d: "[FROM.GetName] предлагает нам союз против [PER.GetName]. Регион Азербайджана в Иране населён азербайджанцами, и Иран давно поддерживает нашего врага Армению. [FROM.GetName] предлагает нам регион Азербайджана, если мы заключим с ними союз и пообещаем поддерживать их в будущих военных кампаниях против [PER.GetName]."
 SyriaFocus.72.a: "Конечно"
 SyriaFocus.72.b: "Мы не хотим войны с Ираном"
 SyriaFocus.73.t: "[FROM.GetName] предлагает союз"
 SyriaFocus.73.d: "[FROM.GetName] предлагает нам союз против [TUR.GetName]. У нас есть давний спор с ними, так как [TUR.GetName] отказывается признать Геноцид армян. Кроме того, даже несмотря на то, что мы официально согласовали турецко-армянскую границу, [TUR.GetName] утверждает, что наша приверженность ей недостаточно сильна. Сирия предлагает нам союз против Турции, и в обмен мы получим Северо-Восточную Турцию - территорию, на которую претендуют некоторые более националистические партии как на часть Великой Армении."
 SyriaFocus.73.a: "Конечно"
 SyriaFocus.73.b: "Мы не хотим войны с Турцией"
 SyriaFocus.74.t: "[FROM.GetName] предлагает союз"
 SyriaFocus.74.d: "[FROM.GetName] предлагает нам союз против [TUR.GetName]. Они предлагают нам некоторые территории, основанные на идее Мегали, если мы выберем союз с ними."
 SyriaFocus.74.a: "Конечно"
 SyriaFocus.74.b: "Мы не хотим войны с Турцией"
 SyriaFocus.75.t: "[FROM.GetName] требует территорию"
 SyriaFocus.75.d: "[FROM.GetName] и их союзники требуют, чтобы мы уступили им часть нашей территории."
 SyriaFocus.75.a: "Мы не хотим войны"
 SyriaFocus.75.b: "Никогда"
 SyriaFocus.76.t: "ХАМАС захватывает контроль над Газой"
 SyriaFocus.76.d: "ХАМАС при поддержке Сирии взял под контроль сектор Газа. Их вооружённые ополченцы захватили правительственные здания, и их представитель [HAM.GetLeader] заявил, что группа готовится к маршу, чтобы освободить мечеть Аль-Акса."
 SyriaFocus.76.a: "Чёрт"
 SyriaFocus.77.t: "ХАМАС начинает новую интифаду"
 SyriaFocus.77.d: "При поддержке Сирии ХАМАС начал новую интифаду против Израиля. Десятки палестинских юношей проводят демонстрации, жгут шины и забрасывают израильских солдат камнями по всей стране."
 SyriaFocus.77.a: "Понятно"
 SyriaFocus.78.t: "Формирование Иерусалимского оборонного пакта"
 SyriaFocus.78.d: "[FROM.GetName] сформировал Иерусалимский оборонный пакт. Их намерение состоит в том, чтобы создать альянс, гарантирующий, что Иерусалим останется в руках его законного владельца."
 SyriaFocus.78.a: "Конечно, мы присоединимся"
 SyriaFocus.78.b: "Нам не нужна их помощь"
 SyriaFocus.79.t: "Приглашение в Иерусалимский оборонный пакт"
 SyriaFocus.79.d: "[FROM.GetName] пригласил нас присоединиться к их Иерусалимскому оборонному пакту. Целью Оборонного пакта является обеспечение возвращения Иерусалима его законному владельцу - Палестине."
 SyriaFocus.79.a: "Конечно, мы присоединимся"
 SyriaFocus.79.b: "Нам лучше держаться подальше от этого"
 SyriaFocus.80.t: "[FROM.GetName] хочет присоединиться к Щиту полуострова"
 SyriaFocus.80.d: "[FROM.GetName] направил нашему правительству петицию о том, что они хотели бы присоединиться к Щиту полуострова, несмотря на то, что не являются одной из стран Персидского залива. Что нам им ответить?"
 SyriaFocus.80.a: "Они желанны!"
 SyriaFocus.80.b: "Мы не можем впустить их в наш клуб"
 SyriaFocus.81.t: "[FROM.GetName] согласился на нашу просьбу"
 SyriaFocus.81.d: "[FROM.GetName] согласился на нашу просьбу"
 SyriaFocus.81.a: "Отлично"
 SyriaFocus.82.t: "[FROM.GetName] отклонил нашу просьбу"
 SyriaFocus.82.d: "[FROM.GetName] отклонил нашу просьбу"
 SyriaFocus.82.a: "Чёрт"
 SyriaFocus.83.t: "[FROM.GetName] хочет присоединиться к Оси сопротивления"
 SyriaFocus.83.d: "[FROM.GetName] направил нашему правительству петицию о том, что они хотели бы присоединиться к Оси сопротивления и бороться против США. Что нам им ответить?"
 SyriaFocus.83.a: "Они желанны!"
 SyriaFocus.83.b: "Мы не можем впустить их в наш клуб"
 SyriaFocus.84.t: "[FROM.GetName] согласился на нашу просьбу"
 SyriaFocus.84.d: "[FROM.GetName] согласился на нашу просьбу"
 SyriaFocus.84.a: "Отлично"
 SyriaFocus.85.t: "[FROM.GetName] отклонил нашу просьбу"
 SyriaFocus.85.d: "[FROM.GetName] отклонил нашу просьбу"
 SyriaFocus.85.a: "Чёрт!"
 SyriaFocus.88.t: "Победитель Национального прогрессивного фронта"
 SyriaFocus.88.d: "Похоже, что коалиция Национального прогрессивного фронта победила. И партия, получившая наибольшее количество голосов:"
 SyriaFocus.88.a: "Насеристы"
 SyriaFocus.88.b: "Популисты"
 SyriaFocus.89.t: "Выборы"
 SyriaFocus.89.d: "Наши первые свободные и справедливые выборы наконец-то проходят. Многие люди спешат к избирательным бюллетеням, чтобы проголосовать за то, что они поддерживают, и возникли три популярные силы. Одна, возглавляемая [socialism_L] и [liberalism_L], предлагает инклюзивный тип правительства, который обеспечивает равное представительство для всех, основывая всю свою идеологию на светских основаниях, направленных на объединение разнообразных людей страны в правительство западного типа с укреплённым парламентом и либеральными институтами. Другая - это исламистская коалиция, возглавляемая [Neutral_Muslim_Brotherhood_L], стремящаяся достичь того, что она называет народной исламистской республикой, которая следует исламским учениям и законам шариата. Хотя они не очень затрагивают религиозное разнообразие страны, они сосредоточились на ностальгии по консервативному правлению и заручились поддержкой ревностных суннитских исламистов и умеренных консерваторов в стране. Третья мощная, но более фрагментированная сила имеет совершенно иные планы, основанные на наследии предыдущего правительства. НПФ или Национальный прогрессивный фронт вновь утвердился как носитель того, что они считают истинными идеалами и политикой, которые привели страну к величию и стабильности, заручившись поддержкой ориентированных на реформы баасистов и националистов, стремящихся к сильному правительству, которое действительно способно действовать, его члены происходят из политически влиятельных парламентариев предыдущего правительства. НПФ разделён между [anarchist_communism_L] и [Nat_Populism_L], первый выступает за насеризм, а второй - за панарабизм. Хотя две партии различаются, они оба разделяют одинаковую политику, которую хотят реализовать, сосредоточенную вокруг популистской структуры, эксплуатирующей различные экономические и социальные угрозы, возникающие, такие как недавний рост терроризма и экономическая отсталость, обещая быстро положить конец этим проблемам без хлопот демократического принятия решений. Итак, после подсчёта голосов победитель:"
 SyriaFocus.89.a: "Исламисты"
 SyriaFocus.89.b: "Светская оппозиция"
 SyriaFocus.89.c: "Национальный прогрессивный фронт"
 SyriaFocus.90.t: "Победитель светской оппозиции"
 SyriaFocus.90.d: "Похоже, что светская оппозиция победила. И партия, получившая наибольшее количество голосов:"
 SyriaFocus.90.a: "Социал-демократы"
 SyriaFocus.90.b: "Либералы"
 SyriaFocus.91.t: "Расширение правительства"
 SyriaFocus.91.d: "Теперь, когда мы у власти, мы должны укрепить наши позиции, чтобы провести дальнейшие реформы, расширив нашу базу поддержки. Две партии предложили объединиться с нами, но на определённых условиях. Маленькая, но амбициозная партия возглавляется федералистами, стремящимися децентрализовать структуры власти и ввести инициативы прямой демократии. Другая партия возглавляется популистскими республиканцами, стремящимися к централизованной бюрократической базе власти, которая может действовать как способная объединяющая сила порядка и справедливости, полностью противостоящая федеральному решению. Мы объединимся с:"
 SyriaFocus.91.a: "Федералистами"
 SyriaFocus.91.b: "Популистскими республиканцами"
 SyriaFocus.91.c: "Да... Мы можем поговорить об этом позже"
 SyriaFocus.92.t: "Нехватка добровольных организаций сохраняется"
 SyriaFocus.92.d: "Наше финансирование и поощрение людей к формированию национальных и антисектантских ассоциаций не принесло заметных результатов. Люди по-прежнему не доверяют нашему правительству и не чувствуют принадлежности к нашей стране, предпочитая собираться вокруг своих сект, что приводит к сохранению глубоких этнических разделений. Хотя объединить людей разного этнического происхождения и сект очень сложно, это вполне возможно, и нам придётся попробовать снова после того, как мы повысим доверие меньшинств к нашему правительству и политическому процессу."
 SyriaFocus.92.a: "Мы должны объединить наших людей"
 SyriaFocus.93.t: "Неизменная местная подотчётность"
 SyriaFocus.93.d: "Наши усилия по повышению подотчётности местных чиновников, представляющих правительство и капитал, не принесли заметных результатов. Это могло быть связано с низкой прозрачностью правительства, высокой коррупцией, низкими расходами на полицию, что привело к слабой следственной власти, или слабым доверием меньшинств к нашему правительству, что вызвало эксплуатацию административной слабости через сектантское корыстолюбие и кумовство. Нам придётся решить эти проблемы, прежде чем начинать новую кампанию по искоренению неэффективности и коррупции в наших государственных институтах, чтобы позволить подотчётности стать доминирующей культурой в наших администрациях."
 SyriaFocus.93.a: "Повезёт в следующий раз"
 SyriaFocus.96.t: "Государственные чиновники не смогли заручиться народной поддержкой"
 SyriaFocus.96.d: "Нам не удалось найти и поддержать людей с народной поддержкой и необходимыми навыками, на которых можно было бы положиться для поддержания достойного административного наследия. Кумовство и коррупция, а также отсутствие активного участия народа в политике привели к нехватке конкуренции и членов, способных занять эти ответственные должности, и нам придётся сделать больше для борьбы с коррупцией, чтобы добиться успеха."
 SyriaFocus.96.a: "Нам придётся больше стимулировать людей"
 SyriaFocus.97.t: "Восстание друзов!"
 SyriaFocus.97.d: "Регионы с друзским большинством восстали против нас, воспользовавшись возможностью от нынешней гражданской войны, нанеся серьёзный удар по нашей легитимности. Это во многом связано с нашими антисекулярными идеалами, которые они считают угрозой представительству своей общины и даже безопасности."
 SyriaFocus.97.a: "Пусть делают, что хотят..."
 SyriaFocus.97.b: "На этот раз преподайте им урок."
 SyriaFocus.98.t: "Алавитские офицеры отделяются!"
 SyriaFocus.98.d: "Алавиты долгое время были угнетённым меньшинством в Сирии до прихода к власти Асадов, и теперь, когда их правление подошло к концу, группа высокопоставленных алавитских офицеров воспользовалась возможностью, чтобы оправдать шаткое положение своей общины, объявив независимость алавитских регионов. Утверждая, что это защитит их, хотя ясно, что они используют свои властные позиции, чтобы узурпировать всё, что могут."
 SyriaFocus.98.a: "вот и ушёл наш доступ к Средиземному морю"
 SyriaFocus.98.b: "наша территориальная целостность - не шутка"
 SyriaFocus.99.t: "Формирование сирийского зелёного федералистского движения"
 SyriaFocus.99.d: "Группа курдских политических активистов сформировала движение, призывающее к федерализации Сирии как решению для большей инклюзивности маргинализированного курдского населения, а также для продвижения устойчивых стимулов. Несмотря на то, что их идеалы были полностью отчуждены на политической арене, они надеются, что их крики не останутся без внимания."
 SyriaFocus.99.a: "Федерализм? в Сирии?"
 SyriaFocus.105.t: "Статус представительства друзов"
 SyriaFocus.105.d: "Друзы являются религиозным меньшинством в Сирии, проживающим в южных горных районах Южной Сирии, которые страдали от репрессий на протяжении всей истории Сирии. Должны ли мы предоставить им зарезервированные места в парламенте, чтобы гарантировать им представительство, которого они заслуживают, или мы должны просто поощрять политическое участие в их регионах? Имейте в виду, что предоставление им мест внедрит элементы конфессионализма, который разделяет политическую систему по сектантским линиям. Это может иметь будущие последствия, поскольку политики могут злоупотреблять своей властью, обвинять любого, кто их критикует, в нападении на всю секту, и это вызовет недовольство среди меньшинств, которым не были предоставлены места в парламенте."
 SyriaFocus.105.a: "Просто поощрять их быть политически активными"
 SyriaFocus.105.b: "Предоставить им зарезервированные места в парламенте"
 SyriaFocus.107.t: "Христианская община требует места!"
 SyriaFocus.107.d: "Видя, как другие религиозные общины получили места в парламенте, христианская община, опасаясь искажения представительства, потребовала, чтобы им также были предоставлены места в парламенте. Должны ли мы предоставить им места, рискуя усилить недостатки конфессионализма? Или мы должны отказать им в местах и получить недовольство христианской общины?"
 SyriaFocus.107.a: "Предоставить им места"
 SyriaFocus.107.b: "Они не имеют на это права"
 SyriaFocus.112.t: "Фосфатная промышленность и её вопросы"
 SyriaFocus.112.d: "Поскольку у Сирии есть хорошие запасы фосфатов, похоже, перед нами есть два варианта: один - для получения прибыли, а другой - для улучшения нашего сельского хозяйства. Конечно, экспорт фосфатов может немного ускорить нашу экономику, но в то же время, если мы действительно заботимся о нашем сельском хозяйстве, возможно, немного самообеспечения было бы лучше. В конце концов, это вопрос выбора между самообеспечением и торговлей. Итак, что же нам выбрать?"
 SyriaFocus.112.a: "Ради независимой и лучшей Сирии мы будем использовать их для себя."
 SyriaFocus.112.b: "Прибыль - это не так уж плохо, не так ли?"
 SyriaFocusNews.0.t: "Освобождение Рожавы"
 SyriaFocusNews.0.d: "Неожиданным шагом сегодня сирийские чиновники пообещали районам, контролируемым Рожавой, полную независимость. Глава сирийского правительства заявил, что «настало время для новой эры курдов на Ближнем Востоке». Вскоре после объявления министерства иностранных дел Турции, Ирака и Ирана выпустили заявления о том, что «это решение принесёт лишь ещё большую нестабильность в регион»."
 SyriaFocusNews.0.a: "Интересно"
 SyriaFocusNews.1.t: "Интеграция Рожавы"
 SyriaFocusNews.1.d: "Чиновники Рожавы согласились, что контролируемые ими районы должны быть интегрированы обратно в Сирию. Они также согласились вернуться к статусу, который был у них до начала гражданской войны. Это решение привело в ярость многих ветеранов войны, которые чувствуют, что их кровопролитие было напрасным."
 SyriaFocusNews.1.a: "Интересно"
 SyriaFocusNews.2.t: "Автономия для Рожавы"
 SyriaFocusNews.2.d: "Переговоры между сирийскими и рожавскими чиновниками наконец завершились, и два правительства достигли соглашения. Сирийское правительство пообещало усилить федерализацию для народов Сирии, и в обмен Рожава больше не будет добиваться отделения от Сирии."
 SyriaFocusNews.2.a: "Интересно"
 SyriaFocusNews.3.t: "Возобновление конфликта в Сирии"
 SyriaFocusNews.3.d: "Переговоры между Сирией и Рожавой сорвались, так как две стороны не смогли прийти к единому мнению о будущем Северной Сирии. Похоже, что в Сирии может назревать очередной конфликт."
 SyriaFocusNews.3.a: "Интересно"
 SyriaFocusNews.4.t: "Подъём ССНП"
 SyriaFocusNews.4.d1: "Сирийская социал-националистическая партия попыталась организовать переворот в Сирии. В результате атаки в Дамаске им удалось убить Башара аль-Асада во время церемониального смотра войск. Отсутствие Асада позволило им заручиться поддержкой ранее проасадовских фракций.\n\nЭтот новый конфликт может привести к возникновению Сирии, которая, вероятно, сначала нацелится на своих соседей, так как ССНП мечтает о Великой Сирии."
 SyriaFocusNews.4.d2: "Сирийская социал-националистическая партия попыталась организовать переворот в Сирии. По всей Сирии было совершено несколько атак, и, похоже, страна впадает в очередную гражданскую войну.\n\nЭтот новый конфликт может привести к возникновению Сирии, которая, вероятно, сначала нацелится на своих соседей, так как ССНП мечтает о Великой Сирии."
 SyriaFocusNews.4.a: "Ещё одна война?"
 SyriaFocusNews.5.t: "Формирование Сирийской Федеративной Республики"
 SyriaFocusNews.5.d: "Чтобы предотвратить новое кровопролитие в Сирии, правящие чиновники Свободной Сирии решили сформировать Сирию в федеративную республику на основе этнических и религиозных разделений. Надеемся, это уменьшит сектантское насилие, которое было распространено в стране после войны."
 SyriaFocusNews.5.a: "Молодцы!"
 SyriaFocusNews.6.t: "Этнический конфликт в Сирии"
 SyriaFocusNews.6.d: "После окончания гражданской войны в Сирии правительство Свободной Сирии пообещало курдам автономный статус в Сирии. Теперь правительство Свободной Сирии передумало, и курды снова восстали против своих угнетателей. Это, скорее всего, приведёт к ещё большему конфликту в Сирии."
 SyriaFocusNews.6.a: "Ещё одна война?"
 SyriaFocusNews.7.t: "Вторая сирийская оккупация Ливана"
 SyriaFocusNews.7.d: "После их участия в разгроме «Хезболлы», похоже, Сирия установила больший контроль над Ливаном. Похоже, история повторится, поскольку Сирия покинула Ливан всего два десятилетия назад."
 SyriaFocusNews.7.a: "Тревожно"
 SyriaFocusNews.8.t: "Переворот «Хезболлы» в Ливане"
 SyriaFocusNews.8.d: "«Хезболле» удалось совершить переворот против ливанского правительства. По некоторым данным, переворот мог быть спонсирован Сирией."
 SyriaFocusNews.8.a: "Тревожно"
 SyriaFocusNews.9.t: "Неудачный переворот в Ливане"
 SyriaFocusNews.9.d: "Переворот «Хезболлы» был предотвращён ливанскими силами безопасности недавно. Некоторые предполагают, что Сирия спонсировала переворот. Это, несомненно, приведёт к конфликту между ливанским правительством и «Хезболлой»."
 SyriaFocusNews.9.a: "Тревожно"
 SyriaFocusNews.10.t: "[From.GetName] отказывается от претензий на Голаны"
 SyriaFocusNews.10.d: "Неожиданным шагом правительство [From.GetAdjective] отказалось от своих претензий на Голанские высоты. Аналитики предполагают, что это шаг к изменению отношений с Израилем, что, возможно, приведёт к дальнейшему сотрудничеству между этими двумя странами."
 SyriaFocusNews.10.a: "Интересно"
 SyriaFocusNews.11.t: "Хафез аль-Асад умирает!"
 SyriaFocusNews.11.d: "Сегодня утром во время телефонного разговора с премьер-министром Ливана президент Сирии Хафез аль-Асад умер от сердечного приступа. В Сирии объявлен 40-дневный траур, похороны Хафеза состоятся через 3 дня. Он будет похоронен в мавзолее в своём родном городе Кардаха рядом со своим старшим сыном Басселем.\n\nСовет Хафеза должен теперь провозгласить его преемника."
 SyriaFocusNews.11.a: "Инна Лиллахи Ва Инна Илайхи Раджиун"
 SyriaFocusNews.12.t: "Сирия принимает демократию"
 SyriaFocusNews.12.d: "Из-за продолжающихся протестов, названных Дамасской весной, президент Сирии решил уйти в отставку, чтобы освободить место для демократии, а не рисковать тем, что их страна погрузится в хаос. Новый временный президент [SYR.GetLeader] пообещал помочь организовать будущие выборы."
 SyriaFocusNews.12.a: "Прогресс"
 SyriaFocusNews.13.t: "Дамасская весна"
 SyriaFocusNews.13.d: "По всей Сирии вспыхнула волна протестов. После смерти предыдущего президента Хафеза аль-Асада люди требуют более открытого и демократичного правительства. Текущий президент [SYR.GetLeader] заявил, что эти демонстранты - не что иное, как революционеры и агенты иностранных держав, и будут рассматриваться как таковые."
 SyriaFocusNews.13.a: "Интересно"
 SyriaFocusNews.14.t: "Убийство Рафика Харири"
 SyriaFocusNews.14.d: "Сегодня, когда премьер-министр Ливана покидал парламент в своём кортеже, у отеля «Сент-Джордж» взорвался заминированный автомобиль. Харири, а также 21 другой человек погибли в результате взрыва, 220 получили ранения. Ответственность за нападение взяла на себя ранее неизвестная организация «Группа Насра и Джихад в Великой Сирии». Многие считают, что за этим убийством стоит сирийское правительство, поскольку Харири был открытым критиком их оккупации. Лидер «Хезболлы» [HEZ.GetLeader] утверждает, что атака была организована Израилем, чтобы заставить Сирию покинуть Ливан."
 SyriaFocusNews.14.a: "Ужасно"
 SyriaFocusNews.15.t: "Неудавшееся убийство Рафика Харири"
 SyriaFocusNews.15.d: "Сегодня, когда премьер-министр Ливана покидал парламент в своём кортеже, у отеля «Сент-Джордж» взорвался заминированный автомобиль. К счастью, кортеж находился достаточно далеко от взрыва, и Харири выжил, хотя и был серьёзно ранен. Несколько других были убиты, и около 200 человек получили ранения. Ответственность за нападение взяла на себя ранее неизвестная организация «Группа Насра и Джихад в Великой Сирии». Многие считают, что за этим убийством стоит сирийское правительство, поскольку Харири был открытым критиком их оккупации. Лидер «Хезболлы» [HEZ.GetLeader] утверждает, что атака была организована Израилем, чтобы заставить Сирию покинуть Ливан."
 SyriaFocusNews.15.a: "Ужасно"
 SyriaFocusNews.16.t: "Кедровая революция"
 SyriaFocusNews.16.d: "С момента убийства Рафика Харири в Ливане страна находится в постоянном состоянии демонстраций. Почти ежедневно ливанское население собирается на улицах в знак протеста против оккупации Сирии. Сегодня президент Сирии [SYR.GetLeader] объявил, что сирийские войска покинут страну."
 SyriaFocusNews.16.a: "Ура демократии"
 SyriaFocusNews.17.t: "Сирия движется на Ливан"
 SyriaFocusNews.17.d: "В середине заседания ливанский парламент был взят штурмом сирийскими военными и сотрудниками службы безопасности. Несколько членов парламента были арестованы по обвинению в предполагаемом терроризме. Пока это происходило, сирийские военные подразделения, некоторые в сопровождении ополченцев «Хезболлы», двинулись на базы ливанской армии, чтобы разоружить ливанскую армию. Безопасность нескольких ключевых военных объектов теперь разделена между Сирийской арабской армией и «Хезболлой».\n\nСирийское правительство называет это антитеррористической операцией, но на практике ливанский парламент теперь полностью контролируется просирийскими политиками и членами «Хезболлы». Сирия по сути получила полный контроль над страной."
 SyriaFocusNews.17.a: "Возмутительно!"
 SyriaFocusNews.18.t: "Сирия выводит войска из Ливана"
 SyriaFocusNews.18.d: "Сталкиваясь с растущим давлением со стороны международного сообщества и ливанской общественности, Сирийская арабская армия решила вывести войска из Ливана, оставив безопасность страны полностью на усмотрение ливанских военных."
 SyriaFocusNews.18.a: "Интересно"
 SyriaFocusNews.19.t: "Создание Великой Сирии"
 SyriaFocusNews.19.d: "Сирийский лидер [SYR.GetLeader] сегодня объявил о создании Великой Сирии. Они говорят, что сирийское правительство сделает всё возможное, чтобы объединить сирийский народ, создать одно сверхгосударство в регионе. Страны региона уже осудили это действие как нелепое."
 SyriaFocusNews.19.a: "Интересно"
 SyriaFocusNews.20.t: "[HAM.GetName] начинает новую интифаду"
 SyriaFocusNews.20.d: "При поддержке Сирии ХАМАС начал новую интифаду против Израиля. Десятки палестинских юношей проводят демонстрации, жгут шины и забрасывают израильских солдат камнями по всей стране."
 SyriaFocusNews.20.a: "Понятно"
 SyriaFocusNews.21.t: "Возрождение Объединённой Арабской Республики"
 SyriaFocusNews.21.d: "Сирия и Египет решили реформировать Объединённую Арабскую Республику. После переговоров лидеров партии Баас между обеими странами они решили возродить баасистскую мечту о панарабизме. Все предыдущие арабские союзы просуществовали всего несколько лет, остаётся только посмотреть, как долго это продлится."
 SyriaFocusNews.21.a: "Бессмысленно"

 Syria.1.t: "Победа в гражданской войне!"
 Syria.1.SYR.desc: "Мы наконец победили как силы сирийской оппозиции, так и отвратительных исламистов Тахрир аш-Шама и ИГИЛ. Теперь мы можем начать восстанавливать нашу страну и сосредоточиться на будущем."
 Syria.1.FSA.desc: "Диктаторский режим Асада пал, и мы нейтрализовали угрозу исламистов. Сирия наконец-то свободна!"
 Syria.1.NUS.desc: "Аллах даровал нам победу над диктатором Асадом и Свободной сирийской армией. Это поистине божественный знак, делающий наше дело более справедливым, чем когда-либо."
 Syria.1.a: "Никакая сила не сможет нас победить!"

 Syria.14.t: "Статус Рожавы"
 Syria.14.desc: "Рожава - это самоуправляемая область на севере Сирии, где доминируют курды. Во время гражданской войны они сражались в основном против ИГИЛ вместе с другими светскими и прогрессивными ополчениями и фракциями. Их конечной целью было создание федеративной сирийской республики, хотя многие рассматривают эту область как Западный Курдистан. Требование, чтобы они подчинились нам, скорее всего, приведёт к гражданской войне. Мы всегда можем предложить им ограниченную автономию, хотя это означает, что мы не сможем полностью их контролировать. Отпустив их, мы можем усилить курдский национализм в этом районе."
 Syria.14.a: "Этот регион является частью Сирии!"
 Syria.14.b: "Предложить им автономию"
 Syria.14.c: "Дать им независимость"

 SyriaNews.1.t: "Гражданская война в Сирии окончена"
 SyriaNews.1.d: "Гражданская война в Сирии наконец прекратилась. Большая часть боёв утихла, и оставшимся фракциям предстоит планировать новое будущее для Сирии."
 SyriaNews.1.a: "Будем надеяться на лучшее для них"

 SyriaDecisions.0.t: "Переговоры по Голанам"
 SyriaDecisions.0.desc: "Посланник из [From.GetName] обратился к нам по вопросу о Голанах. Они заявляют, что если Израиль поддержит их военным путём, они откажутся от претензий на регион, который ООН всё ещё юридически считает частью Сирии. Выполнение сделки улучшит наш глобальный имидж и может дать некоторое влияние на [From.GetName]."
 SyriaDecisions.0.a: "Земля в обмен на оружие, честная сделка"
 SyriaDecisions.0.b: "Мы не можем доверять им, что они соблюдут договор"
 SyriaDecisions.1.t: "[From.GetName] соглашается"
 SyriaDecisions.1.desc: "Израиль согласился на наше предложение."
 SyriaDecisions.1.a: "Отлично"
 SyriaDecisions.2.t: "[From.GetName] отказывается"
 SyriaDecisions.2.desc: "Израиль отказался от нашей сделки"
 SyriaDecisions.2.a: "Чёрт"
 SyriaDecisions.3.t: "Переговоры по Хатаю"
 SyriaDecisions.3.desc: "Посланник из [From.GetName] обратился к нас по вопросу о Хатае. Они заявляют, что если Турция поддержит их военным путём, они откажутся от претензий на регион. Выполнение сделки улучшит наш глобальный имидж и может дать некоторое влияние на [From.GetName]."
 SyriaDecisions.3.a: "Земля в обмен на оружие, честная сделка"
 SyriaDecisions.3.b: "Мы не можем доверять им, что они соблюдут договор"
 SyriaDecisions.4.t: "[From.GetName] соглашается"
 SyriaDecisions.4.desc: "Турция согласилась на наше предложение."
 SyriaDecisions.4.a: "Отлично"
 SyriaDecisions.5.t: "[From.GetName] отказывается"
 SyriaDecisions.5.desc: "Турция отказалась от нашей сделки"
 SyriaDecisions.5.a: "Чёрт"
 SyriaDecisions.6.t: "Предложение о независимости"
 SyriaDecisions.6.desc: "[From.GetName] предложил гарантировать нашу независимость и позволить нам существовать как суверенному государству. Взамен они хотят, чтобы мы присоединились к их войне, чтобы помочь им выиграть гражданскую войну. Это может быть наш шанс обрести собственную страну."
 SyriaDecisions.6.a: "Давайте рискнём"
 SyriaDecisions.6.b: "Нет. Они всё равно предадут нас в конце концов"
 SyriaDecisions.7.t: "[From.GetName] соглашается"
 SyriaDecisions.7.desc: "[From.GetName] согласился на наше предложение."
 SyriaDecisions.7.a: "Отлично"
 SyriaDecisions.8.t: "[From.GetName] отказывается"
 SyriaDecisions.8.desc: "[From.GetName] отказался от нашей сделки"
 SyriaDecisions.8.a: "Чёрт"
 SyriaDecisions.9.t: "Шпионы из Сирии"
 SyriaDecisions.9.desc: "Мы обнаружили, что некоторые члены нашей организации находятся на зарплате у Сирии. Эти люди должны были быть намеренно подосланы Сирией, и они, очевидно, что-то замышляют. Нам нужно избавиться от этих людей и решить эту проблему."
 SyriaDecisions.9.a: "Казнить подозреваемых и нанести удар по Сирии!"
 SyriaDecisions.9.b: "Требовать выкуп за шпионов"
 SyriaDecisions.10.t: "Шпионы раскрыты"
 SyriaDecisions.10.desc: "«Хезболла» обнаружила шпионов, которых мы внедрили в их организацию, и казнила их. У нас есть сообщения о том, что солдаты «Хезболлы» движутся в сторону Даръа. Похоже, они пытаются взять под контроль этот район в качестве мести."
 SyriaDecisions.10.a: "Мы должны отбросить их назад!"
 SyriaDecisions.11.t: "Шпионы раскрыты"
 SyriaDecisions.11.desc: "«Хезболла» обнаружила шпионов, которых мы внедрили в их организацию, и захватила их. Теперь они требуют выкуп за их возвращение."
 SyriaDecisions.11.a: "Заплатить"
 SyriaDecisions.11.b: "Мы не платим террористам!"
 SyriaDecisions.12.t: "Сирия платит"
 SyriaDecisions.12.desc: "Сирия заплатила выкуп за своих шпионов."
 SyriaDecisions.12.a: "Хорошо"
 SyriaDecisions.13.t: "Сирия отказывается платить"
 SyriaDecisions.13.desc: "Сирия отказалась платить выкуп за своих шпионов."
 SyriaDecisions.13.a: "Заставить их заплатить!"
 SyriaDecisions.13.b: "Отступить"
 SyriaDecisions.14.t: "Грехи Хасана Насраллы"
 SyriaDecisions.14.desc: "В интернете начало распространяться видео, на котором лидер «Хезболлы» Хасан Насралла находится в пьяном неистовстве. Видео также включает клипы, на которых он занимается различными сексуальными действиями с теми, кто, по-видимому, является проститутками. Насралла, очевидно, отрицает легитимность видео, заявляя, что это «не что иное, как сионистский заговор». Однако Совет Шуры решил отозвать его кандидатуру и назначить [Root.GetLeader] новым генеральным секретарём.\n\n[Root.GetLeader] долгое время выступал за большую независимость от Ирана."
 SyriaDecisions.14.a: "Это выглядит подозрительно"
 SyriaDecisions.15.t: "[FROM.GetName] хочет присоединиться к Республике"
 SyriaDecisions.15.desc: "[FROM.GetName] подал петицию о присоединении к Объединённой Арабской Республике"
 SyriaDecisions.15.a: "Конечно"
 SyriaDecisions.15.b: "Мы не хотим их"
 SyriaDecisions.16.t: "Победа"
 SyriaDecisions.16.desc: "Мы достигли наших целей в пограничной войне"
 SyriaDecisions.16.a: "Отлично"
 SyriaDecisions.17.t: "Провал"
 SyriaDecisions.17.desc: "Мы не смогли достичь наших целей в пограничной войне"
 SyriaDecisions.17.a: "Чёрт"

 SyriaDecisionsNews.0.t: "Голанская сделка"
 SyriaDecisionsNews.0.d: "Неожиданным шагом [From.GetName] и [ISR.GetName] согласились по поводу их земельного спора в Голанах. [From.GetName] откажется от всех претензий на эту территорию. Многие аналитики говорят, что это шаг, чтобы получить благосклонность от [ISR.GetName], скорее всего, в форме военной поддержки их продолжающегося конфликта."
 SyriaDecisionsNews.0.a: "Интересно"
 SyriaDecisionsNews.1.t: "Хатайская сделка"
 SyriaDecisionsNews.1.d: "Неожиданным шагом [From.GetName] и [TUR.GetName] согласились по поводу их земельного спора в Хатае. [From.GetName] откажется от всех претензий на эту территорию. Многие аналитики говорят, что это шаг, чтобы получить благосклонность от [TUR.GetName], скорее всего, в форме военной поддержки их продолжающегося конфликта."
 SyriaDecisionsNews.1.a: "Интересно"
 SyriaDecisionsNews.2.t: "Рождение нации"
 SyriaDecisionsNews.2.d: "[From.GetName] и [ROJ.GetName] согласились на временный военный союз для прекращения гражданской войны. В обмен [ROJ.GetName] был предложен статус полной независимости после окончания войны."
 SyriaDecisionsNews.2.a: "Интересно"
 SyriaDecisionsNews.3.t: "Конфликт между «Хезболлой» и Сирией"
 SyriaDecisionsNews.3.d: "Обнаружение сирийской шпионской сети в организации «Хезболла» вызвало конфликт между ними. Не сумев урегулировать свой спор дипломатическим путём, есть сообщения о столкновениях между сирийскими силами и силами «Хезболлы» в Южной Сирии."
 SyriaDecisionsNews.3.a: "Интересно"
 SyriaDecisionsNews.4.t: "[FROM.GetName] присоединяется к Объединённой Арабской Республике"
 SyriaDecisionsNews.4.d: "[FROM.GetName] решил объединиться с Объединённой Арабской Республикой. Баасистские цели объединения всех арабов под одной нацией только что приблизились к реальности."
 SyriaDecisionsNews.4.a: "Интересно"

 syria_bashar.1.t: "Национальные реформы"
 syria_bashar.1.d: "Тяжёлая политическая ситуация в стране перерастает в новые протесты. Люди требуют реформ и свободных выборов. Мы можем предоставить им эту свободу, что явно не понравится партии и элитам, или мы можем просто предложить имитацию этого, стабилизируя ситуацию и сохраняя значительную власть."
 syria_bashar.1.a: "Давайте создадим имитацию реформ"
 syria_bashar.1.b: "Давайте проведём реформу!"
 syria_bashar.2.t: "Выборы в Сирии"
 syria_bashar.2.d: "После многих лет правления баасистов в Сирии наконец начались прямые выборы. Это и многое другое является частью демократических реформ Башара аль-Асада."
 syria_bashar.2.a: "Демократия пришла в Сирию"
 syria_bashar.3.t: "Скрытая рука братства"
 syria_bashar.3.d: "Встреча с лидерами «Братьев-мусульман» завершилась. Они предлагают сделку: официальную поддержку правительства в обмен на социальные уступки и освобождение своих кадров. Принятие этого успокоит наши улицы, но оттолкнёт наших светских соседей и пригласит радикальное влияние в наши коридоры власти. Или мы можем просто указать им на дверь."
 syria_bashar.3.a: "Интегрировать их в систему"
 syria_bashar.3.b: "Мы не будем торговаться с экстремистами"

 syrian_democrats.1.t: "[FROM.GetName] запрашивает военную поддержку"
 syrian_democrats.1.d: "Сирийское правительство направило дипломатов с просьбой о военной поддержке. Если мы согласимся на это, это значительно увеличит наше присутствие в регионе и подорвёт влияние России в сирийском государстве."
 syrian_democrats.1.a: "Мы поддержим демократическое правительство в Сирии."
 syrian_democrats.1.b: "Сейчас нам лучше сосредоточиться на внутренних проблемах."
 syrian_democrats.2.t: "Соединённые Штаты направляют военную поддержку"
 syrian_democrats.2.d: "Правительство Соединённых Штатов ответило на нашу просьбу и направило военную поддержку."
 syrian_democrats.2.a: "Очень хорошо!"
 syrian_democrats.3.t: "Соединённые Штаты отказываются предоставить нам военную поддержку"
 syrian_democrats.3.d: "Наши дипломаты вернулись из Соединённых Штатов с не очень хорошими новостями. Америка отказалась предоставить нам военную поддержку."
 syrian_democrats.3.a: "Ну... Ладно"
 syrian_democrats.4.t: "Сирия просит инвестиции"
 syrian_democrats.4.d: "Сирийские дипломаты обратились к нам с просьбой инвестировать в их экономику. Это укрепит наше влияние на Ближнем Востоке. Согласиться ли нам?"
 syrian_democrats.4.a: "Мы инвестируем в них"
 syrian_democrats.4.b: "Это не в наших интересах."
 syrian_democrats.5.t: "[FROM.GetName] согласился инвестировать в нас"
 syrian_democrats.5.d: "[FROM.GetName] ответил на наш недавний запрос об инвестициях. Они согласились предоставить нам финансирование."
 syrian_democrats.5.a: "Отлично!"
 syrian_democrats.6.t: "[FROM.GetName] отказался инвестировать"
 syrian_democrats.6.d: "[FROM.GetName] ответил на наш недавний запрос об инвестициях. Они отказались предоставить нам финансирование."
 syrian_democrats.6.a: "Ну, не нужно."
 syrian_democrats.7.t: "Сирия предлагает сотрудничество"
 syrian_democrats.7.d: "Сирийское правительство решило предложить нам сотрудничество в политической и экономической сферах. Согласиться ли нам на это?"
 syrian_democrats.7.a: "Мы согласны"
 syrian_democrats.7.b: "Это не в наших интересах."
 syrian_democrats.8.t: "Израиль согласился на сотрудничество"
 syrian_democrats.8.d: "Правительство Израиля выразило заинтересованность в сотрудничестве с нами. Наши дипломаты встретились на конференции и обсудили несколько соглашений, которые затем подписали."
 syrian_democrats.8.a: "Давайте выпьем за наших новых партнёров!"
 syrian_democrats.9.t: "Израиль отказывается от сотрудничества"
 syrian_democrats.9.d: "Правительство Израиля ответило на наше предложение. Они отказываются от сотрудничества с нами."
 syrian_democrats.9.a: "Ну, не нужно."

 syria_baranists.1.t: "Запрос об инвестициях от [FROM.GetName]"
 syria_baranists.1.d: "Правительство [FROM.GetNameDef] обратилось к нам с просьбой о масштабной финансовой инъекции для стабилизации их государства. Поддержка их даст нам значительное влияние на их экономику и будущее политическое направление, но требует существенного изъятия средств из нашей национальной казны."
 syria_baranists.1.a: "Расширить наше влияние."
 syria_baranists.1.b: "Это слишком рискованно."

 syria_baranists.2.t: "[QAT.GetName] соглашается инвестировать"
 syria_baranists.2.d: "Правительство [QAT.GetNameDef] одобрило нашу просьбу и инициировало перевод средств. Этот капитал позволит нам стабилизировать нашу инфраструктуру и финансировать наши операции, хотя теперь ожидается, что мы будем согласовывать наши интересы с нашими благодетелями в Дохе."
 syria_baranists.2.a: "Казна пополняется."

 syria_baranists.3.t: "[QAT.GetName] отказывается от инвестиций"
 syria_baranists.3.d: "Наши посланники возвращаются из Дохи с пустыми руками. [QAT.GetNameDef] посчитал риски в нашей стране слишком высокими для крупных инвестиций в настоящее время. Нам придётся найти другие способы финансировать нашу борьбу."
 syria_baranists.3.a: "Тогда мы должны полагаться на себя."

 syria_baranists.4.t: "Турецкий оборонный пакт"
 syria_baranists.4.d: "Анкара предлагает нам официальный «зонтик безопасности». В обмен на то, чтобы стать защищённым сателлитным государством, Турция гарантирует наши границы и предоставит современное военное оборудование. Это удар по нашей гордости, но огромное приобретение для нашего выживания."
 syria_baranists.4.a: "Подписать пакт. Мы в безопасности под Полумесяцем."
 syria_baranists.4.b: "Мы будем стоять в одиночку."

 syria_baranists.5.t: "Сирия под защитой"
 syria_baranists.5.d: "Турецкие военные официально развёртывают активы для поддержки нашей обороны. Теперь мы являемся ключевым узлом в региональной архитектуре безопасности Анкары."
 syria_baranists.5.a: "Начинается новая эра сотрудничества."

 syria_baranists.6.t: "Турецкое предложение отклонено"
 syria_baranists.6.d: "Турция выразила разочарование нашим отказом. Отношения могут охладиться, и наша оборона теперь полностью опирается на силу наших собственных штыков."
 syria_baranists.6.a: "Независимость превыше всего."

 syria_baranists.7.t: "Дилемма «Аль-Каиды»"
 syria_baranists.7.d: "Наши связи с «Аль-Каидой» стали обоюдоострым мечом. Международное сообщество требует, чтобы мы разорвали все связи или столкнулись с полной изоляцией. Однако наши самые верные ветераны-бойцы увидят в предательстве объявление войны истинной вере."
 syria_baranists.7.a: "Изгнать элементы «Аль-Каиды». (Искать легитимность)"
 syria_baranists.7.b: "Они - наши братья по оружию. (Укрепить связи)"

 syria_baranists.8.t: "Кризис: Дезертирство в армии"
 syria_baranists.8.d: "Хаос в командной структуре и меняющаяся идеологическая лояльность спровоцировали волну дезертирства. Солдаты покидают свои посты, часто забирая с собой винтовки и снаряжение. Мы должны действовать, прежде чем линии фронта растворятся."
 syria_baranists.8.a: "Тяжёлый удар по нашей силе..."

 syria_baranists.9.t: "Сирийская переговорная комиссия"
 syria_baranists.9.d: "Сирийское правительство официально обратилось к нам с предложением относительно фракций Свободной сирийской армии (FSA), находящихся под нашим покровительством. Они добиваются полной интеграции этих сил в свою военную и политическую командную структуру. В обмен они готовы принять значительно усиленную роль Турции в их процессах принятия решений.\n\nЕсли мы согласимся, FSA будет поглощена Сирией, создав единый фронт, который может стабилизировать регион. Однако мы получим существенное влияние на Дамаск. Если мы откажемся, мы рискуем оттолкнуть правительство, которое мы усердно культивировали."
 syria_baranists.9.a: "Принять сделку"
 syria_baranists.9.b: "Сохранить FSA как наш собственный инструмент."

 syria_baranists.10.t: "Интеграция завершена"
 syria_baranists.10.d: "Бойцы FSA успешно влились в наши ряды. Наша территория расширилась, и наша армия усилилась их численностью. Анкара наблюдает за процессом с большим интересом."
 syria_baranists.10.a: "Единая Сирия в пределах досягаемости."

 syria_baranists.11.t: "Переговоры провалились"
 syria_baranists.11.d: "Стороны не смогли достичь соглашения. Раскол в оппозиции остаётся широким - ситуация, которая идёт на пользу только нашим общим врагам."
 syria_baranists.11.a: "Прискорбная неудача."

 syria_baranists.12.t: "Умиротворение Запада"
 syria_baranists.12.d: "Чтобы снять санкции и улучшить наше международное положение, нас пригласили подписать несколько торговых и дипломатических соглашений с западными институтами. Это требует от нас проявления умеренности и прозрачности."
 syria_baranists.12.a: "Добиваться дипломатического сближения."
 syria_baranists.12.b: "Нам не нужно их одобрение."

 syria_baranists.13.t: "Рукопожатие с Западом"
 syria_baranists.13.d: "Соглашение подписано. Торговые пути открываются, и наш дипломатический статус стабилизировался. Нас больше не считают государством-изгоем на глобальных рынках."
 syria_baranists.13.a: "Прагматизм восторжествовал."

 syria_baranists.14.t: "Диалог отклонён"
 syria_baranists.14.d: "Мы отказались следовать западным условиям. Отношения остаются враждебными, и давление санкций, вероятно, усилится в ближайшие месяцы."
 syria_baranists.14.a: "Мы проложим свой собственный путь."
