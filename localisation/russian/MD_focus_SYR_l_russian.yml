 ##########ROJAVA IDEAS##########
 rojava_spirit_of_revolution_1: "Дух революции"
 rojava_spirit_of_revolution_1_desc: "Революция в Рожаве создала общество, которое отказывается сдаваться, даже перед лицом непреодолимых трудностей."
 rojava_spirit_of_revolution_2: "Дух революции (Обновлённый)"
 rojava_spirit_of_revolution_2_desc: "Наша решимость крепнет с каждым боем. Люди Рожавы выдержат и победят."
 rojava_unintegrated_minorities: "Неинтегрированные меньшинства"
 rojava_unintegrated_minorities_desc: "Без реального представительства и гарантий общины меньшинств остаются неспокойными в рамках нашей администрации."
 rojava_unintegrated_minorities_2: "Меньшинства интегрированы"
 rojava_unintegrated_minorities_2_desc: "Благодаря местным советам и разделению власти общины меньшинств становятся всё более приверженными проекту Рожавы."
 rojava_political_chaos: "Политический хаос"
 rojava_political_chaos_desc: "Фракционные споры и военное давление привели к беспорядку в нашей политике, ослабив эффективное управление."
 rojava_defense_measures: "Оборонительные меры"
 rojava_defense_measures_desc: "Улучшенные укрепления, логистика и гражданская готовность укрепляют нашу способность держать оборону."
 kill_deash: "Уничтожить ДАИШ"
 kill_deash_desc: "Не может быть мира, пока ДАИШ существует. Мы сосредоточим наши усилия на уничтожении их остатков."
 kill_sna: "Разгромить СНА"
 kill_sna_desc: "Сирийская национальная армия остаётся постоянной угрозой вдоль наших границ. Мы сломаем их возможности и сети."
 rojava_or_death: "Рожава или смерть"
 rojava_or_death_desc: "Наши враги обещают уничтожение. Мы отвечаем полной приверженностью защите нашей родины и революции."
 rojava_disorganized_militias_1: "Дезорганизованные ополчения I"
 rojava_disorganized_militias_1_desc: "Наши силы храбры, но плохо скоординированы, им не хватает подготовки, снабжения и единого командования."
 rojava_disorganized_militias_2: "Дезорганизованные ополчения II"
 rojava_disorganized_militias_2_desc: "Реформы проводятся, но наши ополчения всё ещё борются с командованием и контролем."
 rojava_disorganized_militias_3: "Дезорганизованные ополчения III"
 rojava_disorganized_militias_3_desc: "Стандартизация и дисциплина улучшаются, хотя неэффективность остаётся."
 rojava_disorganized_militias_4: "Дезорганизованные ополчения IV"
 rojava_disorganized_militias_4_desc: "Наши подразделения почти интегрированы в сплочённую силу, остались лишь незначительные проблемы координации."
 rojava_undecided_status: "Неопределённый статус"
 rojava_undecided_status_desc: "Положение Рожавы в Сирии остаётся неурегулированным, создавая неопределённость внутри страны и за рубежом."
 rojava_apo_spirit: "Дух Апо"
 rojava_apo_spirit_desc: "Идеалы Абдуллы Оджалана вдохновляют единство, жертвенность и международную солидарность в рамках нашего движения."
 rojava_asayish: "Асайиш"
 rojava_asayish_desc: "Укреплённый аппарат внутренней безопасности улучшает стабильность и противодействует иностранному подрыву."
 rojava_international_brigades: "Интернациональные бригады"
 rojava_international_brigades_desc: "Интернациональные добровольцы и специалисты укрепляют наши силы и распространяют наше дело за пределы Сирии."
 rojava_libertarian: "Либертарный социализм"
 rojava_libertarian_desc: "Децентрализованная система коммун и кооперативов уменьшает бремя для людей, одновременно повышая долгосрочную производительность."
 rojava_libertarian2: "Либертарный социализм"
 rojava_libertarian2_desc: "С более сильными институтами наша модель расширяется дальше, раскрывая больше потенциала, одновременно закрепляя социальные достижения."
 rojava_tax_haven: "Политика налогового убежища"
 rojava_tax_haven_desc: "Снижая налоги и упрощая администрирование, мы стремимся привлечь капитал и стимулировать рост, ценой снижения государственных доходов."
 rojava_breaking_old_order: "Разрушение старого порядка"
 rojava_breaking_old_order_desc: "Избавившись от остатков старого порядка, курдский народ Рожавы наконец получит шанс построить своё новое будущее с нуля."
 rojava_aladruzes_friendship: "Сотрудничество с [DRU.GetNameWithFlag]"
 rojava_aladruzes_friendship_desc: "Наше сотрудничество имеет как культурные, так и военные цели – только вместе мы можем защитить нашу независимость и право на существование."
 rojava_aladruzes_friendship_1: "Сотрудничество с [ALA.GetNameWithFlag]"
 rojava_aladruzes_friendship_1_desc: "Наше сотрудничество имеет как культурные, так и военные цели – только вместе мы можем защитить нашу независимость и право на существование."
 rojava_aladruzes_friendship_2: "Сотрудничество с [ROJ.GetNameWithFlag]"
 rojava_aladruzes_friendship_2_desc: "Наше сотрудничество имеет как культурные, так и военные цели – только вместе мы можем защитить нашу независимость и право на существование."

 ##########ROJAVA TREE##########
ROJ_arise: "Восстань, Рожава!"
ROJ_arise_desc: "Эксперимент по самоуправлению в Рожаве поднимается из хаоса войны, полный решимости защитить свой народ и идеалы."
ROJ_SDF: "Сформировать Сирийские демократические силы"
ROJ_SDF_desc: "Мы объединим ополчения Рожавы и их союзников в Сирийские демократические силы, широкую коалицию, способную защитить революцию."
ROJ_protect_women: "Защитить женщин Рожавы"
ROJ_protect_women_desc: "Организуя женские отряды самообороны и гарантируя им место в борьбе, мы поддерживаем гендерное освобождение как основной столп нашей революции."
ROJ_manbij: "Спасти Манбидж"
ROJ_manbij_desc: "Манбидж - жизненно важный перекрёсток на Евфрате. Мы должны направить силы на его защиту и доказать, что Рожава защищает все общины, находящиеся под угрозой."
ROJ_protect_people: "Защитить людей"
ROJ_protect_people_desc: "Каждая деревня и каждый квартал должны быть защищены от фашистских и джихадистских сил. Мы расширим наши ополчения, чтобы защищать людей, где бы они ни жили."
ROJ_kurdish_supremacy: "Курдское превосходство"
ROJ_kurdish_supremacy_desc: "Некоторые в нашем движении утверждают, что только курдский авангард может обеспечить будущее Рожавы, даже рискуя оттолкнуть наших союзников."
ROJ_KNC_agreement: "Соглашение с КНС"
ROJ_KNC_agreement_desc: "Достигнув взаимопонимания с Курдским национальным советом, мы можем уменьшить внутренние курдские разногласия и укрепить наш общий фронт."
ROJ_minorities_agreement: "Защитить меньшинства"
ROJ_minorities_agreement_desc: "Ассирийцы, армяне, арабы и другие должны иметь место в нашем проекте. Формальный пакт с меньшинствами обеспечит их поддержку."
ROJ_asayish: "Укрепить Асайиш"
ROJ_asayish_desc: "Асайиш - наши силы внутренней безопасности. Мы профессионализируем и расширим их, чтобы поддерживать порядок, не предавая наши революционные принципы."
ROJ_apo: "Дух Апо"
ROJ_apo_desc: "Учения Абдуллы Оджалана вдохновляют нашу борьбу. Принимая его идеи, мы даём нашему народу объединяющее революционное видение."
ROJ_kurdish_support: "Искать курдскую поддержку"
ROJ_kurdish_support_desc: "От Кандиля до Диярбакыра курды по всему региону внимательно следят за Рожавой. Мы будем искать политическую и материальную поддержку наших сородичей за пределами границ."
ROJ_syria_assyria_council: "Сирийско-ассирийский совет"
ROJ_syria_assyria_council_desc: "Создав сирийско-ассирийский совет в нашей администрации, мы гарантируем представительство и углубляем связи с христианскими общинами."
ROJ_international_brigades: "Интернациональные бригады"
ROJ_international_brigades_desc: "Добровольцы со всего мира стекаются для защиты Рожавы. Мы организуем их в интернациональные бригады, чтобы укрепить как нашу армию, так и наше послание."
ROJ_turkish_opposition: "Обратиться к турецкой оппозиции"
ROJ_turkish_opposition_desc: "Противники режима Анкары могут найти общее дело с нами. Дискретное сотрудничество с турецкими оппозиционными силами ослабит нашего северного врага."
ROJ_nubar_ozaryan_brigade: "Бригада Нубара Озаряна"
ROJ_nubar_ozaryan_brigade_desc: "В честь павших товарищей мы сформируем бригаду Нубара Озаряна, армянское подразделение, символизирующее нашу приверженность антифашистской борьбе."
ROJ_self_defence_forces: "Силы самообороны"
ROJ_self_defence_forces_desc: "Мы создадим структурированные силы самообороны в каждом кантоне, гарантируя, что наши общины смогут быстро мобилизоваться против любой угрозы."
ROJ_turkish_volunteers: "Турецкие добровольцы"
ROJ_turkish_volunteers_desc: "Турецкие революционеры и дезертиры будут приветствоваться в наших рядах, формируя подразделения, посвящённые сопротивлению авторитаризму на их родине."
ROJ_mazloum_abdi: "Лидерство Мазлума Абди"
ROJ_mazloum_abdi_desc: "Под руководством Мазлума Абди наши силы получают опытного и прагматичного командира, который может сбалансировать дипломатию и военную необходимость."
ROJ_self_rule: "Самоуправление для Рожавы"
ROJ_self_rule_desc: "Мы формализуем самоуправление Рожавы, создавая институты, которые подчиняются местным советам, а не далёким диктатурам."
ROJ_arabs_question: "Арабский вопрос"
ROJ_arabs_question_desc: "Наша революция не может выжить без поддержки арабских общин. Мы должны решить, как далеко зайти в разделении власти и территории с ними."
ROJ_US_support: "Добиваться поддержки США"
ROJ_US_support_desc: "Соединённые Штаты ищут надёжных партнёров в борьбе с терроризмом. Тщательно работая с ними, мы можем обеспечить оружие и воздушную поддержку, защищая нашу автономию."
ROJ_rus_support: "Искать поддержку России"
ROJ_rus_support_desc: "Россия является решающей силой в Сирии. Если мы сможем убедить Москву, что стабильная Рожава служит её интересам, мы можем получить ценную защиту."
ROJ_break_them: "Разрушить старый порядок"
ROJ_break_them_desc: "Старые силы Дамаска и оппозиции не могут оба доминировать в Сирии. Мы столкнём их друг с другом, пока их хватка над нашими землями не будет сломлена."
ROJ_saa_negotiations: "Переговоры с САА"
ROJ_saa_negotiations_desc: "Переговоры с Сирийской арабской армией могут дать прекращение огня, обмен территориями и гарантии, которые купят нам время для консолидации нашего проекта."
ROJ_fsa_negotiations: "Переговоры с ССА"
ROJ_fsa_negotiations_desc: "Умеренные повстанческие группы могут предпочесть сотрудничество бесконечной войне. Мы изучим возможности переговоров со Свободной сирийской армией там, где интересы совпадают."
ROJ_territorial_agreement: "Территориальные соглашения"
ROJ_territorial_agreement_desc: "Заключая территориальные соглашения с нашими соперниками, мы можем обезопасить наше сердце и сосредоточиться на строительстве институтов вместо постоянной войны."
ROJ_southern_operations_room: "Южная оперативная комната"
ROJ_southern_operations_room_desc: "Совместная оперативная комната с нашими партнёрами на юге будет координировать наступления, разведку и логистику против общих врагов."
ROJ_turkey_ceasefire: "Прекращение огня с Турцией"
ROJ_turkey_ceasefire_desc: "Если Анкару удастся убедить приостановить свои вторжения, даже временно, мы используем передышку, чтобы укрепить наши границы и восстановить пострадавшие от войны регионы."
ROJ_alawites_connections: "Алавитские связи"
ROJ_alawites_connections_desc: "Культивирование связей с алавитскими общинами и офицерами может открыть каналы внутри режима и уменьшить риск сектантской эскалации."
ROJ_coordinations_with_israel: "Координация с Израилем"
ROJ_coordinations_with_israel_desc: "Дискретная координация с Израилем может дать разведку и сдерживание против враждебных акторов, хотя и ценой региональных подозрений."
ROJ_prepare_constitution: "Подготовить новую конституцию"
ROJ_prepare_constitution_desc: "Мы созовём представителей всех народов северной Сирии для разработки конституции, основанной на демократии, гендерном равенстве и общинном самоуправлении."
ROJ_libertarian_socialism: "Либертарный социализм"
ROJ_libertarian_socialism_desc: "Руководствуясь либертарной социалистической мыслью, мы построим децентрализованную систему коммун, кооперативов и советов за пределами старой государственной модели."
ROJ_revol_army_negotiations: "Армия революционеров"
ROJ_revol_army_negotiations_desc: "Армия революционеров может стать ключевым союзником или опасным соперником. Переговоры определят, будут ли они с нами или против нас."
ROJ_iran_negotiations: "Переговоры с Ираном"
ROJ_iran_negotiations_desc: "Взаимодействие с Тегераном дипломатически может открыть оружие и политические гарантии, но рискует связать нашу судьбу с региональной борьбой за власть."
ROJ_democratic_autonomous_administration: "Демократическая автономная администрация"
ROJ_democratic_autonomous_administration_desc: "Мы создадим Демократическую автономную администрацию, институционализируя самоуправление в северной и восточной Сирии."
ROJ_western_kurdistan_republic: "Республика Западный Курдистан"
ROJ_western_kurdistan_republic_desc: "Провозгласив Республику Западный Курдистан, мы открыто заявляем о наших национальных устремлениях и приглашаем курдов повсюду сплотиться под нашим знаменем."
ROJ_war_measures: "Чрезвычайные военные меры"
ROJ_war_measures_desc: "Чтобы пережить продолжающийся конфликт, мы централизуем командование, мобилизуем резервы и введём строгие военные меры по всей Рожаве."
ROJ_daesh_destroy: "Уничтожить ДАИШ"
ROJ_daesh_destroy_desc: "Так называемое Исламское государство должно быть искоренено. Мы не успокоимся, пока не падёт его последний оплот."
ROJ_turkey_border_defenses: "Укрепить турецкую границу"
ROJ_turkey_border_defenses_desc: "Мы выкопаем траншеи, построим укрепления и подготовим засады вдоль турецкой границы, чтобы отразить любое вторжение."
ROJ_sna_infiltrate: "Проникнуть в СНА"
ROJ_sna_infiltrate_desc: "Проникая в Сирийскую национальную армию, мы можем собирать разведданные, саботировать враждебные планы и переманивать разочарованных бойцов."
ROJ_federalisation_negotiation: "Переговоры о федерализации"
ROJ_federalisation_negotiation_desc: "Федеративная Сирия могла бы гарантировать нашу автономию в рамках более крупного государства. Мы будем добиваться конституционного урегулирования, которое признаёт наши права."
ROJ_true_syrian_government: "Истинное сирийское правительство"
ROJ_true_syrian_government_desc: "Если другие окажутся непригодными для управления, мы представим нашу администрацию как законное правительство Сирии и будем добиваться международного признания."
ROJ_konets_genocida: "Мир наконец"
ROJ_konets_genocida_desc: "После лет резни и этнических чисток мы объявим об окончании войны и приверженности справедливости для всех общин."
ROJ_demilitarize_economy: "Демилитаризовать экономику"
ROJ_demilitarize_economy_desc: "Когда худшая часть войны позади, ресурсы должны переключиться с пушек на хлеб, восстановление гражданской инфраструктуры и повседневной жизни."
ROJ_democratic_federation_of_syria: "Демократическая федерация Сирии"
ROJ_democratic_federation_of_syria_desc: "Наше долгосрочное видение - демократическая федерация, где все народы Сирии разделяют власть через автономные регионы и общие институты."
ROJ_rojava_or_death: "Рожава или смерть"
ROJ_rojava_or_death_desc: "Наши люди знают, что капитуляция означает уничтожение. Мы будем сражаться с полной решимостью, сплачивая население под криком «Рожава или смерть»."
ROJ_call_for_international_support: "Призыв к международной поддержке"
ROJ_call_for_international_support_desc: "Мы обратимся к совести мира, прося государства, движения и отдельных лиц поддержать Рожаву против агрессии."
ROJ_union_with_iraqi_kurdistan: "Союз с Иракским Курдистаном"
ROJ_union_with_iraqi_kurdistan_desc: "Более тесный союз с Иракским Курдистаном мог бы создать непрерывное курдское образование, объединяя ресурсы и укрепляя наши переговорные позиции."
ROJ_towards_northern_kurdistan: "К Северному Курдистану"
ROJ_towards_northern_kurdistan_desc: "Наша борьба не заканчивается на искусственных границах. Мы будем готовиться политически и военно к освобождению Северного Курдистана."
ROJ_PJAK_rebellion_support: "Поддержать восстание ПАК"
ROJ_PJAK_rebellion_support_desc: "Помогая партизанам ПАК в Иране, мы наносим удар по тем, кто угрожает нам, одновременно углубляя панкурдское революционное сотрудничество."
ROJ_united_kurdistan: "Объединённый Курдистан"
ROJ_united_kurdistan_desc: "От Рожавы до гор Ирана и Турции мы envision объединённый Курдистан, где все курды живут свободно и равноправно."
ROJ_cooperative_economy: "Кооперативная экономика"
ROJ_cooperative_economy_desc: "Мы заменим эксплуататорские отношения сетью кооперативов, давая рабочим и крестьянам прямой контроль над производством."
ROJ_libertarian_tax_heaven: "Либертарное налоговое убежище"
ROJ_libertarian_tax_heaven_desc: "Низкие налоги и лёгкое регулирование могут привлечь капитал и инновации, хотя мы должны гарантировать, что они не подорвут нашу социальную модель."
ROJ_healthcare_support_measures: "Меры поддержки здравоохранения"
ROJ_healthcare_support_measures_desc: "Инвестиции в клиники, больницы и профилактическую помощь укрепят наше общество и покажут людям преимущества нашей администрации."
ROJ_agricultural_cooperatives: "Сельскохозяйственные кооперативы"
ROJ_agricultural_cooperatives_desc: "Фермеров будут поощрять к формированию кооперативов, совместно используя землю, машины и прибыль для повышения производительности и устойчивости."
ROJ_industrial_cooperatives: "Промышленные кооперативы"
ROJ_industrial_cooperatives_desc: "Фабрики и мастерские будут реорганизованы под владение рабочих, гарантируя, что промышленность служит потребностям многих, а не немногих."
ROJ_worker_councils: "Рабочие советы"
ROJ_worker_councils_desc: "Демократически избранные рабочие советы будут управлять рабочими местами и координировать свои действия с местными коммунами в поистине низовой экономике."
ROJ_oil_must_flow: "Нефть должна течь"
ROJ_oil_must_flow_desc: "Наш контроль над восточными нефтяными месторождениями жизненно важен. Мы обеспечим добычу и экспорт для финансирования восстановления и обороны."
ROJ_self_sufficient_military_production: "Самодостаточное военное производство"
ROJ_self_sufficient_military_production_desc: "Рожава больше не должна зависеть от иностранного оружия. Мы будем развивать отечественные мастерские и промышленность, чтобы самим оснащать наших бойцов."
alawites_failed_tt: "§YАлавитское восстание провалилось§!"
alawites_succeed_tt: "§YАлавитское восстание удалось§!"
rojava.2.t: "[FROM.GetNameWithFlag] предлагает военное сотрудничество"
rojava.2.d: "[FROM.GetNameWithFlag] предлагает вступить с нами в военное партнёрство. Согласившись, мы получим долгосрочного союзника в эти трудные времена."
rojava.2.a: "Мы согласны"
rojava.2.b: "Нет"
rojava.3.t: "[FROM.GetNameWithFlag] согласился на наше предложение"
rojava.3.d: "Наше предложение было встречено с энтузиазмом правительством [FROM.GetNameWithFlag], после чего они быстро заключили с нами соглашение."
rojava.3.a: "Хорошо"
rojava.4.t: "[FROM.GetNameWithFlag] отклонил наше предложение"
rojava.4.d: "Несмотря на нашу открытость к совместному диалогу, нам не удалось убедить [FROM.GetNameWithFlag] подписать предложенное нами соглашение."
rojava.4.a: "Мдэ"
rojava.5.t: "[FROM.GetNameWithFlag] хочет заключить перемирие на границе"
rojava.5.d: "[FROM.GetNameWithFlag] предлагает прекратить конфликт и заключить перемирие, чтобы спасти жизни наших граждан."
rojava.5.a: "Мы согласны"
rojava.5.b: "Нет, мы любим войну"
rojava.6.t: "[FROM.GetNameWithFlag] соглашается на прекращение огня"
rojava.6.d: "К счастью, нам удалось достичь соглашения с правительством [FROM.GetNameWithFlag] о прекращении огня. Возможно, это будет наш последний конфликт с ними."
rojava.6.a: "Хорошо"
rojava.7.t: "[FROM.GetNameWithFlag] отказывается подписывать прекращение огня"
rojava.7.d: "К сожалению, конфликт не будет разрешён в ближайшее время. Это печальная глава в нашей истории."
rojava.7.a: "Мдэ"
rojava.8.t: "[FROM.GetNameWithFlag] предлагает подписать соглашение об уважении границ"
rojava.8.d: "Правительство [FROM.GetNameWithFlag] предлагает подписать соглашение, в соответствии с которым мы признаём суверенитет друг друга и начинаем военное партнёрство."
rojava.8.a: "Мы согласны"
rojava.8.b: "Нет"
rojava.9.t: "[FROM.GetNameWithFlag] соглашается с нашим предложением"
rojava.9.d: "Наше предложение было встречено с энтузиазмом правительством [FROM.GetNameWithFlag], после чего они быстро заключили с нами соглашение."
rojava.9.a: "Хорошо"
rojava.10.t: "[FROM.GetNameWithFlag] отклонил наше предложение"
rojava.10.d: "Несмотря на нашу открытость к совместному диалогу, нам не удалось убедить [FROM.GetNameWithFlag] подписать предложенное нами соглашение."
rojava.10.a: "Мдэ"
rojava.11.t: "[FROM.GetNameWithFlag] запрашивает заключение соглашения о военном партнёрстве"
rojava.11.d: "Правительство [FROM.GetNameWithFlag] пришло к нам с предложением заключить с ними военное соглашение в обмен на наше влияние в их стране."
rojava.11.a: "Мы согласны"
rojava.11.b: "Нет"
rojava.12.t: "[FROM.GetNameWithFlag] соглашается с нашим предложением"
rojava.12.d: "Наше предложение было встречено с энтузиазмом правительством [FROM.GetNameWithFlag], после чего они быстро заключили с нами соглашение."
rojava.12.a: "Хорошо"
rojava.13.t: "[FROM.GetNameWithFlag] отклонил наше предложение"
rojava.13.d: "Несмотря на нашу открытость к совместному диалогу, нам не удалось убедить [FROM.GetNameWithFlag] подписать предложенное нами соглашение."
rojava.13.a: "Мдэ"
rojava.14.t: "Успешное восстание алавитов"
rojava.14.d: "Нам удалось сплотить алавитов на борьбу за свою независимость. Алавитский народ и народ Рожавы возрадовались, когда пришла новость о создании независимого алавитского государства."
rojava.14.a: "Хорошо"
rojava.15.t: "Провал алавитского восстания"
rojava.15.d: "К сожалению, нам не удалось сплотить алавитский народ на борьбу за свою независимость. Однако это не исключает возможности создания ими собственного государства в будущем, нам просто нужно подождать."
rojava.15.a: "Мдэ"
rojava_militia_tt: "Новые §Yбригады§! будут созданы"

KUR_AUTH: "Фронт освобождения Курдистана"
KUR_AUTH_S_neutrality: "Объединённое курдское государство"