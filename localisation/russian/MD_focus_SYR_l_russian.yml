 Syrianew.1.t: "Будущее Баас"
 Syrianew.1.d: "В нашей новой системе нет места жёсткой иерархии партии Баас. Нам нужно решить, что с ними делать. С одной стороны, мы могли бы привести партию в коалицию по символическим причинам. С другой стороны, мы могли бы поддержать проиракскую фракцию и интегрировать всех в неё."
 Syrianew.1.a: "Давайте приведём людей Башара!"
 Syrianew.1.b: "Националистические связи могут быть полезны"
 Syrianew.1.c: "Нам не нужны эти идиоты!"

 #Diplomacy Ideas
 SYR_sadam_oil: "Контрабанда иракской нефти"
 SYR_sadam_oil_desc: "Мы достигли взаимопонимания с иракским правительством, чтобы способствовать дискретному экспорту их нефти в обход международных санкций.\nЭта §Gдоговорённость§! будет §Rаннулирована§!, если §Yбаасисты§! потеряют власть в любой из стран, или если отношения между нашими странами §Rзначительно ухудшатся§!"
 SYR_IRQ_sadam_oil: "Сирийский контрабандный коридор"
 SYR_IRQ_sadam_oil_desc: "Мы создали тайный маршрут контрабанды через сирийскую территорию для экспорта санкционной нефти.\nЭта §Gдоговорённость§! будет §Rаннулирована§!, если §Yбаасисты§! потеряют власть в любой из стран, или если отношения между нашими странами §Rзначительно ухудшатся§!"
 SYR_EGY_airforce_cooperation: "Тайная лётная подготовка в Египте"
 SYR_EGY_airforce_cooperation_desc: "Египет §Gтайно обучает наших пилотов§! в обмен на §Yвоенные базы§! на нашей территории. Это соглашение §Rзакончится§!, если мы §Rотменим права§! на эти §Yвоенные базы§!"
