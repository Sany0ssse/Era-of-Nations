 BLR_Economic: "Белорусская экономика"
 BLR_Economic_desc: "Нам необходимо развивать нашу экономику, и мы используем ряд мер для успешной реализации этого развития."
 BLR_Expand_Mozyr_Refinery: "Расширение Мозырского нефтеперерабатывающего завода"
 BLR_Expand_Mozyr_Refinery_desc: "Мы расширим это нефтехранилище"
 BLR_Belshina: "ОАО \"Белшина\""
 BLR_Belshina_desc: "ОАО \"Белшина\" - производитель автомобильных шин. Оно производит шины для легковых автомобилей, грузовиков, большегрузной техники, дорожно-строительной и грузоподъемной техники, электромобилей, автобусов, тракторов и сельскохозяйственной техники"
 BLR_Expand_Naftan_Refinery: "Расширение нефтеперерабатывающего завода \"Нафтан\""
 BLR_Expand_Naftan_Refinery_desc: "Мы расширим это нефтехранилище"
 BLR_Expansion_Okolovsky_Novoselkovsky: "Расширение добычи руды на месторождениях"
 BLR_Expansion_Okolovsky_Novoselkovsky_desc: "Расширение добычи руды на Околовском и Новоселковском месторождениях принесет нам много стали"
 BLR_metro_minsk: "Минский метрополитен"
 BLR_metro_minsk_desc: "Мы будем совершенствовать и расширять Минский метрополитен, чтобы улучшить логистические характеристики города"
 BLR_belavia: "Белавиа"
 BLR_belavia_desc: "Белорусская государственная авиакомпания со штаб-квартирой в Минске. Основана в 1996 году. Основные регулярные и чартерные международные рейсы выполняются из Национального аэропорта Минск."
 BLR_Zubr_Energy_LLC: "ООО \"Зубр Энерджи\""
 BLR_Zubr_Energy_LLC_desc: "Завод по производству стартерных аккумуляторов для поставки на конвейерные линии мировых и отечественных автопроизводителей."
 BLR_Hi_Tech_Park: "Парк высоких технологий"
 BLR_Hi_Tech_Park_desc: "Парк высоких технологий — это особый налоговый и правовой режим для развития IT-бизнеса в Беларуси. Это не свободная (специальная, выделенная) экономическая зона, но это юрисдикция, которая действует по принципу экстерриториальности. Компании и индивидуальные предприниматели, зарегистрированные в Парке, могут пользоваться предоставленными им преференциями независимо от местонахождения их белорусского офиса."
 BLR_Factory_Kommunarka: "Фабрика \"Коммунарка\""
 BLR_Factory_Kommunarka_desc: "Наш президент считает, что приватизация кондитерской фабрики \"Коммунарка\" была незаконной, поэтому было объявлено о национализации этого предприятия"
 BLR_MZKT: "МЗКТ"
 BLR_MZKT_desc: "Минский завод колесных тягачей — предприятие, специализирующееся на производстве дорожных и внедорожных большегрузных машин, прицепных транспортных средств, специальных колесных шасси для монтажа оборудования для предприятий строительного, нефтегазового и машиностроительного комплексов; государственное предприятие, находящееся в ведении Государственного военно-промышленного комитета Республики Беларусь"
 BLR_mtz: "Минский тракторный завод"
 BLR_mtz_desc: "Завод в Беларуси, производитель сельскохозяйственной техники.Минский тракторный завод был основан 29 мая 1946 года. Мощности завода рассчитаны на выпуск 71 тысячи тракторов различных серий"
 BLR_BellegProm: "Беллегпром"
 BLR_BellegProm_desc: "Белорусский государственный концерн по производству и продаже товаров легкой промышленности (Bellegprom Concern) был создан в 1992 году на базе Министерства легкой промышленности Белорусской ССР и подчиняется Совету Министров Республики Беларусь.В концерне \"Беллегпром\" входят 96 организаций, 76 из которых являются промышленными. Промышленные предприятия делятся на промышленность: текстильная, швейная, вязальная, кожаная и обувная промышленность. В него также входят 16 других организаций и торговых предприятий.Основная цель предприятий концерна - максимизировать удовлетворенность потребителей высококачественной и модной продукцией в широком диапазоне и по доступным ценам, а также повысить конкурентоспособность отрасли и ее имидж."
 BLR_BelarusBank: "Беларусбанк"
 BLR_BelarusBank_desc: "Сберегательный банк «Беларусьбанк» - крупнейший банк Беларуси, занимающий лидирующие позиции в белорусской банковской системе по объему капитала, активов, кредитов, депозитов"
 BLR_BelAgroPromBank: "Белагропромбанк"
 BLR_BelAgroPromBank_desc: "Белагропромбанк - белорусский государственный акционерный коммерческий банк."
 BLR_BelInvestBank: "Белинвестбанк"
 BLR_BelInvestBank_desc: "Белорусский банк развития и реконструкции Белинвестбанк является одним из крупнейших универсальных банков республики, предоставляющим полный комплекс услуг юридическим и физическим лицам различных форм собственности и деятельности. Обеспечивая устойчивую деятельность, Банк сохраняет свое присутствие среди крупнейших банков республики"
 BLR_NoChelnoks: "Больше никакой Челночной торговли"
 BLR_NoChelnoks_desc: "Мы готовы полностью искоренить реликвию 90-х - шаттлы, людям не нужны эти маленькие \"предприниматели\""
 BLR_BelRepublicBank: "Банк развития Республики Беларусь"
 BLR_BelRepublicBank_desc: "АО «Банк развития Республики Беларусь» является специализированным финансовым учреждением, созданным в форме юридического лица. Он был создан Советом министров и Национальным банком Республики Беларусь. Создание Банка развития осуществлялось в сотрудничестве с международными финансовыми организациями, в частности с Международным валютным фондом и Всемирным банком."
 BLR_borimed: "Боримед"
 BLR_borimed_desc: "Борисовский завод медицинских препаратов Открытое акционерное общество является производителем и экспортером широкого спектра лекарственных средств в Беларуси. Он имеет четыре основных производственных объекта, а также вспомогательные услуги (печатно-картонная цеха, механическая ремонтная мастерская, энергоплоск, контрольно-измерительные приборы и площадка автоматизации, ремонтно-строительная площадка, транспортная мастерская с автопарком и т.д.), расположенная в городе Борисов Минской области"
 BLR_GomSelMash: "ГомСельмаш"
 BLR_GomSelMash_desc: "Открытое акционерное общество «Гомсельмаш» - белорусский производитель сельскохозяйственной техники, базирующийся в Гомеле. Он является частью холдинга «ГОМСЕЛМАШ» и является его управляющей компанией."
 BLR_BelNeft: "Белоруснефть"
 BLR_BelNeft_desc: "\"Белоруснефть\" - компания, работающая в Беларуси, которая вместе со своей материнской компанией \"Белнефтехим\", отвечает за крупнейшую в стране сеть станций технического обслуживания. По собственному заявлению \"Белоруснефти\", ее распределительная сеть включает более 500 станций, или 65% всех станций технического обслуживания в Беларуси. Штаб-квартира компании находится в Гомеле"
 BLR_BelAvtoDor: "Белавтодор"
 BLR_BelAvtoDor_desc: "Белавтодорский холдинг - группа строительных и промышленных предприятий в Беларуси, занимающая лидирующие позиции на рынке комплексного строительства, реконструкции и капитального ремонта объектов транспортной инфраструктуры. Она также производит дорожно-строительную технику, дорожные строительные материалы, железобетон, сталь и другие изделия для строительства дорог и мостов."
 BLR_BMZ: "Белорусский металлургический комбинат"
 BLR_BMZ_desc: "ОАО «Белорусский металлургический комбинат» – белорусская компания, работающая в сталелитейной промышленности, базирующаяся в Жлобине, Гомельский регион. Основным сырьем предприятия является лом. Продукция компании варьируется от конъистских квадратных стальных заготовок, горячекатаного круглого и квадратного стального прута, арматуры, горячекатаной бесшовной трубы, высокоуглеродистого проволочного стержня, шинного стального шнура, проволоки из бисера, проволоки шланга, проволоки общего назначения, до стального волокна"
 BLR_BelKalii: "Беларуськалий"
 BLR_BelKalii_desc: "\"БеларусьКалий\" - одна из крупнейших государственных компаний Беларуси. Является одним из крупнейших производителей калийных удобрений в мире"
 BLR_BelEnergo: "БелЭнерго"
 BLR_BelEnergo_desc: "\"Белэнерго\" – белорусский государственный энергетический концерн, который управляет хозяйственной деятельностью электроэнергетического комплекса Беларуси"
 BLR_BELAZ: "БЕЛАЗ"
 BLR_BELAZ_desc: "\"БелАЗ\" - белорусский автозавод и один из крупнейших в мире производителей крупных и особо крупных самосвалов, а также другого тяжелого транспортного оборудования для горнодобывающей и строительной отраслей."
 BLR_AES: "Отечественная атомная электростанция"
 BLR_AES_desc: "Мы готовы инвестировать в строительство собственной АЭС для обеспечения энергетической независимости."
 BLR_GrodnoAzot: "Гродно Азот"
 BLR_GrodnoAzot_desc: "Филиал ОАО \"Завод \"Химволокно\" ОАО \"Гродно Азот\" - крупный производитель полиамидных и полиэфирных нитей и волокон, а также полиамида-6 (ПА-6) и полимерных композиционных материалов на его основе. Каждый из основных видов продукции выпускается в широком ассортименте с различными физико-механическими свойствами и показателями качества, в зависимости от области применения"
 BLR_economy_hitech_park_idea: "Парк высоких технологий"
 BLR_economy_mzkt_idea: "МЗКТ"
 BLR_economy_mtz_idea: "Минский тракторный завод"
 BLR_cheln_trade: "Челночная торговля"
 BLR_cheln_trade_desc: "Крупнейшие компании еще не пришли в Беларусь, поэтому появились челноки, которые привозят необходимую высококачественную бытовую технику и ряд других товаров секонд-хенда и роскоши с высокой наценкой."
 BLR_Economic_full_idea: "Белорусская экономика"
 BLR_Economic_full_idea_desc: "Белорусская экономика является прямой наследницей СССР, сохраняя доминирование государственного сектора, но это может привести к серьезным проблемам, если руководство решит окончательно покончить с таким подходом к формированию экономики."
 BLR_Economic_full_full_idea: "Белорусская экономика"
 BLR_azot_fertilizers_idea: "Доступ к химическим удобрениям"
 BLR_azot_fertilizers_idea_desc: "Химические удобрения необходимы для получения хорошего урожая, особенно в сложных климатических условиях."
 BLR_azot_fertilizers_income: "Удобрения \"Гродно Азот\""
 BLR_azot_fertilizers_income_desc: "\"Гродно Азот\" успешно реализует свою продукцию во многие страны мира и приносит нашей стране хороший доход от продаж"
 BLR_economy_banks_idea: "Банковский сектор"
 BLR_minsk_metro: "Минский метрополитен"
 BLR_hi_tech_park: "Парк высоких технологий"
 BLR_post_luka_state: "Разрушенная экономика регионов"
 BLR_post_luka_state_descv: "Переход от старой постсоветской системы к современной рыночной оказал негативное влияние на регион. Многие предприятия закрылись, а люди остались без работы."
 BLR_Economy_category: "Правительство Беларуси"
 BLR_Economy_category_desc: "Беларусь обрела независимость сравнительно недавно, но страна уже прочно заняла свое место в мире. Ее вооруженные силы, экономика и спецслужбы являются законными наследниками Советского Союза и иногда даже сохраняют организационную структуру, которая была у нее еще во времена СССР. Беларуси предстоит путешествие в 21 век, сможет ли она адаптироваться к новым условиям?"
 BLR_fall_economic_fixes: "Устранить экономические последствия"
 BLR_integration_mechanic: "Интеграция Новых Территорий"
