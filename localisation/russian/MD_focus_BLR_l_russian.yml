 uniate_church: "Объединить Церковь"
 uniate_church_desc: "Союз православной и католической церквей — церковь на основе унии с приматом католической, но с сохранением части православных обрядов. Уже в 1439 году на соборе во Флоренции была заключена католическая уния с православными церквями, но она вскоре распалась. С конца XV века идея унии вновь была выдвинута Польшей и феодалами, поскольку значительная часть населения Польши и Литвы была православной, и с помощью церковной унии предполагалось постепенно ассимилировать украинцев и белорусов. Часть православных феодалов и высшего духовенства в XVI веке поддерживала идею унии, стремясь уравнять права с католиками. В 1595 году епископы Ипатий Потей Владимир-Волынский и Кирилл Терлецкий Луцкий обратились к папе с просьбой об унии. На Брестском соборе 6 епископов в 1596 году провозгласили Брестскую унию, несмотря на протест большинства духовенства, феодалов и граждан. Король поддержал унию, объявил православную церковь вне закона и передал её имущество греко-католической церкви. В начале XVII века был создан орден \"Базилиан\", действовавший в интересах унии совместно с иезуитами. Постепенно греко-католическая церковь сближалась с католической и в церемониальном отношении, менялись облачения, структура храмов, вводились католические обряды. Православные праздники также отменялись. Все эти изменения были зафиксированы на соборе в Замосте в 1720 году. На Закарпатье уния была провозглашена на Ужгородском соборе в 1649 году, но окончательно утвердилась только к концу XVIII века. Борьбу с унией за религиозные и национальные свободы в Украине и Беларуси в XVI—XVII веках возглавляли так называемые братства."
 BLR_shuskevich: "Снова на высоте"
 BLR_shuskevich_desc: "В 1994 году Станислав Шушкевич перестал быть главой государства по решению парламента. Ему было выражено вотум недоверия, и он был отстранён от должности. Очевидно, что наши первые попытки удержаться у власти были далеки от идеала. В результате выборов победил кровожадный и авторитарный режим Лукашенко. Народ был в отчаянии от принятого решения. Теперь мы снова у власти, и нам нельзя снова потерять доверие народа."
 BLR_clean_paper: "Со Свежего старта"
 BLR_clean_paper_desc: "Шушкевич впервые за многие годы обратился к народу. Это уже не девяностые. Мы снова у руля и готовы вести нашу страну в новую эпоху XXI века. Мы не повторим прежних ошибок и завоюем любовь народа."
 BLR_contitutional_reform: "Новая Конституционная реформа"
 BLR_contitutional_reform_desc: "За годы правления Лукашенко наша конституция была дополнена множеством авторитарных и ненужных поправок. Однако стоит признать, что не все нововведения были настолько плохими. Возможно, нам стоит создать нечто среднее между конституцией 1994 года и конституцией лукашенковской Беларуси — это было бы разумно."
 BLR_cooperate_opposition: "Умилостивить демократическую оппозицию"
 BLR_cooperate_opposition_desc: "Нам необходимо донести до демократической оппозиции, что мы — не администрация Лукашенко. Авторитарная Беларусь осталась в прошлом и останется там при нашем правлении."
 BLR_supreme_parliament: "Возродить Доминацию Парламента"
 BLR_supreme_parliament_desc: "Многие аналитики считали, что возвращение администрации Шушкевича приведёт к молчанию парламента. Но они забывают, что деградация нашего парламента стала возможной именно после нашей отставки, и мы намерены восстановить этот фундаментальный столп демократии!"
 BLR_lukashenko_court: "Суд над Лукашенко"
 BLR_lukashenko_court_desc: "Наш старик Лукашенко, очевидно, и представить не мог, что его будущее будет решать администрация Шушкевича. Однако и народ Беларуси не знал, что он сделает с ними после своей первой победы на выборах. Сейчас мы должны решить его судьбу. Вероятно, предпочтение стоит отдать не эмоциям, а разуму."
 BLR_sway_kgb: "Склонить КГБ на свою сторону"
 BLR_sway_kgb_desc: "КГБ — мощная структура, и их лояльность является важной частью стабильности нашей администрации. У них новое руководство, и они должны это принять."
 BLR_integrate_loyalists: "Интегрировать Лоялистов Лукашенко"
 BLR_integrate_loyalists_desc: "Александр Лукашенко оставил после себя огромное количество людей из своей администрации в нашей политической структуре. Нам нужно показать им, что при администрации Шушкевича они могут чувствовать себя уверенно, чтобы завоевать их доверие."
 BLR_absolute_synergy: "Абсолютная власть компромисса"
 BLR_absolute_synergy_desc: "Китайское правительство увеличивает инвестиции в нашу страну и готово строить новые заводы"
 BLR_way_to_neutrality: "Путь Нейтралитета"
 BLR_way_to_neutrality_desc: "Предыдущая администрация прославилась своей «нейтральностью» в политическом пространстве. Однако на деле с каждым годом мы всё больше отдалялись от Запада, попадая исключительно в сферу влияния восточных стран. Но так больше продолжаться не может. Многие нам не доверяют, и мы должны восстановить баланс сил."
 BLR_european_summit: "Саммит Европа–Беларусь"
 BLR_european_summit_desc: "Многие страны ближнего Запада с воодушевлением отреагировали на триумф Станислава Шушкевича в Беларуси. «Последняя диктатура Европы» приняла демократические ценности, и наш дружественный диалог с Европой будет подчеркнут на предстоящем саммите."
 BLR_big_brother_russia: "Российско-белорусские Переговоры"
 BLR_big_brother_russia_desc: "Глупо разрывать связи с нашим мощным соседом на Востоке. Беларусь под нашим руководством не стремится дискредитировать давние культурные связи. Хотя современная Россия уже не та, с которой Станислав Шушкевич подписывал Беловежские соглашения, мы верим, что сможем сохранить диалог и в будущем."
 BLR_neutrality_memorandum: "Меморандум о Нейтралитете"
 BLR_neutrality_memorandum_desc: "Учитывая недавние события, мы продемонстрировали всему миру, что Беларусь готова сотрудничать как с Востоком, так и с Западом. Однако Беларусь — нейтральная страна, а нейтралитет подразумевает нейтральную позицию в современных условиях холодной войны. Это, в свою очередь, означает, что Беларусь не должна вступать ни в один из ведущих политических союзов. Мы должны придерживаться этого принципа. Даже если кто-то на нас обидится."
 BLR_between_weast_east: "Между Востоком и Западом"
 BLR_between_weast_east_desc: "Наше нейтральное государство находится между Западом и Востоком — двумя мощными политическими силами, оказывающими влияние на нашу страну. Каждая из них хочет переманить нас на свою сторону, но им важно понять: если они хотят продолжать сотрудничество с нами, то должны уважать наш выбор в политическом пространстве."
 BLR_end_of_lukashenlonomics: "Конец Лукашенкономики"
 BLR_end_of_lukashenlonomics_desc: "Правление Лукашенко показало, что его реформы не привели к реальному экономическому росту в нашей стране. Нас ждут серьёзные перемены, но нам необходимо отказаться от нынешнего курса и разработать собственную программу развития."
 BLR_overhaul_medicine: "Реорганизация системы Здравоохранения"
 BLR_overhaul_medicine_desc: "Состояние медицины в нашей стране катастрофическое. Мы не можем оставить всё как есть. Мы должны создать не только благоприятные условия для частной медицины, но и обеспечить высокий уровень государственной системы здравоохранения."
 BLR_welfare_reform: "Реформа Социального Обеспечения"
 BLR_welfare_reform_desc: "Нам необходимо реформировать систему социальных фондов таким образом, чтобы снизить нагрузку на бюджет. Мы отдаём предпочтение оптимизации социальных выплат и рационализации социальных программ."
 BLR_privatise_shit: "Приватизация избыточной собственности"
 BLR_privatise_shit_desc: "Приватизация избыточной собственности необходима для снижения затрат на содержание неиспользуемого имущества, увеличения доходов бюджета за счёт его продажи и стимулирования экономической активности. Это достаточно распространённая практика в постсоветских странах."
 BLR_changes_to_market: "Реорганизовать механизмы регулирования рынка"
 BLR_changes_to_market_desc: "Хорошее антимонопольное ведомство, условия честной конкуренции — вот наш курс. Курс страны, в которой бизнес не боится за своё существование."
 BLR_the_third_way: "Третий путь для Беларуси"
 BLR_the_third_way_desc: "Крайности в экономических вопросах недопустимы. Разные идеологии ограничивают проведение необходимых реформ, но Беларусь под нашим руководством — это центристское государство, готовое перенимать все разумные предложения с обеих сторон."
 BLR_1994_avanged: "Месть за 1994!"
 BLR_1994_avanged_desc: "Месть за 1994 год — это триумф! Мы смогли доказать, что 1994 год был ошибкой, не позволившей в полной мере раскрыть наш потенциал. Несмотря на трудности, мы сумели реализовать все ключевые политические решения. Белорусское общество наконец-то ощутило вкус стабильности и процветающей экономики!"
