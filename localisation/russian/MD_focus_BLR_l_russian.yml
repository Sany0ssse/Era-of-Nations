 belarus_liberals.1.t: "Лукашистская оппозиция"
 belarus_liberals.1.desc: "Мы наконец-то вырвали власть из лап диктатора, но сторонники Лукашизма всё ещё остаются в стране, и им явно не по душе уход «Батьки». Сторонники Лукашизма отвергают европейскую интеграцию и хотят, чтобы Беларусь оставалась в руках консервативного авторитаризма."
 belarus_liberals.1.a: "Нам нужно разобраться с этим как можно скорее."
 belarus_liberals.2.t: "Конституционный референдум"
 belarus_liberals.2.desc: "Народ Беларуси сделал свой выбор в пользу Европейской интеграции. Однако после протестов Лукашистов мы всерьёз задумались — стоит ли нам отдалиться от России и принять антироссийский курс или сохранить дружественные отношения."
 belarus_liberals.2.a: "Я, мы, Европа"
 belarus_liberals.2.b: "Российско-белорусское Братство"
 belarus_liberals.3.t: "Предательство на границах"
 belarus_liberals.3.desc: "С началом нового режима в Минске, Беларусь всё больше отдаляется от Москвы, антироссийская политика, русофобия и влияние коллективного Запада вынудили нашего бывшего брата пойти на предательство. Мы не станем просто сидеть и ждать, пока НАТО вновь расширится к нашим границам — мы должны нанести упреждающий удар и ликвидировать угрозу на границе!"
 belarus_liberals.3.a: "Минск за 3 дня"
 belarus_liberals.3.b: "Подготовиться к Специальной Военной Операции"
 belarus_liberals.4.t: "Беларусь хочет обсудить вступление в ЕС"
 belarus_liberals.4.desc: "Беларусь хочет обсудить с нами, на каких условиях мы не будем возражать против её вступления в Европейский союз — это, конечно, очень любезно с их стороны. Мы неоднократно заявляли, что Европейский союз не представляет для нас угрозы, в отличие от НАТО, и поэтому любые подобные вопросы могут обсуждаться только в контексте нейтрального статуса Беларуси."
 belarus_liberals.4.a: "Нейтральный статус и гарантии ненападения"
 belarus_liberals.4.b: "Мы готовы лично защищать нейтральный статус Беларуси."
 belarus_liberals.4.c: "Демилитаризованная зона между нашими границами"
 BLR_new_economic_of_belarus_tt: "[BLR_price_liberalization_idea_loc][BLR_partial_privatisation_idea_loc][BLR_denomination_idea_loc][BLR_progressive_tax_loc]"
 BLR_price_liberalization_idea_loc1: "\n§g Либерализация цен §!: \n£GFX_western_outlook_campaign_cost_modifier_texticon Ежедневная поддержка Про-Западников §G +0.01 §! \n£political_power_texticon Ежедневный прирост политической власти: §R -5% §! \n£corruption_cost_factor_texticon Стоимость политической власти для изменения уровня коррупции: §R +5.00% §! \n §Y Ожидаемые расходы на социальное обеспечение\n §!: §R +2 §! \n£social_cost_multiplier_modifier_texticon §Y Стоимость социальных расходов§!Множитель: §G -7.00% §! \n£education_cost_multiplier_modifier_texticon §Y Стоимость обучения §! Множитель: §G -7.00% §! \n£GFX_bureaucracy_cost_multiplier_modifier_texticon §Y Цена на Бюрократию §! Множитель: §G -7.00% §!\n£economic_cycles_cost_factor_texticon §Y Стоимость модернизации казны в рамках экономических циклов §! Множитель: §R +50.00% §!\n"
 BLR_partial_privatisation_idea_loc1: "\n§g Частичная Приватизация §!: \n£GFX_western_outlook_campaign_cost_modifier_texticon Ежедневная поддержка Про-Западников §G +0.01 §!\n£political_power_texticon Ежедневный прирост политической власти: §R -3% §! \n£stability_texticon Стабильность: §G +15.00% §!\n£social_cost_multiplier_modifier_texticon §Y Ожидаемые расходы на социальное обеспечение §! Множитель: §G -15.00% §!\n£return_on_investment_modifier_texticon §Y Окупаемость инвестиций §! §G +10.00% §!\n Коэффициент роста производительности страны §G +7.00% §!\n"
 BLR_denomination_idea_loc1: "\n§g Стабильная валюта §!: \n£stability_texticon Стабильность: §G +7.00% §!\n£GFX_bureaucracy_cost_multiplier_modifier_texticon §Y Стоимость бюрократии §! Множитель §G -12.00% §!\n£return_on_investment_modifier_texticon §Y Окупаемость инвестиций §! §G +5.00% §!\n£corruption_cost_factor_texticon Стоимость политической власти для изменения уровня коррупции: §G -15.00% §!\n"
 BLR_progressive_tax_loc1: "\n§g ПРОГРЕССИВНЫЙ НАЛОГ §!:\n£GFX_bureaucracy_cost_multiplier_modifier_texticon §Y Стоимость бюрократии §! Множитель §R +7.00% §!\n£population_tax_income_multiplier_modifier_texticon §Y Налоговые поступления от населения§!Множитель: §G +25.00% §!\n£corporate_tax_income_multiplier_modifier_texticon §Y Налоговые поступления от корпораций §! Множитель: §G +10.00% §!\nКоэффициент роста производительности в стране §G+5.00% §!\n"
 BLR_Pazniak: "Правление Позняка"
 BLR_Pazniak_desc: "Прозападные националистические силы захватили власть в стране. Куда они приведут Беларусь — к светлому будущему или к краху государства?"
 BLR_rofeign_legion: "Иностранный легион"
 BLR_rofeign_legion_desc: "Мы постараемся перенять опыт французов и создать свой иностранный легион"
 BLR_debur: "Дебюрократизация"
 BLR_debur_desc: "Мы сократим расходы на чиновников, уменьшим их количество, а высвободившиеся средства направим на благо народа"
 BLR_patriotism: "Патриотизм"
 BLR_patriotism_desc: "Пришло время повысить патриотическое воспитание в нашей стране"
 BLR_Belarusisation: "Белорусизация"
 BLR_Belarusisation_desc: "Вся литература, все названия должны быть на белорусском языке"
 BLR_Democratic_clean: "Чистки демократов"
 BLR_Democratic_clean_desc: "Мы не собираемся становиться слугами Запада. Пришло время очистить нашу страну от демократов"
 BLR_Communistst_clean: "Чистка коммунистов"
 BLR_Communistst_clean_desc: "Наследие СССР должно быть уничтожено. Пришло время прогнать этих приверженцев красной заразы"
 BLR_denied_rus_language: "Запретить Русский язык"
 BLR_denied_rus_language_desc: "Русский больше не будет вторым государственным языком. С нас хватит российской оккупации"
 BLR_Anti_corruption_law: "Антикоррупционное законодательство"
 BLR_Anti_corruption_law_desc: "Мы будем бороться с коррупцией во всех ее проявлениях"
 BLR_anti_immigration_policies: "Анти-иммиграционная политика"
 BLR_anti_immigration_policies_desc: "Введение более жёсткой анти-иммиграционной политики позволит сохранить Белорусскую идентичность живой и неприкосновенной."
 BLR_russofobia: "Анти-российская политика"
 BLR_russofobia_desc: "Пора разобраться с общим врагом — Россией. Пришло время обуздать её империалистические амбиции в отношении нас"
 BLR_decolectivisation: "Деколлективизация"
 BLR_decolectivisation_desc: "Пришло время избавиться от наследия СССР и помочь населению переселиться в города"
 BLR_litvins_past: "Прошлое Литвинов"
 BLR_litvins_past_desc: "Историю изменить невозможно, и мы это знаем. Мы, Литвины, гордые наследники Великого княжества Литовского"
 BLR_constitution_from_1994: "Конституция 1994"
 BLR_constitution_from_1994_desc: "Пришло время восстановить нормальную конституцию в нашей стране"
 BLR_We_not_energy_slave: "Мы не рабы Российских ресурсов"
 BLR_We_not_energy_slave_desc: "Раньше Россия предоставляла скидки только для поддержки своего марионеточного режима, этого достаточно. Мы готовы построить сильную экономику и без этих скидок"
 BLR_Influence_nationalists: "Влияние националистов"
 BLR_Influence_nationalists_desc: "Мы должны активно поддерживать националистические движения в соседних странах"
 BLR_Territorial_claims: "Территориальные претензии"
 BLR_Territorial_claims_desc: "Наша страна должна вернуться к своим истинным границам"
 BLR_sez: "Особые экономические зоны"
 BLR_sez_desc: "Мы намерены создать в одном из наших регионов особую экономическую зону для стимулирования экономического роста в ней."
 BLR_itshka: "IT Сектор"
 BLR_itshka_desc: "Тенденция развития ИТ-технологий продолжает расти, и мы намерены идти в ногу с этой международной тенденцией."
 BLR_freedom_spirit: "Дух Свободы"
 BLR_freedom_spirit_desc: "Свобода и независимость - это столпы новой Беларуси, больше никакого влияния со стороны крупных держав, только наша Родина является приоритетом."
 BLR_chanting_of_bpr: "Скандирования БНР"
 BLR_white_legion_battalion: "Батальон Белого легиона"
 BLR_white_legion_battalion_desc: "Первый батальон Белого легиона наконец-то сформирован. Истинные патриоты своей страны готовы бороться за ее свободу и силу"
 BLR_GDL: "Великое княжество Литовское"
 BLR_GDL_desc: "Пришло время вернуть великое государство Литвиновых. Наконец-то наш народ не будет находиться под гнетом сверхдержавы, у него будет возможность самому стать сверхдержавой"
 BLR_help_silesians: "Помочь Силезским сепаратистам"
 BLR_help_silesians_desc: "Разделяй и властвуй — главный принцип нашей политики по отношению к Польше. Когда начнётся активная фаза перехода поляков под наш контроль, силезцы могут облегчить наше завоевание этой страны."
 BLR_revansh_return: "Возродить Правый Реванш"
 BLR_revansh_return_desc: "Правый Реванш - националистическая организация 90-х годов, исповедовавшая антипольскую и антирусскую риторику, а также убежденная в необходимости создания военизированных организаций по образцу украинских"
 BLR_blackcat: "Оживить Черную кошку"
 BLR_blackcat_desc: "Черная кошка - крупная партизанская организация на территории Беларуси, которая на протяжении 40 лет боролась за ее независимость против советской власти. Их методы отлично помогут нам защититься от вторжения врагов"
 BLR_lith_again: "Назад в Жемайтию"
 BLR_lith_again_desc: "Пришло время завершить реконструкцию нашего великого государства. Небольшая и слабая Литва стоит у нас на пути — мы сокрушим её. Однако мы не можем просто так напасть на эту страну; мы должны создать необходимые условия и повод, чтобы наше вторжение не выглядело необоснованным."
 BLR_Taler_ruble: "Белорусский талер"
 BLR_Taler_ruble_desc: "Мы должны полностью избавиться от рубля, заменив его нашей новой валютой"
 BLR_National_science: "Научно-Экономический рост"
 BLR_National_science_desc: "Мы начнём развивать собственную науку и экономику как независимое государство."
 BLR_create_nationalsecurity: "Создание новых департаментов"
 BLR_create_nationalsecurity_desc: "Вместо наследия СССР в виде КГБ мы создадим две новые структуры - Службу национальной безопасности и Службу национальной разведки."
 BLR_Delete_KGB: "Реформа КГБ"
 BLR_Delete_KGB_desc: "КГБ должен быть упразднен и заменен новой структурой"
 BLR_Reform_Police: "Реформа полиции"
 BLR_Reform_Police_desc: "Советская милиция была пережитком прошлого, от которого мы хотим избавиться, мы реорганизуем милицию в национальную полицию по образцу Польши"
 BLR_attack_russian_bear: "Прикончить Русского медведя"
 BLR_attack_russian_bear_desc: "Наконец-то, наш главный враг будет уничтожен"
 BLR_zmagar_army: "Армейская реформа"
 BLR_zmagar_army_desc: "Наша армия нуждается в срочной реформе, пока мы были заняты общественно-политическими реформами в стране, наши вооруженные силы были серьезно ослаблены"
 BLR_Young_Front: "Молодой фронт"
 BLR_Young_Front_desc: "Молодой фронт - это международное молодежное движение Белорусской молодежи. Является молодежной оппозиционной организацией Беларуси"
 BLR_south_river_battalion: "Батальон Саут-Ривер"
 BLR_south_river_battalion_desc: "Батальон, собранный из жителей США из округа Саут-Ривер"
 BLR_territorial_reform: "Территориальная Реформа"
 BLR_territorial_reform_desc: "Вместо сегодняшних 6 областей и 110 округов Зенон Позняк и команда авторов программы предлагают разделить страну на 16 воеводств, плюс Минск отдельно. Воеводства, в свою очередь, будут разделены на 60 провинций и 270 старых городов."
 BLR_anti_lgbt: "Запрет на пропаганду порочных отношений"
 BLR_anti_lgbt_desc: "Мы принимаем закон о приоритете и защите семьи, брака (союза мужчины и женщины), материнства, о защите семьи от посягательств и вмешательства в семейные дела со стороны идеологии и организаций. Кроме того, предлагается принять закон \"Об охране человеческой природы\" и запретить пропаганду порочных отношений, направленных против естественной природы человека."
 BLR_latgale_or_war: "Латгалия или война"
 BLR_latgale_or_war_desc: "Латгалия когда-то была частью Великого княжества Литовского. Пришло время вернуть эти земли в свой состав, вряд ли Латвия сможет нам противостоять"
 BLR_legacy_kurland: "Наследие герцогства Курляндского"
 BLR_legacy_kurland_desc: "Герцогство Курляндское когда-то достигло своей цели в гонке колонизации. Флаг герцогства когда-то развевался над Триндадом и Тобаго и у берегов Гамбии. Настало время, нам, законным наследникам герцогства, добиваться их возвращения в нашу империю. Настало время поставить перед собой цели за рубежом и вернуть эти бывшие колониальные владения обратно в лоно империи."
 BLR_pro_poland_propoganda: "Про-белорусская пропаганда в Польше"
 BLR_pro_poland_propoganda_desc: "Мы должны усилить наше влияние в Польше с помощью пропаганды и других источников взаимодействия"
 BLR_Dismiss_soviet_officers: "Уволить про-советски настроенных офицеров"
 BLR_Dismiss_soviet_officers_desc: "Борьба с советским наследием должна вестись и в армии, нам не нужны генералы, которые симпатизируют этому кровавому режиму"
 BLR_open_border_with_pol: "Открытые границы"
 BLR_open_border_with_pol_desc: "Открытие границ поможет нашим народам почувствовать связь не только экономическую, но и физическую"
 BLR_training_for_pol: "Совместные военные учения"
 BLR_training_for_pol_desc: "Нашим армиям нужна боевая координация. Совместные военные учения прекрасно помогут в этом"
 BLR_Asseco_Poland: "Asseco Poland"
 BLR_Asseco_Poland_desc: "Мы выкупим эту компанию и сделаем ее собственностью нашего будущего государства Белорусов и поляков"
 BLR_ynia_Poland: "Вторая Люблинская Уния"
 BLR_ynia_Poland_desc: "Пришло время вспомнить, насколько позорной была Люблинская уния для Великого княжества Литовского. На этот раз все будет по-другому"
 BLR_Ukraine_way: "Дружба с Украиной"
 BLR_Ukraine_way_desc: "Несмотря на наши территориальные претензии, мы готовы вести диалог с Украиной против общих врагов, и возможно создать альянс, который поможет нашим государствам выжить в окружении противников"
 BLR_Join_GUAM_to_Ukraine: "Присоединиться к ГУАМУ"
 BLR_Join_GUAM_to_Ukraine_desc: "Одним из наших первых дружественных шагов по отношению к Украине будет вступление в ГУАМ. Организация, в которой Украина занимает одну из главных ролей"
 BLR_training_with_ukr: "Совместные военные учения"
 BLR_training_with_ukr_desc: "Мы готовы предложить Украинской армии провести совместные учения для отработки маневров и координации действий войск"
 BLR_military_coop_with_ukraine: "§G Военно-техническое сотрудничество §!"
 BLR_military_coop_with_ukraine_desc: "Мы готовы наладить военно-техническое сотрудничество с Украинским военно-промышленным комплексом"
 BLR_Intermarium: "Интермариум"
 BLR_Intermarium_desc: "Нам пора объединиться с Украиной в мощный альянс, чтобы вместе противостоять нашим врагам"
 BLR_Intermarium_poland: "Интермариум"
 BLR_Intermarium_poland_desc: "Нам пора объединиться с Польшей в мощный альянс, чтобы вместе противостоять нашим врагам"
 BLR_Ukraine_enemy: "Захватить Украинские земли"
 BLR_Ukraine_enemy_desc: "Исторически эти земли принадлежали Великому княжеству Литовскому, и теперь никакие ложные узы дружбы не должны помешать нам вернуть их нашему великому государству"
 BLR_Transnistria_enemy: "Решить проблему Приднестровья"
 BLR_Transnistria_enemy_desc: "Маленькое непризнанное государство — Приднестровье. Оно давно стало головной болью для Молдовы, но мы готовы помочь им решить эту проблему, конечно, забрав эти земли себе!"
 BLR_Sovereign_Internet: "Суверенный Интернет"
 BLR_Sovereign_Internet_desc: "Мы должны сделать наше интернет-пространство полностью независимым от других стран, чтобы они не могли влиять на наших граждан"
 BLR_national_state_idea: "Белорусское национальное государство"
 BLR_national_state_idea_desc: "После веков польской, российской, а затем советской оккупации, Беларусь, обретшая независимость и оказавшаяся в лапах пророссийского диктатора, смогла вырваться на свободу. Но, несмотря на это, нам предстоит большая работа, чтобы воплотить мечты миллионов белорусов о Национальном Белорусском Государстве — государстве, где не подавляются белорусская культура, язык и история, государстве, достойном своего места на международной арене."
 BLR_poznyak_constitution_1994: "Конституция из 1994"
 BLR_bpr_legacy: "Наследие БНР"
 BLR_de_sovetization: "Де-советизация"
 BLR_sez_idea: "Специальная Экономическая Зона"
 BLR_freedom_spirit_idea: "Дух Свободы"
 BLR_national_patriotism: "Белорусский Патриотизм"
 BLR_monolingual_state: "Моно-язычное государство"
 BLR_nationalisatuion_russian_enterprises_idea: "Национализация @SOVРоссийских предприятий"
 BLR_belarusisation_category: "Белорусизация"
 BLR_belarusisation_category_desc: "\n\n\n£GFX_decisions_category_belarusisation\n\n\n\n\n\nДолгое время Белорусский язык и культура подвергались угнетению со стороны иностранных захватчиков. Сначала поляки пытались полонизировать нас в составе Речи Посполитой, затем русские стремились к русификации в составе России, а после — коммунисты в составе СССР. И теперь, получив наконец полную независимость, мы должны не только сохранить наследие нашей культуры, но и возвысить её былую славу, вытеснив эхо ассимиляции захватчиков."
 BLR_language_problem: "Языковая проблема"
 BLR_rename_cities: "Переименование городов"
 BLR_cultural_propaganda: "Пропаганда Культуры"
 BLR_belarusisation_of_population: "Белорусизация населения"
 BLR_nationalisation_russian_enterprises: "Национализация @SOVРоссийских предприятий"
 BLR_nationalisation_russian_enterprises_desc: "За время российского влияния в Беларуси накопилось слишком много Российских компаний, предприятий и активов, которые угрожают нашему суверенитету перед лицом Российского империализма.\n §R ВНИМАНИЕ:§! если §Y @SOV[SOV.GetName] §! потеряет больше чем $ §R 50.00 §! млрд, то они могут §R объявить нам войну §!"
 belarus_poznyak.1.t: "Реформа КГБ"
 belarus_poznyak.1.desc: "КГБ — пророссийская структура, которая долгое время контролировала политику нашей страны. Пора уничтожить это порождение прошлого и создать национальную, суверенную Службу безопасности Беларуси, которая будет обеспечивать безопасность нашего государства."
 belarus_poznyak.1.a: "Упразднить эту мерзость"
 belarus_poznyak.2.t: "Вопрос государственного языка"
 belarus_poznyak.2.desc: "Долгое время Беларусь находилась под влиянием иностранных языков. Как в составе России, так и в составе польского государства наш язык подвергался угнетению и ассимиляции, и даже сегодня он умирает под давлением русского языка. Пришло время решить этот вопрос."
 belarus_poznyak.2.a: "Белорусский — единственный государственный язык"
 belarus_poznyak.2.b: "Полный запрет Русского языка"
 belarus_poznyak.3.t: "Беларусь национализировала наши Предприятия"
 belarus_poznyak.3.desc: "Беларусь национализировала наши предприятия. В рамках белорусизации новое правительство Беларуси национализировало предприятия наших компаний и наши активы в стране. От национализации пострадали крупные российские компании, такие как: Газпром, Лукойл, ВАЗ, Сбербанк, МТС и другие"
 belarus_poznyak.3.a: "СУКА!"
 belarus_poznyak.3.b: "Они заплатят за это!"
