 belarus_another.65.t: "Экономическое сотрудничество с Беларусью"
 belarus_another.65.d: "Белорусское правительство предлагает расширить экономическое сотрудничество, чтобы вывести торговлю между нашими странами на новый уровень, но действительно ли это нам нужно?"
 belarus_another.65.a: "Беларусь — хороший партнёр"
 belarus_another.65.b: "Беларусь? Где это?"
 belarus_another.66.t: "Наше предложение принято"
 belarus_another.66.d: "Наше предложение, отправленное их правительству, было встречено положительно и принято!"
 belarus_another.66.a: "Отлично!"
 belarus_another.67.t: "Наше предложение отклонено"
 belarus_another.67.d: "Их правительство отклонило наше предложение, похоже, оно их не интересует."
 belarus_another.67.a: "Жаль"
 belarus_another.68.t: "Закупка белорусского оружия"
 belarus_another.68.d: "Белорусские военные предприятия готовы продать нам часть своего оружия по довольно низким ценам, но действительно ли оно нам нужно?"
 belarus_another.68.a: "Согласны"
 belarus_another.68.b: "Ужасное оружие"
