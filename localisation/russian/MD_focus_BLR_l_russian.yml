 BLR_mission_to_Poland_desc: "Создание торгового представительства с Польшей - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Germany: "Торговая миссия в [GER.GetNamewithFlag]"
 BLR_mission_to_Germany_desc: "Создание торгового представительства с Германией - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_France: "Торговая миссия в [FRA.GetNamewithFlag]"
 BLR_mission_to_France_desc: "Создание торгового представительства с Францией - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Norway: "Торговая миссия в [NOR.GetNamewithFlag]"
 BLR_mission_to_Norway_desc: "Создание торгового представительства с Норвегией - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Sweden: "Торговая миссия в [SWE.GetNamewithFlag]"
 BLR_mission_to_Sweden_desc: "Создание торгового представительства со Швецией - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Russia: "Торговая миссия в [SOV.GetNamewithFlag]"
 BLR_mission_to_Russia_desc: "Создание торгового представительства с Россией - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Ukraine: "Торговая миссия в [UKR.GetNamewithFlag]"
 BLR_mission_to_Ukraine_desc: "Создание торгового представительства с Украиной - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Kazahstan: "Торговая миссия в [KAZ.GetNamewithFlag]"
 BLR_mission_to_Kazahstan_desc: "Создание торгового представительства с Казахстаном - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Czechia: "Торговая миссия в [CZE.GetNamewithFlag]"
 BLR_mission_to_Czechia_desc: "Создание торгового представительства с Чехией - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Netherland: "Торговая миссия в [HOL.GetNamewithFlag]"
 BLR_mission_to_Netherland_desc: "Создание торгового представительства с Нидерландами - это разумное деловое решение, направленное на благо нашей страны."
 BLR_mission_to_Zimbabwe: "Торговая миссия в [ZIM.GetNamewithFlag]"
 BLR_mission_to_Zimbabwe_desc: "Создание торгового представительства с Зимбабве - это разумное деловое решение, направленное на благо нашей страны."
 cancel_BLR_trade: "Отменить торговые контракты на поставку удобрений"
 BLR_pending_offer: "В настоящее время страна рассматривает возможность заключения контракта на поставку удобрений"
 Luka_reactors: "Лукашенко обещает построить ядерный реактор"
 BLR_oil_sov: "Энергетический контракт с Беларусью"
 belarus_another.6.t: "Культ Лукашенко"
 belarus_another.6.d: "Александр Лукашенко уже очень долгое время является бессменным Президентом Республики Беларусь. За время его правления вокруг него сформировался целый культ «батьки». Этот культ отличает его от других диктаторов на постсоветском пространстве, но также обязывает его взаимодействовать с народом особым образом. Поддержка Батьки — это показатель, отражающий уровень поддержки Александра Григорьевича Лукашенко среди всех слоёв населения. В зависимости от различных действий этот показатель будет снижаться или повышаться, предоставляя различные бонусы или штрафы."
 belarus_another.6.a: "Наш батька Лукашенко, мать-Беларуси"
 BLR_luka_prime: "Премьер-министр Союзного государства - Лукашенко"
