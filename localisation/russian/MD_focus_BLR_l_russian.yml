 lithuanian_paganism_idea_desc: "Балтийское неоязычество - это категория автохтонных религиозных течений, которые возродились у народов Прибалтики (в первую очередь у литовцев и латышей). Балтийская мифология в конечном счете восходит к протоиндоевропейской мифологии, в частности, к балтославянской ветви народных верований."
