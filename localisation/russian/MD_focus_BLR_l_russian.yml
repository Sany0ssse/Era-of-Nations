 BLR_mzkt_contract: "Контракт с \"МЗКТ\""
 BLR_mzkt_contract_desc: "Минский завод колесных тягачей, \"МЗКТ\" - предприятие, специализирующееся на производстве дорожных и внедорожных большегрузных автомобилей, прицепной техники, специальных колёсных шасси для установки оборудования для предприятий строительного, нефтегазового и машиностроительного комплексов. Государственное предприятие, находящееся в ведении Государственного военно-промышленного комитета Республики Беларусь"
 BLR_mzkt_contract_another: "Контракт с \"МЗКТ\""
 BLR_mzkt_another_desc: "Минский завод колесных тягачей, \"МЗКТ\" - предприятие, специализирующееся на производстве дорожных и внедорожных большегрузных автомобилей, прицепной техники, специальных колёсных шасси для установки оборудования для предприятий строительного, нефтегазового и машиностроительного комплексов. Государственное предприятие, находящееся в ведении Государственного военно-промышленного комитета Республики Беларусь"
 BLR_mzkt_contract_blr: "Контракт \"МЗКТ\" с [SOV.GetNamewithFlag]"
 BLR_mzkt_contract_blr_desc: "Минский завод колесных тягачей, \"МЗКТ\" - предприятие, специализирующееся на производстве дорожных и внедорожных большегрузных автомобилей, прицепной техники, специальных колёсных шасси для установки оборудования для предприятий строительного, нефтегазового и машиностроительного комплексов. Государственное предприятие, находящееся в ведении Государственного военно-промышленного комитета Республики Беларусь"
 BLR_mzkt_union_state: "[BLR.GetFlag]Минский завод колёсных тягачей"
 BLR_mzkt_union_state_desc: "Минский завод колесных тягачей, \"МЗКТ\" - предприятие, специализирующееся на выпуске дорожных и внедорожных большегрузных автомобилей, прицепной техники, специальных колесных шасси для установки оборудования для предприятий строительного, нефтегазового и машиностроительного комплексов. В настоящее время находится под юрисдикцией Союзного государства"
 BLR_140_zavod_union_state: "[BLR.GetFlag]140-й ремонтный завод"
 BLR_140_zavod_union_state_desc: "140-й ремонтный завод — это государственное предприятие военно-промышленного комплекса [SOV.GetFlag] Союзного государства, специализирующееся на ремонте и модернизации бронетехники и её двигателей."
 BLR_presidential_election_of_2001: "Политическая сфера"
 BLR_presidential_election_of_2001_desc: "Пришло время решить, кто будет руководить нашей страной в новом тысячелетии"
 BLR_union_become_one: "Союз станет единым"
 BLR_united_opposition: "Объединенная оппозиция"
 BLR_united_opposition_desc: "Либеральная оппозиция достигла своей первоначальной цели — отправить авторитарный порядок нашей страны на обочину истории. Но это ещё не конец. Это только начало. Антигосударственные элементы слишком прочно укоренились на нашей родине. Борьба продолжается. Благоразумие на нашей стороне!"
 BLR_eradicate_corruption: "Искоренить коррупцию"
 BLR_eradicate_corruption_desc: "Предыдущее авторитарное правительство сделало коррупцию частью системы нашей страны. Долгое время народ терпел это, но сегодня открывается возможность начать долгую борьбу с коррупцией"
 BLR_united_againt_totalitarism: "Едины против тоталитаризма"
 BLR_united_againt_totalitarism_desc: "Мы устали быть несчастными хранителями звания «Последняя диктатура Европы». Беларусь — демократическая страна с демократическими институтами власти. Мы будем вместе бороться с любыми проявлениями тоталитарных тенденций."
 BLR_dismantle_unloyal_administrations: "Расформировать нелояльные администрации"
 BLR_dismantle_unloyal_administrations_desc: "К сожалению, среди людей в нашей стране не все готовы принять путь прогресса и процветания. Они сделали свой выбор и они пожалеют об этом."
 BLR_free_political_prisoners: "Освободить политических заключенных"
 BLR_free_political_prisoners_desc: "Многие журналисты, протестующие и политики подверглись политическим репрессиям со стороны прежнего режима и оказались в тюрьме. Времена меняются, и теперь у нас достаточно политической власти, чтобы вернуть освободить их"
 BLR_bring_siloviks_to_justice: "Привлечь силовиков к ответственности"
 BLR_bring_siloviks_to_justice_desc: "Мы все видели, как преданные псы прошлого бесчеловечного режима терроризировали мирных протестующих на улицах наших городов. Это было несправедливо, и мы должны показать им их место."
 BLR_constitutional_referendum: "Конституционный референдум"
 BLR_constitutional_referendum_desc: "Мы должны дать нашему народу выбор. Выбор того, как Беларусь должна выражать себя в политическом пространстве. Однажды авторитарный режим сделал этот выбор за нас и это не принесло ничего хорошего. Но теперь у власти находятся демократические силы, и идея Европейской интеграции распространяется среди граждан. Наша администрация поддерживает это, но стоит определить, каким образом Беларусь может этого достичь, учитывая нашего крупного соседа"
 BLR_oko_za_oko: "Око за око"
 BLR_oko_za_oko_desc: "Народ решил — с Беларусью хватит! Восток спонсировал прежний белорусский авторитарный режим, который подавлял и унижал наших граждан. Если мы хотим сбросить оковы внешнего влияния, это должно быть сделано немедленно и решительно! Это будет нашей местью"
 BLR_destroy_eastern_influence: "Уничтожить Восточное влияние"
 BLR_destroy_eastern_influence_desc: "Пора положить конец восточным захватчикам, которые продолжают вмешиваться во внутренние дела нашей страны. Беларусь это независимое государство, стремящиеся к европейской интеграции! Восточное влияние мешает достижению этой цели."
 BLR_democratise_siloviks: "Демократизировать силовиков"
 BLR_democratise_siloviks_desc: "Ранее силовики были лояльны Белорусской диктатуре. Теперь они будут служить нашей демократической Беларуси."
 BLR_strong_president: "Сильный президент"
 BLR_strong_president_desc: "Нам нужно создать образ сильного, свободолюбивого лидера. Возможно, кто-то обвинит нас в симпатиях к авторитаризму, но стоит понимать — это делается ради безопасности демократии нации Республики Беларусь.. «Моя преданность — Республике, демократии!»"
 BLR_radical_economic_reforms: "Радикальные Экономические реформы"
 BLR_radical_economic_reforms_desc: "Чтобы стать частью Европейского мира, мы должны соответствовать лучшим экономическим системам Европейских стран. Пришло время для нашего экономического роста. Без серьёзных реформ здесь не обойтись."
 BLR_ditch_russia: "Отдалиться от России"
 BLR_ditch_russia_desc: "\"Прощай, немытая Россия\""
 BLR_european_dominance: "Европейское Господство"
 BLR_european_dominance_desc: "Мы можем быть уверены, что проевропейские настроения теперь преобладают в нашем обществе. Европа, вот мы и пришли!"
 BLR_optimise_bureaucracy: "Наладить Бюрократию"
 BLR_optimise_bureaucracy_desc: "Меньше бюрократии — меньше расходов, расходующих наш бюджет!"
 BLR_new_patroitism: "Новый патриотизм"
 BLR_new_patroitism_desc: "Либерально настроенные граждане ассоциируют патриотизм с прошлым авторитарным режимом, который его продвигал. Но могут ли жулики и воры любить свою родину? Важно продвигать настоящий патриотизм, основанный прежде всего на защите наших прав и демократии."
 BLR_belarusian_consensus: "Белорусский консенсус"
 BLR_belarusian_consensus_desc: "Мы желаем своей стране лучшего, но реальность такова, что злить Россию и стремиться бросаться в западные организации — самоубийственно. Мы выступаем за реформы, но реформы должны учитывать наше геополитическое положение. Поэтому важно не разрывать отношения с Россией и Российской диаспорой в Беларуси. Наш путь к Европейской интеграции, вероятно, будет достигнут через множество компромиссов."
 BLR_unite_the_belarus: "Объединить Беларусь"
 BLR_unite_the_belarus_desc: "Народ нашей страны разделён. Одни придерживаются пророссийских взглядов, другие более прозападных. Не секрет, что мы видим будущее Беларуси в Западном мире. Мы должны мягко объединить Беларусь вокруг этой идеи."
 BLR_depolitisize_siloviks: "Деполитизировать силовиков"
 BLR_depolitisize_siloviks_desc: "Силовые структуры раньше защищали прежний режим, но теперь мы должны быть уверенны, чтобы их главной задачей было поддержание закона и порядка. Кроме того, мы не допустим ограничения плюрализма мнений в нашей стране. Пророссийские граждане имеют право высказываться без страха оказаться за решёткой."
 BLR_parliamentary_dominance: "Господство Парламента"
 BLR_parliamentary_dominance_desc: "Сила нашей демократии в нашем парламенте, который переживает золотой век при либеральном управлении."
 BLR_a_call_to_cremlin: "Звонок в Кремль"
 BLR_a_call_to_cremlin_desc: "Мы хотим Европейской интеграции. Но мы также не хотим, чтобы с Беларусью произошло то, что произошло 24 февраля. Мы проведём переговоры с Россией о тех условиях, при которых она позволит нам полностью интегрироваться в Западные институты. Аналитики утверждают, что Беларусь заплатит за это высокую цену, но у нас нет другого выбора."
 BLR_moderate_approach_to_economy: "Умеренный Подход к Экономике"
 BLR_moderate_approach_to_economy_desc: "Никакого радикализма. Только взвешенные и осторожные экономические реформы, чтобы не ввести нашу страну в кризис."
 BLR_slow_integration: "Медленная Интеграция"
 BLR_slow_integration_desc: "Мы пошли на компромиссы, которые открывают нам путь к медленной, но уверенной интеграции с Западом. Мы многим пожертвовали и должны показать, что это было не напрасно."
 BLR_red_white_red: "Белый Красный Белый"
 BLR_red_white_red_desc: "Белo-краснo-белый флаг — символ свободной, сильной и демократической Беларуси. За время нашего правления мы смогли доказать, что достойны этого флага!"
 BLR_lukashists_opposition: "Лукашистская оппозиция"
 BLR_administration_purge: "Чистка Администрации"
 BLR_strong_president_idea: "Сильный Президент"
 BLR_new_economic_of_belarus: "Новая Экономика Беларуси"
 BLR_new_economic_of_belarus_desc: "Наша экономика недостаточно эффективна, нам нужны радикальные реформы для построения стабильной экономики, как в Европе. Первый шаг к европейской интеграции — это экономические реформы в Европейском стиле."
