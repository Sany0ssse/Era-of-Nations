 belarus_economic.1.t: "Крах экономической системы"
 belarus_economic.1.d: "Старая советская система рухнула! В Беларуси проходит приватизация, закрываются предприятия, и, похоже, Беларусь ждет то же, что пережила Россия в 90-е годы."
 belarus_economic.1.a: "Боже, спаси НАС"
 BLR_Special_service: "Внутренняя защита Беларуси"
 BLR_Special_service_desc: "Беларусь должна быть защищена любой ценой, сильными разведывательными службами является сильная Беларусь."
 BLR_special_services_kgb: "КГБ РБ"
 BLR_special_services_kgb_desc: "Комитет государственной безопасности Республики Беларусь (КГБ РБ) является национальным разведывательным органом и сотрудниками тайной полиции Беларуси."
 BLR_special_services_const: "Конституционный порядок и борьба с терроризмом"
 BLR_special_services_const_desc: "Это подразделение активно занимается борьбой с терроризмом внутри нашей страны и защищает конституционный строй Беларуси, потому что эти две вещи вполне могут быть взаимосвязаны."
 BLR_special_services_contr: "Контрразведывательная деятельность"
 BLR_special_services_contr_desc: "Нам нужна сильная контрразведка, поэтому мы будем укреплять это подразделение КГБ."
 BLR_special_services_safety: "Экономическая безопасность и противодействие коррупции"
 BLR_special_services_safety_desc: "Экономическая безопасность и борьба с коррупцией являются нашим вторым приоритетом после конституционной защиты."
 BLR_special_services_alpha: "Группа \"Альфа\""
 BLR_special_services_alpha_desc: "Белорусская альфа-группа является специальным подразделением Комитета государственной безопасности Республики Беларусь, которому поручено проводить контртеррористические операции на всей территории Беларуси, когда регулярные белорусские правоохранительные подразделения не оснащены для выполнения этой задачи. Он также оказывает помощь правоохранительным подразделениям в проведении операций по борьбе с преступностью"
 BLR_special_services_gru: "ГРУ"
 BLR_special_services_gru_desc: "Главное разведывательное управление Генерального штаба Вооруженных Сил Республики Беларусь - это специальная служба, агентство внешней разведки Министерства обороны Беларуси, центральный орган управления военной разведкой в Вооруженных Силах Республики Беларусь. Доклады начальнику Генерального штаба и министру обороны. Департамент занимается разведкой в интересах белорусской армии."
 BLR_special_services_mvd: "Министерство внутренних дел"
 BLR_special_services_mvd_desc: "Министерство внутренних дел Беларуси, сокращенно М.У. на белорусском языке и МВД на русском языке, является органом белорусского правительства, которому поручены внутренние дела Беларуси"
 BLR_special_services_k: "Отдел по раскрытию преступлений в сфере высоких технологий"
 BLR_special_services_k_desc: "Развитие технологий привело к росту преступлений на этой основе, и мы намерены противодействовать этому виду преступлений."
 BLR_special_services_economic: "Борьба с организованной преступностью и коррупцией"
 BLR_special_services_economic_desc: "Коррупция и преступность неразрывно связаны, поэтому мы будем укреплять борьбу с ними так же неразрывно."
 BLR_special_services_inner_troops: "Внутренние войска"
 BLR_special_services_inner_troops_desc: "Внутренние войска МВД Беларуси - военизированные правоохранительные силы в Республике Беларусь при национальном УМВД"
 BLR_special_services_inner_sobr: "СОБР"
 BLR_special_services_inner_sobr_desc: "Специальная группа быстрого реагирования, сокращенно \"СОБР\" или \"SAChR\", является специальным подразделением полиции в Белорусском управлении внутренних дел."
 BLR_special_services_inner_omon: "ОМОН"
 BLR_special_services_inner_omon_desc: "\"ОМОН\" - это \"ОМОН\" при Министерстве внутренних дел Республики Беларусь (MUS), специализирующийся на боевых действиях и патрулировании в городских районах, контрреволюционной, тайной операции, борьбе с толпой и борьбе с беспорядками, когда люди или заключенные, участвующие в беспорядках, незаконной демонстрации или незаконном протесте, ситуации с применением правоохранительных органов высокого риска, \"HUMINT\" и внутренней безопасности."
 BLR_special_services_inner_almaz: "АЛМАЗ"
 BLR_special_services_inner_almaz_desc: "Специальное антитеррористическое подразделение «Алмаз» - это тактическое подразделение МВД Республики Беларусь (MUS), которое специализировалось на борьбе с терроризмом и спасательными кризисными ситуациями, быстром рейде для захвата или уничтожения важных целей, борьбе за беспорядками в местах содержания под стражей и защите VIP."
 BLR_gru_open: "§G Открыть §! §Y ГРУ §!"
 BLR_gru_close: "§G Закрыть §! §Y ГРУ §!"
 BLR_army: "Вооруженные силы Беларуси"
 BLR_army_desc: "Сильная армия является ключом к существованию любого государства, поэтому мы будем активно продолжать совершенствовать наши вооруженные силы, несмотря на все вызовы XXI века."
 BLR_army_ground: "Сухопутные войска"
 BLR_army_ground_desc: "Белорусские Сухопутные войска, также называемые белорусской армией, являются сухопутной военной службой Вооруженных сил Беларуси"
 BLR_territorial_defence: "Территориальная оборона"
 BLR_territorial_defence_desc: "Начало войны вынуждает нас привести территориальную оборону в боевую готовность."
 BLR_army_sso: "Силы специальных операций"
 BLR_army_sso_desc: "Силы специальных операций Вооружённых Сил Республики Беларусь — высокомобильный род войск Вооружённых Сил Республики Беларусь, являются правопреемниками Воздушно-десантных войск СССР и войск специального назначения ГРУ СССР в Республике Беларусь. Основные задачи: контрдиверсионная деятельность, разведка, борьба с незаконными вооружёнными формированиями, выполнение различных задач специальными методами в целях прекращения вооружённого конфликта против Республики Беларусь. Выступают одним из основных элементов стратегического сдерживания."
 BLR_army_transport: "Транспортные войска"
 BLR_army_transport_desc: "Белорусские транспортные войска (далее — Белорусские транспортные войска) — род войск Вооружённых Сил Республики Беларусь. Они отвечают за перемещение личного состава и материальных средств автомобильным, железнодорожным и воздушным транспортом и предназначены для выполнения задач транспортного обеспечения воинских формирований других родов войск по всей территории страны."
 BLR_peleng: "Пеленг"
 BLR_peleng_desc: "АО «Пеленг» – белорусская компания по разработке и производству оптоэлектронной продукции для военных и гражданских целей, ведущая компания в отрасли Республики Беларусь."
 BLR_army_morpehi: "Возрождение морской пехоты"
 BLR_army_morpehi_desc: "Еще в СССР были военно-морские силы, в которых служили наши солдаты, теперь мы готовы учесть опыт этого вида вооруженных сил и возродить его в составе наших вооруженных сил."
 BLR_army_navy: "Наш Флот"
 BLR_army_navy_desc: "У Беларуси никогда не было собственного флота, но теперь, возможно, пришло время, когда знамя Белорусского флота начнет появляться в различных морях."
 BLR_army_vvs_pvo: "Военно-воздушные силы и противовоздушная оборона"
 BLR_army_vvs_pvo_desc: "Военно-воздушные силы и ВО Силы ПВО - это подразделение Вооруженных Сил Беларуси, которому поручено вести и противодействовать воздушной войне. Он был сформирован путем слияния отдельных авиационных и противовоздушных ветвей."
 BLR_army_engineer: "Инженерные войска"
 BLR_army_engineer_desc: "Ни одна армия не может обойтись без сильных инженерных подразделений, и мы не намерены нарушать эту традицию."
 BLR_army_radiowarfare: "Радиотехнические войска"
 BLR_army_radiowarfare_desc: "Радиотехнологическая составляющая любой армии не должна быть на последнем месте с точки зрения финансирования, и мы намерены соблюдать это правило."
 BLR_borderdefence: "Пограничная служба"
 BLR_borderdefence_desc: "Государственный пограничный комитет Республики Беларусь, ГПК, он осуществляет распоряжения и политику комитета. Первоочередные задачи Госпогранкомитет включают: пограничную политику и усиление безопасности границ."
 BLR_army_peace: "Миротворческий батальон"
 BLR_army_peace_desc: "Мы создадим специальное подразделение для участия в миротворческих миссиях"
 BLR_558_zavod: "558 Авиаремонтный завод"
 BLR_558_zavod_desc: "558-й авиационный ремонтный завод - одно из крупнейших в СНГ предприятий по ремонту и модернизации современной боевой авиационной техники, стоящей на вооружении Военно-воздушных сил не только постсоветских стран, но и многих зарубежных государств. Это важнейшее авиаремонтное производство в Беларуси. Находится в городе Барановичи"
 BLR_minoitor: "Минотор-Сервис"
 BLR_minoitor_desc: "Минотор-Сервис\" - белорусское предприятие, расположенное в Минске и занимающееся разработкой, производством, модернизацией, ремонтом и обслуживанием боевой гусеничной техники, а также поставками запасных частей к ней. Это одно из ведущих предприятий оборонно-промышленного комплекса страны"
 BLR_belspecveshtech: "Белспецвнештехника"
 BLR_belspecveshtech_desc: "\"Белспецвнештехника\" — белорусское государственное внешнеторговое унитарное предприятие, основанное в 1995 году. Специализируется на торговле и производстве оружия и продукции двойного назначения. Оно входит в состав Государственного военно-промышленного комитета и считается ведущим предприятием страны в области экспорта вооружений"
 BLR_140_zavod: "140 Ремонтный завод"
 BLR_140_zavod_desc: "140—й ремонтный завод - государственное предприятие военно-промышленного комплекса Беларуси, специализирующееся на ремонте и модернизации бронетанковой техники и ее двигателей"
