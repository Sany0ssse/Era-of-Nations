 belarus_monarch.1.t: "Конфликт идентичности"
 belarus_monarch.1.d: "Теперь нам нужно решить, в чем суть нашей идентичности. Будем ли мы стремиться к литовскому прошлому и адаптировать литовский язык к нашему населению или будем опираться на белорусское наследие?"
 belarus_monarch.1.a: "Мы - истинные литовцы!"
 belarus_monarch.1.b: "Мы должны оставаться белорусами."
 belarus_monarch.2.t: "Религиозная дилемма"
 belarus_monarch.2.d: "Совет по делам религий был созван при нашем правительстве, чтобы решить, что делать с нашей государственной религиозной политикой. Нам пора отказаться от Московской церкви и начать реформирование нашей религиозной жизни."
 belarus_monarch.2.a: "Униатская церковь"
 belarus_monarch.2.b: "Ромува - это правильный путь!"
 belarus_monarch.3.t: "Собрание в период регентства"
 belarus_monarch.3.d: "Сегодня в Минске собрался сейм, чтобы избрать нового монарха Беларуси. На повестке дня два кандидата. Первый - наследник династии Габсбургов Фердинанд Звонимир I. Второй - представитель династии Урах, наследник литовского престола Иниго. Кого мы выберем на пост великого княжества?"
 belarus_monarch.3.a: "Габсбрурги будут править!"
 belarus_monarch.3.b: "Династия Урахов - самая близкая к нам!"
 belarus_monarch.5.t: "Восстание белорусских националистов!"
 belarus_monarch.5.d: "Белорусские националисты устроили беспорядки в нашем регионе! Похоже, их правительство использовало это как предлог для начала военной операции против нас!"
 belarus_monarch.5.a: "Они пожалеют об этом."
 belarus_monarch.6.t: "Восстание черниговских казаков"
 belarus_monarch.6.d: "Так называемые черниговские казаки, спонсируемые белорусским правительством, подняли восстание на нашей территории, видимо, это был повод вторгнуться на наши земли и начать с нами войну!"
 belarus_monarch.6.a: "Они пожалеют об этом."
 belarus_monarch.7.t: "Белорусское сопротивление"
 belarus_monarch.7.d: "На нашей территории начало действовать так называемое белорусское сопротивление, они активно ведут партизанские действия и саботируют все возможное в регионе."
 belarus_monarch.7.a: "Они пожалеют об этом."
 belarus_monarch.8.t: "Черниговские казаки"
 belarus_monarch.8.d: "На нашей территории начали действовать так называемые черниговские казаки, они перешли к активной партизанской деятельности и саботируют все, что только возможно в регионе."
 belarus_monarch.8.a: "Они пожалеют об этом."
 belarus_monarch.9.t: "Восстание белорусских националистов!"
 belarus_monarch.9.d: "Белорусские националисты устроили беспорядки в нашем регионе! Похоже, их правительство использовало это как предлог для начала военной операции против нас!"
 belarus_monarch.9.a: "Они пожалеют об этом."
