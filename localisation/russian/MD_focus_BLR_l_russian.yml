 BLR_vkl_guard: "Рутенская Гвардия Великого Князя"
 BLR_vkl_guard_desc: "Королевская гвардия нашего Великого князя состоит из самых преданных русинов, которые посвящают себя защите Великого княжества Литовского."
 BLR_vkl_guard_two: "Рутенская Гвардия Великого Князя"
 BLR_vkl_guard_two_desc: "Королевская гвардия нашего Великого князя состоит из самых преданных русинов, которые посвящают себя защите Великого княжества Литовского."
 BLR_young_goi_kurlyandia: "Наследие Курляндии"
 BLR_young_goi_kurlyandia_desc: "Мы должны восстановить нашу власть над Курляндией и территорией Латвии во всей ее полноте."
