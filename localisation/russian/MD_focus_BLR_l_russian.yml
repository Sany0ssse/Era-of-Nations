 BLR_young_goi_start: "Молодой фронт"
 BLR_young_goi_start_desc: "\"Молодой фронт\" - молодежное оппозиционное движение в Беларуси, тесно связанное с правой ветвью партии БНФ и Монархической лигой Беларуси."
 BLR_young_goi_identity: "Корни нашей идентичности"
 BLR_young_goi_identity_desc: "Мы должны, наконец, решить, в чем суть нашего народа. Чтим ли мы в полной мере литовское прошлое или поддерживаем нашу собственную белорусскую идентичность?"
 BLR_young_goi_integration_fashiks: "Интегрировать радикалов"
 BLR_young_goi_integration_fashiks_desc: "Мы должны пригласить организации \"Белый легион\" и \"Реванш\" вступить в наши ряды и поддержать наше новое государство."
 BLR_young_goi_lustration: "Люстрация коммунистов"
 BLR_young_goi_medicine: "Медицинская поддержка"
 BLR_young_goi_medicine_desc: "Мы должны обеспечить высококлассное медицинское обслуживание всех наших граждан и обеспечить здоровую и сильную белорусскую нацию!"
 BLR_young_goi_new_organs: "Новая правительственная структура"
 BLR_young_goi_new_organs_desc: "Мы должны реформировать наше правительство и сделать его более похожим на западные державы, а также подготовить систему для будущего монарха."
 BLR_young_goi_academy: "Военная Академия в Вильно"
 BLR_young_goi_academy_desc: "Мы должны попрощаться с нашими советскими генералами и создать в Вильно новую военную академию, которая подготовит настоящих белорусских военачальников-патриотов."
 BLR_young_goi_magdeburg: "Магдебургская хартия прав"
 BLR_young_goi_magdeburg_desc: "Магдебургское право - это набор городских привилегий, впервые разработанный императором Священной Римской империи Оттоном I и основанный на фламандском праве, которое регулировало степень внутренней автономии городов и деревень, предоставляемой местным правителем."
 BLR_magdeburg_rights: "Магдебургская хартия прав"
 BLR_magdeburg_rights_desc: "Магдебургское право - это набор городских привилегий, впервые разработанный императором Священной Римской империи Оттоном I и основанный на фламандском праве, которое регулировало степень внутренней автономии городов и деревень, предоставляемой местным правителем."
 BLR_young_goi_religion: "Вернемся к нашей религии"
 BLR_young_goi_religion_desc: "Для нас пришло время избавиться от московской церкви и вернуться к той религии, которую мы считаем наиболее приемлемой для нашей новой страны."
 BLR_young_goi_new_monarch: "Выбор нового монарха"
 BLR_young_goi_new_monarch_desc: "Мы хорошо подготовили наше государство для нашего нового монарха, который будет править нашей страной на протяжении веков."
 BLR_young_goi_territorial_demands: "Территориальные требования"
 BLR_young_goi_territorial_demands_desc: "Нашему государству пора начать предъявлять претензии на все территории, которые по праву принадлежат нашей короне."
