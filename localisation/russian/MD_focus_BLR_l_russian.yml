 blr_union_with_russia_info: "[SOV.GetNameWithFlag] замарионетит вас\nИгрок будет перенесен в [SOV.GetNameWithFlag]"
 BLR_batka_krut_TT: "Мы §R Почистим §! §Yполитическую сферу §!, оставив лишь §G несколько лояльных нам партий §! и §G создадим настоящую патриотическую партию §! для §Y Лукашенко §!"
 belarus_politics.1.t: "Новая политическая реальность"
 belarus_politics.1.d: "Хотя победа над протестующими была грандиозной, до сих пор существует широкая сеть оппозиционных организаций и партий, которые только и ждут удобного момента, чтобы уничтожить нашу страну. Чтобы предотвратить это, нам нужно полностью очистить политическое поле от ненужных политиков и организаций, оставив только лояльные нам партии, а также, возможно, нам понадобится собственная политическая партия, чтобы контролировать политическую сферу. Или мы можем оставить всё как есть, но у врага всё равно останутся инструменты для внутреннего влияния на нас."
 belarus_politics.1.a: "Встряхни их!"
 belarus_politics.1.b: "Давай больше не будем злить людей."
 BLR_Communism_start: "Возвращение к коммунизму"
 BLR_single_party: "Однопартийное государство"
 BLR_single_party_desc: "Государство должно быть реформировано. Это необходимо, чтобы избавиться от людей, которые хотят нам зла и политической нестабильности. Особенно это касается тех, кто стоит во главе бригад \"Бадр\"."
 BLR_atheism: "Государственный атеизм"
 BLR_atheism_desc: "Двигаясь к коммунизму, где нет места религиозному сознанию, мы должны очистить умы наших граждан от религиозных предрассудков и суеверий."
 BLR_smersh: "СМЕРШ 2.0"
 BLR_smersh_desc: "«СМЕРШ» — сокращение от «Смерть шпионам!» — контрразведывательная организация, существовавшая во время Второй мировой войны. Эти структуры доказали свою эффективность в борьбе с вражеской разведкой, и мы обязаны восстановить их в качестве государственного органа."
 BLR_propaganda: "Пропаганда"
 BLR_propaganda_desc: "Пропаганда — эффективный способ воздействия на население с целью донесения нашей идеологии и подавления оппозиционных настроений"
 BLR_ban_opposition: "Запрет оппозиции"
 BLR_ban_opposition_desc: "Оппозиция сеет раздор среди населения и сдерживает наши усилия по построению коммунизма. Любая оппозиционная деятельность должна быть вне закона, а контрреволюционеры — депортированы или казнены."
 BLR_five_year_plan: "Пятилетний план"
 BLR_collectivism: "Коллективизм"
 BLR_collectivism_desc: "Коллективизация экономики уже хорошо сработала в прошлом веке, почему бы не вернуться к этой практике снова?"
 BLR_red_army: "Красная Армия"
 BLR_red_army_desc: "Красная Армия известна во всём мире. Одни уважают её, другие боятся. Чтобы сохранить память и укрепить нашу идеологию, мы должны восстановить Красную Армию."
 BLR_education: "Советская Система Образования"
 BLR_education_desc: "Советская система образования была ориентирована на доступность и качество обучения, сочетая это с привитием социалистических идеалов учащимся; пришло время вернуть эту систему."
 BLR_industrial_expansion: "Промышленная экспансия"
 BLR_industrial_expansion_desc: "Расширение строительного сектора позволит нам ускорить развитие экономики и производства быстрее и эффективнее."
 BLR_agriculture_expansion: "Расширение сельского хозяйства"
 BLR_agriculture_expansion_desc: "Расширение сельского хозяйства даст толчок нашей экономике и увеличит производство сельскохозяйственной продукции, чтобы обеспечить народ всем необходимым."
 BLR_people_militia_commi: "Народное ополчение"
 BLR_people_militia_commi_desc: "Народные ополчения — это военизированные бригады бойцов, не подпадающих под приоритетный призыв, состоящие в основном из добровольцев, решивших встать на защиту Отечества."
 BLR_comm_cyber_troops: "Радикальные кибервойска"
 BLR_comm_cyber_troops_desc: "В современном мире, в эпоху цифровых технологий, нам необходимо создать новое подразделение Красной Армии, связанное с киберпространством, чтобы защитить наши данные и усовершенствовать разведывательные сети."
 BLR_red_shield: "Красный щит"
 BLR_red_shield_desc: "Для защиты наших границ мы должны обзавестись самым устрашающим сдерживающим оружием — ядерными боеголовками. Установка нескольких ракетных комплексов и пересмотр нашей доктрины должны стать началом создания Ракетных войск стратегического назначения «Красный Щит»."
 BLR_trudarmia: "Трудармия"
 BLR_trudarmia_desc: "Трудармия — организация, подчинённая МВД СССР, существовавшая в период Второй мировой войны. Она состояла из заключённых, которые занимались работой в шахтах и на заводах, а также мобилизовывались в качестве инженерных войск."
 BLR_litbel_ultimatum: "Ультиматум Литве"
 BLR_litbel_ultimatum_desc: "У нас много общего с Литвой — пора объединиться с ней в одно государство. Мирным путём или нет, но мы добьёмся своей цели."
 BLR_litbel_integration: "Проект \"Лит-Бел\""
 BLR_litbel_integration_desc: "Литва — это страна, с которой нас связывают общая история и общая граница. Мы должны объединиться с ней в единое государство и укрепить наш статус на мировой арене."
 BLR_commi_politics: "Коммунистическая политика"
 BLR_commi_politics_desc: "Мы не должны отклоняться от курса и должны уверенно двигаться к коммунизму, даже если это создаёт определённые трудности."
 BLR_commi_politics1: "Политика Коммунизма"
 BLR_boc_protest_idea: "Протест Белорусской Православной Церкви"
 BLR_boc_protest_idea_desc: "Протесты Православной Церкви, вызванные политикой государственного атеизма, создают для нас определённые трудности. Мы надеемся, что они вскоре прекратятся."
 BLR_propaganda_idea: "Пропаганда"
 BLR_propaganda_idea_desc: "Пропаганда социалистических ценностей обеспечивает нам политическую стабильность и уверенность в том, что будущее поколение непременно построит коммунизм."
 BLR_five_year_plan_idea: "Пятилетний план"
 BLR_five_year_plan_idea_desc: "Пятилетку — за четыре года!"
 BLR_red_army_idea: "Красная Армия"
 BLR_red_army_idea_desc: "Красная Армия была создана в 1918 году и с тех пор являлась главной силой Советского Союза. Одни уважают её, другие боятся."
 BLR_red_army_idea2: "Красная Армия"
 BLR_red_army_idea2_desc: "Красная Армия была создана в 1918 году и с тех пор являлась главной силой Советского Союза. Одни уважают её, другие боятся."
 BLR_red_army_idea3: "Красная Армия"
 BLR_trudarmy_mobilize: "Трудармия была Мобилизована"
 BLR_trudarmy_mobilize_desc: "Трудовая армия мобилизована и готова трудиться на фронте во имя защиты Отечества."
 BLR_lit_workers: "Литовские работники"
 BLR_lit_workers_desc: "Принятие литовских рабочих повышает межнациональную терпимость и приближает нас к дружбе между литовским и белорусским народами."
 BLR_litbel_cp: "Литовско-Белорусская коммунистическая партия"
 BLR_litbel_cp_desc: "Объединение Литовской и Белорусской коммунистических партий позволит нам лучше централизовать власть в стране."
 BLR_litbel_passport: "Литовско-Белорусский пасспорт"
 BLR_litbel_passport_desc: "Новые паспорта устранят множество бюрократических проблем и укрепят единство страны."
 BLR_litbel_constitution: "Литовско-Белорусская конституция"
 BLR_litbel_constitution_desc: "Новая конституция решит проблемы с государственными законами, бюрократией, централизацией и государственным языком."
 BLR_lit_protests: "Вопросы интеграции"
 BLR_lit_protests_desc: "Литовцы выступают против объединения государства. В Литве проходят многочисленные митинги и акты саботажа."
 BLR_soviet_education: "Советская Система Образования"
 BLR_soviet_education_desc: "Советская система образования делает обучение более доступным и качественным."
 BLR_rublit: "Рублиты"
 BLR_rublit_desc: "Рублитас — единая литовско-белорусская валюта, созданная в результате объединения белорусского рубля и литовского лита."
 BLR_red_army_idea4: "Красная Армия"
 BLR_red_army_idea4_desc: "Красная Армия была создана в 1918 году и с тех пор являлась главной силой Советского Союза. Одни уважают её, другие боятся."
 belarus_CLTB.1.t: "Беларусь требует нашего присоединения"
 belarus_CLTB.1.d: "Коммунистическая партия Беларуси требует нашего присоединения для создания единого социалистического государства. И хотя объединение с нашим восточным соседом может укрепить наши позиции на мировой арене и создать новую силу в Европе, с которой придётся считаться, это также может стать угрозой нашему суверенитету — не говоря уже о национальных, культурных и идеологических различиях."
 belarus_CLTB.1.a: "Да, давайте объединяться!"
 belarus_CLTB.1.b: "НИКОГДА!!!"
 belarus_CLTB.2.t: "Литва отказывается"
 belarus_CLTB.2.d: "Литва отклонила наше требование об объединении, мотивируя это тем, что оно подорвёт суверенитет страны, а подобное объединение создаст ещё больше проблем как во внутренней, так и во внешней политике."
 belarus_CLTB.2.a: "Мы хотели решить это мирным путём."
 belarus_CLTB.3.t: "Литва соглашается"
 belarus_CLTB.3.d: "Правительство Литвы согласилось на создание единого государства с нами, осталось лишь решить огромное количество бюрократических вопросов и урегулировать недовольство среди литовского населения, которое явно не согласно с решением своего руководства."
 belarus_CLTB.3.a: "Да здравствует братство народов!"
 belarus_CLTB.4.t: "Беларусь и Литва объединяются в единое государство."
 belarus_CLTB.4.d: "Литва принимает предложение белорусских коммунистов о создании единого государства в рамках социалистической республики. Неясно, было ли это заранее спланированным государственным переворотом со стороны КГБ Беларуси или стороны действительно смогли прийти к соглашению, но одно очевидно — это существенно изменит баланс сил в Европе. Остаётся лишь вопрос: в чью пользу?"
 belarus_CLTB.4.a: "Ч-что?"
 belarus_CLTB.5.t: "Литовский народ сопротивляется нашему присоединению."
 belarus_CLTB.5.d: "Как и ожидалось, народ Литвы негативно отреагировал на наше присоединение. Протестующие активно выступают за независимость литовского государства и занимаются саботажем. Всё это оказывает серьёзное давление на нашу экономику — нам приходится увеличивать финансирование полиции и нести дополнительные расходы на бюрократию."
 belarus_CLTB.5.a: "Нам нужно закончить это как можно быстрее."
 belarus_CLTB.6.t: "Интеграция завершена"
 belarus_CLTB.6.d: "После многочисленных протестов, скоординированных действий и агрессивных митингов, которые были успешно подавлены при поддержке КГБ Беларуси, сепаратистские настроения начали утихать. Мы активно провели ряд реформ, направленных на комфортное сосуществование с литовцами: создали новую валюту, скорректировали конституцию и выдали гражданам новые паспорта. После большой работы мы наконец готовы объявить о создании единой Литовско-Белорусской Социалистической Республики."
 belarus_CLTB.6.a: "Наконец-то мы едины!"
 belarus_communism.1.t: "Протест Белорусской Православной Церкви"
 belarus_communism.1.d: "После провозглашения государственного атеизма и репрессий против Белорусской Православной Церкви верующие начали массово выходить на митинги в защиту храмов и сохранения религии. Кажется, это надолго."
 belarus_communism.1.a: "Они забудут об этом"
 BLR_litbel_integration_category_desc: "После присоединения территории Литвы к нашему государству возникло множество проблем, таких как: недовольство литовского населения, бюрократический кризис, разобщённость общества и прочее. Для того чтобы завершить проект интеграции и провозгласить создание Литовско-Белорусской Социалистической Республики, мы обязаны решить насущные проблемы, подавить недовольство на территории Литвы и в конечном итоге прийти к созданию сильного, союзного социалистического государства.\n\n\n\n\n\n\n\n£GFX_decision_litbel_integration \n\n\n\n\n\n\nПолная интеграция потребует снижения сопротивления и повышения подчинённости литовского населения, а также завершения всех важных реформ."
 BLR_litbel_integration_category: "Интеграция Литвы"
 BLR_lithaunian_workers: "Принять литовских рабочих"
 BLR_lithaunian_workers_desc: "Литовские рабочие подвергаются дискриминации на белорусских предприятиях. Нам необходимо повысить межнациональную терпимость и расширить трудовые возможности для литовских рабочих."
 BLR_unite_with_lcp: "Объединиться с Литовской компартией"
 BLR_unite_with_lcp_desc: "Объединение с Литовской коммунистической партией позволит нам сильнее централизовать власть и эффективнее работать над объединением государства."
 BLR_new_pasport: "Литовско-Белорусский паспорт "
 BLR_new_pasport_desc: "Граждане Литвы продолжают использовать литовские паспорта, что создаёт серьёзные бюрократические проблемы на территории Беларуси. Аналогично, белорусы сталкиваются с трудностями при предъявлении белорусских паспортов на недавно присоединённых территориях Литвы. Необходимо создать новые, единые паспорта, чтобы устранить эту проблему."
 BLR_new_constitution: "Литовско-Белорусская конституция"
 BLR_new_constitution_desc: "Различия между Белорусскими и литовскими законами и уставами вызвали проблемы после объединения. Нам необходимо разработать новую конституцию для единого государства, которая устроила бы как нас, так и Литовцев."
 BLR_unite_propaganda: "Пропаганда Единства"
 BLR_unite_propaganda_desc: "Мы должны продвигать идею единства с литовским народом, чтобы снизить уровень протестов и успокоить население литовских земель."
 BLR_dispersal_demonstrators: "Разгон демонстрантов"
 BLR_dispersal_demonstrators_desc: "Литовские демонстрации начинают приобретать радикальный характер — пора принять меры и направить силы охраны порядка или даже КГБ для их подавления."
 BLR_proclaim_litbel: "Провозгласить §R Литовско-Белорусскую Социалистическую Республику §!"
 BLR_proclaim_litbel_desc: "Мы завершили все этапы объединения государства, протесты подавлены, новые паспорта и рублит уже находятся в обращении среди граждан — а значит, мы готовы провозгласить создание Литовско-Белорусской Социалистической Республики!"
 litbel_decision_tt: "Все §Y шаги для интеграции §! должны быть выполнены"
 BLR_united_currency: "Единая валюта"
 BLR_united_currency_desc: "Белорусский рубль и литовский лит должны быть объединены для создания новой, единой валюты, которая будет использоваться по всей стране."
 BLR_army_reorganization: "Реорганизация армии"
 BLR_army_reorganization_desc: "Аннексия Литвы вызвала проблемы в командовании, офицерском составе и, в первую очередь, в организации наших вооружённых сил. Пришло время исправить это и полностью реорганизовать нашу армию."
 BLR_trudarmia_category: "Трудармия"
 BLR_trudarmia_category_desc: "\n\n£GFX_decision_trudarmia\n\n\n\n\nТрудовая армия — это отряд заключённых, контролируемый Министерством внутренних дел. Они выполняют различные виды работ: от труда на заводах и колхозах до добычи ресурсов в шахтах. В военное время могут быть призваны для участия на фронте в качестве инженерных войск."
 BLR_mobilize_trudarmy: "Мобилизовать Трудармию"
 BLR_demobilize_trudarmy: "Демобилизовать трудармия"
 BLR_factory_work: "Труд на заводах"
 BLR_kolhoz_work: "Труд в колхозе"
 BLR_steel_mining: "Отправить в стальные шахты"
 BLR_tungsten_mining: "Отправить в вольфрамовые шахты"
 BLR_aluminium_mining: "Отправить в стальные шахты"
 BLR_oil_mining: "Отправить на нефтяные месторождения"
 plc_unified_neutrality: "Польско-Литовско-Русинское содружество"
 BLR_litbel_communism: "Литовско-Белорусская Социалистическая Республика"
 BLR_rptj_start: "Республиканская и справедливая"
 BLR_rptj_start_desc: "Республиканская партия труда и справедливости — левая, социал-демократическая партия Беларуси. Смогли ли мы показать, что можем прийти к власти? Да. Но сумеем ли мы её удержать и привести страну к процветанию под руководством разумного социализма? Что ж, мы должны это доказать — и мы намерены это сделать."
 BLR_labour: "Труд, ответственность, справедливость"
 BLR_labour_desc: "Наш лозунг — «Труд, ответственность, справедливость». И это не пустые слова. Труд — работа — лучшая социальная защита, Справедливость — рынок труда без барьеров, Ответственность — безопасность старости. Эти принципы будут вести нашу Беларусь, пока мы у власти."
 BLR_ussr_legacy: "Наследие СССР"
 BLR_ussr_legacy_desc: "Советская Беларусь — часть нашей истории. И мы должны гордиться этой историей, ведь именно в советскую эпоху наша земля переживала расцвет. Возможно, нам стоит взять пример с прошлых подходов к развитию страны, которые уже доказали свою эффективность."
 BLR_union_with_russian_socialist_patriots: "Союз с российскими патриотами"
 BLR_union_with_russian_socialist_patriots_desc: "Разумеется, мы считаем русских нашими братьями. Мы также желаем им лучшего будущего, поэтому не будем скрывать нашу симпатию к отдельным социалистическим партиям этой огромной страны."
 BLR_ukrainian_socialists: "Сотрудничество с Украинскими Социалистами"
 BLR_ukrainian_socialists_desc: "Наши южные соседи — товарищи украинцы — также имеют здравомыслящие политические силы, которые заинтересованы в подлинном процветании простого народа своей страны."
 BLR_real_free_medicine: "Настоящее Бесплатное здравоохранение"
 BLR_real_free_medicine_desc: "Для членов нашей партии остаётся загадкой, как основа благосостояния может быть платной. Государство обязано обеспечивать бесплатное здравоохранение и поддерживать его на достойном уровне."
 BLR_destroy_the_national_bank: "Крестовый поход против Национального банка"
 BLR_destroy_the_national_bank_desc: "Эта капиталистическая структура давно ведёт свою грязную работу в Беларуси. Мы намерены распустить Национальный банк."
 BLR_peoples_redistribution: "Народное перераспределение"
 BLR_peoples_redistribution_desc: "Мы намерены перераспределять средства и деньги в нашей экономике."
 BLR_labour_as_a_best_gurantee: "Труд — лучшая социальная гарантия"
 BLR_labour_as_a_best_gurantee_desc: "Экономическая политика должна быть нацелена на полную занятость. Наша цель — чтобы каждый, кто имеет возможность трудиться, имел и возможность это делать. Гарантированный доход даёт людям большую свободу. Безработица — это огромная трата человеческих ресурсов и социальная неудача."
 BLR_state_property_domination: "Доминирование государственной собственности"
 BLR_state_property_domination_desc: "Что бы кто ни говорил, поддержка отечественной промышленности и продукции — исключительно патриотическая мера, способная привести нашу великую индустрию к золотому веку."
 BLR_national_patriotic_union: "Национально-патриотический союз Беларуси"
 BLR_national_patriotic_union_desc: "Когда-то российские социалисты объединились для создания единого союза, в котором продвигали свои ценности и идеи. Мы заимствуем этот опыт у них. Цель союза — патриотизм, государственность и социальная справедливость!"
 BLR_support_the_kgb: "Усилить КГБ"
 BLR_support_the_kgb_desc: "Укрепление Комитета безопасности Республики Беларусь важно для сохранения нашей территориальной целостности. Никто не посмеет напасть на нас, если мы сможем дать отпор."
 BLR_parliamentary_supervision: "Парламентский надзор"
 BLR_parliamentary_supervision_desc: "Да, мы хотим предстать перед международным сообществом как социал-демократическая партия, но всё же дополнительный надзор за делами в парламенте может помочь нам в проведении дальнейших реформ..."
 BLR_congress_of_left_patriots: "Съезд левых патриотов"
 BLR_congress_of_left_patriots_desc: "Сейчас у нас достаточно связей с левыми патриотами постсоветского пространства, чтобы собрать их всех и обсудить наши планы по сотрудничеству."
 BLR_social_justice_economy: "Экономика социальной справедливости"
 BLR_social_justice_economy_desc: "Экономика социальной справедливости — каждый, кто остаётся без работы, должен быть мотивирован с первого дня как можно быстрее найти новое место. В свою очередь, современный рынок труда — это рынок с достойными условиями труда и оплатой, рынок, способный адаптироваться к технологическим изменениям. И, конечно же, здоровье — важнейший элемент качества жизни."
 BLR_destroy_market_opposition: "Уничтожить рыночную оппозицию"
 BLR_destroy_market_opposition_desc: "«Хотите, чтобы десятки таких Саакашвили бегали по нашим площадям?»"
 BLR_peoples_patriotic_democracy: "Патриотическая демократия"
 BLR_peoples_patriotic_democracy_desc: "Многие западные деятели сомневаются, что Беларусь при нашем правлении полностью отошла от авторитаризма, но мы так не считаем. Мы внесли свой вклад в продвижение демократии в нашей стране. Патриотизм может сосуществовать с демократией — и мы это подтвердили."
 BLR_labourist_state: "Рабочая республика"
 BLR_labourist_state_desc: "Нам удалось создать по-настоящему справедливое патриотическое государство, в котором каждый может сказать, что труд и социализм принесли ему повышение качества жизни!"
 BLR_ussr_leagcy_idea: "Наследие СССР"
 BLR_real_free_medicine_idea: "Настоящее Бесплатное здравоохранение"
 BLR_national_patriotic_union_idea: "Национально-патриотический союз"
 BLR_national_bank_reform_idea: "Реформированный Национальный банк"
 BLR_parliamentary_supervision_idea: "Парламентский надзор"
 BLR_state_property_domination_idea: "Доминирование государственной собственности"
 BLR_social_justice_economy_idea: "Экономика социальной справедливости"
 BLR_democratic_patriotism_idea: "Демократический патриотизм"
 BLR_rplj_idea: "Лейбористская Беларусь"
 BLR_Union_of_peoples_states_idea: "Союз народных государств"
 BLR_Union_of_peoples_states_idea_desc: "Час пробил! Рабочие наших стран могут с гордостью заявить о создании полноценного тройного союза между собой! Слава нашим республикам!"
