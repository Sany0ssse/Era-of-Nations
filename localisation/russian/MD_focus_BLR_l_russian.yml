 BLR_soviet_system: "Национал-большевистская Беларусь"
 BLR_soviet_system_desc: "Национал-большевики захватили власть в стране и готовы начать первые экономические реформы. Одной из них станет возврат к советской экономической системе, учитывая неудачный опыт предыдущего правителя."
 BLR_nazbol_new_church: "Новая религия"
 BLR_nazbol_new_church_desc: "Пришло время создать новую религию, отвечающую интересам нашего государства!."
 BLR_military_nazbol: "Инвестиции в военную промышленность"
 BLR_military_nazbol_desc: "Наша военная промышленность до сих пор не восстановилась до уровня советских времен, мы должны это исправить"
 BLR_nazbol_propaganda: "Пропагандистская машина"
 BLR_nazbol_propaganda_desc: "Наша пропаганда должна быть красной и радикальной, поскольку наша пролетарская ненависть к Западу должна очистить умы россиян!"
 BLR_nazbol_narodnaya_chk: "Народная чрезвычайная комиссия"
 BLR_nazbol_narodnaya_chk_desc: "Мы должны создать специальную комиссию по чрезвычайным ситуациям и подготовить наших людей к любому сценарию."
 BLR_nazbol_anti_wse: "Подавить оппозицию"
 BLR_nazbol_anti_wse_desc: "Оппозиционеры - это крысы! И мы вышвырнем их из Беларуси с нашей истинно пролетарской ненавистью."
 BLR_nazbol_work_fronts: "Трудовой Фронт"
 BLR_nazbol_work_fronts_desc: "Труд, общество и Вооруженные силы - это единое целое! Труд - это фронт нашей священной войны, и мы будем хороши в ней."
 BLR_nazbol_cyber: "Кибер-война"
 BLR_nazbol_cyber_desc: "Киберпространство - это возможность для масс уничтожить западный капитализм, используя его собственные инструменты."
 BLR_nazbol_interbrigades: "Интербригады"
 BLR_nazbol_interbrigades_desc: "Мы националисты, но мы националисты международного масштаба, и мы приветствуем в наших рядах всех радикалов, которые хотят бороться за свою расу и класс."
 BLR_nazbol_inqusition: "Красная Ортодоксальная Инквизиция"
 BLR_nazbol_inqusition_desc: "Христианство, Сталин и коммунизм всегда были вместе. Сталин был единственным, святым и праведным русским царем-пролетарием, который восстановил православие в России и подарил нашему народу столько мучеников. И, как учит красная библия, Христос всегда был коммунистом!"
 BLR_nazbol_minsk: "Минск - Крепость революции"
 BLR_nazbol_minsk_desc: "Минск - символ нашей новой эры, город красного, белого и черного цветов. Авангард, центр нашей революции. И мы должны показать это на практике."
 BLR_nazbol_faerwall: "Революционный брандмауэр"
 BLR_nazbol_faerwall_desc: "Западная, развращающая пропаганда больше не должна проникать в умы нашего чистого и невинного русского народа."
 BLR_nazbol_black_guard: "Чёрная гвардия"
 BLR_nazbol_black_guard_desc: "Мы должны взять лучших из лучших и создать новый полк стражей порядка для нашего государства."
 BLR_nazbol_revoult_spirit: "Революционный Дух"
 BLR_nazbol_revoult_spirit_desc: "Дух революции - это наша, истинно русская идея о том, что хаос высвобождает себя и сметает все, что стоит у нас на пути."
 BLR_nazbol_anti_west: "Антизападная доктрина"
 BLR_nazbol_anti_west_desc: "Запад - это противоположность жизни! Страна заката, где жизнь заканчивается. Запад должен быть забыт и похоронен."
 BLR_revoult_sobor: "Привлекать радикалов"
 BLR_revoult_sobor_desc: "Радикалы наиболее чисты в своих помыслах и поступках - мы должны собрать всех, кто достаточно страстен, в великую армию революции."
 BLR_nazbol_flame: "Огонь революции"
 BLR_nazbol_flame_desc: "Мы приближаемся, и ничто не сможет погасить то, что мы предадим огню."
 BLR_nazbol_serp_idea: "Серп"
 BLR_nazbol_molot_idea: "Молот"
 BLR_nazbol_serp_molot_idea: "Серп и молот"
 BLR_nazbol_firewall_idea: "Революционный брандмауэр"
 BLR_nazbol_radicals_idea: "Радикальные Союзники"
 BLR_nazbol_anti_west_idea: "Антизападная доктрина"
 BLR_gru_nazbol_donetsk_revoult: "Начать восстание в §Y [DPR.GetNameWithFlag] §!"
 BLR_gru_nazbol_lugansk_revoult: "Начать восстание в §Y [LPR.GetNameWithFlag] §!"
 BLR_gru_nazbol_kharkiv_revoult: "Начать восстание в §Y [HPR.GetNameWithFlag] §!"
 BLR_gru_nazbol_odessa_revoult: "Начать восстание в §Y [OPR.GetNameWithFlag] §!"
 BLR_gru_nazbol_latgale_revoult: "Начать восстание в §Y [LAG.GetNameWithFlag] §!"
 belarus_nazbol.1.t: "Восстание национал-большевиков"
 belarus_nazbol.1.d: "Белорусские национал-большевики подняли восстание в одном из регионов нашей страны! Проклятие! Их недогосударство нужно было уничтожить ещё давно."
 belarus_nazbol.1.a: "Задушить их"
 LAG_nazbols: "Социалистическая Республика Латгалии"
 BLR_Lykashenko: "§Y Лукашенко §!"
 BLR_Lykashenko_desc: "Александр Григорьевич Лукашенко (родился 30 августа 1954 года) - белорусский политик, государственный и военный деятель. Фактически он занимал пост президента Беларуси и главнокомандующего Вооруженными силами Беларуси с 20 июля 1994 года. Он известен своими пророссийскими взглядами. В белорусском и русскоязычном сообществах у него есть прозвище \"батька\"."
 BLR_dai_denyag: "Запросить кредит у России"
 BLR_dai_denyag_desc: "Мы попросим Российское правительство предоставить нам кредит."
 BLR_Impact_kgb: "Влияние КГБ"
 BLR_Impact_kgb_desc: "КГБ использует различные методы для устранения недовольных избранием нового президента."
 BLR_Liquidation_pub_assoc: "Ликвидация общественных объединений"
 BLR_Liquidation_pub_assoc_desc: "КГБ активно ликвидирует или пытается ликвидировать общественные объединения, которые неугодны нашему президенту."
 BLR_crackdown_opp_rall: "Разгон митингов оппозиции"
 BLR_crackdown_opp_rall_desc: "Мы активно разгоняем митинги наших политических оппонентов, недовольных выборами."
 BLR_Increased_censorship: "Усилить цензуру в средствах массовой информации"
 BLR_Increased_censorship_desc: "Необходимо провести жесткую цензуру средств массовой информации, чтобы наши оппоненты не могли вести агитацию против нас."
 BLR_concept_national_security_Belarus: "Концепция национальной безопасности"
 BLR_concept_national_security_Belarus_desc: "Настоящая Концепция устанавливает совокупность официальных взглядов на сущность и содержание деятельности Республики Беларусь по обеспечению баланса интересов личности, общества и государства и их защите от внутренних и внешних угроз."
 BLR_Economic_development_2001_2005: "Программа социально-экономического развития"
 BLR_Economic_development_2001_2005_desc: "Программа социально-экономического развития Республики Беларусь на 2001-2005 гг. разработана Министерством экономики Республики Беларусь совместно с другими министерствами и республиканскими органами государственного управления, областными исполнительными комитетами и Минским городским исполнительным комитетом при участии Национальной академии наук, Национального банка, специализированных научно-исследовательские институты и общественные организации в соответствии с Законом Республики Беларусь \"О государственном прогнозировании и программах социально-экономического развития Республики Беларусь\" и постановлениями Совета Министров Республики Беларусь от 2 февраля 2000 г. N 141 и от 10 августа 2000 г. n 1248 о разработке Программы социально-экономического развития Республики Беларусь на 2001-2005 годы."
 BLR_reforms_Belarusian_Railway: "Реформы Белорусской железной дороги"
 BLR_reforms_Belarusian_Railway_desc: "Наши железные дороги находятся в очень ужасном состоянии, поэтому мы проведем ряд реформ, чтобы улучшить ситуацию"
 BLR_promise_first_nuclear: "Обещание построить атомную электростанцию"
 BLR_promise_first_nuclear_desc: "Мы обещаем всем нашим гражданам, что атомная электростанция будет построена на территории нашей страны, тем самым мы обеспечим нашу энергетическую безопасность"
 BLR_New_Land_code: "Новый земельный кодекс"
 BLR_New_Land_code_desc: "Новый Земельный кодекс значительно упрощает покупку земли частными владельцами и компаниями, что явно понравится определенному слою населения"
 BLR_gasification_country: "Завершение газификации страны"
 BLR_gasification_country_desc: "Мы завершим газификацию нашей страны, что, несомненно, оценят наши граждане"
 BLR_Anti_Corruption: "Антикоррупционная кампания"
 BLR_Anti_Corruption_desc: "Мы должны победить коррупцию в нашей стране. Главное - не выйти в конце концов на себя"
 BLR_Punish_Shushkevich: "Наказать коронованных особ Шушкевича"
 BLR_Punish_Shushkevich_desc: "Шушкевич оставил нам наследство в виде своих людей в правительстве, пришло время избавиться от них"
 BLR_Internet_cencorship: "Интернет-цензура"
 BLR_Internet_cencorship_desc: "Интернет стал площадкой, где часто обсуждаются настроения, направленные на свержение правительства, это необходимо контролировать"
 BLR_reform_kolhoz: "Реформы в колхозах"
 BLR_reform_kolhoz_desc: "Для стабильности нашего агропромышленного комплекса необходимо реформировать колхозы"
 BLR_Azarenok_case: "Дело Игоря Азаренка"
 BLR_Azarenok_case_desc: "Генерала Азаренка подозревали в лоббировании российских интересов в Республике Беларусь с помощью взяток и других махинаций. Стоит ли обращать на это внимание?"
 BLR_National_Library: "Новое здание Национальной библиотеки"
 BLR_National_Library_desc: "Новое здание Национальной библиотеки Беларуси, в строительстве которого принимала участие вся страна, было открыто для пользователей 16 июня 2006 года."
 BLR_BRSM: "Белорусский республиканский союз молодежи"
 BLR_BRSM_desc: "Белорусский республиканский союз молодежи - молодежное общественное объединение в Республике Беларусь. Это крупнейшее молодежное объединение в стране, которое поддерживается Александром Лукашенко. Его деятельность финансируется государством."
 BLR_Potato_Empire: "Картофельная империя"
 BLR_Potato_Empire_desc: "Мы являемся одними из ведущих специалистов по картофелю в мире. Наша страна должна гордиться этим"
 BLR_Another_year: "Еще один год независимости"
 BLR_Another_year_desc: "Беларусь и впредь будет проводить свою независимую политику"
 BLR_Changes_Customs_policy: "Изменение таможенной политики"
 BLR_Changes_Customs_policy_desc: "Были введены новые изменения и ограничения, чтобы усложнить ввоз контрафактной продукции в нашу страну"
 BLR_whitelegion_case: "Дело о Белом легионе"
 BLR_whitelegion_case_desc: "Наши спецслужбы сообщили о большой активности представителей Белого легиона, необходимо их поймать и посадить в тюрьму"
 BLR_Investing_Agro_industry: "Инвестиции в агропромышленный комплекс"
 BLR_Investing_Agro_industry_desc: "Агропромышленный комплекс является важной составляющей экономики нашей страны, и мы продолжим наращивать инвестиции в эту отрасль"
 BLR_fate_belarusian_church: "Судьба Белорусской церкви"
 BLR_fate_belarusian_church_desc: "Мы должны решить, каким путем пойдет наша церковь"
 BLR_New_concept_security: "Новая концепция национальной безопасности"
 BLR_New_concept_security_desc: "Наша концепция защиты нуждается в обновлении, и мы внесем новые изменения в наше законодательство"
 BLR_100dney: "100 Идей для Беларуси"
 BLR_100dney_desc: "Проект \"100 идей для Беларуси\", направленный на выявление одаренной молодежи, развитие ее научной деятельности и продвижение перспективных инновационных разработок"
 BLR_stroiotryad: "Возродить студенческую строительную бригаду"
 BLR_stroiotryad_desc: "Мы возродим практику студенческих строительных отрядов времен СССР. В качестве поощрения мы освободим их от налогов"
 BLR_People_Militia: "Создание народного ополчения"
 BLR_People_Militia_desc: "Мы готовы принять закон о создании народного ополчения, которое будет своеобразным резервом для территориальной обороны. В каждом селе, станице должна быть подготовленная группа людей для противодействия врагу, с последующим преобразованием в партизанское движение"
 BLR_azarenok_tv: "Новый пропагандист Лукашенко"
 BLR_azarenok_tv_desc: "Сейчас на телевидении часто можно увидеть нового пропагандиста, который вещает от имени нашей партии и убеждает людей в правильности наших действий"
 BLR_Dosaaf: "ДОСААФ"
 BLR_Dosaaf_desc: "ДОСААФ РБ это белорусская военизированная организация. ДОСААФ РБ основана на базе одноименной советской организации. Целями организации являются повышение гражданской готовности, привитие военной подготовки белорусской молодежи, воспитание гражданственности и обеспечение подготовки к выполнению основных военных задач и профессий. Помимо вооруженных сил, ДОСААФ РБ занимается спортивным и патриотическим воспитанием и проводит мероприятия для других белорусских организаций."
