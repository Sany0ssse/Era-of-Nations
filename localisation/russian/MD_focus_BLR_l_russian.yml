 BLR_euroitegration: "Евроинтеграция"
 BLR_euroitegration_desc: "\n\n\n\n£GFX_decisions_category_blr_eurointegration_category\n\n\n\n\n\n\n После многих лет диктатуры Беларусь наконец обрела демократическое и цивилизованное правительство. Теперь наш курс — отказаться от старых идеалов и встать в один ряд с цивилизованным миром. Европейская интеграция — это принятие ценностей и стандартов европейских стран, интеграция в западное сообщество и последующее вступление в Европейский союз, а затем и в НАТО.\nОднако наш сосед, долгое время контролировавший нашу политику и отрицающий самобытность белорусского народа, вряд ли обрадуется нашему новому курсу. Поэтому мы должны быть осторожны в высказываниях.\nВсему своё время — Беларусь обязательно станет частью европейской семьи.\n\nМы сможем вступить в НАТО и Европейский союз после выполнения соответствующих фокусов, а также достижения показателя §G 100 §! §3 Евроинтеграция §! и §3 НАТО-интеграция §! Каждое наше решение имеет последствия, и вместе с Евроинтеграцией будет расти уровень §O Эскалации §! Если эскалация больше чем §R 100 §! , то это приведёт к войне с [SOV.GetNameWithFlag]\n\n  §3 Нынешняя Евроинтеграция §! : §G [?blr_euroitegration] §! \n §3 Нынешняя Нато-интеграция §!: §G [?blr_natoitegration] §!\n §O Нынешняя Эскалация §!: §R [?blr_escalation] §!"
