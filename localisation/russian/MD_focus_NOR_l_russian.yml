l_russian:
norway_focus: "Дерево фокусов Норвегии"
NOR_the_norwegian_economy: "Норвежская экономика"
NOR_the_norwegian_economy_desc: "Норвежская экономика отличается разнообразием, ресурсами и многим другим. Мы должны изучить варианты развития нашей экономики, которые выведут нас в новое тысячелетие и поставят Норвегию на путь величия."
NOR_north_sea_oil: "Нефть Северного моря"
NOR_north_sea_oil_desc: "Для поддержания нашей дорогой политики нам необходимо обеспечить стабильный поток нашего и без того богатого запаса нефти и газа. По этому случаю мы должны сказать: 'Бурить, детка, бурить!'"
NOR_increased_cooperation_with_uk: "Усиление сотрудничества с Великобританией"
NOR_increased_cooperation_with_uk_desc: "Великобритания может оказаться очень полезным торговым партнером из-за растущего потребительского населения. Мы можем с пользой использовать их, а они могут получать свои природные ресурсы от дружественных европейских лиц..."
NOR_investments_into_shetland: "Инвестиции в Шетландские острова"
NOR_investments_into_shetland_desc: "Инвестиция доверия укрепит наши отношения с Великобританией и улучшит нашу торговлю. Наша избыточная ликвидность в государственной казне должна быть пущена в дело, не так ли?"
NOR_statoil: "Статойл"
NOR_statoil_desc: "Покупка большего количества акций в нефтепереработке улучшит наши возможности по расширению влияния, чтобы наши богатые запасы нефти могли быть использованы для нашего народа. Идея такова: покупай, покупай, покупай, а потом продавай, продавай, продавай."
NOR_encourage_union_workers: "Поощрение рабочих из союза"
NOR_encourage_union_workers_desc: "Хотя Европейский союз имеет свои успехи, у него есть и недостатки, поэтому мы не решались присоединиться. Администрации по перераспределению занятости в Европейском союзе сталкиваются с трудностями при поиске работы для всех своих рабочих союза; если они готовы работать, мы готовы их приютить!"
NOR_european_investments: "Европейские инвестиции"
NOR_european_investments_desc: "Наша нефть сама не выкопается из океана, возможно, наши европейские братья помогут нам снизить стоимость её добычи. Наши запасы нефти могут быть богаты, но мы можем увидеть, как наши банковские вклады истощатся, если мы попытаемся взять на себя всю стоимость бурения самостоятельно."
NOR_sintef_research_org: "SINTEF"
NOR_sintef_research_org_desc: "SINTEF означает Stiftelsen for industriell og teknisk forskning, по-английски: The Foundation for Industrial and Technical Research. Это крупнейшая исследовательская и опытно-конструкторская компания во всей Скандинавии, работающая во всех частях мира. На данный момент компания полностью независима, однако стимулы для более тесной работы с 'предложенными' торговыми союзниками никому не повредят, не так ли?"
NOR_ekofisk_oil_field: "Нефтяные месторождения Экофиск"
NOR_ekofisk_oil_field_desc: "При развитии нефтяного сектора нам необходимо учитывать наш самый значительный его источник — нефтяные месторождения Экофиск. В этих залежах все еще остаются миллионы кубических тонн нефти; если мы увеличим там нашу добычу, население будет обеспечено на годы. Защита окружающей среды, конечно, наступит позже..."
NOR_production_twenty_fifty: "Производство 2050"
NOR_production_twenty_fifty_desc: "Похоже, нам придется удвоить усилия по добыче нефти в обозримом будущем, то есть до, скажем, 2050 года?"
NOR_renewable_investments: "Инвестиции в возобновляемые источники"
NOR_renewable_investments_desc: "Нашей нефти хватит ненадолго, нам нужно начать делать шаги в правильном направлении, в зеленом направлении."
NOR_scan_wind: "СканВинд"
NOR_scan_wind_desc: "Наше географическое положение позволяет нам использовать ветровую энергию по максимуму. В Норвегии много гор, которые будут укрывать нас, как всегда, но теперь с силой электричества!"
NOR_statkraft: "Статкрафт"
NOR_statkraft_desc: "Существует множество возможностей для расширения гидроэнергетики в Норвегии, и это может дать нам тот дополнительный шаг, который необходим для становления самодостаточной нацией на зеленой энергии."
NOR_electric_vehicle_incentives: "Стимулы для электромобилей"
NOR_electric_vehicle_incentives_desc: "Многие отказываются переходить с автомобиля на бензине на электромобиль, так как не видят экологически чистое будущее Норвегии. Возможно, немного зелени поможет им увидеть 'зелень' нашего будущего."
NOR_green_cities: "Зеленые города"
NOR_green_cities_desc: "Городская инфраструктура должна быть адаптирована для полного перевода многих услуг, как государственных, так и частных, на электрическую энергию."
NOR_charging_stations: "Зарядные станции"
NOR_charging_stations_desc: "Причина, по которой многие не хотят иметь электромобили, заключается в дефиците зарядных станций для них, и они считают это оправданным. Наша задача — создать больше зарядных станций, чтобы они были доступны для всех, тогда никаких оправданий не будет, верно?"
NOR_standardize_infrastructure: "Стандартизация инфраструктуры"
NOR_standardize_infrastructure_desc: "Некоторые подрядчики менее эффективны, чем другие; если мы внедрим государственную модель, мы сможем уменьшить путаницу в строительных проектах."
NOR_contract_veidekke: "Контракт с Вейдекке"
NOR_contract_veidekke_desc: "Международный проект автомагистрали — это именно то, что нужно, чтобы объединить наших скандинавских братьев; это будет способствовать торговле и добрым отношениям между всеми нашими странами."
NOR_gothenburg_cultural_center: "ZEB Гибкая лаборатория"
NOR_gothenburg_cultural_center_desc: "Гибкая лаборатория ZEB в Тронхейме входит в число самых устойчивых зданий мира и является первой в мире с подтвержденным климатическим учетом, показывающим общие выбросы CO2 с эквивалентной компенсацией производства энергии."
NOR_contract_bilfinger_se: "Контракт с Билфингер SE"
NOR_contract_bilfinger_se_desc: "Нет ничего эффективнее немцев. Билфингер SE предложил нам удивительную бизнес-возможность. Норвегия будет развиваться со скоростью света!"
NOR_gas_industry_rennovations: "Реконструкция газовой промышленности"
NOR_gas_industry_rennovations_desc: "Мы должны расширить нашу газовую промышленность на данный момент, так как переход на зеленую энергию — это долгий и трудный процесс. Также учитывая тот факт, что когда мы перейдем на зеленую энергию, мы сможем использовать нефть и газ исключительно для экспорта, кладя немного этой 'зелени' в наши карманы."
NOR_ministry_of_transport_communication: "Министерство транспорта и связи"
NOR_ministry_of_transport_communication_desc: "Мы должны расширить некоторые основные общественные потребности для улучшения качества жизни; мы ведь государство всеобщего благосостояния."
NOR_avinor: "Авинор"
NOR_avinor_desc: "Мы можем повысить эффективность расширения нашей авиационной сети, если создадим дочернюю компанию на базе Luftfartsverket, где мы будем владеть 100% акций. Таким образом, мы сможем управлять всеми их активами в соответствии с нашим превосходным планированием, которое будет осуществляться в национальном масштабе и гарантированно в интересах нации."
NOR_oslo_airport_expansion: "Расширение аэропорта Осло"
NOR_oslo_airport_expansion_desc: "По мере роста нашего населения и потока туристов наши аэропорты начинают переполняться, и вскоре это сделает путешествия нежелательными и трудными. Мы должны сделать нашу великую столицу как можно более привлекательной и комфортной."
NOR_statens_vangsen: "Статенс Вегвесен"
NOR_statens_vangsen_desc: "Норвегия — большая страна, и все точки интереса довольно разбросаны. Мы окажем большую услугу нашему народу, увеличив субсидии Управлению общественных дорог."
NOR_facilities_for_norde_norge: "Объекты для Нур-Норге"
NOR_facilities_for_norde_norge_desc: "Самый отдаленный район материковой Норвегии и один из самых труднодоступных в мире — это Нур-Норге. Давайте изменим это, не так ли?"
NOR_baneservice: "Бансервис"
NOR_baneservice_desc: "Нашим железным дорогам не хватает развития; инициатива по строительству большего их количества поможет в перемещении потребительских товаров по стране и сблизит нас всех еще немного."
NOR_innovations_in_dovre_line: "Инновации на линии Довре"
NOR_innovations_in_dovre_line_desc: "Линия Довре постоянно улучшалась и достраивалась; пришло время для нового раунда реноваций."
NOR_migration_to_norway: "Миграция в Норвегию"
NOR_migration_to_norway_desc: "Из-за нашей гостеприимной среды в Норвегии наша страна очень привлекательна для беженцев, ищущих убежища. Со временем это стало проблемой, поскольку нация сильно разделена во мнениях о том, следует ли нам продолжать принимать этих беженцев или сказать 'хватит'. Какой бы выбор ни был, мы должны занять позицию, и быстро."
NOR_norge_ming: "Норге Майнинг"
NOR_norge_ming_desc: "Второй по величине вкладчик в нашу экономику — это горнодобывающий сектор, и поскольку он сохранится в обозримом будущем, нам следует расширить эту отрасль."
NOR_deep_sea_expansion: "Расширение глубоководной добычи"
NOR_deep_sea_expansion_desc: "В наших обширных водных зонах можно найти больше месторождений; мы должны приложить усилия, чтобы найти эти залежи и увеличить наши запасы."
NOR_norsk_industri: "Норск Индустри"
NOR_norsk_industri_desc: "Норвежской промышленности не хватает развития; давайте приложим усилия, чтобы исправить это."
NOR_bergen_engines_domestic: "Берген Энджинс для внутреннего рынка"
NOR_bergen_engines_domestic_desc: "Крупные инвестиции в нашу автомобильную промышленность могут превратить нас в нацию-производителя автомобилей, обеспечив нашу экономику необходимой диверсификацией."
NOR_bergen_engines_rolls_royce: "Берген Энджинс и Роллс-Ройс"
NOR_bergen_engines_rolls_royce_desc: "Мы должны развивать нашу автомобильную промышленность не только количественно, но и с точки зрения роскоши и качества. Партнерство с немцами приведет к буму в этом бизнесе."
NOR_shipbuilding_investments: "Инвестиции в судостроение"
NOR_shipbuilding_investments_desc: "У Норвегии около 100 тысяч километров побережья; было бы стыдно позволить всему этому пропасть зря, не так ли? Мы — морской народ, давайте вернемся к этому духу!"
NOR_aker_yards: "Акер Ярдс"
NOR_aker_yards_desc: "Мы представляем новейшее ответвление нашей морской индустрии — Акер Ярдс! Смотрите, как строят! Смотрите, как идет! Вот это я понимаю, экономика по принципу 'поймал-отпустил'."
NOR_fishing_ports_regulations: "Регламентация рыболовных портов"
NOR_fishing_ports_regulations_desc: "Поскольку у нас огромная рыболовная промышленность, и это традиционное норвежское времяпрепровождение, трудно вводить ограничения. Однако окружающая среда больше не может страдать, поэтому мы нашли решение. Крупные рыболовные компании под нашим надзором объединят множество мелких рыболовных компаний для централизации и устранения путаницы в отношении рыболовства и его ограничений."
NOR_ministry_of_agriculture_and_food: "Министерство сельского хозяйства и продовольствия"
NOR_ministry_of_agriculture_and_food_desc: "Здесь требуется реформа, ибо какой бы дурак ни был выбран для надзора за сельским хозяйством и продовольствием, явно занимал свою должность слишком долго..."
NOR_food_safety_regulations: "Правила безопасности пищевых продуктов"
NOR_food_safety_regulations_desc: "Многие из ранее столь необходимых политик в области продовольствия должны быть реализованы для успеха нашей реформы министерства."
NOR_pesticide_distribution: "Распределение пестицидов"
NOR_pesticide_distribution_desc: "Мы никогда не думали, что это будет проблемой в нашем климате, но Норвегия может быть под атакой... насекомых."
NOR_norwegian_armed_forces: "Вооруженные силы Норвегии"
NOR_norwegian_armed_forces_desc: "Храбрость и адаптивность великих вооруженных сил готовы защищать от любой опасности, днем и ночью. Они обучены для всех условий и знают свою миссию — защищать народ Норвегии ради его постоянного мира и свободы."
NOR_norwegian_navy_forces: "Военно-морские силы Норвегии"
NOR_norwegian_navy_forces_desc: "Основная цель нашего флота — защищать интересы нашей торговли, хотя его редко бросают вызов. Нам все еще нужны силы сдерживания, чтобы командовать морями, на которые мы имеем право."
NOR_haakonsvern_naval_base: "Военно-морская база Хоконсверн"
NOR_haakonsvern_naval_base_desc: "Хоконсверн, главная база норвежского флота, требует масштабной реконструкции, так как она больше не соответствует стандартам для эффективного обслуживания нашего народа."
NOR_fleet_logistics_command: "Командование логистики флота"
NOR_fleet_logistics_command_desc: "Мы получили сообщение, что наш флот неэффективно использует ресурсы, находящиеся в его распоряжении. Это будет тщательно изучено; мы не можем допускать расточительства в нашей армаде."
NOR_norwegian_naval_academy: "Норвежская военно-морская академия"
NOR_norwegian_naval_academy_desc: "Очевидно, что мы не можем допускать некомпетентности во главе первой обороны Норвегии."
NOR_norwegian_land_forces: "Сухопутные силы Норвегии"
NOR_norwegian_land_forces_desc: "Норвежская армия — это сухопутный род войск Вооруженных сил Норвегии. Сухопутные силы армии являются старейшим из родов войск Норвегии, созданным как современная военная организация под командованием короля Норвегии."
NOR_quality_over_quantity: "Качество важнее количества"
NOR_quality_over_quantity_desc: "Мы всегда были известны своим прагматичным подходом к производству; каждая задача выполняется с заботой, в Норвегии нет места неряшливости!"
NOR_quantity_over_quality: "Количество важнее качества"
NOR_quantity_over_quality_desc: "Не то чтобы мы полностью пренебрегали силой качества, но нам не нужно следить, чтобы все было идеально до мельчайших деталей. Просто выпускайте продукт, если он достаточно хорош; наша производительность не может страдать из-за ОКР."
NOR_norwegian_military_academy: "Норвежская военная академия"
NOR_norwegian_military_academy_desc: "Некоторые из самых ярких мыслителей в области боевой стратегии и геополитики посещают нашу академию. Именно благодаря бережному отношению к нашим военным институтам мы ощущаем преимущества гениальных стратегически ориентированных умов в кабинете исполнительной власти."
NOR_norwegian_air_forces: "Военно-воздушные силы Норвегии"
NOR_norwegian_air_forces_desc: "ВВС так же необходимы, как и флот, для первой обороны Норвегии; наш рельеф очень сложный, что делает Норвегию потенциальной ареной битвы в небе, если таковая вообще произойдет. Наиболее полезно то, что наши ВВС могут использоваться по всему миру в качестве миротворческих сил, если мы того пожелаем."
NOR_orland_main_air_station: "Главная авиастанция Эрланн"
NOR_orland_main_air_station_desc: "Главная авиастанция Эрланн — крупнейший аэродром Норвегии, на котором базируется большая часть наших самолетов, и он стратегически расположен для удобного покрытия большей части Норвегии."
NOR_technical_advice_from_our_friends: "Технические советы от наших друзей"
NOR_technical_advice_from_our_friends_desc: "Наши ВВС хороши, но не велики; обмен технологиями с нашими союзниками должен помочь нам этого достичь."
NOR_norwegian_airforce_academy: "Академия ВВС Норвегии"
NOR_norwegian_airforce_academy_desc: "Будучи мирной нацией, мы сами не видим много конфликтов, что позволяет нам быть блестящими стратегами и военными мыслителями Европы."
NOR_cyber_defense_force: "Киберзащита"
NOR_cyber_defense_force_desc: "Поскольку мир постоянно цифровизируется, нам также необходимо двигаться к более технологичному будущему. К сожалению, намерения не всех доброжелательны, и нам понадобится команда для наблюдения за безопасностью сети Норвегии."
NOR_german_technicians: "Инвестиции в танки"
NOR_german_technicians_desc: "Нашим танкам в последнее время не хватает качества; возможно, мы можем исследовать их, чтобы выяснить, как мы могли бы их улучшить."
NOR_party_of_labour: "Рабочая партия"
NOR_party_of_labour_desc: "Рабочая партия, которую не следует путать с коммунистами, — это голос рабочих и решение для нашего народа. Мы — образцовый пример работающей социальной демократии и были одной из самых популярных партий с момента нашего основания. Мы можем показать миру, что социальная демократия — это справедливая система, которая помогает и защищает свой народ, как должно делать настоящее правительство. Вперед, за trygghet, muligheter, og fellesskap!"
NOR_modernization_of_the_welfare_state: "Модернизация государства всеобщего благосостояния"
NOR_modernization_of_the_welfare_state_desc: "Наше огромное богатство позволяет нам поддерживать тысячи норвежцев, которые в этом нуждаются. Наша сеть социальной защиты обширна, но ее еще можно улучшить."
NOR_workers_youth_league: "Молодежная лига рабочих"
NOR_workers_youth_league_desc: "Чтобы иметь социалистическую страну, дети должны получить социалистическое образование. Они научатся функционировать в таком обществе и внесут свой вклад своими свежими умами в продуктивность и благополучие нашей страны."
NOR_privitization_of_state_industries: "Приватизация государственных отраслей"
NOR_privitization_of_state_industries_desc: "Нам нужно вернуть народу компании, не являющиеся необходимыми для государственного контроля. Таким образом, они почувствуют свою финансовую свободу, в то время как мы сможем сохранить только необходимый контроль над экономикой."
NOR_forest_conservation_plans: "Планы сохранения лесов"
NOR_forest_conservation_plans_desc: "Наша прекрасная природа — это самое священное, что есть в Норвегии, и мы всегда должны следить за тем, чтобы она никогда не была осквернена."
NOR_solar_investments: "Инвестиции в солнечную энергию"
NOR_solar_investments_desc: "Путь в будущее лежит не через нефть и газ; будущее исходит от природы: Солнца, ветра и текущих рек. Хотя мы богаты во всех этих областях, кроме солнечного света, нам следует сделать усилие, чтобы отойти от нашей загрязняющей энергии и двигаться к более светлому будущему."
NOR_vaccinations_against_poverty: "Вакцинация от бедности"
NOR_vaccinations_against_poverty_desc: "Увеличение бюджета нашего народа, несомненно, поднимет их на ноги."
NOR_transatlantic_cooperation: "Трансатлантическое сотрудничество"
NOR_transatlantic_cooperation_desc: "Нам нужно заверить наших друзей, что мы полностью дружелюбны с Западом; это должно устранить любую враждебность, которую они могут испытывать к нам."
NOR_intensify_cooperation_with_partners: "Усиление сотрудничества с партнерами"
NOR_intensify_cooperation_with_partners_desc: "Некоторые учебные упражнения должны помочь нашим ближайшим друзьям увидеть хорошее в такой великой социальной демократии, как Норвегия."
NOR_modernization_quota: "Квота на модернизацию"
NOR_modernization_quota_desc: "Наша военная техника устарела; возможно, наши союзники могут прислать нам свое превосходное оборудование."
NOR_weight_behind_gaza: "Поддержка Газы"
NOR_weight_behind_gaza_desc: "В последние годы государство Израиль ясно показало свою жестокость по отношению к палестинцам, что они становятся такими же плохими, как их угнетатели. Мы стоим рядом с нашими братьями в Палестине!"
NOR_packages_of_aid: "Пакеты помощи"
NOR_packages_of_aid_desc: "Влияние Израиля на бедных палестинцев и разорённые войной страны вокруг него было разрушительным. Мы можем использовать норвежский успех, чтобы оказать положительное влияние на эти народы и облегчить их бремя."
NOR_constructive_dialogue_with_russia: "Конструктивный диалог с Россией"
NOR_constructive_dialogue_with_russia_desc: "С момента распада Советского Союза напряжённость между Россией и западным миром нарастает. Это не принесёт ничего, кроме хаоса для будущего нашей нации; мирные и дружественные переговоры могут помочь разрядить эту напряжённость и обеспечить более безопасный мир."
NOR_the_red_green_allience: "Красно-зеленая коалиция"
NOR_the_red_green_allience_desc: "Норвежская политическая система неспособна дать одной партии полное большинство, поэтому нам придется искать союзников в парламенте. В настоящее время нашими ближайшими партиями являются Левые социалисты и Центристы. Мы сформируем красно-зеленую коалицию, чтобы получить большинство в парламенте."
NOR_conservative_party: "Хёйре"
NOR_conservative_party_desc: "Слишком долго Консервативная партия находилась в тени Рабочей партии. Пришло время преобразовать Норвегию в эффективное государство, где бюджет основывается на объективных потребностях страны и ее народа и где нет места инфляции."
NOR_right_coalition: "Правая коалиция"
NOR_right_coalition_desc: "К сожалению, у нас нет большинства в парламенте, что делает реализацию нашей политики довольно проблематичной и также угрожает созданию правительства меньшинства во главе с Рабочей партией. Единственное решение, которое мы можем принять, — это объединить все правые политические партии, чтобы предотвратить возвращение Рабочей партии к власти, даже если эти правые партии слишком радикальны для нас."
NOR_tax_decrease: "Снижение налогов"
NOR_tax_decrease_desc: "Зная о богатстве нашей страны, Рабочая партия продолжала свою политику хищнических налогов, видимо, желая вытащить каждый цент из карманов наших граждан. Мы должны положить этому конец и снизить налоговое бремя."
NOR_simplify_layoffs: "Упрощение процедуры увольнений"
NOR_simplify_layoffs_desc: "Норвегия — это государство всеобщего благосостояния, и мы это уважаем. Однако важно не забывать, что предприниматели и бизнес также являются частью народа, и им должно быть так же хорошо в Норвегии, как и их работникам. В настоящее время процедура временных увольнений в Норвегии приносит пользу исключительно работнику и может буквально убить компанию во время экономического кризиса. Стоит упростить процедуру временных увольнений, чтобы восстановить баланс в трудовых отношениях."
NOR_support_women: "Поддержка женского дела"
NOR_support_women_desc: "Равенство между мужчинами и женщинами является неотъемлемой частью здоровой рыночной экономики и западного общества. Мы должны поощрять внедрение равной оплаты труда для всех гендеров и расширять список работ, где могут работать женщины. Самое главное, мы не должны использовать директивные методы; нам нужно медленно подталкивать общество к этой цели."
NOR_progressive_conservatism: "Прогрессивный консерватизм"
NOR_progressive_conservatism_desc: "Многие критикуют нашу партию за то, что она якобы ничем не отличается от Рабочей партии, и приписывают нам термин 'Прогрессисты'. Возможно, это правда; мы действительно верим в гендерное равенство и свободу сексуальной ориентации, поскольку это фундаментальные идеи личной свободы, закрепленные в основе нашего либерального общества, а государство всеобщего благосостояния, которое у нас есть сейчас, является главной ценностью норвежского народа. Однако мы считаем себя консерваторами; мы поддерживаем идею сбалансированного бюджета и рыночной экономики и полностью привержены идее личной свободы. Да, мы прогрессисты, мы консерваторы, мы 'Прогрессивные консерваторы'."
NOR_reduce_public_spending: "Осторожные сокращения"
NOR_reduce_public_spending_desc: "Сокращение государственных расходов — краеугольный камень нашей избирательной кампании, но сокращения должны проводиться осторожно, чтобы не повредить хрупкую систему государственной социальной поддержки. Это как хирургическая операция: одно неверное движение — и пациент умирает. Будем надеяться, что наши хирурги сделают свою работу правильно."
NOR_US_partnership: "Визит в Белый дом"
NOR_US_partnership_desc: "У нас была возможность встретиться с американским президентом и потенциально подписать несколько очень выгодных для нас контрактов. Чтобы сделать наш успех более вероятным, наша правительственная делегация будет включать самого премьер-министра, экспертов по американской политике и личного стилиста."
NOR_cooperation_with_eu: "Потепление отношений с ЕС"
NOR_cooperation_with_eu_desc: "Норвегия не может просто отвернуться и игнорировать ЕС, особенно когда общая граница со странами-членами составляет более 2000 километров! Конечно, никто не заставляет нас вступать в ЕС, но экономическое и военное сотрудничество с ними для нас просто необходимо."
NOR_new_eu_contracts: "Европейский тур"
NOR_new_eu_contracts_desc: "Есть возможность договориться о выгодных соглашениях с Европейским союзом. Нам срочно нужно подготовить делегацию из самых профессиональных переговорщиков и членов правительства для масштабной поездки по странам ЕС."
NOR_north_bastion: "Северный бастион НАТО"
NOR_north_bastion_desc: "Норвегия — одна из самых боеготовых стран НАТО. Мы готовы к любой военной конфронтации, будь то с Россией или любым другим противником западного мира. Мы действительно северный бастион, НАТО нуждается в нас!"
NOR_chinese_investments: "Щедрый дракон"
NOR_chinese_investments_desc: "У нас есть возможность привлечь инвесторов из Китая в норвежскую экономику. Хотя многие противники Китая видят в китайских деньгах рычаг манипуляции, условия, которые китайские инвесторы могут предложить нам, слишком выгодны, чтобы от них отказываться. Мы отправим специально подготовленную делегацию в Пекин, и среди них даже есть человек, лично знакомый с родственником китайского лидера!"
NOR_toughen_immigration: "Ужесточение иммиграционного контроля"
NOR_toughen_immigration_desc: "Норвегия — гостеприимная и толерантная страна по отношению ко всем меньшинствам, но когда дело доходит до неконтролируемого потока нелегальных мигрантов, который захлестнул всю Европу, необходимы действия. Мы не позволим Норвегии стать вращающейся дверью. Наша задача — укрепить нашу границу и не допускать свободного въезда нелегальных иммигрантов в нашу страну."
NOR_the_iron_pm: "Железный премьер-министр"
NOR_the_iron_pm_desc: "Из-за нашей бескомпромиссной позиции в отношении нелегальной миграции многие граждане называют главу правительства 'Железным премьер-министром'. Многие используют это прозвище в положительном ключе, некоторые — в отрицательном, но так или иначе наш премьер-министр приобрёл бо́льшую узнаваемость и авторитет в стране, что может дать ему преимущества при переизбрании и реализации правительственной политики."
NOR_christan_peoples_party: "Kristelig Folkeparti"
NOR_christan_peoples_party_desc: "Пришло время возрождения Христианской народной партии и последовательного внедрения христианских ценностей. Народ Норвегии забывает норвежские ценности и традиции; если мы не обеспечим их сейчас, мы увидим упадок нашей партии и всего, что она представляет."
NOR_coalitional_government: "Обновление коалиционного соглашения"
NOR_coalitional_government_desc: "Мы находимся в сложной ситуации; у нас нет большинства в Стортинге, и вотум недоверия может быть вопросом времени. Чтобы предотвратить это, нам придется обновить коалиционное соглашение между всеми умеренными правоцентристскими христианскими партиями. Мы не позволим нашему государству морально разлагаться!"
NOR_permitting_co_living: "Разрешение совместного проживания"
NOR_permitting_co_living_desc: "Мы не поддерживаем легализацию однополых браков в стране, но мы не можем запрещать людям жить с кем они хотят, это неправильно. Мы внесем законопроект о разрешении совместного проживания, удовлетворив таким образом интересы умеренных членов нашего правительства без компромисса с нашими идеалами."
NOR_reinforce_christian_values: "Нация Христа"
NOR_reinforce_christian_values_desc: "Норвегия — глубоко христианская страна, наши традиции и ценности были построены на учении Христа. Пренебрегая словом Божьим, мы разрушаем наш народ. Необходимо восстановить Веру в нашем обществе, иначе нас ждет деградация и моральный упадок."
NOR_reform_aap: "Реформа AAP"
NOR_reform_aap_desc: "Пособие по оценке трудоспособности, или APP, — это основной инструмент нашего высокого уровня потребления и низкого уровня бедности. APP позволяет людям, которые получили травму или временно не могут работать, получать некоторое пособие, которое предотвратит их голодание во время восстановления. Однако высокий уровень бюрократии и неэффективное управление привели к упадку этого института. Иисус учил, что мы должны помогать всем нуждающимся, поэтому наше правительство не может оставаться в стороне. Мы примем пакет реформ, направленных на реформирование AAP и помощь этому сугубо христианскому институту снова стать полезным."
NOR_abortion_matter: "Проблема абортов"
NOR_abortion_matter_desc: "Христианская народная партия в целом выступает против абортов, но решительно одобряет исключения в случаях изнасилования и угрозы жизни матери."
NOR_contraception_support: "Поддержка контрацепции"
NOR_contraception_support_desc: "Наша партия поддерживает использование контрацептивов, которые только предотвращают зачатие, но не вредят потенциальному ребенку, чтобы снизить уровень абортов."
NOR_developmental_aid: "Помощь в развитии"
NOR_developmental_aid_desc: "Социалистическая политика не вся плоха, и либеральные элементы в нашей партии предполагают, что государственная помощь проектам развития предотвратит будущий жилищный пузырь и стимулирует растущую индустрию недвижимости."
NOR_poverty_and_climate_change_reduction: "Сокращение бедности и изменения климата"
NOR_poverty_and_climate_change_reduction_desc: "Хотя мы внесли значительный вклад в сокращение загрязнения и отмечены как одна из ведущих стран в индексе благосостояния, того же нельзя сказать о наших друзьях по всему миру. Южная Америка особенно страдает от этого, так как они не могут сосредоточиться на индустриализации до устойчивого уровня, пока не решат эти проблемы. Мы должны помочь им, чем можем, сейчас."
NOR_security_advancements: "Усовершенствования безопасности"
NOR_security_advancements_desc: "В опасном мире необходимо готовиться к опасностям, опасностям для нашей нефти, конечно."
NOR_for_minorities: "За меньшинства"
NOR_for_minorities_desc: "Норвегия — в целом прогрессивная нация с очень небольшим количеством консервативных экстремистских элементов, ни один из которых не имеет власти над моралью народа. Увеличение финансирования для меньшинств должно завоевать сердца наших граждан, которые приветствуют их с распростертыми объятиями, и самих меньшинств за то, что их признали."
NOR_refugee_quota: "Квота на беженцев"
NOR_refugee_quota_desc: "К сожалению, другие правительства не столь идеальны, как наше, и многим людям вынуждены покидать свои дома. Мы должны внести свой вклад на международной арене, чтобы спасти этих людей; все миролюбивые люди, вы всегда желанны в Норвегии!"
NOR_relieve_pressure_from_greece: "Снять давление с Греции"
NOR_relieve_pressure_from_greece_desc: "Греция сделала намного больше своей доли в приеме беженцев, и кажется, что они едва держатся на плаву и не могут разместить своих беженцев, не говоря уже о приеме новых. У нас есть дом для них в Норвегии; давайте протянем руку помощи нашему европейскому другу."
NOR_fair_refugee_distribution: "Справедливое распределение беженцев"
NOR_fair_refugee_distribution_desc: "Каждый в Норвегии, у кого есть такая возможность, должен работать; это включает беженцев, которых мы так милостиво принимаем. Мы можем оптимизировать наш национальный промышленный продукт, распределяя этих людей по домам поближе к фабрикам, где нам нужны рабочие."
NOR_our_european_allies: "Наши европейские союзники"
NOR_our_european_allies_desc: "Давайте сделаем декларацию о дружбе с нашими друзьями в Организации Североатлантического договора, чтобы мир знал, на чьей мы стороне."
NOR_nato_drilling: "Доктрина НАТО"
NOR_nato_drilling_desc: "Мы должны использовать модель обучения войск НАТО, находящуюся в нашем распоряжении, и их военные академические исследования для улучшения норвежской армии."
NOR_eea_free_zones: "Свободные зоны ЕАСТ"
NOR_eea_free_zones_desc: "Нам следует сократить экономическую дистанцию между скандинавскими странами и расширять сотрудничество между нашими государствами для стимулирования экономического роста."
NOR_tighten_arms_sales: "Ужесточение продаж оружия"
NOR_tighten_arms_sales_desc: "Мы должны закупить больше оружия для нашей пехоты; в настоящее время оно ни на что не годно."
NOR_maintain_eu_distance: "Сохранять дистанцию с ЕС"
NOR_maintain_eu_distance_desc: "Хотя мы желаем мира нашим друзьям в Европейском союзе, мы также видим его недостатки и поэтому не присоединимся в ближайшее время. Однако удачи им!"
NOR_party_of_progress: "Партия прогресса"
NOR_party_of_progress_desc: "Партия прогресса, наша цель - двигать народ вперёд с помощью более консолидированных методов управления. Мы знаем, чего хочет народ, - это базовые потребности и его свобода. Мы справимся с этой задачей."
NOR_shortened_wait_times: "Сокращение времени ожидания в больницах"
NOR_shortened_wait_times_desc: "В стране, где у нас бесплатная медицина и у всех есть к ней доступ, все, кажется, стоят в очереди! Совершенно необходимо, чтобы мы продвинулись со строительством новых больниц - наши люди не могут ждать, пока их номер назовут, истекая кровью в вестибюле!"
NOR_nursing_capacity: "Мощности медсестер"
NOR_nursing_capacity_desc: "Нам нужно больше медсестер для ухода за норвежским народом; возможно, стимулы в виде земли сработают?"
NOR_removal_of_inheritence_tax: "Отмена налога на наследство"
NOR_removal_of_inheritence_tax_desc: "Налог на наследство — один из самых отвратительных законов в норвежском законодательстве, и мы с ним покончим. Деньги народа принадлежат народу!"
NOR_elderly_focus: "Фокус на пожилых"
NOR_elderly_focus_desc: "В последние годы пожилые люди нашей нации были забыты при принятии законодательных решений, и это попросту позорно. Пожилые люди сделали для нашей страны больше всех - неужели мы не должны защищать их?"
NOR_free_fundemental_society: "Свободное фундаментальное общество"
NOR_free_fundemental_society_desc: "Слишком часто бюрократы и правительство вмешиваются в жизнь среднего гражданина. Правительство было создано для защиты людей; ограничено должно быть правительство, а не люди."
NOR_youth_discipline: "Дисциплина молодежи"
NOR_youth_discipline_desc: "Мы можем вдохновить и, следовательно, мобилизовать молодежь для содействия национальному процветанию, за Норвегию!"
NOR_equal_action: "Равные действия"
NOR_equal_action_desc: "Мы можем осадить другие, менее желательные партии, которые мешают нашей повестке дня для прогресса народа."
NOR_law_and_order: "Закон и порядок"
NOR_law_and_order_desc: "Норвегия — это страна законов; если вы не нарушаете законы, то нет причин возражать против присутствия полиции, верно?"
NOR_immigration_control: "Контроль иммиграции"
NOR_immigration_control_desc: "Мы приняли вполне достаточно беженцев и мигрантов, и пора сбавить темп. Если мы не успеваем строить так же быстро, как они прибывают, то определённо пора остановиться."
NOR_avoid_illiterates: "Избегать неграмотных"
NOR_avoid_illiterates_desc: "Если мы начнем отчуждать неграмотных от общества, это обеспечит идеальную мотивацию начать учиться."
NOR_state_of_norway: "Государство Норвегии"
NOR_state_of_norway_desc: "Бюрократия Норвегии должна стать более эффективной. Для этого её необходимо поставить под жёсткий надзор более строгих вышестоящих федеральных агентств, чтобы обеспечить бесперебойную работу."
NOR_reaffirm_oil_state: "Подтверждение нефтяного государства"
NOR_reaffirm_oil_state_desc: "Мы все еще нефтегазовая страна, мы далеки от полностью возобновляемой энергии, и так будет продолжаться долгое время."
NOR_privatization_of_state_dockyards: "Приватизация государственных верфей"
NOR_privatization_of_state_dockyards_desc: "Богатство Норвегии принадлежит норвежскому народу. Один из крупнейших экономических секторов нашей страны - рыболовство и судостроение. Мы можем начать возвращать власть народу именно здесь."
NOR_the_nrk: "NRK"
NOR_the_nrk_desc: "Норвежская вещательная корпорация — это государственная вещательная компания, которая служит основным источником новостей для нашего народа. Мы можем использовать своё влияние, чтобы направить её в русло наших интересов, тем самым объединяя наш народ, информируя и защищая его от любых препятствий или угроз нашей нации."
NOR_oslo_hydro_TT: "Предоставляет [NOR.GetFlag] §HЭстланнет§! модификатор состояния §HГидроэнергетическая инфраструктура§!"
NOR_bergen_engines_TT: "Дополнительный доход: §G$0.400§!"
NOR_productivity_state_TT: "Увеличит §HПроизводительность§! в [NOR.GetFlag] §HЭстланнет§! на §H75§!"
NOR_norge_mining_TT: "£decision_icon_small §YРазблокирует§! решения §YНорге Майнинг§!"
NOR_norge_mining2_TT: "£decision_icon_small §YДобавляет§! 2 дополнительных решения §YНорге Майнинг§!"
NOR_productivity_state2_TT: ""
haakons_marriage_announced: "§YБрак Хокона объявлен!§!"
haakon_married: "§YНаследный принц женился!§!"
NOR_oppose_haakons_marriage_tt: "§RДолжно быть сделано до того, как наследный принц Хокон найдет невесту.§!\n"
NOR_stay_in_nato_tt: "Все члены §BНАТО§! улучшат свое §Yмнение§! о вас.\n"
norway.1.t: "Железнодорожная катастрофа в Осте"
norway.1.d: "В [GetDateText] в районе Эстердален произошла железнодорожная авария в Осте, где местный поезд на линии Рёрос столкнулся с национальным поездом из Тронхейма.\n\nПогиб 19 человек, что стало первой крупной катастрофой на норвежской земле в [GetYear]. 67 пассажиров выжили в аварии.\n\nАвария винят правительство и Норвежскую национальную железнодорожную администрацию, которые снизили требования, чтобы убедиться, что железные дороги действительно свободны, прежде чем отправляться в путь."
norway.1.o1: "Начать полное расследование"
norway.1.o2: "Оставаться в стороне"
norway.2.t: "Брак наследного принца Хокона"
norway.2.d: "Король Харальд объявил парламенту, что его наследник Хокон, наследный принц Норвегии, собирается жениться на своей подруге Метте-Марит Тьессем Хёйби.\n\nВыбор невесты вызвал некоторые недоумение, поскольку Хёйби не только не аристократического происхождения, но и имеет маленького сына, родившегося вне брака. Конечно, поддержка и финансирование правительства брака наследного принца обеспечены.\n\nИли нет?"
norway.2.o1: "Интригующе."
norway.3.t: "Хокон женится на Метте-Марит Тьессем Хёйби"
norway.3.d: "Норвежский парламент не высказал возражений против выбора будущей жены наследным принцем Хоконом. Счастливая пара стала мужем и женой в великой церемонии 25 августа 2001 года. Королевское потомство, кажется, лишь вопрос времени."
norway.3.o1: "Поздравляем!"
norway.4.t: "Норвегия присоединяется к добыче нефти."
norway.4.d: "После переговоров с британским парламентом Норвегия теперь присоединяется к Британскому договору о добыче нефти, что теперь позволяет Норвегии добывать нефть в Северном море."
norway.4.o1: "Пора добывать это черное золото!"
norway.5.t: "[NOR.GetName] предлагает возможные инвестиции в нефть"
norway.5.d: "Норвежская делегация связалась с нашими дипломатами и предлагает возможную сделку по нефти в их стране. Мы можем инвестировать в их страну, чтобы получить лучшую долю в их нефтяных акциях и некоторое влияние в их государстве."
norway.5.a: "Звучит как отличный план"
norway.5.b: "Нет"
norway.6.t: "[FROM.GetName] соглашается инвестировать!"
norway.6.d: "Делегации из [FROM.GetName] согласились инвестировать, и их государственные компании скоро отправятся в Норвегию."
norway.6.a: "Отлично"
norway.7.t: "[FROM.GetName] отклоняет предложение"
norway.7.d: "Делегации из [FROM.GetName] решили, что не хотят участвовать в инвестициях в нашу страну. Неутешительная потеря для нас обоих."
norway.7.a: "Неудача"
norway.81.t: "Норвегия предлагает пакеты помощи"
norway.81.d: "Норвежское правительство недавно направило запрос на предоставление нашим людям пакетов помощи, предназначенных конкретно для местного бизнеса. Разрешение на поступление этих пакетов помощи может означать, что норвежцы получат значительное влияние в нашей стране."
norway.81.a: "Пусть присылают"
norway.81.b: "Нет"
norway.82.t: "Правительство Палестины отклоняет предложение о помощи"
norway.82.d: "Палестинское правительство отклонило наше предложение о помощи, не указав реальной причины."
norway.82.a: "Окей"
norway.8.t: "Правительство Палестины одобряет пакеты помощи"
norway.8.d: "Палестинское правительство недавно одобрило наш запрос на предоставление помощи их предприятиям; как нам поступить?"
norway.8.a: "Малый пакет"
norway.8.b: "Средний пакет"
norway.8.c: "Большой пакет"
norway.91.t: "Где нам искать оружие?"
norway.91.d: "В настоящее время мы ищем подходящую страну для закупки оружия, и в настоящее время Соединенные Штаты и Германия — наши лучшие варианты."
norway.91.a: "Спросить Германию"
norway.91.b: "Спросить США"
norway.92.t: "Правительство Германии одобряет продажу оружия"
norway.92.d: "Немецкое правительство одобрило наш запрос на оружие, и их пакеты скоро прибынут."
norway.92.a: "Отлично"
norway.92.b: "Вообще-то, это слишком дорого..."
norway.9.t: "Правительство США одобряет продажу оружия"
norway.9.d: "Американское правительство одобрило наш запрос на оружие, и их пакеты скоро прибынут."
norway.9.a: "Отлично"
norway.9.b: "Вообще-то, это слишком дорого..."
norway.93.t: "[FROM.GetName] отклоняет продажу оружия"
norway.93.d: "[FROM.GetName] заявили, что не заинтересованы в продаже какого-либо своего оружия нам."
norway.93.a: "Черт"
norway.94.t: "Норвегия хотела бы купить оружие"
norway.94.d: "Норвежское правительство недавно связалось с нами по поводу продажи военного оружия и готово потратить большие деньги, чтобы получить его из наших запасов."
norway.94.a: "Окей"
norway.94.b: "Нет"
norway.10.t: "Правительство Норвегии хотело бы провести встречу"
norway.10.d: "Норвежское правительство заинтересовано в готовности нашего правительства установить новые каналы связи на случай обострения обстановки. В частности, они оказывают давление с целью подписания соглашения, которое запретит нам применять военную силу, если эти каналы связи будут нарушены. Также они заявили о своей заинтересованности в подписании торговых сделок для улучшения коммерческого обмена между нашими государствами."
norway.10.a: "Не вижу причин отказываться"
norway.10.b: "Нет"
norway.11.t: "Правительство России соглашается"
norway.11.d: "Российское правительство согласилось с запросами, которые наши дипломаты выдвинули на встрече, проведенной ранее."
norway.11.a: "Отлично"
norway.12.t: "Правительство России отклоняет"
norway.12.d: "Российское правительство отклонило запросы, которые наши дипломаты выдвинули на встрече, проведенной ранее."
norway.12.a: "Черт"
norway.14.t: "Вопрос о совместном проживании"
norway.14.d: "Наше государство признаёт право на гражданские союзы между двумя лицами, однако полноценные браки между лицами одного пола полностью не легализованы и легализованы не будут."
norway.14.a: "Шаг за шагом"
norway.16.t: "Миграционное законодательство"
norway.16.d: "До сих пор мы с относительной лёгкостью разрешали мигрантам въезд в наше государство, учитывая нашу малую численность населения и тот факт, что именно они строили эту нацию, когда она находилась на самом дне. Но сегодня дискуссия сместилась, и нам предстоит принять решение."
norway.16.b: "Мы Рады Всем!"
norway.16.a: "Пора ввести некоторые ограничения"
norway.100.t: "Норвегия хочет увеличить сотрудничество в Северном море"
norway.100.d: "Норвежское правительство заинтересовано в добыче большего количества нефти на Шетландских островах в надежде позволить большему количеству ресурсов поступать на рынок."
norway.100.a: "Окей"
norway.100.b: "Нет"
norway.101.t: "Правительство Великобритании принимает"
norway.101.d: "Британское правительство приняло наш запрос на добычу большего количества нефти на Шетландских островах и других частях Северного моря, что позволяет усилить экономическое сотрудничество."
norway.101.a: "Отлично"
norway.102.t: "Правительство Великобритании отклоняет"
norway.102.d: "Британское правительство отклонило наш запрос на добычу большего количества нефти на Шетландских островах и других частях Северного моря, разрушив любые надежды на большее экономическое сотрудничество."
norway.102.a: "Отлично"
norway.103.t: "Норвегия хочет построить для нас инфраструктуру"
norway.103.d: "В надежде построить проект, улучшающий путешествия и экономическую эффективность по всей Скандинавии, Норвегия заключила контракт с компанией Вейдекке, которая стремится построить необходимую инфраструктуру в нашей стране."
norway.103.a: "Окей"
norway.103.b: "Нет"
norway.104.t: "[FROM.GetName] на борту!"
norway.104.d: "Наши партнеры в [FROM.GetName] согласились разрешить строительство инфраструктуры для содействия проекту, на который мы заключили контракт с Вейдекке!"
norway.104.a: "Отлично"
norway.105.t: "[FROM.GetName] не заинтересованы!"
norway.105.d: "Наши партнеры в [FROM.GetName] не согласились разрешить строительство инфраструктуры для содействия проекту, на который мы заключили контракт с Вейдекке."
norway.105.a: "Неудача"
norway.106.t: "Норвегия влияет на нашу политику!"
norway.106.d: "Норвежское правительство недавно сделало несколько шагов, которые распространяют влияние в масштабах всего нашего общества."
norway.106.a: "Хорошо"
norway.107.t: "Норвежцы в Овальном кабинете"
norway.107.d: "Предложение о встрече на высоком уровне между нашим президентом и премьер-министром Норвегии было неожиданным. Норвежцы проинформировали нас, что у них есть грандиозные инвестиционные планы, которые они лично хотят представить нашей администрации. Должны ли мы принять их в Овальном кабинете?"
norway.107.a: "Пусть войдут"
norway.107.b: "Может, позже?"
norway.108.t: "Письмо с Запада"
norway.108.d: "Мы получили интересное письмо от богатой западной страны, Норвегии. По их словам, они хотят представить некоторые привлекательные инвестиционные планы для своей экономики."
norway.108.a: "Давайте их выслушаем"
norway.108.b: "Нет места западным варварам!"
norway.109.t: "Успешные переговоры"
norway.109.d: "Переговоры прошли успешно! Нашей делегации удалось заключить большое количество выгодных сделок."
norway.109.a: "Хорошо"
norway.110.t: "Провал нашей делегации"
norway.110.d: "К сожалению, нашей делегации не удалось достичь необходимых нам результатов. Мы даже провалили самый негативный сценарий событий!"
norway.110.a: "Какая катастрофа!"
NOR_norge_mining_decision_cat: "Норге Майнинг"
NOR_norge_mining_decision_cat_desc: "Норге Майнинг — это англо-норвежская горнодобывающая компания, которая фокусируется на разведке и добыче промышленных металлов и минералов, особенно лития, кварца и рутила.\n\nБолее высокий уровень исследований добычи будет соответствовать большему количеству ресурсов из решений (за уровень)."
