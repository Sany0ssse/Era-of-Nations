NOR_modernize_bergan_line: "Бергенская линия"
NOR_modernize_bergan_line_desc: "Бергенская линия — это живописная железнодорожная линия стандартной колеи длиной 231 миля, которая обеспечивает столь необходимую транспортировку и гибкость в нашей стране."
NOR_dovre_line: "Линия Довре"
NOR_dovre_line_desc: "Линия Довре — это главная линия длиной 484 км, на которую возложена задача эффективной доставки поставок по всей нашей стране."
