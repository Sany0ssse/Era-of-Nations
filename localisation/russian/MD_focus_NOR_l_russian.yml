NOR_UK_AGREED: "[ENG.GetFlag] §H[ENG.GetName]§! согласились с нашим запросом"
NOR_wind_farms: "Ветряные фермы"
NOR_wind_farms_desc: "Ветряные фермы были установлены в нескольких частях нашей страны в надежде на получение более чистой энергии для нашего государства с большей эффективностью."
NOR_bergen_line: "Бергенская линия"
NOR_bergen_line_desc: "Бергенская линия — это живописная железнодорожная линия стандартной колеи длиной 231 миля, которая обеспечивает столь необходимую транспортировку и гибкость в нашей стране."
NOR_taking_decision: " Уже имеет активное решение"