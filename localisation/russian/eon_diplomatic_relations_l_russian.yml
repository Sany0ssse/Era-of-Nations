l_russian:
 eon_diplomatic_relations_category:0 "Дипломатические отношения и представительства"
 eon_diplomatic_relations_category_desc:0 "Управляйте двусторонними отношениями, каждой направленной миссией, назначениями и выездом персонала. Открытие и изменение миссии требуют согласия и финансирования. Назначение обозначается нумерованной записью. Отзыв главы, закрытие миссии и разрыв отношений имеют разные последствия."
 eon_diplomatic_relations_propose:0 "Согласовать или восстановить отношения с [FROM.GetName]"
 eon_diplomatic_relations_propose_desc:0 "Запросить взаимное подтверждение прежних отношений либо восстановление после разрыва. Срок ответа — 30 дней. Исторические претензии сохраняются. Согласие само по себе не открывает посольство, не признаёт правительство, не отменяет санкции и не создаёт союз."
 eon_diplomatic_relations_mission_charge:0 "уровень поверенного"
 eon_diplomatic_relations_mission_charge_desc:0 "Согласовать открытие нашей миссии уровня поверенного в делах или изменение её формального класса. После согласия мы платим 10 политических очков и $0.01 млрд, затем $0.001 млрд ежемесячно. Главу нужно назначить отдельно. Миссия партнёра у нас — отдельное обязательство."
 eon_diplomatic_relations_mission_ambassador:0 "посольский класс"
 eon_diplomatic_relations_mission_ambassador_desc:0 "Согласовать открытие или повышение нашей миссии до посольского класса. После согласия мы платим 10 политических очков и $0.02 млрд, затем $0.002 млрд ежемесячно. Смена класса требует нового назначения. Обратная миссия независима; класс не добавляет дипломатических прав."
 eon_diplomatic_relations_propose_head:0 "Предложить новое назначение главы миссии в [FROM.GetName]"
 eon_diplomatic_relations_propose_head_desc:0 "Предложить новую нумерованную запись назначения главы и запросить агреман. Партнёр может согласиться или отказать в течение 30 дней. Согласованному главе ещё нужно уведомление о прибытии и вручение копии грамот. Прежний глава продолжает работу, пока рассматривается замена."
 eon_diplomatic_relations_decline:0 "Отклонить текущее предложение от [FROM.GetName]"
 eon_diplomatic_relations_decline_desc:0 "Закрыть только этот входящий запрос без списания ресурсов и отмены других соглашений. Причина отказа в агремане необязательна. После закрытия можно обратиться снова; бессрочной блокировки пары нет."
 eon_diplomatic_relations_withdraw:0 "Отозвать наше предложение [FROM.GetName]"
 eon_diplomatic_relations_withdraw_desc:0 "Бесплатно закрыть только наш исходящий запрос и соответствующую копию. Действующие миссии и другие контракты продолжаются. Новый запрос можно подать снова."
 eon_diplomatic_relations_credentials:0 "Уведомить о грамотах согласованного главы в [FROM.GetName]"
 eon_diplomatic_relations_credentials_desc:0 "Уведомить принимающий МИД о прибытии согласованного главы и передать копию грамот. Начинаются его полномочия. Выезд прежнего главы остаётся отдельной обязанностью."
 eon_diplomatic_relations_recall:0 "Отозвать нашего главу миссии из [FROM.GetName]"
 eon_diplomatic_relations_recall_desc:0 "Отозвать нынешнего главу и уведомить о временном поверенном. Согласованный класс миссии и отношения продолжаются. Организуйте выезд отозванного главы и затем предложите замену."
 eon_diplomatic_relations_persona_non_grata:0 "Объявить главу № [?FROM.eon_diplomatic_relations_active_head@ROOT|0] persona non grata"
 eon_diplomatic_relations_persona_non_grata_desc:0 "Объявить действующее назначение № [?FROM.eon_diplomatic_relations_active_head@ROOT|0] прибывшей миссии нежелательным. Объяснение необязательно. Отправитель прекращает полномочия этого главы и организует выезд. Согласованная замена либо другое рассматриваемое назначение остаётся отдельным вопросом."
 eon_diplomatic_relations_close:0 "Закрыть нашу миссию в [FROM.GetName]"
 eon_diplomatic_relations_close_desc:0 "Закрыть нашу миссию и её запрос назначения или класса. Принимающая страна должна защитить закрытые помещения и архивы и обеспечить условия выезда персонала. Отношения и обратная миссия продолжаются отдельно."
 eon_diplomatic_relations_close_host:0 "Прекратить согласие на миссию [FROM.GetName] у нас"
 eon_diplomatic_relations_close_host_desc:0 "Прекратить согласие на прибывшую миссию. Её помещения и архивы остаются под защитой, а условия выезда нужно подтвердить. Наша обратная миссия, отношения и другие соглашения учитываются отдельно."
 eon_diplomatic_relations_break:0 "Разорвать дипломатические отношения с [FROM.GetName]"
 eon_diplomatic_relations_break_desc:0 "Записать двусторонний разрыв, закрыть обе направленные миссии и их запросы, сохранить исторические претензии и обязанности защиты/выезда. Торговля, инвестиции, энергия, помощь, союзы, санкции и отношения с третьими странами автоматически не отменяются. Консульские отношения не считаются автоматически прекращёнными."
 eon_diplomatic_relations_exit_facilities:0 "Подтвердить заявленные условия выезда [FROM.GetName]"
 eon_diplomatic_relations_exit_facilities_desc:0 "Подтвердить заявление принимающей страны об обеспечении условий выезда. Выезд остаётся незавершённым до сообщения отправителя. Текущая запись выезда отправителя № [?FROM.eon_diplomatic_relations_current_departure@ROOT|0], назначение № [?FROM.eon_diplomatic_relations_current_departure_head@ROOT|0] (0 = другой персонал миссии). Подтверждение относится только к этой записи."
 eon_diplomatic_relations_report_departure:0 "Сообщить о выезде нашего персонала из [FROM.GetName]"
 eon_diplomatic_relations_report_departure_desc:0 "После подтверждения принимающей страны сообщить о выезде нашего персонала. Закрытые помещения и архивы остаются под защитой. Сообщение закрывает только текущую запись выезда № [?eon_diplomatic_relations_current_departure@FROM|0]; последующие обязанности остаются незавершёнными."
 eon_diplomatic_relations_notice.1.t:0 "Текущее дипломатическое предложение"
 eon_diplomatic_relations_notice.1.d:0 "Дипломатическое предложение ожидает решения. Проверьте условия в разделе Дипломатические отношения и представительства, затем согласитесь или откажите в течение 30 дней."
 eon_diplomatic_relations_notice.2.t:0 "Изменение дипломатического представительства"
 eon_diplomatic_relations_notice.2.d:0 "Изменились отношения или представительство. Проверьте согласованный класс, назначения и следующие действия в разделе Дипломатические отношения и представительства. Другие контракты и третьи страны сохраняют собственные условия."
 eon_diplomatic_relations_notice.3.t:0 "Запись выезда и защиты"
 eon_diplomatic_relations_notice.3.d:0 "Изменились условия выезда либо сообщение о выезде. Принимающая страна подтверждает заявленное обеспечение, отправитель сообщает о выезде. Защита закрытых помещений и архивов продолжается."
 eon_diplomatic_relations_notice.ok:0 "Принято к сведению"
 eon_diplomatic_relations_status:0 "Посмотреть дипломатическую запись с [FROM.GetName]"
 eon_diplomatic_relations_status_info_tt:0 "Текущие условия и назначения показаны в описании этого решения."
 eon_diplomatic_relations_status_desc:0 "Отношения с [FROM.GetName]: [eon_diplomatic_relations_relation_label]. Наша миссия: [eon_diplomatic_relations_mission_label]. Действующее назначение № [?eon_diplomatic_relations_active_head@FROM|0]; согласованное № [?eon_diplomatic_relations_approved_head@FROM|0]. Наше предложение: [eon_diplomatic_relations_outgoing_label], назначение № [?eon_diplomatic_relations_out_head@FROM|0]. Входящее предложение: [eon_diplomatic_relations_incoming_label], назначение № [?eon_diplomatic_relations_in_head@FROM|0]. Наш выезд: [eon_diplomatic_relations_departure_label]. Закрытые помещения и архивы: [eon_diplomatic_relations_protection_label]. Номера обозначают дипломатические назначения без вымышленного имени человека. Незавершённые обязанности выезда: [?eon_diplomatic_relations_departure_count@FROM|0]. Текущая запись выезда № [?eon_diplomatic_relations_current_departure@FROM|0], назначение № [?eon_diplomatic_relations_current_departure_head@FROM|0] (0 = другой персонал миссии)."
 eon_diplomatic_relations_accept_relations:0 "Согласовать отношения с [FROM.GetName]"
 eon_diplomatic_relations_accept_relations_desc:0 "Подтвердить или восстановить отношения, сохранив исторические претензии. Проверьте текущую дипломатическую запись перед решением."
 eon_diplomatic_relations_accept_charge:0 "Согласовать миссию уровня поверенного с [FROM.GetName]"
 eon_diplomatic_relations_accept_charge_desc:0 "Согласовать миссию партнёра уровня поверенного. Отправитель платит 10 политических очков и $0.01 млрд, затем $0.001 млрд ежемесячно. Проверьте текущую дипломатическую запись перед решением."
 eon_diplomatic_relations_accept_ambassador:0 "Согласовать посольский класс миссии с [FROM.GetName]"
 eon_diplomatic_relations_accept_ambassador_desc:0 "Согласовать посольскую миссию партнёра. Отправитель платит 10 политических очков и $0.02 млрд, затем $0.002 млрд ежемесячно. Проверьте текущую дипломатическую запись перед решением."
 eon_diplomatic_relations_accept_head:0 "Согласовать абстрактное назначение главы с [FROM.GetName]"
 eon_diplomatic_relations_accept_head_desc:0 "Дать агреман на входящее назначение № [?eon_diplomatic_relations_in_head@FROM|0]. Уведомление о прибытии и копия грамот остаются отдельным этапом. Проверьте текущую дипломатическую запись перед решением."
 eon_diplomatic_relations_persona_non_grata_approved:0 "Отказать согласованному назначению № [?FROM.eon_diplomatic_relations_approved_head@ROOT|0]"
 eon_diplomatic_relations_persona_non_grata_approved_desc:0 "Отозвать агреман на согласованное назначение № [?FROM.eon_diplomatic_relations_approved_head@ROOT|0] до начала полномочий. Объяснение необязательно. Прежний глава продолжает работу, если он есть; можно предложить новое назначение. Это согласование не означало прибытия, поэтому запись о выезде не создаётся."
