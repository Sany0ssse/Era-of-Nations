l_russian:
 eon_trade_treaty_no_pending_tt: "Ни одна из сторон не ожидает ответа на другую торговую заявку."
 eon_trade_treaty_response_valid_tt: "Это текущая заявка между обеими странами; условия заключения соглашения всё ещё выполняются."
 eon_trade_treaty_propose_desc: "Торговое соглашение повышает торговое влияние на §G100§! и взаимное мнение на §G25§!. После принятия обе страны также получают примерно §G1%§! влияния друг на друга. Перед подписанием текущие условия проверяются повторно."
 eon_trade_treaty_accept_desc: "[THIS.GetNameWithFlag] приняли соглашение. Обе страны получают §G100§! торгового влияния и §G25§! взаимного мнения, а также примерно §G1%§! влияния друг на друга."
 eon_trade_treaty_cancel_desc: "Прекращение соглашения убирает бонусы §R100§! торгового влияния и §R25§! взаимного мнения. Обе страны получают существующий штраф §R-25§! к мнению за разрыв соглашения; со временем он уменьшается."
