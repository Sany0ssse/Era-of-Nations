l_russian:
 eon_edu_request_join: "Подать заявку в оборонный союз под руководством [FROM.GetName]"
 eon_edu_request_join_desc: "Запросить добровольное вступление в этот европейский оборонный союз. У действующего руководителя есть 42 дня на ответ. Вступление состоится только после согласия и при сохранении разрешения национальной политики. Существующие союзы автоматически не меняются."
 eon_edu_accept_request: "Одобрить заявку [FROM.GetName]"
 eon_edu_accept_request_desc: "Согласиться принять эту страну в действующий оборонный союз. Вступление завершается только для актуальной заявки, если страна по-прежнему может присоединиться."
 eon_edu_reject_request: "Отклонить заявку [FROM.GetName]"
 eon_edu_reject_request_desc: "Закрыть текущую заявку этой страны без изменения её союза. Через 14 дней она сможет подать новую заявку."
 eon_edu_withdraw_request: "Отозвать нашу заявку в оборонный союз"
 eon_edu_withdraw_request_desc: "Отменить текущий запрос без вступления. Через 14 дней можно будет подать новую заявку."
 eon_edu_founder_requirements_tt: "Действующая суверенная страна ЕС с принятой реформой безопасности, мандатом министра иностранных дел и необходимым влиянием может создать этот необязательный оборонный союз. Она должна быть вне других союзов, соблюдать национальные правила вступления и не вести наступательную войну."
 eon_edu_request_requirements_tt: "Наша страна должна быть действующим членом ЕС, суверенной и вне другого союза. Сохраняются национальное разрешение на вступление, нейтралитет и порог мировой напряжённости. Получатель должен быть действующим руководителем этого оборонного союза. Новую заявку нельзя отправить при незавершённом запросе или в течение 14 дней после его закрытия."
 eon_edu_reply_requirements_tt: "Только действующий руководитель может ответить на непросроченную заявку этой страны в тот же оборонный союз. Для вступления также требуется соблюдение текущей национальной политики заявителя и отсутствие другого союза."
 eon_edu_withdraw_requirements_tt: "У нашей страны должна быть непросроченная заявка."
 eon_edu_request_title: "Заявка в оборонный союз"
 eon_edu_request_desc: "Страна ЕС запросила вступление в наш оборонный союз. Откройте «Решения → Европейский союз», чтобы принять или отклонить текущую заявку в течение 42 дней. Это сообщение служит уведомлением; решения всегда показывают актуальную заявку."
 eon_edu_response_title: "Рассмотрение заявки завершено"
 eon_edu_accepted_desc: "Наша заявка одобрена, и вступление в действующий оборонный союз завершено."
 eon_edu_rejected_desc: "Наша заявка отклонена. Участие нашей страны в союзах не изменилось. Через 14 дней можно будет подать новую заявку."
 eon_edu_withdrawn_desc: "Мы отозвали заявку. Через 14 дней можно будет подать новую заявку."
 eon_edu_expired_desc: "42-дневный срок ответа истёк без вступления. Через 14 дней можно будет подать новую заявку."
 eon_edu_invalidated_desc: "Заявка утратила актуальность: изменились союз, его руководство или условия участия. Вступление по этому запросу не состоялось. Через 14 дней можно будет подать новую заявку, если текущие условия это позволяют."
 eon_edu_creation_failed_desc: "Оборонный союз не удалось создать. Подтверждение создания и объявление о членстве не выданы. Перед новой попыткой проверьте текущую национальную политику и участие в другом союзе."
 eon_edu_departure_failed_desc: "Выход из оборонного союза не удалось завершить. Фактический альянс и его учёт сохранены. Формальный выход будет повторён, когда станет возможна заблокированная передача руководства, исключение или расформирование."
 eon_edu_formed_title: "Создан европейский оборонный союз"
 eon_edu_formed_desc: "Страна ЕС создала необязательный европейский оборонный союз в рамках принятой реформы безопасности. Другие подходящие страны ЕС могут добровольно подать заявку. Новый альянс автоматически не меняет участие в НАТО или других союзах стран ЕС."
 eon_edu_ok: "Понятно"
