 ABK_state_stabilization_idea: "Стабилизация республики"
 ABK_state_stabilization_idea_desc: "После войны Абхазия осталась обременённой разрушенной инфраструктурой, слабыми институтами, недофинансированной администрацией и хрупким внутренним порядком. Правительство теперь стремится стабилизировать республику через более жёсткий контроль над местными властями, улучшение налоговых сборов, расширение полицейских полномочий и постепенное восстановление государственного управления."
 ABK_revived_wine_industry_idea: "Возрождённая винодельческая промышленность"
 ABK_revived_wine_industry_idea_desc: "Виноделие оставалось одним из немногих секторов экономики Абхазии, который можно было реально восстановить после войны. Возрождая виноградники, открывая винодельни и восстанавливая экспортные связи, республика постепенно восстанавливает традиционный источник дохода и укрепляет местную деловую активность."
 ABK_mafia_idea: "Связи с мафией"
 ABK_mafia_idea_desc: "В нестабильные послевоенные годы слабые институты Абхазии оставили много места для криминальных посредников, местных силовиков и теневых сетей, которые укоренились в повседневной политической и экономической жизни. То, что начиналось как неформальное соглашение об удобстве, постепенно превратилось в систему взаимной зависимости: государство терпит нелегальных акторов в обмен на доступ к деньгам, силовому рычагу и неформальным каналам контроля. Хотя такие связи помогают поддерживать республику в краткосрочной перспективе, они также ослабляют государственную власть, разъедают правовые институты и стирают грань между правительством и организованной преступностью."
 ABK_mafia_income_idea: "Пакт государства с мафией"
 ABK_mafia_income_idea_desc: "Отказавшись от серьёзных попыток искоренить преступный мир, абхазские власти вместо этого вступили с ним в открытое соглашение. В обмен на защиту, политическую терпимость и избирательный доступ к государственным структурам криминальные сети теперь помогают поддерживать денежный поток в республике и насаждать неформальный порядок там, где формальные институты остаются слабыми. Этот пакт даёт немедленное финансовое облегчение, но ещё больше подрывает государственную власть и привязывает выживание государства к теневым интересам."
 ABK_mafia2_idea: "Доходы от транзита наркотиков"
 ABK_mafia2_idea_desc: "По мере ослабления государственного контроля и расширения криминальной защиты Абхазия всё больше привязывается к маршрутам наркотрафика, проходящим через Кавказ. Прибыль, генерируемая этими сетями, быстро просачивается в политическую систему, обогащая посредников, развращая чиновников и наделяя властью тех, кто готов защищать торговлю силой. Хотя властям трудно сопротивляться такому доходу, зависимость от него неуклонно подрывает общественный порядок, наносит ущерб репутации республики и углубляет разложение государственных институтов."
 ABK_mafia3_idea: "Контрабандная экономика"
 ABK_mafia3_idea_desc: "То, что когда-то оправдывалось как временное средство выживания, превратилось в центральный столп абхазской экономики. Контрабандное топливо, нелегальные потребительские товары, необлагаемые налогом грузы и криминальный транзит теперь движутся через сети, связывающие бизнесменов, чиновников и силовые структуры в единую теневую систему. Эта подпольная экономика поддерживает денежный поток в республике и смягчает последствия изоляции, но она также подавляет легальное развитие, укореняет коррупцию и оставляет государственные финансы во всё большей зависимости от сил, которые государство не может полностью контролировать."
 ABK_mafia4_idea: "Наркогосударственные структуры"
 ABK_mafia4_idea_desc: "Различие между правительственной властью, органами безопасности и организованной преступностью фактически исчезло. В поисках выживания и финансовой автономии Абхазия позволила криминальным доходам, наркотическим деньгам и контрабандному покровительству встроиться в основы самого государства. Результат — режим, который всё ещё может функционировать и даже извлекать прибыль, но только через глубокую коррупцию, региональную изоляцию и неуклонную дезинтеграцию законного управления. Республика остаётся на плаву, но её институты теперь служат теневым интересам не меньше, чем общественным."
