l_russian:

 #Focus Tree
 abkhazia_focus: "Древо фокусов Абхазии"
 #Starting Focus
 ABK_In_New_Millenium: "Абхазия в новом тысячелетии"
 ABK_In_New_Millenium_desc: "Наша страна вступает в новое тысячелетие далеко не в лучшем состоянии. Коррупция разъедает государство, инфраструктура разрушена после войны и не восстановлена. Мы стоим на распутье: восстановиться с чужой помощью, положиться только на себя или погрузиться в хаос."
 #Armenian & Minority Policy Branch
 ABK_CIS_create: "Получить статус наблюдателя в СНГ"
 ABK_CIS_create_desc: "Поиск признания на постсоветском пространстве может придать нам легитимности, даже если полноправное членство недостижимо."
 ABK_Rights_for_Armenians: "Предоставить права армянам"
 ABK_Rights_for_Armenians_desc: "Армянская диаспора сильна и влиятельна. Их политическая интеграция может стабилизировать нашу внутреннюю демографию."
 ABK_Purge_Bagramyan_Brigade: "Разоружить батальон Баграмяна"
 ABK_Purge_Bagramyan_Brigade_desc: "Армянские воинские подразделения внутри наших границ — это государство в государстве. Их необходимо подчинить или ликвидировать, чтобы обеспечить истинный суверенитет."
 ABK_Get_Rid_Armenians: "Уменьшить армянское влияние"
 ABK_Get_Rid_Armenians_desc: "Чтобы сохранить абхазскую идентичность, мы должны ограничить политическую власть армянского меньшинства."
 ABK_Turkey_Support: "Заручиться поддержкой Турции"
 ABK_Turkey_Support_desc: "Турция — региональная держава. Сближение с Анкарой может уравновесить российское и грузинское влияние."
 ABK_Support_Islam: "Поддержать исламизацию Абхазии"
 ABK_Support_Islam_desc: "Укрепление связей с мусульманским миром через Турцию и Азербайджан может привлечь новых инвесторов и союзников."
 ABK_Negotiate_Azer_Support: "Договориться о поддержке Азербайджана"
 ABK_Negotiate_Azer_Support_desc: "У Баку есть энергия и деньги. Давайте заручимся их поддержкой нашей независимости."
 ABK_Support_Armenian_Diaspora: "Поддержать инвестиции армянской диаспоры"
 ABK_Support_Armenian_Diaspora_desc: "Использовать богатство глобальной армянской общины для восстановления нашей экономики."
 ABK_Legacy_Colchis: "Наследие Колхиды"
 ABK_Legacy_Colchis_desc: "Мы наследники древней Колхиды. Наша история предшествует современным конфликтам, и наша культура должна быть сохранена."
 ABK_Grant_Parlaments_Seats_Armenians: "Предоставить армянам места в парламенте"
 ABK_Grant_Parlaments_Seats_Armenians_desc: "Представительство может способствовать лояльности и стабильности. Дайте им голос в правительстве."
 ABK_Abkhazo_Armenian_State: "Абхазо-армянское государство"
 ABK_Abkhazo_Armenian_State_desc: "Модель двунационального государства может обеспечить мир между двумя крупнейшими этническими группами, связав Абхазию и Армению через совместное управление."
 #Russia Relation Branch
 ABK_Big_Brother: "Наш старший брат?"
 ABK_Big_Brother_desc: "России не избежать. Вопрос не в том, будем ли мы сближаться, а в том, насколько тесными будут эти связи."
 ABK_Absolute_Loyality: "Абсолютная лояльность России"
 ABK_Absolute_Loyality_desc: "Полная интеграция в сферу влияния Москвы гарантирует безопасность, но стоит суверенитета."
 ABK_Foreign_Business: "Легализовать иностранный бизнес"
 ABK_Foreign_Business_desc: "Позволить российским олигархам свободно инвестировать. Капитал течёт туда, где гарантирована защита."
 ABK_Russian_Troops: "Попросить Россию ввести больше войск"
 ABK_Russian_Troops_desc: "Наша армия устарела. Российские базы на нашей земле сдержат грузинскую агрессию."
 ABK_Russian_Union_State: "Союзное государство с Россией"
 ABK_Russian_Union_State_desc: "Решающий шаг. Стать частью большого российского союза."
 ABK_Pragmatic_Distance: "Прагматичная дистанция"
 ABK_Pragmatic_Distance_desc: "Нам нужна помощь, но без привязки. Сохранять независимость, принимая помощь."
 ABK_Nationalize_Business: "Национализировать российский бизнес"
 ABK_Nationalize_Business_desc: "Российские компании эксплуатируют наши ресурсы. Пришло время вернуть то, что принадлежит нам."
 ABK_Own_Training: "Обучение своими силами"
 ABK_Own_Training_desc: "Зависимость от иностранных инструкторов — это слабость. Создадим свои военные академии."
 ABK_Request_Aid: "Запросить больше помощи"
 ABK_Request_Aid_desc: "Дефицит бюджета критичен. Москва должна открыть казну."
 ABK_Freedom_Patronage: "Свобода под покровительством"
 ABK_Freedom_Patronage_desc: "Тонкий баланс. Официально независимы, но фактически защищены."
 #Stabilization & Economy Branch
 ABK_Stabilization_Country: "Стабилизация страны"
 ABK_Stabilization_Country_desc: "Абхазия вступает в новое тысячелетие ослабленной войной, экономическим хаосом и хрупкими государственными институтами. Прежде чем республика сможет двинуться вперёд, правительство должно восстановить порядок, укрепить управление и стабилизировать государственные финансы."
 ABK_Increase_Abilitties_of_state: "Расширить полномочия главы государства"
 ABK_Increase_Abilitties_of_state_desc: "Централизовать власть, чтобы быстро провести необходимые реформы."
 ABK_Issue_Abkhazian_Passports: "Выдать абхазские паспорта"
 ABK_Issue_Abkhazian_Passports_desc: "Гражданство определяет нацию; каждый должен быть документально оформлен, чтобы заявить о своих правах."
 ABK_Revive_Wine_Industry: "Возродить винодельческую промышленность"
 ABK_Revive_Wine_Industry_desc: "Россия готова помочь нашим фермерам развивать виноделие, естественно, в обмен на усиление российского влияния в Абхазии."
 ABK_RZhD_Contracts: "Контракты с РЖД"
 ABK_RZhD_Contracts_desc: "Российские железные дороги контролируют наши транспортные связи. Добьёмся лучших условий для транзита."
 ABK_Pizdatiy_Akvafon: "Аквафон"
 ABK_Pizdatiy_Akvafon_desc: "Телекоммуникации жизненно важны. Модернизируем сеть любыми средствами."
 ABK_Build_Tourist_Attractions: "Построить туристические аттракционы"
 ABK_Build_Tourist_Attractions_desc: "Черноморское побережье — наше главное богатство. Сделаем его снова местом назначения."
 ABK_Turkish_Oil: "Нефтяные поставки из Турции"
 ABK_Turkish_Oil_desc: "Обойти российскую энергетическую зависимость. Импортировать топливо турецкими танкерами."
 ABK_turkish_oil_idea_tt: "Получить национальный дух §YТурецкие нефтяные поставки§!:\n  £factory_output_texticon  §G+10%§! объём промышленного производства\n  Регион §Y706§!: §G+2§! £oil_texticon\n\n  Бонус исчезает, если мы вступаем в войну с §YТурцией§!."
 ABK_turkish_oil_idea_modifier_tt: "Регион §Y706§!: §G+2§! £oil_texticon"
 ABK_A_Mobile: "А-Мобайл"
 ABK_A_Mobile_desc: "Расширить мобильное покрытие до каждой деревни. Связь — это прогресс."
 ABK_Future_Inguri_Dam: "Будущее Ингурской ГЭС"
 ABK_Future_Inguri_Dam_desc: "Плотина даёт энергию, но является предметом спора с Грузией. Обеспечим наши энергетические поставки."
 ABK_attempsts_at_devirsification: "Попытки диверсификации"
 ABK_attempsts_at_devirsification_desc: "Мы не можем полагаться только на туризм и помощь; необходимы новые отрасли, чтобы снизить долгосрочную зависимость."
 ABK_Allow_Private_Mining: "Разрешить частный майнинг криптовалют"
 ABK_Allow_Private_Mining_desc: "Дешёвое электричество привлекает майнеров. Пусть частный сектор возглавит крипто-бум."
 ABK_Goverment_Crypto_Mining: "Государственный майнинг криптовалют"
 ABK_Goverment_Crypto_Mining_desc: "Прибыль от криптовалют должна идти в государственную казну, а не в частные кошельки."
 ABK_Bitcoin_State: "Государство-биткоин"
 ABK_Bitcoin_State_desc: "Стать убежищем для цифровой валюты. Будущее финансов децентрализовано."
 ABK_Sochi_Olympics_Investments: "Инвестиции в Олимпиаду в Сочи"
 ABK_Sochi_Olympics_Investments_desc: "Использовать близость к Сочи. Перехватить поток инвестиций."
 ABK_Tangerine_Yards: "Мандариновые сады"
 ABK_Tangerine_Yards_desc: "Абхазские мандарины легендарны. Расширим сельское хозяйство."
 ABK_Forced_Co_Management: "Принудительное соуправление"
 ABK_Forced_Co_Management_desc: "Грузия претендует на долю в плотине. Заставим их заключить соглашение об управлении."
 ABK_Rural_Development: "Развитие сельских районов"
 ABK_Rural_Development_desc: "Деревни пустеют. Стимулируем людей возвращаться на землю."
 ABK_No_Concessions_Georgians: "Никаких уступок грузинам"
 ABK_No_Concessions_Georgians_desc: "Мы им ничего не должны. Плотина наша."
 ABK_Request_Foreign_Experts: "Запросить иностранных экспертов"
 ABK_Request_Foreign_Experts_desc: "Нам не хватает технических знаний. Наймём специалистов из-за рубежа."
 ABK_Free_Economic_Zone: "Свободные экономические зоны"
 ABK_Free_Economic_Zone_desc: "Налоговые каникулы и дерегуляция привлекут иностранный капитал."
 ABK_Rossneft_Contract: "Контракт с Роснефтью"
 ABK_Rossneft_Contract_desc: "Партнёрство с российским энергетическим гигантом. Обеспечит топливо и финансирование."
 ABK_rossneft_contract_idea_tt: "Получить национальный дух §YКонтракт с Роснефтью§!:\n  £factory_output_texticon  §G+10%§! производство на заводах\n  Регион §Y706§!: §G+3§! £oil_texticon\n\n  Бонус исчезает, если мы вступаем в войну с §YРоссией§!."
 ABK_rossneft_contract_idea_modifier_tt: "Регион §Y706§!: §G+3§! £oil_texticon"
 #Refugees & Culture
 ABK_Issues_of_the_refuguees: "Проблема беженцев"
 ABK_Issues_of_the_refuguees_desc: "Тысячи людей остаются перемещёнными. Их возвращение — гуманитарная и политическая необходимость."
 ABK_Circassian_Repatriation_Negotiations: "Переговоры о репатриации черкесов"
 ABK_Circassian_Repatriation_Negotiations_desc: "Пригласить черкесскую диаспору вернуться на землю предков."
 ABK_Support_Abkhasian_Culture: "Поддержать абхазскую культуру"
 ABK_Support_Abkhasian_Culture_desc: "Язык, искусство и традиции должны финансироваться, чтобы выжить в эпоху глобализации."
 #Internal Security & Mafia
 ABK_Invest_SGB: "Инвестировать в СГБ"
 ABK_Invest_SGB_desc: "Служба государственной безопасности нуждается в лучшем оборудовании и финансировании для поддержания порядка."
 ABK_Ally_With_Mafia: "Заключить союз с мафией"
 ABK_Ally_With_Mafia_desc: "Государственные институты республики слишком слабы, чтобы полностью искоренить преступный мир, и слишком хрупки, чтобы противостоять каждому местному влиятельному лицу. Вместо того чтобы тратить скудные ресурсы на прямой конфликт, мы можем заключить с подпольем соглашение: они будут поддерживать денежный поток и поддерживать порядок там, где государство не справляется, а мы будем смотреть на это сквозь пальцы. Такое соглашение может обеспечить быстрое облегчение и укрепить неформальный контроль, но оно обойдётся ценой законности, подотчётности и долгосрочной целостности республики."
 ABK_Benefits_Drug_Trade: "Выгода от наркоторговли"
 ABK_Benefits_Drug_Trade_desc: "Наркотрафик, идущий через Кавказ, предлагает немедленный источник денег для правительства, испытывающего нехватку доходов и окружённого неопределённостью. Терпимо относясь к этим сетям и тихо извлекая из них прибыль, государство может получить столь необходимые средства и расширить влияние тех, кто связан с теневой экономикой. Однако каждый доход, полученный через этот трафик, будет углублять коррупцию, ободрять криминальных акторов и ещё больше разрушать институты, которые должны защищать Абхазию от внутреннего разложения."
 ABK_Smuggle_Operation: "Контрабандные операции"
 ABK_Smuggle_Operation_desc: "Изоляция, слабое правоприменение и пористые региональные связи сделали контрабанду одним из самых прибыльных секторов абхазской теневой экономики. При правильной организации эти маршруты могут приносить топливо, товары, контрабанду и твёрдую валюту в объёмах, намного превышающих возможности формальной экономики. Однако превращение контрабанды в терпимую систему выживания также привяжет государство к криминальным структурам и сделает будущую экономическую нормализацию гораздо более трудной."
 ABK_Narco_State_Of_Caucasus: "Наркогосударство Кавказа"
 ABK_Narco_State_Of_Caucasus_desc: "То, что начиналось как удобное сотрудничество с криминальными сетями, теперь может стать полноценной моделью управления. Позволив доходам от наркотиков, контрабандным маршрутам и теневому покровительству определять политическую экономию республики, Абхазия может обеспечить мощный и устойчивый поток незаконных доходов. Но такой путь превратит само государство, заменив законное управление криминальной зависимостью, оттолкнув соседей и разрушив институты, призванные сохранять республику."
 ABK_Start_Police_Raid: "Начать полицейские рейды"
 ABK_Start_Police_Raid_desc: "Коррупция зашла слишком далеко. Очистим улицы железной рукой."
 ABK_Fight_Narco_Traffic: "Бороться с наркотрафиком"
 ABK_Fight_Narco_Traffic_desc: "Наркотики уничтожают нашу молодёжь. Ударим по торговцам."
 ABK_Expose_Georgian_Traffickers: "Разоблачить грузинских торговцев"
 ABK_Expose_Georgian_Traffickers_desc: "Использовать разведку, чтобы показать, кто на самом деле получает выгоду от наркоторговли."
 ABK_Promote_Healthy_Lifestyle: "Пропагандировать здоровый образ жизни"
 ABK_Promote_Healthy_Lifestyle_desc: "Профилактика лучше лечения. Построим более здоровую нацию."
 #Diplomacy & Recognition
 ABK_UN_Mandate: "Расширить мандат ООН"
 ABK_UN_Mandate_desc: "Миссия ООН истекает. Продлим её, чтобы получить международное влияние."
 ABK_artshakh_friend: "Дружба с Арцахом"
 ABK_artshakh_friend_desc: "Признать Нагорный Карабах. Они понимают нашу борьбу."
 ABK_transnistria_friend: "Дружба с Приднестровьем"
 ABK_transnistria_friend_desc: "Связаться с Тирасполем. Ещё один замороженный конфликт на постсоветском пространстве."
 ABK_soo_friend: "Дружба с Южной Осетией"
 ABK_soo_friend_desc: "Наши братья на севере. Укрепим связи с Цхинвалом."
 ABK_CIS_Second_Create: "Создать СНГ-2"
 ABK_CIS_Second_Create_desc: "Первоначальное СНГ нас подвело. Давайте создадим новый союз непризнанных государств, объединённых общей борьбой и стремлением к взаимному выживанию."
 #Georgia & Conflict Branch
 ABK_Shadows_of_the_Struggle: "Тени борьбы"
 ABK_Shadows_of_the_Struggle_desc: "Война никогда по-настоящему не заканчивалась. Она лишь ушла в тень."
 ABK_Saving_what_we_have: "Сохранить то, что имеем"
 ABK_Saving_what_we_have_desc: "Закрепим наши достижения, прежде чем стремиться к большему."
 ABK_Request_Foreign_Protection: "Запросить иностранную защиту"
 ABK_Request_Foreign_Protection_desc: "Нам нужны гарантии безопасности от крупной державы."
 ABK_Ask_For_Recognition: "Просить признания"
 ABK_Ask_For_Recognition_desc: "Дипломатическое признание — ключ к суверенитету."
 ABK_Aiaaira: "Аиааира!"
 ABK_Aiaaira_desc: "Победа! Наша независимость обеспечена навеки."
 ABK_Join_CSTO: "Вступить в ОДКБ"
 ABK_Join_CSTO_desc: "Войти в организацию договора о коллективной безопасности."
 ABK_Negotiate_With_Monadire: "Переговоры с Монадире и Гелаевым"
 ABK_Negotiate_With_Monadire_desc: "Полевые командиры держат власть в тени. Пригласим их за стол переговоров."
 ABK_Dialogue_With_Georgia: "Начать переговоры с Грузией"
 ABK_Dialogue_With_Georgia_desc: "Война затратна. Возможно, мир достижим."
 ABK_Negotiate_Large_Autonomy: "Договориться о широкой автономии"
 ABK_Negotiate_Large_Autonomy_desc: "Вернуться в состав Грузии, но только на наших условиях."
 ABK_Federalization_With_Georgia: "Федерализация с Грузией"
 ABK_Federalization_With_Georgia_desc: "Федеративное государство, где мы сами определяем свою судьбу."
 ABK_Reform_Of_Prosperity: "Реформы процветания"
 ABK_Reform_Of_Prosperity_desc: "Мир приносит торговлю. Восстановим экономику вместе."
 ABK_reforms_of_prosperity_idea: "Реформы процветания"
 ABK_Negotiate_With_Osetia: "Переговоры с Осетией"
 ABK_Negotiate_With_Osetia_desc: "Координация стратегии с нашими осетинскими союзниками."
 ABK_Svanetia_Rebellion: "Восстание в Сванетии"
 ABK_Svanetia_Rebellion_desc: "Поддержать повстанцев в грузинских горах. Ослабит Тбилиси."
 ABK_Iberian_Federation: "Иберийская федерация"
 ABK_Iberian_Federation_desc: "Новый союз кавказских народов, независимый от Москвы и Тбилиси."

 abkh.1.t: "Абхазия хочет стать ассоциированным членом СНГ"
 abkh.1.d: "Абхазия уже давно стремится к большему признанию, чем имеет сейчас. Они активно выражали желание участвовать в политических процессах в рамках СНГ и запросили особый статус внутри организации."
 abkh.1.a: "Мы согласны"
 abkh.1.b: "Нас это не интересует."
 abkh.5.t: "Абхазия вступает в переговоры"
 abkh.5.d: "Впервые за многие годы абхазское правительство объявило о своей готовности к конструктивному диалогу с нами. Похоже, реальность заставила их действовать рационально."
 abkh.5.a: "Мы за диалог"
 abkh.5.b: "Нас это не интересует."
 abkh.6.t: "[FROM.GetName] согласился на предложение"
 abkh.6.d: "Их правительство согласилось с нашим предложением, что, несомненно, хорошо."
 abkh.6.a: "Отлично"
 abkh.7.t: "[FROM.GetName] отказался от предложения"
 abkh.7.d: "Их правительство отклонило наше предложение, что, несомненно, расстраивает нас."
 abkh.7.a: "Печально"
 abkh.8.t: "Абхазское правительство просит больше автономии"
 abkh.8.d: "Правительство Абхазии готово вести диалог об автономии в составе нашего государства, но сразу запрашивает расширенную автономию и гарантии на переходный период."
 abkh.8.a: "Мы согласны"
 abkh.8.b: "Нас это не интересует."
 abkh.9.t: "Абхазия готова стать нашим автономным регионом"
 abkh.9.d: "Правительство Абхазии полностью готово снова стать частью нашей страны, и это наконец-то мирное решение вопроса."
 abkh.9.a: "Мы согласны"
 abkh.9.b: "Нас это не интересует."
 abkh.10.t: "Абхазия просит защиты"
 abkh.10.d: "Правительство Абхазии попросило нас о защите, поскольку они явно опасаются нападения со стороны соседей, что и привело их к нам."
 abkh.10.a: "Мы согласны"
 abkh.10.b: "Нас это не интересует."
 abkh.11.t: "Абхазское правительство вступает в диалог с нами"
 abkh.11.d: "Абхазское правительство объявило о мирной инициативе по отношению к нам. Они готовы подписать мирное соглашение с взаимными гарантиями, чтобы наконец разрешить наш конфликт."
 abkh.11.a: "Мы согласны"
 abkh.11.b: "Нас это не интересует."
 abkh.12.t: "Абхазское правительство вступает в диалог с нами"
 abkh.12.d: "Абхазское правительство предложило нам взаимные военные гарантии, зная, что наш южный сосед может напасть в любой момент."
 abkh.12.a: "Мы согласны"
 abkh.12.b: "Нас это не интересует."
 abkh.13.t: "Новая федерация"
 abkh.13.d: "Абхазское правительство предлагает нам создать совместное федеративное государство, и они, похоже, полны решимости создать новый центр силы на Кавказе."
 abkh.13.a: "Мы согласны"
 abkh.13.b: "Нас это не интересует."
 abkh.14.t: "Абхазия хочет стать союзным государством"
 abkh.14.d: "Абхазское правительство объявило о своем желании присоединиться к нашему проекту Союзного государства, и, похоже, они поняли, куда дует ветер перемен."
 abkh.14.a: "Мы согласны"
 abkh.14.b: "Нас это не интересует."
 abkh.15.t: "Абхазия запрашивает присутствие наших войск"
 abkh.15.d: "Абхазское правительство попросило нас разместить наши войска на их территории и обучить их армейские подразделения."
 abkh.15.a: "Мы согласны"
 abkh.15.b: "Нас это не интересует."
 abkh.17.t: "Мандат ООН продлён"
 abkh.17.d: "Миссия наблюдателей ООН в Грузии (UNOMIG) продлена ещё на один год. Международное сообщество подтверждает свою приверженность мирному урегулированию грузино-абхазского конфликта. Для Абхазии это продление означает сохранение дипломатического признания её в качестве стороны переговоров и новый шанс взаимодействовать с международными партнёрами. И Грузия, и де-факто власти приветствуют решение, надеясь на снижение напряжённости."
 abkh.17.a: "Дипломатическая победа"
 abkh.18.t: "Абхазия просит наши инвестиции"
 abkh.18.d: "Абхазское правительство просит нас инвестировать в их экономику из-за их тяжёлого положения."
 abkh.18.a: "Мы согласны"
 abkh.18.b: "Нас это не интересует."
 abkh.19.t: "Абхазия просит наши инвестиции"
 abkh.19.d: "Абхазское правительство просит нас инвестировать в их экономику из-за их тяжёлого положения."
 abkh.19.a: "Мы согласны"
 abkh.19.b: "Нас это не интересует."
 abkh.20.t: "Абхазия хочет создать общее государство"
 abkh.20.d: "Абхазские политики давно говорят о братстве абхазов и армян перед лицом угроз со стороны кавказских соседей. Теперь инициатива достигла пика, и они намерены стать частью нашей страны как ключевой компонент новообразованного абхазо-армянского государства."
 abkh.20.a: "Мы согласны"
 abkh.20.b: "Нас это не интересует."
 abkh.21.t: "Абхазия предлагает свою версию СНГ"
 abkh.21.d: "Абхазия предлагает нам создать свою собственную организацию, подобную СНГ: Содружество непризнанных государств."
 abkh.21.a: "Мы согласны"
 abkh.21.b: "Нас это не интересует."
 abkh.22.t: "Абхазия зовёт нас на войну"
 abkh.22.d: "Абхазия начала войну против Грузии и приглашает нас участвовать в военной операции против этой страны."
 abkh.22.a: "Мы согласны"
 abkh.22.b: "Нас это не интересует."
 abkh_news.1.t: "Армения и Абхазия создают единое государство"
 abkh_news.1.d: "На Кавказе произошёл неожиданный поворот событий. Абхазия и Армения уже полностью изменили направление своих отношений, и теперь две страны подписывают документы о создании единого государства. Удивительное развитие!"
 abkh_news.1.a: "Вау"
 abkh_news.2.t: "Федерализация Грузии"
 abkh_news.2.d: "Похоже, ещё один конфликт наконец разрешён. Грузия урегулировала давнюю проблему с Абхазией и стала федеративным государством, что, несомненно, принесёт больше стабильности на Кавказ."
 abkh_news.2.a: "Вау"

