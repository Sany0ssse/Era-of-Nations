 eon_investment_offer_v2_ui_terms_tt:0 "Текущая редакция: [?ROOT.eon_investment_offer_v2_epoch@THIS|0]. Регион: [?ROOT.eon_investment_offer_v2_state@THIS.GetName]. Тип здания: [?ROOT.eon_investment_offer_v2_type@THIS|0], количество: [?ROOT.eon_investment_offer_v2_amount@THIS|0]. Взнос инвестора: $[?ROOT.eon_investment_offer_v2_cost@THIS|2]; взнос получателя: $[?ROOT.eon_investment_offer_v2_cofunding@THIS|2]. Дней на единицу: [?ROOT.eon_investment_offer_v2_duration@THIS|0], всего: [?ROOT.eon_investment_offer_v2_total_duration@THIS|0]. Дней для ответа: [?ROOT.eon_investment_offer_v2_days@THIS|0]. Статус/результат: [?ROOT.eon_investment_offer_v2_status@THIS|0], редакция последнего результата: [?ROOT.eon_investment_offer_v2_result_epoch@THIS|0]. Окончательное согласие снова проверяет средства, мир, владение, контроль и доступные места. Статусы: 1 отправлено, 2 получено, 3 обработка, 5 начато, 6 отказ, 7 отозвано, 8 истекло, 9 утратило силу, 10 запуск не удался."
 eon_investment_offer_v2_legacy.t:0 "Прежнее инвестиционное предложение снято"
 eon_investment_offer_v2_legacy.d:0 "Неотвеченное предложение прежней системы снято без платежа, возврата или штрафа. Уже начатое строительство продолжается. Выберите проект заново и отправьте предложение; новые предложения рассматриваются в дипломатии страны."
