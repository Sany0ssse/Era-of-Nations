l_russian:
 eon_investment_offer_v2_category:0 "Инвестиционные предложения"
 eon_investment_offer_v2_category_desc:0 "Рассматривайте и отвечайте на текущие предложения по странам. Основная сумма не списывается до окончательного согласия. Срок предложения — 90 игровых дней; инвестор может вести одно исходящее предложение одновременно."
 eon_investment_offer_v2_review:0 "Рассмотреть предложение от [FROM.GetName]"
 eon_investment_offer_v2_accept:0 "Принять текущее предложение от [FROM.GetName]"
 eon_investment_offer_v2_decline:0 "Отклонить текущее предложение от [FROM.GetName]"
 eon_investment_offer_v2_withdraw:0 "Отозвать предложение для [FROM.GetName]"
 eon_investment_offer_v2_status:0 "Статус предложения с [FROM.GetName]"
 eon_investment_offer_v2_notice.t:0 "Уведомление об инвестиционном предложении"
 eon_investment_offer_v2_notice.d:0 "Это информационное сообщение. Откройте дипломатию со страной, предложившей проект, изучите текущую пару стран и примите отдельное окончательное решение. Старое сообщение не может принять или отменить новое предложение. Без ответа предложение истекает через 90 игровых дней."
 eon_investment_offer_v2_notice.ok:0 "Понятно"
 eon_investment_offer_v2_terms_tt:0 "Текущая редакция: [?eon_investment_offer_v2_epoch@FROM|0]. Регион: [?eon_investment_offer_v2_state@FROM.GetName]. Тип здания: [?eon_investment_offer_v2_type@FROM|0], количество: [?eon_investment_offer_v2_amount@FROM|0]. Взнос инвестора: $[?eon_investment_offer_v2_cost@FROM|2]; взнос получателя: $[?eon_investment_offer_v2_cofunding@FROM|2]. Дней на единицу: [?eon_investment_offer_v2_duration@FROM|0], всего: [?eon_investment_offer_v2_total_duration@FROM|0]. Дней для ответа: [?eon_investment_offer_v2_days@FROM|0]. Статус/результат: [?eon_investment_offer_v2_status@FROM|0], редакция последнего результата: [?eon_investment_offer_v2_result_epoch@FROM|0]. Окончательное согласие снова проверяет средства, мир, владение, контроль и доступные места."
