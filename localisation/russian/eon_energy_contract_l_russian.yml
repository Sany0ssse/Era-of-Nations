l_russian:
 eon_energy_offer_import_desc:0 "[FROM.GetName] предлагает нам импортировать £text_icon_energyies §Y[?eon_energy_offer_quantity|0] ГВт§! по цене §Y$[?eon_energy_offer_price|2] млрд за ГВт в неделю§!. Общий еженедельный платёж: §R$[?eon_energy_offer_weekly|2] млрд§!.\n\nНаш текущий объём со знаком: §Y[?eon_energy_offer_old_amount|0] ГВт§! (плюс: импорт; минус: экспорт), цена — $[?eon_energy_offer_old_price|2] млрд за ГВт, общая сумма — $[?eon_energy_offer_old_weekly|2] млрд в неделю. Нулевой объём означает отсутствие действующего контракта на поставку.\n\nПредлагаемые условия зафиксированы до нашего ответа. Текущий контракт действует во время переговоров. Согласие заменит двусторонний контракт; отказ сохранит его. Контракт бессрочный и действует до прекращения. Любая сторона может предложить пересмотр или прекратить поставки через управление энергией. Дефицит энергии или отмена рамочного соглашения прекращает поставки и платежи."
 eon_energy_offer_export_desc:0 "[FROM.GetName] предлагает нам экспортировать £text_icon_energyies §Y[?eon_energy_offer_quantity|0] ГВт§! по цене §Y$[?eon_energy_offer_price|2] млрд за ГВт в неделю§!. Общие еженедельные поступления: §G$[?eon_energy_offer_weekly|2] млрд§!.\n\nНаш текущий объём со знаком: §Y[?eon_energy_offer_old_amount|0] ГВт§! (плюс: импорт; минус: экспорт), цена — $[?eon_energy_offer_old_price|2] млрд за ГВт, общая сумма — $[?eon_energy_offer_old_weekly|2] млрд в неделю. Нулевой объём означает отсутствие действующего контракта на поставку.\n\nПредлагаемые условия зафиксированы до нашего ответа. Текущий контракт действует во время переговоров. Согласие заменит двусторонний контракт; отказ сохранит его. Контракт бессрочный и действует до прекращения. Любая сторона может предложить пересмотр или прекратить поставки через управление энергией. Дефицит энергии или отмена рамочного соглашения прекращает поставки и платежи."
 eon_energy_accept_import_tt:0 "Если предложение всё ещё действительно, заменить контракт импортом §Y[?eon_energy_offer_quantity|0] ГВт§!. Еженедельный платёж: §R$[?eon_energy_offer_weekly|2] млрд§!."
 eon_energy_accept_export_tt:0 "Если предложение всё ещё действительно, заменить контракт экспортом §Y[?eon_energy_offer_quantity|0] ГВт§!. Еженедельные поступления: §G$[?eon_energy_offer_weekly|2] млрд§!."
 eon_energy_refuse_tt:0 "Отклонить только предложенные условия. Действующий контракт сохраняется. Любая сторона может отправить иные условия через управление энергией."
 eon_energy_offer_invalid_tt:0 "Предложение больше не действует: изменились стороны, рамочное соглашение, текущий контракт или доступная электроэнергия. Контракт на новых условиях не создаётся. Отправьте новое предложение после устранения изменившихся обстоятельств."
 eon_energy_no_pending_tt:0 "Ни одно энергетическое предложение не ожидает ответа. Ожидающие ответа условия зафиксированы; текущие поставки и платежи продолжаются до согласованного пересмотра."
 eon_energy_offer_cancelled_desc:0 "Предложение отозвано, поскольку прекратились рамочное соглашение или поставки. Ранее предложенный объём: [?eon_energy_offer_quantity|0] ГВт по цене $[?eon_energy_offer_price|2] млрд за ГВт в неделю. Эти условия больше не могут вступить в силу. Подтвердите получение этого предложения перед отправкой новых условий; ответ не восстанавливает контракт на поставку."
 eon_energy_quantity_controls_tt:0 "Положительный объём: КУПИТЬ электроэнергию у выбранной страны. Отрицательный: ПРОДАТЬ ей электроэнергию. Каждый щелчок меняет общий объём на 1 ГВт. Ноль прекращает текущий двусторонний контракт на поставку. Пересмотр заменяет старый объём, а не добавляет ещё один контракт."
 eon_energy_capacity_tt:0 "Поставщик может обеспечить весь предложенный объём после замены текущего двустороннего контракта, сохранив остальные обязательства."
