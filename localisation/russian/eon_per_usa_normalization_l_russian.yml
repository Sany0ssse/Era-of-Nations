l_russian:
 eon_per_usa_normalization_prepare_tt:0 "Этот фокус может направить США одно предложение с 30-дневным сроком ответа. Обе страны должны существовать, не воевать друг с другом и не иметь дипломатических отношений; Иран должен соответствовать политическим условиям фокуса. Отклонённое, отозванное или закрытое предложение нельзя повторить через этот фокус."
 eon_per_usa_normalization_menu_ready_tt:0 "Необходимо текущее предложение Ирана без ответа в пределах 30-дневного срока. Обе страны должны существовать, по-прежнему не иметь дипломатических отношений и не воевать друг с другом. Иран должен соответствовать исходным политическим условиям фокуса."
 eon_per_usa_normalization_restoration_tt:0 "Обе страны согласились восстановить дипломатические отношения. Штрафы за их отсутствие сняты, а модификаторы исторических претензий сохранены."
 eon_per_usa_normalization_withdraw_request:0 "Отозвать предложение о нормализации"
 eon_per_usa_normalization_withdraw_request_send_desc:0 "Отозвать текущее предложение Соединённым Штатам, на которое ещё не получен ответ. Отзыв бесплатен. Национальный фокус остаётся завершённым и не может повторно направить это одноразовое предложение."
 eon_per_usa_normalization_withdraw_tt:0 "Предложение Соединённым Штатам должно оставаться без ответа в пределах 30-дневного срока. Отзыв бесплатен; национальный фокус остаётся завершённым."
 eon_per_usa_normalization.1.t:0 "Иран отозвал предложение"
 eon_per_usa_normalization.1.d:0 "Иран отозвал предложение о восстановлении дипломатических отношений. Его прежнее предложение можно закрыть. Существующий дипломатический статус сохраняется."
 eon_per_usa_normalization.2.t:0 "Предложение о нормализации закрыто"
 eon_per_usa_normalization.2.d:0 "Предложение было отозвано, срок ответа истёк или страны больше не могли продолжить по его условиям. Национальный фокус остаётся завершённым; это одноразовое предложение нельзя направить снова."
 eon_per_usa_normalization.ack:0 "Понятно"
