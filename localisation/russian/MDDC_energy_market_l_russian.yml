 ENERGY_CONTRACT_AGREEMENT_TITLE: "Предложить §Y  £text_icon_energyies энергетическое соглашение §!"
 ENERGY_CONTRACT_AGREEMENT_ACTION_DESC: "Заключение  £text_icon_energyies энергетического соглашения позволит нам отправлять этой стране контракты на покупку их  £text_icon_energyies  £text_icon_energyies энергии или продажу им нашей  £text_icon_energyies  £text_icon_energyies энергии. В равной степени, эта страна также сможет отправлять нам аналогичные контракты. Это взаимовыгодно!"
 PROPOSE_ENERGY_AGREEMENT_ACCEPT_TT: "§Y Энегетическое соглашение §! вступило в силу"
 PROPOSE_ENERGY_AGREEMENT_ACCEPT_DESC: "§Y £text_icon_energyies энергетическое соглашение §! вступило в силу. Теперь мы можем покупать или продавать  £text_icon_energyies энергию этому государству."
 PROPOSE_ENERGY_AGREEMENT_TOOLTIP: "У нас нет §Y £text_icon_energyies энергетического соглашения§! с [From.GetNameWithFlag]"
 PROPOSE_ENERGY_AGREEMENT_DESC: "Вы хотите отправить предложение [From.GetNameWithFlag] чтобы подписать §Y  £text_icon_energyies энергетическое соглашение §!? Заключение  £text_icon_energyies энергетической сделки усилит наше взаимное влияние на §G1-5%§!, улучшит отношения на §G50§! и позволит нам заключить контракты на транзит наших электро £text_icon_energyies  £text_icon_energyies энергии в [From.GetNameWithFlag] или осуществить транзит [From.GetFlag] [From.GetAdjective]  £text_icon_energyies  £text_icon_energyies энергии в нашу страну."
 CANCEL_ENERGY_AGREEMENT_TITLE: "Разорвать §Y  £text_icon_energyies энергетическое соглашение §!"
