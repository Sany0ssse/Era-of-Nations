 energy_selling.1.t: "[FROM.GetNameWithFlag] предложили нам  £text_icon_energyies энергетический контракт"
 energy_selling.1.desc: "[FROM.GetName] предложили нам контракт на транзит электро £text_icon_energyies  £text_icon_energyies энергии в нашу страну, разумеется, за разумную плату. Этот контракт может решить нашу  £text_icon_energyies энергетическую проблему, но сможем ли мы позволить себе такие расходы?"
 energy_selling.1.a: "Мы принимаем контракт"
 energy_selling.1.b: "Мы отказываемся"
 energy_selling.2.t: "[FROM.GetNameWithFlag] подписали контракт"
 energy_selling.2.desc: "[FROM.GetName] подписали наш  £text_icon_energyies энергетический контракт. Это будет выгодно для нас обоих."
 energy_selling.2.a: "Отлично!"
 energy_selling.3.t: "[FROM.GetNameWithFlag] отказались от контракта"
 energy_selling.3.desc: "[FROM.GetName] отказались от нашей сделки по заключению  £text_icon_energyies энергетического контракта. Очевидно, они находятся не в лучшем положении для этого, или нам нужен лучший подход к дипломатии"
 energy_selling.3.a: "Обидно"
 energy_selling.4.t: "[FROM.GetNameWithFlag] предложили нам  £text_icon_energyies энергетический контракт"
 energy_selling.4.desc: "[FROM.GetName] предложили нам контракт на транзит нашей  £text_icon_energyies  £text_icon_energyies энергии в их страну, разумеется, за разумную плату. Этот контракт мог бы обеспечить дополнительные доходы от  £text_icon_energyies энергетики для нашей страны. Можем ли мы позволить себе дополнительные расходы на электро £text_icon_energyies энергию?"
 energy_selling.4.a: "Мы принимаем контракт"
 energy_selling.4.b: "Мы отказываемся"
 energy_selling.5.t: "[FROM.GetNameWithFlag] отменили  £text_icon_energyies энергетический контракт"
 energy_selling.5.desc: "По каким-то причинам [FROM.GetName] отменили  £text_icon_energyies энергетический контракт. Транзит электро £text_icon_energyies  £text_icon_energyies энергии прекращен, еженедельные платежи прекращены. Мы можем снова предложить этой стране  £text_icon_energyies энергетический контракт, возможно, нам следует изменить условия"
 energy_selling.5.a: "Может быть, нам стоит пересмотреть контракт?.."

