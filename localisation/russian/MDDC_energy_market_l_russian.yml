 ONLY_PERMITTED_CONTINENTS_TT: "Все это должно быть сделано: \n У нас есть доступ к транзиту электро £text_icon_energyies  £text_icon_energyies энергии на этот континент.\n И это не остров."
 CANCEL_ENERGY_AGREEMENT_ACTION_DESC: "Если вы или ваш партнер расторгнете  £text_icon_energyies энергетическое соглашение, вы больше не сможете заключать  £text_icon_energyies энергетические контракты."
 CANCEL_ENERGY_AGREEMENT_DESC: "Отмена  £text_icon_energyies энергетической сделки не приведет к прекращению действия текущих контрактов, но [From.GetNameWithFlag] скорее всего, расторгнет все существующие контракты. Отношения с [From.GetNameWithFlag] будут ухудшены на §R100§!. Вы больше не сможете покупать или продавать  £text_icon_energyies энергию [From.GetNameWithFlag]"
 CANCEL_ENERGY_AGREEMENT_TOOLTIP: "У нас с ними заключено  £text_icon_energyies энергетическое соглашение."
 energy_selling_TT: "$$[?energy_selling_income|+3] от §Y Продажи  £text_icon_energyies  £text_icon_energyies энергии §!\n"
