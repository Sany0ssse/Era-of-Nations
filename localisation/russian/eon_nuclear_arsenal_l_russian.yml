l_russian:
 eon_nuclear_arsenal_category:0 "Обслуживание ядерного арсенала"
 eon_nuclear_arsenal_category_desc:0 "Ядерные ракеты требуют финансирования хранения, проверок и персонала. Шахты и самолёты уже оплачиваются через расходы на оборону. Этот счёт покрывает ракетный арсенал без повторной оплаты носителей.\n\nТекущий режим: [GetEonNuclearArsenalMode].\nРезерв: §Y[?eon_nuclear_arsenal_reserve|0]§!; развёрнуто: §Y[?eon_nuclear_arsenal_deployed|0]§!. Обслуживание: §Y$[?eon_nuclear_arsenal_weekly_cost|5] млрд в неделю§!."
 eon_nuclear_arsenal_status:0 "Проверить арсенал и стоимость обслуживания"
 eon_nuclear_arsenal_status_desc:0 "Ядерные ракеты в резерве: §Y[?eon_nuclear_arsenal_reserve|0]§!. Развёрнутые ядерные ракеты: §Y[?eon_nuclear_arsenal_deployed|0]§!. Всего: §Y[?eon_nuclear_arsenal_total|0]§!.\nОбслуживание: §Y$[?eon_nuclear_arsenal_weekly_cost|5] млрд в неделю§!; включено один раз в дополнительные расходы бюджета.\nТекущий режим: [GetEonNuclearArsenalMode]. Осталось еженедельных проверок восстановления: §Y[?eon_nuclear_arsenal_recovery_remaining|0]§!.\n\nСохраняются требования ядерной политики, войны и налётов. Хранящиеся ракеты не расходуют топливо гражданских реакторов. Суммы и срок восстановления — игровые параметры."
 eon_nuclear_arsenal_safety:0 "Вывести ядерный арсенал из боевой готовности"
 eon_nuclear_arsenal_safety_desc:0 "Сохранить ракеты на финансируемом безопасном хранении за 35% обычной стоимости обслуживания. Ядерное применение сразу станет недоступным, включая подготовленные налёты. Обычные ракеты не затрагиваются. Восстановление ядерной готовности требует полного финансирования и четырёх еженедельных проверок."
 eon_nuclear_arsenal_full:0 "Возобновить полное обслуживание ядерного арсенала"
 eon_nuclear_arsenal_full_desc:0 "Вернуть полное финансирование обслуживания. Ядерное применение останется недоступным до завершения четырёх еженедельных проверок восстановления. Просмотр бюджета и повторные нажатия не ускоряют этот срок."
 eon_nuclear_arsenal_launch_ready_tt:0 "Готовность ядерного арсенала позволяет применение."
 eon_nuclear_arsenal_safety_tt:0 "§YЯдерное применение приостановлено§!; стоимость обслуживания снижается до §Y35%§!. Ракеты остаются в арсенале."
 eon_nuclear_arsenal_full_tt:0 "Полное обслуживание возобновлено. Ядерная готовность вернётся после §Y4 еженедельных проверок§!."
 eon_nuclear_arsenal_mode_safety:0 "§Yбезопасное хранение; ядерное применение недоступно§!"
 eon_nuclear_arsenal_mode_recovery:0 "§Yполное финансирование; восстановление готовности§!"
 eon_nuclear_arsenal_mode_full:0 "§Gполное обслуживание; проверки готовности завершены§!"
