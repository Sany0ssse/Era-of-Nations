l_russian:
 eon_services_logistics_offer_tt:0 "Предложить логистическую поддержку за 3 единицы казны, оплачиваемые только при согласии этой страны. Поддержка действует до 80 дней. Предложение бесплатно; его можно отозвать в течение 30-дневного ожидания ответа."
 eon_services_recon_offer_tt:0 "Предложить разведывательную поддержку за 4 единицы казны, оплачиваемые только при согласии этой страны. Поддержка действует до 80 дней. Предложение бесплатно; его можно отозвать в течение 30-дневного ожидания ответа."
 eon_services_logistics_terms_tt:0 "Заранее заплатить 3 единицы казны за логистическую поддержку на срок до 80 дней: потребление припасов -3%, топлива армией -3%, авиацией -2%, флотом -1%, организация армии +2%. При досрочном прекращении плата не возвращается. Любая страна может прекратить сотрудничество; оно также заканчивается при возвращении получателя к миру, прямой войне между партнёрами, исчезновении поставщика, истечении срока или исчезновении национального духа услуги."
 eon_services_recon_terms_tt:0 "Заранее заплатить 4 единицы казны за разведывательную поддержку на срок до 80 дней: разведка +3%, ночная атака +2%, скорость пополнения +8 процентных пунктов. При досрочном прекращении плата не возвращается. Любая страна может прекратить сотрудничество; оно также заканчивается при возвращении получателя к миру, прямой войне между партнёрами, исчезновении поставщика, истечении срока или исчезновении национального духа услуги."
 eon_services_decline_tt:0 "Отклонить или закрыть это неоплаченное предложение. Отозванное или недействительное предложение не списывает плату и не начинает услугу. Отказ от актуального допустимого предложения, которое можно оплатить, сохраняет прежнее последствие для внутреннего влияния."
 eon_services_unmatched_tt:0 "Это предложение больше не актуально. Оплата не производится, услуга не начинается."
 eon_services_legacy_desc:0 "Это прежнее предложение больше нельзя подтвердить. Закройте его и запросите новое предложение с актуальными услугой, ценой и условиями. Закрытие не списывает плату и не прекращает действующую услугу."
 eon_services_legacy_close_tt:0 "Закрыть прежнее предложение без оплаты. Действующие соглашения и новые предложения сохраняют собственные условия."
 eon_services_withdraw_offer:0 "Отозвать предложение военных услуг"
 eon_services_withdraw_offer_desc:0 "Бесплатно отозвать наше неоплаченное предложение логистики или разведки. Первоначальный ответ всё ещё нужно закрыть в пределах его 30-дневного срока. Если срок истечёт без ответа, дальнейшие предложения военных услуг этому партнёру окончательно станут недоступны в этой кампании."
 eon_services_withdraw_offer_send_desc:0 "Отозвать неоплаченное предложение. Первоначальный ответ всё ещё нужно закрыть; если его 30-дневный срок истечёт без ответа, дальнейшие предложения военных услуг этому партнёру окончательно станут недоступны в этой кампании."
 eon_services_end_logistics:0 "Прекратить логистическое сотрудничество"
 eon_services_end_logistics_desc:0 "Бесплатно прекратить логистическую поддержку в обоих направлениях с этим партнёром. Ни одна страна не получает возврата предварительной платы. Разведывательная поддержка, другие партнёры и ожидающие предложения сохраняются."
 eon_services_end_logistics_send_desc:0 "Прекратить логистическую поддержку в обоих направлениях с этим партнёром. Предварительная плата не возвращается."
 eon_services_end_recon:0 "Прекратить разведывательное сотрудничество"
 eon_services_end_recon_desc:0 "Бесплатно прекратить разведывательную поддержку в обоих направлениях с этим партнёром. Ни одна страна не получает возврата предварительной платы. Логистическая поддержка, другие партнёры и ожидающие предложения сохраняются."
 eon_services_end_recon_send_desc:0 "Прекратить разведывательную поддержку в обоих направлениях с этим партнёром. Предварительная плата не возвращается."
 eon_services.ack:0 "Понятно"
 eon_services.1.t:0 "Предложение военных услуг"
 eon_services.1.d:0 "[FROM.GetName] предлагает временную военную поддержку. Доступная кнопка согласия показывает предложенную услугу, предварительную цену и максимальный срок в 80 дней. Соглашение требует нашего согласия и оплаты, а также сохранения допустимых условий между странами. Любая страна затем может прекратить услугу на объявленных условиях. Поставщик может отозвать предложение; срок ответа — 30 дней."
 eon_services.1.a:0 "Принять логистику: 3 единицы казны, до 80 дней"
 eon_services.1.b:0 "Принять разведку: 4 единицы казны, до 80 дней"
 eon_services.1.c:0 "Отклонить или закрыть неоплаченное предложение"
 eon_services.2.t:0 "Военная услуга принята"
 eon_services.2.d:0 "Партнёр принял наше предложение и оплатил услугу. Поддержка действует до 80 дней на согласованных условиях прекращения. Любая страна может прекратить сотрудничество досрочно; предварительная плата не возвращается."
 eon_services.3.t:0 "Предложение военных услуг отозвано"
 eon_services.3.d:0 "Поставщик отозвал неоплаченное предложение. Закройте первоначальный ответ без оплаты. Если первоначальный 30-дневный срок истечёт без ответа, дальнейшие предложения военных услуг от этого поставщика этому получателю окончательно станут недоступны в текущей кампании."
 eon_services.4.t:0 "Маршрут предложения без ответа закрыт"
 eon_services.4.d:0 "Прежнее предложение истекло или больше не могло быть подтверждено с первоначальным партнёром. Плата не внесена. Дальнейшие предложения логистики и разведки этому партнёру окончательно недоступны в этой кампании. Сотрудничество с другими партнёрами остаётся возможным."
 eon_services.5.t:0 "Запись предложения военных услуг непроверяема"
 eon_services.5.d:0 "Прежнее предложение нельзя было безопасно согласовать с первоначальной договорённостью и партнёром. Дальнейшие предложения военных услуг от нашей страны нельзя открыть снова в этой кампании. Плата не списана, а действующие оплаченные услуги сохраняют собственные условия."
 eon_services.7.t:0 "Сотрудничество по военным услугам прекращено"
 eon_services.7.d:0 "Выбранный вид сотрудничества с этим партнёром прекращён в обоих направлениях, где действовала услуга. Предварительная плата не возвращается. Другие виды услуг, другие партнёры и ожидающие предложения сохраняются."
 eon_services.8.t:0 "Предложение военных услуг закрыто"
 eon_services.8.d:0 "Предложение отклонено или больше не могло быть принято на актуальных условиях. Плата не внесена, услуга не началась."
