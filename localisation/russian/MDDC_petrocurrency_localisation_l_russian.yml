 GENERIC_petroown_cons_idea: "Последствия перехода на собственную нефтевалюту"
 GENERIC_petroown_cons_idea_desc: "Переход на собственную нефтевалюту был очень рискованным шагом и крайне негативно сказался на нашей экономике. Теперь мы можем только надеяться, что другие страны также будут бороться против влияния.\nЭтот национальный дух будет §Rудалён§!, если количество стран с §YНефтедолларом§! станет меньше §G80§!"
 GENERIC_petroruble_cons_idea: "Последствия перехода на Нефтерубль"
 GENERIC_petroruble_cons_idea_desc: "Переход на другую валюту в торговле не может пройти без последствий, и до тех пор, пока очень небольшое количество стран поддерживает эту валюту в нефтяной торговле, мы будем страдать от последствий нашего решения.\nЭтот национальный дух будет §Rудалён§!, если количество стран с §YНефтерублем§! превысит §G20§!"
 GENERIC_petroyuan_cons_idea: "Последствия перехода на Нефтеюань"
 GENERIC_petroyuan_cons_idea_desc: "Переход на другую валюту в торговле не может пройти без последствий, и до тех пор, пока очень небольшое количество стран поддерживает эту валюту в нефтяной торговле, мы будем страдать от последствий нашего решения.\nЭтот национальный дух будет §Rудалён§!, если количество стран с §YНефтеюанем§! превысит §G20§!"
 GENERIC_petroescudo_cons_idea: "Последствия перехода на Нефтеэскудо"
 GENERIC_petroescudo_cons_idea_desc: "Переход на другую валюту в торговле не может пройти без последствий, и до тех пор, пока очень небольшое количество стран поддерживает эту валюту в нефтяной торговле, мы будем страдать от последствий нашего решения.\nЭтот национальный дух будет §Rудалён§!, если количество стран с §YНефтеэскудо§! превысит §G20§!"
