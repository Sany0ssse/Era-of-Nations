 GENERIC_usapetrodollar_idea: "§YНефтедоллар§!"
 GENERIC_petrodollar_idea: "§YНефтедоллар§!"
 GENERIC_ownpetro_idea: "§YДолой Нефтедоллар§!"
 GENERIC_petroruble_idea: "§YНефтерубль§!"
 GENERIC_petroruble_idea_desc: "С начала 2000-х годов Россия планировала свергнуть гегемонию нефтедоллара, но физически не могла этого сделать, поскольку страна больше не имеет того влияния, которое было во времена Советского Союза. Однако, похоже, что сейчас российское руководство готово пойти на риск."
 GENERIC_petrorublik_idea: "§YНефтерубль§!"
 GENERIC_petrorublik_idea_desc: "С начала 2000-х годов Россия планировала свергнуть гегемонию нефтедоллара, но физически не могла этого сделать, поскольку страна больше не имеет того влияния, которое было во времена Советского Союза. Однако, похоже, что сейчас российское руководство готово пойти на риск."
 GENERIC_petroyuanik_idea: "§YНефтеюань§!"
 GENERIC_petroyuanik_idea_desc: "Китай давно стремился освободиться от доминирования доллара в нефтяной торговле, и теперь похоже, что Восточный Дракон готов сломать хребет Нефтедоллару."
 GENERIC_petroyuan_idea: "§YНефтеюань§!"
 GENERIC_petroyuan_idea_desc: "Китай давно стремился освободиться от доминирования доллара в нефтяной торговле, и теперь похоже, что Восточный Дракон готов сломать хребет Нефтедоллару."
 GENERIC_petroescudik_idea: "§YНефтеэскудо§!"
 GENERIC_petroescudik_idea_desc: "Португалия не особенно стремилась к глобальному лидерству в валютной сфере, но всё изменилось, когда Португалия стала одним из крупнейших геополитических игроков на мировой арене."
 GENERIC_petroescudo_idea: "§YНефтеэскудо§!"
 GENERIC_petroescudo_idea_desc: "Португалия не особенно стремилась к глобальному лидерству в валютной сфере, но всё изменилось, когда Португалия стала одним из крупнейших геополитических игроков на мировой арене."
