 EON_CHEAT_HOTKEY_ON:0 "Shift+R: ВКЛ."
 EON_CHEAT_HOTKEY_OFF:0 "Shift+R: ВЫКЛ."
 EON_CHEAT_HOTKEY_TT:0 "§YShift+R§! — переключить чит-решения для вашей страны.\nОткройте §YРешения§! (§YShift+Q§!), чтобы использовать их. Работает даже при отключённых правилах читов.\nПереключатель меняет доступ только вашей страны. При отключении этого режима снова действуют обычные правила читов. В мультиплеере всем участникам нужна одинаковая версия Era of Nations."
 EON_CHEAT_OVERRIDE_ACTIVE_TT:0 "§GЧит-решения вашей страны включены через Shift+R.§! Нажмите Shift+R повторно, чтобы отключить этот режим."
