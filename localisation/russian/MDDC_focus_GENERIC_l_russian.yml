 formable_nations.2.t: "[FROM.GetNameWithFlag] правительство согласилось на полную интеграцию"
 formable_nations.2.d: "К счастью для нас,[FROM.GetNameWithFlag] правительство решило полностью интегрироваться в наше государство, что стало символом желания их народа воссоединиться с нами. Однако, несмотря на этот успех, эта интеграция окажет серьезное влияние на состояние экономики и других государственных институтов на протяжении всего периода интеграции."
 formable_nations.2.a: "Отлично"
 formable_nations.3.t: "[FROM.GetNameWithFlag] правительство согласилось на объединение на основе автономии."
 formable_nations.3.d: "[FROM.GetNameWithFlag] правительство согласилось объединиться с нами на основе автономии, чтобы избежать возможного ущемления прав своих граждан нашим руководством, а также показать, что этот союз будет построен на равноправии."
 formable_nations.3.a: "Отлично"
 formable_nations.4.t: "[FROM.GetNameWithFlag] отказался объединяться с нами"
 formable_nations.4.d: "Несмотря на наше политическое влияние на них, они все же решили, что мы не являемся тем фактором, который будет определять их будущее."
