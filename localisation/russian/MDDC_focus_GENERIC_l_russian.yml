 generic_sanctions.4.t: "Отмена санкций в отношении[FROM.GetNameWithFlag]"
 generic_sanctions.4.d: "Мы можем отменить санкции, которые мы ввели в отношении[FROM.GetNameWithFlag]. Какие это будут санкции?"
 generic_sanctions.4.a: "Отменить экономические санкции"
 generic_sanctions.4.b: "Отменить политические санкции"
 generic_sanctions.4.c: "Отменить ресурсные санкции"
 generic_sanctions.4.e: "Следующая страница"
 generic_sanctions.5.t: "[FROM.GetNameWithFlag]  просит нас отменить наши санкции"
 generic_sanctions.5.d: "[FROM.GetNameWithFlag] правительство готово вести переговоры о санкциях, что показывает, что наша политика в отношении них была стратегически правильной."
 generic_sanctions.5.a: "Мы готовы отменить санкции, если они будут готовы нам заплатить"
 generic_sanctions.5.b: "Нет"
 generic_sanctions.6.t: "[FROM.GetNameWithFlag] предлагает сделку по санкциям"
 generic_sanctions.6.d: "[FROM.GetNameWithFlag] соглашается отменить санкции, если мы им за это заплатим."
 generic_sanctions.6.a: "Это того стоит"
 generic_sanctions.6.b: "Мы не станем перед ними на колени"
 generic_sanctions.7.t: "[FROM.GetNameWithFlag] отказались отменить санкции в отношении нас."
 generic_sanctions.7.d: "[FROM.GetNameWithFlag] отказались отменить санкции против нас, потому что мы по-прежнему представляем угрозу их интересам."
 generic_sanctions.7.a: "Дерьмо"
 generic_sanctions.8.t: "[FROM.GetNameWithFlag] согласились с нашими требованиями."
 generic_sanctions.8.d: "[FROM.GetNameWithFlag] согласились заплатить нам за отмену санкций. Теперь наши отношения вернутся в нормальное русло."
 generic_sanctions.8.a: "Хорошо"
 generic_sanctions.9.t: "[FROM.GetNameWithFlag] отклонили наше предложение"
 generic_sanctions.9.d: "Несмотря на то, что мы не просили многого в обмен на отмену санкций, они все еще верят, что смогут выжить в изоляции."
 generic_sanctions.9.a: "Желаем им удачи"
 generic_sanctions.11.t: "Вопрос о санкциях"
 generic_sanctions.11.d: "Мы можем выбрать тип санкций для нанесения точечного удара по [FROM.GetNameWithFlag]"
 generic_sanctions.11.a: "Ввести политические санкции"
 generic_sanctions.11.b: "Вернуться на предыдущую страницу"
 generic_sanctions.11.c: "Выйти из меню Санкций"
