 ##########Focuses##########
 GENERIC_special_service_start: "Специальные службы"
 GENERIC_special_service_start_desc: "Наша страна нуждается во внутренней безопасности, и сильные спецслужбы могут обеспечить эту потребность в нашем государстве."
 GENERIC_special_service_mvd: "Министерство внутренних дел"
 GENERIC_special_service_mvd_desc: "Закон и порядок должны быть защищены сильным МВД в любое время."
 GENERIC_special_service_outer: "Внешний разведка"
 GENERIC_special_service_outer_desc: "Враг не спит, и мы должны заранее знать их намерения, чтобы защитить нашу страну."
 GENERIC_special_service_inner: "Внутренняя разведка"
 GENERIC_special_service_inner_desc: "Вражеские агенты и шпионы, вероятно, уже проникают в нашу страну, и пришло время защитить нашу национальную безопасность."
 GENERIC_special_service_military: "Военная разведка"
 GENERIC_special_service_military_desc: "Речь идет не только о количестве войск и бронетехники; речь идет о знании намерений и планов противника, которые могут быть половиной битвы."
 GENERIC_special_service_ops: "Полицейское тактическое подразделение"
 GENERIC_special_service_ops_desc: "Для решения внутренних задач нужна специальная единица, способная быстро подавить очаги сопротивления или бунта."
