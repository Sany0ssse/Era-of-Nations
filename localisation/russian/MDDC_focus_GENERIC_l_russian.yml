 influence.502.t: "[FROM.GetNameWithFlag] хочет отправить бригаду в нашу страну"
 influence.502.d: "[FROM.GetNameWithFlag] разведка предложила направить инструкторов бригады и боевых специалистов для поддержки нашей страны."
 influence.502.a: "Мы согласны"
 influence.502.b: "Они нам не нужны"
 influence.503.t: "[FROM.GetNameWithFlag] Согласился Принять Наши Бригады"
 influence.503.d: "Их правительство согласилось разрешить сотрудникам нашей бригады участвовать в их военных операциях. Мы готовы оказать всестороннюю поддержку."
 influence.503.a: "Отлично"
 influence.504.t: "[FROM.GetNameWithFlag] Отказались от Наших Бригад"
 influence.504.d: "Их правительство отвергло участие наших наемников, сочтя это слишком грубым вмешательством в их политическую систему."
 influence.504.a: "Слабаки"
 influence.505.t: "Бригада вернулась домой"
 influence.505.d: "Наши бойцы успешно выполнили все поставленные перед ними задачи и вернулись в резерв"
 influence.505.a: "Отлично"
 influence.506.t: "Военные услуги от [FROM.GetName]"
 influence.506.d: "[From.GetName] предлагает нам свои военные услуги. Должны ли мы их принять?"
 influence.506.a: "Нам нужна эффективная Логистика"
 influence.506.b: "Нам Нужны Дополнительные разведданные"
 influence.506.c: "Нам Это Не Нужно"
 influence.507.t: "Вопрос об экономической эксплуатации"
 influence.507.d: "Мы можем использовать Нашу сферу влияния, чтобы извлекать из Нее экономические выгоды. Что Мы предпочтем?\n\nПРИМЕЧАНИЕ: Если у вас есть марионетка, вы можете эксплуатировать ее казну, при условии, что уровень коррупции в ней не ниже среднего."
 influence.507.a: "Нам нужна промышленность"
 influence.507.b: "Мы заберем их деньги"
 influence.507.c: "Мы передумали"
 influence.508.t: "Нашу экономику эксплуатируют"
 influence.508.d: "[FROM.GetNameWithFlag] правительство решило использовать свое влияние на нас и начало эксплуатировать нашу экономику."
 influence.508.a: "Говно..."
 influence.508.b: "Говно..."
 influence.510.t: "Стабилизация Государства"
 influence.510.d: "Несмотря на успешный переворот, который позволил нам прийти к власти, она остается нелегитимной. Нам необходимо стабилизировать армию, правительство и общество, чтобы сохранить контроль над властью."
 influence.510.a: "Мдэ"
 influence.511.t: "Восстание [FROM.GetName]"
 influence.511.d: "Несмотря на то, что [FROM.GetNameWithFlag] долгое время находились под нашим контролем,что дает нам исключительное стратегическое преимущество, они решили §Rвосстать§! против нас.\n\nМы должны подавить восстание §Rв течение 50 дней§!, или мы потеряем контроль над [FROM.GetNameWithFlag] §Rнавсегда§!."
 influence.511.a: "Поднимай ребят"
 influence.512.t: "Война проиграна"
 influence.512.d: "Несмотря на тщательную подготовку, нам не удалось добиться независимости. Сейчас население недовольно нами, и в стране начался период нестабильности."
 influence.512.a: "Мдэ"
 influence.513.t: "Мы победили"
 influence.513.d: "Мы смогли обрести независимость в кровопролитной войне, и теперь нация готова к новому периоду своей истории."
 influence.513.a: "Отлично"
 influence.514.t: "Восстание Было Подавлено"
 influence.514.d: "Наши вооруженные силы смогли подавить мятежных [FROM.GetNameWithFlag],и их правительство было изгнано."
 influence.514.a: "Отлично"
