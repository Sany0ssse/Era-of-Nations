 formable_nations.1.d: "[FROM.GetNameWithFlag] заявляет, что вместе наши народы станут намного сильнее, чем если бы мы жили порознь."
 formable_nations.1.a: "Мы готовы к полной интеграции"
 formable_nations.1.b: "Мы объединимся на основе автономии"
