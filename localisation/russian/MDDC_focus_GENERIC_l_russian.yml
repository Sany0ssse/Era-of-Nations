 ##########ARMY TREE##########
 ##########Focuses##########
 GENERIC_army_start: "Наши вооруженные силы"
 GENERIC_army_start_desc: "Необходимо реформировать нашу армию таким образом, чтобы она больше соответствовала стандартам 21 века"
 GENERIC_army_ground_troops: "Сухопутные войска"
 GENERIC_army_ground_troops_desc: "Сухопутные войска - это ядро любой армии, и мы должны обеспечить, чтобы это ядро всегда было обеспечено лучшей техникой и лучшими солдатами."
 GENERIC_army_engineer: "Инженерные войска"
 GENERIC_army_engineer_desc: "Любая армия нуждается в хороших инженерных подразделениях, чтобы преодолевать вражеские укрепления, а также грамотно готовить оборону своей территории."
 GENERIC_army_exercises: "Военные учения"
 GENERIC_army_exercises_desc: "Интенсивные тренировки повышают боеготовность и слаженность подразделений, обеспечивая безупречную работу наших войск в напряжённых условиях."
 GENERIC_army_anti_air_build: "Средства противовоздушной обороны"
 GENERIC_army_anti_air_build_desc: "Необходимо защитить небо от вражеских самолетов, а значит, пришло время инвестировать в противовоздушную оборону."
 GENERIC_army_anti_air: "Войска ПВО"
 GENERIC_army_anti_air_desc: "Наша армия должна сражаться с врагом не только на земле, мы также должны быть готовы нанести удар по врагу в воздухе."
 GENERIC_army_fortress: "Новые укрепления"
 GENERIC_army_fortress_desc: "Мы построим новые укрепления, которые позволят нам более успешно защищаться."
 GENERIC_army_hub: "Логистический центр"
 GENERIC_army_hub_desc: "Логистика - это воздух любой армии, и мы намерены ее развивать.\n"
 GENERIC_army_doctrine: "Инновации сухопутной доктрины"
 GENERIC_army_doctrine_desc: "Современная война требует адаптации. Обновляя наши доктрины новыми стратегиями и технологиями, мы можем обеспечить эффективность наших вооруженных сил и их готовность к будущим конфликтам."
 GENERIC_army_uniform: "Улучшения униформы"
 GENERIC_army_uniform_desc: "Модернизация военной формы повышает комфорт, долговечность и приспособляемость к различным боевым условиям."
 GENERIC_army_equip: "Разработка пехотной техники"
 GENERIC_army_equip_desc: "Совершенствование пехотного снаряжения гарантирует, что у наших солдат будут самые современные инструменты, повышающие их эффективность и выживаемость на поле боя."
 GENERIC_army_armor: "Разработка пехотной техники"
 GENERIC_army_armor_desc: "Совершенствование пехотного снаряжения гарантирует, что у наших солдат будут самые современные инструменты, повышающие их эффективность и выживаемость на поле боя."
 GENERIC_army_anti_armor: "Контрмеры против бронетанковых подразделений"
 GENERIC_army_anti_armor_desc: "Разработка эффективной тактики и вооружения для борьбы с бронетехникой противника гарантирует, что мы сможем эффективно нейтрализовать их тяжёлые подразделения."
 GENERIC_army_artillery: "Артиллерийские эксперименты"
 GENERIC_army_artillery_desc: "Испытания новых артиллерийских систем и методов повышают точность, огневую мощь и адаптивность на современном поле боя."
 GENERIC_army_education: "Реформа военного образования"
 GENERIC_army_education_desc: "Модернизация военного образования формирует более сильных лидеров, более умелых стратегов и армию, способную противостоять современным вызовам."
 GENERIC_army_peacekeepers: "Миротворческий батальон"
 GENERIC_army_peacekeepers_desc: "Мы готовы участвовать в миротворческих миссиях по всему миру, а наши бойцы готовы выполнять свой интернациональный долг."
 GENERIC_army_transport_avia: "Транспортная авиация"
 GENERIC_army_transport_avia_desc: "Мы должны развивать нашу транспортную авиацию как альтернативный маршрут доставки наших войск."
 GENERIC_army_vdv: "Воздушно-десантные батальоны"
 GENERIC_army_vdv_desc: "Необходимо развивать десантные батальоны, потому что хорошо организованная десантная операция может полностью изменить ситуацию на фронте."
 GENERIC_army_pilots: "Повысить уровень подготовки пилотов"
 GENERIC_army_pilots_desc: "Наши пилоты должны стать воздушными асами, поэтому мы увеличим время их обучения."
 GENERIC_army_airport: "Новая авиабаза"
 GENERIC_army_airport_desc: "Авиация должна где-то базироваться, поэтому мы намерены создать новую авиабазу."
 GENERIC_fleet_guard: "Стражи наших берегов"
 GENERIC_fleet_guard_desc: "Мы намерены активизировать исследования в области создания небольших флотилий, потому что берега должны охраняться не только гигантскими крейсерами."
 GENERIC_fleet_morpehi: "Корпус морской пехоты"
 GENERIC_fleet_morpehi_desc: "Ни один сильный военно-морской флот не может обойтись без морской пехоты, и мы намерены создать свой собственный корпус морской пехоты."
 GENERIC_army_sso: "Силы специальных операций"
 GENERIC_army_sso_desc: "Любая армия нуждается в элитных подразделениях, поэтому мы готовы объявить о создании наших собственных сил специальных операций."
 GENERIC_last_war_volunteers: "Добровольцы на Фронте"
 GENERIC_last_war_volunteers_desc: "Есть те, кто готов немедленно броситься защищать свою страну, а не ждать, пока родина позовет их."
 GENERIC_last_war_stand: "До последнего вздоха"
 GENERIC_last_war_stand_desc: "Мы не проиграем, мы не сдадимся, враг не победит нас."
