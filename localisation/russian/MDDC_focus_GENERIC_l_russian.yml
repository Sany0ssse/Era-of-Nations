 influence.515.t: "[FROM.GetNameWithFlag] Подорвал наше влияние"
 influence.515.d: "[FROM.GetNameWithFlag] совершил попытку подорвать наше влияние в одной из наших стран-союзников. Однако мы не можем игнорировать этот враждебный акт. Наш выбор в конечном итоге повлияет не только на наш престиж, но и на внутреннюю стабильность нашей страны"
 influence.515.a: "Наш ответ предельно ясен"
 influence.515.b: "Мы крайне обеспокоены сложившейся ситуацией"
 influence.515.c: "Это не является приоритетом"
 influence.516.t: "[FROM.GetNameWithFlag] Мобилизует Армию"
 influence.516.d: "Полагаясь на слабость правительства [FROM.GetNameWithFlag], мы стали главной причиной нового военного конфликта. Нам остаётся лишь надеяться на Бога или на неподготовленность их армии"
 influence.516.a: "Дерьмо"
 influence.517.t: "[FROM.GetNameWithFlag] Вводит Блокаду Против Нас"
 influence.517.d: "Правительство [FROM.GetNameWithFlag] вводит против нас полную экономическую блокаду, объявляя нас главной угрозой своей безопасности"
 influence.517.a: "Это им обязательно поможет"
 influence.518.t: "[FROM.GetNameWithFlag] Выражает Обеспокоенность"
 influence.518.d: "Правительство [FROM.GetNameWithFlag] направило ноту протеста и запросило у нашего посла дополнительные разъяснения относительно действий нашего правительства"
 influence.518.a: "Пусть они проведут красную линию"

