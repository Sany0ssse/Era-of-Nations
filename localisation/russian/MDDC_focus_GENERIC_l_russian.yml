 ###########Islamists#########
 GENERIC_torjestvo_jihad: "Триумф джихада"
 GENERIC_torjestvo_jihad_desc: "Салафизм сейчас торжествует в нашей стране, хвала Аллаху!"
 GENERIC_call_intern_jihadis: "Позвать внутренних джихадистов"
 GENERIC_call_intern_jihadis_desc: "Мы должны заявить, что теперь в нашей стране рады всем правоверным джихадистам."
 GENERIC_bring_muftis: "Принять муфтиев"
 GENERIC_bring_muftis_desc: "Мы должны очистить нашу умму от фальшивых священников и привести настоящих муфтиев-салафитов, которые разделяли бы наши идеи."
 GENERIC_crush_mushriqs: "Сокрушить язычников"
 GENERIC_crush_mushriqs_desc: "Язычники - худшие из всех, и мы должны преподать им урок."
 GENERIC_declare_malikate: "Объявить Маликат"
 GENERIC_declare_malikate_desc: "Мы объявим себя маликатами, как это принято в Саудовской Аравии."
 GENERIC_medrese_propaganda: "Пропаганда Медресе"
 GENERIC_medrese_propaganda_desc: "Мы должны использовать различные медресе для пропаганды наших идей среди населения."
 GENERIC_jihadis_volunteers: "Добровольцы-джихадисты"
 GENERIC_jihadis_volunteers_desc: "Помощь нашим братьям не только поможет им выиграть войну, но и позволит нам получить бесценный боевой опыт. Позволяет отправлять бригады добровольцев-джихадистов через кнопку военной помощи."
 GENERIC_ensure_ties_with_saudis: "Обеспечить Связи с Саудовцами"
 GENERIC_ensure_ties_with_saudis_desc: "Саудовцы показали всему миру, что салафизм может быть устойчивым, и мы последуем их примеру."
 GENERIC_religious_fanaticism: "Религиозный фанатизм"
 GENERIC_religious_fanaticism_desc: "Мы должны заставить каждого человека в нашей стране быть самым верным и чистым в своих мыслях и поступках."
 GENERIC_inghimasi: "Ингимаси"
 GENERIC_inghimasi_desc: "Те, у кого есть желание, могут добровольно стать мучениками в случае войны."
 GENERIC_unify_caliphate: "Объединить халифат"
 GENERIC_unify_caliphate_desc: "Мы - истинный халифат, и мы должны показать это всему известному миру."
 GENERIC_taqfir_to_infidels: "Такфир для неверных"
 GENERIC_taqfir_to_infidels_desc: "Неверные должны ходить по краю дороги, когда мы идем по ней. Они должны трепетать, бояться и быть покоренными."
 GENERIC_effective_jizya: "Эффективная Джизья"
 GENERIC_effective_jizya_desc: "Мы должны сделать наш налог на Джизья для неверных не только унизительным, но и эффективным."
 GENERIC_government_sharia: "Государственный шариат"
 GENERIC_government_sharia_desc: "Шариат должен быть основой нашей конституции и кодекса законов."
 GENERIC_jihad_against_apostates: "Джихад против отступников"
 GENERIC_jihad_against_apostates_desc: "Наши соседи отвергли истинную веру и должны быть приведены к покорности. Мы объявим священную войну против отступников, окружающих нас, расширяя царство Ислама мечом."
 GENERIC_unite_the_ummah: "Объединить умму"
 GENERIC_unite_the_ummah_desc: "От берегов Африки до гор Кавказа наши братья по вере разделяют наше видение. Мы отправим эмиссаров ко всем единомышленным салафитским движениям, приглашая их в великий союз под знаменем джихада. Вместе мы станем неостановимой силой."
 GENERIC_revenge_for_the_crusades: "Месть за крестовые походы"
 GENERIC_revenge_for_the_crusades_desc: "Кровь наших предков взывает из песков Палестины и руин Андалусии. Крестоносцы веками унижали Ислам. Теперь пришло время вернуть это унижение десятикратно. Мы пойдём на саму Европу — новый джихад, который потрясёт основы христианского мира."
 ##########Moderate Islamists##########
 GENERIC_brothers_muslims: "Братья-мусульмане у власти"
 GENERIC_brothers_muslims_desc: "Истинные борцы за истинную веру наконец-то захватили власть в стране!"
 GENERIC_international_relations: "Связать международные отношения"
 GENERIC_international_relations_desc: "Нам нужно наладить международные отношения, потому что мы не хотим стать глобальным изгоем."
 GENERIC_state_islam: "Государственный ислам"
 GENERIC_state_islam_desc: "Мы создадим истинное исламское государство, и все наши братья в вере будут чувствовать себя там как дома."
 GENERIC_qatar_foundations: "Катарский фонд"
 GENERIC_qatar_foundations_desc: "Катар является одним из ключевых участников финансирования \"Братьев-мусульман\". Мы должны использовать это в своих интересах."
 GENERIC_islamic_democracy: "Исламская демократия"
 GENERIC_islamic_democracy_desc: "Только ислам может обеспечить истинную демократию"
 GENERIC_moderate_emirate: "Умеренный эмират"
 GENERIC_moderate_emirate_desc: "Мы не собираемся возвращаться в средневековье, мы построим современное государство."
 GENERIC_support_hamas: "Поддержать ХАМАС"
 GENERIC_support_hamas_desc: "Мы поддерживаем ХАМАС в его целях и стремлениях, и мы готовы расширить эту поддержку"
 GENERIC_propaganda_bases: "Пропагандистские базы"
 GENERIC_propaganda_bases_desc: "Пришло время включить пропагандистский рупор в полной мере"
 GENERIC_anti_jid: "Движение сопротивления"
 GENERIC_anti_jid_desc: "Создание движения сопротивления нашим интересам на Ближнем Востоке должно стать нашим главным приоритетом."
 ##########Shia##########
 GENERIC_iron_hand_shiism: "Железная рука шиизма"
 GENERIC_iron_hand_shiism_desc: "Наше правление должно быть твердым, чтобы не позволить врагам наших идей распространять дезинформацию о нашем правительстве!"
 GENERIC_shiite_democracy: "Шиитская демократия"
 GENERIC_shiite_democracy_desc: "Мы должны сочетать демократические принципы с шиитской теократией, чтобы создать гармонию."
 GENERIC_our_new_mullah: "Наш новый мулла"
 GENERIC_our_new_mullah_desc: "Наша новая задача - найти муллу, который мог бы стать подходящим кандидатом на пост духовного лидера нашей страны."
 GENERIC_guards_of_revolution: "Стражи Новой революции"
 GENERIC_guards_of_revolution_desc: "Наша революция - это чудо, которое мы должны защитить любой ценой."
 GENERIC_public_defence_system: "Система государственной обороны"
 GENERIC_public_defence_system_desc: "Мы должны создать систему защиты нашего населения как от физических, так и от психологических нападений."
 GENERIC_civil_sharia: "Гражданский шариат"
 GENERIC_civil_sharia_desc: "Мы должны использовать законы шариата, чтобы основать на них наш гражданский кодекс."
 GENERIC_iranian_system: "Иранская система"
 GENERIC_iranian_system_desc: "Иранский опыт весьма полезен для нас - мы можем скопировать элементы их режима, которые могут нам пригодиться."
 GENERIC_islamic_socialism: "Исламский социализм"
 GENERIC_islamic_socialism_desc: "Объединение ислама и социализма - это прекрасная идея, которая может расширить возможности исламского рабочего класса."
 GENERIC_islamic_republic: "Исламская Республика"
 GENERIC_islamic_republic_desc: "Теперь мы можем официально провозгласить себя Исламской республикой."

 ##########DEMOCRATIC TREE##########
 GENERIC_democracy: "Демократия"
 GENERIC_democracy_desc: "Главной целью демократии является обеспечение благополучия граждан, защита их прав и свобод, а также контроль над властью."
 GENERIC_personal_freedom: "Личная свобода"
 GENERIC_personal_freedom_desc: "Обеспечение личных свобод граждан является нашим священным долгом и одной из основных целей демократии"
 GENERIC_social_equity: "Социальная справедливость"
 GENERIC_social_equity_desc: "Чтобы обеспечить стабильность в обществе, мы должны обеспечить ему социальное равенство"
 GENERIC_conservative_values: "Консервативные ценности"
 GENERIC_conservative_values_desc: "Обеспечение консервативных и традиционных ценностей необходимо для поддержания стабильности нашего общества"
 GENERIC_family_defence: "Защита семьи"
 GENERIC_family_defence_desc: "Защита семейных ценностей позволит нам обеспечить стабильность и сохранить темпы роста населения"
 GENERIC_minimal_government: "Минимальное правительство"
 GENERIC_minimal_government_desc: "Роль государства должна быть ограничена предоставлением только базовых услуг, таких как оборона, правоохранительная деятельность и обслуживание инфраструктуры"
 GENERIC_democratic_representation: "Демократическое представительство"
 GENERIC_democratic_representation_desc: "Через механизмы политического представительства (основными из которых являются выборы и политические партии) осуществляется вовлечение граждан в политический процесс"
 GENERIC_green_politic: "Зеленая политика"
 GENERIC_green_politic_desc: "Наша главная цель - создать общество с устойчивой окружающей средой, чтобы уменьшить негативное воздействие человека на экосистемы."
 GENERIC_welfare_state: "Государство всеобщего благосостояния"
 GENERIC_welfare_state_desc: "Наша задача - обеспечить граждан всеми необходимыми товарами и услугами для их комфортного проживания в государстве"
 GENERIC_freedom_of_speech: "Свобода слова"
 GENERIC_freedom_of_speech_desc: "Свобода слова - это фундаментальное право человека, признанное международным сообществом в качестве основополагающего элемента демократического общества."
 GENERIC_economic_deregulation: "Экономическая дерегуляция"
 GENERIC_economic_deregulation_desc: "Экономическое дерегулирование - это процесс сокращения или отмены государственного регулирования в определенных отраслях или секторах экономики"
 GENERIC_western_liberal_democracy: "Западная либеральная демократия"
 GENERIC_western_liberal_democracy_desc: "Западная либеральная демократия - форма представительной демократии, при которой принимаемые решения основываются на конституции, защищающей свободы личности и права меньшинств в обществе."
 GENERIC_independent_democracy: "Независимая демократия"
 GENERIC_independent_democracy_desc: "Независимая демократия - это способ политической жизни в обществе, при котором власти, их органы и действия выбираются, формируются и направляются исключительно нацией ради достижения материального благополучия, свободы и справедливости для всех граждан, социальных групп и народов."
 GENERIC_reactionary_democracy: "Реакционная демократия"
 GENERIC_reactionary_democracy_desc: "Реакционная демократия возникла как реакция на революционные движения и стремление к демократическому переустройству общества. Ее сторонники выступали за сохранение существующих политических структур, даже если они считались устаревшими"
 ##########NATIONALIST TREE##########
 GENERIC_nationalism: "Национализм"
 GENERIC_nationalism_desc: "Национализм - идеология и направление политики, основополагающим принципом которого является тезис о ценности наций или нации как высшей форме социального единства, ее главенстве в процессе формирования государства."
 GENERIC_glorious_past: "Славное прошлое"
 GENERIC_glorious_past_desc: "Оглядываясь на прошлое, мы должны строить будущее. В нашем славном прошлом наш могучий народ, возглавляемый сильным монархом, сокрушал врагов и прославлял флаг нашего государства. Во что бы то ни стало мы должны вернуть былую славу!"
 GENERIC_uncertain_times: "Смутные времена"
 GENERIC_uncertain_times_desc: "Установление военной диктатуры обычно связано с глубоким социально-экономическим кризисом в государстве, неспособностью гражданского правительства найти эффективные методы управления для преодоления кризиса"
 GENERIC_nation_spirit: "Дух Нации"
 GENERIC_nation_spirit_desc: "Мы призываем к объединению всей нашей чистокровной нации в рамках одного государства"
 GENERIC_against_establishment: "Против Истеблишмента"
 GENERIC_against_establishment_desc: "Антиэстеблишмент - это политическая идеология, которая выступает против существующих социальных, политических и экономических систем или структур. Она часто ассоциируется с движениями, которые ставят под сомнение текущее положение дел и стремятся к радикальным изменениям в обществе."
 GENERIC_traditional_values: "Традиционные ценности"
 GENERIC_traditional_values_desc: "Традиционные ценности - это нравственные ориентиры, формирующие мировоззрение граждан, передаваемые из поколения в поколение, лежащие в основе гражданской идентичности и единого культурного пространства страны, укрепляющие гражданское единство"
 GENERIC_people_representatives: "Представители народа"
 GENERIC_people_representatives_desc: "Мы выступаем за то, чтобы у власти были истинные представители народа"
 GENERIC_unity: "Единство"
 GENERIC_unity_desc: "Единство народа - это сплоченность людей, их готовность объединяться для достижения общих целей"
 GENERIC_militarization_society: "Милитаризация общества"
 GENERIC_militarization_society_desc: "Чтобы обеспечить национальную безопасность, мы должны милитаризировать общество, расширить воинскую повинность и быть готовыми перевести экономику на военную основу"
 militarization_society_tt: "Открывает решения §!«Программа милитаризации»§!"
 GENERIC_autoritarism: "Авторитаризм"
 GENERIC_autoritarism_desc: "Авторитаризм - это политический режим, при котором власть сосредоточена в руках одного лидера или узкой группы правящей элиты, а общество имеет ограниченное участие в управлении страной."
 GENERIC_our_interests: "Наши интересы"
 GENERIC_our_interests_desc: "Сейчас мы стоим на пороге выбора наших интересов, что для нас сейчас важнее: обеспечение внутренней стабильности или укрепление на международной арене"
 GENERIC_work_for_country: "Работа на благо страны"
 GENERIC_work_for_country_desc: "Государство превыше всего, мы должны обеспечивать жизнедеятельность страны, даже если для этого нам придется пожертвовать гражданскими свободами"
 GENERIC_protect_people: "Защитить людей"
 GENERIC_protect_people_desc: "Важнейшим государствообразующим фактором является народ, и мы должны обеспечить ему достойную жизнь, работу и будущее"
 GENERIC_fairness: "Справедливость"
 GENERIC_fairness_desc: "Понятие справедливости в фашизме связано с поиском реформ, но в целом идеология фашизма ориентирована на доминирование одной конкретной группы и пренебрежение к другим."
 GENERIC_power: "Мощь"
 GENERIC_power_desc: "Мощь государства - это совокупность материальных и духовных возможностей, используемых для достижения геополитических целей государства. Наша мощь должна вселять страх в наших врагов и защищать территориальную целостность нашей страны"
 ##########COMMUNIST TREE##########
 GENERIC_left_twist: "Поворот влево"
 GENERIC_left_twist_desc: "Левый поворот может обеспечить устойчивый рост экономики и благосостояния граждан"
 GENERIC_people_government: "Народное правительство"
 GENERIC_people_government_desc: "Народный комиссариат - центральный орган исполнительной власти, осуществляющий управление в определенной сфере деятельности государства или в определенной отрасли народного хозяйства."
 GENERIC_centralism: "Демократический централизм"
 GENERIC_centralism_desc: "Демократический централизм - это форма организационного и государственного устройства, основанная на обязательности решений вышестоящих органов для нижестоящих, при этом все органы избираются и подотчетны нижестоящим."
 GENERIC_socialism: "Демократический социализм"
 GENERIC_socialism_desc: "Демократический социализм - это политическая философия и идеология, сочетающая принципы демократии с идеалами социализма."
 GENERIC_five_year_plan: "Пятилетний план"
 GENERIC_five_year_plan_desc: "Пятилетний план - это план по подъему нашей промышленности и производства на новый уровень, чтобы обеспечить будущее нашей страны! \n\nФОКУС ЗАПУСКАЕТ МИССИЮ ПЯТИЛЕТНЕГО ПЛАНА. ДОСТИЖЕНИЕ ПРОГРЕССА ТРЕБУЕТ ПОСТОЯННОГО ПРИНЯТИЯ РЕШЕНИЙ, ПОЭТОМУ, ПРЕЖДЕ ЧЕМ НАЧАТЬ, УБЕДИТЕСЬ, ЧТО ВАША ЭКОНОМИКА СПРАВИТСЯ С ЭТИМ"
 generic_five_year_plan_tt: "Открывает решения§!\"Пятилетний план\"§!"
 GENERIC_limited_market: "Ограниченный рынок"
 GENERIC_limited_market_desc: "Мы должны прекратить бездумную раздачу наших ресурсов и позволить им быть использованными на благо нашей страны"
 GENERIC_class_matter_desc: "Классовый вопрос включает в себя различные аспекты, связанные с определением классов и классовой борьбы в разные периоды истории страны."
 GENERIC_class_matter: "Классовый Аспект"
 GENERIC_new_culture: "Культурный Аспект"
 GENERIC_new_culture_desc: "Теперь нам нужно решить, придерживаемся ли мы консервативного подхода, с сохранением культурных ценностей наших граждан, или пойдем по пути культурного марксизма"
 GENERIC_liberty: "Свобода"
 GENERIC_liberty_desc: "Говорят, что социализм гарантирует свободу каждому члену общества"
 GENERIC_equality: "Равенство"
 GENERIC_equality_desc: "Говорят, что социализм - это равенство в сфере занятости, доступа к ресурсам"
 GENERIC_fraternity: "Братство"
 GENERIC_fraternity_desc: "Братство при социализме - это содружество, единство, союз, основанный на общих целях и принципах"
 GENERIC_redistribution_income: "Перераспределение доходов"
 GENERIC_redistribution_income_desc: "Перераспределение доходов - это процесс, посредством которого государство вмешивается в распределение доходов между различными группами населения с целью уменьшения неравенства или достижения других социальных целей"
 GENERIC_militia: "Народное ополчение"
 GENERIC_militia_desc: "Ради внутренней безопасности мы должны сформировать ополчение из отважных граждан, которые добровольно встанут на защиту отечества"
 ##########AUTOCRATS TREE##########
 GENERIC_autocracy: "Автократия"
 GENERIC_autocracy_desc: "Самодержавие - это форма государственного устройства, при которой высшая государственная власть прямо или косвенно принадлежит одному субъекту"
 GENERIC_people_regime: "Народный режим"
 GENERIC_people_regime_desc: "Народная демократия - это форма политической организации общества, возникшая после Второй мировой войны в ряде стран Европы и Азии."
 GENERIC_independence: "Независимость"
 GENERIC_independence_desc: "Ради нашего будущего мы должны обеспечить наш суверенитет, при котором только мы одни можем диктовать, как нам жить."
 GENERIC_facade_democracy: "Фасадная демократия"
 GENERIC_facade_democracy_desc: "Фасадная демократия - это тип политической системы, в которой формальные демократические процедуры выступают в качестве фасада, за которым скрываются авторитарные практики"
 GENERIC_western_investments: "Западные инвестиции"
 GENERIC_western_investments_desc: "Чтобы разогнать нашу экономику, нам нужна помощь наших зарубежных коллег, я надеюсь, они не откажут нам в иностранных инвестициях"
 GENERIC_control_of_opposition: "Контроль оппозиции"
 GENERIC_control_of_opposition_desc: "Тенденция к подавлению оппозиции или ограничению ее деятельности может оказать негативное влияние на демократические институты и принципы. Однако это позволит нам укрепить наше правительство и стабилизировать политическую ситуацию в стране"
 GENERIC_economic_freedom: "Экономическая свобода"
 GENERIC_economic_freedom_desc: "Экономическая свобода - это принцип, лежащий в основе рыночной экономики, который позволяет хозяйствующим субъектам (предпринимателям, потребителям, государству) свободно принимать решения в экономической сфере"
 GENERIC_west: "Запад"
 GENERIC_west_desc: "Будущее лежит за западным курсом, поэтому мы должны стремиться к дружбе с НАТО и ЕС"
 GENERIC_no_foreign_agents: "Борьба с иностранными агентами"
 GENERIC_no_foreign_agents_desc: "Иностранные агенты все чаще проникают в политику нашей страны, и ради защиты нашего суверенитета мы обязаны бороться с этой напастью"
 GENERIC_friendship_with_everyone: "Дружба Со Всеми"
 GENERIC_friendship_with_everyone_desc: "Оставаясь независимыми, мы не можем оставаться без союзников. Политика нейтралитета позволяет нам довольно легко устанавливать хорошие отношения с любой державой"
 GENERIC_between_east_west: "Между Востоком и Западом"
 GENERIC_between_east_west_desc: "Находясь между двух огней, мы должны еще больше заботиться о суверенитете страны, чтобы не стать пешкой в политической игре"
 GENERIC_secret_police: "Секретная служба"
 GENERIC_secret_police_desc: ""
 GENERIC_police_state: "Полицейское государство"
 GENERIC_police_state_desc: "Полицейское государство - это образное выражение, описывающее общественный порядок, при котором власти жестко, в том числе с помощью репрессий, стремятся контролировать социальную, экономическую и политическую жизнь граждан."
 GENERIC_eastern_investments: "Восточные инвестиции"
 GENERIC_eastern_investments_desc: "Чтобы разогнать нашу экономику, нам нужна помощь наших зарубежных коллег, я надеюсь, они не откажут нам в иностранных инвестициях"
 GENERIC_national_patriotism: "Национал-Патриотизм"
 GENERIC_national_patriotism_desc: "Национально-патриотическое воспитание направлено на формирование чувства любви к своей малой родине, уважения к национальным традициям и культуре, пробуждение чувства гордости за свой народ."
 GENERIC_east: "Восток"
 GENERIC_east_desc: "Будущее лежит за восточным курсом, поэтому мы должны стремиться к дружбе с БРИКС и СНГ"
 ##########Decisions##########
 GENERIC_stabilization_govern_category: "Стабилизация страны"
 GENERIC_stabilization_govern_category_desc: "Государственный переворот в нашей стране оказал негативное влияние на политическую стабильность нашей страны, и мы должны немедленно приступить к стабилизации нашего государства, чтобы избежать гражданской войны."
 GENERIC_the_start_stabilization: "Результаты стабилизации"
 GENERIC_the_stabilization_army: "Стабилизация армии"
 GENERIC_the_stabilization_govern: "Стабилизация правительства"
 GENERIC_the_stabilization_society: "Стабилизация Медиа"
 GENERIC_militarization_category: "Программа милитаризации"
 GENERIC_militarization_category_desc: "\n\n£GFX_militarization_category_picture \n\n\n\n Программа милитаризации позволит нам защитить наш суверенитет от внешних угроз, быть готовыми отразить любое нападение потенциальных угроз и посеять страх в глазах наших врагов\n\n Это позволит нам подготовиться к предстоящим войнам, увеличить производство, набрать рабочую силу, отдавать приказы вашей армии и мобилизовывать ополчение во время войны\n\n Наши приготовления к войне идут полным ходом:§H[?war_preparedness]%§!"
 GENERIC_military_propaganda: "Военная пропаганда"
 GENERIC_expand_recruitment_centers: "Расширять центры подбора персонала"
 GENERIC_militarization_industry: "Милитаризация промышленности"
 GENERIC_military_training: "Военная подготовка"
 GENERIC_no_step_back: "Ни шагу назад"
 GENERIC_raise_militias: "Поднять ополчение"
 GENERIC_victory_or_death_dec: "Победа или Смерть!"
 GENERIC_five_year_plan_category: "Пятилетний план"
 GENERIC_five_year_plan_category_desc: "Председатель [ROOT.GetRulingParty], совместно с Центральным комитетом, составил§R Пятилетний план§!для развития нашей страны. Согласно плану, мы должны приумножить нашу§G продуктивность§!, поднять§G промышленность§! и обеспечить стабильное§G производство§! для будущего столетия.\n\n Прогресс Пятилетнего плана: §H[?five_year_plan_progress]%"
 GENERIC_support_workers: "Поддержка рабочих"
 GENERIC_increase_industry_turnover: "Увеличение промышленного оборота"
 GENERIC_expand_industry: "Расширение промышленности"
 five_year_plan_mission: "Пятилетний план"
 five_year_plan_mission_desc: "Если мы не выполним пятилетний план, это станет катастрофой для нашей экономики. В период действия плана,§R мы не должны ввязываться ни в какие войны§! и мы должны сосредоточиться на поддержке нашей промышленности"
 GENERIC_expand_agriculture: "Сельскохозяйственная экспансия"
 GENERIC_expand_energetic: "Расширение энергетического сектора"
 GENERIC_start_five_year_plan: "Начать Пятилетний план"
 GENERIC_start_five_year_plan_desc: "§R ВНИМАНИЕ: приступайте к выполнению пятилетнего плана только в том случае, если вы уверены в своей экономике и не планируете вступать в войну в течение следующих 5 лет. Для выполнения плана необходимо постоянно прожимать решение, иначе у вас не будет времени на выполнение плана и вы столкнетесь с последствиями!"

 GENERIC_economic_category: "Экономическая политика"
 GENERIC_economic_category_desc: "§Y[ROOT.GetFlag]Каждая нация§! должна поддерживать определенный уровень энергетического обеспечения, чтобы ее функции и сервисы не выходили из строя. Если мы§R не сможем§! поддерживать постоянно растущие§Y энергетические потребности§! нашей экономики, мы можем столкнуться с огромными §Rпоследствиями§! и§R полномасштабным экономическим кризисом.§!\n[GENERIC_DEBT_loc]\n"
 GENERIC_russian_investments: "@SOV Российские инвестиции"
 GENERIC_china_investments: "@CHI Китайские инвестиции"
 GENERIC_india_investments: "@RAJ Индийские инвестиции"
 GENERIC_iran_investments: "@PER Иранские инвестиции"
 GENERIC_usa_investments: "@USA Инвестиции Соединенных Штатов"
 GENERIC_france_investments: "@FRA Французские инвестиции"
 GENERIC_german_investments: "@GER Немецкие инвестиции"
 GENERIC_british_investments: "@ENG Британские инвестиции"
 NKR_bridge_artsakh: "§YBridge Арцах§! Экономический форум"

 GENERIC_nato_ratification_category: "Членство в НАТО"
 GENERIC_nato_ratification_category_desc: "\n£GFX_MAIN_desctext_nato \n\n\n Альянс НАТО - это будущее, там есть все самые передовые военные технологии, и для обеспечения безопасности наших границ мы должны наладить отношения с альянсом и, возможно, даже стать полноправными членами НАТО"
 GENERIC_nato_pfp_decision: "Партнерство во имя мира"
 GENERIC_nato_pfp_mission: "Получение PfP статуса"
 GENERIC_nato_ipap_application_decision: "Подать заявку для статуса §2IPAP§!"
 nato_not_eastern_influence10: "@SOV Русское, @CHI Китайское или @PER Иранское влияние ниже, чем 10%"
 nato_not_eastern_influence40: "@SOV Русское, @CHI Китайское или @PER Иранское влияние ниже, чем 40%"
 GENERIC_nato_ipap_decision: "Получить§2IPAP§! статус"
 GENERIC_nato_accelerated_dialogue_decision: "Начать ускоренный диалог с НАТО"
 GENERIC_nato_accelerated_dialogue_misson: "Получение статуса ускоренного диалога"
 nato_ad_accept_tt: "Наши расходы на обеспечение безопасности должны быть не менее§2Значительное финансирование полиции и разведки§!"
 GENERIC_nato_accelerated_dialogue_tt: "Мы получим статус§2Ускоренный диалог с НАТО§!"
 GENERIC_nato_application: "Голосование за [ROOT.GetName] вступление в НАТО"
 GENERIC_nato_join: "Вступить в НАТО"
 GENERIC_STANAG_accept: "Принять§2STANAG§!"
 GENERIC_csto_ratification_category: "Членство в ОДКБ"
 GENERIC_csto_ratification_category_desc: "\n£MAIN_desctext_csto\n\n\n\n§YОДКБ§!, или §YОрганизация Договора о Коллективной Безопасностиn§! — региональная международная организация в области коллективной безопасности с участием нескольких постсоветских государств. Провозглашаемые цели: укрепление мира, международной и региональной безопасности и стабильности, защита на коллективной основе независимости, территориальной целостности и суверенитета государств-членов, приоритет в достижении которых государства-члены отдают политическим средствам"
 GENERIC_csto_exercises: "Военные Учения ОДКБ"
 GENERIC_csto_defence: "Договор о взаимной обороне"
 GENERIC_csto_friendship_treaty: "Торговое соглашение с §2ОДКБ§! странами"
 GENERIC_csto_research_sharing: "Соглашение о передаче знаний"
 GENERIC_csto_research_sharing_idea: "Соглашение в рамках ОДКБ о передаче знаний"
 GENERIC_csto_join_to_faction: "Вступление в ОДКБ"
 CSTO_joint_operation: "Совместная операция ОДКБ"
 CSTO_intervention_cooldown: "Недавняя совместная операция ОДКБ"
 CSTO_stabilization: "ОДКБ Подавление Протестов"
 GENERIC_hamas_support_category: "Поддержать ХАМАС"
 GENERIC_hamas_support_category_desc: "\n\n\n\n\n\n£GFX_GENERIC_hamas_support_category\n\n\n\n\n\n\n\n\n В 1948 году на территории Палестины было создано еврейское государство Израиль. В то же время большую часть «Еврейского национального очага» составляло арабское население, которое агрессивно отреагировало на британский мандат. Масла в огонь подлили постоянная агрессия Тель-Авива против арабского мира и репрессии против палестинского населения.\n\n Агрессивная экспансия Израиля почти полностью поглотила палестинское государство. Еще во время первой войны в 1987 году в секторе Газа был создан ХАМАС, чтобы вытеснить ФАТХ (Движение за национальное освобождение Палестины). В отличие от ФАТХ, ХАМАС выступал за радикальную оппозицию Израилю и создание исламского арабского государства на всей территории Израиля, сектора Газа и Западного берега. ХАМАС продолжает свою радикальную борьбу против Израиля по сей день.\n\n Мы обязаны помогать нашим мусульманским друзьям в борьбе за свободу, независимость и светлое будущее на их территории."
