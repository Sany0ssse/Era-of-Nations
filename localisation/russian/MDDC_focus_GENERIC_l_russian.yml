 redux_generic_news.1.t: "Era of Nations"
 redux_generic_news.1.d: "Добро пожаловать в Era of Nations. Это начальная сборка отдельного ответвления с унаследованным игровым контентом.\nМы продолжаем разработку на этой основе. Источники и авторы сохранены в документации проекта."
 redux_generic_news.1.a: "Удачной игры!"
 redux_generic_news.1.b: "Мне нравится сюжет."
 redux_generic_news.1.c: "Мне не нравится сюжет."

 redux_generic_news.2.t: "Era of Nations: ДОВСЕ"
 redux_generic_news.2.d: "Когда вы входите в игру, вы можете заметить, что не можете создавать новые дивизии или редактировать шаблоны армии. Обратите внимание на первую вкладку в панели законов, а именно ДОВСЕ, чтобы восстановить доступ к редактированию шаблонов и созданию новых бригад."
 redux_generic_news.2.a: "Подробнее"

 redux_generic_news.3.t: "Era of Nations: Департаменты"
 redux_generic_news.3.d: "Одной из особенностей мода является механика департаментов. Чтобы не «захламлять» панель национальных духов, было решено создать отдельную панель, где игрок может выбрать оптимальную «сборку» из департаментов, которые открываются определёнными фокусами и имеют особый цвет."
 redux_generic_news.3.a: "Подробнее"

 redux_generic_news.4.t: "Era of Nations: Компании и филиалы"
 redux_generic_news.4.d: "В дополнение к департаментам, игрок также может выбрать оптимальную сборку из компаний, которые также имеют свой собственный цвет, что позволяет легко идентифицировать фокус, открывающий новую компанию. Кроме того, на нижней панели есть филиалы. Это позволяет использовать бонусы компании из другой страны, в то время как компания получает большее влияние на вас."
 redux_generic_news.4.a: "Хорошо"

 redux_generic_news.5.t: "СИМВОЛ НАЦИИ НЕ МОЖЕТ В ТУАЛЕТ"
 redux_generic_news.5.d: "'Господин президент, люди вышли на улицы! Они скандируют ваше имя! ...Вы меня слышите? ...Почему вы заперлись в туалете?' — последняя передача пресс-секретаря перед тем, как охрана выломала дверь.\nИсторическая речь была триумфом. Толпа на площади ревела. Телекамеры запечатлели каждую слезу волнения. Рейтинги взлетели до стратосферы. Аналитики уже писали статьи о 'новом курсе' и 'возрождении нации'. Но никто не знает правды. Никто не знает, что последние сорок пять минут, пока президент говорил о светлом будущем, его раздирал изнутри чудовищный свинцовый груз. Тот злополучный предвыборный ужин — шашлык, запитый тремя видами вина и эспрессо ядерной крепости — выбрал самый неподходящий момент, чтобы дать о себе знать. Дипломатический протокол, корсет, живой микрофон, камеры со всех сторон — адская смесь.\nТеперь он здесь. Один. Колени дрожат. Пиджак расстегнут, галстук съехал набок, лоб покрыт испариной. Мир балансирует на грани ядерной войны, фондовый рынок в смятении, а великий лидер великой державы сидит на своём троне, сжимая в руках свою речь, умоляя богов о чуде.\n— Просто выходи, ублюдок... — шепчет он в пустую комнату, забыв, что живой микрофон всё ещё прикреплён к карману пиджака.\nВ этот момент вся страна слышит его предсмертный хрип.\nВ соседней комнате советники в панике: президент не выходил уже пятнадцать минут. Охрана готовится выломать дверь. Интернет уже породил мем: 'В поисках лидера в его последнем бункере'. А он сидит там, понимая, что судьба мира теперь зависит не от кнопки ядерного чемоданчика, а от совершенно другой кнопки — той, которая просто отказывается работать."
 redux_generic_news.5.a: "ПРИТВОРИТЕСЬ, ЧТО ПРОСТО ЗАДУМАЛИСЬ"

 redux_generic_news.6.t: "ГОССЛУЖАЩИЙ, ХОТ-ДОГ И ГНЕВ СИСТЕМЫ"
 redux_generic_news.6.d: "'У нас есть кадры, на которых офицер Моррисон принимает что-то от продавца. Нам нужно знать, что это было. Народ требует прозрачности. Департамент требует козла отпущения. Честно говоря, я просто требую обеда'.\n— Записка внутренних дел, позже рассекреченная и немедленно засекреченная снова.\nЭто была медленная смена. Такая смена, которая заставляет вас задуматься, зачем вы вообще когда-то надели значок. Офицер Моррисон был на ногах шесть часов, улаживая споры о мусорных баках и говоря подросткам пройти мимо. Его желудок заурчал. Лоток с хот-догами на углу, которым управлял весёлый парень по имени Влад, который определённо не торговал крадеными часами на стороне, манил его, как песнь сирены.\nВсего один. Быстрый перекус. Он заплатит полную цену. Никто не заметит.\nОн забыл о нательной камере.\nОн забыл о прямой трансляции.\nОн забыл о новом программном обеспечении для мониторинга на основе ИИ, созданном для обнаружения 'неавторизованного потребления калорий в рабочее время'.\nУведомление пришло через тридцать секунд после первого укуса. Экран его патрульной машины засветился: 'НАРУШЕНИЕ 47-B: ПОТРЕБЛЕНИЕ НЕВЫДАННОГО ПРОДОВОЛЬСТВИЯ НА ВИДУ У ПУБЛИКИ. НЕМЕДЛЕННО ЯВИТЬСЯ В ОТДЕЛ ВНУТРЕННИХ РАССЛЕДОВАНИЙ'.\nК тому времени, как он прожевал, подъехали телевизионные фургоны. К тому времени, как он вытер горчицу с губы, мэр проводил экстренную пресс-конференцию. К тому времени, как он вернулся в участок, его стол был очищен, шкафчик опечатан, а свежераспечатанное письмо об увольнении ждало его, всё ещё тёплое от принтера.\nХот-дог обошёлся ему в три доллара пятьдесят центов.\nРабота стоила ему двадцати трёх лет.\nВлад, со своей стороны, повесил на свою тележку рамку с фотографией офицера Моррисона. Под ней маленькая табличка: 'Он умер за ваше право есть в тишине'."
 redux_generic_news.6.a: "ПОТРЕБОВАТЬ СЛУШАНИЯ (ПРИНЕСИТЕ СВОЙ ОБЕД)"

 redux_generic_news.7.t: "ВЕЛОСИПЕД И БЕРЁЗА: ТРАГЕДИЯ НА ДВУХ КОЛЁСАХ"
 redux_generic_news.7.d: "'Я всё видел. Он ехал так быстро. Словно соревновался с самим ветром. Затем ветер победил. Дерево просто... стояло там. Оно даже не вздрогнуло'.\n— Очевидец, прежде чем стать местной знаменитостью и дать интервью каждому новостному каналу в радиусе пятидесяти миль.\nУтро было идеальным. Солнечный свет просачивался сквозь листья. Пели птицы. Недавно заасфальтированная велосипедная дорожка тянулась вперёд, как лента бесконечных возможностей. Виктор готовился к этому моменту. Месяцы подготовки. Строгая диета. Индивидуальная карбоновая рама. Новейшая аэродинамическая технология шлема.\nОн шёл на рекорд.\nСегмент Strava назывался 'Прибрежный забег'. Три километра пологих поворотов, оптимальные условия и, что самое важное, — никакого движения. Он пытался сделать это сорок семь раз. Сорок семь неудач. Сегодня всё будет иначе. Сегодня он чувствовал это в ногах. Силу. Ритм. Сама вселенная, казалось, подталкивала его вперёд.\nЕго телефон пискнул. Личный рекорд на половине дистанции.\nЕго телефон пискнул снова. Кто-то оценил его вчерашнее фото в Strava.\nЕго телефон пискнул в третий раз. Предупреждение о низком заряде батареи.\nОн посмотрел вниз.\nВсего на секунду.\nКак раз достаточно, чтобы не заметить берёзу, которая стояла на этом самом месте семьдесят три года. Как раз достаточно, чтобы не увидеть её древнюю, терпеливую кору, тянущуюся, чтобы обнять его. Как раз достаточно, чтобы не услышать шёпот ветра: 'Посмотри вверх, идиот'.\nУдар был впечатляющим. Свидетели позже описывали его как 'поэтичный' и 'самое смешное, что я когда-либо видел, а я видел, как клоун падает с лестницы'. Велосипед, когда-то гладкая машина спортивных амбиций, теперь напоминал современное искусство — в частности, произведение под названием 'Потребительство встречается с дендрологией'.\nВиктор очнулся три часа спустя в кустах, в шести метрах от дерева. Его шлем треснул. Его гордость была разбита. Его телефон, каким-то чудом всё ещё работающий, показывал уведомление: 'Новый рекорд Strava! 'Прибрежный забег' - 47,2 км/ч! Хотите поделиться этим достижением?'.\nНа заднем плане берёза стояла молча. Неподвижно. Победоносно."
 redux_generic_news.7.a: "ВИНИТЕ СОЛНЦЕ"

 five_year_plan.1.t: "Пятилетний план провалился"
 five_year_plan.1.desc: "К сожалению, мы не смогли добиться успехов, поставленных нашим руководством, что показало неэффективность нашей отрасли. Пятилетний план провалился"
 five_year_plan.1.a: "Это настоящая катастрофа"
 five_year_plan.2.t: "Пятилетний план выполнен"
 five_year_plan.2.desc: "Мы добились успеха в достижении наших целей. Нам удалось увеличить нашу промышленность и производство, наши потомки могут быть уверены в светлом будущем нашей страны"
 five_year_plan.2.a: "Слава труду!"
 f_invest.1.t: "[FROM.GetName] просит наших инвестиций"
 f_invest.1.desc: "Мы получили предложение предоставить инвестиции государству [FROM.GetName]. Должны ли мы принять это предложение?"
 f_invest.1.a: "Принять"
 f_invest.1.b: "Отклонить"
 f_invest.2.t: "[FROM.GetName] приняли наше предложение"
 f_invest.2.desc: "[FROM.GetName] приняли наше предложение о предоставлении инвестиций"
 f_invest.2.a: "Отлично"
 f_invest.3.t: "[FROM.GetName] отклонили наше предложение"
 f_invest.3.desc: "[FROM.GetName] отклонили наше предложение об инвестициях. Может быть, у них просто нет денег, или, может быть, нам стоит попытаться улучшить наши отношения."
 f_invest.3.a: "Печально"
 generic_nato.6.t: "Соединенные Штаты отказываются сотрудничать"
 generic_nato.6.desc: "Соединенные Штаты отказываются сотрудничать с нами, возможно, потому, что боятся, что это может создать напряженность в отношениях с восточными державами, или просто из-за личной неприязни..."
 generic_nato.6.a: "Может быть, в следующий раз"
 generic_nato.7.t: "Соединенные Штаты согласны сотрудничать"
 generic_nato.7.desc: "Соединенные Штаты согласны сотрудничать. Это могло бы укрепить наши отношения с Соединенными Штатами и другими членами НАТО и приблизить нас к потенциальному членству в Североатлантическом союзе"
 generic_nato.7.a: "Отличное начало"
 generic_nato.3.t: "[FROM.GetName] Хочет получить статус IPAP"
 generic_nato.3.desc: "[FROM.GetName] хочет получить статус участника Индивидуального плана партнерства с НАТО. Ратифицировав для них этот статус, мы получим обязательство защищать их в случае конфликта"
 generic_nato.3.a: "Мы ратифицируем это соглашение"
 generic_nato.3.b: "Мы отказываемся"
 generic_nato.8.t: "[FROM.GetName] Ратифицировали наше членство"
 generic_nato.8.a: "Отлично"
 generic_nato.8.desc: "[FROM.GetName] ратифицировав наш статус IPAP, делают нас более сплоченными. Возможно, в будущем мы сможем найти для себя место в рядах альянса"
 generic_nato.9.t: "[FROM.GetName] отказались ратифицировать нас"
 generic_nato.9.a: "Может быть, в следующий раз"
 generic_nato.9.desc: "[FROM.GetName] отказались ратифицировать наш статус IPAP. Возможно, нам следует лучше вести дипломатическую работу с этой страной."
 generic_nato.4.t: "[FROM.GetName] Хочет вступить в альянс НАТО"
 generic_nato.4.desc: "[FROM.GetName] долгое время были нашими хорошими союзниками за пределами альянса, они стали нашими неофициальными членами, теперь пришло время закрепить их полное вступление в альянс и сделать его официальным"
 generic_nato.4.a: "Мы ратифицируем это соглашение"
 generic_nato.4.b: "Мы отказываемся"
 generic_nato.10.t: "[FROM.GetName]ратифицировали нас о присоединении к НАТО"
 generic_nato.10.a: "Отлично"
 generic_nato.10.desc: "[FROM.GetName]Ратифицирует нас для полноправного вступления в Североатлантический союз в качестве постоянного члена. Наше сотрудничество уже давно стало более тесным, и теперь мы на шаг ближе друг к другу"
 generic_nato.11.t: "[FROM.GetName]отказались ратифицировать нас"
 generic_nato.11.a: "Печально"
 generic_nato.11.desc: "[FROM.GetName]отказываются ратифицировать нас как кандидата на постоянное членство в НАТО. Возможно, нам следует улучшить наши дипломатические отношения с ними и укрепить наши взаимоотношения"
 generic_nato.1.t: "[FROM.GetName] хочет установить военное партнерство с НАТО"
 generic_nato.1.desc: "[FROM.GetName]обратившись к нам с предложением о сотрудничестве в рамках военной безопасности, они надеются, что мы поможем им обеспечить безопасность их границ и увеличить их военный потенциал для защиты их суверенитета."
 generic_nato.1.a: "Конечно, мы согласны"
 generic_nato.1.b: "Мы не будем ничем рисковать"
 generic_nato.5.t: "Мы не смогли выполнить требования НАТО"
 generic_nato.5.desc: "Нам не удалось вовремя выполнить основные требования альянса по получению нового статуса, возможно, нам стоит попробовать сделать это еще раз"
 generic_nato.5.a: "Печально"
 generic_csto.1.t: "Заключить торговое соглашение со странами ОДКБ"
 generic_csto.1.desc: "[FROM.GetName] хочет заключить с нами торговое соглашение в рамках своего сближения со странами-членами альянса ОДКБ."
 generic_csto.1.a: "Мы согласны"
 generic_csto.1.b: "Неа"
 generic_csto.2.t: "[FROM.GetName] согласились принять нашу сделку"
 generic_csto.2.desc: "[FROM.GetName] договорились подписать торговое соглашение с нашей страной. Это делает нас еще более сплоченными"
 generic_csto.2.a: "Отлично"
 generic_csto.3.t: "[FROM.GetName] отказываются от соглашения"
 generic_csto.3.desc: "[FROM.GetName] отказываются подписывать с нами торговое соглашение, может быть, позже они одумаются"
 generic_csto.4.t: "Соглашение об обороне с [FROM.GetName]"
 generic_csto.4.desc: "[FROM.GetName] хочет подписать с нами договор о взаимной обороне. Если мы согласимся, то возьмем на себя двусторонние обязательства по защите границ и суверенитета наших стран"
 generic_csto.4.a: "Мы согласны"
 generic_csto.4.b: "Неа"
 generic_csto.5.t: "[FROM.GetName] хочет вступить в ОДКБ"
 generic_csto.5.desc: "[FROM.GetName] решили подать заявку на рассмотрение о вступлении в альянс ОДКБ. Примем ли мы их заявку?"
 generic_csto.5.a: "Добро пожаловать"
 generic_csto.5.b: "Мы пока не готовы их принять."
 generic_csto.9.t: "[FROM.GetName] присоединяется к ОДКБ"
 generic_csto.9.desc: "[FROM.GetName] сегодня объявили, что они решили вступить в ОДКБ. Россия уже объявила, что заявка на вступление уже рассмотрена и готова к подписанию. Уже ясно, что это изменит баланс сил и усилит российское влияние в регионе. Реакции со стороны НАТО пока не последовало"
 generic_csto.9.a: "Неожиданно"
 generic_csto.8.t: "Россия отказывается"
 generic_csto.8.desc: "Россия не готова рассматривать нашу заявку на вступление в ОДКБ"
 generic_csto.8.a: "Может быть, позже"
 generic_csto.6.t: "[FROM.GetName] Согласны"
 generic_csto.6.desc: "[FROM.GetName] согласились принять наше соглашение о двустороннем оборонном договоре"
 generic_csto.6.a: "Хорошо"
 generic_csto.7.t: "[FROM.GetName] отказываются"
 generic_csto.7.desc: "[FROM.GetName] отказываются принять наше соглашение о двустороннем договоре об обороне"
 generic_csto.7.a: "Печально"
 generic_csto.10.t: "[FROM.GetName] хочет заключить с нами соглашение об обмене знаниями"
 generic_csto.10.desc: "[FROM.GetName] хочет заключить с нами соглашение о передаче знаний. Мы можем помочь им догнать ведущие технологические державы и значительно сблизить отношения между нашими странами"
 generic_csto.10.a: "Конечно! Мы согласны"
 generic_csto.10.b: "Не сейчас"
 generic_csto.11.t: "Россия согласилась"
 generic_csto.11.desc: "Россия согласилась на обмен знаниями с нашей страной. Это даст нам хороший толчок в развитии технологий"
 generic_csto.11.a: "Заебись!"
 generic_csto.12.t: "Россия отказывается"
 generic_csto.12.desc: "Россия отказалась помочь нам с передачей знаний. Похоже, нам придется полагаться на самих себя"
 generic_csto.12.a: "Дерьмо!"
 generic_csto.13.t: "[FROM.GetNameWithFlag] просит о помощи в военной операции"
 generic_csto.13.d: "[FROM.GetName] начал военную операцию и просит нашей поддержки. Доктрина ОДКБ не обязывает нас вести наступательную войну, мы вольны отказаться, но должны ли мы бросать нашего союзника?"
 generic_csto.13.a: "Мобилизовать силы!"
 generic_csto.13.b: "Мы не должны вмешиваться"
 generic_csto.14.t: "[FROM.GetNameWithFlag] откликнулись, чтобы поддержать операцию"
 generic_csto.14.d: "[FROM.GetName] откликнулись на наш призыв, они помогут нам провести военную операцию. Возможно, они преследуют свои собственные цели, а может быть, они просто решили поддержать союзника, в любом случае, это еще больше сблизит нас"
 generic_csto.14.a: "Очень хорошо!"
 generic_csto.15.t: "[FROM.GetNameWithFlag] просит о помощи в подавлении протестов"
 generic_csto.15.d: "[FROM.GetName] В стране проходят протесты, угрожающие конституционному порядку. Доктрина ОДКБ не обязывает нас вмешиваться во внутренние дела союзника, мы вольны отказаться, но должны ли мы бросать своего союзника?"
 generic_csto.15.a: "Мобилизовать силы!"
 generic_csto.15.b: "Мы не должны вмешиваться"
 generic_csto.16.t: "[FROM.GetNameWithFlag] откликнулся на нашу просьбу в подавлении протестов"
 generic_csto.16.d: "[FROM.GetName] откликнулся на наш призыв, они помогут нам подавить протесты. Возможно, они преследуют свои собственные цели, а может быть, они просто решили поддержать союзника, в любом случае, это еще больше сблизит нас"
 generic_csto.16.a: "Очень хорошо!"
 generic_csto.17.t: "Проводить военные учения с [FROM.FROM.GetNameWithFlag]"
 generic_csto.17.d: "Совместные военные учения позволят нам обменяться военным опытом и подготовиться к возможным боевым операциям, выявить и устранить недостатки нашей армии и проверить боевую эффективность вооружений. Какие военные учения нам необходимо провести?"
 generic_csto.17.a: "Армейские учения"
 generic_csto.17.b: "Летные учения"
 generic_csto.17.c: "Военно-морские учения"
 generic_csto.18.t: "[FROM.GetNameWithFlag] хочет проводить с нами армейские учения"
 generic_csto.18.d: "[FROM.GetName] хочет провести с нами военные учения. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам. Должны ли мы согласиться?"
 generic_csto.18.a: "Давайте приступим к учениям"
 generic_csto.18.b: "Сейчас не самое подходящее время"
 generic_csto.19.t: "[FROM.GetNameWithFlag] хочет проводить воздушные учения с нами"
 generic_csto.19.d: "[FROM.GetName] хочет провести с нами военные учения. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам. Должны ли мы согласиться?"
 generic_csto.19.a: "Давайте приступим к учениям"
 generic_csto.19.b: "Сейчас не самое подходящее время"
 generic_csto.20.t: "[FROM.GetNameWithFlag] хочет проводить с нами военно-морские упражнения"
 generic_csto.20.d: "[FROM.GetName] хочет провести с нами военные учения. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам. Должны ли мы согласиться?"
 generic_csto.20.a: "Давайте приступим к учениям"
 generic_csto.20.b: "Сейчас не самое подходящее время"
 generic_csto.21.t: "[FROM.GetNameWithFlag] согласились провести военные учения"
 generic_csto.21.d: "[FROM.GetName] согласились о проведении с нами военных учений. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам."
 generic_csto.21.a: "Отлично!"
 generic_csto.22.t: "[FROM.GetNameWithFlag] отказались от проведения военных учений"
 generic_csto.22.d: "[FROM.GetName] отказались проводить с нами военные учения. Возможно, сейчас для них не лучшее время."
 generic_csto.22.a: "Может быть, позже..."
 generic_muslims.4.t: "[FROM.GetName] поддержали нас!"
 generic_muslims.4.desc: "[FROM.GetName] поддерживает нас в борьбе с Израилем. Этот жест доброй воли от наших исламских друзей очень поможет нам и заложит фундамент для будущей дружбы"
 generic_muslims.4.a: "Отлично!"
 generic_muslims.1.t: "[FROM.GetName] обращается за помощью к нашему фонду"
 generic_muslims.1.desc: "[FROM.GetName] просит помощи у нашего фонда. Это поможет им в развитии государства и усилит наше влияние на них."
 generic_muslims.1.a: "Добро пожаловать"
 generic_muslims.1.b: "Не сейчас"
 generic_muslims.2.t: "Катар согласен"
 generic_muslims.2.desc: "Катар согласен расширить свой фонд для нашей страны. Это даст нам хороший толчок в развитии системы образования, повысит грамотность и позволит нам догнать ведущие державы в области технологий"
 generic_muslims.2.a: "Отлично"
 generic_muslims.3.t: "Катар отказывается"
 generic_muslims.3.desc: "Катар отказался нам помочь. Ну, не в этот раз, мы справимся сами."
 generic_muslims.3.a: "На самом деле мы этого не хотели"
 generic_salafists.2.t: "[FROM.GetName] хочет наладить сотрудничество с нами"
 generic_salafists.2.desc: "[FROM.GetName] - страна, власть в которой находится в руках салафитов с идеологией, схожей с нашей. Они направили нам запрос о сотрудничестве, мы могли бы поддержать их инвестициями, обеспечить защиту или отказать и оставить их на произвол судьбы. Что нам следует выбрать?"
 generic_salafists.2.a: "Абсолютная поддержка"
 generic_salafists.2.b: "Давайте поддержим их инвестициями"
 generic_salafists.2.c: "Давайте поддержим их независимость"
 generic_salafists.2.d: "Не поддерживайте их"
 generic_salafists.1.t: "Сокрушить язычников"
 generic_salafists.1.d: "В нашем новом режиме, неверные подвергаются праведным наказаниям за их грехи. Теперь мы можем начать готовить наше общество к гораздо более жёсткому подходу к нашему делу. Скоро наша страна станет чистой, и любое несогласие будет искоренено"
 generic_salafists.1.a: "Чудесно!"
 generic_salafists.3.t: "Приглашение в Союз исламских государств"
 generic_salafists.3.d: "[FROM.GetName] направило официальное приглашение нам присоединиться к Союзу исламских государств. Их дипломат говорит с убеждением: 'Наши мусульманские нации должны объединиться против западного империализма и светских влияний. Вместе мы сможем создать экономический и военный союз, который защитит наши исламские ценности и сохранит наш суверенитет. Разделённые, мы остаёмся уязвимыми для культурной эрозии и политического подчинения.'\n\nАльянс обещает договоры о взаимной обороне, преференциальные торговые соглашения и религиозную солидарность во всём исламском мире. Должны ли мы объединиться с нашими братьями-мусульманами в этой панисламской коалиции?"
 generic_salafists.3.a: "Вместе мы сильнее!"
 generic_salafists.3.b: "Мы должны вести джихад самостоятельно!"
 generic_salafists.4.t: "Ярость джихада"
 generic_salafists.4.d: "Час возмездия настал. Наши братья по вере объединились, и теперь мы обращаем свой взор к землям Европы — тем самым землям, откуда когда-то выступали крестоносцы, чтобы осквернить наши святыни и пролить мусульманскую кровь. [FROM.GetNameDef] призывает всех верующих подняться на священную войну. Мы отомстим за столетия унижений и восстановим славу ислама! Европа вкусит джихад, восстающий из самого сердца уммы."
 generic_salafists.4.a: "Аллаху Акбар!"
 generic_salafists.5.t: "Провозглашён Союз исламских государств"
 generic_salafists.5.d: "[FROM.GetNameDef] объявил о создании Союза исламских государств — нового военного альянса, объединяющего радикальные салафитские движения по всему мусульманскому миру. Союз провозглашает священную войну против всех, кто не склоняется перед их толкованием законов шариата. Мировые лидеры реагируют с тревогой, опасаясь новой волны экстремизма, которая может дестабилизировать целые регионы."
 generic_salafists.5.a: "Аллаху Акбар!"
 generic_salafists.5.b: "С Востока поднимается серьёзная угроза…"

