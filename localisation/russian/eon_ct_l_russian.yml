l_russian:
 eon_withdraw_antiterror_proposal:0 "Отозвать предложение о борьбе с терроризмом"
 eon_withdraw_antiterror_proposal_desc:0 "Только исходный отправитель может отозвать своё непринятое предложение о сотрудничестве против терроризма. Отзыв бесплатен; 75 политической власти, потраченные на предложение, не возвращаются. Исходный ответ сохраняет резерв этой пары до закрытия или истечения 30-дневного срока. Истёкшее предложение без ответа закрывает эту пару для будущих антитеррористических предложений. Действующие соглашения остаются отдельными."
 eon_withdraw_antiterror_proposal_send_desc:0 "Отозвать наше исходное предложение о сотрудничестве против терроризма для [From.GetName]? Отзыв не требует политической власти и не прекращает уже принятое соглашение. Исходный ответ сохраняет резерв до закрытия или истечения срока; истёкшее предложение без ответа закрывает эту пару для будущих антитеррористических предложений."
 eon_ct_withdraw_tt:0 "Исходный отправитель может отозвать ожидающее предложение без дополнительных затрат. Согласие после отзыва не начнёт сотрудничество. Исходный ответ нужно закрыть до освобождения пары; истечение срока закрывает её для будущих антитеррористических предложений. Уже потраченные 75 политической власти не возвращаются."
 eon_ct_send_tt:0 "Обе страны должны быть свободны от других ожидающих антитеррористических предложений. Мнение получателя о нас должно быть выше 9; ни он, ни его союзники не должны воевать с нами. Отправка стоит 75 политической власти и запускает действующую 120-дневную задержку отправки. Ответ нужно дать в течение 30 дней. Сотрудничество начинается только после действительного согласия: каждая сторона получает +0.05 эффективности борьбы с терроризмом и резервирует 5 максимальной командной власти, с существующей компенсацией +5 для ИИ. Обычные антитеррористические операции сохраняют свои условия и не гарантируют успеха."
 eon_ct_end_tt:0 "Прекратить это соглашение о борьбе с терроризмом без согласия другой страны за существующую стоимость 75 политической власти. Удалить мнение от сотрудничества с этим партнёром и один раз обратить его определимый вклад: -0.05 эффективности, освободить резерв 5 командной власти и убрать существующую компенсацию +5 для ИИ. Другие партнёры и их вклады остаются отдельными. Действует существующая 120-дневная задержка отправки."
