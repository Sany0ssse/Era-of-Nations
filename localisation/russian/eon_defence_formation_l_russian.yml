l_russian:
 eon_defence_formation_offer_available_tt:0 "Получатель может выделить §Y5 480 военнослужащих§! и принадлежащую ему контролируемую область для одного национального формирования. Мы можем предоставить всё снаряжение: §Y1 623 единицы стрелкового оружия, 150 систем управления и связи, 36 артиллерийских орудий, 76 ПТРК и 50 ПЗРК§!. Уже существующий зарезервированный шаблон должен принадлежать этой программе поддержки. Просроченное предложение без ответа навсегда закрывает эти предложения партнёру; старое предложение с неизвестным партнёром закрывает весь этот канал поддержки."
 eon_defence_formation_offer_tt:0 "Предложить снаряжение для §Yодного национального оборонного формирования§! в собственности получателя. Получатель выделяет §Y5 480 своих военнослужащих§!; мы предоставляем все пять указанных видов снаряжения. На согласие даётся §Y30 дней§!. Ресурсы выделяются только после согласия и окончательной проверки условий обеих стран, ресурсов, шаблона и территории получателя. Одновременно ответа может ожидать только одно предложение."
 eon_defence_formation.1.t:0 "Снаряжение для национального оборонного формирования"
 eon_defence_formation.1.d:0 "[FROM.GetName] предлагает снаряжение для одного из наших национальных оборонных формирований. Мы выделяем 5 480 военнослужащих; партнёр предоставляет 1 623 единицы стрелкового оружия, 150 систем управления и связи, 36 артиллерийских орудий, 76 ПТРК и 50 ПЗРК. Формирование принадлежит нашей стране и остаётся нашим после войны. Мы можем согласиться или отказаться в течение 30 дней. Согласие разрешает приказ о формировании, если окончательные проверки ресурсов, территории и условий будут пройдены. Это поддержка наших вооружённых сил, а не прибытие войск партнёра или миротворческая миссия ООН."
 eon_defence_formation.1.a:0 "Согласиться и выделить наших военнослужащих"
 eon_defence_formation.1.b:0 "Отказаться или закрыть предложение"
 eon_defence_formation_accept_tt:0 "Выделить §Y5 480 наших военнослужащих§! и полный пакет снаряжения партнёра для одного нашего формирования: шесть батальонов лёгкой пехоты, два артиллерийских батальона, разведка и инженеры. Перед приказом ресурсы проверяются повторно. Если окончательная проверка не пройдена, предложение закрывается без этих приказов. После согласия предложение уже нельзя отозвать или отклонить."
 eon_defence_formation_decline_tt:0 "Закрыть это предложение без выделения военнослужащих или снаряжения."
 eon_defence_formation_unmatched_tt:0 "На это предложение уже ответили либо оно больше не открыто. Подтверждение не создаёт нового приказа о формировании."
 eon_defence_formation_withdraw_offer:0 "Отозвать предложение поддержки формирования"
 eon_defence_formation_withdraw_offer_desc:0 "Отозвать ожидающее ответа предложение снаряжения для национального формирования этого партнёра до его согласия. По этому предложению ресурсы ещё не выделялись."
 eon_defence_formation_withdraw_offer_send_desc:0 "Отозвать это предложение поддержки? Комиссии и выделения ресурсов нет. Новое предложение недоступно, пока партнёр не закроет отозванное предложение или не закончится срок ответа. Если оно истечёт без ответа, такие предложения этому партнёру будут навсегда недоступны."
 eon_defence_formation.3.t:0 "Предложение поддержки формирования отозвано"
 eon_defence_formation.3.d:0 "Отправитель отозвал предложение снаряжения до нашего согласия. По этому предложению военнослужащие и снаряжение не выделялись. Мы можем закрыть исходное предложение, когда оно появится."
 eon_defence_formation.4.t:0 "Срок поддержки формирования истёк"
 eon_defence_formation.4.d:0 "Срок предложения истёк либо его партнёр перестал существовать. Приказы о формировании не выдавались. Новые предложения этой программы этому партнёру навсегда недоступны; предложения другим подходящим странам остаются доступны."
 eon_defence_formation.5.t:0 "Предложения поддержки формирования недоступны"
 eon_defence_formation.5.d:0 "Незавершённое предложение формирования не удалось надёжно сопоставить с партнёром. Приказы о формировании не выдавались. Канал поддержки формирований этой страны нельзя открыть снова; другие дипломатические действия остаются доступны."
 eon_defence_formation.6.t:0 "Предложение поддержки формирования закрыто"
 eon_defence_formation.6.d:0 "Предложение было отклонено, отозвано или перестало соответствовать условиям формирования. По этому предложению военнослужащие и снаряжение не выделялись."
 eon_defence_formation.7.t:0 "Выданы приказы о национальном формировании"
 eon_defence_formation.7.d:0 "Получатель согласился, и окончательные условия выполнены. Издан приказ о создании национального оборонного формирования с личным составом получателя и снаряжением поставщика. Формирование принадлежит вооружённым силам получателя и остаётся у него после войны; возвращать личный состав или снаряжение не требуется. К этой поддержке применяются обычные правила влияния."
 eon_defence_formation.ack:0 "Понятно"
