 eon_division_design_help_category: "Помощь по составу дивизий"
 eon_division_design_help_category_desc: "Практическое руководство по составу дивизий, подразделениям поддержки и снабжению."
 eon_division_design_reopen_guide: "Открыть руководство по дивизиям"
 eon_division_design_reopen_guide_desc: "Бесплатно прочитать руководство ещё раз. Это только справка: характеристики ваших войск не меняются."
 eon_division_design_tutorial.1.t: "Как работает конструктор дивизий"
 eon_division_design_tutorial.1.d: "§YСетка показывает организацию войск.§! Столбцы объединяют батальоны в полки. Верхний ряд не означает первую линию боя, а нижний — тыл. Перестановка одинаковых батальонов сверху вниз не создаёт боевой порядок.\n\n§YВажны:§! состав батальонов и поддержки, их оснащение, организация и ширина фронта. Доступная полковая поддержка относится к своему полку; дивизионная поддержка помогает дивизии в целом.\n\nВыберите тему ниже. Справку можно открыть снова: §YРешения → Помощь по составу дивизий§!."
 eon_division_design_tutorial.2.t: "Состав под задачу"
 eon_division_design_tutorial.2.d: "§YСочетайте роли.§! Пехота помогает удерживать позиции, бронетехника добавляет защищённую ударную силу, артиллерия — огневую мощь. Нужна достаточная организация для продолжения боя.\n\n§YСравнивайте показатели.§! Важны организация, оборона или прорыв, броня и бронебойность, ширина фронта, скорость и потребность в технике. Медленный батальон может замедлить всю дивизию.\n\n§YПоддержке нужно оснащение.§! Дивизионные роты помогают всей дивизии. Доступной полковой поддержке нужны минимум три совместимых линейных батальона в столбце. Пустая ячейка не всегда ошибка."
 eon_division_design_tutorial.3.t: "Оснащение, снабжение и условия"
 eon_division_design_tutorial.3.d: "§YШаблон — ещё не готовая дивизия.§! Нужны люди, техника и подготовка. Перед боем проверяйте укомплектованность и организацию.\n\n§YПроверяйте снабжение и горючее.§! Крупная дивизия может превысить возможности местного снабжения. Моторизованным и танковым частям нужно топливо. Сильный на бумаге состав может плохо воевать без снабжения.\n\n§YУчитывайте задачу и местность.§! Ширина фронта ограничивает число войск в бою. Важны погода, планирование, командиры, авиация и оснащение противника. Универсально победного шаблона нет."
 eon_division_design_tutorial.close: "Понятно — закрыть руководство"
