 eon_eu_ep_reject_withdrawal_requirements:0 "Голосовать против текущего договора всеми местами нашей делегации. Этот голос заменяет прежнюю поддержку. Для согласия ЕП нужно больше голосов за, чем против; воздержавшиеся не входят в подсчёт большинства."
 eon_eu_finalize_withdrawal_requirements:0 "Дать наше окончательное согласие действующему одобренному договору. Выход убирает голосование, должности, статус кандидата, субсидии участника и членские вкладки ЕС. Отдельная торговая договорённость после выхода не даёт членских прав."
 eon_eu_refound_offer_requirements:0 "Когда действующих представительств участников не осталось, предложить учредительный договор другому суверенному европейскому государству. Нужна взаимная добровольная ратификация; предложение действует 60 дней. Это игровой механизм восстановления институтов, а не утверждение об автоматическом прекращении реальных договоров при завоевании."
 eon_eu_refound_accept_requirements:0 "Принять точное действующее учредительное предложение. Участниками станут только два согласных основателя; бывшие участники проходят обычный вступительный процесс. Представительство, должности, голосования и бюджеты восстанавливаются."
 eon_eu_refound_refuse_requirements:0 "Отклонить конкретное учредительное предложение. Членство, платёж и голос не возникают."
 eon_eu_ep_support_own_withdrawal_requirements:0 "До фактического выхода наша делегация ЕП может участвовать в парламентском голосовании. Наше правительство по-прежнему исключено из Совета по вопросу собственного выхода."
 eon_eu_ep_abstain_withdrawal:0 "Делегация ЕП: воздержаться по договору с [From.GetName]"
 eon_eu_ep_abstain_withdrawal_desc:0 "Убрать голоса нашей делегации за и против договора. Депутатские места сохраняются, но воздержавшиеся не входят в подсчёт большинства поданных голосов."
 eon_eu_ep_reject_own_withdrawal:0 "Наша делегация ЕП: против нашего договора о выходе"
 eon_eu_ep_reject_own_withdrawal_desc:0 "До фактического выхода наша делегация может проголосовать против договора. Этот голос заменяет прежнюю поддержку; наше правительство по-прежнему не участвует в Совете по вопросу собственного выхода."
 eon_eu_ep_abstain_own_withdrawal:0 "Наша делегация ЕП: воздержаться по нашему договору"
 eon_eu_ep_abstain_own_withdrawal_desc:0 "Убрать голоса нашей делегации за и против. Воздержавшиеся не учитываются в большинстве ЕП; наше правительство не голосует в Совете по вопросу собственного выхода."
 eon_eu_ep_abstain_withdrawal_requirements:0 "Убрать голоса нашей делегации за и против договора. Депутатские места сохраняются, но воздержавшиеся не входят в подсчёт большинства поданных голосов."
 eon_eu_ep_reject_own_withdrawal_requirements:0 "До фактического выхода наша делегация может проголосовать против договора. Этот голос заменяет прежнюю поддержку; наше правительство по-прежнему не участвует в Совете по вопросу собственного выхода."
 eon_eu_ep_abstain_own_withdrawal_requirements:0 "Убрать голоса нашей делегации за и против. Воздержавшиеся не учитываются в большинстве ЕП; наше правительство не голосует в Совете по вопросу собственного выхода."
 eon_eu_membership.9.t:0 "Новая заявка на вступление в ЕС"
 eon_eu_membership.9.d:0 "[From.GetName] подаёт заявку на вступление. Откройте «Решения» → «Членство и договоры ЕС» и найдите текущую заявку этой страны. Правительство каждого действующего участника может поддержать или отклонить её; для кандидатства нужно единогласие. Это уведомление не подаёт голос. Если заявка изменилась, действуют только доступные сейчас решения."
 eon_eu_membership.10.t:0 "Договор о вступлении в ЕС передан на ратификацию"
 eon_eu_membership.10.d:0 "[From.GetName] представляет договор о вступлении. Откройте «Решения» → «Членство и договоры ЕС». Ратификация правительства и голос национальной делегации Европарламента — отдельные решения по текущему договору. Для вступления нужны все действующие правительства участников, более половины всех действующих мест ЕП и окончательная ратификация заявителя. Это уведомление не даёт согласия; используйте текущие решения."
 eon_eu_membership.11.t:0 "Предложен договор о выходе из ЕС"
 eon_eu_membership.11.d:0 "[From.GetName] предлагает согласованный выход. Откройте «Решения» → «Членство и договоры ЕС». Допущенные правительства оставшихся участников голосуют в Совете; делегации ЕП отдельно голосуют за, против или воздерживаются. Совету нужны не менее 72% допущенных оставшихся государств и 65% их населения; ЕП — больше голосов за, чем против. Затем выходящее государство должно окончательно принять договор. Это уведомление не подаёт голос и не прекращает членство; используйте текущие решения."

 eon_eu_domestic_application_tt:0 "Внутренняя подготовка или референдум открывают настоящую процедуру заявки. Кандидатуру должны поддержать все действующие правительства участников; для членства отдельно нужны ратификация договора, согласие Европарламента и наша окончательная ратификация. Война не запрещает заявку автоматически. Продолжите в решениях «Членство и договоры ЕС»."
 eon_eu_legacy_withdrawal_proposal_tt:0 "Предложить настоящее соглашение о выходе. Нужны одобрение оставшихся правительств в Совете, согласие Европарламента и наше окончательное решение. Членство сохраняется до вступления соглашения в силу либо фактического истечения срока статьи 50."
 eon_eu_union_access_help:0 "Эта панель предназначена для членов и кандидатов ЕС.\nДля подачи заявки членство не требуется: откройте решения «Членство и договоры ЕС» → «Подать заявку на вступление в ЕС». Национальный дух участника выдаётся после завершения вступления."
