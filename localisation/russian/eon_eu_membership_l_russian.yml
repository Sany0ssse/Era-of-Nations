 eon_eu_membership.ok:0 "Понятно"
 eon_eu_membership_category_desc:0 "Статус: [EonEUMembershipStage]\nДействующих правительств участников: [?global.EU_member_count|0]\nОдобрений нашего текущего вступительного проекта: [?eon_eu_accession_yes_display|0]\nПоддержка вступления в ЕП: [?eon_eu_treaty_accession_ep_yes_display|0] / [?eon_eu_treaty_ep_total_display|0] мест\nГолоса по выходу в ЕП: [?eon_eu_treaty_withdrawal_ep_yes_display|0] за, [?eon_eu_treaty_withdrawal_ep_no_display|0] против (воздержавшиеся не учитываются)\nКандидатство не является членством. Ратификации правительств и голоса делегаций ЕП — отдельные действия. Запросы действуют 365 дней; после неудачного проекта нужен перерыв 90 дней. Числовые условия реформ и переговоров являются игровой настройкой.\nПоддержка договора о выходе в Совете: [?eon_eu_exit_yes_display|0] / [?eon_eu_exit_total_display|0] правительств, представляющих [?eon_eu_exit_pop_ratio_display|%1] оставшегося населения."
 eon_eu_membership_status_desc:0 "Статус: [EonEUMembershipStage]\nДействующих правительств участников: [?global.EU_member_count|0]\nОдобрений нашего текущего вступительного проекта: [?eon_eu_accession_yes_display|0]\nПоддержка вступления в ЕП: [?eon_eu_treaty_accession_ep_yes_display|0] / [?eon_eu_treaty_ep_total_display|0] мест\nГолоса по выходу в ЕП: [?eon_eu_treaty_withdrawal_ep_yes_display|0] за, [?eon_eu_treaty_withdrawal_ep_no_display|0] против (воздержавшиеся не учитываются)\nКандидатство не является членством. Ратификации правительств и голоса делегаций ЕП — отдельные действия. Запросы действуют 365 дней; после неудачного проекта нужен перерыв 90 дней. Числовые условия реформ и переговоров являются игровой настройкой.\nПоддержка договора о выходе в Совете: [?eon_eu_exit_yes_display|0] / [?eon_eu_exit_total_display|0] правительств, представляющих [?eon_eu_exit_pop_ratio_display|%1] оставшегося населения."
 eon_eu_apply_desc:0 "Суверенное европейское государство может подать заявку: нужны выборы, менее 3 баллов нарушения ценностей и евроскептицизм ниже 50%. Это игровые показатели демократических институтов и внутренней поддержки. Кандидатуру должны поддержать все действующие правительства участников; членство автоматически не возникает."
 eon_eu_endorse_application_desc:0 "Наше правительство поддерживает предоставление статуса кандидата. Требуется согласие всех действующих правительств участников. Этот ответ не является голосом делегации Европарламента и не делает заявителя членом ЕС."
 eon_eu_reject_application_desc:0 "Закрыть текущую заявку или проект договора. Уже предоставленный статус кандидата сохраняется. Новая подача возможна через 90 дней; одобрения старого проекта не переносятся."
 eon_eu_submit_accession_treaty_desc:0 "После не менее 180 дней переговоров и выполнения условий реформ представить договор для единогласной ратификации правительствами и отдельного голосования Европарламента. Затем заявитель должен ратифицировать согласованный договор."
 eon_eu_member_ratify_accession_desc:0 "Наше правительство ратифицирует текущий договор. Он вступит в силу только после отдельного согласия всех действующих правительств участников, Европарламента и заявителя."
 eon_eu_ep_support_accession_desc:0 "Наша избранная национальная делегация голосует имеющимися местами ЕП как единый блок. Это игровое упрощение парламентского согласия, отдельное от решения правительства. Для вступления нужна поддержка более половины всех действующих мест."
 eon_eu_ep_reject_accession_desc:0 "Отозвать текущий голос национальной делегации. Согласие Европарламента пересчитывается; ратификация правительства остаётся отдельным решением."
 eon_eu_final_ratify_accession_desc:0 "Сделать членство действующим после единогласных ратификаций участников, согласия ЕП и нашей окончательной ратификации. Статус кандидата заменяется правами, взносами и представительством участника."
 eon_eu_cancel_application_desc:0 "Отозвать текущую заявку или договор. Уже полученный статус кандидата сохраняется. Старые одобрения аннулируются, повторная подача доступна через 90 дней."
 eon_eu_notify_withdrawal_desc:0 "Начать двухлетний срок по статье 50. Членство и обычные права сохраняются до фактического выхода. Наше правительство не голосует в Совете по договору о собственном выходе."
 eon_eu_revoke_withdrawal_desc:0 "До фактического выхода односторонне и безусловно отозвать уведомление. Членство продолжается на прежних условиях, новое уведомление недоступно 180 дней. Одобрение других участников не требуется."
 eon_eu_propose_withdrawal_treaty_desc:0 "Предложить более ранний согласованный выход. Требуется не менее 72% оставшихся государств Совета и 65% их населения, отдельное согласие ЕП и наше окончательное принятие. Сам проект не прекращает членство и не сокращает срок выхода."
 eon_eu_member_approve_withdrawal_desc:0 "Наше правительство голосует по текущему договору. Выходящее государство исключено из этого состава Совета. Европарламент голосует отдельно."
 eon_eu_ep_support_withdrawal_desc:0 "Наша национальная делегация ЕП голосует имеющимися местами как единый блок, отдельно от правительства. Нужно больше голосов за, чем против; воздержавшиеся не входят в подсчёт большинства. Представительство депутатов сохраняется до фактического выхода."
 eon_eu_ep_reject_withdrawal_desc:0 "Голосовать против текущего договора всеми местами нашей делегации. Этот голос заменяет прежнюю поддержку. Для согласия ЕП нужно больше голосов за, чем против; воздержавшиеся не входят в подсчёт большинства."
 eon_eu_finalize_withdrawal_desc:0 "Дать наше окончательное согласие действующему одобренному договору. Выход убирает голосование, должности, статус кандидата, субсидии участника и членские вкладки ЕС. Отдельная торговая договорённость после выхода не даёт членских прав."
 eon_eu_ep_support_own_withdrawal_desc:0 "До фактического выхода наша делегация ЕП может участвовать в парламентском голосовании. Наше правительство по-прежнему исключено из Совета по вопросу собственного выхода."
 eon_eu_refound_offer_desc:0 "Когда действующих представительств участников не осталось, предложить учредительный договор другому суверенному европейскому государству. Нужна взаимная добровольная ратификация; предложение действует 60 дней. Это игровой механизм восстановления институтов, а не утверждение об автоматическом прекращении реальных договоров при завоевании."
 eon_eu_refound_accept_desc:0 "Принять точное действующее учредительное предложение. Участниками станут только два согласных основателя; бывшие участники проходят обычный вступительный процесс. Представительство, должности, голосования и бюджеты восстанавливаются."
 eon_eu_refound_refuse_desc:0 "Отклонить конкретное учредительное предложение. Членство, платёж и голос не возникают."
 eon_eu_membership.1.t:0 "Статус кандидата в ЕС одобрен"
 eon_eu_membership.1.d:0 "Все действующие правительства участников одобрили нашу кандидатуру. Мы ещё не участник ЕС. Нужны реформы и не менее 180 дней переговоров, затем договор, единогласные ратификации участников, согласие ЕП и наша окончательная ратификация."
 eon_eu_membership.2.t:0 "Вступление в ЕС состоялось"
 eon_eu_membership.2.d:0 "Согласование и ратификации завершены. Теперь действуют представительство, доступ, взносы и право на поддержку участников."
 eon_eu_membership.3.t:0 "Текущий проект ЕС закрыт"
 eon_eu_membership.3.d:0 "Заявка или договор отклонены, истекли либо перестали соответствовать условиям. Старые одобрения удалены. Уже полученный статус кандидата сохраняется; новая подача возможна после перерыва 90 дней."
 eon_eu_membership.4.t:0 "Договор о вступлении ожидает нашей ратификации"
 eon_eu_membership.4.d:0 "Получены текущие ратификации участников и согласие Европарламента. Заявитель должен дать собственную окончательную ратификацию. Перед вступлением повторно проверяются действующий состав участников и их согласие."
 eon_eu_membership.5.t:0 "Уведомление по статье 50 подано"
 eon_eu_membership.5.d:0 "Начался срок выхода в 730 дней. Обычное членство сохраняется до фактического выхода. Более ранний выход требует договора, одобрения оставшегося Совета, согласия ЕП и нашего окончательного принятия. До выхода уведомление можно безусловно отозвать."
 eon_eu_membership.6.t:0 "Получено предложение об учредительном договоре"
 eon_eu_membership.6.d:0 "Другое суверенное европейское государство предлагает восстановить общие институты. Ответьте на конкретное предложение в решениях о членстве ЕС в течение 60 дней. Само уведомление не даёт членства или прав."
 eon_eu_membership.7.t:0 "Институты ЕС восстановлены по договору"
 eon_eu_membership.7.d:0 "Оба суверенных основателя ратифицировали учредительный договор. Участниками становятся только эти две страны; бывшие участники могут подать обычную заявку. Это модель восстановления институтов в игре."
 eon_eu_membership.8.t:0 "Наш статус в ЕС и состояние договоров"
 eon_eu_membership.8.d:0 "Статус: [EonEUMembershipStage]\nДействующих правительств участников: [?global.EU_member_count|0]\nОдобрений нашего текущего вступительного проекта: [?eon_eu_accession_yes_display|0]\nПоддержка вступления в ЕП: [?eon_eu_treaty_accession_ep_yes_display|0] / [?eon_eu_treaty_ep_total_display|0] мест\nГолоса по выходу в ЕП: [?eon_eu_treaty_withdrawal_ep_yes_display|0] за, [?eon_eu_treaty_withdrawal_ep_no_display|0] против (воздержавшиеся не учитываются)\nКандидатство не является членством. Ратификации правительств и голоса делегаций ЕП — отдельные действия. Запросы действуют 365 дней; после неудачного проекта нужен перерыв 90 дней. Числовые условия реформ и переговоров являются игровой настройкой.\nПоддержка договора о выходе в Совете: [?eon_eu_exit_yes_display|0] / [?eon_eu_exit_total_display|0] правительств, представляющих [?eon_eu_exit_pop_ratio_display|%1] оставшегося населения."
