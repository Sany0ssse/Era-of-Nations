l_russian:
 sov_gru.1.t: "Россия хочет направить к нам ГРУ"
 sov_gru.1.d: "Российская разведка предложила направить инструкторов и боевых специалистов ГРУ для оказания поддержки нашей стране."
 sov_gru.1.a: "Мы согласны"
 sov_gru.1.b: "Они нам не нужны"
 sov_gru.2.t: "[FROM.GetNameWithFlag] согласилась принять наше ГРУ"
 sov_gru.2.d: "Их правительство дало согласие на участие наших оперативников ГРУ в своих военных операциях. Мы готовы оказать полную поддержку."
 sov_gru.2.a: "Отлично"
 sov_gru.3.t: "[FROM.GetNameWithFlag] отказалась от нашего ГРУ"
 sov_gru.3.d: "Их правительство отклонило участие наших сил специального назначения, расценив это как чрезмерное вмешательство в свою политическую систему."
 sov_gru.3.a: "Слабые"
 sov_gru.4.t: "Агенты ГРУ возвращаются на родину"
 sov_gru.4.d: "Офицеры ГРУ вернулись с задания и готовы продолжать служить отечеству."
 sov_gru.4.a: "Хорошо"
 sov_gru.15.t: "Отправка подразделений ГРУ"
 sov_gru.15.d: "Мы намерены отправить наши подразделения ГРУ для помощи этой стране, но нам нужно быть уверенными, что риск оправдан."
 sov_gru.15.a: "Да"
 sov_gru.15.b: "Нет"
 sov_gru.16.t: "Отправка подразделений ЧВК 'Вагнер'"
 sov_gru.16.d: "Мы намерены отправить наши подразделения ЧВК 'Вагнер' для помощи этой стране, но нам нужно быть уверенными, что риск оправдан."
 sov_gru.16.a: "Да"
 sov_gru.16.b: "Нет"
 SOV_GRU_military_aid_tt: "Теперь вы можете отправлять §2ГРУ§! через кнопку §Yвоенной помощи§!"
 SOV_Wagner_military_aid_tt: "Теперь вы можете отправлять §2ЧВК 'Вагнер'§! через кнопку §Yвоенной помощи§!"
 arm_foreign_legion.3.t: "Армянский Иностранный легион"
 arm_foreign_legion.3.d: "Правительство Армении предлагает направить к нам свой собственный отряд — Иностранный легион. Они утверждают, что это опытные бойцы, с хорошим техническим оснащением и боевой подготовкой, которые certainly пригодятся в текущей ситуации."
 arm_foreign_legion.3.a: "Мы их пустим."
 arm_foreign_legion.3.b: "Не интересно"
 arm_foreign_legion.4.t: "Наш Иностранный легион"
 arm_foreign_legion.4.d: "[From.GetNameWithFlag] согласилась разместить наш иностранный легион на своей территории для стабилизации текущей ситуации в стране, и мы очень довольны нашим сотрудничеством."
 arm_foreign_legion.4.a: "Отлично"
 arm_foreign_legion.5.t: "Наш Иностранный легион"
 arm_foreign_legion.5.d: "[From.GetNameWithFlag] отказалась принимать наш иностранный легион на своей территории, сочтя их присутствие излишним."
 arm_foreign_legion.5.a: "Жаль"
 arm_foreign_legion.6.t: "Наш Иностранный легион"
 arm_foreign_legion.6.d: "Солдаты нашего иностранного легиона выполнили свою задачу и возвращаются на родину."
 arm_foreign_legion.6.a: "Добро пожаловать домой"
 arm_foreign_legion.7.t: "Отправка Иностранного легиона"
 arm_foreign_legion.7.d: "Мы намерены отправить наш Иностранный легион для помощи этой стране, но нам нужно быть уверенными, что риск оправдан."
 arm_foreign_legion.7.a: "Да"
 arm_foreign_legion.7.b: "Нет"
 ARM_ForeignLegion_military_aid_tt: "Теперь вы можете отправлять §2Иностранный легион§! через кнопку §Yвоенной помощи§!"
 pol_rutkowski.3.t: "Rutkowski Patrol"
 pol_rutkowski.3.d: "Польское правительство предлагает направить к нам собственное подразделение — Rutkowski Patrol. Они утверждают, что это опытные бойцы с хорошим техническим оснащением и боевой подготовкой, которые наверняка окажутся полезны в текущей ситуации."
 pol_rutkowski.3.a: "Впустить их."
 pol_rutkowski.3.b: "Неинтересно"
 pol_rutkowski.4.t: "Наш Rutkowski Patrol"
 pol_rutkowski.4.d: "[From.GetNameWithFlag] согласилось разместить наш Rutkowski Patrol на своей территории для стабилизации текущей ситуации в стране, и мы крайне довольны нашим сотрудничеством."
 pol_rutkowski.4.a: "Отлично"
 pol_rutkowski.5.t: "Наш Rutkowski Patrol"
 pol_rutkowski.5.d: "[From.GetNameWithFlag] отказалось принять наш Rutkowski Patrol на своей территории, сочтя его присутствие ненужным."
 pol_rutkowski.5.a: "Печально"
 pol_rutkowski.6.t: "Наш Rutkowski Patrol"
 pol_rutkowski.6.d: "Бойцы нашего Патруля Рутковского завершили свою миссию и возвращаются на родину."
 pol_rutkowski.6.a: "С возвращением домой"
 pol_rutkowski.7.t: "Отправка Патруля Рутковского"
 pol_rutkowski.7.d: "Мы намерены направить наш Rutkowski Patrol для помощи этой стране, однако должны быть уверены, что риск оправдан."
 pol_rutkowski.7.a: "Да"
 pol_rutkowski.7.b: "Нет"
 POL_rutkowski_patrol_idea: "Rutkowski Patrol"
 POL_RutkowskiPatrol_military_aid_tt: "Теперь вы можете отправить §2Rutkowski Patrol§! через кнопку §Yвоенной помощи§!"
 ###########NKO SOF###########
 sof_nko: "Спецназ КНР"
 sof_nko.2.t: "Северная Корея хочет направить свои Силы Специального Назначения в нашу Страну"
 sof_nko.2.d: "Северокорейская разведка предложила направить свои силы специального назначения для поддержки нашей страны."
 sof_nko.2.a: "Мы согласны"
 sof_nko.2.b: "Неинтересно"
 sof_nko.3.t: "[FROM.GetNameWithFlag] Согласился принять наши Силы Специальных Операций"
 sof_nko.3.d: "Их правительство согласилось разрешить нашим Силам Специального Назначения участвовать в их военных операциях. Мы готовы оказать всестороннюю поддержку."
 sof_nko.3.a: "Хорошо"
 sof_nko.4.t: "[FROM.GetNameWithFlag] Отказались от наших Сил Специальных Операций"
 sof_nko.4.d: "Их правительство отвергло участие наших Сил Специального Назначения, считая это слишком грубым вмешательством в их политическую систему."
 sof_nko.4.a: "Печально"
 sof_nko.5.t: "Силы Специального Назначения возвращаются домой"
 sof_nko.5.d: "Офицеры Сил Специальных Операций вернулись со своего задания и готовы продолжать служить Родине."
 sof_nko.5.a: "Хорошо"
 sof_nko.1.t: "Отправить наши Силы Специальных Операций"
 sof_nko.1.d: "Мы намерены направить наши подразделения Сил Специальных Операций на помощь этой стране, но мы должны быть уверены, что это стоит риска."
 sof_nko.1.a: "Да"
 sof_nko.1.b: "Нет"
 NKO_decision_sof_tt: "Дивизии §YСил Специальных Операций§! будут §Gдобавлены§! чтобы поддержать наши военные операции"
 can_sent_military_aid: "Может посылать военную помощь"
 ###########GDR###########
 ###########Events###########
 gdr_werwolf.3.t: "101-й батальон Штази «Вервольф»"
 gdr_werwolf.3.d: "Правительство Германской Демократической Республики предлагает направить к нам свой собственный отряд - 101-й батальон Штази «Вервольф». Они утверждают, что это опытные бойцы с хорошим техническим оснащением и боевой подготовкой, и они непременно окажутся полезны в текущей ситуации.."
 gdr_werwolf.3.a: "Мы впустим их."
 gdr_werwolf.3.b: "Не интересно"
 gdr_werwolf.4.t: "Наш 101-й батальон Штази «Вервольф»"
 gdr_werwolf.4.d: "[From.GetNameWithFlag] согласился разместить на своей территории наш 101-й батальон Штази «Вервольф» для стабилизации текущей ситуации в стране, и мы очень довольны нашим сотрудничеством.."
 gdr_werwolf.4.a: "Отлично"
 gdr_werwolf.5.t: "Наш 101-й батальон Штази «Вервольф»"
 gdr_werwolf.5.d: "[From.GetNameWithFlag] отказался принимать наш 101-й батальон Штази «Вервольф» на своей территории, посчитав их присутствие ненужным."
 gdr_werwolf.5.a: "Печально"
 gdr_werwolf.6.t: "Наш 101-й батальон Штази «Вервольф»"
 gdr_werwolf.6.d: "Солдаты нашего 101-го батальона Штази «Вервольф» выполнили свою задачу и возвращаются на родину.."
 gdr_werwolf.6.a: "С возвращением домой"
 gdr_werwolf.7.t: "Отправка 101-го батальона Штази «Вервольф»"
 gdr_werwolf.7.d: "Мы намерены отправить наш 101-й батальон Штази «Вервольф» на помощь этой стране, но мы должны быть уверены, что риск оправдан."
 gdr_werwolf.7.a: "Да"
 gdr_werwolf.7.b: "Нет"
 ###########Ideas###########
 GDR_werwolf_battalion_idea: "[GDR.GetFlag] 101-й батальон Штази «Вервольф»"
 ###########Tooltips###########
 GDR_Werwolf_military_aid_tt: "Теперь вы можете отправить §2101-й батальон Штази «Вервольф»§! через кнопку §Yвоенной помощи§!"
