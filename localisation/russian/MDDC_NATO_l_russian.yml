 NATO_ratify_stanag_desc: "Каждое государство-член НАТО ратифицирует STANAG и применяет его в своих вооруженных силах. Цель состоит в том, чтобы обеспечить общие оперативные и административные процедуры и материально-техническое обеспечение, с тем чтобы вооруженные силы одной страны-члена могли пользоваться хранилищем и поддержкой вооруженных сил другой страны-члена. STANAGS также формируют основу для технической совместимости широкого спектра коммуникационных и информационных систем (CIS), необходимых для операций НАТО и союзнических организаций."
 NATO_decisions_desc: "\n£MAIN_desctext_nato\n\n\n\n§Y НАТО §!, или §Y Организация Североатлантического договора§! — это военный союз между несколькими странами Северной Америки и Европы. §Y НАТО §! представляет собой систему коллективной обороны, в рамках которой независимые государства-участники обязуются защищать друг друга в случае нападения со стороны внешней силы. \n\n Любая европейская страна, которая может соответствовать требованиям и стандартам альянса, может присоединиться к §Y НАТО §!. Вступление в альянс состоит из четырех этапов. Первый этап заключается в получении §Y PfP §! (Партнерство во имя мира) статуса, второй этап - это ратификация всеми членами и получение §Y IPAP §! (Индивидуальный план действий в рамках партнерства) статуса, третий этап заключается в получении статуса §Y Ускоренного Диалога§! и, наконец, четвертый статус - это ратификация всеми членами и присоединение к §Y Организации Североатлантического договора§!. \n\n Страны, не расположенные на Европейском континенте, при соблюдении определенных условий могут подать заявку на получение статуса §Y Главный союзник, не входящий в НАТО§!. Этот статус позволяет им проводить совместные учения с альянсом, а также обращаться за помощью в трудные времена."
 NATO_rework.1.t: "Проводить военные учения с [FROM.GetNameWithFlag]"
 NATO_rework.1.d: "Совместные военные учения позволят нам обменяться военным опытом и подготовиться к возможным боевым операциям, выявить и устранить недостатки нашей армии и проверить боевую эффективность вооружений. Какие военные учения нам необходимо провести?"
 NATO_rework.1.a: "Армейские учения"
 NATO_rework.1.b: "Летные учения"
 NATO_rework.1.c: "Военно-морские учения"
 recent_nato_army_exercises: "Недавние армейские учения"
 recent_nato_air_exercises: "Недавние воздушные учения"
 recent_nato_navy_exercises: "Недавние учения военно-морского флота"
 recent_csto_army_exercises: "Недавние армейские учения"
 recent_csto_air_exercises: "Недавние воздушные учения"
 recent_csto_navy_exercises: "Недавние учения военно-морского флота"
 NATO_rework.2.t: "[FROM.GetNameWithFlag] хочет проводить с нами армейские учения"
 NATO_rework.2.d: "[FROM.GetName] хочет провести с нами военные учения. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам. Должны ли мы согласиться?"
 NATO_rework.2.a: "Давайте приступим к учениям"
 NATO_rework.2.b: "Сейчас не самое подходящее время"
 NATO_rework.3.t: "[FROM.GetNameWithFlag] хочет проводить воздушные учения с нами"
 NATO_rework.3.d: "[FROM.GetName] хочет провести с нами военные учения. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам. Должны ли мы согласиться?"
 NATO_rework.3.a: "Давайте приступим к учениям"
 NATO_rework.3.b: "Сейчас не самое подходящее время"
 NATO_rework.4.t: "[FROM.GetNameWithFlag] хочет проводить с нами военно-морские упражнения"
 NATO_rework.4.d: "[FROM.GetName] хочет провести с нами военные учения. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам. Должны ли мы согласиться?"
 NATO_rework.4.a: "Давайте приступим к учениям"
 NATO_rework.4.b: "Сейчас не самое подходящее время"
 NATO_rework.5.t: "[FROM.GetNameWithFlag] согласились провести военные учения"
 NATO_rework.5.d: "[FROM.GetName] согласились о проведении с нами военных учений. Учения позволят нам обменяться военным опытом и подготовиться к возможным угрозам."
 NATO_rework.5.a: "Отлично!"
 NATO_rework.6.t: "[FROM.GetNameWithFlag] отказались от проведения военных учений"
 NATO_rework.6.d: "[FROM.GetName] отказались проводить с нами военные учения. Возможно, сейчас для них не лучшее время."
 NATO_rework.6.a: "Может быть, позже..."
 NATO_rework.7.t: "[FROM.GetNameWithFlag] требует вмешательства альянса"
 NATO_rework.7.d: "[FROM.GetName], наш стратегический союзник, не входящий в альянс, находится в состоянии войны. Сейчас он на грани поражения, это продлится недолго, и поэтому требуется вмешательство сил альянса. Должны ли мы помочь нашему стратегическому союзнику?"
 NATO_rework.7.a: "Объявите МОБИЛИЗАЦИЮ!"
 NATO_rework.7.b: "Мы не втянем страну в войну"
 NATO_rework.8.t: "[FROM.GetNameWithFlag] просит нас поддержать военную операцию"
 NATO_rework.8.d: "[FROM.GetName] начали военную операцию и просят нашей поддержки. Доктрина НАТО не обязывает нас вести наступательную войну, мы вольны отказаться, но должны ли мы отказываться от нашего союзника?"
 NATO_rework.8.a: "Мобилизуйте силы!"
 NATO_rework.8.b: "Мы не должны вмешиваться"
 NATO_rework.9.t: "[FROM.GetNameWithFlag] ответил на поддержку операции"
 NATO_rework.9.d: "[FROM.GetName] откликнулись на наш призыв, они помогут нам провести военную операцию. Возможно, они преследуют свои собственные цели, а может быть, они просто решили поддержать союзника, в любом случае, это ещё больше сблизит нас"
 NATO_rework.9.a: "Замечательно!"
 generic_nato.12.t: "[FROM.GetNameWithFlag] желает начать ускоренный диалог о членстве в НАТО"
 generic_nato.12.desc: "Они уже давно являются частью нашей североатлантической семьи, и теперь они обратились к нам с просьбой начать ускоренный диалог по вопросу вступления в Североатлантический союз. Следует ли нам ратифицировать их статус?"
 generic_nato.12.a: "Конечно!"
 generic_nato.12.b: "Не сейчас"
