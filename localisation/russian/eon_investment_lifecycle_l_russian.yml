l_russian:
 eon_investment_lifecycle.ack:0 "OK"
 eon_investment_lifecycle.1.t:0 "Строительный договор начал действовать"
 eon_investment_lifecycle.1.d:0 "Проект начат на первоначальных согласованных условиях. Вклад инвестора и софинансирование получателя учитываются как строительные авансы. Доход от инвестиций возникает только после подтверждённого строительства."
 eon_investment_lifecycle.2.t:0 "Строительство приостановлено"
 eon_investment_lifecycle.2.d:0 "Первоначальный получатель больше не владеет и не контролирует регион, стороны воюют, инвестиции запрещены или нет места для здания. Остаток средств и дней сохранён. При восстановлении первоначальных условий строительство возобновится. Инвестор может отменить проект через обычное окно инвестиций региона."
 eon_investment_lifecycle.3.t:0 "Строительство возобновлено"
 eon_investment_lifecycle.3.d:0 "Первоначальный получатель снова владеет и контролирует регион; условия исполнения восстановлены. Сохранённые средства и оставшееся время используются для продолжения проекта."
 eon_investment_lifecycle.4.t:0 "Строительство завершено"
 eon_investment_lifecycle.4.d:0 "Постройка всех согласованных зданий подтверждена. Капитал инвестора по построенным зданиям теперь входит в действующий инвестиционный портфель. Незавершённого аванса для возврата нет."
 eon_investment_lifecycle.5.t:0 "Строительный договор прекращён"
 eon_investment_lifecycle.5.d:0 "Неиспользованный капитал инвестора и остаток взноса первоначального софинансиста возвращаются один раз. Построенные активы остаются в действующем портфеле. Исчезнувшая страна сохраняет учтённое требование возврата; новый контролёр не получает чужие деньги."
 eon_investment_lifecycle.6.t:0 "Строительство не подтверждено"
 eon_investment_lifecycle.6.d:0 "Команда игры не увеличила уровень здания. Средства не потрачены, действующий актив и успешное завершение не записаны. При сохранении исходных условий повторная попытка состоится через семь дней."
 eon_investment_lifecycle.7.t:0 "Средства строительства потеряны из-за коррупции"
 eon_investment_lifecycle.7.d:0 "Одна оплаченная единица строительства не выполнена из-за существующего риска коррупции. Её капитал инвестора и соответствующее софинансирование учтены как потраченные и потерянные. Они не приносят доход и не возвращаются. Остальные единицы продолжают строиться."
 eon_investment_lifecycle.8.t:0 "Строительство закончено с потерями"
 eon_investment_lifecycle.8.d:0 "Согласованные единицы строительства исчерпаны, но коррупция помешала части или всем постройкам. Только подтверждённые здания входят в действующий портфель. Потери учтены отдельно; это не полное успешное завершение."
 eon_investment_lifecycle.9.t:0 "Предложение строительства больше неисполнимо"
 eon_investment_lifecycle.9.d:0 "При исполнении первоначального предложения допустимый проект не создан. Деньги не списаны, актив не выдан, строительство не начато. Проверьте стороны, владение и контроль, средства, правила инвестиций и места для зданий перед новыми переговорами."
