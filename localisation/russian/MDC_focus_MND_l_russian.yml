 MND_political_ambitions: "Политические амбиции"
 MND_political_ambitions_desc: "«Монадире» - это не просто военизированное формирование, это политический проект. Его руководство видит себя не борцами, а архитекторами нового Кавказа. Пополнение идёт стабильно, моральный дух высок, националистические настроения распространяются в рядах как огонь. Но у амбиций есть цена. Ресурсы уходят на политику и войну, экономика стагнирует, а внутренние распри тлеют под поверхностью."
 MND_food_shortage_idea: "Нехватка продовольствия"
 MND_food_shortage_idea_desc: "Территория под контролем «Монадире» изо всех сил пытается прокормить себя. Линии снабжения ненадёжны, сельское хозяйство заброшено, а немногочисленная еда в первую очередь уходит на военные нужды. Недовольство распространяется среди гражданского населения. Голодная армия - хрупкая армия, а голодный народ долго не молчит."
 MND_chechen_volunteers: "Чеченские добровольцы"
 MND_chechen_volunteers_desc: "Закалённые двумя войнами и не имеющие дома, сотни чеченских бойцов нашли дорогу в ряды «Монадире». Они приносят с собой то, чему не может научить никакая подготовка - опыт. Эти люди знают, что значит сражаться с более крупным врагом на знакомой земле, и они намерены использовать эти знания."
 MND_mountain_fortress: "Горная крепость"
 MND_mountain_fortress_desc: "Кавказские горы - это не просто фон, это оружие. «Монадире» встроило свои позиции прямо в скалы, превратив каждый хребет и долину в оборонительную линию, которую не может легко прорвать ни одна регулярная армия. Сторонние видят непроходимую местность. «Монадире» видит родной дом."
