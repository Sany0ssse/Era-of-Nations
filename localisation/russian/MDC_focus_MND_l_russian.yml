 # Decisions
 MND_confederation_category: "Создание Конфедерации"
 MND_confederation_category_desc: "Кавказ никогда не был единым народом - но он всегда был единой землёй. «Монадире» стремится объединить раздробленные нации региона под единым конфедеральным знаменем, связывая их общей культурой, общими врагами и обещанием суверенитета, который никто извне не сможет отнять."
