l_russian:
 # Focuses
 MND_kvitsianis_gamble: "Авантюра Квициани"
 MND_kvitsianis_gamble_desc: "Грузия слаба, Абхазия вне контроля Тбилиси, а Кодорское ущелье - серая зона, где существует только один закон: сила. Эмзар Квициани видит возможность. «Монадире» - это не просто ополчение. Это семя новой силы на Кавказе. Время действовать."
 MND_request_money_from_georgia: "Запросить деньги у Грузии"
 MND_request_money_from_georgia_desc: "Тбилиси всегда платил тем, кто оказывает давление на Абхазию. «Монадире» контролирует Кодорское ущелье - ценный актив для Грузии. Квициани знает себе цену. Пришло время выставить счёт."
 MND_accept_gelayevs_proposal: "Принять предложение Гелаева"
 MND_accept_gelayevs_proposal_desc: "Руслан Гелаев - Чёрный ангел Чечни - сидит в горах с сотнями бойцов, закалённых в боях. Квициани видит возможность. Гелаев уже воевал в Абхазии. Он знает местность, знает врага и ненавидит его. Союз «Монадире» с чеченскими волками может всё изменить."
 MND_hunting_and_food_salvaging_efforts: "Охота и добыча продовольствия"
 MND_hunting_and_food_salvaging_efforts_desc: "Кодорское ущелье отрезано от мира. Ни линий снабжения, ни рынков, ни государственной поддержки. Люди Квициани кормятся по-старому - охотятся в лесах, собирают съедобное в ущельях, обрабатывают небольшие участки земли. Горы всегда кормили тех, кто готов брать от них. Пока этого достаточно."
 MND_recruit_khevsureli: "Набрать отряды Хевсурети и Сванетии"
 MND_recruit_khevsureli_desc: "Мы расширяем нашу сеть в горных регионах Хевсурети и Сванетии, полагаясь на кланы, полевых командиров и контрабандные маршруты. Новые отряды усилят наши рейдовые возможности и дадут глубину обороны, но операция потребует средств и усилит внутреннюю напряжённость."
 MND_attempt_negotiations_with_Russia: "Попытаться договориться с Россией"
 MND_attempt_negotiations_with_Russia_desc: "У Москвы свои интересы на Кавказе. «Монадире» контролирует Кодорское ущелье - занозу в боку Грузии. Возможно, медведя удастся убедить протянуть лапу. Квициани посылает весточку в Кремль. Захочет ли Россия слушать - совсем другой вопрос."
 MND_attempts_at_local_drug_production: "Попытки местного наркопроизводства"
 MND_attempts_at_local_drug_production_desc: "Кодорское ущелье лежит на древних контрабандных маршрутах. Квициани видит возможность - опийные поля в высокогорье, транзитные пути через горные перевалы, покупатели по обе стороны любой границы. Грязные деньги. Но всё же деньги."
 MND_covertly_support_pankis_valley_efforts: "Тайно поддержать усилия в Панкисском ущелье"
 MND_covertly_support_pankis_valley_efforts_desc: "Панкиси - пороховая бочка. Чеченские боевики наводнили ущелье - закалённые в боях, вооружённые и без другого места. Квициани посылает деньги, припасы и тихую поддержку. В ответ Панкиси становится для «Монадире» источником пополнения и тыловой базой."
 MND_establish_chechen_bases: "Создать чеченские базы"
 MND_establish_chechen_bases_desc: "«Монадире» начинает строить постоянную инфраструктуру для чеченских бойцов - тайники с оружием, тренировочные лагеря, бункеры, вырезанные в скалах Кодорского ущелья. Горы становятся крепостью. Всем, кто захочет найти эти базы, придётся сначала пройти через нас."
 MND_smuggle_weapons_from_svanetia: "Контрабанда оружия из Сванетии"
 MND_smuggle_weapons_from_svanetia_desc: "Сванетия тонет в оружии, которое никому официально не принадлежит. Советские арсеналы, военные трофеи, чернорыночные поставки - всё это лежит в горных сёлах в ожидании покупателя. Квициани посылает своих людей через перевалы. То, что они приносят обратно, держит «Монадире» вооружённым и опасным."
 MND_get_money_from_un: "Получить деньги от заложников ООН"
 MND_get_money_from_un_desc: "ООН посылает в ущелье наблюдателей в голубых касках и с блокнотами. Без оружия. Без защиты. Квициани видит возможность: тихая акция, требование выкупа, незаметный перевод средств. Наблюдатели уезжают домой, а деньги остаются в ущелье. ООН подаёт жалобу, но всем всё равно."
 MND_propaganda_in_svanetia: "Пропаганда в Сванетии"
 MND_propaganda_in_svanetia_desc: "«Монадире» ведёт активную пропагандистскую операцию в Сванетии. Только Квициани стоит с горцами!"
 MND_plant_chaos_in_abkhazian_society: "Посеять хаос в абхазском обществе"
 MND_plant_chaos_in_abkhazian_society_desc: "Мы развязываем контролируемый хаос в абхазском обществе через подпольные сети, дезинформацию, подкуп и целевые диверсии. Цель проста: подорвать доверие к властям, вызвать раздор среди элит и превратить внутренние конфликты в перманентный кризис. Операция потребует значительных финансовых и политических вложений, но создаст для нас окно возможностей в регионе."
 MND_stop_svanetia: "Остановить геноцид в Сванетии"
 MND_stop_svanetia_desc: "Под знаменем защиты народа Сванетии мы переводим операцию в открытую фазу. Через гуманитарную помощь, подпольные каналы и вооружённое прикрытие мы расширяем своё влияние в регионе и формируем поддержку внутри Грузии. Чем больше масштаб нашей помощи, тем сильнее наше влияние - но тем сильнее и враждебность грузинских властей."
 MND_proclaim_yourself_interim: "Временное правительство Абхазии"
 MND_proclaim_yourself_interim_desc: "Пришло время выйти из тени рейдов и подпольной войны. Мы провозглашаем себя Временным правительством Абхазии, оформляя контроль над захваченными территориями и превращая разрозненные отряды в государственный аппарат. Этот шаг даёт политическую легитимность внутри движения и открывает путь к дальнейшей консолидации власти, но также усиливает давление со стороны внешних врагов."
 MND_start_raid_on_abkhazia: "Начать рейд на Абхазию"
 MND_start_raid_on_abkhazia_desc: "Время скрытого давления прошло. Мы начинаем скоординированные рейды, диверсии и вооружённые вылазки в Абхазию, чтобы нарушить местный контроль, проверить реакцию противника и подготовить почву для более широкой кампании."
 MND_true_lord_of_abkhazia: "Истинный владыка Абхазии"
 MND_true_lord_of_abkhazia_desc: "Эпоха неопределённости закончена: после рейдов и временных структур власть в Абхазии окончательно сосредоточена в руках Квициани. Он обеспечивает личное верховенство, переводит режим на военные рельсы и повышает ставки в региональном конфликте. Мы станем опаснее и агрессивнее, но заплатим за это ростом внутренней напряжённости."
 MND_real_owner_of_sakartvelo: "Истинный хозяин Сакартвело"
 MND_real_owner_of_sakartvelo_desc: "Мы заявляем, что только наше правление способно навести порядок в Сакартвело. С помощью давления, пропаганды и сети союзников мы превращаем политический лозунг в практическую программу переустройства региона. Если наши требования будут отвергнуты, следующим шагом станет военная эскалация."
 MND_support_ichkeria: "Поддержать Ичкерию"
 MND_support_ichkeria_desc: "Весна 2000 года. Грозный пал. Масхадов в горах с горсткой людей и флагом, который узнаёт всё меньше людей. Ичкерия умирает, но ещё не мертва. Квициани посылает деньги, оружие и обеспечивает безопасный проход через Кодорское ущелье. Чеченские «волки» когда-то сражались за Абхазию. Теперь «Монадире» сражается за них. Братья в горах. Братья в поражении. Братья в сопротивлении."
 MND_claim_adyghe_lands: "Претендовать на земли адыгов"
 MND_claim_adyghe_lands_desc: "Адыгские земли веками были частью единого кавказского пространства, разорванного войнами, принудительными переселениями и чужеземным правлением. Мы официально заявляем о своих претензиях на эти территории и объявляем, что вопрос исторической справедливости больше не останется замороженным. Этот шаг укрепит боевой дух наших сторонников, но неизбежно обострит конфликт с теми, кто считает Кавказ своей вотчиной."
 MND_declare_confederation: "Конфедерация горских народов Кавказа"
 MND_declare_confederation_desc: "В 1991 году двенадцать горских народов подписали в Сухуми декларацию - Конфедерацию, рождённую из пепла Советского Союза, наследницу Горской республики 1918 года. Она сражалась за Абхазию, а затем угасла. Квициани воскрешает её из мёртвых. Конфедерация горских народов Кавказа снова жива - не как воспоминание, а как государство. Абхазы, чеченцы, сваны, адыги, аварцы - все под одним знаменем. Москва называет это терроризмом - Квициани называет это справедливостью."
 MND_demand_ossetia: "Требовать Осетию"
 MND_demand_ossetia_desc: "Осетинский вопрос должен быть решён по нашей воле, а не по чужим границам. Мы выдвигаем официальные претензии на Северную и Южную Осетию и требуем признания нового порядка на Кавказе. Если эти требования будут отвергнуты, спор перейдёт из дипломатической фазы в военную."
 MND_raids_into_dagestan: "Рейды в Дагестан"
 MND_raids_into_dagestan_desc: "Рейды в Дагестан предназначены не для захвата земли, а для разрушения порядка изнутри. Через подпольные каналы мы усилим радикальные сети, подпитываем сепаратистские настроения и повышаем уровень насилия в регионе. Чем глубже хаос в Дагестане, тем слабее хватка Москвы на всём Северном Кавказе - но тем выше риск жёсткого военного ответа против нас."
 MND_rebellion_in_azerbaijan: "Восстание в Азербайджане"
 MND_rebellion_in_azerbaijan_desc: "Азербайджан сидит на нефти и старых обидах. Лезгины на севере, талыши на юге - меньшинства с долгой памятью и коротким терпением. У «Монадире» есть деньги, оружие и опыт разжигания пожаров. Время посмотреть, загорится ли Азербайджан."
 MND_gelayevs_coup: "Переворот Гелаева"
 MND_gelayevs_coup_desc: "Фаза компромиссов окончена. При поддержке полевых командиров и верных вооружённых групп Гелаев устраняет своих соперников внутри движения и берёт полный контроль. Новая линия ставит во главу угла жёсткую мобилизацию, принудительное правление и расширение подпольных сетей по всему Кавказу. Режим станет опаснее и решительнее, но заплатит за это глубокой радикализацией и перманентной конфронтацией с соседями."
 MND_firm_grip_of_emzar: "Твёрдая рука Эмзара"
 MND_firm_grip_of_emzar_desc: "Эмзар подавляет внутренние фракции и выстраивает единую цепь командования. Вместо авантюры полевого командира режим смещается к дисциплине, управляемой мобилизации и жёсткому политическому контролю. Это укрепит устойчивость государства и позволит проводить жёсткую линию без смены курса, но потребует постоянного давления как на элиты, так и на общество."
 MND_subjugate_armenia: "Подчинить Армению"
 MND_subjugate_armenia_desc: "Армянское направление становится нашей следующей целью. Через подпольные каналы, диверсионные группы и местных союзников мы усилим давление на внутренний порядок Армении. Операция может дать нам стратегическое преимущество на Кавказе, но неизбежно повысит риск жёсткого военного и дипломатического ответа."
 MND_jlhadist_haven: "Убежище джихадистов"
 MND_jlhadist_haven_desc: "Мы превращаем горную зону в устойчивую сеть тайных баз, центров вербовки и маршрутов снабжения. Эта инфраструктура даст нам инструменты для затяжной войны, диверсий и давления на соседние режимы."
 MND_sufi_sunni_harmonization: "Суфийско-суннитская гармонизация"
 MND_sufi_sunni_harmonization_desc: "У Кавказа всегда был свой ислам. Не пустынный ислам Аравии, не политический ислам Эр-Рияда, а горный ислам Накшбандийи, зикра, святилищ местных святых. Гелаев, сам человек веры, понимает это. Конфедерация, раздираемая между суфийской традицией и суннитской ортодоксией, не выживет. Он собирает шейхов и имамов вместе. Горы обретают общую молитву."
 MND_caucasian_nationalism: "Кавказский национализм"
 MND_caucasian_nationalism_desc: "Мы превращаем разрозненные обиды и старые горские распри в единую политическую идею: Кавказ должен принадлежать народам Кавказа. Через пропаганду, подпольные сети и общую повестку мы разжигаем националистические настроения по всему региону, ослабляем иностранное влияние и готовим почву для нового порядка."
 MND_secularization_for_the_sake_of_stability: "Секуляризация ради стабильности"
 MND_secularization_for_the_sake_of_stability_desc: "Кавказ принял ислам поздно и только после сопротивления. До мечетей были церкви; до церквей - старые горные боги. Горским народам нужно государство, а не халифат. Религия возвращается туда, где ей место: в дом, подальше от правительства."
 MND_caucasian_emirate: "Кавказский эмират"
 MND_caucasian_emirate_desc: "Линия Гелаева достигает финальной стадии: вместо временных администраций и местных сделок мы учреждаем единый Кавказский эмират. Власть концентрируется в военно-религиозном ядре, ресурсы перенаправляются на мобилизацию, а конфликт расширяется за пределы одного региона. Это даёт более строгую дисциплину, большую боевую выносливость и более острую политическую волю, но также повышает цену каждого шага и запирает нас на пути конфронтации."
 MND_crowning_ourselves_as_kings: "Король гор"
 MND_crowning_ourselves_as_kings_desc: "Эпоха разрозненных командиров окончена. Мы провозглашаем новый горский порядок: один трон, одно командование, одна государственная воля. Власть централизована, налогообложение ужесточено, ресурсы перенаправлены от хаоса к боеготовности и развитию. Эта коронация укрепляет нашу внутреннюю независимость и защищает государство от внешнего давления."

 # TT
 MND_if_georgia_is_agree_TT: "«Монадире» будет лучше относиться к нам. Наше влияние в «Монадире» вырастет"
 MND_if_georgia_is_not_agree_TT: "«Монадире» будет хуже относиться к нам. Наше влияние в «Монадире» уменьшится"
 MND_if_russia_is_agree_TT: "«Монадире» будет лучше относиться к нам. Наше влияние в «Монадире» значительно вырастет"
 MND_if_russia_is_not_agree_TT: "«Монадире» будет хуже относиться к нам. Наше влияние в «Монадире» уменьшится"
 MND_abk_hate_TT: "Абхазский народ будет ненавидеть нас ещё сильнее: из-за наших действий условия жизни в республике станут невыносимыми."
 MND_chaos_aze_TT: "Наш «подарок» серьёзно дестабилизирует ситуацию в Азербайджане - их народ запомнит это надолго. Существует риск того, что правительство Азербайджана объявит нам войну."
 MND_chaos_arm_TT: "Наш «подарок» серьёзно дестабилизирует ситуацию в Армении, и её народ надолго это запомнит. Есть шанс, что правительство Армении объявит нам войну."
 MND_rus_ichk_TT: "Россия будет ненавидеть нас и может начать войну."
 MND_stop_svanetia_TT: "Мы сможем усилить наше влияние в Грузии и подорвать её суверенитет, но наши отношения с грузинским правительством ухудшатся"
 MND_confederation_TT: "Из-за этого мы испытаем рост национализма и влияния «Монадире» на нашу страну."
 MND_chaos_dag_TT2: "В Дагестане могут усилиться терроризм, сепаратизм и беспорядки."
 MND_rus_ichk2_TT: "В Чечне могут усилиться сепаратизм и беспорядки."
 MND_gelayevs_coup_not_TT: "Наше правительство будет усилено и останется неизменным"
 MND_raid_1_TT: "Полный успех!"
 MND_raid_2_TT: "Частичный эффект"
 MND_raid_3_TT: "Полный провал..."
 MND_raid1_TT: "Чем больше у нас дивизий, тем выше шанс успешного рейда."
 MND_raid2_TT: "Если мы полностью провалимся, мы потеряем людей. Если рейд удастся, фабрика в Абхазии будет повреждена."
 MND_war_5050_TT: "Есть шанс, что они объявят нам войну."
 MND_separ_activate_TT: "\nЕсть хороший шанс, что они объявят нам войну.\n\n"
