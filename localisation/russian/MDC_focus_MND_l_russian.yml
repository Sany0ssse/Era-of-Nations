 # Cosmetic Tags
 MND_caucas_federation: "Конфедерация Горских Народов Кавказа"

 # Events
 MND_policy.5.t: "«Монадире» просит нас о помощи"
 MND_policy.5.d: "Эмзар Квициани просит у нас финансовой поддержки. Его люди контролируют Кодорское ущелье и продолжают давить на абхазские позиции. «Монадире» - полезный инструмент, но горские воины непредсказуемы. Стоит ли вкладывать деньги в чужую войну?"
 MND_policy.5.a: "Выделить 3 миллиарда. Квициани нам нужен."
 MND_policy.5.b: "Отказать. Мы не будем финансировать такие авантюры."
 MND_policy.6.t: "Тбилиси открывает кошелёк"
 MND_policy.6.d: "Грузинские деньги пришли. Тбилиси видит в нас полезный инструмент против Абхазии - и мы рады играть эту роль. Пока что. 8 миллиардов пойдут на припасы, оружие и оплату наших людей. Квициани улыбается. Грузия думает, что купила лояльность. Она купила время."
 MND_policy.6.a: "У гор появился новый покровитель."
 MND_policy.7.t: "Тбилиси закрыл дверь"
 MND_policy.7.d: "Грузия отказала. Ни денег, ни объяснений - только холодное молчание из Тбилиси. Что ж, Квициани выживал и без посторонней помощи. Горы кормят своих."
 MND_policy.7.a: "Справимся сами."
 MND_policy.19.t: "Горные волки просят нашего благословения"
 MND_policy.19.d: "Эмзар Квициани шлёт весточку в Москву. Он контролирует Кодорское ущелье и хочет поддержки России - денег, оружия, признания. Полезная пешка на заднем дворе Грузии. Но пешки имеют привычку становиться проблемами. Стоит ли вкладываться в этого горского полевого командира?"
 MND_policy.19.a: "Отправить деньги и оружие. Квициани будет служить нашим интересам."
 MND_policy.19.b: "Отказать. Мы не имеем дела с горскими бандитами."
 MND_policy.20.t: "Москва заговорила"
 MND_policy.20.d: "Российские деньги и винтовки прибыли в ущелье. Квициани держит в руках калашников, штампованный в Туле, и улыбается. Москва думает, что купила верную собаку. Возможно. Но собаки, выросшие в горах, отвечают только перед горами."
 MND_policy.20.a: "Медведь протянул лапу. Мы её пожимаем - пока что."
 MND_policy.21.t: "Медведь отвернулся"
 MND_policy.21.d: "Москва отказала. Ни денег, ни оружия, ни признания - только тишина из Кремля. Квициани ожидал этого. Россия играет в свою игру. «Монадире» будет играть в свою."
 MND_policy.21.a: "Нам никто не нужен. Ущелье наше."
 MND_policy.22.t: "Подарок от «Монадире»!"
 MND_policy.22.d: "Провокаторы проникли в абхазское общество. Рынки сорваны, чиновникам угрожают, слухи распространяются как лесной пожар. Кто-то намеренно дестабилизирует республику изнутри. Правительство пытается сдержать ущерб."
 MND_policy.22.a: "Чёрт!"
 MND_policy.24.d: "В последние недели в северных регионах участились диверсии, нападения на блокпосты и поджоги складов. По данным спецслужб, группировка «Монадире» координирует беспорядки, используя контрабандные маршруты и местные радикальные ячейки. Ситуация больше не является обычной преступностью: это преднамеренная попытка подорвать внутреннюю стабильность Азербайджана."
 MND_policy.25.d: "В последние недели в северных регионах участились диверсии, нападения на блокпосты и поджоги складов. По данным спецслужб, группировка «Монадире» координирует беспорядки, используя контрабандные маршруты и местные радикальные ячейки. Ситуация больше не является обычной преступностью: это преднамеренная попытка подорвать внутреннюю стабильность Азербайджана."
 MND_policy.24.a: "Терпим..."
 MND_policy.25.a: "Терпим..."
 MND_policy.24.b: "Стабильность требует денег"
 MND_policy.25.b: "Стабильность требует денег"
 MND_policy.25.c: "Это совершенно неприемлемо"
 MND_policy.24.c: "Это совершенно неприемлемо"
 MND_policy.24.t: "Подарок от «Монадире»"
 MND_policy.25.t: "Подарок от «Монадире»"
 MND_policy.23.t: "Масштаб удара по Азербайджану"
 MND_policy.23.d: "Азербайджан держится на страхе и фасаде стабильности. Если мы ударим по узлам контроля, трещины расползутся по всей системе. Наши союзники внутри страны ждут сигнала, чтобы вывести конфликт из тени. Осталось только выбрать глубину нашего вмешательства."
 MND_policy.23.a: "Бюджетный"
 MND_policy.23.b: "Дорогой"
 MND_policy.26.t: "«Монадире» снабжает наших врагов"
 MND_policy.26.d: "Данные разведки подтверждают это. Оружие, деньги и боевики текут через Кодорское ущелье к остаткам Ичкерии. Квициани поддерживает чеченское сопротивление. Москва не может это игнорировать. Вопрос в том, как ответить."
 MND_policy.26.a: "Раздавить «Монадире». Никто не снабжает наших врагов и не уходит от ответа."
 MND_policy.26.b: "Не сейчас. У нас достаточно войн. Наблюдать за ними в оба."
 MND_policy.17.d: "В последние недели в приграничных регионах участились диверсии, поджоги складов и нападения на инфраструктуру. По данным служб безопасности, группировка «Монадире» координирует эти действия через контрабандные маршруты и спящие ячейки. Это больше не отдельные инциденты, а преднамеренная кампания по дестабилизации Армении."
 MND_policy.18.d: "В последние недели в приграничных регионах участились диверсии, поджоги складов и нападения на инфраструктуру. По данным служб безопасности, группировка «Монадире» координирует эти действия через контрабандные маршруты и спящие ячейки. Это больше не отдельные инциденты, а преднамеренная кампания по дестабилизации Армении."
 MND_policy.17.a: "Терпим..."
 MND_policy.18.a: "Терпим..."
 MND_policy.17.b: "Стабильность требует денег"
 MND_policy.18.b: "Стабильность требует денег"
 MND_policy.18.c: "Это совершенно неприемлемо"
 MND_policy.17.c: "Это совершенно неприемлемо"
 MND_policy.17.t: "Подарок от «Монадире»"
 MND_policy.18.t: "Подарок от «Монадире»"
 MND_policy.16.t: "Масштаб удара по Армении"
 MND_policy.16.d: "Наша сеть в Армении готова действовать. Каналы снабжения и связи налажены, оперативники ждут приказов. Мы можем ограничиться точечными диверсиями или перейти к широкомасштабной дестабилизации, которая надолго повредит внутренний порядок. Чем сильнее удар, тем больше эффект - и тем выше риск жёсткого ответа."
 MND_policy.16.a: "Бюджетный"
 MND_policy.16.b: "Дорогой"
 MND_policy.1.t: "Претензии «Монадире» на наши земли"
 MND_policy.1.d: "Руководство «Монадире» официально объявило несколько грузинских территорий своими «историческими землями», фактически оформив национальные претензии на них. Это уже не пропагандистская риторика, а прямой вызов суверенитету Грузии и сигнал к дальнейшей эскалации. В Тбилиси начались экстренные консультации: уступки подорвут государство, но жёсткий ответ может приблизить открытый конфликт."
 MND_policy.1.a: "МРАЗИ!"
 MND_policy.2.t: "Масштаб помощи Сванетии"
 MND_policy.2.d: "Мы можем ограничиться мягкой поддержкой, развернуть полноценную сеть или перейти к прямому вмешательству. Чем глубже наше участие, тем больше наше влияние в Грузии и тем больше поддержки мы получим от части общества, но тем сильнее власти в Тбилиси будут нас ненавидеть."
 MND_policy.2.a: "Ограниченная поддержка"
 MND_policy.2.b: "Расширенная поддержка"
 MND_policy.3.t: "Распространение «Монадире» в Сванетии"
 MND_policy.3.d: "Внешняя поддержка пока ограничена, но влияние «Монадире» в обществе постепенно растёт. Нам нужно что-то делать с «Монадире», иначе они продолжат подрывать наш суверенитет."
 MND_policy.3.a: "Это открытый вызов"
 MND_policy.4.t: "«Монадире» снабжает наших врагов"
 MND_policy.4.d: "Данные разведки подтверждают это. Оружие и деньги текут через Кодорское ущелье к националистическому движению в Дагестане. Москва не может это игнорировать. Вопрос в том, как ответить."
 MND_policy.4.a: "Раздавить «Монадире». Никто не снабжает наших врагов и не уходит от ответа"
 MND_policy.4.b: "Не сейчас. У нас достаточно войн. Наблюдать за ними в оба"
 MND_policy.8.t: "Рейд «Монадире»: удар успешен"
 MND_policy.8.d: "Бойцы «Монадире» пересекли границу под покровом темноты и нанесли удар по промышленному объекту в глубине Абхазии. Охрана была подавлена, цель уничтожена. Тбилиси довольно шепчется - Сухум горит."
 MND_policy.8.a: "Отлично сработано."
 MND_policy.9.t: "Рейд «Монадире»: частичный успех"
 MND_policy.9.d: "Рейд прошёл, но абхазским силам безопасности удалось перехватить часть группы. Объект повреждён, но не уничтожен. Несколько бойцов отступили под огнём. Победа - но дорогой."
 MND_policy.9.a: "В следующий раз закончим работу."
 MND_policy.10.t: "Рейд «Монадире»: операция провалена"
 MND_policy.10.d: "Кто-то рассказал. Абхазские пограничники ждали. Группа «Монадире» рассредоточилась в лесополосе и отступила ни с чем. Операция провалена - и кто-то за это ответит."
 MND_policy.10.a: "Отступаем."
 MND_policy.11.t: "Удар совершён"
 MND_policy.11.d: "Наши люди вернулись. Цель в Абхазии тлеет. Русские и абхазы в замешательстве - они не ожидали такой дерзости. «Монадире» доказало, что может нанести удар там, где грузинская армия не может."
 MND_policy.11.a: "«Монадире» не отступает."
 MND_policy.12.t: "Назад с потерями"
 MND_policy.12.d: "Миссия выполнена, но цена оказалась выше ожидаемой. Несколько бойцов не вернулись. Снаряжение брошено в суматохе. И всё же - цель поражена. Это чего-то стоит."
 MND_policy.12.a: "Мы вернёмся."
 MND_policy.13.t: "Засада. Отступление."
 MND_policy.13.d: "С самого начала это была ловушка. Абхазские силы были готовы и ждали. Мы потеряли людей и отступили ни с чем. Кто-то предал операцию. Пока мы их не найдём - новых рейдов не будет."
 MND_policy.13.a: "Найти предателя."
 MND_policy.14.t: "Тень «Монадире»"
 MND_policy.14.d: "Наши спецслужбы обнаружили тревожную закономерность. Агенты «Монадире» свободно действуют внутри наших границ - финансируют националистические движения, распространяют сепаратистскую риторику и покупают лояльность на улицах. Их влияние растёт тихо, как гниль под половицами. Если это не остановить, они дестабилизируют нас изнутри."
 MND_policy.14.a: "Разорвать все связи с этими провокаторами."
 MND_policy.14.b: "Довольно. Мы объявляем войну «Монадире»."
 MND_policy.15.t: "Вопрос «Монадире»"
 MND_policy.15.d: "Сепаратистские движения набирают силу. Экстремистские ячейки расширяются. Террористические инциденты учащаются. Разведка проследила финансирование и логистику к одному источнику: «Монадире».\n\n Насколько далеко мы готовы зайти?"
 MND_policy.15.a: "Разорвать связи."
 MND_policy.15.b: "Это заслуживает военного ответа. Мы объявляем войну."
 MND_news.1.t: "Гелаев присоединяется к «Монадире»"
 MND_news.1.d: "Руслан Гелаев, один из самых опасных командиров чеченских войн, пересёк границу и присоединился к рядам «Монадире». С ним пришли закалённые в боях бойцы и репутация."
 MND_news.1.a: "Новый волк идёт по горам."
 MND_news.2.t: "«Монадире» захватывает персонал ООН"
 MND_news.2.d: "В ходе дерзкой операции бойцы «Монадире» похитили нескольких сотрудников ООН, работавших в регионе. Международное сообщество возмущено. Требования о немедленном освобождении поступают со всех сторон - «Монадире» пока не ответило."
 MND_news.2.a: "Это не останется без ответа."
 MND_news.3.t: "«Монадире» наносит удар по Абхазии"
 MND_news.3.d: "Рейдовая группа «Монадире» пересекла границу Абхазии ночью, попытавшись нанести удар по инфраструктуре, затем исчезла в горах до того, как могла быть организована ответная реакция. Российские миротворцы приведены в повышенную готовность."
 MND_news.3.a: "Когда же будет мир в Абхазии."
 MND_news.4.t: "«Монадире» провозглашает себя Временным правительством Абхазии"
 MND_news.4.d: "В драматическом заявлении руководство «Монадире» объявило себя законным временным правительством Абхазии, призвав население отвергнуть существующие власти. Сухум объявил заявление недействительным. Мир наблюдает."
 MND_news.4.a: "Смелое заявление - теперь они должны его доказать."
 MND_news.5.t: "«Монадире» разжигает беспорядки в Азербайджане"
 MND_news.5.d: "В нескольких азербайджанских городах вспыхнули протесты. Спецслужбы Баку указывают на «Монадире» как на организаторов - финансирование агитаторов, распространение сепаратистской литературы и разжигание этнической напряжённости."
 MND_news.5.a: "Баку тлеет."
 MND_news.6.t: "«Монадире» выступает против Армении"
 MND_news.6.d: "Серия скоординированных провокаций вдоль армянской границы была отслежена до «Монадире». Диверсии, пропаганда, пограничные стычки - ни одна из них не достаточна для войны, но достаточно, чтобы держать Ереван в напряжении."
 MND_news.6.a: "Смерть от тысячи порезов."
 MND_news.7.t: "Провозглашена Конфедерация народов Кавказа"
 MND_news.7.d: "На церемонии, за которой наблюдал весь регион, руководство «Монадире» официально провозгласило Конфедерацию народов Кавказа - союз раздробленных наций, связанных культурой, кровью и общим врагом. Выживет ли конфедерация после своего рождения - открытый вопрос."
 MND_news.7.a: "Начинается новая глава."
 MND_news.8.t: "Гелаев провозглашает Кавказский эмират"
 MND_news.8.d: "Руслан Гелаев захватил власть внутри «Монадире» и объявил о создании Кавказского эмирата - государства, построенного на вере, стали и пепле всего, что было раньше. Зелёное знамя поднимается над горами. Что последует - неизвестно."
 MND_news.8.a: "Так воля Божья - так они говорят."
 MND_news.9.t: "Квициани коронован Королём Кавказа"
 MND_news.9.d: "Эмзар Квициани консолидировал свою власть над «Монадире» и принял титул, на который мало кто осмеливался даже надеяться - Король Кавказа. Его сторонники называют это судьбой. Его враги - заблуждением. В любом случае корона на его голове."
 MND_news.9.a: "Да здравствует король. Возможно."
 MND_news.10.t: "«Монадире» пытается зажечь Чечню"
 MND_news.10.d: "Оперативники «Монадире» были пойманы при попытке разжечь беспорядки в Чечне - распространение оружия, финансирование подпольных сетей и контакты с недовольными ветеранами. Силы безопасности Грозного быстро отреагировали. Исход операции остаётся неизвестным."
 MND_news.10.a: "Чечню не так легко поджечь."
 MND_news.11.t: "Сеть агентов «Монадире» раскрыта в Дагестане"
 MND_news.11.d: "Дагестанские власти раскрыли сеть «Монадире», пытавшуюся организовать массовые протесты и этнические столкновения по всей республике. Операция оказалась масштабнее, чем ожидалось. Сколько агентов ускользнуло - остаётся неясным."
 MND_news.11.a: "Корни уходят глубже, чем мы думали."
 MND_policy.27.t: "«Монадире» предлагает нам присоединиться к войне против Абхазии"
 MND_policy.27.a: "Согласиться"
 MND_policy.27.b: "Нет"
 MND_policy.27.d: "Провозгласив себя Временным правительством Абхазии, «Монадире» начало военную операцию по захвату её территории. Эмзар просит нас помочь ему. Стоит ли нам ввязываться в эту горскую войну? Возможно, мы сможем извлечь из неё какую-то выгоду."
