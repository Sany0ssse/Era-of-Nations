l_russian:
 eon_regimental_light_artillery:0 "Полковая лёгкая артиллерийская батарея"
 eon_regimental_light_artillery_desc:0 "Небольшая батарея при пехотном полку, в столбце которого не менее трёх линейных батальонов. Требует три орудия и один комплект средств управления и связи. Добавляет огневую поддержку без увеличения ширины фронта. Эта ячейка не означает размещение артиллерии на переднем крае боя."
 eon_regimental_motorized_artillery:0 "Полковая моторизованная артиллерийская батарея"
 eon_regimental_motorized_artillery_desc:0 "Небольшая буксируемая батарея при моторизованном или бронетанковом полку, в столбце которого не менее трёх линейных батальонов. Требует три орудия, один комплект средств управления и связи и пять многоцелевых машин. Транспорт расходует топливо. Ячейка означает прикрепление поддержки, а не линию боевого порядка."
