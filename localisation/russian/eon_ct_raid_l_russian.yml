 eon_ct_raid_available_tt:0 "Требуется больше 25 командной власти и отсутствие ожидающей или закрытой записи для этой операции. Исходные национальные и территориальные ограничения сохраняются. Текущим владельцем должна быть наша страна, либо обе страны должны соглашаться на сотрудничество против терроризма и находиться в мире друг с другом. Владелец фиксируется при начале операции; её можно отменить до выполнения."
