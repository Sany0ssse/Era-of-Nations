l_russian:
 eon_ct_raid_operations:0 "Антитеррористические операции"
 eon_ct_raid_operations_desc:0 "Управление оплаченными антитеррористическими операциями до их выполнения через пять дней. Ожидающий возврат командной власти: [?eon_ct_raid_refund_due|1]. $eon_ct_raid_refund_tt$ Отменённая операция остаётся зарезервированной до закрытия её исходного таймера. Если таймер не закрыт через семь дней, эта операция становится недоступной для повторного использования; другие операции остаются отдельными."
 eon_ct_raid_start_tt:0 "На эту пятидневную операцию потрачено 25 командной власти; текущий владелец территории зафиксирован. Для выполнения должны сохраняться исходные территориальные и национальные условия. На чужой территории обе страны должны по-прежнему соглашаться на сотрудничество против терроризма и находиться в мире друг с другом. Смена владельца или утрата разрешения отменяет операцию; её неиспользованная стоимость подлежит возврату. Существующие риски исхода сохраняются."
 eon_ct_raid_cancel_tt:0 "Отменить эту оплаченную операцию без дополнительных затрат и предотвратить её отложенный рейд. Неиспользованные 25 командной власти возвращаются один раз. Незачисленная часть остаётся нашим требованием на возврат и возвращается автоматически. Исходный таймер сохраняет резерв этой операции до закрытия; другие операции остаются отдельными."
 eon_ct_raid_refund_tt:0 "Неиспользованная оплаченная командная власть принадлежит оплатившей стране. Возврат зачисляется только в пределах доступного лимита; незачисленная часть сохраняется и возвращается автоматически. Если возврат уменьшит ранее превышавшую лимит командную власть, эта потеря сохраняется в требовании на возврат. Аннексия не передаёт это требование аннексирующей стране."
