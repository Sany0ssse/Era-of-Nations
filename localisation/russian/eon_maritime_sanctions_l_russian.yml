l_russian:
 eon_maritime_sanctions_stop_operation: "Завершить перехватывание транспортов [FROM.GetNameWithFlag]"
 eon_maritime_sanctions_stop_operation_desc: "Завершить текущую операцию против этой страны. Ограничение на один перехват за 90 дней сохраняется; новая операция стоит 25 единиц командного ресурса и не обходит его."
 eon_maritime_sanctions_legacy_cancelled_title: "Устаревшее морское уведомление отменено"
 eon_maritime_sanctions_legacy_cancelled: "Прежнее уведомление о морском инциденте отменено. Дополнительных действий не требуется."
 eon_maritime_sanctions_intercept_title: "Транспорт противника перехвачен"
 eon_maritime_sanctions_intercept_desc: "В ходе действующей морской операции перехвачен один транспорт противника. Следующий перехват против этой страны возможен через 90 дней при наличии действующей операции."
 eon_maritime_sanctions_loss_title: "Транспорт потерян"
 eon_maritime_sanctions_loss_desc: "Морская операция противника перехватила один наш транспорт во время текущей войны."
 eon_maritime_sanctions_acknowledge: "Принято"
