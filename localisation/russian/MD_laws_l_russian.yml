 education_budget: "Бюджет на образование"
 edu_01: "[edu_spending_protest_title_1]"
 edu_01_neutral: "Базовая поддержка начального образования"
 edu_01_expected: "§GБазовая поддержка начального образования§!"
 edu_01_under: "§RБазовая поддержка начального образования§!"
 edu_01_over: "§3Базовая поддержка начального образования§!"
 edu_01_desc: "Наша система начального образования давно испытывает хроническое недофинансирование. Это негативно сказывается не только на качестве образования, но и на возможностях развития подрастающего поколения.\n[edu_spending_protest_TT]"
 edu_01_TT: "\nНа образование тратится $$[?THIS.array_education_spend^0] §Hмлрд§!.\n£education_budget_cost_factor_texticon  Наши §1расходы на образование§! увеличены на §Y[?research_slot_modifier|.0%]§! из-за количества §1исследовательских слотов§!\n"

 edu_02: "[edu_spending_protest_title_2]"
 edu_02_neutral: "Базовая поддержка начального и среднего образования"
 edu_02_expected: "§GБазовая поддержка начального и среднего образования§!"
 edu_02_under: "§RБазовая поддержка начального и среднего образования§!"
 edu_02_over: "§3Базовая поддержка начального и среднего образования§!"
 edu_02_desc: "Долгосрочные инвестиции в начальное и среднее образование наших людей сегодня откроют безграничные возможности завтра. Чтобы обеспечить всем детям достойный старт в жизни, мы должны гарантировать им минимальный уровень финансирования школ по всей стране.\n[edu_spending_protest_TT]"
 edu_02_TT: "\nНа образование тратится $$[?THIS.array_education_spend^1] §Hмлрд§!.\n£education_budget_cost_factor_texticon  Наши §1расходы на образование§! увеличены на §Y[?research_slot_modifier|.0%]§! из-за количества §1исследовательских слотов§!\n"

 edu_03: "[edu_spending_protest_title_3]"
 edu_03_neutral: "Бесплатное начальное и среднее образование"
 edu_03_expected: "§GБесплатное начальное и среднее образование§!"
 edu_03_under: "§RБесплатное начальное и среднее образование§!"
 edu_03_over: "§3Бесплатное начальное и среднее образование§!"
 edu_03_desc: "Образование - одно из основных прав человека и ключ к светлому будущему. Чтобы обеспечить равные возможности для всех детей в нашей стране, мы гарантируем бесплатный доступ к качественному начальному и среднему образованию.\n[edu_spending_protest_TT]"
 edu_03_TT: "\nНа образование тратится $$[?THIS.array_education_spend^2] §Hмлрд§!.\n£education_budget_cost_factor_texticon  Наши §1расходы на образование§! увеличены на §Y[?research_slot_modifier|.0%]§! из-за количества §1исследовательских слотов§!\n"

 edu_04: "[edu_spending_protest_title_4]"
 edu_04_neutral: "Фокус на высшем образовании"
 edu_04_expected: "§GФокус на высшем образовании§!"
 edu_04_under: "§RФокус на высшем образовании§!"
 edu_04_over: "§3Фокус на высшем образовании§!"
 edu_04_desc: "В эпоху глобализации и цифровых технологий высшее образование играет всё более важную роль в развитии экономики. Чтобы обеспечить нашей молодежи равные возможности для приобретения ценных навыков и профессиональной квалификации, мы будем увеличивать финансирование колледжей и университетов.\n[edu_spending_protest_TT]"
 edu_04_TT: "\nНа образование тратится $$[?THIS.array_education_spend^3] §Hмлрд§!.\n£education_budget_cost_factor_texticon  Наши §1расходы на образование§! увеличены на §Y[?research_slot_modifier|.0%]§! из-за количества §1исследовательских слотов§!\n"

 edu_05: "[edu_spending_protest_title_5]"
 edu_05_neutral: "Бесплатное всеобщее качественное образование"
 edu_05_expected: "§GБесплатное всеобщее качественное образование§!"
 edu_05_under: "§RБесплатное всеобщее качественное образование§!"
 edu_05_over: "§3Бесплатное всеобщее качественное образование§!"
 edu_05_desc: "Все дети должны иметь доступ к хорошему бесплатному образованию, независимо от материального положения их семей. Чтобы обеспечить равные стартовые условия для всех граждан, мы вводим образование за счёт государственного бюджета. Это позволит раскрыть потенциал каждого ребенка и сформировать общество равных возможностей.\n[edu_spending_protest_TT]"
 edu_05_TT: "\nНа образование тратится $$[?THIS.array_education_spend^4] §Hмлрд§!.\n£education_budget_cost_factor_texticon  Наши §1расходы на образование§! увеличены на §Y[?research_slot_modifier|.0%]§! из-за количества §1исследовательских слотов§!\n"

 health_budget: "Бюджет здравоохранения"
 health_01: "[health_spending_protest_title_1]"
 health_01_neutral: "Минимальные субсидии местным клиникам"
 health_01_expected: "§GМинимальные субсидии местным клиникам§!"
 health_01_under: "§RМинимальные субсидии местным клиникам§!"
 health_01_over: "§3Минимальные субсидии местным клиникам§!"
 health_01_desc: "Правительство оказывает ограниченную финансовую поддержку небольшим местным клиникам. Эти клиники предлагают базовую помощь, но ресурсов и специализированных методов лечения не хватает.\n[health_spending_protest_TT]"
 health_01_TT: "\nНа здравоохранение тратится $$[?THIS.array_health_spend^0] §Hмлрд§!.\n"

 health_02: "[health_spending_protest_title_2]"
 health_02_neutral: "Основные медицинские учреждения"
 health_02_expected: "§GОсновные медицинские учреждения§!"
 health_02_under: "§RОсновные медицинские учреждения§!"
 health_02_over: "§3Основные медицинские учреждения§!"
 health_02_desc: "Более широкие сети поликлиник получают государственное финансирование, что обеспечивает доступ большинства населения к основным медицинским услугам. Хотя эти клиники предоставляют больше услуг, чем местные, в них все равно может не хватать современного медицинского оборудования.\n[health_spending_protest_TT]"
 health_02_TT: "\nНа здравоохранение тратится $$[?THIS.array_health_spend^1] §Hмлрд§!.\n"

 health_03: "[health_spending_protest_title_3]"
 health_03_neutral: "Базовые больничные субсидии"
 health_03_expected: "§GБазовые больничные субсидии§!"
 health_03_under: "§RБазовые больничные субсидии§!"
 health_03_over: "§3Базовые больничные субсидии§!"
 health_03_desc: "Больницы начинают получать значительную часть бюджета здравоохранения, что позволяет проводить более специализированное лечение и уход. Однако не все виды лечения могут быть покрыты, и пациенты могут по-прежнему сталкиваться со значительными расходами из собственного кармана.\n[health_spending_protest_TT]"
 health_03_TT: "\nНа здравоохранение тратится $$[?THIS.array_health_spend^2] §Hмлрд§!.\n"

 health_04: "[health_spending_protest_title_4]"
 health_04_neutral: "Бесплатное неотложное лечение"
 health_04_expected: "§GБесплатное неотложное лечение§!"
 health_04_under: "§RБесплатное неотложное лечение§!"
 health_04_over: "§3Бесплатное неотложное лечение§!"
 health_04_desc: "Всем гражданам гарантирована бесплатная экстренная медицинская помощь, что снижает смертность от внезапных заболеваний и несчастных случаев. Хотя плановые процедуры могут быть платными, никому не может быть отказано в неотложной помощи из-за финансовых трудностей.\n[health_spending_protest_TT]"
 health_04_TT: "\nНа здравоохранение тратится $$[?THIS.array_health_spend^3] §Hмлрд§!.\n"

 health_05: "[health_spending_protest_title_5]"
 health_05_neutral: "Базовое всеобщее медицинское обслуживание"
 health_05_expected: "§GБазовое всеобщее медицинское обслуживание§!"
 health_05_under: "§RБазовое всеобщее медицинское обслуживание§!"
 health_05_over: "§3Базовое всеобщее медицинское обслуживание§!"
 health_05_desc: "Государство покрывает широкий спектр медицинских услуг, гарантируя, что все граждане имеют доступ к необходимой медицинской помощи без изнурительных расходов. Некоторые специализированные виды лечения могут по-прежнему требовать расходов из собственного кармана, но общее здравоохранение доступно всем.\n[health_spending_protest_TT]"
 health_05_TT: "\nНа здравоохранение тратится $$[?THIS.array_health_spend^4] §Hмлрд§!.\n"

 health_06: "[health_spending_protest_title_6]"
 health_06_neutral: "Передовое всеобщее здравоохранение"
 health_06_expected: "§GПередовое всеобщее здравоохранение§!"
 health_06_under: "§RПередовое всеобщее здравоохранение§!"
 health_06_over: "§3Передовое всеобщее здравоохранение§!"
 health_06_desc: "Все граждане обеспечены всесторонним медицинским обслуживанием, охватывающим всё — от плановых осмотров до специализированного лечения. С акцентом на профилактическую помощь, научные исследования и передовые медицинские технологии, система гарантирует самый высокий стандарт ухода для каждого.\n[health_spending_protest_TT]"
 health_06_TT: "\nНа здравоохранение тратится $$[?THIS.array_health_spend^5] §Hмлрд§!.\n"

