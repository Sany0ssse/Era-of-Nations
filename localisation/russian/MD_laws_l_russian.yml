 defence_00_desc: "Увеличение военных расходов поможет нам расширить нашу армию.\n\nДополнительная стоимость определяется размерами нашей армии и военно-морской промышленности. Чем выше наш ВВП на душу населения, тем дороже это обходится. Текущие расчётные расходы по всем законам основаны на текущем уровне имеющейся рабочей силы; ваши расходы на оборону могут увеличиться в зависимости от того, насколько больше рабочей силы будет мобилизовано.\n[military_spending_protest_TT]"
