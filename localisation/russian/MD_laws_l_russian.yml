 #Nuclear Laws
 Nuclear_Status: "Ядерный статус"
 Nuclear_Status_desc: "Статус ядерной программы страны: безъядерная, использующая только ядерную энергию или обладающая ядерным оружием."
 nuclear_power_off: "Ядерная держава (наступательная доктрина)"
 nuclear_power_off_desc: "Ядерная держава, чей статус позволяет наносить ядерные удары по силам противника независимо от стратегической ситуации."
 nuclear_power_def: "Ядерная держава (оборонительная доктрина)"
 nuclear_power_def_desc: "Ядерная держава, чей статус позволяет наносить ядерные удары только в случае проигрыша войны."
 non_nuclear_power: "Безъядерная держава"
 non_nuclear_power_desc: "Страна, не имеющая ядерного оружия или ядерной энергетики."
 nuclear_energy: "Ядерная энергетика"
 nuclear_energy_desc: "Страна, не имеющая ядерного оружия, но использующая атомные электростанции в своей энергетической инфраструктуре."
 Nuclear_Stance: "Доктрина применения ядерного оружия"
 Nuclear_Stance_desc: "Устанавливает условия и требования, при которых страна может применить ядерное оружие против врага."
 no_use_case: "Неприменение"
 no_use_case_desc: "Страна, не имеющая ядерного оружия, или страна, которая решила никогда не использовать свое ядерное оружие, независимо от ситуации."
 full_first_use: "Право первого удара"
 full_first_use_desc: "Страна, которая решила, что может наносить тактические или стратегические ядерные удары в любой момент."
 tac_first_use_strat_retaliation: "Тактический первый удар, стратегическое возмездие"
 tac_first_use_strat_retaliation_desc: "Страна, которая может применять тактическое ядерное оружие в первом случае, а стратегическое — только в ответ."
 tac_and_strat_retaliation: "Только ответный удар"
 tac_and_strat_retaliation_desc: "Страна, которая может наносить как тактические, так и стратегические ядерные удары только в ответ."
 strategic_retaliation_only: "Только стратегический ответ"
 strategic_retaliation_only_desc: "Страна, которая может наносить только стратегические ответные удары."

