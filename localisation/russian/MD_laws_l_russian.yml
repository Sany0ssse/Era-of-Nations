 social_03_desc: "Государство предлагает более комплексную систему пенсионного обеспечения для пожилых людей и инвалидов, позволяющую им поддерживать скромный уровень жизни. Поддержка призвана защитить эти категории населения от крайних финансовых трудностей.\n[social_spending_protest_TT]"
 social_03_TT: "\nНа социальное обеспечение и социальные расходы тратится $$[?THIS.array_social_spend^2] §Hмлрд§!.\n"

 social_04: "[social_spending_protest_title_4]"
 social_04_neutral: "Существенная система социальной защиты"
 social_04_expected: "§GСущественная система социальной защиты§!"
 social_04_under: "§RСущественная система социальной защиты§!"
 social_04_over: "§3Существенная система социальной защиты§!"
 social_04_desc: "Правительство начинает расширять сферу социального обеспечения, вводя более широкие системы социальной поддержки, охватывающие такие аспекты, как безработица, жилье и субсидии по уходу за детьми. Таким образом, создаётся более надежный защитный слой от непредвиденных трудностей.\n[social_spending_protest_TT]"
 social_04_TT: "\nНа социальное обеспечение и социальные расходы тратится $$[?THIS.array_social_spend^3] §Hмлрд§!.\n"

 social_05: "[social_spending_protest_title_5]"
 social_05_neutral: "Государство всеобщего благосостояния"
 social_05_expected: "§GГосударство всеобщего благосостояния§!"
 social_05_under: "§RГосударство всеобщего благосостояния§!"
 social_05_over: "§3Государство всеобщего благосостояния§!"
 social_05_desc: "Сеть социальной защиты расширяется, поскольку государство обеспечивает надёжную поддержку в таких областях, как пособия по безработице, жилищные и продовольственные субсидии. Основное внимание уделяется поддержанию достойного качества жизни и обеспечению защиты от социально-экономической уязвимости.\n[social_spending_protest_TT]"
 social_05_TT: "\nНа социальное обеспечение и социальные расходы тратится $$[?THIS.array_social_spend^4] §Hмлрд§!.\n"

 social_06: "[social_spending_protest_title_6]"
 social_06_neutral: "Обширное государство всеобщего благосостояния"
 social_06_expected: "§GОбширное государство всеобщего благосостояния§!"
 social_06_under: "§RОбширное государство всеобщего благосостояния§!"
 social_06_over: "§3Обширное государство всеобщего благосостояния§!"
 social_06_desc: "Государство играет центральную роль в обеспечении благосостояния своих граждан, предоставляя им широкий спектр услуг, субсидий и льгот. Эта система способствует не только базовому обеспечению, но и повышению уровня жизни и обеспечению равных возможностей для всех.\n[social_spending_protest_TT]"
 social_06_TT: "\nНа социальное обеспечение и социальные расходы тратится $$[?THIS.array_social_spend^5] §Hмлрд§!.\n"

 crime_fighting: "Внутренняя безопасность"
 police_01: "[police_spending_protest_title_1]"
 police_01_neutral: "Минимальное финансирование полиции"
 police_01_expected: "§GМинимальное финансирование полиции§!"
 police_01_under: "§RМинимальное финансирование полиции§!"
 police_01_over: "§3Минимальное финансирование полиции§!"
 police_01_desc: "Наши полицейские и разведывательные службы плохо финансируются и обычно закрывают глаза на коррупцию и преступность.\n[police_spending_protest_TT]"
 police_01_TT: "\nНа внутреннюю безопасность тратится $$[?THIS.array_security_spend^0] §Hмлрд§!.\n"

 police_02: "[police_spending_protest_title_2]"
 police_02_neutral: "Базовое финансирование полиции и безопасности"
 police_02_expected: "§GБазовое финансирование полиции и безопасности§!"
 police_02_under: "§RБазовое финансирование полиции и безопасности§!"
 police_02_over: "§3Базовое финансирование полиции и безопасности§!"
 police_02_desc: "Наши полицейские и разведывательные службы справляются со своей работой, но не более того. Дальнейшие действия предпринимаются только под давлением общественности.\n[police_spending_protest_TT]"
 police_02_TT: "\nНа внутреннюю безопасность тратится $$[?THIS.array_security_spend^1] §Hмлрд§!.\n"

 police_03: "[police_spending_protest_title_3]"
 police_03_neutral: "Высокое финансирование полиции и разведки"
 police_03_expected: "§GВысокое финансирование полиции и разведки§!"
 police_03_under: "§RВысокое финансирование полиции и разведки§!"
 police_03_over: "§3Высокое финансирование полиции и разведки§!"
 police_03_desc: "Наши полицейские и разведывательные службы хорошо финансируются. Закон и порядок поддерживаются, они могут внимательно следить за внутренними и внешними заговорами.\n[police_spending_protest_TT]"
 police_03_TT: "\nНа внутреннюю безопасность тратится $$[?THIS.array_security_spend^2] §Hмлрд§!.\n"

 police_04: "[police_spending_protest_title_4]"
 police_04_neutral: "Обширный полицейский и разведывательный аппарат"
 police_04_expected: "§GОбширный полицейский и разведывательный аппарат§!"
 police_04_under: "§RОбширный полицейский и разведывательный аппарат§!"
 police_04_over: "§3Обширный полицейский и разведывательный аппарат§!"
 police_04_desc: "Наши полицейские и разведывательные службы очень хорошо финансируются. Они способны бороться с коррупцией и преступностью. Кроме того, они ведут широкое наблюдение за всеми опасными движениями.\n[police_spending_protest_TT]"
 police_04_TT: "\nНа внутреннюю безопасность тратится $$[?THIS.array_security_spend^3] §Hмлрд§!.\n"

 police_05: "[police_spending_protest_title_5]"
 police_05_neutral: "Полицейское государство"
 police_05_expected: "§GПолицейское государство§!"
 police_05_under: "§RПолицейское государство§!"
 police_05_over: "§3Полицейское государство§!"
 police_05_desc: "Наши полицейские и разведывательные службы получают очень большие ресурсы. Они способны бороться с коррупцией и преступностью и проводят масштабные операции по отслеживанию всех внутренних разногласий и иностранных заговоров.\n[police_spending_protest_TT]"
 police_05_TT: "\nНа внутреннюю безопасность тратится $$[?THIS.array_security_spend^4] §Hмлрд§!.\n"


 ### Military Laws
 Military_policies: "Военная политика"
 Conscription_Law: "Воинская обязанность"
 no_military: "Отсутствие армии"
 no_military_desc: "В нашей стране нет постоянной армии, и вся безопасность обеспечивается силами внутренней безопасности, такими как полиция."
 no_military_TT: "Военные зарплаты: §R+100%§!\n"
 volunteer_army: "Контрактная служба"
 volunteer_army_desc: "Наша армия полностью состоит из добровольцев. Это уменьшает общую численность армии, но позволяет нам обучать более эффективную небольшую боевую силу. Переход к добровольческим армиям стал глобальной тенденцией после окончания Холодной войны."
 volunteer_army_TT: "Военные зарплаты: §R+30%§!\n"
 partial_draft_army: "Частичный призыв"
 partial_draft_army_desc: "Большинство наших военнослужащих - добровольцы, но часть населения по-прежнему призывается для выполнения ежегодных учебных квот."
 partial_draft_army_TT: "Военные зарплаты: §R+20%§!\n"
 draft_army: "Обязательная служба"
 draft_army_desc: "В нашей стране существует обязательная военная служба, что означает, что большинство нашего мужского населения обучено военному делу. Это позволяет нам иметь более крупную армию и быстро обучать новые боевые формирования благодаря существующей учебной базе. Однако призывники менее охотно участвуют в зарубежных военных авантюрах."

 Military_Status_Women: "Статус женщин в армии"
 no_women_in_military: "Женщины не допускаются"
 no_women_in_military_desc: "Наша армия не принимает женщин на службу."
 volunteer_women: "Добровольное участие женщин"
 volunteer_women_desc: "Женщинам разрешено служить в нашей армии добровольцами."
 drafted_women: "Призыв женщин"
 drafted_women_desc: "К женщинам относятся так же, как и к мужчинам, и они призываются в нашу армию."

 Foreign_Intervention_Law: "Политика иностранного вмешательства"
 Foreign_Intervention_Law_desc: "Закон об иностранном вмешательстве определяет, насколько охотно наша страна готова вмешиваться в конфликты и влиять на другие страны."
 intervention_isolation: "Изоляционизм"
 intervention_isolation_desc: "Наша нация больше заинтересована во внутренних делах и не желает пускаться в военные авантюры."
 intervention_local_security: "Региональная безопасность"
 intervention_local_security_desc: "Мы можем предоставить нашим друзьям оружие, однако нас в основном волнуют наши собственные границы."
 intervention_limited_interventionism: "Ограниченный интервенционизм"
 intervention_limited_interventionism_desc: "Мы готовы рисковать жизнями наших солдат, чтобы наши друзья выжили."
 intervention_regional_interventionism: "Региональный интервенционизм"
 intervention_regional_interventionism_desc: "Регион, который мы называем домом, имеет первостепенное значение. Мы должны использовать угрозу войны для поддержания порядка и предотвращения нестабильности в этом регионе."
 intervention_global_interventionism: "Глобальный интервенционизм"
 intervention_global_interventionism_desc: "Наша армия достигает далеко, и наш долг - поддерживать стабильность в мире."
 intervention_neo_imperialism: "Неоимпериализм"
 intervention_neo_imperialism_desc: "Мир - это игровая площадка, и сильные берут то, что хотят. Наша национальная безопасность не может быть поставлена под угрозу из-за таких вещей, как международные договоры. Хочешь мира - готовься к войне."
 SOV_soviet_internationalism: "Советский интернационализм"

 Officer_Training_Law: "Уровень подготовки офицеров"
 Officer_Training_Law_desc: "Офицеры поведут наших солдат в бой. Чем лучше мы их обучим, тем меньше им придется учиться на поле боя. Однако создание учебных центров для офицеров может быть дорогостоящим."
 officer_baptism_by_fire: "Боевое крещение"
 officer_baptism_by_fire_desc: "Настоящие лидеры не обучаются, а закаляются в бою. Нам не нужно тратить время на подготовку лидеров, поскольку бой отсеет непригодных."
 officer_baptism_by_fire_TT: "Шанс генерала погибнуть в бою: §R+40%§!\n"
 officer_basic_training: "Базовая подготовка"
 officer_basic_training_desc: "Лица, проявившие способность к лидерству, будут отобраны и получат базовую подготовку по командованию войсками."
 officer_basic_training_TT: "Шанс генерала погибнуть в бою: §R+20%§!\n"
 officer_advanced_training: "Углубленная подготовка"
 officer_advanced_training_desc: "Лица, проявившие способность к лидерству, будут отобраны и получат углубленную подготовку по командованию войсками."
 officer_advanced_training_TT: "Военные зарплаты: §R+30%§!\n"
 officer_military_school: "Военные училища"
 officer_military_school_desc: "Мы создали специальные военные школы, где одаренные люди могут получить непосредственную подготовку по командованию войсками с самого начала своей военной карьеры."
 officer_military_school_TT: "Шанс генерала погибнуть в бою: §G-15%§!\n"
 officer_military_academy: "Военные академии"
 officer_military_academy_desc: "Мы создали престижные военные академии, где наши офицеры будут изучать лучшие тактики и стратегии и разрабатывать новые способы ведения войны."
 officer_military_academy_TT: "Шанс генерала погибнуть в бою: §G-30%§!\n"
 officer_international_education: "Международная подготовка"
 officer_international_education_desc: "С помощью наших союзников мы имеем доступ к огромному объему знаний и ресурсов, чтобы наши офицеры были готовы ко всему, что может им преподнести война."
 officer_international_education_TT: "Шанс генерала погибнуть в бою: §G-45%§!\n"

 #Trade
 trade_laws_desc: "Торговые законы важны. Они также определяют, как наша великая страна растет и развивается экономически. Выберите торговый закон для нашей страны."
 md_closed_economy: "Закрытая экономика"
 md_closed_economy_desc: "Закрытая экономика закрыта от мира. Торговля с внешним миром практически отсутствует. Страна максимально полагается на себя. Однако некоторые ресурсы по-прежнему экспортируются некоторым из наших ближайших союзников."
 consumption_economy: "Потребительская экономика"
 consumption_economy_desc: "Потребительская экономика описывает экономику, движимую потребительскими расходами как процентом от валового внутреннего продукта, в отличие от других основных компонентов ВВП."
 semi_consumption_economy: "Полупотребительская экономика"
 semi_consumption_economy_desc: "Полупотребительские экономики — относительно новое явление. Они представляют собой гибрид экспортной и потребительской экономики без проблем экономической зависимости от других источников дохода. Однако полупотребительская экономика по-прежнему сильно зависит от потребительских расходов как процента от ВВП, в отличие от настоящей смешанной экономики."
 mixed_economy: "Смешанная экономика"
 mixed_economy_desc: "Смешанные экономики во многом похожи на полупотребительские. Они еще меньше зависят от потребительских расходов в целом для формирования своего ВВП."
 export_economy: "Экспортная экономика"
 export_economy_desc: "Экспортеры сырья включают страны с крупными месторождениями природных ресурсов, страны промежуточного производства или страны с большими массивами сельскохозяйственных земель. Эти страны экспортируют большую часть сырья и промежуточных товаров в другие страны, что обеспечивает большую часть их экономического роста."
 globalized_trade_economy: "Глобальная торговая экономика"
 globalized_trade_economy_desc: "Глобализированная торговая экономика гораздо больше зависит от мировой торговли, чем любая другая. Почти все наши ресурсы отправляются на рынок, и почти все наши ресурсы поступают из торговли."

 # Migration Laws
 migration_laws: "Миграционная политика"
 open_borders: "Открытые границы"
 open_borders_desc: "Открытые границы представляют собой чрезвычайно легкие или несуществующие миграционные законы в стране. Это позволяет людям свободно въезжать в страну и выезжать из неё."
 open_borders_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^0] §Hмлрд§!.\n$current_migration_rate$"
 slightly_regulated_immigration: "Слабое регулирование миграции"
 slightly_regulated_immigration_desc: "Введение некоторых легких ограничений на перемещение людей в страну и из нее должно помочь остановить поток нежелательных мигрантов на основании предыдущих уголовных обвинений или иных причин."
 slightly_regulated_immigration_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^1] §Hмлрд§!.\n$current_migration_rate$"
 regulated_immigration: "Умеренное регулирование миграции"
 regulated_immigration_desc: "Установление таких правил, как ограничение количества мигрантов, требование чистой судимости, незначительные визы и прочее, будет необходимо для создания здравого подхода к миграционным законам."
 regulated_immigration_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^2] §Hмлрд§!.\n$current_migration_rate$"
 heavily_regulated_immigration: "Жесткое регулирование миграции"
 heavily_regulated_immigration_desc: "Введение строгих квот на мигрантов, жестких и труднодостижимых визовых требований, создание агентств для контроля и борьба со всеми формами нелегальной миграции."
 heavily_regulated_immigration_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^3] §Hмлрд§!.\n$current_migration_rate$"
 closed_borders: "Закрытые границы"
 closed_borders_desc: "Границы страны должны быть закрыты, чтобы сохранить идентичность нации, мы должны закрыть наши границы."
 closed_borders_tt: "\nНа миграционный контроль тратится $$[?THIS.array_border_control_spend^4] §Hмлрд§!.\n$current_migration_rate$"
 current_migration_rate: "\nМаксимальная §Yскорость миграции§!: [?max_net_immigration_rate|%]\nТекущая чистая §Yскорость миграции§!: [?net_immigration_rate|%]"

