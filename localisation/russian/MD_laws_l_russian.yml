 encourage_birth: "Поощрение рождаемости"
 encourage_birth_desc: "Государство активно поощряет создание многодетных семей через финансовые стимулы, пособия и социальные кампании. Это способствует долгосрочному росту населения, но бюджет тяжелеет под грузом забот о подрастающем поколении, а больницы и школы переполняются.\n-------------------\n$MODIFIER_GLOBAL_MONTHLY_POPULATION$ будет повышаться на §G+1%§! каждый год, до лимита в §Y25%§!."
 discourage_birth: "Сдерживание рождаемости"
 discourage_birth_desc: "Сочетание ограниченного доступа к контрацепции, жёсткого законодательства об абортах и социального давления позволяет государству снижать рождаемость. Это охлаждает демографический пыл, но порождает мрачное напряжение в семьях и перегружает систему здравоохранения.\n-------------------\n$MODIFIER_GLOBAL_MONTHLY_POPULATION$ будет снижаться на §R-1%§! каждый год, до лимита в §Y-25%§!."
 encourage_birth_dynamic_modifier: "Поощрение рождаемости"
 discourage_birth_dynamic_modifier: "Сдерживание рождаемости"
 encourage_birth_idea_TT: "£population_texticon  Ежемесячный прирост населения: [?encourage_birth_var|%+1]"
 discourage_birth_idea_TT: "£population_texticon  Ежемесячный прирост населения: [?discourage_birth_var|%+1]"
 no_birth_control: "Отсутствие контроля рождаемости"
 no_birth_control_desc: "Правительство не вмешивается в вопросы рождаемости, не поощряя и не сдерживая её. Такой нейтралитет дарит обществу покой, но оставляет демографическую судьбу на волю случая."
