l_russian:
 #RUSSIA
 #Decisions
 SOV_create_pmc_wagner: "Создать §RЧВК «Вагнер»§!"
 SOV_pmc_wagner_africe_goes: "Предложить услуги §RЧВК «Вагнер»§! §Y[FROM.GetNamewithFlag]§!"
 SOV_pmc_wagner_africe_goes_home: "Вывести §RЧВК «Вагнер»§! из §Y[FROM.GetNamewithFlag]§!"
 SOV_pmc_wagner_africe_perevorot_pipa: "Организовать переворот при помощи §RЧВК «Вагнер»§!"
 GENERIC_go_away_wagner: "Выслать §RЧВК «Вагнер»§!"
 SOV_pmc_gazprom_goes: "Предложить услуги §RЧВК «Газпрома»§! §Y[FROM.GetNamewithFlag]§!"
 #Events
 sov_gru.18.t: "Успешный переворот в [FROM.GetName]"
 sov_gru.18.d: "ЧВК «Вагнер» удалось провести успешный переворот в этой стране, и теперь их политический курс будет явно ориентирован на сотрудничество с нами."
 sov_gru.18.a: "Отлично"
 sov_gru.19.t: "Провал переворота в [FROM.GetName]"
 sov_gru.19.d: "ЧВК «Вагнер» не смогла провести переворот в этой стране, и, похоже, нам придётся уйти из-за этого маленького мятежа."
 sov_gru.19.a: "Досадно"
 pmc_events.15.t: "«Газпром» предлагает услуги своих ЧВК"
 pmc_events.15.d: "Российская корпорация «Газпром» теперь тоже занята ЧВК-бизнесом, и они готовы предоставить нам несколько своих батальонов за определённую плату."
 pmc_events.15.a: "Соглашаемся"
 pmc_events.15.b: "Они нам не нужны"
 pmc_events.16.t: "[FROM.GetNameWithFlag] нанял ЧВК «Газпрома»"
 pmc_events.16.d: "Их правительство согласилось нанять батальоны ЧВК, предоставленные «Газпромом», и они, похоже, заинтересованы в наших услугах."
 pmc_events.16.a: "Отлично"
 pmc_events.17.t: "[FROM.GetNameWithFlag] отказался нанимать ЧВК «Газпрома»"
 pmc_events.17.d: "Их правительство отказалось нанимать батальоны ЧВК у корпорации «Газпром» - видимо, у них достаточно собственных вооружённых сил."
 pmc_events.17.a: "Досадно"
 #Ideas
 SOV_gazprom_pmc: "[SOV.GetFlag]Батальоны ЧВК «Газпрома»"
 SOV_gazprom_pmc_desc: "Несколько подразделений, состоящих из бывших военнослужащих и желающих заработать на войне, нанятых под флагом российской корпорации «Газпром»."

 #USA
 #Ideas
 USA_blackwater_foreign: "[USA.GetFlag]ЧВК Blackwater"
 USA_blackwater_foreign_desc: "Известная американская ЧВК, которая предоставляет не только консультационные услуги, но и нанимает наёмников для выполнения различных задач."
 USA_mrpi_foreign: "[USA.GetFlag]ЧВК Military Professional Resources"
 USA_mrpi_foreign_desc: "Не самая крупная, но довольно эффективная американская ЧВК, оказывающая консультационные и обучающие услуги для различных государственных структур - полиции, армии и т.д."
 #Events
 pmc_events.8.t: "ЧВК Blackwater предлагает свои услуги"
 pmc_events.8.d: "Известная американская ЧВК Blackwater предлагает нам свои услуги во многих сферах - от охраны до обучения наших вооружённых сил. Предложение, несомненно, интересное, но стоит ли оно того?"
 pmc_events.8.a: "Соглашаемся"
 pmc_events.8.b: "Они нам не нужны"
 pmc_events.9.t: "[FROM.GetNameWithFlag] подписал контракт с ЧВК Blackwater"
 pmc_events.9.d: "Их правительство решило подписать контракт с ЧВК Blackwater, что позволит нам получить влияние в стране без прямого вмешательства наших военных сил."
 pmc_events.9.a: "Отлично"
 pmc_events.10.t: "[FROM.GetNameWithFlag] отказался от контракта с ЧВК Blackwater"
 pmc_events.10.d: "Мы получили новости о том, что их правительство отказалось подписывать контракт с Blackwater. Досадно."
 pmc_events.10.a: "Досадно"
 pmc_events.11.t: "Очередной контракт с ЧВК Blackwater завершён"
 pmc_events.11.d: "Контракт с Blackwater был расторгнут, и компания выполнила свою задачу полностью или частично."
 pmc_events.11.a: "Ок"
 pmc_events.12.t: "ЧВК MRPI предлагает свои услуги"
 pmc_events.12.d: "Известная американская ЧВК MRPI предлагает нам свои услуги во многих сферах - от охраны до обучения наших вооружённых сил. Предложение, несомненно, интересное, но стоит ли оно того?"
 pmc_events.12.a: "Соглашаемся"
 pmc_events.12.b: "Они нам не нужны"
 pmc_events.13.t: "[FROM.GetNameWithFlag] подписал контракт с ЧВК MRPI"
 pmc_events.13.d: "Их правительство решило подписать контракт с ЧВК MRPI, что позволит нам получить влияние в стране без прямого вмешательства наших военных сил."
 pmc_events.13.a: "Отлично"
 pmc_events.14.t: "[FROM.GetNameWithFlag] отказался от контракта с ЧВК MRPI"
 pmc_events.14.d: "Мы получили новости о том, что их правительство отказалось подписывать контракт с MRPI. Досадно."
 pmc_events.14.a: "Досадно"
 #Decisions
 USA_pmc_blackwater_goes: "Предложить услуги §RЧВК Blackwater§! §Y[FROM.GetNamewithFlag]§!"
 USA_pmc_mrpi_goes: "Предложить услуги §RЧВК MRPI§! §Y[FROM.GetNamewithFlag]§!"
 GENERIC_go_away_blackwater: "Выслать §RЧВК Blackwater§!"


 #Portugal
 #Ideas
 POR_lusitania_security_foreign: "[POR.GetFlag]ЧВК Lusitânia Defence"
 POR_lusitania_security_foreign_desc: "Основана в конце 1990-х годов ветеранами командос и фузилейрос, которые стремились применить свой опыт после десятилетий колониальных и зарубежных командировок. Изначально тренировочная консалтинговая фирма, Lusitânia Defence быстро расширилась, получив контракты на охрану португальских дипломатических миссий в нестабильных регионах и обеспечение безопасности компаний по добыче ресурсов в лузофонной Африке. Действует в рамках португальского корпоративного права, но поддерживает тесные неформальные связи с вооружёнными силами, служа дискретным инструментом для продвижения национальных интересов за рубежом."
 #Events
 pmc_events.18.t: "ЧВК Lusitânia Defence предлагает свои услуги"
 pmc_events.18.d: "Недавно созданная португальская ЧВК Lusitânia Defence предлагает нашему правительству свои услуги в определённых сферах деятельности. Стоит ли подписывать с ними контракт?"
 pmc_events.18.a: "Соглашаемся"
 pmc_events.18.b: "Они нам не нужны"
 pmc_events.19.t: "[FROM.GetNameWithFlag] подписал контракт с ЧВК Lusitânia Defence"
 pmc_events.19.d: "Их правительство решило подписать контракт с ЧВК Lusitânia Defence, что позволит нам получить влияние в стране без прямого вмешательства наших военных сил."
 pmc_events.19.a: "Отлично"
 pmc_events.20.t: "[FROM.GetNameWithFlag] отказался от контракта с ЧВК Lusitânia Defence"
 pmc_events.20.d: "Мы получили новости о том, что их правительство отказалось подписывать контракт с Lusitânia Defence. Досадно."
 pmc_events.20.a: "Досадно"
 #Decisions
 POR_pmc_lus_goes: "Предложить услуги §RЧВК Lusitania Defence§! §Y[FROM.GetNamewithFlag]§!"
 GENERIC_go_away_lus: "Выслать §RЧВК Lusitania Defence§!"