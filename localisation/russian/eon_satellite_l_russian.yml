l_russian:
 eon_satellite_agreements:0 "Гражданские спутниковые соглашения"
 eon_satellite_agreements_desc:0 "Управление нашими исходящими предложениями о гражданской навигации GNSS и спутниковой связи. У каждой услуги свой ожидающий ответ. Бесплатный отзыв сохраняет резерв исходного ответа до его закрытия. Истечение 30-дневного срока без ответа закрывает соответствующий путь предложений этому партнёру. Действующее согласие временно не даёт услуг при прямой войне или отсутствии пригодной и достаточно развитой системы провайдера; услуги возобновляются только пока соглашение сохраняется."
 eon_withdraw_civ_gnss_proposal:0 "Отозвать предложение о гражданской GNSS"
 eon_withdraw_civ_gnss_proposal_desc:0 "Отозвать наше исходное непринятое предложение о гражданской навигации. $eon_sat_gnss_withdraw_tt$"
 eon_withdraw_civ_com_proposal:0 "Отозвать предложение о гражданской связи"
 eon_withdraw_civ_com_proposal_desc:0 "Отозвать наше исходное непринятое предложение о гражданской спутниковой связи. $eon_sat_com_withdraw_tt$"
 eon_sat_gnss_available_tt:0 "Обе страны должны существовать, быть разными и находиться в мире друг с другом. Провайдер должен иметь пригодную гражданскую систему GNSS не ниже уровня собственной системы получателя. Наш путь предложений GNSS должен быть свободен от незакрытого прежнего ответа и не закрыт для этого партнёра. Отправка бесплатна; согласие должно по-прежнему соответствовать предложенной услуге."
 eon_sat_com_available_tt:0 "Обе страны должны существовать, быть разными и находиться в мире друг с другом. Провайдер должен иметь пригодную гражданскую систему связи не ниже уровня собственной системы получателя. Наш путь предложений связи должен быть свободен от незакрытого прежнего ответа и не закрыт для этого партнёра. Отправка бесплатна; согласие должно по-прежнему соответствовать предложенной услуге. Существующая нагрузка сети влияет на решение ИИ."
 eon_sat_gnss_proposal_tt:0 "Зарегистрировать это бесплатное предложение о гражданской GNSS со сроком ответа 30 дней и текущим уровнем системы провайдера. Исходный отправитель может его отозвать. Согласие даёт доступ только пока страны и предложенная услуга сохраняют условия; смена уровня провайдера требует нового предложения. Ответы по GNSS и связи остаются отдельными."
 eon_sat_com_proposal_tt:0 "Зарегистрировать это бесплатное предложение о гражданской связи со сроком ответа 30 дней и текущим уровнем системы провайдера. Исходный отправитель может его отозвать. Согласие даёт доступ только пока страны и предложенная услуга сохраняют условия; смена уровня провайдера требует нового предложения. Ответы по связи и GNSS остаются отдельными."
 eon_sat_gnss_closed_tt:0 "Закрыть это предложение о гражданской GNSS без нового предоставления доступа. Действующие соглашения остаются отдельными. Отозванный или утративший условия ответ не создаёт доступ; истечение срока без ответа закрывает только соответствующий путь предложений GNSS этому партнёру."
 eon_sat_com_closed_tt:0 "Закрыть это предложение о гражданской связи без нового предоставления доступа. Действующие соглашения остаются отдельными. Отозванный или утративший условия ответ не создаёт доступ; истечение срока без ответа закрывает только соответствующий путь предложений связи этому партнёру."
 eon_sat_gnss_withdraw_tt:0 "Исходный отправитель может бесплатно отозвать наше ожидающее предложение о гражданской GNSS. Исходный ответ сохраняет резерв нашего предложения GNSS до закрытия; истечение 30-дневного срока закрывает соответствующий путь этому партнёру. Отзыв не прекращает уже принятое соглашение и не резервирует исходящие предложения другой страны."
 eon_sat_com_withdraw_tt:0 "Исходный отправитель может бесплатно отозвать наше ожидающее предложение о гражданской связи. Исходный ответ сохраняет резерв нашего предложения связи до закрытия; истечение 30-дневного срока закрывает соответствующий путь этому партнёру. Отзыв не прекращает уже принятое соглашение и не резервирует исходящие предложения другой страны."
 eon_sat_gnss_granted_tt:0 "Зафиксировать доступ к гражданской GNSS с действительным согласием и пересчитать существующие бонусы вместе с другими провайдерами. Отсутствие пригодной системы, более слабая система или прямая война временно исключают бонус чужой услуги при сохранении согласия. Отзыв удаляет предоставление доступа этим провайдером; восстановление услуги не воссоздаёт отозванное соглашение."
 eon_sat_com_granted_tt:0 "Зафиксировать доступ к гражданской связи с действительным согласием и пересчитать существующие бонусы вместе с другими провайдерами. Нагрузка партнёров сохраняет существующие 100 приёмников на каждую контролируемую область каждого согласившегося получателя. Отсутствие пригодной системы, более слабая система или прямая война временно исключают бонус чужой услуги при сохранении согласия. Отзыв удаляет предоставление доступа этим провайдером; восстановление услуги не воссоздаёт отозванное соглашение."
 eon_sat_gnss_revoke_tt:0 "Провайдер может бесплатно отозвать предоставленный этой стране доступ к гражданской GNSS без её согласия. Обе страны должны по-прежнему существовать и быть разными; запись доступа должна определять наше предоставление услуги. Прямая война, недоступность услуги или ожидающее предложение не препятствуют отзыву. Удаляется только наш доступ для этого получателя; другие провайдеры и соглашения остаются отдельными."
 eon_sat_com_revoke_tt:0 "Провайдер может бесплатно отозвать предоставленный этой стране доступ к гражданской связи без её согласия. Обе страны должны по-прежнему существовать и быть разными; запись доступа должна определять наше предоставление услуги. Прямая война, недоступность услуги или ожидающее предложение не препятствуют отзыву. Удаляется только наш доступ для этого получателя; другие провайдеры и соглашения остаются отдельными."
