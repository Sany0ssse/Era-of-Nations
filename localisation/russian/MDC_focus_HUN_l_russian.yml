 #Structures
 HUN_agency_create: "Создание венгерского агентства"
 HUN_agency_create_desc: "Постхолодновой войны ландшафт безопасности требует единого разведывательного аппарата. Мы объединим разрозненные дирекции в одно национальное агентство, способное координировать контрразведку, кибероперации и взаимодействие с нашими союзниками."
 HUN_national_police_hun: "Национальная полиция"
 HUN_national_police_hun_desc: "Современная преступность, терроризм и коррупция требуют реформированного Rendőrség. Централизованные закупки, новые стандарты подготовки и усовершенствованные средства связи превратят силы в надёжный оплот внутренней безопасности."
 HUN_constitution_protection_office: "Alkotmányvédelmi Hivatal"
 HUN_constitution_protection_office_desc: "За охрану конституционного порядка отвечает AH. Расширение её мандата и следственных ресурсов позволит предотвращать экстремистские заговоры и иностранное вмешательство до того, как они разовьются в серьёзные угрозы."
 HUN_NBSZ: "Nemzetbiztonsági Szolgálat"
 HUN_NBSZ_desc: "Военная разведка должна быть перестроена для XXI века. Новые комплексы наблюдения, совместные учения и расширенный корпус аналитиков будут держать наши вооружённые силы в курсе угроз в регионе."
 HUN_NVS: "Nemzeti Védelmi Szolgálat"
 HUN_NVS_desc: "Создание Национальной службы обороны объединяет антикоррупционную полицейскую работу с военной контрразведкой, защищая закупки, базы и засекреченные программы от преступного захвата."
 HUN_informacios_hivatal: "Információs Hivatal"
 HUN_informacios_hivatal_desc: "Разведывательное управление, ответственное за сбор информации за рубежом, получит дипломатическое прикрытие, современные узлы SIGINT и аналитические обмены, чтобы Будапешт мог предвидеть кризисы за пределами наших границ."
 HUN_anti_terror: "Terrorelhárítási Közpon"
 HUN_anti_terror_desc: "Венгрии требуется специализированное командование по борьбе с терроризмом для быстрого реагирования на кризисы с заложниками или массовые атаки. Оснащение TEK авиацией, инструментами для штурма и юридическими полномочиями будет сдерживать потенциальных боевиков."

 #Foreign Politic
 HUN_foreign_policy_of_hungary: "Внешняя политика Венгрии"
 HUN_foreign_policy_of_hungary_desc: "Будапешт должен выбрать позицию, которая сбалансирует атлантические обязательства, амбиции ЕС и жёсткие географические реалии. Все последующие дипломатические шаги будут определяться всесторонним пересмотром союзов, торговых маршрутов и оборонных обязательств."
 HUN_EU_membership_question: "Вопрос членства в ЕС"
 HUN_EU_membership_question_desc: "Следует ли Венгрии глубже связать себя с Брюсселем или сохранить гибкость? Национальная консультация взвесит вопросы суверенитета против экономических и политических выгод от вступления в ЕС."
 HUN_politics_of_eurooptimism: "Политика еврооптимизма"
 HUN_politics_of_eurooptimism_desc: "Принятие евроатлантической интеграции открывает субсидии, инвестиции и влияние внутри Союза. Коммуникация будет подчёркивать общие ценности и процветание, которое приходит с открытыми рынками."
 HUN_politics_of_euroscepticism: "Политика евроскептицизма"
 HUN_politics_of_euroscepticism_desc: "Скептики требуют ограничений на вмешательство Брюсселя. Мы будем отстаивать возможность исключений, защищать национальные компетенции и привлекать избирателей, которые опасаются культурной эрозии или финансовых излишеств."
 HUN_foreign_european_investments: "Европейские инвестиции"
 HUN_foreign_european_investments_desc: "Поездки по европейским столицам с целенаправленным пакетом стимулов должны привлечь заводы, банки и логистические компании, стремящиеся закрепиться в Центральной Европе."
 HUN_eastern_frontier: "Восточная граница"
 HUN_eastern_frontier_desc: "Охрана восточной границы требует дипломатии не меньше, чем войск. Миссии по укреплению доверия и совместные инфраструктурные проекты помогут успокоить приграничные регионы."
 HUN_china_investment_treaty: "Инвестиционный договор с Китаем"
 HUN_china_investment_treaty_desc: "Подписание инвестиционного договора с Пекином открывает потоки инициатив «Один пояс, один путь» - индустриальные парки, модернизацию железных дорог и финансирование в обмен на преференциальный доступ."
 HUN_support_iran: "Поддержка Ирана"
 HUN_support_iran_desc: "Практическое сотрудничество с Тегераном может принести дешёвые углеводороды и экспортные возможности, даже если это раздражает некоторых западных партнёров."
 HUN_landmark_to_west: "Ориентация на запад"
 HUN_landmark_to_west_desc: "Подтверждение нашей западной ориентации означает совместные учения, судебные реформы и публичную дипломатию, подчёркивающую роль Венгрии как надёжного участника НАТО и ЕС."
 HUN_agree_on_cooperation_with_japan: "Согласие на сотрудничество с Японией"
 HUN_agree_on_cooperation_with_japan_desc: "Японский капитал и технологии могут значительно ускорить развитие нашей производственной базы. Соглашение о сотрудничестве будет направлено на развитие автомобильной, электронной промышленности и экологически чистой энергетики."
 HUN_sign_a_friendship_treaty_with_germany: "Подписать договор о дружбе с Германией"
 HUN_sign_a_friendship_treaty_with_germany_desc: "Берлин остаётся нашим главным торговым партнёром. Формальный договор о дружбе закрепит политическое доверие, студенческие обмены и компенсации в оборонно-промышленной сфере."
 HUN_referendum_on_NATO_membership: "Референдум о членстве в НАТО"
 HUN_referendum_on_NATO_membership_desc: "Вынесение членства в НАТО на референдум сопряжено с риском споров, но придаёт демократическую легитимность выбранному пути."
 HUN_withdraw_from_treaty: "Выход из договора"
 HUN_withdraw_from_treaty_desc: "Если народ проголосует за выход из НАТО, нам придётся управлять последствиями - перестраивать командные связи, пересогласовывать права на базы и разрабатывать независимую оборонную доктрину."
 HUN_condemn_american_imperialism: "Осудить американский империализм"
 HUN_condemn_american_imperialism_desc: "Резкая критика интервенций США удовлетворит антивоенные круги и сигнализирует о смещении курса от Вашингтона."
 HUN_conduct_exercises_with_Russia: "Провести учения с Россией"
 HUN_conduct_exercises_with_Russia_desc: "Приглашение российских подразделений для учений на венгерской земле углубляет военную совместимость с Москвой и демонстрирует геополитическую переориентацию."
 HUN_thaw_in_relations_with_serbia: "Разморозка отношений с Сербией"
 HUN_thaw_in_relations_with_serbia_desc: "Перезагрузка связей с Белградом снижает напряжённость в Воеводине и открывает возможности для трансграничной торговли, энергетических обменов и защиты меньшинств."
 HUN_remain_loyal_to_alliance: "Сохранять верность альянсу"
 HUN_remain_loyal_to_alliance_desc: "Укрепление обязательств НАТО-развертывания, расходы и обмен разведданными - убеждает союзников, что Венгрия надёжный партнёр."
 HUN_invasion_of_iraq: "Поддержать вторжение в Ирак"
 HUN_invasion_of_iraq_desc: "Отправка логистики или боевых подразделений в коалицию под руководством США предоставит нам расположение Вашингтона, но создаст риск внутреннего недовольства."
 HUN_conduct_military_exercises_with_US: "Провести военные учения с США"
 HUN_conduct_military_exercises_with_US_desc: "Совместные манёвры с войсками США улучшат подготовку Honvédség и дадут понимание современных тактик НАТО."
 HUN_get_closer_to_poland: "Сблизиться с Польшей"
 HUN_get_closer_to_poland_desc: "Углубление сотрудничества Вышеградской группы с Варшавой расширяет наше влияние в Брюсселе и создаёт единый Центральноевропейский Блок Голосования."
 HUN_conduct_military_exercises_with_NATO: "Провести военные учения с НАТО"
 HUN_conduct_military_exercises_with_NATO_desc: "Приём ротационных учений НАТО повышает готовность и показывает, что Венгрия готова нести обязательства коллективной обороны."
 HUN_purchase_of_german_tanks: "Закупка немецких танков"
 HUN_purchase_of_german_tanks_desc: "Приобретение Leopard модернизирует наши танковые войска за ночь, согласуя логистику с другими европейскими операторами."
 HUN_exercises_with_British_navy: "Учения с королевским флотом Великобритании"
 HUN_exercises_with_British_navy_desc: "Несмотря на отсутствие флота дальнего плавания, обмен персоналом и тренировки на симуляторах с королевским флотом улучшат планирование речных и морских операций."
 HUN_visit_to_moscow: "Визит в Москву"
 HUN_visit_to_moscow_desc: "Высокопрофильный визит в Москву может открыть контракты на энергию, инвестиционные обещания и координацию по вопросам меньшинств - если удастся обойти западный скептицизм."
 HUN_anti_russian_position: "Антироссийская позиция"
 HUN_anti_russian_position_desc: "Жёсткая линия против кремлёвской авантюрности означает соблюдение санкций, военную готовность и громкую поддержку соседей под угрозой."
 HUN_support_separatism_in_chechnya: "Поддержка сепаратизма в Чечне"
 HUN_support_separatism_in_chechnya_desc: "Скрытая помощь чеченским сепаратистам подорвёт отношения с Россией, но принесёт расположение определённых западных ястребов."
 HUN_help_for_ukraine: "Помощь Украине"
 HUN_help_for_ukraine_desc: "Предоставление помощи, обучения или дипломатического прикрытия Киеву позиционирует Венгрию как защитника суверенитета Восточной Европы."
 HUN_coop_with_azer: "Визит в Баку"
 HUN_coop_with_azer_desc: "Сближение с Азербайджаном обеспечивает диверсификацию энергоснабжения и контракты на строительство в Южном Кавказе."
 HUN_support_belarusian_opposition: "Поддержка белорусской оппозиции"
 HUN_support_belarusian_opposition_desc: "Поддержка демократических активистов в Минске подчёркивает нашу приверженность правам человека, но создаёт риск ответных мер со стороны режима Лукашенко."
 HUN_prepare_for_russian_invasion: "Подготовка к российскому вторжению"
 HUN_prepare_for_russian_invasion_desc: "Военные игры, укрепление складов и предварительное размещение резервов - необходимая страховка на случай враждебных действий России."
 HUN_cooperate_with_kremlin: "Сотрудничество с Кремлём"
 HUN_cooperate_with_kremlin_desc: "Структурированное сотрудничество с Москвой по вопросам энергетики, транзита и безопасности призвано превратить Россию из угрозы в партнёра."
 HUN_economic_partnership_with_CIS: "Экономическое партнёрство с СНГ"
 HUN_economic_partnership_with_CIS_desc: "Снижение тарифов и продвижение инвестиций на рынках СНГ могут компенсировать слабый спрос на венгерский экспорт в странах Запада."
 HUN_bringing_closer_ties_to_EAEU: "Сближение с ЕАЭС"
 HUN_bringing_closer_ties_to_EAEU_desc: "Статус наблюдателя и упрощение таможенных процедур с Евразийским Экономическим Союзом дают рычаги влияния в торговых переговорах с Брюсселем."
 HUN_sign_defense_pact_with_CSTO: "Подписать договор об обороне с ОДКБ"
 HUN_sign_defense_pact_with_CSTO_desc: "Беспрецедентный договор о безопасности с членами ОДКБ изменит стратегическую ориентацию Венгрии и даст доступ к российской технике."
 HUN_question_of_membership_in_CSTO: "Вопрос членства в ОДКБ"
 HUN_question_of_membership_in_CSTO_desc: "Следует ли нам пойти дальше и подать заявку на членство в ОДКБ? Белая книга по обороне очертит преимущества и существующие риски."
 HUN_joint_exercises_with_russia: "Совместные учения с Россией"
 HUN_joint_exercises_with_russia_desc: "Планирование регулярных совместных учений с российскими формированиями сохраняет каналы связи открытыми и помогает нашим офицерам понимать восточную доктрину."
 HUN_preservation_of_western_values: "Сохранение западных ценностей"
 HUN_preservation_of_western_values_desc: "Несмотря на нашу позицию в отношении европейской интеграции, мы остаёмся привержены западным демократическим ценностям и принципам. Мы сохраним нашу культурную и политическую ориентацию на Запад, отстаивая при этом национальный суверенитет."
 HUN_treaty_of_friendship_with_turkey: "Договор о дружбе с Турцией"
 HUN_treaty_of_friendship_with_turkey_desc: "Укрепление дипломатических и экономических связей с Турцией открывает новые возможности для торговли, энергетического сотрудничества и региональной стабильности. Договор о дружбе укрепит наши отношения с этим важным региональным партнёром."
 HUN_cooperation_with_indonesia: "Сотрудничество с Индонезией"
 HUN_cooperation_with_indonesia_desc: "Расширяя наше дипломатическое присутствие в Юго-Восточной Азии, мы установим соглашения о сотрудничестве с Индонезией, сосредоточившись на торговле, инвестициях и культурном обмене в этом быстрорастущем регионе."
 HUN_joint_research_with_kazakhstan: "Совместные исследования с Казахстаном"
 HUN_joint_research_with_kazakhstan_desc: "Партнёрство с Казахстаном в области научно-технических исследований повысит наши возможности в энергетике, сельском хозяйстве и промышленном развитии, укрепляя связи с Центральной Азией."
 HUN_invite_korean_workers: "Пригласить корейских рабочих"
 HUN_invite_korean_workers_desc: "Привлечение квалифицированных рабочих из Кореи поможет решить проблему нехватки кадров в ключевых секторах и облегчит передачу технологий, повышая наши промышленные и технологические возможности."
 HUN_strengthening_ties_with_the_visegrad_group: "Укрепление связей с Вышеградской группой"
 HUN_strengthening_ties_with_the_visegrad_group_desc: "Углубление сотрудничества в рамках Вышеградской группы усилит наш голос в европейских делах и создаст единый фронт центральноевропейских интересов в Брюсселе."
 HUN_arab_oil_treaty: "Нефтяной договор с арабскими странами"
 HUN_arab_oil_treaty_desc: "Обеспечение выгодных соглашений на поставку нефти с арабскими странами диверсифицирует наши источники энергии и снизит зависимость от какого-либо одного поставщика, повышая нашу энергетическую безопасность."
 HUN_attract_south_korean_companies: "Привлечь южнокорейские компании"
 HUN_attract_south_korean_companies_desc: "Предложение стимулов южнокорейским корпорациям принесёт передовые технологии, производственный опыт и инвестиции в Венгрию, укрепляя наши экономические связи с Восточной Азией."
 HUN_trade_agreement_with_taiwan: "Торговое соглашение с Тайванем"
 HUN_trade_agreement_with_taiwan_desc: "Заключение всеобъемлющего торгового соглашения с Тайванем откроет доступ к высокотехнологичной продукции и создаст возможности для венгерского экспорта на азиатский рынок."
 HUN_indian_investments: "Индийские инвестиции"
 HUN_indian_investments_desc: "Привлечение инвестиций из растущей экономики Индии принесёт капитал, технологии и деловые возможности, ещё больше диверсифицируя наши экономические партнёрства в Азии."
 HUN_open_british_universities: "Открыть британские университеты"
 HUN_open_british_universities_desc: "Содействие студенческим обменам и академическому сотрудничеству с британскими университетами улучшит нашу образовательную систему и укрепит культурные связи с Соединённым Королевством."
 HUN_french_investments: "Французские инвестиции"
 HUN_french_investments_desc: "Поощрение французских компаний к инвестициям в Венгрию принесёт капитал, опыт и укрепит наши экономические отношения с одной из крупнейших экономик Европы."
 HUN_joint_exercises_with_us: "Совместные учения с Соединёнными Штатами"
 HUN_joint_exercises_with_us_desc: "Проведение совместных военных учений с американскими силами улучшит совместимость, повысит наши оборонные возможности и продемонстрирует нашу приверженность альянсу НАТО."
 HUN_attract_american_investments: "Привлечь американские инвестиции"
 HUN_attract_american_investments_desc: "Продвижение Венгрии как направления для инвестиций американских компаний принесёт капитал, технологии и рабочие места, укрепляя наши экономические связи с Соединёнными Штатами."
 HUN_receive_USAID_agents: "Принять агентов USAID"
 HUN_receive_USAID_agents_desc: "Приветствие программ помощи USAID обеспечит помощь в развитии, техническую экспертизу и поддержку различных секторов, укрепляя наше партнёрство с Соединёнными Штатами."
 HUN_establish_american_units_in_hungary: "Разместить американские подразделения в Венгрии"
 HUN_establish_american_units_in_hungary_desc: "Размещение американских военных подразделений повысит наши оборонные возможности, укрепит присутствие НАТО в Центральной Европе и углубит наше сотрудничество в области безопасности с Соединёнными Штатами."
 HUN_suppress_the_influence_of_east: "Подавить влияние Востока"
 HUN_suppress_the_influence_of_east_desc: "Принятие мер против восточного влияния защитит наш суверенитет, сохранит нашу западную ориентацию и обеспечит соответствие нашей внешней политики демократическим ценностям."
 HUN_buy_american_tanks: "Купить американские танки"
 HUN_buy_american_tanks_desc: "Приобретение американских основных боевых танков модернизирует наши бронетанковые силы, улучшит совместимость с союзниками по НАТО и продемонстрирует нашу приверженность коллективной обороне."
 HUN_hungarian_ukrainian_cooperation: "Венгерско-украинское сотрудничество"
 HUN_hungarian_ukrainian_cooperation_desc: "Углубление сотрудничества с Украиной укрепит региональную стабильность, поддержит украинский суверенитет и создаст возможности для экономического и культурного обмена."
 HUN_friendship_with_georgia: "Дружба с Грузией"
 HUN_friendship_with_georgia_desc: "Построение прочной дружбы с Грузией поддержит её территориальную целостность, повысит региональную безопасность и создаст возможности для торговли и сотрудничества на Кавказе."
 HUN_send_peacekeepers_to_moldova: "Отправить миротворцев в Молдову"
 HUN_send_peacekeepers_to_moldova_desc: "Вклад миротворческих сил в Молдову поможет стабилизировать регион, поддержит усилия по разрешению конфликта и продемонстрирует нашу приверженность региональной безопасности."
 HUN_trade_agreement_with_belarus: "Торговое соглашение с Беларусью"
 HUN_trade_agreement_with_belarus_desc: "Заключение торгового соглашения с Беларусью откроет новые рынки для венгерских товаров, обеспечит доступ к белорусским ресурсам и укрепит экономические связи в Восточной Европе."
 HUN_arm_transnistria: "Вооружить Приднестровье"
 HUN_arm_transnistria_desc: "Предоставление военной поддержки Приднестровью укрепит его оборонные возможности и продемонстрирует нашу приверженность поддержке наших партнёров в регионе."
 HUN_economic_partnership_with_CIS_tt: "Мнение всех членов СНГ не ниже 50"

