 #Hungary Economy Events
 hungary_economy.1.t: "Венгрия ищет экономические инвестиции"
 hungary_economy.1.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с просьбой об экономических инвестициях в их испытывающую трудности экономику. Будапешт утверждает, что иностранный капитал необходим для модернизации инфраструктуры, создания рабочих мест и стимулирования роста. Они обещают выгодные условия и потенциальную прибыль от инвестиций, а также предлагают укрепить дипломатические связи между нашими странами."
 hungary_economy.1.a: "Инвестировать в экономику Венгрии"
 hungary_economy.1.b: "Отклонить возможность инвестиций"

 hungary_economy.2.t: "Инвестиции приняты"
 hungary_economy.2.d: "[FROM.GetNameDef] согласился инвестировать в экономику [HUN.GetNameDef]. Иностранный капитал поможет модернизировать инфраструктуру, создать рабочие места и стимулировать экономический рост. Это партнерство укрепляет наши дипломатические отношения и открывает новые возможности для сотрудничества."
 hungary_economy.2.a: "Отличные новости для нашей экономики"

 hungary_economy.3.t: "Инвестиции отклонены"
 hungary_economy.3.d: "[FROM.GetNameDef] отклонил наш запрос на экономические инвестиции. Несмотря на разочарование, этот неудачный исход не остановит наши усилия по модернизации и развитию экономики другими средствами. Мы продолжим искать альтернативные источники финансирования и партнерства."
 hungary_economy.3.a: "Мы найдём другие возможности"

 #IMF Subsidies Event
 hungary_economy.4.t: "МВФ предлагает экономическую помощь"
 hungary_economy.4.d: "Международный валютный фонд предложил экономическую помощь [HUN.GetNameDef]. Это предложение поступает в критический момент, когда наша экономика сталкивается с серьёзными проблемами. МВФ предложил несколько форм поддержки, которые могут помочь стабилизировать финансовую ситуацию и стимулировать экономический рост. Мы должны тщательно оценить, какой вариант наилучшим образом соответствует национальным интересам."
 hungary_economy.4.a: "Принять прямую финансовую помощь"
 hungary_economy.4.b: "Запросить списание долга"
 hungary_economy.4.c: "Принять долгосрочную экономическую поддержку"

 #Investment Opportunity (Second Round)
 hungary_economy.5.t: "Еще одна инвестиционная возможность"
 hungary_economy.5.d: "[HUN.GetNameDef] вновь обратилось к [This.GetNameDef] с просьбой об экономических инвестициях. На этот раз они предлагают более скромные условия, сосредоточенные на развитии инфраструктуры. Будапешт подчеркивает взаимную выгоду и укрепление двусторонних отношений через экономическое сотрудничество."
 hungary_economy.5.a: "Инвестировать в венгерскую инфраструктуру"
 hungary_economy.5.b: "Отказать в инвестициях"

 #Investment Accepted (Second Round)
 hungary_economy.6.t: "Инвестиции в инфраструктуру приняты"
 hungary_economy.6.d: "[FROM.GetNameDef] согласился инвестировать в развитие инфраструктуры [HUN.GetNameDef]. Эти инвестиции помогут модернизировать транспортные сети и улучшить связность по всей стране. Иностранный капитал создаст рабочие места и стимулирует экономическую активность на местном уровне, одновременно укрепляя дипломатические связи."
 hungary_economy.6.a: "Это улучшит нашу инфраструктуру"

 #Investment Declined (Second Round)
 hungary_economy.7.t: "Инвестиции в инфраструктуру отклонены"
 hungary_economy.7.d: "[FROM.GetNameDef] отклонил нашу просьбу о вложении средств в инфраструктуру. Хотя это разочаровывает, мы остаёмся привержены модернизации транспортных сетей другими способами. Мы продолжим искать альтернативные источники финансирования и партнёрства для наших проектов развития."
 hungary_economy.7.a: "Мы найдём другие источники финансирования"

 #Hungarian Agriculture Trade
 hungary_economy.8.t: "Доступны венгерские сельскохозяйственные продукты"
 hungary_economy.8.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с предложением поставлять высококачественные сельскохозяйственные продукты. Плодородные равнины Венгрии и традиционные методы ведения сельского хозяйства дают отличные урожаи, включая пшеницу, кукурузу и различные овощи. Это торговое соглашение обеспечит нам надежный доступ к качественным продуктам питания, поддерживая венгерских фермеров и укрепляя экономические отношения."
 hungary_economy.8.a: "Закупить венгерские сельхозпродукты"
 hungary_economy.8.b: "Отклонить предложение о торговле сельхозпродуктами"

 #Hungarian Agriculture Trade Accepted
 hungary_economy.9.t: "Соглашение о торговле сельхозпродуктами подписано"
 hungary_economy.9.d: "[FROM.GetNameDef] согласился закупать венгерские сельхозпродукты. Это торговое соглашение обеспечит стабильный рынок сбыта для наших культур и скота, поддерживая фермерские сообщества и укрепляя сельскохозяйственный сектор. Партнёрство укрепляет экономические связи и обеспечивает продовольственную безопасность для нашего торгового партнёра."
 hungary_economy.9.a: "Выгодное партнёрство для наших фермеров"

 #Hungarian Agriculture Trade Declined
 hungary_economy.10.t: "Предложение о торговле сельхозпродуктами отклонено"
 hungary_economy.10.d: "[FROM.GetNameDef] отклонил наше предложение о поставке сельхозпродуктов. Хотя это разочаровывает наш сельскохозяйственный сектор, мы продолжим искать другие рынки сбыта для наших высококачественных культур и скота. Сельское хозяйство остаётся сильным, и мы найдём альтернативных торговых партнёров."
 hungary_economy.10.a: "Мы найдём другие рынки"

 #Hungarian Metallurgy Investment
 hungary_economy.11.t: "Инвестиции в венгерскую металлургию"
 hungary_economy.11.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с предложением о значительных инвестициях в металлургическую отрасль. Венгрия стремится модернизировать и расширить производство стали, что создаст рабочие места, увеличит экспорт и укрепит промышленную базу страны. Эта инвестиционная возможность обещает значительную прибыль и установит прочное промышленное партнёрство между нашими странами."
 hungary_economy.11.a: "Инвестировать в венгерскую металлургию"
 hungary_economy.11.b: "Отклонить инвестиции в металлургию"

 #Hungarian Metallurgy Investment Accepted
 hungary_economy.12.t: "Инвестиции в металлургию приняты"
 hungary_economy.12.d: "[FROM.GetNameDef] согласился инвестировать в металлургическую отрасль [HUN.GetNameDef]. Эти значительные инвестиции модернизируют наши стальные производства, создадут множество рабочих мест и значительно увеличат промышленный выпуск. Партнёрство укрепит экономику и установит Венгрию ключевым игроком на региональном рынке стали."
 hungary_economy.12.a: "Это модернизирует нашу сталелитейную промышленность"

 #Hungarian Metallurgy Investment Declined
 hungary_economy.13.t: "Инвестиции в металлургию отклонены"
 hungary_economy.13.d: "[FROM.GetNameDef] отклонил нашу просьбу о вложениях в металлургическую отрасль. Хотя это разочаровывает наш сталелитейный сектор, мы остаёмся привержены модернизации промышленного потенциала другими способами. Мы продолжим искать альтернативных инвесторов и источники финансирования для расширения металлургии."
 hungary_economy.13.a: "Мы найдём других инвесторов"

 #German Steel Export Trade
 hungary_economy.14.t: "Возможность экспорта стали в Германию"
 hungary_economy.14.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с предложением экспортировать высококачественные стальные изделия в Германию. Металлургическая промышленность Венгрии модернизирована и теперь способна производить сталь, соответствующую немецким промышленным стандартам. Это торговое соглашение обеспечит нам доступ к прибыльному немецкому рынку и укрепит экономические связи с одной из крупнейших экономик Европы."
 hungary_economy.14.a: "Принять соглашение о поставках стали"
 hungary_economy.14.b: "Отклонить предложение о поставках стали"

 #German Steel Export Accepted
 hungary_economy.15.t: "Экспорт стали в Германию одобрен"
 hungary_economy.15.d: "[FROM.GetNameDef] согласился импортировать венгерскую сталь. Это торговое соглашение обеспечит нам ценный рынок сбыта металлургической продукции, усилит сталелитейную отрасль и создаст рабочие места в промышленном секторе. Партнёрство укрепляет экономические отношения с Германией и подтверждает Венгрию как надёжного поставщика качественной стали."
 hungary_economy.15.a: "Это увеличит экспорт нашей стали"

 #German Steel Export Declined
 hungary_economy.16.t: "Предложение о поставках стали отклонено"
 hungary_economy.16.d: "[FROM.GetNameDef] отклонил наше предложение о поставке стальных изделий. Хотя это разочаровывает металлургическую отрасль, мы продолжим искать другие рынки сбыта для нашей высококачественной стали. Производственные возможности остаются сильными, и мы найдём альтернативных торговых партнёров."
 hungary_economy.16.a: "Мы найдём другие рынки сбыта стали"

 #Russian Oil Export Trade
 hungary_economy.17.t: "Возможность экспорта российской нефти"
 hungary_economy.17.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с предложением способствовать экспорту нефти из России. Венгрия стремится стать транзитным хабом для российской нефти, что обеспечит нам доходы от транзита и усилит энергетическую безопасность. Эта схема также повысит стратегическое положение Венгрии на региональном рынке энергии и создаст новые экономические возможности."
 hungary_economy.17.a: "Принять соглашение о транзите нефти"
 hungary_economy.17.b: "Отклонить предложение по экспорту нефти"

 #Russian Oil Export Accepted
 hungary_economy.18.t: "Соглашение о транзите нефти одобрено"
 hungary_economy.18.d: "[FROM.GetNameDef] согласился на транзит нефти через Венгрию. Это соглашение обеспечит значительные доходы от транзита и укрепит наше положение на европейском энергетическом рынке. Партнёрство повышает энергетическую безопасность и создаёт новые экономические возможности, подтверждая Венгрию как важный транзитный хаб."
 hungary_economy.18.a: "Это укрепит нашу энергетическую позицию"

 #Russian Oil Export Declined
 hungary_economy.19.t: "Предложение о поставках нефти отклонено"
 hungary_economy.19.d: "[FROM.GetNameDef] отклонил наше предложение по транзиту нефти через Венгрию. Хотя это разочаровывает энергетический сектор, мы продолжим искать другие возможности для укрепления позиций на региональном энергетическом рынке. Стратегическое расположение и инфраструктура остаются ценными активами для будущих энергетических партнёрств."
 hungary_economy.19.a: "Мы найдём другие энергетические возможности"

 #Chinese Light Metals Export
 hungary_economy.20.t: "Возможность экспорта лёгких металлов в Китай"
 hungary_economy.20.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с предложением экспортировать лёгкие металлы, особенно алюминий, в Китай. Растущие металлургические возможности Венгрии позволяют производить высококачественные алюминиевые изделия, которые найдут спрос в быстрорастущей промышленной отрасли Китая. Это соглашение откроет новые рынки для нашей металлургической продукции и укрепит экономические связи с крупнейшей экономикой Азии."
 hungary_economy.20.a: "Принять сделку по экспорту лёгких металлов"
 hungary_economy.20.b: "Отклонить предложение по экспорту алюминия"

 #Chinese Light Metals Export Accepted
 hungary_economy.21.t: "Экспорт лёгких металлов в Китай одобрен"
 hungary_economy.21.d: "[FROM.GetNameDef] согласился импортировать венгерские лёгкие металлы, особенно алюминиевые изделия. Это соглашение обеспечит доступ к огромному промышленному рынку Китая, увеличит экспорт металлургической продукции и создаст новые возможности для алюминиевой отрасли. Партнёрство укрепляет экономические связи с Азией и подтверждает Венгрию как надёжного поставщика качественных металлов."
 hungary_economy.21.a: "Это расширит наши азиатские рынки"

 #Chinese Light Metals Export Declined
 hungary_economy.22.t: "Предложение по экспорту лёгких металлов отклонено"
 hungary_economy.22.d: "[FROM.GetNameDef] отклонил наше предложение по экспорту лёгких металлов в Китай. Хотя это разочаровывает металлургическую отрасль, мы продолжим искать другие рынки для алюминия и других лёгких металлов. Производственные возможности остаются сильными, и мы найдём альтернативных торговых партнёров на мировом рынке."
 hungary_economy.22.a: "Мы найдём другие рынки сбыта металлов"

 #Energy Investment
 hungary_economy.23.t: "Инвестиции в энергетический сектор Венгрии"
 hungary_economy.23.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с предложением значительных инвестиций в энергетический сектор. Венгрия стремится модернизировать и расширить энергетическую инфраструктуру, особенно в производстве синтетического топлива и технологиях возобновляемой энергии. Эти инвестиции помогут снизить зависимость Венгрии от внешних источников энергии, создадут рабочие места в энергетическом секторе и обеспечат более устойчивое энергетическое будущее. Партнёрство обещает значительную прибыль и укрепит стратегическое сотрудничество в энергетике."
 hungary_economy.23.a: "Инвестировать в венгерскую энергетику"
 hungary_economy.23.b: "Отклонить предложение по инвестициям в энергетику"

 #Energy Investment Accepted
 hungary_economy.24.t: "Инвестиции в энергетику приняты"
 hungary_economy.24.d: "[FROM.GetNameDef] согласился инвестировать в энергетический сектор [HUN.GetNameDef]. Эти значительные инвестиции модернизируют нашу энергетическую инфраструктуру, расширят производство синтетического топлива и создадут многочисленные рабочие места в энергетике. Партнёрство укрепит энергетическую безопасность, снизит зависимость от иностранных источников энергии и установит Венгрию как лидера в производстве устойчивой энергии."
 hungary_economy.24.a: "Это обеспечит наше энергетическое будущее"

 #Hungarian Army Events

 hungary_army.1.t: "Запрос Венгрии на закупку танков M1A2"
 hungary_army.1.d: "[HUN.GetNameDef] обратилась к нам с официальным запросом на закупку 120 основных боевых танков M1A2 «Абрамс» на сумму $5 миллиардов. Венгерская сторона стремится модернизировать свои бронетанковые силы и получить доступ к современным американским военным технологиям. M1A2 «Абрамс» считается одним из самых боеспособных танков в мире, сочетая высокую огневую мощь, надёжную защиту и отличную подвижность. Одобрение данной сделки укрепит наше военное влияние в Центральной Европе и углубит военно-техническое сотрудничество с Будапештом."
 hungary_army.1.a: "Одобрить продажу танков «Абрамс»"
 hungary_army.1.b: "Отклонить запрос"

 hungary_army.2.t: "Закупка танков «Абрамс» одобрена"
 hungary_army.2.d: "Закупка 120 танков M1A2 «Абрамс» у [USA.GetNameDef] одобрена. Эти современные основные боевые танки значительно усилят возможности наших бронетанковых войск. Танки «Абрамс» оснащены современными системами брони, мощным вооружением и передовыми системами управления огнем, что даст значительное преимущество на поле боя. Эта покупка представляет собой важный шаг к модернизации вооруженных сил."
 hungary_army.2.a: "Наши бронетанковые силы стали по-настоящему грозными"

 hungary_army.3.t: "Закупка танков «Абрамс» отклонена"
 hungary_army.3.d: "Мы решили отказаться от предложения о покупке танков M1A2 «Абрамс» у [USA.GetNameDef]. Хотя эти современные танки значительно улучшили бы наши бронетанковые возможности, их стоимость и требования к обслуживанию оказались слишком обременительными для текущего военного бюджета. Мы продолжим искать другие варианты модернизации танковых войск."
 hungary_army.3.a: "Мы найдем другие решения"

 hungary_army.4.t: "Запрос Венгрии на закупку танков Т-72"
 hungary_army.4.d: "[HUN.GetNameDef] обратилась к нам с официальным запросом на закупку 120 основных боевых танков T-72 «Урал» за $5 миллиардов. Эти надежные танки советской разработки обеспечат Венгерские вооруженные силы проверенной техникой по разумной цене. T-72 «Урал» - проверенный временем танк с хорошей огневой мощью и подвижностью, проще в обслуживании по сравнению с более сложными западными системами. Эта продажа усилит наше военное влияние в Центральной Европе, сохранив хорошие отношения с западным соседом."
 hungary_army.4.a: "Одобрить продажу танков T-72"
 hungary_army.4.b: "Отказаться от продажи танков"

 hungary_army.5.t: "Закупка танков T-72 одобрена"
 hungary_army.5.d: "Закупка 120 танков T-72 «Урал» у [SOV.GetNameDef] одобрена. Эти надежные основные боевые танки предоставят нашим бронетанковым войскам проверенную технику, которая экономична в эксплуатации и обслуживании. Простая конструкция и надежная сборка T-72 «Урал» идеально подходят для нужд нашей армии, а приобретение значительно усилит возможности сухопутных войск."
 hungary_army.5.a: "Наши танковые войска стали сильнее"

 hungary_army.6.t: "Закупка танков T-72 отклонена"
 hungary_army.6.d: "Мы решили отказаться от предложения о покупке танков T-72 «Урал» у [SOV.GetNameDef]. Хотя эти танки обеспечили бы экономичное решение для модернизации бронетанковых войск, мы выбрали другие варианты, более соответствующие нашей военной стратегии и бюджетным ограничениям. Мы продолжим искать альтернативные пути укрепления танковых войск."
 hungary_army.6.a: "Мы рассмотрим другие варианты"

 hungary_army.7.t: "Решение проблемы МиГ-29"
 hungary_army.7.d: "Наша авиация сталкивается с критическим решением по парку истребителей МиГ-29. Эти советские самолеты, хотя и способны, становятся всё более устаревшими и дорогими в обслуживании. У нас есть несколько вариантов: модернизировать существующие самолеты и обучать пилотов, создать новую модификацию на основе текущей конструкции, или найти покупателя для самолетов, чтобы профинансировать приобретение современных истребителей. Каждый вариант имеет свои последствия для возможностей нашей авиации и бюджета."
 hungary_army.7.a: "Разобрать"
 hungary_army.7.b: "Ввести в эксплуатацию"
 hungary_army.7.c: "Найти покупателя для МиГ-29"

 hungary_army.8.t: "Закупка шведских самолетов Sk-60"
 hungary_army.8.d: "[SWE.GetNameDef] предложил продать 20 учебно-боевых самолетов Sk-60 [HUN.GetNameDef] за $5 миллиардов. Эти универсальные шведские самолеты могут выполнять несколько ролей: обучение пилотов, легкое нападение и разведка. Простая конструкция и надежность Sk-60 делают его отличным выбором для подготовки и легких боевых операций. Эта покупка повысит возможности подготовки пилотов и предоставит дополнительные воздушные средства."
 hungary_army.8.a: "Продано самолетов Sk-60"
 hungary_army.8.b: "Отказаться от покупки самолетов"

 hungary_army.9.t: "Закупка самолетов Sk-60 одобрена"
 hungary_army.9.d: "Закупка 20 самолетов Sk-60 у [SWE.GetNameDef] одобрена. Эти универсальные шведские самолеты значительно улучшат возможности подготовки нашей авиации и предоставят дополнительные средства для легких атак и разведки. Проверенная конструкция Sk-60 и его многофункциональность делают его отличным дополнением к нашей авиации, улучшая программы подготовки пилотов и оперативную гибкость."
 hungary_army.9.a: "Подготовка пилотов улучшится"

 hungary_army.10.t: "Закупка самолетов Sk-60 отклонена"
 hungary_army.10.d: "Мы решили отказаться от предложения о покупке самолетов Sk-60 у [SWE.GetNameDef]. Хотя эти самолеты обеспечили бы ценные возможности для обучения и легких атак, мы решили сосредоточить ресурсы на других приоритетах программы модернизации авиации. Мы продолжим искать альтернативные варианты для улучшения подготовки пилотов и возможностей легкой авиации."
 hungary_army.10.a: "Мы найдем другие решения для подготовки"

 hungary_army.11.t: "Продажа истребителей МиГ-29"
 hungary_army.11.d: "[HUN.GetNameDef] предложил продать 20 истребителей МиГ-29 «Фулькрам» [This.GetNameDef] за $5 миллиардов. Эти советские самолеты, хоть и устаревшие, остаются боеспособными и могут стать экономичным способом усилить возможности вашей авиации. МиГ-29 обладает хорошей маневренностью и огневой мощью, особенно полезен для ПВО и ударных операций по земле. Эта продажа позволит Венгрии профинансировать приобретение более современных самолетов, а вам получить дополнительные воздушные средства."
 hungary_army.11.a: "Продано самолеты МиГ-29"
 hungary_army.11.b: "Отказаться от продажи самолетов"

 hungary_army.12.t: "Продажа МиГ-29 одобрена"
 hungary_army.12.d: "[FROM.GetNameDef] согласился приобрести наши истребители МиГ-29 «Фулькрам». Эта продажа обеспечит нам ценные средства для инвестиций в более современные самолеты, одновременно предоставив покупателю способные боевые машины по разумной цене. Сделка укрепляет дипломатические отношения и демонстрирует нашу приверженность военному сотрудничеству. Вырученные средства помогут модернизировать нашу авиацию современными самолетами."
 hungary_army.12.a: "Это профинансирует модернизацию авиации"

 hungary_army.13.t: "Продажа МиГ-29 отклонена"
 hungary_army.13.d: "[FROM.GetNameDef] отказался от предложения купить истребители МиГ-29 «Фулькрам». Хотя это и разочаровывает, мы понимаем, что разные страны имеют свои военные приоритеты и бюджетные ограничения. Мы продолжим искать других потенциальных покупателей для парка МиГ-29 или рассматривать альтернативные варианты модернизации авиации. Наша приверженность улучшению военных возможностей остается неизменной."
 hungary_army.13.a: "Мы найдем другие решения"

 #Hungarian Foreign Policy Events
 hungary_foreign.1.t: "Вопрос членства в ЕС"
 hungary_foreign.1.d: "Вопрос членства в Европейском союзе стал ключевым в венгерской политике. Сторонники утверждают, что членство в ЕС принесет экономические выгоды, доступ к европейским рынкам и укрепит позиции Венгрии в Европе. Противники опасаются потери национального суверенитета и навязывания чужих ценностей. Дебаты разделили страну, и нам предстоит решить, какой путь выберет Венгрия."
 hungary_foreign.1.a: "Мы должны стремиться к членству в ЕС"
 hungary_foreign.1.b: "Мы должны оставаться независимыми от ЕС"

 hungary_foreign.2.t: "Возможность европейских инвестиций"
 hungary_foreign.2.d: "[This.GetNameDef] предложил инвестировать $5 миллиардов в экономику [HUN.GetNameDef]. Эта инвестиция поможет модернизировать инфраструктуру, создать рабочие места и стимулировать экономический рост. Европейский партнер обещает благоприятные условия и рассматривает это как возможность укрепить дипломатические и экономические связи между нашими странами. Это может стать значительным стимулом для нашей экономики."
 hungary_foreign.2.a: "Принять европейские инвестиции"
 hungary_foreign.2.b: "Отказаться от предложения инвестиций"

 hungary_foreign.3.t: "Европейская инвестиция принята"
 hungary_foreign.3.d: "[FROM.GetNameDef] согласился инвестировать в экономику [HUN.GetNameDef]. Европейский капитал поможет модернизировать нашу инфраструктуру, создать рабочие места и стимулировать экономический рост. Партнерство укрепляет дипломатические отношения с Европой и открывает новые возможности для сотрудничества и торговли."
 hungary_foreign.3.a: "Это принесет пользу нашей экономике"

 hungary_foreign.4.t: "Предложение китайских инвестиций"
 hungary_foreign.4.d: "[CHI.GetNameDef] обратился к [HUN.GetNameDef] с предложением крупной инвестиции на $15 миллиардов. Китайское предложение включает значительный капитал для развития инфраструктуры, передачи технологий и экономического сотрудничества. Эта инвестиция может кардинально модернизировать нашу экономику, но также усилит связи с Китаем и может повлиять на отношения с другими странами."
 hungary_foreign.4.a: "Принять китайские инвестиции"
 hungary_foreign.4.b: "Отказаться от китайских инвестиций"

 hungary_foreign.5.t: "Китайская инвестиция принята"
 hungary_foreign.5.d: "[CHI.GetNameDef] согласился инвестировать $15 миллиардов в экономику [HUN.GetNameDef]. Китайский капитал поможет модернизировать инфраструктуру, создать рабочие места и стимулировать экономический рост. Партнерство укрепляет дипломатические отношения с Китаем и открывает новые возможности для сотрудничества. Китайские компании создадут предприятия в Венгрии, привнеся технологии и опыт."
 hungary_foreign.5.a: "Это партнерство преобразит нашу экономику"

 hungary_foreign.6.t: "Китайская инвестиция отклонена"
 hungary_foreign.6.d: "[CHI.GetNameDef] отклонил нашу просьбу о китайских инвестициях. Хотя это и разочаровывает, мы понимаем, что у разных стран разные приоритеты инвестиций и стратегические соображения. Мы продолжим искать альтернативные источники финансирования и партнерства для модернизации и развития экономики."
 hungary_foreign.6.a: "Мы найдем другие возможности"

 hungary_foreign.7.t: "Покупка иранского военного оборудования"
 hungary_foreign.7.d: "[PER.GetNameDef] предложил продать военное оборудование [HUN.GetNameDef] за $10 миллиардов. В пакет входят пехотное снаряжение, баллистические ракеты, транспортные средства, зенитные системы и противотанковое оружие. Эта покупка значительно усилит наши военные возможности, хотя может повлиять на отношения с другими странами из-за международных санкций и политических факторов, связанных с Ираном."
 hungary_foreign.7.a: "Приобрести иранское оборудование"
 hungary_foreign.7.b: "Отказаться от покупки оборудования"

 hungary_foreign.8.t: "Покупка иранского оборудования одобрена"
 hungary_foreign.8.d: "Покупка военного оборудования у [PER.GetNameDef] была одобрена. Эта сделка значительно усилит наши военные возможности, обеспечив нас пехотным снаряжением, баллистическими ракетами, транспортными средствами, зенитными системами и противотанковым оружием. Сделка укрепляет дипломатические отношения с Ираном и демонстрирует нашу приверженность военному сотрудничеству, хотя может вызвать критику со стороны других стран."
 hungary_foreign.8.a: "Наши военные возможности улучшатся"

 hungary_foreign.9.t: "Покупка иранского оборудования отклонена"
 hungary_foreign.9.d: "Мы решили отказаться от предложения о покупке военного оборудования у [PER.GetNameDef]. Хотя это оборудование могло бы усилить наши военные возможности, мы сосредоточим ресурсы на других приоритетах и избегнем потенциальных дипломатических осложнений. Мы продолжим искать другие варианты модернизации наших вооруженных сил."
 hungary_foreign.9.a: "Мы найдем других поставщиков"

 hungary_foreign.10.t: "Вопрос членства в НАТО"
 hungary_foreign.10.d: "Вопрос членства в НАТО стал ключевым в венгерской внешней политике. Сторонники считают, что членство в НАТО гарантирует нашу безопасность, обеспечит доступ к передовым военным технологиям и укрепит наши позиции на международной арене. Противники опасаются вовлечения в иностранные конфликты и потери военной независимости. Дебаты разделили страну, и нам предстоит решить, какой путь выберет Венгрия."
 hungary_foreign.10.a: "Мы должны стремиться к членству в НАТО"
 hungary_foreign.10.b: "Мы должны оставаться независимыми от НАТО"

 hungary_foreign.11.t: "Совместные военные учения с Россией"
 hungary_foreign.11.d: "[SOV.GetNameDef] предложил провести совместные военные учения с [HUN.GetNameDef]. Эти учения включают совместную подготовку вооруженных сил, обмен военным опытом и проведение совместных операций. Такое сотрудничество повысит наши военные возможности, даст ценный опыт нашим войскам и укрепит дипломатические отношения с Россией. Однако это может повлиять на наши отношения с НАТО и западными странами."
 hungary_foreign.11.a: "Принять совместные учения"
 hungary_foreign.11.b: "Отказаться от учений"

 hungary_foreign.12.t: "Совместные учения с Россией одобрены"
 hungary_foreign.12.d: "Совместные военные учения с [SOV.GetNameDef] были одобрены. Наши вооруженные силы будут тренироваться вместе с российскими войсками, обмениваться военным опытом и проводить совместные операции. Такое сотрудничество улучшит наши военные возможности, даст ценный опыт войскам и укрепит дипломатические отношения с Россией. Учения повысят командные способности и военный опыт во всех родах войск."
 hungary_foreign.12.a: "Это повысит нашу боеготовность"

 hungary_foreign.13.t: "Совместные учения с Россией отклонены"
 hungary_foreign.13.d: "Мы решили отказаться от предложения провести совместные учения с [SOV.GetNameDef]. Хотя эти учения могли бы дать ценный военный опыт и повысить наши возможности, мы сосредоточимся на других приоритетах и сохраним текущие дипломатические отношения. Мы продолжим развивать армию другими способами."
 hungary_foreign.13.a: "Мы будем тренироваться самостоятельно"

 hungary_foreign.14.t: "Покупка немецких танков Leopard 2A4"
 hungary_foreign.14.d: "[GER.GetNameDef] предложил продать 120 основных боевых танков Leopard 2A4 [HUN.GetNameDef] за $5 миллиардов. Эти немецкие танки являются одними из самых современных в мире, обладая отличной огневой мощью, защитой и маневренностью. Leopard 2A4 значительно усилит наши бронетанковые войска и обеспечит нас современными и надежными танками. Эта покупка укрепит наши военные возможности и отношения с Германией."
 hungary_foreign.14.a: "Приобрести танки Leopard 2A4"
 hungary_foreign.14.b: "Отказаться от покупки танков"

 hungary_foreign.15.t: "Покупка танков Leopard 2A4 одобрена"
 hungary_foreign.15.d: "Покупка 120 основных боевых танков Leopard 2A4 у [GER.GetNameDef] была одобрена. Эти современные немецкие танки значительно усилят наши бронетанковые войска, предоставив нам надежные современные танки с отличной огневой мощью, защитой и маневренностью. Эта покупка укрепляет наши военные возможности и демонстрирует нашу приверженность модернизации вооруженных сил с использованием высококачественного оборудования."
 hungary_foreign.15.a: "Наши бронетанковые войска станут грозной силой"

 hungary_foreign.16.t: "Покупка танков Leopard 2A4 отклонена"
 hungary_foreign.16.d: "Мы решили отказаться от предложения о покупке танков Leopard 2A4 у [GER.GetNameDef]. Хотя эти танки значительно усилили бы наши бронетанковые войска, мы решили сосредоточить ресурсы на других приоритетах в рамках программы модернизации армии. Мы продолжим искать другие варианты для обновления наших танковых сил."
 hungary_foreign.16.a: "Мы найдем другие решения"

 hungary_foreign.17.t: "Военная помощь Украине"
 hungary_foreign.17.d: "[HUN.GetNameDef] предложил оказать военную помощь [UKR.GetNameDef], включая 250 единиц пехотного снаряжения. Эта помощь поможет Украине укрепить оборонные возможности и продемонстрирует нашу поддержку ее суверенитета. Предоставление военной помощи усилит дипломатические отношения с Украиной и повысит наше влияние в регионе, хотя может повлиять на отношения с другими странами."
 hungary_foreign.17.a: "Оказать военную помощь"
 hungary_foreign.17.b: "Отказаться от военной помощи"

 hungary_foreign.18.t: "Военная помощь Украине принята"
 hungary_foreign.18.d: "[UKR.GetNameDef] приняла наше предложение о военной помощи. Мы предоставим 250 единиц пехотного снаряжения, чтобы помочь укрепить оборонные возможности Украины. Эта помощь демонстрирует нашу поддержку украинского суверенитета и укрепляет дипломатические отношения с Украиной. Помощь повысит наше влияние в регионе и укрепит партнерство с Украиной."
 hungary_foreign.18.a: "Это укрепляет наше партнерство"

 hungary_foreign.19.t: "Военная помощь Украине отклонена"
 hungary_foreign.19.d: "[UKR.GetNameDef] отклонила наше предложение о военной помощи. Хотя это неприятно, мы понимаем, что у разных стран разные приоритеты в области безопасности и дипломатические соображения. Мы продолжим искать другие способы укрепления отношений с Украиной и поддержки региональной стабильности."
 hungary_foreign.19.a: "Мы найдем другие способы сотрудничества"

 hungary_foreign.20.t: "Приглашение вступить в антироссийскую коалицию"
 hungary_foreign.20.d: "[This.GetNameDef] пригласила [HUN.GetNameDef] присоединиться к антироссийской коалиции. Этот союз предполагает взаимные гарантии безопасности, пакты о ненападении, соглашения о военном доступе и координированное противодействие российскому влиянию. Вступление в коалицию значительно укрепит наши гарантии безопасности и объединит нас с другими странами, противостоящими российской экспансии, хотя это также может вовлечь нас в потенциальные конфликты и осложнить отношения с Россией."
 hungary_foreign.20.a: "Присоединиться к антироссийской коалиции"
 hungary_foreign.20.b: "Отказаться от приглашения"

 hungary_foreign.21.t: "Антироссийская коалиция присоединена"
 hungary_foreign.21.d: "[HUN.GetNameDef] согласилась присоединиться к антироссийской коалиции. Мы установили взаимные гарантии безопасности, пакты о ненападении и соглашения о военном доступе с [FROM.GetNameDef]. Этот союз значительно укрепляет наши гарантии безопасности и объединяет нас с другими странами, противостоящими российской экспансии. Мы теперь участвуем в координированных усилиях по противодействию российскому влиянию в регионе."
 hungary_foreign.21.a: "Мы едины против российской агрессии"

 hungary_foreign.22.t: "Пакт о безопасности с ОДКБ"
 hungary_foreign.22.d: "[This.GetNameDef], член Организации Договора о коллективной безопасности (ОДКБ), предложила заключить пакт о безопасности с [HUN.GetNameDef]. Это соглашение включает взаимные гарантии безопасности, пакты о ненападении и соглашения о военном доступе. Присоединение к пакту укрепит отношения с ОДКБ и Россией и их союзниками, хотя может повлиять на отношения с НАТО и западными странами."
 hungary_foreign.22.a: "Подписать пакт о безопасности с ОДКБ"
 hungary_foreign.22.b: "Отказаться от пакта о безопасности"

 hungary_foreign.23.t: "Пакт о безопасности с ОДКБ подписан"
 hungary_foreign.23.d: "[HUN.GetNameDef] подписала пакт о безопасности с [FROM.GetNameDef], членом ОДКБ. Мы установили взаимные гарантии безопасности, пакты о ненападении и соглашения о военном доступе. Этот пакт укрепляет наши отношения с ОДКБ и Россией и их союзниками, обеспечивая дополнительные гарантии безопасности и возможности военного сотрудничества."
 hungary_foreign.23.a: "Это укрепляет нашу безопасность"

 hungary_foreign.24.t: "Соглашение о сотрудничестве с Азербайджаном"
 hungary_foreign.24.d: "[AZE.GetNameDef] предложил заключить соглашение о сотрудничестве с [HUN.GetNameDef], включая улучшенное торговое соглашение и укрепление дипломатического партнерства. Это сотрудничество улучшит экономические отношения с Азербайджаном, откроет новые торговые возможности и укрепит дипломатические связи. Азербайджан является важным поставщиком энергии и региональным партнером, и это соглашение может принести значительные экономические выгоды."
 hungary_foreign.24.a: "Принять соглашение о сотрудничестве"
 hungary_foreign.24.b: "Отказаться от соглашения о сотрудничестве"

 hungary_foreign.25.t: "Соглашение о сотрудничестве с Азербайджаном принято"
 hungary_foreign.25.d: "[HUN.GetNameDef] приняла соглашение о сотрудничестве с [AZE.GetNameDef]. Мы заключили улучшенное торговое соглашение и укрепили дипломатическое партнерство. Это сотрудничество улучшает экономические отношения с Азербайджаном, открывает новые торговые возможности и укрепляет дипломатические связи. Азербайджан является важным поставщиком энергии и региональным партнером, и это соглашение принесет значительные экономические выгоды обеим странам."
 hungary_foreign.25.a: "Это партнерство принесет пользу обеим странам"

 hungary_foreign.26.t: "Соглашение о сотрудничестве с Азербайджаном отклонено"
 hungary_foreign.26.d: "[AZE.GetNameDef] отклонил наше предложение о сотрудничестве. Хотя это неприятно, мы понимаем, что у разных стран разные дипломатические приоритеты и стратегические соображения. Мы продолжим искать другие способы укрепления отношений с Азербайджаном и изучать возможности для экономического сотрудничества."
 hungary_foreign.26.a: "Мы найдем другие возможности для сотрудничества"

 hungary_foreign.27.t: "Совместные учения с Венгрией"
 hungary_foreign.27.d: "[HUN.GetNameDef] направила нам предложение о проведении совместных военных учений. Эти учения будут включать совместную подготовку наших вооружённых сил, обмен военным опытом и проведение совместных операций. Это сотрудничество усилит наши военные возможности и даст нашим войскам ценный опыт."
 hungary_foreign.27.a: "Принять предложение"
 hungary_foreign.27.b: "Отклонить предложение"

 hungary_foreign.28.t: "Совместные учения с США - Согласие"
 hungary_foreign.28.d: "[USA.GetNameDef] согласилась с нашим предложением о проведении совместных военных учений. Наши вооружённые силы будут тренироваться вместе с американскими войсками, обмениваясь военным опытом и проводя совместные операции. Это сотрудничество усилит наши военные возможности и укрепит наши дипломатические отношения."
 hungary_foreign.28.a: "Отлично"

 hungary_foreign.29.t: "Совместные учения с США - Отказ"
 hungary_foreign.29.d: "[USA.GetNameDef] отклонила наше предложение о проведении совместных военных учений. Хотя это и разочаровывает, мы понимаем, что у разных стран разные военные приоритеты. Мы продолжим искать другие возможности для военного сотрудничества."
 hungary_foreign.29.a: "Мы найдём другие возможности"

 hungary_foreign.30.t: "Инвестиции в Венгрию"
 hungary_foreign.30.d: "[HUN.GetNameDef] направила нам инвестиционное предложение на сумму $10 миллиардов. Эти инвестиции помогут модернизировать их инфраструктуру, создать рабочие места и стимулировать экономический рост. Венгерский партнёр обещает выгодные условия и рассматривает это как возможность укрепить дипломатические и экономические связи."
 hungary_foreign.30.a: "Принять инвестиции"
 hungary_foreign.30.b: "Отклонить инвестиции"

 hungary_foreign.31.t: "Американские инвестиции - Согласие"
 hungary_foreign.31.d: "[USA.GetNameDef] согласилась с нашим инвестиционным предложением. Американский капитал поможет модернизировать нашу инфраструктуру, создать рабочие места и стимулировать экономический рост. Это партнёрство укрепляет наши дипломатические отношения с Соединёнными Штатами."
 hungary_foreign.31.a: "Это принесёт пользу нашей экономике"

 hungary_foreign.32.t: "Американские инвестиции - Отказ"
 hungary_foreign.32.d: "[USA.GetNameDef] отклонила наше инвестиционное предложение. Хотя это и разочаровывает, мы понимаем, что у разных стран разные инвестиционные приоритеты и стратегические соображения. Мы продолжим искать альтернативные источники финансирования."
 hungary_foreign.32.a: "Мы найдём другие возможности"

 hungary_foreign.33.t: "Размещение американских частей в Венгрии"
 hungary_foreign.33.d: "[HUN.GetNameDef] направила нам предложение о размещении американских военных частей в Венгрии. Это предполагает развёртывание американских сил в Венгрии, создание совместных венгерско-американских военных бригад и установление постоянного американского военного присутствия."
 hungary_foreign.33.a: "Принять предложение"
 hungary_foreign.33.b: "Отклонить предложение"

 hungary_foreign.34.t: "Американские военные части - Согласие"
 hungary_foreign.34.d: "[USA.GetNameDef] согласилась с нашим предложением о размещении американских военных частей в Венгрии. Американские силы будут развёрнуты, создавая совместные венгерско-американские военные бригады и устанавливая постоянное американское военное присутствие. Это соглашение значительно укрепляет наши оборонные возможности."
 hungary_foreign.34.a: "Наши оборонные возможности усилены"

 hungary_foreign.35.t: "Американские военные части - Отказ"
 hungary_foreign.35.d: "[USA.GetNameDef] отклонила наше предложение о размещении американских военных частей в Венгрии. Хотя это соглашение могло бы усилить наши оборонные возможности, мы понимаем их решение. Мы продолжим искать другие способы укрепления нашего сотрудничества в области безопасности."
 hungary_foreign.35.a: "Мы найдём другие решения"

 hungary_foreign.36.t: "Закупка американских танков Abrams"
 hungary_foreign.36.d: "[HUN.GetNameDef] направила нам предложение о продаже 50 основных боевых танков M1 Abrams за $2,5 миллиарда. Наше оружие увеличит зависимость Венгрии от нас и усилит наше влияние в Европе."
 hungary_foreign.36.a: "Продать танки"
 hungary_foreign.36.b: "Отклонить покупку"

 hungary_foreign.37.t: "Американские танки Abrams - Согласие"
 hungary_foreign.37.d: "[USA.GetNameDef] согласилась с нашим предложением о закупке танков Abrams. Эти современные американские танки значительно усилят наши бронетанковые силы, обеспечив нас надёжными основными боевыми танками с отличной огневой мощью, защитой и мобильностью."
 hungary_foreign.37.a: "Наши бронетанковые силы станут грозной силой"

 hungary_foreign.38.t: "Американские танки Abrams - Отказ"
 hungary_foreign.38.d: "[USA.GetNameDef] отклонила наше предложение о закупке танков Abrams. Хотя эти танки значительно усилили бы наши бронетанковые силы, мы понимаем их решение. Мы продолжим искать другие варианты модернизации наших танковых сил."
