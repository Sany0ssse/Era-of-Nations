 hungary_foreign.73.d: "[MLV.GetNameDef] согласилась с нашим предложением о размещении венгерских миротворческих сил. Наши миротворцы были развёрнуты в Молдове, где они помогут поддерживать стабильность, поддержат усилия по разрешению конфликта и продемонстрируют нашу приверженность региональному миру и безопасности."
 hungary_foreign.73.a: "Это демонстрирует нашу приверженность миру"

 hungary_foreign.74.t: "Молдавские миротворцы - Отказ"
 hungary_foreign.74.d: "[MLV.GetNameDef] отклонила наше предложение о размещении венгерских миротворческих сил. Хотя это и разочаровывает, мы понимаем, что у разных стран разные приоритеты в сфере безопасности и стратегические соображения. Мы продолжим искать другие способы внести вклад в региональную стабильность."
 hungary_foreign.74.a: "Мы найдём другие способы помочь"

 hungary_foreign.75.t: "Предложение об экономическом сотрудничестве от Венгрии"
 hungary_foreign.75.d: "[HUN.GetNameDef] направила нам предложение об экономическом сотрудничестве, включая улучшение торговых отношений, расширение дипломатического сотрудничества и взаимную поддержку. Это сотрудничество улучшит наши экономические отношения и укрепит наши дипломатические связи."
 hungary_foreign.75.a: "Принять экономическое сотрудничество"
 hungary_foreign.75.b: "Отклонить экономическое сотрудничество"

 hungary_foreign.76.t: "Экономическое сотрудничество со странами СНГ - Согласие"
 hungary_foreign.76.d: "[FROM.GetNameDef] согласилась с нашим предложением об экономическом сотрудничестве. Мы укрепили наши дипломатические связи, улучшили торговые отношения и установили взаимную поддержку. Это сотрудничество улучшает наши экономические отношения и открывает новые возможности для партнёрства."
 hungary_foreign.76.a: "Это укрепляет наше партнёрство"

 hungary_foreign.77.t: "Экономическое сотрудничество со странами СНГ - Отказ"
 hungary_foreign.77.d: "[FROM.GetNameDef] отклонила наше предложение об экономическом сотрудничестве. Хотя это и разочаровывает, мы понимаем, что у разных стран разные дипломатические приоритеты и стратегические соображения. Мы продолжим искать другие способы укрепить наши отношения."
 hungary_foreign.77.a: "Мы найдём другие возможности для сотрудничества"

 hungary_foreign.78.t: "Предложение о торговом сотрудничестве от Венгрии"
 hungary_foreign.78.d: "[HUN.GetNameDef] направила нам предложение о торговом сотрудничестве, включая улучшение торговых отношений, расширение дипломатического сотрудничества и взаимную поддержку. Это сотрудничество улучшит наши экономические отношения и укрепит наши дипломатические связи."
 hungary_foreign.78.a: "Принять торговое сотрудничество"
 hungary_foreign.78.b: "Отклонить торговое сотрудничество"

 hungary_foreign.79.t: "Торговое сотрудничество с Беларусью - Согласие"
 hungary_foreign.79.d: "[BLR.GetNameDef] согласилась с нашим предложением о торговом сотрудничестве. Мы укрепили наши дипломатические связи, улучшили торговые отношения и установили взаимную поддержку. Это сотрудничество улучшает наши экономические отношения и открывает новые возможности для партнёрства."
 hungary_foreign.79.a: "Это укрепляет наше партнёрство"

 hungary_foreign.80.t: "Торговое сотрудничество с Беларусью - Отказ"
 hungary_foreign.80.d: "[BLR.GetNameDef] отклонила наше предложение о торговом сотрудничестве. Хотя это и разочаровывает, мы понимаем, что у разных стран разные дипломатические приоритеты и стратегические соображения. Мы продолжим искать другие способы укрепить отношения с Беларусью."
 hungary_foreign.80.a: "Мы найдём другие возможности для сотрудничества"

 hungary_foreign.81.t: "Предложение о военном оборудовании от Венгрии"
 hungary_foreign.81.d: "[HUN.GetNameDef] направила нам предложение о поставке военного оборудования, включая 250 единиц пехотного снаряжения, 10 противотанковых орудий, 10 зенитных комплексов и 10 вспомогательных машин. Это оборудование значительно усилит наши оборонные возможности и продемонстрирует поддержку Венгрией нашей безопасности."
 hungary_foreign.81.a: "Принять военное оборудование"
 hungary_foreign.81.b: "Отклонить военное оборудование"

 hungary_foreign.82.t: "Военное оборудование для Приднестровья - Согласие"
 hungary_foreign.82.d: "[PMR.GetNameDef] согласилась с нашим предложением о поставке военного оборудования. Мы поставили 250 единиц пехотного снаряжения, 10 противотанковых орудий, 10 зенитных комплексов и 10 вспомогательных машин. Эта помощь значительно усиливает их оборонные возможности и демонстрирует нашу поддержку их безопасности."
 hungary_foreign.82.a: "Это укрепляет их оборону"

 hungary_foreign.83.t: "Военное оборудование для Приднестровья - Отказ"
 hungary_foreign.83.d: "[PMR.GetNameDef] отклонила наше предложение о поставке военного оборудования. Хотя это и разочаровывает, мы понимаем, что у разных стран разные приоритеты в сфере безопасности и стратегические соображения. Мы продолжим искать другие способы поддерживать региональную стабильность."
 hungary_foreign.83.a: "Мы найдём другие способы помочь"

 hungary_foreign.84.t: "Предложение о военных учениях от Венгрии"
 hungary_foreign.84.d: "[HUN.GetNameDef] направила нам предложение о проведении совместных военных учений. Эти учения будут включать совместную подготовку наших вооружённых сил, обмен военным опытом и проведение совместных операций. Это сотрудничество усилит наши военные возможности, даст нашим войскам ценный опыт и укрепит наши дипломатические отношения."
 hungary_foreign.84.a: "Принять военные учения"
 hungary_foreign.84.b: "Отклонить военные учения"

 hungary_foreign.85.t: "Российские военные учения - Согласие"
 hungary_foreign.85.d: "[SOV.GetNameDef] согласилась с нашим предложением о проведении совместных военных учений. Наши вооружённые силы будут тренироваться вместе с российскими силами, обмениваясь военным опытом и проводя совместные операции. Это сотрудничество усилит наши военные возможности, даст нашим войскам ценный опыт и укрепит наши дипломатические отношения с Россией. Учения улучшат наши командные возможности и военный опыт."
 hungary_foreign.85.a: "Это повысит нашу боевую готовность"

 hungary_foreign.86.t: "Российские военные учения - Отказ"
 hungary_foreign.86.d: "[SOV.GetNameDef] отклонила наше предложение о проведении совместных военных учений. Хотя эти учения могли бы дать ценный военный опыт и повысить наши возможности, мы понимаем, что у разных стран разные стратегические приоритеты. Мы продолжим развивать нашу армию другими способами."
 hungary_foreign.86.a: "Мы будем тренироваться самостоятельно"

 #Orban Era Focuses
 HUN_orban_era: "Эпоха Орбана"
 HUN_orban_era_desc: "Взлет Виктора Орбана ознаменовывает новую главу в венгерской политике. Его руководство обещает принести стабильность, экономические реформы и обновленное чувство национальной гордости. Под его руководством мы будем проводить политику, которая ставит интересы Венгрии на первое место и укрепляет нашу позицию в регионе."
 HUN_continue_stabilization_program: "Продолжение программы стабилизации"
 HUN_continue_stabilization_program_desc: "Опираясь на предыдущие усилия по стабилизации, мы продолжим реализацию политики, направленной на восстановление экономической стабильности и доверия общества. Это включает соблюдение фискальной дисциплины, контроль над инфляцией и обеспечение того, чтобы экономическое восстановление оставалось на правильном пути."
 HUN_orbans_economic_policy: "Экономическая политика Орбана"
 HUN_orbans_economic_policy_desc: "Экономическое видение Виктора Орбана сосредоточено на создании конкурентоспособной, ориентированной на рынок экономики при сохранении социальной стабильности. Эта политика делает упор на создание рабочих мест, привлечение инвестиций и развитие венгерской промышленности для снижения зависимости от иностранного капитала."
 HUN_new_social_program: "Новая социальная программа"
 HUN_new_social_program_desc: "Мы внедрим комплексные социальные реформы, aimed at улучшения жизни венгерских семей. Программа включает расширение доступа к здравоохранению, улучшение образовательных возможностей и поддержку семей с детьми, обеспечивая, чтобы экономический рост приносил пользу всем гражданам."
 HUN_reduction_social_security_contributions: "Снижение взносов социального страхования"
 HUN_reduction_social_security_contributions_desc: "Для стимулирования экономического роста и снижения нагрузки на бизнес и работников мы снизим ставки социальных взносов. Эта мера увеличит доходы на руки работников и сделает венгерские компании более конкурентоспособными на международном уровне."
 HUN_restoration_of_parental_benefits: "Восстановление родительских льгот"
 HUN_restoration_of_parental_benefits_desc: "Мы восстановим и расширим программы родительских льгот в поддержку венгерских семей. Это включает выплаты по материнству и отцовству, поддержку дошкольного ухода и семейные пособия, способствующие росту населения и стабильности семей."
 HUN_maternity_benefits: "Материнские льготы"
 HUN_maternity_benefits_desc: "Расширение материнских льгот обеспечит важную поддержку венгерским матерям и семьям. Это включает продленное декретное отпуск, финансовую поддержку во время беременности и раннего детства, а также улучшенный доступ к медицинской помощи для матерей."
 HUN_reduction_of_government_spending: "Сокращение государственных расходов"
 HUN_reduction_of_government_spending_desc: "Для достижения фискальной стабильности и сокращения дефицита бюджета мы проведем целевые сокращения государственных расходов. Это включает оптимизацию бюрократии, ликвидацию неэффективных программ и концентрацию ресурсов на основных услугах и инфраструктуре."
 HUN_increase_access_to_education: "Расширение доступа к образованию"
 HUN_increase_access_to_education_desc: "Мы расширим образовательные возможности для всех венгров, увеличивая финансирование школ, улучшая подготовку учителей и обеспечивая доступ к качественному образованию независимо от экономического положения. Образование является основой будущего процветания страны."
 HUN_unemployment_relief_program: "Программа поддержки безработных"
 HUN_unemployment_relief_program_desc: "Для решения проблемы безработицы и поддержки ищущих работу мы внедрим комплексные программы помощи безработным. Это включает программы профессиональной подготовки, службы занятости и временную финансовую поддержку, чтобы помочь венграм вернуться на рынок труда."
 HUN_inflation_reduction_program: "Программа снижения инфляции"
 HUN_inflation_reduction_program_desc: "Мы проведем строгую денежно-кредитную политику и фискальные меры для борьбы с инфляцией и стабилизации цен. Это включает сотрудничество с центральным банком по контролю денежной массы, сокращение государственных заимствований и введение контроля цен на основные товары."
 HUN_lower_taxes: "Снижение налогов"
 HUN_lower_taxes_desc: "Снижение налоговой нагрузки на граждан и бизнес стимулирует экономический рост и инвестиции. Мы введем налоговые льготы для физических и юридических лиц, при этом сохраняя основные государственные услуги и обеспечивая фискальную ответственность."
 HUN_reduce_budget_deficit: "Сокращение дефицита бюджета"
 HUN_reduce_budget_deficit_desc: "Для достижения фискальной стабильности необходимо сократить дефицит бюджета с помощью сочетания сокращения расходов и увеличения доходов. Мы проведем ответственную фискальную политику, которая обеспечит баланс бюджета при сохранении основных государственных услуг."
 HUN_fighting_government_debt: "Борьба с государственным долгом"
 HUN_fighting_government_debt_desc: "Мы реализуем агрессивные меры по снижению государственного долга Венгрии. Это включает реструктуризацию долга, улучшение управления долгом и проведение политики, стимулирующей экономический рост для увеличения нашей способности обслуживать существующие обязательства."
 HUN_go_on_a_visit_to_kremlin: "Визит в Кремль"
 HUN_go_on_a_visit_to_kremlin_desc: "Укрепление отношений с Россией через дипломатическое взаимодействие и экономическое сотрудничество. Этот визит установит важные торговые связи, обеспечит поставки энергии и позиционирует Венгрию как мост между Востоком и Западом в европейских делах."
 HUN_greetings_to_beijing: "С приветом по Пекину!"
 HUN_greetings_to_beijing_desc: "Расширение дипломатических и экономических отношений с Китаем для выхода на новые рынки и привлечения инвестиций. Это партнерство принесет китайские инвестиции в Венгрию и откроет азиатские рынки для венгерских товаров и услуг."
 HUN_take_power: "Взять власть в свои руки"
 HUN_take_power_desc: "Консолидация политической власти для обеспечения эффективного управления и реализации нашей программы реформ. Это включает укрепление исполнительной власти, оптимизацию процессов принятия решений и обеспечение возможности реализовать наши политики без препятствий."
 HUN_new_constitution: "Новая конституция Венгрии"
 HUN_new_constitution_desc: "Мы разработаем и внедрим новую конституцию, отражающую венгерские ценности и обеспечивающую эффективное управление. Эта конституция защитит права личности и создаст прочную основу для экономического развития и национального суверенитета."
 HUN_reduction_of_seats_in_parliament: "Сокращение количества мест в парламенте"
 HUN_reduction_of_seats_in_parliament_desc: "Оптимизация парламента путем сокращения числа представителей для повышения эффективности и снижения расходов. Эта реформа сделает законодательный процесс более продуктивным при сохранении демократического представительства."
 HUN_pragmatic_government: "Прагматичное правительство"
 HUN_pragmatic_government_desc: "Реализация прагматичного подхода к управлению, при котором приоритет отдается результатам, а не идеологии. Это включает принятие решений на основе практических соображений, фокус на политиках, приносящих ощутимую пользу, и обеспечение эффективного администрирования."
 HUN_castling_in_the_ranks_of_elite: "Кастлинг в рядах элиты"
 HUN_castling_in_the_ranks_of_elite_desc: "Реформа элиты путем продвижения на основе заслуг и снижения коррупции. Это включает прозрачные процессы отбора, обеспечение назначения квалифицированных лиц и создание возможностей для талантливых венгров продвигаться по служебной лестнице."
 HUN_introduce_a_flat_tax: "Введение плоского налога"
 HUN_introduce_a_flat_tax_desc: "Внедрение системы плоского налога для упрощения налогового кодекса и стимулирования экономической активности. Эта единая ставка снизит сложность, устранит лазейки и создаст стимулы для инвестиций и предпринимательства."
 HUN_transparency_of_social_security_system: "Прозрачность системы социального страхования"
 HUN_transparency_of_social_security_system_desc: "Реформа системы социального страхования для обеспечения прозрачности и эффективности. Это включает четкие требования к отчетности, устранение растрат и мошенничества, а также гарантирование того, что льготы достигают тех, кто в них нуждается."
 HUN_support_hungarian_nationalism: "Поддержка венгерского национализма"
 HUN_support_hungarian_nationalism_desc: "Содействие венгерской национальной идентичности и культурным ценностям в обществе. Это включает поддержку венгерского языка и культуры, празднование национальных традиций и обеспечение того, чтобы интересы Венгрии были приоритетными во всех политических решениях."
 HUN_central_bank_reforms: "Реформы центрального банка"
 HUN_central_bank_reforms_desc: "Реализация реформ для укрепления независимости и эффективности центрального банка. Это включает улучшение инструментов денежно-кредитной политики, усиление контроля за финансовой стабильностью и обеспечение способности банка эффективно управлять инфляцией и экономическим ростом."
 HUN_preservation_of_christian_foundations: "Сохранение христианских основ"
 HUN_preservation_of_christian_foundations_desc: "Защита и продвижение христианского наследия и ценностей Венгрии. Это включает поддержку христианских институтов, обеспечение религиозной свободы и внедрение христианских принципов в государственную политику при уважении прав всех граждан."
 HUN_raise_retirement_age_in_army_and_police: "Повышение пенсионного возраста в армии и полиции"
 HUN_raise_retirement_age_in_army_and_police_desc: "Продление пенсионного возраста для военных и полицейских для обеспечения преемственности службы и снижения расходов на пенсии. Эта реформа сохранит опытных сотрудников на ключевых должностях безопасности и улучшит устойчивость пенсионной системы."
 HUN_christian_illiberalism: "Христианский иллиберализм"
 HUN_christian_illiberalism_desc: "Внедрение политики, приоритет которой - христианские ценности и традиционная венгерская культура, а не либеральный интернационализм. Этот подход делает акцент на национальном суверенитете, традиционных семейных ценностях и противодействии иностранным культурным влияниям, угрожающим венгерской идентичности."
 HUN_hungarian_serbian_barrier: "Венгерско-сербский барьер"
 HUN_hungarian_serbian_barrier_desc: "Строительство физических барьеров и введение контроля на границе для управления миграцией и поддержания безопасности на венгерско-сербской границе. Эта мера защитит венгерскую территорию и обеспечит, чтобы миграция происходила только через легальные каналы."
 HUN_dealing_with_migration_transit_zones: "Регулирование миграционных транзитных зон"
 HUN_dealing_with_migration_transit_zones_desc: "Создание контролируемых транзитных зон для управления потоками мигрантов и эффективной обработки заявлений на убежище. Эта система обеспечит упорядоченное управление миграцией при защите суверенитета и безопасности Венгрии."
 HUN_internet_tax: "Налог на интернет"
 HUN_internet_tax_desc: "Введение налога на использование интернета для пополнения бюджета и регулирования онлайн-активности. Эта мера поможет финансировать государственные услуги и обеспечит вклад интернет-деятельности в национальную экономику."
 HUN_crush_the_opposition: "Разгромить оппозицию"
 HUN_crush_the_opposition_desc: "Внедрение мер по ограничению деятельности оппозиции и обеспечению политической стабильности. Это включает ограничения для оппозиционных СМИ, ограничение протестной активности и обеспечение того, чтобы политический дискурс оставался в допустимых рамках."
 HUN_take_control_of_media: "Контроль над СМИ"
 HUN_take_control_of_media_desc: "Консолидация контроля над средствами массовой информации для обеспечения того, чтобы распространение информации служило национальным интересам. Это включает приобретение медиа-компаний, регулирование контента и обеспечение того, чтобы новостное освещение поддерживало политику правительства."
 HUN_find_loopholes_in_the_term_limitation_law: "Поиск лазеек в законе о сроках"
 HUN_find_loopholes_in_the_term_limitation_law_desc: "Выявление и использование правовых механизмов для продления политических сроков и обеспечения преемственности руководства. Это включает конституционные поправки, юридические толкования и процедурные изменения, позволяющие продлить управление."
 HUN_member_of_ec: "Гордый член Европейского сообщества"
 HUN_member_of_ec_desc: "Укрепление позиции Венгрии в Европейском сообществе через активное участие и сотрудничество. Это включает поддержку европейской интеграции, вклад в общие политики и обеспечение представительства венгерских интересов в европейском процессе принятия решений."
 HUN_cabinet_of_reformers: "Кабинет реформаторов"
 HUN_cabinet_of_reformers_desc: "Назначение кабинета, состоящего из реформаторски настроенных лиц, стремящихся модернизировать Венгрию. Это включает отбор министров по профессионализму и приверженности реформам, обеспечение эффективного и результативного исполнения государственной политики."
 HUN_improving_privatization_mechanism: "Совершенствование механизма приватизации"
 HUN_improving_privatization_mechanism_desc: "Реформа процесса приватизации для обеспечения прозрачности, эффективности и справедливых результатов. Это включает внедрение конкурентных процедур отбора, правильную оценку активов и максимизацию доходов для венгерского народа."
 HUN_budget_deficit_elimination_program: "Программа ликвидации бюджетного дефицита"
 HUN_budget_deficit_elimination_program_desc: "Внедрение комплексных мер по устранению бюджетного дефицита и достижению фискального баланса. Это включает сокращение расходов, увеличение доходов и структурные реформы, обеспечивающие долгосрочную финансовую устойчивость."
 HUN_people_constitution: "Народная конституция"
 HUN_people_constitution_desc: "Разработка новой конституции, которая действительно отражает волю и ценности венгерского народа. Эта конституция защитит права личности, обеспечит демократическое управление и создаст основу для процветания и национального единства."
 HUN_christian_view_of_market: "Христианский взгляд на рынок"
 HUN_christian_view_of_market_desc: "Реализация экономической политики, отражающей христианские ценности справедливости, ответственности и общинности. Это включает поддержку этичного ведения бизнеса, обеспечение справедливой оплаты труда и продвижение экономических мер, выгодных для всех членов общества."
 HUN_expand_representation_german_minority: "Расширение представительства немецкого меньшинства"
 HUN_expand_representation_german_minority_desc: "Увеличение политического представительства и культурных прав немецкого меньшинства Венгрии. Это включает представительство меньшинства в органах власти, поддержку немецких культурных институтов и защиту прав меньшинств."
 HUN_lower_retirement_age: "Снижение пенсионного возраста"
 HUN_lower_retirement_age_desc: "Снижение пенсионного возраста для того, чтобы венгры могли наслаждаться своей старостью и создать возможности для молодых работников. Эта политика улучшит качество жизни пожилых и откроет рабочие места для следующего поколения."
 HUN_society_of_christian_ethics: "Общество христианской этики"
 HUN_society_of_christian_ethics_desc: "Продвижение христианских этических ценностей во всем венгерском обществе. Это включает поддержку христианского образования, поощрение этичных бизнес-практик и обеспечение того, чтобы государственная политика отражала христианские принципы справедливости и милосердия."
 HUN_strategic_digitalization_plan: "Стратегический план цифровизации"
 HUN_strategic_digitalization_plan_desc: "Реализация комплексного плана модернизации Венгрии с помощью цифровых технологий. Это включает расширение доступа к интернету, цифровизацию государственных услуг и обеспечение конкурентоспособности Венгрии в цифровой экономике."
 HUN_german_industrialist: "Немецкий промышленник"
 HUN_german_industrialist_desc: "Привлечение немецких промышленных инвестиций в Венгрию для создания рабочих мест и передачи технологий. Это партнерство принесет передовые производственные возможности, создаст рабочие места и укрепит экономические связи с Германией."
 HUN_and_hungarian_farmer: "И венгерский фермер"
 HUN_and_hungarian_farmer_desc: "Поддержка венгерского сельского хозяйства и сельских общин для обеспечения продовольственной безопасности и процветания сельских районов. Это включает сельскохозяйственные субсидии, программы развития сельской местности и политику поддержки традиционного фермерства."
 HUN_jesus_loves_everyone: "Иисус любит всех"
 HUN_jesus_loves_everyone_desc: "Продвижение христианских ценностей любви, сострадания и инклюзивности во всем венгерском обществе. Это включает поддержку благотворительных организаций, продвижение социальной справедливости и обеспечение того, чтобы христианские принципы направляли подход к социальным вопросам."
 HUN_true_christian_democracy: "Истинная христианская демократия"
 HUN_true_christian_democracy_desc: "Создание политической системы, которая сочетает демократическое управление с христианскими ценностями и принципами. Это включает обеспечение того, чтобы государственная политика отражала христианскую этику, защиту религиозной свободы и создание общества, основанного на христианских моральных принципах."
 HUN_castling_in_the_elite: "Кастеллинг в рядах элиты"

 #Orban's events
 hungary_orban.1.t: "Сократить бюджетный дефицит"
 hungary_orban.1.d: "Бюджет нашей страны давно страдает от ненужных расходов, которые съедают наши казну и доходы. Мы должны решить эту проблему и, расставив приоритеты, понять, какие государственные расходы следует сократить ради пользы бюджета."
 hungary_orban.1.a: "Против кого нам вообще нужно защищаться? Военные расходы бессмысленны."
 hungary_orban.1.b: "Людям нужна большая свобода, давайте сократим финансирование полиции."
 hungary_orban.1.c: "Мы тратим слишком много денег на бюрократию, это нужно исправить."

 hungary_orban.2.t: "Виктор Орбан прибывает в Москву"
 hungary_orban.2.d: "Сегодня президент Венгрии Виктор Орбан прибыл в Кремль с дипломатическим визитом. Он привёз с собой стопку документов, подписание которых укрепит наши связи с Будапештом. Венгерский лидер давно выражает уважение к нашей стране и нашей культуре, и мы видим усилия Венгрии по установлению более тесных дипломатических связей с нашей страной."
 hungary_orban.2.a: "Бог знает, мы будем хорошими партнёрами."
 hungary_orban.2.b: "Мы ценим их наивность."

 hungary_orban.3.t: "Виктор Орбан принят в Москве"
 hungary_orban.3.d: "Сегодня Виктор Орбан встретился с президентом России в Кремле. Лидеры обсудили различные актуальные вопросы и кризисы, подписав несколько важных документов и соглашений, включая соглашение о стратегическом партнёрстве. Кто знает, куда нас приведёт это сближение с Москвой, но пока всё, что мы видим, - это светлое и процветающее будущее, под знаменами России и Венгрии."
 hungary_orban.3.a: "Слава Венгрии, да здравствует Россия!"

 hungary_orban.4.t: "Виктор Орбан прибывает в Пекин"
 hungary_orban.4.d: "Сегодня президент Венгрии Виктор Орбан прибыл в Пекин с дипломатическим визитом. Он привёз с собой стопку документов, подписание которых укрепит наши связи с Будапештом. Венгерский лидер давно выражает уважение к нашей стране и нашей культуре, и мы видим усилия Венгрии по установлению более тесных дипломатических связей с нашей страной."
 hungary_orban.4.a: "Бог знает, мы будем хорошими партнёрами."
 hungary_orban.4.b: "Мы ценим их наивность."

 hungary_orban.5.t: "Виктор Орбан принят в Пекине"
 hungary_orban.5.d: "Сегодня Виктор Орбан встретился с президентом Китая в Пекине. Лидеры обсудили различные актуальные вопросы и кризисы, подписав несколько важных документов и соглашений, включая соглашение о стратегическом партнёрстве. Кто знает, куда нас приведёт это сближение, но пока мы видим только светлое и процветающее будущее!"
 hungary_orban.5.a: "Слава Венгрии, да здравствует Китай!"

 hungary_orban.6.t: "Люди выходят на массовые протесты"
 hungary_orban.6.d: "Новая конституция встретила сопротивление не только со стороны оппозиционных партий, но и со стороны общественности. Критики утверждали, что она укрепляет власть правящей партии.\nЛюди выходят на улицы массово, скандируя за отставку нынешнего Президента Республики Виктора Орбана. Толпа утверждает, что Орбан ведёт страну к авторитарному обществу, где чиновники снова будут править простыми людьми."
 hungary_orban.6.a: "Скоординируйте действия полиции, разгоните протестующих!"
 hungary_orban.6.b: "Они успокоятся сами, люди способны на это."

 hungary_orban.7.t: "Венгрия охвачена протестами"
 hungary_orban.7.d: "Правительство Виктора Орбана ввело новые поправки к конституции, которые фактически представляют собой полный пересмотр конституции, не изменявшейся с 1949 года. Кроме того, новая конституция подверглась критике за авторитарную риторику.\nНовая конституция встретила сопротивление не только со стороны оппозиционных партий, но и со стороны общественности. Критики утверждали, что она укрепляет власть правящей партии.\nЛюди выходят на улицы массово, скандируя за отставку нынешнего Президента Республики Виктора Орбана. Толпа утверждает, что Орбан ведёт страну к авторитарному обществу, где чиновники снова будут править простыми людьми."
 hungary_orban.7.a: "Продолжим следить за ситуацией."

 hungary_orban.8.t: "Венгрия закрывает границы с нами"
 hungary_orban.8.d: "Венгрия давно отправляет жалобы нашей администрации относительно неконтролируемой миграции сербов через их границу.\nСербы пересекали открытую границу с Венгрией, чтобы попасть в Шенгенскую зону и легко отправиться в Польшу, Германию или Францию в поисках лучшей жизни, превращая Венгрию в транзитную площадку.\nВенгерское правительство заявило, что устало терпеть бесконечную ротацию сербских мигрантов и вводит строгий контроль миграции на нашей границе."
 hungary_orban.8.a: "Это можно понять."

