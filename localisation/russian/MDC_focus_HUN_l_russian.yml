 HUN_orbanism_desc: "\n\n\n\n£GFX_BANNER_hun_orbanism\n\n\n\n\n\nЗа годы своего долгого пребывания у власти Виктор Орбан построил в Венгерской Республике крепкий авторитарный режим и буквально создал новую идеологию, основанную на Восточной автократии - Орбанизм."

