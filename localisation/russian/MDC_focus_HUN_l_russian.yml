 HUN_MILLENNIUM_DAWN_DESC: "В конце 1999 года Венгрия находилась в периоде консолидации. Хаотичные и преобразовательные ранние 1990-е годы, которые привели к выводу советских войск и установлению многопартийной демократии, уступили место более стабильной, хотя всё ещё крайне конкурентной политической системе. Правительство представляла коалиция во главе с правоцентристской партией Фидес - Венгерский гражданский альянс, под руководством молодого и динамичного премьер-министра Виктора Орбана, вступившего в должность в 1998 году. Его правительство проводило политику национального обновления и «возвращения в Европу». Наиболее значительным достижением этого периода, которое наполняло страну огромной гордостью, стало вступление Венгрии в НАТО 12 марта 1999 года. Это был грандиозный геополитический сдвиг, гарантировавший безопасность страны и необратимо сблизивший её с Западом."

 #Great Hungary Decison
 HUN_paris_treaty_null: "Аннулировать Парижский Мирный Договор"
 HUN_requiem_for_the_great: "Реквием по Великой"
 HUN_requiem_for_the_great_desc: "Сердце Венгрии бьётся в унисон с прошлым, и мы верим в будущее, где границы вновь обретут своё истинное значение.\nМы, венгры, носим в себе память о времени, когда наше королевство простиралось от Карпат до Адриатического моря. Это не просто страницы истории; это живая часть нашей души, эхо славного прошлого, которое мы никогда не забудем. Великая Венгрия - это не просто мечта; это наша историческая истина, наше право, которое мы храним в сердцах поколений.\nМы помним земли, где говорили по-венгерски, где процветали наши традиции, где наши предки строили и защищали свою родину. Эти земли - не просто территории на карте; это части нашего национального тела, которые были оторваны, но не забыты.\nЭти территориальные притязания не являются агрессией; это призыв к справедливости, желание восстановить историческую правду. Мы не желаем никому зла; мы просто хотим вернуть то, что по праву наше, по рождению и по историческому праву. Мы знаем, что путь к восстановлению Великой Венгрии будет долгим и трудным. Мир изменился, границы были перекроены, но дух венгерского народа остаётся непоколебимым. Мы будем трудиться, учиться, сохранять нашу культуру и язык, чтобы быть готовыми, когда придёт время.\nИ мы верим, что это время придёт. И тогда, с гордостью и радостью, мы вновь провозгласим Великую Венгрию - единую, сильную и процветающую, как в прежние времена. Это наша надежда, наша вера и наше обещание будущим поколениям."
 HUN_proclaim_great_hungary: "Провозгласить §5Великую Венгрию§!"
