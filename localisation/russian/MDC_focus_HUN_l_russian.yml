 #Communist Party Focuses
 HUN_magyar_munkaspart: "Magyar Munkáspárt"
 HUN_magyar_munkaspart_desc: "Венгерская рабочая партия представляет истинный голос пролетариата. Установив эту партию как авангард революции, мы консолидируем коммунистическую власть и направим Венгрию к социалистическому будущему."
 HUN_withdrawal_from_western_organizations: "Выход из Западных Организаций"
 HUN_withdrawal_from_western_organizations_desc: "Освобождение от оков западного империализма означает выход из НАТО и Европейского союза. Мы должны проложить свой собственный путь, независимый от капиталистических институтов, стремящихся эксплуатировать наш народ."
 HUN_reorganization_of_economy: "Реорганизация Экономики"
 HUN_reorganization_of_economy_desc: "Капиталистическая система подвела рабочий класс. Мы должны перестроить нашу экономику, чтобы она служила народу, а не буржуазии. Это первый шаг к экономической справедливости."
 HUN_transition_to_a_planned_economy: "Переход к Плановой Экономике"
 HUN_transition_to_a_planned_economy_desc: "Плановая экономика обеспечит, чтобы производство служило потребностям народа, а не прибыли капиталистов. Центральное планирование устранит расточительство и эксплуатацию, создавая более справедливое общество для всех."
 HUN_anti_migration_company: "Антимиграционная Кампания"
 HUN_anti_migration_company_desc: "Мы должны защитить наше социалистическое общество от влияния капиталистических беженцев и сохранить чистоту наших революционных идеалов. Наши границы должны быть защищены от иностранного вмешательства."
 HUN_job_creation: "Создание Рабочих Мест"
 HUN_job_creation_desc: "При социализме безработица неприемлема. Мы создадим рабочие места для всех трудящихся, гарантируя, что каждый гражданин сможет внести свой вклад в строительство нашего социалистического общества и получать справедливую компенсацию за свой труд."
 HUN_create_communist_trade_unions: "Создание Коммунистических Профсоюзов"
 HUN_create_communist_trade_unions_desc: "Истинные профсоюзы должны быть организованы под руководством партии для защиты прав рабочих и продвижения социалистических целей. Эти союзы станут опорой нашего рабочего государства."
 HUN_combating_class_inequality: "Борьба с Классовым Неравенством"
 HUN_combating_class_inequality_desc: "Классовая борьба лежит в основе нашей революции. Мы должны устранить остатки буржуазных привилегий и обеспечить равенство всех граждан при социализме."
 HUN_withdraw_foreign_capital: "Вывод Иностранного Капитала"
 HUN_withdraw_foreign_capital_desc: "Иностранные капиталисты эксплуатируют наших рабочих и истощают наши ресурсы. Мы должны изгнать иностранный капитал и вернуть контроль над нашей экономикой венгерскому народу."
 HUN_purges_among_officials: "Чистки Среди Чиновников"
 HUN_purges_among_officials_desc: "Контрреволюционные элементы проникли в нашу бюрократию. Мы должны очистить нелояльных чиновников и гарантировать, что только истинные коммунисты занимают руководящие должности."
 HUN_nationalization_of_industry: "Национализация Промышленности"
 HUN_nationalization_of_industry_desc: "Средства производства должны принадлежать народу, а не частным капиталистам. Национализируя промышленность, мы гарантируем, что плоды труда приносят пользу всем трудящимся, а не только богатому меньшинству."
 HUN_increase_production: "Увеличение Производства"
 HUN_increase_production_desc: "При социалистической собственности мы можем максимизировать промышленный выпуск на благо всех. Увеличивая производство, мы обеспечиваем, чтобы наша плановая экономика удовлетворяла потребности народа."
 HUN_hungarian_autarky: "Венгерская Автаркия"
 HUN_hungarian_autarky_desc: "Экономическая независимость необходима для истинного социалистического государства. Достигнув автаркии, мы освобождаемся от зависимости от капиталистических рынков и обеспечиваем наш экономический суверенитет."
 HUN_eradicate_corruption: "Искоренение Коррупции"
 HUN_eradicate_corruption_desc: "Коррупция - это болезнь капиталистической системы. При социализме мы искореним все формы коррупции и обеспечим, чтобы государственные чиновники служили народу с честностью и преданностью."
 HUN_nationalization_of_resources: "Национализация Ресурсов"
 HUN_nationalization_of_resources_desc: "Природные ресурсы принадлежат народу, а не частным корпорациям. Национализируя наши ресурсы, мы гарантируем, что богатство нашей земли приносит пользу всем гражданам, а не только иностранным инвесторам."
 HUN_true_socialism: "Истинный Социализм"
 HUN_true_socialism_desc: "Мы заложили основы истинно социалистического общества. С национализированной промышленностью и ресурсами, искоренённой коррупцией и организованными рабочими, Венгрия стоит как маяк социалистического прогресса в Центральной Европе."
 HUN_proclaim_hpr: "Провозгласить Венгерскую Народную Республику"
 HUN_proclaim_hpr_desc: "Завершив социалистическую трансформацию нашего государства, мы можем официально провозгласить Венгерскую Народную Республику. Этот акт станет сигналом миру, что Венгрия полностью приняла коммунизм и готова вести рабочих Центральной Европы."
 HUN_communist_takeover_in_central_europe: "Коммунистический Захват в Центральной Европе"
 HUN_communist_takeover_in_central_europe_desc: "Революция должна распространяться! Мы будем поддерживать коммунистические движения по всей Центральной Европе, помогая нашим товарищам свергать капиталистические режимы и создавать рабочие государства по всему региону."
 HUN_get_chinese_guarantees: "Получить Китайские Гарантии"
 HUN_get_chinese_guarantees_desc: "Китайская Народная Республика - наш естественный союзник в борьбе против империализма. Получение китайских гарантий обеспечит нам экономическую поддержку и дипломатическую защиту от западной агрессии."
 HUN_strengthen_relations_in_middle_east_socialists: "Укрепить Отношения с Социалистами Ближнего Востока"
 HUN_strengthen_relations_in_middle_east_socialists_desc: "Наши социалистические братья на Ближнем Востоке разделяют наши революционные цели. Укрепляя отношения с социалистическими государствами региона, мы расширяем международное социалистическое движение и получаем ценных союзников."
 HUN_mutual_defense_treaty_with_russia: "Договор о Взаимной Обороне с Россией"
 HUN_mutual_defense_treaty_with_russia_desc: "Россия остаётся ключевым партнёром в нашей борьбе против западного империализма. Договор о взаимной обороне обеспечит нашу безопасность и укрепит социалистический блок в Восточной Европе."
 HUN_central_european_socialist_union: "Центрально-Европейский Социалистический Союз"
 HUN_central_european_socialist_union_desc: "Объединяя социалистические государства Центральной Европы, мы создаём мощный блок, способный противостоять западному империализму и продвигать дело социализма во всём регионе."
 HUN_union_with_serbia: "Союз с Сербией"
 HUN_union_with_serbia_desc: "Наши социалистические братья в Сербии разделяют наши революционные цели. Союз между нашими двумя народами укрепит социализм на Балканах и создаст мощную социалистическую федерацию."
 HUN_union_with_slovakia: "Союз с Словакией"
 HUN_union_with_slovakia_desc: "Словацкий народ - наши братья, и при социализме мы наконец можем объединиться. Союз со Словакией восстановит исторические связи и создаст более сильное социалистическое государство в Центральной Европе."
 HUN_promote_communist_ideas_in_balkans: "Продвижение Коммунистических Идей на Балканах"
 HUN_promote_communist_ideas_in_balkans_desc: "Балканы должны быть освобождены от капиталистического влияния. Мы будем распространять коммунистическую идеологию по всему региону, поддерживая революционные движения и помогая нашим товарищам создавать рабочие государства."
 HUN_question_of_resurrection_of_sss: "Вопрос о Восстановлении AVH"
 HUN_question_of_resurrection_of_sss_desc: "Государственная служба безопасности (ÁVH) была важна для защиты нашего социалистического государства от контрреволюционных элементов. Мы должны рассмотреть вопрос о восстановлении этого института для защиты нашей революции."
 HUN_cut_defense_spending: "Сокращение Оборонных Расходов"
 HUN_cut_defense_spending_desc: "При социализме мы можем перенаправить военные расходы на социальные программы. Сокращая оборонные расходы, мы можем больше инвестировать в образование, здравоохранение и благосостояние нашего народа."
 HUN_purchase_russian_weapons: "Закупка Российского Оружия"
 HUN_purchase_russian_weapons_desc: "Российское военное оборудование надёжно и экономически эффективно. Закупая российское оружие, мы модернизируем наши вооружённые силы, сохраняя союз с Москвой и снижая зависимость от западных поставщиков."
 HUN_iron_curtain: "Железный Занавес"
 HUN_iron_curtain_desc: "Мы должны запечатать наши границы от капиталистического влияния. Устанавливая строгий пограничный контроль и ограничивая контакты с Западом, мы защищаем наше социалистическое общество от идеологического заражения."
 HUN_media_under_state_control: "СМИ под Государственным Контролем"
 HUN_media_under_state_control_desc: "СМИ должны служить народу, а не капиталистическим интересам. Передавая все СМИ под государственный контроль, мы гарантируем, что информация служит социалистическим целям и предотвращает буржуазную пропаганду, развращающую наше общество."
 HUN_strengthen_the_police: "Укрепление Полиции"
 HUN_strengthen_the_police_desc: "Сильная полиция необходима для поддержания порядка и защиты нашего социалистического государства от контрреволюционных элементов. Мы расширим и модернизируем наши правоохранительные органы, чтобы обеспечить безопасность нашей революции."
 HUN_propaganda_of_communist_ideals: "Пропаганда Коммунистических Идеалов"
 HUN_propaganda_of_communist_ideals_desc: "Массы должны быть обучены принципам марксизма-ленинизма. С помощью комплексных пропагандистских кампаний мы обеспечим, чтобы все граждане понимали и поддерживали наше социалистическое дело."
 HUN_support_for_free_education: "Поддержка Бесплатного Образования"
 HUN_support_for_free_education_desc: "Образование - это право, а не привилегия. При социализме все граждане должны иметь доступ к бесплатному, качественному образованию, которое служит потребностям народа и продвигает социалистические ценности."
 HUN_welfare_state: "Государство Всеобщего Благосостояния"
 HUN_welfare_state_desc: "Истинное социалистическое государство обеспечивает всех своих граждан. Создавая комплексные программы благосостояния, мы гарантируем, что каждый рабочий имеет доступ к здравоохранению, жилью и социальному обеспечению, независимо от его экономического положения."

 #Commi Ideas
 HUN_economy_reorg: "Реорганизация экономики"
 HUN_plan_economy: "Плановая экономика"
