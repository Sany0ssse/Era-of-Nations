 #Millitary
 HUN_army: "Magyar Honvédség"
 HUN_army_desc: "Honvédség всё ещё носит шрамы 1990-х. Запуск комплексной программы готовности проверит оборудование, возобновит циклы обучения и напомнит каждой бригаде о её миссии."
 HUN_2001_modern: "2001 модернизация"
 HUN_2001_modern_desc: "Первый транш средств на модернизацию заменит устаревшие радиостанции, обновит склады и начнёт выводить реликты Варшавского договора."
 HUN_land_forces: "Magyar Szárazföldi Haderő"
 HUN_land_forces_desc: "Сухопутные силы Венгрии должны восстановить авторитет через обновление доктрин, реорганизацию бригад и полевые учения с акцентом на мобильность."
 HUN_reorganization_of_infantry: "Реорганизация пехоты"
 HUN_reorganization_of_infantry_desc: "Моторизация ключевых батальонов, стандартизация экипировки и расширение профессиональных унтер-офицеров превратят пехоту в настоящую силу быстрого реагирования."
 HUN_modernization_of_military_equipment: "Модернизация военного оборудования"
 HUN_modernization_of_military_equipment_desc: "Закупки будут направлены на современные ББМ, оптику и артиллерию, даже если это вызовет временный рост расходов."
 HUN_retraining_of_officers: "Переподготовка офицеров"
 HUN_retraining_of_officers_desc: "Отправка офицеров в классы и зарубежные академии избавит от устаревших советских доктрин и привьёт современные лидерские навыки."
 HUN_zrinyi2026: "Zrínyi 2026"
 HUN_zrinyi2026_desc: "Флагманская программа Zrínyi 2026 обновит весь состав - новые стрелковое оружие, боевые машины пехоты и цифровые командные сети по амбициозному графику."
 HUN_feg: "Fegyver- és Gépgyár"
 HUN_feg_desc: "Возрождение завода FEG обеспечивает внутреннее снабжение стрелковым оружием и комплектующими, поддерживая армию и экспортные амбиции."
 HUN_organize_abrams_deliveries: "Организация поставок «Абрамс»"
 HUN_organize_abrams_deliveries_desc: "Переговоры о приобретении излишков танков «Абрамс» позволят нашим бронетанковым подразделениям достичь стандартов НАТО при условии политических и финансовых затрат."
 HUN_russian_tanks: "Российские танки"
 HUN_russian_tanks_desc: "Альтернативно, закупка по сниженной цене российской бронетехники может модернизировать наш парк дешево, но за счёт западной совместимости."
 HUN_n7: "N7"
 HUN_n7_desc: "Проект N7 направляет средства на отечественные НИОКР, фокусируясь на сенсорах, боеприпасах и лёгкой технике, подходящей для венгерской территории."
 HUN_air_forces: "Magyar Légierő"
 HUN_air_forces_desc: "Воздушные силы нуждаются в обновлённых базах, программах удержания пилотов и ясной дорожной карте закупок для сохранения боеспособности."
 HUN_resolve_mig29_issue: "Решение проблемы МиГ-29"
 HUN_resolve_mig29_issue_desc: "Венгрия должна окончательно решить, модернизировать, продать или списать устаревший парк МиГ-29, освобождая ангары и бюджеты для следующего поколения."
 HUN_strengthening_air_defense: "Укрепление противовоздушной обороны"
 HUN_strengthening_air_defense_desc: "Инвестиции в радиолокационное покрытие, батареи ЗРК и сетевые командные пункты закроют пробелы в нашем воздушном щите."
 HUN_revision_of_logistics: "Пересмотр логистики"
 HUN_revision_of_logistics_desc: "Ревизия логистики оптимизирует склады, оцифрует инвентарь и гарантирует, что передовые подразделения получат запчасти и топливо вовремя."
 HUN_buy_swedish_planes: "Закупка шведских самолётов"
 HUN_buy_swedish_planes_desc: "Аренда или покупка шведских самолётов обеспечивает сбалансированный путь к интеграции с Западом без полной зависимости от США."
 HUN_naval_forces: "Magyar Haditengerészet"
 HUN_naval_forces_desc: "Несмотря на отсутствие выхода к морю, Венгрии нужны речные силы. Восстановление небольшой Дунайской флотилии улучшает охрану границ и мобильность инженеров."
 HUN_choose_new_doctrine: "Выбор новой доктрины"
 HUN_choose_new_doctrine_desc: "Планировщики флота обсудят доктрины прибрежной обороны, экспедиционной поддержки или контроля рек перед выделением ограниченных средств."
 HUN_construction_of_new_naval_shipyards: "Строительство новых морских верфей"
 HUN_construction_of_new_naval_shipyards_desc: "Расширение внутренних верфей позволяет производить патрульные катера, транспортные и вспомогательные суда для операций на Дунае."
 HUN_restoring_greatness_of_sea: "Возвращение великолепия моря"
 HUN_restoring_greatness_of_sea_desc: "Символичная, но амбициозная программа создания экспедиционной логистики - совместные учения с союзными флотами, амфибийные учения и штаб морских операций."
 HUN_organize_abrams_deliveries_tt: "Если §B[USA.GetNameWithFlag]§! согласится, мы получим §4120 Abrams§! за §R$5 миллиардов§!."
 HUN_russian_tanks_tt: "Если §B[SOV.GetNameWithFlag]§! согласится, мы получим §4120 T-72§! за §R$5 миллиардов§!."
 HUN_buy_swedish_planes_tt: "Если §B[SWE.GetNameWithFlag]§! согласится, мы получим §420 Sk-60§! самолётов за §R$5 миллиардов§!."
 HUN_resolve_mig29_issue_tt: "В зависимости от выбранного решения, мы получим §Gразные бонусы§!."

 #Millitary Decisions
 HUN_millitary_category: "Вооружённые силы Венгрии"
 HUN_millitary_category_desc: "Наша армия находится в плачевном состоянии. Оборудование недоразвито, флота нет, выхода к морю нет, а воздушная мощь практически отсутствует. В рамках великого возрождения армии мы должны начать масштабную модернизацию и вернуть былое величие нашей Армии.\n\n\n\n\n\n\n£GFX_HUN_hungarian_army_decision_category\n\n\n\n\n\n\n\n"
 HUN_sold_mig29: "Продажа МиГ-29 [FROM.GetNameWithFlag]"

