 #Commi events
 hungary_commi.1.t: "Венгрия запрашивает гарантии"
 hungary_commi.1.d: "Венгерская Республика, где вновь зажжено пламя социалистической революции, просит нас о гарантиях защиты от западных стервятников. Поможем ли мы нашим социалистическим братьям?"
 hungary_commi.1.a: "Мы гарантируем их независимость"
 hungary_commi.1.b: "Венгрия не в наших интересах"

 hungary_commi.2.t: "Китай предоставляет гарантии"
 hungary_commi.2.d: "Правительство Китайской Народной Республики выразило заинтересованность в безопасности нашей страны и предоставило нам гарантии независимости. Это укрепит нашу безопасность против западного империализма."
 hungary_commi.2.a: "Спасибо китайским братьям!"

 hungary_commi.3.t: "Китай отказывает в гарантиях"
 hungary_commi.3.d: "Правительство Китайской Народной Республики отказалось предоставить нам гарантии. Это свидетельствует о нежелании Китая обострять отношения с западным миром."
 hungary_commi.3.a: "Что ж, мы постоим за себя сами."

 hungary_commi.4.t: "Венгрия хочет заключить военный договор"
 hungary_commi.4.d: "Венгерское правительство обратилось к нам с предложением заключить договор о взаимной обороне. Это увеличит наше влияние и военное присутствие в Центральной Европе."
 hungary_commi.4.a: "Давайте подпишем договор"
 hungary_commi.4.b: "Венгрия не в наших интересах"

 hungary_commi.5.t: "Россия согласилась подписать договор"
 hungary_commi.5.d: "Недавно состоялась встреча с российским правительством. Обсуждалась возможность подписания договора о взаимной обороне. Переговоры завершились подписанием этого договора нашими дипломатами и российским правительством."
 hungary_commi.5.a: "Слава России"

 hungary_commi.6.t: "Россия отказалась"
 hungary_commi.6.d: "Недавно состоялась встреча с российским правительством. Обсуждалась возможность подписания договора о взаимной обороне. Итогом обсуждений стал отказ российского правительства разрешить нам подписать соглашение."
 hungary_commi.6.a: "Ну и не надо"

 hungary_commi.7.t: "Венгрия приглашает нас в альянс"
 hungary_commi.7.d: "Недавно Венгерская Социалистическая Республика объявила о создании собственной организации для объединения центральноевропейских социалистов против западного империализма. И теперь Венгрия отправила нам приглашение присоединиться к их блоку. Стоит ли соглашаться?"
 hungary_commi.7.a: "Давайте объединимся!"
 hungary_commi.7.b: "Это не в наших интересах"

 hungary_commi.8.t: "[FROM.GetName] соглашается присоединиться к Альянсу"
 hungary_commi.8.d: "Наше недавнее предложение правительству [FROM.GetAdjective] было встречено с интересом, и недавно наши дипломаты встретились, чтобы подписать соглашение о вступлении [FROM.GetName] в наш социалистический блок."
 hungary_commi.8.a: "Вместе мы сильнее!"

 hungary_commi.9.t: "[FROM.GetName] отказывается присоединиться к Альянсу"
 hungary_commi.9.d: "[FROM.GetAdjective] правительство отклонило наше предложение объединиться в единый социалистический блок. Возможно, они опасаются западного давления, а возможно, просто не разделяют наши идеалы."
 hungary_commi.9.a: "Ну и ладно"

 hungary_commi.10.t: "Вопрос о восстановлении AVH"
 hungary_commi.10.d: "Államvédelmi Hatóság (AVH) была службой государственной безопасности во Второй Венгерской Республике и Венгерской Народной Республике, существовавшей с 1945 по 1956 год. Она была расформирована после Венгерского восстания 1956 года. После восстановления социалистической власти в стране встал вопрос о возрождении этой структуры."
 hungary_commi.10.a: "Мы восстанавливаем AVH"
 hungary_commi.10.b: "Мы создадим TEK с расширенными полномочиями"

 hungary_commi.11.t: "Венгрия хочет купить наше оружие"
 hungary_commi.11.d: "Венгерское правительство обратилось к нам с предложением. Они хотят закупить наше оружие для модернизации своей армии. Соглашение увеличит наше влияние в Центральной Европе и укрепит связи с нашими венгерскими друзьями."
 hungary_commi.11.a: "Мы продадим им оружие."
 hungary_commi.11.b: "Мы не будем разбрасываться оружием"

 hungary_commi.12.t: "Россия продаёт нам оружие"
 hungary_commi.12.d: "Россия выразила заинтересованность в продаже нам своего оружия. Это укрепит нашу армию и будет намного дешевле, чем производство собственного оружия, что положительно скажется на нашей политике сокращения военных расходов."
 hungary_commi.12.a: "Благодарность российским братьям"

 hungary_commi.13.t: "Россия отказалась продавать нам оружие"
 hungary_commi.13.d: "Российское правительство отказалось продавать нам оружие. Что ж, по крайней мере, мы сможем сэкономить на военных расходах."
 hungary_commi.13.a: "Ну и не надо"