 #Monarchists Events
 hungary_monarch.1.t: "Референдум о монархии"
 hungary_monarch.1.d: "После возвращения Дома Габсбургов к власти в Венгрии народ начал задаваться вопросом: «Справедливо ли это?» Наше правительство решило пойти навстречу обществу и провести национальный референдум, чтобы определить точный объём полномочий, предоставляемых Венгерской Короне. Будут ли Габсбурги вновь править абсолютно, или же власть Короны будет ограничена демократическим парламентом и кабинетом министров?"
 hungary_monarch.1.a: "Вся власть короне!"
 hungary_monarch.1.b: "Власть короля должна быть ограничена"
 hungary_monarch.2.t: "Стремление к возрождению империи Габсбургов"
 hungary_monarch.2.d: "Много лет прошло с момента падения Империи Габсбургов. Завоевания Наполеона, Бисмарка, а затем и Первая мировая война разрушили могущественную империю, созданную династией Габсбургов. Вернув себе власть, мы должны посвятить все усилия восстановлению былого величия, силы и границ Империи Габсбургов!"
 hungary_monarch.2.a: "Империя будет жить!"
 hungary_monarch.3.t: "Амбиции Габсбургов"
 hungary_monarch.3.d: "Династия Габсбургов, вернувшись к власти в Венгрии, заявила о тревожных амбициях. Габсбурги стремится восстановить некогда великую Империю Габсбургов, на этот раз с центром в Будапеште. Их заявления ставят под сомнение территориальную целостность Сербии, Румынии, Украины и Италии, а также суверенитет Австрии, Чешской Республики, Словакии, Словении и Хорватии. Если Венгрия реализует свои амбиции, это значительно изменит баланс сил в Европе и нарушит обещание, данное Антанте столетие назад, что Габсбурги больше не будут пытаться возродить свою империю."
 hungary_monarch.3.a: "Мы будем следить за развитием событий"
 hungary_monarch.4.t: "Венгрия требует Трансильванию"
 hungary_monarch.4.d: "Сегодня дипломаты Венгерской Короны обратились к нам с требованием вернуть Трансильванию под венгерский контроль. Они заявляют, что имеют полное право на эти земли и вернут их даже в случае необходимости военного вмешательства. Эти требования можно расценивать как ультиматум."
 hungary_monarch.4.a: "Это лучше, чем ввязываться в войну"
 hungary_monarch.4.b: "Мы будем защищать нашу территориальную целостность!"
 hungary_monarch.5.t: "[FROM.GetName] уступает"
 hungary_monarch.5.d: "[FROM.GetName] идёт на уступки и принимает наши требования. Мы получили все заявленные территории, тогда как [FROM.GetName] смог избежать войны и сохранить жизни своих солдат."
 hungary_monarch.5.a: "Очень хорошо!"
 hungary_monarch.6.t: "[FROM.GetName] отказывается"
 hungary_monarch.6.d: "[FROM.GetName] отвергает наши требования, заявляя, что готов сражаться за свои земли. Это смело и наивно, но, тем не менее, заслуживает уважения."
 hungary_monarch.6.a: "Бог свидетель, мы хотели решить всё мирно."
 hungary_monarch.7.t: "Закарпатье в обмен на союз"
 hungary_monarch.7.d: "Венгерские дипломаты обратились к нашему посольству с ультиматумом. Они требуют передать территорию Закарпатья, взамен предлагая заключить с нами всеобъемлющий союз."
 hungary_monarch.7.a: "Это цена союза"
 hungary_monarch.7.b: "Что за чепуха?"
 hungary_monarch.8.t: "[FROM.GetName] согласился"
 hungary_monarch.8.d: "[FROM.GetName] согласился передать нам Закарпатье. В обмен мы заключили с ними ряд соглашений, которые можно назвать славным Союзом."
 hungary_monarch.8.a: "Они поступили мудро!"
 hungary_monarch.9.t: "[FROM.GetName] отказался"
 hungary_monarch.9.d: "[FROM.GetName] отвергает наши требования. Видимо, наша доброжелательность показалась им недостаточной, чтобы вернуть наши земли. Однако мы всегда можем сделать это силой."
 hungary_monarch.9.a: "Бог свидетель, мы хотели решить всё мирно"
 hungary_monarch.10.t: "Венгрия требует нашей аннексии"
 hungary_monarch.10.d: "Венгерские дипломаты поспешно покинули нашу страну и закрыли посольство, оставив лишь сообщение с ультиматумом. Венгерское правительство требует нашей аннексии, в противном случае они расценят наш ответ как объявление войны. Что нам делать?"
 hungary_monarch.10.a: "Мы подчинимся Венгерской Короне"
 hungary_monarch.10.b: "Мы будем сражаться за наши земли!"
 hungary_monarch.11.t: "[FROM.GetName] уступает"
 hungary_monarch.11.d: "[FROM.GetName] идёт на уступки и принимает наши требования. Мы получили все заявленные территории, тогда как [FROM.GetName] смог избежать войны и сохранить жизни своих солдат."
 hungary_monarch.11.a: "Очень хорошо!"
 hungary_monarch.12.t: "[FROM.GetName] отказывается"
 hungary_monarch.12.d: "[FROM.GetName] отвергает наши требования, заявляя, что готов сражаться за свои земли. Это смело и наивно, но, тем не менее, заслуживает уважения."
 hungary_monarch.12.a: "Бог свидетель, мы хотели решить всё мирно."
 hungary_monarch.13.t: "Венгрия предлагает гарантии за наши территории"
 hungary_monarch.13.d: "Венгерская Корона направила нам предложение: они предлагают гарантии нашей независимости и союз за наши северные земли в регионе Банат. Если мы откажемся, это немедленно приведет к войне; если примем, мы потеряем развитые территории, но получим гарантии от потенциальной новой державы."
 hungary_monarch.13.a: "Если это цена мира, мы её заплатим"
 hungary_monarch.13.b: "Мы не отдадим свои земли!"
 hungary_monarch.15.t: "[FROM.GetName] согласился"
 hungary_monarch.15.d: "[FROM.GetName] согласился передать нам Банат. В обмен мы заключили с ними ряд соглашений, которые можно назвать славным Союзом."
 hungary_monarch.15.a: "Они поступили мудро!"
 hungary_monarch.14.t: "[FROM.GetName] отказывается"
 hungary_monarch.14.d: "[FROM.GetName] отвергает наши требования. Видимо, наша доброжелательность показалась им недостаточной, чтобы вернуть наши земли. Однако мы всегда можем сделать это силой."
 hungary_monarch.14.a: "Бог свидетель, мы хотели решить всё мирно"
 hungary_monarch.16.t: "Австро-Венгрия снова расправила крылья"
 hungary_monarch.16.d: "Несмотря на запрет Антанты на претензии Габсбургов на европейские короны, Венгрия выбрала монарха из Дома Габсбургов-Лотарингских.\nАгрессивная внешняя политика Венгерской Короны позволила быстро приобрести территории, заявленные [HUN.GetLeader], и официально провозгласить восстановление Австро-Венгерской Империи."
 hungary_monarch.16.a: "Что это значит для Европы?"
 hungary_monarch.17.t: "Выбор монарха"
 hungary_monarch.17.d: "Чтобы восстановить былой порядок и величие нашей страны, мы должны сделать правильный выбор в пользу нового монарха, который поведёт нашу страну вперёд. Этим человеком может быть нынешний глава династии Габсбургов Отто фон Габсбург или один из его сыновей: Карл, наследный принц династии, или Георг, почётный гражданин нашего государства."
 hungary_monarch.17.a: "Мы выбираем Отто фон Габсбурга"
 hungary_monarch.17.b: "Мы выбираем Карла Габсбург-Лотрингена"
 hungary_monarch.17.c: "Мы выбираем Георга фон Габсбурга"
 hungary_monarch.18.t: "Вопрос прав ЛГБТ"
 hungary_monarch.18.d: "Долг Короны - сохранить Венгрию для будущих поколений такой, какой её создала история: сильной, единой и верной своим корням. Частная жизнь подданных - это их собственная ответственность, но публичное одобрение или пропаганда образа жизни, противоречащего принципам христианской морали и семейного права, не могут быть допущены."
 hungary_monarch.18.a: "Запретить права ЛГБТ"
 hungary_monarch.18.b: "Разрешить права ЛГБТ"
 hungary_monarch.19.t: "Венгрия требует Галицию"
 hungary_monarch.19.d: "Прошло относительно немного времени с тех пор, как Габсбурги взошли на венгерский трон и объявили миру о своих имперских амбициях. И вот теперь габсбургский империализм постучался в нашу дверь. Их требования включают передачу нашей территории, ранее входившей в состав двуединой монархии как Галиция. Отказ неизбежно приведёт к военному противостоянию с Австро-Венгрией. Что нам делать?"
 hungary_monarch.19.a: "Подчиниться их требованиям"
 hungary_monarch.19.b: "Если они хотят войны, они её получат"
 hungary_monarch.20.t: "[FROM.GetName] подчиняется нашим требованиям"
 hungary_monarch.20.d: "Не желая дальнейшей эскалации, правительство [FROM.GetAdjective] согласилось передать нам часть своих земель, которые исторически принадлежат нашему государству."
 hungary_monarch.20.a: "Мы забираем то, что по праву наше"
 hungary_monarch.21.t: "[FROM.GetName] отвергает ультиматум"
 hungary_monarch.21.d: "[FROM.GetName] отказался выполнить наш ультиматум, заявив, что если дело дойдёт до этого, они готовы к войне. Всё было готово к наступлению; оставалось только отдать приказ, и наши войска вторглись бы на территорию [FROM.GetAdjective]."
 hungary_monarch.21.a: "Начать мобилизацию"

  #Jobbik Focuses
 HUN_rise_of_jobbik: "Восхождение Йоббика"
 HUN_rise_of_jobbik_desc: "Жёсткое националистическое течение перемещается с периферии в парламент, обещая защищать нацию с помощью бескомпромиссной политики и, при необходимости, уличной силы."
 HUN_party_declaration: "Декларация партии"
 HUN_party_declaration_desc: "Йоббик публикует свою программу: этнический национализм, жёсткие меры по обеспечению правопорядка и агрессивный вызов старым партиям, которые он клеймит как коррумпированные и космополитичные."
 HUN_hard_national_populism: "Жёсткий национальный популизм"
 HUN_hard_national_populism_desc: "Предвыборная риторика переходит в постоянное управление - массовые митинги, пламенные речи и нападки на элиты разжигают недовольство, одновременно консолидируя власть в руках националистов."
 HUN_protecting_hungarian_interests: "Защита интересов Венгрии"
 HUN_protecting_hungarian_interests_desc: "Каждая политика будет проходить через единственный тест - приносит ли она пользу этническим венграм в первую очередь? Торговля, субсидии и регулирование будут перестроены, чтобы пройти этот тест."
 HUN_create_a_workers_union: "Создание рабочей организации"
 HUN_create_a_workers_union_desc: "Создаётся ориентированная на партию рабочая федерация, чтобы противостоять «глобалистским» профсоюзам, направляя трудовые жалобы в поддержку националистического проекта."
 HUN_protecting_hungarian_values: "Защита венгерских ценностей"
 HUN_protecting_hungarian_values_desc: "Школы, средства массовой информации и культурные гранты переориентируются на «традиционные» нарративы, вытесняя либеральные голоса и возвышая консервативные социальные нормы."
 HUN_lgbt_ban: "Запрет ЛГБТ"
 HUN_lgbt_ban_desc: "Законодательство криминализирует ЛГБТ-организации и публичное самовыражение, представляя это как защиту семьи, но на деле маргинализируя и заставляя замолчать меньшинства."
 HUN_condemn_global_capitalism: "Осуждение глобального капитализма"
 HUN_condemn_global_capitalism_desc: "Речи и медиа-кампании обрушиваются на транснациональные корпорации и финансистов, обвиняя «глобальный капитализм» в неравенстве и размывании культуры."
 HUN_attracting_foreign_investors: "Привлечение иностранных инвесторов"
 HUN_attracting_foreign_investors_desc: "Несмотря на антиглобалистскую риторику, отдельные иностранные инвесторы привлекаются стимулами - при условии, что они соответствуют националистическим приоритетам и нанимают местных жителей."
 HUN_radical_christian_patriotism: "Радикальный христианский патриотизм"
 HUN_radical_christian_patriotism_desc: "Духовенство и лидеры партии сливают веру и национализм, проповедуя миссию защиты христианской Европы и освящая жёсткую политику движения."
 HUN_the_israeli_question: "Израильский вопрос"
 HUN_the_israeli_question_desc: "Йоббик агитирует вокруг Израиля и местных еврейских общин, используя провокационную риторику, чтобы сплотить радикалов и отвлечь внимание от внутренних проблем."
 HUN_three_strikes_law: "Закон трёх ударов"
 HUN_three_strikes_law_desc: "Обязательный режим «трёх ударов» обещает быстрое и суровое наказание, расширяя тюремное заключение и демонстрируя жёсткость в борьбе с преступностью."
 HUN_return_of_death_penalty: "Возвращение смертной казни"
 HUN_return_of_death_penalty_desc: "Смертная казнь вновь вводится за тяжкие преступления, преподносится как сдерживающий фактор и символ бескомпромиссного правосудия."
 HUN_strengthening_the_police: "Укрепление полиции"
 HUN_strengthening_the_police_desc: "Бюджеты, оборудование и юридические полномочия полиции расширяются, с проверками на лояльность, чтобы обеспечить поддержку националистической повестки."
 HUN_hungary_for_hungarians: "Венгрия для венгров"
 HUN_hungary_for_hungarians_desc: "Ограничения на миграцию, рейды по проверке проживания и политика преимущественного найма формализуют лозунг: государство существует в первую очередь для этнических венгров."
 HUN_hungarian_ethnocracy: "Венгерская этнократия"
 HUN_hungarian_ethnocracy_desc: "Институциональные изменения возвышают одну этническую группу в законе и на практике - ужесточение правил гражданства, перекройка избирательных округов и встраивание дискриминации в государственные структуры."
 HUN_protectionist_approach_to_economy: "Протекционистский подход к экономике"
 HUN_protectionist_approach_to_economy_desc: "Экономическая программа Йоббика отвергает глобализм и ортодоксальную свободную торговлю. Повышая пошлины, отдавая предпочтение отечественным фирмам в закупках и ограничивая иностранную собственность в стратегических секторах, государство защитит венгерских рабочих от того, что оно изображает как хищнический иностранный капитал."
 HUN_large_scale_reform_of_law_enforcement_agencies: "Масштабная реформа правоохранительных органов"
 HUN_large_scale_reform_of_law_enforcement_agencies_desc: "Существующие полицейские структуры обвиняются в коррупции и слабости. Масштабная реорганизация - чистки, новое руководство и политическое вето - превратит правоохранительные органы в лояльный инструмент националистического государства."
 HUN_raids_on_corrupt_officials: "Рейды на коррумпированных чиновников"
 HUN_raids_on_corrupt_officials_desc: "Специальные подразделения получат полномочия проводить громкие рейды против предположительно коррумпированных бюрократов и местных боссов. Помимо борьбы с взяточничеством, эти операции посылают чёткий сигнал: оппозиционные сети будут разорваны силой, если потребуется."
 HUN_shut_up_disloyal_media: "Заткнуть недовольные СМИ"
 HUN_shut_up_disloyal_media_desc: "Враждебные СМИ клеймятся как враги нации. Посредством штрафов, давления на лицензии, дружественных поглощений и юридических притеснений критикующие вещатели и газеты будут заставлены замолчать или приведены в соответствие с государственной линией."
 HUN_demand_federalization_of_Romania: "Требовать федерализации Румынии"
 HUN_demand_federalization_of_Romania_desc: "Под знаменем прав меньшинств Будапешт потребует превращения Румынии в рыхлую федерацию, предоставляющую широкую автономию регионам, населённым венграми. Если Бухарест откажется, этот вопрос можно использовать для разжигания националистических настроений внутри страны и оправдания будущего давления."
 HUN_complete_the_reform_of_law_enforcement_agencies: "Завершить реформу правоохранительных органов"
 HUN_complete_the_reform_of_law_enforcement_agencies_desc: "Поскольку чистки и перестановки уже идут, финальный этап реформы централизует командование, расширяет специальные подразделения и привязывает повышения к лояльности. Результатом станет дисциплинированный аппарат безопасности, готовый проводить повестку Йоббика."
 HUN_vonas_cult_of_personality: "Культ личности Воны"
 HUN_vonas_cult_of_personality_desc: "Пропаганда, митинги и лояльные СМИ возвысят Габора Вону как воплощение воли нации. Портреты, лозунги и тщательно поставленные речи культивируют культ вождя, который сплачивает движение и маргинализирует внутренних соперников."
 HUN_create_a_secret_police: "Создать тайную полицию"
 HUN_create_a_secret_police_desc: "Новая служба внутренней безопасности, подотчётная только руководству, будет следить за диссидентами, оппозиционными партиями и подозреваемыми предателями. Действуя в тени, она запугает врагов режима и предотвратит вызовы до того, как они проявятся."
 HUN_support_hungarian_separatism_in_ukraine: "Поддержать венгерский сепаратизм в Украине"
 HUN_support_hungarian_separatism_in_ukraine_desc: "Тайное финансирование, политическая агитация и предложения паспортов взрастят сепаратистские настроения в регионах Украины, населённых венграми. Официально позиционируемая как защита наших соплеменников, эта кампания также даёт Будапешту рычаг для дестабилизации соседа."
 HUN_fostering_patriotism: "Воспитание патриотизма"
 HUN_fostering_patriotism_desc: "Школьные программы, молодёжные лагеря и ветеранские ассоциации будут мобилизованы для привития гордости за венгерскую историю и миссию Йоббика. Постоянный барабан патриотической символики нормализует радикальную программу движения."
 HUN_militarization_of_society: "Милитаризация общества"
 HUN_militarization_of_society_desc: "Полувоенная подготовка, резервные формирования и учения гражданской обороны распространят воинскую этику по всему обществу. Граждане поощряются видеть себя солдатами в национальной борьбе, стирая грань между гражданской жизнью и вооружённым движением."
 HUN_form_a_militia: "Сформировать милицию"
 HUN_form_a_militia_desc: "Ориентированные на партию отряды самообороны будут патрулировать «опасные» районы, охранять митинги и демонстрировать силу в сельской местности. Представленные как добровольцы, защищающие порядок, эти формирования на практике запугивают меньшинства и политических оппонентов."
 HUN_anti_gypsy_campaign: "Антицыганская кампания"
 HUN_anti_gypsy_campaign_desc: "Под предлогом борьбы с преступностью и «асоциальным поведением» Йоббик развернёт масштабные операции против ромских общин. Жёсткое полицейское воздействие, выселения и стигматизирующая риторика углубляют дискриминацию, сплачивая экстремистов вокруг правительства."

 #Jobbik Events
 hungary_jobbik.1.t: "Подписание декларации партии"
 hungary_jobbik.1.d: "Сегодня, на партийном съезде «Йоббик», в связи с приходом нашей партии к власти в стране, была подписана новая декларация.\nДекларация основана на принципах построения социалистической системы, опирающейся на национальную идентичность, защиту традиционных венгерских ценностей и интересов венгерских граждан."
 hungary_jobbik.1.a: "Выпьем за нас!"
 hungary_jobbik.2.t: "[HUN.GetName] ищет инвестиции"
 hungary_jobbik.2.d: "[HUN.GetAdjective] дипломаты вместе с [HUN.GetAdjective] министром финансов обратились к нам с просьбой. Они хотят получить инвестиции из нашей страны для стимулирования своей экономики, обещая всё вернуть. Такой шаг укрепит наши отношения и усилит наше влияние на ВВП Венгрии. Стоит ли согласиться?"
 hungary_jobbik.2.a: "Берите наши деньги, венгерские братья!"
 hungary_jobbik.2.b: "Наша экономика не в состоянии поддержать инвестиции"
 hungary_jobbik.3.t: "[FROM.GetName] соглашается инвестировать в нас!"
 hungary_jobbik.3.d: "Наши дипломаты вернулись из [FROM.GetName] с отличными новостями: [FROM.GetName] согласилась выделить несколько миллиардов долларов на инвестиции в нашу экономику!"
 hungary_jobbik.3.a: "Очень приятно!"
 hungary_jobbik.4.t: "Израиль на повестке дня"
 hungary_jobbik.4.d: "Евреи уже давно являются проблемой в нашей стране, и речь идёт не о конкретной нации, а о гражданах искусственного государства, созданного террористами, под названием Израиль. Эти люди представляют угрозу национальной идеологии Венгрии, и вполне возможно, что среди них есть агенты «Моссада».\nТак или иначе, проблему необходимо решить. Перед нами встал вопрос: депортировать всех евреев в Тель-Авив или отправить на родину только граждан Израиля."
 hungary_jobbik.4.a: "Найти и депортировать каждого еврея!"
 hungary_jobbik.4.b: "Граждане Израиля должны жить в Израиле!"
 hungary_jobbik.5.t: "Венгрия депортирует евреев"
 hungary_jobbik.5.d: "Новая политика венгерского правительства в отношении евреев вынудила их депортировать наших сограждан в Тель-Авив. Хотя мы, разумеется, рады приветствовать наших соотечественников на родине, поведение Венгрии вызывает множество вопросов. По меньшей мере, такие действия явно направлены на разжигание враждебности к нашему государству и несут в себе скрытое послание ненависти по отношению к евреям и Израилю в целом."
 hungary_jobbik.5.a: "Им здесь будет лучше"
 hungary_jobbik.6.t: "Венгрия требует федерализации Трансильвании"
 hungary_jobbik.6.d: "Венгрия, обеспокоенная правами коренных венгров, проживающих в Трансильвании, требует предоставить автономию трансильванской территории и установить её как федеральную единицу под венгерской защитой. Хотя контроль над Трансильванией останется за нами, такие ультиматумы от Венгрии неприемлемы и ставят под вопрос нашу территориальную целостность."
 hungary_jobbik.6.a: "Немного автономии им действительно не повредит"
 hungary_jobbik.6.b: "Мы не склонимся перед венгерскими агрессорами"
 hungary_jobbik.7.t: "Румыния принимает наши требования"
 hungary_jobbik.7.d: "Румыния, не желая вступать в конфронтацию, согласилась предоставить автономию Трансильвании, а мы, в свою очередь, обеспечим соблюдение прав коренных венгров в рамках автономии и гарантируем их право на самоопределение и территориальную целостность."
 hungary_jobbik.7.a: "Вздохните свободно, наши братья!"
 hungary_jobbik.8.t: "Румыния отказывается от наших требований"
 hungary_jobbik.8.d: "Мы глубоко обеспокоены тем, что соседняя Румыния не уважает права на самоопределение коренных венгров, проживающих в Трансильвании. Румынское правительство отказалось предоставить им большую автономию, вынуждая нас прибегнуть к военному решению конфликта."
 hungary_jobbik.8.a: "Мы добьёмся своей цели любой ценой!"
 hungary_jobbik.9.t: "Венгрия требует Закарпатье"
 hungary_jobbik.9.d: "Венгрия уже давно претендует на Закарпатье, утверждая, что эта территория населена этническими венграми. Такие претензии привели к эскалации, и теперь венгерские агрессоры решили предъявить нам прямой ультиматум. Согласимся ли мы?"
 hungary_jobbik.9.a: "Мы согласны на передачу Закарпатья"
 hungary_jobbik.10.t: "[FROM.GetName] соглашается на передачу Закарпатья"
 hungary_jobbik.10.d: "[FROM.GetName], не желая войны с нашей страной, решил передать нам часть своей территории, населённой этническими венграми. Как говорится, осторожность - это не трусость, а глупость - не храбрость. Мы уважаем их выбор."
 hungary_jobbik.10.a: "Добро пожаловать домой"
 hungary_jobbik.11.t: "[FROM.GetName] отказывается от требований"
 hungary_jobbik.11.d: "Заявив, что они готовы к войне с нами, [FROM.GetName] отклонил наши требования и объявил о начале мобилизации. Конфликт вышел за пределы обычного сепаратизма и перерос в войну."
 hungary_jobbik.11.a: "Мы готовы к войне"

