 #Economy
 HUN_economy: "§YВенгерская экономика§!"
 HUN_economy_desc: "Национальный экономический совет оценит стагнирующие отрасли, растущий долг и отток рабочей силы, устанавливая ориентиры для роста, инфляции и зарплат."
 HUN_national_bank: "Развитие национального банка"
 HUN_national_bank_desc: "Расширение полномочий Magyar Nemzeti Bank с новыми инструментами надзора и докапитализацией обеспечит стабильность денежной системы."
 HUN_otp_bank: "OTP Bank"
 HUN_otp_bank_desc: "Партнёрство с OTP обеспечит доступный кредит для МСП и подтолкнёт банк к региональной экспансии, выгодной для Будапешта."
 HUN_mbh_bank: "MBH Bank"
 HUN_mbh_bank_desc: "Консолидация средних кредиторов в MBH упорядочит финансовый сектор и расширит доступ к ипотеке и аграрным кредитам."
 HUN_economic_recovery: "Экономическое восстановление"
 HUN_economic_recovery_desc: "Стимулирующие расходы в сочетании с целевыми налоговыми льготами помогут вывести Венгрию из посттрансформационного кризиса."
 HUN_fighting_public_debt: "Борьба с государственным долгом"
 HUN_fighting_public_debt_desc: "Лимиты долга, доходы от приватизации и улучшение налогового контроля снизят долговую нагрузку."
 HUN_double_income_tax: "Удвоение подоходного налога"
 HUN_double_income_tax_desc: "При необходимости экстренные надбавки для высокооплачиваемых граждан закроют бюджетные дыры, хотя придётся успокаивать недовольных избирателей."
 HUN_combating_subsidiary_reflex: "Борьба с субсидиарным рефлексом"
 HUN_combating_subsidiary_reflex_desc: "Мы отучим фирмы от дотаций через установку критериев эффективности, постепенное прекращение выплат и поощрение инноваций вместо лоббирования."
 HUN_attracting_investments: "Привлечение инвестиций"
 HUN_attracting_investments_desc: "Обновлённое агентство по продвижению инвестиций будет рекламировать индустриальные парки, налоговые льготы и венгерскую квалифицированную рабочую силу за рубежом."
 HUN_subsidies_from_IMF: "Дотации от МВФ"
 HUN_subsidies_from_IMF_desc: "Принятие помощи МВФ даёт передышку - условные кредиты требуют финансовой дисциплины, но поддерживают функционирование экономики."
 HUN_attracting_young_personnel: "Привлечение молодого персонала"
 HUN_attracting_young_personnel_desc: "Стипендии, помощь с жильём и гранты для стартапов убедят молодых специалистов остаться и привлекут эмигрантов вернуться."
 HUN_infrastructure_development: "Развитие инфраструктуры"
 HUN_infrastructure_development_desc: "Национальный план инфраструктуры синхронизирует проекты автомагистралей, железных дорог и широкополосной связи, снижая логистические издержки."
 HUN_european_investments: "Европейские инвестиции"
 HUN_european_investments_desc: "Фонды ЕС и двусторонние сделки профинансируют мосты, энергосети и исследовательские кластеры при условии готовых проектов."
 HUN_all_roads_lead_to_budapest: "Все дороги ведут в Будапешт"
 HUN_all_roads_lead_to_budapest_desc: "Модернизация радиальных автомагистралей и пригородных железных дорог с центром в Будапеште закрепит столицу как логистический хаб региона."
 HUN_construction_of_border_highways: "Строительство пограничных автомагистралей"
 HUN_construction_of_border_highways_desc: "Кольцевые дороги вдоль границ улучшают пропускную способность таможни и показывают соседям, что мы ценим трансграничную торговлю."
 HUN_electrolysis_of_railways: "Электрификация железных дорог"
 HUN_electrolysis_of_railways_desc: "Электрификация магистральных линий снижает эксплуатационные расходы, уменьшает выбросы и соответствует климатическим целям ЕС."
 HUN_export_of_agricultural_products: "Экспорт сельскохозяйственной продукции"
 HUN_export_of_agricultural_products_desc: "Маркетинг венгерской продукции за рубежом диверсифицирует доходы и стабилизирует доходы сельского населения."
 HUN_grain_export: "Экспорт зерна"
 HUN_grain_export_desc: "Предпочтительные железнодорожные слоты и портовые соглашения увеличат объём поставок пшеницы и ячменя на мировой рынок."
 HUN_corn_exports: "Экспорт кукурузы"
 HUN_corn_exports_desc: "Новые силосы и контракты на переработку обеспечивают получение твёрдой валюты за урожай кукурузы."
 HUN_processing_of_crops: "Переработка сельскохозяйственных культур"
 HUN_processing_of_crops_desc: "Инвестиции в мельницы, консервные и биотопливные заводы позволяют оставлять больше добавленной стоимости внутри Венгрии."
 HUN_ubm_group_hungary: "UBM Group"
 HUN_ubm_group_hungary_desc: "Поддержка аграрной империи UBM обеспечивает цепочки поставок и экспорт знаний за пределы страны."
 HUN_king_agro: "King-Agro"
 HUN_king_agro_desc: "Модернизация Crown Agro связывает субсидии с точным земледелием и восстановлением почвы."
 HUN_budapest_international_airport: "Budapest International Airport"
 HUN_budapest_international_airport_desc: "Расширение Ferenc Liszt International улучшает пассажиропоток, грузовые мощности и первое впечатление инвесторов о Венгрии."
 HUN_cityline_hungary: "CityLine Hungary"
 HUN_cityline_hungary_desc: "Поддержка CityLine способствует развитию внутренних перевозчиков и удержанию доходов от билетов в стране."
 HUN_travel_service_hungary: "Travel Service Hungary"
 HUN_travel_service_hungary_desc: "Чартерные компании получают стимулы базироваться в Будапеште, повышая устойчивость туризма к сезонным колебаниям."
 HUN_asl_airlines: "ASL Airlines Hungary"
 HUN_asl_airlines_desc: "Укрепление грузового крыла ASL превращает Венгрию в ключевой узел логистики e-commerce."
 HUN_investments_in_private_airports: "Инвестиции в частные аэропорты"
 HUN_investments_in_private_airports_desc: "Региональные аэродромы получат обновлённые ВПП и таможенные объекты, стимулируя деловую авиацию вне столицы."
 HUN_tourism_development: "Развитие туризма"
 HUN_tourism_development_desc: "Маркетинговые кампании, культурные гранты и обучение персонала привлекут больше посетителей на наши термы, винные регионы и фестивали."
 HUN_development_of_heavy_industry: "Развитие тяжёлой промышленности"
 HUN_development_of_heavy_industry_desc: "Налоговые льготы и гарантии инфраструктуры привлекут сталелитейные, машиностроительные и нефтехимические предприятия для расширения внутри страны."
 HUN_subsidies_to_chemical_industry: "Субсидии химической промышленности"
 HUN_subsidies_to_chemical_industry_desc: "Целевые субсидии помогают химическим заводам внедрять более чистые технологии и подниматься по цепочке добавленной стоимости."
 HUN_egis_gyogyszergyar: "Egis Gyógyszergyár"
 HUN_egis_gyogyszergyar_desc: "Партнёрство с Egis расширяет фармацевтические НИОКР, экспорт генериков и удерживает биотехнологические кадры в Будапеште."
 HUN_investments_in_metallurgy: "Инвестиции в металлургию"
 HUN_investments_in_metallurgy_desc: "Современные печи и лаборатории контроля качества возрождают металлургическое наследие, обеспечивая как внутренние, так и экспортные нужды."
 HUN_expand_steel_mills: "Расширение сталелитейных заводов"
 HUN_expand_steel_mills_desc: "Государственные гарантии в сочетании с частным капиталом позволят расширить доменные и прокатные цеха для удовлетворения инфраструктурного спроса."
 HUN_development_of_national_labels: "Развитие национальных брендов"
 HUN_development_of_national_labels_desc: "Мы будем продвигать венгерские бренды за рубежом через торговые миссии, экспортное страхование и гранты для креативной индустрии."
 HUN_attract_investment_in_metallurgy: "Привлечение инвестиций в металлургию"
 HUN_attract_investment_in_metallurgy_desc: "Иностранный капитал и совместные предприятия будут привлекаться через промышленные зоны возле железнодорожных узлов и упрощённое разрешительное регулирование."
 HUN_organize_import_of_raw_materials: "Организация импорта сырья"
 HUN_organize_import_of_raw_materials_desc: "Заключение долгосрочных контрактов на руду, бокситы и кокс защитит наши отрасли от колебаний цен на сырьё."
 HUN_development_of_mining: "Развитие горной промышленности"
 HUN_development_of_mining_desc: "Гранты на разведку и улучшение безопасности возродят отечественное горное дело там, где геология позволяет."
 HUN_expansion_of_mines: "Расширение шахт"
 HUN_expansion_of_mines_desc: "Масштабирование проверенных месторождений повышает самообеспеченность и сохраняет рабочие места в сельских регионах."
 HUN_hungarian_mechanical_engineering: "Венгерское машиностроение"
 HUN_hungarian_mechanical_engineering_desc: "Машиностроительные компании получат экспортные кредиты и ваучеры на исследования, чтобы высококвалифицированное производство оставалось в стране."
 HUN_selection_foreign_cars: "Выбор иностранных автомобилей"
 HUN_selection_foreign_cars_desc: "Мы будем привлекать нескольких автопроизводителей, позволяя конкуренции стимулировать лучшие компенсации и технологические трансферы."
 HUN_suzuki: "Suzuki"
 HUN_suzuki_desc: "Долговременный завод Suzuki в Эстергоме заслуживает стимулов для расширения в обмен на линии электромобилей и развитие поставщиков."
 HUN_dacia: "Dacia"
 HUN_dacia_desc: "Привлечение Dacia для размещения производства компонентов в Венгрии диверсифицирует наш автомобильный кластер."
 HUN_mercedes_benz: "Mercedes-Benz"
 HUN_mercedes_benz_desc: "Инвестиции Mercedes укрепляют Венгрию как центр премиальных автомобилей при условии повышения квалификации рабочей силы."
 HUN_toyota: "Toyota"
 HUN_toyota_desc: "Привлечение Toyota усилит компетенции в гибридных технологиях и свяжет нас с азиатскими цепочками поставок."
 HUN_solving_energy_problems: "Решение энергетических проблем"
 HUN_solving_energy_problems_desc: "Сочетание программ энергосбережения, новых генераций и диверсификации импорта позволит справиться с хроническим дефицитом энергии."
 HUN_expansion_of_mvm_group: "Расширение MVM Group"
 HUN_expansion_of_mvm_group_desc: "Расширение возможностей госкомпании MVM по инвестициям в сети и генерацию обеспечивает стратегический контроль над критической инфраструктурой."
 HUN_solving_oil_gas_crisis: "Решение нефтегазового кризиса"
 HUN_solving_oil_gas_crisis_desc: "Стратегические резервы, интерконнекторы и гибкость на спотовом рынке защитят нас от будущих нефтегазовых шоков."
 HUN_organize_gas_imports: "Организация импорта газа"
 HUN_organize_gas_imports_desc: "Заключение твёрдых контрактов на импорт и доступ к трубопроводам гарантирует стабильные поставки для домохозяйств и промышленности."
 HUN_south_stream: "Южный поток"
 HUN_south_stream_desc: "Поддержка Южного потока обеспечивает прямую поставку российского газа, хотя и вызывает недовольство ЕС."
 HUN_arad_szeged_pipeline: "Arad-Szeged Pipeline"
 HUN_arad_szeged_pipeline_desc: "Соединение с Румынией через Arad-Szeged позволяет обмениваться потоками газа и использовать офшорные находки."
 HUN_nabucco: "Nabucco"
 HUN_nabucco_desc: "Поддержка коридора Nabucco диверсифицирует поставки с каспийским газом под эгидой ЕС."
 HUN_expansion_renewable_energy: "Расширение возобновляемой энергетики"
 HUN_expansion_renewable_energy_desc: "Ветряные электростанции, солнечные фермы и биомассовые установки получат фиксированные тарифы для снижения зависимости от импортного топлива."
 HUN_hungarys_nuclear_program: "Ядерная программа Венгрии"
 HUN_hungarys_nuclear_program_desc: "Модернизация Пакша и подготовка нового поколения ядерных инженеров обеспечат надёжную базовую мощность."
 HUN_attracting_european_investment: "Привлечение европейских инвестиций"
 HUN_attracting_european_investment_desc: "Вторая кампания в Европе подчеркнёт юридические реформы и возможности ГЧП для привлечения капитала."
 HUN_cooperation_with_rosatom: "Сотрудничество с Rosatom"
 HUN_cooperation_with_rosatom_desc: "Партнёрство с Rosatom обеспечивает финансирование и экспертизу для расширения атомной энергетики, пусть и с геополитическими условиями."
 HUN_subsidies_from_IMF_focus_tt: "\nВ зависимости от выбранной помощи от §6IMF§!, мы получим различные §YБонусы§! для нашей §YЭкономики§!."
 HUN_subsidies_from_IMF_tt: "$$[?HUN_imf_subs|+3] от §YСубсидий IMF§!\n"
 HUN_agroincome_tt: "Будет §GУвеличен§! наш доход от §YЭкспорта Сельхозпродукции§!"

 #Economy Decisions
 HUN_economy_category: "Венгерская экономика"
 HUN_economy_category_desc: "Экономика Венгрии вступает в новое тысячелетие не в самом благоприятном состоянии. Мы сталкиваемся с множеством проблем, накопившихся в период перехода от социализма к рыночному капитализму. Приватизация, рецессия и многие другие факторы привели экономику нашей небольшой страны практически к застою.\nНедостаток ресурсов вынуждает нас импортировать их из-за границы, а отсутствие выхода к морю требует поддержания хороших отношений с соседями, чтобы не потерять экспортные маршруты.\nБольшие долги и отсутствие перспектив вынуждают наших молодых людей покидать страну в поисках лучшей жизни, преимущественно в Германию или Польшу. Это вызывает буквальную утечку мозгов и нехватку молодых специалистов.\nРешение этих проблем и создание новой, мощной экономики - задача правительства [HUN.GetName].\n\n\n\n\n\n\n£GFX_HUN_hungarian_economy_decision_category\n\n\n\n\n\n\n\n\n\n"
 sale_agricultural_products_to: "Продажа §Yсельскохозяйственной продукции§! [FROM.GetNameWithFlag]"
 HUN_agricultire_stats_tt: "Текущее количество торговых партнёров: §G[?HUN_agricultural_products_buyers|0]§!\n§YТекущий доход§! за контракт: $§G[?HUN_agricultural_value|2]§! млрд"
