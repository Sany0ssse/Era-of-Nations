 #Monarchists Focuses
 HUN_rise_of_habsburgs: "Восхождение Габсбургов"
 HUN_rise_of_habsburgs_desc: "Легитимисты объединяются вокруг Дома Габсбургов-Лотарингских, приглашая династию вернуться в венгерскую политику. Восстановление королевской семьи предлагает объединяющий символ для консерваторов и обещание решительного правления после лет технократии."
 HUN_naher_wp: "Избавиться от остатков Варшавского договора"
 HUN_naher_wp_desc: "Очистить офицерский корпус, архивы и органы безопасности от реликтов советской эпохи. Только искоренив коммунистические сети, королевское государство может претендовать на моральный авторитет."
 HUN_gran_privileges_to_bishops: "Предоставить привилегии епископам"
 HUN_gran_privileges_to_bishops_desc: "Католическая иерархия становится официальным партнером короны, получая восстановленные земли, налоговые льготы и влияние на образование в обмен на проповедование верности."
 HUN_restore_old_order: "Восстановить старый порядок"
 HUN_restore_old_order_desc: "Цензура республиканской конституции, реабилитация дворянских титулов и восстановление корпоратистских палат. Монархия обещает стабильность через иерархию."
 HUN_ban_LGBT_activism: "Запретить ЛГБТ-активизм"
 HUN_ban_LGBT_activism_desc: "Декреты морали криминализируют ЛГБТ-НПО и демонстрации, представляя этот шаг как защиту христианской семьи и «традиционного» венгерского общества."
 HUN_protect_christian_values: "Защищать христианские ценности"
 HUN_protect_christian_values_desc: "Ряд законов закрепляет воскресный отдых, религиозное образование и цензуру «богохульного» искусства, укрепляя союз трона и алтаря."
 HUN_national_referendum_monarchy: "Национальный референдум по монархии"
 HUN_national_referendum_monarchy_desc: "Чтобы заставить критиков замолчать, правительство проводит плебисцит по полномочиям короля. Результат определит, примет ли Венгрия абсолютное правление или конституционный компромисс."
 HUN_habsburg_absolutism: "Габсбургский абсолютизм"
 HUN_habsburg_absolutism_desc: "Если плебисцит поддержит автократию, парламент распускается, а монарх правит указами, партии запрещены, а верные бюро исполняют королевские указы."
 HUN_crown_under_observation: "Корона под наблюдением"
 HUN_crown_under_observation_desc: "Если народ требует ограничений, корона принимает конституцию и контроль кабинета, создавая королевскую систему, которая всё же учитывает представительное правительство."
 HUN_restoration_of_aristocracy: "Восстановление аристократии"
 HUN_restoration_of_aristocracy_desc: "Древние семьи магнатов возвращают поместья и места в восстановленной верхней палате, обменивая политическую поддержку на возврат к феодальному престижу."
 HUN_rewrite_constitution: "Переписать конституцию"
 HUN_rewrite_constitution_desc: "Юристы создают новую хартию, концентрируя власть в короне, подчиняя судебную систему и закрепляя монарха как ‘хранителя нации’."
 HUN_unity_king_with_people: "Единство короля с народом"
 HUN_unity_king_with_people_desc: "Конституционные монархисты организуют королевские турне, программы помощи и символические жесты, показывая, что корона прислушивается как к крестьянам, так и к рабочим."
 HUN_assemble_cabinet_of_ministers: "Собрать кабинет министров"
 HUN_assemble_cabinet_of_ministers_desc: "Подобранный кабинет технократов и аристократов будет управлять королевством, балансируя придворные интриги с бюрократической компетентностью."
 HUN_royal_constitution: "Королевская конституция"
 HUN_royal_constitution_desc: "Завершение компромиссной хартии: король сохраняет право вето и контроль над внешней политикой, в то время как верный парламент управляет бюджетами под королевским надзором."
 HUN_god_save_king: "Боже, спаси короля!"
 HUN_god_save_king_desc: "Государственные похороны, военные присяги и гражданские ритуалы все клянутся верностью суверену, укрепляя культ лояльности и заставляя замолчать республиканские слухи."
 HUN_create_the_royal_guard: "Создать королевскую гвардию"
 HUN_create_the_royal_guard_desc: "Элитная Королевская Гвардия, набранная из лояльных офицеров и дворян, будет охранять особу монарха и служить видимым символом династической власти на улицах Будапешта."
 HUN_authoritarian_monarchy: "Авторитарная монархия"
 HUN_authoritarian_monarchy_desc: "Сосредоточив исполнительную власть в руках короля и маргинализировав парламент, Венгрия становится открыто авторитарной монархией, где инакомыслие существует только по воле короны."
 HUN_liberal_monarchy: "Либеральная монархия"
 HUN_liberal_monarchy_desc: "Более либеральное устройство связывает корону с гражданскими правами, сильными судами и наделённым полномочиями парламентом, представляя монархию как стража как порядка, так и индивидуальных свобод."
 HUN_protectionist_economy: "Протекционистская экономика"
 HUN_protectionist_economy_desc: "Пошлины, субсидии и жёсткий импортный контроль защитят королевские отрасли от иностранной конкуренции, обменивая краткосрочные издержки на самодостаточную экономику под руководством короны."
 HUN_liberal_economy: "Либеральная экономика"
 HUN_liberal_economy_desc: "Свободная торговля, открытые рынки и минимальное государственное вмешательство позволят венгерским предприятиям конкурировать по всему миру, способствуя экономическому росту и процветанию под либеральным руководством короны."
 HUN_pan_european_policy: "Панъевропейская политика"
 HUN_pan_european_policy_desc: "Габсбургская корона выступает за европейское единство, стремясь восстановить влияние старой империи через дипломатию, торговлю и культурные связи на всём континенте."
 HUN_restoration_of_Habsburg_Empire: "Восстановление империи Габсбургов"
 HUN_restoration_of_Habsburg_Empire_desc: "С обеспечением внутренней власти Будапешт провозглашает амбициозную программу возрождения старой Дуальной Монархии, готовя дипломатию и армии к расширению."
 HUN_and_back_to_sea: "И снова к морю"
 HUN_and_back_to_sea_desc: "Корона требует доступа к Адриатике, оказывая давление на Хорватию и Словению, чтобы они присоединились к возрожденной империи или столкнулись с морской блокадой и аннексией."
 HUN_demand_transylvania: "Требовать Трансильванию"
 HUN_demand_transylvania_desc: "Послы доставляют ультиматум в Бухарест: вернуть Трансильванию мирным путем и получить королевскую милость, или рисковать вторжением и международной изоляцией."
 HUN_transcarpathia_for_union: "Закарпатье за союз"
 HUN_transcarpathia_for_union_desc: "Киеву предлагается сделка - уступить Закарпатье и получить защиту Венгрии и экономические связи - или столкнуться с легионами Габсбургов."
 HUN_annexation_of_slovakia: "Аннексия Словакии"
 HUN_annexation_of_slovakia_desc: "Давление на Прагу и Братиславу усиливается, так как Венгрия организует референдумы, восстания и военные угрозы для поглощения Словацких земель."
 HUN_banat_for_guarantees: "Банат за гарантии"
 HUN_banat_for_guarantees_desc: "Белграду предлагаются гарантии безопасности в обмен на Банат. Если Сербия откажется, корона готовит планы войны."
 HUN_restoration_of_union: "Восстановление союза"
 HUN_restoration_of_union_desc: "Вена завлекается обещаниями совместного правления, пытаясь вернуть Австрию в данубскую федерацию, управляемую из Будапешта."
 HUN_annexation_of_the_Czech: "Аннексия Чехии"
 HUN_annexation_of_the_Czech_desc: "Прага должна подчиниться короне. Посредством дипломатического давления, экономического принуждения или военной силы чешские земли будут возвращены в лоно Габсбургов, восстанавливая исторические границы империи."
 HUN_return_of_galicia: "Возвращение Галиции"
 HUN_return_of_galicia_desc: "Историческая провинция Галиция, некогда часть Австро-Венгерской империи, должна быть возвращена. Путём переговоров или завоевания мы восстановим эту территорию под властью короны и укрепим наши позиции в Центральной Европе."
 HUN_restoration_of_great_kingdom: "Восстановление великого королевства"
 HUN_restoration_of_great_kingdom_desc: "Возвращение исторических границ позволяет Венгрии снова называться Великим Королевством, с новой регалией и реорганизованной администрацией, преданной короне."
 HUN_invasion_of_bosnia: "Вторжение в Боснию"
 HUN_invasion_of_bosnia_desc: "Чтобы обеспечить южный фланг нашего возрождённого королевства и проецировать власть Габсбургов на Балканы, мы подготовим планы оккупации Боснии и установления нового порядка под властью короны."
 HUN_partition_of_italy: "Раздел Италии"
 HUN_partition_of_italy_desc: "Расколотая политика Италии приглашает к вмешательству. Корона финансирует сепаратистов, покупает влияние и угрожает войной, чтобы выделить марионеточные герцогства вдоль Адриатики."

 #Monarchists Decisions
 HUN_habsburg_empire_category: "Империя Габсбургов"
 HUN_habsburg_empire_category_desc: "Прошли многие годы с момента падения Империи Габсбургов. Завоевания Наполеона, Бисмарка, а затем Первая мировая война разрушили могучую империю, построенную династией Габсбургов. Восстановив власть, мы должны сосредоточить все усилия на возвращении прежней славы, силы и границ Империи Габсбургов!\n\n\n\n\n\n\n£GFX_HUN_habsburg_empire_decision_category\n\n\n\n\n\n\n\n"
