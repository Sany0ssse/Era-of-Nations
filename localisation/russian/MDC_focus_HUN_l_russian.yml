 #Great Hungary Events
 hungary_great.1.t: "Венгрия требует возврата своих земель"
 hungary_great.1.d: "[HUN.GetNameDef] предъявила ультиматум [This.GetNameDef], требуя немедленного возвращения территорий, которые она считает частью создания Великой Венгрии. Ссылаясь на исторические границы и национальное единство, Будапешт настаивает, что эти земли являются неотъемлемой частью венгерской родины и должны быть восстановлены без промедления. Нам предстоит решить, как ответить."
 hungary_great.1.a: "Удовлетворить требования"
 hungary_great.1.b: "Отклонить требования"

 hungary_great.2.t: "Ультиматум принят Словакией"
 hungary_great.2.d: "Братислава приняла наш ультиматум. Словацкое правительство согласилось передать территории, которые мы требовали, [HUN.GetNameDef], признавая наши претензии во имя стабильности и регионального мира. Наш путь к Великой Венгрии продвигается."
 hungary_great.2.a: "Справедливый исход"

 hungary_great.3.t: "Словакия отклонила наши требования"
 hungary_great.3.d: "Словацкое правительство отклонило наш ультиматум и отвергло наши законные претензии. Их непокорность оставляет нам жёсткий выбор: отступить и отказаться от видения Великой Венгрии или добиться своего иными средствами."
 hungary_great.3.a: "Они об этом пожалеют"

 hungary_great.4.t: "Венгрия предъявляет ультиматум"
 hungary_great.4.d: "[HUN.GetNameDef] предъявила ультиматум [This.GetNameDef], требуя немедленного возвращения территорий, которые она считает частью Великой Венгрии. Будапешт утверждает, что эти земли исторически и культурно венгерские и должны быть восстановлены. Наш ответ определит ход событий."
 hungary_great.4.a: "Удовлетворить требования"
 hungary_great.4.b: "Отклонить требования"

 hungary_great.5.t: "Ультиматум принят Украиной"
 hungary_great.5.d: "Киев принял наш ультиматум. Украинское правительство согласилось передать требуемую территорию [HUN.GetNameDef], признавая наши претензии ради региональной стабильности. Наше видение Великой Венгрии продвигается вперёд."
 hungary_great.5.a: "Справедливый исход"

 hungary_great.6.t: "Украина отклонила наши требования"
 hungary_great.6.d: "Украина отклонила наш ультиматум и отвергла наши законные претензии. Их решение обостряет напряжённость и может заставить нас рассмотреть другие способы вернуть то, что мы считаем своим."
 hungary_great.6.a: "Они об этом пожалеют"

 hungary_great.7.t: "Венгрия предъявляет ультиматум"
 hungary_great.7.d: "[HUN.GetNameDef] представила [This.GetNameDef] ультиматум, требуя возврата территорий, претендующих на создание Великой Венгрии. Они настаивают, что история и национальное единство требуют восстановления этих земель. Нам предстоит решить, как ответить."
 hungary_great.7.a: "Удовлетворить требования"
 hungary_great.7.b: "Отклонить требования"

 hungary_great.8.t: "Ультиматум принят Румынией"
 hungary_great.8.d: "Бухарест принял наш ультиматум. Румынские власти передадут требуемые территории [HUN.GetNameDef], признавая наши исторические претензии. Наши усилия приносят плоды."
 hungary_great.8.a: "Справедливый исход"

 hungary_great.9.t: "Румыния отклонила наши требования"
 hungary_great.9.d: "Румыния отклонила наш ультиматум и отвергла наши претензии. Их непокорность угрожает региональной стабильности и бросает вызов нашей решимости восстановить исторические земли."
 hungary_great.9.a: "Они об этом пожалеют"

 hungary_great.10.t: "Венгрия предъявляет ультиматум"
 hungary_great.10.d: "[HUN.GetNameDef] выдвинула ультиматум [This.GetNameDef], требуя возврата территорий, которые считаются неотъемлемой частью венгерской нации. Давление растёт - наш ответ будет иметь последствия."
 hungary_great.10.a: "Удовлетворить требования"
 hungary_great.10.b: "Отклонить требования"

 hungary_great.11.t: "Ультиматум принят Сербией"
 hungary_great.11.d: "Белград принял наш ультиматум. Сербское правительство передаст указанные территории [HUN.GetNameDef], признавая наши претензии и стремясь избежать эскалации."
 hungary_great.11.a: "Справедливый исход"

 hungary_great.12.t: "Сербия отклонила наши требования"
 hungary_great.12.d: "Сербия отклонила наш ультиматум и отказалась передать требуемые территории. Напряжённость растёт, так как наш путь к Великой Венгрии сталкивается с сопротивлением."
 hungary_great.12.a: "Они об этом пожалеют"

 hungary_great.13.t: "Венгрия предъявляет ультиматум"
 hungary_great.13.d: "[HUN.GetNameDef] предъявила ультиматум [This.GetNameDef], настаивая на возврате территорий, претендующих на создание Великой Венгрии. Они ссылаются на историческое право и национальное единство как оправдание. Необходимо принять решение."
 hungary_great.13.a: "Удовлетворить требования"
 hungary_great.13.b: "Отклонить требования"

 hungary_great.14.t: "Ультиматум принят Хорватией"
 hungary_great.14.d: "Загреб принял наш ультиматум. Хорватское правительство согласилось передать требуемые территории [HUN.GetNameDef], признавая наши претензии в надежде сохранить мир."
 hungary_great.14.a: "Справедливый исход"

 hungary_great.15.t: "Хорватия отклонила наши требования"
 hungary_great.15.d: "Хорватия отклонила наш ультиматум и отказалась восстановить территории, на которые мы претендуем. Этот отказ бросает вызов нашим амбициям и может заставить нас искать другие пути."
 hungary_great.15.a: "Они об этом пожалеют"

 hungary_great.16.t: "Провозглашена Великая Венгрия"
 hungary_great.16.d: "После серии требований и дипломатических манёвров [HUN.GetNameDef] обеспечила получение всех территорий, на которые претендовала в рамках своей исторической концепции. В торжественном обращении правительство Будапешта объявило о формировании Великой Венгрии, открывая новую главу с восстановленными границами и национальным единством. Реакция в регионе неоднозначна: одни видят стабильность благодаря урегулированию, другие опасаются, что этот прецедент повлияет на будущее Европы."
 hungary_great.16.a: "Начинается новая эра"

 hungary_great.17.t: "Венгрия аннулирует Парижский Мирный Договор"
 hungary_great.17.d: "Парламент Венгрии принял закон об аннулировании Парижского мирного договора 1947 года, определявшего послевоенные границы страны. В официальном заявлении правительства Венгрии говорится, что договор был подписан «под внешним давлением и в условиях ограниченного суверенитета», а потому утратил юридическую силу.\nОдновременно с этим объявлено о начале программы ускоренной милитаризации и модернизации вооружённых сил. Конечной целью провозглашено восстановление исторических границ Великой Венгрии.\nДействия Будапешта вызвали резкую реакцию в столицах соседних государств, чьи территории могут быть затронуты пересмотром границ."
 hungary_great.17.a: "Европа вновь на гране войны"

