#MSZP Focuses
 HUN_socialist_gov: "Социалистическое правительство"
 HUN_socialist_gov_desc: "Орбан предал нашу страну и народ, что естественно привело к его падению. Теперь демократический мандат передан Венгерской социалистической партии. Наша задача как наследников реформаторов - исправить ошибки Орбана и вернуть страну на путь демократии и прогресса."
 HUN_inherit_reform: "Наследники великих реформ"
 HUN_inherit_reform_desc: "Наша партия прошла долгий путь от инструмента авторитарной коммунистической политики до представителей народа, проводивших демократизацию страны и экономики. Мы, как наследники реформаторов, должны продолжить путь к новому демократическому и капиталистическому обществу."
 HUN_euroatlantism: "Евроатлантическое превосходство"
 HUN_euroatlantism_desc: "Венгрия - по сути европейская страна и часть европейского общества, хотя наши предки и не происходили из Европы. Будучи частью великого сообщества, мы должны продолжать интеграцию в западные институты и углублять отношения с Брюсселем и Вашингтоном."
 HUN_return_investors: "Возврат инвесторов"
 HUN_return_investors_desc: "Политика Орбана, связанная с постепенной национализацией и уходом с мирового рынка, сильно испортила наш имидж среди инвестиционного сообщества. Для стимулирования экономического роста нам придётся активно работать над возвращением западных инвесторов и привлечением новых капиталовложений."
 HUN_war_against_nationalism: "Война с национализмом"
 HUN_war_against_nationalism_desc: "Разделяющий национализм угрожает единству Венгрии, и всё это из-за Фидес! Мы будем активно бороться с националистической риторикой, продвигать инклюзивный патриотизм и работать над устранением расколов в венгерской политике, не позволив Фидес вернуться к власти."
 HUN_block_orban: "Блокировать Фидес"
 HUN_block_orban_desc: "Хотя Фидес проиграл выборы, партия остаётся одной из главных сил в Национальном собрании, что угрожает реализации нашей политики. Объединив усилия с коалиционными партнёрами, мы попытаемся блокировать назначение союзников Орбана на важные комитеты, чтобы предотвратить их получение рычагов влияния."
 HUN_eu_referendum: "Референдум о вступлении в ЕС"
 HUN_eu_referendum_desc: "Вопрос членства в Европейском союзе является ключевым для будущего Венгрии и одной из главных целей нашей партии. Мы проведём демократический референдум, чтобы народ мог решить, следует ли стремиться к полной интеграции в ЕС, обеспечивая венгерскому народу право голоса по этому важнейшему вопросу."
 HUN_dont_forget_sovereignity: "Суверенный член"
 HUN_dont_forget_sovereignity_desc: "Принимая европейское сотрудничество, мы не должны забывать о нашем суверенитете. Мы будем действовать в рамках европейской системы, сохраняя независимость Венгрии и защищая национальные интересы."
 HUN_on_way_liberal_society: "На пути к либеральному обществу"
 HUN_on_way_liberal_society_desc: "Венгерское общество по своей сути консервативно, что затрудняет любые реформы и привело к победе Фидес на выборах. Правительство утвердит ряд мер, чтобы европейские НКО могли демонстрировать все преимущества принятия ценностей европейского общества."
 HUN_second_breath_privatisation: "Второе дыхание приватизации"
 HUN_second_breath_privatisation_desc: "Приватизация государственных активов продолжится, но под строгим контролем и с прозрачностью. Мы обеспечим, чтобы приватизация служила общественным интересам и приносила доход для социальных программ."
 HUN_gyurcsanomica: "Дьюрчаномика"
 HUN_gyurcsanomica_desc: "Ференц Дьюрчань - очень яркая и противоречивая фигура, бизнесмен, также член Социалистической партии. Хотя партию трудно назвать леволиберальной, его идеи значительно правее среднего члена партии. Его крыло выступает за сокращение расходов и поддержание сбалансированного бюджета, утверждая, что Венгрии сначала нужно выйти из экономического кризиса, прежде чем увеличивать социальные расходы. На фоне надвигающегося экономического кризиса его идеи набирают популярность среди членов партии."
 HUN_tradition_soc_dem: "Традиционный подход"
 HUN_tradition_soc_dem_desc: "Идея о том, что социальные расходы нужно сокращать ради экономического успеха, всё ещё спорна для Социалистической партии, хотя мы едва ли можем назвать её крайне леволиберальной. Государство должно ставить благосостояние граждан выше баланса бюджета. Если мы продолжим выделять средства на социальный сектор, даже при дефиците бюджета, финансово укреплённые граждане компенсируют все негативные последствия своей активной экономической деятельностью в долгосрочной перспективе. Мы продолжаем вдохновляться идеями кейнсианства и классических социал-демократов."
 HUN_ausrerity_measures: "Пакет Дюрчаня"
 HUN_ausrerity_measures_desc: "Казна опустела, и финансовый кризис вынуждает тратить всё больше средств на социальную сферу, здравоохранение и образование. В долгосрочной перспективе Венгрия может обанкротиться, оказавшись в долгах и став первым несостоявшимся государством в Европе. Нам придётся объявить меры жёсткой экономии, несмотря на возможные протесты и волнения."
 HUN_unformal_powers: "Непроверяемые полномочия"
 HUN_unformal_powers_desc: "Мы любим нашу демократию и уважаем систему сдержек и противовесов, но бушующий финансовый кризис показывает, что в экстренных ситуациях ограничения создают больше проблем, чем решают. Наше правительство будет использовать различные лазейки в законе, чтобы ускорить и сделать процесс принятия законов более эффективным."
 HUN_stimulate_purchase_power: "Ввести стимулирующие чеки"
 HUN_stimulate_purchase_power_desc: "Прямое перечисление денег гражданам стимулирует экономическую активность. Мы будем распределять стимулирующие чеки, чтобы повысить покупательскую способность и помочь семьям пережить экономические трудности."
 HUN_reduce_speed_privatisation: "Замедлить приватизацию"
 HUN_reduce_speed_privatisation_desc: "Быстрый темп приватизации создал экономическую нестабильность. Мы замедлим процесс, обеспечив лучший контроль и защиту стратегических активов от попадания в чужие руки."
 HUN_rollback_reform: "Отменить ошибки Орбана"
 HUN_rollback_reform_desc: "Хотя Орбан выступал за сбалансированный дефицит, его популистские меры фактически способствовали нынешнему огромному дефициту. Нам придётся откатить большинство его социальных реформ."
 HUN_between_rus_eu: "Посредник"
 HUN_between_rus_eu_desc: "Стратегическое положение Венгрии позволяет нам быть мостом между Россией и Европейским союзом. Мы будем поддерживать сбалансированные отношения с обеими сторонами, используя наше положение для получения выгодных условий и укрепления региональной стабильности."
 HUN_integrate_vishegrad_eurozone: "Привести Вышеград в еврозону"
 HUN_integrate_vishegrad_eurozone_desc: "Страны Вышеградской группы должны работать вместе, чтобы присоединиться к еврозоне. Мы будем координировать действия с нашими региональными партнёрами для плавного перехода и укрепления центральноевропейской интеграции."
 HUN_end_stigmatisation: "Борьба со стигматизацией и преследованиями"
 HUN_end_stigmatisation_desc: "Дискриминация и стигматизация не имеют места в современной Венгрии. Мы будем внедрять комплексные антидискриминационные меры, защищать уязвимые группы и обеспечивать уважительное отношение ко всем гражданам."
 HUN_reform_labour_code: "Реформа трудового кодекса"
 HUN_reform_labour_code_desc: "Во время перехода к рыночной экономике нам пришлось убрать некоторые достаточно прогрессивные практики в трудовом законодательстве, чтобы завоевать доверие иностранных инвесторов. Пора вернуть эти практики, чтобы западные корпорации больше не могли эксплуатировать венгров и одновременно стимулировать производительность."
 HUN_government_care: "Правительство заботится о вас!"
 HUN_government_care_desc: "В Венгрии нет никого, кто заботился бы о венграх больше, чем правительство. Благосостояние граждан напрямую влияет на экономическую эффективность страны, и правительство обязано обеспечивать высокий уровень жизни. Правительство заботится о стране, поэтому оно заботится о вас!"
 HUN_people_transition: "Экономический переход"
 HUN_people_transition_desc: "Хотя страна не проходила через болезненный путь шоковой терапии, как наши соседи, мы всё ещё сталкиваемся с последствиями переходного периода. Существующая дикая рыночная экономика наносит ущерб Венгрии, поэтому правительство инициирует новый переход, на этот раз к социально ориентированному рынку."
 HUN_national_devolution: "Ввести план национальной децентрализации"
 HUN_national_devolution_desc: "Централизованное правительство не может эффективно удовлетворять потребности людей на местном уровне, а нынешняя система муниципалитетов слишком зависит от центра. Мы разработаем план постепенной передачи части финансовых и политических полномочий на местный уровень, чтобы снизить зависимость от центра и обеспечить равномерное экономическое развитие."
 HUN_comfotable_hungary: "Доступная и комфортная Венгрия"
 HUN_comfotable_hungary_desc: "Благодаря новой системе местного самоуправления вопрос жилищного строительства решён. Мы разработаем совместную программу по строительству тысяч новых домов вместе с муниципалитетами и обеспечим новые жилые комплексы качественной инфраструктурой и высокоскоростным интернетом."
 HUN_progressive_society: "Прогрессивное европейское общество"
 HUN_progressive_society_desc: "Венгрия станет по-настоящему прогрессивным обществом, принимая европейские ценности толерантности, равенства и свободы личности. Мы сломаем барьеры и создадим возможности для всех."
 HUN_european_education: "Европейские стандарты образования"
 HUN_european_education_desc: "Наша система образования должна соответствовать европейским стандартам. Мы инвестируем в школы, улучшим подготовку учителей и обеспечим нашим детям образование мирового уровня, готовя их к будущему."
 HUN_crush_chirch_influence: "Подавить влияние церкви"
 HUN_crush_chirch_influence_desc: "Религиозные институты оказывали чрезмерное влияние на государственную политику. Мы отделим церковь от государства, обеспечив принятие решений на светских основаниях и служение всем гражданам вне зависимости от веры."
 HUN_progressive_taxation: "Ввести справедливую налоговую систему"
 HUN_progressive_taxation_desc: "Справедливая налоговая система требует, чтобы те, кто может позволить себе, платили свою честную долю. Мы внедрим прогрессивное налогообложение, обеспечивая пропорциональный вклад богатых и снижая нагрузку на рабочие семьи."
 HUN_professionalise_gov_property: "Государственная собственность, служащая народу"
 HUN_professionalise_gov_property_desc: "Государственные предприятия и собственность должны служить общественным интересам. Мы профессионализируем управление государственными активами, обеспечивая их эффективную работу и качественное обслуживание граждан."
 HUN_end_privatisation_epoch: "Конец эпохи приватизации"
 HUN_end_privatisation_epoch_desc: "Эпоха распродажи национальных активов должна закончиться. Мы остановим дальнейшую приватизацию и сосредоточимся на повышении эффективности государственных предприятий для венгерского народа."
 HUN_victory_over_oppression: "Победа над консерватизмом и национализмом"
 HUN_victory_over_oppression_desc: "Консервативная и националистическая политика подвела венгерский народ. Мы прокладываем новый путь, основанный на прогрессивных ценностях и социальной справедливости, обеспечивая, чтобы экономика служила людям, а не наоборот."
 HUN_trully_socialist_party: "Идеальная социалистическая партия"
 HUN_trully_socialist_party_desc: "Наконец, нам удалось оправдать слово «социалистическая» в названии нашей партии. Экономическая политика на основе идей кейнсианства и интеграция европейских стандартов образования превратили Венгрию в страну процветающей социальной демократии и прогрессивного европейского общества. MSZP стала по-настоящему социалистической и демократической партией."
 HUN_recognixe_minorities: "Расширение прав национальных меньшинств"
 HUN_recognixe_minorities_desc: "Национальные меньшинства Венгрии являются неотъемлемой частью нашего общества. Мы укрепим их права, защитим их культуры и обеспечим полное участие в политической и социальной жизни."
 HUN_refresh_local_governance: "Обновление местного самоуправления"
 HUN_refresh_local_governance_desc: "Местные власти нуждаются в обновлении. Мы очистим систему от коррупции, повысим эффективность и обеспечим, чтобы органы местного управления действительно служили своим сообществам и были подотчётны гражданам."
 HUN_updated_people_constitution: "По-настоящему народная конституция"
 HUN_updated_people_constitution_desc: "Наша конституция должна реально отражать волю и ценности венгерского народа. Мы разработаем новую конституцию, которая защитит права личности, обеспечит демократическое управление и создаст основу для справедливого и процветающего общества."
 HUN_care_for_yourselves: "Общество самозаботы"
 HUN_care_for_yourselves_desc: "Ответственность за благополучие граждан не может лежать только на государстве; наш бюджет не бездонный. Население должно принять факт, что во время экономического кризиса никто не поможет им кроме них самих. Мы обязаны побуждать население разумно распоряжаться своими финансами; мы должны дать им удочку, а не рыбу."
 HUN_european_living_wage: "Европейский уровень минимальной зарплаты"
 HUN_european_living_wage_desc: "Хотя мы продвигаем идею самодостаточности, никто не дал населению деньги на это; ведь сначала нужно дать им половину рыбы, а затем удочку. Мы повысим минимальную зарплату до европейского уровня, чтобы население имело хотя бы какие-то средства для сбережений и потребления."
 HUN_crush_socialist_faction: "Подавить левое крыло"
 HUN_crush_socialist_faction_desc: "Левое крыло партии долгое время плетёт заговоры, чтобы сместить нас и снова растратить весь государственный бюджет. Они просто не понимают, что политика бесконечных расходов разрушит Венгрию и погрузит её в долги. Мы будем вынуждены применять более строгие методы внутри политики партии, чтобы предотвратить внутреннее восстание."
 HUN_package_neoliberal_reform: "Красно-окрашенные неолиберальные реформы"
 HUN_package_neoliberal_reform_desc: "Благодаря внутрипартийному консенсусу, мы наконец сможем провести столь необходимый пакет экономических реформ через Национальное собрание, без которого наша политика до сих пор была бессмысленна. Мы снизим государственное регулирование, создадим условия для дальнейшей приватизации и полностью исключим любые инструменты для массовой национализации. Мы создадим новую систему медицинского и социального страхования через суверенные внебюджетные фонды для снижения государственных расходов. При этом все эти реформы не разрушат систему благосостояния, а сделают её более эффективной и менее затратной. Левое крыло оппозиции называет это пакетом красно-окрашенных неолиберальных реформ, но мы не против такого названия."
 HUN_reform_midicine_funding_scheme: "Ввести новую систему фондов здравоохранения"
 HUN_reform_midicine_funding_scheme_desc: "В рамках пакета экономических реформ будет создан внебюджетный фонд медицинского страхования. Фонду будет разрешено инвестировать в низко-рисковые активы для увеличения своих средств, а также он будет получать средства из бюджета. Все эти средства пойдут на покрытие затрат на бесплатное медицинское страхование и субсидирование платных медицинских услуг."
 HUN_commercialise_government_property: "Коммерциализация государственной собственности"
 HUN_commercialise_government_property_desc: "План преобразования государственной собственности является краеугольным камнем экономической реформы. Государство реорганизует государственные предприятия в акционерные общества с участием государства, а также будет проведена финальная крупная приватизация убыточных активов. Всё это должно принести дополнительный доход и повысить эффективность управления собственностью."
 HUN_anti_inflation_policy: "Антиинфляционная политика"
 HUN_anti_inflation_policy_desc: "Бегущая инфляция угрожает экономической стабильности венгерских семей. Мы будем проводить строгую монетарную и фискальную политику, чтобы контролировать инфляцию и защитить покупательную способность наших граждан."
 HUN_increase_corp_tax: "Ввести корпоративный налог"
 HUN_increase_corp_tax_desc: "Мы создали отличные условия для развития бизнеса; теперь пришло время вернуть долг. Мы введём налог на многонациональные корпорации для дополнительного пополнения бюджета, но этот налог не обременит их деятельность, а его ставка будет приемлемой для корпораций. Таким образом, мы найдём источники дохода и успокоим инвесторов."
 HUN_support_euro_federalism: "Поддержка еврофедерализма"
 HUN_support_euro_federalism_desc: "Европейская интеграция должна углубляться. Мы будем поддерживать шаги к более федеративной Европе, считая, что большое единство принесёт пользу всем европейцам, включая венгров, через общее благосостояние и безопасность."
 HUN_financial_capital: "Финансовая столица Центральной Европы"
 HUN_financial_capital_desc: "Будапешт может стать ведущим финансовым центром Центральной Европы. Мы будем развивать финансовый сектор, привлекать международные банки и инвестиционные компании и позиционировать Венгрию как экономический центр региона."
 HUN_support_small_medium_business: "План поддержки бизнеса"
 HUN_support_small_medium_business_desc: "Малые и средние предприятия - основа нашей экономики. Мы предоставим целенаправленную поддержку, включая налоговые льготы, кредиты и бизнес-сервисы, чтобы помочь этим предприятиям расти и создавать рабочие места."
 HUN_true_third_way: "Третий путь для Венгрии"
 HUN_true_third_way_desc: "Ошибка реформаторов 1990-х заключалась в слишком агрессивных реформах, а ошибка левых - в уверенности, что долгосрочное развитие благосостояния граждан компенсирует чрезмерный дефицит. Все эти ошибки отсутствуют на нашем пути; мы полностью поддерживаем рыночные изменения и не против гарантирования благосостояния граждан, но считаем, что всё должно происходить с мерой и реализмом. Найти третий путь в экономике необходимо в текущих условиях, и наше правительство отлично справляется с этим."

 #MSZP Events
 hungary_hsp.0.t: "Назначение правительства [HUN.GetLeader]"
 hungary_hsp.0.d: "Национальное собрание утвердило назначение правительства MSZP под руководством [HUN.GetLeader], и теперь восстановление страны полностью в его руках. Правительство должно проложить курс на дальнейшее экономическое восстановление после реформ 90-х, а также избежать полного хаоса, чтобы Фидес и Орбан снова не вернулись к власти. Присоединение к Европейскому союзу также остаётся важной задачей для [HUN.GetLeader], что было частью программы Социалистической партии. Новое правительство должно также сбалансировать интересы различных платформ внутри партии для обеспечения стабильности."
 hungary_hsp.0.a: "Второй шанс для MSZP!"

 hungary_hsp.1.t: "Парламентские битвы"
 hungary_hsp.1.d: "Развернулась настоящая борьба за комитеты между парламентской оппозицией и коалицией. Вместе с нашими союзниками мы не позволили орбанистам занять вице-председательство в комитете по национальной безопасности и председательство в экономическом комитете. Хотя нам не удалось занять руководящие позиции во всех комитетах, мы всё же предотвратили захват Фидес и их прислужниками самых важных позиций."
 hungary_hsp.1.a: "Мы выиграли битву, но не войну"

 hungary_hsp.2.t: "Референдум о вступлении в ЕС"
 hungary_hsp.2.d: "Народ Венгрии высказался на референдуме по членству в Европейском союзе. Большинство проголосовало за присоединение к ЕС, признавая экономические и политические преимущества членства. Это решение радикально изменит отношения Венгрии с Европой и откроет новые возможности для торговли, инвестиций и сотрудничества."
 hungary_hsp.2.a: "Мы вступаем в европейскую семью"

 hungary_hsp.3.t: "Правительство Гюрчсаньи"
 hungary_hsp.3.d: "Нестабильность внутри Социалистической партии привела к победе Ференца Гюрчсаньи, одного из самых контроверсионных членов MSZP, на внутрипартийных выборах. Как один из самых богатых людей Венгрии и бывший бизнесмен, его фигура подвергалась жесткой критике со стороны коллег по партии, а его идеи особенно спорны. Платформа Гюрчсаньи внутри MSZP поддерживает политику жёсткой экономии и сокращение социальных расходов для достижения баланса бюджета, а его сторонники также выступают с точки зрения неолиберальной политики. Голосование в собрании прошло гладко, и теперь Гюрчсаньи имеет шанс полностью перестроить венгерскую экономику и установить баланс бюджета."
 hungary_hsp.3.a: "Гюрчсаномика начинается!"

 hungary_hsp.4.t: "Левые фракции укрепляют контроль"
 hungary_hsp.4.d: "Коалиция, состоящая из Левой платформы коалиции, Социалистической платформы и Ассоциации за социально-демократические ценности внутри MSZP, сумела закрепить лидерство партии и совета. Вместо того чтобы следовать более радикальным реформам, предложенным Ференцем Гюрчсаньи, партия выбрала сохранение традиционного социально-демократического подхода к постепенным реформам, социальному благосостоянию и осторожному экономическому управлению. Гюрчсаньи с Демократической коалицией покинул партию после поражения, и его крыло прекратило существование. Теперь MSZP действительно можно назвать левой партией."
 hungary_hsp.4.a: "Традиция превалирует"

 hungary_hsp.5.t: "Гюрчсаньи вводит жёсткую экономию"
 hungary_hsp.5.d: "Правительство Гюрчсаньи объявило серию жёстких мер для устранения дефицита бюджета и экономической нестабильности Венгрии. Эти сложные решения включают сокращение расходов, повышение налогов и сокращение государственных услуг. Хотя они необходимы для финансовой стабильности, эти меры безусловно создадут напряжение в популярности правительства и испытают терпение населения."
 hungary_hsp.5.a: "Мы должны выжить"

 hungary_hsp.6.t: "'Мы облажались! Не мало, а много!'"
 hungary_hsp.6.d: "В слитой речи в городе Ёсёд премьер-министр Ференц Гюрчсаньи признался, что его правительство лгало об экономике и ничего значимого не сделало в должности. Его цитата 'Nyilvánvalóan végighazudtuk az utolsó másfél-két évet' стала вирусной по всей Венгрии, это откровение шокировало нацию и вызвало возмущение. Этот скандал серьёзно повредил авторитету правительства и может вызвать массовые протесты."
 hungary_hsp.6.a: "Это катастрофа!"

 hungary_hsp.61.t: "Всеобщие протесты"
 hungary_hsp.61.d: "После скандала с речью в Ёсёд вспыхнули массовые протесты по всей Венгрии. Десятки тысяч граждан вышли на улицы, требуя отставки премьер-министра Гюрчсаньи и выражая свой гнев по поводу лжи правительства. Протесты парализовали Будапешт и не показывают признаков ослабления. Правительство сталкивается с серьёзным кризисом легитимности."
 hungary_hsp.61.a: "Народ зол!"

 hungary_hsp.7.t: "Несанкционированные полномочия"
 hungary_hsp.7.d: "Подход Гюрчсаньи к управлению довольно спорный; он включает использование всевозможных легальных лазеек и пробелов в законе для ускорения принятия экстренных реформ. Правительству придётся объявить чрезвычайное положение и обойти некоторые ограничения, созданные системой сдержек и противовесов."
 hungary_hsp.7.a: "Нужно действовать решительно"

 hungary_hsp.8.t: "Венгрия запрашивает экономическое соглашение с Россией"
 hungary_hsp.8.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с предложением о комплексном экономическом соглашении. Будапешт стремится укрепить торговые отношения, обеспечить энергоснабжение и привлечь инвестиции из России. Это соглашение значительно углубит экономические связи Венгрии с Востоком, потенциально уравновешивая её западную ориентацию. Принять предложение?"
 hungary_hsp.8.a: "Принять экономическое соглашение"
 hungary_hsp.8.b: "Отклонить предложение"

 hungary_hsp.9.t: "Экономическое соглашение с Россией подписано"
 hungary_hsp.9.d: "Россия согласилась с нашим предложением о комплексном экономическом соглашении. Это партнёрство принесёт значительные выгоды: улучшение торговых отношений, гарантированное энергоснабжение и рост российских инвестиций в Венгрию. Соглашение укрепляет позицию страны как моста между Востоком и Западом и открывает экономические возможности для наших граждан."
 hungary_hsp.9.a: "Это укрепляет нашу экономику"

 hungary_hsp.10.t: "Россия отклоняет наше предложение"
 hungary_hsp.10.d: "К сожалению, Россия отклонила наше предложение об экономическом соглашении. Хотя это разочаровывает, мы понимаем, что международные отношения требуют взаимного интереса и правильного времени. Мы продолжим искать возможности для экономического сотрудничества с Россией и другими международными партнёрами."
 hungary_hsp.10.a: "Мы найдём другие возможности"

 hungary_hsp.11.t: "Венгрия запрашивает экономическое соглашение с Германией"
 hungary_hsp.11.d: "[HUN.GetNameDef] обратился к [This.GetNameDef] с предложением о комплексном экономическом соглашении. Будапешт стремится укрепить торговые отношения и привлечь инвестиции из Германии, одной из крупнейших экономик Европы. Это соглашение углубит интеграцию Венгрии в европейский рынок и создаст возможности для экономического роста. Принять предложение?"
 hungary_hsp.11.a: "Принять экономическое соглашение"
 hungary_hsp.11.b: "Отклонить предложение"

 hungary_hsp.12.t: "Экономическое соглашение с Германией подписано"
 hungary_hsp.12.d: "Германия согласилась с нашим предложением о комплексном экономическом соглашении. Партнёрство принесёт значительные выгоды: улучшение торговых отношений, рост немецких инвестиций в Венгрию и большую интеграцию с европейской экономикой. Соглашение укрепляет нашу позицию внутри ЕС и открывает экономические возможности для граждан."
 hungary_hsp.12.a: "Это укрепляет нашу экономику"

 hungary_hsp.13.t: "Германия отклоняет наше предложение"
 hungary_hsp.13.d: "К сожалению, Германия отклонила наше предложение об экономическом соглашении. Хотя это разочаровывает, мы понимаем, что международные отношения требуют взаимного интереса и правильного времени. Мы продолжим искать возможности для экономического сотрудничества с Германией и другими европейскими партнёрами."
 hungary_hsp.13.a: "Мы найдём другие возможности"

 hungary_hsp.14.t: "Поправки к конституции"
 hungary_hsp.14.d: "Вместо проведения масштабного референдума мы решили принять необходимые поправки через Национальное собрание. Нам удалось обеспечить необходимое большинство, и теперь справедливая система сдержек и противовесов будет официально закреплена в конституции, чётко определена система разделения властей, а новые демократические институты официально признаны."
 hungary_hsp.14.a: "По-настоящему народная конституция"

 hungary_hsp.15.t: "Ференц под давлением"
 hungary_hsp.15.d: "Премьер-министр Ференц Гюрчсаньи испытывает растущее давление со стороны партии и общества после скандала с речью в Ёсёд и последовавших протестов. Растёт количество требований его отставки, и его позиция становится всё более шаткой. Партии предстоит решить, продолжать ли поддерживать его или искать новое руководство для восстановления доверия общественности."
 hungary_hsp.15.a: "Гюрчсаньи должен уйти в отставку"
 hungary_hsp.15.b: "Мы ещё не закончили"

 hungary_hsp.16.t: "Вотум недоверия"
 hungary_hsp.16.d: "Отказ Гюрчсаньи уходить в отставку вызвал бунт среди депутатов нашего фракционного крыла. Повстанцы объявили вотум недоверия правительству Гюрчсаньи, а парламентская оппозиция также поддержала голосование. Правительство находится на грани краха; если достаточное число повстанцев присоединится к нашей коалиции, это конец Гюрчсаньи."
 hungary_hsp.16.a: "Правительство падает"
 hungary_hsp.16.b: "Мы переживаем голосование"

 hungary_hsp.22.t: "Венгрия приглашает нас войти в еврозону"
 hungary_hsp.22.d: "Вишеградская группа - это организация, созданная Польшей, Венгрией и Чехословакией, целью которой было быстрое включение всех членов группы в Европейский союз. Теперь же дверь ЕС открыта, и мы готовы войти. Осталась лишь небольшая формальность: присоединение к еврозоне. Это решение может повлиять на наш суверенитет и экономику, но с другой стороны, это ещё один шаг к европейской интеграции, который нельзя упустить."
 hungary_hsp.22.a: "Принимаем евро!"
 hungary_hsp.22.b: "Не будем рисковать суверенитетом нашей экономики"

 hungary_hsp.23.t: "[FROM.GetName] присоединяется к еврозоне"
 hungary_hsp.23.d: "[FROM.GetName] присоединяется к еврозоне в соответствии с целями создания Вишеградской группы. Мы на шаг ближе к еврооптимизму."
 hungary_hsp.23.a: "Добро пожаловать!"

 hungary_hsp.24.t: "[FROM.GetName] отказывается присоединяться к еврозоне"
 hungary_hsp.24.d: "[FROM.capital.GetName] отказывается от евро. Они считают, что пока не готовы к этому шагу, поскольку евро представляет угрозу их национальной валюте и, следовательно, суверенитету их экономики."
 hungary_hsp.24.a: "Они не понимают, что теряют"

 hungary_hsp.17.t: "Только вы можете позаботиться о себе!"
 hungary_hsp.17.d: "Правительство ввело новые политики, подчеркивающие индивидуальную и общественную ответственность за благосостояние. При сохранении основных социальных гарантий, большая ответственность перекладывается на граждан и сообщества за управление своими делами. Такой подход поощряет самостоятельность, но может создать нагрузку для тех, кто нуждается в поддержке больше всего."
 hungary_hsp.17.a: "Мы должны продвигать самостоятельность"

 hungary_hsp.18.t: "[HUN.GetLeader] разрушает левое крыло"
 hungary_hsp.18.d: "После переизбрания [HUN.GetLeader] лидером партии, он произнёс речь, в которой обвинил оппонентов своих политик в дестабилизации партии и попытках подорвать деятельность правительства. Совет партии, состоящий из его сторонников, решил исключить членов Левой коалиционной платформы и Социалистической платформы, а также ликвидировать систему платформ в партии, полностью уничтожив левое крыло партии. Исключённые члены сразу выступили против внутрипартийных чисток и осудили [HUN.GetLeader]. Теперь сторонники курса [HUN.GetLeader] полностью контролируют партию, что откроет путь к более радикальным реформам."
 hungary_hsp.18.a: "Партия теперь едина"

 hungary_hsp.19.t: "Речь о единой Европе"
 hungary_hsp.19.d: "[HUN.GetLeader] выступил с важной речью перед парламентом ЕС, призывая к углублённой европейской интеграции и единству. В речи подчёркивается приверженность Венгрии европейским ценностям, сотрудничеству и общему процветанию. Речь получила положительный отклик от других стран-членов ЕС, укрепляя позицию Венгрии внутри Европейского союза."
 hungary_hsp.19.a: "Мы - европейцы!"

 hungary_hsp.20.t: "Город Будапешт"
 hungary_hsp.20.d: "В рамках программы реформ [HUN.GetLeader], Будапешт был выделен как особая экономическая и развивающаяся зона с значительными инвестициями в инфраструктуру и модернизацию. Столица получит особое внимание, чтобы стать витриной прогресса Венгрии и центром притяжения для международных инвестиций и туризма. Поскольку [HUN.GetLeader] рассматривает план «Город Будапешт» как свой самый амбициозный проект на данный момент, он имеет особое значение для правительства. В связи с этим было выделено значительное финансирование для реализации этой инициативы."
 hungary_hsp.20.a: "Будапешт будет сиять"

 hungary_hsp.21.t: "Венгерский третий путь"
 hungary_hsp.21.d: "Видение [HUN.GetLeader] наконец-то оправдало себя; Министерство экономики сообщило о росте ВВП на беспрецедентные для Венгрии показатели, а статистика министерства стала главным подтверждением правильности экономической стратегии [HUN.GetLeader]. После доклада министерства в Ассамблее премьер-министр выступил с речью, заявив, что Венгрия стала примером того, как строить экономику в XXI веке. Синтез неоконсерватизма и кейнсианства, который мы называем третьим путём, оказался эффективным в эпоху глобализации и триумфа рынка. В конце [HUN.GetLeader] призвал все парламентские фракции перестать паниковать и вместо пустых слов и действий смотреть в лицо реальности и убедиться в правильности пути правительства."
 hungary_hsp.21.a: "Это наш путь вперёд!"

 hungary_hsp.25.t: "Одобрена реформа нового трудового кодекса"
 hungary_hsp.25.d: "Национальная ассамблея приняла новую редакцию трудового кодекса. Включены положения о регулировании прав работников при заключении равных трудовых контрактов, а также закреплены права на создание профсоюзов и проведение забастовок."
 hungary_hsp.25.a: "Права работников защищены"

 hungary_hsp.26.t: "Правительство заботится о вас"
 hungary_hsp.26.d: "Премьер-министр [HUN.GetLeader] обратился к парламенту, заявив, что государство под управлением Социалистической партии никогда не оставит простых граждан в беде, а защита населения от кризисов - его первейшая обязанность. [HUN.GetLeader] также раскритиковал правую оппозицию, заявив, что они никогда не заботились о гражданах страны."
 hungary_hsp.26.a: "Правительство действительно заботится"

 hungary_hsp.27.t: "Правительство вводит план делегирования полномочий"
 hungary_hsp.27.d: "Правительство [HUN.GetLeader] объявило, что в рамках конституционной реформы представило Ассамблее план новой системы местного самоуправления. План предусматривает передачу некоторых полномочий по финансовому распределению и правоохранению трём новым советам, ответственным за восточную, западную и северную части Венгрии. Эти полномочия также будут переданы отдельно Будапешту. Внутри этих зон будут более мелкие муниципалитеты. Хотя система может показаться громоздкой, на практике она будет достаточно эффективной для обеспечения сбалансированного и локального развития."
 hungary_hsp.27.a: "Бюрократическая революция!"

 hungary_hsp.28.t: "Дело 'Йоббик'"
 hungary_hsp.28.d: "Благодаря новому закону против угнетения, официально начато расследование против партии 'Йоббик'. Руководство партии обвиняется в пропаганде насилия и нацизма, а также в распространении расовой ненависти. Правые критики обвиняют правительство в политических преследованиях, но само существование такой партии уже представляет угрозу демократии. Мы не позволим сторонникам расизма и угнетения прийти к власти и разрушить венгерскую демократию."
 hungary_hsp.28.a: "Нацизм и национализм в Венгрии недопустимы!"

 hungary_hsp.29.t: "Социалисты в словах и делах"
 hungary_hsp.29.d: "На конгрессе MSZP [HUN.GetLeader] заявил, что теперь Социалистическая партия может с гордостью носить своё название, так как действия партии демонстрируют приверженность идеям социальной справедливости, социальной демократии и честного рынка. Благодаря политике правительства и коллективной сплочённости партии, страна достигла огромного экономического успеха и стала примером того, как перейти от дикого капитализма к свободному и равному обществу."
 hungary_hsp.29.a: "Ура"

 hungary_hsp.30.t: "Только вы можете позаботиться о себе"
 hungary_hsp.30.d: "[HUN.GetLeader] выступил с речью, в которой заявил, что, хотя государство будет стремиться поддерживать благосостояние своих граждан, граждане должны помнить, что если государство окажется в плохой ситуации, оно не сможет прийти к ним на помощь в нужный момент. Поэтому граждане должны в первую очередь заботиться о себе, а не полагаться на помощь государства. Хотя речь была воспринята неоднозначно, венгерские банки зафиксировали всплеск открытия депозитов."
 hungary_hsp.30.a: "Возможно, он всё же прав"

 hungary_hsp.32.t: "'Социальный' референдум"
 hungary_hsp.32.d: "Фидес нашёл способ противостоять нашей политике. Орбан и его сторонники инициировали референдум с тремя вопросами:\nСогласны ли вы, что стационарное лечение не должно облагаться ежедневной платой с 1 января года, следующего за проведением референдума по этому вопросу?\nСогласны ли вы, что за визит к терапевту, стоматологу и амбулаторному специалисту не должна взиматься плата с 1 января года, следующего за проведением референдума по этому вопросу?\nСогласны ли вы, что студенты, обучающиеся в государственном вузе на бюджетной основе, не должны платить взнос за обучение?\nЭти вопросы напрямую угрожают нашей политике экономии, и если на все вопросы будет дан ответ 'да', наше правительство можно списать. Пропаганда 'трёх да' набирает обороты, и если мы не мобилизуем все ресурсы, референдум будет проигран."
 hungary_hsp.32.a: "'Три да' победили"
 hungary_hsp.32.b: "Явка ниже 50%. Референдум недействителен"

 hungary_hsp.33.t: "Восход Демократической коалиции"
 hungary_hsp.33.d: "Гюрчсаньи и его платформа 'Демократическая коалиция' объявили о выходе из MSZP, заявив, что социалисты провалились, и Венгрии нужна новая либеральная партия. На партийном конгрессе он заявил, что его новая 'Демократическая коалиция' станет самой демократичной партией Венгрии, предполагая внутренние выбора и децентрализацию партийного аппарата. Гюрчсаньи пытается убедить симпатизирующих депутатов MSZP покинуть партию и создать фракцию вместе с ним в Ассамблее, а также заложить основу для будущего финансирования партии. Только время покажет жизнеспособность его проекта."
 hungary_hsp.33.a: "Самая европейская партия!"

