l_russian:
 eon_mediation_terms_category:0 "Пересмотр условий посредничества"
 eon_mediation_terms_category_desc:0 "Предложите конкретную тему обсуждений и новый срок мандата на 30, 60 или 90 дней. Посредник и противник должны отдельно согласиться. Текущая тема и срок не меняются до окончательного согласия; предложение не приостанавливает их действие. Предложения бесплатны. Эти процедурные условия не создают перемирия, права гуманитарного доступа или военных обязательств."
 eon_cancel_mediation_terms:0 "Отменить предложенные условия посредничества"
 eon_cancel_mediation_terms_desc:0 "Отозвать пересмотр без ответа. Его больше нельзя согласовать, но первоначальный ответ получателя необходимо закрыть. Ранее согласованный мандат продолжает действовать по своим условиям, если ещё действителен. Отмена пересмотра не завершает этот мандат и не меняет войну или соглашения."
 eon_mediation_terms_cancelled_desc:0 "Предложенный пересмотр был отозван до окончательного согласия. Он не может изменить принятую тему или срок. Закройте первоначальный ответ, чтобы снять оставшееся резервирование пересмотра. Ранее согласованный мандат продолжает действовать, если ещё действителен."
 eon_mediation_terms_stale_desc:0 "Этот старый ответ больше не соответствует доступному пересмотру с первоначальными участниками, этапом, темой и сроком. Он не может изменить текущий мандат или другое предложение. Закройте старый ответ. Любой ранее согласованный мандат действует лишь пока выполняются его собственные условия."
 eon_mediation_terms_accept:0 "Согласиться на эти точные процедурные условия"
 eon_mediation_terms_decline:0 "Отклонить или закрыть предложенный пересмотр"
 eon_mediation_terms_ack:0 "Понятно"
 eon_mediation_terms.30.t:0 "Посредник согласился на предложенный пересмотр"
 eon_mediation_terms.30.desc:0 "Посредник согласился на свою часть пересмотра. Для указанного противника был подготовлен отдельный запрос. Первое согласие не изменило принятую тему или срок. Предложение не приостанавливает истечение действующего мандата."
 eon_mediation_terms.31.t:0 "Предложенные условия отклонены"
 eon_mediation_terms.31.desc:0 "Один из получателей отклонил предложенную тему и срок. Пересмотр не был применён. Ранее согласованный мандат действует по прежним условиям, если ещё действителен. Отказ не приносит выгод или наказаний."
 eon_mediation_terms.32.t:0 "Предложенные условия больше недействительны"
 eon_mediation_terms.32.desc:0 "Этот ответ не мог разрешить пересмотр с первоначальными участниками, этапом, темой, сроком или текущими условиями мандата. Новые условия не были применены. Любой ранее согласованный мандат действует лишь если выполняются его собственные условия."
 eon_mediation_terms.33.t:0 "Предложенные условия отменены"
 eon_mediation_terms.33.desc:0 "Пересмотр был отозван либо его первоначальный отозванный ответ был закрыт. Его больше нельзя согласовать. Оставшийся первоначальный ответ без решения необходимо закрыть, чтобы снять резервирование. Отмена пересмотра не меняет ранее согласованный мандат, который действует, если ещё действителен."
 eon_mediation_terms.34.t:0 "Новые условия переговоров согласованы"
 eon_mediation_terms.34.desc:0 "Посредник и указанный противник отдельно согласились на одну и ту же предложенную тему и срок. Новая тема была применена для трёх участников, а новый срок переговоров начался с окончательного согласия противника. Это процедурное соглашение не создало перемирия, мира, права гуманитарного доступа или военных обязательств."
 eon_mediation_terms.35.t:0 "Предложение условий без ответа закрыто"
 eon_mediation_terms.35.desc:0 "Пересмотр без ответа истёк либо больше не мог быть связан с первоначальным мандатом. Новые условия не были применены. Пары ответов инициатор — посредник и посредник — противник закрыты для дальнейших пересмотров условий в этой кампании; обычные новые мандаты посредничества доступны по своим условиям. Любой прежний согласованный мандат действует лишь если ещё действителен."
 eon_mediation_terms_deescalation_30:0 "Предложить обсуждения деэскалации на 30 дней"
 eon_mediation_terms_deescalation_30_desc:0 "Предложить обсуждения деэскалации с [?eon_mediation_party_b.GetName] через [?eon_mediation_mediator.GetName] с новым мандатом на 30 дней от окончательного согласия противника. Посредник и противник должны согласиться отдельно. Предложение бесплатно и не меняет текущую тему или срок. Действующий мандат может истечь, пока они решают. Эти условия не создают перемирия или мира."
 eon_mediation_terms_mediator_deescalation_30_title:0 "Обсуждения деэскалации: предложен мандат на 30 дней"
 eon_mediation_terms_mediator_deescalation_30_desc:0 "[From.GetName] предлагает обсуждения деэскалации с [?eon_mediation_terms_b.GetName] и новый мандат на 30 дней от окончательного согласия противника. Если мы согласимся, противник должен решить отдельно. Принятая тема и срок не меняются до обоих согласий; предложение не приостанавливает их действие. Эти условия не создают перемирия или мира."
 eon_mediation_terms_opponent_deescalation_30_title:0 "Обсуждения деэскалации: предложен мандат на 30 дней"
 eon_mediation_terms_opponent_deescalation_30_desc:0 "[From.GetName] согласилось выступить посредником по предложению [?eon_mediation_terms_a.GetName]: обсуждения деэскалации и новый мандат на 30 дней от нашего окончательного согласия. Наше отдельное согласие заменит принятую тему и начнёт новый срок в 30 дней. Мы можем отказаться; прежний мандат действует, если ещё действителен. Эти условия не создают перемирия или мира."
