l_russian:
 #Focuses
 WAG_strength_1: "Фундамент воли"
 WAG_strength_1_desc: "Наследие «Оркестра» тяжким грузом лежит на плечах нового государства. Но именно из этой тьмы мы должны выковать новую волю к существованию. Первые шаги всегда самые трудные, но без них нет движения вперёд. Пришло время доказать миру, что Вагнерия - не очередная авантюра, а государство, способное на великие свершения."
 WAG_strength_2: "Наследие Оркестра"
 WAG_strength_2_desc: "Музыка войны течёт в крови каждого ветерана. Наши традиции - это не парады и марши, а реальный боевой опыт, оплаченный кровью. Мы чтим павших и учимся у живых. Эта связь поколений делает нас сильнее, превращая разрозненные отряды в единый механизм возмездия."
 WAG_strength_3: "Сердце тьмы"
 WAG_strength_3_desc: "Африка меняет людей. Те, кто выживает здесь, уже никогда не будут прежними. Мы приняли тьму этого континента, сделали её частью себя. Теперь мы не просто наёмники - мы порождение этого мира, его хищники на вершине пищевой цепи."
 WAG_strength_4: "Рождение Вагнерии"
 WAG_strength_4_desc: "Новое государство рождается из пепла и хаоса. Вагнерия - уникальный эксперимент на карте мира. Государство, созданное воинами для воинов. Наши законы суровы, но справедливы. Наша власть основана не на бюрократии, а на уважении к силе и воинскому братству."
 WAG_recruit_nationalists: "Русский марш"
 WAG_recruit_nationalists_desc: "Среди русских националистов есть те, кто верит в особую миссию России в Африке. Они видят в нас авангард русского мира, защитников традиционных ценностей. Их идеологический пыл и готовность сражаться за идею делают их опасным оружием."
 WAG_recruit_serbia: "Балканская сталь"
 WAG_recruit_serbia_desc: "Сербские добровольцы имеют долгую историю службы в ЧВК по всему миру. Их воинская культура, дисциплина и боевой опыт делают их ценным подкреплением."
 WAG_recruit_belarus: "Легион Калиновского"
 WAG_recruit_belarus_desc: "Белорусские ополченцы, покинувшие родину после политических потрясений, ищут новый дом. Мы предлагаем им не только убежище, но и возможность продолжить борьбу за свои идеалы."
 WAG_recruit_syria: "Пустынные лисы"
 WAG_recruit_syria_desc: "Ветераны гражданской войны в Сирии закалены в боях против террористов. Их опыт городских боёв и контрпартизанских операций бесценен для Африки."
 WAG_recruit_afghanistan: "Наследие Панджшера"
 WAG_recruit_afghanistan_desc: "Афганские моджахеды и бывшие военнослужащие обладают уникальным опытом партизанской войны в горах. Их тактика может быть адаптирована к ландшафтным условиям Африки."
 WAG_recruit_veterans: "Ветераны СВО"
 WAG_recruit_veterans_desc: "Специальная военная операция породила поколение ветеранов, прошедших горнило современной войны. Тысячи профессиональных солдат, у которых закончились контракты, ищут применение своим навыкам."
 WAG_recruit_latin_america: "Амазонские революционеры"
 WAG_recruit_latin_america_desc: "Бывшие партизаны, члены левых движений и просто авантюристы из Латинской Америки едут в Африку. Вагнерия предлагает им стабильный доход и возможность легально применять свои «навыки»."
 WAG_recruit_asia: "Тени джунглей"
 WAG_recruit_asia_desc: "Наёмники из Юго-Восточной Азии имеют репутацию безжалостных и эффективных бойцов. Их опыт джунглей и малой войны может быть использован в лесах Центральной Африки."
 WAG_recruit_international: "Легионеры удачи"
 WAG_recruit_international_desc: "Сербы, сирийцы, афганцы, ливийцы, латиноамериканцы... По всему миру есть люди, для которых война стала домом. Мы открываем двери профессионалам любого происхождения."
 WAG_mercenary_army_spirit: "Профессионалы"
 WAG_mercenary_army_spirit_desc: "Мы не используем мобилизацию и призыв. Наша армия состоит исключительно из контрактников - профессионалов, для которых военное дело - главное призвание."
 WAG_legacy_tactics: "Оркестр войны"
 WAG_legacy_tactics_desc: "Мы идём путём, проверенным кровью в Донбассе, Сирии и Ливии. Массированное применение артиллерии, тяжёлой пехоты и системное перемалывание противника. Это не красивая война - это война на уничтожение."
 WAG_urban_assault: "Штурмовики"
 WAG_urban_assault_desc: "Уличный бой - это ад, в котором выживают только лучшие. Мы создаём специализированные штурмовые подразделения, обученные зачистке укрепрайонов, домов и подземелий."
 WAG_artillery_duel: "Боги войны"
 WAG_artillery_duel_desc: "Артиллерия - наш главный аргумент. Мы не жалеем снарядов, времени и ресурсов для создания мощнейшей артиллерийской компоненты в регионе."
 WAG_siege_masters: "Симфония стали"
 WAG_siege_masters_desc: "Мы стали мастерами осад. Долгие изнурительные операции, полное окружение, систематическое уничтожение инфраструктуры и морального духа противника."
 WAG_alternative_tactics: "Тень в пустыне"
 WAG_alternative_tactics_desc: "Война меняется. Тяжёлая артиллерия и лобовые атаки уходят в прошлое. Мы выбираем путь тени - гибридная война, информационные операции, сетецентрическая война."
 WAG_hybrid_warfare: "Сетецентрическая война"
 WAG_hybrid_warfare_desc: "Малые мобильные группы, дроны-камикадзе, спутниковая разведка, цифровая связь. Наша армия становится сетью, где каждый солдат видит всё поле боя."
 WAG_information_ops: "Цифровой фронт"
 WAG_information_ops_desc: "Информационная война часто важнее реальной. Наши хакеры взламывают системы ПВО и связи. Наши пропагандисты создают фейки и дестабилизируют обстановку."
 WAG_shadow_government: "Глубинное государство"
 WAG_shadow_government_desc: "Вагнерия становится не просто страной, а теневым правительством Африки. Мы контролируем потоки оружия, ресурсов и влияния. Наши люди есть в каждой значимой структуре континента."
 WAG_establish_companies: "Создание государственных корпораций"
 WAG_establish_companies_desc: "Вагнерия выросла из военной компании в полноценное государство. Пришло время создать государственные корпорации, которые будут управлять экономикой, добывать ресурсы и снабжать армию."
 WAG_heavy_industry_companies: "Развитие тяжёлой промышленности"
 WAG_heavy_industry_companies_desc: "Тяжёлая промышленность - основа военной мощи. Мы создаём концерны, занимающиеся производством оружия, добычей ресурсов, энергетикой и логистикой."
 WAG_light_industry_companies: "Развитие лёгкой промышленности"
 WAG_light_industry_companies_desc: "Лёгкая промышленность обеспечивает гражданские нужды и создаёт рабочие места. Мы развиваем частные военные услуги, торговлю алмазами, строительство, сельское хозяйство и телекоммуникации."
 WAG_media_empire: "Африканский медиахолдинг"
 WAG_media_empire_desc: "Кому принадлежит информация - тот владеет миром. Мы создаём медиаимперию, которая будет формировать общественное мнение по всей Африке. Телеканалы, радиостанции, газеты, онлайн-порталы - всё под нашим контролем."
 WAG_african_broadcasting: "Голос Вагнерии"
 WAG_african_broadcasting_desc: "Наш общеафриканский телеканал вещает на десятках языков. Мы показываем «правильную» картину мира, создавая образ Вагнерии как защитника и миротворца."
 WAG_social_media_influence: "Цифровой Орвелл"
 WAG_social_media_influence_desc: "Армии ботов, фейковые аккаунты, алгоритмические манипуляции. Мы контролируем дискуссии в соцсетях, создаём тренды и уничтожаем неудобные нарративы."
 WAG_info_hegemon: "Повелитель эфира"
 WAG_info_hegemon_desc: "Наше информационное доминирование неоспоримо. Ни одно значимое событие в Африке не происходит без нашего освещения. Мы формируем повестку, создаём героев и врагов."
 WAG_cyber_command: "Киберкомандование Вагнерии"
 WAG_cyber_command_desc: "Киберпространство - новый фронт войны. Мы создаём единое командование для координации цифровых операций. Взломы, кибератаки, защита наших сетей - всё под единым руководством."
 WAG_hacktivist_recruitment: "Легион хактивистов"
 WAG_hacktivist_recruitment_desc: "Хактивисты со всего мира присоединяются к нашему делу. Одни верят в нашу идеологию, другие просто ищут заработок. Мы предоставляем им платформу для «борьбы за справедливость»."
 WAG_critical_infrastructure: "Цифровой блицкриг"
 WAG_critical_infrastructure_desc: "Наши хакеры нашли уязвимости в критической инфраструктуре врага. Электросети, водные системы, транспорт, связь - всё может быть отключено нажатием кнопки."
 WAG_digital_warfare: "Кибервойна"
 WAG_digital_warfare_desc: "Мы полностью готовы вести кибервойну против враждебных режимов. DDoS-атаки, программы-вымогатели, утечки данных, дезинформация - весь арсенал современной цифровой войны."
 WAG_influence_africa: "Африканский ренессанс"
 WAG_influence_africa_desc: "Наше влияние в регионе достигло критической массы. Мы не просто присутствуем - мы диктуем условия. Соседние государства либо сотрудничают с нами, либо пытаются сопротивляться."
 WAG_war_cameroon: "Война с Камеруном"
 WAG_war_cameroon_desc: "Камерун богат ресурсами, но его армия слаба и деморализована. Наша разведка указывает на возможность быстрой военной кампании."
 WAG_war_chad: "Война с Чадом"
 WAG_war_chad_desc: "Чад - ключ к Сахелю. Хаос в стране и слабость центрального правительства делают его лёгкой добычей. Контроль над Чадом даст нам доступ к важным торговым путям."
 WAG_war_congo: "Война с Конго"
 WAG_war_congo_desc: "Республика Конго - наши ворота в Центральную Африку. Французское влияние здесь ослабевает, и мы можем заполнить вакуум власти."
 WAG_war_drc: "Война с ДРК"
 WAG_war_drc_desc: "Демократическая Республика Конго - колосс на глиняных ногах. Кобальт, медь, алмазы, золото - всё ждёт своего хозяина."
 WAG_war_sudan: "Война с Суданом"
 WAG_war_sudan_desc: "Судан - перекрёсток Африки. Контроль над Нилом даёт власть над водными ресурсами всего региона. Переходное правительство слабо и уязвимо."
 WAG_african_hegemon: "Повелитель саванны"
 WAG_african_hegemon_desc: "От Средиземноморья до экватора, от Атлантики до Красного моря - наша власть неоспорима. Вагнерия становится сверхрегиональной державой, с которой вынуждены считаться даже великие державы."
 #Tooltips
 NS_WAG_recruits_nationalists_desc: "Начинается приток добровольцев из националистических кругов. Ожидайте §Y500 000§! человек и рост популярности крайне правых."
 WAG_wagner_tactics_tt: "Мы выбираем путь «Оркестра» - тяжёлой, кровавой, но эффективной тактики."
 WAG_shadow_tactics_tt: "Мы выбираем путь «Тени» - гибридную войну, информационные операции и сетецентрическую войну."
 WAG_african_influence_tt: "Наше влияние в регионе достигло критической массы."
 WAG_hegemon_tt: "Наше доминирование в регионе признано всеми. Вагнерия становится сверхрегиональной державой."
 WAG_media_empire_tt: "Кому принадлежит информация - тот владеет миром. Мы создаём медиаимперию по всей Африке."
 WAG_african_broadcasting_tt: "Наш общеафриканский телеканал вещает на десятках языков, формируя «правильную» картину мира."
 WAG_social_media_tt: "Армии ботов и фейковые аккаунты контролируют дискуссии в соцсетях."
 WAG_info_hegemon_tt: "Наше информационное доминирование неоспоримо. Мы формируем повестку всего континента."
 WAG_cyber_command_tt: "Киберпространство - новый фронт войны. Создано единое командование для цифровых операций."
 WAG_hacktivist_tt: "Хактивисты со всего мира присоединяются к нашему делу. Легион растёт."
 WAG_infrastructure_tt: "Найдены уязвимости в критической инфраструктуре врага. Готовьтесь к цифровому блицкригу."
 WAG_digital_warfare_tt: "Весь арсенал современной цифровой войны в наших руках. Мы начинаем кибервойну."
 WAG_war_cameroon_tt: "Открывает возможность объявить войну Камеруну."
 WAG_war_chad_tt: "Открывает возможность объявить войну Чаду."
 WAG_war_congo_tt: "Открывает возможность объявить войну Республике Конго."
 WAG_war_drc_tt: "Открывает возможность объявить войну ДРК."
 WAG_war_sudan_tt: "Открывает возможность объявить войну Судану."
 WAG_companies_unlock_tt: "Открывает возможность создания государственных корпораций."
 WAG_heavy_companies_unlock_tt: "Становятся доступны компании тяжёлой промышленности."
 WAG_light_companies_unlock_tt: "Становятся доступны компании лёгкой промышленности."


 #Ideas
 WAG_start_spirit_1: "Наследие «Оркестра»"
 WAG_start_spirit_1_desc: "Мир знает нас как наёмников. Легитимность под вопросом."
 WAG_start_spirit_2: "Разделённые ветераны"
 WAG_start_spirit_2_desc: "Единство ЧВК пошатнулось. Разные фракции тянут одеяло на себя."
 WAG_start_spirit_3: "Проклятие ресурсов"
 WAG_start_spirit_3_desc: "Борьба за ресурсы раздирает элиты."
 WAG_start_spirit_4: "Изгои"
 WAG_start_spirit_4_desc: "Большинство стран не признают Вагнерию."
 WAG_army_spirit_nationalists: "Русский марш"
 WAG_army_spirit_nationalists_desc: "Приток русских националистов укрепил армию идеологически, но добавил радикализма."
 WAG_army_spirit_veterans: "Ветераны"
 WAG_army_spirit_veterans_desc: "Высококвалифицированные бойцы, прошедшие горнило современной войны."
 WAG_army_spirit_international: "Легионеры удачи"
 WAG_army_spirit_international_desc: "Интернациональный отряд профессионалов, говорящих на языке войны."
 WAG_mercenary_army: "Профессионалы"
 WAG_mercenary_army_desc: "Наша армия состоит из контрактников, для которых война - это работа."
 WAG_tactics_spirit_urban: "Штурмовики"
 WAG_tactics_spirit_urban_desc: "Доктрина массовых городских штурмов."
 WAG_tactics_spirit_arty: "Боги войны"
 WAG_tactics_spirit_arty_desc: "Упор на артиллерию. Огневая мощь сметает любую оборону."
 WAG_siege_spirit: "Симфония стали"
 WAG_siege_spirit_desc: "Долгие осады, систематическое перемалывание противника."
 WAG_alt_tactics_spirit_hybrid: "Сетецентрическая война"
 WAG_alt_tactics_spirit_hybrid_desc: "Малые мобильные группы, дроны, разведка и связь."
 WAG_alt_tactics_spirit_info: "Цифровой фронт"
 WAG_alt_tactics_spirit_info_desc: "Дезинформация, психологические операции, взломы."
 WAG_shadow_spirit: "Глубинное государство"
 WAG_shadow_spirit_desc: "Теневая империя, контролирующая процессы по всей Африке."
 WAG_african_hegemon_spirit: "Повелитель саванны"
 WAG_african_hegemon_spirit_desc: "От Камеруна до Судана - наш голос громче всех."


 #Events
 wagneria.001.t: "Путь к легитимности"
 wagneria.001.d: "Первые дни существования Вагнерии ознаменовались хаосом и неопределённостью. Международное сообщество относится к нам с подозрением, но внутри страны растёт понимание необходимости сильной власти. Как нам укрепить новое государство?"
 wagneria.001.a: "Инвестировать в стабильность"
 wagneria.001.b: "Сосредоточиться на военной мощи"

 wagneria.002.t: "Рождение нации"
 wagneria.002.d: "Торжественная церемония провозглашения Вагнерии собрала тысячи людей. Атмосфера наполнена надеждой и решимостью. Какой путь изберёт новое государство?"
 wagneria.002.a: "Путь независимого развития"
 wagneria.002.b: "Путь военной экспансии"

 wagneria.010.t: "Приток добровольцев"
 wagneria.010.d: "В Вагнерию прибывают сотни добровольцев, движимых разными мотивами. Кто-то ищет приключений, кто-то - денег, а кто-то верит в нашу идеологию. Как нам справиться с этим потоком?"
 wagneria.010.a: "Отобрать лучших"
 wagneria.010.b: "Принять всех"

 wagneria.011.t: "Балканская сталь"
 wagneria.011.d: "В Вагнерию прибывают сербские добровольцы. Эти закалённые в боях ветераны югославских войн готовы применить свои навыки в Африке. Среди них выделяется опытный командир по прозвищу «Момчило»."
 wagneria.011.a: "Принять с почестями"
 wagneria.011.b: "Распределить по подразделениям"

 wagneria.012.t: "Легион Калиновского"
 wagneria.012.d: "В Вагнерию прибывают белорусские ополченцы. Их мотивация и решимость впечатляют, но их присутствие может вызвать трения с российскими добровольцами."
 wagneria.012.a: "Использовать их радикализм"
 wagneria.012.b: "Держать их отдельно"

 wagneria.013.t: "Пустынные лисы"
 wagneria.013.d: "В Вагнерию прибывают ветераны сирийской кампании. Их опыт городских боёв и ведения войны в пустыне бесценен."
 wagneria.013.a: "Изучить их тактику"
 wagneria.013.b: "Использовать как штурмовые отряды"

 wagneria.014.t: "Амазонские революционеры"
 wagneria.014.d: "В Вагнерию прибывают латиноамериканские добровольцы. Их опыт партизанской войны в джунглях может пригодиться в Центральной Африке."
 wagneria.014.a: "Сформировать спецподразделения"
 wagneria.014.b: "Распределить по гарнизонам"

 wagneria.015.t: "Интернациональный легион"
 wagneria.015.d: "В Вагнерию стекаются добровольцы со всего мира. Сербы, сирийцы, афганцы, латиноамериканцы - все готовы сражаться под нашим флагом. Интернациональный характер легиона создаёт уникальную боевую культуру."
 wagneria.015.a: "Поощрять братство народов"
 wagneria.015.b: "Сделать ставку на профессионализм"

 wagneria.020.t: "Оркестр войны"
 wagneria.020.d: "Наши войска применяют тактику массированных артиллерийских ударов и штурмовых операций. Первые результаты впечатляют, но цена высока."
 wagneria.020.a: "Продолжать в том же духе"
 wagneria.020.b: "Скорректировать тактику"

 wagneria.021.t: "Артиллерийская дуэль"
 wagneria.021.d: "Наши артиллеристы ведут контрбатарейную борьбу с противником. Благодаря лучшей подготовке и большему количеству орудий мы берём верх."
 wagneria.021.a: "Развить успех"
 wagneria.021.b: "Закрепить достижения"

 wagneria.022.t: "Мастера осад"
 wagneria.022.d: "Наши войска демонстрируют выдающиеся успехи в осадной войне. Систематическое разрушение укреплений и подавление сопротивления противника становятся нашей визитной карточкой."
 wagneria.022.a: "Закрепить доктрину"
 wagneria.022.b: "Поделиться опытом"

 wagneria.030.t: "Тень в пустыне"
 wagneria.030.d: "Наши мобильные группы действуют в тылу врага, нанося точечные удары по штабам и складам. Противник дезориентирован и не знает, откуда придёт следующий удар."
 wagneria.030.a: "Усилить группы"
 wagneria.030.b: "Расширить зону действий"

 wagneria.031.t: "Информационная война"
 wagneria.031.d: "Наши информационные операции достигают целей. В стане врага растут паника и недоверие к командованию. Фейковые новости и дезинформация сеют хаос в рядах противника."
 wagneria.031.a: "Усилить информационное давление"
 wagneria.031.b: "Сменить цели"

 wagneria.032.t: "Глубинное государство"
 wagneria.032.d: "Наша разведывательная сеть внедрилась в структуры власти соседних государств. Теперь мы можем влиять на принятие решений и получать секретную информацию. Теневая империя растёт."
 wagneria.032.a: "Расширить сеть"
 wagneria.032.b: "Использовать влияние"

 wagneria.040.t: "Операция «Саванна»"
 wagneria.040.d: "Наши агенты докладывают о ситуации в Камеруне. Правительство ослаблено коррупционными скандалами, армия деморализована. Время для вторжения благоприятное."
 wagneria.040.a: "Начать операцию"
 wagneria.040.b: "Провести диверсии"

 wagneria.041.t: "Операция «Пустыня»"
 wagneria.041.d: "Ситуация в Чаде благоприятствует военной кампании. Центральное правительство не контролирует периферию, а местные полевые командиры готовы перейти на нашу сторону."
 wagneria.041.a: "Начать операцию"
 wagneria.041.b: "Подкупить полевых командиров"

 wagneria.042.t: "Операция «Конго»"
 wagneria.042.d: "Республика Конго - наши ворота в Центральную Африку. Французское влияние здесь ослабевает, и мы можем заполнить вакуум власти."
 wagneria.042.a: "Начать операцию"
 wagneria.042.b: "Спонсировать оппозицию"

 wagneria.043.t: "Операция «Кобальт»"
 wagneria.043.d: "ДРК - источник стратегических ресурсов. Кобальт, медь, алмазы, золото - всё ждёт своего хозяина. Восточные провинции живут в хаосе уже много лет."
 wagneria.043.a: "Начать операцию"
 wagneria.043.b: "Поддержать сепаратистов"

 wagneria.044.t: "Операция «Нил»"
 wagneria.044.d: "Судан - перекрёсток Африки. Контроль над Нилом даёт власть над водными ресурсами всего региона. Переходное правительство слабо и уязвимо."
 wagneria.044.a: "Начать операцию"
 wagneria.044.b: "Заключить тайный союз"

 wagneria.045.t: "Повелитель саванны"
 wagneria.045.d: "Наше доминирование в регионе признано всеми. Вагнерия становится сверхрегиональной державой. Африканские лидеры ищут нашего расположения, а враги трепещут. Наше наследие только начинается."
 wagneria.045.a: "Установить новую гегемонию"
 wagneria.045.b: "Стать арбитром Африки"