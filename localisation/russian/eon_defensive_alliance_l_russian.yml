l_russian:
 eon_defensive_alliance_name:0 "Оборонительный союз"
 eon_defensive_alliance_template:0 "Оборонительный союз"
 eon_defensive_alliance_template_desc:0 "Союз независимых государств для взаимной обороны. Партнёры вступают по согласию. Членство не обязывает их участвовать в агрессивных войнах."
 eon_defensive_alliance_joining_rule:0 "Независимые оборонительные партнёры"
 eon_defensive_alliance_joining_rule_desc:0 "Независимые страны могут вступить по согласию, если их действующие политические правила и порог мировой напряжённости допускают членство. Страны, ведущие наступательную войну, вступить не могут."
 eon_defensive_alliance_call_rule:0 "Взаимная оборона"
 eon_defensive_alliance_call_rule_desc:0 "Партнёров можно призвать, только если призывающая страна обороняется и не ведёт наступательной войны. Страны, одновременно ведущие оборонительную и наступательную войны, не могут призывать партнёров по этому соглашению."
 eon_defensive_alliance_call_tt:0 "Этот оборонительный союз поддерживает страны, ведущие оборонительную войну без одновременной наступательной войны."
 eon_defensive_alliance_join_tt:0 "Кандидат должен быть независимым, находиться вне фракций, не вести наступательных войн и иметь право вступить по действующим политическим правилам и порогу мировой напряжённости. Лидер союза должен быть независимым и не вести наступательных войн."
 eon_propose_defensive_alliance:0 "Предложить оборонительный союз"
 eon_propose_defensive_alliance_desc:0 "Предложить независимому партнёру новый союз для взаимной обороны."
 eon_propose_defensive_alliance_send_desc:0 "Отправить предложение об оборонительном союзе. Оба правительства должны согласиться и по-прежнему соответствовать политическим условиям к моменту получения ответа."
 eon_defensive_alliance_offer_terms_available_tt:0 "Инициатор вправе создать союз, а партнёр — вступить в него по действующим политическим правилам. Обе страны независимы, находятся вне фракций и не ведут наступательных войн; партнёр соответствует своему порогу мировой напряжённости."
 eon_defensive_alliance_offer_no_pending_tt:0 "Ни у одной из стран нет другого предложения оборонительного союза, ожидающего ответа."
 eon_defensive_alliance_offer_response_valid_tt:0 "Ответ должен соответствовать текущему зарезервированному предложению; обе страны должны по-прежнему выполнять его политические условия."
 eon_defensive_alliance_ai_base:0 "Оценка нового оборонительного союза"
 eon_defensive_alliance_ai_opinion:0 "Отношения с инициатором"
 eon_defensive_alliance_ai_outlook:0 "Общие политические взгляды"
 eon_defensive_alliance_ai_policy:0 "Политика в отношении союзов"
