l_russian:
 eon_offer_humanitarian_aid:0 "Финансировать помощь гражданским"
 eon_offer_humanitarian_aid_desc:0 "Предложить 100 миллионов для помощи гражданским стране, которая ведёт войну или принимает беженцев. Требуется согласие получателя."
 eon_humanitarian_aid_ready_tt:0 "Независимый донор может предоставить этой стране §Y0.1 миллиарда§! для помощи гражданским. Нужна вся сумма; целевой фонд не может превышать 10 миллиардов, и другая исходящая гуманитарная заявка не должна ожидать ответа."
 eon_humanitarian_aid_send_desc:0 "Предложить §Y100 миллионов§! в целевой фонд помощи гражданским этой страны? Срок ответа — §Y30 дней§!. Отправка не расходует политическую власть или деньги. При согласии заново проверяются обе страны, мир между ними, независимость и казна донора, потребность получателя и вместимость фонда. Грант оплачивает помощь гражданским при возникновении потребности; неиспользованный остаток сохраняется для этой цели. Долга и военных прав он не создаёт. После успешного гранта действует задержка 180 дней для этой пары. Просроченная заявка без ответа навсегда закрывает новые гуманитарные предложения этому партнёру; другие партнёры доступны."
 eon_humanitarian_aid_accept_title:0 "Финансирование помощи гражданским одобрено"
 eon_humanitarian_aid_accept_desc:0 "Принятая заявка перечислит 100 миллионов лишь при сохранении её условий. Деньги поступают в целевой фонд помощи гражданским, а не в общую казну получателя."
 eon_humanitarian_aid_reject_title:0 "Предложение помощи гражданским отклонено"
 eon_humanitarian_aid_reject_desc:0 "Заявка закрывается без платежа, долга, возврата денег или политического штрафа."
 eon_withdraw_humanitarian_aid:0 "Отозвать предложение помощи гражданским"
 eon_withdraw_humanitarian_aid_desc:0 "Отозвать ожидающее ответа предложение помощи гражданским до его принятия."
 eon_humanitarian_aid_withdraw_desc:0 "Отозвать предложение без платежа? Исходная заявка сохраняется до ответа получателя или окончания 30 дней. Если срок истечёт без ответа, эта направленная пара останется закрытой для новых гуманитарных предложений."
 eon_humanitarian_aid.1.t:0 "Помощь гражданским профинансирована"
 eon_humanitarian_aid.1.d:0 "Получатель согласился, и итоговые условия были выполнены. Донор перечислил 100 миллионов в целевой фонд помощи гражданским получателя. Остаток оплачивает помощь гражданским и может сохраняться для будущих потребностей. Это не заём; награды влиянием и военного доступа нет."
 eon_humanitarian_aid.2.t:0 "Предложение помощи гражданским закрыто"
 eon_humanitarian_aid.2.d:0 "Предложение отклонено, отозвано или перестало соответствовать условиям платежа. Деньги не перечислялись."
 eon_humanitarian_aid.3.t:0 "Предложение помощи гражданским отозвано"
 eon_humanitarian_aid.3.d:0 "Донор отозвал предложение до принятия. Деньги не перечислялись. Исходную заявку можно безопасно закрыть."
 eon_humanitarian_aid.4.t:0 "Предложение помощи гражданским просрочено"
 eon_humanitarian_aid.4.d:0 "Срок ответа истёк, партнёр прекратил существование или запись заявки невозможно безопасно определить. Платежа не было. Известная направленная пара остаётся закрытой, чтобы старый ответ не одобрил новую заявку. Другие подходящие партнёры доступны. Неопределимая повреждённая запись закрывает гуманитарные предложения этого донора."
 eon_humanitarian_aid.ack:0 "Понятно"
 eon_humanitarian_aid_acceptance:0 "Потребность в помощи гражданским"
