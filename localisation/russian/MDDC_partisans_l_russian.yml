chechen_insurgents_modifier_tt: "Несмотря на то, что к 2000-м годам чеченские повстанцы были ослаблены, они по-прежнему активно сопротивлялись российским войскам, прежде чем те установили контроль над Чечней. Российские войска теряют §R1%§! здоровья и организации в неделю."
