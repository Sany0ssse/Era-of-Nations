partisans_activity_modifier_tt: "В гражданских войнах повсюду царит хаос, не понятно где свои где чужие. Войска несут потери от партизан и банд формирований даже на своей территории ( §R1%§! организации и здоровья месяц ) а также имеют сложности в снабжении и движении. Также разные группировки могут проводить диверсии, §Rповреждая здания§!."
partisans_resistance_modifier_tt: "При большом уровне сопротивления местные ячейки могут совершать нападения на ваши войска, нанося до §R5%§! урона здоровью и организации в месяц."
rear_raids_modifier_tt: "Из-за большой поддержки войны врага вести бои на вражеской территории сложнее: местные жители активно помогают подразделениям врага в рейдах на тылы, ваши войска несут от этих рейдов до §R5%§! урона здоровью и организации в месяц."
partisans_activity_1_modifier_tt: "В гражданских войнах повсюду царит хаос, не понятно где свои где чужие. Войска несут потери от партизан и банд формирований даже на своей территории ( §R2%§! организации и здоровья месяц ) а также имеют сложности в снабжении и движении. Также разные группировки могут проводить диверсии, §Rповреждая здания§!."
