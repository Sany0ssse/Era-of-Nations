l_russian:
 uranium:0 "Природный уран"
 uranium_desc:0 "Природный уран для ядерного топливного цикла. Добывается только в подтверждённых геологических районах. 1 единица торговли = номинально 100 кг U в неделю. Импорт не создаёт запас руды под землёй."
 PRODUCTION_MATERIALS_URANIUM:0 "Природный уран"
 eon_uranium_category:0 "Уран и реакторное топливо"
 eon_uranium_category_desc:0 "Добыча природного урана, переработка и торговля готовым топливом — разные этапы. Месторождение нужно для шахты; перерабатывающий комплекс может работать на импортном сырье."
 eon_uranium_status:0 "Проверить урановый баланс"
 eon_uranium_status_desc:0 "Природный уран на складе: §Y[?eon_natural_uranium_stock_kg|0] кг U§!. Доступный поток: §Y[?eon_uranium_available_flow_kg|0] кг U/нед.§!.\nГотовое реакторное топливо: §Y[?var_reactor_material_stockpile|0] кг U§!. Прогноз производства: §Y[?nuclear_reactor_fuel_production|0] кг/нед.§!. Потребность реакторов: §Y[?nuclear_fuel_consumption|0] кг/нед.§!.\nОбеднённый уран хранится отдельно: §Y[?eon_depleted_uranium_stock_kg|0] кг§!.\n\nПриродный уран покупается в обычном окне торговли. Готовое топливо — через окно энергетики. Положительный объём означает покупку, отрицательный — продажу. Историческая справочная цена природного урана около 2000 года: примерно 26–37 USD/кг U; обычная торговля оплачивается гражданскими фабриками. Цена готового топлива включает переработку и указывается в тысячах USD/кг. Эти цены нельзя смешивать."
 eon_uranium_expand_mine:0 "Развить добычу урана в [FROM.GetName]"
 eon_uranium_expand_mine_desc:0 "Игра распределяет единый исторический запас страны между подтверждёнными районами. Это не измеренные запасы каждой отдельной шахты.\nОсталось: §Y[?FROM.eon_uranium_reserve_kg|0] кг U§!. Базовая мощность: §Y[?FROM.eon_uranium_capacity|2] т/нед.§!, предел: §Y[?FROM.eon_uranium_capacity_limit|2] т/нед.§!.\nРазработка: §Y0,25 млрд USD§! заранее, §Y730 дней§!. Первая ступень — до 1 т/нед.; следующие увеличивают базовую мощность на 50% до предела района. Запас истощается при добыче. Стоимость, сроки и пределы — игровые параметры. При потере района до завершения зарезервированные средства возвращаются."
 eon_uranium_mine_ready_tt:0 "Есть подтверждённый остаток урана, собственный контролируемый район, свободная мощность и 0,25 млрд USD. В районе нет другого проекта добычи. Промышленная мощность должна быть не меньше 100 кг U/нед.; меньшие месторождения остаются учтёнными под землёй."
 eon_enrichment_ready_tt:0 "Изучена ядерная технология, нет банкротства или другого проекта. Доступно 25 млрд USD за комплекс. Число комплексов после строительства не превышает 1 + округлённое число собственных гражданских фабрик / 20."
 eon_nuclear_fuel_trade_unavailable_tt:0 "Выберите существующего партнёра без войны и эмбарго. Объём, цена, склад и деньги должны позволять всю сделку. Обе стороны свободны от незавершённой сделки; продавец разрешает торговлю топливом. Если небольшая сумма не проходит денежный расчёт, увеличьте объём и проверьте итоговую оплату."
 eon_nuclear_fuel_trade_expired_tt:0 "Предложение уже не действует. Повторной передачи денег и топлива не будет; зарезервированные средства или товар возвращаются владельцу."
 eon_nuclear_fuel_trade_invalid_tt:0 "Условия сделки больше не выполняются. Товар и оплата не могут быть переданы повторно."
 eon_nuclear_fuel_block_exports:0 "Запретить продажу готового реакторного топлива"
 eon_nuclear_fuel_block_exports_desc:0 "Новые предложения продажи нашего топлива и незавершённые предложения не могут быть приняты. Это не останавливает добычу или обычную торговлю природным ураном."
 eon_nuclear_fuel_unblock_exports:0 "Разрешить продажу готового реакторного топлива"
 eon_nuclear_fuel_unblock_exports_desc:0 "Разрешить сделки с готовым топливом при выполнении всех остальных условий. Решение не отправляет и не принимает предложение автоматически."
 eon_nuclear_fuel_trade_settled_tt:0 "Сделка исполнена один раз: оплата продавцу и топливо покупателю. Повторный ответ не повторяет передачу."
