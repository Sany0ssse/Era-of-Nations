l_russian:
 eon_energy_settlement_category:0 "Счета за электроэнергию"
 eon_energy_settlement_category_desc:0 "Поставленная энергия учитывается в ГВт·ч. Оплата проводится после семи завершённых 24-часовых учётных интервалов. Неоплаченные счета и уже оплаченные средства к получению сохраняются после окончания договора."
 eon_energy_settlement_accounts:0 "Посмотреть счета за электроэнергию"
 eon_energy_settlement_accounts_desc:0 "Просмотр фактически поставленной энергии, счетов к оплате, просроченных платежей и уже оплаченных средств к получению. Счета доступны и после окончания договора."
 eon_energy_settlement_pay_invoices:0 "Оплатить счета за электроэнергию"
 eon_energy_settlement_pay_invoices_desc:0 "Оплата из доступных средств казны. При нехватке денег каждый счёт получает одинаковую пропорциональную долю; неоплаченный остаток сохраняется. Политическая власть не заменяет денежную оплату."
 eon_energy_settlement_collect_paid:0 "Получить оплату за электроэнергию"
 eon_energy_settlement_collect_paid_desc:0 "Получить уже оплаченную покупателями сумму в пределах свободного места в казне. Средства к получению сохраняются; покупатель не платит повторно."
 eon_energy_settlement.1.t:0 "Счета за электроэнергию"
 eon_energy_settlement.1.d:0 "Фактический импорт: [?eon_energy_settlement_import_gwh|2] ГВт·ч\nФактический экспорт: [?eon_energy_settlement_export_gwh|2] ГВт·ч\nСчета к оплате: [?eon_energy_settlement_payable|5] млрд\nНаша просроченная оплата: [?eon_energy_settlement_arrears|5] млрд\nНеоплаченные счета покупателей: [?eon_energy_settlement_receivable|5] млрд\nОплаченные средства к получению: [?eon_energy_settlement_paid_claim|5] млрд\n\nПрекращение договора или война не стирают выполненные поставки. Счета принадлежат первоначальным сторонам. Расчётный период составляет семь завершённых 24-часовых интервалов; часовой учёт упрощает подробные рынки электроэнергии."
 eon_energy_settlement.1.gap:0 "Фактический импорт: [?eon_energy_settlement_import_gwh|2] ГВт·ч\nФактический экспорт: [?eon_energy_settlement_export_gwh|2] ГВт·ч\nСчета к оплате: [?eon_energy_settlement_payable|5] млрд\nНаша просроченная оплата: [?eon_energy_settlement_arrears|5] млрд\nНеоплаченные счета покупателей: [?eon_energy_settlement_receivable|5] млрд\nОплаченные средства к получению: [?eon_energy_settlement_paid_claim|5] млрд\n\nПрекращение договора или война не стирают выполненные поставки. Счета принадлежат первоначальным сторонам. Расчётный период составляет семь завершённых 24-часовых интервалов; часовой учёт упрощает подробные рынки электроэнергии.\n\nПредупреждение учёта: обнаружено прерывание таймера. Неизвестное прошедшее время не включено в счёт. Уже измеренные поставки и требования сохранены."
 eon_energy_settlement.2.t:0 "Просрочена оплата электроэнергии"
 eon_energy_settlement.2.d:0 "При расчёте наши доступные средства не покрыли счета за электроэнергию. Остаток долга сохраняется перед первоначальными поставщиками. Его можно оплатить через решения о счетах, когда появятся средства."
 eon_energy_settlement.3.t:0 "Просроченная оплата погашена"
 eon_energy_settlement.3.d:0 "Наши просроченные счета за электроэнергию оплачены. Более новые поставки остаются в текущем расчётном периоде."
 eon_energy_settlement.4.t:0 "Покупатель электроэнергии задерживает оплату"
 eon_energy_settlement.4.d:0 "Часть выполненных поставок не была полностью оплачена при расчёте. Неоплаченные счета остаются требованиями к первоначальным покупателям; ожидаемый доход не является полученными деньгами."
 eon_energy_settlement.5.t:0 "Задолженность покупателя погашена"
 eon_energy_settlement.5.d:0 "Просроченные счета покупателей оплачены. Если казна заполнена, оплаченные средства сохраняются для последующего получения."
 eon_energy_settlement.ack:0 "Понятно"
