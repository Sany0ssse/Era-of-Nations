l_russian:

  #Cosmetic Tags
 CZE_SLO_czechoslovakia_commi: "Чехословацкая Социалистическая Республика"
 CZE_SLO_czechoslovakia_commi_DEF: "Чехословацкая Социалистическая Республика"
 CZE_SLO_czechoslovakia_commi_ADJ: "Чехословацк"

 slovakian_focus: "Древо фокусов Словакии"

 SLO_MODERN_DAY_DESC: "Словакия переживала период значительных перемен и восстановление международных связей. После авторитарного и международно изолированного правления Владимира Мечьяра (1994–1998) в конце 1998 года к власти пришло широкое коалиционное правительство во главе с премьер-министром Микулашем Дзуриндой. К январю 2000 года это реформаторское правительство активно работало над возвращением Словакии в западное сообщество. Его главные цели были ясны: членство в Европейском союзе и НАТО. Политическая атмосфера отличалась осторожным оптимизмом, акцентом на демократическую консолидацию и выполнением критериев евроатлантической интеграции."

 #Smer
 SLO_smer: "Smer - sociálna demokracia"
 SLO_smer_desc: "Объединить социал-демократов вокруг обещаний Фицо восстановить порядок, расширить социальную помощь и продвигать бескомпромиссный национальный патриотизм."
 SLO_economic_course_to_left: "Экономический курс влево"
 SLO_economic_course_to_left_desc: "Повернуть фискальную политику в сторону перераспределения, государственной собственности и защиты стратегических отраслей."
 SLO_father_of_all_citizens: "Отец всех граждан"
 SLO_father_of_all_citizens_desc: "Формировать образ патернального лидера, который решает споры и раздаёт преференции по всем регионам."
 SLO_tax_redistribution: "Перераспределение налогов"
 SLO_tax_redistribution_desc: "Повысить налоги для банков и монополий, чтобы новые поступления финансировали социальные выплаты."
 SLO_ensure_a_decent_pension: "Обеспечить достойную пенсию"
 SLO_ensure_a_decent_pension_desc: "Индексировать пенсии по заработной плате, закрыть дыры в солидарной пенсионной системе и наказать работодателей за уклонение от взносов."
 SLO_statist_paternalism: "Государственный патернализм"
 SLO_statist_paternalism_desc: "Расширить министерства, регуляторы и субсидии, чтобы государство заменяло рыночные механизмы там, где избиратели уязвимы."
 SLO_there_are_only_two_genders: "Есть только два пола"
 SLO_there_are_only_two_genders_desc: "Закрепить консервативную социальную доктрину в образовании, здравоохранении и правовой системе для утешения традиционных избирателей."
 SLO_stop_privatization_of_healthcare: "Остановить приватизацию здравоохранения"
 SLO_stop_privatization_of_healthcare_desc: "Заморозить распродажи больниц, ограничить прибыль частных страховщиков и направлять средства в государственные поликлиники."
 SLO_ban_on_commissions_in_Slovak_banks: "Запрет комиссий в словацких банках"
 SLO_ban_on_commissions_in_Slovak_banks_desc: "Запретить навязанные сборы и обязать розничные банки предоставлять базовые счета по прозрачным тарифам."
 SLO_nationalist_orientation_of_party: "Националистическая ориентация партии"
 SLO_nationalist_orientation_of_party_desc: "Сочетать левую экономику c патриотической риторикой, защищающей словацкую культуру от Брюсселя или Праги."
 SLO_stop_monopolies: "Покончить с монополиями"
 SLO_stop_monopolies_desc: "Наделить регуляторов полномочиями по разделению и штрафам, отпугивающим картельную практику."
 SLO_dynamic_minimum_wage: "Динамическая минимальная зарплата"
 SLO_dynamic_minimum_wage_desc: "Привязать обязательные повышения зарплаты к производительности и среднему уровню оплаты, чтобы доходы автоматически росли."
 SLO_resolve_immigration_issue: "Решить вопрос миграции"
 SLO_resolve_immigration_issue_desc: "Ввести государственные квоты, ужесточить границы и тесты на интеграцию для снижения тревог по миграции."
 SLO_ban_surrogacy: "Запретить суррогатное материнство"
 SLO_ban_surrogacy_desc: "Уголовно преследовать коммерческое суррогатное материнство и закрыть лазейки, которые используют агентства."
 SLO_conduct_fiscal_consolidation: "Провести фискальную консолидацию"
 SLO_conduct_fiscal_consolidation_desc: "Сократить неэффективные расходы и расширить налоговую базу, чтобы дорогие обязательства оставались реалистичными."
 SLO_bet_on_euroscepticism: "Поставить на евроскептицизм"
 SLO_bet_on_euroscepticism_desc: "Использовать жёсткую риторику против Брюсселя для получения уступок, одновременно сохраняя приток средств из ЕС."
 SLO_strengthening_the_police: "Усиление полиции"
 SLO_strengthening_the_police_desc: "Повысить зарплаты, закупить современное снаряжение и централизовать командование, чтобы лояльная полиция обеспечивала новый порядок."
 SLO_Party_dictatorship: "Партийная диктатура"
 SLO_Party_dictatorship_desc: "Переписать избирательное законодательство, политизировать суды и подчинить СМИ, пока доминирование Smer не станет неоспоримым."
 SLO_preservation_of_social_democratic_values: "Сохранение социал-демократических ценностей"
 SLO_preservation_of_social_democratic_values_desc: "Кодифицировать уникальную словацкую социаль-демократию, сочетающую популизм соцпомощи c культурным консерватизмом."

 #Commi
 SLO_triumph_of_communism: "Триумф коммунизма"
 SLO_triumph_of_communism_desc: "Провозгласить полную победу партии над капитализмом и сосредоточить все рычаги государства в руках коммунистов."
 SLO_power_of_labor_unions: "Власть профсоюзов"
 SLO_power_of_labor_unions_desc: "Дать фабричным советам право вето по производству, зарплатам и найму, чтобы профсоюзы стали основой власти."
 SLO_blow_to_capitalism: "Удар по капитализму"
 SLO_blow_to_capitalism_desc: "Конфисковать частные банки, экспроприировать олигархов и перенаправить их капиталы в социалистическую казну."
 SLO_ban_disloyal_political_parties: "Запрет нелояльных партий"
 SLO_ban_disloyal_political_parties_desc: "Запретить оппозиционные движения, закрыть их прессу и заключать в тюрьму тех лидеров, кто не признаёт приоритет коммунистической партии."
 SLO_return_to_a_planned_economy: "Возврат к плановой экономике"
 SLO_return_to_a_planned_economy_desc: "Восстановить аппарат по примеру Госплана, который распределяет ресурсы, продукцию и трудовые квоты для каждой отрасли."
 SLO_all_power_to_workers: "Вся власть рабочим!"
 SLO_all_power_to_workers_desc: "Вооружить рабочие милиции и повысить роль советских органов, чтобы рабочие напрямую управляли предприятиями."
 SLO_nationalization_of_industrial_sectors: "Национализация промышленности"
 SLO_nationalization_of_industrial_sectors_desc: "Экспроприировать тяжёлую промышленность, логистику и энергетические активы, чтобы прибыль возвращалась в народное хозяйство."
 SLO_return_of_the_StB: "Возрождение ГСБ"
 SLO_return_of_the_StB_desc: "Восстановить внушающую страх государственную службу безопасности, чтобы искоренить шпионов, диверсантов и диссидентов."
 SLO_centralization_of_power: "Централизация власти"
 SLO_centralization_of_power_desc: "Упразднить децентрализованное управление и сосредоточить законодательную, исполнительную и судебную власть в политбюро."
 SLO_complete_five_year_plan_in_four_years: "Выполним пятилетний план за четыре года!"
 SLO_complete_five_year_plan_in_four_years_desc: "Ввести жёсткие квоты, принудительные сверхурочные и ударные бригады рабочих, чтобы досрочно перевыполнить плановые показатели."
 SLO_take_control_of_the_media: "Взять под контроль СМИ"
 SLO_take_control_of_the_media_desc: "Передать каждого вещателя, типографию и интернет-провайдера партийным комиссарам, которые будут распространять только революционную правду."
 SLO_proletarians_of_all_countries: "Пролетарии всех стран!"
 SLO_proletarians_of_all_countries_desc: "Вести агитпроп за рубежом и финансировать братские партии, чтобы разжечь классовую борьбу за пределами границ."
 SLO_preparation_proletarian_revolution_in_czech: "Подготовка пролетарской революции в Чехии"
 SLO_preparation_proletarian_revolution_in_czech_desc: "Нелегально переправлять оружие, агентов и пропаганду на территорию Чехии с целью дестабилизации их буржуазного правительства."
 SLO_condemn_imperialism_of_EU_and_NATO: "Осудить империализм ЕС и НАТО"
 SLO_condemn_imperialism_of_EU_and_NATO_desc: "Возглавить глобальные трибуналы, санкции и бойкоты, изображающие западные альянсы колониальными угнетателями."
 SLO_chinese_guarantees: "Китайские гарантии"
 SLO_chinese_guarantees_desc: "Обеспечить кредиты, технологии и дипломатическое прикрытие от Пекина в обмен на идеологическую лояльность."
 SLO_join_russia: "Присоединиться к России"
 SLO_join_russia_desc: "Полностью интегрироваться в военные и экономические структуры Москвы, чтобы сдержать западное возмездие."
 SLO_invite_north_korean_workers: "Пригласить северокорейских рабочих"
 SLO_invite_north_korean_workers_desc: "Завести дисциплинированные трудовые батальоны КНДР для повышения производства и одновременного укрепления связей с единомышленными жёсткими режимами."
 SLO_restoration_of_czechoslovakia: "Восстановление Чехословакии"
 SLO_restoration_of_czechoslovakia_desc: "Призывать к возрождению Чехословакии под коммунистическим правлением, стерев «Бархатный развод» путём революции."

 #SNS
 SLO_sns: "SNS"
 SLO_sns_desc: "Мобилизовать сельскую базу Словацкой национальной партии вокруг вопросов суверенитета, культурного консерватизма и жёсткого управления."
 SLO_banning_LGBT_rights: "Запрет прав ЛГБТ"
 SLO_banning_LGBT_rights_desc: "Продвигать конституционные поправки и законы о морали, которые отменяют юридические гарантии для ЛГБТ-граждан."
 SLO_economic_nationalism: "Экономический национализм"
 SLO_economic_nationalism_desc: "Использовать тарифы, лицензирование и патриотические закупки, чтобы предоставлять преимущество словацким фирмам перед иностранными конкурентами."
 SLO_path_of_total_statism: "Путь тотального статизма"
 SLO_path_of_total_statism_desc: "Объединить министерства и государственные предприятия в командную иерархию, подчиняющуюся только руководству SNS."
 SLO_development_of_agriculture: "Развитие сельского хозяйства"
 SLO_development_of_agriculture_desc: "Щедро поддерживать кооперативы и семейные фермы субсидиями, кредитами на технику и ирригационными проектами."
 SLO_Development_of_national_production: "Развитие национального производства"
 SLO_Development_of_national_production_desc: "Защищать отечественных производителей квотами и направлять государственные заказы через лояльные заводы."
 SLO_Stop_political_activity_in_media: "Прекратить политическую деятельность в СМИ"
 SLO_Stop_political_activity_in_media_desc: "Проводить чистки критических комментаторов, запрещать иностранную собственность и превращать вещательные компании в рупоры правительства."
 SLO_Foreign_Financing_Act: "Закон о зарубежном финансировании"
 SLO_Foreign_Financing_Act_desc: "Обязать НПО, СМИ и церкви регистрировать каждое иностранное пожертвование, чтобы иметь возможность преследовать или закрывать их."
 SLO_deprivatization_program: "Программа деприватизации"
 SLO_deprivatization_program_desc: "Выкупать или изымать активы, проданные в 1990-е, чтобы передать их под управление националистов."
 SLO_Strengthen_measures_against_illegal_migration: "Усилить меры против незаконной миграции"
 SLO_Strengthen_measures_against_illegal_migration_desc: "Расширить пограничные подразделения, центры содержания и полномочия по ускоренной депортации."
 SLO_total_control_over_political_activity: "Полный контроль над политической деятельностью"
 SLO_total_control_over_political_activity_desc: "Выдавайте лицензии всем партиям, профсоюзам и общественным объединениям, одновременно запрещая любые организации и людей, ставящих под сомнение доминирование SNS."
 SLO_tax_cuts_for_small_businesses: "Налоговые льготы для малого бизнеса"
 SLO_tax_cuts_for_small_businesses_desc: "Предоставьте лояльным лавочникам и мастерским щедрые налоговые вычеты, чтобы сделать их зависимыми от режима."
 SLO_ban_on_increasing_the_minimum_wage: "Запрет на повышение минимальной зарплаты"
 SLO_ban_on_increasing_the_minimum_wage_desc: "Заморозьте уровень минимальной оплаты труда, чтобы угодить работодателям и ослабить требования профсоюзов."
 SLO_destroy_the_independence_of_media: "Уничтожить независимость СМИ"
 SLO_destroy_the_independence_of_media_desc: "Национализируйте вещательные советы и замените редакторов идеологами, готовыми усиливать пропаганду."
 SLO_one_party_state: "Однопартийное государство"
 SLO_one_party_state_desc: "Перепишите конституцию так, чтобы SNS стал единственной законной формой политического выражения."
 SLO_moving_embassy_to_jerusalem: "Перенос посольства в Иерусалим"
 SLO_moving_embassy_to_jerusalem_desc: "Сигнализируйте неповиновение Брюсселю, переместив словацкое посольство в Иерусалим вместе с союзниками Израиля."
 SLO_slam_the_door_on_NATO: "Захлопнуть дверь перед НАТО"
 SLO_slam_the_door_on_NATO_desc: "Выселите представительства НАТО, отмените учения и обвините альянс во вмешательстве во внутренние дела Словакии."
 SLO_political_partnership_with_Israel: "Политическое партнёрство с Израилем"
 SLO_political_partnership_with_Israel_desc: "Подпишите соглашения по разведке, обороне и технологиям с Израилем, чтобы компенсировать западную изоляцию."
 SLO_militarize_the_country: "Милитаризовать страну"
 SLO_militarize_the_country_desc: "Внедрите армию в школы, заводы и местные администрации, чтобы внушать дисциплину и лояльность."
 SLO_peacock_of_independence_before_the_EU: "Павлин независимости перед ЕС"
 SLO_peacock_of_independence_before_the_EU_desc: "Эпатируйте на каждом саммите ЕС, налагайте вето на консенсус и выставляйте суверенитет напоказ ради домашних аплодисментов."
 SLO_tighten_the_conscription_law: "Ужесточить закон о призыве"
 SLO_tighten_the_conscription_law_desc: "Сократите отсрочки, увеличьте срок службы и наказывайте уклонистов, чтобы казармы оставались заполнены."
 SLO_increase_military_spending: "Увеличить военные расходы"
 SLO_increase_military_spending_desc: "Перенаправьте бюджетные излишки на закупки вооружений и развитие отечественных оборонных технологий."
 SLO_strong_leader_strong_country: "Сильный лидер, сильная страна"
 SLO_strong_leader_strong_country_desc: "Сосредоточьте власть в руках харизматичного националиста, который управляет через указы, зрелища и страх."

 #Foreign Policy
 SLO_foreign_policy_of_slovakia: "Внешняя политика Словакии"
 SLO_foreign_policy_of_slovakia_desc: "Созвать совет безопасности, чтобы наметить альянсы, торговые коридоры и оценку угроз до привязки к какому-либо блоку."
 SLO_anti_europeanism: "Антиевропеизм"
 SLO_anti_europeanism_desc: "Усилить евроскептическую риторику, тормозить директивы и выставлять Брюссель как пример чрезмерного вмешательства, чтобы нарастить внутриполитический багаж."
 SLO_european_integration: "Европейская интеграция"
 SLO_european_integration_desc: "Принять незавершённые главы acquis, добровольно участвовать в миссиях ЕС и доказать, что Словакия может вести, а не блокировать."
 SLO_EU_membership_question: "Вопрос членства в ЕС"
 SLO_EU_membership_question_desc: "Заказать юридические экспертизы и опросы, чтобы выяснить, отвечает ли дальнейшее членство интересам словацкого суверенитета."
 SLO_focus_on_the_east: "Ориентация на восток"
 SLO_focus_on_the_east_desc: "Перенаправить дипломатов, торговые связи и разведывательные ресурсы на Москву, Минск, Анкару и Пекин."
 SLO_eastern_european_frontier: "Восточноевропейский рубеж"
 SLO_eastern_european_frontier_desc: "Укрепить границы и железнодорожные узлы, чтобы Словакия стала логистическим стержнем Восточной Европы."
 SLO_support_belarusian_opposition: "Поддержать белорусскую оппозицию"
 SLO_support_belarusian_opposition_desc: "Предоставлять визы, финансирование и медиа-платформы белорусским диссидентам, противостоящим режиму Лукашенко."
 SLO_visit_to_Minsk: "Визит в Минск"
 SLO_visit_to_Minsk_desc: "Отправить президентскую делегацию в Минск для переговоров о поставках энергии, обмене пленными и региональной стабильности."
 SLO_form_a_partnership_with_moscow: "Вступить в ОДКБ"
 SLO_form_a_partnership_with_moscow_desc: "Подписать протоколы о вступлении в ОДКБ, проводить совместные учения и энергетические соглашения, связывающие Братиславу с Кремлём."
 SLO_cooperation_with_china: "Сотрудничество с Китаем"
 SLO_cooperation_with_china_desc: "Вступить в проекты «Пояс и Путь», приглашать китайских подрядчиков и меняться доступом к рынкам на дешёвое финансирование."
 SLO_turkish_investments: "Турецкие инвестиции"
 SLO_turkish_investments_desc: "Приглашать анатолийских строителей и обменивать оборонные наработки на экспорт словацкой машиностроительной продукции."
 SLO_buy_chinese_planes: "Купить китайские самолёты"
 SLO_buy_chinese_planes_desc: "Закупить китайские учебно-тренировочные и транспортные самолёты в комплекте с обучением пилотов и промышленными офсетами."
 SLO_attract_Russian_investment: "Привлечь российские инвестиции"
 SLO_attract_Russian_investment_desc: "Предлагать налоговые убежища и лоты приватизации, ориентированные на российские энергетические и металлургические гиганты."
 SLO_purchase_Russian_armored_vehicles: "Закупить российские бронированные машины"
 SLO_purchase_Russian_armored_vehicles_desc: "Перевооружить механизированные бригады российскими бронепакетами, запасными частями и обучением по их обслуживанию."
 SLO_Russian_military_base: "Российское военное присутствие"
 SLO_Russian_military_base_desc: "Мы готовы пойти на этот крайний шаг и пригласить российскую армию разместить войска в Липтовски-Микулаше и Прешове."
 SLO_Russian_union_state: "Союзное государство России и Словакии"
 SLO_Russian_union_state_desc: "Мы готовы интегрироваться в проект Союзного государства, созданный Россией, и это может быть нашим шансом защититься от внешней агрессии."
 SLO_Russian_gas: "Энергетическое соглашение с Газпромом"
 SLO_Russian_gas_desc: "Мы намерены предложить России энергетическое соглашение о поставках их нефтепродуктов в нашу страну."
 SLO_Russian_tatra_brotherhood: "Татрское братство"
 SLO_Russian_tatra_brotherhood_desc: "Мы намерены попросить у Москвы инвестиционную помощь, и пришло время открыто заявить, что мы не готовы годами ждать одобрения траншей от европейских стран, особенно на их обременительных условиях."
 SLO_Russian_slovak_spring: "Возрождённая словацкая весна"
 SLO_Russian_slovak_spring_desc: "Мы намерены пригласить политических советников из Москвы, чтобы активно начать процесс интеграции нашей страны в сферу влияния России, поскольку европейская политическая система доказала свою неэффективность."
 SLO_purchase_of_Iranian_missiles: "Покупка иранских ракет"
 SLO_purchase_of_Iranian_missiles_desc: "Тихо приобрести иранские ракетные разработки, чтобы расширить досягаемость ударов Словакии вне натовских цепочек поставок."
 SLO_Iranian_cooperation: "Расширенное сотрудничество с Ираном"
 SLO_Iranian_cooperation_desc: "Мы намерены продолжать развивать наше партнёрство с Ираном и расширять наше сотрудничество."
 SLO_Iranian_drones: "Закупка дронов у Ирана"
 SLO_Iranian_drones_desc: "Иран достиг больших успехов в производстве дронов. Мы намерены закупить у них несколько образцов."
 SLO_Iranian_nuclear: "Сотрудничество в ядерной энергетике"
 SLO_Iranian_nuclear_desc: "Иран имеет обширный опыт создания мощной ядерной промышленности с нуля, и сотрудничество с такими опытными специалистами пойдёт нам на пользу."
 SLO_issue_of_transnistrian_conflict: "Проблема приднестровского конфликта"
 SLO_issue_of_transnistrian_conflict_desc: "Посредничать между Молдовой и Россией, предложив словацких миротворцев для повышения дипломатического статуса."
 SLO_partnership_with_ukraine: "Партнёрство с Украиной"
 SLO_partnership_with_ukraine_desc: "Открыть фонды для трансграничной инфраструктуры и координировать реформы с Киевом в противостоянии общим угрозам."
 SLO_ukraine_cooperation: "Сотрудничество с Украиной"
 SLO_ukraine_cooperation_desc: "Мы намерены расширить экономическое сотрудничество с Украиной через специальное соглашение, тем самым подтвердив, что Украина является важным стратегическим партнёром для нас."
 SLO_ukraine_guarantee: "Братиславско-Киевский пакт"
 SLO_ukraine_guarantee_desc: "Мы намерены заключить с Украиной пакт о взаимных гарантиях независимости; это станет отличным политическим инструментом для обеих страны."
 SLO_buy_out_transcarpathia: "Выкуп Закарпатья"
 SLO_buy_out_transcarpathia_desc: "Вынести провокационное предложение об аренде или покупке Закарпатья в обмен на списание украинского долга."
 SLO_conquer_transcarpathia: "Завоевать Закарпатье"
 SLO_conquer_transcarpathia_desc: "Закарпатье — наша историческая территория, украденная у нас после Второй мировой войны. Пришло время вернуть то, что по праву принадлежит нам."
 SLO_German_investments: "Немецкие инвестиции"
 SLO_German_investments_desc: "Привлекать немецких автопроизводителей, поставщиков Mittelstand и фонды зелёных технологий при помощи гарантий и специальных кластерных зон."
 SLO_accept_japanese_companies: "Принять японские компании"
 SLO_accept_japanese_companies_desc: "Гарантировать защиту интеллектуальной собственности, ускорить выдачу виз и зарезервировать индустриальные парки для японских фирм."
 SLO_economic_partnership_with_korea: "Экономическое партнёрство с Кореей"
 SLO_economic_partnership_with_korea_desc: "Сочетать капитал корейских чеболей с словацкими инженерными вузами для проектов в электронике и производстве аккумуляторов."
 SLO_get_closer_to_France: "Сблизиться с Францией"
 SLO_get_closer_to_France_desc: "Организовать саммиты с Парижем по ядерной энергетике, закупкам в обороне и повесткам реформ в ЕС."
 SLO_question_of_NATO_membership: "Вопрос членства в НАТО"
 SLO_question_of_NATO_membership_desc: "Возобновить дебаты о вступлении, сопоставив гарантии альянса с требованиями к словацкому суверенитету."
 SLO_buy_German_Leopards: "Купить немецкие «Леопарды»"
 SLO_buy_German_Leopards_desc: "Вести переговоры о поставках списанных Leopard 2, пакетах обучения и долгосрочных контрактах на обслуживание."
 SLO_treaty_of_friendship_with_italy: "Договор дружбы с Италией"
 SLO_treaty_of_friendship_with_italy_desc: "Подписать двусторонний пакт по энергетическим коридорам, управлению миграцией и культурному обмену."
 SLO_worthy_member_of_the_european_society: "Достойный член Европейского сообщества"
 SLO_worthy_member_of_the_european_society_desc: "Продвигать Словакию как надёжного партнёра ЕС через реформы верховенства права и вклад в общие миссии."
 SLO_maintain_friendship_with_visegrad_group: "Поддерживать дружбу с Вышеградской группой"
 SLO_maintain_friendship_with_visegrad_group_desc: "Проводить частые саммиты V4, объединять инфраструктурные фонды и сохранять координацию несмотря на различия в политике."
 SLO_polish_investments: "Польские инвестиции"
 SLO_polish_investments_desc: "Поощрять расширение польских банков и энергетических компаний на юг с налоговыми льготами и гарантиями для миноритарных долей."
 SLO_visit_to_budapest: "Визит в Будапешт"
 SLO_visit_to_budapest_desc: "Организовать громкий визит в Будапешт для согласования посылов по миграции, энергетике и реформам в ЕС."
 SLO_purchase_polish_PT_91s: "Закупить польские PT-91"
 SLO_purchase_polish_PT_91s_desc: "Приобрести танки PT-91 для поддержания логистической совместимости с польскими заводами и линиями подготовки."
 SLO_polish_agreement: "Энергетическое соглашение с Польшей"
 SLO_polish_agreement_desc: "Мы намерены снизить нашу энергетическую зависимость от отдельных стран, поэтому диверсификация энергетического сектора — это необходимость, а не желание."
 SLO_silesia_will_be_free: "Поддержка силезского сепаратизма"
 SLO_silesia_will_be_free_desc: "Мы намерены начать подготовку к военным действиям против Польши, и для этого мы должны начать подрывать её изнутри. Мы начнём с Силезии."
 SLO_attack_polish_kurwa_bobr: "Покончить с польским бобром"
 SLO_attack_polish_kurwa_bobr_desc: "Пришло время начать военную операцию против Польши, мы готовились к этому долгое время."
 SLO_military_exercises_with_Hungary: "Военные учения с Венгрией"
 SLO_military_exercises_with_Hungary_desc: "Планировать совместные учения в бассейне Дуная для отработки переправ и общей системы ПВО."
 SLO_Cooperation_Agreement_with_Czech: "Соглашение о сотрудничестве с Чехией"
 SLO_Cooperation_Agreement_with_Czech_desc: "Обновить промышленные стандарты, таможенную гармонизацию и обмен данными по безопасности с Прагой."
 SLO_claim_to_the_Czech_lands: "Претензии на чешские земли"
 SLO_claim_to_the_Czech_lands_desc: "Возродить исторические претензии через пропаганду и юридические меморандумы, что может дестабилизировать отношения с Чехией."
 SLO_Request_for_Czech_Investments: "Запрос чешских инвестиций"
 SLO_Request_for_Czech_Investments_desc: "Привлечь чешский капитал в банковский сектор, коммунальные службы и телекомы, обещая регуляторную предсказуемость."
 SLO_return_of_czechoslovakia: "Возрождение Чехословакии"
 SLO_return_of_czechoslovakia_desc: "Выступать за федеративное воссоединение с чехами на условиях политической структуры, выгодной для Братиславы."
 SLO_moravia_and_slovakia: "Моравия и Словакия"
 SLO_moravia_and_slovakia_desc: "Продвигать федерацию Моравия–Словакия, которая отодвинет Прагу и изменит региональные балансы сил."
 SLO_kill_budapest: "Подчинить Будапешт"
 SLO_kill_budapest_desc: "Влияние Венгрии начинает угрожать нашей государственности — пришло время покончить с этим."
 SLO_friend_budapest: "Взаимные гарантии независимости"
 SLO_friend_budapest_desc: "Мы намерены укрепить обороноспособность Дунайского региона и поэтому готовы предложить Венгрии пакт о взаимной обороне."

#Economy
 SLO_economy_of_slovakia: "Экономика Словакии"
 SLO_economy_of_slovakia_desc: "Стабилизировать постпереходную экономику чётким планом, который уравновешивает фискальную дисциплину, инвестиции и социальную сплочённость."
 SLO_development_of_national_bank: "Развитие национального банка"
 SLO_development_of_national_bank_desc: "Оснастить Národná banka Slovenska лучшими инструментами, аналитиками и надзором, чтобы денежно-кредитная политика обеспечивала стабильный рост."
 SLO_support_for_foreign_investment: "Поддержка иностранных инвестиций"
 SLO_support_for_foreign_investment_desc: "Предлагать прозрачные стимулы и упрощённые процедуры выдачи разрешений для привлечения стратегического капитала без утраты экономической автономии."
 SLO_support_economic_growth: "Поддержка экономического роста"
 SLO_support_economic_growth_desc: "Сочетать налоговые послабления, экспортные кредиты и целевые субсидии для стимулирования роста ВВП и уровня заработных плат."
 SLO_fighting_unemployment: "Борьба с безработицей"
 SLO_fighting_unemployment_desc: "Сочетать программы переподготовки с региональными надбавками за найм, чтобы снова связать отстающие регионы с национальным восстановлением."
 SLO_actions_to_reduce_inflation: "Сократить инфляцию"
 SLO_actions_to_reduce_inflation_desc: "Скоординировать ужесточение монетарной политики с мерами по защите потребителей, чтобы ценовая стабильность не достигалась за счёт населения."
 SLO_ask_for_Dutch_investment: "Привлечь голландские инвестиции"
 SLO_ask_for_Dutch_investment_desc: "Пригласить голландские пенсионные фонды и инфраструктурные компании финансировать словацкую логистику, порты и энергосети."
 SLO_austrian_investments: "Австрийские инвестиции"
 SLO_austrian_investments_desc: "Углублять связи с венскими банками и промышленными домами, которые уже понимают словацкий рынок."
 SLO_development_of_service_sector: "Развитие сектора услуг"
 SLO_development_of_service_sector_desc: "Улучшать цифровую инфраструктуру и навыки рабочей силы, чтобы финансы, логистика и деловые услуги могли процветать."
 SLO_attracting_tourism: "Привлечение туризма"
 SLO_attracting_tourism_desc: "Продвигать замки, курорты и горы Словакии как премиальное направление при поддержке современной индустрии гостеприимства."
 SLO_investments_in_it: "Инвестиции в IT"
 SLO_investments_in_it_desc: "Создавать инкубаторы, гарантировать венчурные займы и обучать программированию, чтобы словацкие предприниматели могли создавать новых технологических чемпионов."
 SLO_sygic: "Поддержать Sygic"
 SLO_sygic_desc: "Направлять исследовательские гранты на навигационную платформу Sygic, чтобы удерживать её впереди иностранных конкурентов."
 SLO_o2_slovakia: "Партнёрство с O2 Slovakia"
 SLO_o2_slovakia_desc: "Расширить мобильное покрытие и развертывание 5G через совместную программу с O2 Slovakia, ускоряя цифровую инклюзию."
 SLO_export_of_ESET_products: "Экспорт продуктов ESET"
 SLO_export_of_ESET_products_desc: "Использовать посольства и торговые ярмарки, чтобы сделать ПО ESET синонимом кибербезопасности Центральной Европы."
 SLO_investments_in_energy: "Инвестиции в энергетику"
 SLO_investments_in_energy_desc: "Диверсифицировать производство энергии, укрепить сеть и привлечь частное финансирование как для возобновляемых, так и для базовых генерирующих мощностей."
 SLO_slovenske_elektrarne: "Slovenské elektrárne"
 SLO_slovenske_elektrarne_desc: "Дать национальному оператору капитал и автономию, необходимые для поддержания ядерного мастерства и модернизации гидроактивов."
 SLO_expansion_of_fossil_fuel_stations: "Расширение сети топливных заправок"
 SLO_expansion_of_fossil_fuel_stations_desc: "Модернизировать нефтеперерабатывающие заводы и автозаправочные станции, чтобы обеспечить энергетическую безопасность в период зелёного перехода."
 SLO_construction_of_nuclear_reactors: "Строительство ядерных реакторов"
 SLO_construction_of_nuclear_reactors_desc: "Завершить очередное поколение ядерных блоков, закрепив чистую базовую генерацию на десятилетия."
 SLO_invest_in_heavy_industry: "Инвестировать в тяжёлую промышленность"
 SLO_invest_in_heavy_industry_desc: "Модернизировать металлургию, станкостроение и нефтехимию, чтобы словацкие заводы могли стать опорой региональной цепочки поставок."
 SLO_investments_in_automotive_industry: "Инвестиции в автомобильную промышленность"
 SLO_investments_in_automotive_industry_desc: "Обеспечить соглашения о стабильности и инфраструктуру, чтобы привлечь больше OEM и поставщиков первого уровня."
 SLO_OFZ: "OFZ Žiar nad Hronom"
 SLO_OFZ_desc: "Рефинансировать печи и исследовательские лаборатории OFZ, обеспечив глобальную конкурентоспособность его ферросплавов."
 SLO_raven: "Raven Industrial Park"
 SLO_raven_desc: "Выделить логистические коридоры и гранты на развитие заброшенных промышленных площадок, чтобы Raven мог инкубировать экспортоориентированных производителей."
 SLO_open_a_Volkswagen_plant: "Открыть завод Volkswagen"
 SLO_open_a_Volkswagen_plant_desc: "Договориться о новой линии VW, которая задействует словацкие инженерные кадры для платформ следующего поколения электромобилей."
 SLO_open_a_Peugeot_plant: "Открыть завод Peugeot"
 SLO_open_a_Peugeot_plant_desc: "Привлечь Stellantis соглашениями по трудовым отношениям и кластерами поставщиков, снижающими издержки без понижения стандартов."
 SLO_open_a_Kia_plant: "Открыть завод Kia"
 SLO_open_a_Kia_plant_desc: "Предложить налоговые каникулы и партнёрства по батареям, чтобы обеспечить приток корейских инвестиций."
 SLO_slavnaft: "Slovnaft"
 SLO_slavnaft_desc: "Модернизировать перерабатывающие мощности Slovnaft, чтобы он мог перерабатывать разные сорта сырья и производить более чистые топлива."
 SLO_import_of_Russian_petroleum_products: "Импорт российских нефтепродуктов"
 SLO_import_of_Russian_petroleum_products_desc: "Сохранять прагматичный канал для российского сырья, пока альтернативные поставки остаются ограничены."

 SLO_dzurinda: "Рынок всё исправит!"
 SLO_dzurinda_desc: "Премьер-министр [SLO.GetLeader] вступил в должность с программой масштабных реформ. Предыдущее правительство Mečiar отказалось проводить какие-либо экономические изменения и оставило Словакию в бедности. Внешняя политика Мечьяра привела республику к международной изоляции, что представляет угрозу национальной безопасности.\nПрограмма правительства как раз направлена на исправление ошибок Мечьяра; будут проведены соответствующие экономические реформы, чтобы привлечь внимание иностранных инвесторов. Для достижения этой цели правительство попытается улучшить свой имидж перед Западом и продолжит интеграцию Словакии в НАТО и ЕС."

 SLO_comeback_europe: "Европейское возвращение"
 SLO_comeback_europe_desc: "Словакия вновь подтвердит свою приверженность европейской интеграции после периода изоляции времён Мечьяра. Мы будем активно добиваться углубления связей с европейскими институтами, нормализуем отношения с соседями и докажем, что Словакия готова быть ответственным и надёжным членом европейской семьи."

 SLO_green_light_reform: "Победа в Национальном совете"
 SLO_green_light_reform_desc: "После внутренних коалиционных переговоров правительству удалось подготовить первый пакет экономических рамочных реформ, целью которого станет закладка основы для более масштабных изменений. Наше большинство в Национальном Совете должно обеспечить их беспрепятственное принятие — это будет наша первая победа."

 SLO_join_oecd: "Членство в ОЭСР"
 SLO_join_oecd_desc: "Членство в Организации экономического сотрудничества и развития символизирует приверженность Словакии международным экономическим стандартам и лучшим практикам. Это достижение укрепит нашу кредитоспособность перед международными инвесторами и сигнализирует о готовности к более глубокой интеграции с развитым миром."

 SLO_european_amedments: "Европейские конституционные поправки"
 SLO_european_amedments_desc: "Полная европейская интеграция требует совершенствования нашего высшего закона. Новые конституционные поправки будут включать признание верховенства международных договоров, создание института правового омбудсмена, реформы избирательной системы и передачу права назначения судей президенту."

 SLO_ussteel_deal: "Сделка с U.S. Steel"
 SLO_ussteel_deal_desc: "Переговоры с U.S. Steel велись достаточно долго, но с назначением либерального кабинета корпорация проявила больший интерес к сотрудничеству. Сейчас страна готова подписать крупный контракт и разбогатеть."

 SLO_flat_tax: "Закон о едином налоге"
 SLO_flat_tax_desc: "Мы внедрим систему единого налога, которая упростит налоговый кодекс и создаст стимулы для труда, инвестиций и предпринимательства. Эта революционная реформа сделает Словакию более конкурентоспособной, привлечёт бизнес и обеспечит, чтобы все граждане платили свою справедливую долю через один прозрачный тариф."

 SLO_healthy_privatisation: "Старт честной приватизации"
 SLO_healthy_privatisation_desc: "После лет спорных приватизаций мы перезапустим процесс с прозрачностью и подотчётностью. Государственные активы будут продаваться через надлежащие каналы, обеспечивая справедливые цены и то, чтобы приватизация служила общественным интересам, а не обогащению олигархов."

 SLO_employment_reform: "Совет по экономике и социальному партнёрству"
 SLO_employment_reform_desc: "Мы создадим новую рамочную структуру диалога между правительством, работодателями и профсоюзами. Это трехстороннее партнёрство поможет координировать экономическую и социальную политику, обеспечивая, чтобы реформы приносили пользу всем заинтересованным сторонам и сохраняли социальную гармонию в переходный период."

 SLO_investment_heaven: "Рай для инвесторов"
 SLO_investment_heaven_desc: "Недавно Стив Форбс назвал Словакию раем для инвесторов. Он прав: реформы либерального кабинета, такие как введение единого налога, создали условия для прибыльных инвестиций в стране, и инвесторы выстраиваются в очередь, чтобы получить часть потенциального экономического бума!"

 SLO_nato_frontier: "Фронтир НАТО"
 SLO_nato_frontier_desc: "Чтобы окончательно стать западной страной, Словакия просто обязана вступить в НАТО. Однако Словакия ещё далека от полной интеграции в структуру альянса, но это не мешает подписывать временные военные соглашения и участвовать в учениях НАТО. Словакия станет восточным рубежом НАТО и будет помогать альянсу в процессе интеграции."

 SLO_state_treasuary: "Казначейство государства"
 SLO_state_treasuary_desc: "Система распределения бюджета в Словакии только формируется; средства расходуются без должного контроля, что создаёт огромные коррупционные риски. У каждой нормальной страны должен быть орган контроля бюджета — почему Словакия хуже? Правительство создаст Государственное Казначейство — специальный орган внутреннего государственного контроля, который будет надзирать за процессом распределения средств."

 SLO_empower_control: "Верховная счётная палата"
 SLO_empower_control_desc: "Вместе с Казначейством правительство также создаст Верховную Счётную Палату для мониторинга исполнения бюджета и устранения криминальных факторов в сфере госзакупок."

 SLO_special_prosecutor: "Офис специального прокурора"
 SLO_special_prosecutor_desc: "Создание Офиса Специального Прокурора — краеугольный камень административной и антикоррупционной реформы. Специальный прокурор будет расследовать случаи коррупции в государственных должностях и устранять влияние организованной преступности."

 SLO_miracle_dzurinda: "Словацкое чудо"
 SLO_miracle_dzurinda_desc: "Политика кабинета привела к тому, что Словакия стала известна во всём мире как самая быстрорастущая экономика Европы. Благодаря эффективным рыночным реформам Словакия смогла выйти из экономического спада, вызванного предыдущим правительством Мечьяра, и стать инвестиционным хабом. Словакия также сбросила клеймо изгоя и стала полноправным членом европейского сообщества."

 SLO_mechiar_on_the_horse: "Мечьяр снова в седле"
 SLO_mechiar_on_the_horse_desc: "Владимир Мечьяр — одна из самых противоречивых фигур в Словацкой Республике. При его руководстве Словакия обрела независимость, и в период его премьерства были приняты фундаментальные законы страны. Однако его каденция ознаменовалась крайне спорным подходом к приватизации и нарушениями демократических принципов. Он систематически превышал свои полномочия, сотрудничал с организованными преступными группировками и организовывал фиктивные аукционы и тендеры на приватизированные активы, в результате чего Словакия фактически оказалась изолирована от Запада, и её пути к вступлению в ЕС и НАТО были заморожены.\nНесмотря на всё это, партия HZDS под руководством Мечьяра сумела вновь выиграть выборы, что позволит Мечьяру сформировать своё четвёртое правительство."

 SLO_mechiarism: "Мечьяризм"
 SLO_mechiarism_desc: "За годы своего правления Мечьяр сформировал уникальный стиль управления, получивший название Мечьяризм. Он заключался в пренебрежении конституционными нормами, централизации власти вокруг офиса премьер-министра и сотрудничестве с организованной преступностью и службами безопасности."

 SLO_mechiar_gold: "Словацкий пирог"
 SLO_mechiar_gold_desc: "Словацкая экономика — не более чем пирог, который нужно разделить, чтобы завести новых друзей; для новых друзей ничего не жалко. Главное, чтобы наши новые друзья в лице организованной преступности и олигархов были готовы делать всё для нас."

 SLO_weaknesses_republic: "Эксплуатация слабостей республики"
 SLO_weaknesses_republic_desc: "Демократические институты Словакии всё ещё хрупки после падения коммунизма. Мы используем эти слабые места для консолидации власти, ослабления сдержек и противовесов и обеспечения того, чтобы оппозиционные силы не могли эффективно бросить вызов нашему авторитету."

 SLO_personal_shield: "Персональный щит Мечьяра"
 SLO_personal_shield_desc: "Для защиты Мечьяра от политических угроз и расследований мы укрепим разведывательные и силовые структуры, обеспечив их лояльность режиму; они будут использовать свои полномочия для устранения оппозиции и заставления критиков замолчать."

 SLO_sideline_president: "Отодвинуть президента в сторону"
 SLO_sideline_president_desc: "Президент представляет потенциальную проверку нашей власти. Мы используем политические манёвры и конституционные изменения, чтобы сократить полномочия президента и обеспечить, чтобы реальная власть оставалась в руках премьер-министра и его союзников."

 SLO_deal_people: "Сделка с народом"
 SLO_deal_people_desc: "Чтобы сохранять популярную поддержку, мы будем предоставлять социальные льготы и экономическую безопасность населению. Однако это будет стоить политической лояльности — те, кто поддерживает режим, будут процветать, а противники столкнутся с последствиями."

 SLO_national_referendum: "Референдум достоинства"
 SLO_national_referendum_desc: "Во время своего третьего срока Мечьяр попытался протолкнуть в парламент новый избирательный закон, который поставил бы избирательную комиссию под контроль премьер-министра, но парламент решительно сопротивлялся, в результате чего оппозиция добилась вотума недоверия и Мечьяр был смещён.\n\nНа этот раз всё иначе. Позиция Мечьяра намного более стабильна; народная поддержка и дружба с силовыми структурами и олигархами дают ему возможность оставаться у власти долгое время. Единственная проблема — Национальный Совет и Президент. Если должность президента можно лишить влияния без особых трудностей, то то же самое с парламентом сделать будет невозможно, и существует риск повторения прошлых событий.\n\nНо Мечьяр умнее; будет подготовлен проект конституционной поправки, который включит выборы президента через парламент, прямые выборы премьер-министра и увеличение его полномочий, отмену независимости избирательной комиссии и введение мажоритарной системы для парламентских выборов. Парламент никогда не сможет принять такую поправку абсолютным большинством, поэтому будет проведён всенародный Референдум Чести, который окажется гораздо легче."

 SLO_organize_abductions: "Политическая машина Мечьяра"
 SLO_organize_abductions_desc: "Даже с новыми поправками победа Мечьяра на выборах не гарантирована, поскольку оппозиция может объединиться и создать конкуренцию. Чтобы нейтрализовать эту угрозу, Мечьяру крайне необходима хорошо отлаженная политическая машина.\n\nИзбирательные округа будут перерисованы в пользу консервативных деревень, сотрудникам компаний будут даны указания сверху голосовать за определённого кандидата, мафия и спецслужбы будут давить на слишком оппозиционно настроенных политиков, чтобы они сняли свою кандидатуру, а тем, кто согласится сотрудничать, будут выданы успокоительные мандаты, имитируя конкуренцию.\n\nВыборы должны стать рутиной, а не большим политическим событием; граждане должны понимать, кто действительно хочет для них добра и благодаря кому они могут жить в благополучии, а голоса тех, кто против, просто утонут в общем явке."

 SLO_fear_hate_bratislava: "Страх и ненависть в Братиславе"
 SLO_fear_hate_bratislava_desc: "Оппозиция чувствует, что проигрывает, поэтому громко протестует в парламенте, развешивает плакаты и проводит митинги против правительства, особенно в Братиславе. Чтобы наконец расправиться с противниками, страну придётся на время погрузить в хаос, после чего будет достигнута беспрецедентная стабильность.\n\nКто-то из оппозиционной партии может поскользнуться и упасть, кого-то найдут с кокаином дома, кого-то обвинят в сотрудничестве с мафией, некоторых активистов могут просто объявить пропавшими, а однажды в Братиславе может быть жестоко убит журналист. Звон сирен раздастся по всей Словакии, в кабинетах оппозиционных чиновников воцарится звериный страх, что вынудит их либо сотрудничать, либо молчать, либо навсегда покинуть страну — хотя не факт, что им удастся навсегда ускользнуть от спецслужб. Братислава будет погружена в страх и ненависть."

 SLO_economic_hybrid: "Экономический гибрид"
 SLO_economic_hybrid_desc: "Наша экономическая модель сочетает государственный контроль с частным предпринимательством, создавая гибридную систему, где политически подкованные олигархи контролируют ключевые отрасли, сохраняя видимость рыночной экономики. Это позволяет удерживать и экономическую стабильность, и политический контроль."

 SLO_oligarch_council: "Совет олигархов"
 SLO_oligarch_council_desc: "Самые влиятельные бизнес-лидеры и политические соратники сформируют совет, который будет координировать экономические и политические решения. Эти олигархи будут контролировать экономику, обеспечивать политическую лояльность и делить трофеи власти между собой."

 SLO_no_isolation: "Избежать международной изоляции"
 SLO_no_isolation_desc: "Проводя националистическую политику, мы должны избежать полной международной изоляции. Мы будем искать партнёрства с незападными державами — Россией, Китаем и Украиной — чтобы поддерживать торговлю и дипломатические отношения, сопротивляясь давлению ЕС и НАТО."

 SLO_reboot_relations_eu: "Перезагрузка отношений с ЕС"
 SLO_reboot_relations_eu_desc: "Несмотря на националистическую риторику, мы признаём, что Словакия не сможет выжить в полном одиночестве. Мы попытаемся восстановить отношения с Европейским Союзом, ища прагматичный компромисс, который позволит сохранить суверенитет и одновременно получать доступ к европейским рынкам и финансированию."

 SLO_father_of_nation: "Отец Словакии"
 SLO_father_of_nation_desc: "Во время правления Мечьяра Словакия претерпела значительные трансформации. Средний уровень дохода граждан заметно вырос, бандитизм и коррупция якобы перестали быть проблемой, и каждый гражданин понимает, что Мечьяр должен быть избран на выборах, причём иногда им мягко напоминают об этом.\n\nМечьяр правил Словакией ещё до её независимости, и благодаря его усилиям Словакия избежала подчинения чешской элите и стала независимым государством. Однако после обретения независимости страну окружили враги, которые пытались её присвоить, что им удавалось дважды. Теперь Мечьяр вернулся на своё законное место и привёл порядок, взрастив Словакию как настоящий отец.\n\nКритики скажут, что Мечьяр создал персоналистскую диктатуру, где олигархи, мафия и политическая элита слились в одно целое, где игнорируются свобода слова и права человека, а диссиденты систематически устраняются.\n\nОни не понимают, что всё это — часть воспитания, потому что Мечьяр создал Словакию и, как настоящий отец, вырастил её образцовой и порядочной страной, где царят закон, порядок и благосостояние. Слава Мечьяру — Отцу Нации!"

#Army
 SLO_army: "Вооружённые силы Словацкой Республики"
 SLO_army_desc: "Подтвердить миссию и финансирование вооружённых сил, чтобы каждый род войск мог планировать на срок, превышающий следующий бюджетный цикл."
 SLO_army_modernization: "Модернизация армии"
 SLO_army_modernization_desc: "Заменить устаревшее оборудование, оцифровать командные системы и перестроить бригады по современной комбинированно-видовой доктрине."
 SLO_ground_forced: "Словацкие сухопутные войска"
 SLO_ground_forced_desc: "Оснастить Pozemné Sily лучшей бронетехникой, артиллерией и логистикой для обороны национальной территории."
 SLO_military_intelligence: "Служба военной разведки"
 SLO_military_intelligence_desc: "Инвестировать в SIGINT, HUMINT и киберподразделения, которые будут информировать командование до возникновения кризиса."
 SLO_special_operations_forces: "Силы специальных операций"
 SLO_special_operations_forces_desc: "Расширить воздушно-десантные, рейнджерские и контртеррористические подразделения, способные действовать в составе НАТО или автономно."
 SLO_retraining_of_officers: "Переподготовка офицеров"
 SLO_retraining_of_officers_desc: "Отправлять офицерский корпус в новые академии, на языковые программы и обмены с НАТО для обновления культуры руководства."
 SLO_new_doctrine_of_Slovak_army: "Новая доктрина словацкой армии"
 SLO_new_doctrine_of_Slovak_army_desc: "Разработать доктрину, сочетающую территориальную оборону с возможностью участия в экспедиционных операциях и устойчивостью к гибридной войне."
 SLO_arsenal_update: "Обновление арсенала"
 SLO_arsenal_update_desc: "Провести аудит запасов, списать неисправное имущество и закупить модульное вооружение, пригодное для интероперабельности."
 SLO_air_forced: "Словацкие воздушные силы"
 SLO_air_forced_desc: "Консолидировать авиабазы, модернизировать техобслуживание и удерживать пилотов на дежурстве, чтобы гарантировать постоянное воздушное патрулирование."
 SLO_rewrite_the_air_force_doctrine: "Пересмотр доктрины ВВС"
 SLO_rewrite_the_air_force_doctrine_desc: "Согласовать тактику, подготовку и закупки с многоцелевыми истребителями и современными системами ПВО."
 SLO_question_of_old_soviet_wings: "Вопрос старых советских крыльев"
 SLO_question_of_old_soviet_wings_desc: "Принять решение о целесообразности восстановления оставшихся Fulcrums или их списания до того, как устаревание станет опасным."
 SLO_buy_swedish_wings: "Купить шведские крылья"
 SLO_buy_swedish_wings_desc: "Добиваться пакета Saab, включающего доступные Gripen, обучение и промышленные офсеты."
 SLO_new_army_of_european_power: "Армия европейской державы"
 SLO_new_army_of_european_power_desc: "Завершить реформы созданием сбалансированной, развёртываемой силы, которая докажет, что Словакия может действовать на европейском уровне."

 #Events
 slo_army.1.t: "Вопрос о советских самолётах"
 slo_army.1.d: "На наших авиабазах простаивают старые советские МиГ-29. Эти самолёты уже устарели по сравнению с современными истребителями, и пришло время решить, что с ними делать. Мы можем разобрать их и вложить ресурсы в авиационные исследования. Альтернативно, можно ввести их в эксплуатацию и модернизировать."
 slo_army.1.a: "Разобрать их"
 slo_army.1.b: "Модернизировать их"
 slo_army.2.t: "Словакия хочет купить наши самолёты"
 slo_army.2.d: "Сегодня словацкие послы из Министерства обороны обратились к нам с просьбой продать им наши самолёты Sk-60. Следует ли нам согласиться на сделку?"
 slo_army.2.a: "Продать самолёты Sk-60"
 slo_army.2.b: "Отказать в продаже"
 slo_army.3.t: "Покупка Sk-60 одобрена"
 slo_army.3.d: "Покупка 20 самолётов Sk-60 у [SWE.GetNameDef] была одобрена. Эти универсальные шведские самолёты значительно улучшат возможности подготовки нашей авиации и предоставят дополнительные лёгкие штурмовые и разведывательные средства. Проверенная конструкция Sk-60 и многоцелевые возможности делают их отличным дополнением к нашему авиапарку, а приобретение улучшит программы подготовки пилотов и оперативную гибкость."
 slo_army.3.a: "Подготовка наших пилотов улучшится"
 slo_army.4.t: "Покупка Sk-60 отклонена"
 slo_army.4.d: "Мы решили отказаться от предложения о покупке самолётов Sk-60 у [SWE.GetNameDef]. Хотя эти самолёты обеспечили бы ценную подготовку и лёгкие штурмовые возможности, мы решили сосредоточить ресурсы на других приоритетах программы модернизации авиации. Мы продолжим искать другие варианты для улучшения подготовки пилотов и возможностей лёгкой авиации."
 slo_army.4.a: "Мы найдём другие решения для подготовки"


 slo_economy.1.t: "Словакия просит наши инвестиции"
 slo_economy.1.d: "Сегодня словацкие послы обратились к нам с просьбой о экономических инвестициях в их страну. Это предложение взаимовыгодно и даёт нам возможность улучшить отношения с Братиславой. Воспользуемся ли мы этим?"
 slo_economy.1.a: "Инвестировать в них"
 slo_economy.1.b: "Нам нужны деньги на другое"
 slo_economy.2.t: "[FROM.GetName] согласился на инвестиции"
 slo_economy.2.d: "Сегодня мы получили ответ от [FROM.GetAdjective] властей. Они согласились предоставить нам инвестиции; этот шаг сблизит наши страны и заложит основу для дальнейшего сотрудничества."
 slo_economy.2.a: "За это можно выпить"
 slo_economy.3.t: "[FROM.GetName] отказался от инвестиций"
 slo_economy.3.d: "Сегодня мы получили ответ от [FROM.GetAdjective] властей. Они отказались инвестировать в нас, ссылаясь на нехватку средств для этих целей. Звучит не очень убедительно; похоже, они просто очень жадные."
 slo_economy.3.a: "Ну ладно..."
 slo_economy.4.t: "Словакия хочет заключить с нами нефтяную сделку"
 slo_economy.4.d: "Словацкие дипломаты обратились к нам с предложением; они готовы покупать нашу нефть по цене ниже рыночной. У нас хорошие отношения с словацкими властями, поэтому даже такая сделка будет геополитически выгодна. Примем ли мы их предложение?"
 slo_economy.4.a: "Принять их запрос"
 slo_economy.4.b: "Это нам невыгодно"
 slo_economy.5.t: "Россия согласилась на нефтяную сделку"
 slo_economy.5.d: "Москва приняла наших дипломатов, и во время тёплых переговоров им удалось заключить нефтяную сделку с Кремлём; теперь мы покупаем нефть по цене ниже рыночной."
 slo_economy.5.a: "Очень хорошо"
 slo_economy.6.t: "Нефтяная сделка сорвалась"
 slo_economy.6.d: "Наших дипломатов встретили в Москве для переговоров по нефтяной сделке, но Кремль дал понять: сделка не состоится. Российская сторона утверждает, что условия сделки для них невыгодны и неприемлемы."
 slo_economy.6.a: "Ну ладно..."

 slo_foreign.1.t: "Вопрос членства в ЕС"
 slo_foreign.1.d: "Является ли Европейский Союз экономическим спасением или угрозой нашей независимости? Сейчас самое время выяснить и сделать выбор: остаться в Союзе или покинуть его?\n\nЧленство в Европейском Союзе предоставляет нам многочисленные экономические преимущества, а также тёплые дипломатические связи с его членами. Однако квоты и требования Союза противоречат нашим национальным ценностям, угрожая нашей независимости."
 slo_foreign.1.a: "Членство в ЕС для нас слишком выгодно"
 slo_foreign.1.b: "Пора покинуть союз"
 slo_foreign.2.t: "Премьер-министр Словакии прибыл в Минск"
 slo_foreign.2.d: "Сегодня в Минск прибыл самолёт со словацкой делегацией во главе с премьер-министром. Этот дипломатический визит связан с улучшением отношений между Минском и Братиславой и обещает быть плодотворным. Однако результат визита зависит от переговоров премьер-министра Словакии с президентом нашей страны. Каковы результаты этих переговоров?"
 slo_foreign.2.a: "Подпишем соглашение!"
 slo_foreign.2.b: "Мы не заинтересованы в контактах с Братиславой"
 slo_foreign.3.t: "Визит в Минск прошёл успешно"
 slo_foreign.3.d: "Сегодня наш самолёт с премьер-министром и его делегацией вернулся из Белоруссии, где мы провели успешную встречу с лидером Белоруссии. Нам удалось подписать ряд важных документов и соглашений, которые укрепят дружбу между нашими странами!"
 slo_foreign.3.a: "Выпьем за новых друзей!"
 slo_foreign.4.t: "Неудача переговоров в Минске"
 slo_foreign.4.d: "Сегодня наш самолёт с премьер-министром и делегацией вернулся из Белоруссии, где прошли переговоры с лидером страны. Сразу после приземления в Минске, судя по холодному приёму, стало ясно, что Белоруссия не заинтересована в сотрудничестве с нашей страной."
 slo_foreign.4.a: "Ну ладно..."
 slo_foreign.5.t: "Словакия хочет подписать двустороннее соглашение"
 slo_foreign.5.d: "В Пекин прибыл самолёт со словацкими дипломатами. Во время встречи с нашими властями они выразили желание установить двустороннее сотрудничество. Этот шаг увеличит наше влияние в Центральной Европе и количество дипломатических связей."
 slo_foreign.5.a: "Выпьем за новых партнёров."
 slo_foreign.5.b: "Мы не заинтересованы в Словакии"
 slo_foreign.6.t: "Успешная сделка с Китаем"
 slo_foreign.6.d: "Самолёт с нашей делегацией вернулся из Пекина, где были подписаны бумаги и соглашения с Китаем, в основном в области экономического и политического сотрудничества."
 slo_foreign.6.a: "Ещё один гвоздь в гроб американской гегемонии"
 slo_foreign.7.t: "Визит в Пекин оказался бесплодным"
 slo_foreign.7.d: "Самолёт с нашей делегацией вернулся из Пекина, где прошла конференция с китайскими лидерами. С первых минут конференции было ясно, что Китай не заинтересован в сотрудничестве с нашей страной. Визит оказался бесплодным."
 slo_foreign.7.a: "Ну ладно..."
 slo_foreign.8.t: "Словакия хочет купить наши самолёты"
 slo_foreign.8.d: "Словакия заинтересована в покупке наших истребителей J-7III. Эта модель довольно старая, но ещё функциональная, и мы можем продать её по хорошей цене. Этот шаг усилит наше военное присутствие в Европе и продемонстрирует силу наших ВВС."
 slo_foreign.8.a: "Продать самолёты J-7III"
 slo_foreign.8.b: "Отказаться от продажи самолётов"
 slo_foreign.9.t: "Покупка самолётов J-7III одобрена"
 slo_foreign.9.d: "Покупка 20 самолётов J-7III у [CHI.GetNameDef] одобрена. Эти универсальные китайские самолёты значительно улучшат возможности обучения нашей авиации и обеспечат дополнительные лёгкие штурмовые и разведывательные средства. Надёжная конструкция J-7III и его многоцелевые возможности делают его отличным дополнением к нашей авиации, а приобретение улучшит программы подготовки пилотов и оперативную гибкость."
 slo_foreign.9.a: "Подготовка нашей авиации улучшится"
 slo_foreign.10.t: "Покупка самолётов J-7III отклонена"
 slo_foreign.10.d: "Мы решили отклонить предложение о покупке самолётов J-7III у [CHI.GetNameDef]. Хотя эти самолёты предоставили бы ценные возможности для обучения и лёгкого штурмового применения, мы решили сосредоточить ресурсы на других приоритетах программы модернизации авиации. Мы продолжим искать другие варианты повышения подготовки пилотов и возможностей лёгкой авиации."
 slo_foreign.10.a: "Мы найдём другие решения для обучения"
 slo_foreign.11.t: "Словакия хочет купить наши бронемашины"
 slo_foreign.11.d: "Словацкая делегация во главе с Министерством обороны Словакии прибыла в Кремль с предложением. Они хотят приобрести наше военное оборудование для модернизации своей армии и готовы заплатить разумную цену."
 slo_foreign.11.a: "Сделка!"
 slo_foreign.11.b: "Мы не будем вооружать потенциальных врагов"
 slo_foreign.12.t: "[SOV.GetName] продаёт нам бронемашины"
 slo_foreign.12.d: "Наша делегация успешно провела переговоры с Москвой; Россия продаст нам свои бронемашины. Это безусловно улучшит положение наших вооружённых сил, но также увеличит влияние России."
 slo_foreign.12.a: "Отлично!"
 slo_foreign.13.t: "Россия отказалась продавать нам оборудование"
 slo_foreign.13.d: "Наши делегаты безуспешно проводили переговоры с Москвой по продаже российского оборудования. Российская сторона опасается, что мы можем использовать их технику против них."
 slo_foreign.13.a: "Ну ладно..."
 slo_foreign.14.t: "[SLO.GetName] хочет купить наши ракеты"
 slo_foreign.14.d: "Сегодня в Тегеран прибыла делегация [SLO.GetAdjective] с интересным предложением. Они хотят купить 50 наших баллистических ракет для модернизации своей армии. Приняв их предложение, мы получим нового стратегического союзника в самом центре Европы, а также сможем заработать на этом."
 slo_foreign.14.a: "Мы примем эту сделку."
 slo_foreign.14.b: "Мы не станем раздавать наше оружие."
 slo_foreign.15.t: "[PER.GetName] продаёт нам ракеты"
 slo_foreign.15.d: "Наша делегация успешно договорилась с иранским правительством. Мы получили от них 50 ракет и пусковую установку. Разумеется, за это мы заплатили справедливую цену."
 slo_foreign.15.a: "Наша армия стала ещё сильнее"
 slo_foreign.16.t: "Иран отказывает"
 slo_foreign.16.d: "Наша делегация не добилась успеха в переговорах с иранским правительством. Они отказались продавать нам свои ракеты."
 slo_foreign.16.a: "Как...печально."
 slo_foreign.17.t: "Вопрос приднестровского конфликта"
 slo_foreign.17.d: "Война в Приднестровье с 1990 по 1992 год оставила глубокий след на географии Молдовы. Конфликт остался в статус-кво, и Приднестровская Республика по-прежнему существует как непризнанное государство. Пришло время занять позицию и выбрать, на чьей стороне мы: Молдова или Приднестровье."
 slo_foreign.17.a: "Поддержим Молдову"
 slo_foreign.17.b: "Поддержим Приднестровье"
 slo_foreign.18.t: "Словакия хочет купить Закарпатье"
 slo_foreign.18.d: "Словакия заявила, что хочет купить часть нашей территории за крупную сумму. Это может быть выгодная сделка; Закарпатье не очень развитый регион, и деньги помогут нашей экономике. Однако это также представляет посягательство на наш суверенитет, так как словацкие власти ясно дали понять, что хотят Закарпатье любой ценой."
 slo_foreign.18.a: "Это хорошая сделка"
 slo_foreign.18.b: "Мы не продадим наши земли"
 slo_foreign.19.t: "[FROM.GetName] продаёт нам Закарпатье"
 slo_foreign.19.d: "Наши делегаты вернулись из [FROM.GetName] с хорошими новостями: нам удалось убедить [FROM.GetAdjective] правительство продать нам Закарпатье. И хотя нам пришлось заплатить крупную сумму, мы уверены, что сможем её окупить."
 slo_foreign.19.a: "Этот день войдёт в историю"
 slo_foreign.20.t: "[FROM.GetName] отказывает"
 slo_foreign.20.d: "Наша делегация не смогла убедить украинское правительство продать нам Закарпатье. Украинская сторона уже поняла, что это ультиматум, и начала готовиться к войне."
 slo_foreign.20.a: "Мы хотели сделать это мирно"
 slo_foreign.21.t: "Словакия хочет подписать двустороннее соглашение"
 slo_foreign.21.d: "Самолёт с дипломатами из Словакии приземлился в Сеуле. Во время встречи с нашими властями они выразили желание установить двустороннее сотрудничество с нами. Этот шаг увеличит наше влияние в Центральной Европе и количество дипломатических связей."
 slo_foreign.21.a: "Давайте выпьем за новых партнёров."
 slo_foreign.21.b: "Мы не заинтересованы в Словакии"
 slo_foreign.22.t: "Успешная сделка с Кореей"
 slo_foreign.22.d: "Самолёт с нашей делегацией вернулся из Сеула, где были подписаны соглашения с корейским государством, главным образом в сфере экономического и политического сотрудничества."
 slo_foreign.22.a: "Отлично"
 slo_foreign.23.t: "Визит в Сеул оказался безрезультатным"
 slo_foreign.23.d: "Самолёт с нашей делегацией вернулся из Сеула, где проходила конференция с корейскими лидерами. С первых минут конференции стало ясно, что Корея не заинтересована в сотрудничестве с нашей страной. Визит оказался безрезультатным."
 slo_foreign.23.a: "Ну ладно..."
 slo_foreign.24.t: "Словакия хочет купить наши танки"
 slo_foreign.24.d: "Словацкая делегация прибыла в Берлин с просьбой о покупке 50 наших танков Leopard 2A4 по разумной цене. Примем ли мы их предложение?"
 slo_foreign.24.a: "Продать танки"
 slo_foreign.24.b: "Эти танки нам ещё нужны."
 slo_foreign.25.t: "Германия согласна"
 slo_foreign.25.d: "Германия согласилась продать нам танки; наша делегация убедила их заключить сделку. Немецкие танки восстановят нашу стареющую армию."
 slo_foreign.25.a: "Отлично!"
 slo_foreign.26.t: "Германия отказывает"
 slo_foreign.26.d: "Берлин отказался продавать свои танки нашей стране. Наша делегация не смогла убедить их заключить сделку."
 slo_foreign.26.a: "Жаль..."
 slo_foreign.27.t: "Премьер-министр Словакии прибыл в Будапешт"
 slo_foreign.27.d: "Сегодня самолёт с словацкой делегацией во главе с премьер-министром приземлился в Будапеште. Этот дипломатический визит связан с улучшением отношений между Будапештом и Братиславой и обещает быть плодотворным. Однако результаты визита зависят от переговоров между словацким премьер-министром и нашим президентом. Каковы результаты этих переговоров?"
 slo_foreign.27.a: "Давайте подпишем сделку!"
 slo_foreign.27.b: "Мы не заинтересованы в делах с Братиславой"
 slo_foreign.28.t: "Визит в Будапешт был плодотворным"
 slo_foreign.28.d: "Сегодня наш самолёт с премьер-министром и его делегацией вернулся из Венгрии, где мы провели успешную встречу с венгерским лидером. Нам удалось подписать ряд важных документов и соглашений, которые укрепят дружбу между нашими странами!"
 slo_foreign.28.a: "Давайте выпьем за новых друзей!"
 slo_foreign.29.t: "Неудача переговоров в Будапеште"
 slo_foreign.29.d: "Сегодня наш самолёт с премьер-министром и его делегацией вернулся из Венгрии, где мы провели переговоры с венгерским лидером. Сразу после приземления, судя по холодному приёму, стало ясно, что Венгрия не заинтересована в сотрудничестве с нашей страной."
 slo_foreign.29.a: "Ну ладно..."
 slo_foreign.30.t: "Словакия хочет купить наши танки"
 slo_foreign.30.d: "Словацкая делегация прибыла в Варшаву с просьбой о покупке 50 наших танков PT-91 по разумной цене. Примем ли мы их предложение?"
 slo_foreign.30.a: "Продать танки"
 slo_foreign.30.b: "Эти танки нам ещё нужны."
 slo_foreign.31.t: "Польша согласна"
 slo_foreign.31.d: "Польша согласилась продать нам танки; наша делегация смогла убедить их заключить сделку. Польские танки восстановят нашу стареющую армию."
 slo_foreign.31.a: "Отлично!"
 slo_foreign.32.t: "Польша отказывает"
 slo_foreign.32.d: "Варшава отказалась продавать свои танки нашей стране. Наша делегация не смогла убедить их заключить сделку."
 slo_foreign.32.a: "Жаль..."
 slo_foreign.33.t: "Премьер-министр Словакии прибыл в Прагу"
 slo_foreign.33.d: "Сегодня самолёт с словацкой делегацией во главе с премьер-министром приземлился в Праге. Этот дипломатический визит связан с улучшением отношений между Прагой и Братиславой и обещает быть плодотворным. Однако результаты визита зависят от переговоров между словацким премьер-министром и нашим президентом. Каковы результаты этих переговоров?"
 slo_foreign.33.a: "Давайте подпишем сделку!"
 slo_foreign.33.b: "Мы не заинтересованы в делах с Братиславой"
 slo_foreign.34.t: "Визит в Прагу был плодотворным"
 slo_foreign.34.d: "Сегодня наш самолёт с премьер-министром и его делегацией вернулся из Чехии, где мы провели успешную встречу с чешским лидером. Нам удалось подписать ряд важных документов и соглашений, которые укрепят дружбу между нашими странами!"
 slo_foreign.34.a: "Давайте выпьем за новых друзей!"
 slo_foreign.35.t: "Неудача переговоров в Праге"
 slo_foreign.35.d: "Сегодня наш самолёт с премьер-министром и его делегацией вернулся из Чехии, где мы провели переговоры с чешским лидером. Сразу после приземления, судя по холодному приёму, стало ясно, что Чехия не заинтересована в сотрудничестве с нашей страной."
 slo_foreign.35.a: "Ну ладно..."
 slo_foreign.36.t: "Ультиматум от Словакии"
 slo_foreign.36.d: "Словацкий посол ворвался в наш правительственный офис с отчётом от правительства Словакии. Они хотят воссоздать некогда разрушенное государство Чехословакию. Формулировка сообщения дала понять, что это ультиматум."
 slo_foreign.36.a: "Давайте снова воссоединимся!"
 slo_foreign.36.b: "Начать мобилизацию"
 slo_foreign.37.t: "Чешская Республика отказывает"
 slo_foreign.37.d: "Правительство Чехии отклонило нашу просьбу о воссоздании Чехословакии. Очевидно, они ожидают от нас военных действий, поэтому начинаем мобилизацию!"
 slo_foreign.37.a: "Мы хотели сделать это мирно"
 slo_foreign.38.t: "Возвращение Чехословакии"
 slo_foreign.38.d: "Сегодня было объявлено, что после многочасовой конференции между правительствами Чехии и Словакии было достигнуто соглашение о присоединении Чехии к Словакии и восстановлении некогда разрушенного государства Чехословакии. Время покажет, как это решение повлияет на баланс сил в Европе; мы будем следить за новостями."
 slo_foreign.38.a: "Что?"
 slo_foreign.39.t: "Ультиматум от Словакии"
 slo_foreign.39.d: "Правительство Словакии направило нам ультиматум с требованием освободить Закарпатье и передать его словацкому государству. Словакия заявляет, что готова на всё, чтобы получить желаемое."
 slo_foreign.39.a: "Подчиниться"
 slo_foreign.39.b: "Отказаться от требований"
 slo_foreign.40.t: "[FROM.GetName] подчиняется"
 slo_foreign.40.d: "[FROM.GetName] соглашается передать нам Закарпатье, не желая дальнейшей эскалации и возможной войны."
 slo_foreign.40.a: "Отлично!"
 slo_foreign.41.t: "[FROM.GetName] отказывает"
 slo_foreign.41.d: "[FROM.GetName] отвергает наши требования, заявляя, что готов к войне, если до этого дойдёт. Наши войска ждут приказа о вторжении в [FROM.GetName]."
 slo_foreign.41.a: "Мы хотели сделать это мирно"
 slo_foreign.42.t: "Словакия просит наших советников"
 slo_foreign.42.d: "Правительство Словакии просит нас предоставить политических советников для координации совместных действий наших правительств, и похоже, что Словакия стремится стать частью нашей сферы влияния."
 slo_foreign.42.a: "Мы согласны"
 slo_foreign.42.b: "Нас это не интересует."
 slo_foreign.43.t: "Россия соглашается"
 slo_foreign.43.d: "Российское правительство согласилось на наше предложение, что является успехом наших переговоров."
 slo_foreign.43.a: "Отлично"
 slo_foreign.44.t: "Россия отказалась"
 slo_foreign.44.d: "Российское правительство отклонило наше предложение, что стало провалом переговоров."
 slo_foreign.44.a: "Жаль"
 slo_foreign.45.t: "Словакия просит инвестиции"
 slo_foreign.45.d: "Правительство Словакии, похоже, изменило риторику и попросило инвестиции у нас. Похоже, у нас появилась новая страна в Европе, на которую мы можем влиять."
 slo_foreign.45.a: "Мы согласны"
 slo_foreign.45.b: "Нас это не интересует."
 slo_foreign.46.t: "Военная база в Словакии"
 slo_foreign.46.d: "Правительство Словакии расширяет интеграцию с нами, и теперь они запрашивают размещение нашей военной базы."
 slo_foreign.46.a: "Мы согласны"
 slo_foreign.46.b: "Нас это не интересует."
 slo_foreign.47.t: "Союзное государство Словакии и России"
 slo_foreign.47.d: "Похоже, Словакия готова к финальному этапу интеграции, поскольку их правительство объявило о желании создать с нами Союзное государство."
 slo_foreign.47.a: "Мы согласны"
 slo_foreign.47.b: "Нас это не интересует."
 slo_foreign.48.t: "Словакия предлагает экономическое сотрудничество"
 slo_foreign.48.d: "Правительство Словакии всё чаще готово подписывать с нами новые соглашения, и одна из предлагаемых ими идей — соглашение об экономическом сотрудничестве в нефтяном и инфраструктурном секторах."
 slo_foreign.48.a: "Мы согласны"
 slo_foreign.48.b: "Нас это не интересует."
 slo_foreign.49.t: "Иран соглашается"
 slo_foreign.49.d: "Иранское правительство согласилось на наше предложение, что является успехом наших переговоров."
 slo_foreign.49.a: "Отлично"
 slo_foreign.50.t: "Иран отказался"
 slo_foreign.50.d: "Иранское правительство отклонило наше предложение, что стало провалом переговоров."
 slo_foreign.50.a: "Жаль"
 slo_foreign.51.t: "Словакия хочет закупить наши дроны"
 slo_foreign.51.d: "Правительство Словакии расширяет сотрудничество с нами, и, похоже, они серьёзно рассматривают возможность улучшения своих вооружённых сил, поэтому готовы закупить партию наших дронов."
 slo_foreign.51.a: "Мы согласны"
 slo_foreign.51.b: "Нас это не интересует."
 slo_foreign.52.t: "Словакия хочет подписать контракт с Газпромом"
 slo_foreign.52.d: "Правительство Словакии направило нам предложение заключить энергетическое соглашение с Газпромом; они заинтересованы в поставках энергии с нашей стороны."
 slo_foreign.52.a: "Мы согласны"
 slo_foreign.52.b: "Нас это не интересует."
 slo_foreign.53.t: "Словакия заинтересована в нашей ядерной программе"
 slo_foreign.53.d: "Правительство Словакии заинтересовано в сотрудничестве с нами в области ядерной энергетики, учитывая наш обширный опыт в её создании с нуля."
 slo_foreign.53.a: "Мы согласны"
 slo_foreign.53.b: "Нас это не интересует."
 slo_foreign.54.t: "Словакия предлагает сотрудничество"
 slo_foreign.54.d: "Правительство Словакии предлагает сотрудничество в сельскохозяйственном и инфраструктурном секторах, тем самым обеспечивая экономические выгоды для обеих сторон."
 slo_foreign.54.a: "Мы согласны"
 slo_foreign.54.b: "Нас это не интересует."
 slo_foreign.55.t: "Украина соглашается"
 slo_foreign.55.d: "Украинское правительство согласилось на наше предложение, что является успехом наших переговоров."
 slo_foreign.55.a: "Отлично"
 slo_foreign.56.t: "Украина отказалась"
 slo_foreign.56.d: "Украинское правительство отклонило наше предложение, что стало провалом переговоров."
 slo_foreign.56.a: "Жаль"
 slo_foreign.57.t: "Словакия предлагает взаимные гарантии"
 slo_foreign.57.d: "Правительство Словакии предлагает нам подписать пакт о взаимных гарантиях независимости друг друга. Мы, конечно, всегда рады таким дипломатическим шагам со стороны европейских стран, но, возможно, у всего этого есть причина."
 slo_foreign.57.a: "Мы согласны"
 slo_foreign.57.b: "Нас это не интересует."
 slo_foreign.58.t: "Словакия хочет заключить энергетическое соглашение"
 slo_foreign.58.d: "Правительство Словакии хочет заключить с нами энергетическое соглашение, чтобы снизить свою энергетическую зависимость от других стран. Они хотят получить доступ к нашему СПГ-терминалу."
 slo_foreign.58.a: "Мы согласны"
 slo_foreign.58.b: "Нас это не интересует."
 slo_foreign.59.t: "Польша соглашается"
 slo_foreign.59.d: "Польское правительство согласилось на наше предложение, что является успехом наших переговоров."
 slo_foreign.59.a: "Отлично"
 slo_foreign.60.t: "Польша отказалась"
 slo_foreign.60.d: "Польское правительство отклонило наше предложение, что стало провалом переговоров."
 slo_foreign.60.a: "Жаль"
 slo_foreign.61.t: "Словакия предлагает пакт о взаимной обороне"
 slo_foreign.61.d: "Правительство Словакии, похоже, активно развивает обороноспособность Дунайского региона. Они предлагают нам подписать с ними пакт о взаимной обороне."
 slo_foreign.61.a: "Мы согласны"
 slo_foreign.61.b: "Нас это не интересует."
 slo_foreign.62.t: "Венгрия соглашается"
 slo_foreign.62.d: "Венгерское правительство согласилось на наше предложение, что является успехом наших переговоров."
 slo_foreign.62.a: "Отлично"
 slo_foreign.63.t: "Венгрия отказалась"
 slo_foreign.63.d: "Венгерское правительство отклонило наше предложение, что стало провалом переговоров."
 slo_foreign.63.a: "Жаль"
 slo_foreign.64.t: "Словакия предлагает взаимные гарантии"
 slo_foreign.64.d: "Словацкое правительство предлагает нам подписать пакт о взаимных гарантиях независимости. Мы, конечно, всегда рады видеть такие дипломатические шаги со стороны европейских стран, но, возможно, для всего этого есть причина."
 slo_foreign.64.a: "Мы согласны"
 slo_foreign.64.b: "Нас это не интересует"
 slo_foreign.65.t: "Венгрия соглашается"
 slo_foreign.65.d: "Венгерское правительство согласилось с нашим предложением, что является успехом наших переговоров"
 slo_foreign.65.a: "Отлично"
 slo_foreign.66.t: "Венгрия отказывается"
 slo_foreign.66.d: "Венгерское правительство отклонило наше предложение, что стало провалом наших переговоров"
 slo_foreign.66.a: "Обидно"

 slo_sns.1.t: "Словакия переносит своё посольство в Иерусалим"
 slo_sns.1.d: "Правительство Словакии недавно объявило о переносе своего посольства в Иерусалим. Этот шаг означает официальное признание Иерусалима столицей нашей страны. Это знаменует начало плодотворных и дружеских отношений между нашими государствами."
 slo_sns.1.a: "Давайте выпьем за наших новых партнёров!"
 slo_sns.2.t: "Премьер-министр Словакии прибыл в Иерусалим."
 slo_sns.2.d: "Сегодня самолёт с словацкой делегацией под руководством Премьер-министра приземлился в Иерусалиме. Этот дипломатический визит связан с улучшением отношений между Иерусалимом и Братиславой и обещает быть плодотворным. Однако исход визита будет зависеть от переговоров между словацким Премьер-министром и Президентом нашей страны. Каковы результаты этих переговоров?"
 slo_sns.2.a: "Давайте подпишем соглашение!"
 slo_sns.2.b: "Мы не заинтересованы во взаимодействии с Братиславой"
 slo_sns.3.t: "Визит в Иерусалим оказался успешным"
 slo_sns.3.d: "Сегодня наш самолёт с Премьер-министром и его делегацией вернулся из Израиля, где состоялась успешная встреча с израильским лидером. Мы смогли подписать ряд важных документов и соглашений, которые укрепят дружбу между нашими странами!"
 slo_sns.3.a: "Давайте выпьем за новых друзей!"
 slo_sns.4.t: "Неудача переговоров в Иерусалиме"
 slo_sns.4.d: "Сегодня наш самолёт с Премьер-министром и его делегацией вернулся из Израиля, где мы вели переговоры с израильским лидером. Сразу после приземления, судя по холодному приёму, стало ясно, что Израиль не заинтересован в сотрудничестве с нашей страной."
 slo_sns.4.a: "Ну ладно..."

 slo_commi.1.t: "Словакия запрашивает гарантии"
 slo_commi.1.d: "Словакия, страна, где коммунизм снова восторжествовал, страна, окружённая буржуазными и империалистическими государствами, обратилась к нам за помощью. Они просят предоставить им гарантии безопасности и готовы разместить на своей территории нашу военную базу, прямо в центре Европы. Этот шаг очень выгоден для нас, но может быть негативно воспринят НАТО, поэтому следует быть осторожными и тщательно обдумать, стоит ли рисковать нашими гарантиями."
 slo_commi.1.a: "Защитим нашего коммунистического брата!"
 slo_commi.1.b: "Мы не будем рисковать."
 slo_commi.2.t: "Пекин даёт гарантии"
 slo_commi.2.d: "Сегодня Председатель Коммунистической партии Китая заявил, что Китай поддерживает режим в нашей стране и предоставляет гарантии нашей безопасности и территориальной целостности."
 slo_commi.2.a: "Теперь чувствуем себя безопаснее"
 slo_commi.3.t: "Пекин отказывает"
 slo_commi.3.d: "Представители Китая выразили поддержку нашей стране, но не смогли предоставить гарантии безопасности. По-видимому, они опасаются, что этот шаг будет воспринят как агрессия со стороны США."
 slo_commi.3.a: "Придётся защищаться самим."
 slo_commi.4.t: "Экономическое сотрудничество с [SLO.GetName]"
 slo_commi.4.d: "Правительство Словакии готово подписать с нами экономическое соглашение, по которому мы получим хорошие инвестиции, а они откроют визы для наших работников, что также принесёт нам доход в будущем."
 slo_commi.4.a: "Согласны"
 slo_commi.4.b: "Нет"
 slo_commi.5.t: "Экономическое сотрудничество с [NKO.GetName]"
 slo_commi.5.d: "Они согласились подписать соглашение о экономическом сотрудничестве с нами."
 slo_commi.5.a: "Отлично"
 slo_commi.6.t: "Экономическое сотрудничество с [NKO.GetName]"
 slo_commi.6.d: "Они отказались подписать соглашение о экономическом сотрудничестве с нами."
 slo_commi.6.a: "Жаль"

 slo_smer.1.t: "Проблема иммигрантов"
 slo_smer.1.d: "В нашей стране наблюдается рост числа иммигрантов, главным образом с Ближнего Востока, где политическая нестабильность вынуждает миллионы беженцев мигрировать в более благоприятные европейские страны, такие как наша. Наши граждане жалуются, что мигранты отбирают рабочие места и не уважают нашу культуру. Пора заняться этим позором. Итак, господин Премьер-министр, каково ваше решение?"
 slo_smer.1.a: "Ужесточить миграционную политику"
 slo_smer.1.b: "Помочь мигрантам обосноваться в нашей стране"

 #Liberal Events
 slo_liberals.0.t: "Словакия вступает в ОЭСР"
 slo_liberals.0.d: "Сегодня знаменательный день для Словакии — мы официально вступаем в Организацию экономического сотрудничества и развития. Это достижение отражает нашу приверженность экономическим реформам, демократическим ценностям и международному сотрудничеству. Членство в ОЭСР предоставит нам ценные рекомендации по политике, экономические данные и повысит доверие к нашей стране на мировой арене."
 slo_liberals.0.a: "Начинается новая глава"

 slo_liberals.1.t: "Сделка с U.S. Steel-Словакия"
 slo_liberals.1.d: "После длительных переговоров нам удалось успешно заключить крупную сделку с корпорацией U.S. Steel. В рамках соглашения сталелитейный завод в Кошице будет приватизирован, и будет создано дочернее предприятие U.S. Steel — Košice. Кошице и Словакия в целом получат экономическую выгоду от этого соглашения."
 slo_liberals.1.a: "Второе дыхание экономики!"

 slo_liberals.2.t: "Рай для инвесторов"
 slo_liberals.2.d: "Комментарии Форбс о том, что Словакия стала 'Раем для инвесторов', четко характеризуют инвестиционную активность, которую мы наблюдаем в стране. В частных разговорах многие менеджеры признают, что восхищаются нашими подходами к обеспечению экономического роста. Если всё продолжится в том же темпе, мы можем стать новой Швейцарией или Словенией."
 slo_liberals.2.a: "Время инвестиций!"

 slo_liberals.3.t: "Премьер встречается с Генсеком НАТО"
 slo_liberals.3.d: "Премьер-министр провел высокопрофильную встречу с Генеральным секретарем НАТО для обсуждения интеграции Словакии в альянс. Эта встреча демонстрирует нашу приверженность евроатлантической безопасности и укрепляет наши отношения с государствами-членами НАТО. Обсуждался вклад Словакии в коллективную оборону и региональную стабильность."
 slo_liberals.3.a: "Мы привержены НАТО"

 slo_liberals.4.t: "Премьер назначает специального прокурора"
 slo_liberals.4.d: "В значительном шаге по борьбе с коррупцией премьер-министр назначил специального прокурора для расследования дел о коррупции высокого уровня и организованной преступности. Эта независимая институция будет иметь полномочия привлекать к ответственности чиновников и искоренять преступные сети, угрожающие целостности государственных институтов."
 slo_liberals.4.a: "Коррупцию нужно искоренить"

 slo_liberals.5.t: "Словацкое чудо"
 slo_liberals.5.d: "Словакия достигла выдающегося экономического роста, став известной во всем мире как самая быстрорастущая экономика Европы. Благодаря эффективным рыночным реформам мы превратились из изолированной, борющейся страны в процветающий инвестиционный центр. 'Словацкое чудо' демонстрирует успех наших либеральных экономических политик и восстановило нашу репутацию в международном сообществе."
 slo_liberals.5.a: "Реформы окупились"

 slo_liberals.6.t: "Премьер встречается с чиновниками ЕС"
 slo_liberals.6.d: "Премьер-министр Дзуринда встретился с высокопоставленными чиновниками Европейского союза, чтобы обсудить процесс присоединения Словакии к ЕС. Встреча сосредоточилась на нашем прогрессе в выполнении копенгагенских критериев и нашей приверженности европейской интеграции. Это демонстрирует нашу решимость стать полноценным членом европейской семьи."
 slo_liberals.6.a: "Мы принадлежим Европе"

 slo_liberals.7.t: "Первый пакет реформ одобрен"
 slo_liberals.7.d: "Национальный совет одобрил первый комплексный пакет экономических реформ, предложенный либеральным правительством. Эти реформы включают упрощение налоговой системы, дерегулирование и меры по привлечению иностранных инвестиций. Эта победа в парламенте знаменует начало превращения Словакии в современную экономику, ориентированную на рынок."
 slo_liberals.7.a: "Реформа в процессе"

 #Mečiar Events
 slo_mechair.0.t: "Олигархи присягают на верность"
 slo_mechair.0.d: "В Грашалковичском дворце состоялась важнейшая встреча в истории Словакии. Крупнейшие предприниматели страны собрались на встречу с премьер-министром. Государственные СМИ назвали это событие «привлечением бандитов и олигархов к ответственности». На открытой части встречи премьер-министр произнес длинную речь, обвинив олигархов во всех бедах страны и заявив, что лично займется любым, кто посягнет на богатство страны. На закрытой части, так называемой «гангстерской сделке», заключенной по версии оппозиционных СМИ, произошло перераспределение собственности и разграничение сфер влияния для обеспечения лояльности мафии и олигархов. После встречи наблюдатели отметили приподнятое настроение участников, что говорит об успешности встречи. После этого премьер обратился к народу, заявив о полной победе над бандитами и теневыми бизнесменами."
 slo_mechair.0.a: "Они знают, где их интересы"

 slo_mechair.1.t: "Президент пропал"
 slo_mechair.1.d: "Многие независимые наблюдатели и аналитики отметили, что президент страны тихо исчез с информационного поля. Он не появляется на телеканалах, не участвует в официальных встречах и не даёт интервью. Единственный раз его видели на праздновании Дня независимости, где он практически ни с кем не взаимодействовал, кроме своего ближайшего окружения. Некоторые аналитики утверждают, что премьер тихо оказывает давление на президента, чтобы устранить любое влияние президентской власти и неформально сосредоточить всю власть в своих руках. Группа депутатов оппозиции заявила, что внесёт в парламент резолюцию с требованием объяснить ситуацию, а по всей Братиславе появляются плакаты с надписью «Куда исчез президент?»."
 slo_mechair.1.a: "Это вызывает обеспокоенность"

 slo_mechair.2.t: "Референдум достоинства"
 slo_mechair.2.d: "По всей республике люди в большом количестве собираются на избирательных участках, чтобы проголосовать на референдуме, который премьер-министр республики назвал «Референдумом достоинства». В ходе голосования во многих районах были зафиксированы аномалии и нарушения - от драк с наблюдателями до запугивания со стороны мафии в некоторых малонаселённых регионах. Оппозиция утверждает, что на многих участках имели место вбросы бюллетеней, а также что людей вынуждали голосовать в поддержку референдума под угрозой увольнения на ряде предприятий. Положительный исход референдума будет означать, что премьер-министр теперь будет избираться напрямую населением, а парламент перейдёт на мажоритарную систему, что позволит Мечьяру получить большинство мест с учётом раздробленности оппозиции."
 slo_mechair.2.a: "86,6% проголосовали «За»"

 slo_mechair.3.t: "Тихое утро в Братиславе"
 slo_mechair.3.d: "Утро в Братиславе выдалось на удивление тихим. Если раньше каждое утро парламентские заседания начинались с криков оппозиционных депутатов, драк, потасовок и бросания предметов друг в друга, то теперь никто не осмеливается сказать ни слова - да и говорить, по сути, некому: места главных смутьянов пустовали, как и половина кресел всех оппозиционных фракций.\n\nТеперь, когда половина оппозиционных депутатов была выдавлена из политики, а основные противники Мечьяра в лице парламента и оппозиционных партий были полностью уничтожены, наконец наступила эпоха тишины."
 slo_mechair.3.a: "И необычайно розовое небо…"

 slo_mechair.4.t: "Словакия предлагает экономическую сделку"
 slo_mechair.4.d: "Словакия предложила значительное соглашение о экономическом сотрудничестве с Украиной. Эта сделка укрепит торговые отношения, увеличит взаимные инвестиции и углубит экономические связи между нашими странами. Соглашение представляет возможность расширить экономическое влияние Словакии за пределами Западной Европы и построить партнерские отношения на Востоке."
 slo_mechair.4.a: "Принять сделку"
 slo_mechair.4.b: "Отклонить предложение"

 slo_mechair.5.t: "Украина подписывает сделку"
 slo_mechair.5.d: "Украина согласилась подписать соглашение о экономическом сотрудничестве со Словакией. Сделка успешно заключена, что укрепляет торговые отношения и открывает новые возможности для экономического сотрудничества между нашими странами. Это партнерство принесет экономическую выгоду обеим сторонам и укрепит дипломатические связи."
 slo_mechair.5.a: "Отличные новости"

 slo_mechair.6.t: "Украина отказывается сотрудничать"
 slo_mechair.6.d: "К сожалению, Украина отклонила наше предложение о соглашении о экономическом сотрудничестве. Правительство Украины решило в данный момент не развивать более тесные экономические связи со Словакией. Это потребует от нас поиска альтернативных партнеров и экономических возможностей в других местах."
 slo_mechair.6.a: "Найдем других партнеров"

 slo_mechair.7.t: "Словакия предлагает экономическую сделку"
 slo_mechair.7.d: "Словакия предложила значительное соглашение о экономическом сотрудничестве с Россией. Эта сделка укрепит торговые отношения, увеличит взаимные инвестиции и углубит экономические связи между нашими странами. Соглашение представляет возможность расширить экономическое влияние Словакии и построить стратегическое партнерство с одной из крупнейших экономик мира."
 slo_mechair.7.a: "Принять сделку"
 slo_mechair.7.b: "Отклонить предложение"

 slo_mechair.8.t: "Россия подписывает сделку"
 slo_mechair.8.d: "Россия согласилась подписать соглашение о экономическом сотрудничестве со Словакией. Сделка успешно заключена, что укрепляет торговые отношения и открывает новые возможности для экономического сотрудничества между нашими странами. Это партнерство принесет экономическую выгоду обеим сторонам и укрепит дипломатические связи с Москвой."
 slo_mechair.8.a: "Отличные новости"

 slo_mechair.9.t: "Россия отказывается сотрудничать"
 slo_mechair.9.d: "К сожалению, Россия отклонила наше предложение о соглашении о экономическом сотрудничестве. Российское правительство решило в данный момент не развивать более тесные экономические связи со Словакией. Это потребует от нас поиска альтернативных партнеров и экономических возможностей в других местах."
 slo_mechair.9.a: "Найдем других партнеров"

 slo_mechair.10.t: "Словакия предлагает экономическую сделку"
 slo_mechair.10.d: "Словакия предложила значительное соглашение о экономическом сотрудничестве с Китаем. Эта сделка укрепит торговые отношения, увеличит взаимные инвестиции и углубит экономические связи между нашими странами. Соглашение представляет возможность расширить экономическое влияние Словакии и построить стратегическое партнерство с одной из крупнейших экономик мира."
 slo_mechair.10.a: "Принять сделку"
 slo_mechair.10.b: "Отклонить предложение"

 slo_mechair.11.t: "Китай подписывает сделку"
 slo_mechair.11.d: "Китай согласился подписать соглашение о экономическом сотрудничестве со Словакией. Сделка успешно заключена, что укрепляет торговые отношения и открывает новые возможности для экономического сотрудничества между нашими странами. Это партнерство принесет экономическую выгоду обеим сторонам и укрепит дипломатические связи с Пекином."
 slo_mechair.11.a: "Отличные новости"

 slo_mechair.13.t: "Словакия предлагает восстановить отношения"
 slo_mechair.13.d: "Словакия обратилась к Европейскому союзу с предложением восстановить и нормализовать отношения после изоляции эпохи Мечьяра и политики мечьяризма. Несмотря на нашу националистическую риторику, мы понимаем, что Словакия не сможет выжить в полной изоляции. Мы ищем прагматичный компромисс, который позволит сохранить суверенитет и одновременно получить доступ к европейским рынкам и финансированию."
 slo_mechair.13.a: "Принять их предложение"
 slo_mechair.13.b: "Отклонить их предложение"

 slo_mechair.14.t: "ЕС согласен"
 slo_mechair.14.d: "Европейский союз согласился нормализовать отношения с Словакией. Это представляет собой значительную дипломатическую победу и открывает путь для улучшения торговли, сотрудничества и возможной будущей интеграции. Готовность ЕС взаимодействовать с Словакией, несмотря на мечьяристскую политику, показывает важность прагматичной дипломатии."
 slo_mechair.14.a: "Новое начало с Европой"

 slo_mechair.15.t: "ЕС отказал"
 slo_mechair.15.d: "Европейский союз отверг предложение Словакии нормализовать отношения. ЕС по-прежнему скептически относится к мечьяристской политике и авторитарным тенденциям. Этот отказ усиливает изоляцию Словакии и ясно показывает, что без значимых демократических реформ мы останемся на периферии европейской интеграции."
 slo_mechair.15.a: "Европа отвернулась от нас"

