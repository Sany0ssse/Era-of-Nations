l_russian:
 eon_eu_institutions_category:0 "Европейские институты: назначения"
 eon_eu_institutions_category_desc:0 "Страны в должностях обозначают происхождение независимых кандидатов, а не управление институтами ЕС национальным правительством.\nРотационное председательство в Совете ЕС (шесть месяцев): [?global.eon_eu_council_rotating_holder.GetName]\nКомиссия: [?global.eucomission.GetName] | Парламент: [?global.euparliamentpresident.GetName] | ЕЦБ: [?global.eucentralbank.GetName]\nЕвропейский совет: [?global.eucouncil.GetName] | Верховный представитель: [?global.euforeignaffairs.GetName] | Frontex: [?global.eufrontex.GetName]\n\nТекущая кандидатура: [EonEUOfficeName] — [?global.eon_eu_office_nominee.GetName]\nЭтап: [EonEUOfficePhase]\nСовет/агентство: за — [?global.eon_eu_office_yes|0], против — [?global.eon_eu_office_no|0]. Поддержка в Парламенте: [?global.eon_eu_office_ep_yes|0] из [?global.eon_eu_office_ep_total|0] мест.\nЭтап длится 14 дней. До закрытия можно изменить голос. Отсутствие голоса означает воздержание. Не созданные альтернативные институты остаются недоступными."
 eon_eu_nominate_office_1:0 "Выдвинуть кандидата: $EU_commission_president$"
 eon_eu_nominate_office_1_desc:0 "Открыть голосование по кандидату на свободную должность на 14 дней. Сначала предложение Совета усиленным квалифицированным большинством, затем одобрение большинством всех мест Европарламента. Срок: 1825 дней. Страна обозначает происхождение кандидата; обладатель должности действует независимо."
 eon_eu_nominate_office_2:0 "Выдвинуть кандидата: $EU_parliament_president$"
 eon_eu_nominate_office_2_desc:0 "Открыть голосование по кандидату на свободную должность на 14 дней. Нужно большинство действительных поданных голосов; воздержание не учитывается. Раунд представляет одного кандидата, места национальных делегаций служат игровым приближением. Срок: 913 дней. Страна обозначает происхождение кандидата; обладатель должности действует независимо."
 eon_eu_nominate_office_3:0 "Выдвинуть кандидата: $ECB_president$"
 eon_eu_nominate_office_3_desc:0 "Открыть голосование по кандидату на свободную должность на 14 дней. Усиленное квалифицированное большинство: не менее 72% правительств с правом голоса и 65% их населения. Требуются оба условия. Срок: 2920 дней. Участвуют только страны еврозоны. Тот же кандидат не может получить второй срок; выбор нового квалифицированного специалиста не запрещает участие страны навсегда. Страна обозначает происхождение кандидата; обладатель должности действует независимо."
 eon_eu_nominate_office_4:0 "Выдвинуть кандидата: $EU_council_president$"
 eon_eu_nominate_office_4_desc:0 "Открыть голосование по кандидату на свободную должность на 14 дней. Усиленное квалифицированное большинство: не менее 72% правительств с правом голоса и 65% их населения. Требуются оба условия. Срок: 913 дней. Не более двух сроков для одного кандидата. Страна обозначает происхождение кандидата; обладатель должности действует независимо."
 eon_eu_nominate_office_5:0 "Выдвинуть кандидата: $EU_foreign_minister$"
 eon_eu_nominate_office_5_desc:0 "Открыть голосование по кандидату на свободную должность на 14 дней. Усиленное квалифицированное большинство: не менее 72% правительств с правом голоса и 65% их населения. Требуются оба условия. Срок: 1825 дней. Страна обозначает происхождение кандидата; обладатель должности действует независимо."
 eon_eu_nominate_office_6:0 "Выдвинуть кандидата: $frontex_ExDir$"
 eon_eu_nominate_office_6_desc:0 "Открыть голосование по кандидату на свободную должность на 14 дней. Правление Frontex представлено национальными делегатами; требуется одобрение не менее двух третей. Срок: 1825 дней. Не более двух сроков для одного кандидата. Страна обозначает происхождение кандидата; обладатель должности действует независимо."
 eon_eu_nominate_office_7:0 "Выдвинуть кандидата: $EU_finance_minister$"
 eon_eu_nominate_office_7_desc:0 "Открыть голосование по кандидату на свободную должность на 14 дней. Усиленное квалифицированное большинство: не менее 72% правительств с правом голоса и 65% их населения. Требуются оба условия. Срок: 1825 дней. Это альтернативный институт: сначала должна быть принята соответствующая реформа. Страна обозначает происхождение кандидата; обладатель должности действует независимо."
