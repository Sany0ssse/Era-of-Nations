 eon_eu_nominate_office_10:0 "Выдвинуть кандидата: $EUU_ambassador_unsc$"
 eon_eu_nominate_office_10_desc:0 "Открыть голосование по кандидату на свободную должность на 14 дней. Усиленное квалифицированное большинство: не менее 72% правительств с правом голоса и 65% их населения. Требуются оба условия. Срок: 1825 дней. Это альтернативный институт: сначала должна быть принята соответствующая реформа. Страна обозначает происхождение кандидата; обладатель должности действует независимо."
 eon_eu_office_vote_yes:0 "Поддержать кандидата"
 eon_eu_office_vote_yes_desc:0 "Записать или изменить голос по текущему назначению. В Совете учитываются правительства и население; в Европарламенте — места национальной делегации. Голосования по законам не меняются."
 eon_eu_office_vote_no:0 "Отклонить кандидата"
 eon_eu_office_vote_no_desc:0 "Записать или изменить голос по текущему назначению. В Совете учитываются правительства и население; в Европарламенте — места национальной делегации. Голосования по законам не меняются."
 eon_eu_office_vote_abstain:0 "Воздержаться"
 eon_eu_office_vote_abstain_desc:0 "Записать или изменить голос по текущему назначению. В Совете учитываются правительства и население; в Европарламенте — места национальной делегации. Голосования по законам не меняются."
 eon_eu_office_withdraw_nomination:0 "Отозвать нашу кандидатуру"
 eon_eu_office_withdraw_nomination_desc:0 "Закрыть нашу кандидатуру без назначения. Следующее выдвижение возможно через 60 дней."
 eon_eu_refresh_national_nominees:0 "Выбрать новых квалифицированных кандидатов"
 eon_eu_refresh_national_nominees_desc:0 "Если прежний кандидат ЕЦБ использовал свой невозобновляемый срок либо кандидат Совета/Frontex исчерпал два срока, можно подобрать другого человека. Меняется состав кандидатов, а не их гражданство. Текущие обладатели должностей и голосования сохраняются. Доступно раз в год, вне этих должностей и нашей текущей кандидатуры."
 eon_eu_office_none:0 "Нет текущего назначения"
 eon_eu_office_nominee_eligible_tt:0 "Наша страна — действующий член с правом голоса; институт создан, срок ожидания выдвижения закончился, кандидат соблюдает применимые требования еврозоны, ограничения сроков и наличие побережья."
 eon_eu_office_vacant_tt:0 "Должность свободна; сначала текущий обладатель должен завершить срок или покинуть её."
 eon_eu_office_no_parallel_ballot_tt:0 "Нет другой кандидатуры, ожидающей решения институтов."
 eon_eu_office_current_ballot_tt:0 "Текущий этап назначения ещё открыт, и наша делегация может голосовать. Ограничения Совета не лишают мест в Парламенте; для выборов ЕЦБ требуется участие в еврозоне."
 eon_eu_office_choice_not_already_yes_tt:0 "Мы ещё не поддержали эту кандидатуру."
 eon_eu_office_choice_not_already_no_tt:0 "Мы ещё не отклонили эту кандидатуру."
 eon_eu_office_refresh_cohort_tt:0 "Прежний кандидат исчерпал ограничение сроков ЕЦБ, Европейского совета или Frontex; у нас нет этих должностей и ожидающей кандидатуры, а за последний год новый состав кандидатов не выбирался."
 eon_eu_office_phase_ep:0 "Одобрение Европарламента"
 eon_eu_office_phase_council:0 "Европейский совет: усиленное квалифицированное большинство"
 eon_eu_office_phase_eurozone:0 "Правительства еврозоны: усиленное квалифицированное большинство"
 eon_eu_office_phase_board:0 "Правление Frontex: большинство в две трети"
 eon_eu_institutions.1.t:0 "Кандидатура в европейский институт"
 eon_eu_institutions.1.d:0 "Открыт новый раунд назначения в европейский институт либо начат следующий этап. Откройте Решения → Европейские институты: назначения, проверьте ТЕКУЩЕГО кандидата и этап, затем поддержите, отклоните или воздержитесь. Каждый этап длится 14 дней. Это уведомление не голосует. Отсутствие ответа означает воздержание, а не автоматическое согласие. Институт независим от национального правительства кандидата."
 eon_eu_institutions.2.t:0 "Кандидатура утверждена"
 eon_eu_institutions.2.d:0 "Необходимое институциональное одобрение получено. Наш кандидат вступил в должность на ограниченный срок. Флаг обозначает его происхождение; институт не передаётся нашему правительству. После истечения срока или отставки начинается новый цикл назначения."
 eon_eu_institutions.3.t:0 "Кандидатура не утверждена"
 eon_eu_institutions.3.d:0 "Кандидатура не получила необходимого большинства либо утратила допустимость до утверждения. Должность не предоставлена. Могут быть выдвинуты другие подходящие кандидаты; наше повторное выдвижение доступно через 60 дней."
 eon_eu_institutions_ack:0 "Понятно"
