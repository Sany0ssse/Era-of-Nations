l_russian:
 eon_energy_counter_offer:0 "Подготовить встречное предложение"
 eon_energy_counter_prepare_tt:0 "Сохранить текущий контракт на поставку и подготовить иной объём или цену с этим партнёром в управлении энергией. Условия вступят в силу только после отправки и согласия другой стороны. Пара остаётся зарезервированной на время редактирования. Новый объём должен быть ненулевым; для отказа от переговоров используйте отзыв."
 eon_energy_counter_draft_ready_tt:0 "Встречное предложение относится к зарезервированной паре; рамочное соглашение и предыдущий контракт соответствуют зафиксированным условиям. Партнёр и направление импорта/экспорта закреплены, объём ненулевой, цена неотрицательная, поставщик может обеспечить новый общий объём. Контракт остаётся бессрочным и действует до прекращения."
 eon_energy_counter_partner_locked_tt:0 "Партнёр закреплён, пока существует черновик встречного предложения. Отправьте или отзовите черновик перед выбором другой страны."
 eon_energy_withdraw_available_tt:0 "Мы отправили это ожидающее ответа предложение или владеем его встречным черновиком. Другая страна хранит соответствующую запись переговоров. Отзыв несогласованных условий не прекращает текущий контракт на поставку."
 eon_energy_resume_counter_available_tt:0 "У нас есть черновик встречного предложения этой стране. Откройте управление энергией для продолжения редактирования; отправка проверит рамочное соглашение, контракт и доступную мощность."
 eon_withdraw_energy_offer:0 "Отозвать энергетическое предложение"
 eon_withdraw_energy_offer_desc:0 "Отозвать ожидающее ответа предложение поставки или отказаться от встречного черновика этой пары. Согласованные поставки и платежи сохраняются."
 eon_withdraw_energy_offer_send_desc:0 "Отозвать только несогласованные энергетические условия. Обычное предложение сохраняет резервирование до подтверждения отзыва получателем. Встречный черновик можно закрыть сразу: предыдущий ответ уже обработан. Действующие контракты на поставку сохраняются."
 eon_resume_energy_counter_offer:0 "Продолжить встречное энергетическое предложение"
 eon_resume_energy_counter_offer_desc:0 "Снова открыть наш зарезервированный встречный черновик для этой страны."
 eon_resume_energy_counter_offer_send_desc:0 "Продолжить редактирование объёма и цены в управлении энергией. Обе страны остаются зарезервированными для этих переговоров. Отправка и согласие повторно проверят текущие условия; предыдущий контракт продолжает действовать."
 eon_energy_negotiation_ack:0 "Понятно"
 eon_energy_negotiation.10.t:0 "Энергетические условия отклонены"
 eon_energy_negotiation.10.desc:0 "Получившее предложение правительство отклонило эти условия поставки энергии. Этот ответ не заменил предыдущий контракт на поставку. Переговоры можно продолжить новым предложением."
 eon_energy_negotiation.11.t:0 "Энергетическое предложение отозвано"
 eon_energy_negotiation.11.desc:0 "Несогласованное энергетическое предложение было отозвано. Эти условия не вступили в силу. Отзыв не прекратил ранее согласованный контракт на поставку."
 eon_energy_negotiation.12.t:0 "Энергетическое предложение больше не действует"
 eon_energy_negotiation.12.desc:0 "При обработке ответа условия больше не соответствовали сторонам, рамочному соглашению или предыдущим записям поставок. Новый контракт не был создан. Этот ответ не изменил предыдущий контракт; отдельные изменения войны, рамочного соглашения или мощности могли повлиять на него."
 eon_energy_negotiation.13.t:0 "Недостаточно мощности для предложенного объёма"
 eon_energy_negotiation.13.desc:0 "При обработке ответа поставщик не мог обеспечить весь предложенный объём с учётом остальных обязательств. Этот ответ не создал новый контракт. Можно предложить меньший объём, если остальные условия остаются действительными."
 eon_energy_negotiation.14.t:0 "Покупатель отказал при бюджетной нагрузке"
 eon_energy_negotiation.14.desc:0 "Покупатель отклонил условия по своей текущей коммерческой оценке. Расходы превышали доходы, и бюджетная нагрузка снизила готовность к согласию. Оценка не проверяла возможность оплатить конкретный счёт. Этот ответ не заменил предыдущий контракт на поставку."
 eon_energy_negotiation.15.t:0 "Покупатель отклонил коммерческие условия"
 eon_energy_negotiation.15.desc:0 "Покупатель отклонил предложенные объём и цену по своей текущей оценке потребности в энергии и коммерческих условий. Этот ответ не заменил предыдущий контракт на поставку. Можно предложить другие конкретные условия."
 eon_energy_negotiation.16.t:0 "Поставщик отказался от бесплатной поставки"
 eon_energy_negotiation.16.desc:0 "Предложенная цена была нулевой. Поставщик отклонил эти условия по своей действующей коммерческой оценке. Этот ответ не заменил предыдущий контракт на поставку."
 eon_energy_negotiation.17.t:0 "Поставщик отклонил коммерческие условия"
 eon_energy_negotiation.17.desc:0 "Поставщик отклонил предложенные объём и цену по своей текущей коммерческой оценке. Этот ответ не заменил предыдущий контракт на поставку. Можно предложить другие конкретные условия."
 eon_energy_negotiation.19.t:0 "Подготовлен встречный энергетический черновик"
 eon_energy_negotiation.19.desc:0 "Получившее предложение правительство открыло встречный черновик по этой поставке энергии. Прежние предложенные условия не были согласованы. Подготовка черновика не изменила предыдущий контракт. Пара была зарезервирована для редактирования, отправки или отзыва этого черновика."
 eon_energy_counter_pending_import_desc:0 "Встречное предложение. [FROM.GetName] предлагает нам импортировать £text_icon_energyies §Y[?eon_energy_offer_quantity|0] ГВт§! по цене §Y$[?eon_energy_offer_price|2] млрд за ГВт в неделю§!. Общий еженедельный платёж: §R$[?eon_energy_offer_weekly|2] млрд§!.\n\nНаш текущий объём со знаком: §Y[?eon_energy_offer_old_amount|0] ГВт§! (плюс: импорт; минус: экспорт), цена — $[?eon_energy_offer_old_price|2] млрд за ГВт, общая сумма — $[?eon_energy_offer_old_weekly|2] млрд в неделю. Нулевой объём означает отсутствие действующего контракта на поставку.\n\nПредлагаемые условия зафиксированы до нашего ответа. Текущий контракт действует во время переговоров. Согласие заменит двусторонний контракт; отказ сохранит его. Контракт бессрочный и действует до прекращения. Любая сторона может предложить пересмотр или прекратить поставки через управление энергией. Дефицит энергии или отмена рамочного соглашения прекращает поставки и платежи."
 eon_energy_counter_pending_export_desc:0 "Встречное предложение. [FROM.GetName] предлагает нам экспортировать £text_icon_energyies §Y[?eon_energy_offer_quantity|0] ГВт§! по цене §Y$[?eon_energy_offer_price|2] млрд за ГВт в неделю§!. Общие еженедельные поступления: §G$[?eon_energy_offer_weekly|2] млрд§!.\n\nНаш текущий объём со знаком: §Y[?eon_energy_offer_old_amount|0] ГВт§! (плюс: импорт; минус: экспорт), цена — $[?eon_energy_offer_old_price|2] млрд за ГВт, общая сумма — $[?eon_energy_offer_old_weekly|2] млрд в неделю. Нулевой объём означает отсутствие действующего контракта на поставку.\n\nПредлагаемые условия зафиксированы до нашего ответа. Текущий контракт действует во время переговоров. Согласие заменит двусторонний контракт; отказ сохранит его. Контракт бессрочный и действует до прекращения. Любая сторона может предложить пересмотр или прекратить поставки через управление энергией. Дефицит энергии или отмена рамочного соглашения прекращает поставки и платежи."
