l_russian:
 eon_ammo_storage_available_tt: "На текущих складах получателя есть место для всей партии из §Y100 000§! единиц боеприпасов."
 eon_ammo_donor_available_tt: "У отправителя нет предложения боеприпасов без ответа или неразрешённого прежнего ответа. У этого партнёра нет неразрешённого прежнего ответа."
 eon_ammo_quarantined_tt: "У отправителя нет неразрешённого ответа по боеприпасам, первоначального партнёра которого невозможно определить."
 eon_ammo_withdraw_offer: "Отозвать предложение боеприпасов"
 eon_ammo_withdraw_offer_send_desc: "Отозвать наше предложение §Y100 000§! единиц боеприпасов, на которое ещё не ответили. Зарезервированные боеприпасы возвращаются на наши склады по мере освобождения места. Прежний ответ нужно закрыть перед новым предложением."
 eon_ammo.1.t: "Передача боеприпасов не состоялась"
 eon_ammo.1.d: "Предложение больше не соответствует согласованным условиям: срок истёк, оно отозвано, получатель утратил право на поставку или его склады не вмещают всю партию. Боеприпасы не переданы. Зарезервированная партия остаётся нашей и возвращается на склады по мере освобождения места."
 eon_ammo.2.t: "Предложение боеприпасов отозвано"
 eon_ammo.2.d: "Отправитель отозвал предложение боеприпасов, на которое ещё не ответили. Поставка по нему не состоится. Закройте первоначальный дипломатический ответ, чтобы освободить резервирование отправителя."
 eon_ammo.3.t: "Предложение боеприпасов без ответа закрыто"
 eon_ammo.3.d: "Срок предложения без ответа истёк через 30 дней либо получатель прекратил существовать. Боеприпасы не переданы. Зарезервированная партия остаётся нашей и возвращается на склады по мере освобождения места. Новое предложение этому же партнёру заблокировано: закрытие прежнего дипломатического ответа не подтверждено. Другие партнёры остаются доступны."
 eon_ammo.4.t: "Предложения боеприпасов приостановлены"
 eon_ammo.4.d: "Предложение боеприпасов невозможно надёжно сопоставить с первоначальным дипломатическим ответом. Боеприпасы, ещё находящиеся в резерве, остаются нашими и возвращаются на склады по мере освобождения места. Дальнейшие предложения заблокированы: этот неразрешённый ответ невозможно безопасно определить."
 eon_ammo.ack: "Понятно"
