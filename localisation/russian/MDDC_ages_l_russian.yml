 AGE_1_NAME: "Рассвет тысячелетия"
 AGE_1_DESC: "Информационная эпоха - это исторический период, начинающийся в 21 веке и характеризующийся быстрым переходом от традиционной промышленности, который принесла Промышленная революция в результате индустриализации, к экономике, основанной в первую очередь на информационных технологиях."
 AGE_2_NAME: "Война с террором"
 AGE_2_DESC: "Война с терроризмом, официально называемая Глобальной войной с терроризмом, представляет собой глобальную военную кампанию, начатую Соединенными Штатами после терактов 11 сентября 2001 года, и является одним из самых недавних глобальных конфликтов, охватывающих множество войн."
 AGE_3_NAME: "Локальные столкновения"
 AGE_3_DESC: "Эпоха локальных противостояний заключается в относительной стабильности мира, сотрясаемой лишь незначительными конфликтами, которые не касаются границ великих держав."
 AGE_4_NAME: "Вторая холодная война"
 AGE_4_DESC: "Эта эпоха характеризуется соперничеством в различных взаимосвязанных сетях, таких как инфраструктура, цифровые технологии, производство и финансы, а не главным образом военным и идеологическим конфликтом времен холодной войны."
 AGE_5_NAME: "Надвигающийся шторм"
 AGE_5_DESC: "На фоне продолжающихся мелкомасштабных конфликтов великие державы готовятся к полномасштабной конфронтации и не исключают дальнейшей эскалации."
 AGE_6_NAME: "Третья мировая война"
 AGE_6_DESC: "Мир в огне, и, возможно, именно вы его начали. Постарайтесь победить или, по крайней мере, выжить в новой Великой войне."
