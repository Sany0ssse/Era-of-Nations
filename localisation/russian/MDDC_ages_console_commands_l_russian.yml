l_russian:
 d_eu4_style_ages_console_commands_DESC: "Отображает все консольные команды, добавленные модом §LЭпохи§!"
 D_EU4_STYLE_AGES_CONSOLE_COMMANDS_TT_1: "Мод §LЭпохи§! добавляет следующие консольные команды:"
 D_EU4_STYLE_AGES_CONSOLE_COMMANDS_TT_2: "\nВведите §Yhelp <команда>§! чтобы получить дополнительную информацию о конкретной команде."
 d_add_splendor_DESC: "Добавляет указанное количество блеска. \nИспользование: §Yadd_splendor <число>§!. Добавит §Y100§! если количество не было указано."
 D_ADD_SPLENDOR_TT: "Добавит §Y[?args^0?100]§! блеска."
 d_start_next_age_DESC: "Мгновенно начинается следующая эпоха, независимо от того, выполнены требования или нет."
 D_START_NEXT_AGE_TT: "Запущен процесс §Y[This.GetCurrentAgeOtherContext]§! "
 D_START_NEXT_AGE_TT_LAST_AGE_REACHED: "§Y[This.GetCurrentAge]§! - последняя эпоха"
 d_unlock_age_ability_DESC: "Разблокирует указанную способность эпохи, если это возможно, без потери блеска. \nИспользование: §Yunlock_age_ability <Идентификатор>§!."
 D_UNLOCK_AGE_ABILITY_TT: "§Y[This.GetAgeAbilityOtherContext]§! разблокирован"
 D_UNLOCK_AGE_ABILITY_TT_ABILITY_IS_INVALID_FOR_CURRENT_AGE: "§RСпособность, указанная в указанной эпохе, не может быть разблокирована в текущей.§!"
 D_UNLOCK_AGE_ABILITY_TT_INVALID_ARGUMENTS: "§RНеопределенное количество аргументов.§!"
 d_start_golden_age_DESC: "Начинается золотой век независимо от достигнутых целей. \nИспользование: §Ystart_golden_age§!."