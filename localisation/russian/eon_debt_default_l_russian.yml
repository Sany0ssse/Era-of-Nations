 eon_debt_default_legacy_notice_title:0 "Старое уведомление о взыскании отменено"
 eon_debt_default_legacy_notice_desc:0 "Это уведомление относится к прежнему механизму взыскания. Оно отменено и не создаёт выплат или новых обязательств. Текущий непогашенный остаток задолженности после дефолта можно оплатить через решения."
 eon_debt_default_legacy_notice_tt:0 "Старое уведомление о взыскании отменено. Текущие долги и средства казны не меняются."
 eon_debt_default_asset_liquidation_tt:0 "Через 5 дней ликвидировать один подходящий уровень актива с условной стоимостью §Y$10 млрд§!. Погасить только остаток обязательства после дефолта; весь избыток направить в казну. Погашенное обязательство, отсутствие актива или недостаточная вместимость казны отменяют ликвидацию."
 eon_debt_default_asset_available_tt:0 "Нужны положительный остаток действующего или просроченного обязательства после дефолта, принадлежащий стране и контролируемый ею актив, место в казне для всего избытка и отсутствие другой отложенной ликвидации."
