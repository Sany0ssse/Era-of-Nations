l_russian:
 eon_support_request_withdraw_request:0 "Отозвать наш запрос поддержки"
 eon_support_request_withdraw_request_send_desc:0 "Отозвать нерассмотренный запрос к этому партнёру. На этом этапе поддержка ещё не согласована. Отзыв бесплатен и не возвращает стоимость исходного запроса и не отменяет его 360-дневное ограничение."
 eon_support_request.1.t:0 "Запрос поддержки отозван"
 eon_support_request.1.d:0 "Обратившаяся страна отозвала исходный запрос. Мы можем закрыть его без предложения поддержки. Уже отдельно согласованная помощь продолжает действовать на своих условиях."
 eon_support_request.2.t:0 "Запрос поддержки закрыт"
 eon_support_request.2.d:0 "Исходный запрос больше нельзя рассмотреть: срок ответа закончился или страны больше не соответствуют военным условиям обращения. Его 360-дневное ограничение сохраняется. Отдельно предложенная или согласованная поддержка продолжает действовать на своих условиях."
 eon_support_request.ack:0 "Понятно"
 eon_support_request_menu_available_tt:0 "Нужен нерассмотренный запрос этого партнёра в пределах 30-дневного срока ответа; обе страны должны по-прежнему соответствовать условиям обращения во время оборонительной войны."
