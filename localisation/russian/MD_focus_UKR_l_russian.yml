l_russian:
 # Header
 ukraine_focus: "Украинское дерево фокусов"
 #Dynamic modifiers chernobyl
 UKR_home_to_chernobyl_zone: "Родина Чернобыльской зоны отчуждения"
 UKR_chernobyl_tooltip: "Чернобыльская зона отчуждения была создана в северных регионах этого штата после катастрофической ядерной аварии на Чернобыльской атомной электростанции. Зона охватывает территорию площадью примерно 2600 квадратных километров в Украине и была эвакуирована и объявлена непригодной для проживания из-за высокого уровня радиоактивного загрязнения. С момента создания зона отчуждения управляется украинским правительством, и продолжаются усилия по мониторингу и устранению экологических и медицинских последствий катастрофы."
 UKR_chernobyl_effects_tooltip: "§Rдополнительные утечки радиации могут вызвать долгосрочные повреждения§!"
 UKR_ukraine_elections: "Украинские выборы"
 UKR_ukraine_elections_desc: "Пришло время решить, кто будет вести нашу страну дальше"
 donbass_civil_war: "Гражданская война в Донбассе произошла"
