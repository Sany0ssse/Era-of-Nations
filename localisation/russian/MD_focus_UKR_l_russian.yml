ukraine_coup.2.t: "Россия Устроила Переворот!"
ukraine_coup.2.d: "Последние сообщения из Киева указывают, что агенты, поддерживаемые Россией, устроили переворот в нашем правительстве! Теперь нашей страной будет править пророссийская элитная клика."
ukraine_coup.2.a: "Что За Хрень?"

###Revolution Events
###Incident in the Kerch Strait
ukraine_kerch_strait.15.t: "Россия захватывает наши корабли в Керченском проливе!"
ukraine_kerch_strait.15.d: "Работая в рамках законности Договора 2003 года с Россией, который гарантирует проход через Керченский пролив для обеих сторон, 2 патрульных катера вместе с буксиром попытались пройти через пролив сегодня после предварительного уведомления россиян в Крыму. Хотя мы не получили ответа, флот пошел вперед и попытался пройти, но российские службы безопасности потребовали остановиться, до такой степени, что грузовое судно было перемещено, чтобы заблокировать их. Наши суда оставались на якоре некоторое время, прежде чем решили вернуться в украинские порты, но были преследованы и обстреляны российскими кораблями и захвачены ими, несколько членов экипажа были ранены, и два корабля получили повреждения."
ukraine_revolution.15.a: "Чертова Россия!"

UKR_Invest_into_TRO_TT: "Мы можем инвестировать в наши бригады территориальной обороны, по одной бригаде за раз. Мы сможем использовать их в случае войны."
russia_will_be_angry_TT: "§RРоссия сможет вмешиваться напрямую§!"



