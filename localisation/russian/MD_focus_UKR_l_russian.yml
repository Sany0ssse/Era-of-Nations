##########YANUKOVICH##########
##########Focuses##########
UKR_party_regions_start: "Партия Регионов"
UKR_party_regions_start_desc: "Янукович взял власть в стране в свои руки, пора регионам!"
UKR_party_regions_inaguration: "Инаугурация Януковича"
UKR_party_regions_inaguration_desc: "Пришло время для инаугурации нашего нового президента"
UKR_party_regions_decrease: "Сократить Аппарат Администрации"
UKR_party_regions_decrease_desc: "Мы сократим количество сотрудников государственного аппарата"
UKR_party_regions_anti_corrupt: "Национальный Антикоррупционный Комитет"
UKR_party_regions_anti_corrupt_desc: "Мы создадим новое министерство, национальный Антикоррупционный Комитет, для борьбы с коррумпированными чиновниками в нашей стране"
UKR_party_regions_committee_economic: "Комитет Экономических Реформ"
UKR_party_regions_committee_economic_desc: "Мы также создадим еще одно министерство, Комитет Экономических Реформ."
UKR_party_regions_unifed_window: "Единое Окно Инвестиций"
UKR_party_regions_unifed_window_desc: "Мы введем новые правила для инвесторов в нашей стране, которые облегчат им взаимодействие с нашими властями"
UKR_party_regions_decrease_agro: "Сократить Регулирование Сельского Хозяйства"
UKR_party_regions_decrease_agro_desc: "Агропромышленность получит новые льготы, тем самым мы надеемся увеличить ее производительность."
UKR_party_regions_laizes: "Либерализм"
UKR_party_regions_laizes_desc: "Мы частично примем один из либертарианских принципов в нашей экономической политике и не будем вмешиваться в экономические процессы"
UKR_party_regions_taxx: "Изменить Налоговый Кодекс"
UKR_party_regions_taxx_desc: "Мы внесем изменения в налоговый кодекс, которые считаем необходимыми. Наши уступки снизят местные налоги в три раза!"
UKR_party_regions_autocracy: "Усилить Автократию"
UKR_party_regions_autocracy_desc: "Сильное правительство должно контролировать все, что может, иначе это хаос и беспорядок, которые существовали до нашего правления"
UKR_party_regions_pressure_media: "Давление На СМИ"
UKR_party_regions_pressure_media_desc: "СМИ стали слишком свободными, необходимо охладить их пыл"
UKR_party_regions_stability_reform: "Стабильность И Реформы"
UKR_party_regions_stability_reform_desc: "Мы соберем лояльную коалицию политиков, которую назовем \"Стабильность и Реформы\", которая будет активно продвигать наши проекты и идеи"
UKR_party_regions_stability_restricting_freedom_speech: "Ограничение Свободы Слова"
UKR_party_regions_stability_restricting_freedom_speech_desc: "Свобода слова заканчивается там, где начинает нас оскорблять"
UKR_party_regions_stability_purge_opposition: "Попытка Очистить Политическую Оппозицию"
UKR_party_regions_stability_purge_opposition_desc: "Оппозиция слишком своевольна и подрывает институты власти, используя свою свободу, пора это исправить"
UKR_party_regions_lustration: "Люстрация Губернаторского Корпуса И Служб Безопасности"
UKR_party_regions_lustration_desc: "Люстрация нелояльных и открыто вредных для государства людей в этих структурах давно необходима"
UKR_party_regions_agreement_opposition: "Соглашения С Оппозицией"
UKR_party_regions_agreement_opposition_desc: "Мы попытаемся наладить отношения с некоторой частью оппозиции, тем самым разделив ее"
UKR_party_regions_appease_the_westermists: "Умиротворить Западников"
UKR_party_regions_appease_the_westermists_desc: "Западная Украина давно является очагом недовольства и нестабильности, мы их умиротворим, попытаюсь дать им то, что они хотят - обещания"
UKR_party_regions_request_russian: "Запросить Российские Инвестиции"
UKR_party_regions_request_russian_desc: "Мы запросим российские инвестиции, они явно не будут лишними."
UKR_party_regions_personal_gain: "Сосредоточиться На Личной Выгоде"
UKR_party_regions_personal_gain_desc: "Страна, конечно, хороша, но стоит подумать о себе"
UKR_party_regions_mezhyhirya: "Межигорье"
UKR_party_regions_mezhyhirya_desc: "Как настоящему президенту, нужно иметь свое убежище, где можно отдохнуть от политических забот и дел"
UKR_party_regions_titushki: "Вывести Титушек"
UKR_party_regions_titushki_desc: "Мы будем использовать новый метод дискредитации оппозиционных митингов - Титушки."
UKR_party_regions_regional_council: "Региональный Совет"
UKR_party_regions_regional_council_desc: "Мы введем новый орган власти, региональный совет, для облегчения взаимодействия региональных и государственных властей"
UKR_party_regions_optimise_east_ukraine_gamble: "Ставка На Восточную Украину"
UKR_party_regions_optimise_east_ukraine_gamble_desc: "Восточная Украина всегда была нашим вотчиной, мы будем активно пытаться получить их поддержку, потому что фактически они наш основной электорат"
UKR_party_regions_optimise_prior_loyals: "Приоритет Лояльным"
UKR_party_regions_optimise_prior_loyals_desc: "Люди, лояльные нам, гораздо важнее, и мы будем активно их продвигать"
UKR_party_regions_western_oligarch: "Подход К Западным Олигархам"
UKR_party_regions_western_oligarch_desc: "Олигархи западной Украины будут нашим приоритетом, мы хотим найти баланс между западом и востоком, возможно, их олигархи помогут нам"
UKR_party_regions_meet_akhmetov: "Встретиться С Ахметовым"
UKR_party_regions_meet_akhmetov_desc: "Донецкий клан олигархов и его представитель Ринат Ахметов - важный политический ресурс, который мы используем для поддержания нашей власти, стоит его послушать"
UKR_party_regions_informational_act: "Информационный Акт"
UKR_party_regions_informational_act_desc: "Новый акт, или закон, откроет доступ широким массам к деятельности политиков, что снизит коррупционную составляющую в их деятельности"
UKR_party_regions_optimise_ministries: "Оптимизировать Министерства"
UKR_party_regions_optimise_ministries_desc: "Правительственные структуры стали слишком огромными, пора их сократить"
UKR_party_regions_reform_constituion: "Реформирование Конституции"
UKR_party_regions_reform_constituion_desc: "Мы будем активно продвигать реформу конституции, пора нашей стране двигаться к глобальным изменениям!"
UKR_party_regions_compulsory: "Изменение Обязательной Военной Службы"
UKR_party_regions_compulsory_desc: "Мы изменим систему службы в нашей армии, буквально превратив ее в контрактную"
UKR_party_regions_pension_reform: "Пенсионная Реформа"
UKR_party_regions_pension_reform_desc: "Пенсионная реформа давно назревала, и теперь мы ее проведем"
UKR_party_regions_kozhara: "Кожара - Лидер МИД"
UKR_party_regions_kozhara_desc: "Мы назначим одного из наших друзей и партнеров министром иностранных дел"
UKR_party_regions_youth_region: "Расширить Молодежные Регионы"
UKR_party_regions_youth_region_desc: "Молодежное крыло нашей партии получит больше власти и влияния, мы откроем им доступ"
UKR_party_regions_berkut_reforms: "Реформы Беркута"
UKR_party_regions_berkut_reforms_desc: "Беркут, как полицейская структура, нуждается в реформах, чтобы мы могли защитить себя"
UKR_party_regions_berkut_extreme_training: "Экстремальная Подготовка Для Беркута"
UKR_party_regions_berkut_extreme_training_desc: "Беркут станет еще более активным в проведении соревнований и тренировочных процессов для повышения своего мастерства"
UKR_dual_language: "Двуязычное Государство"
UKR_dual_language_desc: "Русский язык занимает важную часть жизни Украины, и было бы глупо это отрицать. Мы не будем продвигать глупые политические идеи об отмене русского языка в нашей стране"
UKR_cancel_decommunization: "Антидекоммунизация"
UKR_cancel_decommunization_desc: "Мы не позволим борьбу с нашим советским прошлым, когда мы боролись с фашизмом и нацизмом."
UKR_donbass_autonomy_pass: "Особая Автономия Донбасса"
UKR_donbass_autonomy_pass_desc: "Донбасс - особый регион нашей страны, возможно, пора начать обсуждение особой автономии этого региона"
UKR_sng_integrate: "Интеграция СНГ"
UKR_sng_integrate_desc: "Мы продолжим интеграционные процессы в рамках сотрудничества между странами СНГ"
UKR_europe_negotiat: "Переговоры С ЕС"
UKR_europe_negotiat_desc: "Мы начнем переговоры с Европейским Союзом по вопросу, который давно находится в нашей политической повестке дня. Это ассоциация с Европейским Союзом"
UKR_russian_ukrainian_military_coop: "Украинско-Российское Военное Сотрудничество"
UKR_russian_ukrainian_military_coop_desc: "Мы укрепим сотрудничество с Вооруженными Силами России"
UKR_party_regions_european_chart: "Европейская Языковая Хартия"
UKR_party_regions_european_chart_desc: "Мы подпишем Европейскую хартию региональных языков как показатель нашего демократического отношения к национальным меньшинствам"
##########Ideas##########
UKR_parti_regions_anti_corruption_commitie: "Национальный Антикоррупционный Комитет"
UKR_parti_regions_anti_corruption_commitie_desc: "Новый комитет предназначен для борьбы с коррумпированными чиновниками на всех уровнях"
UKR_parti_regions_economic_committee: "Комитет Экономических Реформ"
UKR_parti_regions_invest_open_window: "Единое Окно Инвестиций"
UKR_parti_regions_taxx: "Реформированный Налоговый Кодекс"
UKR_parti_regions_laizes: "Либерализм"
