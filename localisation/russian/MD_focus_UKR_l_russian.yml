UKR_hur_decision_category_desc: "\n\n\n\n\n\n£UKR_desctext_hur\n\n\n\n\n\n\n\n\nГлавное управление разведки Министерства обороны Украины - это военная разведывательная служба украинского правительства. Это отдел Министерства обороны, а не Генерального штаба Вооруженных сил Украины. С помощью этого министерства мы сможем проводить различные диверсионные операции в соседних странах, а также совершать вылазки с помощью диверсионного батальона.\n\n\n\nТекущее количество оперативных пунктов ГУР: [?hur_points]"
