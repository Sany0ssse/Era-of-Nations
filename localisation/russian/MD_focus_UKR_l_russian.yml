UKR_start_war_against_russia_desc: "Решающий момент нашего государства настал. Мы отобьем врага или исчезнем из мировой истории."
UKR_inter_legion: "Международный легион территориальной обороны"
UKR_inter_legion_desc: "Международный легион территориальной обороны Украины - это проект правительства Украины по привлечению иностранцев для создания добровольческих подразделений в составе территориальной обороны Вооруженных сил Украины."
UKR_kraken: "Спецподразделение «Кракен»"
UKR_kraken_desc: "Спецподразделение Кракен - это украинское отдельное разведывательно-диверсионное подразделение Главного управления разведки Министерства обороны Украины."
UKR_hur_expanded: "Расширить влияние ГУР"
UKR_hur_expanded_desc: "Мы расширим полномочия ГУР, ситуация требует этого, война требует этого!"
UKR_tro_expanded: "Усилить территориальную оборону"
UKR_tro_expanded_desc: "Мы срочно расширим набор в территориальную оборону, нам нужны бойцы немедленно!"
UKR_drone_army: "Армия дронов"
UKR_drone_army_desc: "Мы начнем массовое производство дронов. Стране нужны тысячи дронов"
UKR_tck: "Всеобщая мобилизация"
UKR_tck_desc: "Нам придется начать всеобщую мобилизацию, потому что это буквально война за существование нашего государства"
UKR_other_battaions_hur: "Новые батальоны ГУР"
UKR_other_battaions_hur_desc: "ГУР активно набирает бойцов в свои батальоны, некоторые из них уже готовы вступить в бой"
UKR_attack_guardia: "Ударная гвардия"
UKR_attack_guardia_desc: "Мы готовы перейти от обороны к наступлению! Ударная гвардия для поражения врага!"
UKR_free_russia_legion: "Легион Свободы России"
UKR_free_russia_legion_desc: "Настоящие русские патриоты готовы сражаться за нас и свергнуть тиранию, которая висит над Россией"
UKR_rdk: "Русский добровольческий корпус"
UKR_rdk_desc: "Русские националисты, которые не согласны с политикой России, самоорганизовались под нашим командованием в русский добровольческий корпус"
UKR_republican_army: "Национальная республиканская армия"
UKR_republican_army_desc: "Беглые депутаты из России создали национальную республиканскую армию, которая будет вести активную партизанскую деятельность против режима"
UKR_separatist_battalions: "Привлечь сепаратистские батальоны"
UKR_separatist_battalions_desc: "Не только русские, но и другие народы готовы бороться за свободу от русского империализма"
