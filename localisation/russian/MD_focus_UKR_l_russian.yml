 ##########Ideas##########
 UKR_republic_ukr: "Федеративная Республика"
 UKR_republic_ukr_desc: "Федеративная Республика - это особый тип образования, который является основой всей Украинской Федерации. Она имеет расширенную автономию, а также возможность принимать собственные законы"
 UKR_confederation: "Федерализация"
 UKR_confederation_desc: "Несколько регионов получили максимально возможную автономию, что привело к государству, похожему на конфедеративную систему"
