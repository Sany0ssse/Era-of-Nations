#### PARLIAMENT ###
ukraine_parliament.100.d: "Пророссийский Блок Выигрывает Большинство Мест"
ukraine_parliament.100.t: "Пророссийский блок в нашем парламенте выиграл большинство мест в нашем парламенте в результате высокого уровня влияния, которое российское правительство в настоящее время имеет над Украиной."
ukraine_parliament.100.a: "Посмотрим, Как Они Справятся"
ukraine_parliament.200.d: "Прозападный Блок Выигрывает Большинство Мест"
ukraine_parliament.200.t: "Прозападный блок в нашем парламенте выиграл большинство мест в нашем парламенте в результате высокого уровня влияния, которое американское правительство в настоящее время имеет над Украиной."
ukraine_parliament.200.a: "Посмотрим, Как Они Справятся"
ukraine_parliament.300.t: "Проукраинский Блок Выигрывает Большинство Мест"
ukraine_parliament.300.d: "Проукраинский блок в нашем парламенте выиграл большинство мест на недавних выборах, и это связано с колеблющимся влиянием американского правительства и российского правительства."
ukraine_parliament.300.a: "Посмотрим, Как Они Справятся"
ukraine_parliament.400.t: "Парламентские Выборы"
ukraine_parliament.400.d: "Сезон выборов снова наступил, и избирательные участки по всей стране начали открываться. Надеемся, явка избирателей будет достаточно высокой, чтобы принести хорошие изменения в стране.."
ukraine_parliament.400.a: "Посмотрим, Как Пойдет"
ukraine_parliament.1.t: "Парламент одобряет закон о централизации"
ukraine_parliament.1.d: "Парламент решил принять законопроект, который увеличивает наши бюрократические расходы, следуя предложению, которое мы сделали несколько дней назад."
ukraine_parliament.1.a: "Отлично"
ukraine_parliament.2.t: "Парламент отклоняет новый закон о централизации"
ukraine_parliament.2.d: "Парламент решил против законопроекта, который увеличил бы наши бюрократические расходы. Это следует за нашим предложением, которое было сделано несколько дней назад, и похоже, что предложение просто не было достаточно популярным."
ukraine_parliament.2.a: "К сожалению"
ukraine_parliament.2.b: "Возможно, небольшая взятка может изменить их мнение..."
