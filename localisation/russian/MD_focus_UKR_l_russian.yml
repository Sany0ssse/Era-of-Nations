UKR_t84_oplot: "Собрать Прототип §YТанка Т-84 Оплот§!"
UKR_bpla_oup: "Провести Разработки В Области §YБПЛА§!"
UKR_btr70_m: "Собрать Прототип §YБТР 70М§!"
UKR_BTR_4: "Собрать Прототип §YБТР-4 Буцефал§!"
UKR_bm21_k: "Собрать Прототип §YБМ-21К§!"

UKR_helicopter: "Провести Разработки В Области §YВертолетов§!"
UKR_tro_brigades_ukraine_decision_category: "Силы Территориальной Обороны Украины"
UKR_tro_brigades_ukraine_decision_category_desc: "Силы территориальной обороны Вооруженных Сил Украины — это отдельный род войск Вооруженных Сил Украины, которому поручена организация, подготовка и выполнение задач территориальной обороны."

