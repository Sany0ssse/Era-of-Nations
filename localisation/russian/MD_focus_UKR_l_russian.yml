##########OPFL###########
##########Focuses##########
UKR_opfl_political_reforms: "Политические реформы"
UKR_opfl_political_reforms_desc: "После недавних событий наша страна нуждается в некоторых политических реформах. Без них Украина не сможет развиваться дальше."
UKR_opfl_lustration_fight: "Борьба против люстрации"
UKR_opfl_lustration_fight_desc: "Люстрация - это ограничение доступа к государственным услугам для тех, кто занимал руководящие должности при предыдущих политических режимах. После недавних событий эта политика также проводится в Украине. Это безобразие должно быть остановлено."
UKR_opfl_radicalism: "Борьба с радикализмом"
UKR_opfl_radicalism_desc: "За несколько лет политического хаоса радикализм распространился по всей Украине. Для мирного существования нашей страны необходимо бороться с любыми проявлениями радикализма в нашей стране."
UKR_opfl_ukrainisation_policy: "Осуждение украинизации"
UKR_opfl_ukrainisation_policy_desc: "Политика украинизации напрямую мешает развитию хороших отношений с нашим большим соседом - Россией. Необходимо осудить и остановить пропаганду украинизации, иначе это не приведет к добру..."
UKR_opfl_national_ref: "Проведение национального референдума"
UKR_opfl_national_ref_desc: "Национальный референдум поможет народу нашей страны определить свое собственное будущее. Нам нужно сделать это как можно скорее!"
UKR_opfl_independence_rep: "Признать независимость республик"
UKR_opfl_independence_rep_desc: "Ну что ж, народы республик сделали свой выбор, и мы должны его уважать. Пора инвестировать и строить связи с новыми государствами."
UKR_opfl_take_republic: "Вернуть силой"
UKR_opfl_take_republic_desc: "Референдум был просто дымовой завесой. Наша настоящая цель - выявить сепаратистов на нашей территории, и пора вернуть наши территории домой! Сепаратисты не будут ходить по украинской земле!"
UKR_opfl_federalisation_project: "Проект федерации"
UKR_opfl_federalisation_project_desc: "Теперь, когда все территориальные споры решены, мы можем смотреть в светлое будущее. Пора украинской федерации!"
UKR_opfl_economic_policy: "Новая экономическая политика"
UKR_opfl_economic_policy_desc: "Новая экономическая политика поможет оживить нашу экономику и впоследствии восстановить ее"
UKR_opfl_rural_land: "Сохранение сельских земель"
UKR_opfl_rural_land_desc: "Сельская деятельность - большая часть нашей экономики. Поэтому необходимо закрепить их законно приобретенные земли. Таким образом мы дадим им уверенность, что их земля не будет отнята на следующий день"
UKR_opfl_small_med_business: "Льготы для малого и среднего бизнеса"
UKR_opfl_small_med_business_desc: "Малый и средний бизнес - важная часть нашей экономики. Для большего роста нам нужно давать бонусы, чтобы люди были заинтересованы заниматься бизнесом."
UKR_opfl_tarif_genocide: "Нет! Тарифный геноцид"
UKR_opfl_tarif_genocide_desc: "Тарифный геноцид - кошмар для наших граждан. Большая часть их денег уходит на оплату многочисленных и бессмысленных налогов. Нам нужно сказать \"НЕТ\" этому беззаконию!"
UKR_opfl_deindustry: "Остановка деиндустриализации Украины"
UKR_opfl_deindustry_desc: "После обретения Украиной независимости старое правительство раздало все промышленное богатство нашей страны кому попало даром. В результате мы оказались в промышленной яме. Нам нужно возобновить строительство заводов, фабрик и других предприятий."
##########Toooitips##########
UKR_federaliz_tt: "Мы §Yфедерализируем§! Украину"

##########INDUSTRY TREE##########
##########Focuses##########
UKR_legacy_of_the_ukr_ind: "Украинская индустриализация"
UKR_legacy_of_the_ukr_ind_desc: "Украина сильно полагается на свою промышленную базу для экономического роста. Крупные города Киев, Львов и Запорожье содержат различные формы промышленности, которые стимулировали их рост на протяжении многих лет. Мы должны поддерживать эту тенденцию, иначе мы застоимся."
UKR_ssau: "ГКАУ"
UKR_ssau_desc: "Украинская космическая промышленность далека от того, чтобы быть мировым лидером в космических технологиях. Однако она является крупным производителем космических аппаратов и другой внеземной техники. Способность оставаться конкурентоспособными в этом последнем рубеже будет определять наше будущее в ближайшие годы."
UKR_pivdenmash_udo: "Южмаш"
UKR_pivdenmash_udo_desc: "Южмаш - основной производитель космических аппаратов Украины. Компания известна производством ракет для зарубежных стран, таких как НАСА. Было бы хорошо развить эту процветающую отрасль, чтобы представить Украину на мировой арене. Быстрый интересный факт: украинские ракеты составляли 12% всех космических полетов в 2006 году. Кто бы знал!"
UKR_national_steel_companies: "Русинская сталь"
UKR_national_steel_companies_desc: "Русинская сталь когда-то была грозным продуктом, предназначенным для ведения войны. Теперь мы больше не сражаемся мечами и щитами. Однако нашим танкам, пушкам и пулям нужна качественная сталь, чтобы оставаться конкурентоспособными."
UKR_tsnap: "ЦНАП"
UKR_tsnap_desc: "Это учреждения, где разные группы людей могут получить широкий спектр административных услуг в комфортной обстановке. Они создаются местными советами и местными государственными администрациями и обслуживают физических и юридических лиц"
UKR_bronetank: "Харьковский бронетанковый завод"
UKR_bronetank_desc: "Государственное предприятие бронетанковой промышленности, которое осуществляет производство, ремонт, обслуживание, переоборудование и модернизацию бронетанковой техники"
UKR_avia_zavod: "Харьковский авиационный завод"
UKR_avia_zavod_desc: "Предприятие авиационного машиностроения в городе Харькове. Производит пассажирские, транспортные и военные самолеты"
UKR_priborostroy: "Харьковский приборостроительный завод"
UKR_priborostroy_desc: "Один из крупнейших заводов СССР по производству военной электроники и бытового электрооборудования."
UKR_tractor: "Харьковский тракторный завод"
UKR_tractor_desc: "Предприятие по производству гусеничных и колесных тракторов.."
UKR_agregat: "Харьковское конструкторское бюро агрегатов"
UKR_agregat_desc: "Научно-производственное предприятие военно-промышленного комплекса, которое разрабатывает и производит агрегаты для гидравлических, топливных и электрических систем авиационной и ракетной техники.."
UKR_morozova: "Харьковское конструкторское бюро машиностроения"
UKR_morozova_desc: "Предприятие, разрабатывающее бронетанковую технику. Ранее КП ККБМ играло ключевую роль в создании гусеничной бронетанковой техники Советского Союза."
UKR_specmachine: "Харьковский завод специальных машин"
UKR_specmachine_desc: "Государственное предприятие военно-промышленного комплекса."
UKR_malichev: "Завод Малышева"
UKR_malichev_desc: "Завод транспортного машиностроения в Харькове, который производит двигатели, локомотивы и танки."
UKR_reborn_ser_and_molot: "Возродить завод \"Серп и молот\""
UKR_reborn_ser_and_molot_desc: "Крупное предприятие сельскохозяйственного машиностроения в Харькове, оно было одним из важнейших предприятий харьковской промышленности и одним из крупнейших предприятий сельскохозяйственного машиностроения в Российской империи и СССР.."
UKR_concers: "Харьковский оборонный концерн"
UKR_concers_desc: "Мы объединим все наши предприятия военной промышленности в один концерн. Таким образом, мы укрепим координацию производства и повысим производительность."
UKR_naftogaz: "Нафтогаз"
UKR_naftogaz_desc: "Нафтогаз - государственная нефтегазовая компания. Она участвует в процессе от добычи до переработки продукции. Компания часто используется для продвижения нефтегазовой независимости против таких стран, как Россия или другие крупные экспортеры энергии."
UKR_extend_ukrainian_refineries: "Сосредоточиться на возобновляемой энергии"
UKR_extend_ukrainian_refineries_desc: "Хотя у нас есть широкий доступ к природному газу и другим нефтяным запасам, дополнение наших текущих энергетических потребностей другими формами энергии поможет стабилизироваться в периоды низкого производства ископаемого топлива."
UKR_zalk: "Запорожские промышленные заводы"
UKR_zalk_desc: "Запорожье - важный промышленный центр в Украине. Это столица Запорожской области, дом ЗАЗа, и это центр металлургии и крупный портовый город для отгрузки товаров из Донбасса."
UKR_rosava: "ЗАО Росава"
UKR_rosava_desc: "ЗАО Росава - крупнейший производитель шин в Украине. Производственные площадки расположены на двух шинных заводах: Росава и производство крупногабаритных шин. Мощность достигает около 6 миллионов единиц. шин в год."
UKR_laz: "ЛАЗ"
UKR_laz_desc: "Холдинговая компания ЛАЗ имеет дочерний завод во Львове, Украина, который специализируется на производстве автобусов. Компания недавно пережила трудные времена из-за распада Советского Союза девять лет назад. Мы могли бы использовать это как возможность помочь поднять регион и его рыночную привлекательность."
UKR_land_land: "Продолжить земельную реформу"
UKR_land_land_desc: "Мы готовы продолжить земельную реформу, начатую в прошлом веке, и продвинуть ее вперед"
UKR_zaporozhia_gold: "Мужиевское золотое месторождение"
UKR_zaporozhia_gold_desc: "Мы наконец привлечем инвесторов и начнем разрабатывать эти месторождения с золотыми залежами"
UKR_monobank: "Монобанк"
UKR_monobank_desc: "Монобанк - это украинский прямой банк. Как и все существующие необанки в Украине, он работает по банковской лицензии родительского банка, а именно Universal Bank, который является частью группы TAS и принадлежит украинскому бизнесмену Сергею Тигипко"
UKR_zaz: "ЗАЗ"
UKR_zaz_desc: "ЗАЗ или Запорожский автомобилестроительный завод - это главный производитель автомобилей в Украине. Как следует из названия, он базируется в городе Запорожье на юго-востоке Украины. Он также обычно производит автобусы и грузовики и наиболее известен своим бывшим материнским предприятием АвтоЗАЗ."
UKR_kraz: "КрАЗ"
UKR_kraz_desc: "КрАЗ - это частная компания в Кременчуге, Украина. Компания в основном производит грузовики и другие специальные транспортные средства. Однако их главная специализация - тяжелые внедорожные модели. Недавно она была зарегистрирована как холдинговая компания, и теперь ею владеет украинская корпорация Финанс и Кредит."
UKR_motor_sich: "Мотор Сич"
UKR_motor_sich_desc: "Акционерное общество Мотор Сич - это украинский производитель авиационных двигателей, штаб-квартира которого находится в Запорожье. Компания производит двигатели для самолетов и вертолетов, а также промышленные морские газовые турбины и установки."
UKR_kraz_cuba: "КрАЗ-SOMEK"
UKR_kraz_cuba_desc: "Мы предложим Кубе создать совместное предприятие, которое принесет нам дополнительный доход"
UKR_armor_kyv: "Киевский бронетанковый завод"
UKR_armor_kyv_desc: "Киевский бронетанковый завод - это государственное предприятие бронетанковой промышленности Украины, которое выполняет диагностику, ремонт, обслуживание, перевооружение и модернизацию бронетехники советского производства"
