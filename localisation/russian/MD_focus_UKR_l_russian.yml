UKR_political_support: "Политическая Поддержка"
UKR_political_support_desc: "Предоставление поддержки одной из партий уменьшит наше влияние."
UKR_neglect_of_state_interests: "Пренебрежение Государственными Интересами"
UKR_neglect_of_state_interests_desc: "Пренебрежение государственными интересами не останется без внимания общественности."
UKR_eco_factories: "Программа Контроля Загрязнения"
UKR_eco_factories_desc: "Для снижения уровня загрязнения нам пришлось ввести некоторые стандарты для поддержания окружающей среды, что значительно снизило объемы производства на заводах."
UKR_constitutional_changes: "Конституционные Изменения"
UKR_constitutional_changes_desc: "После изменений в конституции депутаты потеряли свою неприкосновенность, что сделало их более уязвимыми и податливыми. Отныне президент имеет гораздо больше власти и может использовать ее как на благо страны, так и для своей выгоды..."
UKR_constitutional_changes_failed: "Конституционная Реформа Провалилась"
UKR_anti_gov_news: "Украинская Правда"
UKR_anti_gov_news_desc: "Украинская Правда - популярная украинская онлайн-газета, основанная Георгием Гонгадзе. Украинская Правда расследует и публикует материалы о коррупции или неэтичном поведении украинских политиков из всех политических лагерей."

UKR_idea_neutrality: "Украинский Нейтралитет"
UKR_idea_neutrality_desc: "Ситуация в Украине подтолкнула их к нейтралитету. Решение между Западом и Востоком стало слишком сложным для режима."
UKR_idea_kharkiv_pact: "Харьковский Пакт"
UKR_idea_kharkiv_pact_desc: "Харьковский пакт был подписан Украиной и Россией для обсуждения продолжения использования украинских портов российскими военно-морскими силами Черного моря. Сделка также иллюстрировала несколько других вещей, включая льготные цены Газпрома, действующие до 21 века."
