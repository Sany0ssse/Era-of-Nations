#Ukraine
UKR_idea_pro_ukraine_reform_1: "Реформированное Правительство."
UKR_west_east_rivalry_balanced: "Между Востоком И Западом \n§LТекущий статус соперничества:§! §GСбалансированный§!\n"
UKR_west_east_rivalry_balanced_desc: "Конец холодной войны принес Украине беспрецедентную степень независимости. Тем не менее, наследие сюзеренитета сохранялось, делая политическую сцену страны более нестабильной. Россия продолжает влиять на Украину с востока, в то время как Европейский Союз начал оказывать свое влияние на страну с запада. Внутри Украины возникли конкурирующие политические фракции, лояльные к одному или другому иностранному покровителю.\n\n§RИзменения во внутренней или внешней политике могут нарушить баланс сил между прозападными и про-восточными сторонниками!§!\n\n§C(Преобладание про-восточных)§!\nПравительство сосредоточится на более тесных связях с Россией (включая интеграцию в ОДКБ и ЕАЭС), что вызовет недовольство националистических сил.\n\n§C(Преобладание прозападных)§!\nПравительство сосредоточится на интеграции с ЕС и НАТО, что, в свою очередь, вызовет недовольство среди противников из пророссийского лагеря."
UKR_west_strengthened: "Между Востоком И Западом \n§LТекущий статус соперничества:§! §GДвижение К Западу§!\n."
