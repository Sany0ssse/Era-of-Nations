##########Фокусы##########
UKR_start_war_against_poland: "Польско-украинская война"
UKR_start_war_against_poland_desc: "Решающий момент нашего государства настал. Мы отобьем врага или исчезнем из мировой истории."
UKR_hur_expandeds: "Расширить влияние ГУР"
UKR_hur_expandeds_desc: "Мы расширим полномочия ГУР, ситуация требует этого, война требует этого!"
UKR_unite_with_russian_genshtab: "Заручиться помощью российского Генштаба"
UKR_unite_with_russian_genshtab_desc: "Мы готовы заручиться помощью российского Генштаба для войны с польской армией"
UKR_observer_joint_shtab_kiev: "Создать объединенный штаб"
UKR_observer_joint_shtab_kiev_desc: "Вооруженные силы России и Украины создадут объединенный генеральный штаб в Киеве"
UKR_professional_shturm_groups: "Штурмовые бригады"
UKR_professional_shturm_groups_desc: "Мы начнем набор людей в штурмовые бригады для более эффективного противостояния нашим врагам."
UKR_pmc_zaporozhets: "ЧВК Запорожец"
UKR_pmc_zaporozhets_desc: "Некоторые ветераны войны создали собственную частную военную компанию под названием Запорожец."
UKR_start_the_kashubian_uprising: "Подготовить восстание в Кашубии"
UKR_start_the_kashubian_uprising_desc: "Мы подготовим повстанческое движение в этом регионе, чтобы подорвать оборону Польши"
UKR_silesian_rebellion: "Подготовить восстание в Силезии"
UKR_silesian_rebellion_desc: "Мы подготовим повстанческое движение в этом регионе, чтобы подорвать оборону Польши"
UKR_vilnoe_pospolitoe_rushenie: "Батальон Посполитое рушение"
UKR_vilnoe_pospolitoe_rushenie_desc: "Будет создан новый оперативный батальон ГУР для проведения специальных ограниченных операций на вражеской территории"
UKR_belarus_volunteers: "Батальон Рокоссовского"
UKR_belarus_volunteers_desc: "Будет создан новый оперативный батальон ГУР для проведения специальных ограниченных операций на вражеской территории"
UKR_legion_free_poland: "Легион Свободы Польши"
UKR_legion_free_poland_desc: "Будет создан новый оперативный батальон ГУР для проведения специальных ограниченных операций на вражеской территории"
UKR_polish_hetmanate_army: "Батальон польского гетманства"
UKR_polish_hetmanate_army_desc: "Будет создан новый оперативный батальон ГУР для проведения специальных ограниченных операций на вражеской территории"
UKR_polish_liberation_batallions: "Польская армия освобождения"
UKR_polish_liberation_batallions_desc: "Многие жители Польши готовы сражаться на нашей стороне против правительства, которое, по их мнению, оккупировало страну"
UKR_air_dominance_tactics: "Тактика господства в воздухе"
UKR_air_dominance_tactics_desc: "Нам нужно подавить польскую авиацию, поэтому мы применим новую доктрину"
UKR_tro_expandeds: "Усилить территориальную оборону"
UKR_tro_expandeds_desc: "Мы срочно расширим набор в территориальную оборону, нам нужны бойцы немедленно!"
