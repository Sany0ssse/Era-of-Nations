ukraine_regions.1.t: "Инаугурация Януковича"
ukraine_regions.1.d: "Президент Янукович официально вступил в должность, он обещает, что его правление в ближайшие годы принесет реформы, столь необходимые для украинского общества, посмотрим, окажется ли это правдой."
ukraine_regions.1.a: "Посмотрим"
ukraine_regions.2.t: "Ринат Ахметов"
ukraine_regions.2.d: "Ринат Ахметов - представитель так называемого донецкого клана олигархов нашей страны. Сотрудничество с ним и инвестиции в его промышленность помогут нам получить голоса в Донбассе."
ukraine_regions.2.a: "Хорошо"
ukraine_regions.3.t: "Личная Выгода"
ukraine_regions.3.d: "Как президент, мы заслуживаем личных выгод, управлять такой большой страной - непростая задача."
ukraine_regions.3.a: "Конечно"
ukraine_regions.4.t: "Резиденция Межигорье"
ukraine_regions.4.d: "С 1935 года Межигорье было государственной правительственной резиденцией, пока не было передано в частную собственность. Официально арендованный В. Ф. Януковичем, участок площадью 1,8 гектара с недавно построенным домом площадью 620 м2 окружен земельной собственностью ООО \"Танталит\" и благотворительного фонда \"Возрождение Украины\", на территории которого, по словам В. Ф. Януковича, расположен его \"клубный дом\". Украинская Правда опубликовала ряд документов о связи между ними и окружением В. Ф. Януковича. Комплекс Межигорье площадью 140 гектаров огорожен пятиметровым периметральным забором. На его территории есть яхтенная пристань, конный клуб, тир, теннисный корт и другие развлекательные и туристические комплексы, а также охотничьи угодья. Журналисты и политики называют Межигорье символом коррупции в президентском масштабе и музеем коррупции."
ukraine_regions.4.a: "О"
ukraine_regions.5.t: "Поправки К Конституции"
ukraine_regions.5.d: "Мы будем продвигать конституционные изменения, которые позволят президенту укрепить свою власть и ослабить Верховную Раду.."
ukraine_regions.5.a: "Хорошо"
ukraine_regions.6.t: "Леонид Кожара"
ukraine_regions.6.d: "Мы назначили нашего старого друга Леонида Кожару главой МИД, и мы надеемся, что люди проигнорируют эту информацию."
ukraine_regions.6.a: "Они Не Узнают"
ukraine_regions.7.t: "Инвестиции В Украину"
ukraine_regions.7.d: "Украинский президент попросил нас инвестировать в его страну, должны ли мы согласиться с его предложением?"
ukraine_regions.7.a: "Да"
ukraine_regions.7.b: "Нет"
ukraine_regions.8.t: "Инвестиции В Украину"
ukraine_regions.8.d: "Россия согласилась инвестировать в нашу страну"
ukraine_regions.8.a: "Отлично"
ukraine_regions.9.t: "Инвестиции В Украину"
ukraine_regions.9.d: "Россия отказалась инвестировать в нашу страну"
ukraine_regions.9.a: "Печально"
ukraine_regions.10.t: "Сотрудничество С СНГ"
ukraine_regions.10.d: "Мы не активно сотрудничали со странами СНГ в последние годы, и определенная часть оппозиционно настроенного населения также может быть возмущена нашим решением продолжить сотрудничество, но мы должны решить, должны ли мы это делать?"
ukraine_regions.10.a: "Конечно"
ukraine_regions.10.b: "Нет"
ukraine_regions.11.t: "Переговоры Об Ассоциации С ЕС"
ukraine_regions.11.d: "Пришло время начать переговоры об ассоциации с Европейским Союзом, к которым мы так долго стремились, пора наконец решить, начнем ли мы их?"
ukraine_regions.11.a: "Конечно"
ukraine_regions.11.b: "Нет"
ukraine_regions.12.t: "Вопрос О Статусе Донбасса"
ukraine_regions.12.d: "Много лет мы слышим предложения дать особый статус Донбассу, тем самым начав медленный процесс федерализации Украины. Это серьезное решение, которое мы должны принять, понимая, что пути назад не будет."
ukraine_regions.12.a: "Мы Дадим Им Особый Статус"
ukraine_regions.12.b: "Оставим Как Есть"
