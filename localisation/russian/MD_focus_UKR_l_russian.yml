UKR_dissolved_parliament: "Распущенный Парламент"
UKR_dissolved_parliament_desc: "Парламент был распущен, и представительство больше не активно в стране.\n§W------------------§!\nЭтот Национальный Дух будет §RУдален§! если мы восстановим выборы."
UKR_russia_help_battalions: "Батальоны Поддержки России"
UKR_sso: "Силы Специальных Операций"
UKR_dshv: "Воздушно-Десантные Войска"
UKR_kord: "Специальное Подразделение КОРД"
UKR_teroborona: "Территориальная Оборона"
UKR_teroborona_desc: "Территориальная оборона будет нашей основной вспомогательной силой для армии, сформированной из обычных граждан, она поможет нам решить вопрос о размере наших вооруженных сил"
UKR_shtab: "Командование Объединенных Сил"
UKR_oup: "Укроборонпром"
UKR_oup_desc: "Украинскую промышленность нужно возродить и быстро. Но для этого мы структурируем все наши предприятия в один концерн"
