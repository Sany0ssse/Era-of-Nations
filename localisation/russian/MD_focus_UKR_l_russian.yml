UKR_UDA_decision_category: "Украинская Добровольческая Армия"
UKR_UDA_decision_category_desc: "Украинская Добровольческая Армия — добровольческое военизированное формирование, созданное на базе подразделений Украинского добровольческого корпуса после освобождения Дмитрия Яроша и его соратников из движения Правый сектор"
UKR_integrate_UDA: "Интегрировать §YУДА§! В §YВооруженные Силы Украины§!"
UKR_reorganize_the_national_guard_ukraine_decision_category: "Национальная Гвардия Украины"
UKR_reorganize_the_national_guard_ukraine_decision_category_desc: "Национальная гвардия Украины - это военное формирование с правоохранительными функциями, входит в систему Министерства внутренних дел Украины (МВД) и предназначено для выполнения задач по защите и охране жизни, прав, свобод и законных интересов граждан Украины, общества и государства от преступных и других противоправных посягательств, охране общественного порядка и обеспечению общественной безопасности, а также в сотрудничестве с правоохранительными органами — обеспечению государственной безопасности и охране государственной границы, пресечению террористической деятельности, деятельности незаконных военизированных или вооруженных формирований (групп), террористических организаций, организованных групп и преступных организаций."
UKR_reorganize_the_national_guard_first_brigade: "§Y1-я Оперативная Бригада§! Национальной Гвардии Украины"
UKR_reorganize_the_national_guard_second_brigade: "§Y25-я Отдельная Бригада§! Охраны Общественного Порядка"
UKR_reorganize_the_national_guard_third_brigade: "§Y4-я Оперативная Бригада§! Национальной Гвардии Украины"
UKR_reorganize_the_national_guard_four_brigade: "§Y23-я Отдельная Бригада§! Охраны Общественного Порядка"

UKR_uop_decision_category: "Государственный Концерн Укроборонпром"
UKR_uop_decision_category_desc: "Государственный концерн Укроборонпром — это объединение предприятий военно-промышленного комплекса Украины под государственным управлением. Концерн включает предприятия оборонной промышленности, занимающиеся экономической деятельностью в области разработки, производства, продажи, ремонта, модернизации и утилизации оружия, военной и специальной техники и боеприпасов, а также участвующие в военно-техническом сотрудничестве с зарубежными странами. Концерн отвечает за функции стратегического планирования, координации и повышения эффективности предприятий оборонной промышленности, взаимодействия с органами государственной власти.\n\n\nТекущая дополнительная промышленная мощность, которую мы можем потратить на дополнительные импровизированные машины, составляет [?ukr_industry_points]"
