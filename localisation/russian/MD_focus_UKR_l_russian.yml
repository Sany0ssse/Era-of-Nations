##########БРАТСТВО##########
##########Фокусы##########
UKR_recruit_arestovich: "Завербовать Арестовича"
UKR_recruit_arestovich_desc: "Арестович станет отличным агентом наших спецслужб, его выдающиеся навыки будут нам полезны"
UKR_korchinsky_strategy: "Стратегия Корчинского"
UKR_korchinsky_strategy_desc: "Стратегия Корчинского предполагает борьбу с западными элементами... Борьба с внешним врагом, который действительно угрожает суверенитету Украины"
UKR_psiop_operations: "Психологические операции"
UKR_psiop_operations_desc: "Мы освоили технику психологических операций и готовы использовать ее против наших врагов"
##########Идеи##########
UKR_bratstvo_psiop_idea: "Психологические операции"
UKR_bratstvo_psiop_idea_desc: "Враг должен быть сломлен и морально, для этого мы будем проводить психологические операции"


##########ВИТРЕНКО##########
##########Фокусы##########
UKR_vitrenko_party: "Новый социализм"
UKR_vitrenko_party_desc: "Украина долгое время находилась под влиянием националистических и про-западных настроений, которые разрывают страну пополам, мы дадим нашим гражданам то, что они ищут - стабильность и процветание. Наш социализм сделает их счастливыми."
UKR_economic_orthodoxy: "Экономическая ортодоксия"
UKR_economic_orthodoxy_desc: "Наша страна должна быть сильной не только экономически, но и духовно, почему бы не объединить эти две вещи?"
UKR_install_christian_socialism: "Христианский социализм"
UKR_install_christian_socialism_desc: "Мы не откажемся от наших социалистических идей, потому что мы продолжаем верить в Бога, идеологи социализма привели его к краху, потому что они отдалились от Бога, мы не повторим их ошибок"
UKR_iron_woman: "Железная женщина"
UKR_iron_woman_desc: "Наталья Витренко, как сталь, защищает идеи, которые она считает единственно правильными для Украины, и не собирается ни перед кем склоняться"
UKR_resovetization: "Ресоветизация"
UKR_resovetization_desc: "Советская эпоха дала нашей стране развитие, которого она не видела ни при каком правительстве, ни при царе, ни при поляках, ни при независимости. Мы принимаем этот факт и будем продвигать культ социализма"
UKR_rally_out_the_coalition: "Национальная коалиция"
UKR_rally_out_the_coalition_desc: "Сторонники совершенно разных идей, национал-большевики, сторонники Российской империи, социализма и русофилы объединились под знаменами нашей партии, все вместе - мы превратим нашу страну в лучшее государство в истории"
UKR_praymaya_electro_demokratia: "Прямая электронная демократия"
UKR_praymaya_electro_demokratia_desc: "Нам надоела диктатура и тоталитаризм, наш народ заслуживает демократии в лучшем виде"
UKR_storm_sturm_at_parliament: "Штурм парламента"
UKR_storm_sturm_at_parliament_desc: "Мы избавимся от тех, кто саботирует нашу деятельность в наших государственных органах"
UKR_befriend_russia_vit: "Партнерство с Россией"
UKR_befriend_russia_vit_desc: "Исторически мы связаны с Россией и всегда будем связаны с ней - наше партнерство с Россией - это то, что должно быть очевидным, как восход солнца"
UKR_apply_to_union_state: "Объявить о желании вступить в Союзное государство"
UKR_apply_to_union_state_desc: "Союзное государство - это один из первых и важнейших этапов единства нашего объединенного народа, мы намерены стать частью этого проекта"
UKR_honor_russian_empire: "Уважать наследие Российской империи"
UKR_honor_russian_empire_desc: "Российская империя была великой державой, и было бы глупо и несправедливо отрицать ее достижения, мы помним величие Романовых"
UKR_free_healthcare: "Бесплатная медицина"
UKR_free_healthcare_desc: "Мы вернем советскую практику бесплатной медицины, граждане должны быть здоровыми!"
UKR_national_bolshevist_rhetoric: "Национал-большевистская риторика"
UKR_national_bolshevist_rhetoric_desc: "Наша партия также заимствует многое из программы национал-большевиков, с которой мы единогласно согласны"
UKR_russo_ukrainian_nationalism: "Русско-украинский национализм"
UKR_russo_ukrainian_nationalism_desc: "Наши народы должны всегда подниматься и помнить свое величие, мы будем активно поддерживать националистические движения наших стран"
UKR_naz_pioners: "Национальные пионеры"
UKR_naz_pioners_desc: "Пионер был отличной идеей советского руководства, мы возродим его, но с нашей особой спецификой"
UKR_calm_ruthenia: "Объявить себя наследниками Руси"
UKR_calm_ruthenia_desc: "Мы считаем, что наследие Древней Руси тоже не должно быть забыто! Мы напомним всем, что Русь существовала на этих землях"
UKR_proclaim_rus_ukraine: "Объявить о возрождении Руси"
UKR_proclaim_rus_ukraine_desc: "Русь возрождается! Это сегодня, здесь, на землях Украины!"
UKR_federalize_galicia_and_zakarpat: "Федерализация Галиции"
UKR_federalize_galicia_and_zakarpat_desc: "Пора решить сепаратистский вопрос в Галиции, только федерализация спасет нас"
UKR_lnr_dnr_peace_integrate: "Федерализация Восточной Украины"
UKR_lnr_dnr_peace_integrate_desc: "Ошибки, совершенные предыдущим правительством, теперь мы должны решить. Мы готовы к проекту федерализации, чтобы положить конец разделению нашей страны"
UKR_suppress_western_and_bander: "Подавить западное влияние"
UKR_suppress_western_and_bander_desc: "Влияние Запада должно быть целенаправленно ослаблено в нашей стране"
UKR_restore_russian_church: "Возвращение к Русской церкви"
UKR_restore_russian_church_desc: "Автокефалия была ошибкой, мы духовно отдалились от наших братьев и не намерены больше повторять такую ошибку"
UKR_no_to_upc: "Распустить Украинскую православную церковь"
UKR_no_to_upc_desc: "Еретики должны быть распущены"
UKR_clear_out_pcu: "Очистить церковь"
UKR_clear_out_pcu_desc: "Сторонники автокефалии и все их сочувствующие должны быть поставлены под наш контроль"
UKR_restore_apostolacy: "Возвращение РПЦ"
UKR_restore_apostolacy_desc: "Русская православная церковь снова господствует на нашей земле!"
UKR_full_socialism: "Упор на социализм"
UKR_full_socialism_desc: "Мы углубимся еще глубже в доктрины социализма и продолжим их реализацию в нашей стране."
UKR_install_true_soviet_folk: "Народный социализм"
UKR_install_true_soviet_folk_desc: "Мы сделаем все, чтобы наши граждане чувствовали себя счастливыми."
UKR_appease_pro_russian_oligarchs: "Сотрудничать с пророссийскими олигархами"
UKR_appease_pro_russian_oligarchs_desc: "Мы готовы наладить сотрудничество с пророссийской олигархией, потому что их инвестиции укрепят нашу экономику."
UKR_loyalist_oligarchy_ens: "Принять лояльных олигархов"
UKR_loyalist_oligarchy_ens_desc: "Лояльные олигархи также встанут на нашу сторону, тем самым обеспечив свои финансы внутри страны."
UKR_industrial_revival: "Промышленное возрождение"
UKR_industrial_revival_desc: "Наша страна осталась без своей промышленной мощи после распада СССР, пора ее возродить."
UKR_national_feminism: "Национальный феминизм"
UKR_national_feminism_desc: "Женщины также должны стать двигателем роста нашей страны, и мы будем поощрять их участие во всех отраслях."
UKR_foreign_policy_det: "Наш внешнеполитический курс"
UKR_foreign_policy_det_desc: "Наша страна должна сама решить, каким путем она пойдет во внешней политике."
UKR_fully_antagonize_the_west: "Антагонизм к Западу"
UKR_fully_antagonize_the_west_desc: "Мы не намерены дружить с Западом, потому что знаем, что у Запада нет друзей - только рабы и слуги."
UKR_ukr_sov_mil_coop: "Военное сотрудничество с Россией"
UKR_ukr_sov_mil_coop_desc: "Мы проведем серию военных учений с российской армией."
UKR_euroscepticism_campaign: "Мощный евроскептицизм"
UKR_euroscepticism_campaign_desc: "Мы были и будем продолжать быть евроскептиками."
UKR_join_csto: "Вступить в ОДКБ"
UKR_join_csto_desc: "Мы готовы подписать документ о вступлении в ОДКБ, только Россия может дать нам гарантии безопасности."
UKR_reconcile_with_west: "Улучшить взаимодействие с Западом"
UKR_reconcile_with_west_desc: "Мы намерены улучшить сотрудничество с западными странами."
UKR_nato_ukr_train: "Учения со странами НАТО"
UKR_nato_ukr_train_desc: "Мы частично продвинем доктрину НАТО в наших вооруженных силах, а также проведем с ними серию учений."
UKR_join_nato_with_russia: "Вступление в НАТО с Россией"
UKR_join_nato_with_russia_desc: "Мы намерены вступить в НАТО, но только вместе с Россией, и мы предложим эту идею российскому правительству."
UKR_full_nazbol_transition: "Национал-большевистское возрождение"
UKR_full_nazbol_transition_desc: "Пришло время для следующего этапа развития нашей страны и всей славянской семьи в принципе. Мы вступаем на путь единства славян."
UKR_serbia_unify: "Национал-большевистская революция в [SER.GetName]"
UKR_serbia_unify_desc: "Наши братья наконец-то будут освобождены от правительства, которое угнетало их как славянскую нацию!."
UKR_bulgaria_unification: "Национал-большевистская революция в [BUL.GetName]"
UKR_bulgaria_unification_desc: "Наши братья наконец-то будут освобождены от правительства, которое угнетало их как славянскую нацию!."
UKR_unification_with_belarus: "Национал-большевистская революция в [BLR.GetName]"
UKR_unification_with_belarus_desc: "Наши братья наконец-то будут освобождены от правительства, которое угнетало их как славянскую нацию!."
UKR_poland_unification: "Национал-большевистская революция в [POL.GetName]"
UKR_poland_unification_desc: "Наши братья наконец-то будут освобождены от правительства, которое угнетало их как славянскую нацию!."
UKR_demand_bosnia: "Национал-большевистская революция в [BOS.GetName]"
UKR_demand_bosnia_desc: "Наши братья наконец-то будут освобождены от правительства, которое угнетало их как славянскую нацию!."
UKR_czech_unification: "Национал-большевистская революция в [CZE.GetName]"
UKR_czech_unification_desc: "Наши братья наконец-то будут освобождены от правительства, которое угнетало их как славянскую нацию!."
UKR_demand_croatia_slovenia: "Национал-большевистская революция в [CRO.GetName]"
UKR_demand_croatia_slovenia_desc: "Наши братья наконец-то будут освобождены от правительства, которое угнетало их как славянскую нацию!."
UKR_slovakia_unify: "Национал-большевистская революция в [SLO.GetName]"
UKR_slovakia_unify_desc: "Наши братья наконец-то будут освобождены от правительства, которое угнетало их как славянскую нацию!."
UKR_propose_full_union_state: "Истинное Союзное государство"
UKR_propose_full_union_state_desc: "Пора России и нашей стране стать истинным Союзным государством!"
UKR_pan_slavic_ssr: "Союз славянских республик"
UKR_pan_slavic_ssr_desc: "Наконец, все славяне станут едиными!"
##########Идеи##########
UKR_vetrenko_surrort_nationalism: "Русско-украинский национализм"
UKR_vetrenko_inner_idea: "Внутренняя политика"
UKR_vetrenko_inner_idea_desc: "Мы готовы проводить политику независимости от Запада и сильной Украины, нам надоела диктатура западного капитала"
UKR_vetrenko_christian_socialism: "Христианский социализм"
UKR_vetrenko_christian_socialism_desc: "Бог и социализм идут рука об руку в Украине"
UKR_vetrenko_west_idea: "Антизападная доктрина"
UKR_vetrenko_west_idea_desc: "Мы не скрываем того факта, что Запад - наш идеологический и прямой враг"
UKR_vetrenko_pioneria: "Национальный пионер"
UKR_vetrenko_women_idea: "Национальный феминизм"
UKR_vetrenko_women_idea_desc: "Женщины Украины будут строить великое государство рука об руку с мужчинами"
UKR_vetrenko_iron_woman: "Украинская железная женщина"
UKR_vetrenko_iron_woman_desc: "Витренко стала нашим эквивалентом Маргарет Тэтчер"
UKR_vetrenko_health_free_idea: "Бесплатная медицина"
##########События##########
ukraine_nazbol.1.t: "Начать вторжение в [FROM.GetName]?"
ukraine_nazbol.1.d: "Нам удалось поднять восстание в этой стране, но теперь нам нужно решить, готовы ли мы довести его до конца и признать, что революция - это наше дело"
ukraine_nazbol.1.a: "Да"
ukraine_nazbol.1.b: "Нет"
ukraine_nazbol.2.t: ""
ukraine_nazbol.2.d: ""
ukraine_nazbol.2.a: ""
ukraine_nazbol.3.t: "Национал-большевистская революция!"
ukraine_nazbol.3.d: "Неожиданно для нас в нашей стране произошла революция под знаменем национал-большевиков! Мы срочно подняли армию и все вооруженные силы для борьбы с сепаратистами. Мы знаем, что ими управляет [UKR.GetName] и намерены разобраться с этим в будущем"
ukraine_nazbol.3.a: "Внезапно"
ukraine_nazbol.4.t: "[FROM.GetName] восхваляет наследие Российской империи"
ukraine_nazbol.4.d: "Правительство Украины прямо на государственном уровне объявляет о восхвалении прошлого и наследия Российской империи, нам следует как-то ответить на этот жест"
ukraine_nazbol.4.a: "Мы тоже гордимся"
ukraine_nazbol.4.b: "Мы это осуждаем"
ukraine_nazbol.5.t: "[FROM.GetName] выражает солидарность с нами"
ukraine_nazbol.5.d: "[FROM.GetName] выражает солидарность с нами по вопросу наследия Российской империи и готов поддержать нас на дипломатическом уровне по этому вопросу"
ukraine_nazbol.5.a: "Отлично!"
ukraine_nazbol.6.t: "[FROM.GetName] осуждает нас"
ukraine_nazbol.6.d: "[FROM.GetName] осуждает тот факт, что мы не осуждаем имперские амбиции, никогда недемократическое государство, Новая Россия всегда будет исповедовать идеалы мирного сотрудничества, а не экспансии"
ukraine_nazbol.6.a: "Трусы"

