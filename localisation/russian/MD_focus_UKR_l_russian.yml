##########CONGRESS OF NATIONALISTS##########
##########Focuses##########
UKR_Ukraine_Always_Right: "Украина всегда права"
UKR_Ukraine_Always_Right_desc: "Истинные патриоты пришли к власти в Украине. Украина всегда права, Украина превыше всего"
UKR_Take_control_of_the_media: "Взять под контроль СМИ"
UKR_Take_control_of_the_media_desc: "Медиаресурсы имели слишком много свободы в последние годы. Они заняты только тем, что продвигают, насколько плоха и ужасна наша страна, мы это исправим."
UKR_Prohibition_of_non_nationalist_organizations: "Запрет ненационалистических организаций"
UKR_Prohibition_of_non_nationalist_organizations_desc: "Только те организации, которые исповедуют силу и гордость за украинскую нацию, достойны иметь влияние в стране. Остальных мы прогоним."
UKR_Anti_Russian_policy: "Антироссийская политика"
UKR_Anti_Russian_policy_desc: "Россия была и будет нашим врагом, который всегда хочет нас сожрать. Мы осознаем, что война с ней неизбежна."
UKR_Loyal_teachers_in_schools: "Лояльные учителя в школах"
UKR_Loyal_teachers_in_schools_desc: "Школа - это основа будущих патриотичных граждан Украины. Мы оставим в школах только настоящих украинцев"
UKR_Ban_all_languages_except_Ukrainian: "Запретить все языки кроме украинского"
UKR_Ban_all_languages_except_Ukrainian_desc: "Мы начнем программу украинизации, все остальные языки будут удалены из школьной программы, делового общения и других сфер жизни украинского гражданина"
UKR_Introduce_death_penalty_for_disloyal_persons: "Ввести смертную казнь для нелояльных лиц"
UKR_Introduce_death_penalty_for_disloyal_persons_desc: "Лояльность - это то, что должен иметь каждый гражданин по отношению к своей родине. Всех ее ненавистников, тех, кто ее оскорбляет - мы избавимся от них различными способами"
UKR_United_Council_of_Ukrainian_Nationalists: "Объединенный совет украинских националистов"
UKR_United_Council_of_Ukrainian_Nationalists_desc: "Наконец, истинный патриотизм и национализм, возглавляемый настоящими сторонниками Украины, управляет страной. Наш конгресс - построить великую страну"
UKR_Right_Sector: "Правый сектор"
UKR_Right_Sector_desc: "Правый сектор будет отвечать за внутреннюю политическую составляющую нового украинского государства"
UKR_Full_order_in_the_country: "Полный порядок в стране"
UKR_Full_order_in_the_country_desc: "Порядок - ключ к стабильности. Мы будем бороться против проявлений хаоса, беспорядка и мятежа"
UKR_Ukrainian_assault_battalions: "Украинские штурмовые батальоны"
UKR_Ukrainian_assault_battalions_desc: "Мы создадим ударные батальоны из особо патриотичных граждан, которые будут выполнять специфические задачи"
UKR_make_government_jobs_only_for_Ukrainians: "Сделать государственные должности только для украинцев"
UKR_make_government_jobs_only_for_Ukrainians_desc: "Только украинцы должны работать на благо родины, все остальные не должны иметь права на работу"
UKR_Complete_the_cleansing_of_the_Ukrainian_State: "Завершить очищение украинского государства"
UKR_Complete_the_cleansing_of_the_Ukrainian_State_desc: "Наша родина была очищена от врагов, недоброжелателей и других негативных элементов"
UKR_Limit_the_powers_of_the_MVD: "Ограничить полномочия МВД"
UKR_Limit_the_powers_of_the_MVD_desc: "Полиция и другие власти имеют слишком много власти в государстве, мы их ограничим"
UKR_Night_of_the_Long_Knives: "Ночь длинных ножей"
UKR_Night_of_the_Long_Knives_desc: "Мы устраним тех, кто особенно сопротивляется реформам, более радикально"
UKR_UNA_UNSO: "УНА-УНСО"
UKR_UNA_UNSO_desc: "Внешнеполитическая деятельность ляжет на плечи организации УНА-УНСО."
UKR_arms_rebuild: "Военная промышленность"
UKR_arms_rebuild_desc: "Наша страна должна защищаться, и только сильная военная промышленность поможет ей в этом."
UKR_arms_build: "Инвестировать в военное производство"
UKR_arms_build_desc: "Мы готовы финансировать инвестиции в расширение военного производства некоторых наших именитых заводов"
UKR_External_intervention: "Внешнее вмешательство"
UKR_External_intervention_desc: "Пора прекратить проводить мирную политику, мы будем активно влиять на глобальные процессы"
UKR_Resolve_the_Moldovan_issue: "Решить молдавский вопрос"
UKR_Resolve_the_Moldovan_issue_desc: "Молдова и Приднестровье давно стоят у нас на пути, их независимость - это просто ошибка, мы ее исправим"
UKR_Dig_up_potatoes: "Выкопать картошку"
UKR_Dig_up_potatoes_desc: "Беларусь может быть использована нашими врагами как с запада, так и с востока для удара по нам. Лучший способ защититься - ударить первыми!"
UKR_To_recall_the_Volhynia_Massacre: "Волынский опыт"
UKR_To_recall_the_Volhynia_Massacre_desc: "Мы снова столкнулись с поляками и должны снова дать им отпор. Пора нашей стране наконец покончить с польской угрозой"
UKR_polish_ukr_brotherhood: "Польско-украинское братство"
UKR_polish_ukr_brotherhood_desc: "Только вместе, Украина и Польша смогут победить любого врага"
UKR_belarus_brothers: "Белорусские братья"
UKR_belarus_brothers_desc: "Белорусский народ - наши братья, которые также находятся в тисках двух крупных политических сил. Мы вытащим их из этих тисков."
UKR_befriend_azerbaijan: "Дружба с Азербайджаном"
UKR_befriend_azerbaijan_desc: "Азербайджан будет ценным союзником для продвижения нашей политики на Кавказе, где мы сможем активно противостоять влиянию России."
UKR_befriend_georgia: "Союз с Грузией"
UKR_befriend_georgia_desc: "Грузия - важный партнер и имеет стратегическое положение в кавказском регионе. Иметь такого союзника в альянсе будет очень выгодно для нас"
UKR_caucasus_volunteers: "Добровольцы с Кавказа"
UKR_caucasus_volunteers_desc: "Мы пригласим много добровольцев с Кавказа для формирования батальонов ГУР"
UKR_dagestan_reb_prepare: "Подготовить восстание в Дагестане"
UKR_dagestan_reb_prepare_desc: "Мы начнем подготовку к специальной ограниченной операции в Дагестане"
UKR_befriend_chechens: "Дружба с Ичкерией"
UKR_befriend_chechens_desc: "Ичкерия, государство, которое было уничтожено Россией в начале этого века. Мы соберем ее истинных патриотов и попытаемся возродить."
UKR_Secretly_sending_militants_to_Kuban: "Поднять восстание в Крыму"
UKR_Secretly_sending_militants_to_Kuban_desc: "То, что Крым был отнят у нас Россией - главная историческая несправедливость века. Слабость наших властей оказалась ужасающей и позорной. Мы это исправим"
UKR_Agitation_of_radical_Ukrainians_in_Kuban: "Поднять восстание на Кубани"
UKR_Agitation_of_radical_Ukrainians_in_Kuban_desc: "Кубань - наша земля и всегда будет ею. Мы попытаемся отобрать ее у России"
UKR_reconcista: "Украинская реконкиста"
UKR_reconcista_desc: "Европейские государства погрязли в хаосе, кризисе эмигрантов. Народы Европы полностью под контролем глобалистов, что в будущем обязательно приведет Европу к краху, ради легкой прибыли - мы это изменим"
UKR_no_russian_language: "Запрет русского языка"
UKR_no_russian_language_desc: "Пора разобраться с русским языком окончательно"
UKR_kuban_ukrainization: "Украинизация Кубани"
UKR_kuban_ukrainization_desc: "Кубань станет украинской, мы позаботимся об этом"
UKR_Liberate_Green_Klin: "\"Освободить\" Зеленый клин"
UKR_Liberate_Green_Klin_desc: "Пора \"освободить\" наших братьев Дальнего Востока от гнета русского медведя"
UKR_Shoot_a_Russian_Bear: "Застрелить русского медведя"
UKR_Shoot_a_Russian_Bear_desc: "Русский медведь станет нашим ковриком!"
UKR_declare_a_Great_Ukraine: "Объявить Великую Украину"
UKR_declare_a_Great_Ukraine_desc: "Украина стала великой, и пусть весь мир об этом узнает"
UKR_UPA: "УПА"
UKR_UPA_desc: "Деятельность гражданской и внутренней обороны страны ляжет на возрожденную Украинскую повстанческую армию"
UKR_New_Orders_of_Formation_of_UPA_Groups: "Новые приказы формирования групп УПА"
UKR_New_Orders_of_Formation_of_UPA_Groups_desc: "Мы учтем опыт УПА во время Второй мировой войны и создадим новые бригады с учетом ошибок"
UKR_Partisan_units: "Партизанские отряды"
UKR_Partisan_units_desc: "Партизанские ячейки УПА будут созданы по всей стране для активного сопротивления врагам в будущем"
UKR_Partisanship_as_an_ideology: "Партизанство как идеология"
UKR_Partisanship_as_an_ideology_desc: "Наши партизаны должны быть идеологически образованы, чтобы активно сопротивляться врагу"
UKR_Make_military_exercises_in_the_country_compulsory_for_all: "Сделать военные учения в стране обязательными для всех"
UKR_Make_military_exercises_in_the_country_compulsory_for_all_desc: "Каждый украинец должен уметь защищать свою страну. Обучение специалистами УПА обычных граждан укрепит боевую мощь нашей страны"
UKR_To_arm_every_person_in_the_country: "Вооружить каждого человека в стране"
UKR_To_arm_every_person_in_the_country_desc: "Женщины, дети, мужчины, старики - все должны уметь носить оружие и стрелять из него по врагу"
UKR_Form_an_alliance_of_right-wing_youth: "Создать Альянс правой молодежи"
UKR_Form_an_alliance_of_right-wing_youth_desc: "Молодежные праворадикальные организации дадут нам дополнительных бойцов для нашей партизанской армии"
UKR_Ukraine_is_a_land_of_partisans: "Украина - земля партизан"
UKR_Ukraine_is_a_land_of_partisans_desc: "В каждом селе, в каждом городе будут партизаны, если враг вторгнется к нам. Мы встретим его мощью украинского народа"
UKR_trizub: "Тризуб"
UKR_trizub_desc: "Тризубу поручены функции специфического характера, которые не достались другим крыльям Националистического конгресса"
UKR_christos_nash: "Христианский национализм"
UKR_christos_nash_desc: "Христианство и национализм - это то, что должно быть объединено в нашем украинском государстве"
UKR_lgbt: "Возрожденная реконкиста"
UKR_lgbt_desc: "Только украинская нация может спасти народы Европы! Украинская реконкиста не за горами"
##########Ideas##########
UKR_nationalists_congress: "Политика Националистического конгресса"
UKR_nationalists_congress_desc: "Настоящие патриоты Украины теперь управляют страной, какой бы жесткой ни была политика, она сделает нашу страну великой"
UKR_nationalists_right_sector: "Правый сектор"
UKR_nationalists_una_unso: "УНА-УНСО"
UKR_nationalists_upa: "УПА"
UKR_nationalists_people_leave: "Миграция из Украины"
UKR_nationalists_people_leave_desc: "Наша политика вызвала массовую миграцию из страны, но мы только рады, что все предатели наконец уедут отсюда!"
UKR_nationalists_cleane_ukraine: "Истинная Украина"
UKR_nationalists_great_ukraine: "Великая Украина"
UKR_nationalists_great_ukraine_desc: "Великая Украина начинается здесь!"
UKR_nationalists_trizub: "Тризуб"
UKR_nationalists_reconcista: "Возрожденная реконкиста"
UKR_nationalists_reconcista_desc: "Украина станет маяком возрождения христианства в Европе! Святой поход из Киева начинается"
