ukraine_coup.1.t: "Россия Пыталась Устроить Переворот!"
ukraine_coup.1.d: "Последние сообщения из Киева указывают, что агенты, поддерживаемые Россией, собирались устроить переворот в нашем правительстве! Это прямая угроза нашей независимости со стороны России."
