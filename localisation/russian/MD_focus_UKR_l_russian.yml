ukraine_firtash.1.t: "Фирташ объявил о создании республики"
ukraine_firtash.1.d: "Дмитрий Фирташ, один из самых богатых олигархов Украины, объявил о создании Подольской республики как автономии в составе Украины. Это потрясло наше правительство, и теперь нам нужно решить, что с этим делать"
ukraine_firtash.1.a: "Никакой автономии"
ukraine_firtash.1.b: "Возможно, это будет выгодно для нас"
ukraine_firtash.2.t: "Наша армия"
ukraine_firtash.2.d: "Те подразделения, которые мы лично финансировали, встали на нашу сторону, теперь они наша главная ударная сила"
ukraine_firtash.2.a: "За свободу Подолья!"
