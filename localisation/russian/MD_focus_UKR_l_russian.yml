 UKR_HersonUkraine: "Республика Украина"
 UKR_TaSamayaUkraine: "Та Самая Украина"
 UKR_FirstUkraine: "Первая Украина"
 UKR_GreatUkraine: "Великая Украина"
 UKR_SwedenUkraine: "Шведская Волость"
 ##########KUCHMA##########
 ##########Focuses##########
 UKR_kucha_second_terms: "Второй Срок Кучмы"
 UKR_kucha_second_terms_desc: "Президент Кучма правит нашей страной уже второй срок; возможно, на этот раз он не будет переизбран или он приведет нашу страну к хаосу. Посмотрим."
 UKR_reform_programm: "Программа Реформ"
 UKR_reform_programm_desc: "Мы начнем серию реформ, которые должны привести наше государство к экономическому росту и вывести его из кризиса распада СССР."
 UKR_reform_national_guard: "Расформировать Национальную Гвардию"
 UKR_reform_national_guard_desc: "Пришло время реформ. Пришло время расформировать Национальную гвардию и реформировать ее в более эффективную структуру: Внутренние войска."
 UKR_reform_vsu: "Новая Военная Доктрина"
 UKR_reform_vsu_desc: "Нашей армии нужно измениться и модернизироваться; иначе мы не будем готовы к войне с врагом. Новая доктрина также укрепляет наше сотрудничество с НАТО."
 UKR_check_and_balances: "Система Сдержек И Противовесов"
 UKR_check_and_balances_desc: "Наше государство в настоящее время находится в шаткой политической ситуации; мы должны найти баланс в политической сфере, чтобы предотвратить катастрофу."
 UKR_yushenko_cabinet: "Кабинет Ющенко"
 UKR_yushenko_cabinet_desc: "Виктор Ющенко уже старый знакомый, который хорошо показал себя в своем управленческом опыте. Результаты его деятельности, которые он нам обещал, должны стимулировать рост экономической составляющей нашей страны."
 UKR_welfare_reform: "Реформы Для Благосостояния"
 UKR_welfare_reform_desc: "Здравоохранение находится в печальном состоянии с 1990-х годов; необходимо начать его реформирование."
 UKR_kosuik: "Хлебная Мануфактура Косюка"
 UKR_kosuik_desc: "Отечественная автомобильная промышленность начинает свое возрождение, и частные предприниматели будут двигателем этого процесса. Один из них, Юрий Косюк, планирует создать собственные заводы по производству агропродукции."
 UKR_azovstal_private: "Приватизация Азовстали"
 UKR_azovstal_private_desc: "Мы отдадим Азовсталь в частные руки, поскольку сами не можем финансово поддерживать такое огромное предприятие."
 UKR_land_reform: "Земельная Реформа"
 UKR_land_reform_desc: "Земельная реформа должна была произойти давно, но мы откладывали ее как могли. Теперь нам будет легче продать землю в частные руки."
 UKR_land_trade: "Упростить Торговлю Землей"
 UKR_land_trade_desc: "Мы продолжим облегчать приобретение земельных участков частными инвесторами в нашей стране."
 UKR_bolster_privatization: "Усилить Приватизацию Земли"
 UKR_bolster_privatization_desc: "Приватизация будет ускорена, и наша страна должна вступить в новую рыночную экономику."
 UKR_ukrenergo_reform: "Реформировать Укрэнерго"
 UKR_ukrenergo_reform_desc: "Наша энергетическая структура находится в ужасном состоянии; необходимо реформировать Укрэнерго."
 UKR_burshtyn_tes: "Расширить Бурштынскую ТЭС"
 UKR_burshtyn_tes_desc: "Мы проведем реконструкцию и улучшение Бурштынской тепловой электростанции."
 UKR_diversy_fuel: "Диверсифицировать Закупку Топлива"
 UKR_diversy_fuel_desc: "Мы должны умело диверсифицировать источники энергии, которые мы покупаем за рубежом; мы не можем полагаться только на одного продавца."
 UKR_short_terms: "Отмена Краткосрочных Кредитов"
 UKR_short_terms_desc: "Мы полностью отменим такие вещи, как краткосрочные кредиты; они вредны для экономики."
 UKR_bank_lobbyst: "Убрать Банковских Лоббистов"
 UKR_bank_lobbyst_desc: "Много банковских лоббистов пришло к власти в 1990-х годах; пора избавиться от их влияния на нашу страну."
 UKR_social_cut_down: "Сократить Социальные Расходы"
 UKR_social_cut_down_desc: "Мы вынуждены временно сократить социальные расходы для стабилизации наших финансовых резервов."
 UKR_struggle_power: "Борьба За Власть"
 UKR_struggle_power_desc: "Наша шаткая ситуация привела к появлению сильных политических противников; нам нужно защитить себя от них и убедить избирателей остаться с нами."
 UKR_tax_agro: "Снижение Налогов Для Агрокомпаний"
 UKR_tax_agro_desc: "Мы снизим налоги для агропромышленности, чтобы стимулировать рост их производства."
 UKR_stimulate: "Стимулировать Экономику"
 UKR_stimulate_desc: "Наши меры дают результаты, и экономика начинает расти."
 UKR_negotiation_left: "Переговоры С Левой Оппозицией"
 UKR_negotiation_left_desc: "Левые активисты заметно набирают силу; необходимо найти с ними компромисс."
 UKR_radicalize_without_kuchma: "Радикализация Украины Без Кучмы"
 UKR_radicalize_without_kuchma_desc: "Движение \"Украина без Кучмы\" набирало опасные обороты; пора с ними разобраться."
 UKR_slowdown_reform_land: "Замедлить Земельную Реформу"
 UKR_slowdown_reform_land_desc: "Мы решили замедлить нашу земельную реформу, потому что она вызвала смешанную реакцию в нашем обществе."
 UKR_re_approach_privatbank: "Пересмотреть Подход К ПриватБанку"
 UKR_re_approach_privatbank_desc: "ПриватБанк - крупнейший банк в нашей стране; мы должны успешно найти с ним компромисс, и он обеспечит нам большие налоговые поступления."
 UKR_concessin_with_donbass: "Уступки Донбасской Банде"
 UKR_concessin_with_donbass_desc: "Мы готовы пойти на уступки ради Донбасса, тем самым пытаясь обеспечить их лояльность к нам."
 UKR_invest_mining_companies: "Инвестиции В Горнодобывающие Компании"
 UKR_invest_mining_companies_desc: "Инвестируя в донбасские компании, мы обеспечим сильную поддержку местных избирателей."
 UKR_donbass_infrastructure: "Программа Инфраструктуры Донбасса"
 UKR_donbass_infrastructure_desc: "Инвестиции в инфраструктуру Донбасса позволят нам привлечь новых избирателей, а также увеличить доходы от этого региона."
 UKR_impeachment: "Импичмент"
 UKR_impeachment_desc: "Наше правительство активно саботирует нашу работу и постоянно пытается нас импичментировать. Необходимо решить этот вопрос."
 UKR_privatization_ukrenergo: "Приватизация Укрэнерго"
 UKR_privatization_ukrenergo_desc: "Мы приватизируем Укрэнерго; возможно, в частных руках оно сможет работать более эффективно."
 UKR_reach_russian_oligarch: "Достучаться До Российских Олигархов"
 UKR_reach_russian_oligarch_desc: "Мы привлечем российских олигархов для поддержки нашей политической кампании."
 UKR_rus_mobile_operators: "Привлечь Российских Мобильных Операторов"
 UKR_rus_mobile_operators_desc: "Мы дадим российским телеком-операторам доступ к нашему рынку."
 UKR_free_economic_zones: "Свободные Экономические Зоны"
 UKR_free_economic_zones_desc: "Мы создадим несколько экономических зон на нашей территории, где мы естественно будем ждать российских инвесторов в приоритете."
 UKR_yanuk_cabinet: "Кабинет Януковича"
 UKR_yanuk_cabinet_desc: "Виктор Янукович и его предстоящая политическая деятельность должны иметь стимулирующий эффект на экономику, как и деятельность Ющенко."
 UKR_block_land_trading: "Заблокировать Торговлю Землей"
 UKR_block_land_trading_desc: "Земельные сделки будут активно заморожены, поскольку это может негативно повлиять на независимость нашего военно-промышленного комплекса."
 UKR_soft_taxation: "Мягкая Налоговая Реформа"
 UKR_soft_taxation_desc: "Мы проведем мягкую налоговую реформу, которая не сильно разозлит ни корпоративных, ни частных лиц."
 UKR_floating_excange: "Плавающий Валютный Курс"
 UKR_floating_excange_desc: "Мы будем практиковать плавающий валютный курс, но он может дать нам совершенно разные экономические эффекты."
 UKR_small_favor: "Льготы Для Малого Бизнеса"
 UKR_small_favor_desc: "Мы введем льготы для малого бизнеса, стимулируя экономический рост."
 UKR_doentskstal: "Донецксталь"
 UKR_doentskstal_desc: "Мы формируем новое предприятие на территории Донбасса для оптимизации нашей деятельности в этом регионе."
 UKR_gas_azvostal: "Построить Газопровод В Азовстали"
 UKR_gas_azvostal_desc: "Мы построим газопровод в Азовстали для улучшения работы предприятия, а также условий жизни в районах."
 UKR_dorohy_avto: "Автомобильные Дороги Украины"
 UKR_dorohy_avto_desc: "Назвать состояние дорог в нашей стране ужасным - значит сделать комплимент. 95% дорог просто в аварийном состоянии. Мы начнем это исправлять."
 UKR_roshen: "Рошен"
 UKR_roshen_desc: "Знаменитая кондитерская фабрика Рошен расширяет свою деятельность, мы будем внимательно следить за ее владельцами."
 UKR_luaz_reopen: "Перезапустить ЛуАЗ"
 UKR_luaz_reopen_desc: "ЛуАЗ был заброшен правительством в 90-х, необходимо перезапустить предприятие, потому что без него мы не начнем дорожные реформы."
 UKR_ukraine_2000: "Украина 2000"
 UKR_ukraine_2000_desc: "Новое тысячелетие должно принести глобальные конституционные реформы в Украину, и мы будем активно их продвигать."
 UKR_gain_rada_support: "Получить Поддержку Рады"
 UKR_gain_rada_support_desc: "Полная поддержка Верховной Рады необходима для реализации наших реформ."
 UKR_deal_pro_socialist_media: "Разобраться С Просоциалистическими СМИ"
 UKR_deal_pro_socialist_media_desc: "Социалистические партии набирают обороты; необходимо подавить их СМИ."
 UKR_referendum_const: "Референдум По Конституции"
 UKR_referendum_const_desc: "Мы готовы провести национальный референдум по поправкам к конституции."
 UKR_push_for_reforms: "Продвигать Реформы"
 UKR_push_for_reforms_desc: "Мы продолжим продвигать наши реформаторские идеи в правительство; наше государство в них нуждается."
 UKR_arrest_timoshenko: "Арест Тимошенко"
 UKR_arrest_timoshenko_desc: "Тимошенко слишком опасный политический противник для нас; мы ее арестуем."
 UKR_prepare_protest: "Подготовиться К Протестам"
 UKR_prepare_protest_desc: "Наши действия определенно вызовут серию протестов; нам нужно быть к ним готовыми."
 UKR_reform_berkut: "Реформировать Беркут"
 UKR_reform_berkut_desc: "Спецподразделение Беркут нуждается в реформировании, без которого мы можем потерять контроль над протестами."
 UKR_deal_yushenko: "Разобраться С Ющенко"
 UKR_deal_yushenko_desc: "Мы разберемся с Ющенко и его политическими амбициями."
 UKR_appoint_yanukovich: "Назначить Януковича"
 UKR_appoint_yanukovich_desc: "Мы назначим Януковича главой правительства; возможно, он сможет улучшить ситуацию."
 UKR_seek_help_eastern_oligarch: "Искать Помощь У Восточных Олигархов"
 UKR_seek_help_eastern_oligarch_desc: "Наших ресурсов явно недостаточно для подавления протестного движения; возможно, восточные олигархи помогут нам?"
 UKR_aid_from_minign_companies: "Получить Помощь От Горнодобывающих Компаний"
 UKR_aid_from_minign_companies_desc: "Наши инвестиции в горнодобывающие компании должны окупиться, и их менеджеры будут готовы предоставить нам финансовую и другую помощь."
 UKR_negotiate_orange_maidan: "Вести Переговоры С Оранжевым Майданом"
 UKR_negotiate_orange_maidan_desc: "Пришло время вступить в переговоры с протестующими и решить вопрос раз и навсегда."
 UKR_const_reform: "Конституционная Реформа"
 UKR_const_reform_desc: "Нам наконец удалось протолкнуть наши реформы в правительство через протестное движение."
 UKR_lyvochkin: "Решение Львочкина"
 UKR_lyvochkin_desc: "Наш главный советник дал нам понять, что нам придется пойти на компромисс с протестующими; иначе нашу страну ждет хаос."
 UKR_stay_for_fair_election: "Остаться Для \"Честных\" Выборов"
 UKR_stay_for_fair_election_desc: "Мы не собираемся просто так сдавать свою власть; мы будем стоять до конца."
 ##########Cosmetic Tag##########
 UKR_PISUAR: "Юго-Восточная Украинская Автономная Республика"
 DPR_donbass_neutrality: "Республика Донбасс"
 DPR_donbass_nationalist: "Республика Донбасс"
 DPR_donbass_democratic: "Республика Донбасс"
 DPR_donbass_communism: "Республика Донбасс"
 DPR_donbass_fascism: "Республика Донбасс"
 ##########Tooltips##########
 UKR_yusha_tt: "§YЭто помешает нам выполнять фокусы в ветке Кабинета Ющенко§!"
 UKR_yana_tt: "§YЭто позволит нам завершить фокус Кабинет Януковича§!"
 UKR_easterns_tt: "Поддержка жителей £text_icon_ukr_dobro §3Восточных Регионов§! Украины изменится на §Y[?modify_easterns]§! (Текущая Поддержка: §Y[?UKR.easterns]§!)\n"
 UKR_westerns_tt: "Поддержка жителей £text_icon_ukr_yasno §tЗападных Регионов§! Украины изменится на §Y[?modify_westerns]§! (Текущая Поддержка: §Y[?UKR.westerns]§!)\n"
 UKR_maidani_tt: "Поддержка §8Представителей Майдана§! изменится на §Y[?modify_maidani]§! (Текущая Поддержка: §Y[?UKR.maidani]§!)\n"
 UKR_orange_revoult_banner_tt: "§RЖелательно максимально удовлетворить жителей Востока, иначе не избежать политического раскола§!"
 UKR_red_revoult_banner_tt: "§RЖелательно максимально удовлетворить жителей Запада, иначе не избежать политического раскола§!"
 ##########Decisions##########
 UKR_political_situation_decision_category: "Украинская Политическая Нестабильность"
 UKR_political_situation_decision_category_desc: "[UKR.GetFlag]§YУкраина§! - огромное государство с множеством народов, живущих в нем, но двое из них представляют большинство - [UKR.GetFlag]§YУкраинцы§! и [SOV.GetFlag]§YРусские§!. Из-за исторических событий [SOV.GetFlag]§YРусскоязычное§! население в основном живет на востоке страны, в то время как [UKR.GetFlag]§YУкраинское§! население уже занимает более западные территории. Это географическое разделение постоянно сотрясает [UKR.GetFlag]§YУкраину§! и может стать §Rбольшой проблемой§! для страны в будущем. Среди прочего, политический электорат [UKR.GetFlag]§YУкраины§! очень склонен к протестам и выражению своих мнений через довольно §Rнемирные§! протесты. Нам нужно учесть все эти аспекты и найти возможность сбалансировать эти силы.\n\nЕсли поддержка §8Майдана§! §Rупадет ниже 15§!, начнутся беспорядки, которые могут привести к §Rгражданской войне§!. Чтобы уменьшить последствия возможной §Rгражданской войны§!, необходимо расширить влияние и власть §YСБУ§!, §YНациональной гвардии§! и т.д. В зависимости от того, чья поддержка §Rменьше§! (§tЗападников§! или §3Восточников§!), будут разные сценарии политических беспорядков"
 ukr_west_output_text: "§Y[?UKR.westerns]§!"
 ukr_west_tooltip: "Текущая Поддержка §tЗападными Регионами§!"
 ukr_maidan_output_text: "§Y[?UKR.maidani]§!"
 ukr_maidan_tooltip: "Текущая Поддержка §8Майданом§!"
 ukr_east_output_text: "§Y[?UKR.easterns]§!"
 ukr_east_tooltip: "Текущая Поддержка §3Восточными Регионами§!"
 ##########Ideas##########
 UKR_our_agricultrure: "Отечественное Сельское Хозяйство"
 UKR_our_agricultrure_desc: "Украинская сельскохозяйственная промышленность одна из лучших в мире, и мы постараемся не потерять этот титул"
 UKR_azovsteel: "Азовсталь"
 UKR_yushenko_premier_idea: "Правительство Ющенко"
 UKR_yanuk_premier_idea: "Правительство Януковича"
 UKR_unstable_government_idea: "Недовольство Майданом"
 UKR_donetsksteel: "Донецксталь"
 UKR_land_reform_idea: "Земельная Реформа"
 UKR_land_reform_idea_desc: "Земельная реформа, инициированная в прошлом веке, должна привести к полному перераспределению земельных владений по всей стране. Пока что она в процессе"
 UKR_energo_idea: "Укрэнерго"
 UKR_energo_idea_desc: "Укрэнерго - наша основная энергетическая компания, которая буквально держит всю энергетическую промышленность Украины"
 UKR_zaims: "Экономические Последствия Отмены Кредитов"
 UKR_wtf_bro: "Серьезное Недовольство Народа"
 UKR_banks_lobbyst_liquidate: "Ликвидация Банковских Лоббистов"
 UKR_mining_company_help: "Налоговые Льготы Для Горнодобывающих Компаний"
 UKR_privatization_idea: "Приватизация"
 UKR_without_kuchma_idea: "Украина Без Кучмы"
 UKR_left_opposition_idea: "Левая Оппозиция"
 UKR_luaz_idea: "ЛуАЗ"
 UKR_road_reform: "Дорожная Реформа"
 UKR_road_reform_desc: "Украинские дороги заметно ухудшились в последние годы, необходимо начать их немедленное улучшение и восстановление"
 UKR_anti_socialist_media: "Антисоциалистические СМИ"
 UKR_berkut: "Беркут"
 UKR_idea_inner_army: "Внутренние Войска Министерства Внутренних Дел"
 UKR_idea_inner_army_desc: "Внутренние войска заменили старую Национальную гвардию и являются более организованным подразделением для мирных задач."
 UKR_crisis_political: "Политический Кризис"
 UKR_crisis_political_desc: "Наша страна охвачена политическим кризисом, власти парализованы, а политические силы борются друг с другом за власть"
 ##########Events##########
 ukraine_kuchma.1.t: "Арест Юлии Тимошенко"
 ukraine_kuchma.1.d: "Юлия Тимошенко была арестована нами, потому что она представляет явную угрозу для нашего правительства."
 ukraine_kuchma.1.a: "Правильно Ей"
 ukraine_kuchma.2.t: "Подготовка К Протестам"
 ukraine_kuchma.2.d: "Наши действия явно приведут к протестам, нам нужно подготовиться."
 ukraine_kuchma.2.a: "Мы Будем Готовы"
 ukraine_kuchma.2.b: "Все Решится Само"
 ukraine_kuchma.3.t: "Оппозиция Трясет Страну"
 ukraine_kuchma.3.d: "Многие политические силы, включая националистов и социалистов, развернули активную кампанию против нас, и нам нужно принять меры."
 ukraine_kuchma.3.a: "Нам Нужно Быть Осторожнее"
 ukraine_kuchma.4.t: "Референдум Об Изменении Конституции"
 ukraine_kuchma.4.d: "Мы объявили референдум об изменении конституции, в котором мы ограничим президентскую власть и изменим многие политические институты."
 ukraine_kuchma.4.a: "Время Перемен"
 ukraine_kuchma.5.t: "Разобраться С Ющенко"
 ukraine_kuchma.5.d: "Пришло время правительству Ющенко уйти в отставку, мы чувствуем опасность от его сторонников, поэтому срочно необходимо сменить Кабинет Министров."
 ukraine_kuchma.5.a: "Время Перемен"
 ukraine_kuchma.6.t: "Назначить Януковича"
 ukraine_kuchma.6.d: "Теперь Кабинет Министров будет возглавлять Янукович, на которого мы возлагаем большие надежды."
 ukraine_kuchma.6.a: "Время Перемен"
 ukraine_kuchma.7.t: "Переговоры С Майданом"
 ukraine_kuchma.7.d: "Протесты усиливаются, пора начать переговоры с коалицией протестующих."
 ukraine_kuchma.7.a: "Попробуем Решить Все Мирно."
 ukraine_kuchma.8.t: "Отдать Власть Ющенко"
 ukraine_kuchma.8.d: "Мы не будем сопротивляться воле народа, результаты второго тура президентских выборов ясно показали, что Ющенко станет президентом, и мы это примем."
 ukraine_kuchma.8.a: "Мир Украине"
 ukraine_kuchma.9.t: "Рошен"
 ukraine_kuchma.9.d: "В нашей стране многие олигархи приватизировали тонну предприятий в 90-х, одно из них - ныне знаменитая кондитерская фабрика Рошен. Нам стоит за ними следить.."
 ukraine_kuchma.9.a: "Олигархи Набирают Силу"
 ukraine_kuchma.10.t: "Второй Срок Кучмы"
 ukraine_kuchma.10.d: "Леонид Кучма - второй президент независимой Украины, который принял страну в самое ужасное время, когда инфляция достигла 10 000%, когда страна была обедневшей и полностью зависимой от России. К настоящему времени Украина оправилась от тех ужасных последствий распада СССР, но оппозиция все еще негативно относится к президенту и обязательно попытается свергнуть его в будущем."
 ukraine_kuchma.10.a: "Слава Украине"
 ukraine_kuchma.11.t: "Попытка Импичмента"
 ukraine_kuchma.11.d: "Верховная Рада много раз пыталась нас импичментировать, пора решить этот вопрос."
 ukraine_kuchma.11.a: "Нет Импичменту"
 ukraine_kuchma.12.t: "Дружба С Донецким Кланом"
 ukraine_kuchma.12.d: "Мы попытаемся привлечь на свою сторону так называемый донецкий клан олигархов, они будут полезны нам в будущем противостоянии с оппозицией."
 ukraine_kuchma.12.a: "Донбасс С Нами"
 ukraine_kuchma.12.b: "Мы Не Будем Их Поддерживать"
 ukraine_kuchma.13.t: "Янукович Станет Президентом"
 ukraine_kuchma.13.d: "Мы не признаем результаты второго тура президентской гонки и назначим Януковича президентом Украины."
 ukraine_kuchma.13.a: "Так И Быть"
 ukraine_kuchma.14.t: "Протесты На Юго-Востоке"
 ukraine_kuchma.14.d: "После нашей победы на выборах мы думали, что все закончилось, но теперь юго-восток нашей страны начал проявлять сильную протестную активность. Так называемый \"Синий Майдан\" начал усиливать давление на наше правительство, угрожая серьезными последствиями."
 ukraine_kuchma.14.a: "Нам Нужно Быть Осторожнее."
 ukraine_kuchma.15.t: "Синий Майдан В Украине"
 ukraine_kuchma.15.d: "Активисты юго-восточной Украины продолжили развивать свой проект автономии, в то время как киевские власти заняты сменой стульев в кабинетах рады, надвигается большая буря. Сторонники Синего Майдана попросили у нас поддержки, поможем ли мы им?"
 ukraine_kuchma.15.a: "Мы Поддержим Их."
 ukraine_kuchma.15.b: "Нам Не Стоит Вмешиваться"
 ukraine_kuchma.16.t: "Правительство Юго-Востока"
 ukraine_kuchma.16.d: "Так называемые активисты Синего Майдана официально объявили о создании своего правительства и что они не признают киевское правительство. Похоже, что их поддержали извне, иначе они бы не решились на такое."
 ukraine_kuchma.16.a: "Срочно Отправить Туда Полицию"
 ukraine_kuchma.17.t: "Синяя Революция"
 ukraine_kuchma.17.d: "Сегодня сторонники Синего Майдана во главе с Виктором Януковичем официально объявили о своей независимости и формировании собственной республики юго-восточной Украины. Есть военные части, которые перешли на их сторону, а также генералы и офицеры."
 ukraine_kuchma.17.a: "Буря Началась"
 ukraine_kuchma.18.t: "Протесты В Галиции"
 ukraine_kuchma.18.d: "Наше решение игнорировать второй тур президентских выборов привело к нестабильности в стране, многие жители западных регионов перешли к активной фазе протестов, где начались столкновения с полицией."
 ukraine_kuchma.18.a: "Нам Нужно Быть Осторожнее"
 ukraine_kuchma.19.t: "Красный Майдан В Украине"
 ukraine_kuchma.19.d: "Активисты украинской Галиции начали протесты против незаконных выборов в стране, ситуация стала настолько напряженной, что мы уже говорим о вооруженном восстании, потому что несколько генералов поддерживают повстанцев, может быть, нам стоит им помочь?"
 ukraine_kuchma.19.a: "Мы Поддержим Их."
 ukraine_kuchma.19.b: "Нам Не Стоит Вмешиваться"
 ukraine_kuchma.20.t: "Правительство Западной Украины"
 ukraine_kuchma.20.d: "Протесты уже перешли в более жаркую фазу, и им явно помогают из-за рубежа. Теперь они объявили о создании собственного правительства, которое не подчиняется киевским властям."
 ukraine_kuchma.20.a: "Срочно Отправить Туда Полицию"
 ukraine_kuchma.21.t: "Красная Революция"
 ukraine_kuchma.21.d: "Сегодня сторонники так называемого Красного Майдана объявили о своем выходе из Украины и начале вооруженного сопротивления с киевским пророссийским правительством."
 ukraine_kuchma.21.a: "Буря Началась"
 ukraine_kuchma.22.t: "Политический Кризис"
 ukraine_kuchma.22.d: "Наша страна охвачена политическим кризисом, Верховная Рада активно сопротивляется нашему правительству, оппозиция начинает трясти общество, необходимо принять меры."
 ukraine_kuchma.22.a: "Буря Началась"
 ukraine_kuchma.23.t: "Юлия Тимошенко Была Освобождена"
 ukraine_kuchma.23.d: "Юлия Тимошенко была освобождена из-под ареста, и теперь она сможет продолжить свою политическую карьеру."
 ukraine_kuchma.23.a: "Хорошо"
##########SPU and CPU##########
##########Focuses##########
UKR_spu_start: "Социалистическая партия Украины"
UKR_spu_start_desc: "После многих лет борьбы нам удалось завоевать доверие народа. Теперь мы начнем наши великие реформы"
UKR_spu_rada_position: "Позиции в Раде"
UKR_spu_rada_position_desc: "Ключ к власти - это контроль над законодательной властью. Мы должны решить, с кем работать, чтобы провести наши политики через Раду"
UKR_cpu_spu_coalition: "Коалиция КПУ/СПУ"
UKR_cpu_spu_coalition_desc: "КПУ и СПУ можно назвать братьями. Они всегда участвовали в выборах как единый фронт. Очевидно, что они сформируют коалицию, если одна из них победит."
UKR_ditch_cpu: "Дистанцирование от КПУ"
UKR_ditch_cpu_desc: "КПУ и СПУ можно назвать братьями. Они всегда участвовали в выборах как единый фронт, но очевидно, что если КПУ получит власть, они восстановят коммунистический режим. Мы должны как можно скорее дистанцироваться от них."
UKR_russia_party_cooperation: "Сотрудничество с пророссийскими партиями"
UKR_russia_party_cooperation_desc: "Сотрудничество с пророссийскими партиями"
UKR_destroy_western_oligach: "Избавиться от влияния прозападных олигархов"
UKR_destroy_western_oligach_desc: "Избавиться от влияния прозападных олигархов"
UKR_cpu_start: "Коммунистическая партия Украины"
UKR_cpu_start_desc: "Коммунистическая партия Украины"
UKR_cpu_rada_position: "Позиции в Раде"
UKR_cpu_rada_position_desc: "Ключ к власти - это контроль над законодательной властью. Мы должны решить, с кем работать, чтобы провести наши политики через Раду"
UKR_cpu_monocoalition: "Монокоалиция"
UKR_cpu_monocoalition_desc: "Монокоалиция - это термин в украинской политике. Он относится к правительству, сформированному только одной партией. Создав монокоалицию КПУ, мы сможем легко взять под контроль законодательную и исполнительную ветви власти и начать восстановление советской власти"

UKR_back_to_soviet_tracks: "Возврат к советской эпохе"
UKR_back_to_soviet_tracks_desc: "После распада СССР наша страна только теряла, упускала и разрушала все, что осталось от наследия этой великой страны. Мы изменим этот процесс"
UKR_commie_russia_trade: "Партнерство с Россией"
UKR_commie_russia_trade_desc: "Мы намерены укрепить дружественные отношения между нашими странами."
UKR_commie_russia_rjd: "Партнерство с Российскими железными дорогами"
UKR_commie_russia_rjd_desc: "Российские железные дороги будут отличным партнером для нас, благодаря их помощи мы значительно улучшим нашу инфраструктуру"
UKR_commie_russia_banks: "Российские банки"
UKR_commie_russia_banks_desc: "Мы готовы пустить российские банки на нашу территорию, их финансовые возможности помогут нам в развитии"
UKR_commie_russia_gas: "Новый газовый контракт"
UKR_commie_russia_gas_desc: "Мы готовы заключить новый газовый контракт с Россией на выгодных для нас условиях"
UKR_commie_china_trade: "Партнерство с Китаем"
UKR_commie_china_trade_desc: "Мы намерены укрепить дружественные отношения между нашими странами."
UKR_commie_china_trains: "Закупка поездов в Китае"
UKR_commie_china_trains_desc: "Мы закупим несколько поездов в Китае, что поможет улучшить наши поставки"
UKR_comsomol: "Возродить комсомол"
UKR_comsomol_desc: "Комсомольское движение нужно возродить как идеологическую опору нашей системы в умах новых поколений"
UKR_commie_china_infra: "Модернизация железных дорог"
UKR_commie_china_infra_desc: "Наши китайские коллеги согласились финансировать модернизацию железнодорожной сети нашей страны."
UKR_commie_china_huawei: "Сотрудничество с Huawei"
UKR_commie_china_huawei_desc: "Мы установим тесное сотрудничество с этой китайской компанией"
UKR_commie_motor_sich: "Расширить Мотор Сич"
UKR_commie_motor_sich_desc: "Мы инвестируем дополнительные средства в развитие нашего ключевого предприятия - Мотор Сич"
UKR_ukr_pioners: "Возродить пионеров"
UKR_ukr_pioners_desc: "Пионеров нужно возродить, молодежь потеряла свои моральные ориентиры и должна быть снова направлена на путь социализма"
UKR_one_union_for_all: "Единый государственный профсоюз"
UKR_one_union_for_all_desc: "Мы защитим права трудящихся по всей стране, создав единый профсоюз"
UKR_remilitarization: "Ремилитаризация"
UKR_remilitarization_desc: "Наше государство должно иметь сильную армию, поэтому мы начнем немедленный процесс ремилитаризации"
UKR_arms_zavods: "Инвестиции в военные заводы"
UKR_arms_zavods_desc: "Наша военная промышленность была разрушена после распада СССР, пора ее возродить"
UKR_sbu_kgb: "Методы КГБ"
UKR_sbu_kgb_desc: "Мы должны восстановить старую школу КГБ, это явно повысит профессионализм нашего персонала"
UKR_arms_tanks: "Акцент на танки"
UKR_arms_tanks_desc: "Нашим вооруженным силам срочно нужны танки, мы дадим им эту необходимость"
UKR_revolut_in_blr: "Белорусская социалистическая революция"
UKR_revolut_in_blr_desc: "Наш братский белорусский народ угнетается своими правителями и капиталистами! Давайте освободим их!"
UKR_revolution_in_russia: "Российская социалистическая революция"
UKR_revolution_in_russia_desc: "Наш братский российский народ угнетается своими правителями и капиталистами! Давайте освободим их!"
UKR_befriend_russia_com: "Дружба с Россией"
UKR_befriend_russia_com_desc: "Мы намерены установить партнерские и дружественные отношения с Россией"
UKR_befriend_belarus_com: "Дружба с Беларусью"
UKR_befriend_belarus_com_desc: "Мы намерены установить партнерские и дружественные отношения с Беларусью"
UKR_central_asia_revolt: "Революции в Центральной Азии"
UKR_central_asia_revolt_desc: "Мы намерены поднять знамя революции и в этом регионе"
UKR_caucasus_revolut: "Революции на Кавказе"
UKR_caucasus_revolut_desc: "Мы намерены поднять знамя революции и в этом регионе"
UKR_baltic_revolut: "Революции в Прибалтике"
UKR_baltic_revolut_desc: "Мы намерены поднять знамя революции и в этом регионе"
UKR_revolut_in_mol: "Молдавская социалистическая революция"
UKR_revolut_in_mol_desc: "Наш братский молдавский народ угнетается своими правителями и капиталистами! Давайте освободим их!"
UKR_csto_com_app: "Вступить в ОДКБ"
UKR_csto_com_app_desc: "Наши братские народы являются членами ОДКБ, возможно, стоит присоединиться к ним"
UKR_integration_support: "Интеграция бывших республик"
UKR_integration_support_desc: "Мы начнем интеграционные процессы бывших республик"
UKR_declare_ussr: "Возродить СССР"
UKR_declare_ussr_desc: "Мы истинные наследники СССР! Пора возродить это великое государство!"
UKR_nationalize_everything: "Запустить национализацию"
UKR_nationalize_everything_desc: "Мы ничего не отдадим капиталистам! Предприятия вернутся в лоно государства!"
UKR_social_propaganda: "Социальные реформы"
UKR_social_propaganda_desc: "Мы запустим масштабные социальные реформы, которые позволят нам завоевать сердца бедных"
UKR_christian_communism: "Христианский коммунизм"
UKR_christian_communism_desc: "Запрет религии был одной из ошибок, которую мы не допустим. Христианский коммунизм - наше будущее. Ведь сам Иисус был коммунистом!"
UKR_criminalize_oligrachy: "Криминализировать олигархию"
UKR_criminalize_oligrachy_desc: "Олигархи много лет пьют кровь из нашей страны, распродавая имущество, созданное нашими прадедами, хватит!"
UKR_land_to_people: "Земля народу!"
UKR_land_to_people_desc: "Земля должна принадлежать народу! Не кучке олигархов, бандитов"
UKR_revive_soviet_factories: "Возродить советские заводы"
UKR_revive_soviet_factories_desc: "Многие предприятия, оставшиеся в наследство от СССР, были разрушены и уничтожены, мы возродим их снова"

UKR_regions_ditch: "Отказаться от коалиции с Партией регионов"
UKR_regions_ditch_desc: "Мы не будем формировать коалицию с этой партией, это принесет нам только проблемы."
UKR_regions_integr: "Коалиция с Партией регионов"
UKR_regions_integr_desc: "Мы сформируем коалицию с этой партией, это укрепит наши политические возможности"
UKR_socialist_ukraine_effort: "Социалистические реформы"
UKR_socialist_ukraine_effort_desc: "Мы начнем серию реформ, которые должны укрепить нашу политическую позицию"
UKR_pensions_for_elders_incr: "Увеличить пенсии"
UKR_pensions_for_elders_incr_desc: "Мы увеличим пенсионные выплаты, чтобы граждане были готовы выйти на пенсию"
UKR_full_rabota: "Трудовые реформы"
UKR_full_rabota_desc: "Мы проведем серьезные реформы в трудовом законодательстве для улучшения условий труда наших граждан"

UKR_socialist_democratic_policies: "Социал-демократическая страна"
UKR_socialist_democratic_policies_desc: "Новое будущее ждет нашу страну под знаменем социал-демократии"

UKR_start_to_support: "Начать поддержку бедных"
UKR_start_to_support_desc: "Наш электорат - это малоимущие граждане, которые надеются, что наши реформы вытащат их из экономической пропасти, в которую их втянуло предыдущее правительство. Мы поможем им"
UKR_progressive_taxation: "Прогрессивное налогообложение"
UKR_progressive_taxation_desc: "Мы намерены ввести прогрессивное налогообложение для большей экономической справедливости наших граждан"
UKR_social_conservative_prog: "Социально-консервативная программа"
UKR_social_conservative_prog_desc: "Мы намерены провести ряд реформ, которые были вдохновлены социально-консервативными представителями политической сферы нашей страны"
UKR_ukr_cossack_freedom: "Казачья свобода"
UKR_ukr_cossack_freedom_desc: "Наш гражданин как вольный казак, он больше не раб капитала и не раб никого"
UKR_nationalization_of_big_com: "Национализация крупных компаний"
UKR_nationalization_of_big_com_desc: "Мы проведем серию национализаций крупных компаний"
UKR_crusade_against_inequality: "Борьба с неравенством"
UKR_crusade_against_inequality_desc: "Неравенство в нашем обществе становится все более выраженным, и мы начнем экономическую и политическую программу для смягчения финансовых границ между различными социальными слоями"
UKR_reduce_cap_oligrach: "Ослабить влияние олигархов"
UKR_reduce_cap_oligrach_desc: "Олигархи имеют слишком большое влияние на нашу страну, пора с этим разобраться"
UKR_people_brotherhood: "Братское единство"
UKR_people_brotherhood_desc: "Наш народ, народы, населяющие нашу страну, должны быть единым братством, которое будет противостоять угрозам извне"
UKR_ask_russia_to_give_nukes: "Запросить ядерное оружие у России"
UKR_ask_russia_to_give_nukes_desc: "Мы намерены запросить у России некоторые запасы ядерного оружия для защиты нашей страны от внешних угроз"
UKR_reduce_foreign_influence: "Уменьшить иностранное влияние"
UKR_reduce_foreign_influence_desc: "Мы ослабим иностранное влияние на нашу страну, независимость - наш фундамент"
UKR_labourr_unions: "Поддержка профсоюзов"
UKR_labourr_unions_desc: "Мы будем активно защищать отечественные профсоюзы для создания позитивного рабочего климата в стране."
UKR_immigartion_easing: "Облегчить иммиграцию"
UKR_immigartion_easing_desc: "Мы облегчим иммиграционные процессы, потому что наши границы не должны быть закрыты стенами"
UKR_uindependence_prop: "Защитить отечественного инвестора"
UKR_uindependence_prop_desc: "Мы не должны бросать отечественного инвестора, это единственный способ укрепить рост нашей экономики"
UKR_dont_touch_west_inv: "Приоритет западного инвестора"
UKR_dont_touch_west_inv_desc: "Мы сосредоточим наши усилия на защите западного инвестора"
UKR_pro_russian_approach: "Пророссийское направление"
UKR_pro_russian_approach_desc: "Мы выберем Россию как ориентир, исторически мы только на пути с ними"
UKR_pro_western_approach: "Прозaпадное направление"
UKR_pro_western_approach_desc: "Мы выбрали наш путь - путь на запад"
UKR_request_protection_from_rus: "Запросить российскую защиту"
UKR_request_protection_from_rus_desc: "Мы попытаемся заключить соглашения о защите и обороне, чтобы наша страна была защищена Россией"
UKR_apply_economic_union: "Вступить в российское экономическое пространство"
UKR_apply_economic_union_desc: "Экономическое сотрудничество с Россией даст нам экономический рост и выгодные контракты"
UKR_donbas_peaceful: "Мирное решение сепаратистской проблемы"
UKR_donbas_peaceful_desc: "Мы готовы мирно решить вопрос с территориями, которые отделились от нас"
UKR_csto_apply: "Вступить в ОДКБ"
UKR_csto_apply_desc: "Мы намерены стать частью ОДКБ, мы видим, что только члены этого альянса действительно заинтересованы в нашей защите"
UKR_western_socialists_coalition: "Коалиция с западными партиями"
UKR_western_socialists_coalition_desc: "Мы намерены создать коалицию с прозападными партиями"
UKR_harsh_separat_dealkill: "Покончить с сепаратистами"
UKR_harsh_separat_dealkill_desc: "Мы готовы освободить наши территории"
UKR_apply_eu_reforms: "Принять прoeвропейские реформы"
UKR_apply_eu_reforms_desc: "Мы намерены следовать европейскому политическому курсу"
UKR_nato_commitment: "Реформы НАТО"
