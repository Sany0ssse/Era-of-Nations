##########Events##########
ukraine_congress.1.t: "Новая национальная Украина"
ukraine_congress.1.d: "Украина наконец возродится и станет тем, чем должна быть, не всем понравятся такие реформы, и мы готовы к тому, что люди покинут нашу страну, но это путь сильной Украины"
ukraine_congress.1.a: "Слава Украине!"

ukraine_congress.2.t: "Украина захватывает Севастополь"
ukraine_congress.2.d: "Украинское правительство отменяет договор аренды с нами и начинает изгнание нашего флота из Севастополя"
ukraine_congress.2.a: "Это наше поражение"

ukraine_congress.10.t: "Украина предлагает идеи Балтийско-Черноморского союза"
ukraine_congress.10.d: "Балтийско-Черноморский союз - это концепция, похожая на концепцию Междуморья, возглавляемую из Польши давным-давно. Она говорит о оборонительном альянсе, который объединил бы страны, находящиеся между Балтийским и Черным морями. Страны сотрудничали бы и консолидировались в силовой блок, который поддерживал бы друг друга. Как говорится, в единстве сила.\n\n§YЭто позволяет взаимные гарантии через украинское дерево§!"
ukraine_congress.10.a: "Мы должны продолжить изучение этого."
ukraine_congress.10.b: "Глупая идея"

ukraine_congress.11.t: "Балтийско-Черноморский союз"
ukraine_congress.11.d: "Законы и договоры составлены. Народы стран, поддерживающих эту идею, наконец объединились. Теперь пришло время реализовать амбиции. Пора объединить тех, кто нас поддержал. Украина прислала нам наш финальный договор, который мы должны подписать для официального оформления альянса. Отступаем ли мы сейчас или продолжаем курс и поддерживаем наших новых союзников?"
ukraine_congress.11.a: "Подписать договор"
ukraine_congress.11.b: "Отступить. Разорвать договор"
##########Cosmetic Tags##########
FAR_green_klin: "Зеленый клин"


##########POROSHENKO##########
##########Focuses##########
UKR_poroshenko_start: "Президентство Порошенко"
UKR_poroshenko_start_desc: "Украинское государство возглавил олигарх. История Украины явно не ожидала такого поворота, возможно, это приведет Украину к успеху"
UKR_poroshenko_decentr: "Децентрализация"
UKR_poroshenko_decentr_desc: "Одним из основных политических пунктов программы Порошенко была и будет - децентрализация. Мы должны реформировать украинское государство"
UKR_poroshenko_deccomunism: "Декоммунизация"
UKR_poroshenko_deccomunism_desc: "Коммунистическое прошлое было тяжелым и страшным для нашей страны. Наша нация была почти уничтожена Голодомором, и мы не позволим памятникам нашим убийцам стоять по всей стране"
UKR_poroshenko_anti_corruption: "Антикоррупционные реформы"
UKR_poroshenko_anti_corruption_desc: "Коррупция была и будет больной темой в нашей стране, и мы проведем серию антикоррупционных реформ"
UKR_poroshenko_nabu: "Создать НАБУ"
UKR_poroshenko_nabu_desc: "НАБУ - центральный орган исполнительной власти со специальным статусом, которому поручено предупреждение, выявление, пресечение, расследование и раскрытие коррупции и других уголовных правонарушений, отнесенных к его юрисдикции, а также предупреждение новых."
UKR_poroshenko_no_russian_military: "Избавиться от влияния российских вооруженных сил"
UKR_poroshenko_no_russian_military_desc: "Мы должны прекратить зависеть от российской армии, только независимая украинская армия защитит страну."
UKR_poroshenko_anti_rus_doctrine: "Антироссийская доктрина"
UKR_poroshenko_anti_rus_doctrine_desc: "Россия была и будет агрессором по отношению к нам, мы должны четко отразить это в нашей военной доктрине"
UKR_poroshenko_smi_free: "Свобода СМИ"
UKR_poroshenko_smi_free_desc: "СМИ должны быть свободными и не ограниченными диктаторскими привычками нескольких людей"
UKR_poroshenko_kefalia: "Автокефалия украинской церкви"
UKR_poroshenko_kefalia_desc: "Пора избавиться от влияния московской православной церкви"
UKR_poroshenko_ukrainisation: "Украинизация"
UKR_poroshenko_ukrainisation_desc: "Мы начнем политику украинизации и постепенно искореним русский язык из различных социальных сред"
UKR_poroshenko_upa: "Чтить героев УПА"
UKR_poroshenko_upa_desc: "УПА - они были защитниками Украины, и мы будем их чтить"
UKR_poroshenko_es: "Сотрудничество с ЕС"
UKR_poroshenko_es_desc: "Европейский союз будет нашим основным экономическим партнером, и мы будем стремиться поддерживать торговые отношения с ними дальше"
UKR_poroshenko_nato: "Сотрудничество с НАТО"
UKR_poroshenko_nato_desc: "НАТО - наш основной военный партнер, и с их помощью мы реформируем наши вооруженные силы"
UKR_poroshenko_canada: "Партнерство с Канадой"
UKR_poroshenko_canada_desc: "Мы готовы заключить несколько соглашений с Канадой для улучшения торговых отношений"
UKR_us_friendship: "Партнерство с США"
UKR_us_friendship_desc: "Мы готовы заключить несколько соглашений с США для улучшения торговых отношений"
UKR_visegrad_coop: "Партнерство с Вышеградской группой"
UKR_visegrad_coop_desc: "Мы готовы заключить несколько соглашений с Вышеградской группой для улучшения торговых отношений"
UKR_turkey_invest_req: "Инвестиции из Турции"
UKR_turkey_invest_req_desc: "Мы привлечем турецких инвесторов на нашу территорию, их инвестиции помогут нашей экономике"
UKR_kazakh_improve_rel: "Улучшить отношения с Казахстаном"
UKR_kazakh_improve_rel_desc: "Казахстанские партнеры будут отличным дополнением к нашей внешнеторговой деятельности"
UKR_reorient_market: "Переориентация на западный рынок"
UKR_reorient_market_desc: "Восток закрыт для нас, мы переориентируем наши рынки на запад"
UKR_ukroboronprom_revival: "Инвестиции в оборонную промышленность"
UKR_ukroboronprom_revival_desc: "Наша оборонная промышленность нуждается в инвестициях, мы их дадим"
UKR_smuggle_parts_through_russia: "Покупать детали в России окольными путями"
UKR_smuggle_parts_through_russia_desc: "Несмотря на нашу антироссийскую доктрину, мы вынуждены покупать запчасти с российских заводов, хотя и окольными путями"
UKR_reverse_engineering: "Обратная инженерия"
UKR_reverse_engineering_desc: "Мы будем стремиться создать собственную инженерию в области бронетехники"
UKR_western_assistance: "Западная поддержка"
UKR_western_assistance_desc: "Западные инвесторы также активно инвестируют в нашу оборонную промышленность"
UKR_belarus_proposal_non_attack: "Пакт о ненападении с Беларусью"
UKR_belarus_proposal_non_attack_desc: "Беларусь, наш северный сосед, может быть использована врагами для атаки на нас с двух сторон, мы должны это предотвратить"
UKR_language_policies: "Языковая политика"
UKR_language_policies_desc: "Мы продолжим расширять процент украинского языка в общении и в других сферах жизни граждан"
UKR_support_patriotism: "Поддержка патриотизма"
UKR_support_patriotism_desc: "Патриотизм будет поощряться государством как никогда раньше"
UKR_donbass_okopi: "Операция \"Стена\""
UKR_donbass_okopi_desc: "Нам срочно нужно построить оборонительную линию вдоль границы с нашим врагом"
UKR_transnistria_defences: "Укрепить границу с Приднестровьем"
UKR_transnistria_defences_desc: "Приднестровье может стать плацдармом для атаки на нас в будущем, мы укрепим с ними границу"
UKR_deoligarchisation: "Деолигархизация"
UKR_deoligarchisation_desc: "Олигархи имеют слишком много власти в нашей стране - мы это исправим"
UKR_rochen_expansion: "Расширить производство Рошен"
UKR_rochen_expansion_desc: "Завод Рошен теперь сможет расширить свои производственные возможности с помощью государственных инвестиций"
UKR_support_medium_businesses: "Поддержка малого бизнеса"
UKR_support_medium_businesses_desc: "Малый бизнес получит необходимую поддержку"
UKR_kolomoyski_deal: "Разобраться с Коломойским"
UKR_kolomoyski_deal_desc: "Коломойский давно был одной из главных проблем в нашей стране, его влияние было слишком велико, и пора с ним разобраться"
UKR_purge_church_from_rus: "Устранить влияние РПЦ"
UKR_purge_church_from_rus_desc: "Русская православная церковь больше не будет на нас влиять"
UKR_greece_letter: "Обратиться к Вселенскому патриарху"
UKR_greece_letter_desc: "Мы обратимся к Вселенскому патриарху с просьбой признать нашу церковь независимой"
UKR_upc_create: "Создать украинскую православную церковь"
UKR_upc_create_desc: "Украинская православная церковь будет создана! Теперь мы и духовно свободная страна"
UKR_poroshenko_army_reform: "Реформа армии"
UKR_poroshenko_army_reform_desc: "Наша армия нуждается в серьезных реформах - мы начнем их реализацию сейчас"
UKR_pmc_instructors: "Инструкторы из западных ЧВК"
UKR_pmc_instructors_desc: "Инструкторы западных ЧВК готовы поддержать нашу армию"
UKR_rally_nationalist_support: "Поддержка ветеранов"
UKR_rally_nationalist_support_desc: "Ветераны боевых действий будут опорой нашей будущей избирательной кампании"
UKR_welfare_conseccions: "Увеличить социальную поддержку"
UKR_welfare_conseccions_desc: "Мы сосредоточим нашу избирательную кампанию в будущем на увеличении социальных гарантий."
UKR_anti_russia_propaganda: "Антироссийская пропаганда"
UKR_anti_russia_propaganda_desc: "Наш гражданин должен понимать, кто его истинный враг, кто стремится поглотить нашу страну - Россия"
UKR_saakashvili_odessa: "Пригласить Саакашвили губернатором Одессы"
UKR_saakashvili_odessa_desc: "Мы пригласим Саакашвили быть губернатором Одесской области, возможно, он хорошо себя проявит"
UKR_support_minsk_agreements: "Поддержать Минские соглашения"
UKR_support_minsk_agreements_desc: "Мы поддержим Минские соглашения и попытаемся решить все мирно"
UKR_continue_shelling: "Покончить с сепаратистами"
UKR_continue_shelling_desc: "Никаких сепаратистов! Мы освободим наши земли"
UKR_business_with_rf: "Бизнес с РФ"
UKR_business_with_rf_desc: "Мы продолжим вести бизнес с Россией"
UKR_full_rus_embargo_por: "Ввести эмбарго против России"
UKR_full_rus_embargo_por_desc: "Мы введем эмбарго на экономическое сотрудничество с Россией"
UKR_osce_watchers: "Наблюдатели ОБСЕ"
UKR_osce_watchers_desc: "Наблюдатели ОБСЕ будут приглашены в Донбасс"
UKR_suppress_easterner: "Подавить восточников"
UKR_suppress_easterner_desc: "Сторонники интеграции с Россией должны быть подавлены, в том числе через СМИ"
UKR_anti_emerg_1plus1: "Усилить антивосточную пропаганду"
UKR_anti_emerg_1plus1_desc: "Мы усилим пропаганду, направленную против тех, кто поддерживает Россию"
UKR_eu_compliant_reforms: "Реформы соответствия ЕС"
UKR_eu_compliant_reforms_desc: "Мы продолжим реформы соответствия для интеграции с Европейским союзом"
UKR_european_education_connections: "Сотрудничество с европейскими образовательными учреждениями"
UKR_european_education_connections_desc: "Европейское образование даст нам гораздо больше, чем старое, советское и тоталитарное"
UKR_european_defence_program: "Европейская программа защиты"
UKR_european_defence_program_desc: "Мы присоединимся к Европейской программе обороны для укрепления наших вооруженных сил"
UKR_nato_application_por: "Программа сотрудничества с НАТО"
UKR_nato_application_por_desc: "Партнерство НАТО в области вооруженных сил также позволит нам провести реформы нашей армии"
UKR_ukraine_anew: "Новая Украина"
UKR_ukraine_anew_desc: "Наша страна прошла долгий путь, много реформ, но теперь она возродилась и смотрит в будущее позитивно"
UKR_separatist_menace: "Сепаратистская угроза"
UKR_separatist_menace_desc: "Угроза сепаратистских республик никуда не делась, мы должны ее решить."
UKR_apply_to_eu_por: "Программа сотрудничества с ЕС"
UKR_apply_to_eu_por_desc: "Сотрудничество с Европейским союзом продолжит быть нашим приоритетом"
##########Ideas##########
UKR_NABU: "Национальное антикоррупционное бюро Украины"
UKR_NABU_desc: "Новое антикоррупционное бюро призвано усилить борьбу с коррумпированными чиновниками на всех уровнях в разы."
UKR_Poroh_deccomuniz: "Президентство Порошенко"
UKR_Poroh_deccomuniz_desc: "Порошенко - неоднозначная личность, но его стремление сделать Украину сильной перед лицом врага заслуживает уважения народа."
UKR_anti_rus_doctrine: "Антироссийская доктрина"
UKR_anti_rus_doctrine_desc: "Нашим политическим и идеологическим врагом была и остается Россия. Мы должны это принять и быть готовыми к войне."
UKR_foreign_advisors_desc: "Иностранные инструкторы из различных ЧВК готовы обучать наших солдат"
UKR_nato_doctrine: "Доктрина НАТО"
UKR_nato_doctrine_desc: "Наши вооруженные силы будут следовать доктрине НАТО для создания современной европейской армии"
UKR_west_investors: "Западные инвесторы"
UKR_operation_wall: "Операция \"Стена\""
UKR_smuggle_parts_from_rus: "Покупка запчастей из России"
UKR_smuggle_parts_from_rus_desc: "Мы продолжаем покупать запчасти из России, хотя и тайно"
UKR_reverse_engineering_start: "Обратная инженерия"
UKR_reverse_engineering_start_desc: "Мы стремимся создать собственное производство"
UKR_ato_supports: "Поддержка ветеранов"
UKR_health_supports: "Поддержка здравоохранения"
UKR_poroh_prepare_donbass: "Подготовка к реваншу в Донбассе"
UKR_poroh_prepare_donbass_desc: "Мы готовы отомстить сепаратистам и навсегда решить проблему с народными республиками"
UKR_poroh_osce_ukr: "Наблюдатели ОБСЕ"
UKR_poroh_osce_ukr_desc: "Наблюдатели ОБСЕ были отправлены в зону конфликта для стабилизации ситуации на линии фронта с непризнанными республиками"
UKR_idea_eu_member_associate: "Ассоциированный член ЕС"
UKR_idea_eu_member_associate_desc: "Украина начала свою ассоциацию с ЕС. Это углубит связи с Европой и западным блоком. Однако это создает проблемы с регионами, где большинство говорит на русском языке."
##########Events##########
ukraine_poroh.1.t: "Украина предлагает пакт о ненападении"
ukraine_poroh.1.d: "Украинское правительство предлагает нам заключить пакт о ненападении с ними, видимо, они видят в нас потенциальных агрессоров против себя"
ukraine_poroh.1.a: "Мы подпишем пакт"
ukraine_poroh.1.b: "В этом нет необходимости"
ukraine_poroh.2.t: "Пакт о ненападении с Беларусью"
ukraine_poroh.2.d: "Белорусское правительство согласилось подписать пакт о ненападении с нами, мы рады, что они на нашей стороне"
ukraine_poroh.2.a: "Хорошо"
ukraine_poroh.3.t: "Пакт о ненападении с Беларусью"
ukraine_poroh.3.d: "Белорусское правительство отказалось подписать пакт о ненападении с нами, что нас беспокоит"
ukraine_poroh.3.a: "Печально"
ukraine_poroh.4.t: "Автокефалия украинской церкви"
ukraine_poroh.4.d: "Украинская церковь обратилась к нашему Вселенскому патриарху за разрешением на автокефалию своей церкви, позволит ли наш патриарх это?"
ukraine_poroh.4.a: "Да"
ukraine_poroh.4.b: "Нет"
ukraine_poroh.5.t: "Автокефалия украинской церкви"
ukraine_poroh.5.d: "Вселенский патриарх одобрил автокефалию нашей церкви"
ukraine_poroh.5.a: "Хорошо"
ukraine_poroh.6.t: "Автокефалия украинской церкви"
ukraine_poroh.6.d: "Вселенский патриарх не одобрил автокефалию нашей церкви"
ukraine_poroh.6.a: "Печально"
ukraine_poroh.7.t: "Украина хочет сотрудничества с Вышеградской четверкой"
ukraine_poroh.7.d: "Украинское правительство четко обозначило свои планы сотрудничества со странами Вышеградской четверки. Как представитель четверки, мы решаем, согласны ли мы на это сотрудничество?"
ukraine_poroh.7.a: "Да"
ukraine_poroh.7.b: "Нет"
ukraine_poroh.8.t: "Сотрудничество с Вышеградскими странами"
ukraine_poroh.8.d: "Они согласились сотрудничать"
ukraine_poroh.8.a: "Хорошо"
ukraine_poroh.9.t: "Сотрудничество с Вышеградскими странами"
ukraine_poroh.9.d: "Они отказались сотрудничать с нами"
ukraine_poroh.9.a: "Печально"
