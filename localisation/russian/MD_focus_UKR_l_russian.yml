##########Decisions##########

UKR_verkhovna_rada: "Верховная Рада"
UKR_verkhovna_rada_desc: "\n\n\n\n\n\n£UKR_desctext_rada\n\n\n\n\n\n\n\n\n§HВерховная Рада§! [UKR.GetFlag] - это наш национальный парламент, и они диктуют, какие законы приходят и уходят, что означает, что они часто могут идти против наших собственных потребностей. §HВерховная Рада§! может находиться в одном из 3 состояний в любое время. §CСвободная§!, что означает, что у нас нет прямого контроля над §HВерховной Радой§!, §CПод Влиянием§!, что означает, что у нас есть некоторый контроль, и §CМарионеточная§!, что означает, что у нас есть полный контроль.\n\n§HВерховная Рада§! может отозвать свою поддержку нашего правительства, если мы отклоним §Hопределенные предложения§! которые у них есть, или если мы изменимся на §Hпозицию, которая не тесно связана с их§!. Они также могут случайно отозвать поддержку, если им так захочется.\n\nЧем больше поддержки у нас есть, тем лучше, поскольку это делает более вероятным, что мы сможем принимать законы без необходимости принимать дополнительные меры. §HВерховная Рада§! проведет выборы, и результат будет основан на влиянии иностранных государств или нашей собственной внутренней независимости.\n\n§G[?UKR_verkhovna_support]§!/§H450§! Мест в §HВерховной Раде§! в настоящее время поддерживают наше правительство\n"
ukraine_nationalist_majority_name: "§HПро-Украинское Большинство§!"
UKR_right_wing_desc_TT: "§HПро-Украинское Большинство§! в парламенте означает, что парламент стремится к большему дистанцированию как от §CЗапада§!, так и от §GРоссии§!. Они стремятся к более независимой и нейтральной §HУкраине§! в мировых делах и в целом против выбора сторон в любом конфликте."
ukraine_eastern_majority_name: "§GПро-Российское Большинство§!"
UKR_left_wing_desc_TT: "§GПро-Российский§! блок в парламенте в целом стремится к более тесным связям с §GРоссийским§! правительством, желая дистанцироваться от §CЗападных§! держав. Радикализация варьируется в рамках этого блока, поскольку некоторые хотят сохранить независимую §HУкраину§! с §GПро-Российскими§! связями, а другие желают большей интеграции §HУкраинского§! и §GРоссийского§! обществ."
ukraine_western_majority_name: "§BПро-Западное Большинство§!"
UKR_liberal_TT: "§BПро-Западный§! блок в парламенте представляет партии и отдельных лиц, которые хотят, чтобы §HУкраина§! отказалась от своих про-российских политик и приняла более тесные связи с §CЗападными§! державами. Цели тех, кто примыкает к §CЗападу§!, сильно различаются: некоторые просто желают экономических и культурных связей, а другие желают присоединиться к альянсу §BНАТО§! и защитить §HУкраину§! от §GРоссийского§! влияния."
ukraine_dissolved_majority_name: "§RВерховная Рада Распущена§!"
UKR_verkhovna_dissolved_tt: "Парламент был распущен, и зал пуст, без присутствующих представителей."
ukraine_free_verkhovna: "§CСтатус Верховной Рады: Свободная§!"
UKR_verkhovna_free_tt: "Парламент свободен от влияния президента, с обсуждениями и дебатами, развивающимися органично без вмешательства другого правительственного органа."
ukraine_influenced_verkhovna: "§pСтатус Верховной Рады: Под Влиянием§!"
UKR_verkhovna_influenced_tt: "Правительство было реформировано таким образом, что парламент стал легко эксплуатируемым, с правительством президента, способным легко влиять на обсуждение, когда парламент заседает."
ukraine_puppeted_verkhovna: "§OСтатус Верховной Рады: Марионеточная§!"
UKR_verkhovna_puppetted_tt: "Парламент - это просто еще один инструмент для президента и его кабинета, чтобы обмануть людей ложным чувством представительства."
