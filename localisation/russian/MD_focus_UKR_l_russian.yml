 ##########Decisions##########
 UKR_FedRada_category: "Федеральная Рада"
 UKR_FedRada_category_desc: "Федеральная Рада - это правительственный орган в Федерализованной Украине, созданный для взаимодействия субъектов Федерации с федеральным центром.\n\n§YСубъекты Украинской Федерации§! могут быть §Gаннексированы§! [UKR.GetFlag]Украиной, но при условии §Yвлияния§! на субъекты в §Yразмере 50%§!"
 UKR_subsidies: "Запросить Субсидии От §Y[UKR.GetNameWithFlag]§!"
