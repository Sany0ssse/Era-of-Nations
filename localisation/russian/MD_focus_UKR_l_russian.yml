ukraine_kolom.1.t: "Коломойский объявил о создании республики"
ukraine_kolom.1.d: "Игорь Коломойский, один из самых богатых олигархов Украины, объявил о создании Днепропетровской республики как автономии в составе Украины. Это потрясло наше правительство, и теперь нам нужно решить, что с этим делать"
ukraine_kolom.1.a: "Никакой автономии"
ukraine_kolom.1.b: "Возможно, это будет выгодно для нас"
ukraine_kolom.2.t: "Наша армия"
ukraine_kolom.2.d: "Те подразделения, которые мы лично финансировали, встали на нашу сторону, теперь они наша главная ударная сила"
ukraine_kolom.2.a: "За свободу Днепра!"

