 ##########MAIDAN CONTENT##########
 ##########Western Maidan##########
 ukraine_maidan_west.1.t: "Протесты На Майдане"
 ukraine_maidan_west.1.d: "Наша государственная политика не устраивает определенную часть населения. Люди начинают выходить на знаменитую киевскую площадь - Майдан, как способ выразить недовольство нашими политическими решениями."
 ukraine_maidan_west.1.a: "Мы наблюдаем"
 ukraine_maidan_west.2.t: "Протесты На Майдане"
 ukraine_maidan_west.2.d: "Наше правительство ожидало, что протесты быстро закончатся, но этого не произошло, скорее люди начали ставить палатки и разбивать лагерь на площади, чтобы остаться на более длительный период времени."
 ukraine_maidan_west.2.a: "У Меня Плохое Предчувствие"
 ukraine_maidan_west.19.t: "Восстание В Галиции"
 ukraine_maidan_west.19.d: "Сторонники Евромайдана, а также выжившие после киевской резни, объявили независимость от Украины. Две новые республики на территории Волыни и Львовской области намерены дать отпор центральному правительству."
 ukraine_maidan_west.19.a: "Мы Готовы Сражаться!"
 ##########Eastern Maidan##########
 ukraine_maidan_east.1.t: "Беспорядки На Юго-Востоке"
 ukraine_maidan_east.1.d: "Наша политика привела к протестам и демонстрациям на юго-востоке страны. Протесты с явно антиправительственными лозунгами охватили многие города."
 ukraine_maidan_east.1.a: "Внезапно"
 ukraine_maidan_east.2.t: "Депутаты Самоорганизуются"
 ukraine_maidan_east.2.d: "Протесты набирают обороты, и теперь к ним присоединились местные депутаты, провозглашая довольно опасные лозунги."
 ukraine_maidan_east.2.a: "Беспокоит"
 ukraine_maidan_east.9.t: "Гражданская Война!"
 ukraine_maidan_east.9.d: "Наша политика привела к тому, что юго-восточные регионы объявили о своей независимости и сформировали собственные республики, и гражданская война, похоже, не за горами."
 ukraine_maidan_east.9.a: "О Боже"
 ukraine_maidan_east.12.t: "Беспорядки На Юго-Востоке"
 ukraine_maidan_east.12.d: "Наши действия привели к широкомасштабной эскалации, и теперь мы сталкиваемся с последствиями."
 ukraine_maidan_east.12.a: "Мы совершили ошибку."
 ukraine_maidan_east.13.t: "Мятеж В Харькове"
 ukraine_maidan_east.13.d: "Неподготовленность наших спецслужб снова сыграла с нами злую шутку. В Харькове нам не удалось подавить восстание, что привело к вооруженному мятежу."
 ukraine_maidan_east.13.a: "Сколько Их?"
 ##IDEAS
 UKR_maidan_temporary_attack_idea: "Организованное Наступление"
 ##########MAIN MAIDAN##########
 ##Annexation of Crimea
 ukraine_maidan.1.t: "Статус Крыма"
 ukraine_maidan.1.d: "В Крыму большинство населения составляют русские. Люди там - наши люди. Несправедливо, чтобы они и их братья в Донбассе жили под украинским правлением. Должны ли мы почтить их призыв и интегрировать людей, которые стремятся быть с нами?"
 ukraine_maidan.1.a: "Захватить Крым"
 ukraine_maidan.1.b: "Крым Украинский"
 #Russia Annexes the Crimea
 ukraine_maidan.2.t: "Россия Аннексирует Крым"
 ukraine_maidan.2.d: "Народ Крыма откололся. Они искали поддержки российского правительства. Крымчане подавляющим большинством проголосовали на референдуме за то, чтобы позволить государству быть поглощенным российским государством. Российские войска, дислоцированные возле Крыма, хлынули в регион и быстро захватили ключевые точки. Войска были встречены с распростертыми объятиями предателями. Однажды мы вернем территорию, которая по праву принадлежит нам!"
 ukraine_maidan.2.a: "Интересно"
 #Russia Denies the People of Ukraine
 ukraine_maidan.3.t: "Россия Отказывает Народу Украины"
 ukraine_maidan.3.d: "Предатели в Крыму наконец-то провели свой глупый референдум, пытаясь отделиться от нас. Народ России долгое время поощрял такой курс поведения. Загадка, почему русские отказали народу Крыма. Однако мы ценим, что они не подорвали нас дальше, захватив контроль над регионом. Время покажет, к чему привело это решение."
 ukraine_maidan.3.a: "Хороший День"
 ###Minsk Agreement
 ukraine_maidan.4.t: "Минские Соглашения"
 ukraine_maidan.4.d: "Война не привела к ожидаемому для нас результату. Сепаратисты не были уничтожены, и люди явно недовольны бесконечной войной. Может быть, нам стоит сделать перерыв?"
 ukraine_maidan.4.a: "Мир Сейчас"
 ukraine_maidan.4.b: "Мир? Зачем?"
 ###Minsk Agreement
 ukraine_maidan.5.t: "Минские Соглашения"
 ukraine_maidan.5.d: "Война не привела к ожидаемому для нас результату. Сепаратисты не были уничтожены, и люди явно недовольны бесконечной войной. Может быть, нам стоит сделать перерыв?"
 ukraine_maidan.5.a: "Мир Сейчас"
 ukraine_maidan.5.b: "Мир? Зачем?"
 ###OSCE Obser
 ukraine_maidan.6.t: "Наблюдатели ОБСЕ"
 ukraine_maidan.6.d: "Для контроля и предотвращения вооруженного конфликта наблюдатели ОБСЕ были направлены в приграничную зону для обеспечения мира и стабильности в Донбассе."
 ukraine_maidan.6.a: "Просто Перемирие"
 ukraine_maidan.7.t: "Наблюдатели ОБСЕ"
 ukraine_maidan.7.d: "Для контроля и предотвращения вооруженного конфликта наблюдатели ОБСЕ были направлены в приграничную зону для обеспечения мира и стабильности в Донбассе."
 ukraine_maidan.7.a: "Просто Перемирие"
 ###Federalisation Donbass
 ukraine_maidan.8.t: "Украина Предлагает Федерализацию"
 ukraine_maidan.8.d: "Украина предлагает нам проект федерализации и соглашается признать нас отдельным образованием. Согласимся ли мы на это?"
 ukraine_maidan.8.a: "Мы Согласны"
 ukraine_maidan.8.b: "Это Ложь!"
 ###Work Business Russia
 ukraine_maidan.9.t: "Работа С Российским Бизнесом"
 ukraine_maidan.9.d: "Мы продолжим работать с российским бизнесом, потому что Европейский Союз не может предоставить нам уровень ресурсов и технологий, который нам нужен."
 ukraine_maidan.9.a: "Необходимая Жертва"
 ###Federalisation Galicia
 ukraine_maidan.10.t: "Украина Предлагает Федерализацию"
 ukraine_maidan.10.d: "Украина предлагает нам проект федерализации и соглашается признать нас отдельным образованием. Согласимся ли мы на это?"
 ukraine_maidan.10.a: "Мы Согласны"
 ukraine_maidan.10.b: "Это Ложь!"
 ###Speed Up Maidan
 ukraine_maidan.11.t: "Недовольство Нашей Политикой"
 ukraine_maidan.11.d: "Жители восточной части нашей страны недовольны политикой, которую мы проводим. Они чувствуют, что политика направлена против них, и активно выражают свое недовольство."
 ukraine_maidan.11.a: "Это Плохо"
 ###Speed Up Maidan
 ukraine_maidan.12.t: "Недовольство Нашей Политикой"
 ukraine_maidan.12.d: "Жители западной части нашей страны недовольны политикой, которую мы проводим. Они чувствуют, что политика направлена против них, и активно выражают свое недовольство."
 ukraine_maidan.12.a: "Это Плохо"
 ###Ai choose party
 ukraine_maidan.13.t: "Судьба Украины"
 ukraine_maidan.13.d: ""
 ukraine_maidan.13.a: ""
 ###East Nedovolstvo
 ukraine_maidan.14.t: "Переговоры С Восточными Регионами"
 ukraine_maidan.14.d: "Наша политика привела к полному непризнанию нашего правительства восточными регионами, и они активно саботируют нашу деятельность. Однако у нас есть возможность вести с ними переговоры."
 ukraine_maidan.14.a: "Мы Пойдем На Компромисс"
 ukraine_maidan.14.b: "Они Ничто"
 ###West Nedovolstvo
 ukraine_maidan.15.t: "Переговоры С Западными Регионами"
 ukraine_maidan.15.d: "Наша политика привела к полному непризнанию нашего правительства западными регионами, и они активно саботируют нашу деятельность. Однако у нас есть возможность вести с ними переговоры."
 ukraine_maidan.15.a: "Мы Пойдем На Компромисс"
 ukraine_maidan.15.b: "Они Ничто"
 ###Choose Reform
 ukraine_maidan.16.t: "Популистская Реформа"
 ukraine_maidan.16.d: "Наше президентство должно начаться с какой-то реформы. Мы должны решить, что именно станет фокусом нашей реформаторской деятельности."
 ukraine_maidan.16.a: "Земельная Реформа"
 ukraine_maidan.16.b: "Дорожная Реформа"
 ukraine_maidan.16.c: "Мы Будем Влиять На Раду"
 ###Fire Bonus
 ukraine_maidan.17.t: "Политическая Стабильность"
 ukraine_maidan.17.d: "Наша мудрая и компетентная политика принесла плоды. Пока наша страна стабильна, наша политическая власть только растет."
 ukraine_maidan.17.a: "Отлично"
 ##########NEWS##########
 ##Civil War in Ukraine
 ukraine_news.7.t: "Гражданская Война В Украине"
 ukraine_news.7.d: "Люди в Донбасском регионе Украины объявили себя независимыми. Они объявили людям в Донецкой и Луганской областях, что больше не будут подчиняться тирании Киева. [UKR.GetLeader] и украинская администрация осудили повстанцев и мобилизовались для их подавления. В регионе уже начались стычки между местными проукраинскими силами и повстанцами."
 ukraine_news.7.a: "Подавить Восстание"
 ukraine_news.7.b: "Победить Угнетателей!"
 ukraine_news.7.c: "Интересная Ситуация"
 ###Annexation of Crimea
 ukraine_news.8.t: "Аннексия Крыма"
 ukraine_news.8.d: "Крымский народ провел референдум о выходе из Украины и присоединении к России. Российский ответ был быстрым и решительным, поскольку они быстро ввели войска в регион и аннексировали полуостров. Ключевые военные позиции были быстро захвачены. Украинское правительство выразило свое возмущение по этому поводу и требует, чтобы Россия вернула Крым им."
 ukraine_news.8.a: "Пока Только..."
 ukraine_news.8.b: "За Матушку Россию!"
 ukraine_news.8.c: "Тревожные Новости."
 ##########Country flags##########
 UKR_crimea_bund: "Крымская Республика восстала"



 ##########STARTING CONTENT##########
 ##########Ideas##########
 UKR_civil_war: "Война В Донбассе"
 UKR_civil_war_desc: "Наша страна разделена - мы ведем гражданскую войну против наших собственных граждан, наша армия не едина в своем стремлении уничтожить сепаратистов"
 UKR_civil_war1: "Война В Галиции"
 UKR_civil_war1_desc: "Наша страна разделена - мы ведем гражданскую войну против наших собственных граждан, наша армия не едина в своем стремлении уничтожить сепаратистов"
 UKR_old_road: "Ужасные Дороги"
 UKR_old_road_desc: "Состояние украинских дорог ужасающее, потому что согласно исследованиям, 90% из них находятся в ужасном состоянии"
 UKR_old_army: "Неопытная Армия"
 UKR_old_army_desc: "Украинская армия прошла этап своего создания на протяжении 90-х годов, но в отличие от России, у нее не было никакого реального боевого опыта, в связи с чем она выглядит слабой и дезорганизованной на данный момент."
 UKR_reform_army: "Реформированная армия"
 UKR_reform_army_desc: "Наша армия наконец-то начала свою реформацию, из непонятного сборища солдат мы станем сильной боевой единицей"
 UKR_idea_old_national_guard: "Национальная Гвардия"
 UKR_idea_old_national_guard_desc: "Национальная гвардия Украины - это государственный вооруженный орган, созданный на базе внутренних войск СССР, предназначенный для защиты суверенитета Украины, ее территориальной целостности, а также жизни и личного достоинства граждан, их конституционных прав и свобод от преступных посягательств и других антиобщественных действий."
 UKR_idea_national_guard: "Национальная Гвардия"
 UKR_idea_national_guard_desc: "Военное формирование с правоохранительными функциями, входит в систему Министерства внутренних дел Украины (МВД) и предназначено для выполнения задач по защите и охране жизни, прав, свобод и законных интересов граждан Украины, общества и государства от преступных и других противоправных посягательств, охране общественного порядка и обеспечению общественной безопасности, а также в сотрудничестве с правоохранительными органами - обеспечению государственной безопасности и охране государственной границы, пресечению террористической деятельности, деятельности незаконных военизированных или вооруженных формирований (групп), террористических организаций, организованных групп и преступных организаций.."
 UKR_kleptocracy: "Клептократия"
 UKR_kleptocracy_desc: "Украинское правительство в настоящее время погрязло в своей клептократии. Высшие чины коррумпированы и используют свою власть для эксплуатации людей и природных ресурсов своей территории, чтобы расширить свое богатство и политическую власть.\n\n§CЧтобы избавиться от негативного воздействия клептократии, стране необходимо принять меры по борьбе с коррупцией.§!"
 UKR_kleptocracy01: "Сильная Клептократия"
 UKR_kleptocracy01_desc: "Украинское правительство в настоящее время погрязло в своей клептократии. Высшие чины коррумпированы и используют свою власть для эксплуатации людей и природных ресурсов своей территории, чтобы расширить свое богатство и политическую власть.\n\n§CЧтобы избавиться от негативного воздействия клептократии, стране необходимо принять меры по борьбе с коррупцией.§!"
 UKR_kleptocracy02: "Очень Сильная Клептократия"
 UKR_kleptocracy02_desc: "Украинское правительство в настоящее время погрязло в своей клептократии. Высшие чины коррумпированы и используют свою власть для эксплуатации людей и природных ресурсов своей территории, чтобы расширить свое богатство и политическую власть.\n\n§CЧтобы избавиться от негативного воздействия клептократии, стране необходимо принять меры по борьбе с коррупцией.§!"
 UKR_kleptocracy03: "Парализующая Клептократия"
 UKR_kleptocracy03_desc: "Украинское правительство в настоящее время погрязло в своей клептократии. Высшие чины коррумпированы и используют свою власть для эксплуатации людей и природных ресурсов своей территории, чтобы расширить свое богатство и политическую власть.\n\n§CЧтобы избавиться от негативного воздействия клептократии, стране необходимо принять меры по борьбе с коррупцией.§!"
 UKR_to_many_generals: "Избыточный Генеральный Штаб"
 UKR_to_many_generals_desc: "В Украине 450 действующих генералов в армии. Большинство из них получили свои посты благодаря связям и коррупционным схемам и не имеют опыта ведения боевых действий. Текущий генеральный штаб некомпетентен и отчаянно нуждается в реформе."
 UKR_idea_government_in_need: "Неэффективное Правительство"
 UKR_every_man_ataman: "Каждый Человек - Атаман"
 UKR_every_man_ataman_desc: "Дух украинцев - это дух свободы и независимости, иногда это приносит пользу, иногда может сыграть злую шутку со страной"
 UKR_russian_dependent_military: "Российско-Зависимая Армия"
 UKR_russian_dependent_military_desc: "СССР распался давно, но наша армия все еще имеет зависимость от российской, как прямой наследник всех Вооруженных Сил СССР"
 ##########Focuses##########
 UKR_support_uia: "МАУ"
 UKR_support_uia_desc: "МАУ или Международные Авиалинии Украины - это флагманская и крупнейшая авиакомпания, присутствующая в Украине. Основной хаб для ее авиалайнеров находится в международном аэропорту Борисполь в Киеве. Она выполняет пассажирские рейсы и грузовые услуги в Европу, Ближний Восток, США, Канаду и Азию."
 UKR_build_new_airports: "Строить Новые Аэропорты"
 UKR_build_new_airports_desc: "Наши аэропорты слишком долго игнорировались. Нам нужно инвестировать в наши аэропорты как для гражданских, так и для военных целей."
 UKR_grants_for_high_speed_trains: "Гранты На Высокоскоростные Поезда"
 UKR_grants_for_high_speed_trains_desc: "Железнодорожная сеть крайне важна для экономического процветания Украины. Важно модернизироваться от наших старых систем к новым высокоскоростным поездам. Очень стоит инвестировать в расширение наших поездов, поскольку у нас одна из крупнейших железнодорожных сетей во всей Европе."
 UKR_invest_in_ministry_of_infrastructure: "Министерство Инфраструктуры"
 UKR_invest_in_ministry_of_infrastructure_desc: "Министерство инфраструктуры получило критику. Инфраструктура Украины рушится из-за коррумпированных чиновников в министерстве, которые откачивают средства. Люди не могут ездить по некоторым дорогам из-за их состояния. Пора перестроить министерство в надежде на лучшее будущее для наших отраслей."
 UKR_samru: "Инвестиции САМРУ"
 UKR_samru_desc: "Некоторые инфраструктурные компании в Украине заканчивают средства и общую работу. Государственное агентство автомобильных дорог Украины - одна из таких компаний, и мы должны стремиться дать им работу и улучшить некоторые дороги в нашей стране."
 UKR_roads_extend_plan: "Планы Инвестиций В Дороги"
 UKR_roads_extend_plan_desc: "Дороги в Украине не лучшие в мире. Некоторые районы все еще полагаются на грунтовые или почти разрушенные дороги. Пора этим регионам получить немного любви."
 UKR_ukrainian_railways: "УЗ"
 UKR_ukrainian_railways_desc: "УЗ - это название государственной компании, которая в настоящее время обладает огромной монополией на большинство украинских железнодорожных перевозок в стране. Компания может похвастаться впечатляющей общей протяженностью путей более 23 000 км, что делает ее 13-й по величине в мире. Она также является 6-м по величине железнодорожным пассажирским перевозчиком и 7-м по величине грузовым перевозчиком."
 UKR_hyperloop_project: "Проект Гиперпетли"
 UKR_hyperloop_project_desc: "'Проект Гиперпетли' - это концепция, разработанная бизнесменом Илоном Маском и его компаниями SpaceX и Tesla в рамках продолжающегося проекта по разработке более эффективной системы транспорта для глобального потребления. Украина - большая и обширная страна. Поэтому стоит изучить возможность расширения и разработки нашей версии гиперпетли."

