ukraine_parliament.21.t: "Парламент принимает наш новый бюджет здравоохранения"
ukraine_parliament.21.d: "Парламент одобрил наш запрос на снижение расходов на здравоохранение. Это следует за нашим предложением, которое было сделано несколько дней назад, и похоже, что предложение получило много популярности и поддержки."
ukraine_parliament.21.a: "Отлично"
ukraine_parliament.22.t: "Парламент отклоняет наш новый бюджет здравоохранения"
ukraine_parliament.22.d: "Парламент отклонил наш запрос на снижение расходов на здравоохранение. Это следует за нашим предложением, которое было сделано несколько дней назад, и похоже, что предложение не получило много популярности и поддержки."
ukraine_parliament.22.a: "К сожалению"
ukraine_parliament.22.b: "Возможно, небольшая взятка может изменить их мнение..."
ukraine_parliament.23.t: "Парламент принимает наш новый пенсионный бюджет"
ukraine_parliament.23.d: "Парламент одобрил наш запрос на увеличение пенсионных расходов. Это следует за нашим предложением, которое было сделано несколько дней назад, и похоже, что предложение получило много популярности и поддержки."
ukraine_parliament.23.a: "Отлично"
ukraine_parliament.24.t: "Парламент отклоняет наш новый пенсионный бюджет"
ukraine_parliament.24.d: "Парламент отклонил наш запрос на увеличение пенсионных расходов. Это следует за нашим предложением, которое было сделано несколько дней назад, и похоже, что предложение не получило много популярности и поддержки."
ukraine_parliament.24.a: "К сожалению"
ukraine_parliament.24.b: "Возможно, небольшая взятка может изменить их мнение..."
ukraine_parliament.25.t: "Парламент принимает наш новый пенсионный бюджет"
ukraine_parliament.25.d: "Парламент одобрил наш запрос на снижение пенсионных расходов. Это следует за нашим предложением, которое было сделано несколько дней назад, и похоже, что предложение получило много популярности и поддержки."
ukraine_parliament.25.a: "Отлично"
ukraine_parliament.26.t: "Парламент отклоняет наш новый пенсионный бюджет"
ukraine_parliament.26.d: "Парламент отклонил наш запрос на снижение пенсионных расходов. Это следует за нашим предложением, которое было сделано несколько дней назад, и похоже, что предложение не получило много популярности и поддержки."
ukraine_parliament.26.a: "К сожалению"
ukraine_parliament.26.b: "Возможно, небольшая взятка может изменить их мнение..."
ukraine_parliament.30.t: "Несколько мест в парламенте выступают против нашего правительства!"
ukraine_parliament.30.d: "Некоторые члены парламента выступили против нашего правительства, что привело к снижению нашей поддержки в собрании."
ukraine_parliament.30.a: "Бывает"
ukraine_parliament.30.b: "Возможно, их карманы стали немного пустыми?"
ukraine_parliament.31.t: "Несколько мест в парламенте начали поддерживать нас!"
ukraine_parliament.31.d: "Некоторые члены парламента начали хвалить наши недавние успехи, что привело к увеличению поддержки в собрании."
ukraine_parliament.31.a: "Отлично"
ukraine_parliament.32.t: "Парламент продвигает больше поддержки для местных!"
ukraine_parliament.32.d: "Парламент выделил большой бюджет для передачи местным жителям по всей стране, и наша администрация узнала об этом, некоторые члены кабинета считают, что деньги можно было бы выделить в другом месте для лучшего использования."
ukraine_parliament.32.a: "Деньги для местных!"
ukraine_parliament.32.b: "Да, их определенно можно использовать в другом месте"
ukraine_parliament.33.t: "Парламент ставит под сомнение нашу администрацию"
ukraine_parliament.33.d: "Несколько членов парламента недавно обвинили нашу администрацию в \"Неспособности удовлетворить [ROOT.GetAdjective] народ\". В парламенте было много внутренних раздоров между проправительственными местами и оппозиционными местами, и это дошло до того, что нам нужно вмешаться и дать ответ."
ukraine_parliament.33.a: "Пусть думают, что хотят"
ukraine_parliament.33.b: "Подготовить надлежащий ответ"
ukraine_parliament.34.t: "Парламент принимает предложение об увеличении медицинских расходов"
ukraine_parliament.34.d: "Парламент недавно принял предложение, которое выделит большую часть нашего бюджета на медицинские расходы. Некоторые члены нашего кабинета выступают против этого, поскольку считают, что это будет катастрофично для нашей экономики и правительства."
ukraine_parliament.34.a: "Парламент прав"
ukraine_parliament.34.b: "Нет, мы не позволим этому предложению пройти"
ukraine_parliament.35.t: "Парламент принимает предложение об увеличении пенсий"
ukraine_parliament.35.d: "Парламент недавно принял предложение, которое выделит большую часть нашего бюджета на социальные расходы. Некоторые члены нашего кабинета выступают против этого, поскольку считают, что это будет катастрофично для нашей экономики и правительства."
ukraine_parliament.35.a: "Парламент прав"
ukraine_parliament.35.b: "Нет, мы не позволим этому предложению пройти"
ukraine_parliament.36.t: "Парламент принимает предложение об увеличении полицейских расходов"
ukraine_parliament.36.d: "Парламент недавно принял предложение, которое выделит большую часть нашего бюджета на полицейские расходы. Некоторые члены нашего кабинета выступают против этого, поскольку считают, что это будет катастрофично для нашей экономики и правительства."
ukraine_parliament.36.a: "Парламент прав"
ukraine_parliament.36.b: "Нет, мы не позволим этому предложению пройти"
ukraine_parliament.37.t: "Парламент принимает предложение об увеличении расходов на образование"
ukraine_parliament.37.d: "Парламент недавно принял предложение, которое выделит большую часть нашего бюджета на расходы на образование. Некоторые члены нашего кабинета выступают против этого, поскольку считают, что это будет катастрофично для нашей экономики и правительства."
ukraine_parliament.37.a: "Парламент прав"
ukraine_parliament.37.b: "Нет, мы не позволим этому предложению пройти"
ukraine_parliament.38.t: "Парламент принимает предложение об увеличении военных расходов"
ukraine_parliament.38.d: "Парламент недавно принял предложение, которое выделит большую часть нашего бюджета на военные расходы. Некоторые члены нашего кабинета выступают против этого, поскольку считают, что это будет катастрофично для нашей экономики и правительства."
ukraine_parliament.38.a: "Парламент прав"
ukraine_parliament.38.b: "Нет, мы не позволим этому предложению пройти"

ukr_sabotage.1.t: "Украина атаковала наши склады"
ukr_sabotage.1.d: "В недавней атаке дронов Украина сумела атаковать склад со старым тяжелым оборудованием."
ukr_sabotage.1.a: "Черт"
ukr_sabotage.2.t: "Украина атаковала наши склады"
ukr_sabotage.2.d: "В недавней атаке дронов Украина сумела атаковать склад со старым легким оборудованием."
ukr_sabotage.2.a: "Черт"
ukr_sabotage.3.t: "Украина атаковала наше военное производство"
ukr_sabotage.3.d: "В недавней атаке дронов Украина сумела атаковать одного из наших производителей, мы понесли временный ущерб."
ukr_sabotage.3.a: "Они заплатят за это."


#########YUSHENKO#########
 ##########Focuses#########
 UKR_our_ukraine_start: "Наша Украина"
 UKR_our_ukraine_start_desc: "Пришло время навести порядок в стране и провести либеральные реформы. Для нас люди на первом месте!"
 UKR_our_ukraine_secretariat: "Секретариат Президента Украины"
 UKR_our_ukraine_secretariat_desc: "Секретариат играет ключевую роль в управлении административными и организационными функциями, связанными с президентской деятельностью. Основная цель создания Секретариата Президента Украины - обеспечение соблюдения конституционных полномочий Президента и эффективного выполнения их обязанностей."
 UKR_our_ukraine_secretariat_reduction: "Сокращение Штата Секретариата"
 UKR_our_ukraine_secretariat_reduction_desc: "Нам нужно сократить количество сотрудников секретариата для оптимизации работы государственных органов и снижения бюджетных расходов."
 UKR_our_ukraine_decentralization: "Децентрализация"
 UKR_our_ukraine_decentralization_desc: "Нам нужно увеличить местное самоуправление в нашей стране."
 UKR_our_ukraine_wto: "Попросить Помощь Для Вступления В ВТО"
 UKR_our_ukraine_wto_desc: "Мы готовы стать членами ВТО, и нам нужна поддержка в этом."
 UKR_our_ukraine_yanukovich_go_home: "Уволить Януковича"
 UKR_our_ukraine_yanukovich_go_home_desc: "Янукович, как премьер-министр, показал себя ужасно, поэтому вы уволите его и назначите нового премьер-министра."
 UKR_our_ukraine_timoha: "Офис Тимошенко"
 UKR_our_ukraine_timoha_desc: "Знаменитая Юлия Тимошенко присоединилась к нашему правительству, посмотрим, что она принесет нашему государству."
 UKR_our_ukraine_aviation_reform: "Реформа Авиационной Промышленности"
 UKR_our_ukraine_aviation_reform_desc: "Авиационная промышленность очень важна для нашей страны, и мы будем стремиться возродить ее."
 UKR_our_ukraine_help_western: "Заручиться Поддержкой Львова"
 UKR_our_ukraine_help_western_desc: "Мы восстановим подачу горячей и холодной воды во Львове, тем самым заручившись поддержкой жителей этого города и возможно региона"
 UKR_our_ukraine_cheap_gas_negotiate: "Переговоры О Снижении Цен На Газ"
 UKR_our_ukraine_cheap_gas_negotiate_desc: "Мы попытаемся договориться с Москвой о снижении цен на энергоносители"
 UKR_our_ukraine_service_life: "Сократить Срок Службы"
 UKR_our_ukraine_service_life_desc: "Украинской армии нужна модернизация. Наша первая реформа в этой области будет заключаться в сокращении срока службы в армии с двух лет до одного года! Таким образом, призывники потеряют меньше времени на службу."
 UKR_our_ukraine_nato_eu: "Поддержать Интеграцию Украины В НАТО И ЕС"
 UKR_our_ukraine_nato_eu_desc: "Давайте начнем более прогрессивную интеграцию в НАТО и ЕС. Это необходимо для военной и экономической безопасности нашей великой страны."
 UKR_our_ukraine_fire_corrupt: "Уволить Коррупционеров"
 UKR_our_ukraine_fire_corrupt_desc: "В нашем правительстве есть коррумпированные люди, и мы их уволим! В нашей стране не будет места коррупции!!!"
 UKR_our_ukraine_form_new_government: "Сформировать Новое Правительство"
 UKR_our_ukraine_form_new_government_desc: "Теперь, когда мы уволили всех тех, кто воровал у нашей страны, мы можем сформировать новое, честное и справедливое правительство."
 UKR_our_ukraine_fight_corruption: "Борьба С Коррупцией"
 UKR_our_ukraine_fight_corruption_desc: "Коррупция - главный враг нашей страны, мы будем с ней бороться!"
 UKR_our_ukraine_alternative_energy_sources: "Альтернативные Источники Энергии"
 UKR_our_ukraine_alternative_energy_sources_desc: "Развитие альтернативных источников энергии поможет нам снизить зависимость от их импорта."
 UKR_our_ukraine_crush_oligarchs: "Снижение Влияния Олигархов"
 UKR_our_ukraine_crush_oligarchs_desc: "Олигархия - враг номер два в нашей стране. Они могут влиять на наше правительство, уклоняясь от законов. Чтобы избежать этого, мы снизим их влияние и попытаемся выгнать их из нашей страны."
 UKR_our_ukraine_increase_media_freedom: "Увеличить Свободу СМИ"
 UKR_our_ukraine_increase_media_freedom_desc: "Наши СМИ были ограничены очень долгое время, и теперь, во время нашего правления, они будут свободнее и независимее, чем когда-либо!"
 UKR_our_ukraine_release_political_prisoners: "Освободить Политических Заключенных"
 UKR_our_ukraine_release_political_prisoners_desc: "При предыдущем правительстве многие оппозиционные политики были заключены в тюрьму. Давайте дадим им свободу!"
 UKR_our_ukraine_internet_freedom: "Свобода Интернета"
 UKR_our_ukraine_internet_freedom_desc: "Свобода интернета подразумевает, что граждане имеют право на свободный доступ к информации, свободу выражения мнений и неприкосновенность частной жизни в онлайн-коммуникациях. Давайте обеспечим защиту этих прав и свобод."
 UKR_our_ukraine_provide_housing: "Обеспечить Украинских Граждан Жильем"
 UKR_our_ukraine_provide_housing_desc: "Необходимо обеспечить жильем наших граждан, для этого мы проведем соответствующие реформы"
 UKR_our_ukraine_health_insurance_law: "Закон О Медицинском Страховании"
 UKR_our_ukraine_health_insurance_law_desc: "Мы примем закон о медицинском страховании, который будет поощрять население активно обращаться в медицинские учреждения и повышать уровень здоровья наших граждан"
 UKR_our_ukraine_curriculum_modernization: "Модернизация Учебных Программ"
 UKR_our_ukraine_curriculum_modernization_desc: "Мы реформируем образовательную программу в наших школах для улучшения образования молодого поколения"
 UKR_our_ukraine_diversification_of_gas_supply_sources: "Диверсификация Источников Поставки Газа"
 UKR_our_ukraine_diversification_of_gas_supply_sources_desc: "Мы будем активно диверсифицировать наши ресурсные активы, чтобы не зависеть от одного поставщика"
 UKR_our_ukraine_cost_reduction: "Сокращение Бюджетных Расходов"
 UKR_our_ukraine_cost_reduction_desc: "Мы проведем сокращение бюджета для улучшения состояния нашего бюджета"
 UKR_our_ukraine_deregulation_of_business_environment: "Дерегулирование Деловой Среды"
 UKR_our_ukraine_deregulation_of_business_environment_desc: "Нашей стране нужно снизить бюрократию и снизить административные барьеры для предпринимателей."
 UKR_our_ukraine_attracting_investments: "Привлечение Инвестиций"
 UKR_our_ukraine_attracting_investments_desc: "Наша страна открыта для инвестиций, и мы готовы привлечь потенциальных инвесторов"
 UKR_our_ukraine_beginning_decommunization_policy: "Начало Политики Декоммунизации"
 UKR_our_ukraine_beginning_decommunization_policy_desc: "В 1991 году мы обрели независимость от советского угнетения. Давайте отметим это и начнем политику декоммунизации по всей стране! Коммунистическое влияние должно быть подавлено здесь и сейчас."
 UKR_our_ukraine_economic_liberalism: "Экономический Либерализм"
 UKR_our_ukraine_economic_liberalism_desc: "Экономический либерализм обязателен, если мы хотим, чтобы экономика росла более эффективно, поэтому мы должны его принять."
 UKR_our_ukraine_parliamentary_republic: "Усиление Полномочий Парламента"
 UKR_our_ukraine_parliamentary_republic_desc: "Усиление полномочий парламента помогает увеличить представительность правительства. Парламент - это орган, избранный народом, и поэтому он должен иметь большее влияние на процесс принятия решений. Это способствует большему включению мнений и интересов граждан в политический процесс."
 UKR_our_ukraine_president_republic: "Усиление Полномочий Президента"
 UKR_our_ukraine_president_republic_desc: "Первый важный аргумент в пользу усиления президентских полномочий - это обеспечение более эффективного и быстрого реагирования на кризисные ситуации. В мире, насыщенном глобальными вызовами, такими как экономические кризисы, борьба с терроризмом и пандемии, президент должен иметь достаточные полномочия для быстрых и решительных действий. Ограниченные полномочия могут привести к бюрократическим задержкам и неэффективным решениям."
 UKR_our_ukraine_recognition_holodomor: "Признание Голодомора"
 UKR_our_ukraine_recognition_holodomor_desc: "Советская власть совершила с нами, с украинцами, самое ужасное преступление 20 века. Этот ужасный голод, Голодомор, был вызван коллективизацией сельского хозяйства и политикой государственного насилия, проводимой коммунистическим режимом СССР."
 UKR_our_ukraine_ukrainian_institute: "Украинский Институт Национальной Памяти"
 UKR_our_ukraine_ukrainian_institute_desc: "Украинский институт национальной памяти - это центральный орган исполнительной власти для реализации государственной политики в сфере восстановления и сохранения национальной памяти. Он будет создан для воссоздания справедливой истории украинской нации и формирования и реализации государственной политики в этом направлении. Мы также увековечим память жертв политических репрессий и голода на территории нашей страны."
 UKR_our_ukraine_secretariat_of_president: "Секретариат Президента Украины"
 UKR_our_ukraine_secretariat_of_president_reduction: "Сокращенный Президентский Секретариат Украины"
 UKR_our_ukraine_freedom_of_social_media: "Разрешить Больше Свободы Социальных СМИ"
 UKR_our_ukraine_freedom_of_social_media_desc: "Больше свободы нашим СМИ означает больше свободы нашему народу и народную поддержку! Свобода!"
 UKR_ukrainian_libertarianism: "Украинское Либертарианство"
 UKR_ukrainian_libertarianism_desc: "Пришло время Украине войти в эру либертарианства! Давайте освободим страну от оков капиталистов и коммунистов"
 UKR_full_deregulation: "Полная Дерегуляция"
 UKR_full_deregulation_desc: "Мы начнем процесс полной дерегуляции, и государственное влияние уменьшится"
 UKR_decrease_role_of_government: "Уменьшить Власть Правительства"
 UKR_decrease_role_of_government_desc: "Государство будет играть минимальную роль в нашей прекрасной стране"
 UKR_free_the_common_folk: "По-Настоящему Свободные Люди"
 UKR_free_the_common_folk_desc: "Наш народ наконец-то сможет глубоко вздохнуть и почувствовать себя свободным!"
 UKR_offshore_country: "Страна Офшорных Компаний"
 UKR_offshore_country_desc: "Мы приветствуем создание множества офшорных зон в нашей стране"
 UKR_true_servant_of_people: "Истинный Слуга Народа"
 UKR_true_servant_of_people_desc: "Наконец, Украина стала самой свободной страной в мире!"
 ##########Ideas##########
 UKR_our_ukraine_freedom_of_social_media_idea: "Свобода Социальных СМИ"
 UKR_our_ukraine_freedom_of_social_media_idea_desc: "СМИ должны быть свободными и будут таковыми. Мы будем поддерживать запрет цензуры"
 UKR_our_ukraine_ukrainian_institute_of_national_memory: "Украинский Институт Национальной Памяти"
 UKR_our_ukraine_ukrainian_institute_of_national_memory_desc: "Каждый украинец должен помнить жертвы своего народа, которые он принес в прошлом. Институт национальной памяти поможет нам сформировать поколения тех, кто будет помнить героизм украинцев"
 UKR_our_ukraine_fight_with_corruption_idea: "Борьба С Коррупцией"
 UKR_our_ukraine_education_reform_idea: "Последствия Реформы Образования"
 UKR_our_ukraine_health_reform_idea: "Последствия Реформы Здравоохранения"
 UKR_our_ukraine_social_reform_idea: "Последствия Жилищной Реформы"
 UKR_our_ukraine_air_industry_idea: "Реформа Авиационной Промышленности"
 UKR_zelya_svetov: "Украинский Либертарианство"
 UKR_zelya_svetov_desc: "Украинский либертарианство стал шоком для мирового сообщества, и для нас это шанс войти в историю как революционеры в области государственного управления"
 UKR_zelya_helsi: "Хельси"
 UKR_zelya_dia: "Диа"
