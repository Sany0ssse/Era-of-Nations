##########SECURITY##########
##########Focuses##########
UKR_security_start: "Безопасность Украины"
UKR_security_start_desc: "Наша страна огромна и поэтому нуждается в сильной внутренней защите, мы начнем финансирование и реформирование наших государственных структур"
UKR_sbu_start: "Реформа СБУ"
UKR_sbu_start_desc: "Наша служба безопасности Украины нуждается в глубокой реформе и повышении эффективности"
UKR_sbu_t: "Главное управление \"Т\""
UKR_sbu_t_desc: "Совет безопасности Украины реализует государственную политику в области противодействия организациям и лицам, целью которых является подрыв национальной государственности, ликвидация независимости Украины, изменение конституционного строя силой, нарушение суверенитета и территориальной целостности государства, подрыв его безопасности, незаконный захват государственной власти, пропаганда войны, насилия, разжигание межнациональной, расовой, религиозной и иной вражды, посягательства на права и свободы человека, а также предупреждение, выявление и пресечение преступлений и иных противоправных деяний, которые непосредственно создают угрозу жизненно важным интересам государства и безопасности граждан Украины и входят в компетенцию Службы безопасности Украины, реализует предупреждение преступлений в этой области."
UKR_sbu_corrupt: "Главное управление \"К\""
UKR_sbu_corrupt_desc: "Служба безопасности Украины, согласно Закону Украины \"Об организационно-правовых основах борьбы с коррупцией и организованной преступностью от 30.06.1993 № 3341-XII\", уполномочена на борьбу с коррупцией и организованной преступностью. Одним из государственных органов, уполномоченных работать в этой области, является Главное управление по борьбе с коррупцией и организованной преступностью Совета безопасности Украины (ГУ \"К\")."
UKR_sbu_contr: "Главное управление военной контрразведки"
UKR_sbu_contr_desc: "Органы военной контрразведки создаются для контрразведывательного обеспечения Вооруженных сил Украины, Государственной пограничной службы Украины и других военных формирований, дислоцированных на территории Украины. Система органов военной контрразведки Совета безопасности Украины состоит из Главного управления военной контрразведки, органов (подразделений) в регионах в составе Управления контрразведки, оперативных подразделений военной контрразведки в оперативных, региональных и территориальных командованиях (управлениях), армейских корпусов, отдельных воинских частей и соединений."
UKR_sbu_svr: "Служба внешней разведки"
UKR_sbu_svr_desc: "Служба внешней разведки Украины или СЗРУ - это разведывательное агентство украинского правительства. Она осуществляет свою разведывательную деятельность в политической, экономической, военной, научно-технической информации и экологической сферах и подчиняется непосредственно Президенту Украины."
UKR_sbu_sviaz: "Государственная служба специальной связи"
UKR_sbu_sviaz_desc: "Государственная служба специальной связи Украины, также известная как Держспецзв'язку, является специализированным исполнительным органом, ключевые функции которого включают обеспечение безопасной правительственной связи, правительственной курьерской службы, защиты информации и киберзащиты."
UKR_sbu_alpha: "Альфа"
UKR_sbu_alpha_desc: "Группа \"А\" Центра специальных операций Службы безопасности Украины - это специальное подразделение Службы безопасности Украины. Официально она носит название \"Воинская часть Е6117\""
UKR_sbu_administration: "Гражданско-военная администрация"
UKR_sbu_administration_desc: "Гражданско-военная администрация - это временный государственный орган в Украине, созданный на территориях, прилегающих к зоне боевых действий"
UKR_hur_reform: "Реформа ГУР"
UKR_hur_reform_desc: "Пора начать реформы нашего Главного управления разведки для повышения эффективности и возможностей влияния в других странах"
UKR_peacemakers: "Программа миротворчества"
UKR_peacemakers_desc: "Наша страна всегда стремилась участвовать в миротворческих миссиях по всей планете, и мы продолжим эту традицию"
UKR_border_guard: "Государственная пограничная служба"
UKR_border_guard_desc: "Государственная пограничная служба Украины - это пограничная охрана Украины. Это независимый правоохранительный орган, организованный Конституцией Украины как военное формирование, глава которого подчиняется Президенту Украины"
UKR_reform_vv: "Реформа внутренних войск"
UKR_reform_vv_desc: "Наши внутренние войска имели неопределенный статус в иерархии государственных структур с момента их появления, пора это исправить"
UKR_finance_vv: "Финансирование специальных батальонов"
UKR_finance_vv_desc: "Мы будем финансировать деятельность специальных батальонов внутренних войск, возможно, в будущем они нам очень пригодятся"
UKR_sbu_white_wolves: "Батальон \"Белые волки\""
UKR_sbu_white_wolves_desc: "СБУ отправит батальон, созданный из своих сотрудников, на войну"
UKR_hur_opearational_support: "Оперативная поддержка ГУР"
UKR_hur_opearational_support_desc: "ГУР в настоящее время поддерживает текущие операции разведданными и используя свои подразделения на передовой."
##########Ideas##########
UKR_SBU_1: "СБУ"
UKR_SBU_1_desc: "Наследник украинского филиала КГБ - СБУ выполняет те же функции ответственно и эффективно. Украина может спать спокойно"
UKR_Alpha: "Альфа"
UKR_hur: "Главное управление разведки"
UKR_hur_desc: "ГУР имеет широкий спектр полномочий и возможностей, которые мы сможем реализовать в нашей внешней политике"
UKR_hur_battalions: "Батальоны ГУР Украины"
UKR_hur_battalions_desc: "Батальоны ГУР Украины участвуют в боевых действиях по приказу украинского командования на нашей стороне, после окончания боевых действий они покинут наши вооруженные силы"
UKR_border: "Государственная пограничная служба"
UKR_border_desc: "Наши границы слишком велики, чтобы полагаться на отдельные подразделения вооруженных сил для их защиты. Пограничные войска выполнят эту задачу более эффективно"
UKR_svr: "Служба внешней разведки"
UKR_sviaz: "Государственная служба специальной связи"
