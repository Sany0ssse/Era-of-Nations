 ##########Events##########
 ukraine_our_ukraine.1.t: "Секретариат Президента Украины"
 ukraine_our_ukraine.1.d: "Администрация Президента вела себя ужасно в годы Ющенко, поэтому мы реформируем ее в Секретариат Президента Украины для обеспечения большей политической стабильности."
 ukraine_our_ukraine.1.a: "Время Перемен."
 ukraine_our_ukraine.2.t: "Украинский Институт Национальной Памяти"
 ukraine_our_ukraine.2.d: "Институт национальной памяти начал свою работу, теперь мы готовы вернуть Украину к ее истинной истории!."
 ukraine_our_ukraine.2.a: "Ура!."
 ukraine_our_ukraine.3.t: "Демократическая Конституция"
 ukraine_our_ukraine.3.d: "Мы внесем поправки в конституцию, которые сделают нашу страну более демократичной!."
 ukraine_our_ukraine.3.a: "Ура!."
 ukraine_our_ukraine.4.t: "Украина Предлагает Нашей Стране Инвестировать В Нее."
 ukraine_our_ukraine.4.d: "Украинское правительство объявило о запуске программы привлечения иностранных инвесторов и направило нашему правительству предложение инвестировать в их экономику."
 ukraine_our_ukraine.4.a: "Давайте Инвестируем!"
 ukraine_our_ukraine.4.b: "Нас Это Не Интересует."
 ukraine_our_ukraine.5.t: "Инвестиции В Украину."
 ukraine_our_ukraine.5.d: "Они согласились инвестировать в нашу страну."
 ukraine_our_ukraine.5.a: "Хорошо"
 ukraine_our_ukraine.6.t: "Инвестиции В Украину."
 ukraine_our_ukraine.6.d: "Они отказались от нашего предложения инвестировать в нашу страну."
 ukraine_our_ukraine.6.a: "Печально"
 ukraine_our_ukraine.7.t: "Газовый Контракт С Украиной."
 ukraine_our_ukraine.7.d: "Украина предложила нам снизить закупочные цены по нашему газовому контракту, взамен посредник между нами будет устранен, тем самым у нас будет больше влияния на них, должны ли мы согласиться?"
 ukraine_our_ukraine.7.a: "Мы Подпишем Это"
 ukraine_our_ukraine.7.b: "Нас Это Не Интересует."
 ukraine_our_ukraine.8.t: "Газовый Контракт С Россией."
 ukraine_our_ukraine.8.d: "Они согласились изменить условия нашего газового контракта, теперь мы будем платить меньше!."
 ukraine_our_ukraine.8.a: "Хорошо"
 ukraine_our_ukraine.9.t: "Газовый Контракт С Россией."
 ukraine_our_ukraine.9.d: "Они согласились изменить условия нашего газового контракта, теперь мы будем платить меньше!."
 ukraine_our_ukraine.9.a: "Хорошо"
 ##########ZELEBOBA##########
 ##########Focuses##########
 UKR_zelensky_western: "Путь На Запад"
 UKR_zelensky_western_desc: "Мы продолжим наш политический курс с желанием на запад"
 UKR_reform_SBU: "Реформа СБУ"
 UKR_reform_SBU_desc: "СБУ нуждается в реформах, все эти годы структура была очень погрязшей в коррупции и нуждается в обновлении"
 UKR_befriend_the_west: "Дружба С Западом"
 UKR_befriend_the_west_desc: "Мы продолжим нашу политику улучшения отношений с западными странами, и именно в них мы видим наших партнеров и союзников"
 UKR_avakov_befriend: "Дружба С Аваковым"
 UKR_avakov_befriend_desc: "Арсен Аваков оказался самым стойким министром из всех, что мы видели, он смог пережить многие правительства, кроме того, он финансово поддерживает батальон Азов, если мы укрепим связи с ним, мы сможем увеличить Азов в численности"
 UKR_land_reform_zelya: "Земельная Реформа"
 UKR_land_reform_zelya_desc: "Мы продолжим земельную реформу, которая была начата давно"
 UKR_fasten_nato_join: "Стремление Вступить В НАТО"
 UKR_fasten_nato_join_desc: "НАТО - это наша финишная черта, то, к чему мы стремились с самого начала"
 UKR_peaceful_negotiation_don: "Мирно Решить Вопрос Донбасса"
 UKR_peaceful_negotiation_don_desc: "Мы готовы пойти на уступки ради Донбасса и наконец положить конец этому бесконечному конфликту."
 UKR_keep_status_quo: "Сохранить Статус-Кво"
 UKR_keep_status_quo_desc: "Мы не готовы решить этот вопрос мирно, мы пойдем тем же путем, что и раньше"
 UKR_our_ukraine_democratic_constitution: "Новая Демократическая Конституция"
 UKR_our_ukraine_democratic_constitution_desc: "Мы готовы реформировать нашу конституцию, чтобы приблизить истинную демократию в нашей стране"
 UKR_our_ukraine_helsi: "Хельси"
 UKR_our_ukraine_helsi_desc: "Хельси - медицинская информационная система для учреждений здравоохранения и медицинский портал для пациентов в Украине"
 UKR_our_ukraine_dia: "Диа"
 UKR_our_ukraine_dia_desc: "Украинский электронный сервис государственных услуг, разработанный Министерством цифровой трансформации Украины. Это веб-сайт и мобильное приложение с цифровыми документами, возможностью цифровой подписи и верификации, а также портал с государственными услугами"
 ##########Tooltips##########
 UKR_next_azov_created_tt: "Новая §YБригада Азов§! будет создана"
 UKR_our_influence_helps_tt: "§CПоскольку мы влияем на Парламент, мы можем принять этот закон с более высокой вероятностью успеха, несмотря на меньшее количество мест в нашу пользу§!"
 UKR_lose_some_seats_TT: "Мы §RПотеряем§! несколько мест в §HПарламенте§!"
 UKR_gain_some_seats_TT: "Мы §GПолучим§! несколько мест в §HПарламенте§!"
 UKR_is_pro_west_TT: "Является Прозападной Партией"
 UKR_is_pro_east_TT: "Является Пророссийской Партией"
 UKR_is_neutral_TT: "Является Партией, Не Связанной Ни С Одной Иностранной Нацией"
 UKR_influence_parliament_TT: "Начнет §pВлиять§! на §HПарламент§!"
 UKR_puppet_parliament_TT: "Будет §OМарионеткой§! §HПарламента§!\n\n§RНАМ НЕ НУЖНО БУДЕТ ПРОХОДИТЬ ЧЕРЕЗ ПАРЛАМЕНТ ДЛЯ ИЗМЕНЕНИЯ ЗАКОНОВ§!"
 UKR_dissolve_parliament_TT: "Будет §RРаспускать§! §HПарламент§!\n\n§RНАМ НЕ НУЖНО БУДЕТ ПРОХОДИТЬ ЧЕРЕЗ ПАРЛАМЕНТ ДЛЯ ИЗМЕНЕНИЯ ЗАКОНОВ§!"
 UKR_zelenskiy_socialist_TT: "§YЗеленский§! изменит свой §BВзгляд§!!"
 UKR_zelenskiy_formed_TT: "£ukr_servant_of_the_people §YПартия Слуга Народа§! будет Создана!"
 UKR_zelenskiy_here_TT: "£ukr_servant_of_the_people §YПартия Слуга Народа§! Должна Быть Создана!"
 UKR_zelenskiy_pizdec_TT: "§RЗавершение этого фокуса вызовет повторение событий сериала: Слуга Народа. Украина будет фрагментирована!!!!§!"
 ##########Events##########
 ukr_zelenskiy.1.t: "Удивительное Объявление"
 ukr_zelenskiy.1.d: "Сегодня Владимир Зеленский сделал удивительное объявление. В этом заявлении он сказал, что отказывается от идей либертарианства и \"по просьбе большинства\" принял идеи социализма. Также президент объявил, что Украина укрепит связи с Западом и попытается привлечь западных инвесторов."
 ukr_zelenskiy.1.a: "Удивительное Развитие"
 ukr_zelenskiy.2.t: "Слуга Народа"
 ukr_zelenskiy.2.d: "Неожиданные новости потрясли всю Украину. Сегодня в результате съезда была создана партия Слуга Народа, названная в честь популярного фильма. Многие считают, что эта партия была создана как PR-кампания для фильма, в то время как другие утверждают, что эта партия была создана для продвижения знаменитого комика Владимира Зеленского как кандидата на пост президента. Хотя сам Зеленский отрицает свое участие, его уклончивые ответы могут стать основой для дальнейших спекуляций."
 ukr_zelenskiy.2.a: "Интересно"
