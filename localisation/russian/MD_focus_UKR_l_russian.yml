##########Focuses##########
UKR_war_on_donbass_experience: "Наша Армия"
UKR_war_on_donbass_experience_desc: "Украинская армия буквально тень бывшей советской и нынешней российской - пора это изменить"
UKR_ukrainian_armed_forces_reform: "Реформа Вооруженных Сил"
UKR_ukrainian_armed_forces_reform_desc: "Наши вооруженные силы срочно нуждаются в реформе, необходимо создать новые структуры, новые виды войск и решить старые проблемы нашей армии"
UKR_contract_army: "Реформа Военного Образования"
UKR_contract_army_desc: "Мы реорганизуем старые военные университеты, а также создадим новые для улучшения качества наших вооруженных сил"
UKR_ter_oborona: "Создать Территориальную Оборону"
UKR_ter_oborona_desc: "Нам нужно больше разных подразделений для защиты нашей родины. Мы начнем создание украинской территориальной обороны, чтобы каждый регион был защищен"
UKR_create_sso: "Создать Силы Специальных Операций Украины"
UKR_create_sso_desc: "Новая военная структура поможет более эффективно бороться с нашими врагами"
UKR_cut_down_the_general_staff: "Сократить Количество Генералов"
UKR_cut_down_the_general_staff_desc: "Слишком много генералов негативно влияет на нашу армию, пора это исправить"
UKR_dshv_create: "Воздушно-Десантные Войска"
UKR_dshv_create_desc: "Мы выделим воздушно-десантные войска из сухопутных войск в отдельное подразделение со своим командованием и структурой, тем самым повысив их эффективность"
UKR_command_create: "Командование Объединенных Сил"
UKR_command_create_desc: "Командование Объединенных Сил Вооруженных Сил Украины - это орган военного управления Вооруженных Сил Украины, между группами войск для проведения различных военных операций. Он также отвечает за проведение миротворческих миссий за пределами Украины"
UKR_delta: "Дельта"
UKR_delta_desc: "Украинская система информационной поддержки решений и осведомленности о ситуации на поле боя имеет доступ к программе для действующих военнослужащих, прошедших верификацию. Вход осуществляется через интернет через авторизацию и двухфакторную аутентификацию на специальном веб-сайте. Авторизованные пользователи могут просматривать и вводить данные о известных позициях противника, обнаруженных вражеских самолетах, наземной технике и многом другом."
UKR_national_guard: "Возродить Национальную Гвардию"
UKR_national_guard_desc: "Национальная гвардия была распущена при президенте Кучме, но теперь ситуация требует от нас ее возрождения. Мы реорганизуем ее из внутренних войск Министерства внутренних дел"
UKR_Kolomoisky_help: "Помощь От Коломойского"
UKR_Kolomoisky_help_desc: "Известный олигарх Коломойский обратился к нам с предложением финансировать создание нескольких батальонов для поддержания боеспособности наших вооруженных сил"
UKR_Firtash_help: "Помощь От Фирташа"
UKR_Firtash_help_desc: "Известный олигарх Фирташ обратился к нам с предложением финансировать создание нескольких батальонов для поддержания боеспособности наших вооруженных сил"
UKR_Kolomoisky_finish: "Полицейский Полк Днепр-1"
UKR_Kolomoisky_finish_desc: "Последнее, что Коломойский добровольно согласился финансировать, - это переформирование Днепропетровского оборонительного полка в полицейский полк"
UKR_UDA: "Украинская Добровольческая Армия"
UKR_UDA_desc: "Необходимо организовать добровольцев в единую военную группу"
UKR_azov: "Создать Батальон Азов"
UKR_azov_desc: "Давайте рискнем и позволим им присоединиться к рядам наших вооруженных сил"
UKR_Aidar: "Создать Батальон Айдар"
UKR_Aidar_desc: "Давайте рискнем и позволим им присоединиться к рядам наших вооруженных сил"
UKR_donbass: "Создать Батальон Донбасс-Украина"
UKR_donbass_desc: "Еще одна команда, созданная из добровольцев, поступает к нам на службу"
UKR_reform_mvd: "Реформа Министерства Внутренних Дел"
UKR_reform_mvd_desc: "Мы проведем глобальную реформу в Министерстве внутренних дел"
UKR_found_the_national_police: "Патрульная Служба Полиции Специального Назначения"
UKR_found_the_national_police_desc: "Патрульная служба полиции специального назначения Украины - это служба в составе Патрульной полиции Украины в составе Национальной полиции Украины, которая была создана как часть Министерства внутренних дел Украины как структура специальных сил для охраны общественного порядка. Структура стала частью Национальной полиции Украины. Служба объединяет бывшие батальоны и полки Министерства внутренних дел"
UKR_found_the_kord: "Специальное Подразделение КОРД"
UKR_found_the_kord_desc: "Корпус оперативных и внезапных действий, или подразделение КОРД, - это подразделение специального назначения в Национальной полиции Украины. Оно предназначено для решения чрезвычайных ситуаций, уровень которых настолько высок и сложен, что может превышать возможности сил быстрого реагирования или оперативно-розыскных подразделений."
UKR_found_the_uop: "Реформирование Военно-Промышленного Комплекса"
UKR_found_the_uop_desc: "Наша оборонная промышленность находится в плачевном состоянии, поэтому мы вынуждены начать глобальную реформу в этой области."
UKR_defend_our_sky: "Возродить Авиационную Промышленность"
UKR_defend_our_sky_desc: "Мы начнем возрождение нашей авиационной промышленности, которая находится в ужасном состоянии с момента распада СССР."
UKR_revive_the_black_sea_fleet: "Возродить Черноморский Флот"
UKR_revive_the_black_sea_fleet_desc: "Наш Черноморский флот буквально не существовал, но теперь мы должны заняться его возрождением, чтобы укрепить нашу власть в Черном море."
UKR_srdsc: "Государственный Научно-Исследовательский И Проектный Центр Судостроения"
UKR_srdsc_desc: "Государственный научно-исследовательский и проектный центр судостроения - это конструкторское бюро, специализирующееся на судостроении и расположенное в Николаеве, Украина. Он является частью государственной корпорации Украинские оборонные отрасли."
UKR_oplit: "T-84 Оплот"
UKR_oplit_desc: "Т-84 - это украинский основной боевой танк, основанный на советском Т-80 ОБТ, введенном в 1976 году, а именно дизельной версии: Т-80УД. Т-84 был впервые построен в 1994 году и поступил на вооружение Вооруженных Сил Украины в 1999 году. Его высокопроизводительный оппозитный двигатель делает его быстрым танком, сопоставимым с другими современными ОБТ с соотношением мощности к весу около 26 лошадиных сил на тонну"
UKR_sapsan: "Гром-2"
UKR_sapsan_desc: "Украинская тактическая ракетная система малой дальности, разрабатываемая КБ Южное и ПА Южмаш, предназначенная для объединения функций тактической ракетной системы и реактивной системы залпового огня. Оригинальная версия ракеты Сапсан для собственного использования Украины должна была иметь дальность 500 километров. Более поздняя версия Гром-2, разработанная для экспорта, имеет дальность, ограниченную 280 километрами, чтобы попасть в 300-километровый лимит, установленный Режимом контроля за ракетными технологиями, который стремится ограничить распространение ракет и ракетных технологий"


