 #Общие события MDC
 mdc4.1.t: "Соглашение о свободной торговле и взаимных инвестициях между [From.GetName] и [Root.GetName]"
 mdc4.1.d: "[From.GetNameDef] предлагает нам соглашение о свободной торговле и договор о взаимных инвестициях. Мы получим приоритетный доступ к экспорту и импорту, а обе страны извлекут выгоду из снижения инвестиционных затрат."
 mdc4.1.a: "Подписать оба соглашения!"
 mdc4.1.b: "Отказаться"

 mdc4.2.t: "[From.GetNameDef] подписал с нами торговое и инвестиционное соглашение"
 mdc4.2.d: "[From.GetNameDef] принял наше предложение о подписании соглашения о свободной торговле и договора о взаимных инвестициях. Оба соглашения вступают в силу немедленно."
 mdc4.2.a: "Это принесёт процветание нам обоим!"

 mdc4.3.t: "[From.GetNameDef] отказался подписывать с нами торговое и инвестиционное соглашение"
 mdc4.3.d: "[From.GetNameDef] отклонил наше предложение о подписании соглашения о свободной торговле и договора о взаимных инвестициях."
 mdc4.3.a: "Чёрт"

 mdc4.4.t: "Военное научно-техническое сотрудничество [From.GetName]-[Root.GetName]"
 mdc4.4.d: "[From.GetNameDef] предложил соглашение о совместных военных исследованиях и разработках. Это позволит нашим вооружённым силам обмениваться технологическим опытом и ускорить разработку оружия, техники и доктрин."
 mdc4.4.a: "Согласиться на сотрудничество"
 mdc4.4.b: "Отказаться"

 mdc4.5.t: "[From.GetNameDef] принял предложение о военном научно-техническом сотрудничестве"
 mdc4.5.d: "[From.GetNameDef] принял наше предложение о военном научно-техническом сотрудничестве. Партнёрство начнётся немедленно, и мы должны увидеть преимущества в подготовке, технике и доктринах."
 mdc4.5.a: "Отлично – к прогрессу!"

 mdc4.6.t: "[From.GetNameDef] отказался от военного научно-технического сотрудничества"
 mdc4.6.d: "[From.GetNameDef] отклонил наше предложение о военном научно-техническом сотрудничестве. Этот отказ может осложнить дипломатические отношения."
 mdc4.6.a: "Упущенная возможность"

 #Инвестиции в зелёную энергетику
 mdc4.7.t: "Инвестиции в зелёную энергетику"
 mdc4.7.d: "[FROM.GetName] обратился к нам с предложением совместно инвестировать в проекты возобновляемой энергетики. Инициатива включает финансовое участие, технологическое сотрудничество и укрепление двусторонних отношений. Принятие предложения углубит экономические связи, а отказ может осложнить дипломатические отношения."
 mdc4.7.a: "Одобрить инвестиционное предложение"
 mdc4.7.b: "Отклонить предложение"

 mdc4.8.t: "Соглашение о зелёной энергетике"
 mdc4.8.d: "[FROM.GetName] заключил с нами соглашение об инвестициях в возобновляемую энергетику. Это сотрудничество принесёт приток капитала, технологический опыт и внесёт вклад в долгосрочную устойчивость нашего энергетического сектора."
 mdc4.8.a: "Шаг к зелёному будущему"

 mdc4.9.t: "Зелёная энергетика отклонена"
 mdc4.9.d: "[FROM.GetName] отклонил наше предложение о сотрудничестве в области возобновляемой энергетики. Экономические возможности упущены, а двусторонние отношения могут пострадать."
 mdc4.9.a: "Прискорбное решение"

 #Запрос на участие в USAID
 mdc4.10.t: "[FROM.GetName] хочет присоединиться к USAID"
 mdc4.10.d: "Правительство [FROM.GetAdjective] официально запросило помощь в целях экономического развития и техническое содействие через наши программы USAID. Эта инициатива может укрепить наше стратегическое влияние в регионе и создать атмосферу доброй воли."
 mdc4.10.a: "Одобрить пакет помощи"
 mdc4.10.b: "Отказать в запросе"

 mdc4.11.t: "Заявка на USAID принята"
 mdc4.11.d: "Мы получили официальное подтверждение из Вашингтона. Наша заявка на участие в программе Агентства США по международному развитию (USAID) одобрена.\n\nЭто партнёрство предоставит нам доступ к жизненно важным ресурсам для проектов развития, техническому опыту и учебным программам. Оно знаменует собой важный шаг в укреплении наших двусторонних отношений и открывает новую главу сотрудничества, направленного на экономический рост и стабильность."
 mdc4.11.a: "Ура!"

 mdc4.12.t: "Заявка на USAID отклонена"
 mdc4.12.d: "Получено официальное уведомление от Государственного департамента США. Наша заявка на участие в программе USAID в настоящее время не одобрена. Это решение лишает нас доступа к потенциальным грантам на развитие и техническому сотрудничеству."
 mdc4.12.a: "Чёрт"

 #Запрос статуса основного союзника вне НАТО
 mdc4.13.t: "[FROM.GetName] запрашивает статус основного союзника вне НАТО"
 mdc4.13.d: "Правительство [FROM.GetAdjective] официально подало заявку на получение статуса основного союзника вне НАТО (MNNA). Предоставление этого статуса будет означать особое стратегическое партнёрство, откроет новые возможности для военного сотрудничества и потенциально облегчит доступ к определённым оборонным технологиям."
 mdc4.13.a: "Одобрить запрос"
 mdc4.13.b: "Отклонить заявку"

 mdc4.14.t: "[FROM.GetName] принимает!"
 mdc4.14.d: "Правительство [FROM.GetAdjective] официально ратифицировало нашу заявку. Теперь мы признаны основным союзником вне НАТО. Это официально закрепляет наше особое партнёрство и открывает новую главу для расширенного военного сотрудничества и сотрудничества в области безопасности."
 mdc4.14.a: "Значительное дипломатическое достижение"

 mdc4.15.t: "[FROM.GetName] отклонил нашу заявку"
 mdc4.15.d: "Правительство [FROM.GetAdjective] отклонило наш запрос на получение статуса основного союзника вне НАТО. Хотя это закрывает определённый формальный канал на данный момент, наши двусторонние отношения продолжаются на существующей основе."
 mdc4.15.a: "Мы будем искать другие пути для сотрудничества"

 #Общий отказ
 mdc4.16.t: "[FROM.GetName] отклонил предложение"
 mdc4.16.d: "Правительство [FROM.GetAdjective] прислало вежливый, но твёрдый отказ. Они ссылаются на текущее состояние наших двусторонних отношений как «не благоприятствующее такому соглашению в настоящее время» и далее указывают, что неотложные внутренние дела требуют их полного внимания."
 mdc4.16.a: "Прискорбное решение"

 mdc4.17.t: "Сотрудничество в области генетических исследований [From.GetName]-[Root.GetName]"
 mdc4.17.d: "Правительство [From.GetNameDef] выдвинуло новаторское предложение о двустороннем партнёрстве в области передовых генетических и биомедицинских исследований. Это соглашение позволит нашим странам объединить научные таланты и ресурсы для изучения границ геномики человека с потенциальным применением в медицине, сельском хозяйстве и национальной устойчивости."
 mdc4.17.a: "Согласиться на это научное предприятие"
 mdc4.17.b: "Вежливо отказаться по этическим соображениям"

 mdc4.18.t: "[From.GetName] принял партнёрство в области генетических исследований"
 mdc4.18.d: "[From.GetNameDef] официально ратифицировал соглашение о совместных генетических исследованиях. Будут созданы общие лаборатории и каналы обмена данными, что предоставит нашим учёным доступ к более широкому пулу знаний и ускорит наши биотехнологические возможности."
 mdc4.18.a: "Новая глава в науке начинается"

 mdc4.19.t: "[From.GetName] отказался от сотрудничества в области генетических исследований"
 mdc4.19.d: "Ссылаясь на этические оговорки и стратегический суверенитет, [From.GetNameDef] отказался от предложенного партнёрства в области генетических исследований. Отказ подчёркивает деликатный характер этой области и может охладить дипломатический энтузиазм в отношении будущего научного сотрудничества."
 mdc4.19.a: "Их потеря"