l_russian:
 eon_consultation_ui_category:0 "Двусторонние консультации"
 eon_consultation_ui_category_desc:0 "После согласия канал обсуждения действует 30 дней. Выберите строку своего партнёра. Серые кнопки объясняют условия. У каждого договора, предложения электроэнергии, гранта и погашения долга остаются собственные требования и отдельное согласие. Завершение канала не отменяет эти процессы."
 eon_open_consultation_panel:0 "Открыть панель текущих консультаций"
 eon_open_consultation_panel_desc:0 "Показать согласованную тему и доступные действия с этим партнёром."
 eon_open_consultation_panel_send_desc:0 "Показать сведения о консультации с [THIS.GetNameWithFlag]. Для действий откройте Решения → Двусторонние консультации. Открытие сведений бесплатно, не продлевает канал и не создаёт соглашение."
 eon_consultation_ui_panel_ready_tt:0 "Обе страны сохраняют одну и ту же принятую консультацию. Просмотр бесплатен; для истёкшего канала или войны доступны только сведения и завершение."
 eon_consultation_ui_ack:0 "Закрыть сведения"
 eon_consultation_ui_status:0 "Открыть панель консультаций: [From.GetName]"
 eon_consultation_ui_status_desc:0 "Партнёр: [From.GetName]. Тема: [eon_consultation_ui_topic_label]. Торговое соглашение: [eon_consultation_ui_trade_standing_label]. Записанное условие выхода: [eon_framework_negotiation_trade_clause_label]. Показать текущую тему и инструкции для этого партнёра. Конкретные предложения отправляются другими строками этой категории. Просмотр не продлевает разговор и не обязывает казну."
 eon_consultation_ui_status_ready_tt:0 "Обе страны ещё сохраняют этот согласованный канал. Кнопка только показывает сведения."
 eon_consultation_ui_end:0 "Завершить консультации: [From.GetName]"
 eon_consultation_ui_end_desc:0 "Бесплатно закрыть совпадающий канал обсуждения. Действующие соглашения и отдельно отправленные предложения продолжаются по собственным правилам. Совпадающий канал можно закрыть и после истечения срока или начала войны."
 eon_consultation_ui_end_ready_tt:0 "Обе страны ещё сохраняют один и тот же согласованный канал. Его завершение бесплатно и не отменяет отдельный договор, поставку, грант или долговое предложение."
 eon_consultation_ui_trade_review:0 "Рассмотреть торговое предложение: [From.GetName]"
 eon_consultation_ui_trade_review_desc:0 "Прочитать и оценить текущее рамочное предложение партнёра или запрос о взаимном прекращении до ответа. Рассмотрение не требует политической власти или денег."
 eon_consultation_ui_trade_review_ready_tt:0 "Нужны действующая торговая консультация и совпадающее входящее рамочное предложение. Этот раунд ещё не рассмотрен."
 eon_consultation_ui_trade_decline:0 "Отклонить торговое предложение: [From.GetName]"
 eon_consultation_ui_trade_decline_desc:0 "Отклонить отдельно рассмотренное рамочное предложение или запрос о взаимном прекращении. Применяются обычные последствия отказа от рамочного соглашения; консультация остаётся открытой."
 eon_consultation_ui_trade_decline_ready_tt:0 "В действующем торговом канале есть совпадающее входящее предложение; именно этот раунд уже рассмотрен."
 eon_consultation_ui_trade_withdraw:0 "Отозвать наше торговое предложение: [From.GetName]"
 eon_consultation_ui_trade_withdraw_desc:0 "Отозвать наше предложение без ответа через обычный процесс. Затраченная политическая власть не возвращается. Консультация и независимые договоры остаются отдельными."
 eon_consultation_ui_trade_withdraw_ready_tt:0 "В действующем торговом канале есть наше совпадающее предложение без ответа. Предложение партнёра нельзя отозвать за него."
 eon_consultation_ui_energy_editor:0 "Открыть редактор электроэнергии: [From.GetName]"
 eon_consultation_ui_energy_editor_desc:0 "Открыть существующий редактор объёма и цены с выбранным партнёром. Нужно действующее соглашение об электроэнергии. Открытие ничего не отправляет; отправка и ответ партнёра идут через обычный энергетический процесс. Положительные ГВт: купить у этой страны. Отрицательные ГВт: продать ей. Цена задаётся в млрд долларов за ГВт в неделю. Подтверждение нулевого объёма прекращает действующую двустороннюю поставку через обычное управление энергией; это не новое предложение покупки."
 eon_consultation_ui_energy_editor_ready_tt:0 "Нужны действующий энергетический канал, взаимное соглашение об электроэнергии и согласованные записи контрактов. У обеих сторон не должно быть ожидающего предложения или черновика встречного предложения. Сначала закройте или разрешите его. Сначала закройте обычный редактор неотправленного предложения или список выбора страны; открытие из консультации не должно перезаписать другой черновик."
 eon_consultation_ui_aid_draft:0 "Подготовить грант: [From.GetName]"
 eon_consultation_ui_aid_draft_desc:0 "Открыть существующий выбор гранта 5/15/35 млрд долларов для этого партнёра. Подготовка не отправляет деньги. Отправка обеспеченной суммы использует обычный резерв средств и согласие получателя."
 eon_consultation_ui_aid_draft_ready_tt:0 "Нужны действующая консультация о поддержке и обычные условия помощи: влияние и экономическое право, национальные ограничения, отсутствие занятого черновика у обеих сторон и задержки донора для этого получателя, не менее 5 млрд долларов в казне. Консультация не даёт исключений."
 eon_consultation_ui_debt_guidance:0 "Как предложить погашение долга: [From.GetName]"
 eon_consultation_ui_debt_guidance_desc:0 "Показать точную существующую дипломатическую кнопку и её условия. Эта кнопка не создаёт долговое предложение и ничего не списывает."
 eon_consultation_ui_debt_guidance_ready_tt:0 "Есть совпадающая консультация о поддержке. Это только сведения; отдельное долговое предложение отправляется через дипломатию партнёра."
 eon_consultation_ui.1.t:0 "Текущая двусторонняя консультация"
 eon_consultation_ui.1.trade:0 "Партнёр: [From.GetNameWithFlag].\n\nОткройте §YРешения → Двусторонние консультации§!. Предложите торговое соглашение с уведомлением о выходе за 90 или 180 дней. Это срок уведомления, а не продолжительность договора. Отправка стоит 75 политической власти; партнёр отдельно рассматривает предложение и затем соглашается, отказывается или предлагает встречные условия.\n\nТекущее предложение: [eon_framework_negotiation_trade_pending_label].\nДействующее соглашение: [eon_consultation_ui_trade_standing_label].\nЗаписанное условие выхода: [eon_framework_negotiation_trade_clause_label].\n\nИспользуйте строки этого партнёра. Серые кнопки показывают требования. После завершения разговора отдельное предложение остаётся в §Y$eon_framework_negotiation_category$§!. Просмотр этих сведений ничего не подписывает."
 eon_consultation_ui.1.energy:0 "Партнёр: [From.GetNameWithFlag].\n\nОткройте §YРешения → Двусторонние консультации → Открыть редактор электроэнергии§!. В существующем редакторе уже выбран этот партнёр. Для ненулевого объёма задайте цену и отправьте отдельное предложение; партнёр ещё должен согласиться. Открытие панели или редактора не меняет поставки и деньги.\n\nЕсли нет взаимного соглашения об электроэнергии, сначала откройте дипломатию этой страны и используйте §Y$ENERGY_CONTRACT_AGREEMENT_TITLE$§!. Ожидающие предложения и черновики встречных предложений нужно разрешить до открытия нового редактора. Серые кнопки объясняют условия. Положительные ГВт: купить у этой страны. Отрицательные ГВт: продать ей. Цена задаётся в млрд долларов за ГВт в неделю. Подтверждение нулевого объёма прекращает действующую двустороннюю поставку через обычное управление энергией; это не новое предложение покупки. Сначала закройте обычный редактор неотправленного предложения или список выбора страны; открытие из консультации не должно перезаписать другой черновик."
 eon_consultation_ui.1.support:0 "Партнёр: [From.GetNameWithFlag].\n\nОткройте §YРешения → Двусторонние консультации → Подготовить грант§! для существующего выбора суммы 5/15/35 млрд долларов. Сохраняются обычные национальные требования, влияние, экономические условия и доступная казна. Подготовка ничего не платит; отправка обеспеченной суммы и согласие получателя — отдельные шаги.\n\nНаш процесс помощи: [eon_consultation_ui_aid_draft_label].\n\nДля долга используйте здесь §YКак предложить погашение долга§!, затем отправьте настоящее предложение через дипломатию этой страны. Просмотр не обещает и не переводит деньги."
 eon_consultation_ui.1.closed:0 "Эти сведения больше не соответствуют действующей мирной консультации исходных участников. Канал мог истечь, завершиться или стать недействительным. Закройте сведения и снова проверьте §YРешения → Двусторонние консультации§!. До очистки совпадающий истёкший канал или канал воюющих стран можно завершить там. Отдельные предложения и договоры действуют по собственным правилам; старая панель их не меняет."
 eon_consultation_ui.2.t:0 "Отдельное предложение погашения долга"
 eon_consultation_ui.2.d:0 "Откройте дипломатию страны [From.GetName] и выберите §Y$DIPLO_ACTION_ASSUME_DEBT_TITLE$§!. Настоящее предложение отправляется там; эта информационная кнопка не умеет его отправлять.\n\nСуществующее действие стоит 75 политической власти и фиксирует предложение на 25% текущего долга получателя. Нужны обычные национальные требования, отношения, экономические условия, мир и средства казны; у донора не должно быть другого долгового предложения без ответа. Получатель отдельно соглашается. Казна и долг меняются только после настоящего принятия; зафиксированная сумма ограничивается оставшимся долгом. Консультации не отменяют требования и не гарантируют согласия."
 eon_consultation_ui_trade_standing_yes:0 "Соглашение уже действует; второе соглашение предложить нельзя."
 eon_consultation_ui_trade_standing_no:0 "Для этой пары соглашение сейчас не записано."
 eon_consultation_ui_aid_draft_busy:0 "Уже занят черновик гранта или ответ. Сначала разрешите его."
 eon_consultation_ui_aid_draft_free:0 "На нашей стороне процесс помощи не занят; условия получателя всё равно применяются."
 eon_consultation_ui_trade_propose_90:0 "Предложить торговое соглашение (уведомление за 90 дней): [From.GetName]"
 eon_consultation_ui_trade_propose_90_desc:0 "Отправить отдельное рамочное предложение с уведомлением о выходе за 90 дней. Существующий процесс списывает 75 политической власти за отправку. Партнёр должен рассмотреть и отдельно согласиться; это не заказ конкретного товара."
 eon_consultation_ui_trade_propose_90_ready_tt:0 "Торговый канал действует, у нас не менее 75 политической власти; у пары нет торгового договора или ожидающего рамочного предложения. Обычные национальные требования, отношения и условия союзных стран разрешают отправку."
 eon_consultation_ui_trade_accept_90:0 "Принять торговое соглашение (уведомление за 90 дней): [From.GetName]"
 eon_consultation_ui_trade_accept_90_desc:0 "Отдельно принять рассмотренное входящее предложение с записанным уведомлением за 90 дней. Существующий процесс подписывает торговое соглашение без дополнительной политической оплаты. Это не контракт покупки или поставки."
 eon_consultation_ui_trade_accept_90_ready_tt:0 "В действующем торговом канале есть текущее входящее предложение с уведомлением за 90 дней; именно этот раунд рассмотрен, и обычные условия подписания ещё выполняются."
 eon_consultation_ui_trade_counter_90:0 "Предложить встречные условия (уведомление за 90 дней): [From.GetName]"
 eon_consultation_ui_trade_counter_90_desc:0 "Предложить уведомление за 90 дней вместо рассмотренных входящих условий. Это стоит 75 политической власти; сохраняется предел трёх раундов. Партнёр снова рассматривает и соглашается отдельно; встречное предложение ничего не подписывает."
 eon_consultation_ui_trade_counter_90_ready_tt:0 "В действующем торговом канале есть рассмотренное входящее предложение с другим сроком; использовано меньше трёх раундов. У нас не менее 75 политической власти, обычные условия предложения ещё выполняются."
 eon_consultation_ui_trade_propose_180:0 "Предложить торговое соглашение (уведомление за 180 дней): [From.GetName]"
 eon_consultation_ui_trade_propose_180_desc:0 "Отправить отдельное рамочное предложение с уведомлением о выходе за 180 дней. Существующий процесс списывает 75 политической власти за отправку. Партнёр должен рассмотреть и отдельно согласиться; это не заказ конкретного товара."
 eon_consultation_ui_trade_propose_180_ready_tt:0 "Торговый канал действует, у нас не менее 75 политической власти; у пары нет торгового договора или ожидающего рамочного предложения. Обычные национальные требования, отношения и условия союзных стран разрешают отправку."
 eon_consultation_ui_trade_accept_180:0 "Принять торговое соглашение (уведомление за 180 дней): [From.GetName]"
 eon_consultation_ui_trade_accept_180_desc:0 "Отдельно принять рассмотренное входящее предложение с записанным уведомлением за 180 дней. Существующий процесс подписывает торговое соглашение без дополнительной политической оплаты. Это не контракт покупки или поставки."
 eon_consultation_ui_trade_accept_180_ready_tt:0 "В действующем торговом канале есть текущее входящее предложение с уведомлением за 180 дней; именно этот раунд рассмотрен, и обычные условия подписания ещё выполняются."
 eon_consultation_ui_trade_counter_180:0 "Предложить встречные условия (уведомление за 180 дней): [From.GetName]"
 eon_consultation_ui_trade_counter_180_desc:0 "Предложить уведомление за 180 дней вместо рассмотренных входящих условий. Это стоит 75 политической власти; сохраняется предел трёх раундов. Партнёр снова рассматривает и соглашается отдельно; встречное предложение ничего не подписывает."
 eon_consultation_ui_trade_counter_180_ready_tt:0 "В действующем торговом канале есть рассмотренное входящее предложение с другим сроком; использовано меньше трёх раундов. У нас не менее 75 политической власти, обычные условия предложения ещё выполняются."
 EON_OPEN_CONSULTATION_PANEL_TITLE:0 "$eon_open_consultation_panel$"
 EON_OPEN_CONSULTATION_PANEL_ACTION_DESC:0 "$eon_open_consultation_panel_desc$"
 eon_consultation_ui_trade_notice:0 "Уведомить о выходе по условию договора: [From.GetName]"
 eon_consultation_ui_trade_notice_desc:0 "Через существующий процесс уведомить о выходе за согласованные 90 или 180 дней. Уведомление стоит 75 политической власти. До окончания этого срока соглашение действует; отдельные поставки и проекты сохраняют собственные обязательства. Старые договоры без записанного условия допускают только прекращение по взаимному согласию."
 eon_consultation_ui_trade_notice_ready_tt:0 "Торговый канал действует; обе стороны записали один и тот же договор с положительным номером и условием 90/180 дней. Уведомление ещё не открыто, у нас не менее 75 политической власти; сохраняется обычное национальное ограничение."
 eon_consultation_ui_trade_end_request:0 "Запросить прекращение по взаимному согласию: [From.GetName]"
 eon_consultation_ui_trade_end_request_desc:0 "Отправить отдельный запрос о досрочном прекращении действующего торгового соглашения по взаимному согласию. Это стоит 75 политической власти; партнёр отдельно рассматривает и соглашается. Отправка не прекращает договор и не закрывает консультацию."
 eon_consultation_ui_trade_end_request_ready_tt:0 "Торговый канал и рамочное соглашение действуют; у обеих сторон нет ожидающего рамочного запроса для этой пары. У нас не менее 75 политической власти, обычное национальное условие разрешает отправку."
 eon_consultation_ui_trade_end_accept:0 "Согласиться на взаимное прекращение: [From.GetName]"
 eon_consultation_ui_trade_end_accept_desc:0 "Отдельно принять рассмотренный запрос о прекращении именно этого действующего торгового соглашения. Существующий процесс прекращает его без дополнительной политической оплаты. Независимые поставки, капитал проектов и финансовые предложения не отменяются."
 eon_consultation_ui_trade_end_accept_ready_tt:0 "В действующем торговом канале есть рассмотренный входящий запрос о взаимном прекращении, привязанный к одному и тому же текущему договору у обеих сторон. Старый запрос не может прекратить другое соглашение."
 eon_consultation_ui_topic_trade:0 "Торговля и коммерческое сотрудничество"
 eon_consultation_ui_topic_energy:0 "Поставки электроэнергии и контракты"
 eon_consultation_ui_topic_support:0 "Экономическая помощь и погашение долга"
 eon_consultation_ui_topic_unknown:0 "Совпадающая тема не записана"
