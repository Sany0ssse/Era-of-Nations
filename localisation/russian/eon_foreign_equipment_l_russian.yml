l_russian:
 eon_foreign_equipment_offer_available_tt:0 "Для этого подходящего партнёра доступен хотя бы один полный пакет снаряжения. В предложение войдут только пакеты, полностью имеющиеся на нашем складе. Просроченное предложение без ответа навсегда закрывает предложения снаряжения этому партнёру; старое предложение с неизвестным партнёром закрывает весь этот канал."
 eon_foreign_equipment_offer_tt:0 "Предложить полные пакеты снаряжения, которые сейчас есть на нашем складе. Получатель увидит точный список и сможет ответить в течение §Y30 дней§!. Снаряжение отправляется только после его согласия и окончательной проверки. Указанные количества не меняются; если хотя бы одного выбранного пакета уже не хватает, всё предложение закрывается без отправки. Одновременно ответа может ожидать только одно предложение снаряжения."
 eon_foreign_equipment.1.t:0 "Предложение военного снаряжения"
 eon_foreign_equipment.1.d:0 "[FROM.GetName] предлагает нам военное снаряжение для поддержки нашей обороны. Наведите указатель на кнопку принятия или отказа, чтобы увидеть точный список. Мы можем согласиться или отказаться в течение 30 дней. Согласие разрешает отправку, если обе страны по-прежнему соответствуют условиям, а каждый указанный пакет доступен полностью. Отправитель также получает предусмотренный существующей механикой прирост влияния. На время рассмотрения снаряжение не резервируется; отправка и прибытие — отдельные этапы."
 eon_foreign_equipment.1.a:0 "Принять указанное снаряжение"
 eon_foreign_equipment.1.b:0 "Отказаться или закрыть предложение"
 eon_foreign_equipment_manifest_header_tt:0 "§YПредложенное снаряжение:§!"
 eon_foreign_equipment_accept_tt:0 "Разрешить отправку ровно указанных пакетов. Перед отправкой повторно проверяются условия обеих стран и полные запасы отправителя. Если хотя бы одного пакета не хватает, предложение закрывается без отправки уменьшенного набора. После согласия предложение уже нельзя отозвать или отклонить."
 eon_foreign_equipment_decline_tt:0 "Закрыть это предложение без отправки снаряжения и новых обязательств."
 eon_foreign_equipment_unmatched_tt:0 "На это предложение уже ответили либо оно больше не открыто. Подтверждение сообщения не создаёт нового приказа на отправку."
 eon_foreign_equipment_withdraw_offer:0 "Отозвать предложение военного снаряжения"
 eon_foreign_equipment_withdraw_offer_desc:0 "Отозвать ожидающее ответа предложение снаряжения этому партнёру до его согласия. По этому предложению снаряжение ещё не отправлялось."
 eon_foreign_equipment_withdraw_offer_send_desc:0 "Отозвать это предложение снаряжения? Комиссии и передачи снаряжения нет. Новое предложение недоступно, пока партнёр не закроет отозванное предложение или не закончится срок ответа. Если оно истечёт без ответа, новые предложения снаряжения этому партнёру будут навсегда недоступны."
 eon_foreign_equipment.3.t:0 "Предложение снаряжения отозвано"
 eon_foreign_equipment.3.d:0 "Отправитель отозвал предложение до нашего согласия. По этому предложению снаряжение не отправлялось. Мы можем закрыть исходное предложение, когда оно появится."
 eon_foreign_equipment.4.t:0 "Срок предложения снаряжения истёк"
 eon_foreign_equipment.4.d:0 "Срок предложения истёк либо его больше нельзя было исполнить с указанным партнёром и согласованным списком снаряжения. Приказ на отправку не выдавался. Новые предложения снаряжения этому партнёру навсегда недоступны. Предложения другим подходящим странам остаются доступны."
 eon_foreign_equipment.5.t:0 "Предложения снаряжения недоступны"
 eon_foreign_equipment.5.d:0 "Незавершённое предложение снаряжения не удалось надёжно сопоставить с партнёром и согласованным списком. Приказ на отправку не выдавался. Канал предложений снаряжения этой страны нельзя открыть снова; другие дипломатические действия остаются доступны."
 eon_foreign_equipment.6.t:0 "Предложение снаряжения закрыто"
 eon_foreign_equipment.6.d:0 "Предложение снаряжения было отклонено, отозвано или перестало соответствовать условиям отправки. По этому предложению снаряжение не отправлялось."
 eon_foreign_equipment.7.t:0 "Приказ на отправку снаряжения"
 eon_foreign_equipment.7.d:0 "Получатель согласился, и окончательные условия были выполнены. Выдан приказ на отправку согласованных пакетов снаряжения. Это сообщение подтверждает приказ на отправку, а не прибытие к получателю. Отправитель получает предусмотренный существующей механикой прирост влияния."
 eon_foreign_equipment.ack:0 "Понятно"

 eon_foreign_equipment_manifest_apc_tt:0 "§Y250§! бронетранспортёров"
