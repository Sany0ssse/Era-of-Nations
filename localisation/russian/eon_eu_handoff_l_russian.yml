 eon_eu_handoff_selected_pending_tt:0 "У выбранного предложения есть действующее одобрение Европарламента, ещё не использованное для открытия голосования в Совете. Оно снимает только ожидание между инициативами; политические условия, требования к участнику и плата за внесение сохраняются."
