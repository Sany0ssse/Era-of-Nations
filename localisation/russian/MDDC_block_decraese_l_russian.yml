l_russian:
 # Main event
 MANAGE_SUBJECT_EXPENSES_T: "Рассмотрение государственных расходов в [FROM.GetNameDef]"
 MANAGE_SUBJECT_EXPENSES_D: "Как метрополия [FROM.GetNameDef], мы должны направить наше зависимую от нас марионетку на верный путь. Для этого нам придётся задействовать некоторые связи, но это того стоит, чтобы сделать их такими какими мы видим их. Однако с каждым вмешательством они будут постепенно отдаляться от нас — невысокая цена за такое значительное участие."

 manage_subject_expenses.1.a: "Увеличить расходы на полицию"
 manage_subject_expenses.1.b: "Увеличить расходы на образование"
 manage_subject_expenses.1.c: "Увеличить расходы на здравоохранение"
 manage_subject_expenses.1.d: "Следующая страница"

 # Advanced options event
 MANAGE_SUBJECT_EXPENSES_ADV_T: "Рассмотрение государственных расходов в [FROM.GetNameDef]"
 MANAGE_SUBJECT_EXPENSES_ADV_D: "Как метрополия [FROM.GetNameDef], мы должны направить наше зависимую от нас марионетку на верный путь. Для этого нам придётся задействовать некоторые связи, но это того стоит, чтобы сделать их такими какими мы видим их. Однако с каждым вмешательством они будут постепенно отдаляться от нас — невысокая цена за такое значительное участие."

 manage_subject_expenses.4.a: "Увеличить расходы на администрацию"
