l_russian:
 eon_foreign_cash_offer_available_tt:0 "Можно предложить финансовую помощь этому подходящему партнёру. Казна должна покрывать все 7 миллиардов, а получатель — иметь возможность принять их полностью. Просроченное предложение без ответа навсегда закрывает финансовые предложения этому партнёру; старое предложение с неизвестным партнёром закрывает весь этот канал финансовых предложений."
 eon_foreign_cash_offer_tt:0 "Предложить [FROM.GetName] единовременную помощь в размере §Y7 миллиардов§!. На ответ даётся §Y30 дней§!. Деньги переводятся только после согласия получателя и окончательной проверки условий и казны обеих стран. Одновременно ответа может ожидать только одно финансовое предложение."
 eon_foreign_cash.1.t:0 "Предложение финансовой поддержки"
 eon_foreign_cash.1.d:0 "[FROM.GetName] предлагает нам единовременную помощь в размере 7 миллиардов для поддержки нашей обороны. Мы можем согласиться или отказаться в течение 30 дней. Согласие разрешает перевод, если обе страны по-прежнему соответствуют условиям и вся сумма может быть выплачена и получена. Помощь также даёт отправителю предусмотренный существующей механикой прирост влияния. Это не кредит, не обязательство вернуть деньги и не регулярная выплата."
 eon_foreign_cash.1.a:0 "Принять финансовую поддержку"
 eon_foreign_cash.1.b:0 "Отказаться или закрыть предложение"
 eon_foreign_cash_accept_tt:0 "Согласиться на единовременную помощь в размере §Y7 миллиардов§!. Перед переводом повторно проверяются средства отправителя, возможность получить всю сумму, оборонительная война, ранги держав и двусторонние отношения. Если окончательная проверка не пройдена, предложение закрывается без перевода денег. После согласия предложение уже нельзя отозвать или отклонить."
 eon_foreign_cash_decline_tt:0 "Закрыть это предложение без выплаты и новых финансовых обязательств."
 eon_foreign_cash_unmatched_tt:0 "На это предложение уже ответили либо оно больше не открыто. Подтверждение сообщения не переводит деньги."
 eon_foreign_cash_withdraw_offer:0 "Отозвать предложение финансовой помощи"
 eon_foreign_cash_withdraw_offer_desc:0 "Отозвать ожидающее ответа единовременное финансовое предложение этому партнёру до его согласия. Деньги ещё не переводились."
 eon_foreign_cash_withdraw_offer_send_desc:0 "Отозвать это финансовое предложение? Выплаты и комиссии нет. Новое предложение недоступно, пока партнёр не закроет отозванное предложение или не закончится срок ответа. Если оно истечёт без ответа, новые финансовые предложения этому партнёру будут навсегда недоступны."
 eon_foreign_cash.3.t:0 "Финансовое предложение отозвано"
 eon_foreign_cash.3.d:0 "Отправитель отозвал предложение до нашего согласия. Деньги не переводились. Мы можем закрыть исходное предложение, когда оно появится."
 eon_foreign_cash.4.t:0 "Срок финансового предложения истёк"
 eon_foreign_cash.4.d:0 "Предложение больше нельзя было исполнить в срок ответа либо его партнёр перестал существовать. Деньги не переводились. Новые финансовые предложения этому партнёру навсегда недоступны. Финансовые предложения другим подходящим странам остаются доступны."
 eon_foreign_cash.5.t:0 "Финансовые предложения недоступны"
 eon_foreign_cash.5.d:0 "Незавершённое финансовое предложение не удалось надёжно сопоставить с партнёром. Деньги не переводились. Канал финансовых предложений этой страны нельзя открыть снова; другие дипломатические действия остаются доступны."
 eon_foreign_cash.6.t:0 "Финансовое предложение закрыто"
 eon_foreign_cash.6.d:0 "Финансовое предложение было отклонено, отозвано или перестало соответствовать условиям исполнения. Помощь не выплачивалась."
 eon_foreign_cash.7.t:0 "Финансовая поддержка выплачена"
 eon_foreign_cash.7.d:0 "Получатель согласился, и окончательные условия были выполнены. Мы перечислили полную единовременную помощь в размере 7 миллиардов и получили предусмотренный существующей механикой прирост влияния."
 eon_foreign_cash.ack:0 "Понятно"
