POL_economy_category: "Экономика Польши"
POL_economy_category_desc: "Польша в начале нового тысячелетия находится не в лучшем экономическом положении. Рыночные реформы и успешная либерализация принесли плоды, но остаётся слишком много серьёзных проблем. \n\n Например, недостаточно развитая энергетика едва справляется с задачей снабжения населения. Кроме того, существуют сложности с угольной отраслью: страна усеяна убыточными шахтами, зависящими от господдержки, что влечёт за собой огромные убытки для нашей экономики.\n\n"
