POL_three_seas_initiative_category: "Инициатива трёх морей"
POL_three_seas_initiative_category_desc: "§CИнициатива трёх морей§!, также известная как Балтийская, Адриатическая, Чёрноморская (БАЧ) инициатива или просто как Три моря, — это форум тринадцати государств в Европейском союзе, проходящий по оси север-юг от Балтийского моря до Адриатического и Чёрного морей в Центральной и Восточной Европе. Инициатива направлена на создание регионального диалога по вопросам, затрагивающим государства-члены.\n\n\n\n\n£GFX_POL_three_seas_initiative_decision_category\n\n\n\n\n\n"
