poland_antiterror.1.t: "Польша хочет направить своих миротворцев"
poland_antiterror.1.d: "Сегодня польские дипломаты прибыли в нашу страну с предложением военной помощи в виде миротворческих бригад регулярной польской армии. Это предложение возникло из желания Польши предотвратить распространение террористической идеологии «Талибана»* и помочь сохранить демократическое управление в Центральной Азии.\nИх миротворцы помогут нам в противостоянии «Талибану» и усилят своё присутствие в регионе."
poland_antiterror.1.a: "Их помощь очень полезна."
poland_antiterror.1.b: "Мы сами сможем пережить эту войну."
poland_antiterror.2.t: "Афганистан получил наших миротворцев"
poland_antiterror.2.d: "Наши дипломаты вернулись из Афганистана с докладом. Афганское правительство согласилось принять наши миротворческие войска. Этот шаг усилит наше присутствие в регионе и нанесёт дополнительный удар по «Талибану»."
poland_antiterror.2.a: "Нанесём удар по «Талибану»!"
poland_antiterror.3.t: "Афганистан отказывается от наших миротворцев"
poland_antiterror.3.d: "Наши дипломаты вернулись из Афганистана с докладом. Афганское правительство отклонило наших миротворцев, заявив, что не будет ставить под угрозу свой суверенитет и что само справится с угрозой «Талибана»*."
poland_antiterror.3.a: "Их право..."
POL_presence_in_afganistan_tt: "§YЕсли они согласятся§!: они получат в своё распоряжение §R3 дивизии наших миротворцев§!. Наше §Yвлияние§! в регионе §Gувеличится§!."
poland_antiterror.4.t: "Варшавская конференция"
poland_antiterror.4.d: "В свете последних событий, связанных с объявлением США войны с террором и вторжением американской армии в Ирак, Польша созвала экстренный саммит для обсуждения и решения, как реагировать на эти события.\nСами США утверждают, что Ирак разрабатывает оружие массового уничтожения и ведёт агрессивную внешнюю политику. Под предлогом установления демократии в регионе они вторглись в суверенное государство. Как нам следует реагировать?"
poland_antiterror.4.a: "Отправить миротворцев в поддержку США"
poland_antiterror.4.b: "Мы должны сохранять нейтралитет в этом вопросе."
POL_warsaw_conference_tt: "Мы проведём конференцию, посвящённую §Rвторжению США в Ирак§!. Если страна решит §Gподдержать§! §6США§!, она §Yотправит своих миротворцев§! в поддержку США."
poland_antiterror.5.t: "Операция «Орлиное перо»"
poland_antiterror.5.d: "Сегодня нашу инфраструктуру и радиолокационные станции атаковали объединённые силы афганского сопротивления и польской армии. По данным польских СМИ, в так называемой операции «Орлиное перо» участвовали 800 польских солдат. Эта операция нанесла серьёзный урон нашей морали и боеспособности армии."
poland_antiterror.5.a: "Жалкая попытка остановить триумф джихада"
poland_antiterror.6.t: "Вопрос об интервенции в Сирию"
poland_antiterror.6.d: "Ситуация в Сирийском Курдистане стремительно ухудшается. Наши источники сообщают, что протурецкие формирования «Сирийской национальной армии» при поддержке турецкой авиации возобновили наступление на позиции Демократической Федерации Северной Сирии в районе Манбиджа и Тель-Абьяда. Одновременно спящие ячейки ИГИЛ активизировались в провинции Дейр-эз-Зор. Рожава, ослабленная годами войны и экономической блокадой, запросила у Варшавы неофициальную помощь."
poland_antiterror.6.a: "Отправить миротворцев на помощь"
poland_antiterror.6.b: "Ограничиться военными консультацими"
poland_antiterror.7.t: "Польша отправляет миротворцев"
poland_antiterror.7.d: "Польская Республика официально направила нам на помощь свои миротворческие батальоны. На рассвете транспортные самолеты ВВС Польши приземлились на взлетной полосе Камышлы. Под флагом с белым орлом на землю Северной Сирии ступили два полных батальона польского миротворческого контингента "
poland_antiterror.7.a: "Да здравствует Польша!"
poland_antiterror.8.t: "Польша направляет военных экспертов"
poland_antiterror.8.d: "Польская Ресублика направила своих экспертов для консультации и координации нашей армии. Польские эксперты уже развернули мобильный центр координации и начали обучать наших командиров тому, как видеть турецкие «Байрактары» раньше, чем те увидят нас. Как глушить их сигналы. Как двигаться в ночи, оставаясь невидимыми для тепловизоров."
poland_antiterror.8.a: "Да здравствует Польша!"
