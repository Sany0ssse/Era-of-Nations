poland_economy.1.t: "[POL.GetName] предлагает сделку"
poland_economy.1.d: "Польская компания Grupa Azoty предлагает нам заключить сделку на продажу польских удобрений. Мы еженедельно будем выделять часть бюджета на экспорт, взамен получая хороший стимул для нашего сельского хозяйства."
poland_economy.1.a: "Сделка"
poland_economy.1.b: "Не сейчас"
poland_economy.2.t: "[FROM.GetName] согласился на сделку"
poland_economy.2.d: "[FROM.GetName] согласился на экспорт наших удобрений компании Grupa Azoty. Это принесёт хороший постоянный доход и улучшит позиции компании."
poland_economy.2.a: "Это порадует наш бюджет"
poland_economy.3.t: "[FROM.GetName] отклонил сделку"
poland_economy.3.d: "[FROM.GetName] отказался принимать нашу сделку по экспорту удобрений. Надеемся, что в следующий раз будут более сговорчивыми."
poland_economy.3.a: "Может, в другой раз"
poland_economy.4.t: "Orlengate"
poland_economy.4.d: "Сегодня, накануне заседания правления Orlen, генеральный директор компании Анджей Моджейевский был арестован. За два часа до заседания Моджейевского отпустили, и совет директоров снял его с должности. Бывший министр финансов Веслав Качмарек сообщил Gazeta Wyborcza, что настоящая цель ареста — спровоцировать его снятие и сорвать подписание нефтяного контракта на 14 млрд долларов. По его словам, решение о задержании было принято на неформальной встрече кабинета премьер-министра с Лешеком Миллером, министром юстиции Барбарой Пивниковой и главой Бюро охраны общественного порядка Збигневом Сементковским. Сам Качмарек, присутствовавший на встрече, открыл её мотивы, чтобы впоследствии избежать обвинений в должностных злоупотреблениях, когда станет министром."
poland_economy.4.a: "Расследование не требуется"
poland_economy.4.b: "Нужно провести расследование"
poland_economy.5.t: "Польская компания хочет купить наши нефтяные фирмы"
poland_economy.5.d: "Польская нефтяная компания Orlen собирается приобрести несколько наших нефтеперерабатывающих заводов. Взамен обещают открыть филиал Orlen в нашей стране. Это похоже на выгодную сделку!"
poland_economy.5.a: "Сделка"
poland_economy.5.b: "Нет"
poland_economy.6.t: "[FROM.GetName] согласился на сделку"
poland_economy.6.d: "[FROM.GetName] согласился на сделку и продал свои НПЗ компании Orlen. Зарубежная экспансия компании в самом разгаре!"
poland_economy.6.a: "Очень хорошо!"
poland_economy.7.t: "[FROM.GetName] отказал в сделке"
poland_economy.7.d: "[FROM.GetName] отказал в сделке. Компании Orlen не удалось приобрести их НПЗ, но это не повод отчаиваться — нужно попытаться в следующий раз."
poland_economy.7.a: "Мы всё равно добьёмся своего!"
poland_economy.8.t: "Польша просит инвестировать в сельское хозяйство"
poland_economy.8.d: "В рамках борьбы с кризисом в агросекторе власти Польши обратились к нам с просьбой инвестировать в сельское хозяйство. Поможем им?"
poland_economy.8.a: "Помочь им"
poland_economy.8.b: "Это не в наших интересах"
poland_economy.9.t: "[FROM.GetName] согласился инвестировать в сельское хозяйство."
poland_economy.9.d: "[FROM.GetName] согласился инвестировать в наш агросектор. Это приблизит нас к решению кризиса и даст дополнительный стимул экономике."
poland_economy.9.a: "Отлично"
poland_economy.10.t: "[FROM.GetName] отказался инвестировать в сельское хозяйство."
poland_economy.10.d: "[FROM.GetName] отказался инвестировать в наш агросектор. Похоже, придется искать иного инвестора — жаль."
poland_economy.10.a: "Понятно..."
poland_economy.11.t: "Польша просит инвестиции в металлургию"
poland_economy.11.d: "Польша обратилась к нам с коммерческим предложением. Им требуются наши инвестиции в польскую металлургию."
poland_economy.11.a: "Сделка"
poland_economy.11.b: "Не сейчас"
poland_economy.12.t: "[FROM.GetName] согласился инвестировать в нашу металлургию"
poland_economy.12.d: "[FROM.GetName] согласился вложиться в нашу металлургию. Это даст мощный стимул развитию металлургии и промышленности в целом."
poland_economy.12.a: "Очень хорошо"
poland_economy.13.t: "[FROM.GetName] отказался инвестировать в нашу металлургию"
poland_economy.13.d: "[FROM.GetName] отказался инвестировать в нашу металлургию. Очень жаль, но придётся искать других инвесторов."
poland_economy.13.a: "Курва"
poland_economy.14.t: "Польша хочет купить наши шахты"
poland_economy.14.d: "Польская компания KGHM хочет купить наши шахты. Конечно, они готовы заплатить, готовы ли мы заключить эту сделку?"
poland_economy.14.a: "Сделка"
poland_economy.14.b: "Мы не готовы продавать им наши шахты"
poland_economy.15.t: "[FROM.GetName] согласился продать нам шахты"
poland_economy.15.d: "[FROM.GetName] согласился продать нам шахты. Теперь наша компания сможет добывать ресурсы на их шахтах, что определенно принесет пользу нашей экономике."
poland_economy.15.a: "Очень хорошо"
poland_economy.16.t: "[FROM.GetName] отказался продавать нам шахты"
poland_economy.16.d: "[FROM.GetName] отказался продавать нам шахты. Они утверждают, что эта сделка противоречит их национальным интересам и не выгодна."
poland_economy.16.a: "Курва"
poland_economy.19.t: "Польша просит инвестиций в ядерную энергетику"
poland_economy.19.d: "Польша просит у нас инвестиций в ядерную энергетику. Польша давно интересуется строительством собственного ядерного реактора и сейчас ищет инвестора. Они выбрали нас, стоит ли помочь им построить ядерный реактор?"
poland_economy.19.a: "Конечно, мы станем инвестором"
poland_economy.19.b: "Это не в наших интересах"
poland_economy.20.t: "[FROM.GetName] согласился стать инвестором"
poland_economy.20.d: "[FROM.GetName] согласился стать инвестором. Их компания уже согласовала инвестиции в строительство ядерного реактора. Конечно, мы не останемся в долгу и оплатим строительство реактора."
poland_economy.20.a: "У НАС БУДЕТ РЕАКТОР!"
poland_economy.21.t: "[FROM.GetName] отказался быть инвестором"
poland_economy.21.d: "[FROM.GetName] отказался быть инвестором. Сказали, что это не в их национальных интересах. Видимо, придётся строить свои ядерные реакторы самостоятельно."
poland_economy.21.a: "Ну и ладно, сами справимся."
poland_economy.22.t: "Выбор инвестора"
poland_economy.22.d: "Спустя многие годы мы наконец решили обзавестись ядерной энергетикой, которая очевидно решит вопрос с электроэнергией. Но вопрос: к кому именно нам обратиться с этим предложением? Кто станет нашим инвестором?"
poland_economy.22.a: "Росатом — совершенно надежный вариант"
poland_economy.22.b: "Westinghouse Electric — будет хорошим инвестором"
poland_economy.23.t: "Польша предлагает инвестиции"
poland_economy.23.d: "Польская компания PGE хочет вложиться в нас и построить ядерный реактор. Это отличная инициатива, ядерная энергетика не повредит нашей экономике."
poland_economy.23.a: "Конечно, мы согласны"
poland_economy.23.b: "Мы самостоятельно справимся"
poland_economy.24.t: "Литва согласилась построить реактор"
poland_economy.24.d: "Литва согласилась разместить филиал нашей компании PGE, которая построит ядерный реактор в Литве. Отличная сделка."
poland_economy.24.a: "Ядерная Литва?"
poland_economy.25.t: "Литва отказалась строить реактор"
poland_economy.25.d: "Литва отказалась строить реактор и принимать филиал нашей компании PGE. Ну, хотя бы сэкономим финансы."
poland_economy.25.a: "Ну и ладно"

#Sejm GUI
POL_Sejm_category: "Сейм Республики Польша"
POL_Sejm_category_desc: "§tСейм Республики Польша§! — нижняя палата Национального собрания Польши, представляющая законодательную власть страны.\n\nПериодически Сейм будет предлагать изменения некоторых законов, нравятся нам они или нет. Отказ снижает §3одобрение Сейма§!, а согласие §Gповышает одобрение§! соответственно. Раз в год мы получаем право §3ВЕТО§!, которым можем воспользоваться и отказать без последствий.\n\nЕсли уровень одобрения Сейма опустится ниже §R5%§!, Сейм выставит вотум недоверия против нас."
