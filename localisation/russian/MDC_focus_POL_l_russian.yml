poland_army.1.t: "Новый командующий вооружёнными силами"
poland_army.1.d: "Генерал Эдвард Пётшик служит командующим сухопутными войсками Польши с 2000 года, он хорошо послужил нашей стране, но пора дать дорогу новому командующему"
poland_army.1.a: "Посмотрим, как он справится."
poland_army.2.t: "Польша хочет получить лицензию на производство Ка-50"
poland_army.2.d: "Польша хочет купить лицензию на производство наших ударных вертолётов Ка-50, конечно, не бесплатно. Согласимся ли мы на это?"
poland_army.2.a: "Сделка"
poland_army.2.b: "Мы не раздаём наши технологии"
poland_army.3.t: "Россия согласилась предоставить лицензию"
poland_army.3.d: "Россия согласилась предоставить лицензию на производство ударных вертолётов Ка-50. Конечно, мы заплатили за это."
poland_army.3.a: "Отлично"
poland_army.4.t: "Россия отказала в лицензии"
poland_army.4.d: "Россия отказала нам в лицензии на производство ударных вертолётов Ка-50."
poland_army.4.a: "Мы и не очень хотели"
poland_army.5.t: "Польша хочет получить лицензию на производство AH-64 Apache"
poland_army.5.d: "Польша хочет купить лицензию на производство наших ударных вертолётов AH-64 Apache, конечно, не бесплатно. Согласимся ли мы на это?"
poland_army.6.t: "США согласились предоставить лицензию"
poland_army.6.d: "США отказали нам в лицензии на производство ударных вертолётов AH-64 Apache."
poland_army.7.t: "США отказали в лицензии"
poland_army.7.d: "США отказали нам в лицензии на производство ударных вертолётов AH-64 Apache."
poland_army.8.t: "Закупка фрегатов"
poland_army.8.d: "Для реализации наших планов по военно-морской доктрине нам нужны крупные корабли, способные действовать в открытом океане. Теперь нужно выбрать, у какой страны мы должны купить фрегаты?"
poland_army.8.a: "Купить фрегаты у России"
poland_army.8.b: "Купить фрегаты у США"
poland_army.9.t: "Польша хочет купить наши фрегаты"
poland_army.9.d: "Польские дипломаты обратились к нам с коммерческим запросом. Польша желает приобрести пять наших фрегатов класса Gepard за разумную цену. Согласимся ли мы?"
poland_army.9.a: "Бизнес"
poland_army.9.b: "Они нам ещё понадобятся"
poland_army.10.t: "Россия продаёт нам фрегаты"
poland_army.10.d: "Россия продаёт нам свои фрегаты класса Gepard. Конечно, мы заплатили за это, но теперь у нас есть крупные корабли, способные выполнять миссии в открытом море — это огромный успех для нашего флота"
poland_army.10.a: "Море, наше море!"
poland_army.11.t: "Россия не продаёт нам фрегаты"
poland_army.11.d: "Россия отказалась продавать нам свои фрегаты, жаль. Нам придётся строить собственные корабли, что займёт много времени и будет стоить дорого, однако у нас нет другого выбора — мы должны следовать выбранной доктрине"
poland_army.11.a: "Очень жаль"
poland_army.12.d: "Польские дипломаты обратились к нам с коммерческим запросом. Польша желает приобрести пять наших фрегатов класса Oliver Hazard Perry за разумную цену. Согласимся ли мы?"
poland_army.13.t: "США продают нам фрегаты"
poland_army.13.d: "США продают нам свои фрегаты класса Oliver Hazard Perry. Конечно, мы заплатили за это, но теперь у нас есть крупные корабли, способные выполнять миссии в открытом море — это огромный успех для нашего флота"
poland_army.14.t: "США не продают нам фрегаты"
poland_army.14.d: "США отказались продавать нам свои фрегаты, жаль. Нам придётся строить собственные корабли, что займёт много времени и будет стоить дорого, однако у нас нет другого выбора — мы должны следовать выбранной доктрине"
poland_army.15.t: "Польша хочет купить наши МиГ-29"
poland_army.15.d: "Польша хочет купить 60 наших самолётов МиГ-29. Это старые советские лёгкие истребители, от которых мы можем избавиться за хорошую цену."
poland_army.15.a: "Мы можем договориться"
poland_army.15.b: "Они нам ещё нужны"
poland_army.16.t: "[FROM.GetName] продаёт нам самолёты"
poland_army.16.d: "[FROM.GetName] продаёт нам свои самолёты МиГ-29 Fulcrum. Это старые советские лёгкие истребители, конечно, они уже устарели по сравнению с современными крыльями, но для нашей авиации, которая не в лучшем положении на международной арене, даже это будет хорошим приобретением."
poland_army.16.a: "Отлично"
poland_army.17.t: "[FROM.GetName] не продаёт нам самолёты"
poland_army.17.d: "[FROM.GetName] не продаст нам свои старые советские лёгкие истребители МиГ-29 Fulcrum. Нам придётся найти другие способы возродить наши ВВС"
poland_army.17.a: "Ладно..."
poland_army.18.t: "Выбор многоцелевого истребителя"
poland_army.18.d: "В рамках реорганизации наших ВВС нам нужно выбрать новый многоцелевой истребитель, способный выполнять все задачи, требуемые от наших ВВС, и который мы сможем запустить в производство. Единственный вопрос — какой вариант выбрать: российский МиГ-29 Fulcrum или американский F-16"
poland_army.18.a: "Нам нужен МиГ-29"
poland_army.18.b: "F-16 — отличный вариант"
poland_army.19.t: "Польша хочет купить МиГ-29"
poland_army.19.d: "Польша хочет купить наши МиГ-29 в рамках реорганизации своих ВВС. Они хотят запустить модель МиГ-29 в производство как основную модель многоцелевого истребителя и для помощи в переходе на новый основной истребитель просят 50 наших моделей МиГ-29, конечно, за разумную цену."
poland_army.19.a: "Мы поможем им"
poland_army.19.b: "Я думаю нет"
poland_army.20.t: "[FROM.GetName] продаёт нам самолёты"
poland_army.20.d: "[FROM.GetName] продаёт нам свои многоцелевые истребители. Это поможет нам создать благоприятные условия для перехода на новую модель многоцелевого истребителя. Отлично"
poland_army.20.a: "Отлично"
poland_army.21.t: "[FROM.GetName] не продаёт нам самолёты"
poland_army.21.d: "[FROM.GetName] не продаёт нам свои многоцелевые истребители. Хотя они отказали в сделке, мы всё ещё можем использовать наши существующие технологии для создания производства новых многоцелевых истребителей"
poland_army.21.a: "Ладно"
poland_army.22.t: "Польша хочет купить F-16"
poland_army.22.d: "Польша хочет купить наши F-16 в рамках реорганизации своих ВВС. Они хотят запустить модель F-16 в производство как основную модель многоцелевого истребителя и для помощи в переходе на новый основной истребитель просят 50 наших моделей F-16, конечно, за разумную цену."
poland_army.23.t: "Польша хочет купить МиГ-35"
poland_army.23.d: "Польша хочет купить наши новые самолёты МиГ-35 Fulcrum-F поколения 4++ по разумной цене. Этот шаг укрепит наши отношения и увеличит наше влияние на их вооружённые силы"
poland_army.23.a: "Конечно"
poland_army.23.b: "Им ещё рано получать наши технологии."
poland_army.24.t: "Россия согласилась продать нам МиГ-35"
poland_army.24.d: "МиГ-35 — новый российский истребитель поколения 4++, способный конкурировать с лучшими самолётами 5-го поколения. Россия согласилась продать несколько новых моделей"
poland_army.24.a: "ОТЛИЧНО!"
poland_army.25.t: "Россия отказала в продаже МиГ-35"
poland_army.25.d: "МиГ-35 — новый российский истребитель поколения 4++, способный конкурировать с лучшими самолётами 5-го поколения. Россия отказалась продать несколько новых моделей"
poland_army.25.a: "Ну, я и не очень хотел"
poland_army.26.t: "Польша хочет купить F-35A Lightning II"
poland_army.26.d: "Польша хочет купить наши новые самолёты F-35A Lightning II 5-го поколения по разумной цене. Этот шаг укрепит наши отношения и увеличит наше влияние на их вооружённые силы"
poland_army.27.t: "США согласились продать нам F-35A Lightning II"
poland_army.27.d: "F-35A Lightning II — американский истребитель 5-го поколения. США согласились продать нам несколько моделей"
poland_army.28.t: "США отказали в продаже F-35A Lightning II"
poland_army.28.d: "F-35A Lightning II — американский истребитель 5-го поколения. США отказались продать нам несколько моделей"
poland_army.29.t: "Польша хочет купить Су-57"
poland_army.29.d: "Польша хочет купить наши новые самолёты Су-57 5-го поколения по разумной цене. Этот шаг укрепит наши отношения и увеличит наше влияние на их вооружённые силы"
poland_army.30.t: "Россия согласилась продать нам Су-57"
poland_army.30.d: "Су-57 — новый российский истребитель 5-го поколения, способный конкурировать с лучшими американскими истребителями 5-го поколения. Россия согласилась продать нам несколько моделей"
poland_army.31.t: "Россия отказала в продаже Су-57"
poland_army.31.d: "Су-57 — новый российский истребитель 5-го поколения, способный конкурировать с лучшими американскими истребителями 5-го поколения. Россия отказалась продать нам несколько моделей"
poland_army.32.t: "Польша хочет купить F-22 Raptor"
poland_army.32.d: "Польша хочет купить наши новые самолёты F-22 Raptor 5-го поколения по разумной цене. Этот шаг укрепит наши отношения и увеличит наше влияние на их вооружённые силы"
poland_army.33.t: "США согласились продать нам F-22 Raptor"
poland_army.33.d: "F-22 Raptor — первый истребитель 5-го поколения, поступивший на вооружение США и основной истребитель для завоевания превосходства в воздухе. Соединённые Штаты согласились продать нам несколько вариантов своих истребителей F-22 Raptor. Это очень хорошее приобретение для наших ВВС"
poland_army.34.t: "США отказали в продаже F-22 Raptor"
poland_army.34.d: "F-22 Raptor — первый истребитель 5-го поколения, поступивший на вооружение США и основной истребитель для завоевания превосходства в воздухе. К сожалению, нам не удалось получить одобрение США на покупку их моделей F-22 Raptor."
poland_army.35.t: "Польша хочет купить ракетные комплексы Искандер"
poland_army.35.d: "Польские дипломаты обратились к нам с запросом. Они хотят купить ракеты Искандер и несколько пусковых установок для своих вооружённых сил. Они готовы хорошо заплатить за эту сделку, согласимся ли мы?"
poland_army.36.t: "Россия согласилась продать нам ракетные комплексы Искандер"
poland_army.36.d: "Россия согласилась продать нам 100 ракет Искандер, а также поставила нам несколько пусковых установок для этих ракет. Хорошая сделка"
poland_army.37.t: "Россия отказала в продаже ракетных комплексов Искандер"
poland_army.37.d: "Россия отказалась продавать нам свои ракеты Искандер и пусковые установки. Похоже, нам придётся найти другие способы получить крылатые ракеты."
poland_army.38.t: "Польша хочет купить ракетные комплексы Томагавк"
poland_army.38.d: "Польские дипломаты обратились к нам с запросом. Они хотят купить ракеты Томагавк и несколько пусковых установок для своих вооружённых сил. Они готовы хорошо заплатить за эту сделку, согласимся ли мы?"
