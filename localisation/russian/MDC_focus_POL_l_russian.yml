POL_second_crusade_desc: "Столетия прошли с тех пор, как крылатые гусары разгромили турок, защитив Европу подобно святому Щиту самого Христа. Пришло время вспомнить славу нашей Империи и вернуть земли, некогда принадлежавшие христианству, устроив второй крестовый поход на Стамбул!"
POL_polish_reconquista_tt: "Будет открыта категория решений §6Внешней политики§! §tКоролевства Польша§!."
