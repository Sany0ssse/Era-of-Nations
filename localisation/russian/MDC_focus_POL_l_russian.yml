#SLD
POL_end_of_kwasniewski_era: "Конец эры Квасневского"
POL_end_of_kwasniewski_era_desc: "Завершается популярное и прагматичное президентство Александра Квасневского, фигуры, направлявшей раннее посткоммунистическое развитие Польши и её вступление в НАТО и ЕС. Нация стоит на перепутье, готовясь к новой политической эре и новому руководству."
POL_working_on_election_program: "Работа над предвыборной программой"
POL_working_on_election_program_desc: "Партийные стратеги и политики работают день и ночь, создавая обещания и политику, призванные завоевать сердца и голоса польских избирателей. Будущее направление страны будет решено на этих страницах."
POL_unite_with_PPS: "Объединиться с ППС"
POL_unite_with_PPS_desc: "Потенциальное слияние с исторической Польской социалистической партией (ППС) может создать мощный левый блок, объединяющий разные традиции левых и привлекающий избирателей, озабоченных социальной справедливостью и правами трудящихся."
POL_coalition_with_unia_pracy: "Коалиция с Унией труда"
POL_coalition_with_unia_pracy_desc: "Формирование коалиции с левой 'Унией труда' укрепит социал-демократический лагерь, объединив ресурсы и электоральную базу для единого фронта против либеральных и консервативных оппонентов."
POL_election_2000: "Выборы 2000"
POL_election_2000_desc: "Президентские выборы 2000 года — ключевой момент, проверяющий политический ландшафт спустя десятилетие после падения коммунизма. Продолжит ли левые удерживать президентство, или появится новая сила?"
POL_lewica: "Левица"
POL_lewica_desc: "'Левица' представляет коалицию или движение, стремящееся объединить различные посткоммунистические и социал-демократические партии под общим знаменем для обеспечения политической релевантности и реализации программы социального обеспечения."
POL_kwasnewsku_second_tern: "Второй срок Квасневского"
POL_kwasnewsku_second_tern_desc: "Обеспечив второй срок на посту, президент Квасневский продолжает свой центристский и проевропейский курс, обеспечивая стабилизирующую силу в польской политике, в то время как его партия СЛД сталкивается с растущими вызовами."
POL_pzpr_legacy: "Наследие ПОРП"
POL_pzpr_legacy_desc: "Тень бывшей правящей Польской объединённой рабочей партии (ПОРП) нависает над страной. Работа с её наследием — от кадров в государственных учреждениях до идеологического следа — остаётся глубоко разделяющим вопросом в польском обществе."
POL_rywingate: "Рывингейт"
POL_rywingate_desc: "Разражается крупный политический скандал, раскрывающий предполагаемые попытки кинопродюсера повлиять на медиа-законодательство и состав правительства в интересах бизнес-группы. Дело подрывает общественное доверие к политическому классу."
POL_balcerowicz_plan: "План Бальцеровича"
POL_balcerowicz_plan_desc: "Радикальная и спорная программа экономических реформ 'шоковой терапии', быстро переведшая Польшу от плановой к рыночной экономике. Она обуздала гиперинфляцию, но обошлась высокой социальной ценой, создав глубокие политические разделения."
POL_kuron_plan: "План Куроня"
POL_kuron_plan_desc: "Альтернативное, более социально ориентированное экономическое предложение, отстаиваемое Яцеком Куронем, фокусирующееся на смягчении жёстких эффектов перехода через поддержку рабочего самоуправления и социальных сетей безопасности."
POL_workers_rights: "Права трудящихся"
POL_workers_rights_desc: "Обязательство по укреплению позиции труда в новой капиталистической реальности, включающее защиту профсоюзов, права коллективных переговоров и безопасные условия труда."
POL_social_equality: "Социальное равенство"
POL_social_equality_desc: "Политика, направленная на сокращение растущего разрыва между богатыми и бедными, обеспечение доступа к здравоохранению, образованию и пенсиям для всех граждан, и борьбу с социальной изоляцией."
POL_fight_unemployment: "Борьба с безработицей"
POL_fight_unemployment_desc: "С экономическим переходом, вызывающим массовые потери рабочих мест, правительство приоритизирует программы борьбы с безработицей через общественные работы, переподготовку и стимулы для создания рабочих мест."
POL_fight_corruption_desc: "В ответ на общественное возмущение скандалами правительство запускает инициативы по повышению прозрачности, укреплению антикоррупционных органов и восстановлению веры в государственные институты. Борьба трудная, и её успех неопределён."
POL_rule_of_pluralism: "Правило плюрализма"
POL_rule_of_pluralism_desc: "Фундаментальное обязательство перед политической системой, где могут процветать множественные партии, разнообразные мнения и свободная пресса, обеспечивая, чтобы ни одна группа не могла монополизировать власть."
POL_democratic_balance: "Демократический баланс"
POL_democratic_balance_desc: "Постоянные усилия по поддержанию стабильного управления через тщательный баланс власти между президентством, правительством и парламентом — деликатная задача в молодой демократии."
POL_liberal_market: "Либеральный рынок"
POL_liberal_market_desc: "Стремление к свободно-рыночной экономической модели с минимальным государственным вмешательством, низким регулированием и сильной защитой частной собственности, рассматриваемой как двигатель роста и процветания."
POL_privatization: "Приватизация"
POL_privatization_desc: "Обширный процесс передачи государственных предприятий в частные руки, предназначенный для повышения эффективности и привлечения капитала, но часто критикуемый за темпы, справедливость и появление 'политического капитализма'."
POL_decrease_corp_tax: "Снизить корпоративный налог"
POL_decrease_corp_tax_desc: "Политика стимулирования экономического роста и привлечения иностранных инвестиций путём снижения корпоративного налогового бремени — краеугольный камень либеральных экономических платформ."
POL_hausner_plan: "План Хауснера"
POL_hausner_plan_desc: "Комплексный набор фискальных и социальных реформ, введённых министром финансов Ежи Хауснером, направленный на стабилизацию государственных финансов при реструктуризации дорогостоящих систем социального обеспечения и пенсий."
POL_zbigenev_and_vogel_case: "Дело Збигнева и Фогеля"
POL_orlen_case: "Дело Orlen"
POL_orlen_case_desc: "Сложное дело вокруг государственной нефтяной компании Orlen, включающее обвинения в политически мотивированных сменах руководства, операциях спецслужб и сомнительных финансовых сделках на высших уровнях власти."
POL_fight_corruption: "Борьба с коррупцией"
POL_constitutuin_1997: "Конституция 1997"
POL_constitutuin_1997_desc: "Принятие нового верховного закона Польши, веха, формально установившая страну как демократическое, правовое государство, определяющее структуру правительства и права граждан."
POL_cia_black_sites: "Чёрные сайты ЦРУ"
POL_cia_black_sites_desc: "Появляются обвинения, что Польша размещала секретные тюрьмы ЦРУ для 'ценных заключённых' в войне с террором. Скандал напрягает отношения с союзниками и поднимает серьёзные вопросы о верховенстве закона и суверенитете."
POL_eurointegration: "Европейская интеграция"
POL_eurointegration_desc: "Стратегическая и всеобъемлющая национальная цель полной интеграции с европейскими структурами, прежде всего Европейским союзом, требующая обширных правовых, экономических и политических реформ для соответствия критериям членства."
POL_regional_cooperation: "Региональное сотрудничество"
POL_regional_cooperation_desc: "Развитие сильных политических, экономических и культурных связей с соседними центральноевропейскими государствами, такими как Вышеградская группа, для усиления голоса региона в европейских и глобальных делах."
POL_increase_influence_area: "Расширение зоны влияния"
POL_increase_influence_area_desc: "Внешнеполитическое стремление расширить дипломатическое и экономическое влияние Польши за пределы непосредственного соседства, позиционируя себя как значимого игрока в Восточной Европе и надёжного партнёра в НАТО."
POL_enter_eu_house: "Войти в европейский дом"
POL_enter_eu_house_desc: "Метафорическое выражение окончательного успеха внешней политики Польши: обеспечение членства в Европейском союзе, наконец закрепив нацию в сообществе западных демократий после десятилетий разделения."
POL_eurointegration_tt: "[POL.GetNameWithFlag] станет §3кандидатом в члены ЕС§!"
POL_rywingate_tt: "Начнётся цепочка расследований по §2делу Рывина§!, успех будет зависеть от нашего уровня §Rкоррупции§!"
POL_hausner_plan_tt: "§4Ежи Хауснер§! предлагает план сокращения государственных §Yрасходов§! для спасения бюджета, но его план не одобрен §2Сеймом§!"
POL_zbigenev_and_vogel_case_tt: "Дело о помиловании бывших членов §tкоммунистической партии§! §4Александра Квасневского§!"
POL_zbigenev_and_vogel_case_desc: "Коррупционный скандал, затрагивающий высокопоставленных политиков и бизнесменов, раскрывающий мутные связи между государством, частными интересами и преступным миром в первые годы рыночной экономики Польши."
POL_orlen_case_tt: "Коррупционное дело о приватизации §0Orlen§!"
POL_election_2000_tt: "\n§RФокус будет автоматически пропущен после выборов 2000 года§!"

