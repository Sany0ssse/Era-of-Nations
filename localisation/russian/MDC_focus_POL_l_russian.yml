#Confederation Events
poland_confederation.1.t: "Исторические ценности"
poland_confederation.1.d: "История польского государства начинается в IX и X веках с западнославянских общин и простирается до Королевства Польского и Речи Посполитой. Наша история также имела трагические периоды, начиная с трёх разделов Польши между великими соседними державами и заканчивая Волынской резнёй и геноцидом польской нации украинскими националистами.\nНаша история велика и многогранна, мы никогда не должны забывать наше наследие, которое было завещано нам нашими предками и национальными героями от Болеслава I Храброго до Юзефа Пилсудского.\nПолитика нашей страны не может существовать без исторического руководства, и теперь мы стоим на пороге выбора, что важнее: предъявлять территориальные претензии к нашим соседям или сосредоточиться на развитии нашего культурного наследия."
poland_confederation.1.a: "Мы должны вернуть наши земли!"
poland_confederation.1.b: "Польская культура была и будет великой!"
POL_respect_for_historical_values_tt: "Произойдёт §YСобытие§!, которое заставит нас выбрать: §RТерриториальные претензии§! или §6Культурное наследие§!. §RВоенные амбиции§! или §6Мирное развитие§!."
poland_confederation.2.t: "Приверженность вере"
poland_confederation.2.d: "Католицизм — важная часть польской культуры. С древних времён поляки были верны своей вере, даже пережив Религиозные войны и Реформацию, не поддаваясь лютеранским и другим ересям. И сегодня крайне важно поддерживать приверженность вере среди населения Польского государства, чтобы сохранить наши традиционные и культурные ценности, прославляя Христа."
poland_confederation.2.a: "Слава Богу!"
poland_confederation.3.t: "Корвин приходит к власти в Польше"
poland_confederation.3.d: "Януш Корвин-Микке, член коалиционной партии Конфедерация Свобода и Независимость, долгое время был серым кардиналом партии. Его монархические и антизападные настроения давно сигнализировали о том, что партия движется к расколу. Постепенно набирая влияние в Сейме и Сенате, он получил достаточную власть, чтобы осуществить то, что стало известно как \"Политический гамбит Корвина\", и сместить своего коллегу Славомира Ментцена с поста главы государства. Его влияние в правительстве позволило Корвину легко установить своё доминирование в партии."
poland_confederation.3.a: "Посмотрим, что будет дальше."
poland_confederation.4.t: "Политический переворот в Польше"
poland_confederation.4.d: "Януш Корвин-Микке, член коалиционной партии Конфедерация Свобода и Независимость, долгое время был серым кардиналом партии. Его монархические и антизападные настроения давно сигнализировали о том, что партия движется к расколу. Постепенно набирая влияние в Сейме и Сенате, он получил достаточную власть, чтобы осуществить то, что стало известно как \"Политический гамбит Корвина\", и сместить своего коллегу Славомира Ментцена с поста главы государства. Его влияние в правительстве позволило Корвину легко установить своё доминирование в партии.\n\nРусофильская и антинатовская риторика Корвина ставит западный блок в трудное положение. Они явно потеряли ключевого игрока в самом центре Европы. А монархическая идеология Януша предсказывает вероятное возвращение роялизма в Польше, хотя это не определённо."
poland_confederation.4.a: "Посмотрим, что будет дальше."
poland_confederation.5.t: "Польша желает присоединиться к нашей фракции"
poland_confederation.5.d: "Сегодня польские дипломаты обратились к нам с предложением. Они хотят присоединиться к нашему альянсу.\nНовое польское правительство во главе с пророссийским президентом Янушем Корвин-Микке давно демонстрировало лояльность нам и даже вышло из альянса НАТО. Теперь они хотят присоединиться к нашему альянсу и готовы взять на себя двусторонние военные обязательства."
poland_confederation.5.a: "Добро пожаловать!"
poland_confederation.5.b: "Мы не хотели бы иметь с ними ничего общего."
poland_confederation.6.t: "Россия согласилась принять нас в альянс."
poland_confederation.6.d: "Россия согласилась принять нас в свой альянс. Отныне мы официально являемся членами альянса [SOV.GetFactionName] и имеем двусторонние обязательства перед Россией и другими членами альянса. Этот альянс приблизит нас к свержению американского империализма и поставит западных колонизаторов на место."
poland_confederation.6.a: "США будут в заднице!"
poland_confederation.7.t: "Россия отказалась принять нас в альянс."
poland_confederation.7.d: "Сегодня российские дипломаты ответили на нашу заявку. Они отказали в нашем запросе на присоединение к их альянсу. Видимо, они не очень заинтересованы в сотрудничестве с нами, или нам просто следовало отправить других дипломатов..."
poland_confederation.7.a: "Блядь..."
poland_confederation.8.t: "Польша присоединяется к [SOV.GetFactionName]"
poland_confederation.8.d: "Сегодня СМИ взорвались новостями: Польша и Россия подписали соглашения, согласно которым Польша официально присоединяется к [SOV.GetFactionName].\nОттепель в российско-польских отношениях давно подсказывалась новостями о возможном альянсе или военном сотрудничестве, но то, что было совершенно неожиданным, прежде всего для западного блока, — это полноценное вступление Польши в [SOV.GetFactionName].\nБелый дом ещё не прокомментировал этот вопрос, но дела явно идут не очень хорошо в Америке, поскольку Североатлантический альянс не только потерял такого важного игрока в Центральной Европе, но и получил нового врага в лице Польского государства, политика которого явно направлена на борьбу с американским глобальным влиянием."
poland_confederation.8.a: "Что будет дальше?"

