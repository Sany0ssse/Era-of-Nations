#Platforma Obywatelska Events
poland_po.1.t: "Майдан в Украине"
poland_po.1.d: "Майдан и гражданская война в Украине. Несколько республик, где в основном живут русские, угнетённые украинским неонацистским переворотом, восстают против нового правительства. Началась полномасштабная гражданская война. Новое украинское правительство обещает приблизиться к НАТО и начать европейскую интеграцию. Должны ли мы помочь нашим соседям подавить восстание?"
poland_po.1.a: "Война против нашего брата — наша война"
poland_po.1.b: "Мы отправим наёмников, чтобы помочь им"
poland_po.1.c: "Мы не будем помогать бандеровцам"
poland_po.2.t: "Польша хочет присоединиться к нашей войне"
poland_po.2.d: "Наши польские соседи обратились к нам с предложением. Они хотят помочь нам в нашем кризисе и, плечом к плечу, подавить сепаратистов. Вот что значит братство!"
poland_po.2.a: "Слава Украине!"
poland_po.2.b: "Мы справимся сами"
poland_po.3.t: "Польша хочет отправить наёмников"
poland_po.3.d: "Наши польские братья хотят помочь нам подавить сепаратистское восстание и предлагают нам несколько бригад своих наёмников. Они нам очень помогут."
poland_po.3.a: "Конечно, мы согласны"
poland_po.3.b: "Мы справимся сами"
poland_po.4.t: "Украина отказалась от нашей помощи"
poland_po.4.d: "Украина отказалась от нашей любезности. Ну, Бог им в помощь, если Россия вмешается за сепаратистов, они определённо не выдержат, но это не наша забота."
poland_po.4.a: "Интересно, сколько они продержатся?"

#Zjednoczona Prawica
POL_zjednoczona_prawica: "Объединённая правая"
POL_zjednoczona_prawica_desc: "'Объединённая правая' консолидирует различные консервативные, националистические и христианско-демократические партии в мощный электоральный блок, стремясь объединить раздробленную польскую правую под общим знаменем для обеспечения парламентского большинства."
POL_liga_i_samooborona: "Лига и Самооборона"
POL_liga_i_samooborona_desc: "Спорная коалиция между националистической Лигой польских семей и популистско-аграрной партией Самооборона, объединяющая социальный консерватизм с радикальным экономическим популизмом для вызова политическому истеблишменту."
POL_liga_polskich_rodzin: "Лига польских семей"
POL_liga_polskich_rodzin_desc: "Лига польских семей возникает как значительная сила, продвигающая смесь твёрдых католических ценностей, экономического национализма и скептической позиции по отношению к европейской интеграции."
POL_legacy_of_dmowski: "Наследие Дмовского"
POL_legacy_of_dmowski_desc: "Возрождение идеологического наследия Романа Дмовского, отца-основателя польского национализма, который подчёркивает национальный эгоизм, центральную роль католической церкви и глубоко укоренившийся скептицизм по отношению к Германии и еврейскому влиянию."
POL_moderate_nationalism: "Умеренный национализм"
POL_moderate_nationalism_desc: "Государственный патриотизм, подчёркивающий польскую культуру, историю и суверенитет, но стремящийся избежать крайностей ксенофобии и изоляционизма, позиционируя себя как защитника национальных интересов в международном сообществе."
POL_polish_ultranationalism: "Польский ультранационализм"
POL_polish_ultranationalism_desc: "Продвижение агрессивной, исключающей формы национализма, которая постулирует этническое и культурное превосходство поляков, рассматривает меньшинства как угрозу и выступает за однородное национальное государство."
POL_religious_xenophobia: "Религиозная ксенофобия"
POL_religious_xenophobia_desc: "Доктрина, переплетающая католический фундаментализм с враждебностью к внешним 'другим', обрамляя некatholicческих иммигрантов, либеральных элит ЕС и другие религии как экзистенциальные угрозы польской национальной и религиозной идентичности."
POL_prohibition_sale_lands_germans: "Запрет продажи земель немцам"
POL_prohibition_sale_lands_germans_desc: "Закон, явно запрещающий немецким гражданам покупать польскую землю, подпитываемый историческими обидами и страхами 'тихой экспансии' и немецкого экономического доминирования."
POL_poland_without_jews: "Польша без евреев"
POL_poland_without_jews_desc: "Продвижение идеала этно-государства, глубоко антисемитское видение Польши, очищенной от еврейского культурного, политического и экономического влияния, возвращающееся к довоенным националистическим идеологиям."
POL_we_dont_need_eu: "Нам не нужен ЕС"
POL_we_dont_need_eu_desc: "Радикальная политика, выступающая за 'Польский выход' — выход Польши из Европейского союза — которая обрамляется как необходимый шаг для восстановления полного национального суверенитета и сопротивления навязыванию либеральных, светских ценностей из Брюсселя."
POL_sovereign_economy: "Суверенная экономика"
POL_sovereign_economy_desc: "Экономическая модель, приоритизирующая государственный контроль и национальную собственность на ключевые отрасли, предназначенная для защиты Польши от глобальных рыночных колебаний и того, что воспринимается как иностранная экономическая эксплуатация."
POL_return_to_zloty: "Возврат к злотому"
POL_return_to_zloty_desc: "Популистский и экономически националистический спрос на отказ от евро и восстановление польского злотого как единственной национальной валюты, символизирующий отказ от более глубокой европейской интеграции и переутверждение денежного суверенитета."
POL_east_without_russia: "Восток без России"
POL_east_without_russia_desc: "Внешнеполитическая доктрина, направленная на создание блока восточноевропейских наций (таких как Украина, Беларусь и страны Балтии) под польским руководством, явно предназначенная для противодействия и сдерживания российского влияния."
POL_crush_pink_hyenas_of_mossad: "Раздавить розовых гиен Моссада"
POL_crush_pink_hyenas_of_mossad_desc: "Распространение злобной антисемитской теории заговора, утверждающей, что израильская разведка (Моссад) и глобальные еврейские интересы ('розовые гиены') работают над подрывом и контролем Польши."
POL_clerical_nationalism: "Клерикальный национализм"
POL_clerical_nationalism_desc: "Слияние католической доктрины с государственной политикой, направленное на создание политии, где национальная идентичность неотделима от римского католицизма, и церковь имеет значительное влияние на законодательство и общественную жизнь."
POL_introduce_death_penalty: "Ввести смертную казнь"
POL_introduce_death_penalty_desc: "Попытка восстановить смертную казнь за самые серьёзные преступления, апеллируя к популистским требованиям сурового правосудия и обрамляя как выражение национального суверенитета и 'воли народа'."
POL_protecting_traditional_family: "Защита традиционной семьи"
POL_protecting_traditional_family_desc: "Основной политический столп, определяющий 'традиционную семью' — состоящую в браке гетеросексуальную пару с детьми — как фундаментальную единицу общества и активно противостоящий правам ЛГБТ, половому воспитанию и феминизму как разрушительным силам."
POL_solidarity: "Солидарность"
POL_solidarity_desc: "Профсоюзное движение 'Солидарность' (Solidarność) возникает как массовая социальная и политическая сила, объединяющая рабочих, интеллектуалов и католическую церковь в мирной борьбе против коммунистического режима. Оно становится символом сопротивления и краеугольным камнем окончательного перехода Польши к демократии."
POL_moving_from_xenophobia: "Отход от ксенофобии"
POL_moving_from_xenophobia_desc: "Сознательные политические и социальные усилия по смягчению национального дискурса, отход от крайностей ксенофобии и изоляционизма. Этот путь стремится переопределить патриотизм как инклюзивную гражданскую идентичность, открытую для сотрудничества и диалога как с европейскими партнёрами, так и с этническими меньшинствами в стране."
POL_poland_above_all: "Польша превыше всего"
POL_poland_above_all_desc: "Патриотическая доктрина, ставящая национальные интересы, суверенитет и безопасность польского государства превыше всех других соображений как во внешней, так и во внутренней политике. Она выступает за сильную, независимую Польшу, устойчивую к внешнему давлению и внутреннему разделению."
POL_moderate_clericalism: "Умеренный клерикализм"
POL_moderate_clericalism_desc: "Признание особой роли католической церкви в польской культуре и общественной жизни, при стремлении к прагматическим отношениям, которые не достигают полной теократии, часто используя её как моральный ориентир для государственной политики."
POL_laws_on_catholic_values: "Законы о католических ценностях"
POL_laws_on_catholic_values_desc: "Принятие законодательства, которое напрямую включает католические моральные учения в государственный закон, потенциально ограничивая аборты, разводы и продвижение нетрадиционных образов жизни."
POL_national_liberal_policy: "Национально-либеральная политика"
POL_national_liberal_policy_desc: "Попытка синтезировать либеральные экономические принципы — такие как свободные рынки, приватизация и дерегулирование — с сильным акцентом на национальную идентичность, культурную традицию и государственный суверенитет. Эта политика стремится к процветанию через рыночные механизмы, защищая при этом отличный культурный и политический характер Польши."
POL_will_of_polish_people: "Воля польского народа"
POL_will_of_polish_people_desc: "Популистская доктрина, утверждающая, что легитимность правительства исходит исключительно от реализации недвусмысленной 'воли народа', часто используемая для оправдания преодоления институциональных сдержек и противовесов."
POL_european_international: "Европейский интернационал"
POL_european_international_desc: "Попытка создать общеевропейский альянс правых, консервативных и националистических партий для смещения политического центра тяжести ЕС от либерализма и федерализма к 'Европе отечеств'."
POL_join_eurozone: "Присоединиться к еврозоне"
POL_establish_partnership_with_russia: "Установить геополитическое партнёрство с Россией"
POL_establish_partnership_with_russia_desc: "Спорный геополитический поворот, стремящийся нормализовать и построить стратегическое партнёрство с Россией, основанное на общем славянском наследии и консервативных ценностях, при преуменьшении исторических конфликтов и текущих напряжений."
POL_homophobic_tendency: "Гомофобная тенденция"
POL_homophobic_tendency_desc: "Государственная или государственно-терпимая риторика и политика, маргинализирующие и стигматизирующие ЛГБТ-сообщество, изображая их как угрозу национальным ценностям и благополучию детей."
POL_condemn_lgbt_top_ec: "Осудить ЛГБТ-верхушку ЕК"
POL_condemn_lgbt_top_ec_desc: "Прямая конфронтация с Европейской комиссией, обвиняющая её руководство в навязывании 'ЛГБТ-идеологии' государствам-членам и нарушении национального суверенитета Польши и права на поддержание её культурных ценностей."
POL_renationalization_economy: "Ренационализация экономики"
POL_renationalization_economy_desc: "Политика обращения приватизации вспять и возвращения стратегических отраслей и активов, особенно проданных иностранным субъектам, под государственный контроль, чтобы обеспечить их служение 'национальным интересам'."
POL_catholic_social_teaching: "Католическое социальное учение"
POL_catholic_social_teaching_desc: "Реализация экономической политики, основанной на принципах католического социального учения, подчёркивающего достоинство труда, справедливую заработную плату, субсидиарность и отказ как от невмешательства капитализма, так и от государственного социализма."
POL_protectionalist_position: "Протекционистская позиция"
POL_protectionalist_position_desc: "Принятие высоких тарифов, субсидий для отечественных компаний и барьеров для иностранной собственности для защиты польских рабочих и отраслей от международной конкуренции."
POL_destroy_balc_children: "Уничтожить 'детей Бальцеровича'"
POL_destroy_balc_children_desc: "Символический и политический крестовый поход против элит и структур, связанных с пост-1989 либеральной экономической трансформацией ('дети Бальцеровича'), обвиняемых в социальном неравенстве и продаже страны иностранному капиталу."
POL_condemn_mcdonaldization_of_planet: "Осудить 'макдональдизацию планеты'"
POL_condemn_mcdonaldization_of_planet_desc: "Культурная и идеологическая позиция против американской глобализации, которая рассматривается как разрушающая национальные традиции, продвигающая потребительство и навязывающая гомогенизированную, декадентскую культуру Польше."
POL_publication_secret_police_archives: "Публикация архивов тайной полиции"
POL_publication_secret_police_archives_desc: "Политика полной прозрачности, публикация архивов тайной полиции коммунистической эпохи (СБ) для разоблачения коллаборационистов, урегулирования исторических счетов и очистки общественной жизни от тех, кто связан с бывшим режимом."
POL_protection_polish_property: "Защита польской собственности"
POL_protection_polish_property_desc: "Законодательство для предотвращения продажи сельскохозяйственных земель, лесов и стратегических предприятий иностранным субъектам, особенно нацеленное на немецких и голландских покупателей, чтобы сохранить польскую собственность в польских руках."

