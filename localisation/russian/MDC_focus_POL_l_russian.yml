poland_sejm.1.t: "Сейм требует увеличить социальные расходы"
poland_sejm.1.d: "На заседании Сейма было принято коллективное решение увеличить социальные расходы. Сейм считает, что граждане Польши заслуживают лучшей жизни, чем сейчас. Примем ли мы их требования?"
poland_sejm.1.a: "Принять требования Сейма"
poland_sejm.1.b: "Отклонить требования Сейма"
poland_sejm.1.c: "Использовать вето"
poland_sejm.2.t: "Сейм требует увеличить расходы на здравоохранение"
poland_sejm.2.d: "На заседании Сейма было принято коллективное решение увеличить расходы на здравоохранение. Сейм считает, что государство должно лучше заботиться о здоровье польских граждан. Примем ли мы их требования?"
poland_sejm.3.t: "Сейм требует увеличить расходы на образование"
poland_sejm.3.d: "На заседании Сейма было принято коллективное решение увеличить расходы на образование. Сейм считает, что образование должно быть более доступным польским гражданам. По их мнению, это увеличит число квалифицированных специалистов и снизит безработицу. Примем ли мы их требования?"
poland_sejm.4.t: "Сейм требует снизить расходы на полицию"
poland_sejm.4.d: "На заседании Сейма было принято коллективное решение снизить расходы на полицию. Сейм считает, что сильное полицейское давление угрожает демократии и свободам граждан Польши. Примем ли мы их требования?"
poland_sejm.5.t: "Сейм требует снизить военные расходы"
poland_sejm.5.d: "На заседании Сейма было принято коллективное решение снизить военные расходы. Сейм считает, что наша страна тратит слишком много на оборону. Сейм осуждает милитаризацию Польши и требует снижения оборонного бюджета. Примем ли мы их требования?"
poland_sejm.6.t: "Сейм требует снизить подоходный налог"
poland_sejm.6.d: "На заседании Сейма было принято коллективное решение снизить подоходный налог. Сейм считает, что польские граждане переплачивают налоги, что снижает уровень жизни. Примем ли мы их требования?"
poland_sejm.7.t: "Сейм требует снизить корпоративный налог"
poland_sejm.7.d: "На заседании Сейма было принято коллективное решение снизить корпоративный налог. Сейм считает, что высокие налоги мешают развитию бизнеса и негативно влияют на экономику. Примем ли мы их требования?"
poland_tax.1.t: "Изменить подоходный налог"
poland_tax.1.d: "Хотите ли вы вынести предложение в Сейм об увеличении подоходного налога? Снова такое предложение можно будет внести только через месяц."
poland_tax.1.a: "Увеличить подоходный налог"
poland_tax.1.b: "Снизить подоходный налог"
poland_tax.2.t: "Увеличить подоходный налог"
poland_tax.2.desc: "Вы действительно хотите увеличить подоходный налог? Это увеличит наши налоговые поступления, но увеличит и затраты на социальную сферу и здравоохранение."
poland_tax.2.a: "Увеличить налог на 5"
poland_tax.2.b: "Увеличить налог на 3"
poland_tax.2.c: "Увеличить налог на 1"
poland_tax.2.d: "Вернуться на предыдущую страницу"
poland_tax.3.t: "Снизить подоходный налог"
poland_tax.3.desc: "Вы действительно хотите снизить подоходный налог? Это уменьшит налоговые поступления, но снизит затраты на социальную сферу и здравоохранение."
poland_tax.3.a: "Снизить налог на 5"
poland_tax.3.b: "Снизить налог на 3"
poland_tax.3.c: "Снизить налог на 1"
poland_tax.4.t: "Изменить корпоративный налог"
poland_tax.4.d: "Хотите ли вы внести в Сейм предложение об увеличении корпоративного налога? Снова подать такое предложение можно будет только через месяц."
poland_tax.4.a: "Увеличить корпоративный налог"
poland_tax.4.b: "Снизить корпоративный налог"
poland_tax.5.t: "Увеличить корпоративный налог"
poland_tax.5.desc: "Действительно увеличить корпоративный налог? Это увеличит наши налоговые доходы, но уменьшит производительность и количество заводов."
poland_tax.6.t: "Снизить корпоративный налог"
poland_tax.6.desc: "Действительно снизить корпоративный налог? Это уменьшит налоговые доходы, но увеличит производительность и количество заводов."
poland_tax.7.t: "Инвестиции в энергетику"
poland_tax.7.d: "В рамках ежегодного экономического плана в сейме обсуждался вопрос инвестиций в энергетику. Какие электростанции нам стоит строить?"
poland_tax.7.a: "Возобновляемые источники энергии"
poland_tax.7.b: "Традиционная генерация (ископаемое топливо)"
poland_sejm.8.t: "Вотум недоверия"
poland_sejm.8.d: "Господин президент, Сейм Республики Польша, явно недовольный нашей политикой, вынес вотум недоверия. Вам необходимо покинуть пост президента, в стране пройдут досрочные выборы."
poland_sejm.8.a: "О КУРВА!"
#Senat
POL_Senat_category: "Сенат Республики Польша"
POL_Senat_category_desc: "§tСенат Республики Польша§! — верхняя палата польского парламента, осуществляющая законодательную власть; в отличие от сейма не осуществляет контроль над исполнительной властью.\n\n§YПрезидент Польши§! — представитель исполнительной ветви; он может изменять законы только через сенат. Попытка самостоятельной смены законов обойдётся нам §Rв десять раз дороже§! в £pol_power_icon политической власти.\n\nИмейте в виду, что изменение законов влияет и на §3одобрение Сейма§!. §GУвеличение расходов§! типа социальных или здравоохранения §Gповышает одобрение§!, а §Rснижение§! — §Rуменьшает§!. Также §Gувеличение расходов§! на §Rоборону§! или §Rполицию§! будет §Rснижать одобрение§! сейма, и наоборот.\n\n\n\n\n\n\n£GFX_POL_senate_decision_category_picture \n\n\n\n\n\n"
