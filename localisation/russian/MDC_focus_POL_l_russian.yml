poland_intermarium.4.t: "Польша провозгласила создание Междуморья"
poland_intermarium.4.d: "Сегодня польское правительство объявило о провозглашении Междуморья. Этот проект долгое время был мечтой польской нации и символом величия Польского государства. Успешная внешняя политика Польской Республики давно намекала на цель польского правительства по созданию Междуморья, и сегодня они наконец объявили о завершении подготовки к этой давней мечте."
poland_intermarium.4.a: "Что за...?"
poland_intermarium.5.t: "Польша провозгласила создание Конфедерации Междуморья"
poland_intermarium.5.d: "Сегодня польское правительство объявило о провозглашении Междуморья в форме Конфедерации. Этот проект долгое время был мечтой польской нации и символом величия Польского государства. Успешная внешняя политика Польской Республики давно намекала на цель польского правительства по созданию Междуморья, и сегодня они наконец объявили о завершении подготовки к этой давней мечте."
poland_intermarium.5.a: "Что за...?"
poland_intermarium.6.t: "Польша запустила план «Прометей»"
poland_intermarium.6.d: "Прометеизм — это политическая концепция и движение, направленное на освобождение нерусских народов от власти Российской империи, а позже и Советского Союза, с конечной целью содействия распаду этих многонациональных государств. Основные цели этого геополитического проекта были сформулированы Юзефом Пилсудским ещё в 1904 году в меморандуме японскому правительству; сама концепция развивалась как сотрудничество между эмигрантскими национальными движениями и государственными структурами Второй Польской Республики.\nПосле провозглашения Междуморья Польша решила объявить полномасштабную войну России, где прометеизм является главной целью и военной доктриной польской стороны."
poland_intermarium.6.a: "Что будет дальше?"
