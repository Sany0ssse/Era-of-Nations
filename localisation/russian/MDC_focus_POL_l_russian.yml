# Monarchists AI loc
POL_return_monarchy_desc: "Радикальное политическое движение набирает обороты, выступая за отмену республики и восстановление польской монархии как единственной законной и исторической формы правления для нации, способной положить конец партийному хаосу."
POL_union_of_real_political_desc: "Союз Реальной Политики (СРП) появляется как стойкий защитник радикального либертарианства, монархизма и строгой, неинтервенционистской внешней политики, становясь идеологическим ядром антиистеблишментных правых."

POL_rise_korwin_micke_desc: "Януш Корвин-Микке, ветеран антикоммунистической оппозиции и провокатор, поднимается к известности со своей бескомпромиссной защитой свободных рынков, традиционных ценностей и спорной, реалистичной внешней политики."

POL_szlachecka_democracy_desc: "Продвижение модернизированной версии Шляхетской демократии (Золотая вольность), выступая за высоко децентрализованное государство с мощным законодательным органом избранных представителей и слабой исполнительной властью."

POL_eliminate_volatility_desc: "Попытка конституционных реформ для создания более стабильной, менее партийной политической системы, потенциально через сильную неизбираемую исполнительную власть (монарх или президент) для обуздания влияния краткосрочных парламентских большинств."

POL_elite_update_desc: "Призыв к полной перестройке политической и медиа-элиты, которую Корвин-Микке обвиняет в посткоммунистическом менталитете и некомпетентности, для замены новым классом либертариански настроенных патриотов."

POL_korwin_policy_desc: "Реализация последовательного политического курса, сочетающего ультралиберальную экономику (отмена налогов, дерегуляция) со стойким социальным консерватизмом и неинтервенционистской, реалистичной внешней политикой."

POL_economic_liberalism_desc: "Непреклонное стремление к минимальному государству, включающее отмену подоходного налога, демонтаж социального обеспечения и полную дерегуляцию экономики для достижения абсолютной экономической свободы."

POL_problem_migration_desc: "Твёрдая позиция против иммиграции, особенно из-за пределов Европы, представленная как угроза социальной сплочённости, культурной идентичности и фискальной стабильности минимального государства."

POL_supporting_financial_education_desc: "Политика внедрения экономики и финансовой грамотности в школьную программу для воспитания нового поколения финансово ответственных и предпринимательски настроенных граждан."

POL_anti_bureaucracy_desc: "Систематическая война с бюрократическими препонами, направленная на отмену тысяч правил и упрощение правовой системы для раскрепощения предпринимательской энергии."

POL_fignting_inflation_desc: "Приверженность ультражёсткой валютной политике, потенциально включая возврат к золотому стандарту или создание частных валют, для устранения инфляции, которая рассматривается как государственная кража."

POL_korvinkoin_desc: "Официальная государственная поддержка и запуск криптовалюты ('Корвинкоин'), обеспеченной золотом или другими реальными активами, предназначенной служить стабильной и надёжной альтернативой государственным фиатным деньгам."

POL_fall_republic_desc: "Идеологическое убеждение, что Третья Польская Республика является незаконным и провалившимся государством, которое должно быть позволено пасть и заменено новым политическим порядком, будь то монархия или конфедерация."

POL_reform_sejm_desc: "Радикальная реформа парламента для резкого сокращения его размера, полномочий и стоимости, превращая его в неполный рабочий день орган с ограниченной способностью вмешиваться в экономику и жизнь граждан."

POL_protection_traditional_values_desc: "Использование государственной власти для защиты и продвижения традиционных семейных структур и католических ценностей, рассматриваемых как необходимый противовес социальной вседозволенности, обеспеченной экономической свободой."

POL_conservative_authoritarianism_desc: "Пропаганда сильного, авторитарного государства в социальной и политической сфере для обеспечения порядка и традиционной морали, сохраняя при этом невмешательство в экономику."

POL_king_janusz_i_desc: "Коронация Януша Корвин-Микке как короля Януша I, установление новой конституционной монархии с монархом, обладающим значительной исполнительной властью для вето на законодательство и руководства государственной политикой."

POL_decentralization_power_desc: "Массовая передача власти от центрального правительства к местным воеводствам и муниципалитетам, направленная на создание децентрализованного, федеративного государства."

POL_constitutional_monarchy_desc: "Установление конституционной монархии, где полномочия короля сбалансированы реформированным и ограниченным парламентом, придерживающимся новой, либертарианско-консервативной конституции."

POL_restor_kingdom_of_poland_desc: "Формальное провозглашение Королевства Польши, завершение республиканской эры и восстановление монархической системы, укоренённой в исторической государственности Польши."

POL_poland_without_eu_desc: "Немедленное начало 'Польэкзита' — выхода Польши из Европейского союза — рассматриваемое как фундаментальный шаг к возвращению национального суверенитета и экономической свободы."

POL_reconciliation_with_russia_desc: "Внешняя политика прагматического примирения с Россией, аргументируя экономическое сотрудничество и неприсоединение, основанное на реалистичном принципе, что Польша не должна быть пешкой в конфликтах США и России."
POL_populism_of_latin_civilization_desc: "Культурная политика, продвигающая идею Польши как оплота латинской (западной) цивилизации, определяемой её римским католицизмом и греко-римским философским наследием, против как восточного деспотизма, так и внутреннего разложения."

POL_restor_kingdom_of_poland_tt_desc: "Историческое провозглашение Второго Королевства Польши объявлено, формально распуская республику и открывая новую эру монархического правления под новой династией или избранным королём."
POL_confederation_polish_crown_desc: "Конфедерация Польской Короны Гжегожа Брауна появляется как самая радикальная, теократическая и антисистемная фракция, выступающая за католическую фундаменталистскую революцию."

POL_grzegorz_braun_desc: "Гжегож Браун поднимается как пламенный, провокационный лидер, известный своими крайними заявлениями и прямыми действиями, отстаивающий программу католического фундаментализма и физического устранения своих политических врагов."

POL_cleanse_poland_dirt_desc: "Призыв к национальному и духовному очищению Польши от всех воспринимаемых внутренних и внешних врагов, используя любые необходимые средства, чтобы 'спасти тех, кого можно спасти'."

POL_get_out_of_warsaw_desc: "Символический и буквальный призыв перенести столицу из Варшавы, которая рассматривается как коррумпированный центр посткоммунистического и иностранного влияния, в более 'польский' город."

POL_media_control_desc: "Полный государственный захват всех СМИ или их принудительное выравнивание с католическими и национальными ценностями, чтобы положить конец влиянию 'иностранных агентов' и 'либеральной пропаганды'."

POL_adopt_law_foreign_agents_desc: "Принятие строгого закона, требующего от всех организаций, получающих иностранное финансирование, регистрироваться как 'иностранные агенты', подвергая их проверке и ограничениям."

POL_separate_lobbyisys_from_media_desc: "Закон для юридического принуждения разделения между владением СМИ и политическим лоббизмом, направленный на разрыв медиа-конгломератов, считающихся враждебными Польше."

POL_shoot_journalists_desc: "Крайний и буквальный призыв к казни журналистов из крупных либеральных СМИ, таких как Gazeta Wyborcza и TVN, которых Браун обвиняет в государственной измене."

POL_stop_propaganda_of_perverts_desc: "Государственный разгром любого публичного выражения или продвижения прав ЛГБТ, названного 'пропагандой извращенцев', через цензуру и уголовные наказания."

POL_destroy_jewish_reservations_desc: "Насильственная антисемитская политика, направленная на демонтаж еврейских культурных и общинных учреждений в Польше, которые ложно изображаются как враждебные, иностранные анклавы."

POL_ban_satanic_holiday_desc: "Юридический запрет Хэллоуина и других культурных импортов, считающихся 'сатанинскими' и разъедающими традиционную польскую католическую культуру."

POL_purge_protestant_heretics_desc: "Политика государственной дискриминации протестантских и других некатолических христианских конфессий, рассматриваемых как еретические секты, подрывающие религиозное единство Польши."

POL_establish_inquisition_desc: "Создание государственного органа, смоделированного на исторической инквизиции, для выявления и наказания ереси, богохульства и оппозиции католической доктрине."

POL_flagellation_lgbt_activists_desc: "Публичное одобрение и использование телесных наказаний против ЛГБТ-активистов как средства 'морального исправления' и общественного сдерживания."

POL_crush_tribal_chauvinism_desc: "Кампания против региональных идентичностей и прав меньшинств (например, силезцев), навязывание однородной, определённой государством польской национальной идентичности."

POL_raids_enemies_poland_desc: "Использование государственных сил безопасности для проведения рейдов и преследования лиц и организаций, официально обозначенных как 'враги Польши'."

POL_arm_country_desc: "Политика всеобщего обучения обращению с огнестрельным оружием и либерализации законов об оружии для создания вооружённого гражданского населения, готового защищать нацию и веру."

POL_challenge_eu_desc: "Политика открытой конфронтации с Европейским союзом, отвергая его законы и авторитет, и подготовка к потенциальному выходу или исключению."

POL_second_eternal_peace_desc: "Внешнеполитическая доктрина, направленная на обеспечение восточных границ Польши через великий, постоянный мирный договор с Россией, даже ценой крупных уступок."

POL_szczesc_boze_desc: "Символический девиз ('Счастливого пути!'), отмечающий начало теократической и национальной революции, призывающий божественное благословение для радикального преобразования государства."

POL_dissolve_sejm_desc: "Односторонний роспуск нижней палаты парламента (Сейм), признанной безнадёжно коррумпированной, и её замена чрезвычайным правящим советом."

POL_dissolve_senate_desc: "Отмена Сената, верхней палаты парламента, как избыточного и препятствующего института в новой, централизованной модели государства."
POL_stop_receiving_foreign_funding_desc: "Закон, криминализирующий получение иностранного финансирования для польских НПО, политических партий и СМИ, обвиняемых в том, что они являются инструментами иностранного влияния."

POL_equal_access_to_market_desc: "Экономическая политика, направленная на дробление монополий и создание равных условий для польского малого и среднего бизнеса."

POL_healthcare_reform_desc: "Полная перестройка системы здравоохранения, хотя её конкретные детали размыты и сводятся к «очищению от предполагаемой коррупции и неэффективности»."

POL_hang_president_of_health_fund_desc: "Прямой призыв к казни через повешение главы Национального фонда здоровья, признанного ответственным за провалы системы."

POL_solving_electricity_problems_desc: "Государственная программа по достижению энергетической независимости, приоритизирующая угольную и ядерную энергетику при отказе от климатической политики ЕС."

POL_allow_nuclear_energy_desc: "Запуск национальной программы ядерной энергетики со значительными государственными субсидиями, подаваемой как вопрос национальной безопасности и независимости."

POL_acquier_nuclear_weapons_desc: "Высокоприоритетный национальный проект по приобретению ядерного оружия любыми необходимыми средствами для гарантии окончательного средства сдерживания Польши."

POL_destroy_israel_desc: "Принятие в качестве цели внешней политики геноцидального призыва к уничтожению Государства Израиль, основанного на радикальных антисемитских теориях заговора."

POL_catholic_traditionalism_desc: "Насаждение традиционалистского католицизма, отвергающего реформы Второго Ватиканского собора, в качестве единственно допустимой религиозной практики в публичной жизни."

POL_celebrating_latin_civilization_desc: "Государственное продвижение латинского и римско-католического наследия Польши как высшей культурной ценности, противостоящей как восточному православию, так и западному секуляризму."

POL_purge_polish_bishops_conference_desc: "Поддерживаемая государством чистка основного польского епископата, считающегося слишком либеральным и примиренческим, с заменой на традиционалистское, непримиримое духовенство."

POL_only_eternal_king_of_poland_desc: "Официальная государственная доктрина, признающая Иисуса Христа единственным истинным и вечным Королём Польши, подчиняющая всю временную власть — власти божественной."

POL_saint_regent_braun_desc: "Гжегож Браун, провозгласивший себя «Святым Регентом» Польши, правящим от имени Христа-Царя и обладающим абсолютной теократической властью."

POL_overthrow_rzeczpospolita_desc: "Финальный революционный акт по свержению Польской Республики (Rzeczpospolita) и всех её институтов, объявленных нелегитимными и безбожными."

POL_fourth_kingdom_of_poland_desc: "Провозглашение Четвёртого Королевства Польши, теократического государства, основанного на католическом фундаменталистском праве и управляемого Регентом от имени Христа-Царя."

POL_together_with_russia_against_usa_desc: "Полная стратегическая переориентация на Россию, формирование альянса на основе общих «традиционных ценностей» и совместного противостояния американской глобальной гегемонии и либеральной демократии."

POL_conquest_baltic_sea_desc: "Грандиозная стратегическая цель — установить абсолютную польскую гегемонию над Балтийским морем, превратив его в «Mare Nostrum» для защиты торговых путей и проекции силы в сторону Скандинавии и Германии."

POL_control_danish_straits_desc: "Стремление установить прямой или косвенный военный контроль над датскими проливами (Эресунн и Бельты), что даст Польше решающие рычаги влияния на весь морской трафик между Балтийским и Северным морями."

POL_force_sweden_into_union_desc: "Смелый план подчинить Королевство Швецию с помощью военной силы и дипломатического давления, принудив его к личной или политической унии под польской короной для нейтрализации исторического соперника."

POL_pressure_visegrad_desc: "Оказание интенсивного дипломатического и экономического давления на соседей по Вышеградской группе (Чехия, Словакия, Венгрия) с целью подчинить их воле Варшавы и превратить альянс в польско-центричный блок."

POL_polish_bohemian_union_desc: "Стремление к политической унии с чешскими землями (Богемией) — через династические средства или принуждение — чтобы объединить западнославянские народы под польским руководством."

POL_return_moravia_desc: "Возрождение исторических территориальных претензий на регион Моравия с целью отделить его от чешского государства и напрямую интегрировать в польскую сферу."

POL_force_austria_into_union_desc: "Дерзкий план принудить Австрийскую Республику, осколок старой империи Габсбургов, к подчинённой унии с Польшей, перекроив карту Центральной Европы."

POL_polish_reconquista_desc: "Национальная миссия, подаваемая как «реконкиста» исторических восточных территорий Речи Посполитой (Кресы), утраченных после Второй мировой войны."

POL_alliance_intermarium_desc: "Формальное создание военно-политического альянса — «Междуморье» (Międzymorze) — от Балтики до Чёрного моря с Польшей в качестве бесспорного лидера и гегемона."

POL_lavrov_rotfeld_pact_desc: "Гипотетический, спорный пакт с Россией (названный в честь министров иностранных дел) о формальном разделе сфер влияния в Восточной Европе, вероятно, за счёт Украины и Беларуси."

POL_belarusian_consensus_desc: "Политика, направленная на достижение политического урегулирования в Беларуси путём либо установления марионеточного правительства, либо организации её полной аннексии в польскую сферу влияния."

POL_assimilation_eastern_lands_desc: "Систематическая политика культурной и языковой ассимиляции населения вновь приобретённых восточных территорий для обеспечения их постоянной интеграции в польскую нацию."

POL_polinization_new_territories_desc: "Активное поощрение польского заселения и подавление местных украинской, белорусской и литовской культур на аннексированных землях для изменения демографического баланса."

POL_partition_ukrain_desc: "Реализация плана по расчленению украинского государства с присвоением его западных регионов (Галичина, Волынь) Польшей, потенциально в координации с другими региональными державами."

POL_second_union_lublin_desc: "Провозглашение нового политического союза с Литвой (и, возможно, другими нациями) по образцу исторической Люблинской унии 1569 года, но с безоговорочным доминированием Польши."

POL_vassalize_courland_desc: "Превращение Латвии (исторически включавшей Курляндское герцогство) в вассальное государство для закрепления её портов и ресурсов за польско-центричным блоком."

POL_invasion_baltics_desc: "Военная операция по вторжению и оккупации прибалтийских государств (Эстония и Латвия), рассматриваемая как необходимый шаг для защиты балтийского фланга и устранения потенциальных противников."

POL_restor_pol_hin_union_desc: "Возрождение исторической польско-венгерской унии, прочное введение Венгрии в орбиту Варшавы в качестве младшего партнёра в новой центральноевропейской констелляции."

POL_conquest_slovakia_desc: "Использование военной силы для завоевания Словакии, оправдываемое историческими претензиями или предлогом «защиты» региона, и её интеграция в расширяющееся польское государство."

POL_claims_to_croatia_desc: "Заявление о далёких исторических и династических претензиях на Хорватию с целью введения этой адриатической нации в сферу польского влияния или контроля."

POL_claims_to_slovenia_desc: "Выдвижение спорных исторических претензий на Словению с целью расширения польского влияния до Альп и северной части Балкан."

POL_polish_latin_union_desc: "Идеологический и политический проект по объединению преимущественно католических (латинского обряда) народов Центральной Европы под польским руководством как бастиона против восточного православия и западного секуляризма."

POL_to_terrify_balkans_desc: "Политика расчётливых военных демонстраций и политического принуждения для устрашения балканских государств, обеспечения их compliance с польскими стратегическими интересами в регионе."

POL_polish_bulgarian_pact_desc: "Заключение стратегического пакта с Болгарией для раскола православного славянского мира и обретения ключевого союзника с выходом к Эгейскому морю."

POL_partition_romania_desc: "План территориального расчленения Румынии, вероятно, в координации с другими державами, такими как Венгрия и Болгария, с целью претендовать на регион Буковина и ослабить регионального конкурента."

POL_anti_turkish_coalition_desc: "Формирование широкой коалиции европейских и региональных держав с явной целью сдерживания и отката турецкого влияния на Балканах и в Черноморском регионе."

POL_polish_greek_treaty_desc: "Подписание стратегического договора с Грецией, объединяющего две традиционные державы против общих угроз и обеспечивающего надёжного партнёра в Восточном Средиземноморье."

POL_connect_cyprus_desc: "Амбициозная, но размытая геополитическая концепция по вводу Кипра в сферу польского влияния для проекции силы вглубь Средиземноморья."

POL_subordination_of_moldova_desc: "Превращение Молдовы в польское государство-клиент, отрезание её от румынского влияния и закрепление плацдарма между Украиной и Балканами."

POL_transnistrian_issue_desc: "Использование замороженного конфликта в Приднестровье для дестабилизации Молдовы и создания постоянного рычага влияния как на Молдову, так и на Украину."

POL_avenge_molotov_ribbentrop_desc: "Внешнеполитическая доктрина, движимая исторической обидой и стремящаяся силой и пересмотром границ ниспровергнуть геополитический порядок, установленный пактом Молотова-Риббентропа."
