#PiS AI 
POL_pis_desc: "Право и справедливость (PiS) укрепляет свою позицию как доминирующая консервативная и правая партия Польши, отстаивая платформу социального традиционализма, экономического перераспределения и сильного, суверенного государства."
POL_illiberal_democracy_desc: "Реализация политической модели, которая приоритизирует 'волю большинства' и национальный суверенитет над либеральными сдержками и противовесами, бросая вызов фундаментальным ценностям ЕС путём концентрации власти в исполнительной власти и подчинения судебной власти."
POL_antipode_kwasnewski_desc: "Сознательный идеологический разрыв с центристским, прагматичным и проевропейским наследием президента Александра Квасневского, знаменующий сдвиг к консервативным ценностям, исторической политике и более конфронтационной позиции в ЕС."
POL_moral_revolution_desc: "Масштабный культурный и политический проект, направленный на очищение Польши от воспринимаемого морального упадка и посткоммунистического мышления Третьей Республики, обещающий новую эру добродетели, патриотизма и традиционных ценностей."
POL_dissociate_from_third_rzeczospolita_desc: "Фундаментальная политика отказа от политического и экономического урегулирования пост-1989 Польши, которую PiS характеризует как коррумпированный 'уклад' (сделку) между посткоммунистическими элитами и либеральными реформаторами, предавшими обычных поляков."
POL_fourth_rzeczospolita_desc: "Провозглашённая цель построения 'Четвёртой Республики' — нового государственного порядка, заменяющего несовершенную Третью Республику, сосредоточенного на сильной исполнительной власти, социальной солидарности и переутверждении польской национальной идентичности."
POL_wrest_poland_from_left_desc: "Объявленная война 'левой элите', обвиняемой в доминировании над общественными СМИ, культурой и судебной властью с 1989 года, с целью возвращения государства 'истинным патриотам'."
POL_restriction_freedom_desc: "Введение законодательства, которое критики утверждают, ограничивает гражданские свободы, особенно нацеленное на свободу собраний и выражения мнений, особенно для ЛГБТ-активистов и протестующих против правительства, во имя общественного порядка и моральных норм."
POL_media_censorship_desc: "Систематический захват и трансформация общественных вещателей в рупоры правительства, в сочетании с правовым и экономическим давлением на независимые частные СМИ, чтобы обеспечить благоприятный информационный ландшафт для правящей партии."
POL_ban_lgbt_desc: "Продвижение 'зон, свободных от ЛГБТ' и законодательства, направленного на ограничение способности ЛГБТ-групп собираться и отстаивать свои права, обрамлённое как защита детей от 'идеологии' и защита традиционных семей."
POL_fighting_lgbt_indoctrination_desc: "Политическая инициатива, нацеленная на то, что воспринимается как продвижение ЛГБТ-идеологии в школах и общественной жизни, направленная на защиту польской молодёжи от влияний, считающихся противоречащими традиционным католическим ценностям."
POL_neoclericalism_desc: "Установление нового, мощного альянса между государством и католической церковью, предоставляя ей значительное влияние на законодательство, образование и культуру, и делая религиозную доктрину руководящим принципом государственной политики."
POL_defending_christian_values_desc: "Центральный принцип культурной политики правительства, активно противостоящий секуляризации и продвигающий католическую идентичность Польши как основу нации, как внутри страны, так и как отличительную позицию в ЕС."
POL_independence_judiciary_desc: "Спорная и обширная перестройка судебной системы, которую правительство аргументирует как необходимую для очищения от посткоммунистических судей и повышения эффективности судебной власти, но которую ЕС и критики осуждают как политизированное нападение на судебную независимость."
POL_state_judicial_council_desc: "Реформа Национального совета судебной власти для предоставления парламенту и исполнительной власти прямого контроля над назначением судей, ключевой элемент в битве правительства за влияние на суды."
POL_question_presumptiom_innocence_desc: "Правовые изменения, которые усиливают обвинение и ограничивают права обвиняемых, оправданные как необходимые для эффективной борьбы с коррупцией и преступностью, но вызывающие опасения по поводу эрозии фундаментальных правовых принципов."
POL_central_biuro_antikorupcyjne_desc: "Расширение полномочий Центрального антикоррупционного бюро (ЦАБ) для превращения его в основной инструмент расследования и нацеливания на политических оппонентов и чиновников из предыдущих правительств под знаменем подлинной антикоррупционной борьбы."
POL_crush_political_lobbyists_desc: "Объявленный разгром непрозрачных сетей влияния между бизнесом и политикой ('лоббисты' или 'уклад'), которые PiS клянётся разобрать для создания государства, служащего народу, а не особым интересам."
POL_overthrow_uklad_desc: "Всеобъемлющая миссия по разбору укоренившейся системы интересов, связывающей бизнес, политику и СМИ, которая якобы правила Польшей после 1989 года, заменяя её новой лоялистской элитой."
POL_pis_deprivatization_desc: "Политика пересмотра и иногда обращения вспять приватизаций 1990-х и 2000-х годов, особенно стратегических активов, чтобы вернуть их под государственный контроль по причинам национальных интересов и экономического суверенитета."
POL_lowering_retirement_age_desc: "Выполнение ключевого предвыборного обещания обратить вспять пенсионную реформу предыдущего правительства, снизив пенсионный возраст до 60 лет для женщин и 65 лет для мужчин в честь 'социальной солидарности'."
POL_fighting_national_debt_desc: "Фокус на фискальной ответственности через контролируемые расходы и устойчивый экономический рост, направленный на снижение бремени государственного долга без отката флагманских программ социальных расходов."
POL_reductional_income_tax_desc: "Введение значительного снижения налогов для подавляющего большинства работников, популярная политика, предназначенная для увеличения располагаемого дохода и выполнения обещания партии о более справедливом экономическом перераспределении."
POL_increase_minimum_wage_desc: "Серия существенных, установленных государством повышений минимальной заработной платы, направленная на улучшение уровня жизни самых низкооплачиваемых работников и снижение экономического неравенства."
POL_support_for_startups_desc: "Государственные программы, предлагающие финансирование и стимулы для технологических инноваций и новых предприятий, направленные на модернизацию польской экономики и снижение её зависимости от иностранных инвестиций в низкоценностных секторах."
POL_stabilization_pension_provision_desc: "Реформы пенсионной системы, направленные на обеспечение её долгосрочной финансовой стабильности, сложная задача среди затрат популярных социальных программ и демографического сдвига."
POL_decommunization_program_desc: "Систематические усилия по удалению символов и названий коммунистической эпохи из общественных пространств, наряду с проверкой государственных чиновников на сотрудничество с бывшими спецслужбами."
POL_exposing_ppr_desc: "Открытие архивов тайной полиции и публичное называние предполагаемых коллаборационистов из коммунистического периода (ПНР), используемое для дискредитации политических оппонентов и формирования исторического нарратива."
POL_reorganization_biuro_biezpieczenstwa_desc: "Реформа Бюро национальной безопасности для усиления исполнительного контроля над разведывательным и контрразведывательным аппаратом, обеспечивая его лояльность и соответствие правительственной политике."
POL_prohibition_propaganda_totalitarianism_desc: "Закон, криминализирующий продвижение коммунистических или других тоталитарных идеологий, направленный на юридическое закрепление конкретного исторического нарратива и наказание за его нарушение."
POL_ukr_strategic_partnership_desc: "Развитие тесного стратегического партнёрства с Украиной, основанного на общих проблемах безопасности относительно России, при одновременном навигации сложных исторических вопросов, таких как Волынская резня."
POL_aim_coop_baltic_desc: "Внешнеполитический приоритет углубления военного, экономического и политического сотрудничества со странами Балтии (Литва, Латвия, Эстония), рассматриваемыми как естественные союзники против российской агрессии."
POL_baltic_pact_desc: "Попытка формализовать оборонительный и безопасный пакт среди государств Балтийского моря, усиливающий региональную солидарность и возможности сдерживания перед лицом возрождающейся России."
POL_three_seas_initiative_desc: "Активное лидерство в 'Инициативе трёх морей', форуме стран ЕС между Балтийским, Адриатическим и Чёрным морями, направленном на повышение инфраструктуры, энергетической безопасности и политической сплочённости для противодействия российскому и немецкому влиянию."
POL_visit_to_serbia_desc: "Дипломатическое обращение к Сербии, стремящееся укрепить связи с традиционным славянским и православным партнёром на Балканах и противодействовать западному влиянию в регионе."
POL_turn_caucasus_desc: "Дипломатический поворот к региону Кавказа (Азербайджан, Грузия), направленный на диверсификацию энергопоставок и построение стратегических партнёрств как часть стратегии 'Междуморья'."
POL_reconciliation_with_germany_france_desc: "Прагматичное, хотя и трудное, усилие по налаживанию отношений с Берлином и Парижем после периодов напряжённости, признавая их центральную роль в ЕС, продолжая при этом отстаивать польские национальные интересы."
POL_condemn_nord_stream_desc: "Твёрдая и громкая дипломатическая кампания против газопроводов Северный поток, осуждая их как угрозу европейской энергетической безопасности и российское геополитическое оружие, обходящее Восточную Европу."
POL_prepare_russian_invasion_desc: "Значительное ускорение военной модернизации, крупномасштабных оборонных закупок (особенно из США и Южной Кореи) и расширения вооружённых сил в прямой ответ на усиленную угрозу со стороны России."
POL_restructuring_armed_forces_desc: "Комплексная перестройка структуры, командования и оборудования вооружённых сил, переход от наследия советской эпохи к современной армии, способной сдерживать и защищаться от равного противника."
POL_deal_energy_security_desc: "Стратегический толчок к энергетической независимости от России, включающий диверсификацию газовых поставок через терминалы СПГ и новые трубопроводы, и обязательство по углю и ядерной энергетике."
POL_safety_umbrella_desc: "Всеобъемлющая стратегия национальной безопасности по поиску постоянного и усиленного военного присутствия США на польской земле, рассматриваемая как окончательная гарантия безопасности от внешних угроз."
POL_duda_era_desc: "Президентство Анджея Дуды становится синонимом повестки правительства PiS, используя полномочия должности для подписания спорного законодательства, формирования судебной власти и действия как лояльного публичного лица 'хороших перемен'."
POL_abandonment_migration_quotas_desc: "Твёрдый и популистский отказ принять любых мигрантов в рамках обязательной схемы переселения ЕС, обрамляя это как защиту национального суверенитета, безопасности и культурной однородности от 'исламских мигрантов'."
POL_question_islamic_migrants_desc: "Обрамление вопроса миграции в первую очередь через призму безопасности и культуры, представляя мусульманских мигрантов как потенциальную угрозу общественной безопасности Польши и христианской идентичности."
POL_struggle_for_sovereignty_desc: "Центральный нарратив столкновений правительства с ЕС, изображаемый не как конфликт из-за верховенства закона, а как героическая защита права Польши на самоопределение против не избранных брюссельских бюрократов."
POL_increase_poland_role_in_eu_desc: "Стратегия увеличения влияния Польши в Европейском союзе путём построения коалиций с другими скептически настроенными государствами-членами и использования своего экономического и политического веса для блокирования федералистских инициатив."
POL_banking_law_act_desc: "Медиа-закон (прозванный 'Lex TVN'), рассматриваемый как нацеленный на крупную критическую, принадлежащую США телевизионную сеть, путём предотвращения контроля неевропейских субъектов над польскими вещателями, вызывая опасения по поводу свободы СМИ."
POL_educational_law_desc: "Реформа системы образования, которая централизует контроль над школами и учебными программами, подчёркивая патриотизм и историю, удаляя элементы, которые правительство считает идеологически проблематичными."
POL_problem_of_east_desc: "Учреждение государственной комиссии (прозванной 'Lex Tusk') для расследования 'российского влияния' в польской политике, широко критикуемой как инструмент дискредитации главного политического оппонента, Дональда Туска."
POL_debanderization_desc: "Политика, направленная на проверку украинских мигрантов на наличие лиц или групп, прославляющих Степана Бандеру и УПА, решая глубоко чувствительный исторический вопрос в рамках стратегического партнёрства."
POL_reparations_for_volyn_desc: "Официальное поднятие вопроса о репарациях с Украины за Волынскую резню времён Второй мировой войны, усложняя стратегическое партнёрство нажатием на давнюю историческую рану."
POL_forget_old_grievances_desc: "Контринициатива, аргументирующая отказ от исторических споров, особенно с Украиной, во имя современной геополитической необходимости и единства против общей российской угрозы."
POL_close_belarusian_border_desc: "Строительство массивного пограничного барьера и развёртывание тысяч войск для герметизации границы с Беларусью против государственно-организованной гибридной атаки с использованием ближневосточных мигрантов."
POL_from_white_red_sheet_desc: "Символический проект создания нового, позитивного национального нарратива и основополагающего мифа для Четвёртой Республики, выходящий за пределы воспринимаемого позора и компромиссов пост-1989 периода."
POL_consensus_teach_john_paul2_desc: "Инициатива по согласованию государственной политики и законодательства с социальными и моральными учениями Папы Иоанна Павла II, подчёркивая человеческое достоинство, солидарность и центральную роль семьи, тем самым укрепляя влияние католической церкви на правовую и культурную структуру страны."
POL_central_biuro_antikorup_desc: "Учреждение и расширение полномочий Центрального антикоррупционного бюро (ЦАБ) как ключевого инструмента в борьбе с коррупцией, предоставляя ему широкие полномочия для расследования коррупции в общественной жизни, хотя критики предупреждают о его потенциальном использовании в политических целях."
POL_pis_death_penalty_desc: "Спорная попытка партии Право и справедливость (PiS) восстановить смертную казнь за самые серьёзные преступления, вызывая национальные дебаты о правосудии и правах человека и ставя Польшу в прямой конфликт с законами и ценностями Европейского союза."
POL_national_census_desc: "Проведение комплексной национальной переписи для сбора жизненно важных демографических, социальных и экономических данных, которые необходимы для эффективного управления, распределения ресурсов и долгосрочного стратегического планирования."
POL_monitoring_career_development_desc: "Реализация системы на государственном уровне для отслеживания и анализа карьерного прогресса и развития навыков среди граждан, направленная на лучшее согласование образовательных результатов с потребностями рынка труда и выявление областей для национальных инвестиций в человеческий капитал."
POL_judicial_reform_desc: "Масштабная и крайне спорная перестройка судебной системы, которую правительство аргументирует как необходимую для повышения эффективности и очищения от посткоммунистических влияний, но которую Европейский союз и критики осуждают как нападение на судебную независимость и верховенство закона."
POL_cooperation_in_the_baltics_desc: "Внешнеполитический приоритет углубления политического, экономического и военного сотрудничества со странами Балтии — Литвой, Латвией и Эстонией, рассматриваемыми как решающие для региональной безопасности, энергетической независимости и представления единого фронта в Европейском союзе и НАТО."
POL_strengthening_ties_in_balkans_desc: "Дипломатическое наступление для усиления политического и экономического влияния Польши в Западных Балканах, поддерживая европейские устремления этих государств, позиционируя Польшу как ключевого игрока в этом стратегически важном регионе."
POL_support_moldova_desc: "Оказание последовательной политической, экономической и технической поддержки Молдове, направленной на укрепление её суверенитета, облегчение её европейской интеграции и снижение её уязвимости к внешнему давлению со стороны России."
