POLISH_CROWN_ORGANIZATION: "Организация Польской короны"
POL_subordination_of_moldova_tt: "Если [MLV.GetNameWithFlag] согласится, она станет нашим §6младшим униатским партнером§!; в противном случае мы сможем §Rобъявить войну§! [MLV.GetNameWithFlag]."
POL_transnistrian_issue_tt: "Если [SOV.GetNameWithFlag] согласится, [PMR.GetNameWithFlag] §Gбудет возвращена§! [MLV.GetNameWithFlag], а мы §6заплатим России§! §R$25 миллиардов§! за вывод их §tвоенного оборудования§! из региона."
poland_monarch.1.t: "Корвин приходит к власти"
poland_monarch.1.d: "На недавних выборах партия Януша Корвин-Михке одержала сокрушительную победу, что стало великим событием для Польского роялистского движения, поскольку Корвин уже заявлял о своем намерении восстановить режим Королевства Польского, существовавший с начала польской истории до второго раздела Речи Посполитой между Пруссией, Австрийской империей и Российской империей."
poland_monarch.1.a: "Боже, храни Короля!"
poland_monarch.2.t: "Проблема миграции в Польше"
poland_monarch.2.d: "В последнее время участились случаи нелегальной миграции. Основными мигрантами, как ни странно, являются белорусы и немцы, а также мусульмане из Турции и Ближнего Востока. Граждане жалуются, что мигранты отбирают у них рабочие места и сеют нестабильность в обществе. В Сейме разгорелись дебаты о том, что делать с миграцией, какое решение будет правильным и не усугубит ситуацию."
poland_monarch.2.a: "Белорусы и немцы массово отнимают рабочие места у наших граждан."
poland_monarch.2.b: "Исламские мигранты создают слишком много нестабильности"
poland_monarch.2.c: "Необходимо ввести строгие иммиграционные правила"
poland_monarch.2.f: "Наша проблема с миграцией в том, что её слишком мало."
POL_problem_migration_tt: "\nВ зависимости от выбранного метода решения миграционных вопросов мы получим различные бонусы и бесплатное изменение §YЗакона о миграции§!. §RЭто также повлияет на наши международные отношения со странами-поставщиками мигрантов.§!"
poland_monarch.3.t: "Коронация Януша Корвин-Михке"
poland_monarch.3.d: "Некоторое время назад правитель Польши Януш Корвин-Михке заявил о своих правах на Польскую корону. Сейм Шляхетский, состоящий в основном из дворянской элиты, подавляющим большинством голосов поддержал Дом Корвин. Сегодня состоялась Великая коронация, ознаменовавшая начало финального этапа возвращения Польши к монархии.\nНа коронации присутствовали гости из многих стран, в том числе лидеры России, Великобритании и Испании, принявшие приглашение. Коронация длилась более пяти часов, в течение которых были подписаны новая польская конституция и несколько дипломатических договоров. Скоро, по словам самого Януша, он провозгласит восстановление Второго Королевства Польского."
poland_monarch.3.a: "Да здравствует Януш!"
POL_king_janusz_i_tt: "Отныне §YЯнуш Корвин-Михке§! будет коронован как §tКороль Польши§! §YЯнуш I Корвин§!"
poland_monarch.4.t: "Восстановление Королевства Польского"
poland_monarch.4.d: "История Польского государства ткалась с рассвета славянских племён. Королевство Польское было преобразовано в Речь Посполитую Люблинской унией, а затем уничтожено двумя разделами. Сегодня Польша — демократическая республика, где по улицам ходят извращенцы с радужными флагами, но у них хватает наглости продвигать свою повестку в нашу национальную политику. Молодёжь Польши начала полностью забывать о величии нашего культурного наследия, и пора это остановить! Мы сменили политический режим, заменили вновь созданные основы традиционными, и теперь, наконец, пришло время провозгласить возвращение Второго Королевства Польского!"
poland_monarch.4.a: "О, ликуй, Мать-Польша, во славе"
poland_monarch.5.t: "Польша провозглашает восстановление Королевства Польского"
poland_monarch.5.d: "Польское правительство сделало сегодня сенсационное заявление: Королевство Польское возвращается на карту Европы. Спустя более 100 лет после последнего раздела Речи Посполитой Польша возвращается к монархическому правлению.\nЭта новость вызвала обеспокоенность у нескольких стран, граничащих со Вторым Королевством, опасающихся стать жертвами польского реваншизма."
poland_monarch.5.a: "Неожиданно"
poland_monarch.6.t: "Польша предлагает сотрудничество"
poland_monarch.6.d: "Сегодня к нам прибыли дипломаты из Польши с интересным предложением. В рамках потепления отношений между нашими странами они хотят заключить несколько соглашений и начать долгосрочное сотрудничество. Стоит ли соглашаться?"
poland_monarch.6.a: "Русские и поляки — братья навек!"
poland_monarch.6.b: "Думаю... нет"
poland_monarch.7.t: "Россия соглашается на сотрудничество"
poland_monarch.7.d: "Наши дипломаты были тепло встречены в Москве во время визита в Кремль. Там вместе со своими российскими коллегами они подписали ряд документов о военном и экономическом сотрудничестве. Это не просто бумажка; это начало долгой и крепкой дружбы!"
poland_monarch.8.t: "Россия отказывается от сотрудничества"
poland_monarch.8.d: "Наши дипломаты были встречены в Москве во время визита в Кремль, где провели длительные переговоры с нашими российскими коллегами. Несмотря на споры и разногласия, нам не удалось достичь компромисса, и российские власти отказались от сотрудничества."
poland_monarch.8.a: "Курва!"
POL_reconciliation_with_russia_tt: "Если они согласятся, мы подпишем ряд соглашений с §6[SOV.GetNameWithFlag]§!."
poland_monarch.9.t: "Польша заявила о своих амбициях"
poland_monarch.9.d: "Много времени прошло с тех пор, как власть в Польше перешла к роялистам. И вот, после провозглашения восстановления Королевства Польского, польское правительство сделало заявление о своих амбициях.\nСреди заявлений, сделанных Польским королевским двором, были и довольно скандальные, такие как заявления о территориальных претензиях ко многим своим соседям.\nПосле таких заявлений напряжённость в регионе возросла."
poland_monarch.9.a: "Надеюсь, это не выйдет за рамки слов."
poland_monarch.10.t: "Новый военный альянс в Европе"
poland_monarch.10.d: "Сегодня Польский королевский двор объявил о создании Организации Польской короны. По словам польских властей, этот альянс в первую очередь направлен на централизацию вооружённых сил Центральной Европы в Варшаве."
poland_monarch.10.a: "Что ждёт Европу?"
lavrov_rotfeld_pact_threat: "Пакт Лаврова-Ротфельда"
poland_monarch.11.t: "Польша хочет подписать с нами пакт"
poland_monarch.11.d: "Сегодня польские дипломаты во главе с Адамом Даниэлем Ротфельдом прибыли в Кремль с любопытным предложением. Они хотят подписать с нами ряд договоров, один из которых — соглашение о разделе влияния в Восточной Европе.\nФактически договор представляет собой план раздела Восточной Европы между Польшей и Россией, аналогичный пакту Молотова-Риббентропа, подписанному Германией и Советским Союзом в 1939 году. Из-за сходства между двумя договорами было решено назвать его пактом Лаврова-Ротфельда, в честь прибывшего в Кремль Адама Даниэля Ротфельда и министра иностранных дел России Сергея Викторовича Лаврова."
poland_monarch.11.a: "Подпишем!"
poland_monarch.11.b: "Мы не повторим ошибок Союза"
poland_monarch.12.t: "Москва подписывает пакт"
poland_monarch.12.d: "Наши дипломаты прибыли из Москвы, где был успешно подписан пакт Лаврова-Роттфельда. Конечно, осталось ещё несколько спорных моментов, которые мы оставили для дальнейших обсуждений, но основные пункты относительно раздела Восточной Европы были обсуждены и закреплены на бумаге; осталось лишь реализовать этот дьявольский пакт."
poland_monarch.12.a: "Очень хорошо!"
poland_monarch.13.t: "Москва отказывается"
poland_monarch.13.d: "Наши дипломаты вернулись из Москвы, где должны были подписать пакт Лаврова-Ротфельда. Однако из-за разногласий по вопросам внешних интересов и раздела Восточной Европы подписание Пакта зашло в тупик. Последней точкой стало нежелание Москвы повторять ошибку Советского Союза, подписавшего подобный договор с нацистской Германией в 1939 году."
poland_monarch.13.a: "Какая жалость"
poland_monarch.14.t: "Россия и Польша подписали пакт Лаврова-Ротфельда"
poland_monarch.14.d: "Сегодня СМИ взорвались новостью: польские дипломаты во главе с Адамом Даниэлем Ротфельдом прибыли в Кремль, где их встретили министр иностранных дел России Сергей Лавров и группа российских дипломатов. На длительной и наполненной дебатами конференции были подписаны соглашения о взаимном ненападении, а также план раздела влияния в Восточной Европе.\nЭтот Пакт по содержанию и смыслу очень напоминает пакт Молотова-Риббентропа, который был подписан между Германией и Советским Союзом в 1939 году и стал одной из причин начала Второй мировой войны."
poland_monarch.14.a: "История повторяется"
poland_monarch.15.t: "Польша предлагает план раздела Белоруссии"
poland_monarch.15.d: "Белоруссия стала той страной, которая вызвала дебаты в Кремле во время подписания пакта Лаврова-Ротфилда. Мы не хотели бы уступать западную часть страны нашего союзника Польше. С другой стороны, многие политики выступают за раздел Белоруссии и присоединение её восточной части к России."
poland_monarch.15.a: "Мы выполним условия договора"
poland_monarch.15.b: "Белоруссия останется в нашей сфере влияния"
poland_monarch.16.t: "Россия соглашается на раздел Белоруссии"
poland_monarch.16.d: "Сегодня российские дипломаты прибыли с ответом из Кремля: Россия соглашается уступить Западную Белоруссию. Мы займём Западную часть Белоруссии, а Россия, в свою очередь, вторгнется в Восточную часть."
poland_monarch.16.a: "Очень хорошо!"
poland_monarch.17.t: "Россия отказалась делить Белоруссию"
poland_monarch.17.d: "Сегодня российские дипломаты прибыли с ответом из Кремля: Россия отказывается уступать Западную Белоруссию. По словам российского лидера, Белоруссия находится в сфере влияния России, и её раздел противоречит внешней политике России."
poland_monarch.17.a: "Грустно"
poland_monarch.18.t: "Польша предлагает план раздела Прибалтики"
poland_monarch.18.d: "Согласно пакту Лаврова-Роттфельда, Польша предлагает нам вторгнуться в Прибалтику. Она предлагает нам Эстонию и часть Латвии, а сама намерена вернуть земли Литвы и Курляндии."
poland_monarch.18.a: "План дьявольский, мне нравится."
poland_monarch.18.b: "Мы не будем этого делать"
poland_monarch.19.t: "Россия отказалась от идеи раздела Прибалтики."
poland_monarch.19.d: "Сегодня российские дипломаты ответили Кремлём на наше предложение по разделу Балтийского региона. Москва отказывается предпринимать какие-либо военные действия."
poland_monarch.19.a: "Мы получим больше"
poland_monarch.20.t: "Польша требует подчинения"
poland_monarch.20.d: "Польша выдвинула нам ультиматум: мы должны склонить голову и признать власть Польской короны над нашей страной, в противном случае они угрожают изменить географию наших границ каким-либо иным способом. Стоит ли соглашаться?"
poland_monarch.20.a: "Да здравствует Король!"
poland_monarch.20.b: "Мы способны защитить себя"
poland_monarch.21.t: "Польша предлагает план раздела Украины"
poland_monarch.21.d: "Польша предлагает объединить силы и вторгнуться в Украину с последующим разделом страны. Польша хочет разделить Западную Украину между Польшей, Венгрией и Молдовой, а всю восточную часть уступить России в соответствии с пактом Лаврова-Ротфилда."
poland_monarch.21.a: "Вернём наши земли"
poland_monarch.21.b: "Мы не будем этого делать"
poland_monarch.22.t: "Молдова соглашается подчиниться нам"
poland_monarch.22.d: "Власти Молдовы заявили, что не будут втягивать свою страну в войну и предпочтут мирное подчинение, а не независимость в войне."
poland_monarch.22.a: "Ещё одно доказательство, что миром правит закон сильного"
poland_monarch.23.t: "Молдова отказалась подчиниться нам"
poland_monarch.23.d: "Власти Молдовы выдали ноту в ответ на наш ультиматум; они отказываются подчиняться и заявляют, что будут бороться за свою независимость до последнего молдаванина."
poland_monarch.23.a: "Бог свидетель, мы хотели сделать это мирно."
poland_monarch.24.t: "Польша хочет купить Приднестровье"
poland_monarch.24.d: "Польша хочет положить конец приднестровскому конфликту. Они недавно подчинили Молдову и теперь хотят раз и навсегда закрыть этот вопрос. Они предлагают миллиарды долларов за вывод наших войск из региона, но также готовы идти на уступки."
poland_monarch.24.a: "Положим конец конфликту!"
poland_monarch.24.b: "Мы не оставим Приднестровье."
poland_monarch.25.t: "Россия соглашается продать Приднестровье"
poland_monarch.25.d: "После интенсивных переговоров Москва приняла наше предложение. Россия выведет свои войска из приднестровского региона и передаст контроль Польше в обмен на финансовую компенсацию. Это соглашение не только закрывает давнюю главу неопределённости на Днестре, но и усиливает наше влияние в регионе, открывая путь к долгосрочному урегулированию с Молдовой."
poland_monarch.25.a: "Исторический шаг к стабильности"
poland_monarch.26.t: "Россия отказывается продавать Приднестровье"
poland_monarch.26.d: "Москва отклонила наше предложение и отказывается выводить свои войска из приднестровского региона. Тупиковая ситуация на Днестре продолжается, и любое мирное урегулирование придётся отложить — или добиваться его другими средствами."
poland_monarch.26.a: "Они не оставляют нам мирного выбора"
poland_monarch.27.t: "Люблинская уния — Выбор судьбы"
poland_monarch.27.d: "С нашей укрепившейся властью и влиянием, простирающимся по старым землям Речи Посполитой, перед нами стоит историческое решение. Останемся ли мы Королевством Польским, современным централизованным государством под одной короной, или же восстановим Речь Посполитую — возрождённый для XXI века союз, уравновешивающий свободу и общий суверенитет между нашими народами? Выбор, который мы сделаем, определит наши институты, идентичность и место в Европе на поколения вперёд."
poland_monarch.27.a: "Восстановить Речь Посполитую"
poland_monarch.27.b: "Остаться Королевством Польским"
poland_monarch.28.t: "Польша восстанавливает Польско-Литовскую унию"
poland_monarch.28.d: "В шаге, насыщенном историческим символизмом, Польша официально воссоздала Польско-Литовскую унию в современном формате. Опираясь на наследие Люблинской унии, это обновлённое Содружество стремится сочетать общие институты с национальной автономией, соединяя традицию с современным управлением. Наблюдатели отмечают, что возрождение этого союза может существенно изменить политический баланс в Центральной и Восточной Европе, укрепив региональное сотрудничество и возродив знаменательную главу европейской государственности."
poland_monarch.28.a: "Новое Содружество для новой эры"
poland_monarch.29.t: "Польша требует Польско-Богемской унии"
poland_monarch.29.d: "Варшава предъявила Праге ультиматум: примите вассалитет в качестве Младшего униата под Польской короной и войдите в личную унию, либо столкнётесь с последствиями неповиновения. Предложение обещает защиту и общее процветание в рамках общей системы — но ценой суверенитета."
poland_monarch.29.a: "Принять польское предложение"
poland_monarch.29.b: "Мы не преклоним колено"
poland_monarch.30.t: "Чехия принимает унию"
poland_monarch.30.d: "Прага согласилась на польские условия. Чешское государство вступает в личную унию в качестве Младшего униата под Польской короной, согласовывая свою внешнюю политику и оборону с Варшавой, сохраняя внутренние институты. Открывается новая глава в политике Центральной Европы."
poland_monarch.30.a: "Ради стабильности королевства"
poland_monarch.31.t: "Чехия отказывается от унии"
poland_monarch.31.d: "Прага отклонила ультиматум Варшавы, отказавшись принять вассалитет в качестве Младшего униата. Напряжённость нарастает, поскольку Польша осуждает это решение и готовит ответы, которые могут быть недипломатичными. Европа внимательно следит, поскольку спор грозит перерасти в нечто большее."
poland_monarch.31.a: "Тогда мы заставим подчиниться"
poland_monarch.32.t: "Польша требует Польско-Венгерской унии"
poland_monarch.32.d: "Варшава выдвинула ультиматум Будапешту: вступите в вассалитет в качестве Младшего униата под Польской короной и присоединитесь к личной унии, либо примите последствия. Сторонники утверждают, что такое устройство принесёт безопасность и экономическую интеграцию — противники клеймят потерю суверенитета."
poland_monarch.32.a: "Принять польское предложение"
poland_monarch.32.b: "Венгрия не подчинится"
poland_monarch.33.t: "Венгрия принимает унию"
poland_monarch.33.d: "Будапешт принял условия Варшавы. Венгрия станет Младшим униатом под Польской короной, координируя оборону и внешнюю политику с Польшей, сохраняя внутреннее управление. Баланс в Центральной Европе снова смещается."
poland_monarch.33.a: "Прагматичное решение ради стабильности"
poland_monarch.34.t: "Венгрия отказывается от унии"
poland_monarch.34.d: "Будапешт отклонил ультиматум Варшавы, отказавшись принять вассалитет в качестве Младшего униата. Дипломатические каналы сужаются, поскольку Польша рассматривает более жёсткие меры для осуществления своей воли. Напряжённость в регионе соответственно растёт."
poland_monarch.34.a: "Тогда мы заставим подчиниться"
poland_monarch.35.t: "Польша требует Польско-Австрийской унии"
poland_monarch.35.d: "Варшава предъявила Вене ультиматум: примите вассалитет в качестве Младшего униата под Польской короной в рамках личной унии, либо столкнётесь с последствиями. Сторонники рекламируют коллективную безопасность и экономическую интеграцию; критики предупреждают об ущемлении австрийской автономии."
poland_monarch.35.a: "Принять польское предложение"
poland_monarch.35.b: "Австрия не подчинится"
poland_monarch.36.t: "Австрия принимает унию"
poland_monarch.36.d: "Вена согласилась на условия Варшавы. Австрия становится Младшим униатом под Польской короной, согласовывая ключевые политики с Польшей, сохраняя внутренние институты. Значительный поворот в делах Центральной Европы."
poland_monarch.36.a: "Прагматичное решение ради стабильности"
poland_monarch.37.t: "Австрия отказывается от унии"
poland_monarch.37.d: "Вена отклонила ультиматум Варшавы, отказавшись принять вассалитет в качестве Младшего униата. Польша осуждает отказ и даёт понять, что альтернативы дипломатии остаются на столе. Европа наблюдает за противостоянием с тревогой."
poland_monarch.37.a: "Тогда мы заставим подчиниться"
poland_monarch.38.t: "Приглашение в Организацию Польской короны"
poland_monarch.38.d: "Польша приглашает нас вступить в свой альянс — Организацию Польской короны. Членство обещает коллективную безопасность, экономическую координацию и общую дипломатическую позицию под руководством Варшавы. Вступление тесно свяжет наше будущее с польским видением Центральной и Восточной Европы."
poland_monarch.38.a: "Вступить в Организацию Польской короны"
poland_monarch.38.b: "Мы останемся независимыми"
poland_monarch.39.t: "[FROM.GetName] вступает в Организацию Польской короны"
poland_monarch.39.d: "[FROM.GetAdjective] правительство приняло приглашение Польши. Вступив в Организацию Польской короны, [FROM.GetName] берёт на себя обязательства по взаимной обороне и стратегической координации с Варшавой и другими членами, укрепляя нашу безопасность и влияние в регионе."
poland_monarch.39.a: "Ради нашей общей безопасности и процветания"
poland_monarch.40.t: "[FROM.GetName] отказывается от Организации Польской короны"
poland_monarch.40.d: "После обсуждения руководство [FROM.GetName] отклонило предложение Польши о вступлении в Организацию Польской короны. Признавая преимущества более тесного сотрудничества, мы сохраним независимый курс во внешней и оборонной политике."
poland_monarch.40.a: "Наш путь остаётся нашим"
poland_monarch.41.t: "Польша требует возвращения сербских территорий Венгрии"
poland_monarch.41.d: "Варшава выдвинула требование к [FROM.GetName]: передать территории с венгерским населением, находящиеся под сербским контролем, обратно Венгрии. Польша утверждает, что это необходимая коррекция исторических несправедливостей и шаг к региональной стабильности. Сербии теперь предстоит решить: подчиниться или бросить вызов польскому декрету."
poland_monarch.41.a: "Вернуть земли Венгрии"
poland_monarch.41.b: "Отклонить требование Польши"
poland_monarch.42.t: "[FROM.GetName] возвращает территорию Венгрии"
poland_monarch.42.d: "[FROM.GetName] согласилось с требованием Польши. Обозначенные территории передаются Венгрии под польским наблюдением с заявленной целью стабилизации региона и решения давних споров."
poland_monarch.42.a: "Трудное, но стабилизирующее решение"
poland_monarch.43.t: "[FROM.GetName] отказывается возвращать территорию"
poland_monarch.43.d: "[FROM.GetName] отклонило требование Польши о передаче территорий Венгрии. Варшава осуждает отказ и готовит меры для обеспечения своей позиции, повышая напряжённость на Балканах."
poland_monarch.43.a: "Тогда мы возьмём то, что причитается"
poland_monarch.44.t: "Польское предложение: Эллинский оборонительный пакт"
poland_monarch.44.d: "Польша предлагает оборонительный и военный пакт, объединяющий Грецию и Кипр против угроз со стороны Турции. Договорённость будет включать взаимные гарантии, военный доступ и скоординированное планирование обороны в рамках общей структуры, направленной на сдерживание агрессии и стабилизацию Восточного Средиземноморья."
poland_monarch.44.a: "Решить по польскому предложению"
poland_monarch.45.t: "[FROM.GetName] принимает Польский оборонительный пакт"
poland_monarch.45.d: "[FROM.GetName] согласилось с предложением Польши. [FROM.GetName] вступит в скоординированные оборонительные договорённости при поддержке Варшавы, расширяя военное сотрудничество и усиливая сдерживание против турецкого давления в регионе."
poland_monarch.45.a: "Ради безопасности [FROM.GetName]"
poland_monarch.46.t: "[FROM.GetName] отказывается от Польского оборонительного пакта"
poland_monarch.46.d: "[FROM.GetName] отклонило предложение Польши. Признавая общие опасения, [FROM.GetAdjective] правительство не будет вступать в формальный пакт в настоящее время."
poland_monarch.46.a: "Мы найдём других партнёров"
poland_monarch.47.t: "Польша предлагает разделить Румынию"
poland_monarch.47.d: "Сегодня польские дипломаты прибыли в нашу столицу с предложением. Они предлагают территориальный раздел Румынии. Они предлагают нам их исторические территории, а сами возьмут то, что по праву принадлежит им и их вассалам. Это решение позволит нам расширить наши границы, но в то же время ухудшит международное мнение и вызовет нестабильность в регионе."
poland_monarch.47.a: "Мы заберём то, что по праву наше"
poland_monarch.47.b: "Мы не будем участвовать в региональном кризисе."
POL_lavrov_rotfeld_pact_tt: "Если §6[SOV.GetNameWithFlag]§! согласится подписать Пакт, это откроет ряд решений, связанных с §tРазделом Восточной Европы§!."
POL_belarusian_consensus_tt: "Если §6[SOV.GetNameWithFlag]§! согласится, мы получим §RЦель войны§! против §6[BLR.GetNameWithFlag]§! и выдвинем претензии на их территорию."
POL_polish_bohemian_union_tt: "Если §6[CZE.GetNameWithFlag]§! согласится, они станут нашим §GМладшим униатом§!, в противном случае мы можем §Rобъявить им войну§!."
POL_restor_pol_hin_union_tt: "Если §6[HUN.GetNameWithFlag]§! согласится, они станут нашим §GМладшим униатом§!, в противном случае мы можем §Rобъявить им войну§!."
POL_force_austria_into_union_tt: "Если §6[AUS.GetNameWithFlag]§! согласится, они станут нашим §GМладшим униатом§!, в противном случае мы можем §Rобъявить им войну§!."
POL_polish_latin_union_tt: "\nЕсли §6Они§! согласятся, они §GВступят в нашу фракцию§!."
poland_anti_turk_tt: "Подписав этот договор, мы будем обязаны вступить в §RВойну Польши против Турции§!."
poland_braun.1.t: "Гжегож Браун приходит к власти"
poland_braun.1.d: "Гжегож Браун, противоречивый политик из партии Конфедерация Польской короны, пришёл к власти в Польше на недавних выборах. Его радикальная деятельность принесла ему как широкую популярность, так и большое количество ненавистников, особенно среди активистов и евреев, хотя в конечном итоге и те, и другие будут подавлены консервативной политикой Брауна."
poland_braun.1.a: "Szczęść Boże! (Да благословит Бог!)"
poland_braun.2.t: "Массовые депортации немцев из Варшавы"
poland_braun.2.d: "Сообщения из Варшавы указывают, что польские власти начали массовые депортации немецких граждан из столицы. Целые районы очищаются под конвоем полиции, поскольку жителей насильно сажают на транспорт для вывоза из страны. Берлин осуждает эту акцию и требует немедленной защиты и репатриации своих граждан."
poland_braun.2.a: "Осудить и подать дипломатический протест"
poland_braun.3.t: "Чистка журналистов Wyborcza и TVN"
poland_braun.3.d: "После прихода к власти Гжегож Браун приказал провести масштабную чистку в Gazeta Wyborcza и TVN. Журналисты, признанные нелояльными, арестовываются и, по сообщениям, казнятся после упрощённых судебных разбирательств. Репрессии вызывают шок в польском медиаландшафте и привлекают международную критику."
poland_braun.3.a: "Тёмный день для свободной прессы"
poland_braun.4.t: "Польша коронует Христа"
poland_braun.4.d: "Недавно СМИ взорвались новостью, что Польша намерена короновать Иисуса Христа Польской короной. Сегодня, несмотря на неодобрение польских епископов, которые были успешно смещены нынешним польским правительством, состоялась Коронация Иисуса Христа.\nНа церемонии интронизации присутствовал сам глава государства, а также лидеры и послы других стран. Сама церемония длилась несколько часов и оказалась весьма успешной для Польши. Президент Польши Гжегож Браун заявил о своём намерении претендовать на титул Святого Регента Польского государства."
poland_braun.4.a: "Что?"
POL_poland_ambitions_category: "Внешняя политика Королевства Польского"
POL_poland_ambitions_category_desc: "\n\n\n\n\n\n£POL_poland_kingdom_decision_category\n\n\n\n\n\n\n\n\nПольское государство пережило за свою тысячелетнюю историю немало бурных времён, включая разделы между крупными соседями. В 1918 году мы вновь обрели независимость, утраченную в 1939 году по пакту Молотова-Риббентропа. После Второй мировой войны и холодной войны, когда наша страна освободилась от оков коммунизма, мы смогли восстановить своё сильное и независимое государство. Теперь же перед нами стоит великая задача возвращения наших земель и былой славы."
