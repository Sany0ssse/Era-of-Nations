POL_army_category: "Вооружённые силы Республики Польша"
POL_army_category_desc: "Польская армия после Второй мировой войны была создана практически с нуля по стандартам Варшавского договора и Советского Союза.\nВремена изменились, Союз распался, Варшавский договор прекратил существование, но польская армия продолжает следовать устаревшим стандартам.\nПеред польской армией стоит задача модернизации старого оборудования, принятия новых доктрин и тактик, которые помогут адаптироваться к современным реалиям войны."
