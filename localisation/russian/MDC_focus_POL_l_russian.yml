#SLD EVENTS
poland_sld.1.t: "Рывингейт"
poland_sld.1.d: "Недавно Лев Рывин посетил офис Адама Михника, редактора крупнейшей ежедневной газеты Польши Gazeta Wyborcza. Рывин требовал взятку в 17,5 миллионов долларов за поправку к закону, направленному на ограничение влияния печатных СМИ на радио и телевидение, что принесло бы пользу Михнику; первоначальный проект препятствовал тому, чтобы издатель газеты Agora SA захватил частный телеканал Polsat или второй канал польского общественного телевидения Telewizja Polska. Рывин утверждал, что действует от имени так называемой 'группы во власти', которая желала остаться анонимной, но могла включать тогдашнего премьер-министра Лешека Миллера из посткоммунистического Союза демократических левых сил."
poland_sld.1.a: "Какая провокация!"
poland_sld.2.t: "Продолжение Рывингейта"
poland_sld.2.d: "После того как расследование Gazeta Wyborcza не дало результатов, вызывая некоторые сомнения в реальной роли газеты в этом деле, газета опубликовала частичные расшифровки любопытного разговора: Михник тайно записал разговор и начал расследование для установления личности 'группы во власти'. Он также организовал встречу между Миллером, Рывином и собой в офисе Миллера. Когда Миллер, согласно присутствовавшим, отрицал какое-либо участие в сделке, предложенной Рывином, Рывин потерял самообладание и даже говорил о самоубийстве. Сам Рывин позже утверждал, что был пьян."
poland_sld.2.a: "ДОСТАТОЧНО! Дело передаётся в Сейм для расследования!"
poland_sld.3.t: "Принят отчёт большинства"
poland_sld.3.d: "В отдельном уголовном преследовании Рывин был приговорён к двум годам тюрьмы и штрафу в 100 000 злотых за мошенничество, поскольку суд заключил, что не было 'группы во власти' и Рывин действовал по собственной инициативе."
poland_sld.3.a: "Отлично"
poland_sld.4.t: "Принят отчёт меньшинства"
poland_sld.4.d: "Сейм неожиданно проголосовал за принятие отчёта меньшинства, который наиболее радикально отличался от отчёта большинства, и назвал следующих людей вдохновителями миссии Рывина: Лешек Миллер, Александра Якубовская, Владимир Чарзасты, Роберт Квятковский, Лех Никольский."
poland_sld.4.a: "СУКА!"
poland_sld.5.t: "План Хауснера"
poland_sld.5.d: "Ежи Хауснер, член польского Сейма, предложил план улучшения государственных финансов перед лицом растущего государственного долга. План назывался 'Программа оптимизации и сокращения государственных расходов'. Согласно плану, Польша должна значительно сократить свои расходы для стабилизации экономики, но похоже, что Сейм разделяет гениальность Хауснера."
poland_sld.5.a: "Мы примем план."
poland_sld.5.b: "Это безумие!"
poland_sld.6.t: "Дело Збигнева и Фогеля"
poland_sld.6.d: "Збигнев Ежи Соботка — посткоммунистический заместитель министра юстиции, приговорённый к 3,5 годам тюрьмы за разглашение государственной тайны (на самом деле он предупредил бандитов об операции против них).\n Пётр Филипчинский, также известный как Питер Фогель, был приговорён к 25 годам тюрьмы за жестокое убийство (сокращено до 15 лет в 1979 году). Удивительно, что в 1983 году (во время военного положения в Польше) ему выдали паспорт и разрешили покинуть страну. Он вернулся в 1990 году, вскоре получив прозвище 'бухгалтер левых' как бывший швейцарский банкир, обслуживавший более тридцати счетов польских социал-демократов. Несмотря на ордер на арест, выданный в 1987 году, Фогель свободно перемещался по Польше и в конечном итоге был арестован в 1998 году в Швейцарии. После экстрадиции Фогеля в Польшу Квасневский инициировал процедуру амнистии для него в 1999 году."
poland_sld.6.a: "Мы должны предоставить амнистию бывшим коллегам"
poland_sld.6.b: "Закон есть закон"
poland_sld.7.t: "Ещё один коррупционный скандал"
poland_sld.7.d: "В 1999 году Совет министров Польши решил в предыдущем году частично приватизировать и объединить две государственные нефтехимические компании: Centrala Produktów Naftowych, монополию коммунистической Польши на розничную продажу нефтепродуктов, и Petrochemia Płock, государственную компанию, ответственную за нефтеперерабатывающие заводы в Плоцке, крупнейший такой комплекс в Польше. После слияния компания была переименована в Polski Koncern Naftowy (PKN), а через несколько месяцев к названию консорциума было добавлено слово Orlen. В настоящее время разражается скандал из-за слухов, что Александр Квасневский хотел занять хорошие позиции в компании, которая фактически была основана его товарищами по партии СЛД. Сейм хочет расследовать это дело, выяснить, какие сделки были заключены и были ли вовлечены русские."
poland_sld.7.a: "Я дам показания по делу."
poland_sld.7.b: "Я не дам никаких показаний, это всё провокация оппозиции перед выборами!"
poland_sld.8.t: "Польша предлагает сотрудничество"
poland_sld.8.d: "Польские дипломаты отправили нам пакет предложений по сотрудничеству. Это подразумевает торговое соглашение, дружбу и взаимное влияние на благо процветания наших отношений"
poland_sld.8.a: "Давайте пожмём руки!"
poland_sld.8.b: "Это не в наших интересах"

#KOALICIJA OBYWATELSKA

#Platforma Obywatelska
POL_koalicja_obywatelska: "Гражданская коалиция"
POL_koalicja_obywatelska_desc: "Гражданская коалиция возникает как крупный центристский и либеральный политический альянс, объединяющий различные группы под проевропейским, реформистским знаменем для вызова установленной политической дуополии."
POL_platforma_obywatelska: "Гражданская платформа"
POL_platforma_obywatelska_desc: "Гражданская платформа укрепляет свою позицию как ведущая правоцентристская сила, выступающая за либеральную экономическую политику, модернизацию и более глубокую интеграцию с Европейским союзом."
POL_100points_for_100days: "100 пунктов за 100 дней"
POL_100points_for_100days_desc: "Амбициозный и символический план начать срок с всплеска активности, предлагая сто конкретных законодательных или политических изменений, которые должны быть реализованы в первые сто дней на посту."
POL_op_economic_reforms: "Экономические реформы"
POL_op_economic_reforms_desc: "Комплексный пакет рыночно-ориентированных реформ, предназначенных для либерализации экономики, сокращения государственного присутствия, поощрения предпринимательства и стимулирования устойчивого роста."
POL_reduction_seats_in_sejm: "Сокращение мест в Сейме"
POL_reduction_seats_in_sejm_desc: "Предложение оптимизировать национальный парламент путём сокращения числа мест в Сейме, аргументируя более эффективным и менее затратным законодательным органом."
POL_social_reforms: "Социальные реформы"
POL_social_reforms_desc: "Широкая повестка модернизации социальной политики страны, фокусирующаяся на обновлении государства всеобщего благосостояния, пенсионной системы и государственных услуг для соответствия новым демографическим и экономическим вызовам."
POL_reduce_privilegies_of_labour_union: "Сократить привилегии профсоюзов"
POL_reduce_privilegies_of_labour_union_desc: "Спорная политика, направленная на ограничение политического и экономического влияния профсоюзов, особенно на государственных предприятиях, аргументируя, что их особые привилегии препятствуют экономической гибкости и инвестициям."
POL_decentralization_of_expenses: "Децентрализация расходов"
POL_decentralization_of_expenses_desc: "Фискальная реформа по передаче контроля над значительной частью государственных расходов от центрального правительства местным и региональным властям, способствующая субсидиарности и более целевому использованию средств."
POL_major_parlamentary_election: "Мажоритарные парламентские выборы"
POL_major_parlamentary_election_desc: "Попытка реформировать избирательную систему от пропорционального представительства к мажоритарной, направленная на создание более сильных, прямых связей между избирателями и их представителями и способствование стабильным однопартийным правительствам."
POL_fight_monopolies: "Борьба с монополиями"
POL_fight_monopolies_desc: "Усиление антимонопольного регулирования и расширение полномочий Управления по защите конкуренции и потребителей для разрыва картелей и монополий, способствуя более конкурентному и справедливому рынку для бизнеса и потребителей."
POL_direct_election_in_voivodeships: "Прямые выборы в воеводствах"
POL_direct_election_in_voivodeships_desc: "Реформа децентрализации по введению прямых выборов региональных лидеров (воевод), предоставляющая больше автономии и политической власти регионам Польши и делающая региональные правительства более подотчётными."
POL_bank_leadership: "Руководство банков"
POL_bank_leadership_desc: "Усилия по утверждению большего государственного надзора или влияния на стратегическое направление и руководство контролируемыми государством банками, балансируя цели экономической политики с коммерческой независимостью банков."
POL_remove_church_fund: "Ликвидация церковного фонда"
POL_remove_church_fund_desc: "Политически чувствительное предложение об отмене финансируемого государством церковного фонда, который предоставляет финансовую поддержку католической церкви, вновь разжигая дебаты о разделении церкви и государства."
POL_housing_support: "Поддержка жилья"
POL_housing_support_desc: "Государственные программы по стимулированию строительства и приобретения жилья, такие как субсидируемые ипотеки или планы сбережений, направленные на решение проблемы нехватки жилья и повышение доступности владения жильём."
POL_invalid_support: "Поддержка людей с ограниченными возможностями на рабочем месте"
POL_invalid_support_desc: "Внедрение стимулов и систем поддержки для работодателей по найму и интеграции людей с ограниченными возможностями в рабочую силу, способствуя социальной интеграции и экономическому участию."
POL_undifferentiated_tax: "Единый налог"
POL_undifferentiated_tax_desc: "Продвижение системы единого налога, заменяющей прогрессивные налоговые ставки единой, унифицированной ставкой для всех уровней дохода, аргументируя упрощением кодекса, снижением уклонения и стимулированием экономической активности."
POL_allow_trading_on_sunday: "Разрешить торговлю в воскресенье"
POL_allow_trading_on_sunday_desc: "Шаг по отмене давнего запрета на воскресную торговлю, отстаиваемый как вопрос экономической свободы и удобства потребителей, но яростно противостоящий профсоюзам и религиозным группам."
POL_rotation_in_national_bank: "Ротация руководства Национального банка"
POL_rotation_in_national_bank_desc: "Спорная инициатива по введению ограничений сроков и ротации в руководстве Национального банка Польши, потенциально бросая вызов его независимости и подводя денежно-кредитную политику под большее политическое влияние."
POL_health_reform: "Реформы здравоохранения"
POL_health_reform_desc: "Перестройка печально известной неэффективной системы общественного здравоохранения, направленная на сокращение времени ожидания, улучшение качества обслуживания и обеспечение долгосрочной финансовой устойчивости через структурные изменения."
POL_education_reform: "Реформы образования"
POL_education_reform_desc: "Масштабная трансформация национальной системы образования, затрагивающая учебную программу, структуру школ и квалификацию учителей, с целью лучшей подготовки студентов к требованиям экономики 21-го века."
POL_tech_economy: "Преподавание экономики в школах"
POL_tech_economy_desc: "Введение обязательных классов по экономике и финансовой грамотности в школьную программу, направленное на оснащение следующего поколения практическими знаниями о рынке, личных финансах и предпринимательстве."
POL_increase_teachers_salaries: "Увеличить зарплаты учителей"
POL_increase_teachers_salaries_desc: "Значительные государственные инвестиции для повышения заработной платы учителей, решение давних жалоб, улучшение морального духа и привлечение более качественных кандидатов в профессию образования."
POL_legalization_collaborative_partnerships: "Легализация гражданских партнёрств"
POL_legalization_collaborative_partnerships_desc: "Шаг к признанию различных моделей семьи путём юридического оформления гражданских союзов или партнёрств, предоставляя правовую и экономическую защиту для незамужних пар."
POL_balanced_partnership: "Сбалансированное партнёрство"
POL_balanced_partnership_desc: "Внешнеполитическая доктрина, стремящаяся к сбалансированным отношениям между крупными державами, особенно Соединёнными Штатами и европейскими партнёрами, такими как Германия и Франция, при осторожном управлении отношениями с Россией."
POL_join_eu_missile_shield: "Присоединиться к европейскому ракетному щиту"
POL_join_eu_missile_shield_desc: "Обязательство Польши участвовать в проекте европейского ракетного щита, шаг, который усиливает континентальную безопасность, но, вероятно, вызовет сильную реакцию из Москвы."
POL_reduce_tens_in_east: "Снизить напряжённость на Востоке"
POL_reduce_tens_in_east_desc: "Проведение политики дипломатического диалога и деэскалации с восточными соседями, прежде всего Россией, направленной на снижение региональной напряжённости и развитие экономического сотрудничества, несмотря на исторические обиды."
POL_increase_us_presence: "Усилить присутствие США"
POL_increase_us_presence_desc: "Активное стремление к усиленному постоянному военному присутствию Соединённых Штатов на польской земле, рассматривая это как окончательную гарантию безопасности от потенциальной агрессии с Востока."
POL_loyality_to_NATO: "Верность ценностям НАТО"
POL_loyality_to_NATO_desc: "Подтверждение непоколебимой приверженности Польши Организации Североатлантического договора как краеугольному камню её национальной обороны, приоритизируя сплочённость альянса и принцип коллективной обороны."
POL_support_euromaidan: "Поддержать Евромайдан"
POL_support_euromaidan_desc: "Оказание сильной политической, дипломатической и материальной поддержки проевропейским протестующим в Украине во время революции Евромайдан, твёрдо выравнивая Польшу с демократическими устремлениями её восточного соседа."
POL_deal_with_blr_migrants: "Разобраться с белорусскими мигрантами"
POL_deal_with_blr_migrants_desc: "Управление гибридной угрозой на границе с Беларусью, которая включает работу с волнами мигрантов, инструментализированных режимом Лукашенко для дестабилизации восточного фланга ЕС."
POL_legalization_abortion: "Легализация абортов"
POL_legalization_abortion_desc: "Принятие законодательства о легализации абортов при определённых обстоятельствах, знаменующее глубокий сдвиг в социальной политике страны и вызывающее значительный политический и общественный конфликт."

