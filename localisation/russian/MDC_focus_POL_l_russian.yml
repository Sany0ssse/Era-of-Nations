#Prawica events
poland_lpr.1.t: "Восток без России"
poland_lpr.1.d: "Польша предложила нам заключить несколько оборонительных пактов и соглашений под названием 'Восток без России'. Это соглашение предполагает, что мы возьмём на себя двусторонние обязательства по защите друг друга от российской агрессии. Москва явно воспримет этот шаг негативно, но, с другой стороны, это отличный шанс объединиться против общего врага."
poland_lpr.1.a: "Вместе! Против России"
poland_lpr.1.b: "Не нужно демонизировать Россию"
