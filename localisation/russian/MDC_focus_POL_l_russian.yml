INTERMARIUM: "Междуморье"
POL_project_intermarium_desc: "Запускается грандиозная стратегическая концепция «Междуморья» (Międzymorze) — геополитический проект, призванный объединить земли между Балтийским, Чёрным и Адриатическим морями в мощный блок, способный противостоять как германскому, так и российскому влиянию."
POL_new_center_of_power_desc: "Конечная цель проекта «Междуморье»: создать новый, независимый центр силы в Европе с Польшей в ядре, бросая вызов доминированию Брюсселя, Берлина и Москвы и меняя баланс сил на континенте."
POL_target_visegrad_desc: "Первый и самый важный шаг: консолидация Вышеградской группы (Польша, Чехия, Словакия, Венгрия) в ядро Междуморья, превращение неформального координационного форума в единое политическое и военное образование под польским руководством."
POL_target_baltics_desc: "Интеграция прибалтийских государств — Литвы, Латвии и Эстонии — в Междуморье, обеспечение северного фланга альянса и предоставление этим странам гарантий безопасности от внешних угроз, тем самым прочно втягивая их в орбиту Варшавы."
POL_target_eastern_balkans_desc: "Расширение сферы влияния Междуморья на Восточные Балканы с фокусом на Румынию, Болгарию и Молдову для обеспечения черноморского побережья и создания сплошного блока от Балтики до Чёрного моря."
POL_target_western_balkans_desc: "Дипломатическое наступление с целью вовлечения стран Западных Балкан — Хорватии, Словении, Сербии, Боснии и Герцеговины — в сферу влияния Междуморья, получение доступа к Адриатическому морю и стабилизация региона под его эгидой."
POL_tri_sea_pact_desc: "Формализация «Инициативы трёх морей» в обязывающий политический и военный пакт с акцентом на совместную инфраструктуру, энергетическую безопасность и оборонные проекты для укрепления единства участвующих стран."
POL_target_eastern_borderlands_desc: "Целевая стратегия по восстановлению польского влияния на исторических «Восточных кресах» Украины и Беларуси, использующая сочетание мягкой силы и политического давления для вовлечения этих территорий в орбиту Междуморья."
POL_polish_dream_desc: "Идеологическое и националистическое воплощение концепции Междуморья — «Польская мечта» о возрождённой, подобной Речи Посполитой, федерации, где Польша управляет обширной сферой влияния, обеспечивая свою безопасность и процветание на века вперёд."
POL_intermarium_desc: "Концепция Междуморья эволюционирует от политического проекта в осязаемую реальность по мере создания дипломатических, экономических и военных структур, связывающих страны-участницы в грозную конфедерацию."
POL_plan_prometheus_desc: "Активация «Плана Прометей» — стратегии, направленной на ослабление российского влияния путём поддержки движений за независимость и поощрения националистических настроений среди нерусских народов в сфере влияния России, перекликаясь с прометеевским проектом межвоенного периода."
POL_confederation_intermarium_desc: "Финальная и самая амбициозная стадия: превращение альянса Междуморье в формальную конфедерацию — наднациональное образование с общими институтами обороны, внешней политики и торговли, сохраняющее, однако, суверенитет государств-членов под руководящей рукой Польши."
POL_target_caucasus_desc: "Распространение влияния проекта Междуморье на регион Кавказа, поиск стратегического партнёрства со странами вроде Грузии и Азербайджана для обеспечения энергетических маршрутов и создания сплошного блока, противостоящего российскому влиянию."
POL_target_expand_the_project_desc: "Стратегическая цель по расширению Междуморья за пределы его первоначального ядра, стремление включить балканские и кавказские страны, тем самым превратив его из регионального альянса в крупную геополитическую силу, простирающуюся от Балтики до Чёрного и Каспийского морей."
POL_intermarium_category: "МЕЖДУМОРЬЕ"
POL_intermarium_category_desc: "\n\n\n\n\n\n£GFX_POL_intermarium_decision_category_picture\n\n\n\n\n\n\n\n\n\n\nМеждуморье — геополитический план после Первой мировой войны, разработанный Юзефом Пилсудским для объединения земель бывшей Речи Посполитой в единое государственное образование. План прошёл несколько итераций, некоторые из которых предусматривали включение соседних государств. Предлагаемое многонациональное образование должно было охватить территории, лежащие между Балтийским, Чёрным и Адриатическим морями, отсюда и название «Междуморье».\n\nКак потенциальная федерация стран Центральной и Восточной Европы, план Междуморья после Первой мировой войны, продвигаемый Пилсудским, стремился включить в предлагаемую федерацию прибалтийские государства (Литву, Латвию, Эстонию), Финляндию, Беларусь, Украину, Венгрию, Румынию, Югославию и Чехословакию. Польское название Międzymorze, означающее «Междуморье», было переведено на латынь как Intermarium.\n\nПредполагаемая федерация должна была стать аналогом Речи Посполитой, простирающейся от Балтийского моря до Чёрного, которая с конца XVI до конца XVIII века объединяла Королевство Польское и Великое княжество Литовское. Междуморье дополняло другую геополитическую концепцию Пилсудского — Прометеизм, целью которого был расчленение Российской империи и лишение её территориальных приобретений."
