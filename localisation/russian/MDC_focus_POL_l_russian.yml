polish_focus: "Древо Фокусов Польши"

POL_MILLENNIUM_DAWN_DESC: "Польша недавно вырвалась из коммунистического блока Советского Союза. Современное положение страны далеко от идеального. Несмотря на экономический рост с распада коммунизма, население Польши продолжает испытывать трудности. Тем не менее, у государства есть огромный потенциал для становления значимой экономической державой. Воспользовавшись хаосом, на политическую арену вышли две соперничающие партии: евроскептическая PiS и верная Евросоюзу PO. Различия во взглядах этих партий могут либо сделать Польшу центральноевропейской экономической державой, либо наоборот — отчуждить соседей и вновь встать на путь завоеваний. Кроме этого, появилась возможность объединить знаменитую Вышеградскую группу, где Польша, как сильнейшая из 4 стран, может решить окончательное соединение Польши, Чехии, Словакии и Венгрии под одним флагом. Однако когда две крупнейшие партии борются, некоторые лишь ждут момента выйти из тени. Националистическая партия UPR во главе с Янушем Корвин-Микке может оказаться победителем в этой дуэли и принести огромные перемены в Польшу. Однако не так просто националисту занять власть. Лех Валенса, бывший лидер антикоммунистической Солидарности, до сих пор присутствует в политике с партией ChDRP и сделает всё возможное, чтобы Корвин не погрузил страну в хаос."
poland_kaliningradanimal.1.t: "Калининградский зверь убил нашего генерала"
poland_kaliningradanimal.1.d: "Сегодня из Генерального штаба поступили ужасные новости: погиб генерал Вальдемар Щрыпчак. Он находился на учениях на границе Калининградской области, когда из леса внезапно выскочил черный медведь. Зверь убил в общей сложности 12 человек, включая генерала Вальдемара Щрыпчака, который стал первой жертвой животного. Нам удалось получить фотографию медведя с установленного на теле репортера, убитого в этом происшествии. После инцидента медведь скрылся. В настоящий момент наши войска ведут расследование, согласно которому зверь пришёл из Калининграда и ушёл обратно в леса через границу с областью."
poland_kaliningradanimal.1.a: "ТЫ ПРЕДАЛ НАС, ВОЙТЕК!"
poland_kaliningradanimal.2.t: "Калининградский зверь разрушил ульи."
poland_kaliningradanimal.2.d: "На границе с Калининградской областью располагалась пасека жителя Мазур. Там находились многочисленные ульи с разными флагами, польскими и украинскими. Прошлой ночью Калининградский зверь пришёл на пасеку, уничтожил все ульи с украинскими флагами, съел мёд, испражнился на украинские флаги и затем отправился к российской границе."
poland_kaliningradanimal.2.a: "Опять этот медведь!"
poland_kaliningradanimal.3.t: "Калининградский зверь украл наш танк."
poland_kaliningradanimal.3.d: "Сегодня, во время учений у границы с Калининградом, проходило испытание танков Т-72 Вердый. Вдруг из леса незаметно для наших солдат вышел медведь. По словам очевидцев, зверь подкрался к танку, забрался внутрь и уехал на нём в Россию. Солдат, находившийся в танке, утверждает, что медведь умело управлял машиной и старался доставить её в Россию невредимой настолько, насколько позволяли лапы — сбивая при этом все деревья на пути."
poland_kaliningradanimal.3.a: "КУРВА! ДА СКОЛЬКО МОЖНО!"
poland_kaliningradanimal.4.t: "Россия вручает Медведю орден Героя России"
poland_kaliningradanimal.4.d: "Медведь, прозванный Калининградским зверем, давно стал кошмаром поляков. С убийства генерала до украденного танка, это животное преследовало правительство Польши. Зверь выбирался из Калининграда в Польшу, совершал преступления и потом скрывался обратно в леса области. Сегодня СМИ взорвались сообщением, что Россия наградила этого медведя Орденом Героя России. Церемония прошла в Кремле, а репортеры докладывают, что медведь даже пожал руку главе [SOV.GetName]."
poland_kaliningradanimal.4.a: "ЧТО??"

