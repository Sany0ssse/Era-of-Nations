POL_deportatons_desc: "Комплексная государственная программа по выявлению, обработке и депортации лиц, проживающих в Польше без законного разрешения, направленная на утверждение контроля над миграционными потоками и соблюдение национального иммиграционного законодательства."
POL_Reorganization_of_special_services_desc: "Радикальная реформа разведывательной и контрразведывательной архитектуры Польши, направленная на устранение дублирования функций, прояснение цепочек командования и повышение оперативной эффективности в условиях современных угроз."
POL_abw_desc: "Усиление Агентства внутренней безопасности (ABW) как главного гражданского органа контрразведки и борьбы с коррупцией, отвечающего за защиту внутренней безопасности государства и конституционного порядка."
POL_agencja_wywiadu_desc: "Наделение Агентства внешней разведки (AW) полномочиями для сбора критически важной информации за рубежом, противодействия иностранным угрозам и продвижения стратегических интересов Польши на мировой арене."
POL_wsi_desc: "Роспуск и реформа Военной информационной службы (WSI), организации, обременённой посткоммунистическим наследием и скандалами, и её замена новыми, более прозрачными структурами."
POL_skw_desc: "Создание Службы военной контрразведки (SKW) для защиты Вооружённых сил Польши от шпионажа, саботажа и внутренней подрывной деятельности, обеспечения целостности и секретности армии."
POL_sww_desc: "Создание Службы военной разведки (SWW) для ведения внешней военной разведки, обеспечения раннего предупреждения об угрозах и поддержки международных операций Вооружённых сил Польши."
POL_mswa_desc: "Укрепление Министерства внутренних дел и администрации (MSWiA) как центрального командного органа для полиции, пограничной службы и служб чрезвычайного реагирования, координирующего национальную политику внутренней безопасности."
POL_straz_graniczna_poland_desc: "Модернизация Пограничной стражи (Straż Graniczna) с новым оборудованием, персоналом и юридическими полномочиями для эффективной защиты внешней границы Польши в ЕС от нелегальной миграции и трансграничной преступности."
POL_wot_poland_desc: "Расширение и профессионализация Войск территориальной обороны (WOT), компонента Вооружённых сил Польши, предназначенного для обороны территории страны, реагирования на кризисы и укрепления национальной устойчивости."
POL_National_Police_desc: "Программа реформы и модернизации Национальной полиции (Policja), сосредоточенная на улучшении отношений с населением, борьбе с организованной преступностью и внедрении передовых технологий для правоохранительных органов."
POL_Marshal_Guard_desc: "Повышение возможностей и престижа Маршальской гвардии (Straż Marszałkowska), сил безопасности, ответственных за защиту Сейма и Сената, символизирующих оборону польской демократии."
