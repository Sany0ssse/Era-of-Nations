POL_eliminate_labor_surplus: "Ликвидация избытка рабочей силы"
POL_restructuring_agriculture: "Реструктуризация сельского хозяйства"
POL_economy_desc: "Комплексная национальная стратегия по модернизации и укреплению польской экономики, ориентированная на ключевые секторы, такие как финансы, промышленность, энергетика и инфраструктура, для обеспечения устойчивого роста и конкурентоспособности."
POL_national_bank_desc: "Усиление Bank Gospodarstwa Krajowego (BGK) как ключевого государственного банка развития для финансирования стратегических национальных проектов и обеспечения стабильности польской экономики."
POL_polish_development_fund_desc: "Наделение Польского фонда развития (PFR) полномочиями главного двигателя финансирования инноваций, поддержки малых и средних предприятий и соинвестирования крупномасштабных промышленных проектов."
POL_alior_bank_desc: "Поддержка роста и цифровой трансформации Alior Bank для усиления конкуренции в секторе розничного банкинга и расширения доступности финансовых услуг."
POL_mbank_desc: "Содействие расширению mBank, лидера в области цифрового банкинга, для укрепления позиций Польши в секторе финтех и модернизации её финансовой инфраструктуры."
POL_pko_bank_polski_desc: "Курирование стратегического расширения PKO Bank Polski, крупнейшего банка Польши, для укрепления его внутреннего доминирования и увеличения международного присутствия."
POL_attracting_foreign_investment_desc: "Внедрение политики по созданию благоприятного делового климата, включая налоговые льготы и регуляторные реформы, для привлечения значительных прямых иностранных инвестиций в ключевые секторы."
POL_reduction_employment_desc: "Программа реформ по повышению эффективности государственного сектора за счёт оптимизации административного аппарата и сокращения избыточной занятости, высвобождая ресурсы для продуктивных инвестиций."
POL_eliminating_budget_deficit_desc: "Приверженность бюджетной дисциплине через контролируемые расходы и устойчивый экономический рост с целью достижения сбалансированного государственного бюджета и сокращения государственного долга."
POL_revision_of_tax_code_desc: "Комплексный пересмотр налоговой системы для упрощения соблюдения правил, закрытия лазеек и создания более прозрачной и эффективной системы для бизнеса и граждан."
POL_Telecommunication_desc: "Национальная инициатива по модернизации и расширению телекоммуникационной инфраструктуры Польши, обеспечение повсеместного доступа к высокоскоростному интернету и содействие цифровой инклюзии."
POL_rebranding_era_desc: "Ребрендинг и возрождение телекоммуникационного бренда 'Era' для повышения его конкурентоспособности на рынке и привлекательности для нового поколения потребителей."
POL_PolsatBox_desc: "Поддержка роста Polsat Box, крупного поставщика медиа и телекоммуникационных услуг, для укрепления внутреннего рынка и конкуренции с международными гигантами."
POL_IT_sphere_desc: "Целевая стратегия развития сектора информационных технологий, ориентированная на развитие талантов, инкубацию стартапов и позиционирование Польши как регионального IT-хаба."
POL_eConsulting_desc: "Содействие росту IT-консалтинговых компаний, таких как ITMAGINATION, для предоставления высококачественных услуг и продвижения цифровой трансформации в польских отраслях промышленности."
POL_EffectiveSoft_desc: "Поддержка компаний по разработке программного обеспечения, таких как EffectiveSoft, для повышения их экспортного потенциала и укрепления репутации Польши в области качественного IT-инжиниринга."
POL_CD_Project_RED_desc: "Поддержка и укрепление CD Projekt RED как национального лидера в мировой индустрии видеоигр, использование её успеха для продвижения польского творчества и технологий."
POL_Development_of_chemical_industry_desc: "Стратегический толчок к модернизации и расширению химического сектора, ориентированный на инновации, увеличение производственных мощностей и выпуск продуктов с более высокой добавленной стоимостью."
POL_Consolidation_of_Azoty_Tarnow_desc: "Лидерство в консолидации химической промышленности вокруг Grupa Azoty Tarnów для создания национального лидера, способного конкурировать на мировом рынке."
POL_ZAK_SA_desc: "Интеграция ZAK SA в национальную химическую стратегию для оптимизации производства, специализации на ключевых продуктовых линейках и повышения общей эффективности сектора."
POL_AAT_Polymers_desc: "Развитие специализированного производства полимеров через такие компании, как AAT Polymers, для захвата нишевых рынков и стимулирования инноваций в материаловедении."
POL_Takeover_of_Goat_TopCo_GmbH_desc: "Стратегическое приобретение иностранных активов, таких как Goat TopCo GmbH, для получения технологий, доступа на рынки и укрепления позиций польских химических компаний за рубежом."
POL_oil_refining_desc: "Программа модернизации и интеграции сектора нефтепереработки, повышение эффективности, объёмов выпуска и энергетической безопасности при соблюдении строгих экологических стандартов."
POL_Merger_CPN_and_Petrochemia_Plock_desc: "Историческое слияние CPN и Petrochemia Płock, фундаментальный шаг в создании нефтяного гиганта, который станет PKN Orlen."
POL_PKN_Orlen_desc: "Стратегическое расширение PKN Orlen, крупнейшей нефтяной компании Польши, в многопрофильный энергетический конгломерат со значительным региональным влиянием."
POL_Grupa_Lotos_desc: "Укрепление Grupa Lotos SA как ключевого игрока на рынке нефтепереработки и розничной продажи топлива, обеспечение конкуренции и безопасности поставок."
POL_Lotos_Petrobaltic_SA_desc: "Развитие возможностей Lotos Petrobaltic SA в области офшорной разведки и добычи на Балтийском море для использования внутренних углеводородных ресурсов."
POL_Orlen_and_Lotos_merger_desc: "Осуществление знакового слияния PKN Orlen и Grupa Lotos для создания единого мощного национального лидера в энергетическом секторе, повышение конкурентоспособности и операционной синергии."
POL_Orlengate_desc: "Преодоление политических и корпоративных скандалов вокруг группы Orlen, которые угрожают подорвать её стратегические цели и общественное доверие."
POL_Expansion_Abroad_desc: "Поддержка международной экспансии польских энергетических компаний через приобретения и партнёрства, обеспечение активов и рыночной доли за пределами национальных границ."
POL_development_heavy_industry_desc: "План оживления тяжёлой промышленности Польши, ориентированный на модернизацию, автоматизацию и переход к производству с более высокой добавленной стоимостью для сохранения глобальной конкурентоспособности."
POL_development_automobile_industry_desc: "Стратегия по укреплению позиций Польши как центральноевропейского хаба автомобильного производства и поставок запчастей, привлечение крупных мировых игроков."
POL_inter_cars_sa_desc: "Поддержка роста Inter Cars SA, ведущего дистрибьютора автозапчастей, для использования преимуществ расширяющегося регионального автомобильного рынка."
POL_foreign_cars_desc: "Политика по привлечению и удержанию инвестиций от иностранных производителей автомобилей, обеспечение непрерывного производства, рабочих мест и трансфера технологий."
POL_melex_desc: "Продвижение нишевых производителей транспортных средств, таких как Melex, для поддержания специализированного промышленного производства и сохранения уникального польского инженерного опыта."
POL_fso_desc: "Решение вопроса о наследии и будущем автомобильного завода FSO в Варшаве, символа автомобильной истории Польши, возможно через модернизацию или перепрофилирование."
POL_bus_industry_desc: "Консолидация и укрепление польского сектора производства автобусов, традиционно сильной области, для доминирования на европейском рынке."
POL_solaris_bus_coach_desc: "Поддержка Solaris Bus & Coach как лидера инноваций в экологически чистом общественном транспорте, экспорт электробусов и автобусов на водороде по всему миру."
POL_jelcz_bus_desc: "Возрождение исторического бренда Jelcz для закрепления его места на рынке специализированных тяжёлых транспортных средств и муниципального транспорта."
POL_ursus_desc: "Реструктуризация и модернизация производителя тракторов Ursus для возвращения его позиций в сельскохозяйственном и машиностроительном секторах."
POL_arrinera_automotive_desc: "Высоко рискованный, но потенциально высокодоходный выход на рынок суперкаров с Arrinera Automotive, цель — продемонстрировать амбиции польского инжиниринга на мировой арене."
POL_toyota_desc: "Закрепление и расширение производственного присутствия Toyota в Польше, краеугольного камня автомобильного экспорта и промышленной базы страны."
POL_fiat_desc: "Сохранение стратегической важности операций Fiat (ныне Stellantis) в Польше, одного из крупнейших и старейших автомобильных заводов страны."
POL_volkswagen_desc: "Использование существенного присутствия Volkswagen в Польше для развития местных цепочек поставок и интеграции в планы группы по производству электромобилей."
POL_volvo_desc: "Привлечение Volvo к созданию производственных мощностей в Польше, использование преимуществ перехода бренда на электробусы и грузовики."
POL_man_desc: "Расширение производственной и исследовательской деятельности MAN в Польше, укрепление сегмента коммерческих автомобилей и создание высококвалифицированных рабочих мест."
POL_deal_with_coal_problems_desc: "Противостояние структурным вызовам угольной промышленности, включая её экологическое воздействие и нерентабельность, посредством плана управляемого перехода."
POL_closure_unprofitable_mines_desc: "Трудный, но необходимый процесс закрытия экономически нежизнеспособных угольных шахт, сопровождаемый социальными пакетами и программами переобучения для пострадавших работников."
POL_grupa_gornicza_desc: "Реструктуризация государственной Polska Grupa Górnicza (PGG) для управления сокращением добычи каменного угля и обеспечения социальной стабильности в шахтёрских регионах."
POL_coking_coal_mining_desc: "Сохранение стратегических операций по добыче коксующегося угля, необходимых для отечественной сталелитейной промышленности, при одновременном повышении их эффективности и экологических показателей."
POL_manufacturing_industry_desc: "Широкая стратегия по модернизации производственной базы Польши, ориентированная на инновации, экспортную ориентацию и интеграцию в глобальные цепочки создания стоимости."
POL_attracting_investment_in_metallurgy_desc: "Предложение стимулов для привлечения современных, экологически чистых инвестиций в металлургический сектор для замены устаревшей инфраструктуры."
POL_iron_and_steel_production_desc: "Модернизация предприятий по производству чугуна и стали для сокращения их углеродного следа и сохранения конкурентоспособности на европейском рынке."
POL_kghm_polska_miedz_desc: "Поддержка KGHM Polska Miedź, мирового производителя меди и серебра, как стратегического национального актива и лидера в области ответственной добычи ресурсов."
POL_kghm_international_desc: "Управление международным портфелем шахт KGHM для диверсификации геополитических рисков и обеспечения стабильного потока сырья для польской экономики."
POL_american_mines_desc: "Контроль за инвестициями KGHM в американские шахты для обеспечения их положительного вклада в финансовые результаты и стратегические цели корпорации."
POL_sierra_gorda_deposit_desc: "Освоение сложного месторождения Sierra Gorda в Чили, критический тест способности KGHM управлять крупномасштабными международными проектами."
POL_canadian_mines_desc: "Оптимизация операций на канадских активах KGHM для укрепления позиций компании в североамериканском горнодобывающем секторе."
POL_deal_with_electricity_problems_desc: "Комплексный план решения проблем стареющей энергосистемы, нехватки мощностей и высоких выбросов в Польше за счёт диверсификации и модернизации."
POL_EPP2040_desc: "Реализация Энергетической политики Польши до 2040 года (EPP2040), государственной дорожной карты справедливого перехода и долгосрочной энергетической безопасности."
POL_moj_prad_project_desc: "Продвижение программы субсидий 'Mój Prąd' (Моё электричество) для стимулирования внедрения бытовых фотоэлектрических установок по всей стране."
POL_PWEA_desc: "Сотрудничество с Польской ассоциацией ветроэнергетики (PWEA) для устранения регуляторных барьеров и раскрытия потенциала наземной ветроэнергетики."
POL_expansion_baltic_wind_turbines_desc: "Ускорение развития массивных офшорных ветряных электростанций на Балтийском море, краеугольного камня будущего снабжения Польши зелёной энергией."
POL_PEP2040_desc: "Обновлённая Энергетическая политика до 2040 года (PEP2040), ориентированная на сбалансированный микс атомной энергии, ВИЭ и газа для достижения климатических целей и энергетической независимости."
POL_poland_nuclear_program_desc: "Запуск флагманской программы Польши по атомной энергетике для обеспечения стабильной, безуглеродной базовой генерации и декарбонизации энергосистемы."
POL_Investor_choice_desc: "Критическое решение о выборе стратегического иностранного партнёра для предоставления технологий и финансирования строительства первой атомной электростанции Польши."
POL_polish_energy_companies_desc: "Обеспечение ведущей роли контролируемых государством энергетических компаний, таких как PGE, Tauron и Energa, в энергетическом переходе страны."
POL_westinghouse_electric_desc: "Стремление к партнёрству с Westinghouse Electric Company, что свяжет ядерное будущее Польши с американскими технологиями и геополитическими интересами."
POL_rosatom_desc: "Рассмотрение спорного партнёрства с российской госкорпорацией 'Росатом' — вариант, чреватый геополитическим риском, но потенциально предлагающий преимущества по стоимости."
POL_american_nuclear_power_plants_desc: "Потенциальный результат выбора Westinghouse: строительство реакторов AP1000, прочное встраивание Польши в западную технологическую сферу."
POL_russian_nuclear_power_plants_desc: "Высоко рискованный результат выбора 'Росатома': строительство реакторов ВВЭР, создающее долгосрочную энергетическую зависимость от России."
POL_own_enrichment_complexes_desc: "Долгосрочная амбиция по развитию внутренних возможностей ядерно-топливного цикла, включая обогащение, для обеспечения большей энергетической независимости."
POL_peaceful_atom_desc: "Продвижение мирного использования ядерных технологий помимо генерации электроэнергии, включая медицину, промышленность и научные исследования."
POL_nuclear_poland_desc: "Видение 'Ядерной Польши', где атомная энергия станет центральной опорой энергетической безопасности, экономики и технологического могущества нации."
POL_dirty_bomb_desc: "Усиление национальной радиологической безопасности и возможностей реагирования на чрезвычайные ситуации для предотвращения и смягчения угрозы 'грязных бомб' или ядерных аварий."
POL_nuclear_research_desc: "Инвестиции в ядерные исследования и разработки, использование научных институтов Польши для наращивания внутренней экспертизы в ядерную эпоху."
POL_construction_of_nuclear_reactors_desc: "Грандиозная задача строительства нескольких ядерных реакторов, многолетний инфраструктурный проект, который определит энергетический ландшафт Польши."
POL_pge_nuclear_monopoly_desc: "Установление PGE в качестве ведущего субъекта ядерной программы, концентрация государственных ресурсов и ответственности в одной компании."
POL_energa_desc: "Интеграция Energa в консорциум ядерного проекта, использование её экспертизы и финансовых возможностей."
POL_tauron_polska_energia_desc: "Привлечение Tauron Polska Energia к ядерно-энергетическому предприятию, обеспечение широкого участия национального энергетического сектора."
POL_pge_desc: "Преобразование Polska Grupa Energetyczna (PGE) из угольной энергокомпании в современную энергетическую группу с ядерной энергетикой в качестве основы."
POL_visaginas_nuclear_power_plant_desc: "Исследование регионального сотрудничества, потенциальное возрождение замороженного проекта Висагинской АЭС в Литве как совместного балтийско-польского предприятия."
POL_pge_ej1_desc: "Конкретная проектная компания PGE EJ 1, отвечающая за подготовку и строительство первой атомной электростанции Польши."
POL_zharnovets_npp_desc: "Возрождение площадки 'Жарновец', изначально предназначавшейся для АЭС в 1980-х, в качестве предпочтительного места для новой АЭС."
POL_eu_largest_energy_storage_desc: "Пионерский проект строительства одного из крупнейших в Европе хранилищ энергии, критически важного для балансировки энергосистемы с использованием непостоянных возобновляемых источников."
POL_expansion_offshore_wind_energy_desc: "Масштабная инвестиционная программа по развитию офшорного ветропотенциала Польши на Балтийском море, создание новой отрасли промышленности и источника зелёной энергии."
POL_infrastructure_expansion_desc: "Общенациональный толчок к модернизации и расширению критической инфраструктуры, включая дороги, железные дороги, порты и цифровые сети, для поддержки экономического роста."
POL_LOT_Polish_Airline_desc: "Преобразование LOT Polish Airlines в флагманского перевозчика и стратегический актив, расширение её маршрутной сети и улучшение связности для бизнеса и туризма."
POL_SprintAir_desc: "Поддержка региональных авиакомпаний, таких как SprintAir, для улучшения доступности авиаперелётов в малые города и содействия сбалансированному региональному развитию."
POL_pkp_desc: "Комплексная реформа и модернизация Польских государственных железных дорог (PKP), сосредоточение на повышении эффективности, качества обслуживания и грузоподъёмности."
POL_RRT_extension_desc: "Расширение сети быстрого сельского транспорта (RRT) для борьбы с транспортным обособлением в сельской местности и лучшего соединения сельских районов с городскими центрами."
POL_investments_in_eastern_infrastructure_desc: "Целевые инфраструктурные инвестиции в Восточной Польше ('Восточная стена') для стимулирования экономического развития и сокращения регионального неравенства."
POL_Treaty_with_russia_desc: "Высокорискованный энергетический договор с Россией, потенциально обеспечивающий поставки газа, но создающий стратегические зависимости и геополитические уязвимости."
POL_Treaty_with_usa_desc: "Стратегический договор с Соединёнными Штатами, ориентированный на энергетическое сотрудничество (поставки СПГ), оборону и углубление политических и экономических связей."
POL_Treaty_with_Ukraine_desc: "Комплексный договор с Украиной, укрепляющий экономические, энергетические и инфраструктурные связи и способствующий политической солидарности."
POL_Treaty_with_germany_desc: "Ключевой договор с Германией для углубления экономической интеграции, управления исторической чувствительностью и координации политики ЕС."
POL_Treaty_with_Great_Britain_desc: "Договор с Великобританией после Brexit по сохранению прочных торговых, инвестиционных и оборонных отношений вне рамок ЕС."
POL_Attract_investment_in_agriculture_desc: "Политика привлечения современных инвестиций в сельскохозяйственный сектор, содействие консолидации, внедрению технологий и производству с добавленной стоимостью."
POL_increasing_farming_desc: "Инициативы по повышению продуктивности и устойчивости польских ферм через модернизацию, обучение и доступ к новым технологиям."
POL_eliminate_labor_surplus_desc: "Решение проблемы скрытой безработицы в сельском хозяйстве путём содействия перемещению рабочей силы в более продуктивные секторы экономики."
POL_restructuring_agriculture_desc: "Структурная трансформация сельскохозяйственного сектора для создания более крупных, эффективных ферм, способных конкурировать на европейском и мировом рынках."
