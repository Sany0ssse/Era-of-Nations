poland_commi.1.t: "Борьба с ревизионизмом"
poland_commi.1.d: "После смерти Иосифа Сталина появилось много критиков сталинистского марксизма и сторонников реформ марксистской идеологии. Они критиковали однопартийное правление и выступали за свободу прессы и искусства, внутрипартийную и иногда межпартийную демократию, независимые профсоюзы, отмену бюрократических привилегий и подчинение полиции судебной власти. Эти люди стали известны как ревизионисты, а их идеология — ревизионизм.\nОдним из этих ревизионистов был Никита Хрущёв, председатель ЦК КПСС, который сменил Иосифа Сталина. Именно это отступление от основных идей Маркса ознаменовало начало распада Советского Союза. Мы не должны допустить, чтобы это произошло с нашей страной."
poland_commi.1.a: "Идеи Ленина вечны!"
poland_commi.2.t: "Католики и коммунисты"
poland_commi.2.d: "Польша исторически является христианской католической страной, и даже во время Польской Народной Республики католицизм оставался важной частью общества. Польша была, пожалуй, единственной социалистической страной, которая не только воздерживалась от демонтажа церквей и соборов, но и сотрудничала с епископатом. Духовенство было активной частью политической жизни Польши и, в отличие от других идеологически схожих стран, не подвергалось преследованиям. Мы тоже должны решить, будем ли мы продолжать эту практику или пойдём по пути Советского Союза."
poland_commi.2.a: "Вера неотделима от Польши, и это должно быть признано!"
poland_commi.2.b: "Религия — это оружие классового угнетения"
poland_commi.3.t: "Польша предлагает альянс"
poland_commi.3.d: "С тех пор как Коммунистическая партия пришла к власти в Польше и восстановилась социалистическая система, польское правительство потеплело к России и стремится примирить отношения, которые были нарушены Третьей Республикой.\nСегодня польский лидер [POL.GetLeader] лично посетил нашу страну и привёз с собой несколько интересных документов для подписания. Содержание этих документов сразу же проясняет: это альянс."
poland_commi.3.a: "Это будет славный союз"
poland_commi.3.b: "Мы не будем иметь дело с коммунистами!"
poland_commi.4.t: "Союз между Польшей и Россией"
poland_commi.4.d: "Сегодня СМИ взорвались новостями о том, что [POL.GetName] и [SOV.GetName] подписали какое-то соглашение, содержание которого явно напоминает военный альянс.\nОттепель в отношениях между двумя странами давно намекала, что такой исход вполне вероятен, но никто не ожидал, что это будет так внезапно.\nНи Соединённые Штаты, ни НАТО в целом ещё не отреагировали на эту новость, но ясно, что такой альянс и агрессивно-революционная политика Польши сдвинут баланс сил в Европе в ущерб НАТО и ЕС. Мы переживаем новый поворотный момент в мировой политике и истории."
poland_commi.4.a: "Возврат Варшавского договора?"
poland_commi.5.t: "Договор подписан"
poland_commi.5.d: "Министерство иностранных дел России и российский лидер [SOV.GetLeader] подписали соглашение. Это ознаменовало начало славного альянса, который, я надеюсь, вырастет во что-то большее."
poland_commi.5.a: "Витайте, товарищи!"
poland_commi.6.t: "Договор не подписан"
poland_commi.6.d: "Россия отказалась подписать договор о союзе. Видимо, они не разделяют наши коммунистические идеалы. Ну что ж, мы продолжим сотрудничать с ними и проводить дружественную политику в надежде, что они одумаются в будущем."
poland_commi.6.a: "Жаль"
poland_commi.7.t: "Польша приглашает нас в свой альянс"
poland_commi.7.d: "Польша отправила нам дипломатическое предложение. В рамках восстановления Второго Варшавского договора они приглашают нас присоединиться к их недавно созданному альянсу. Этот шаг подтолкнёт пролетариат всех стран к единству и приблизит триумф коммунистических идеалов."
poland_commi.7.a: "Рабочие мира — объединяйтесь"
poland_commi.7.b: "Это не в наших интересах."
poland_commi.8.t: "Возврат Варшавского договора"
poland_commi.8.d: "Сегодня Польская Народная Республика объявила о возврате Варшавского договора. Этот альянс был распущен в 1991 году после распада Советского Союза. Однако новое социалистическое правительство Польши объявило о своём намерении восстановить альянс и превзойти его славу."
poland_commi.8.a: "Что будет дальше..."
poland_commi.9.t: "Второй Варшавский договор"
poland_commi.9.d: "Сегодня [FROM.GetName] объявило о своём намерении присоединиться к недавно сформированному альянсу Второго Варшавского договора Польши. Этот шаг изменит глобальный баланс сил и склонит чашу весов в пользу Социалистического блока."
poland_commi.9.a: "Что?"
poland_commi.10.t: "[FROM.GetName] согласился присоединиться к Варшавскому договору"
poland_commi.10.d: "Сегодня [FROM.GetAdjective] дипломаты ответили на наше приглашение. Они согласны связать наши страны договором о союзе под названием Варшавский договор. Этот шаг укрепит наши связи и приблизит великую Коммунистическую революцию по всему миру!"
poland_commi.10.a: "Рабочие всего мира, объединяйтесь!"
poland_commi.11.t: "[FROM.GetName] отказался присоединиться к Варшавскому договору"
poland_commi.11.d: "Сегодня [FROM.GetAdjective] дипломаты ответили на наше приглашение. Они отказались вступить в идеологический альянс с нами."
poland_commi.11.a: "Не проблема для революции"
poland_commi.12.t: "Осуждение американского империализма"
poland_commi.12.d: "Польское правительство осуждает американский империализм и призывает нас сделать то же самое, но готовы ли мы навредить нашим отношениям с Соединёнными Штатами?"
poland_commi.12.a: "Проклятые американцы!"
poland_commi.12.b: "Мы не будем осуждать"
poland_commi.13.t: "Совместная военная операция против Косово"
poland_commi.13.d: "Польское правительство предлагает нам возможность раз и навсегда покончить с Косово и его ложной независимостью и готово полностью поддержать нас вплоть до объявления войны Косово."
poland_commi.13.a: "У Косово нет шансов"
poland_commi.13.b: "Не стоит"
poland_commi.14.t: "Совместная военная операция против Косово"
poland_commi.14.d: "Сербское правительство отказалось провести совместную военную операцию с нами в Косово, и они, кажется, боятся даже бороться за свои исторические территории."
poland_commi.14.a: "Жаль"
poland_commi.15.t: "Сотрудничество с [POL.GetName]"
poland_commi.15.d: "Польское правительство намеревается установить контакты с нами и развить полноценное сотрудничество. Похоже, европейские страны начинают искать диалог с нами."
poland_commi.15.a: "Мы готовы сотрудничать."
poland_commi.15.b: "Нам это не нужно."
poland_commi.16.t: "Сотрудничество с [NKO.GetName]"
poland_commi.16.d: "Их правительство отказалось сотрудничать с нами, и они, похоже, не нуждаются в партнёрстве с нами."
poland_commi.16.a: "Жаль"
poland_commi.17.t: "Продажа оружия Польше [POL.GetName]"
poland_commi.17.d: "Мы можем расширить наше партнёрство с Польшей и предложить им купить наше оружие"
poland_commi.17.a: "Хорошая идея"
poland_commi.17.b: "Нет"
poland_commi.18.t: "[NKO.GetName] предлагает нам купить оружие"
poland_commi.18.d: "Правительство Северной Кореи решило расширить своё партнёрство с нами и готово предложить нам часть своего оружия. Нужно ли оно нам?"
poland_commi.18.a: "Хорошая идея"
poland_commi.18.b: "Нет"
poland_commi.19.t: "Сделка по оружию с [POL.GetName]"
poland_commi.19.d: "Польское правительство согласилось подписать соглашение о покупке нашего оружия."
poland_commi.19.a: "Отлично"
poland_commi.20.t: "Сделка по оружию с [POL.GetName]"
poland_commi.20.d: "Польское правительство отказалось подписать соглашение о покупке нашего оружия"
poland_commi.20.a: "Жаль"
poland_commi.21.t: "Польские миротворцы"
poland_commi.21.d: "Польское правительство предлагает развернуть своих миротворцев на одной из наших баз, утверждая, что они готовы гарантировать безопасность нашей страны от её соседей."
poland_commi.21.a: "Мы согласны"
poland_commi.21.b: "Нет"
poland_commi.22.t: "Наши миротворцы в [PMR.GetName]"
poland_commi.22.d: "Приднестровское правительство согласилось разместить наших миротворцев"
poland_commi.22.a: "Отлично"
poland_commi.23.t: "Наши миротворцы в [PMR.GetName]"
poland_commi.23.d: "Приднестровское правительство отказало в нашей просьбе развернуть миротворцев"
poland_commi.23.a: "Жаль"
poland_commi.24.t: "Мобилизация миротворцев в [PMR.GetName]"
poland_commi.24.d: "Приднестровье на грани войны, и мы можем либо мобилизовать наших миротворцев и помочь Приднестровью, либо отправить их домой."
poland_commi.24.a: "Мы их мобилизуем"
poland_commi.24.b: "Пора им возвращаться домой"
poland_commi.25.t: "Экономическое сотрудничество с [POL.GetName]"
poland_commi.25.d: "Польское правительство готово подписать с нами экономическое соглашение, согласно которому мы получим хорошие инвестиции, а они откроют визы для наших рабочих для въезда в их страну, что также принесёт нам некоторый доход в будущем."
poland_commi.25.a: "Мы согласны"
poland_commi.25.b: "Нет"
poland_commi.26.t: "Экономическое сотрудничество с [LAO.GetName]"
poland_commi.26.d: "Они согласились подписать с нами соглашение об экономическом сотрудничестве"
poland_commi.26.a: "Отлично"
poland_commi.27.t: "Экономическое сотрудничество с [LAO.GetName]"
poland_commi.27.d: "Они отказались подписать с нами соглашение об экономическом сотрудничестве"
poland_commi.27.a: "Жаль"
poland_commi.28.t: "Экономическое сотрудничество с [POL.GetName]"
poland_commi.28.d: "Польское правительство готово подписать с нами экономическое соглашение, согласно которому мы получим хорошие инвестиции, а они откроют визы для наших рабочих для въезда в их страну, что также принесёт нам некоторый доход в будущем."
poland_commi.28.a: "Мы согласны"
poland_commi.28.b: "Нет"
poland_commi.29.t: "Экономическое сотрудничество с [VIE.GetName]"
poland_commi.29.d: "Они согласились подписать с нами соглашение об экономическом сотрудничестве"
poland_commi.29.a: "Отлично"
poland_commi.30.t: "Экономическое сотрудничество с [VIE.GetName]"
poland_commi.30.d: "Они отказались подписать с нами соглашение об экономическом сотрудничестве"
poland_commi.30.a: "Жаль"
poland_commi.31.t: "Экономическое сотрудничество с [POL.GetName]"
poland_commi.31.d: "Польское правительство предлагает нам экономическое партнёрство, которое затронет многие секторы наших экономик, и это может стать началом новой эры дружбы между нашими странами. Готовы ли мы к этому?"
poland_commi.31.a: "Да"
poland_commi.31.b: "Нет"
poland_commi.32.t: "Экономическое сотрудничество с [SER.GetName]"
poland_commi.32.d: "Они согласились подписать с нами соглашение об экономическом сотрудничестве"
poland_commi.32.a: "Отлично"
poland_commi.33.t: "Экономическое сотрудничество с [SER.GetName]"
poland_commi.33.d: "Они отказались подписать с нами соглашение об экономическом сотрудничестве"
poland_commi.33.a: "Жаль"
poland_commi.34.t: "Экономическое сотрудничество с [POL.GetName]"
poland_commi.34.d: "Польское правительство предлагает нам экономическое партнёрство, и в качестве отправной точки для этого партнёрства оно предлагает помочь нам в области добычи нефти и газа. Польские нефтяные компании готовы подписать соглашение о разведке нефти и газа в нашей стране."
poland_commi.34.a: "Нам это нужно"
poland_commi.34.b: "Нет"
poland_commi.35.t: "Экономическое сотрудничество с [CUB.GetName]"
poland_commi.35.d: "Они согласились подписать с нами соглашение об экономическом сотрудничестве"
poland_commi.35.a: "Отлично"
poland_commi.36.t: "Экономическое сотрудничество с [CUB.GetName]"
poland_commi.36.d: "Они отказались подписать с нами соглашение об экономическом сотрудничестве"
poland_commi.36.a: "Жаль"
