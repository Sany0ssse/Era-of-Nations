poland_ukrmigration.1.t: "Украинцы массово мигрируют в нашу страну."
poland_ukrmigration.1.d: "С начала полномасштабной войны в Украине тысячи мигрантов хлынули на наши границы. Наши граждане обеспокоены, что столь стремительный рост миграции может вызвать нестабильность в обществе, а сами мигранты начнут отнимать рабочие места у населения. Как обычно, у лидеров партий по вопросу украинской миграции разные позиции: одни выступают за помощь в обустройстве в нашей стране и предоставление им особого внимания как беженцам, другие же, наоборот, ратуют за то, чтобы украинские мигранты не получали от правительства особых льгот и обязывались уважать польскую культуру и порядок на польских улицах. Какой из этих вариантов наилучший для нас?"
poland_ukrmigration.1.a: "С этой миграцией нужно что-то делать."
poland_ukrmigration.1.b: "Оказать помощь беженцам"
