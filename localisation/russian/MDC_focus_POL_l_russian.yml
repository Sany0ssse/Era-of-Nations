poland_army.39.d: "Соединённые Штаты согласились продать нам 100 ракет Томагавк, а также поставили нам несколько пусковых установок для этих ракет. Хорошая сделка"
poland_army.40.t: "США отказали в продаже ракетных комплексов Томагавк"
poland_army.40.d: "США отказались продавать нам свои ракеты Томагавк и пусковые установки. Похоже, нам придётся найти другие способы получить крылатые ракеты."
poland_army.41.t: "Польша хочет купить Су-25"
poland_army.41.d: "Польские дипломаты обратились к нам с предложением. Они хотят купить несколько десятков истребителей Су-25 для своих ВВС. Они заплатят разумную цену за это, согласимся ли мы?"
poland_army.42.t: "Россия согласилась продать нам Су-25"
poland_army.42.d: "Россия согласилась продать нам 50 своих истребителей Су-25. Это хорошее приобретение для наших ВВС, отлично!"
poland_army.43.t: "Россия отказала в продаже Су-25"
poland_army.43.d: "Россия отказалась продавать нам свои истребители Су-25. Очень жаль, но, видимо, у них были на то причины, нам придётся искать другие способы приобретения самолётов"
poland_army.44.t: "Польша хочет купить A-10A Thunderbolt II"
poland_army.44.d: "Польские дипломаты обратились к нам с предложением. Они хотят купить несколько десятков истребителей A-10A Thunderbolt II для своих ВВС. Они заплатят разумную цену за это, согласимся ли мы?"
poland_army.45.t: "США согласились продать нам A-10A Thunderbolt II"
poland_army.45.d: "Соединённые Штаты согласились продать нам 50 своих истребителей A-10A Thunderbolt II. Это хорошее приобретение для наших ВВС, отлично!"
poland_army.46.t: "США отказали в продаже A-10A Thunderbolt II"
poland_army.46.d: "Соединённые Штаты отказались продавать нам свои истребители A-10A Thunderbolt II. Очень жаль, но, видимо, у них были на то причины, нам придётся искать другие способы приобретения самолётов"
poland_army.47.t: "Польша хочет купить F-15E"
poland_army.47.d: "Польские дипломаты обратились к нам с предложением. Они хотят купить несколько десятков истребителей F-15E для своих ВВС. Они заплатят разумную цену за это, согласимся ли мы?"
poland_army.48.t: "США согласились продать нам F-15E"
poland_army.48.d: "Соединённые Штаты согласились продать нам 50 своих истребителей F-15E. Это хорошее приобретение для наших ВВС, отлично!"
