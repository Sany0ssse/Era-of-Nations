# KONF AI LOC 
POL_conf_lib_ind_desc: "Конфедерация Свобода и Независимость консолидируется как радикальная правоцентристская политическая сила, объединяя либертарианцев, националистов и традиционалистов под общим знаменем стойких антиевропейских настроений, экономического либерализма и социального консерватизма."
POL_polish_traditionalism_desc: "Продвижение социального порядка, основанного на исторических традициях, обычаях и народных обычаях Польши, позиционируя их как противоядие современной либеральной глобализации и основу здорового национального сообщества."
POL_polish_nationalism_desc: "Идеология, которая ставит польскую этно-нацию в центр государственной политики, отстаивая её интересы превыше всех остальных и рассматривая национальную идентичность как основной источник политической легитимности."
POL_polish_ethnocracy_desc: "Пропаганда модели государства, где политическая власть и национальная идентичность формально связаны с польской этничностью, потенциально маргинализируя национальные меньшинства и приоритизируя интересы этнического большинства в законе и политике."
POL_conservative_approach_desc: "Общая философия управления, которая ценит благоразумие, историческую преемственность и скептицизм по отношению к быстрым социальным изменениям, стремясь сохранить устоявшиеся институты и культурные нормы."
POL_right_socialism_desc: "Синкретическая идеология, сочетающая националистическую и традиционалистскую социальную политику с элементами государственного вмешательства в экономику для поддержки этнических польских семей и рабочих, отличная как от свободного рыночного капитализма, так и от левого социализма."
POL_korwins_gambit_desc: "Высокорискованная политическая и экономическая стратегия, отстаиваемая Янушем Корвин-Микке, включающая радикальные либертарианские реформы, конфронтационную позицию по отношению к политическому истеблишменту и ставку на привлечение недовольных избирателей."
POL_preservation_of_christian_moral_principles_desc: "Основная политика юридического закрепления католических моральных учений как основы общественной жизни, влияющая на законодательство в области семьи, образования и культуры для борьбы с секуляризацией."
POL_restoration_of_polish_culture_desc: "Государственная инициатива по очистке от воспринимаемых иностранных влияний и продвижению подлинно польского искусства, истории и ценностей в общественной сфере, направленная на восстановление национального культурного суверенитета."
POL_support_the_traditional_family_model_desc: "Активная государственная поддержка семей, основанных на браке гетеросексуальной пары, через финансовые льготы, налоговые стимулы и правовые рамки, которые препятствуют альтернативным семейным структурам."
POL_banning_LGBTQ_rights_desc: "Стремление к законодательству, запрещающему 'пропаганду' ЛГБТК-идентичностей и ограничивающему правовое признание однополых отношений, представленное как защита детей и традиционных ценностей."
POL_strengthening_role_of_family_desc: "Политика, направленная на то, чтобы сделать традиционную семью центральной единицей общества, предоставляя ей большую автономию от государства, поддерживая её финансово и юридически как основной источник социального обеспечения."
POL_commitment_to_faith_desc: "Личное и политическое обязательство соблюдать принципы католической веры, влияющее на принятие решений и способствующее тесному союзу между государством и церковной иерархией."
POL_respect_for_historical_values_desc: "Образовательная и культурная политика, направленная на прославление героического прошлого Польши, особенно её борьбы за независимость, и привитие патриотической гордости молодому поколению."
POL_combating_increasing_migration_desc: "Строгая политика противодействия и предотвращения иммиграции, особенно из стран с мусульманским большинством, ссылаясь на угрозы национальной безопасности, социальной сплочённости и культурной идентичности."
POL_polonization_of_migrants_desc: "Политика, требующая принудительной культурной и языковой ассимиляции любых допущенных меньшинств, требующая от них отказаться от своей прежней идентичности и полностью принять польский язык и обычаи."
POL_restore_the_death_penalty_desc: "Попытка вернуть смертную казнь за самые серьёзные преступления, утверждая, что она служит справедливым возмездием и эффективным сдерживающим фактором против отвратительных деяний."
POL_abolition_of_income_tax_desc: "Радикальное либертарианское предложение полностью отменить подоходный налог, направленное на стимулирование экономического роста, увеличение индивидуальной свободы и резкое сокращение размера правительства."
POL_school_voucher_program_desc: "Реформа по замене прямого государственного финансирования школ ваучерами для родителей, способствующая выбору школы и конкуренции, при этом благоприятствуя частным и религиозным образовательным учреждениям."
POL_creation_of_cultural_vouchers_desc: "Система предоставления гражданам ваучеров для расходования на частные культурные учреждения, направленная на децентрализацию государственного финансирования и расширение индивидуального выбора на культурном рынке."
POL_reducing_government_spending_desc: "Фундаментальная приверженность сокращению государственных расходов в большинстве секторов, стремление достичь минимального государства, снизить налоги и уменьшить государственный долг."
POL_new_healthcare_program_desc: "Комплексная перестройка системы здравоохранения в сторону преимущественно частной и страховой модели, сводя роль государства к минимуму и способствуя рыночным механизмам."
POL_business_reforms_desc: "Пакет мер по дерегуляции, направленных на устранение бюрократических препон, упрощение налогового кодекса и создание более благоприятной среды для предпринимателей и бизнеса."
POL_firearms_licenses_desc: "Либерализация законов об оружии для обеспечения более широкого доступа к огнестрельному оружию законопослушным гражданам, представленная как фундаментальное право на самооборону и сдерживающий фактор против преступности."
POL_new_constitution_of_poland_desc: "Разработка и принятие конституции для замены документа 1997 года, направленная на переопределение Польши как сильно президентской, децентрализованной и явно христианской республики."
POL_return_to_royalism_desc: "Нишевое, но символическое политическое движение, выступающее за восстановление польской монархии, либо как конституционного главы государства, либо как могущественного суверена, как решение партийных раздоров."
POL_presidential_system_desc: "Конституционная реформа для установления сильной, исполнительной президентской республики, где президент обладает значительной властью над правительством и законодательной властью, сокращая роль парламента."
POL_reducing_role_of_sejm_desc: "Реформа по значительному ограничению полномочий нижней палаты парламента (Сейм), передача её законодательной инициативы и надзорных возможностей исполнительной власти."
POL_reducing_power_of_the_senate_desc: "Маргинализация или даже отмена Сената, верхней палаты парламента, рассматриваемая как ненужный и препятствующий пережиток в процессе законотворчества."
POL_creation_of_state_council_desc: "Создание могущественного, не избираемого консультативного органа, состоящего из уважаемых деятелей, для консультирования президента по ключевым вопросам государства, потенциально обходя традиционные парламентские каналы."
POL_rule_of_law_desc: "Интерпретация верховенства права, которая подчёркивает буквальный текст законодательства и суверенитет национального права над международными судами и договорами."
POL_principle_of_subsidiarity_desc: "Реализация политического принципа, согласно которому социальные и политические вопросы должны решаться на наиболее непосредственном (или местном) уровне, который соответствует их решению."
POL_we_dont_need_european_union_desc: "Основополагающая политика, выступающая за немедленный выход Польши из Европейского союза, который изображается как бюрократический, социалистический и суицидальный для суверенитета проект."
POL_nuclearization_of_poland_desc: "Смелая инициатива по приобретению национального ядерного сдерживания, либо через внутреннюю разработку, либо через покупку у дружественной державы, для гарантии безопасности Польши независимо от любых альянсов."
POL_decline_of_german_and_us_influence_desc: "Внешнеполитическая цель систематического снижения политического, экономического и военного влияния как Германии, так и Соединённых Штатов на Польшу, стремление к поистине независимому курсу."
POL_reconciliation_with_belarus_desc: "Дипломатический жест по нормализации отношений с Беларусью, независимо от её правительства, основанный на общем славянском наследии и прагматических экономических и военных интересах."
POL_normalization_of_relations_with_russia_desc: "Высококонтроверсионная политика стремления положить конец конфронтации с Россией, аргументируя прагматическое сотрудничество в торговле и безопасности, при этом преуменьшая исторические и текущие конфликты."
POL_double_defense_spending_desc: "Обязательство по массовому увеличению военных расходов для быстрой модернизации вооружённых сил, направленное на самодостаточность и мощную сдерживающую способность."
POL_russophile_rhetoric_desc: "Принятие политического нарратива, сочувствующего российской перспективе в международных делах, часто обвиняющего НАТО и ЕС в провоцировании напряжённости и выступающего за более тесные связи с Москвой."
POL_leave_NATO_korwin_desc: "Радикальное предложение для Польши выйти из Организации Североатлантического договора, утверждая, что альянс ненужно провоцирует Россию и компрометирует польский суверенитет."
POL_together_with_russia_against_usa_desc: "Самая крайняя внешнеполитическая позиция, представляющая стратегическое переориентирование, где Польша сотрудничает с возрождающейся Россией для противодействия американской глобальной гегемонии и германскому доминированию в Европе."
POL_unity_of_party_desc: "Критическая инициатива по преодолению идеологических разногласий между либертарианским и националистическим крыльями Конфедерации, создание сплочённой политической силы, способной реализовать свою радикальную повестку дня и бросить вызов политическому истеблишменту."
POL_new_constitution_of_Poland_desc: "Разработка и принятие принципиально новой конституции для замены документа 1997 года, направленная на резкое ограничение масштабов правительства, защиту прав собственности и переопределение Польши как децентрализованного государства, основанного на традиционных ценностях и механизмах прямой демократии."

