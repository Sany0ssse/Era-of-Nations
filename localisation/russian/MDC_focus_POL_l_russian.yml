POL_samooborona: "Samoobrona Rzeczpospolitej Polskiej"
POL_samooborona_desc: "«Самоборона Республики Польша» — христианско-социалистическая, популистская, аграрная и националистическая политическая партия и профсоюз в Польше. Партия продвигает аграрно-социалистическую и католическо-социалистическую экономическую политику в сочетании с левопопулистской, антиглобалистской и антилиберальной риторикой. Партия описывает себя как левую, хотя подчёркивает, что принадлежит к патриотическим левым и следует католическому социальному учению. Симпатии партии к коммунистической Польше привели к тому, что политологи называют её неокоммунистической, посткоммунистической и ультралевой."
POL_ultraleft_nationalism: "Ультралевый национализм"
POL_ultraleft_nationalism_desc: "Синтез ультралевой революционной идеологии с польским национализмом создаёт уникальное политическое движение, стремящееся сочетать интернационалистские устремления коммунизма с патриотическим пылом национализма. Этот ультралевый националистический подход направлен на создание подлинно польского пути к социализму, отвергая как западный капитализм, так и советский коммунизм в пользу подлинного национально-революционного движения, ставящего польский народ и его традиции в центр социалистического преобразования."
POL_peasant_movement: "Крестьянское движение"
POL_peasant_movement_desc: "Мы должны вышвырнуть прочь назойливых банкиров, которые грабят наших честных простолюдинов и кладут деньги в свои карманы!"
POL_catholic_soc_teach: "Католическое социальное учение"
POL_catholic_soc_teach_desc: "Опираясь на богатую традицию католического социального учения, мы стремимся применить принципы солидарности, субсидиарности и общего блага в нашем революционном проекте. Этот подход сочетает моральные основы католической социальной мысли с нашей приверженностью социальной справедливости, подчёркивая достоинство человеческой личности, работая при этом над созданием более справедливого и равноправного общества, уважающего как индивидуальные права, так и коллективную ответственность."
POL_legalize_same_sex_marriages: "Вопрос об однополых партнёрствах"
POL_legalize_same_sex_marriages_desc: "В наших рядах возникла дилемма относительно того, что нам делать с однополыми браками, партнёрствами и подобными союзами."
poland_smbr.1.t: "Предпарламентские дебаты"
poland_smbr.1.d: "Конференц-зал наполнен жаркими спорами, когда члены партии «Самоборона» собираются, чтобы обсудить один из самых спорных вопросов, стоящих перед нашим движением. Заместитель министра Ковальский, традиционалист из сельского крыла, ударяет кулаком по столу: «Мы не можем отказываться от наших католических ценностей! Брак — это союз мужчины и женщины, как задумал Бог. Это скользкий путь, который разрушит семейную ячейку!»\n\nНапротив него доктор Новак, молодой член партии из Варшавы, отвечает спокойно: «Товарищ Ковальский, мы должны помнить, что наша партия выступает за социальную справедливость и достоинство всех людей. Многие из наших сторонников в городах имеют друзей и родственников, которых затрагивает этот вопрос. Мы не можем поворачиваться к ним спиной».\n\nСекретарь партии Вишневский вставляет: «Вопрос не в отказе от наших ценностей, а в том, как мы их применяем. Католическое социальное учение подчёркивает любовь и сострадание. Не должны ли мы распространять их на всех граждан, независимо от их ориентации?»\n\nДебаты продолжаются, поскольку партия должна решить, поддерживать ли гражданские союзы и однополые браки или сохранять традиционную позицию в отношении семейных ценностей. Это решение определит не только платформу нашей партии, но и наши отношения как с Католической церковью, так и с более широким польским обществом."
poland_smbr.1.a: "Мы должны разрешить такие союзы!"
poland_smbr.1.b: "Такие союзы — удар по нашим католическим ценностям!"
samesex_caut_tt: "§YВНИМАНИЕ§!: Это решение будет иметь §Rзначительные последствия§! для положения вашей партии. Выбор в пользу разрешения однополых союзов §Gпринесёт поддержку§! городских районов и молодых избирателей, но может §Rоттолкнуть§! традиционных католических сторонников и сельские округа. И наоборот, запрет таких союзов §Gукрепит§! ваши связи с Католической церковью и консервативными избирателями, но может §Rстоить вам§! поддержки в крупных городах и среди прогрессивных элементов общества. Тщательно обдумайте, как это соотносится с текущим курсом вашей партии и составом вашей базы."
POL_catholic_social_teaching_and_educat_idea: "Католическое образование"
POL_catholic_values_into_education: "Социалистический конкордат"
POL_catholic_values_into_education_desc: "Мы достигли соглашения со Святым Престолом об установлении уникального «Социалистического конкордата» в области образования. Это новаторское соглашение позволяет Католической церкви наблюдать и направлять польскую систему образования, сохраняя при этом нашу приверженность социальной справедливости и равенству. Церковь будет обеспечивать моральное и духовное руководство нашими школами, гарантируя интеграцию католического социального учения в учебную программу, в то время как мы сохраняем контроль над светскими аспектами образования и обеспечиваем, чтобы все дети, независимо от происхождения, получали качественное образование."
POL_legacy_of_ppr: "Наследие ППР"
POL_legacy_of_ppr_desc: "Мы должны помнить и с гордостью нести наследие советского прошлого. Для этого мы можем даже установить коалицию с коммунистами."
POL_polish_sovhoz_idea: "Польский совхоз"
POL_return_sovhoz: "Возвращение к совхозам"
POL_return_sovhoz_desc: "Совхоз был лучшим изобретением коммунистов, которое подавило бы капиталистическую анархию и поощрило сотрудничество среди нашего народа!"
POL_agrarian_populism: "Аграрный популизм"
POL_agrarian_populism_desc: "Мы должны сплотить наше население во имя сельскохозяйственной революции. Наши люди будут работать вместе ради светлого будущего!"
POL_financing_agriculture: "Финансирование сельского хозяйства"
POL_financing_agriculture_desc: "Чтобы поддерживать хорошую экономику в рамках нашего политического и экономического курса, мы обязаны поддерживать сельское хозяйство в нашей стране."
POL_financing_agriulture_desc: "Мы должны возглавить государственное строительство сельскохозяйственных совхозных секторов и трудоустроить там наших людей. Это может повлиять на наш экономический рост, но, несомненно, будет правильным решением для долгосрочной стабильности!"
POL_protectionist_policy: "Протекционистская политика"
POL_protectionist_policy_desc: "Чтобы защитить наши внутренние отрасли и обеспечить процветание польских рабочих, мы должны внедрить строгие протекционистские меры. Снижая нашу зависимость от иностранных рынков и сосредотачиваясь на внутреннем производстве, мы можем защитить нашу экономику от внешних потрясений и создать больше рабочих мест для наших людей. Эта политика будет отдавать приоритет польским товарам и снижать нашу зависимость от потенциально нестабильной международной торговли."
POL_nationalization_foreign_capital: "Национализация иностранного капитала"
POL_nationalization_foreign_capital_desc: "Пришло время вернуть то, что по праву принадлежит польскому народу! Иностранные капиталисты слишком долго эксплуатировали нашу нацию, извлекая прибыль, оставляя наших рабочих в нищете. Мы захватим все иностранные предприятия и передадим их под контроль государства, обеспечив, чтобы богатство, которое они генерируют, приносило пользу всем польским гражданам, а не пополняло карманы иностранных инвесторов. Это смелое действие укрепит нашу экономическую независимость и продемонстрирует нашу приверженность принципу «народ прежде всего»."
POL_superiority_of_polish_people: "Преимущество польского народа"
POL_superiority_of_polish_people_desc: "Мы должны признать и воспевать врождённое величие польской нации! Слишком долго нам внушали, что мы неполноценны, что мы должны следовать за другими, что наша культура и ценности устарели. Но истина ясна: польский народ обладает уникальным духом, глубокой связью с землёй и несгибаемой волей, которая пронесла нас через века борьбы. Мы не просто равны другим нациям — мы превосходим их в нашей преданности семье, общине и общему благу. Пришло время утвердить наше законное место в мире и отвергнуть ложное смирение, которое сдерживало нас."
POL_polish_left_greatness_idea: "Польский солидаризм"
POL_refusal_public_debt: "Больше никакого иностранного долга!"
POL_refusal_public_debt_desc: "Мы больше не будем кланяться иностранным нациям и платить им ни копейки за страдания нашего бедного, но величайшего народа на земле!"
POL_autarky: "Путь к автаркии"
POL_autarky_desc: "Подлинная независимость может быть достигнута только через полную экономическую самодостаточность! Мы должны покончить с нашей зависимостью от внешней торговли и построить самодостаточную экономику, способную удовлетворить все наши потребности. Это означает развитие собственных отраслей промышленности, эксплуатацию собственных ресурсов и производство всего необходимого в пределах наших границ. Хотя это потребует значительных инвестиций и может временно истощить нашу казну, это сделает нас поистине свободными от капризов иностранных рынков и международного давления. Самодостаточная Польша — это сильная Польша, а сильная Польша — это Польша, которую никогда больше нельзя будет покорить!"
POL_against_capitalist: "Антикапиталистическая пропаганда"
POL_against_capitalist_desc: "Мы должны направить пропаганду против капиталистических свиней и их прислужников в нашей стране."
POL_moscow_warsaw_bro: "Москва-Варшава — братья"
POL_moscow_warsaw_bro_desc: "Мы должны установить военное сотрудничество с Россией и подготовить нашу страну к вступлению в ОДКБ."
POL_turn_to_east: "Инициатива восточной торговли"
POL_turn_to_east_desc: "Мы должны переориентировать нашу торговлю на восточные рынки и присоединиться к процессу интеграции ЕАЭС."
POL_polish_chinese_cooperation: "Польско-китайская торговая ассоциация"
POL_polish_chinese_cooperation_desc: "Мы должны установить соглашение о свободной торговле с Китаем, чтобы противостоять империалистическому американскому влиянию на нашу страну."
POL_subjugate_lovakia: "Подчинить Словакию"
POL_subjugate_lovakia_desc: "Мы должны подчинить Словакию и установить наш южный пояс безопасности на случай вмешательства НАТО."
POL_join_russia: "Вступить в ОДКБ"
POL_join_russia_desc: "Чтобы защитить нашу страну от империалистических сил, мы должны вступить в ОДКБ и установить высочайший возможный уровень оборонного партнёрства с Россией."
POL_not_colony_of_europe: "Не колония Европы!"
POL_not_colony_of_europe_desc: "Мы не должны преклоняться перед Европой и позволять их колониалистской риторике подчинять наши интересы."
POL_leave_nato: "Пока, пока, НАТО!"
POL_leave_nato_desc: "НАТО по своей сути противоречит воле нашей нации. Мы больше не должны состоять в этом ничтожном альянсе."
POL_poland_can_into_space: "Польша не может в космос"
POL_poland_can_into_space_desc: "§RСКОРО§!"
plan_prometheus_start: "Подготовка плана §R«ПРОМЕТЕЙ»§!"
POL_onr: "Obóz Narodowo-Radykalny"
POL_onr_desc: "Возрождённый Национально-радикальный лагерь объединяет ультраправые студенческие ячейки, клерикальных ультраконсерваторов и ностальгирующих по «Фаланге» под одним руководством, которое клянётся очистить государство от либерализма."
POL_wojciech: "Войцех"
POL_wojciech_desc: "Войцех, самый громкий трибун движения, становится его публичным лицом, смешивая проповеднические тирады с обещаниями железной дисциплины, чтобы держать боевиков в повиновении."
POL_ideology_of_national_radicalism: "Идеология национального радикализма"
POL_ideology_of_national_radicalism_desc: "Партийные школы кодифицируют национальный радикализм в доктрину — католический интегрализм, корпоративистскую экономику и парамилитарную мобилизацию, выкованные в единый символ веры."
POL_polish_national_socialism: "Польский национал-социализм"
POL_polish_national_socialism_desc: "Руководство откапывает довоенный национал-социализм, продвигая классовое согласие, обеспечиваемое этнической иерархией и патерналистской командной экономикой."
POL_piasecki_legacy: "Наследие Пясецкого"
POL_piasecki_legacy_desc: "Мифотворчество вокруг подпольной деятельности Болеслава Пясецкого используется как оружие для оправдания авторитарного обновления и крестового похода против предполагаемых предателей."
POL_migration_issue: "Миграционный вопрос"
POL_migration_issue_desc: "Подстрекательская риторика изображает мигрантов как диверсантов, прокладывая путь чрезвычайным указам, которые дают ONR власть контролировать границы и поселения."
POL_bye_belarusian: "Белорусы, вам пора уходить"
POL_bye_belarusian_desc: "Белорусским меньшинствам предъявляют ультиматум покинуть страну или столкнуться с конфискацией — леденящий сигнал о том, что этническая гомогенизация теперь является политикой."
POL_new_polish_state: "Новое польское государство"
POL_new_polish_state_desc: "Конституция откладывается в пользу корпоративистской хартии, возвышающей ветеранов, духовенство и партийные советы над старыми демократическими институтами."
POL_pilsudski_legacy: "Наследие Пилсудского"
POL_pilsudski_legacy_desc: "ONR выборочно использует культ командования Пилсудского, чтобы представить свою хунту законным наследником сильной власти «Санации»."
POL_deportation_of_jews: "Депортация евреев"
POL_deportation_of_jews_desc: "Еврейские общины собирают для принудительной эмиграции под ненавистными воззваниями о национальном возрождении."
POL_quest_german_migrants: "Вопрос о немецких мигрантах"
POL_quest_german_migrants_desc: "Кампания запугивания заставляет этнических немцев выбирать между принудительной полонизацией или изгнанием, удовлетворяя реваншистские требования."
POL_return_sanation: "Возвращение Санации"
POL_return_sanation_desc: "Статуты чрезвычайного положения эпохи «Санации» вновь активируются, предоставляя руководству неограниченные полномочия по приостановке деятельности партий, профсоюзов и оппозиционных СМИ."
POL_administrative_purges: "Административные чистки"
POL_administrative_purges_desc: "Государственные служащие проходят проверку на лояльность; любой, связанный с либеральными, социалистическими или иностранными НПО, увольняется, чтобы освободить место для кадров ONR."
POL_close_the_market: "Закрыть рынок"
POL_close_the_market_desc: "Автаркические указы захлопывают внешнюю торговлю, перенаправляя кредиты и контракты лояльным синдикатам под строгим государственным надзором."
POL_dissolve_republic: "Распустить Республику"
POL_dissolve_republic_desc: "После роспуска Сейма и запрета партий республика уступает место «национальному содружеству», управляемому указами командного совета в Варшаве."
POL_return_of_legions: "Возвращение Легионов"
POL_return_of_legions_desc: "Добровольческие легионы воссоздаются как политизированные ударные войска, сочетающие историческую помпезность с современной парамилитарной мощью."
POL_cult_of_leader: "Культ Вождя"
POL_cult_of_leader_desc: "Пропаганда возносит лидера до полумифического статуса — портреты в школах, присяги в казармах — так что повиновение становится преданностью."
POL_national_consciousness: "Национальное сознание"
POL_national_consciousness_desc: "Массовые митинги, обязательные молодёжные лагеря и националистические учебные программы насыщают общество единым героическим нарративом польской судьбы."
POL_strong_state: "Сильное государство"
POL_strong_state_desc: "Новые министерства объединяют полицейские, разведывательные и милицейские полномочия в монолитный аппарат, задачей которого является подавление как коррупции, так и оппозиции."
POL_cult_of_war: "Культ войны"
POL_cult_of_war_desc: "Война прославляется как очищающий обряд; классы тренируют учеников, заводы отдают приоритет вооружениям, а парады обещают честь через борьбу."
POL_dawn_nation: "Рассвет нации"
POL_dawn_nation_desc: "Постановочные церемонии и факельные шествия провозглашают «рассвет нации», сигнализируя о том, что радикальное государство считает свою революцию завершённой."
POL_iron_leader: "Железный Вождь"
POL_iron_leader_desc: "Правитель принимает мантию Żelazny Wódz — Железного Вождя — обещая лично руководить каждой битвой, переговорами и чисткой."
POL_polish_revanchism: "Польский реваншизм"
POL_polish_revanchism_desc: "Дипломатия заменяется ультиматумами с требованием возмещения за исторические обиды, подготавливая общественность к кампаниям мести."
POL_greater_poland: "Великая Польша"
POL_greater_poland_desc: "Карты перекраиваются, чтобы включить каждую «потерянную» провинцию, сплачивая армию и диаспору вокруг максималистского видения Великой Польши."
POL_return_king_lands: "Возвращение земель Королевства"
POL_return_king_lands_desc: "Выдвигаются претензии на бывшие территории Короны, ссылаясь на средневековые хартии для оправдания современных аннексий."
POL_return_eastern_lands: "Возвращение восточных земель"
POL_return_eastern_lands_desc: "Ирредентистская пропаганда сочетается с тайной дестабилизацией, поскольку планировщики смотрят на восток, чтобы вернуть Кресы."
POL_podlaczenie: "Аншлюз по Польски"
POL_podlaczenie_desc: "Соседние регионы планируется «подключить обратно» посредством принудительных плебисцитов под надзором солдат и партийных комиссаров."
POL_ultimatum_to_budapest: "Ультиматум Будапешту"
POL_ultimatum_to_budapest_desc: "Венгрия получает жёсткий ультиматум — уступить влияние в Карпатах или столкнуться с интервенцией под руководством ONR."
POL_avenge_september: "Отомстить за Сентябрь"
POL_avenge_september_desc: "Травма 1939 года используется как казус белли, армия клянётся отплатить за унижение сентября подавляющей силой."
POL_invasion_of_livonia: "Вторжение в Ливонию"
POL_invasion_of_livonia_desc: "Балтийские развёртывания отрабатывают молниеносный удар в Ливонию для захвата портов и проекции силы в сторону Финского залива."
POL_avenge_volyn: "Отомстить за Волынь"
POL_avenge_volyn_desc: "Государственные СМИ воскрешают Волынскую резню, чтобы мобилизовать войска для карательных операций против украинских националистов."
POL_break_up_romania: "Раздел Румынии"
POL_break_up_romania_desc: "Румыния становится мишенью для раздела, ONR строит планы по разделу сфер влияния вместе с любым реваншистским союзником, который окажется удобным."
POL_again_to_kremlin: "И снова в Кремль"
POL_again_to_kremlin_desc: "Хвастаясь Собеским и Пилсудским, режим клянётся снова маршировать на Москву в окончательном счёте за восточное превосходство."
POL_return_brest: "Вернуть Брест"
POL_return_brest_desc: "Дипломаты размахивают ультиматумами с требованием возврата Бреста, пока инженеры чертят логистические узлы для возможной оккупации."
POL_volyn_for_the_union: "Волынь за унию"
POL_volyn_for_the_union_desc: "Волынь используется как разменная монета в переговорах о новом польско-доминируемом союзе, оказывая давление на соседей с целью принятия гегемонии ONR."
POL_policy_of_autarky: "Политика автаркии"
POL_policy_of_autarky_desc: "Самообеспеченность становится догмой: нормирование, бартерные сети и государственные закупки заменяют зависимость от мировых рынков."
POL_poles_in_berlin: "Поляки в Берлине"
POL_poles_in_berlin_desc: "Ячейки активистов-эмигрантов в Берлине организуются для агитации, сбора разведданных и подготовки почвы для будущих требований."
POL_return_of_vilnius: "Возвращение Вильнюса"
POL_return_of_vilnius_desc: "Пропаганда изображает Вильнюс как неотъемлемый польский город, финансируя сети пятой колонны и юридические кампании, чтобы подорвать литовский суверенитет."
POL_training_with_azov: "Тренировки с Азовом"
POL_training_with_azov_desc: "Жёсткие подразделения ищут совместные учения с движением «Азов», обмениваясь тактикой и риторикой, несмотря на дипломатические последствия."
POL_denbanderization_of_ukraine: "Дебандеризация Украины"
POL_denbanderization_of_ukraine_desc: "Спецслужбы разрабатывают планы по демонтажу украинских националистических групп, называя проект крестовым походом «дебандеризации»."
POL_capture_of_kaliningrad: "Захват Калининграда"
POL_capture_of_kaliningrad_desc: "Армейские планировщики намечают рискованный бросок на Калининград, рассчитывая на внезапность и подавляющую артиллерию, чтобы вырвать эксклав у России."
POL_polish_soldierism: "Польский солдатизм"
POL_polish_soldierism_desc: "Режим принимает «солдатизм» — общество, организованное как казарма, где каждый гражданин обучен, обмундирован и имеет ранг."
POL_grupa_piaseckiego: "Группа Пясецкого"
POL_grupa_piaseckiego_desc: "Группа Пясецкого укрепляет свою хватку над идеологией, обеспечивая, чтобы каждое министерство, газета и полк повторяли бескомпромиссную линию основателя."
POL_falanga_strong_state_idea: "Сильное государство"
POL_falanga_war_cult_idea: "Культ войны"
POL_falanga_administrative_purges_idea: "Административные чистки"
POL_falanga_solderism_idea: "Солдатизм"
POL_falanga_dawn_nation_idea: "Рассвет нации"
POL_falanga_sanation_idea: "Возвращение Санации"
POL_piaseckie_idea: "Национал-социализм польской нации"
POL_wojciech_idea: "Национальный радикализм польской нации"
poland_falanga.3.t: "Закрытие рынка"
poland_falanga.3.d: "Наша страна не будет рабой мировой экономической системы. Мы будем постепенно выходить из глобальной экономики, так как глобалисты и экономисты поработили нашу страну."
poland_falanga.3.a: "Сильная экономика — закрытая экономика"
poland_falanga.5.t: "Новое будущее Польши"
poland_falanga.5.d: "Пришло время нашей стране возродиться под новым знаменем и двигаться к светлому будущему."
poland_falanga.5.a: "Слава польской нации"
poland_falanga.6.t: "Выселение белорусских мигрантов"
poland_falanga.6.d: "Мы намерены выселить мигрантов и освободить землю для истинных патриотов своей страны — коренных жителей этой великой нации!"
poland_falanga.6.a: "Слава польской нации"
poland_falanga.7.t: "Выселение белорусских мигрантов"
poland_falanga.7.d: "Польское правительство, кажется, сошло с ума и депортировало всех наших людей обратно к нам"
poland_falanga.7.a: "Безумцы"
poland_falanga.8.t: "Выселение еврейских мигрантов"
poland_falanga.8.d: "Мы намерены выселить мигрантов и освободить землю для истинных патриотов своей страны — коренных жителей этой великой нации!"
poland_falanga.8.a: "Слава польской нации"
poland_falanga.9.t: "Выселение еврейских мигрантов"
poland_falanga.9.d: "Польское правительство, кажется, сошло с ума и депортировало всех наших людей обратно к нам"
poland_falanga.9.a: "Безумцы"
poland_falanga.10.t: "Выселение немецких мигрантов"
poland_falanga.10.d: "Мы намерены выселить мигрантов и освободить землю для истинных патриотов своей страны — коренных жителей этой великой нации!"
poland_falanga.10.a: "Слава польской нации"
poland_falanga.11.t: "Выселение немецких мигрантов"
poland_falanga.11.d: "Польское правительство, кажется, сошло с ума и депортировало всех наших людей обратно к нам"
poland_falanga.11.a: "Безумцы"
poland_falanga.12.t: "Львов и Волынь за защиту"
poland_falanga.12.d: "Польские националисты, кажется, сходят с ума. Они буквально предлагают нам отдать им Львов и Волынь, а взамен соглашаются защищать нас."
poland_falanga.12.a: "Мы согласны"
poland_falanga.12.b: "Никогда!"
poland_falanga.13.t: "Львов и Волынь за защиту"
poland_falanga.13.d: "Украинцы сохранили рассудок и согласились на предложение, и наша страна станет шире и получит ещё больше влияния!"
poland_falanga.13.a: "Отлично"
poland_falanga.14.t: "Львов и Волынь за защиту"
poland_falanga.14.d: "Украинцы решили отказать нам, и, кажется, не понимают, что их ждёт — конец украинского государства!"
poland_falanga.14.a: "Дураки"
poland_falanga.15.t: "Совместные учения с батальоном «АЗОВ»"
poland_falanga.15.d: "Польские националисты предлагают провести обучение своих вооружённых сил и нашего батальона «Азов», и, кажется, готовы к сотрудничеству с нами"
poland_falanga.15.a: "Мы согласны"
poland_falanga.15.b: "Никогда!"
poland_falanga.16.t: "Совместные учения с батальоном «АЗОВ»"
poland_falanga.16.d: "Они согласились провести совместные учения между их батальоном «Азов» и нашими вооружёнными силами"
poland_falanga.16.a: "Отлично"
poland_falanga.17.t: "Совместные учения с батальоном «АЗОВ»"
poland_falanga.17.d: "Они отказались проводить совместные учения между их батальоном «Азов» и нашими вооружёнными силами"
poland_falanga.17.a: "Дураки"
anti_german: "Германофоб"
iron_leader: "Железный лидер"
poland_protests.1.t: "Начались протесты против запрета абортов"
poland_protests.1.d: "Массовые протесты вспыхнули по всей Польше в ответ на ограничительные законы правительства об абортах. Тысячи демонстрантов вышли на улицы крупных городов, требуя восстановления репродуктивных прав женщин. Протесты возглавляют организации по защите прав женщин при поддержке различных групп гражданского общества."
poland_protests.1.a: "Народ высказался"

poland_protests.3.t: "Столкновения протестующих с полицией"
poland_protests.3.d: "Ситуация обострилась, поскольку между протестующими и полицией вспыхнули жестокие столкновения. Был применён слезоточивый газ, произведены несколько арестов. Противостояние становится всё более напряжённым по мере того, как обе стороны занимают жёсткие позиции. Правительство испытывает растущее давление с требованием удовлетворить требования протестующих."
poland_protests.3.a: "Ситуация выходит из-под контроля"

poland_protests.4.t: "Протесты усиливаются и становятся более радикальными"
poland_protests.4.d: "Протестное движение значительно усилилось, демонстрации становятся более радикальными и повсеместными. Протестующие теперь блокируют основные дороги, захватывают правительственные здания и организуют общенациональные забастовки. Движение набирает обороты и не проявляет признаков отступления. Страна, кажется, находится на грани серьёзного политического кризиса."
poland_protests.4.a: "Ситуация выходит из-под контроля"

poland_protests.5.t: "Протесты начинают затихать"
poland_protests.5.d: "После недель интенсивных демонстраций протестное движение, похоже, теряет силу. Хотя некоторые акции продолжаются, общая интенсивность значительно снизилась. Твёрдая позиция правительства и течение времени, похоже, подорвали решимость протестующих. Страна медленно возвращается к состоянию относительной стабильности."
poland_protests.5.a: "Наконец-то некоторое спокойствие"

poland_protests.6.t: "В Польше начались массовые протесты против абортов"
poland_protests.6.d: "Экстренные новости: массовые протесты вспыхнули по всей Польше после решения правительства ввести строгие ограничения на аборты. Демонстранты требуют восстановления репродуктивных прав женщин и призывают правительство отменить свои спорные политики. Протесты привлекли международное внимание и поддержку организаций по защите прав женщин по всему миру."
poland_protests.6.a: "Мир наблюдает"
POL_reforms_of_2000s_desc: "Фундаментальная серия реформ, начатых в 2000-х годах для реструктуризации вооружённых сил, сокращения срочной службы и приведения польской армии в соответствие со стандартами НАТО в рамках подготовки к будущей интеграции и модернизации."

POL_wojska_ladowe_desc: "Стратегическая модернизация и реорганизация Сухопутных войск (Wojska Lądowe), станового хребта польской армии, для повышения их мобильности, огневой мощи и возможностей управления и связи."

POL_pomor_military_district_desc: "Усиление Поморского военного округа для укрепления обороны вдоль балтийского побережья и стратегического Сувалкского коридора — критически важного фланга НАТО."

POL_silesian_military_district_desc: "Укрепление Силезского военного округа, ключевого промышленного и демографического центра, для обеспечения безопасности южной Польши и сохранения сильной оборонительной позиции."

POL_new_commander_armed_forces_desc: "Назначение нового, ориентированного на реформы главнокомандующего Вооружёнными силами для надзора за амбициозной программой модернизации и внедрения новой военной доктрины."

POL_logistics_reorganization_desc: "Полная реорганизация системы военной логистики для улучшения цепочек поставок, возможностей техобслуживания и стратегической мобильности как для национальной обороны, так и для экспедиционных операций."

POL_transition_to_prof_army_desc: "Исторический переход от смешанной призывно-профессиональной армии к полностью профессиональной, контрактной, что улучшает обучение, боеготовность и оперативную эффективность."

POL_reform_of_military_districts_desc: "Структурная реформа по оптимизации системы военных округов, создание более гибких и оперативно-ориентированных команд, лучше приспособленных к современной войне."

POL_reorganization_infantry_desc: "Реорганизация пехотных подразделений в более гибкие, бригадно-центричные структуры, оснащённые современным оружием и интегрированными боевыми системами."

POL_wojska_lotnicze_desc: "Амбициозная модернизация Войск воздушных и противовоздушных (Wojska Lotnicze i Obrony Powietrznej) для достижения превосходства в воздухе и защиты польского воздушного пространства."

POL_sily_powietrzne_desc: "Целенаправленные усилия по созданию современных и боеспособных Военно-воздушных сил (Siły Powietrzne) через приобретение новых боевых самолётов, радиолокационных систем и зенитных ракет."

POL_army_aviation_brigade_desc: "Создание отдельной Бригады армейской авиации для оказания непосредственной поддержки сухопутным войскам транспортными, разведывательными и ударными вертолётами."

POL_pzl_swidnik_desc: "Поддержка PZL-Świdnik SA, национального производителя вертолётов, для обеспечения поставок и обслуживания винтокрылых машин для вооружённых сил."

POL_mi24_modernization_desc: "Программа по продлению срока службы и повышению боевых возможностей парка ударных вертолётов Миль Ми-24."

POL_start_production_ka50_desc: "Спорная инициатива по лицензионному производству российского ударного вертолёта Камов Ка-50 «Чёрная акула», создающая логистические и политические осложнения."

POL_start_production_ah64_apache_desc: "Стратегическое решение о лицензионном производстве американского AH-64 Apache, вертолёта мирового класса, для польской армейской авиации."

POL_pzl_w3_sokol_desc: "Модернизация и продолжение производства отечественного многоцелевого вертолёта PZL W-3 Sokół для транспортных и вспомогательных задач."

POL_pzl_mi2_desc: "Поэтапный вывод из эксплуатации устаревших вертолётов PZL Mi-2, рабочей лошадки польской авиации, и их замена современными типами."

POL_army_aviation_brigad_TT_desc: "Этот фокус создаст §Y3§! новых, полностью оснащённых батальона армейской авиации, значительно усилив мобильность и поддержку с воздуха, доступную командирам на земле."

POL_decommission_old_planes_desc: "Систематический вывод из эксплуатации устаревших самолётов советской эпохи, таких как МиГ-21 и Су-20, для высвобождения ресурсов под современные платформы."

POL_buy_mig_29_from_Germany_desc: "Оппортунистическая закупка излишков истребителей МиГ-29 у немецких Люфтваффе для увеличения числа перехватчиков и поддержания квалификации пилотов."

POL_buy_mig_29_from_Czech_desc: "Приобретение дополнительных планеров МиГ-29 у Чехии для разборки на запчасти и поддержания существующего парка."

POL_selecting_new_multirole_fighter_desc: "Критический и сильно политизированный процесс выбора истребителя нового поколения, который станет будущей основой польских ВВС."

POL_redevelopment_of_air_corps_basing_areas_desc: "Масштабная программа инфраструктурной модернизации авиабаз, взлётно-посадочных полос, ангаров и топливных хранилищ для поддержки новых, более совершенных самолётов."

POL_retraining_officers_desc: "Обширная программа переподготовки пилотов и наземного персонала с советских систем на эксплуатацию и обслуживание самолётов и технологий западного производства."

POL_problem_national_aviation_desc: "Конfronting вызовы и высокие затраты, связанные с развитием и поддержанием суверенной национальной авиационной промышленности для боевых самолётов."

POL_modernization_su_22_desc: "Программа ограниченной модернизации парка Су-22, ориентированная на авионику и высокоточные боеприпасы для продления его роли в качестве платформы для нанесения ударов."

POL_kobra_2000_desc: "Отечественный пакет модернизации для МиГ-29, включающий новую РЛС и авионику, для повышения его воздушных возможностей."

POL_pzl_m2000_desc: "Амбициозный, в конечном итоге нереализованный национальный проект по разработке польского многоцелевого истребителя, подчёркивающий трудности внутренней разработки самолётов пятого поколения."

POL_mig_35_desc: "Оценка российского МиГ-35 в качестве потенциального недорогого преемника МиГ-29, несмотря на геополитические риски зависимости от российских технологий."

POL_f_35a_desc: "Решение о приобретении F-35A Lightning II, стелс-истребителя пятого поколения, которое означало бы квантовый скачок в возможностях и упрочило бы стратегический альянс с США."

POL_f_22_raptor_desc: "Символичное, но политически значимое стремление приобрести F-22 Raptor, несмотря на запрет на его экспорт, отражающее желание получить лучший в мире истребитель завоевания превосходства в воздухе."

POL_su_57_desc: "Крайне спорное изучение возможности покупки российского Су-57, шага, который серьёзно осложнил бы отношения с союзниками по НАТО."

POL_mig_29_desc: "Продолжение эксплуатации и дальнейшая модернизация МиГ-29 в качестве способного перехватчика для прикрытия объектов до тех пор, пока не будет обеспечена полная замена."

POL_purchase_russian_missile_systems_desc: "Рискованная закупка передовых российских систем ПВО, таких как С-300 или С-400, создающая серьёзные проблемы взаимодействия и безопасности в рамках НАТО."

POL_su_25_desc: "Содержание и модернизация парка Су-25 для обеспечения надёжной и выносливой поддержки сухопутных войск на поле боя."

POL_buy_su_34_desc: "Потенциальное приобретение Су-34 для выполнения роли дальнего ударного самолёта и самолёта изоляции района боевых действий, что ещё больше углубит связи с российской оборонной промышленностью."

POL_f16_fighting_falcon_desc: "Знаковое решение о покупке F-16 Fighting Falcon, проверенного западного многоцелевого истребителя, который стал краеугольным камнем современных польских ВВС."

POL_purchase_american_missile_systems_desc: "Закупка американских систем ПВО, таких как PATRIOT, для создания эшелонированной, интегрированной сети воздушно-космической и противоракетной обороны Польши."

POL_a_10_thunderbolt_ii_desc: "Инициатива по приобретению A-10 Thunderbolt II за его непревзойдённые возможности непосредственной авиационной поддержки, особенно в сценарии сухопутной оборонительной войны."

POL_buy_f_15e_desc: "Оценка F-15E Strike Eagle за его возможности большой дальности и большой боевой нагрузки, заполняющего нишу стратегического бомбардировщика для польских ВВС."

POL_modernization_military_equipment_desc: "Общенациональные усилия по замене или глубокой модернизации огромных запасов военной техники советской эпохи современными, часто западного происхождения, системами."

POL_modernization_twardy_desc: "Комплексная модернизация основного боевого танка PT-91 «Тварды», отечественной разработки на базе Т-72, с новой бронёй, системой управления огнём и двигателями."

POL_hsw_sa_desc: "Поддержка Huta Stalowa Wola (HSW SA) как национального центра по производству и модернизации бронетехники, артиллерии и инженерного оборудования."

POL_borsuk_desc: "Разработка и последующее производство «Борсука» — новой отечественной боевой машины пехоты для замены устаревших БМП-1."

POL_langusta_desc: "Введение WR-40 «Лангуста», польской реактивной системы залпового огня, установленной на шасси грузовика Jelcz."

POL_pit_radwar_desc: "Наделение PIT-Radwar SA статуса ключевого национального поставщика передовых радиолокационных систем, технологий C4ISR и оборудования радиоэлектронной борьбы."

POL_poprad_desc: "Развёртывание самоходного зенитного ракетного комплекса «Попрад» для обеспечения мобильных подразделений средствами ближней ПВО."

POL_hibneryt_desc: "Разработка передовых систем маскировки и обмана под кодовым названием «Hibernyt» для защиты военных объектов от разведки и наведения."

POL_rosomak_desc: "Лицензионное производство и дальнейшее развитие бронированной модульной машины «Росомах», краеугольного камня мобильности армии."

POL_honker_desc: "Модернизация парка лёгких военных автомобилей «Honker» для разведки, связи и задач спецназа."

POL_jelcz_desc: "Опора на Jelcz для производства тяжёлых военных грузовиков и специализированных шасси, критически важных для логистики и мобильности артиллерии."

POL_obrum_desc: "Поддержка OBRUM (Центра исследований и разработок механических устройств) для проектирования и создания прототипов новой бронетехники."

POL_modernization_foreign_equipment_desc: "Программы по интеграции польских подсистем и вооружений на импортные платформы, такие как Leopard 2 или F-16."

POL_implementation_of_own_projects_desc: "Стремление приоритизировать и финансировать отечественные оборонные проекты для развития технологического суверенитета и снижения иностранной зависимости."

POL_bmp_andres_desc: "Амбициозный внутренний проект по разработке боевой машины пехоты нового поколения, демонстрирующий амбиции польского инженерного дела."

POL_pl_01_desc: "Разработка футуристичного концепта PL-01, стелс-лёгкого танка, призванного установить новый стандарт для бронеразведки."

POL_pt_2001_gepard_desc: "Проект разработки нового польского основного боевого танка, иногда именуемого «Гепард», для последующей замены PT-91 и Leopard 2."

POL_leopard_2pl_desc: "Комплексная модернизация парка Leopard 2A4 до нового стандарта Leopard 2PL, значительно повышающая его боевую эффективность."

POL_k2pl_desc: "Знаковое решение о приобретении и местном производстве южнокорейского основного боевого танка K2 Black Panther, современной платформы высшего класса."

POL_updating_communication_system_desc: "Критически важное обновление систем связи всей армии до безопасных, зашифрованных и сетецентричных цифровых стандартов для взаимодействия с НАТО."

POL_tytan_desc: "Внедрение интегрированной системы солдата «Титан», повышающей летальность, выживаемость и осведомлённость о ситуации для отдельного бойца."

POL_new_military_uniform_desc: "Введение новой, функциональной и современной военной формы и комплекта личного снаряжения для всех родов войск."

POL_maskpol_desc: "Поддержка Maskpol в качестве основного поставщика средств индивидуальной защиты, включая бронежилеты, шлемы и баллистические маски."

POL_lampart_desc: "Разработка командно-штабной машины «Лампарт» на базе платформы «Росомаха» для командиров батальонного уровня."

POL_hbt_02_desc: "Введение бронетранспортёра HBT-02 «Харди», более простого и дешёвого дополнения к «Росомахе»."

POL_arsenal_update_desc: "Широкая программа по замене стрелкового оружия, от пистолетов до снайперских винтовок, современными, стандартизированными образцами."

POL_lucznik_desc: "Модернизация оружейного завода FB «Łucznik» Radom для превращения его в основной источник новых штатных автоматов для польской армии."

POL_mesko_desc: "Поддержка Mesko SA как ключевого производителя ракет, реактивных снарядов и высокоточных боеприпасов для армии и ВВС."

POL_modern_mortars_missile_system_desc: "Приобретение и отечественное производство передовых миномётных систем (таких как 120-мм самоходные миномёты) и противотанковых управляемых ракет."

POL_zmt_desc: "Опора на Zakłady Mechaniczne Tarnów (ZMT) для производства автоматических гранатомётов и другого тяжёлого пехотного вооружения."

POL_modern_mechine_gun_and_grenade_launchers_desc: "Программа по замене устаревших пулемётов и гранатомётов современными, соответствующими стандартам НАТО, образцами."

POL_msbs_grot_desc: "Принятие модульной винтовочной системы MSBS «GROT» в качестве нового стандартного индивидуального оружия для Вооружённых сил Польши."

POL_marynarka_wojenna_desc: "Долгосрочный план модернизации ВМС Польши (Marynarka Wojenna) для обороны Балтийского моря, защиты морских коммуникаций и участия в морских операциях НАТО."

POL_gdynia_shipyard_desc: "Возрождение Гдыньской судоверфи как центрального узла для строительства и обслуживания новых военных кораблей для польского флота."

POL_increasing_fleet_production_desc: "Ускорение темпов военно-морского строительства для замены стареющего флота советских корветов, тральщиков и подводных лодок."

POL_restructuring_gdansk_shipyard_desc: "Сложная реструктуризация исторической Гданьской судоверфи, балансирование между её коммерческой жизнеспособностью и потенциальной ролью в поддержке военно-морских проектов."

POL_ship_workshop_of_europe_desc: "Амбициозное видение позиционирования польских верфей как «Судостроительной мастерской Европы», способной строить сложные коммерческие и военные суда на экспорт."

POL_defense_baltic_coast_desc: "Усиление сил береговой обороны новыми противокорабельными ракетными комплексами, минами и быстроходными катерами для закрытия доступа противникам на Балтике."

POL_modernization_corvettes_desc: "Модернизация существующего флота корветов новыми датчиками, вооружением и двигателями для продления срока их службы."

POL_new_submarine_project_desc: "Критическая программа «Орка» по приобретению новых, современных неатомных подводных лодок для восстановления подводного военного потенциала флота."

POL_high_seas_operation_desc: "Доктринальный сдвиг в подготовке и оснащении флота для операций за пределами Балтийского моря, включая проекцию силы и участие в международных оперативных группах."

POL_purchase_frigates_desc: "Стратегическая цель по приобретению современных фрегатов, качественный скачок, который позволит польскому флоту действовать как «синий» (океанский) флот."

POL_projection_of_power_desc: "Разработка ограниченных возможностей для проекции силы, потенциально через приобретение универсального десантного корабля или стратегического авиатранспорта."

POL_wojska_specjalne_desc: "Расширение и профессионализация Сил специального назначения (Wojska Specjalne) как первоклассного инструмента для борьбы с терроризмом, разведки и неконвенциональной войны."

POL_grom_desc: "Инвестиции в GROM, элитное подразделение польского спецназа по борьбе с терроризмом и специальным операциям, для сохранения его статуса одной из лучших спецслужб мира."

POL_formoza_desc: "Повышение возможностей подразделения FORMOZA, морского спецназа, для морского контртерроризма, диверсий и разведки."

POL_jwk_desc: "Усиление Подразделения коммандос (JWK) как основных сил армии для дальней разведки и прямых рейдовых операций."

POL_agat_desc: "Формирование подразделения AGAT, группы спецназа, ориентированной на дальнюю разведку и действия в тылу противника в поддержку движений сопротивления."

POL_nil_desc: "Создание подразделения NIL, предназначенного для психологических операций (PSYOP) и информационной войны."

POL_pmc_rutkowski_patrol_desc: "Спорная политика по регулированию или потенциальному использованию частных военных компаний (ЧВК), таких как символичный «Rutkowski Patrol», для определённых задач безопасности."

POL_army_desc: "Радикальная реформа Вооружённых сил Республики Польша, сосредоточенная на стратегическом суверенитете, экономической эффективности и чётком определении их роли исключительно для национальной обороны, с отказом от дорогостоящих международных экспедиций."

POL_non_intervention_policy_desc: "Принятие строгой политики невмешательства, согласно которой Польша не должна участвовать в военных конфликтах, которые не угрожают непосредственно её национальному суверенитету, тем самым сохраняя ресурсы и избегая ненужных вовлечений."

POL_presence_in_afganistan_desc: "Спорное решение об увеличении военного вклада Польши в миссию НАТО в Афганистане, оправдываемое как необходимая союзническая обязанность, несмотря на общую неинтервенционистскую позицию партии."

POL_warsaw_conference_desc: "Проведение крупной международной конференции в Варшаве для переопределения стратегии НАТО и роли Польши в альянсе, с акцентом на большую ориентацию на коллективную оборону, а не на операции за пределами зоны ответственности."

POL_send_troops_into_iraq_desc: "Крайне противоречивое решение о направлении польских войск в коалицию в Ираке, шаг, расколовший общественное мнение и критикуемый как подчинение американским интересам в ущерб безопасности и финансам Польши."

POL_condemn_aggression_of_states_desc: "Внешнеполитическая доктрина, осуждающая военную агрессию крупных держав, позиционирующая Польшу как защитницу суверенитета малых наций и критика неоимпериалистической политики на мировой арене."

POL_countering_threat_of_terrorism_desc: "Разработка национальной стратегии противодействия угрозе терроризма с акцентом на безопасность границ, работу спецслужб и предотвращение радикализации, при одновременной критике массовой миграции из зон конфликтов как угрозы безопасности."

POL_condemn_radical_islamism_desc: "Твёрдая идеологическая позиция, открыто осуждающая радикальный исламизм как тоталитарную угрозу западной цивилизации, польской культуре и национальной безопасности, используемая для обоснования строгого иммиграционного контроля."

POL_question_of_islamic_migrants_desc: "Подача проблемы миграции преимущественно через призму безопасности и культуры, представляя приток исламских мигрантов как прямую угрозу социальной сплочённости, общественной безопасности и христианской идентичности Польши."

POL_operation_eagle_feather_desc: "Предложенная односторонняя операция польского спецназа, символизирующая более решительную и суверенную внешнюю политику, хотя её конкретные цели и задачи остаются засекреченными."

POL_operation_serval_desc: "Решение об оказании ограниченной, небоевой поддержки французской операции «Сервал» в Мали, представленное как необходимое действие для стабилизации региона, который является источником нелегальной миграции и террористической активности."

POL_syrian_dilemma_desc: "Навигация по сложной сирийской гражданской войне, балансирование между осуждением режима Асада и сильным неприятием западного военного вмешательства и исламистских повстанцев, с защитой фокуса на гуманитарной помощи и региональном сдерживании."
POL_psl: "PSL"
POL_psl_desc: "Польская народная партия вновь утверждает себя как совесть сельской местности, сплачивая аграрных избирателей, местных нотаблей и прагматичных центристов вокруг обещания стабильности, умеренности и уважения интересов села."

POL_left_conservatism: "Левый консерватизм"
POL_left_conservatism_desc: "Мы возрождаем традиционный для партии левый консерватизм: социально солидарный, глубоко католический и скептически настроенный по отношению к неограниченным рынкам, предлагая польский ответ на глобализацию."

POL_drift_right: "Дрейф вправо"
POL_drift_right_desc: "Опасаясь маргинализации в поляризованном Сейме, PSL смещается вправо, укрепляя союзы с консервативными фракциями, защищая при этом нашу аграрную систему социальной защиты."

POL_bewarw_of_dangers_communism: "Остерегайтесь опасностей коммунизма"
POL_bewarw_of_dangers_communism_desc: "Партия предупреждает, что подкрадывающаяся ностальгия по Польской Народной Республике угрожает подорвать частную собственность и тяжело завоёванные свободы сельской местности."

POL_eliminate_shortcomings_capitalism: "Устранить недостатки капитализма"
POL_eliminate_shortcomings_capitalism_desc: "Вместо того чтобы отвергать рынки, мы стремимся исправить их — обуздать хищнические финансы, поддержать кооперативы и обеспечить, чтобы конкуренция действительно приносила пользу польским фермерам."

POL_condemn_capitalist_transformation: "Осудить капиталистическую трансформацию"
POL_condemn_capitalist_transformation_desc: "PSL осуждает хаотичный «дикий капитализм» 1990-х годов, утверждая, что шоковая терапия опустошила деревни и укрепила иностранные картели."

POL_antiliberal_rhetoric: "Антилиберальная риторика"
POL_antiliberal_rhetoric_desc: "Наша риторика становится пламенной против либеральных элит Варшавы и Брюсселя, воодушевляя сторонников, которые чувствуют себя отвергнутыми технократами."

POL_catholic_subsidiarity: "Католический принцип субсидиарности"
POL_catholic_subsidiarity_desc: "Ссылаясь на католическое социальное учение, мы отстаиваем принцип субсидиарности: решения должны приниматься в залах гмин, а не в далёких министерствах."

POL_neoagrarian_economy: "Неоаграрная экономика"
POL_neoagrarian_economy_desc: "Современная неоаграрная стратегия сочетает точное земледелие, кооперативы и местную переработку, чтобы удержать цепочки создания стоимости в польских руках."

POL_support_social_market: "Поддержка социальной рыночной экономики"
POL_support_social_market_desc: "Мы принимаем модель социальной рыночной экономики — конкуренцию, подкреплённую сильной социальной защитой, — чтобы смягчить тяготы модернизации села."

POL_accept_cst: "Принять Католическое социальное учение"
POL_accept_cst_desc: "Партийные программы пересматриваются через призму Католического социального учения, связывая моральные обязательства с экономическим управлением."

POL_deregulation_market: "Дерегуляция рынка"
POL_deregulation_market_desc: "Выборочная дерегуляция облегчает бюрократическую нагрузку на семейные предприятия и агрокооперативы, ускоряя получение разрешений и доступ к кредитам."

POL_privatization_program: "Приватизация"
POL_privatization_program_desc: "Государственные активы, которые больше не служат общественным интересам, передаются проверенным местным заинтересованным сторонам, предотвращая распродажу спекулятивным транснациональным корпорациям."

POL_eliminate_inequality_in_villages: "Ликвидировать неравенство в деревнях"
POL_eliminate_inequality_in_villages_desc: "Целевые инвестиции в широкополосную связь, клиники и образование направлены на сокращение разрыва между процветающими городами и забытыми деревнями."

POL_gamover_gloval_corps: "Конец игры для глобальных корпораций"
POL_gamover_gloval_corps_desc: "Мы противостоим глобальным агробизнес-монополиям с помощью антимонопольных расследований, кооперативных закупок и патриотического брендинга, чтобы уравнять правила игры."

POL_fight_unemployment_psl: "Борьба с безработицей"
POL_fight_unemployment_psl_desc: "Программы занятости сочетают профессиональную переподготовку со стимулами для мелких производителей открывать предприятия в депрессивных повятовых центрах."

POL_protectionist_measures: "Протекционистские меры"
POL_protectionist_measures_desc: "Тарифные барьеры, сезонные квоты и правила закупок в пользу польских товаров защищают отечественных производителей от демпинга и манипуляций с валютой."

POL_postulates_direct_democracy: "Постулаты прямой демократии"
POL_postulates_direct_democracy_desc: "PSL возводит референдумы, гражданские инициативы и инициативное бюджетирование в ранг принципов, чтобы гарантировать, что реформы отражают волу деревень, которые мы представляем."
POL_left_conservative_economic_policy: "Лево-консервативная экономическая политика"
POL_right_conservative_economic_policy: "Право-консервативная экономическая политика"
POL_pegoian_economic_reforms_idea: "Новая польская экономическая реальность"

