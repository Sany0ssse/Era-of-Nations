##########AI desc###########
POL_commi_triumph_desc: "Коммунистическая партия захватывает решающий контроль над польским государством, знаменуя окончательное завершение капиталистического эксперимента и начало новой эры диктатуры пролетариата, руководствуясь принципами марксизма-ленинизма."
POL_legacy_past_commi_desc: "Новое правительство открыто принимает свою идеологическую преемственность, реабилитируя историческую роль Польской объединённой рабочей партии (ПОРП) и интегрируя её символы и ветеранов в структуру нового социалистического государства."
POL_blow_capitalism_desc: "Решительный и необратимый удар по основам капиталистической системы в Польше, демонтаж рыночной экономики и начало экспроприации буржуазной собственности во имя рабочего класса."
POL_restor_old_order_desc: "Систематическое восстановление политических, экономических и силовых структур бывшей Польской Народной Республики, эффективно откатывая реформы после 1989 года и восстанавливая социалистический порядок до 1989 года."
POL_proletariat_power_desc: "Формальное установление диктатуры пролетариата, где вся государственная власть осуществляется рабочим классом и для рабочего класса, подавляя политические права бывшей буржуазии и капиталистических элементов."
POL_antirevisionist_leninism_desc: "Очистка от 'ревизионистских' и реформистских тенденций внутри партии, навязывание строгой, ортодоксальной интерпретации ленинизма и отказ от любых отклонений от его основных революционных принципов."
POL_fight_luxemburgism_desc: "Идеологическая кампания против теорий Розы Люксембург, осуждающая её критику ленинских принципов авангардной партии как опасное отклонение от правильного революционного пути."
POL_return_ppr_desc: "Формальная отмена Третьей Польской Республики и провозглашение восстановления Польской Народной Республики (Polska Rzeczpospolita Ludowa), символизирующее полное правовое и политическое возвращение к социализму."
POL_nationalization_industry_desc: "Массовый захват всех крупных отраслей промышленности, банков и крупных коммерческих предприятий без компенсации, передача их под государственный контроль для нужд плановой социалистической экономики."
POL_nationalization_resources_desc: "Государство возвращает абсолютную собственность на все природные ресурсы, включая землю, полезные ископаемые и энергетические запасы, объявляя их коллективной собственностью народа."
POL_introduce_property_verification_desc: "Создание специальных комиссий для расследования происхождения всей крупной частной собственности, приобретённой после 1989 года, с целью конфискации активов, признанных 'незаконно приобретёнными' или 'нажитыми неправедным путём'."
POL_vat_limitation_desc: "Отмена или радикальное сокращение налога на добавленную стоимость (НДС) на товары первой необходимости, представленное как мера для облегчения экономического бремени на трудящиеся массы."
POL_progressive_taxation_desc: "Внедрение крайне агрессивной прогрессивной налоговой системы, предназначенной для ликвидации крупного частного капитала и финансирования расширения социалистического государства всеобщего благосостояния."
POL_accessibility_program_desc: "Массовая государственная программа по обеспечению бесплатного и всеобщего доступа к предметам первой необходимости, жилью, здравоохранению и образованию, выполняя основное обещание социалистического общества."
POL_praise_stalin_kim_desc: "Государственная поддержка культа личности вокруг жёстких коммунистических лидеров, таких как Иосиф Сталин и Ким Чен Ир, прославление их как образцовых защитников социализма против империализма."
POL_ban_lgbp_commi_desc: "Запрет однополых партнёрств и продвижение консервативной, традиционной модели семьи, представленное как необходимая мера для защиты социалистической морали от 'буржуазного разложения'."
POL_resume_security_service_desc: "Реформирование и усиление политической полиции (по образцу бывшей СБ) для выявления, мониторинга и нейтрализации 'классовых врагов' и 'контрреволюционных элементов' внутри страны."
POL_expansion_social_rights_desc: "Значительное расширение прав профсоюзов, рабочего самоуправления в национализированных предприятиях и государственных гарантий занятости, создание всеобъемлющей социальной безопасности."
POL_catholic_and_communism_desc: "Попытка создать прагматический, контролируемый государством союз с Католической церковью, стремясь кооптировать её социальное влияние, подчиняя его общим целям социалистического государства."
POL_reconstruction_inr_desc: "Демонтаж Института национальной памяти (ИПН) и его замена новым учреждением, задача которого — продвижение марксистско-ленинской интерпретации польской истории."
POL_turn_from_eu_block_desc: "Полный геополитический разрыв с Европейским союзом, осуждённым как 'капиталистический клуб', завершающийся выходом Польши и восстановлением полного национального суверенитета от Брюсселя."
POL_condemt_american_imperialism_desc: "Принятие яростно антиамериканской внешней политики, определяющей Соединённые Штаты как основной источник глобального империализма и главного врага социалистического мира."
POL_dismantling_nato_bases_desc: "Немедленное изгнание всех сил НАТО с польской территории и прекращение всех военных соглашений с альянсом, объявленное необходимым шагом для национального освобождения."
POL_support_serbia_desc: "Создание сильного стратегического союза с Сербией как ключевым партнёром на Балканах, объединённым общим противодействием НАТО и западной гегемонии."
POL_balkan_revolution_desc: "Активная поддержка коммунистических и антизападных движений по всему Балканам, направленная на разжигание 'красной волны', которая свергнет прокaпиталистические правительства в регионе."
POL_destroy_bondsteel_desc: "Внешнеполитическая цель, требующая демонтажа массивной военной базы США Кэмп Бондстил в Косово, рассматриваемая как основной символ американской агрессии на Балканах."
POL_support_dpr_desc: "Официальное дипломатическое признание и военная поддержка непризнанной республики Приднестровье (ПМР), оспаривающая суверенитет Молдовы и расширяющая сферу влияния России."
POL_return_union_with_russia_desc: "Подписание нового союзного договора с Российской Федерацией, воссоздание военного и экономического блока, напоминающего советскую эпоху, для совместного противостояния Западу."
POL_slam_door_on_west_desc: "Финальный, символический и практический акт разрыва всех политических и экономических связей с западными институтами, полностью приверженный Польше к антиимпериалистическому, социалистическому лагерю."
POL_rapprochement_with_China_desc: "Стратегический поворот к Китайской Народной Республике, поиск экономических инвестиций, технологического сотрудничества и могущественного союзника в новом многополярном мировом порядке."
POL_indochina_conference_desc: "Проведение крупной международной конференции коммунистических и антиимпериалистических движений из Вьетнама, Лаоса и Камбоджи для координации стратегии и демонстрации солидарности."
POL_establish_connections_cuba_desc: "Восстановление и укрепление братских связей с Кубой, прославление её как маяка социалистического сопротивления и модели для противостояния американской мощи."
POL_contact_dprk_desc: "Установление прямых дипломатических и военных контактов с Корейской Народно-Демократической Республикой (Северная Корея), объединённых общей идеологией Чучхе и противодействием США."
POL_proletarians_all_countries_desc: "Призыв к международной пролетарской революции, позиционирование Польши как авангарда в глобальной борьбе против капитализма и призыв к рабочим всех наций объединиться и свергнуть свои буржуазные правительства."
POL_ghost_haunting_europe_desc: "Декларация о том, что призрак коммунизма снова преследует Европу, сигнализируя о намерении Польши активно поддерживать и экспортировать революцию в соседние страны."
POL_visegrad_revolution_desc: "Скоординированная кампания по поддержке коммунистических партий и движений в странах Вышеградской группы (Чехия, Словакия, Венгрия), направленная на создание объединённого социалистического блока в Центральной Европе."
POL_return_wp_desc: "Амбициозная цель воссоздания современного эквивалента Варшавского договора, военного альянса социалистических государств во главе с Россией и направленного непосредственно на противодействие НАТО."
POL_scandinacian_revolution_desc: "Расширение идеологической поддержки и подрывной деятельности на ультралевые движения в Скандинавии, с долгосрочной целью свержения социал-демократических правительств и установления революционных социалистических государств."

