#PiS Events
poland_news.1.t: "Авиакатастрофа под Смоленском"
poland_news.1.d: "Ужасающие новости пришли из России. Польский правительственный самолет Ту-154М потерпел крушение при заходе на посадку на аэродром Смоленск-Северный в условиях густого тумана. На борту находился президент Польши Лех Качиньский, его супруга, а также высшее военное командование и политическая элита страны. Делегация направлялась на траурные мероприятия в Катынь. Выживших нет. В Польше объявлен национальный траур, а в обществе нарастает раскол из-за причин катастрофы."
poland_news.1.d.a: "Ужасающие новости пришли из России. Польский правительственный самолет Ту-154М потерпел крушение при заходе на посадку на аэродром Смоленск-Северный в условиях густого тумана. На борту находился лидер партии «Право и справедливость» Лех Качиньский, его супруга, а также высшее военное командование и политическая элита страны. Делегация направлялась на траурные мероприятия в Катынь. Выживших нет. В Польше объявлен национальный траур, а в обществе нарастает раскол из-за причин катастрофы."
poland_news.1.a: "Это ужасно"
poland_pis.1.t: "Авиакатастрофа под Смоленском"
poland_pis.1.d: "Сегодня самолёт Ту-154, выполнявший рейс 101 ВВС Польши, разбился недалеко от российского города Смоленск, погибли все 96 человек на борту. Среди жертв были лидер партии PiS Лех Качиньский и его жена Мария; бывший президент Польши в изгнании Рышард Качоровский; начальник Генерального штаба Польши и другие старшие польские военные офицеры; президент Национального банка Польши; польские правительственные чиновники; 18 членов польского парламента; старшие члены польского духовенства; и родственники жертв Катынской резни. Группа прибывала из Варшавы для участия в мероприятии, посвящённом 70-й годовщине резни, которое проходило недалеко от Смоленска.\n\n Пилоты пытались приземлиться в аэропорту Смоленск-Северный — бывшей военной авиабазе — в густом тумане, с видимостью, сниженной до примерно 500 метров (1600 футов). Самолёт опустился далеко ниже нормальной траектории захода на посадку, пока не ударился о деревья, перевернулся и врезался в землю, остановившись в лесистой местности на небольшом расстоянии от взлётно-посадочной полосы."
poland_pis.1.a: "Какая трагедия! Да упокоит Бог их невинные души"
poland_pis.2.t: "Самолёт успешно вернулся из Смоленска"
poland_pis.2.d: "Пассажирский самолёт Ту-154, вылетевший из Смоленска с 96 людьми на борту, включая крупных политиков и кандидатов в партии, успешно приземлился. Во время полёта неожиданный туман покрыл небо, и пилоты решили снизиться. Снижение было слишком резким, и казалось, что катастрофа неизбежна, но всё обошлось, и самолёт успешно приземлился."
poland_pis.2.a: "Отлично"
poland_pis.3.t: "Польша предлагает военное сотрудничество"
poland_pis.3.d: "Дорогие друзья, как вы знаете, наши отношения с Республикой Польша имеют многовековые исторические корни. Начиная с межплеменных войн древних славян, заканчивая польско-советской войной и оккупацией половины Западной Украины Советским Союзом.\nТеперь, в 21 веке, русский медведь снова стучится в наши двери.\nОднако мы не должны забывать о негативных моментах, которые у нас были с Республикой Польша, начиная с принудительной полонизации местного украинского населения, заканчивая тем, что наш международный партнёр всё ещё имеет претензии на наши западные территории.\nДорогие друзья, коллеги, я предлагаю решить этот вопрос таким образом, чтобы сохранить наш суверенитет и не создать угрозу нашим национальным интересам. Спасибо за внимание, задавайте ваши вопросы."
poland_pis.3.a: "Господин президент, что произойдёт, если мы согласимся?"
poland_pis.3.b: "Господин президент, каковы последствия нашего отказа?"
poland_pis.4.t: "Украина согласилась принять наше предложение"
poland_pis.4.d: "Сегодня в 8 часов по варшавскому времени пришло письмо от наших коллег из Киева. В такие неопределённые времена мы смогли отложить наши старые обиды и согласились построить новую архитектуру безопасности в Восточной Европе."
poland_pis.4.a: "Славянские братья наконец объединяются"
poland_pis.5.t: "Украина отказалась принять наше предложение"
poland_pis.5.d: "Сегодня в 8 часов в Варшаве пришли неприятные новости. Бандеровское правительство в Киеве отказалось сотрудничать с одним из столпов западного мира в Восточной Европе"
poland_pis.5.a: "Проклятые бандер-логи"
poland_pis.6.t: "Визит в Сербию"
poland_pis.6.d: "Сегодня господин президент прибыл в Белград с дипломатическим визитом. Кризис конфликта в Косово в повестке дня. В результате этой встречи Республика Польша выберет, какую сторону она займёт в этой проблеме."
poland_pis.6.b: "Польша поддерживает южнославянских братьев"
poland_pis.6.a: "Польша не может поддерживать правительство военных преступников. Отправим нашу поддержку Косово"
poland_pis.7.t: "Польские гарантии безопасности"
poland_pis.7.d: "Сегодня президент Польши обратился к главе нашей страны со следующим заявлением: 'Дорогой восточный друг, прошло много лет с момента распада ужасной Советской империи, действия наших двух великих наций смогли удержать российский коммунистический империализм от распространения по всей Европе. Однако русский медведь снова поднимается с колен, чтобы отомстить нашим народам и восстановить свою колониальную империю. Я надеюсь, у вас достаточно смысла, чтобы понять, что, скорее всего, ВАША страна будет следующей для российской агрессии. Наша задача, как щита восточных гуннов, — создать такую архитектуру безопасности, чтобы русский медведь дважды пожалел о своём решении. Дорогой друг, я призываю вас принять наши гарантии безопасности и начать создание нового санитарного кордона.' Должны ли мы принять это предложение?"
poland_pis.7.a: "Ни слова больше!"
poland_pis.7.b: "Он сумасшедший?"
poland_pis.8.t: "[FROM.GetName] согласился принять наше предложение"
poland_pis.8.d: "Наш дорогой восточный друг был достаточно умён, чтобы принять наше предложение. Теперь России придётся подумать, прежде чем реализовывать свои империалистические амбиции."
poland_pis.8.a: "Сегодня восточный рубеж стал немного безопаснее"
poland_pis.9.t: "Радиомолчание с другой стороны..."
poland_pis.9.d: "..."
poland_pis.9.a: "Курва матка, я пердоле"
poland_pis.10.t: "Вопрос об исламских мигрантах"
poland_pis.10.d: "Напряжённость на Ближнем Востоке и распространение радикального исламизма заставляют людей из стран этих регионов мигрировать в более безопасные страны. Как правило, исламские семьи, в основном из Сирии и Палестины, выбирают для миграции европейские страны, такие как Германия, Франция или Великобритания.\nУвеличение исламских мигрантов создаёт нестабильность в христианском европейском обществе и распространяет радикализм среди мусульманских меньшинств. Мы не должны допускать увеличения исламских мигрантов в Польше, но в то же время мы не должны принимать ксенофобские решения. Что нам делать?"
poland_pis.10.a: "Польша останется христианской страной"
poland_pis.10.b: "Мы должны оставить ксенофобию, они тоже люди"
poland_pis.11.t: "Lex TVN"
poland_pis.11.d: "Сегодня Сейм внес спорную поправку к 'Закону о вещании и кинематографии' — более известную под медиа-термином Lex TVN. Поправки были предназначены для закрытия лазеек, которые позволяли компаниям из-за пределов Европейской экономической зоны владеть более чем 49% акций польских радио- и телевизионных станций через подставные корпорации.\nСейм отрицает, что мера направлена против какого-либо одного вещателя, говоря, что она направлена на предотвращение потенциальных медиа-приобретений странами, не входящими в ЕС, такими как Россия, Китай и арабские страны; однако многие критики описали поправку как попытку нацелиться на TVN и его материнскую компанию TVN Grupa Discovery в частности, учитывая, что это основная телевизионная платформа оппозиции правящей партии Право и справедливость."
poland_pis.11.a: "Мы примем законопроект"
poland_pis.11.b: "И где здесь демократия?"
poland_pis.11.c: "Использовать вето"
poland_pis.12.t: "Польша проводит дебандеризацию"
poland_pis.12.d: "Польская администрация объявила о начале дебандеризации наших мигрантов. Они говорят: 'Нам не нравится, когда украинские мигранты, которых мы принимаем с хлебом и солью, размахивают флагами ОУН-УПА и кричат неонацистские лозунги. Видимо, наши соседи забывают, что именно под такими флагами и лозунгами Организация украинских националистов совершила геноцид польского народа в марте 1943 года. Мы не считаем эти жесты провокационными и крайне неуважительными к нашей истории и культуре.'"
poland_pis.12.a: "Поляки слишком много о себе думают"
poland_pis.13.t: "Инициатива трёх морей"
poland_pis.13.d: "Сегодня утром мы получили официальное приглашение от польских дипломатов присоединиться к недавно созданной организации под названием 'Инициатива трёх морей' или 'Три моря'. Организация обещает экономическое и политическое сотрудничество между всеми участвующими странами. А проект Междуморья — это польская империалистическая мечта о восстановлении былого величия между тремя морями, организация кажется совершенно мирной и экономически выгодной инициативой для нас, присоединение к которой может принести свои преимущества."
poland_pis.13.a: "Мы примем приглашение"
poland_pis.13.b: "Вынуждены отказать"
poland_pis.14.t: "[FROM.GetName] принимает приглашение"
poland_pis.14.d: "Сегодня мы получили официальный ответ от [FROM.GetName] на наше приглашение. Они согласились стать частью Трёх морей и внести вклад в развитие организации. Это определённо укрепит наши отношения и увеличит нашу экономическую и политическую мощь."
poland_pis.14.a: "Хорошие новости!"
poland_pis.15.t: "[FROM.GetName] не принял приглашение"
poland_pis.15.d: "Сегодня мы получили официальный ответ от [FROM.GetName] на наше приглашение. Они решили отказать в нашем приглашении, возможно, у них были на то причины, однако это очень печально, потому что они могли бы внести вклад в развитие организации."
poland_pis.15.a: "Это их выбор."
poland_pis.16.t: "Польша создаёт новую организацию"
poland_pis.16.d: "Сегодня президент Польши Анджей Дуда выступил с речью. Он говорил о создании нового экономического и политического альянса под названием 'Инициатива трёх морей'. Ряд стран уже получили приглашения присоединиться к организации, а некоторые даже согласились. Такие организации явно играют на руку Польше с точки зрения влияния в Европе."
poland_pis.16.a: "Интересно, к чему это приведёт"
poland_pis.17.t: "Польша предлагает заключить Балтийский пакт"
poland_pis.17.d: "Сегодня польские дипломаты обратились к нам с предложением подписать некий 'Балтийский пакт'. Этот пакт даст взаимные обязательства нашим странам по защите суверенитета и границ друг друга. Мы получим польские гарантии безопасности и позволим им создать военную базу на нашей территории, мы в свою очередь получим те же привилегии. Должны ли мы подписать?"
poland_pis.17.a: "Мы подпишем"
poland_pis.17.b: "Я думаю, России это не понравится..."
poland_pis.18.t: "[FROM.GetName] согласился принять наше предложение"
poland_pis.18.d: "[FROM.GetName] принял наше предложение подписать Балтийский пакт. Теперь у нас есть взаимные обязательства относительно безопасности границ и суверенитета друг друга."
poland_pis.18.a: "Европа стала ещё безопаснее"
poland_pis.19.t: "[FROM.GetName] отказался принять наше предложение"
poland_pis.19.d: "[FROM.GetName] отказал в нашем предложении. Балтийский пакт не был подписан с ними, что жаль, мы могли бы стать стратегическими партнёрами."
poland_pis.19.a: "Посмотрим, как они справятся без нашей поддержки"
poland_pis.20.t: "Польша предлагает поддержку"
poland_pis.20.d: "Приднестровский конфликт, начавшийся в 90-х, остаётся нерешённым. Более того, ухудшающиеся отношения с Россией, кажется, делают военный конфликт неизбежным. Польша решила поддержать нас в этом конфликте и спросила, что нам нужно. Должны ли мы принять их поддержку?"
poland_pis.20.a: "Нам нужно больше денег"
poland_pis.20.b: "Нам определённо нужно оружие"
poland_pis.20.c: "Нам ничего не нужно"
poland_pis.21.t: "Польша требует репарации за Волынь"
poland_pis.21.d: "Польша требует репарации за геноцид польского народа в Волынской резне в марте 1943 года, совершённый ОУН-УПА. С одной стороны, выплатив репарации, мы можем забыть о старых обидах и стать хорошими партнёрами с Польшей. С другой стороны, сам факт таких требований — это прямое унижение нашей нации. Что нам делать?"
poland_pis.21.a: "Мы признаём геноцид поляков и выплатим репарации"
poland_pis.21.b: "Мы ничего не заплатим. Слава Украине"
poland_pis.22.t: "Украина согласилась выплатить репарации"
poland_pis.22.d: "Украина согласилась на наше требование и выплатила нам репарации за Волынь. Конечно, это не оправдает преступления организации ОУН-УПА и не вернёт к жизни женщин, детей и сотни других поляков, убитых в марте 1943 года, но теперь мы можем построить новое будущее с нашим соседом, который признал грехи прошлого и готов улучшить отношения."
poland_pis.22.a: "Да будет мир!"
poland_pis.23.t: "Украина отказалась выплачивать репарации"
poland_pis.23.d: "Украина отказалась выплачивать репарации и признавать геноцид польского народа на Волыни. Мы никогда не забудем жертв Волынской резни и никогда не простим тех, кто совершил этот ужасный акт. Организация ОУН-УПА, стоявшая за геноцидом на Волыни, всё ещё прославляется в Украине, и их лидер Степан Бандера возведён в ранг Национального героя Украины. Пора остановить этот абсурд, мирно или войной."
poland_pis.23.a: "Ещё Польша не погибла!"
poland_pis.23.b: "Мы заставим их, но не сейчас"
poland_pis.24.t: "Польша закрывает границы с нами"
poland_pis.24.d: "Польское правительство объявило о закрытии границ с нашей страной. Этот шаг явно не дружелюбный... Мы можем забыть о дальнейшем сотрудничестве с поляками."
poland_pis.24.a: "Они не увидят наших картошек"
poland_pis.25.t: "Польша просит построить Защитный зонт"
poland_pis.25.d: "Польские дипломаты обратились к нам с просьбой. Они просят нас построить Защитный зонт над их территорией. Для обеспечения этого мы должны отправить несколько бригад нашей армии для увеличения нашего присутствия в польском регионе."
poland_pis.25.a: "Давайте защитим Польшу!"
poland_pis.25.b: "Не стоит тратить ресурсы на это"
poland_pis.26.t: "[FROM.GetName] соглашается увеличить присутствие"
poland_pis.26.d: "[FROM.GetName] соглашается увеличить присутствие. Их присутствие в регионе жизненно важно для нашей безопасности, особенно в такое напряжённое время."
poland_pis.26.a: "Вот что значит союзник"
poland_pis.27.t: "[FROM.GetName] отказался увеличить присутствие"
poland_pis.27.d: "[FROM.GetName] отказался увеличить присутствие. Похоже, нам придётся поддерживать собственную безопасность."
poland_pis.27.a: "Мы справимся сами"

