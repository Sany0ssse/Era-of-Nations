l_russian:
 additional_migrants_agreements_income_tt:0 "Трудовой договор: частные переводы работников не начисляются в государственную казну.\n"
 eon_migration_relief_category:0 "Миграция и приём беженцев"
 eon_migration_relief_category_desc:0 "Программа приёма: §Y[GetEonMigrationAdmissionPolicy]§!\nПринято беженцев: §Y[?eon_refugees_hosted|0]§!; трудовая интеграция: [?eon_refugees_integrated|0]; долгосрочное проживание: [?eon_refugees_longterm|0].\nТрудовые мигранты: [?eon_labor_migrants_hosted|0]. Места приёма: [?eon_refugee_capacity|0]; свободно: [?eon_refugee_capacity_remaining|0].\nЗа месяц: прибыло беженцев [?eon_refugee_month_arrived|0], добровольно вернулось отсюда [?eon_refugee_month_returned|0], прибыло работников [?eon_labor_month_arrived|0].\nОценка выезда из наших опасных регионов без доступной страны приёма: [?eon_refugee_month_unplaced|0]. Эти люди остаются дома; это не учёт внутренних переселенцев.\nЦелевой фонд помощи гражданским: [?eon_refugee_relief_fund|6] млрд. Экстренная помощь в неделю: [?eon_refugee_weekly_cost|6] млрд; последнее недельное списание из фонда: [?eon_refugee_weekly_fund_paid|6] млрд. Расширение инфраструктуры приёма: [?eon_refugee_capacity_weekly_cost|3] млрд/неделю. Потребность в помощи внутри воюющей страны: [?eon_civilian_relief_need|0] человек (оценка).\n\nЛюди действительно покидают один регион и прибывают в другой. Трудовой договор регулирует набор работников; он не даёт безвизовый туризм, автоматическое ПМЖ или убежище. Защита беженцев — отдельная программа. Для помощи другой стране откройте её дипломатические действия и выберите §YФинансировать помощь гражданским§!."
 eon_migration_policy_paused:0 "Дополнительный организованный приём приостановлен"
 eon_migration_policy_regulated:0 "Регулируемый приём"
 eon_migration_policy_expanded:0 "Расширенный приём и переселение"
 eon_migration_admission_paused:0 "Приостановить дополнительный организованный приём"
 eon_migration_admission_paused_desc:0 "Приостановить новые прибытия по нашей организованной программе. Уже прибывшие жители остаются. Решение не депортирует людей, не отменяет защиту и не рассматривает индивидуальные заявления об убежище."
 eon_migration_admission_regulated:0 "Возобновить регулируемый приём беженцев"
 eon_migration_admission_regulated_desc:0 "Принимать беженцев из доступных соседних зон войны, пока есть места. Помощь гражданским требует еженедельных расходов. Трудовая интеграция занимает время и зависит от нашего рынка труда."
 eon_migration_admission_expanded:0 "Расширить приём и переселение из дальних стран"
 eon_migration_admission_expanded_desc:0 "Увеличить вместимость программы на 50%. Разрешить организованное переселение из дальних стран через действующие дипломатические, трудовые или союзные связи. Пограничные законы и правила проживания продолжают действовать."
 eon_migration_expand_reception_capacity:0 "Профинансировать временные центры приёма"
 eon_migration_expand_reception_capacity_desc:0 "Потратить §Y0.25 млрд§! сейчас и увеличить места приёма ещё на §Y50% на 365 дней§!. Содержание: §Y0.01 млрд еженедельно§! из бюджета. Целевой фонд оплачивает экстренную помощь, но не содержание этих центров. Окончание срока не выселяет жителей."
 eon_refugee_reception_modifier:0 "Приём и интеграция гражданских"
 eon_refugee_reception_modifier_tt:0 "Экстренная помощь входит в недельный бюджет. Целевой фонд покрывает подходящие расходы до исчерпания. Неинтегрированные беженцы временно задерживают вступление в гражданскую рабочую силу; население не начисляется повторно. Перегрузка служб приёма может снижать стабильность и скорость строительства. Добровольное возвращение требует длительного мира и пригодного контролируемого региона на родине. Долгосрочное проживание — обобщённая модель, без автоматического гражданства."
 eon_migration_population_flow_tt:0 "Чистая миграция отражает фактические месячные перемещения в годовом выражении. Население переносится между регионами; этот модификатор не создаёт дополнительных рождений."
 MAXIMUM_MIGRATION_RATE_TT_DELAYED:0 "Унаследованный индекс миграционной привлекательности носит информационный характер. Фактическое перемещение зависит от действующего трудового договора и вакансий либо от доступной программы приёма беженцев со свободными местами.\n\nПринято беженцев за месяц: [?eon_refugee_month_arrived|0] человек.\nОценка выезда из-за войны без доступной страны приёма: [?eon_refugee_month_unplaced|0] человек; они остаются в родном регионе.\nПринято трудовых мигрантов: [?eon_labor_month_arrived|0] человек.\nВместимость, расходы и настройки: §YМиграция и приём беженцев§! в решениях."
 NET_MIGRATION_RATE_TT_DELAYED:0 "Чистая миграция в годовом выражении: прибытия за месяц минус выезды, разделённые на население и умноженные на 12. Это результат последнего месячного расчёта, не прогноз и не дополнительный прирост населения.\n\nПрибыло за месяц: [?eon_migration_month_in|0] человек.\nУехало за месяц: [?eon_migration_month_out|0] человек."
 EMPLOYMENT_TOOLTIP_DELAYED:0 "Общая рабочая сила: §Y[?ROOT.workforce_total_display]§!\nТрудовые мигранты в населении: §Y[?ROOT.eon_labor_migrants_hosted|0] человек§! (не число фактически занятых)\nДоля населения в составе рабочей силы: §Y[?ROOT.workforce_total_percentage_display|%]§!\n\nМиллионов работников по секторам:\n§GВоенные заводы§!: [?ROOT.workers_in_mil_facs]\n§BВерфи§!: [?ROOT.workers_in_dockyards]\n§OГражданские фабрики§!: [?ROOT.workers_in_civ_facs]\n§CОфисы§!: [?ROOT.workers_in_offices]\n§BНПЗ§!: [?ROOT.workers_in_rub_ref]\n§GНекоммерческое сельское хозяйство§!: [?ROOT.agriculture_workers]\n§CДобыча ресурсов§!: [?ROOT.resource_sector_workers]\n§CКомпании§!: [?ROOT.companies_workers]\n§CФилиалы§!: [?ROOT.branches_workers]\n§CМалый бизнес§!: [?ROOT.small_businesses_workers]\n§YКоммерческие агрокомплексы§!: [?ROOT.workers_in_agriculture_district]\n§RБезработные и занятые в натуральном хозяйстве§!: [?ROOT.total_unemployed]\n\nТекущая безработица: §R[?ROOT.total_unemployed_percentage_display|%]§!\nБазовая безработица: §R[?ROOT.base_unemployment_percent|%]§!\nДля снижения базовой безработицы добейтесь низкой инфляции, хорошего цикла экономики и продуктивности. Она медленно растет если вы в войне или у вас плохая ситуация в экономике.\n\n§YПорог высокой безработицы:§! [?ROOT.unemployment_threshold_display_var|%0]\n\n[UNEMPLOYMENT_MODIFIERS]"
