l_russian:
 eon_migration_treaty_offer_available_tt: "Страны не воюют друг с другом, контролируют населённую территорию и допускают найм через границы. У партнёра есть свободные работники и хорошие отношения с нами. Нет конфликтующей роли или незавершённого предложения; истёк 120-дневный срок ожидания для этой пары."
 eon_migration_treaty_response_valid_tt: "Именно это предложение ещё ожидает ответа с обеих сторон, а условия найма остаются действительными."
 propose_migrants_agreement: "Предложить соглашение о трудовом найме"
 PROPOSE_MIGRANTS_AGREEMENT_ACTION_DESC: "Предложить добровольный найм работников из страны с избытком рабочей силы. Реальный переезд зависит от рабочих мест и безопасного разрешённого маршрута. Соглашение не предоставляет визы, постоянное проживание или приём беженцев."
 PROPOSE_MIGRANTS_AGREEMENT_DESC: "Предложить [From.GetNameWithFlag] соглашение о добровольном трудовом найме? Переезд возможен при наличии рабочих мест и безопасного разрешённого маршрута. Визы, постоянное проживание и приём беженцев регулируются отдельно."
 PROPOSE_MIGRANTS_AGREEMENT_ACTION_TITLE: "Соглашение о трудовом найме"
 PROPOSE_MIGRANTS_AGREEMENT_TITLE: "Соглашение о трудовом найме"
 PROPOSE_MIGRANTS_AGREEMENT_TOOLTIP: "$eon_migration_treaty_offer_available_tt$"
 migrants_agreement_add: "Трудовой найм: принимающая страна"
 migrants_agreement_cut: "Трудовой найм: направляющая страна"
 cancel_migrants_agreement: "Расторгнуть соглашение о трудовом найме"
 CANCEL_MIGRANTS_AGREEMENT_ACTION_DESC: "Прекратить будущий найм по соглашению. Проживание жителей и защита беженцев регулируются отдельными правилами."
 CANCEL_MIGRANTS_AGREEMENT_ACTION_TITLE: "Расторгнуть соглашение о трудовом найме"
 CANCEL_MIGRANTS_AGREEMENT_TITLE: "Расторгнуть соглашение о трудовом найме"
 CANCEL_MIGRANTS_AGREEMENT_TOOLTIP: "У нас есть соглашение о трудовом найме с [From.GetNameWithFlag]. Отмена прекращает будущий найм по соглашению и не высылает жителей или беженцев."
 CANCEL_MIGRANTS_AGREEMENT_DESC: "Расторгнуть соглашение о трудовом найме с [From.GetNameWithFlag]? Это прекращает будущий найм по соглашению, но не высылает жителей или беженцев."
