l_russian:
 build_enrichment_facility_button_tt:0 "§YПостроить комплекс топливного цикла§!\nКомплекс перерабатывает природный уран в готовое реакторное топливо. Он не добывает руду и может работать на импорте. Один комплекс стоит 25 млрд USD и строится 730 дней; группа из трёх — 75 млрд и 1095 дней (Shift + щелчок). Деньги резервируются заранее. Это игровые сроки и стоимость, а не нормативы. Первое развитие сохраняет существующие дипломатические реакции."
 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION_TT:0 "§YБаланс реакторного топлива§!\nГотовый склад: [?var_reactor_material_stockpile|0] кг U. Прогноз производства: [?nuclear_reactor_fuel_production|0] кг/нед.; потребность: [?nuclear_fuel_consumption|0] кг/нед.\nПриродный уран: [?eon_natural_uranium_stock_kg|0] кг на складе; поток [?eon_uranium_available_flow_kg|0] кг/нед. Сырьё покупается в обычной торговле.\nПереработка потребляет 9 кг природного U на 1 кг реакторного U; остаток учитывается как обеднённый уран. При нехватке топлива выработка АЭС уменьшается пропорционально. Повреждённые объекты сохраняют 40% базовой мощности.\nМодель объединяет конверсию, гражданское обогащение и изготовление топлива. Она пока не различает типы реакторов."
 URANIUM_ENRICHMENT:0 "Топливный цикл"
 energy.1.d:0 "[FROM.GetNameWithFlag] предлагает купить [?eon_nuclear_fuel_trade_quantity|0] кг готового реакторного топлива по [?eon_nuclear_fuel_trade_price|2] тыс. USD/кг. Условия зафиксированы; полная оплата зарезервирована покупателем. Предложение действительно 30 дней при сохранении всех условий. Итоговая сумма сделки: [?eon_nuclear_fuel_trade_total|8] млрд USD. Она зафиксирована с учётом точности денежного расчёта."
 energy.10.d:0 "[FROM.GetNameWithFlag] предлагает продать [?eon_nuclear_fuel_trade_quantity|0] кг готового реакторного топлива по [?eon_nuclear_fuel_trade_price|2] тыс. USD/кг. Товар уже зарезервирован продавцом. Предложение действительно 30 дней при сохранении всех условий. Итоговая сумма сделки: [?eon_nuclear_fuel_trade_total|8] млрд USD. Она зафиксирована с учётом точности денежного расчёта."
 change_reactor_grade_material_effect_tt:0 "Изменяет запас §Yготового реакторного топлива§! на [?eon_legacy_reactor_reward_kg|0+] кг U в [THIS.GetNameWithFlag] (Текущий запас: [?THIS.var_reactor_material_stockpile|Y0] кг U)\n"
