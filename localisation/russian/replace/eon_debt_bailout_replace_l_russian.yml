 bankruptcy_seek_bailout_from_second_biggest_influencer_desc:0 "Попросить второго крупнейшего экономического партнёра погасить до 15% нашего текущего долга. Максимум фиксируется при отправке. Расход донора равен фактическому уменьшению долга; прощения долга и автоматического политического влияния нет."
 bankruptcy_seek_bailout_from_second_biggest_influencer_tt:0 "Попросить второго крупнейшего экономического партнёра погасить до 15% нашего текущего долга. Максимум фиксируется при отправке. Расход донора равен фактическому уменьшению долга; прощения долга и автоматического политического влияния нет."
 bankruptcy_seek_bailout_from_neighbour_desc:0 "Попросить более богатого дружественного соседа погасить до 10% нашего текущего долга. Выбранный сосед и максимум фиксируются. Расход донора равен фактическому уменьшению долга. Автоматического политического влияния нет."
 bankruptcy_seek_bailout_from_neighbour_tt:0 "Попросить более богатого дружественного соседа погасить до 10% нашего текущего долга. Выбранный сосед и максимум фиксируются. Расход донора равен фактическому уменьшению долга. Автоматического политического влияния нет."
 bankruptcy_seek_bailout_from_overlord_desc:0 "Попросить нашего сюзерена погасить до 50% текущего долга. Его расход равен фактическому уменьшению долга. Если платёж состоится и мы останемся его субъектом, наша доля автономии однократно уменьшится на 0,35. Это явное условие запроса."
 bankruptcy_seek_bailout_from_overlord_tt:0 "Попросить нашего сюзерена погасить до 50% текущего долга. Его расход равен фактическому уменьшению долга. Если платёж состоится и мы останемся его субъектом, наша доля автономии однократно уменьшится на 0,35. Это явное условие запроса."
