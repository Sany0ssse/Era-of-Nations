 bankruptcy_seek_bailout_from_biggest_influencer_desc:0 "Попросить крупнейшего экономического партнёра погасить до 20% нашего текущего долга. Максимум фиксируется при отправке. Расход донора равен фактическому уменьшению долга; прощения долга и автоматического политического влияния нет."
