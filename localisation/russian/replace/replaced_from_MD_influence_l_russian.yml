 influence.52.d: "У нас есть следующие варианты отправки оборудования нашему союзнику.\n\n Комплект пехотного снаряжения: 1000 единиц пехотного снаряжения/стрелкового оружия, 250 единиц ПЗРК, 250 единиц противотанкового оружия, 250 единиц командного снаряжения в зависимости от того, что имеется в нашем арсенале.\n\n Комплект транспортных средств: 250 единиц БТР, 250 единиц БМП, 250 единиц внедорожников.\n\n Комплект БПЛА/ракет: 100 единиц БПЛА, 100 единиц баллистических ракет, 100 единиц крылатых ракет."
