l_russian:
 double_more_gdp_than_them_tt: "Наш ВВП должен быть в два раза выше, чем у них"
 influence.1.d: "Мы решили начать разработку пакета экономической помощи. Мы можем принять решение о выделении 5, 15 или 35 миллиардов долларов в качестве помощи. Эта щедрость улучшит отношения и предоставит нам влияние в [FROM.GetName], хотя нет никакой гарантии, что они потратят экономическую помощь на что-то ценное. Чем больше мы будем давать, тем большее влияние приобретем.\n\n"
 influence.1.a: "Направьте 5 миллиардов долларов в качестве экономической помощи."
 influence.1.b: "Направьте 15 миллиардов долларов в качестве экономической помощи."
 influence.1.c: "Направьте 35 миллиардов долларов в качестве экономической помощи."
 aid_button_TT: "§HПредоставить экономическую помощь§!\nМы отправим единовременный денежный подарок по адресу §H[FROM.GetNameWithFlag]§! в обмен на влияние и улучшение отношений. Подарок составит §Y5§!, §Y15§!, or §Y35§! миллиардов §H[FROM.GetAdjective]§! из казны.\n\nЕсли ИИ находится в выгодном положении, он откажет в помощи.\n"
 aid_military_button_TT: "§HВоенная помощь§!\nМы можем отправить единовременную партию оружия, тяжелой техники, беспилотных летательных аппаратов и ракет или предоставить военные услуги, такие как логистика, разведка и бригада наемников. §H[FROM.GetNameWithFlag]§! в обмен на влияние и укрепление отношений. Однако это негативно скажется на наших отношениях с любым из их врагов. Вы можете отправлять военную помощь раз в шестьдесят дней.\n\n§RВы можете послать отряд наемников, если играете за реакционеров или националистов§!"
 economic_exploitation_button_TT: "§HЭкономическая эксплуатация§!\nМы будем использовать часть нашего влияния для эксплуатации экономики §H[FROM.GetNameWithFlag]§!. Это Даст Вам §GБесплатную промышленность§! и §GДоступ к казне§!, §Wно повредит вашим отношениям.§!\n\nПримечание: Вы можете эксплуатировать страну §RОдин раз в 182 дней§!. Выбирайте Свой Вариант эксплуатации с умом"
 foreign_interference_in_our_politics_dem_idea: "Иностранное влияние на нашу политику"
 foreign_interference_in_our_politics_nat_idea: "Иностранное влияние на нашу политику"
