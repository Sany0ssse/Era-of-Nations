l_russian:
 available_internal_investments_tt: "У всех стран будет минимум два доступных слота, которые они могут использовать для любого из своих штатов по всей стране. Вы можете выбрать выполнение нескольких проектов в одном штате или распределить проекты по всей стране. Вы можете получить дополнительные слоты, повысив §YРейтинг мощности§! своей страны\n\nТекущие проекты:\n[ROOT.state_owned_investment_timer_seven][ROOT.state_owned_investment_timer_six][ROOT.state_owned_investment_timer_five][ROOT.state_owned_investment_timer_four][ROOT.state_owned_investment_timer_three][ROOT.state_owned_investment_timer_two][ROOT.state_owned_investment_timer_one]"
 encourage_productivity_in_state_click_tt: "В течение 120 дней §YРост производительности§! в §Y[THIS.GetName]§! будет на §Y25%§! быстрее."
 block_future_expand_local_building_capacity: "Мы можем §YРасширить возможности местного строительства§! в §Y[THIS.GetName]§!(Времена Строительство Мощность Расширена:§Y [?expanded_building_slot_times]/5§!)"
 expand_local_building_capacity_click_tt: "Каждые 120 дней мы можем получать §G2§! §Yячейки для строительства§! в §Y[THIS.GetName]§!.\nЭкспансия в малонаселенных штатах будет §Gдешевле§!, в то время как в густонаселенных регионах это будет более §Rдорогим§!.\nТекущее количество расширений §Yячеек для строительства§! в данном регионе до §Y[?expanded_building_slot_times]/5§!."
 core_state: "В Настоящее Время §Y[THIS.GetName]§! §YИнтегрируется§!"
 core_state_tt: "§YИнтеграция§! §YРегиона§! §Y[THIS.GetName]§!\n---------\nРегион §Y[THIS.GetName]§! в настоящее время не интегрирован в нашу страну, как другие регионы, что вынуждает нас содержать здесь значительный военный и полицейский гарнизон. Используя наши ресурсы, мы будем инвестировать их в §Y[THIS.GetName]§! чтобы, наконец, включить его в состав нашей страны"
 core_state_delayed_tt: "§YТребования:§!\n[!core_state_click_enabled]\n§YЭффекты:§!\n[!core_state_click]\n"
 core_state_click_tt: "На следующие 100 дней мы получим следующий эффект:"
 GENERIC_regions_integration_idea: "Интеграция новых Территорий"
 GENERIC_regions_integration_idea_desc: "Интеграция региона §Y[THIS.GetName]§! позволит нам высвободить дополнительные ресурсы и консолидировать местное население"
 fix_damaged_state_tt: "§YНачать восстановительные работы в регионе§! §Y[THIS.GetName]§!\n---------\nРегион §Y[THIS.GetName]§! в настоящее время пострадал от войны, что мешает его полной интеграции в нашу экономику. Используя наши ресурсы, мы вложим их в §Y[THIS.GetName]§!, чтобы начать его восстановление после войны."
 fix_damaged_state_delayed_tt: "§YТребования:§!\n[!fix_damaged_state_click_enabled]\n§YЭффекты:§!\n[!fix_damaged_state_click]\n"
 state_restoration: "Восстановление региона после войны"

 encourage_migrants_tt: "§YПривлечь мигрантов§! в §Y[THIS.GetName]§!\n---------\nЧтобы компенсировать недостаток населения и рабочих, мы можем запустить программы по репатриации и привлечению мигрантов в §Y[THIS.GetName]§! регион."
 encourage_migrants_delayed_tt: "§YТребования:§!\n[!encourage_migrants_click_enabled]\n§YЭффекты:§!\n[!encourage_migrants_click]\n"
 migrants_attraction: "Программа по репатриации и привлечению мигрантов"
 Positive_immigration_rate_tt: "Положительной поток миграции"