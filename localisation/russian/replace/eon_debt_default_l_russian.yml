l_russian:
 debt_default_pay_10_from_treasury:0 "Погасить до §Y$10 млрд§! из казны"
 debt_default_pay_10_from_treasury_desc:0 "Погасить часть задолженности после дефолта из имеющихся средств. Выплата ограничена $10 млрд, доступными средствами казны и остатком задолженности. После истечения срока погашения задолженность сохраняется и её можно оплатить. Новая ссуда не оформляется."
 debt_default_pay_50_from_treasury:0 "Погасить до §Y$50 млрд§! из казны"
 debt_default_pay_50_from_treasury_desc:0 "Погасить часть задолженности после дефолта из имеющихся средств. Выплата ограничена $50 млрд, доступными средствами казны и остатком задолженности. После истечения срока погашения задолженность сохраняется и её можно оплатить. Новая ссуда не оформляется."
 debt_default_pay_10_from_treasury_tt:0 "Списать из казны и погасить одинаковую сумму задолженности: до §Y$10 млрд§!, в пределах имеющихся средств и остатка задолженности."
 debt_default_pay_50_from_treasury_tt:0 "Списать из казны и погасить одинаковую сумму задолженности: до §Y$50 млрд§!, в пределах имеющихся средств и остатка задолженности."
 debt_default_pay_from_treasury_trigger_tooltip:0 "Для выплаты нужны активная или просроченная задолженность после дефолта, положительный остаток и средства в казне. Высокая ставка не запрещает выплату из имеющихся средств."
 debt_default_main_mission_complete_trigger:0 "Остаток задолженности после дефолта должен составлять ровно §Y$0§!."
 bankruptcy_default_on_debts_desc:0 "Перевести половину непогашенного долга в отдельную задолженность после дефолта. Вторая половина остаётся обычным долгом. Объявление не списывает основной долг и не переводит деньги. Сначала необходимо погасить предыдущую задолженность после дефолта."
 bankruptcy_default_on_debts_tt:0 "§Y50%§! обычного долга переводится в отдельную задолженность после дефолта; оставшиеся §Y50%§! сохраняются как обычный долг. Общая сумма основного долга не меняется. Срок погашения — §Y360 дней§!. После истечения срока непогашенный остаток сохраняется и его можно оплатить из имеющихся средств казны."
 bankruptcy.13.a:0 "Принять к сведению отменённое старое уведомление"
 bankruptcy.13.b:0 "Закрыть отменённое старое уведомление"
 bankruptcy.14.a:0 "Принять к сведению отменённое старое уведомление"
 debt_default_sell_civilian_factories_desc:0 "Через 5 дней ликвидировать один уровень принадлежащей стране и контролируемой ею гражданской фабрики. Условная стоимость в игре — $10 млрд. Сначала погашается остаток обязательства после дефолта, избыток поступает в казну. Весь избыток должен помещаться в лимит казны. Если обязательство уже погашено или подходящего актива больше нет, отложенная операция ничего не меняет."
 debt_default_dismantle_military_factories_desc:0 "Через 5 дней ликвидировать один уровень принадлежащей стране и контролируемой ею военного завода. Условная стоимость в игре — $10 млрд. Сначала погашается остаток обязательства после дефолта, избыток поступает в казну. Весь избыток должен помещаться в лимит казны. Если обязательство уже погашено или подходящего актива больше нет, отложенная операция ничего не меняет."
 debt_default_scrap_dockyard_desc:0 "Через 5 дней ликвидировать один уровень принадлежащей стране и контролируемой ею верфи. Условная стоимость в игре — $10 млрд. Сначала погашается остаток обязательства после дефолта, избыток поступает в казну. Весь избыток должен помещаться в лимит казны. Если обязательство уже погашено или подходящего актива больше нет, отложенная операция ничего не меняет."
 debt_default_cut_down_government_services_desc:0 "Через 5 дней ликвидировать один уровень принадлежащей стране и контролируемой ею офисного здания. Условная стоимость в игре — $10 млрд. Сначала погашается остаток обязательства после дефолта, избыток поступает в казну. Весь избыток должен помещаться в лимит казны. Если обязательство уже погашено или подходящего актива больше нет, отложенная операция ничего не меняет."
