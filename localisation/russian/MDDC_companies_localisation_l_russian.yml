 SOV_rosatom_idea_desc: "Росатом, также известный как Государственная корпорация по атомной энергии «Росатом», — российская государственная корпорация со штаб-квартирой в Москве, специализирующаяся на атомной энергии, неядерных товарах и высокотехнологичной продукции. Созданная в 2007 году, организация объединяет более 350 предприятий, включая научно-исследовательские организации, комплекс ядерного оружия и единственный в мире флот атомных ледоколов."
