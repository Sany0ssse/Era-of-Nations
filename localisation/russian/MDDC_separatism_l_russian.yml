 separatism.1.t: "[TAT.GetNameWithFlag] требует федерализации"
 separatism.1.d: "Похоже, что национальное самосознание этого региона достигло такого уровня, что представители этой части нашей страны теперь требуют федерализации и статуса федерального субъекта, что может кардинально изменить политическую и административную структуру нашей страны."
 separatism.1.a: "Федерализация - это хорошо"
 separatism.1.b: "Федерализация = Сепаратизм"
