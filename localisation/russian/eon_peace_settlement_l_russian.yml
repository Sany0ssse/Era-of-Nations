l_russian:
 eon_peace_draft_title:0 "Условия прекращения войны"
 eon_peace_draft_desc:0 "Выберите предложение для [?eon_peace_draft_target.GetName]. Затем вернитесь в дипломатию этой страны и нажмите «Предложить выбранные условия». Открытие этого окна не останавливает войну и не означает капитуляцию.\n\nОкончательное соглашение требует согласия противника. Подписание без передачи территорий возвращает оккупированные регионы их владельцам. Для временного соглашения стороны также согласуют взаимное отведение войск и срок ненападения. По истечении срока война сама не возобновляется.\n\nДвусторонний механизм не может распоряжаться союзниками и зависимыми странами: мир выбранной пары не завершает оставшиеся войны союзников. Общие условия требуют участия других сторон. Территориальные требования обсуждаются в отдельной мирной конференции; это согласие на процедуру, а не заранее подписанная передача регионов."
 eon_peace_draft_next_tt:0 "Вернитесь в дипломатию выбранного противника и отправьте предложение выбранных условий. Противник вправе отказать."
 eon_peace_draft_cancel:0 "Отменить подготовку"
 eon_peace_contact_tt:0 "Для обращения достаточно текущей войны с выбранной страной. Наступательная или оборонительная роль, срок войны и ранг державы не ограничивают обращение."
 eon_peace_offer_ready_tt:0 "Предложение требует действующей войны, самостоятельных правительств и безопасной двусторонней границы исполнения. Не должно быть капитуляции, текущей мирной конференции или прежнего предложения, которое ещё не получило окончательного ответа. Территориальная конференция дополнительно требует отсутствия других участников и зависимых стран. Платёж требует полной суммы в казне отправителя."
 eon_peace_accept_ready_tt:0 "Согласие действительно в течение 30 дней и только для этих условий и сторон. Повторно проверяются война, участники, полномочия и наличие средств. После истечения срока нужно отклонить старое предложение перед новым."
 eon_peace_native_message:0 "Заключено согласованное соглашение о прекращении войны. Техническая метка победителя в сообщении игры не означает признание вины другой стороны."
 eon_peace_executed_title:0 "Соглашение вступило в силу"
 eon_peace_executed_desc:0 "Двусторонняя война завершена. Оккупированные регионы возвращены их владельцам; зависимости и национальные границы не менялись. Если условия включали платёж, он перечислен один раз из казны отправителя получателю. Временное соглашение устанавливает согласованный срок ненападения. Окончательный мир завершает этот конфликт, но не запрещает любые будущие войны навечно."
 eon_peace_armistice_ended_title:0 "Срок временного соглашения завершён"
 eon_peace_armistice_ended_desc:0 "Истёк согласованный срок ненападения по ранее заключённому временному соглашению. Это уведомление о первоначальном сроке: более позднее продление или другой договор имеют собственные условия. Война не возобновляется автоматически. Для нового конфликта нужны отдельные решения и основания."
 eon_peace_notice_ok:0 "Принято"
 eon_peace_choose_statusquo:0 "Мир без территориальных и денежных уступок"
 EON_OFFER_PEACE_STATUSQUO_TITLE:0 "Предложить: Мир без территориальных и денежных уступок"
 EON_OFFER_PEACE_STATUSQUO_ACTION_DESC:0 "Мир без территориальных и денежных уступок"
 eon_offer_peace_statusquo_send_desc:0 "Мир без территориальных и денежных уступок. Срок ответа — 30 дней. Согласие необходимо; война продолжается до принятия."
 eon_offer_peace_statusquo_receive_desc:0 "[ROOT.GetName] предлагает: Мир без территориальных и денежных уступок. Принятие завершит только разрешённый двусторонний конфликт. Оккупация сама не передаёт собственность."
