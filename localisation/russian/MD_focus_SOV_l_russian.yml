 #Navalny
 SOV_navalny_sweeps_streets: "Навальный захватывает улицы"
 SOV_navalny_sweeps_streets_desc: "Молодой юрист из провинции, Алексей Навальный превращает борьбу с коррупцией в политическую силу, его первые расследования потрясают страну. Он выходит на улицы уже как президент - не с метлой, а с мандатом народа."
 SOV_directed_democratization: "Направляемая демократизация"
 SOV_directed_democratization_desc: "Зная, что гнилая бюрократия убьёт любые реформы, если дать ей время, Навальный объявляет чрезвычайное положение - не для подавления свобод, а чтобы сломать старые цепи за месяцы, рискованный прыжок в новую Россию."
 SOV_mobilize_navalny_teams: "Мобилизовать штабы Навального"
 SOV_mobilize_navalny_teams_desc: "Сеть, которая когда-то отслеживала богатство элиты, теперь следит за лояльностью губернаторов. Региональные штабы, построенные добровольцами во время массовых протестов, становятся рычагами государственной власти, и сепаратисты замолкают."
 SOV_government_of_national_trust: "Правительство народного доверия"
 SOV_government_of_national_trust_desc: "Навальный собирает коалицию либералов, социал-демократов, зелёных и либертарианцев - «правительство народного доверия». Старая гвардия называет его «министерством иностранных агентов», но он называет его единственным способом исцелить Россию."
 SOV_turn_security_apparatus_against_oligarchs: "Натравить спецслужбы на олигархов"
 SOV_turn_security_apparatus_against_oligarchs_desc: "Спецслужбы, бывший щит олигархов, становятся их мечом. Навальный перенаправляет их на расследование незаконных приватизаций, отмывания денег и офшорных схем - натравливая волков на волков."
 SOV_revolution_from_both_sides: "Революция с двух сторон"
 SOV_revolution_from_both_sides_desc: "Давление улиц и давление государства создают двухфронтовую войну против старой системы. Массовые митинги и административные чистки ломают сопротивление ценой стабильности и демократических условностей."
 SOV_committee_of_seven: "Комитет семи"
 SOV_committee_of_seven_desc: "Навальный тихо создаёт тайный круг из семи верных министров и помощников, встречающихся за закрытыми дверями. Никаких протоколов, никакой прозрачности - только быстрые решения. «Демократия прекрасна, но слишком медленна для перемен», - шутит один из членов."
 SOV_state_television_reform: "Реформа государственного телевидения"
 SOV_state_television_reform_desc: "Навальный разбивает печально известный «зомбоящик», реструктурируя государственное ТВ и заменяя пропаганду плюрализмом. Впервые освещение протестов появляется в вечерних новостях, и старая гвардия называет это «сдачей эфира»."
 SOV_between_left_right: "Между левыми и правыми"
 SOV_between_left_right_desc: "Исторический выбор: один путь ведёт к либеральным реформам и западной интеграции, другой - к национальной повестке государственного суверенитета и традиционных ценностей. Навальный не может идти по обоим, и его решение определяет идентичность России на поколения."
 SOV_liberal_agenda: "Либеральная повестка"
 SOV_liberal_agenda_desc: "Навальный выбирает вестернизирующий путь: приватизация, европейская интеграция, безвизовый режим. Левый фланг возмущён, но только либеральная демократия может разорвать цикл автократии."
 SOV_national_agenda: "Национальная повестка"
 SOV_national_agenda_desc: "Навальный принимает повестку «Россия прежде всего»: государственный контроль над ключевыми отраслями, жёсткая линия на постсоветском пространстве и традиционные ценности. Либералы разочарованы, в то время как националисты рукоплещут."
 SOV_anti_corruption_bureau: "Антикоррупционное бюро"
 SOV_anti_corruption_bureau_desc: "Навальный создаёт мощное Национальное антикоррупционное бюро, наделяя его широкими полномочиями на независимые расследования, аресты активов и прямой доступ к финансовым отчётам - шаг, который заставляет олигархов дрожать при мысли о том, что им наконец предстоит ответить по справедливости."
 SOV_encourage_all_russian_secularisation: "Поощрять всероссийскую секуляризацию"
 SOV_encourage_all_russian_secularisation_desc: "Навальный подписывает декрет о светском характере государства. Православная церковь теряет привилегированный доступ к образованию и госсобственности, слово «Бог» исчезает из армейских гимнов, и духовенство приходит в ярость."
 SOV_acknowledge_lead_role_orthodox_church: "Признать ведущую роль православной церкви"
 SOV_acknowledge_lead_role_orthodox_church_desc: "В прагматичном повороте Навальный встречается с патриархом и признаёт «особую роль православия в истории России». В ответ церковь воздерживается от политического вмешательства - хрупкое перемирие."
 SOV_legalization_firearms: "Легализация огнестрельного оружия"
 SOV_legalization_firearms_desc: "Правительство легализует огнестрельное оружие для самообороны, выполняя давнее либертарианское требование. Расходы на полицию падают, но консерваторы беспокоятся о хаосе - одни радуются, другие плачут."
 SOV_forced_regional_democratisation: "Принудительная регионализация"
 SOV_forced_regional_democratisation_desc: "Москва навязывает непокорным регионам демократические реформы - прямые выборы губернаторов, независимые местные суды и контроль гражданского общества. Сепаратистские настроения угасают по мере обретения регионами реальной автономии."
 SOV_expansion_minorities_rights: "Расширение прав меньшинств"
 SOV_expansion_minorities_rights_desc: "Расширяются права меньшинств: образование на родном языке, культурная автономия и защита от дискриминации. Национальные республики ликуют, а русские националисты кипят от злости."
 SOV_supremacy_russian_language: "Преимущество русского языка"
 SOV_supremacy_russian_language_desc: "Русский язык объявляется единственным государственным. Языки меньшинств терпимы, но не поощряются - националисты празднуют, лидеры меньшинств протестуют против «культурного геноцида»."
 SOV_fight_economic_injustice: "Борьба с экономической несправедливостью"
 SOV_fight_economic_injustice_desc: "Расходы на здравоохранение и образование удваиваются, минимальная зарплата повышается, а разовый «налог на олигархов» финансирует социальные программы. Инфляция растёт, но бедные наконец чувствуют надежду."
 SOV_investigate_state_corporations: "Расследовать госкорпорации"
 SOV_investigate_state_corporations_desc: "Десятилетиями ВТБ, Роснефть, РЖД и Газпром живут по своим законам - их офшорные счета, раздутые контракты и политические откаты скрыты за стеной секретности. Но ФБК снесёт эту стену. Серия масштабных расследований вскроет правду: как миллиарды уплывают за границу, как подстраиваются тендеры и кто кладёт деньги в карман. Никто не знает, куда приведут эти проверки и кого они затронут. Олигархи и старая бюрократия замирают в холодном ужасе - потому что впервые их тайный мир готовятся взломать."
 SOV_introduce_visa_regime_central_asia: "Ввести визовый режим для Центральной Азии"
 SOV_introduce_visa_regime_central_asia_desc: "Навальный вводит визовые требования для стран Центральной Азии и Кавказа, выполняя давнее националистическое требование. Поток мигрантов замедляется, но дипломатическая напряжённость резко возрастает."
 SOV_economic_security_russia_its_people: "Экономическая безопасность России и её народа"
 SOV_economic_security_russia_its_people_desc: "Правительство запускает комплексную программу экономической безопасности: импортозамещение, поддержка отечественных производителей и защита от глобальных рыночных шоков - устойчивость, а не изоляция."
 SOV_stimulate_russian_business: "Стимулировать российский бизнес"
 SOV_stimulate_russian_business_desc: "Налоговые льготы, дерегуляция и государственные кредиты разжигают бум малого бизнеса: офисы, мастерские и стартапы появляются по всей стране, и средний класс начинает расти."
 SOV_real_leader_cis: "Настоящий лидер СНГ"
 SOV_real_leader_cis_desc: "Навальный приглашает членов СНГ на экономический саммит в Москву, предлагая свободную торговлю, совместные промышленные проекты и новый механизм разрешения споров - Россия ищет партнёрство, а не империю."
 SOV_visit_taiwan: "Визит на Тайвань"
 SOV_visit_taiwan_desc: "Навальный посещает Тайвань, вызывая гнев Пекина, но укрепляя связи с технологическим гигантом - прагматические экономические выгоды перевешивают дипломатические риски, пока что."
 SOV_russian_monopoly: "Российская монополия"
 SOV_russian_monopoly_desc: "Российские корпорации расширяются на рынки СНГ, скупая энергетические активы, телекомы и банки - экономическое присутствие Москвы растёт бесшумно."
 SOV_environment_entrepreneurship: "Среда для предпринимательства"
 SOV_environment_entrepreneurship_desc: "В Калининграде, Приморье и на Дальнем Востоке создаются зоны свободного предпринимательства: инвесторы стекаются, инфраструктура бурлит, производительность взлетает, и российское экономическое чудо набирает обороты."
 SOV_economic_expansion_baltics: "Экономическая экспансия в Прибалтику"
 SOV_economic_expansion_baltics_desc: "Прибалтийским государствам предлагаются масштабные инвестиции в порты, железные дороги и энергосистемы - предложение раскалывает балтийский фронт, одни соблазняются, другие опасаются «ползучей аннексии капиталом»."
 SOV_true_inheritor: "Истинный наследник"
 SOV_true_inheritor_desc: "Навальный объявляет себя истинным наследником как советского, так и имперского наследия - не как диктатор, а как реформатор, который завершит модернизацию, не удавшуюся ни одной из империй."

 #Navalny Events
 sov_navalny.0.t: "Господин Навальный и антикоррупционное движение"
 sov_navalny.0.d: "Одна из хронических проблем современной России, доставшаяся от позднего СССР, - разгульная коррупция. Проблема стала очевидна в 90-е, когда скандалы о коррупционных схемах с участием высокопоставленных чиновников стали нормой на фоне тотального обнищания населения. Никто даже не думал выходить на улицы из-за того, что какой-то губернатор построил себе виллу, когда людям приходилось думать, где взять еду и оплатить коммуналку на зарплату в 1 доллар. Однако в новом тысячелетии всё изменилось.\nС уходом Ельцина и началом экономического подъёма людям больше не нужно было думать о выживании, и общество начало обращать внимание на другие проблемы, включая коррупцию. Основное недовольство исходило от поколения 80-х, выросшего в эпоху перестройки и диких 90-х, для которого идея западного уровня жизни, демократии и справедливости - не пустой звук. Всё больше недовольства вызывали новости о коррупционных схемах чиновников, и всё больше людей выходило на улицы с протестами. Так родилось антикоррупционное движение.\nГлавной фигурой этого протеста стал ранее неизвестный юрист, предприниматель и активист Алексей Навальный, чьи посты в «Живом Журнале» и других соцсетях о разгуле коррупции в госкомпаниях, судах и госучреждениях начали привлекать внимание общественности. Вокруг него собрались люди разных взглядов, но с общей целью - добиться справедливости, верховенства закона, демократии и достойного уровня жизни в России.\nПротесты и митинги охватывают страну, лозунги вроде «Россия без коррупции» вошли в лексикон каждого оппозиционного политика, а сам Алексей Навальный уже заявил о готовности участвовать в региональных и федеральных выборах, а также работает над созданием сети своих организаций и штабов. И как бы ни была противоречива фигура Навального, его способность убеждать делает его почти лидером антикоррупционного движения."
 sov_navalny.0.a: "Когда-нибудь это может стать проблемой"
 sov_navalny.1.t: "Народная инаугурация"
 sov_navalny.1.d: "В беспрецедентном повороте событий Алексей Навальный принимает присягу не в золочёных залах Кремля, а с трибуны на Болотной площади. Перед ним - море сторонников, живое свидетельство движения, приведшего его к власти.\n\n«Я хочу стать президентом, - его голос разносится по площади. - Я хочу изменить жизнь в этой стране. Я хочу изменить систему управления. Я хочу, чтобы 140 миллионов человек жили нормально. Как европейская страна».\n\nТолпа ревёт в знак одобрения. При старой системе Болотная была местом протестов против фальсификаций выборов. Сегодня она становится местом, где новый лидер присягает другой России - той, которая не обманывает своих граждан.\n\nСимволизм ясен: старые правила мертвы. «Лозунг "Не врать, не воровать" - не риторическое восклицание, это суть наших реформ», - заявляет избранный президент, и его слова звучат как публичный приговор предыдущему режиму.\n\n«Борьба с коррупцией - не абстракция. Она залезает в карман каждого из нас. Поверьте: сегодня, здесь и сейчас мы начинаем эту борьбу!» Под крики «Россия будет свободной!», заполняющие площадь, старый миропорядок рушится, начинается новая, непредсказуемая эра."
 sov_navalny.1.a: "Россия будет свободной!"
 sov_navalny.2.t: "Миллионный митинг в Москве"
 sov_navalny.2.d: "Улицы Москвы превратились в море белых лент и огней смартфонов. Около миллиона человек собрались на Болотной площади и вдоль набережной, чтобы поддержать нового президента Алексея Навального. Это крупнейшая политическая демонстрация в постсоветской истории.\n\n«Я не просто стал президентом, - кричал Навальный с трибуны. - Мы выбрали новую жизнь. Сегодня страх проиграл. Надежда победила».\n\nЗападные лидеры осторожно аплодируют мирной передаче власти. Автократы от Минска до Баку наблюдают с видимой тревогой. Российское государственное телевидение, теперь под новым руководством, транслирует митинг в прямом эфире - немыслимое ещё несколько месяцев назад.\n\nКрики «Россия будет свободной!» эхом разносятся по площади. Впервые за десятилетия Кремль не является крепостью в осаде. Он стал сценой для народа."
 sov_navalny.2.a: "Неужели это в самом деле происходит?"
 sov_navalny.3.t: "Чрезвычайное положение для защиты демократии"
 sov_navalny.3.d: "Президент Навальный объявляет чрезвычайное положение - не для подавления свобод, а чтобы «ускорить снос старой системы». Приостанавливаются полномочия региональных глав, создаются антикоррупционные суды, временно запрещаются «антидемократические партии». «Я бешено ненавижу тех, кто продал наш исторический шанс, - заявляет Навальный. - Партия жуликов и воров должна быть демонтирована сейчас». Критики называют это захватом власти. Сторонники видят единственный способ сломать бюрократию. Россия затаила дыхание."
 sov_navalny.3.a: "Рискованный, но необходимый шаг"
 sov_navalny.4.t: "Региональные штабы в действии"
 sov_navalny.4.d: "Региональные штабы Навального - когда-то центры протеста - теперь становятся рычагами федерального давления. Губернаторы получают «предложения» от Кремля: сотрудничать или столкнуться с антикоррупционными проверками, уличными акциями и потерей финансирования. Один за другим регионы выстраиваются в линию, шёпот сепаратизма затихает, а центр сжимает хватку. В коридорах Кремля шепчутся: «Штабы теперь - глаза и уши новой власти»."
 sov_navalny.4.a: "Народные штабы работают"
 sov_navalny.5.t: "Коалиционное правительство формируется"
 sov_navalny.5.d: "«Правительство народного доверия» президента Навального теперь укомплектовано. В новый кабинет вошли Илья Яшин, Леонид Волков, Дмитрий Гудков, экономист Владимир Милов, либертарианец Михаил Светов и экоактивистка Евгения Чирикова. «Мы строим коалицию всех, кто готов работать для новой России - не ради должностей, а ради результата», - заявляет пресс-служба президента. Старые элиты называют это «министерством иностранных агентов». Граждане с осторожностью приветствуют обновление. Западные столицы аплодируют повороту к широкой парламентской демократии. Россия вступает в неизведанные воды."
 sov_navalny.5.a: "Коалиция надежды - но устоит ли она?"
 sov_navalny.6.t: "Комитет семи"
 sov_navalny.6.d: "Президент Навальный тихо создаёт тайный внутренний круг из семи доверенных лиц из правительства и администрации президента. Никаких протоколов, никакой публичной отчётности - только быстрые решения за закрытыми дверями. «Демократия прекрасна, - шутит один из членов, - но для перемен она слишком медленна». Сторонники называют это эффективным управлением. Критики шепчутся о «теневой хунте»."
 sov_navalny.6.a: "Что строит Навальный?"
 sov_navalny.7.t: "Реформа государственного телевидения"
 sov_navalny.7.d: "Президент Навальный подписывает указ о реструктуризации государственного телевидения. Печально известный «зомбоящик», как он его когда-то называл, преобразуется. Назначено новое руководство, снят запрет на освещение протестов, оппозиция наконец получает эфирное время. «Мы научились доносить информацию до миллионов людей без его помощи», - вспоминает Навальный свои старые слова. Теперь государственное ТВ вынуждено войти в XXI век. Старая гвардия называет это «сдачей эфира». Граждане смотрят в неверии: впервые их протесты появляются в вечерних новостях."
 sov_navalny.7.a: "«Зомбоящик» меняет мелодию"
 sov_navalny.8.t: "Перепутье президента"
 sov_navalny.8.d: "Коалиционное правительство балансирует на грани пропасти. С одной стороны, Яшин и Волков требуют либерального прорыва - приватизации, безвизового режима, полной евроинтеграции. «Мы пришли ломать систему, а не управлять ею», - настаивают они. С другой стороны, некоторые министры продвигают национальную повестку: госконтроль над ключевыми отраслями, жёсткую линию на постсоветском пространстве, традиционные ценности. «Россия прежде всего», - шепчут они.\n\nНавальный идёт по канату. Каждый шаг в сторону либералов отталкивает националистов - и наоборот. Опросы показывают, что страна расколота почти пополам. Советники предупреждают: слишком сильный крен в любую сторону может разорвать правительство. Но и бездействие - тоже выбор, который ведёт к параличу. Теперь ему придётся балансировать, чтобы удержать власть."
 sov_navalny.8.a: "Склониться к либералам"
 sov_navalny.8.b: "Склониться к националистам"
 sov_navalny.9.t: "Секулярный декрет"
 sov_navalny.9.d: "Президент Навальный подписывает декрет: «О светском характере государства». Русская православная церковь теряет привилегированный доступ к государственной собственности и образованию. Слово «Бог» исчезает из армейских гимнов. Исламские судьи и религиозные школы сталкиваются с новыми ограничениями. «Совсем с ума сошли», - сетует московский священник. На Северном Кавказе имамы называют это «войной против нашей веры». В Чечне вспыхивают протесты. Навальный защищается: «Когда я выступал против новых мечетей для мигрантов, меня называли исламофобом. Теперь меня обвиняют в борьбе с религией? Мы просто возвращаем Конституцию». Европейские «зелёные» приветствуют этот шаг. Но в горах шёпот сепаратистов становится громче."
 sov_navalny.9.a: "Вперёд к светскому государству"
 sov_navalny.10.t: "Благословение патриарха"
 sov_navalny.10.d: "Президент Навальный встречается с патриархом Кириллом в Кремле. Тот, кто когда-то боролся с «коррумпированным альянсом» церкви и государства, теперь ищет его благословения. Часы напряжённых переговоров приводят к хрупкому компромиссу: Навальный публично «признаёт особую роль православия в истории России», а Кирилл воздерживается от прямого политического вмешательства и даёт благословение на реформы президента.\n\n«Мы не враги, - говорит Навальный после встречи. - Моя цель - современная, европейская Россия. Но притворяться, что мы можем игнорировать 1000 лет истории, было бы наивно». Этот шаг прагматичен: ему нужна политическая легитимность для реформ. Тем не менее, критики называют это предательством, в то время как националисты и консерваторы видят в этом знак того, что новый президент - «один из нас»."
 sov_navalny.10.a: "Прагматичное благословение"
 sov_navalny.11.t: "Россия вводит визовый режим"
 sov_navalny.11.d: "Президент России Навальный подписал указ о введении визового режима с нашей страной, ссылаясь на свою старую позицию: «Я не вижу ничего ценного в людях, приезжающих из Центральной Азии и с Кавказа в Россию. Это ключевое политическое требование. Нам нужен порядок». Эта новость подобно грому среди ясного неба: посол немедленно отозван для экстренных консультаций, а нашим гражданам в России грозит реальная депортация в течение шести месяцев. Лидеры диаспор осуждают этот шаг как откровенную дискриминацию, и даже российские губернаторы предупреждают об экономических сбоях. Одни аналитики называют это решение экономическим самоубийством для самой России, другие видят в нём дешёвый популистский жест для повышения националистического рейтинга Навального. Как бы то ни было, наши отношения никогда не были хуже."
 sov_navalny.11.a: "Мы ответим соответствующим образом"
 sov_navalny.12.t: "Навальный приглашает страны СНГ на экономический саммит"
 sov_navalny.12.d: "Спустя некоторое время после визового декрета, шокировавшего постсоветское пространство, Кремль рассылает новые приглашения. Президент Навальный приглашает членов СНГ в Москву на экономический саммит. «Давайте будем честны, - говорится в приглашении. - Россия не может быть великой, унижая других. Мы предлагаем сотрудничество, выгодное всем - не дешёвый газ в обмен на политическую лояльность».\n\nВ повестке - зона свободной торговли, отмена запретов на импорт из «недружественных» стран и совместные промышленные проекты. «Наша цель - не держать кого-то взаперти, - пишет Навальный, - а создать пространство, где все мы сможем стать сильнее - вместе или по отдельности. Выбор за вами».\n\nНаблюдатели отмечают иронию: тот, кто требовал визовых барьеров с Центральной Азией и Кавказом, теперь предлагает партнёрство. Некоторые члены СНГ в замешательстве. Другие испытывают соблазн. Предложение щедрое - но можно ли верить Навальному?"
 sov_navalny.12.a: "Принять приглашение - но с осторожностью"
 sov_navalny.12.b: "Мы ему не верим"
 sov_navalny.13.t: "[FROM.GetName] присоединяется к Московскому экономическому саммиту"
 sov_navalny.13.d: "[FROM.GetName] принял приглашение президента Навального на экономический саммит в Москве. Несмотря на недавнюю визовую напряжённость, руководство этой страны СНГ решило дать новому Кремлю шанс. «Мы не пленники прошлого, - прокомментировал представитель [FROM.GetName]. - Если Россия предлагает реальное сотрудничество без имперских замашек, мы готовы договариваться».\n\nСаммит продолжится с расширенной повесткой: совместные промышленные зоны, переговоры о свободной торговле, новый механизм разрешения споров. Для [FROM.GetName] это решение связано с риском: консервативные элиты внутри страны обвиняют правительство в угодничестве перед «либеральным Кремлём», но обещанные экономические выгоды трудно игнорировать. Ожидается рост товарооборота, инвесторы внимательно следят. Новая глава в постсоветских отношениях может открываться - осторожно, но необратимо."
 sov_navalny.13.a: "Прагматичный партнёр присоединяется к столу"
 sov_navalny.14.t: "[FROM.GetName] отклоняет приглашение на саммит"
 sov_navalny.14.d: "[FROM.GetName] отклонил приглашение президента Навального на Московский экономический саммит. Ссылаясь на «непредсказуемую политику» и недавний визовый декрет, руководство этой страны СНГ предпочло остаться в стороне. «Нельзя строить партнёрство со страной, которая относится к нашим гражданам как к угрозе», - говорится в официальном заявлении.\n\nНаблюдатели видят в этом победу консервативных сил внутри [FROM.GetName], не доверяющих либеральной повестке Навального. Торговые барьеры сохранятся, старые модели недоверия продолжаются. Кремль выражает сожаление, но отмечает, что «дверь остаётся открытой для тех, кто готов к равноправному диалогу». Пока что постсоветское пространство остаётся разделённым - между готовыми рискнуть переменами и теми, кто цепляется за прошлое."
 sov_navalny.14.a: "Их потеря"
 sov_navalny.15.t: "Балтийский инвестиционный форум России"
 sov_navalny.15.d: "В Санкт-Петербурге проходит Балтийский инвестиционный форум, где президент Навальный представляет «очень щедрое» предложение нашей стране. «Эпоха шантажа и газового давления закончена, - заявляет он. - Мы предлагаем крупные совместные инвестиции в порты, логистику и энергетику. Россия готова финансировать до 70% этих инициатив, открывая свой рынок для балтийского экспорта».\n\nПредложение заманчиво, но вызывает споры. Одни приветствуют экономический подъём, другие называют это «ползучей аннексией капиталом». Кремль надеется, что миллиарды инвестиций расколют балтийский фронт. Наше решение определит отношения с Россией на годы вперёд."
 sov_navalny.15.a: "Прагматизм вместо подозрений"
 sov_navalny.15.b: "Мы не доверяем России Навального"
 sov_navalny.16.t: "[FROM.GetName] принимает наше инвестиционное предложение"
 sov_navalny.16.d: "[FROM.GetName] согласился участвовать в крупных совместных инфраструктурных проектах, финансируемых Россией. Порта будут модернизированы, логистические цепочки интегрированы, а российские рынки открыты для их экспорта. Старые подозрения остаются, но экономический прагматизм победил - по крайней мере, пока. Кремль приветствует этот шаг на пути к «новой экономической архитектуре» в Балтийском регионе. Критики предупреждают о растущей зависимости, но сделка подписана."
 sov_navalny.16.a: "Трещина в балтийском фронте"
 sov_navalny.17.t: "[FROM.GetName] отклоняет наше инвестиционное предложение"
 sov_navalny.17.d: "[FROM.GetName] отверг инвестиционное предложение, ссылаясь на недавний визовый декрет и «непредсказуемую политику Кремля». «Нельзя строить экономическое партнёрство со страной, которая относится к нашим гражданам как к угрозе», - говорится в официальном заявлении. Решение - победа консервативных сил в Прибалтике, не доверяющих либеральной повестке Навального. Кремль выражает сожаление, но отмечает, что «дверь остаётся открытой для тех, кто готов к равноправному диалогу». Пока что балтийский фронт держится."
 sov_navalny.17.a: "Мы попробуем в другом месте"
 sov_navalny.18.t: "Балтика в центре внимания"
 sov_navalny.18.d: "В исторических залах Санкт-Петербурга проходит Балтийский инвестиционный форум - рискованная попытка президента Навального растопить постсоветский лёд с прибалтийскими государствами. В форуме участвуют делегации нескольких балтийских стран, а также наблюдатели от ЕС и нервные кремлёвские чиновники. Повестка обширна: совместная модернизация портов, обновление железных дорог, трансграничные энергосети и доступ балтийских продуктов и электроники на российский рынок.\n\nВступительная речь Навального подчёркнуто прагматична: «Мы не можем стереть географию. Балтийское море всегда будет нас соединять. Вопрос в том, используем ли мы его как барьер или как мост». Он обещает законодательные гарантии против политического давления и быстрый арбитраж для споров.\n\nРеакция резко разделилась: одни видят экономическое возрождение региона, долгое время зависевшего от капризного западного капитала, другие предупреждают о «ползучей аннексии по чеку», а дипломаты ЕС, прячущиеся в коридорах, пытаются понять, подлинная это разрядка или троянский конь. Никто не знает, чем это кончится, но мир наблюдает, как Россия предлагает инвестировать миллиарды туда, где раньше использовала газопроводы как оружие, оставляя балтийские элиты в соблазне, а Брюссель в тревоге за будущее Восточной Балтики."
 sov_navalny.18.a: "Рискованная игра"
 sov_navalny.19.t: "Начинается расследование по ВТБ"
 sov_navalny.19.d: "Фонд борьбы с коррупцией публикует первое громкое расследование под прямым руководством президента Навального. Цель - ВТБ, один из крупнейших государственных банков России. Доклад под названием «ВТБ: Офшорная империя» утверждает, что топ-менеджеры перевели миллиарды рублей через компании-пустышки на Кипре и Британских Виргинских островах, используя фиктивные консалтинговые контракты и завышенные закупки IT. В доказательство - выписки со счетов, журналы полётов и записи компрометирующих разговоров.\n\n«Деньги, которые должны были пойти на школы и дороги, оседали на швейцарских счетах и лондонской недвижимости», - заявляет Навальный на пресс-конференции. «Мы не просто называем имена. Мы пойдём за каждым рублём».\n\nПресс-служба ВТБ называет обвинения «политически мотивированной клеветой». Но уже через несколько часов Генпрокуратура открывает официальную проверку. Акции банка обваливаются на Московской бирже. Старые элиты замирают в ужасе - ВТБ лишь первый в списке. За кулисами следователи уже изучают документы Роснефти, Газпрома и РЖД.\n\n«Они думали, что они неприкасаемы, - шепчет инсайдер из ФБК. - Теперь они узнают, что никто не стоит выше закона»."
 sov_navalny.19.a: "Охота начинается."
 sov_navalny.20.t: "РЖД под откосом"
 sov_navalny.20.d: "Фонд борьбы с коррупцией направляет свой прожектор на РЖД - государственную монополию, управляющую всей железнодорожной сетью страны. Расследование под названием «Рельсы коррупции» вскрывает паутину раздутых строительных контрактов, откатов от поставщиков подвижного состава и офшорных счетов, привязанных к топ-менеджерам. Миллиарды рублей, выделенные на модернизацию Транссиба и обновление пригородных поездов, якобы оседали в частных карманах.\n\n«Пока пассажиры мёрзли на разбитых платформах, начальники покупали яхты и квартиры в Монако», - заявляет Навальный на брифинге. «Мы не остановимся, пока каждый коррумпированный чиновник не окажется за решёткой».\n\nКремль даёт зелёный свет на возбуждение уголовных дел против нескольких топ-менеджеров. Акции компаний, связанных с РЖД, падают. Старые элиты теперь точно знают: ни один государственный гигант не в безопасности. А следователи уже точат ножи на следующие цели - нефтегазовых гигантов, Роснефть и Газпром."
 sov_navalny.20.a: "Следующая остановка: нефтяные гиганты."
 sov_navalny.21.t: "Роснефть: дойная корова Кремля"
 sov_navalny.21.d: "Фонд борьбы с коррупцией публикует самое скандальное расследование на сегодняшний день: «Роснефть - дойная корова Кремля». В докладе подробно описывается, как миллиарды нефтяных доходов уходили через непрозрачных торговых посредников, раздувая издержки и обогащая узкий круг приближённых. Утекшие контракты показывают, что Роснефть переплачивала за зарубежные приобретения и строительство трубопроводов на сотни миллионов долларов, а откаты возвращались к высшим менеджерам и их политическим покровителям.\n\n«Они относились к нашим природным ресурсам как к своему личному банкомату», - заявляет Навальный, представляя доказательства в прямом эфире. «Пока простые россияне платили на заправках, эти люди наполняли свои офшорные счета».\n\nПравительство распоряжается арестовать активы, замешанные в схемах. Совет директоров Роснефти в шоке. Но на этом расследование не останавливается - следующий Газпром. Старые элиты больше не смотрят в ужасе - они начинают паниковать."
 sov_navalny.21.a: "Идем дальше"
 sov_navalny.22.t: "Газпром: труба, у которой нет конца"
 sov_navalny.22.d: "Спустя многие месяцы усердной работы Фонд борьбы с коррупцией публикует финальное расследование в серии: «Газпром - труба, у которой нет конца». Доклад вскрывает, как крупнейшая газовая компания Европы превратилась в личную казну старой элиты. Офшорные схемы, раздутые стоимости строительства трубопроводов вроде «Северного потока» и «Силы Сибири», секретные платежи посредникам - всё выложено на свет.\n\n«Они продавали наш газ, наше будущее и нашу безопасность», - заявляет Навальный в телеобращении. «Газпром не был энергетической компанией. Это было преступное предприятие под видом госкорпорации».\n\nВ доказательствах - банковские переводы, показания свидетелей и внутренние меморандумы, свидетельствующие о систематическом разграблении. Правительство отдаёт приказ арестовать нескольких членов совета директоров. Акции Газпрома рушатся. Старые элиты, когда-то считавшие себя неприкасаемыми, теперь сталкиваются с реальной перспективой тюрьмы.\n\nЭтим расследованием антикоррупционный крестовый поход достигает своей вершины. Ни один государственный гигант не остался неисследованным. Посыл ясен: эпоха безнаказанности закончена."
 sov_navalny.22.a: "Финальный удар"

 #Navalny Ideas
 SOV_forced_democratisation_idea: "Форсированная демократизация"
 SOV_forced_democratisation_idea_desc: "Новый президент объявил чрезвычайное положение, чтобы ускорить снос старой системы. Полномочия региональных глав приостановлены, созданы антикоррупционные суды, запрещены антидемократические партии. Критики называют это захватом власти. Сторонники видят единственный способ сломать бюрократию, пока она не задушила все шансы на реформы."
 SOV_administrative_onslaught_idea: "Административный штурм"
 SOV_committee_seven_idea: "Комитет семи"
 SOV_committee_seven_idea_desc: "За древними стенами Кремля работает новый центр власти без протоколов и стенограмм, где семеро доверенных лиц встречаются тайно, с хирургической точностью рассекая бюрократические узлы, оставляя старых чиновников кипеть от злости, пока молодые реформаторы ликуют - демократия отходит на второй план, но двигатель управления работает быстрее, чем когда-либо."
 SOV_combating_illegal_migration_idea: "Борьба с нелегальной миграцией"
 SOV_cis_summit_agreement_idea: "Путь к новому партнёрству"
 SOV_baltic_invest_idea: "Россия инвестирует в нас"
 SOV_free_enterprise_zone_modifier: "Зона свободного предпринимательства"

 SOV_navalny_true: "§YНавальный§! начал политическую деятельность (2007)"
 SOV_russian_monopoly_tt: "Дополнительно §Y0.5%§! [SOV.GetFlag] влияния в каждой §YСНГ§! стране за каждый [SOV.GetFlag]§0Филиал§!"

 #Union of Right Forces (SPS)
 SOV_rise_right_forces: "Расцвет правых сил"
 SOV_rise_right_forces_desc: "«Союз правых сил» был создан из избирательного блока либеральных движений перед выборами в Думу 1999 года, объединив Егора Гайдара, Анатолия Чубайса и молодого нижегородского губернатора Бориса Немцова. Родившийся в 1959 году, физик, ставший политиком, стал восходящей звездой партии. Теперь, когда Немцов в Кремле, мы наконец завершим реформы 1990-х, сломаем коррумпированные госкорпорации и построим свободную, европейскую Россию."
 SOV_shake_presidential_administration: "Встряхнуть администрацию президента"
 SOV_shake_presidential_administration_desc: "Мы уволим десятки коррумпированных губернаторов и глав федеральных ведомств, заменив их молодыми юристами, правозащитниками и рыночными экономистами. Это хирургическое удаление старой бюрократии откроет путь к подлинным реформам."
 SOV_interregional_support_group: "Межрегиональная группа поддержки"
 SOV_interregional_support_group_desc: "Чтобы противостоять москвоцентричной политике, Немцов создаст Межрегиональную группу поддержки - сеть лояльных губернаторов из Пскова, Самары, Санкт-Петербурга и других регионов. Они получат бюджетную автономию и свободу в местной политике в обмен на публичную поддержку федеральных реформ."
 SOV_relations_yeltsin_family: "Отношения с семьёй Ельцина"
 SOV_relations_yeltsin_family_desc: "Семья Ельцина по-прежнему контролирует ключевые медиаактивы, поэтому Немцов заключит прагматичный пакт: они останутся вне политики и позволят проводить антикоррупционные расследования, а государство гарантирует сохранность их законных активов. Это необходимая жертва ради стабильности."
 SOV_oligarchs_political_resource: "Политический ресурс олигархов"
 SOV_oligarchs_political_resource_desc: "Мы не можем уничтожить олигархов за одну ночь, не спровоцировав бегство капитала, поэтому вместо этого мы кооптируем их политические ресурсы. Они будут финансировать наши кампании, а мы не станем пересматривать приватизацию 1990-х - фаустовская сделка ради краткосрочной стабильности."
 SOV_temporary_union_fatherland: "Временный союз с Отечеством"
 SOV_temporary_union_fatherland_desc: "Немцов сформирует временный избирательный альянс с движением «Отечество - Вся Россия» Примакова и Лужкова. Мы выдвинем совместных кандидатов на губернаторские посты в обмен на центристскую поддержку в Госдуме, ставя прагматизм выше идеологии."
 SOV_ensure_support_internal_intelligence: "Обеспечить поддержку внутренней разведки"
 SOV_ensure_support_internal_intelligence_desc: "ФСБ и ГРУ - государства в государстве, поэтому Немцов предложит им сделку: иммунитет от преследования за прошлое политическое вмешательство и увеличенные бюджеты в обмен на их лояльность и сотрудничество в борьбе с реальной преступностью. Это временно укротит волков."
 SOV_mobilize_bureaucracy: "Мобилизовать бюрократию"
 SOV_mobilize_bureaucracy_desc: "Федеральная бюрократия может либо саботировать реформы, либо проводить их в жизнь, поэтому Немцов запустит мобилизационную кампанию с показателями эффективности, цифровым документооборотом и премиями для госслужащих, выполняющих планы. Мы сократим бюрократическую волокиту и заставим государственную машину снова двигаться."
 SOV_course_yeltsinism: "Курс на ельцинизм"
 SOV_course_yeltsinism_desc: "Президент Немцов переименует свою программу в «ельцинизм с человеческим лицом» - возвращение к идеалам 1990-х: свобода, частная инициатива и западная интеграция, но без шоковой терапии и олигархического грабежа. Это будет либеральный курс для нового поколения."
 SOV_council_entrepreneurs: "Совет предпринимателей"
 SOV_council_entrepreneurs_desc: "Вместо борьбы с олигархами мы пригласим их в формальный консультативный совет. Они будут высказывать опасения и формировать экономическую политику, а мы обеспечим их политический нейтралитет и инвестиционные обязательства. Приятельский капитализм будет регулироваться, а не устраняться."
 SOV_committee_constitutional_order: "Комитет конституционного порядка"
 SOV_committee_constitutional_order_desc: "Чрезвычайный комитет юристов и силовиков разработает меры по стабилизации конституционного порядка: упрощённые полицейские полномочия, временное приостановление гражданских свобод в кризисных зонах и ускоренную депортацию иностранных преступников. Порядок будет предшествовать демократии, когда это необходимо."
 SOV_power_vertical: "Силовая вертикаль"
 SOV_power_vertical_desc: "Немцов сохранит структуру «вертикали власти», но сменит людей: лояльные реформаторы заменят силовиков на постах региональных кураторов, сделав эффективность новой целью вместо угнетения. Вертикаль будет служить реформам, а не личной лояльности."
 SOV_kingdoms_for_loyalty: "Царства в обмен на лояльность"
 SOV_kingdoms_for_loyalty_desc: "В обмен на публичную лояльность и проведение федеральной политики губернаторы получат почти полную автономию в местных бюджетах, назначениях в правоохранительных органах и культурной политике. Сепаратистские настроения упадут, но упадет и демократическая подотчётность - феодальный торг за современное государство."
 SOV_presidential_majority_coalition: "Президентская коалиция большинства"
 SOV_presidential_majority_coalition_desc: "Чтобы провести реформы, Немцов сформирует в Думе широкую «президентскую коалицию большинства», объединяющую консервативных националистов, центристских промышленников и либеральных реформаторов. Платой станут бесконечные компромиссы: социальные расходы для левых, налоговые льготы для правых."
 SOV_governors_representation: "Представительство губернаторов"
 SOV_governors_representation_desc: "Мы реформируем Совет Федерации в палату, где на постоянной основе будут заседать представители губернаторов, что даст регионам реальную долю в федеральном законотворчестве. Это принесёт стабильность через кооптацию, а не принуждение, и голос регионов наконец будет услышан."
 SOV_flow_western_capital: "Поток западного капитала"
 SOV_flow_western_capital_desc: "После лет оттока капитала Немцов предложит западным инвесторам налоговые каникулы, юридические гарантии от экспроприации и быстрый арбитраж. Деньги вернутся, заводы откроются, рубль стабилизируется. Прагматизм победит геополитическую гордость."
 SOV_yeltsin_heroization: "Героизация Ельцина"
 SOV_yeltsin_heroization_desc: "Президент Немцов запустит государственную программу прославления Бориса Ельцина как отца современной российской демократии. Улицы будут переименованы, памятники воздвигнуты, стипендии учреждены, чтобы создать «полезное прошлое», легитимирующее либеральные реформы и маргинализирующее как коммунистическую ностальгию, так и авторитаризм."
 SOV_atone_guilt_before_people: "Искупить вину перед народом"
 SOV_atone_guilt_before_people_desc: "Государство признает свои преступления: провальную приватизацию, войну в Чечне, подавление СМИ и обнищание миллионов. Мы профинансируем единовременный компенсационный фонд за счёт налога на олигархические активы. Деньги не залечивают раны, но они признают долг."
 SOV_federal_regional_balance: "Федерально-региональный баланс"
 SOV_federal_regional_balance_desc: "Конституционная комиссия перераспределит полномочия между Москвой и регионами. Субъекты получат контроль над налогами на природные ресурсы и местной инфраструктурой, а центр сохранит оборону, внешнюю политику и антикоррупционное преследование. Мы создадим настоящую федерацию, а не унитарную империю."
 SOV_liberal_electoral_machine: "Либеральная электоральная машина"
 SOV_liberal_electoral_machine_desc: "Административный ресурс государства превратится в «либеральную электоральную машину»: губернаторы обеспечат победу пропрезидентских кандидатов в региональных законодательных собраниях, повысив национальный барьер до 8%, чтобы не пускать экстремистов. Это будет управляемая демократия ради стабильных результатов."
 SOV_there_is_no_other_way: "Другого пути нет"
 SOV_there_is_no_other_way_desc: "После лет компромиссов и консолидации Немцов заключит: «У нас не было выбора. Альтернативой был хаос и развал». То, что он построил, не идеально, но это работает. Россия станет прагматичной, стабильной и циничной управляемой демократией - потёмкинской республикой, которая даёт рост и тишину."
 SOV_general_strategic_plan_reforms: "Общий стратегический план реформ"
 SOV_general_strategic_plan_reforms_desc: "Вдохновлённый критикой патримониальной бюрократии Макса Вебера, президент запустит «Общий стратегический план реформ», чтобы заменить личную лояльность формальными правилами, деполитизировать гражданскую службу и создать независимую судебную систему. Это будет рациональное управление, а не копирование Запада."
 SOV_committee_state_reform: "Комитет государственной реформы"
 SOV_committee_state_reform_desc: "Специальный комитет государственной реформы из учёных-правоведов, экономистов и бывших судей разработает пакет административных реформ. Мы ликвидируем дублирующие агентства, цифровизируем госуслуги и создадим новый кодекс госслужбы, основанный на заслугах, а не на связях."
 SOV_duma_democratic_alliance: "Думский демократический альянс"
 SOV_duma_democratic_alliance_desc: "Все демократические партии в Думе - либералы, социал-демократы, зелёные, либертарианцы - сформируют коалицию в поддержку реформаторской повестки. Они расходятся по многим вопросам, но согласны в одном: старая авторитарная система должна быть демонтирована. Это будет единство против прошлого."
 SOV_support_regional_reformers: "Поддержать региональных реформаторов"
 SOV_support_regional_reformers_desc: "Молодые прозападные экономисты и юристы будут назначены исполняющими обязанности губернаторов в нескольких регионах, заменив старых советских начальников. Они сократят местную бюрократию, привлекут инвестиции и будут уважать права этнических меньшинств. Сепаратистские настроения угаснут, а рост ускорится."
 SOV_rational_administrative_reform: "Рациональная административная реформа"
 SOV_rational_administrative_reform_desc: "Правительство примет «рациональную» административную систему: каждое министерство получит измеримые KPI, дублирующиеся функции будут слиты, а федеральное аудиторское агентство будет контролировать результаты без политического вмешательства. Государство станет предсказуемой машиной."
 SOV_people_against_tsars: "Народ против царей"
 SOV_people_against_tsars_desc: "В Казани, Махачкале и Нальчике простые люди больше не могут терпеть местные элиты, которые десятилетиями высасывали соки из регионов, распихивая бюджеты по карманам и подавляя любое инакомыслие. Когда их терпение наконец лопнет и вспыхнут протесты, Немцов отправит федеральных инспекторов и пообещает убрать этих укоренившихся диктаторов. Народный гнев наконец сломает хватку коррумпированных местных «царей» и восстановит некоторую справедливость."
 SOV_negotiate_with_oligarchs: "Договориться с олигархами"
 SOV_negotiate_with_oligarchs_desc: "Серия секретных переговоров приведёт к «большой сделке»: олигархи вернут государству 30% своих активов в обмен на иммунитет от преследования за прошлые приватизационные преступления. Государство вернёт контроль над стратегическими секторами, а олигархи сохранят остальное - грязная, но реалистичная сделка."
 SOV_conscious_civil_society: "Сознательное гражданское общество"
 SOV_conscious_civil_society_desc: "Мы перенаправим государственное финансирование независимым НПО, правозащитным группам и экологическим наблюдателям. Новый «Совет гражданского общества» даст активистам прямой доступ к законодателям. Надежда состоит в том, чтобы превратить спонтанный протест в институциональный диалог - сознательное, а не реактивное общество."
 SOV_liberalization_regional_life: "Либерализация региональной жизни"
 SOV_liberalization_regional_life_desc: "Региональные власти получат разрешение на эксперименты: более низкие местные налоги, ускоренные разрешения для малого бизнеса и публично избираемые мэры. Лучшие практики затем будут масштабироваться по всей стране. Это либерализация снизу, а не по указу Москвы - лаборатория реформ."
 SOV_necessary_intervention: "Необходимое вмешательство"
 SOV_necessary_intervention_desc: "Когда госкорпорация рухнет под бременем долгов и коррупции, правительство вмешается: уволит совет директоров, назначит специального администратора и разобьёт компанию на конкурентные единицы. Приватизация - не идеология, а инструмент, когда менеджмент проваливается."
 SOV_direct_elections_senators: "Прямые выборы сенаторов"
 SOV_direct_elections_senators_desc: "Мы преобразуем Совет Федерации: сенаторы будут избираться прямым голосованием в каждом регионе на шестилетний срок. Верхняя палата больше не будет клубом назначенных лоялистов, а станет подлинным контролем над президентской властью. Демократия станет реальной, а не просто символической."
 SOV_market_free_nomenklatura_capitalism: "Рынок, свободный от номенклатурного капитализма"
 SOV_market_free_nomenklatura_capitalism_desc: "Мы разобьём государственных гигантов и продадим их через публичные IPO, распределив акции среди граждан по ваучерам. Единовременный «лимит на консолидацию олигархических активов» не позволит ни одному акционеру владеть более чем 10% крупных предприятий. Это будет капитализм без номенклатуры."
 SOV_path_russian_democracy: "Путь к российской демократии"
 SOV_path_russian_democracy_desc: "Немцов обратится к нации: «Это не скопированная западная демократия. Это российская демократия - беспорядочная, шумная и живая». Мы построим конкурентные выборы, свободные СМИ, избираемый сенат и независимую судебную систему. Путь неопределён, но он ведёт к свободе."
 SOV_yeltsin_system_failure: "Провал системы Ельцина"
 SOV_yeltsin_system_failure_desc: "1990-е были не триумфом Ельцина, а его провалом: хаос, преступность и возвышение олигархов. Немцов разорвёт с наследием Ельцина, объявив старую систему «дикого капитализма» мёртвой. Новое сильное государство поднимется из руин - с порядком, а не анархией."
 SOV_fulfill_siloviki_dreams: "Воплотить Мечты Силовиков"
 SOV_fulfill_siloviki_dreams_desc: "Спецслужбы давно мечтали о государстве, где они всё контролируют. Немцов даст им увеличенные бюджеты, расширенные полномочия слежки и политическое влияние - но только против реальных преступников, не против оппозиции. Силовики будут спущены с цепи, но на коротком поводке."
 SOV_round_table_oligarchs: "Круглый стол с олигархами"
 SOV_round_table_oligarchs_desc: "Немцов пригласит ведущих олигархов за «круглый стол» и заключит сделку: они прекратят вмешиваться в политику и будут платить более высокие налоги; взамен государство прекратит расследования их прошлых дел и гарантирует права собственности. Это циничное перемирие стабилизирует экономику."
 SOV_pressure_red_belt: "Надавить на красный пояс"
 SOV_pressure_red_belt_desc: "Губернаторы «красного пояса» - коммунистических оплотов в индустриальном сердце - будут вынуждены покинуть Коммунистическую партию под угрозой проверок, расследований и потери федерального финансирования. Несколько перебегут, присоединившись к пропрезидентской коалиции. Красная угроза лишится зубов."
 SOV_faith_in_commander_in_chief: "Вера в верховного главнокомандующего"
 SOV_faith_in_commander_in_chief_desc: "Массированная пропагандистская кампания будет представлять Немцова сильным, решительным лидером - «верховным главнокомандующим», который восстановит порядок и национальную гордость. Военные будут прославлены, патриотические символы возвращены, а критики заклеймены «врагами государства». Это авторитарный популизм."
 SOV_blinded_by_politicking: "Ослеплённые политиканством"
 SOV_blinded_by_politicking_desc: "Немцов мастерски ведёт политическую игру, отвлекая элиты бесконечными интригами и медийным шумом. Пока они сражаются с тенями, он тихо уходит из публичного пространства, сосредотачиваясь на укреплении партии изнутри: создании региональных отделений, подготовке кадров и подготовке к следующему электоральному циклу. Оппозиция празднует мнимую победу, но Немцов уже перешёл к более тихой, методичной фазе консолидации."
 SOV_appease_national_elites: "Успокоить национальные элиты"
 SOV_appease_national_elites_desc: "На Кавказе и в Татарстане Кремль предложит местным элитам сделку: полная культурная автономия, контроль над местными ресурсами и иммунитет от федерального преследования в обмен на лояльность и подавление сепаратизма. Это купит стабильность ценой морального компромисса."
 SOV_self_coup: "Само-переворот"
 SOV_self_coup_desc: "Ссылаясь на «растущий кризис власти», Немцов развернёт армейские части в Москве, распустит Думу и возьмёт на себя чрезвычайные полномочия. Само-переворот будет бескровным, но конституция будет разорвана. Он будет утверждать, что только твёрдая рука может спасти Россию от хаоса. Эпоха «что если» заканчивается."
 SOV_concept_decembrist_dictatorship: "Концепция декабристской диктатуры"
 SOV_concept_decembrist_dictatorship_desc: "Немцов открото выступит за «декабристскую диктатуру» - временную, просвещённую диктатуру для очистки государства от коррупции с последующим восстановлением демократии. Термин провокационен, но метод знаком: правление указами, приостановление выборов, централизация власти."
 SOV_reorganization_executive_power: "Реорганизация исполнительной власти"
 SOV_reorganization_executive_power_desc: "Правительство будет реорганизовано: несколько министерств сольются в супер-министерства, а региональные префекты будут назначаться президентом, а не избираться. Цель - эффективность, но результат - дальнейшая концентрация власти в Кремле. Исполнительная ветвь станет копьём."
 SOV_military_federal_districts: "Военно-федеральные округа"
 SOV_military_federal_districts_desc: "Семь федеральных округов будут заменены военно-федеральными, каждый во главе с генералом, подчиняющимся напрямую президенту. Гражданские губернаторы потеряют власть над местными войсками. Государство станет гарнизоном, где верховный главнокомандующий держит каждый ключ."
 SOV_state_of_emergency: "Состояние Черезвычайного Положения"
 SOV_state_of_emergency_desc: "Чрезвычайное положение будет объявлено по всей стране, якобы для борьбы с коррупцией и терроризмом. Будут введены комендантские часы, обыски без ордеров и цензура СМИ. Гражданские свободы будут приостановлены на неопределённый срок. Немцов пообещает снять чрезвычайное положение после завершения реформ - но когда?"
 SOV_temporary_federal_council: "Временный федеральный совет"
 SOV_temporary_federal_council_desc: "Временный федеральный совет, составленный из назначенных региональных представителей и военной верхушки, заменит Думу и Совет Федерации как высший законодательный орган. Выборы будут отложены на неопределённый срок. Совет будет резиновой печатью, но обеспечит правовое прикрытие."
 SOV_remove_red_threat: "Убрать красную угрозу"
 SOV_remove_red_threat_desc: "Коммунистическая партия будет запрещена, её лидеры арестованы по обвинению в «попытке организации подпольной антигосударственной деятельности». Геннадий Зюганов будет взят под стражу. Красная угроза, преследовавшая Россию с 1917 года, наконец будет устранена - диктаторским декретом."
 SOV_commission_economic_transformation: "Комиссия по экономической трансформации"
 SOV_commission_economic_transformation_desc: "Комиссия по экономической трансформации, укомплектованная молодыми либертарианскими экономистами, разработает радикальную шоковую терапию: немедленную либерализацию цен, массовую приватизацию и резкое сокращение социальных расходов. Боль будет сильной, но сторонники обещают долгосрочный рост."
 SOV_conditional_autonomy_national_minorities: "Условная автономия национальных меньшинств"
 SOV_conditional_autonomy_national_minorities_desc: "Национальные меньшинства получат «условную автономию»: они смогут использовать родные языки в местной администрации и школах, но только если откажутся от сепаратизма и примут русский как государственный язык. Этот компромисс будет раздражать и националистов, и меньшинства."
 SOV_society_concerned_reformists: "Общество обеспокоенных реформистов"
 SOV_society_concerned_reformists_desc: "Под патронажем Немцова будет создано новое гражданское движение - «Общество обеспокоенных реформаторов». Оно будет организовывать митинги в поддержку реформ, контрпротесты против коммунистов и мониторить соблюдение реформ в регионах - лояльная уличная сила для нового режима."
 SOV_imperial_presidency: "Имперское президентство"
 SOV_imperial_presidency_desc: "Немцов провозгласит себя президентом-императором Всероссийским, положив конец притворству республиканской демократии. Титул символичен, но концентрация власти реальна - Дума будет распущена, политические партии запрещены, а новая «имперская конституция» будет подготовлена. Третий Рим восходит."
 SOV_russian_economic_space: "Российское экономическое пространство"
 SOV_russian_economic_space_desc: "Россия выйдет из всех постсоветских экономических соглашений и создаст новое «Российское экономическое пространство» - тесный таможенный союз только с Беларусью, Казахстаном и Арменией. Мы будем стремиться к экономической самодостаточности, а не к интеграции, строя экономику-крепость для государства-крепости."
 SOV_support_syrian_opposition: "Поддержать сирийскую опозицию"
 SOV_support_syrian_opposition_desc: "Россия окажет финансовую и военную помощь светским оппозиционным силам в Сирии, надеясь заменить режим Асада на пророссийское, прозападное правительство. Цель - дружественный Дамаск, а не гражданская война - прагматическая геополитика на Ближнем Востоке."
 SOV_destroy_european_union: "Уничтожить Европейский союз"
 SOV_destroy_european_union_desc: "Россия запустит политическую кампанию по дестабилизации Европейского союза, финансируя евроскептические партии и поощряя выход стран-членов. Цель - Европа суверенных наций, а не федеральное сверхгосударство - долгосрочная идеологическая война против Брюсселя."
 SOV_russian_american_investment_strategy: "Российско-американская инвестиционная стратегия"
 SOV_russian_american_investment_strategy_desc: "Немцов предложит совместный инвестиционный форум с Соединёнными Штатами, предлагая американскому капиталу доступ к российским энергетическим и инфраструктурным проектам в обмен на технологические трансферы и политическое признание. Это будет прагматическое сотрудничество, а не конфронтация."
 SOV_alliance_israel: "Союз с Израилем"
 SOV_alliance_israel_desc: "Россия подпишет с Израилем договор о взаимной обороне и инвестициях, гарантируя его безопасность в обмен на высокотехнологичное сотрудничество и обмен разведданными. Альянс разозлит Иран, но укрепит позиции России на Ближнем Востоке - стратегический разворот к Средиземноморью."
 SOV_congress_eurosceptics: "Съезд евроскептиков"
 SOV_congress_eurosceptics_desc: "Россия проведёт в Москве международный конгресс евроскептических партий, собрав анти-ЕС движения из Франции, Германии, Италии, Венгрии и других стран. Цель - создать сеть влияния, которая подтолкнёт к роспуску Европейского союза."
 SOV_eastern_prosperity: "Восточное процветание"
 SOV_eastern_prosperity_desc: "Массивная инвестиционная программа будет нацелена на Беларусь, Украину и Молдову, предлагая дешёвые кредиты и инфраструктурные проекты в обмен на привязку к экономическому пространству России. Цель - вернуть постсоветских соседей с орбиты ЕС - восточное процветание через российский капитал."
 SOV_ruspac: "RUSPAC"
 SOV_ruspac_desc: "Россия предложит новый пакт безопасности для Тихого океана, RUSPAC, приглашая Китай, Японию и Индию присоединиться к рамочному соглашению о взаимном ненападении. Цель - снизить напряжённость и сосредоточиться на экономической конкуренции, а не на военном противостоянии - многополярная альтернатива НАТО в Азии."
 SOV_eliminate_hezbollah: "Ликвидировать Хезболлу"
 SOV_eliminate_hezbollah_desc: "Россия присоединится к Израилю в скоординированной военной операции по уничтожению военной инфраструктуры Хезболлы в Южном Ливане. Цель - укрепить ливанское государство, уменьшить иранское влияние и обезопасить восточное Средиземноморье - рискованный, но потенциально решающий удар."
 SOV_european_free_zone: "Европейская свободная зона"
 SOV_european_free_zone_desc: "Россия предложит «Европейскую свободную зону» - торгово-таможенную территорию от Лиссабона до Владивостока, исключая только Соединённые Штаты. Цель - расколоть Европу и Америку и создать евразийский экономический блок под российским лидерством."
 SOV_defeat_nato: "Разбить НАТО"
 SOV_defeat_nato_desc: "Россия предъявит США ультиматум: подписать пакт о ненападении и распустить НАТО, или столкнуться с новой гонкой вооружений и прокси-конфликтами по всему миру. Это опасная азартная игра ради геополитического сброса, чтобы покончить с американским военным доминированием в Европе."
 SOV_campaign_against_pseudo_liberalism: "Поход против лже-либерализма"
 SOV_campaign_against_pseudo_liberalism_desc: "Режим запустит пропагандистскую кампанию против «псевдолиберализма» - западной демократии, прав ЛГБТ и мультикультурализма - клеймя их как иностранные токсины. Цель - сплотить консервативные силы вокруг диктатуры, используя культурную войну как инструмент авторитарной консолидации."
 SOV_decree_great_restoration: "Декрет о великой реставрации"
 SOV_decree_great_restoration_desc: "Немцов подпишет «Декрет о великой реставрации», провозглашая восстановление монархии и объявляя себя регентом до тех пор, пока не будет найден «законный наследник», приостанавливая действие конституции на неопределённый срок. Республика мертва - да здравствует регент и империя."
 SOV_convene_zemsky_sobor: "Созвать Земский собор"
 SOV_convene_zemsky_sobor_desc: "Регент созовёт Земский собор - традиционное собрание дворян, духовенства и простолюдинов - для избрания нового царя из кандидатов вроде Бориса Ельцина (как символической фигуры) или далёкого отпрыска Романовых. Собор штампует выбор регента - средневековый ритуал для современной диктатуры."
 SOV_convene_imperial_assembly: "Созвать Имперское собрание"
 SOV_convene_imperial_assembly_desc: "Новое Имперское собрание заменит Думу, состоя из назначенных дворян, церковных сановников и промышленных магнатов. Никаких выборов, только совещательные полномочия. Регент будет править указами - феодальная демократия для феодального государства."
 SOV_re_imperialization: "Реимпериализация"
 SOV_re_imperialization_desc: "Города будут переименованы в дореволюционные названия, памятники Ленину будут снесены, а советский период официально объявлен «незаконной оккупацией». Мы перепишем историю во славу империи."
 SOV_integrate_ldpr: "Интегрировать ЛДПР"
 SOV_integrate_ldpr_desc: "Немцов интегрирует ЛДПР - националистическую партию Жириновского - в правящую коалицию. Жириновский станет вице-премьером, а его сторонники получат региональные посты. Голоса националистов будут кооптированы, а оппозиция сократится - чудовищный брак по расчёту."
 SOV_nemtsov_provincial_reform: "Провинциальная реформа Немцова"
 SOV_nemtsov_provincial_reform_desc: "Провинции будут реорганизованы в более крупные «губернаторства», каждое во главе с президентским назначенцем. Местное самоуправление будет отменено ради административной эффективности - окончательное уничтожение федерализма, превращение России в унитарное государство."
 SOV_status_roc: "Статус РПЦ"
 SOV_status_roc_desc: "Русская православная церковь будет объявлена государственной религией. Священники будут получать государственные зарплаты, церковные браки получат юридическую силу, другие конфессии будут терпимы, но не финансируемы - симфония престола и алтаря, как в старой империи."
 SOV_constitutional_referendum: "Конституционный референдум"
 SOV_constitutional_referendum_desc: "Будет проведён всенародный референдум по «Имперской конституции» - документу, который отменяет прямые выборы, устанавливает наследственную монархию и даёт регенту абсолютную власть. Режим представит голосование как волю народа, легитимизируя новый автократический порядок под видом народного одобрения."
 SOV_civil_service_reform: "Реформа гражданской службы"
 SOV_civil_service_reform_desc: "Гражданская служба будет очищена от всех остатков независимых чиновников. Будут требоваться присяги на верность регенту, политическая полиция будет контролировать все назначения. Государство станет машиной личной лояльности, а не профессиональной компетенции - бюрократия как меч."
 SOV_decree_imperial_corporations: "Указ об имперских корпорациях"
 SOV_decree_imperial_corporations_desc: "Все государственные корпорации будут слиты в единую «Имперскую корпорацию» - холдинговую компанию, которая контролирует энергетику, транспорт и финансы напрямую под регентом. Частные олигархи будут экспроприированы или выкуплены. Командная экономика вернётся под новым флагом."
 SOV_servant_of_the_crown: "Слуга короны"
 SOV_servant_of_the_crown_desc: "Премьер-министр получит высшую имперскую награду - орден Святого Андрея с короной - из рук новоявленного царя в церемонии, транслируемой в прямом эфире государственного телевидения. Регент будет провозглашён «первым слугой короны». Его положение будет сакрализовано."
 SOV_mistakes_of_youth: "Ошибки молодости"
 SOV_mistakes_of_youth_desc: "Немцов соберёт выживших «молодых реформаторов» 1990-х - Гайдара, Чубайса, Явлинского и Задорнова - в новый Совет экономических советников. Их задача - разработать новую экономическую стратегию, избегающую ошибок прошлого: стабильную, социально ответственную и свободную как от советского застоя, так и от олигархического грабежа."
 SOV_ministry_of_market_development: "Министерство рыночного развития"
 SOV_ministry_of_market_development_desc: "Будет создано новое Министерство рыночного развития, укомплектованное молодыми технократами из бизнес-сообщества. Его миссия - поддерживать малый бизнес, привлекать иностранные инвестиции и сокращать бюрократию, чтобы создать средний класс, который никогда больше не потерпит авторитарного правления."
 SOV_social_sector_restructuring: "Реструктуризация социального сектора"
 SOV_social_sector_restructuring_desc: "Мы реструктурируем социальные расходы: бюджеты здравоохранения и образования увеличатся, но субсидии государственным предприятиям будут сокращены. Цель - более эффективное государство всеобщего благосостояния, где бедные получают адресную помощь, а не всеобщие раздачи - эффективность с человеческим лицом."
 SOV_human_approach_to_business: "Человеческое отношение к бизнесу"
 SOV_human_approach_to_business_desc: "«Гуманный подход к бизнесу» заменит хищнический капитализм 1990-х. Мы реформируем налоговые проверки, запретим произвольные закрытия и предоставим правовую защиту малому бизнесу. Цель - поощрять предпринимательство, а не вымогательство - государство станет партнёром, а не бандитом."
 SOV_new_taxation_system: "Новая система налогообложения"
 SOV_new_taxation_system_desc: "Мы введём новый налоговый кодекс с упрощёнными ставками, сниженными корпоративными налогами и упрощённым НДС. Цель - стимулировать инвестиции и сократить теневую экономику. Государство будет забирать меньше, но собирать больше - это будет либеральная налоговая революция."
 SOV_domestic_vehicles_for_officials: "Пересадить чиновников на отечественные автомобили"
 SOV_domestic_vehicles_for_officials_desc: "Все государственные чиновники будут обязаны ездить на автомобилях отечественного производства. Цель - поддержать российский автопром и сократить импорт. Олигархи потеряют прибыльные зарубежные контракты, а каждая чиновничья машина станет едущим символом возрождения промышленности. Маленький шаг для бюджета, но гигантский скачок для национальной гордости."
 SOV_northern_russia_industrialization: "Индустриализация Северной России"
 SOV_northern_russia_industrialization_desc: "Массивная программа индустриализации будет нацелена на северные регионы. Мы построим новые порты, железные дороги, заводы и энергетическую инфраструктуру для освоения арктических ресурсов и создания рабочих мест, наконец укрощая северный фронтир."

 #Events
 sov_boriska.0.t: "Инаугурация Бориса Немцова"
 sov_boriska.0.d: "Борис Немцов принимает присягу в Кремле, но его стиль намеренно сдержан. Никаких массовых митингов, никаких пламенных речей перед толпой - вместо этого краткое обращение к нации, транслируемое онлайн. «Мы не начинаем революцию, - говорит он. - Мы завершаем ремонт. 1990-е были сносом. 2000-е были застоем. Теперь пришло время строить - трезво, профессионально и без иллюзий».\n\nОн обещает сократить бюрократию, бороться с коррупцией и привести воюющие элиты за один стол. «Хватит детских склок. Хватит проверок на лояльность. Мы будем измерять успех не тем, сколько врагов мы раздавили, а тем, сколько рабочих мест создали». Политический истеблишмент насторожен, а общество, полное неуверенности, тем не менее готово поддержать президента, который намерен перейти от обещаний к реальным делам, не тратя время на символические жесты."
 sov_boriska.0.a: "Меньше слов, больше дела"
 sov_boriska.1.t: "Борис Немцов критикует политику Ельцина"
 sov_boriska.1.d: "Во время рабочей встречи с журналистами президент России Борис Немцов раскритиковал экономическую политику своего предшественника Бориса Ельцина. По словам Немцова, «шоковая терапия» и слабый контроль за приватизацией в 1990-е привели к глубокому неравенству, с которым его команда всё ещё пытается справиться. «Мы вынуждены иметь дело с последствиями поспешных решений, - заявил действующий президент, - но у нас есть план, чтобы восстановить доверие людей к институтам»."
 sov_boriska.1.a: "В какую игру он играет?"
 sov_boriska.2.t: "Борис Немцов проводит встречу с олигархами"
 sov_boriska.2.d: "Президент Борис Немцов провёл закрытое совещание за круглым столом с ведущими бизнесменами страны. Вопреки ожиданиям, олигархи единогласно заявили о поддержке политики главы государства. Граждане опасаются, что эти действия создадут политический зонтик для коррупционных схем, а усиление влияния олигархов на правительство вернёт Россию в эпоху «Семи банкиров»."
 sov_boriska.2.a: "«Семибанкирщина» возвращается"
 sov_boriska.3.t: "Немцов давит на коммунистов"
 sov_boriska.3.d: "Президент Борис Немцов провёл серию закрытых встреч с главами регионов «красного пояса». По данным источников, глава государства жёстко потребовал от губернаторов-коммунистов покинуть Коммунистическую партию РФ, пригрозив им «потерей политического долголетия» в случае отказа. Несколько губернаторов уже объявили о готовности выйти из партии, называя решение «вынужденным, но обдуманным». КПРФ назвала происходящее «политическим бандитизмом» и пообещала обратиться в Конституционный суд."
 sov_boriska.3.a: "Это вообще демократично?"
 sov_boriska.4.t: "Немцов совершает переворот"
 sov_boriska.4.d: "Борис Немцов, будучи у власти, неожиданно ввёл армейские части в столицу. Без всяких предупреждений, указов или обращений техника просто выехала на улицы, а военные взяли под контроль ключевые объекты. Официальной причиной назвали «нарастающий кризис власти и неспособность правительства контролировать ситуацию». По сути, произошёл так называемый «самопереворот»: исполняющий обязанности президента распустил кабинет и сосредоточил всю власть в своих руках. Реакция общественности была сдержанной и испуганной. Люди спешно покинули центр города, магазины опустели, а по соцсетям прокатилась волна тревоги и замешательства."
 sov_boriska.4.a: "И снова переворот, что это такое!"
 sov_boriska.5.t: "В России снова переворот"
 sov_boriska.5.d: "В России произошло шокирующее событие: действующий президент Борис Немцов без предварительного объявления ввёл армейские части в Москву. По словам очевидцев, военная техника и спецназ блокируют правительственные здания, телецентр и ключевые транспортные узлы. Аналитики уже называют произошедшее «самопереворотом»: Немцов распустил собственное правительство и захватил всю полноту власти, формально оставаясь главой государства.\n\nОчевидцы сообщают о панике в центре города. Люди бегут с улиц, метро переполнено, многие спешно покидают столицу. Социальные сети заполнены смесью страха и недоумения. «Мы не понимаем, кто на чьей стороне», - цитирует местная газета слова одного из жителей. «Такое ощущение, что снова 90-е». Сообщений об открытых протестах пока нет: армия контролирует ситуацию, улицы патрулируются. Часть населения, уставшая от затяжного кризиса, воспринимает происходящее как «наведение порядка», но международные наблюдатели предупреждают о риске сползания к диктатуре.\n\nЗападные страны потребовали немедленного восстановления конституционного порядка. Европейский союз объявил экстренное заседание Совета министров. Госдепартамент США выразил «глубокую обеспокоенность»."
 sov_boriska.5.a: "О, Россия, что с тобой происходит?"
 sov_boriska.6.t: "Немцов устанавливает диктатуру"
 sov_boriska.6.d: "Борис Немцов объявил об установлении временной диктатуры. Выступая по государственному телевидению, он заявил, что вынужден пойти на этот шаг, чтобы «расчистить путь для подлинной демократии и цивилизованного капитализма». «Сначала порядок, потом свобода», - подчеркнул Немцов.\n\nОппозиция и правозащитники уже назвали режим «демократическим фасадом» и прикрытием для узурпации. Некоторые граждане, согласно опросам, замерли в тревожном недоумении, в то время как другие, уставшие от кризисов, выражают робкую надежду на «твёрдую руку». Международные наблюдатели призывают Немцова немедленно восстановить конституционный порядок."
 sov_boriska.6.a: "Россия снова под диктатурой"
 sov_boriska.7.t: "Зюганов арестован"
 sov_boriska.7.d: "Сотрудники спецслужб задерживают Зюганова. По сообщению пресс-службы нового режима, Зюганов был взят под стражу при выходе из своей квартиры по обвинению в «попытке организации подпольной антигосударственной деятельности» и «призывах к свержению установленного порядка».\n\nПравозащитники уже назвали арест политическим преследованием, но официальные источники утверждают, что расследование ведётся в строгом соответствии с «декретом о временной диктатуре». Заявлений от защиты пока не поступало."
 sov_boriska.7.a: "Ты осмелился использовать мои же заклинания против меня, Немцов?"
 sov_boriska.8.t: "Борис Немцов провозгласил себя президентом-императором"
 sov_boriska.8.d: "Спустя месяц после установления временной диктатуры Борис Немцов сделал ещё один шаг, окончательно порвав с демократической риторикой. В прямом эфире государственного телевидения он провозгласил себя президентом-императором Всероссийским.\n\nРеакция элит была предсказуемой паникой. Некоторые из вчерашних олигархов уже присягнули на верность, другие пытаются бежать за границу. В регионах вспыхнули стихийные протесты, жестоко подавленные войсками, верными императору. Арестованный Зюганов объявил голодовку. Народ, по словам пропаганды, «восторженно приветствовал нового хозяина». Мир замер в ожидании - дипломаты покидают Москву."
 sov_boriska.8.a: "Всё к этому и шло, но всё равно КАКОГО ЧЁРТА?"
 sov_boriska.9.t: "Россия приглашает нас в экономический альянс"
 sov_boriska.9.d: "Россия приглашает нас присоединиться к Евразийскому экономическому партнёрству. В отличие от старых жёстких союзов, не будет диктата из Москвы - только общие правила, открытые рынки и честная конкуренция. Для нашей промышленности это шанс выйти на большой беспрепятственный рынок, а для малого бизнеса - получить предсказуемые условия. Конечно, нужны гарантии, что Партнёрство не станет инструментом давления. Но если Немцов действительно выстроит институты, работающие по закону, а не по интересам кремлёвских групп, то присоединение будет чрезвычайно выгодно для нас."
 sov_boriska.9.a: "Интересное предложение, где подписывать?"
 sov_boriska.9.b: "Нам не нужны подачки из Москвы"
 sov_boriska.10.t: "[FROM.GetName] ратифицирует членство"
 sov_boriska.10.d: "[FROM.GetName] ратифицирует членство в Евразийском экономическом партнёрстве. Это означает, что наш общий рынок становится шире, а правила прозрачнее. Для нас, с российской стороны, согласие [FROM.GetName] служит подтверждением того, что альянс строит не империи, а взаимную выгоду. Теперь предприниматели обеих стран смогут работать без лишних барьеров, инвестиции пойдут в реальные проекты, а люди почувствуют стабильность и рост."
 sov_boriska.10.a: "Добро пожаловать в пространство, где экономика важнее геополитики"
 sov_boriska.11.t: "[FROM.GetName] отказался присоединяться"
 sov_boriska.11.d: "К сожалению, [FROM.GetName] отказался присоединиться к Евразийскому экономическому партнёрству. Мы уважаем суверенный выбор партнёров и не применяем давление - это основа нашей политики. Однако двери альянса остаются открытыми: если [FROM.GetName] передумает и увидит преимущества свободной торговли, технологического сотрудничества и общих стандартов, он всегда может присоединиться. Экономическое процветание нельзя навязать силой; оно рождается из доброй воли. Мы с нетерпением ждём возможности приветствовать [FROM.GetName] за столом переговоров, когда они будут готовы."
 sov_boriska.11.a: "Что ж, мы не навязываем"
 sov_boriska.12.t: "Россия поддерживает оппозицию"
 sov_boriska.12.d: "Мы считаем это недружественным шагом. У нас давние связи с Москвой, но когда сверхдержава начинает открыто предоставлять ресурсы и политическое прикрытие силам, стремящимся к смене режима в Дамаске, это переходит все границы дозволенного. Внешнее вмешательство, даже под видом «поддержки демократии», лишь дестабилизирует ситуацию и подрывает доверие между нашими странами. Мы надеялись, что президент Немцов будет вести себя иначе, чем старые имперские режимы, но результат тот же: Россия делает ставку против действующего правительства. Это нас не радует, и мы требуем прекратить такую поддержку."
 sov_boriska.12.a: "Это неприемлемо!"
 sov_boriska.13.t: "Российско-американский инвестиционный форум"
 sov_boriska.13.d: "В рамках курса на прагматичное экономическое сближение Россия и США провели свой первый совместный инвестиционный форум «Рост без границ». По итогам встречи был подписан пакет двусторонних соглашений, охватывающих ключевые области: бизнес, энергетику и торговлю.\n\nКомментируя итоги форума, глава российской делегации отметил: «Мы доказываем, что сотрудничество между двумя крупнейшими экономиками может строиться не на политических симпатиях и антипатиях, а на взаимной выгоде и предсказуемых правилах»."
 sov_boriska.13.a: "Это новая страница в российско-американских отношениях"
 sov_boriska.14.t: "Россия предлагает защиту"
 sov_boriska.14.d: "Россия не просто предлагает нам «защиту». Сегодня Москва выдвинула предложение, которое мы воспринимаем серьёзно: заключить двустороннее соглашение о взаимной защите и инвестициях. Одновременно нас приглашают присоединиться к Евразийскому экономическому партнёрству. Это не обычная дипломатия - она объединяет безопасность и экономику в единый пакет.\n\nКонечно, мы взвесим риски. Но сам факт того, что Москва (а нынешнее российское руководство прагматично, это все видят) предлагает Израилю равноправный союз, а не роль младшего партнёра, заслуживает детального диалога. Решение остаётся за Кнессетом, но сейчас скепсиса меньше, чем надежды."
 sov_boriska.14.a: "Это чрезвычайно выгодное предложение Москвы"
 sov_boriska.14.b: "Израиль способен помочь себе сам"
 sov_boriska.15.t: "Россия предлагает инвестиции"
 sov_boriska.15.d: "Россия предлагает нам инвестиции. Для [ROOT.GetName] это шанс обновить промышленность и создать рабочие места без грабительских условий. Да, мы помним, как в 1990-е инвестиции часто были лишь прикрытием для захвата активов. Но теперь, при Немцове, другая Россия - с прозрачными контрактами и международным арбитражем."
 sov_boriska.15.a: "Сделка"
 sov_boriska.15.b: "Нам не нужны подачки из Москвы"
 sov_boriska.16.t: "[FROM.GetName] принимает наши инвестиции"
 sov_boriska.16.d: "Это важный шаг на пути к укреплению взаимного доверия и экономического роста. Российские средства будут направлены на конкретные проекты: модернизацию инфраструктуры, развитие сельского хозяйства и поддержку малого бизнеса в [FROM.GetName]. Мы гарантируем прозрачность контрактов, защиту прав собственности и международный арбитраж в случае споров. При президенте Немцове инвестиции - это не инструмент влияния, а способ создавать рабочие места и прибыль для обеих сторон."
 sov_boriska.16.a: "Добро пожаловать нашим стратегическим партнёрам"
 sov_boriska.17.t: "[FROM.GetName] отказался от инвестиций"
 sov_boriska.17.d: "[FROM.GetName] отказался от наших инвестиций. Мы уважаем суверенные решения партнёров и не считаем это поводом для охлаждения отношений. Предложенные проекты - модернизация инфраструктуры, совместные предприятия и льготное кредитование - остаются на столе. Если [FROM.GetName] передумает или захочет обсудить другие условия, мы готовы в любой момент возобновить переговоры."
 sov_boriska.17.a: "Мы ждём, когда [FROM.GetName] будет готов"
 sov_boriska.18.t: "Россия приглашает нас к операции против Хезболлы"
 sov_boriska.18.d: "Россия приглашает нас принять участие в военной операции против Хезболлы. Мы внимательно изучили это предложение и заявляем: Ливан заинтересован. Да, решение непростое - Хезболла давно является реальной военной и политической силой, неподконтрольной государству. Но именно поэтому мы видим в российской инициативе историческую возможность вернуть монополию на легальное насилие ливанским институтам.\n\nУчастие нашей армии в операции на нашей собственной территории будет означать, что мы наконец берём на себя ответственность за южные границы и аэропорт Бейрута. Россия при президенте Немцове предложила не оккупацию, а координацию, разведку и воздушное прикрытие. Для нас это возможность очистить страну от параллельных армий без риска быть поглощёнными затяжной гражданской войной."
 sov_boriska.18.a: "Давайте освободим нашу страну от проиранских сил!"
 sov_boriska.18.b: "Мы не будем рисковать внутренней стабильностью"
 sov_boriska.19.t: "Борис Немцов восстанавливает монархию"
 sov_boriska.19.d: "Борис Немцов, который после событий последних месяцев сосредоточил в своих руках всю полноту власти, сделал удивительное заявление. В прямом эфире государственного телевидения он объявил о восстановлении монархии в России. «Республика исчерпала себя. Демократия 1990-х привела к хаосу, а моя временная диктатура была лишь необходимой мерой. Истинная стабильность кроется в тысячелетней традиции», - заявил Немцов.\n\nОднако вместо коронации он объявил себя регентом-правителем при «временно отсутствующем» монархе. По словам Немцова, законный наследник престола существует, но не может занять трон по «объективным и временным причинам». Имя и местонахождение потенциального царя не разглашаются. Регент пообещал, что «когда придёт время», будет проведена всенародная церемония восстановления монархии.\n\nОппозиция назвала происходящее фарсом и попыткой придать видимость легитимности узурпации. Русская православная церковь заняла выжидательную позицию. Часть населения отреагировала на новости с недоумением и тревогой."
 sov_boriska.19.a: "Когда-нибудь это закончится..."
 sov_boriska.20.t: "Немцов созывает Земский собор"
 sov_boriska.20.d: "Ближний круг Бориса Немцова и правительство активно анализируют двух кандидатов на престол: Бориса Ельцина и члена дома Романовых. Выбор в пользу Ельцина означает разрыв с советским прошлым и опору на реформы 1990-х: Ельцин - узнаваемая, пусть и больная и формальная фигура, которая станет удобным символом, не вмешиваясь в реальное управление регента Немцова. Главный риск здесь - отсутствие чёткого наследника, что грозит новым кризисом. Кандидатура Романова, напротив, даёт сакральную легитимность и поддержку церкви и консервативных групп. Однако правительство опасается, что Романов, долгое время живший за границей, окажется марионеткой или начнёт претендовать на реальную власть. В конечном счёте власти склоняются к Ельцину как к управляемому временному символу, оставляя Романова запасным вариантом. Окончательный выбор остаётся за Земским собором, но за кулисами необходимые голоса уже проверяются."
 sov_boriska.20.a: "Ельцин - идеальный кандидат"
 sov_boriska.20.b: "Романовы - стабильный вариант"
 sov_boriska.21.t: "Россия коронует Бориса Ельцина"
 sov_boriska.21.d: "Земский собор, созванный регентом Борисом Немцовым, избрал первого президента России Бориса Ельцина новым императором. Коронация прошла в Успенском соборе Кремля, и 74-летний Ельцин был провозглашён «Императором и Самодержцем Всероссийским». Регент Немцов остаётся фактическим правителем, управляя страной от имени больного монарха. По словам его представителей, «Ельцин - символ преемственности между реформами 1990-х и новой, традиционной Россией».\n\nЗападные страны заявили, что не признают смену власти без всенародного референдума. В Кремле ответили, что «Земский собор выражает волю народа». Русская православная церковь благословила коронацию. Улицы Москвы были перекрыты, усилены меры безопасности. Согласно опросам, большинство россиян встретили событие с апатией и непониманием. Эксперты называют событие историческим прецедентом: человек, разрушивший империю, стал императором её преемницы."
 sov_boriska.21.a: "Что за чушь?"
 sov_boriska.22.t: "Романовы возвращаются на трон"
 sov_boriska.22.d: "Земский собор, созванный регентом Борисом Немцовым, избрал на престол кандидата из дома Романовых. Коронация этого потомка династии, много лет жившего за границей, состоялась в Успенском соборе Кремля. Новый монарх был провозглашён «Императором и Самодержцем Всероссийским». Однако реальная власть остаётся у регента Немцова, который будет управлять страной от имени коронованного царя.\n\nЧасть дома Романовых, принадлежащая к другой ветви, уже отказалась признать избранного кандидата, назвав его «самозванцем» и «кремлёвской марионеткой». Западные страны выразили скептицизм, потребовав всенародного референдума об изменении формы правления. Русская православная церковь, после некоторых колебаний, благословила коронацию. Москва перекрыта, меры безопасности усилены. Реакция общества - смесь апатии, недоверия и робкой надежды. Эксперты предупреждают о риске раскола в монархическом лагере из-за династических споров."
 sov_boriska.22.a: "Впечатляющее возвращение"
 sov_boriska.23.t: "Немцов встречается с Жириновским"
 sov_boriska.23.d: "Регент Борис Немцов и лидер ЛДПР Владимир Жириновский объявили о формировании правящей коалиции, вызвав шок в России и за рубежом. Десятилетиями они были политическими врагами: их публичная вражда ознаменовалась инцидентом в 1995 году, когда Жириновский облил Немцова апельсиновым соком. Эти идеологические противоположности - либерал и западник против националиста и империалиста - внезапно заключили союз.\n\n«Исторический компромисс», - назвал его Немцов. Жириновский добавил: «Вместе мы восстановим порядок». По данным источников, коалиция сосредоточится на подавлении оппозиции и проведении жёстких реформ. Эксперты назвали альянс «чудовищным браком по расчёту», предсказывая внутренние конфликты, но отмечая его прагматизм: в кризис объединение правых и левых националистов создаёт широкую политическую базу для удержания власти."
 sov_boriska.23.a: "Чему тут удивляться?"
 sov_boriska.24.t: "Референдум о новой конституции"
 sov_boriska.24.d: "Регент Борис Немцов провёл всенародный референдум о принятии «Имперской конституции» России. Документ, закрепляющий монархию, фактическую автократию регента и сословное неравенство, получил неожиданно высокую поддержку. Согласно официальным данным, более 62% избирателей проголосовали «за». Главная причина, отмечают наблюдатели, - глубокая усталость населения от череды переворотов, ограничений и нестабильности. «Пусть будет империя, пусть будет регент - лишь бы не бояться завтрашнего дня», - так один социолог резюмирует настроения москвичей.\n\nОппозиция назвала итоги референдума сфальсифицированными, но признала, что даже при честном подсчёте сторонники «мира любой ценой» могли бы получить большинство. Новая конституция отменяет прямые выборы и парламент, заменяя их Земскими соборами, назначаемыми регентом. Сам Немцов в телеобращении поблагодарил граждан за «мудрость и терпение», пообещав, что «эпоха колебаний закончена».\n\nЗападные страны и правозащитные организации уже осудили референдум как «предлог для узурпации». Однако Кремль парирует: «Народ сказал - и это главный источник власти в новой России». Впереди формальное обнародование конституции и массовая смена символов. Страна замерла в ожидании: оправдаются ли надежды на долгожданный порядок или воцарятся новые репрессии."
 sov_boriska.24.a: "Наконец-то всё кончено"
 sov_boriska.25.t: "Борис Немцов избран председателем царского правительства"
 sov_boriska.25.d: "Борис Немцов, ранее носивший титул регента при номинальном императоре, официально сменил свой статус. На первой сессии новосформированной Государственной Думы - теперь сословно-представительного собрания при монархе - Немцов был единогласно избран председателем царского правительства. Церемония открытия Думы прошла в Таврическом дворце под двуглавыми орлами, и новоназначенный премьер-министр принёс присягу на верность императору и новой конституции."
 sov_boriska.25.a: "Режим постепенно укрепляется"
 sov_boriska.26.t: "Борис Немцов проводит реимпериализацию"
 sov_boriska.26.d: "Председатель царского правительства Борис Немцов запустил кампанию «реимпериализации» - возвращения городам дореволюционных названий, тотальной декоммунизации и пересмотра исторической роли СССР. Был подписан ряд указов: Волгоград переименован в Царицын, Киров стал Вяткой, переименованы десятки улиц, площадей и станций метро, носивших имена советских деятелей. По всей стране сносятся памятники Ленину и другим коммунистическим лидерам.\n\nКлючевым актом стало официальное заявление, оправдывающее Российскую империю от всех обвинений, когда-либо выдвигавшихся большевиками и советской историографией. Документ фактически реабилитирует монархическую систему и её исторических деятелей, включая Николая II и других правителей.\n\nНа Западе реакция сдержанная и критическая: Европейский союз заявил, что переписывание истории не способствует примирению, но воздерживается от санкций. Улицы российских городов постепенно меняют облик - двуглавые орлы, имперские флаги и вывески «Царицын» вместо «Волгограда». Судя по опросам, большинство граждан отнеслось к переменам с апатией, но некоторые, особенно старшее поколение, встретили снос памятников с горечью. Немцов пообещал, что «историческая справедливость восторжествует» в течение года."
 sov_boriska.26.a: "Осталось только убрать тело с площади"
 sov_boriska.27.t: "Вопрос о статусе Русской православной церкви"
 sov_boriska.27.d: "Перед правительством встал вопрос о статусе Русской православной церкви: восстановить ли её в качестве государственной религии, как это было в империи, или сохранить светский характер. Сторонники государственной религии указывают, что православие является духовной основой монархии, и его приоритет укрепит легитимность новой власти и объединит общество. Противники возражают, что Россия многоконфессиональна, и предоставление привилегий православию спровоцирует межрелигиозные конфликты, отпугнёт инвесторов и вызовет ассоциации со Средневековьем. Большинство склоняется к компромиссу - символическому статусу «культурообразующей религии» без прямого государственного контроля, подобно англиканской церкви. Окончательное решение остаётся за Немцовым, который пока выжидает."
 sov_boriska.27.a: "Православие - великое наследие нашего государства"
 sov_boriska.27.b: "В современной России религия должна уйти на второй план"
 sov_boriska.28.t: "Борис Немцов получает высшую имперскую награду"
 sov_boriska.28.d: "Председатель царского правительства Борис Немцов был удостоен высшей государственной награды - ордена Святого апостола Андрея Первозванного I степени с императорской короной. Церемония прошла в Георгиевском зале Кремля. Глава Императорского капитула вручил награду от имени императора. В указе о награждении говорилось: «За восстановление исторической справедливости, укрепление самодержавия и выдающиеся заслуги перед Отечеством». Немцов стал первым нединастическим главой правительства за более чем столетие, получившим эту награду. Оппозиция назвала награду «самовозвеличиванием» и «декоративной», но в лояльных правительству кругах её посчитали знаком окончательного признания Немцова элитами и монархом. Сам премьер-министр поблагодарил императора и пообещал «служить России ещё более усердно»."
 sov_boriska.28.a: "Воистину достойно"
 sov_boriska.29.t: "Россия организует саммит евроскептиков"
 sov_boriska.29.d: "Россия провела в Москве международный саммит евроскептиков. Форум «За суверенную Европу» собрал представителей антисистемных партий из Франции, Германии, Италии, Венгрии и других стран. Ключевой посыл заключался в том, что ЕС исчерпал себя, навязывая странам-членам потерю суверенитета, в то время как ЕЭП предлагает равноправное экономическое сотрудничество без централизованных диктатов."
 sov_boriska.29.a: "Это начало экономической войны в Европе"
 sov_boriska.30.t: "Россия приглашает нас в Европейскую свободную зону"
 sov_boriska.30.d: "Россия приглашает нас в Европейскую свободную зону (ЕСЗ) - новый интеграционный проект, задуманный как альтернатива Европейскому союзу. Вступление в ЕСЗ означает выход из ЕС. Однако Москва предлагает компенсацию: преференциальный доступ к рынку Евразийского экономического партнёрства (ЕЭП), отмену пошлин, энергетические гарантии и уважение к нашему национальному суверенитету без наднациональных диктатов."
 sov_boriska.30.a: "Условия действительно выгодны для нас"
 sov_boriska.30.b: "Мы не предадим ЕС"
 sov_boriska.31.t: "Россия предлагает пакт о ненападении"
 sov_boriska.31.d: "Россия обратилась к нам с предложением о пакте о ненападении. Официально Москва объясняет это необходимостью гарантировать свою безопасность в условиях резкого противостояния с Европейским союзом. Однако Конгресс подозревает, что Россия, играя на евроскептической карте, не исключает применения военной силы против нежелательных членов ЕС - и хочет заранее защитить себя от вмешательства США.\n\nКлючевое условие Кремля: наше согласие на пакт автоматически означает роспуск НАТО. Альянс, с точки зрения Москвы, теряет смысл, если две крупные военные державы договариваются о нейтралитете. Мы не забыли недавнюю инвестиционную разрядку и сближение с Россией, но цена, которую мы платим, - это демонтаж трансатлантической оборонной структуры, строившейся десятилетиями.\nНа карту поставлены будущее европейской безопасности и наши обязательства перед союзниками. Любое решение будет тщательно рассмотрено."
 sov_boriska.31.a: "Мы не будем вмешиваться в их противостояние"
 sov_boriska.31.b: "Безопасность наших европейских партнёров - наш приоритет"
 sov_boriska.32.t: "Соединённые Штаты отказались от нейтралитета"
 sov_boriska.32.d: "Соединённые Штаты отвергли наше предложение о пакте о ненападении. Вашингтон предпочёл сохранить НАТО, а вместе с ним и собственную гегемонию в Европе. Для нас это решение означает только одно: мы не получим гарантий нейтралитета, а значит, будем вынуждены обеспечивать свою собственную безопасность."
 sov_boriska.32.a: "Они выбрали войну"
 sov_boriska.33.t: "НАТО распущена. Российско-американский пакт"
 sov_boriska.33.d: "Соединённые Штаты вышли из НАТО и подписали с Россией пакт о ненападении. Европейские члены альянса в шоке. ЕС, уже ведущий экономическую войну с Евразийским экономическим партнёрством, опасается, что остался один на один с Россией. Чрезвычайный саммит в Брюсселе назвал действия США «предательством». Без американской защиты Европа стоит перед выбором: либо спешное создание собственной армии, либо сепаратные переговоры с Москвой."
 sov_boriska.33.a: "Неожиданный поворот сюжета"
 #Left Path
 sov_boriska.34.t: "Немцов наводит порядок"
 sov_boriska.34.d: "Президент Борис Немцов подписывает указ об увольнении десятков губернаторов и глав федеральных ведомств, заподозренных в коррупции. «Эпоха неприкосновенности для коррупционеров закончена», - заявляет он. Владислав Сурков, «серый кардинал» предыдущей администрации, - среди уволенных. На их места Немцов назначает молодых экономистов, правозащитников и технократов из своей команды. «Мы не меняем обои, мы меняем всё здание», - говорит президент.\n\nСтарые элиты в шоке: некоторые губернаторы отказываются покидать кабинеты, и приставам приходится выламывать двери, а Компартия осуждает происходящее как «чистку», в то время как либеральные СМИ ликуют. Международное сообщество осторожно аплодирует, хотя простые граждане разделились между надеждой на справедливость и страхом перед хаосом. Немцов обещает, что каждый назначенец пройдёт публичную проверку на добросовестность, ведь «доверие нельзя декретировать, его нужно заслужить»."
 sov_boriska.34.a: "Новая метла метёт чисто - но не сломается ли?"
 sov_boriska.35.t: "Пакт лояльных губернаторов"
 sov_boriska.35.d: "Президент Немцов встречается за закрытыми дверями с губернаторами Пскова, Самары и Санкт-Петербурга. Переговоры длятся до рассвета. К утру они выходят с рукопожатием - губернаторы обещают публичную поддержку реформам президента, а Немцов взамен даёт им больше контроля над региональными бюджетами и местной политикой. «Мы не строим унитарное государство, - позже говорит Немцов журналистам. - Сильной России нужны сильные регионы. Но сила рождается из доверия, а не из страха». Пресса окрещивает их «Клубом лояльных губернаторов». Пока что периферия Кремля спокойна - а хватка центра тихо укрепляется."
 sov_boriska.35.a: "Сила через доверие"
 sov_boriska.36.t: "Сделка преемника"
 sov_boriska.36.d: "Президент Борис Немцов встретился за закрытыми дверями с Татьяной Юмашевой и Валентином Юмашевым - влиятельными дочерью и зятем первого президента. Итогом встречи стало стратегическое соглашение, шокировавшее политическую элиту Москвы. Так называемая «Семья» публично обязуется не мешать реформам Немцова, а взамен Кремль гарантирует сохранность активов и статуса легендарной «Семьи» ельцинской эпохи. «Борис Николаевич очень его любил, - вспоминает Наина Ельцина. - Они оба были такими смелыми, отчаянно бесшабашными, искренними. Борис Ельцин с теплотой и симпатией относился к молодому политику, ценил его энергию и смелость». Немцов, в свою очередь, всегда относился к первому президенту с «огромным уважением». Пакт скреплён памятью о старой фотографии с надписью «Моему преемнику», которую Ельцин как-то подарил Немцову. Прагматичный союз поколений гарантирует политическую стабильность, но питает слухи о закулисном управлении."
 sov_boriska.36.a: "Прошлое гарантирует будущее"
 sov_boriska.37.t: "Ельцинизм с человеческим лицом"
 sov_boriska.37.d: "Президент Борис Немцов обнародует свою идеологическую платформу. «Мы не строим новую систему, - заявляет он. - Мы возвращаемся к утерянным идеалам 1990-х - к идеям свободы, свободной прессы, уничтожения цензуры, к частной инициативе и интеграции с миром. Реформы первого президента дали моему поколению возможность жить в свободной стране. Его завоевания - страна без цензуры и открытость миру - уничтожены его преемником. То, что мы имеем сейчас - это не рынок, а «приятельский капитализм». И мы называем это «ельцинизмом с человеческим лицом» - потому что для него свобода всегда была лучше, чем несвобода».\n\nРеакция оказывается глубоко неоднозначной: либеральная интеллигенция рукоплещет возвращению к демократическим ценностям, в то время как националисты и коммунисты требуют импичмента президента, обвиняя его в предательстве суверенитета страны. Новый курс возвращает Россию к самой себе - бороться за место в мире, а не за стену вокруг себя."
 sov_boriska.37.a: "Возвращение к свободе"
 sov_boriska.38.t: "Губернаторы в Совете Федерации"
 sov_boriska.38.d: "Президент Борис Немцов подписывает закон о реформе Совета Федерации. Согласно новым правилам, губернаторы будут делегировать в верхнюю палату постоянных профессиональных представителей - или заседать там лично. Реформа направлена на усиление голоса регионов в федеральных решениях и превращение Совфеда в более эффективный и менее политизированный орган.\n\n«Мы не централизуем власть, мы заставляем федерализм работать», - объясняет Немцов. Многие губернаторы приветствуют этот шаг как знак доверия. Сепаратистские настроения в национальных республиках заметно снижаются. Однако либеральные критики утверждают, что реформа устраняет прямые региональные выборы и укрепляет власть назначенных глав. Компартия называет это «шагом к бюрократическому феодализму». Как бы то ни было, новый Совет Федерации стал более предсказуемым и лояльным Кремлю."
 sov_boriska.38.a: "Более сильная федерация - на наших условиях"
 sov_boriska.39.t: "Героизация Ельцина"
 sov_boriska.39.d: "Президент Борис Немцов представляет государственную программу по увековечению памяти первого президента России Бориса Ельцина. «Благодаря ему я и миллионы моих соотечественников получили возможность жить в свободной стране, - заявляет Немцов на церемонии в екатеринбургском Ельцин-Центре. - Он ненавидел цензуру, верил в частную инициативу и был убежден, что Россия должна быть частью мира. Мы строим новую Россию на фундаменте, который заложил он». Программа включает переименование улиц, выпуск памятных медалей и учреждение стипендий Ельцина для молодых предпринимателей.\n\nРеакция оказывается резко поляризованной: либералы приветствуют возвращение к идеалам 1990-х годов, тогда как Коммунистическая партия осуждает «прославление разрушителя СССР», а националисты пребывают в смятении, тихо задаваясь вопросом, насколько эта героизация служит новому политическому порядку. Внутри Кремля шепчутся, что Немцов - которого Ельцин одно время прочил себе в преемники - теперь пытается короноваться по доверенности, создавая «полезное прошлое» для легитимации собственной власти. «Ельцинизм без Ельцина», - резюмирует один из политологов. Олигархи, почуяв перемену ветра, ворчат, но не решаются на открытое противостояние растущему культу."
 sov_boriska.39.a: "Строительство полезного прошлого для нового будущего"
 sov_boriska.40.t: "Новые правила"
 sov_boriska.40.d: "Президент Борис Немцов подписывает пакет поправок к избирательному законодательству, которые, по официальным заявлениям, призваны «упорядочить политический процесс и укрепить партийную дисциплину». Новые законы повышают проходной барьер до 8% и вносят изменения в региональное выборное законодательство. За кулисами администрация президента заключает с губернаторами ключевых регионов неформальные соглашения, по которым те обязуются обеспечить необходимые результаты на предстоящих выборах и ограничить представительство оппозиционных партий в местных законодательных собраниях.\n\nЛиберальное крыло правительства оказывается расколотым: одни видят в этих мерах «необходимую консолидацию демократических сил перед лицом экстремистских угроз», другие называют это «предательством идеалов свободных выборов и прямым заимствованием методов прежнего режима». Пока что машина работает гладко, но долгосрочные последствия для политической системы остаются неопределёнными. Демократия переформатируется во что-то более управляемое - и более предсказуемое."
 sov_boriska.40.a: "Необходимое зло ради стабильности"
 sov_boriska.41.t: "Во что превратилась Россия?"
 sov_boriska.41.d: "Прошли годы с тех пор, как Борис Немцов начал свои реформы. Страна больше не является хаотичной, коррумпированной, но демократически перспективной Россией 1990-х. Это и не полицейское государство раннего путинского периода. Возникло нечто новое - прагматичное, стабильное и глубоко циничное.\n\nСтарая система региональных уделов сменилась «Клубом лояльных губернаторов», гарантирующим стабильность в обмен на автономию. Президент заключил стратегический пакт с семьёй Ельцина, обеспечив преемственность и защиту активов элит. Совет Федерации превратился в предсказуемый, послушный орган. Ельцин возведён в ранг национальной иконы, чей образ используется для легитимации управляемой демократии, где выборы выигрываются через административный ресурс и повышенный проходной барьер.\n\nЭкономика растёт, коррупция не искоренена, а отлажена, либеральная оппозиция либо кооптирована, либо отодвинута на обочину. Россия больше не пытается разрушать стены; она строит свою собственную, удобную крепость. Западные дипломаты называют это «потёмкинской демократией». В Кремле называют это «единственно возможной стабильностью». Граждане живут лучше, но уже научились не спрашивать, кто за это платит.\n\nНемцов в редком интервью размышляет: «У нас не было выбора. Другого пути? Другого пути не было. Альтернативой был хаос, новый развал. То, что мы построили, не идеально, но это работает. Не спрашивайте меня, свобода ли это. Спросите, в безопасности ли вы». Россия обрела свой путь - путь компромисса, порядка и тихого смирения."
 sov_boriska.41.a: "Другого пути не было"
 sov_boriska.42.t: "Общий стратегический план реформ"
 sov_boriska.42.d: "Президент Борис Немцов выступает с программной телевизионной речью, представляя масштабный «Общий стратегический план реформ», призванный превратить российское государство из оплота «приятельского капитализма» в современный, эффективный и рациональный организм. «Мы не строим новую систему, - заявляет Немцов. - Мы возвращаемся к универсальным принципам рационального управления. Меня вдохновляет не олигархат 90-х, а великий социолог Макс Вебер».\n\nПлан, получивший название «Веберианская рационализация», делает ставку на радикальные реформы: деполитизация бюрократии, создание по-настоящему независимой судебной системы и формирование равных правил для бизнеса, основанных на формальных процедурах, а не на личных связях. «Мы заменим власть людей властью закона», - заявляет президент, признавая потенциальную цену преобразований. «Вебер также предупреждал о "железной клетке" тотальной рационализации. Мы должны быть бдительны и не допустить создания бездушной и стерильной системы».\n\nПолитический истеблишмент ошеломлен. Либералы приветствуют возвращение к модернизационной повестке, в то время как консерваторы критикуют атаку на духовные основы. Международное сообщество наблюдает за самым амбициозным реформаторским проектом России за последнее десятилетие с осторожным интересом."
 sov_boriska.42.a: "К рациональному государству"
 sov_boriska.43.t: "Новые губернаторы, новый курс"
 sov_boriska.43.d: "Президент Борис Немцов заменяет нескольких региональных губернаторов на молодых реформаторов из своей команды - экономистов, юристов и гражданских активистов, проявивших себя на государственной службе. Новые руководители обещают сократить местную бюрократию, привлечь инвестиции и уважать права этнических меньшинств. «Эпоха местных баронов, которые относились к своим регионам как к личным вотчинам, закончена, - говорит Немцов. - Пора передать власть тем, кто будет работать для людей, а не для собственного кармана».\n\nРеакция неоднозначна: в некоторых республиках старая гвардия ворчит о потере уютных договорённостей, а простые граждане с осторожной надеждой ждут лучших школ, дорог и справедливости. Либеральные СМИ называют назначения «второй волной обновления». Компартия называет это «чисткой патриотичных губернаторов». Но настоящее испытание впереди - смогут ли эти молодые технократы устоять перед давлением местных элит и добиться реальных перемен. Пока что окраина Кремля вздыхает чуть свободнее."
 sov_boriska.43.a: "Новое поколение в регионах"
 sov_boriska.44.t: "Голоса с улиц"
 sov_boriska.44.d: "В Казани, Махачкале и Нальчике обычные граждане выходят на улицы - не против Москвы, а против собственных губернаторов. Они обвиняют местные элиты в коррупции, захвате земель и игнорировании нужд простых людей. «Эти люди ведут себя как цари в своих вотчинах», - скандируют протестующие.\n\nПрезидент Немцов использует момент: «Мы вас услышали», - объявляет он, отправляя федеральных инспекторов в регионы. «Кремль не будет защищать местных тиранов». Пока что президент направляет народный гнев на консолидацию своей власти и давление на региональных баронов. Улицы не успокаиваются, но ярость протестующих направлена в сторону от центра - пока что."
 sov_boriska.44.a: "Народ сказал"
 sov_boriska.45.t: "Народный сенат"
 sov_boriska.45.d: "Президент Борис Немцов подписывает закон о введении прямых выборов в Совет Федерации. Отныне жители каждого региона сами выбирают своих сенаторов - не губернаторы, не местные собрания, а сами люди. «Верхняя палата больше не будет клубом назначенцев, - говорит Немцов. - Она станет настоящим голосом регионов».\n\nВ национальных республиках лидеры общин празднуют: наконец они смогут посылать своих, а не кремлёвских ставленников. В старой столице элитные семьи, десятилетиями владевшие сенатскими креслами, ворчат о «хаосе и популизме». На деревенских площадях люди спорят о кандидатах с энергией, невиданной со времён 1990-х. Совет Федерации уже никогда не будет прежним - как и, возможно, сама страна."
 sov_boriska.45.a: "Власть возвращается народу"
 sov_boriska.46.t: "Заря демократии"
 sov_boriska.46.d: "Президент Борис Немцов обращается к нации с трибуны Думы. «Десятилетиями нам говорили, что демократия - это роскошь, которую Россия не может себе позволить, - говорит он. - Что нам нужна твёрдая рука, сильный лидер, единая воля. Но посмотрите, куда это нас привело - не к величию, а к застою, цинизму и страху». Он делает паузу, затем продолжает: «Мы построили нечто иное. Не идеальное, не простое, но настоящее. Местные выборы, свободная пресса, независимые суды, избираемый сенат. Это не скопированная западная демократия. Это российская демократия - шумная, беспорядочная и живая».\n\nТолпа взрывается аплодисментами, либералы плачут, а консерваторы ворчат о «хаосе», но слова президента резонируют далеко за пределами зала, достигая кофеен и заводов, малых городов и больших мегаполисов, где люди начинают верить, что другая Россия возможна. Путь впереди неопределён, но впервые он ведёт к свободе."
 sov_boriska.46.a: "Вперёд, к демократической России"
 sov_boriska.47.t: "«Пытаются себя реабилитировать»"
 sov_boriska.47.d: "Лидер коммунистов Геннадий Зюганов видит в провозглашении президентом Немцовым «ельцинизма с человеческим лицом» окончательное доказательство предательства властью интересов народа. «Элиты 1990-х годов пытаются себя реабилитировать, - гремит он. - Они, под руководством этого "управленца" проводившие преступную приватизацию и обобравшие миллионы граждан, теперь хотят переписать историю и навязать культ человека, который вверг страну в хаос, развязал войну в Чечне и предал всех наших союзников и друзей. Самое поразительное, что кто-то вдруг вознамерился из юбилея Ельцина сделать "большие народные торжества", хотя все здравомыслящие люди запомнят его как разрушителя и предателя всех чаяний простых россиян»."
 sov_boriska.47.a: "Пусть негодуют. Мы идём вперёд"
 sov_boriska.48.t: "«Немцов - сегодняшний Троцкий»"
 sov_boriska.48.d: "Лидер ЛДПР Владимир Жириновский в ярости от нового идеологического поворота Кремля. «Вы только посмотрите, что они творят! - заявляет он в телеэфире. - Они крестят предательство 1990-х и называют это "человеческим лицом"! Я знаю, что сгубило этих людей: Березовского - жадность, Явлинского - упрямство, Немцова - его же собственный радикализм. Немцов - это сегодняшний Троцкий, ждет своего ледоруба. Я не хочу этого, но без ледоруба он никуда не уйдет! Если он не остановит свой радикальный курс, он погубит себя сам»."
 sov_boriska.48.a: "Старый лис обеспокоен"
 sov_boriska.49.t: "«Культ разрушителя»"
 sov_boriska.49.d: "Лидер Компартии Геннадий Зюганов с яростью реагирует на государственную программу прославления Бориса Ельцина. «Они пытаются канонизировать человека, который похоронил Советский Союз, раздал государственную собственность горстке воров и развязал войну против собственного народа в Чечне, - гремит он. - Теперь они переименовывают улицы и раздают медали в его честь, пока миллионы пенсионеров всё ещё сводят концы с концами. Этот культ разрушителя - оскорбление для всех, кто потерял свои сбережения, работу и веру в справедливость в 1990-е. Но историю не перепишут бюрократы и их наёмные пропагандисты. Народ помнит правду - и однажды потребует справедливости»."
 sov_boriska.49.a: "Прошлое не отбелить"
 sov_boriska.50.t: "«Пьяный царь»"
 sov_boriska.50.d: "Владимир Жириновский, никогда не упускающий случая для театрального возмущения, поливает презрением программу «Героизация Ельцина». «Они превращают пьяного скомороха в национальный символ! - ревёт он. - Ельцин отдал Крым, уничтожил армию и танцевал на танковых башнях, пока страна голодала. А теперь требуют, чтобы мы ему поклонялись? Я предупреждал: радикализм всегда плохо кончается. Немцов думал, что оседлает волну ельцинской славы. Вместо этого он строит музей провала. Народ не дурак - он видит, что вся эта помпезность - просто прикрытие для тех же старых элит, которые продали Россию за бесценок. Через десять лет они будут сносить эти памятники с тем же энтузиазмом, с каким устанавливают»."
 sov_boriska.50.a: "Дешёвый популизм"
 sov_boriska.51.t: "Совет экономических советников"
 sov_boriska.51.d: "Президент Немцов собирает команду опытных экономистов - одни из них были частью «молодых реформаторов», построивших рыночную экономику на руинах СССР, другие наблюдали со стороны, критикуя их ошибки. Егор Гайдар, Анатолий Чубайс, Григорий Явлинский, Михаил Задорнов и новое поколение технократов соглашаются отложить старые распри. «1990-е стали травмой для миллионов, - заявляет Немцов. - Мы не можем изменить прошлое, но можем предотвратить вторую травму. Эти люди допускали ошибки - но они единственные, кто действительно понимает механизм реформ. История дала нам один шанс. Мы не должны упустить второй». Совету поручено разработать новую экономическую стратегию: стабильную, социально ответственную и свободную от «шоковой терапии», которая некогда сломала страну."
 sov_boriska.51.a: "Второй шанс начинается"

