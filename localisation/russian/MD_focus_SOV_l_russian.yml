 SOV_warsaw_pact_idea: "Член Варшавского договора"
 faction_warsaw_pact_member: "§RСпециальные правила фракции§!:\n- Вступить во фракцию могут только страны бывшего Варшавского договора\n"
 warsaw_pact_join_faction_rule_tt: "§RТолько бывшие страны Варшавского договора могут присоединиться!§!"
 SOV_warsaw_pact_joint_exercises_idea: "Совместные учения Варшавского договора"
 SOV_warsaw_pact_exercises_south_idea1: "Южные учения Варшавского договора"
 SOV_warsaw_pact_exercises_north_idea: "Северные учения Варшавского договора"
 Sov_warsaw_pact.1.t: "Возрождение Варшавского договора"
 Sov_warsaw_pact.1.d: "За все эти годы \"оккупации\" Западом наш народ понял, что времена, когда СССР защищал братскую Польшу, были прекрасны и полны стабильности. Судьба вновь дает нашей республике шанс снова стать под крыло России."
 Sov_warsaw_pact.1.a: "Давайте подпишем новый Договор!"
 Sov_warsaw_pact.2.t: "Возрождение Варшавского договора"
 Sov_warsaw_pact.2.d: "Произошло то, чего никто не ожидал. Из небытия коммунистического прошлого вернулся Варшавский договор. Коммунистическая революция в Польше и установившийся там пророссийский советский режим возвестили о возрождении этого военного союза. Мир снова стоит на пороге холодной войны."
 Sov_warsaw_pact.2.a: "Да поможет нам Господь"
 Sov_warsaw_pact.3.t: "Польша снова наша"
 Sov_warsaw_pact.3.d: "В Польше произошёл прокоммунистический переворот, и к власти пришло лояльное нам правительство. Мы уже объявили о создании нового Варшавского договора между нами и Польшей, осталось только узаконить эту процедуру."
 Sov_warsaw_pact.3.a: "Слава СССР"
 Sov_warsaw_pact.4.t: "Расширение Варшавского договора"
 Sov_warsaw_pact.4.d: "В связи с недавним восстановлением Варшавского договора многие политики и эксперты задаются вопросом - когда же произойдет новое расширение? Сегодня Варшавский договор празднует новое расширение своего союза. Началась новая \"холодная война\", и влияние США в Восточной Европе постепенно ослабевает."
 Sov_warsaw_pact.4.a: "Ситуация становится ещё более напряжённой..."
 Sov_warsaw_pact.5.t: "Новый союзник и новые возможности"
 Sov_warsaw_pact.5.d: "В очередной раз наша дипломатия показала свою эффективность, в отличие от западной. Новые союзники открывают новые возможности для нашего военного присутствия в Европе и дипломатического давления на страны НАТО. Мы должны продолжать нашу политику, чтобы навсегда закрепить за собой статус сверхдержавы."
 Sov_warsaw_pact.5.a: "Слава Советскому Союзу!"
 Sov_warsaw_pact.6.t: "Вступление в альянс"
 Sov_warsaw_pact.6.d: "Наш народ понял, что Запад нас обманывает. Он использует методы, разрушающие нашу независимость и культуру, а также наше население. Мы должны остановить это, перейдя под крыло нашего давнего союзника - СССР. Вместе мы сможем победить эту западную заразу"
 Sov_warsaw_pact.6.a: "Давайте подпишем новый Договор!"
 sov_warsaw_pact.9.t: "Восстание коммунистов в Восточной Германии"
 sov_warsaw_pact.9.d: "Ситуация вышла из-под контроля. Наши усилия по обеспечению стабильности в стране оказались тщетными, так как в Восточной Германии началось восстание с целью создания независимой ГДР. С помощью военных, а также тайной финансовой и оружейной помощи СССР были захвачены все административные и военные здания на востоке страны. Берлин был отрезан от остальной части страны. Из-за риска быть втянутыми в конфликт с Советами мы вынуждены проводить локальные атаки на территории новообразованной ГДР. Но мы можем начать и прямую интервенцию в зону интересов СССР. Однако это может привести к третьей мировой войне. Что же нам делать?"
 sov_warsaw_pact.9.a: "Мы раздавим их, как клопов!"
 CZR_union: "Чехословакия"
 GER_AUTH_S_communism: "Германская Демократическая Республика"
 GER_REB_S: "Германская Демократическая Республика"
 GER_com_reb_tech: "Германская Демократическая Республика"
 Sov_warsaw_pact.7.t: "Референдум о присоединении к единой стране"
 Sov_warsaw_pact.7.d: "Чешский и словацкий народы не забыли, как не так давно их руководство обмануло их, разделив страну без предупреждения. Теперь у них есть возможность исправить эту историческую ошибку и снова воссоединиться в качестве единой сильной нации. Россия выступит в качестве нейтрального посредника, чтобы обеспечить честный и безопасный процесс референдума."
 Sov_warsaw_pact.7.a: "Пришло время объединиться!"
 Sov_warsaw_pact.8.t: "Протесты в Чехии и Словакии"
 Sov_warsaw_pact.8.d: "По всей Словакии и Чехии вспыхнули массовые протесты. Протестующие обвиняют нынешние правительства в правонарушениях и в том, что они допустили разделение бывшей Чехословакии. Они требуют отставки своих лидеров и проведения национального референдума для пересмотра решения о разделе страны."
 Sov_warsaw_pact.8.a: "Кажется, мир снова погружается в прошлое..."
 SOV_protests_by_scientists_idea: "Протесты учёных из Восточной Германии"
 SOV_protests_by_scientists_idea_desc: "После объединения Германии в 1990 году дипломы многих восточногерманских учёных были признаны недействительными, что привело к массовому сокращению рабочих мест. Недавно эти учёные начали протестовать, требуя признания и справедливости в отношении их заслуг и квалификации."
 SOV_east_german_military_discontent_idea: "Забастовки офицеров армии ГДР"
 SOV_east_german_military_discontent_idea_desc: "После объединения Германии все воинские звания, полученные офицерами из Восточной Германии, были аннулированы. Это вызвало глубокое недовольство среди офицеров, которые считают, что с ними обошлись несправедливо и отодвинули на второй план в новой военной структуре."
 Sov_warsaw_pact.10.t: "Рост популярности ностальгии в Германии"
 Sov_warsaw_pact.10.d: "Движение под названием «Остальгия», романтизирующее жизнь в Восточной Германии, набирает популярность на востоке страны. Хотя оно существовало и раньше, его нынешняя активность встревожила международных экспертов, которые подозревают тайное влияние спецслужб стран Варшавского договора."
 Sov_warsaw_pact.10.a: "Интересно"
 Sov_warsaw_pact.11.t: "Необычная активность в Восточной Германии"
 Sov_warsaw_pact.11.d: "Недавно мы зафиксировали рост подпольной коммунистической активности в Восточной Германии. Наша разведка сообщает о саботаже в армии и замедлении научного прогресса. Судя по всему, эти действия тайно поддерживаются СССР. Для противодействия этим подрывным усилиям были выделены дополнительные государственные средства."
 Sov_warsaw_pact.11.a: "Нам нужно проверить наших сотрудников на предмет сотрудничества"
 SOV_United_Network_of_Warsaw_Pact_Laboratories: "Объединённая сеть лабораторий стран Варшавского договора"
 SOV_Joint_research_on_armor_and_infantry: "Совместные исследования в области бронетехники и пехоты"
 SOV_Joint_aviation_research: "Объединённые авиационные исследования"
 SOV_joint_research_ttip: "§RЭти бонусы можно использовать только один раз, и они распространяются только на страны Варшавского договора. Страны, не входящие в исторический Варшавский договор, не получают этих бонусов. Используйте их, только если вы уверены, что все ваши союзники являются членами договора, так как бонусы получают только они.§!"
 SOV_warsaw_influence_close: "Закрыть решения на революцию в §Y[BUL.GetNameWithFlag]§!"
 SOV_warsaw_influence_close1: "Закрыть решения на революцию в §Y[ROM.GetNameWithFlag]§!"
 SOV_warsaw_influence_close2: "Закрыть решения на революцию в §Y[HUN.GetNameWithFlag]§!"
 SOV_warsaw_influence_close3: "Закрыть решения на революцию в §Y[CZE.GetNameWithFlag]§! and §Y[SLO.GetNameWithFlag]§!"
 Sov_warsaw_pact.12.t: "Начало совместных военных учений стран Варшавского договора"
 Sov_warsaw_pact.12.d: "Объединённый генеральный штаб стран Варшавского договора объявил о начале совместных военных учений. Западные эксперты рассматривают это в первую очередь как демонстрацию силы, направленную на запугивание НАТО и подтверждение военного присутствия стран Варшавского договора."
 Sov_warsaw_pact.12.a: "Трудно поверить, что эти события происходят снова..."
 Sov_warsaw_pact.13.t: "Вооружённое восстание в Восточной Германии"
 Sov_warsaw_pact.13.d: "В Восточной Германии вспыхнуло вооружённое восстание. При финансовой и военной поддержке стран Варшавского договора восточногерманские вооружённые силы захватили контроль над ключевыми учреждениями и объявили о восстановлении Германской Демократической Республики. Восставшие называют воссоединение с Западной Германией серьёзной ошибкой, которую необходимо исправить."
 Sov_warsaw_pact.13.a: "Стоит ли мир на пороге Третьей мировой войны?"
 SOV_Restore_order_on_the_western_border: "Восстановление порядка на западной границе"
 cant_start_exercises_tt: "За один раз можно выполнять только одно упражнение"
 cant_start_exercises1_tt_effect: "§RВы не сможете начать новое упражнение в течение следующих 297 дней.§!"
 cant_start_exercises2_tt_effect: "§RВы не сможете начать новое упражнение в течение следующих 286 дней.§!"
 cant_start_exercises3_tt_effect: "§RВы не сможете начать новое упражнение в течение следующих 275 дней.§!"
 SOV_restoration_of_ovd_tt: "Открывает возможности для восстановления §YВаршавского договора§!"
 SOV_restoration_of_warsaw_pact: "Восстановление Варшавского договора"
 SOV_restoration_of_warsaw_pact_desc: "Ситуация в Восточной Европе становится всё более нестабильной, и несколько бывших союзников по Варшавскому договору уже перешли на сторону НАТО. Чем дольше это будет продолжаться, тем сложнее будет восстановить глобальное влияние. Мы должны вернуть утраченное и восстановить биполярный мировой баланс."
 Sov_warsaw_pact.14.t: "Варшавский договор обеспечивает военную защиту"
 Sov_warsaw_pact.14.d: "Чтобы обеспечить наш суверенитет и защитить нашу родину от внешних угроз, страны Варшавского договора предлагают нам военную защиту. Принятие этого предложения укрепит нашу оборону и обеспечит нашу безопасность."
 Sov_warsaw_pact.14.a: "Пришло время защитить наше Отечество"
 SOV_AUTH_SS: "Российское Советское Национальное государство"
 SOV_soviet_empire: "Советская империя"
 SOV_soviet_empire_DEF: "Советская империя"
 Sov_warsaw_pact.15.t: "Шанс освободиться от российского влияния"
 Sov_warsaw_pact.15.d: "Недавние беспорядки в России дали нам возможность ослабить их влияние на нашу страну. Пока Россия сосредоточена на внутренних проблемах, мы должны решить, оставаться ли нам союзниками или идти своим независимым путём."
 Sov_warsaw_pact.15.a: "Россия больше не является нашим союзником"
 Sov_warsaw_pact.15.b: "Мы остаёмся"
 Sov_warsaw_pact.17.t: "Вторжение в Восточную Германию"
 Sov_warsaw_pact.17.d: "Всего несколько часов назад наши силы в Восточной Германии подверглись нападению, что вынудило наши пограничные войска отступить. Теперь мир стоит на пороге ядерного конфликта. Нам предстоит принять серьёзное решение: защитить наших союзников и рискнуть всем или пожертвовать одним союзником ради сохранения мира."
 Sov_warsaw_pact.17.a: "Мобилизуйте армию, пора выступать!"
 Sov_warsaw_pact.17.b: "Ни один союзник не стоит полного уничтожения планеты"
 WP_escaped: "Покинул нашу сферу влияния"
 Sov_warsaw_pact.16.t: "Восстание увенчалось успехом"
 Sov_warsaw_pact.16.d: "С помощью наших исторических союзников мы взяли под контроль ключевые командные центры в Восточной Германии. Варшавский договор предложил защиту нашего суверенитета в обмен на стратегическое сотрудничество, что укрепило наши позиции."
 Sov_warsaw_pact.16.a: "Слава ГДР и её народу!"
 Sov_warsaw_pact.18.t: "СССР отказывается от помощи"
 Sov_warsaw_pact.18.d: "Чтобы предотвратить Третью мировую войну, СССР выводит свои войска с нашей территории, оставляя нас один на один с угрозами."
 Sov_warsaw_pact.18.a: "Предатели!"
 OVD_raspalsa: "Варшавский договор распался"
 Sov_warsaw_pact.19.t: "СССР выводит войска из Восточной Германии"
 Sov_warsaw_pact.19.d: "Конфликт в Восточной Германии поставил мир на грань войны. Чтобы избежать полномасштабного конфликта, советское руководство отдало приказ о полном выводе войск. Мир внимательно следит за тем, как последний советский солдат покидает недавно провозглашённую Германскую Демократическую Республику."
 Sov_warsaw_pact.19.a: "«В Советской армии для отступления требуется больше мужества, чем для наступления»."
 birth_of_eastern_germany_world_tension: "Восстание в Восточной Германии"
 sov_nationalists.2.t: "Русская революция в нашей стране!"
 sov_nationalists.2.d: "§Y[SOV.GetNameWithFlag]§! подстрекает русскоязычное население нашей страны к восстанию и готовится ввести войска для вмешательства. Напряжённость стремительно растёт."
 sov_nationalists.2.a: "Да поможет нам Бог"
 sov_nationalists_news.1.t: "Жириновский избран президентом"
 sov_nationalists_news.1.d: "После недавних изменений в правительстве к власти в России пришла националистическая партия ЛДПР, возглавляемая [SOV.GetLeader]. Они объявили о радикальной политической программе, включающей восстановление старого флага и реализацию консервативно-националистической повестки."
 sov_nationalists_news.1.a: "Что ждет Россию?"
 sov_nationalists_news.2.t: "Новая Российская Империя"
 sov_nationalists_news.2.d: "В своём телеобращении президент России заявил о намерении возродить Российскую империю любыми средствами. Это встревожило многие страны, особенно бывшие советские республики, которые видят в этом угрозу своему суверенитету. Мир надеется, что эта агрессивная риторика — всего лишь предвыборная кампания."
 sov_nationalists_news.2.a: "Тревожное заявление"
 sov_nationalists_news.3.t: "Московский пакт"
 sov_nationalists_news.3.d: "Лидер России [SOV.GetLeader] объявил о планах по созданию нового военно-экономического союза под названием «Московский пакт» для защиты интересов России и дружественных стран. Он сослался на беспрецедентное давление со стороны Запада и пригласил к участию бывшие советские республики. Эксперты предупреждают, что это сигнал о начале новой холодной войны."
 sov_nationalists_news.3.a: "Тревожное событие"
 sov_nationalists_news.4.t: "Новая столица России"
 sov_nationalists_news.4.d: "[SOV.GetLeader] объявил о планах перенести столицу России из Москвы в исторический город Петроград (бывший Санкт-Петербург) в качестве «восстановления исторической справедливости». Все государственные органы должны переехать в течение года, хотя некоторые предупреждают, что это сделает столицу уязвимой для угроз со стороны НАТО."
 sov_nationalists_news.4.a: "Пытаюсь восстановить прошлое"
 sov_nationalists_news.5.t: "Россия заявляет о своих амбициях"
 sov_nationalists_news.5.d: "В своей смелой речи глава российского государства заявил о претензиях на бывшие имперские территории, обвинив большевиков и Запад в распаде империи. Он обвинил западные страны во вмешательстве и геноциде русского народа, провозгласив «Великую Россию», готовую вернуть себе земли любыми средствами, вплоть до угрозы ядерной войны."
 sov_nationalists_news.5.a: "Только Бог может спасти нас..."
 sov_nationalists_news.6.t: "Верховный правитель России"
 sov_nationalists_news.6.d: "Новая конституция России упраздняет пост президента и заменяет его должностью верховного правителя, обладающего широкими полномочиями, что фактически приводит к централизации всех ветвей власти в руках одного человека. [SOV.GetLeader] заявил о необходимости сильного лидера для восстановления величия России, что ознаменовало начало новой авторитарной эпохи."
 sov_nationalists_news.6.a: "Да здравствует [SOV.GetLeader]!"
 sov_nationalists_news.7.t: "Новая Российская Империя"
 sov_nationalists_news.7.d: "На очередном заседании Государственной Думы президент России [SOV.GetLeader] заявил о необходимости восстановления Российской империи. В своей речи он назвал распад старой империи «исторической ошибкой» и предложил провести Конституционное собрание для принятия новой «Имперской конституции». Для разработки этой конституции и выбора кандидата на роль императора будет сформирован специальный орган — «Временное регентство». Его речь была встречена восторженными аплодисментами представителей правящей партии, а один из депутатов заявил: «Я ждал этого всю свою жизнь». Учитывая массовые чистки в рядах оппозиции и растущую централизацию власти, [SOV.GetLeader] похоже, готов полностью перестроить правительство. Возрождение империи свидетельствует о том, что Россия подтверждает свои притязания на бывшие имперские территории."
 sov_nationalists_news.7.a: "Совершенно неожиданно..."
 sov_nationalists_news.8.t: "Россия поглотит национал-большевиков"
 sov_nationalists_news.8.d: "Президент [SOV.GetLeader] объявил, что несколько ведущих членов Национал-большевистской партии, в том числе её неоднозначный лидер Эдуард Лимонов, войдут в состав российского правительства. Хотя их конкретные должности неизвестны, их приход в правительство знаменует собой серьёзный идеологический сдвиг в сторону национал-большевизма. Эта идеология пропагандирует агрессивную территориальную экспансию на территории бывшего Советского Союза. Запад и страны СНГ готовятся к вероятной эскалации напряжённости."
 sov_nationalists_news.8.a: "Совершенно неожиданно..."
 sov_nationalists_news.9.t: "Коронация Николая Романова"
 sov_nationalists_news.9.d: "Николай Романов был официально коронован как император Российской империи на пышной церемонии, состоявшейся в Успенском соборе Москвы. На мероприятии присутствовали правительственные чиновники, иностранные высокопоставленные лица, монархисты и регент императора [SOV.GetLeader]. В своей речи Николай заявил о своём праве на престол после Николая II и подтвердил легитимность новой империи. Он также публично поддержал [SOV.GetLeader] в качестве главы нового царского правительства. Однако в соответствии с недавно принятой конституцией роль премьер-министра была снижена в пользу императора, что ставит под сомнение будущее влияние [SOV.GetLeader] на государственные дела."
 sov_nationalists_news.9.a: "Империя возвращается."
 sov_nationalists_news.10.t: "Коронация Марии Романовой"
 sov_nationalists_news.10.d: "Мария Романова была коронована как новая императрица России на торжественном мероприятии в Успенском соборе Москвы. На церемонии, выдержанной в имперских традициях, присутствовали государственные чиновники, иностранные лидеры и монархисты, а также регент [SOV.GetLeader]. В своей речи Мария заявила о своём праве на престол после Николая II, подтвердила законность новой империи и выразила намерение назначить [SOV.GetLeader] главой царского правительства. Несмотря на её поддержку, новая конституция наделяет императора большей властью, что делает будущую политическую роль [SOV.GetLeader] неопределённой."
 sov_nationalists_news.10.a: "Империя возвращается."
 sov_nationalists_news.11.t: "Коронация Георгия Романова"
 sov_nationalists_news.11.d: "Георгий Романов взошёл на престол в качестве нового императора России и был коронован в историческом Успенском соборе Москвы. На мероприятии присутствовали государственные чиновники, иностранные высокопоставленные лица и монархисты, а также регент [SOV.GetLeader]. В своей речи Георгий подчеркнул свою связь с Николаем II и заявил о легитимности новой Российской империи. Он также выразил желание назначить [SOV.GetLeader] главой царского правительства. Поскольку конституция смещает баланс власти в сторону императора, роль [SOV.GetLeader] в управлении теперь под вопросом."
 sov_nationalists_news.11.a: "Империя возвращается."
 sov_nationalists_news.12.t: "Коронация Андрея Романова"
 sov_nationalists_news.12.d: "Андрей Романов был коронован как император Российской империи на церемонии, состоявшейся в Успенском соборе Москвы, месте с богатой имперской историей. На коронации присутствовали государственные чиновники, мировые лидеры, монархисты и регент [SOV.GetLeader]. В своём публичном обращении новый император заявил о преемственности по отношению к Николаю II и объявил о возрождении имперского наследия России. Он также назначил [SOV.GetLeader] главой нового царского правительства. Несмотря на это одобрение, новая конституция повышает роль императора, что свидетельствует о возможном снижении влияния [SOV.GetLeader]."
 sov_nationalists_news.12.a: "Империя возвращается."
 sov_nationalists_news.28.t: "Святой Регент России"
 sov_nationalists_news.28.d: "После долгих обсуждений кандидатуры следующего императора России регент [SOV.GetLeader] удивил народ, заявив, что ни один из кандидатов не достоин этой роли. Он распустил Временное правительство и провозгласил себя Святым регентом и единственным законным императором России. Ссылаясь на божественный долг восстановить «историческую справедливость», [SOV.GetLeader] сосредоточил всю власть в своих руках. Хотя законные основания для этого заявления остаются неясными, очевидно, что ни одна внутренняя сила не бросит вызов его власти. Его стремление к экспансии и доминированию теперь ничем не сдерживается."
 sov_nationalists_news.28.a: "Что за безумие!"
 sov_nationalists_news.13.t: "Третий Рим"
 sov_nationalists_news.13.d: "В своём телеобращении [SOV.GetLeader] заявил, что современная Россия вышла за рамки роли простого государства. Он утверждал, что Россия выполнила свою духовную миссию, возродив наследие Римской империи, и поэтому должен возникнуть «Третий Рим». Это заявление ошеломило международных наблюдателей, которые теперь опасаются его возможных геополитических последствий. Этот шаг свидетельствует о фундаментальном изменении самоидентификации России и её будущих амбиций. Возможно, мир становится свидетелем начала новой идеологической эры."
 sov_nationalists_news.13.a: "И что это должно значить?"
 sov_nationalists_news.14.t: "Россия вторгается в Центральную Азию"
 sov_nationalists_news.14.d: "Российское правительство начало полномасштабную военную операцию в Центральной Азии. Москва обвиняет государства Центральной Азии в проведении русофобской политики, притеснении этнических русских и бесконтрольной миграции, которая дестабилизирует ситуацию внутри России. Глава российского государства также заявил, что эти территории по праву принадлежат России. Реакция мирового сообщества была незамедлительной: соседние страны и международные организации осудили агрессию. Ожидается, что за этим последуют санкции и дипломатические ответные меры со стороны Запада."
 sov_nationalists_news.14.a: "Новая эпоха империализма"
 sov_nationalists_news.15.t: "Россия вторгается в Украину"
 sov_nationalists_news.15.d: "Россия объявила о масштабном вторжении в Украину. В своём обращении к нации [SOV.GetLeader] заявил, что территория Украины является частью исконных земель России, и назвал украинское государство «антироссийским проектом». Он назвал современную Украину «Малороссией», а её возвращение — «историческим долгом». Международное сообщество отреагировало незамедлительно. Западные страны заявили, что это вторжение представляет серьёзную угрозу европейской безопасности, и пообещали оказать Украине экономическую и военную поддержку. По мере развития конфликта глобальный баланс сил может вскоре измениться."
 sov_nationalists_news.15.a: "Давайте надеяться на лучшее"
 sov_nationalists_news.16.t: "Россия оказывает давление на Беларусь"
 sov_nationalists_news.16.d: "Россия выдвинула Беларуси официальный ультиматум, потребовав, чтобы она вошла в состав России в качестве полуавтономного региона. Этот ультиматум вызвал шок в международном сообществе. Министерство иностранных дел Беларуси назвало это предложение неожиданным и тревожным. Пока неясно, согласится ли Беларусь на эти требования или же этот шаг является всего лишь стратегическим блефом со стороны Москвы. В условиях высокой напряженности соседние страны внимательно следят за реакцией Минска."
 sov_nationalists_news.16.a: "Какой стресс"
 sov_nationalists_news.17.t: "Россия оказывает давление на страны Балтии"
 sov_nationalists_news.17.d: "В своём тревожном ультиматуме Россия потребовала, чтобы страны Балтии вошли в состав её территории в качестве полуавтономных губерний. Это заявление потрясло международное сообщество. Лидеры стран Балтии провели экстренное совещание, назвав ультиматум «ожидаемым, но глубоко тревожным». Однако выработать единый ответ оказалось непросто. На фоне растущих опасений по поводу военной эскалации над регионом нависла неопределённость, пока лидеры НАТО и ЕС обдумывают свои дальнейшие шаги."
 sov_nationalists_news.17.a: "Какой стресс"
 sov_nationalists_news.18.t: "Россия оказывает давление на Грузию"
 sov_nationalists_news.18.d: "Россия выдвинула Грузии ультиматум, потребовав, чтобы она стала полуавтономной частью Российской Федерации. Правительство Грузии быстро созвало экстренное заседание, назвав ультиматум прямой угрозой. Российские войска уже размещены вблизи непризнанных республик, граничащих с Грузией, что говорит о вероятности военных действий в случае отклонения требований. Ситуация остаётся напряжённой, поскольку Грузия готовится к возможной эскалации."
 sov_nationalists_news.18.a: "Какой стресс"
 sov_nationalists_news.19.t: "Россия оказывает давление на Молдову"
 sov_nationalists_news.19.d: "Молдова стала очередной мишенью для давления со стороны России, которая выдвинула ультиматум с требованием присоединить страну к России в качестве полуавтономной губернии. Молдавские чиновники с тревогой отреагировали на экстренном заседании, назвав присутствие российских войск в Приднестровье зловещим знаком. Правительство готовится к возможному конфликту, а международные наблюдатели выражают обеспокоенность всё более агрессивной позицией Москвы в Восточной Европе."
 sov_nationalists_news.19.a: "Какой стресс"
 sov_nationalists_news.20.t: "Россия заявляет о своих правах в Восточной Азии"
 sov_nationalists_news.20.d: "На пресс-конференции [SOV.GetLeader] заявил о претензиях России на несколько территорий в Восточной Азии, в частности на Монголию и Маньчжурию. Сославшись на стратегическую важность, он объявил эти регионы частью новой политической повестки России. Хотя он заявил, что предпочитает мирное решение, он не исключил и военный вариант. Он также раскритиковал исторические действия Японии и потребовал публичных извинений. В ответ Монголия, Китай и Япония осудили заявления России как провокационные и нереалистичные. Сейчас регион находится в напряжении, опасаясь возобновления нестабильности"
 sov_nationalists_news.20.a: "Я надеюсь, что это всего лишь слова"
 sov_nationalists_news.21.t: "Россия оказывает давление на Монголию"
 sov_nationalists_news.21.d: "Россия выдвинула Монголии ультиматум, потребовав, чтобы она стала полуавтономной областью под контролем России. Правительство Монголии назвало этот ультиматум тревожным сигналом и созвало экстренное совещание для оценки угрозы. Международное сообщество внимательно следит за развитием событий, не зная, является ли это признаком реальной агрессии или намеренного запугивания. В любом случае баланс сил в регионе может измениться."
 sov_nationalists_news.21.a: "Какой стресс"
 sov_nationalists_news.22.t: "Россия расширяет своё присутствие в Тихоокеанском регионе"
 sov_nationalists_news.22.d: "Во время заседания ООН премьер-министр Японии обвинил Россию в значительном наращивании военного присутствия в Тихом океане. Он предупредил, что такие действия могут свидетельствовать о подготовке к будущему вторжению. Представитель России в ООН отверг эти обвинения, настаивая на том, что наращивание сил связано с предстоящими военными учениями. Несмотря на это, напряжённость в отношениях между двумя странами продолжает расти, и вероятность конфликта становится всё более очевидной. Дипломатические каналы пока остаются открытыми."
 sov_nationalists_news.22.a: "Какой стресс"
 sov_nationalists_news.23.t: "Россия оказывает давление на Армению"
 sov_nationalists_news.23.d: "Недавно Россия предложила Армении присоединиться к российскому государству с широкой автономией и обещанием территориальной реституции. Предложение также содержало завуалированную угрозу военного вмешательства в случае отказа Армении. Армянские официальные лица назвали это предложение «странным и пугающим» и в настоящее время обсуждают, как на него реагировать. Этот ультиматум вызвал беспокойство в международном сообществе, поскольку регион внимательно следит за решением Армении."
 sov_nationalists_news.23.a: "Какое странное ультиматум"
 sov_nationalists_news.24.t: "Операция \"Гриль\""
 sov_nationalists_news.24.d: "Россия начала военную операцию против Азербайджана, обвинив его в дестабилизации региона и геноциде русского и армянского народов. Министерство иностранных дел заявило, что Россия несёт моральную ответственность за защиту христиан на Кавказе. Аналитики считают, что операция также направлена на защиту ценных нефтяных запасов Азербайджана, которые могут быть движущей силой этой кампании. Международная реакция была быстрой и резкой, вызвав опасения по поводу дальнейшей эскалации в регионе."
 sov_nationalists_news.24.a: "Довольно пугающе."
 sov_nationalists_news.29.t: "Военные учения на границе с Турцией"
 sov_nationalists_news.29.d: "Россия начала масштабные совместные военные учения вблизи турецкой границы. Согласно официальным заявлениям, учения призваны имитировать ответ на гипотетическое вторжение «неоимпериалистических сил». Учения включают в себя воздушные операции, моделирование боевых действий в городских условиях и морские вторжения. Турция решительно осудила эти манёвры, предупредив, что они напоминают подготовку к полномасштабному конфликту. Ситуация привела к росту напряжённости в регионе и вызвала обеспокоенность международного сообщества."
 sov_nationalists_news.29.a: "Довольно пугающе."
 sov_nationalists_news.25.t: "Россия объявляет новый крестовый поход"
 sov_nationalists_news.25.d: "В своём неоднозначном обращении глава российского государства заявил, что христианское население на Востоке подвергается гонениям и геноциду. Он призвал Россию взять на себя роль защитника мирового христианства. Объявив о начале «Нового крестового похода», он пообещал защищать христианские общины и сохранять их культурное наследие любыми средствами. Это заявление вызвало возмущение во всём исламском мире. В едином порыве исламские страны пообещали противостоять любой агрессии и защищать свой суверенитет."
 sov_nationalists_news.25.a: "Аве Мария!"
 sov_nationalists_news.26.t: "Россия планирует интегрировать Стамбул"
 sov_nationalists_news.26.d: "После военных действий России в Турции глава российского государства посетил Стамбул и объявил о планах по присоединению города к России. Он заявил, что Стамбул будет переименован в Константинополь. Кроме того, он подчеркнул необходимость проведения масштабных полицейских операций для ликвидации оставшихся в городе ячеек сопротивления. Это заявление вызвало бурную реакцию международного сообщества: многие расценили его как символическую провокацию и стратегический ход."
 sov_nationalists_news.26.a: "Интересно."
 sov_nationalists_news.27.t: "Россия бросает вызов Европе"
 sov_nationalists_news.27.d: "В своей смелой речи перед высокопоставленными чиновниками [SOV.GetLeader] обвинил западные державы в том, что они спровоцировали распад Российской империи и Советского Союза. Он заявил, что давняя цель Запада — держать Россию слабой и разобщённой. Объявив о конце западной гегемонии, он заявил о праве России на лидерство в Европе. Европейские лидеры быстро отреагировали, предупредив, что конфликт с Россией может вскоре стать неизбежным. Оборонные бюджеты уже увеличиваются, а военная готовность пересматривается по всему континенту."
 sov_nationalists_news.27.a: "Интересно."
 sov_sover_state.1.t: "§Y[SOV.GetNameWithFlag]§! предлагает нам идею возрождения авианосца"
 sov_sover_state.1.d: "§YСоюз суверенных государств§! был распущен ещё до того, как его удалось создать, во время политического хаоса, вызванного попыткой ГКЧП захватить власть в Москве. Теперь эта инициатива возродилась с новой силой. Этот проект даёт второй шанс на объединение постсоветских государств в рамках новой, более гибкой структуры. Это предложение может изменить региональный порядок."
 sov_sover_state.1.a: "Мы согласны участвовать в этом"
 sov_sover_state.1.b: "Мы не заинтересованы в этом"
 sov_sover_state.2.t: "Грузинский конфликт - Голосование"
 sov_sover_state.2.d: "Мы должны наконец определить будущее Грузии и её отделившихся регионов. Должна ли Грузия быть восстановлена в полном составе, или Абхазия и Южная Осетия останутся независимыми и станут членами Союза суверенных государств? Результат этого голосования может определить границы региона на долгие годы."
 sov_sover_state.2.a: "Грузия должна быть целой и неделимой"
 sov_sover_state.2.b: "Абхазия и Южная Осетия - независимые государства"
 sov_sover_state.3.t: "Грузинский конфликт - Голосование"
 sov_sover_state.3.d: "Результаты налицо: Абхазия и Южная Осетия объявлены законными территориями, которые должны быть возвращены нам. Это решение подтверждает наши исторические притязания и является дипломатической победой. Международное сообщество внимательно следит за развитием ситуации."
 sov_sover_state.3.a: "Мы победили!"
 sov_sover_state.4.t: "Грузинский конфликт - Голосование"
 sov_sover_state.4.d: "Грузинский конфликт - Голосование"
 sov_sover_state.4.a: "Мы победили!"
 sov_sover_state.5.t: "Декларация о Союзе Суверенных Государств"
 sov_sover_state.5.d: "Нам на рассмотрение представлен окончательный проект договора. Теперь нам предстоит решить, подписывать ли его и официально вступать ли в Союз суверенных государств. Этот выбор определит нашу роль в новом региональном альянсе."
 sov_sover_state.5.a: "Да"
 sov_sover_state.5.b: "Нет"
 sov_sover_state.6.t: "Союз Суверенных Государств"
 sov_sover_state.6.d: "Процесс подписания завершён, и Союз суверенных государств официально учреждён. Это историческое событие знаменует начало новой эры сотрудничества, взаимного развития и совместного управления между его членами."
 sov_sover_state.6.a: "Ура!"
 sov_sover_state.7.t: "Абхазия и Южная Осетия остаются независимыми государствами"
 sov_sover_state.7.d: "Результаты голосования в государствах — членах Союза Суверенных Государств подтвердили, что Абхазия и Южная Осетия останутся независимыми. Теперь этим республикам будет предложено стать полноправными членами союза. Это решение может иметь далеко идущие последствия для региональной дипломатии."
 sov_sover_state.7.a: "Интересно"
 sov_sover_state.8.t: "Грузия получает свои территории обратно"
 sov_sover_state.8.d: "По итогам голосования среди будущих членов Союза суверенных государств было объявлено, что отделившиеся грузинские территории должны немедленно вернуться в состав Грузии. Этот шаг рассматривается как шаг к восстановлению территориальной целостности грузинского государства."
 sov_sover_state.8.a: "Интересно"
 sov_sover_state.9.t: "Армяно-Азербайджанский конфликт"
 sov_sover_state.9.d: "Нагорный Карабах на протяжении десятилетий был источником ожесточённых конфликтов и глубоких национальных разногласий. Теперь пришло время определить его законного владельца. Кому он должен принадлежать — Армении или Азербайджану? Ответ на этот вопрос будет иметь долгосрочные последствия для обеих стран и всего региона."
 sov_sover_state.9.a: "Карабах принадлежит Азербайджану"
 sov_sover_state.9.b: "Карабах принадлежит Армении"
 sov_sover_state.10.t: "Армяно-Азербайджанский конфликт"
 sov_sover_state.10.d: "После обсуждения членами Союза суверенных государств было принято решение: Нагорный Карабах будет передан Азербайджану. Такой исход может привести к возобновлению напряжённости и, скорее всего, станет предметом международного разбирательства."
 sov_sover_state.10.a: "Интересно"
 sov_sover_state.11.t: "Армяно-Азербайджанский конфликт"
 sov_sover_state.11.d: "Голосование среди будущих членов Союза суверенных государств завершилось принятием решения о передаче Нагорного Карабаха Армении. Это решение, скорее всего, вызовет бурную реакцию в Баку и за рубежом, что может привести к геополитическим последствиям."
 sov_sover_state.11.a: "Интересно"
 sov_sover_state.12.t: "Армяно-Азербайджанский конфликт"
 sov_sover_state.12.d: "Второе голосование вновь подтвердило, что Нагорный Карабах будет признан частью Азербайджана. Это решение ещё больше укрепляет позиции Баку, но может привести к эскалации конфликта в регионе."
 sov_sover_state.12.a: "Интересно"
 sov_sover_state.13.t: "Армяно-Азербайджанский конфликт"
 sov_sover_state.13.d: "Союз суверенных государств провёл ещё одно голосование, по итогам которого было принято решение признать Нагорный Карабах территорией Армении. Ожидается, что эта резолюция приведёт к эскалации дипломатической напряжённости в отношениях с Азербайджаном."
 sov_sover_state.13.a: "Интересно"
 sov_sover_state.14.t: "Союз Суверенных Государств"
 sov_sover_state.14.d: "§Y [FROM.GetNamewithFlag] §! официально согласилась стать кандидатом на вступление в Союз суверенных государств. Это важный шаг на пути к созданию единой конфедерации суверенных республик."
 sov_sover_state.14.a: "Ура!"
 sov_sover_state.15.t: "Союз Суверенных Государств"
 sov_sover_state.15.d: "§Y[FROM.GetNamewithFlag]§! подписал официальное соглашение о присоединении к Союзу суверенных государств. Это означает их официальное вступление в союз и укрепляет альянс."
 sov_sover_state.15.a: "Ура!"
 sov_sover_state.16.t: "Крымский конфликт"
 sov_sover_state.16.d: "После того как Россия аннексировала Крым, статус региона в составе Союза суверенных государств теперь пересматривается. Должен ли Крым оставаться под контролем России или его следует вернуть Украине? Результаты этого голосования будут иметь серьёзные последствия для авторитета союза."
 sov_sover_state.16.a: "Крым должен остаться российским"
 sov_sover_state.16.b: "Крым должен снова стать украинским"
 sov_sover_state.17.t: "Крымский конфликт"
 sov_sover_state.17.d: "Государства-члены Союза суверенных государств проголосовали за возвращение Крыма в состав §Y[UKR.GetNamewithFlag]§!. Это решение может вызвать негативную реакцию в России и знаменует собой смелый шаг на пути к разрешению конфликта и восстановлению легитимности."
 sov_sover_state.17.a: "Интересно"
 sov_sover_state.18.t: "Крымский конфликт"
 sov_sover_state.18.d: "Союз Суверенных Государств проголосовал за признание Крыма частью §Y[SOV.GetNamewithFlag]§!. Это решение поддерживает позицию России и укрепляет её притязания, но, безусловно, вызовет бурную реакцию со стороны Украины и Запада."
 sov_sover_state.18.a: "Интересно"
 sov_sover_state.19.t: "Крымский конфликт"
 sov_sover_state.19.d: "Голосование в Союзе суверенных государств подтвердило, что Крым является территорией §Y[UKR.GetNamewithFlag]§!. Это решение, скорее всего, усилит напряжённость в отношениях с Россией, но рассматривается как победа украинского суверенитета."
 sov_sover_state.19.a: "Интересно"
 sov_sover_state.20.t: "Крымский конфликт"
 sov_sover_state.20.d: "Союз Суверенных Государств объявил Крым законной территорией §Y[SOV.GetNamewithFlag]§!. Это решение усиливает контроль Москвы и подтверждает её доминирование на полуострове, что ещё больше обостряет международные отношения."
 sov_sover_state.20.a: "Интересно"
 autonomy_union_ss: "Федеративная суверенная республика"
 SOV_reassure_ruthenia: "Проект Союз Суверенных Государств"
 SOV_reassure_ruthenia_desc: "Мы стремимся возродить давно забытый проект Союза суверенных государств — конфедеративную альтернативу СССР. Приглашая отдельные страны, мы надеемся восстановить региональное единство на новой основе, исправив недостатки советского наследия."
 SOV_Sign_mutual_cooperation_agreements: "Членство в союзном государстве"
 SOV_Sign_mutual_cooperation_agreements_desc: "Мы обратимся к нескольким странам с предложением присоединиться к Союзному государству. Эти страны, скорее всего, получат выгоду от нашего коллективного процветания и региональной стабильности и внесут свой вклад в их обеспечение."
 SOV_Putting_out_the_fire_in_the_post-Soviet_space: "Объявить о церемонии подписания соглашения"
 SOV_Putting_out_the_fire_in_the_post-Soviet_space_desc: "Мы официально объявим дату церемонии подписания Договора о союзе. Это событие определит, какие страны готовы присоединиться к нашему союзу и работать вместе для достижения общих целей."
 SOV_Gorbachev_dream: "Расширить союзное государство"
 SOV_Gorbachev_dream_desc: "Церемония основания завершена. Уладив формальности, мы продолжим расширять Союзное государство, укрепляя его присутствие и влияние на всём постсоветском пространстве."
 SOV_ssg_category: "Союз Суверенных Государств"
 SOV_ssg_category_desc: "Союз суверенных государств задумывался как реформированная версия СССР — более мягкая, децентрализованная и конфедеративная по своей природе. Сегодня у нас есть шанс воплотить эту идею в жизнь, исправить прошлые ошибки и построить более сильное будущее."
 SOV_conflict_geo: "Вынесите на голосование резолюцию о §YКонфликте в Грузии§!"
