 pmc_african_corps_TT: "§Y[SOV.GetFlag]Африканский корпус§! не §Gнанят§!"
 russia.108.t: "Военный мятеж генералов"
 russia.108.d: "Наше восхождение к власти не понравилось многим представителям населения и российским властям. Неожиданно генералы Шойгу и Герасимов поспешно покинули Москву, собрали своих сторонников в Татарстане и Туве и объявили нам войну. Это предательство потрясло нацию."
 russia.108.a: "Проклятые предатели!"
 russia.109.t: "Росгвардия начала бунтовать"
 russia.109.d: "Мятеж, поднятый генералами Шойгу и Герасимовым, погрузил страну в хаос. Теперь к восстанию присоединился глава Росгвардии Золотов со своими верными войсками, бросив вызов нашему правительству и усугубив гражданскую войну."
 russia.109.a: "Гвардия предателей!"
 russia.110.t: "Правительство предало нас"
 russia.110.d: "Государственные чиновники во главе с Володиным ввели военное положение в подконтрольных им регионах. Армия расколота, что вынуждает нас противостоять не только повстанцам, но и бывшим союзникам, которые теперь лояльны к противоборствующим чиновникам."
 russia.110.a: "Чиновники - как крысы"
 russia.111.t: "Коммунистическое восстание"
 russia.111.d: "Волгоград стал оплотом нового коммунистического восстания. Несколько регионов объявили о своей независимости и стремятся воссоздать аналог СССР. Появился новый опасный враг."
 russia.111.a: "Теперь есть и эти"
 russia.112.t: "Новая чеченская война"
 russia.112.d: "Чеченское правительство объявило нам войну, нарушив свои обязательства перед Россией. Они отказываются поддерживать страну, которая не смогла гарантировать им выживание и независимость."
 russia.112.a: "На этот раз мы должны их прикончить"
 russia.113.t: "Разгневанные патриоты восстают"
 russia.113.d: "Игорь Стрелков, известный военный ветеран и патриот, недавно прибыл в Донецк. Он призвал жителей Донбасса противостоять нам и правительству, которое они считают коррумпированным и преступным."
 russia.113.a: "Донбасс предал нас."
 russia.114.t: "Сибирь восстаёт"
 russia.114.d: "Сибирские активисты объявили о создании своей республики на Дальнем Востоке, отказавшись признавать наше правительство. Это отделение отрезает нас от жизненно важных восточных территорий и ресурсов."
 russia.114.a: "Мы к ним ещё вернёмся."
 russia.115.t: "Возвращение Уральской республики"
 russia.115.d: "Уральская республика, созданная по инициативе губернатора Росселя в конце 90-х годов, была упразднена Ельциным. Сейчас среди уральцев вновь вспыхивают реваншистские настроения, и они работают над возрождением бывшей республики."
 russia.115.a: "Урал заплатит за это."
 russia.116.t: "Восстание на Севере"
 russia.116.d: "В условиях хаоса либеральные активисты на севере России сформировали правительство, которое стремится противостоять нам и свергнуть нас. Их появление открывает новый фронт в охвативших страну беспорядках."
 russia.116.a: "Даже эти?!"
 russia.117.t: "Спасибо, что выбрали Россию!"
 russia.117.d: "Начальная сборка Era of Nations сохраняет унаследованный контент России. Дальнейшая разработка будет описана в журнале изменений проекта.\n\nАвторы исходного контента указаны в документации."
 russia.117.a: "Спасибо"
 russia.118.t: "Судьба крейсера \"Баку\""
 russia.118.d: "Судьба крейсера «Баку» была неопределённой на протяжении многих лет. С 90-х годов Индия проявляла интерес к его покупке. Теперь мы должны решить, оставить ли крейсер в составе нашего флота и модернизировать его или продать Индии, чтобы получить средства."
 russia.118.a: "Обновите его"
 russia.118.b: "Продай его"
 NOV_limonka: "Новороссия"
 georgia_broken_relations: "Испорченные отношения с Грузией"
 russia.200.t: "Хорошие новости с Байконура"
 russia.200.d: "Сегодня команда по ремонту «Бурана» подтвердила, что шаттл был успешно вывезен из стареющего ангара, ознаменовав начало процесса его демонтажа. Для разборки конструкции был собран опытный коллектив инженеров."
 russia.200.a: "Как и было задумано"
 russia.300.t: "Средства на «Буран» разворованы"
 russia.300.d: "Средства, выделенные на программу восстановления «Бурана», якобы были разворованы, что привело к перераспределению критически важных ресурсов от проекта. Попытки выявить виновного на данный момент не увенчались успехом. Исчезновение финансовых документов и коррупция на высоком уровне затруднили расследование."
 russia.300.a: "Черт!"
 russia.301.t: "Международное сообщество переполнено восхищением"
 russia.301.d: "Благодаря нашим драконовским, но успешным усилиям по ремонту шаттла «Буран», международное сообщество было очаровано нашими достижениями. Мы можем воспользоваться этим моментом глобального признания и максимально увеличить его влияние, пока внимание приковано к нам."
 russia.301.a: "Отдайте должное инженерам!"
 russia.301.b: "Кредит [SOV.GetLeader]!"
 russia.302.t: "Шаттл «Буран» отремонтирован"
 russia.302.d: "После месяцев кропотливой работы шаттл «Буран» полностью восстановлен и готов к новой главе в освоении космоса. Каждая гайка, каждая деталь были тщательно проверены, а успешный испытательный полёт подтвердил его готовность. Теперь он подготовлен к будущим миссиям — это триумфальный момент для России. Возрождение легендарного корабля, который когда-то считался утерянным навсегда."
 russia.302.a: "Шаг вперёд в исследовании космоса!"
 russia.3022.t: "Шаттл «Буран» отремонтирован Россией"
 russia.3022.d: "После месяцев кропотливой работы шаттл «Буран» полностью восстановлен и готов к новой главе в освоении космоса. Каждая гайка, каждая деталь были тщательно проверены, а успешный испытательный полёт подтвердил его готовность. Теперь он подготовлен к будущим миссиям — это триумфальный момент для России. Возрождение легендарного корабля, который когда-то считался утерянным навсегда."
 russia.3022.a: "Шаг вперёд в исследовании космоса!"
 russia.303.t: "«Буран», находящийся на ремонте, был уничтожен в результате пожара в ангаре"
 russia.303.d: "16 июня 2003 года произошла катастрофа — пожар охватил временный ангар, где ремонтировался космический корабль «Буран», полностью уничтожив его. Все усилия по восстановлению и подготовке аппарата к будущим миссиям были сведены к пеплу. Эта потеря стала трагическим концом, прервавшим потенциальное триумфальное возвращение «Бурана» в небо."
 russia.303.a: "Мечты, которые никогда не сбудутся"
 russia.3033.t: "«Буран», находящийся на ремонте, был уничтожен в результате пожара в ангаре"
 russia.3033.d: "16 июня 2003 года произошла катастрофа: пожар охватил временный ангар, где ремонтировался космический корабль «Буран», полностью его уничтожив. После всех усилий по восстановлению и подготовке к будущим миссиям наследие «Бурана» было сведено к пеплу. Эта утрата стала разрушительной, трагическим концом того, что могло бы стать триумфальным возвращением корабля в небо."
 russia.3033.a: "Мечты, которые никогда не сбудутся"
 russia.304.t: "«Буран» был уничтожен при обрушении ангара"
 russia.304.d: "12 мая 2002 года произошла трагедия: шаттл «Буран» был потерян при разрушении ангара, что положило конец его истории, превратив его в груду обломков и унесло несколько жизней. Этот когда-то гордый символ космических исследований был сведён к руинам, уже никогда не взлетит. Это было душераздирающее завершение судьбы судна, которое олицетворяло столь много надежд и амбиций, теперь навсегда ставшего недостижимым."
 russia.304.a: "Мечты, которые никогда не сбудутся"
 russia.3044.t: "«Буран» был уничтожен при обрушении ангара"
 russia.3044.d: "12 мая 2002 года произошла трагедия: шаттл «Буран» был потерян при разрушении ангара, что положило конец его истории, превратив его в груду обломков и унесло несколько жизней. Этот когда-то гордый символ космических исследований был сведён к руинам, уже никогда не взлетит. Это было душераздирающее завершение судьбы судна, которое олицетворяло столь много надежд и амбиций, теперь навсегда ставшего недостижимым."
 russia.3044.a: "Мечты, которые никогда не сбудутся"
 SOV_funding_success: "Успешно профинансировал проект"
 SOV_disaster_averted: "Катастрофа предотвращена"
 SOV_mission_space_ended: "«Буран» был отремонтирован"
 SOV_putin_sofbez: "Совет Безопасности Российской Федерации"
 SOV_putin_sofbez_desc: "Когда страна находится на грани катастрофы, нет необходимости принимать решения в одиночку. Совет Безопасности станет отличным консультативным органом для решения судьбы страны в чрезвычайно опасной и негативной ситуации."
 SOV_putin_fsnp: "Упразднить Федеральную службу налоговой полиции"
 SOV_putin_fsnp_desc: "Мы намерены ликвидировать несколько ненужных министерств, и Федеральная налоговая полиция будет одним из них. Мы передадим ее функции Министерству внутренних дел."
 SOV_putin_sovereign_democracy: "Суверенная Демократия"
 SOV_putin_sovereign_democracy_desc: "Пришло время четко определить, что такое наш политический режим. Владислав Сурков, заместитель главы Администрации Президента, похоже, готов озвучить концепцию суверенной демократии."
 SOV_putin_soviet: "Восхваление советского периода"
 SOV_putin_soviet_desc: "1990-е годы были эпохой разрушения, принижения и оскорбления советского наследия, но мы вернемся к культу восхваления советского наследия."
 SOV_putin_finmon: "Создать Росфинмониторинг"
 SOV_putin_finmon_desc: "Необходимо активно бороться с отмыванием денег и другой коррупционной деятельностью в финансовом секторе, поэтому мы создадим новое министерство."
 SOV_putin_fts: "Создать Федеральную таможенную службу"
 SOV_putin_fts_desc: "Государственный таможенный комитет не работает эффективно, поэтому мы готовы создать новое министерство для совершенствования таможни."
 SOV_putin_fms: "Создать Федеральную Миграционную Службу"
 SOV_putin_fms_desc: "Миграционный контроль в Министерстве внутренних дел был не очень эффективным, поэтому мы выделим Миграционную службу в отдельное подразделение"
 SOV_putin_rise_nabi: "Главным регулятором является Центральный банк"
 SOV_putin_rise_nabi_desc: "Мы намерены передать многие функции регулятора на фондовой бирже и в других секторах экономики центральному банку, чтобы сконцентрировать весь контроль в наших руках."
 SOV_putin_chistki: "Политические чистки"
 SOV_putin_chistki_desc: "Пришло время покончить с вражеской оппозицией в стране"
 SOV_medvedev_rkn: "Роскомнадзор"
 SOV_medvedev_rkn_desc: "Цифровая эпоха требует цифровой защиты, и мы готовы создать специальное министерство, которое займется вопросами цифровой безопасности и гигиены в стране."
 SOV_putin_ukraine_yanuk: "Поддержать Януковича"
 SOV_putin_ukraine_yanuk_desc: "Мы намерены поддерживать Януковича как человека, который, будучи президентом Украины, несомненно проявит лояльность по отношению к нашей стране."
 SOV_putin_moldova_resolve: "Меморандум Козака"
 SOV_putin_moldova_resolve_desc: "Мы готовы раз и навсегда решить приднестровский вопрос. Пришло время обратиться к молдавскому правительству с нашим решением."
 SOV_dimon_kazakhstan: "Решение казахстанского вопроса"
 SOV_dimon_kazakhstan_desc: "Казахстан долгое время верил, что может играть на обеих сторонах, не выбирая, на чьей стороне он будет выступать в предстоящем переделе мира. Мы решим это за него."
 SOV_dimon_georgia: "Решение грузинского вопроса"
 SOV_dimon_georgia_desc: "Грузинский вопрос еще не решен, и настало время его решить"
 SOV_dimon_supreme: "Сильная власть — сильный лидер"
 SOV_dimon_supreme_desc: "Президент, генеральный секретарь, царь - Россией всегда управлял один человек, поэтому сильный лидер делает страну сильной."
 SOV_pipa_rkn: "Усилить хватку Роскомнадзора"
 SOV_pipa_rkn_desc: "Вражеская пропаганда, кибератаки и другие вражеские инструменты влияют на умы наших граждан, и мы должны защищать их на благо государства"
 SOV_dimon_attack_south: "Конец K-pop'a"
 SOV_dimon_attack_south_desc: "Братские народы КНДР и России готовы положить конец эпидемии южнокорейского Кей-попа"
 SOV_dimon_azeri: "Падение Азербайджана"
 SOV_dimon_azeri_desc: "Азербайджан - государство, которое угнетает малые народы на своей территории, и пришло время это исправить"
 SOV_putinism_idea: "Путинизм"
 SOV_medvedism_idea: "Медведизм"
 SOV_may_decrees_idea: "Майские указы "
 sov_putin.1.t: "Меморандум Козака"
 sov_putin.1.d: "Администрация президента России разработала план урегулирования приднестровского конфликта и готова оказать нам содействие в его реализации. Согласно меморандуму, предусматривается создание приднестровского и гагаузского автономных районов в составе нашей страны, что по сути ведет к федерализации нашей страны. Кроме того, Россия на определенный срок сохраняет военную базу на нашей территории."
 sov_putin.1.a: "Мы согласны"
 sov_putin.1.b: "Этот вариант нам не подходит"
 sov_putin.2.t: "Меморандум Козака"
 sov_putin.2.d: "Молдавское правительство согласилось принять наш меморандум, и таким образом нам удалось разрешить дипломатический конфликт в бывшем СССР."
 sov_putin.2.a: "Отлично"
 sov_putin.3.t: "Меморандум Козака"
 sov_putin.3.d: "Молдавское правительство отвергло нашу идею федерализации их страны, и, похоже, им нравится замороженный конфликт."
 sov_putin.3.a: "Печально"
 sov_medvedev.2.b: "Давайте сдадимся и спасем свои жизни."
 sov_medvedev.9.t: "Российская угроза"
 sov_medvedev.9.d: "В своем обращении к нам президент России заявил о необходимости возвращения Северного Казахстана в Россию-матушку. Мы воспринимаем это как угрозу. Теперь мы сталкиваемся с угрозой со стороны нашего бывшего соседа, России, и должны решить, что делать."
 sov_medvedev.9.a: "Мы не сдадимся."
 sov_medvedev.9.b: "Давайте сдадимся и спасем свои жизни."
 sov_medvedev.10.t: "Северный Казахстан возвращен"
 sov_medvedev.10.d: "Казахстанское правительство осознало реалии и пошло навстречу нашим требованиям, и теперь эти земли вернулись на свою исконную родину."
 sov_medvedev.10.a: "Отлично"
 sov_medvedev.11.t: "Гражданская война"
 sov_medvedev.11.d: "Неожиданно утром в нескольких регионах нашей страны вспыхнуло восстание, и национальные меньшинства подняли вооруженное восстание против нашей армии и нашего государства. Это вызывает много вопросов о том, где они взяли оружие и кто смог спонсировать такое массовое восстание, но у нас есть догадка."
 sov_medvedev.11.a: "Давайте защитим страну!"
 sov_medvedev.12.t: "[FROM.GetName] запрашивает поддержку"
 sov_medvedev.12.d: "Нам удалось организовать восстание в Азербайджане, и одна из национальных групп просит нашу страну о помощи и непосредственном участии в их защите. Каким будет наш ответ?"
 sov_medvedev.12.a: "Наступил конец \"помидоров\""
 sov_medvedev.12.b: "Мы не должны вмешиваться."
 sov_medvedev.13.t: "[FROM.GetName] предлагает нападение на Южную Корею"
 sov_medvedev.13.d: "Российский лидер заявил, что готов совместно с нами провести военную операцию против Южной Кореи, чтобы наконец решить эту проблему, которая существует уже полвека."
 sov_medvedev.13.a: "K-POP должен быть уничтожен"
 sov_medvedev.13.b: "Нет"
 sov_medvedev.14.t: "Милиция переименована в полицию"
 sov_medvedev.14.d: "Президент Дмитрий Медведев подписал закон «О полиции», ознаменовавший собой ключевую реформу правоохранительной системы. В результате реформы название «милиция» было изменено на «полиция». Реформа направлена на сокращение бюрократических проволочек и укрепление партнёрских отношений между полицией и гражданским обществом. Также были пересмотрены обязанности, права и ответственность сотрудников полиции."
 sov_medvedev.14.a: "Это меняет всё."
 sov_medvedev.15.t: "Путин едет в Пикалёво"
 sov_medvedev.15.d: "На фоне глубокого финансового кризиса два из трёх ключевых промышленных предприятий города Пикалёво были закрыты, что привело к безработице и отчаянию среди рабочих. Начались массовые протесты, что вынудило правительство вмешаться. Путин лично посетил город, вызвал к себе причастных олигархов и потребовал возобновить работу заводов, продемонстрировав свою власть над экономической элитой России."
 sov_medvedev.15.a: "Ручку мне верните!"
 SOV_putin_kozak_memorandum_tt: "§YМолдова§! §Gсогласится§! с меморандумом, если у вас есть §Yвысокий уровень§! влияния или связей."
 SOV_skolkovo_tech_bonus: "Сколково"
 SOV_petroruble: "Нефть за рубли"
 SOV_petroruble_desc: "Пришло время наконец изменить геополитическую ситуацию, и мы готовы перейти на рубль в торговле нефтью с другими странами"
 SOV_pipa_shaman: "Укрепить пропагандистскую машину"
 SOV_pipa_shaman_desc: "Пропагандистская машина долгое время была слабой, но пришло время укрепить ее, поскольку трудные времена требуют сплочения нации."
 SOV_dimon_soo_abk: "Аннексировать непризнанные республики"
 SOV_dimon_soo_abk_desc: "Непризнанные республики, возникшие в 1990-х годах, никогда не были ликвидированы нашим руководством путем их включения в состав России. Пришло время это исправить."
 SOV_dimon_pipa_militaries: "Военные должны руководить"
 SOV_dimon_pipa_militaries_desc: "Военные должны стать новым социальным слоем, который поведет страну в светлое будущее, потому что именно они пролили свою кровь за нашу страну."
 sov_putin.3.b: "Может ебанём?"
 sov_putin.4.t: "Вторжение в Молдову"
 sov_putin.4.d: "Россия готова предложить радикальное решение Молдавского вопроса и готова помочь нам провести специальную военную операцию по захвату всей территории Молдовы."
 sov_putin.4.a: "Мы согласны"
 sov_putin.4.b: "Нет"
 sov_putin.5.t: "Вторжение в Молдову"
 sov_putin.5.d: "Приднестровье отвергло наше предложенное решение Молдавского вопроса, и похоже мы теряем влияние в регионе."
 sov_putin.5.a: "Очень грустно"
 SOV_medvedev_eaeu: "Создать ЕАЭС"
 SOV_medvedev_eaeu_desc: "Пришло время расширить таможенный союз и превратить его в нечто более значимое. Мы планировали проект ЕАЭС в течение десяти лет, но решат ли наши соседи стать его частью?"
 SOV_dimon_csto: "Реформа ОДКБ"
 SOV_dimon_csto_desc: "Пришло время реформировать ОДКБ и сделать ее не просто организацией, а нормальным военным союзом"
 SOV_dimon_baltica: "Выпить Балтику"
 SOV_dimon_baltica_desc: "Страны Балтии - это шутка, которой пора положить конец"
 SOV_pipa_heroes_z: "Z герои"
 SOV_pipa_heroes_z_desc: "Настоящие герои - это солдаты нашей армии, и они всегда должны быть в центре нашей пропаганды."
 SOV_pipa_science: "Российская Наука"
 SOV_pipa_science_desc: "Поддержка российской науки - наш главный приоритет, и мы не собираемся останавливаться."
 SOV_pipa_max: "Цифровое безопасное государство"
 SOV_pipa_max_desc: "Цифровая безопасность останется приоритетом нашей внутренней политики в наш цифровой век."
 SOV_pipa_dimon_great_russia: "Великая Россия"
 SOV_pipa_dimon_great_russia_desc: "Величие России должно быть сохранено и приумножено"
 SOV_pipa_dimon_war_nato: "Новая Священная война"
 SOV_pipa_dimon_war_nato_desc: "Пришло время покончить с фашистской змеей, которую не прикончили наши деды и которая переродилась в НАТО."
 SOV_medvedev_ukraine: "Пригласить Украину в ОДКБ"
 SOV_medvedev_ukraine_desc: "Мы готовы пригласить Украину в ОДКБ, потому что братские народы должны защищать друг друга"
 SOV_eaeu: "Евразийское Государство"
 SOV_eaeu_desc: "Пришло время реализовать наш грандиозный проект, чтобы частично вернуть влияние, которое мы потеряли после распада СССР. Евразийское государство - это наш грандиозный проект, которого мы никогда не ожидали достичь."
 SOV_sanctions_no_resource_idea: "Бороться с ресурсными санкциями"
 SOV_sanctions_no_economic_idea: "Бороться с экономическими санкциями"
 SOV_eaeu_state_idea: "Дух Евразийского союза"
 sov_medvedev.16.t: "Создание ЕАЭС"
 sov_medvedev.16.d: "Таможенный союз между бывшими советскими государствами был лишь началом, и теперь Россия предлагает расширить наши экономические соглашения, создав Евразийский экономический союз. Готовы ли мы укрепить наши экономические связи с Россией?"
 sov_medvedev.16.a: "Да"
 sov_medvedev.16.b: "Нет"
 sov_medvedev.17.t: "[FROM.GetName] подписала договор ЕАЭС"
 sov_medvedev.17.d: "Их правительство согласилось подписать договор ЕАЭС, прекрасно!"
 sov_medvedev.17.a: "Отлично"
 sov_medvedev.18.t: "[FROM.GetName] денонсировала договор ЕАЭС"
 sov_medvedev.18.d: "Похоже, они не видят смысла в углублённой экономической интеграции с нами."
 sov_medvedev.18.a: "Печально"
 SOV_EAE: "Евразийский союз"
 russia_news.52.t: "Евразийский союз был создан"
 russia_news.52.d: "Правительство России и правительства нескольких стран подписали сегодня в Москве соглашение о создании Евразийского союза как полноценного государства. Похоже, что Российские амбиции возвращаются в стены Кремля."
 russia_news.52.o1: "УРАААА!!"
 russia_news.52.o2: "Новый СССР?"
 SOV_kremlin_category: "Кремлевское правительство"
 SOV_kremlin_category_desc: "Кремль - у многих он вызывает разные ассоциации. Это просто памятник или символ российской истории, но для кого-то это сосредоточие всей российской власти, что отчасти, конечно, не соответствует действительности, но все же все решения, вся судьба страны решается за стенами этого здания. Глава Кремля - это глава истории и будущей судьбы России, и это непреложный факт."
 SOV_rosselhoz: "Россельхозбанк"
 SOV_rosselhoz_desc: "Мы намерены создать 100% государственный банк, который будет заниматься развитием национальной кредитно-финансовой системы для аграрного сектора и сельских районов России"
 SOV_upraznd_pps: "Упразднение Министерства путей сообщения"
 SOV_upraznd_pps_desc: "Мы намерены упразднить Министерство путей сообщения, чтобы создать государственную корпорацию, которая заменит его и улучшит контроль в этой сфере деятельности."
 SOV_putin_dimon_rosatom: "Государственная корпорация  \"Росатом\""
 SOV_putin_dimon_rosatom_desc: "Мы намерены создать государственную корпорацию, которая объединит всю атомную отрасль нашей страны, как гражданскую, так и военную. Это объединение поможет нашей стране эффективно управлять своими ядерными активами."
 SOV_medvedev_eaeu_ukraine: "Евразийская Украина"
 SOV_medvedev_eaeu_ukraine_desc: "Мы намерены расширить Евразийский союз за счет Украины, это наша последняя попытка усилить там наше влияние"
 SOV_putin_opposition_idea: "Путинская оппозиция"
 sov_putin.6.t: "Стабилизационный фонд"
 sov_putin.6.d: "Президент подписал указ о создании стабилизационного фонда, который он рассматривает как средство стабилизации экономики в крайних случаях, когда все другие средства исчерпаны."
 sov_putin.6.a: "Надеюсь, Это Поможет."
 sov_putin.7.t: "Молодая гвардия \"Единой России\""
 sov_putin.7.d: "Политическая реформа в России должна затронуть все сферы, включая молодежный сектор. Мы создадим нашу собственную организацию, которая будет оказывать влияние на политически активную молодежь в целях предвыборной кампании нашей партии."
 sov_putin.7.a: "Слава \"Единой России\"!"
 sov_putin.8.t: "Третий Совет Федерации"
 sov_putin.8.d: "Президентская реформа предполагает замену губернаторов и глав законодательных органов назначенными представителями, которые будут работать в Совете Федерации на постоянной и профессиональной основе. Это также должно укрепить сплоченность региональных образований вокруг федерального центра."
 sov_putin.8.a: "Федерализм - это наше будущее"
 sov_putin.9.t: "Возникновение культа Путина"
 sov_putin.9.d: "Намеренно или нет, но вокруг нашего президента уже формируется культ личности, которому оппозиция уже дала название - путинизм. Более того, эта оппозиция умело игнорирует все достигнутые нами экономические и политические успехи, что неудивительно."
 sov_putin.9.a: "Всего один президентский срок"
 sov_putin.10.t: "Мощь силовиков растет"
 sov_putin.10.d: "Наши действия увеличивают мощь силовых структур в нашей стране, и некоторые западные издания уже называют нашу страну диктатурой силовиков."
 sov_putin.10.a: "Безопасность Превыше всего"
 sov_putin.11.t: "Место Совета Безопасности в системе"
 sov_putin.11.d: "В 1990-е годы Совет Безопасности выполнял различные функции в зависимости от политической ситуации, и настало время, наконец, установить его координирующие функции, чтобы предотвратить расширение этих полномочий."
 sov_putin.11.a: "Порядок Превыше всего"
 sov_putin.12.t: "Конец Федеральной налоговой полиции"
 sov_putin.12.d: "Указом Президента ведомство, существовавшее с момента образования нынешней России, было расформировано, и без особых объяснений все сотрудники и функции налоговой полиции были переданы Министерству внутренних дел России."
 sov_putin.12.a: "Последние дни"
 sov_putin.13.t: "Федеральная служба по контролю за оборотом наркотиков"
 sov_putin.13.d: "На базе материальной базы налоговой полиции было создано новое ведомство - Федеральная служба по контролю за оборотом наркотиков. Ее основной задачей стала борьба с незаконным оборотом наркотических средств и психотропных веществ."
 sov_putin.13.a: "Очередная перестановка стульев"
 sov_putin.14.t: "Росфинмониторинг"
 sov_putin.14.d: "В России появилось еще одно министерство, поскольку Комитет по финансовому мониторингу не смог выполнить свою миссию. Президент учредил Министерство, которое стало частью Агентства финансовой разведки, ответственного за борьбу с финансированием терроризма и отмыванием денег."
 sov_putin.14.a: "Ни Рубля Террористам"
 sov_putin.15.t: "Федеральная таможенная служба"
 sov_putin.15.d: "Таможенный комитет существовал во время распада СССР и был первым независимым таможенным органом в истории России. Сейчас настало время для реформ в этой области, и следующее министерство будет отвечать за те же задачи, что и комитет, но его законодательные функции будут переданы другому министерству для сокращения бюрократии."
 sov_putin.15.a: "Нелегальные товары Не пропускаются"
 sov_putin.16.t: "Федеральная миграционная служба"
 sov_putin.16.d: "Ранее вопросами миграции занимался специальный департамент в составе Министерства внутренних дел СССР и России. Однако указом президента функции этого департамента были переданы отдельному министерству, что призвано повысить эффективность миграционного контроля."
 sov_putin.16.a: "Пожалуйста, Покажите Мне Свой Паспорт"
 sov_putin.17.t: "Росатом"
 sov_putin.17.d: "Наконец-то мы объединили нашу атомную отрасль, и \"Росатом\" станет одним из сильнейших экономических флагманов."
 sov_putin.17.a: "Российский атом - будущее страны"
 sov_putin.18.t: "Набиуллина Снова Остается"
 sov_putin.18.d: "Эльвира Набиуллина доказала, что она отличный глава Центрального банка и лояльна к нашему президенту, а это значит, что мы не можем ожидать экономического саботажа со стороны этого государственного учреждения. Мы намерены передать многие регулирующие функции Центральному банку Российской Федерации, что, несомненно, укрепит нашу экономическую и политическую стабильность."
 sov_putin.18.a: "Отлично"
 sov_putin.19.t: "Россия развязывает информационную войну!"
 sov_putin.19.d: "Российское правительство начало активно расширять свой международный телеканал RUSSIA TODAY. Похоже, что против нас намерены начать полноценную информационную войну"
 sov_putin.19.a: "Мы не будем смотреть рецепт приготовления борща"
 sov_medvedev.19.t: "Путин переходит в Оппозицию"
 sov_medvedev.19.d: "Сегодня утром телеканал Russia Today выпустил в эфир интервью с бывшим президентом Владимиром Владимировичем Путиным, в котором он заявил, что намерен возглавить оппозиционные силы против нынешнего президента, поскольку считает, что его приход к власти был нелегитимным. Он также выразил убеждение, что политика Дмитрия Анатольевича может сбить Россию с истинного пути."
 sov_medvedev.19.a: "Неужели Ему Недостаточно Президентского Срока?"
 sov_medvedev.20.t: "Создан Евразийский Проект"
 sov_medvedev.20.d: "Несмотря на то, что создание такого государства многим казалось фантастикой, нам удалось восстановить часть влияния, утраченного после распада СССР, теперь уже под знаменем новой идеологии."
 sov_medvedev.20.a: "УРАААА!"
 SOV_putin_eaeu_state_tt: "Любая из стран ЕАЭС [ARM.GetFlag][KAZ.GetFlag][KYR.GetFlag][BLR.GetFlag]:\nОбладает национальным духом §YЕвразийский экономический союз§!\n§Y[SOV.GetNameWithFlag]§! имеет больше 60% влияния\nМарионетка §Y[SOV.GetNameWithFlag]§!"
 SOV_ntv_idea: "Свободные СМИ - НТВ"
 SOV_ntv_idea_desc: "Свобода СМИ все еще существует в нашей стране, и мы не намерены уничтожать ее полностью. Даже если будет только один федеральный канал, мы позволим ему существовать и быть независимым."
 sov_economic.6.b: "Мы не будем разделять компанию."
 sov_economic.48.t: "Создание ИнтерРАО"
 sov_economic.48.d: "Несмотря на то, что \"ИнтерРАО\" уже было создано в составе РАО \"ЕЭС России\", сейчас, после реформирования энергосистемы России, компания является независимым игроком на рынке электроэнергии."
 sov_economic.48.a: "Ладно"
 sov_economic.49.t: "Создание РусГидро"
 sov_economic.49.d: "Несмотря на то, что \"Русгидро\" уже было создано в составе РАО \"ЕЭС России\", сейчас, после реформирования энергосистемы России, компания является независимым игроком на рынке электроэнергии."
 sov_economic.49.a: "Ладно"
 sov_economic.50.t: "Расширение деятельности ИнтерРАО"
 sov_economic.50.d: "Компания расширяет географию своего присутствия и строит новые производственные мощности, которые улучшат наше экономическое положение."
 sov_economic.50.a: "Отлично"
 sov_economic.51.t: "Расширение деятельности \"РусГидро\""
 sov_economic.51.d: "Компания расширяет географию своего присутствия и строит новые производственные мощности, которые улучшат наше экономическое положение."
 sov_economic.51.a: "Отлично"
 sov_economic.52.t: "Расширение деятельности \"Северстали\""
 sov_economic.52.d: "Компания расширяет географию своего присутствия и строит новые производственные мощности, которые улучшат наше экономическое положение."
 sov_economic.52.a: "Отлично"
 sov_economic.53.t: "Расширение деятельности Евраз"
 sov_economic.53.d: "Компания расширяет географию своего присутствия и строит новые производственные мощности, которые улучшат наше экономическое положение."
 sov_economic.53.a: "Отлично"
 SOV_putinism_idea_desc: "\n\n\n\n£GFX_BANNER_sov_putinism\n\n\n\n\n\nВладимир Путин стал не просто президентом, но уже начал формировать вокруг себя определенную идеологическую оболочку, которую политологи окрестили путинизмом, поскольку его правление имеет ярко выраженные черты и, похоже, сосредоточено на экономическом развитии страны."
 SOV_medvedism_idea_desc: "\n\n\n\n£GFX_BANNER_sov_medvedism\n\n\n\n\n\nФигура Дмитрия Медведева обрела не только административный вес, но и начала обрастать собственной идеологической оболочкой, получившей название медведизм. Его правленческий подход отличается агрессивной технологичностью - ставка на цифровизацию и инновационный прорыв сочетается с жёстким силовым компонентом во внешней политике, демонстрируя более прямолинейные методы отстаивания национальных интересов."
 SOV_eaeu_state_idea_desc: "\n\n\n\n£GFX_BANNER_sov_eaeu\n\n\n\n\n\nЕвразийство — это новый путь для России, возможность вернуть утраченное влияние после распада СССР, третий путь, который, возможно, не приведёт к очередному краху крупнейшей страны мира"
 sov_medvedev.21.t: "Создание центра \"Сколково\""
 sov_medvedev.21.d: "Мы намерены создать собственную Силиконовую долину, которая позволит нам эффективно внедрять инновационные технологии в нашу экономику."
 sov_medvedev.21.a: "Технология для широких масс"

