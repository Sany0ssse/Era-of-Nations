 sov_gru.5.t: "Создание Центра E"
 sov_gru.5.d: "Мы создадим новое подразделение ФСБ, которое будет заниматься борьбой с оппозиционной деятельностью, особенно с прозападными группировками."
 sov_gru.5.a: "Отлично"
 sov_gru.6.t: "Россия предлагает помощь от ЧВК «Вагнер»"
 sov_gru.6.d: "Российские дипломатические каналы предложили направить контингент ЧВК «Вагнер» для поддержки в сложившейся ситуации."
 sov_gru.6.a: "Мы согласны"
 sov_gru.6.b: "Они нам не нужны"
 sov_gru.7.t: "[FROM.GetNameWithFlag] согласился на помощь от ЧВК «Вагнер»"
 sov_gru.7.d: "Их правительство приняло наше предложение о помощи ЧВК «Вагнер». Наши бойцы отправляются на новое задание."
 sov_gru.7.a: "Хорошо"
 sov_gru.8.t: "[FROM.GetNameWithFlag] отказался от помощи от ЧВК «Вагнер»"
 sov_gru.8.d: "Их правительство отказалось от помощи ЧВК «Вагнер», очевидно, будучи уверенным, что справится самостоятельно."
 sov_gru.8.a: "Слабаки"
 sov_gru.9.t: "ЧВК «Вагнер» возвращается домой"
 sov_gru.9.d: "Бойцы ЧВК «Вагнер» выполнили свою задачу и возвращаются домой."
 sov_gru.9.a: "Хорошо"
 sov_gru.10.t: "Россия предлагает помощь от ЧВК «Вагнер»"
 sov_gru.10.d: "Российские дипломатические каналы вновь предложили поддержку ЧВК «Вагнер», чтобы помочь нам справиться с ситуацией."
 sov_gru.10.a: "Мы согласны"
 sov_gru.10.b: "Они нам не нужны"
 sov_gru.11.t: "[FROM.GetNameWithFlag] согласился на помощь от ЧВК «Вагнер»"
 sov_gru.11.d: "Их правительство согласилось принять помощь от ЧВК «Вагнер». Наши бойцы снова выдвигаются."
 sov_gru.11.a: "Хорошо"
 sov_gru.12.t: "[FROM.GetNameWithFlag] отказался от помощи от ЧВК «Вагнер»"
 sov_gru.12.d: "Их правительство отказалось от помощи ЧВК «Вагнер», будучи уверенным в своих силах."
 sov_gru.12.a: "Слабаки"
 sov_gru.13.t: "ЧВК «Вагнер» возвращается домой"
 sov_gru.13.d: "Бойцы ЧВК «Вагнер» завершили выполнение задания и возвращаются домой."
 sov_gru.13.a: "Хорошо"
 SOV_new_russia: "Новая Россия"
 SOV_new_russia_desc: "России пора выбрать новое направление, путь, по которому она шла веками."
 SOV_release_prisoners: "Освободить политических заключенных"
 SOV_release_prisoners_desc: "Политическим заключённым нет места в нашей прекрасной стране. Мы должны предоставить им свободу."
 SOV_true_federalism: "Истинный федерализм"
 SOV_true_federalism_desc: "Пришло время покончить с ложным федерализмом, навязанным в 1990-х годах. Мы восстановим подлинную автономию регионов."
 SOV_rework_constituion: "Демократическая конституционная реформа"
 SOV_rework_constituion_desc: "Мы проведём комплексную реформу конституции, уделив особое внимание правам и взаимодействию субъектов федерации."
 SOV_russia_good: "Единая и целостная страна"
 SOV_russia_good_desc: "Референдум подтвердил, что наш народ не желает менять территориальную целостность России."
 SOV_usr: "Соединённые Штаты России"
 SOV_usr_desc: "Вдохновлённые успехом США, мы реформируем нашу систему, чтобы она больше походила на американскую."
 SOV_new_establishment: "Новый истеблишмент"
 SOV_new_establishment_desc: "Новым республикам потребуется новое руководство, чтобы защищать свои интересы в составе российского государства."
 SOV_good_federalism: "Успешный федерализм"
 SOV_good_federalism_desc: "Наша федеральная система стала более зрелой, что пошло на пользу как центральному правительству, так и субъектам федерации."
 SOV_federal_police: "Федеральная полиция"
 SOV_federal_police_desc: "Мы реформируем полицию, разделив её на федеральные и региональные подразделения, расширив полномочия регионов и снизив нагрузку на центральный бюджет."
 SOV_federation_army: "Федеральная армия"
 SOV_federation_army_desc: "Поскольку многие организации смогут создавать собственные подразделения, нагрузка на федеральную армию значительно снизится."
 SOV_no_taxes_subjects: "Отменить федеральные налоги"
 SOV_no_taxes_subjects_desc: "Мы отменим федеральные налоги для субъектов, что облегчит их финансовое бремя и будет способствовать развитию местной экономики."
 SOV_attraction_of_commonwealth: "Притяжение Содружества"
 SOV_attraction_of_commonwealth_desc: "Россия станет центром обновлённого интеграционного проекта. Мы предложим нашим соседям прагматичный и добровольный союз, основанный на общих интересах."
 SOV_cis_reform: "Переговоры о реформах"
 SOV_cis_reform_desc: "СНГ нуждается в реформировании, если мы хотим избежать повторения прошлых ошибок и обеспечить долгосрочный успех."
 SOV_cis_interstate_bank: "Развитие Межгосударственного банка СНГ"
 SOV_cis_interstate_bank_desc: "Межгосударственный банк будет способствовать трансграничным платежам, стабилизировать национальные валюты и финансировать совместные инфраструктурные проекты на пространстве СНГ."
 SOV_cis_scientific_cooperation: "Научное сотрудничество в рамках СНГ"
 SOV_cis_scientific_cooperation_desc: "Объединение исследовательского потенциала ускорит технологическое развитие. Мы запустим совместные программы, будем делиться лабораториями и координировать инновационные стратегии."
 SOV_cis_unity_state: "Конфедерация стран СНГ"
 SOV_cis_unity_state_desc: "Изначально задуманный как конфедерация, этот проект призван объединить всех участников СНГ, несмотря на возможные риски."
 SOV_cis_military_forces: "Вооруженные силы СНГ"
 SOV_cis_military_forces_desc: "У СНГ должна быть современная, мощная военная сила, и мы стремимся к её возрождению."
 SOV_parnas: "ПАРНАС"
 SOV_parnas_desc: "Партия народной свободы (ПНС) — либерально-демократическая политическая партия и одна из первых оппозиционных партий, основанных в позднесоветское время."
 SOV_kasyanov: "Михаил Касьянов"
 SOV_kasyanov_desc: "Михаил Михайлович Касьянов (родился 8 декабря 1957 года) — российский государственный и политический деятель, в настоящее время председатель партии «Народная свобода»."
 SOV_from_center_to_regions: "Из центра в регионы"
 SOV_from_center_to_regions_desc: "Мы считаем, что истинное экономическое процветание зависит от расширения политических, экономических и административных прав регионов и муниципалитетов."
 SOV_eliminate_FSS: "Ликвидировать ФСБ"
 SOV_eliminate_FSS_desc: "Преобразуйте Федеральную службу безопасности в Федеральную службу контрразведки, исключив из её состава следственные и антикоррупционные подразделения, а также Службу правительственной связи и Пограничные войска."
 SOV_demilitarize_mia: "Демилитаризовать МВД"
 SOV_demilitarize_mia_desc: "Вывести внутренние войска из состава Министерства внутренних дел и создать Народную национальную гвардию под контролем президента и парламента, запретив использование ОМОНа против мирных протестующих."
 SOV_reduce_taxes_on_small_businesses: "Снизить налоги на малый бизнес"
 SOV_reduce_taxes_on_small_businesses_desc: "Снижение налогов для малого бизнеса необходимо для стимулирования экономики и обеспечения роста."
 SOV_ease_administrative_pressure: "Уменьшение административного давления"
 SOV_ease_administrative_pressure_desc: "Административное давление на регионы усиливается, и мы должны принять меры, чтобы остановить эту тенденцию и обратить её вспять."
 SOV_kasyanov_economic_reform: "Масштабные экономические реформы"
 SOV_kasyanov_economic_reform_desc: "Несмотря на обилие ресурсов, наша экономика находится в состоянии стагнации. Мы снимем прежние правительственные ограничения и возобновим экономический рост."
 SOV_kasyanov_infrastructure: "Инфраструктурная программа"
 SOV_kasyanov_infrastructure_desc: "Наша инфраструктура находится в плачевном состоянии. Мы должны запустить федеральную программу по её срочному обновлению."
 SOV_kasyanov_human_capital: "Человеческий капитал"
 SOV_kasyanov_human_capital_desc: "Граждане — это основа государства, и мы будем вкладывать значительные средства в их благополучие и развитие."
 SOV_kasyanov_far_east: "Дальневосточная федеральная программа"
 SOV_kasyanov_far_east_desc: "Дальний Восток требует серьёзных инвестиций. Мы создадим специальную федеральную программу для развития региона."
 SOV_kasyanov_militia: "Инвестиции в Сельское хозяйство"
 SOV_kasyanov_militia_desc: "Фермеры должны чувствовать себя финансово и юридически защищёнными. Мы проведём реформы, чтобы улучшить положение частных фермерских хозяйств."
 SOV_kasyanov_konkurentsia: "Расширение антимонопольных полномочий"
 SOV_kasyanov_konkurentsia_desc: "Федеральная антимонопольная служба получит более широкие полномочия для борьбы с незаконной деятельностью на рынке."
 SOV_political_reforms: "Политическая реформа"
 SOV_political_reforms_desc: "Наша политическая система нуждается в фундаментальных изменениях. Мы начнём реформы, чтобы положить конец тоталитарному контролю и оживить политическую жизнь."
 SOV_anti_corruption_agency: "Анти-коррупционное агентство"
 SOV_anti_corruption_agency_desc: "Коррупция укоренилась во власти. Необходима активная общенациональная программа по борьбе с коррупцией, в которой будут участвовать все граждане."
 SOV_adhere_to_nato_policy: "Придерживаться политики НАТО"
 SOV_adhere_to_nato_policy_desc: "Сотрудничество с НАТО способствует укреплению безопасности, стабильности и взаимопонимания. Оно позволяет России сохранять влияние и уравновешивать глобальные интересы."
 SOV_establishment_of_free_independent_alliance: "Создание Свободного независимого альянса"
 SOV_establishment_of_free_independent_alliance_desc: "Мы должны восстановить дипломатические отношения со всеми постсоветскими государствами и, возможно, создать союз для совместного экономического и военного развития."
 SOV_new_union_treaty: "Членство в Свободном независимом альянсе"
 SOV_new_union_treaty_desc: "После создания нашего альянса мы пригласим все бывшие советские республики присоединиться к нам и вместе защищать демократию."
 SOV_membership_subjects: "Членство субъектов"
 SOV_membership_subjects_desc: "Наш союз будет неполноценным без участия субъектов нашей федерации."
 SOV_membership_east: "Членство Востока"
 SOV_membership_east_desc: "Привлечение восточных стран укрепит наш союз за счёт их ресурсов, экономики и военного потенциала, что повысит нашу обороноспособность и способность защищать демократию."
 SOV_membership_pribalt: "Членство Балтики"
 SOV_membership_pribalt_desc: "Включение стран Балтии в состав НАТО обеспечит стратегический доступ к Балтийскому морю и укрепит промышленную и технологическую мощь. Без них наш альянс рискует потерять ключевые территории и союзников."
 SOV_membership_caucasus: "Членство Кавказа"
 SOV_membership_caucasus_desc: "Кавказ обладает стратегическими ресурсами и имеет важное геополитическое значение. Исключение его из списка может привести к ослаблению нашего регионального влияния и демократической стабильности."
 SOV_membership_ces: "Членство Центральной Азии"
 SOV_membership_ces_desc: "Ресурсы и положение Центральной Азии имеют жизненно важное значение. Их включение в состав региона расширит рынки сбыта, укрепит безопасность и усилит наше региональное влияние."
 SOV_free_economic_zone: "Свободная экономическая зона"
 SOV_free_economic_zone_desc: "Мы должны превратить Калининград в свободную экономическую зону, которая станет мостом для сотрудничества между Россией и ЕС."
 SOV_transfer_state_shares_to_pension_funds: "Перевод гос. акций в пенсионные фонды"
 SOV_transfer_state_shares_to_pension_funds_desc: "Чтобы повысить уровень жизни граждан и увеличить продолжительность их жизни, государственные акции будут переданы Пенсионному фонду России с ограничениями по голосованию."
 SOV_kasyanov_political: "Великая демократическая Россия"
 SOV_kasyanov_happy_farmers_idea: "Государственная Поддержка Фермеров"
 SOV_kasyanov_fas: "Федеральная антимонопольная служба"
 SOV_kasyanov_anti_corruption_agency: "Независимое агентство по борьбе с коррупцией"
 sov_liberals.1.t: "Реформы завершены!"
 sov_liberals.1.d: "Мы успешно реформировали нашу экономическую систему всего за 500 дней! Это большое достижение, превосходящее всё, чего смогли добиться Гайдар и Ельцин. Теперь мы должны поддерживать стабильный рост и повышать благосостояние наших граждан."
 sov_liberals.1.o1: "Давайте праздновать!"
 sov_liberals.2.t: "Реформы провалились!"
 sov_liberals.2.d: "Наши попытки провести реформы провалились. Нам не удалось совершить экономическое чудо, на которое мы надеялись. Теперь мы должны готовиться к худшему: вероятно, нас ждёт экономический спад, напоминающий 1990-е годы."
 sov_liberals.2.o1: "О нет..."
 sov_liberals.2.o2: "О нет..."
 sov_liberals.2.o3: "О нет..."
 sov_liberals.3.t: "Великий Российский демократический референдум"
 sov_liberals.3.d: "Настал момент определить будущее государственно-территориального устройства России. Всероссийский референдум наконец покажет, каким народ видит территориальное будущее нашей страны."
 sov_liberals.3.o1: "Народ решает судьбу страны."
 sov_liberals.4.t: "[FROM.GetNameWithFlag] приглашает нас в альянс"
 sov_liberals.4.d: "[FROM.GetNameWithFlag] приглашает нас присоединиться к их Свободному независимому альянсу, целью которого является защита демократии на территории бывшего Советского Союза и за его пределами. Вместе мы сможем укрепить нашу оборону, развить экономику и усилить геополитическое влияние. Отказ означает, что мы лишимся важной поддержки во время конфликтов и останемся в одиночестве. Выбор за нами: присоединиться и сотрудничать или действовать в одиночку."
 sov_liberals.4.a: "Мы принимаем их предложение"
 sov_liberals.4.b: "Сейчас не время для этого"
 sov_liberals.5.t: "[FROM.GetNameWithFlag] согласитесь присоединиться к нашему альянсу"
 sov_liberals.5.d: "[FROM.GetNameWithFlag] принял наше приглашение присоединиться к Свободному независимому альянсу! Теперь они под нашей защитой."
 sov_liberals.5.a: "Превосходно!"
 sov_liberals.6.t: "[FROM.GetNameWithFlag] отказались присоединиться к нашему альянсу"
 sov_liberals.6.d: "[FROM.GetNameWithFlag] отклонил наше приглашение в Свободный независимый альянс."
 sov_liberals.6.a: "Это их выбор."
 sov_liberals.6.b: "Мы этого так не оставим — мы примем меры силой!"
 sov_liberals.7.t: "[FROM.GetNameWithFlag] приглашает нас в альянс"
 sov_liberals.7.d: "[FROM.GetNameWithFlag] приглашает нас присоединиться к их Свободному независимому альянсу для защиты демократии на постсоветском пространстве и за его пределами. Присоединение укрепит нашу оборону, экономику и глобальное влияние. Отказ может привести к изоляции в случае конфликта."
 sov_liberals.7.a: "Мы принимаем"
 sov_liberals.7.b: "Сейчас мы не можем"
 sov_liberals.8.t: "[FROM.GetNameWithFlag] приглашает нас в альянс"
 sov_liberals.8.d: "[FROM.GetNameWithFlag] приглашает нас присоединиться к их Свободному независимому альянсу, целью которого является защита демократии на территории бывшего Советского Союза и во всем мире. Вместе мы сможем укрепить оборону, развить экономику и расширить влияние. Снижение рисков потери союзников в случае конфликта."
 sov_liberals.8.a: "Мы принимаем"
 sov_liberals.8.b: "Не сейчас"
 sov_liberals.9.t: "[FROM.GetNameWithFlag] приглашает нас в альянс"
 sov_liberals.9.d: "[FROM.GetNameWithFlag] приглашает нас присоединиться к их Свободному независимому альянсу, призванному защищать демократию в постсоветском регионе и за его пределами. Сотрудничество сулит укрепление обороны, экономический рост и геополитическое влияние. Отказ может привести к нашей изоляции."
 sov_liberals.9.a: "Мы принимаем"
 sov_liberals.9.b: "На данный момент мы должны отказаться"
 sov_liberals.10.t: "[FROM.GetNameWithFlag] приглашает нас в альянс"
 sov_liberals.10.d: "[FROM.GetNameWithFlag] приглашает нас присоединиться к их Свободному независимому альянсу для защиты демократии на территории бывшего Советского Союза и во всём мире. Присоединение укрепит оборону, экономическое развитие и позиции на мировой арене. Отказ от присоединения может привести к потере важной поддержки."
 sov_liberals.10.a: "Мы принимаем"
 sov_liberals.10.b: "На данный момент мы отказываемся"
 sov_liberals.11.t: "[FROM.GetNameWithFlag] приглашает нас в Реформированное СНГ"
 sov_liberals.11.d: "[FROM.GetNameWithFlag] снова пытается возродить СНГ и приглашает нас присоединиться. При более демократичном руководстве СНГ могло бы стать настоящим союзом независимых государств, а не инструментом влияния Москвы."
 sov_liberals.11.a: "Мы согласны присоединиться"
 sov_liberals.11.b: "Нет"
 sov_liberals.12.t: "[FROM.GetNameWithFlag] согласился присоединиться к СНГ"
 sov_liberals.12.d: "[FROM.GetNameWithFlag] принял наше приглашение присоединиться к СНГ, что укрепило наши позиции и показало, что проект всё ещё жив."
 sov_liberals.12.a: "Хорошо"
 sov_liberals.13.t: "[FROM.GetNameWithFlag] отказался вступать в СНГ"
 sov_liberals.13.d: "[FROM.GetNameWithFlag] отклонил наше предложение, не проявив особого интереса к сотрудничеству на постсоветском пространстве."
 sov_liberals.13.a: "Прискорбно"
 sov_liberals.14.t: "[FROM.GetNameWithFlag] предлагает создать Конфедерацию стран СНГ"
 sov_liberals.14.d: "[FROM.GetNameWithFlag] предлагает преобразовать СНГ в конфедерацию, частично восстановив его форму, существовавшую в 1990-е годы. Хотя это и выгодно, существует риск потери автономии, поскольку Москва получит больший контроль."
 sov_liberals.14.a: "Мы согласны"
 sov_liberals.14.b: "Нет"
 sov_liberals.15.t: "[FROM.GetNameWithFlag] стал членом Конфедерации СНГ"
 sov_liberals.15.d: "[FROM.GetNameWithFlag] подписал соглашение о присоединении к Конфедерации СНГ, что приближает нас к созданию почти единого государства и делает распад 1990-х годов далёким воспоминанием."
 sov_liberals.15.a: "Хорошо"
 sov_liberals.16.t: "[FROM.GetNameWithFlag] отказался стать членом Конфедерации СНГ"
 sov_liberals.16.d: "[FROM.GetNameWithFlag] отвергла соглашение о создании Конфедерации СНГ и, возмущённая потерей суверенитета, немедленно вышла из состава СНГ."
 sov_liberals.16.a: "Прискорбно"
 sov_liberals.17.t: "[FROM.GetNameWithFlag] предлагает создать Вооружённые силы СНГ"
 sov_liberals.17.d: "[FROM.GetNameWithFlag] хочет возродить вооружённые силы СНГ для улучшения координации между государствами-участниками. Это увеличит военную мощь, а также влияние России."
 sov_liberals.17.a: "Мы согласны"
 sov_liberals.17.b: "Нет"
 sov_liberals.18.t: "[FROM.GetNameWithFlag] согласился участвовать в вооруженных силах СНГ."
 sov_liberals.18.d: "[FROM.GetNameWithFlag] согласился присоединиться к вооружённым силам СНГ, что значительно укрепит военную мощь союза."
 sov_liberals.18.a: "Хорошо"
 sov_liberals.19.t: "[FROM.GetNameWithFlag] отказался участвовать в вооруженных силах СНГ."
 sov_liberals.19.d: "[FROM.GetNameWithFlag] отказался вступать в возрождённые вооружённые силы СНГ, посчитав, что его нынешнего членства достаточно."
 sov_liberals.19.a: "Прискорбно"
 sov_liberals.20.t: "Наша судьба в СНГ"
 sov_liberals.20.d: "После смены власти в России новое правительство больше не придерживается демократических ценностей прошлого. Теперь мы должны решить, оставаться ли нам в СНГ."
 sov_liberals.20.a: "Мы остаемся"
 sov_liberals.20.b: "Мы уходим"
 sov_liberals.21.t: "[FROM.GetNameWithFlag] покидает СНГ"
 sov_liberals.21.d: "[FROM.GetNameWithFlag] не согласен с новым правительством и политикой России и подписал указ о выходе из СНГ и его структур."
 sov_liberals.21.a: "Прискорбно"
 sov_liberals.22.t: "[FROM.GetNameWithFlag] предлагает инвестиции в Калининграде"
 sov_liberals.22.d: "[FROM.GetNameWithFlag] изменила свою политику в отношении Калининграда, открыв его для иностранных инвестиций и предложив сотрудничество."
 sov_liberals.22.a: "Мы согласны"
 sov_liberals.22.b: "Нет"
 sov_liberals.23.t: "[FROM.GetNameWithFlag] согласился инвестировать в Калининградскую область"
 sov_liberals.23.d: "[FROM.GetNameWithFlag] принял наше инвестиционное предложение и готовится к заключению соглашения."
 sov_liberals.23.a: "Отлично"
 sov_liberals.24.t: "[FROM.GetNameWithFlag] отказалось инвестировать в Калининградскую область."
 sov_liberals.24.d: "[FROM.GetNameWithFlag] отклонил наше инвестиционное предложение, очевидно, не увидев в нём выгоды для себя."
 sov_liberals.24.a: "Прискорбно"
 sov_liberals.25.t: "Результаты инвестиций в Калининградскую область"
 sov_liberals.25.d: "Мы обратились к нескольким европейским странам с инвестиционными предложениями для Калининграда, и результаты оказались многообещающими."
 sov_liberals.25.a: "Окей"
 sov_liberals.26.t: "Развитие Дальнего Востока — второй этап"
 sov_liberals.26.d: "Наша программа развития Дальнего Востока продолжается, и мы объявляем о следующем этапе финансирования для обеспечения роста региона."
 sov_liberals.26.a: "Хорошо"
 sov_liberals.27.t: "Судьба Грузии"
 sov_liberals.27.d: "Грузия по-прежнему представляет собой проблему на Кавказе. Мы должны решить, как выстраивать отношения с этой страной."
 sov_liberals.27.a: "Марш в Тбилиси"
 sov_liberals.27.b: "Мирное сосуществование остаётся нашим приоритетом"
 sov_liberals.29.t: "Борис Немцов убит!"
 sov_liberals.29.d: "Борис Немцов был убит 27 февраля 2015 года возле Большого Москворецкого моста в Москве, когда гулял с украинской моделью Анной Дурицкой. Нападавшие знали его маршрут и произвели шесть выстрелов в спину, попав в жизненно важные органы. Убийцы скрылись на белой машине. Несколько подозреваемых были приговорены к тюремному заключению на срок от 11 до 20 лет. Заказчик преступления остаётся неизвестным."
 sov_liberals.29.a: "Понятно"
 sov_liberals.30.t: "Наследие Ельцина"
 sov_liberals.30.d: "После распада Советского Союза Борис Ельцин, неоднозначный лидер, руководил страной в трудные времена: роспуск Верховного Совета, чеченские войны, экономические кризисы и провальные реформы. Позже Россия обрела стабильность под руководством нового лидера, который обещал порядок и рост. Политическая система трансформировалась, и страна консолидировалась после потрясений. Будущее остаётся неопределённым."
 sov_liberals.30.a: "Давайте посмотрим внимательно."
 sov_liberals.31.t: "Смерть Ельцина"
 sov_liberals.31.d: "РИА Новости сообщило, что Борис Ельцин, первый президент независимой России, скончался после продолжительной борьбы с болезнью сердца. В университете, названном в его честь, прошла минута молчания, а многие западные лидеры выразили свои соболезнования."
 sov_liberals.31.a: "Покойся с миром, борец за свободу."
 sov_liberals.31.b: "Покойся с миром."
 sov_liberals.32.t: "Межгосударственный банк СНГ"
 sov_liberals.32.d: "Россия инвестировала значительные средства в модернизацию Межгосударственного банка. Как член Содружества, мы теперь получаем доступ к его расширенным возможностям: трансграничным платежам в национальных валютах и совместному финансированию общих проектов."
 sov_liberals.32.a: "Превосходно."
 sov_liberals.33.t: "Научное сотрудничество в рамках СНГ"
 sov_liberals.33.d: "Россия инвестировала в создание совместной исследовательской сети по всему Содружеству. Теперь у нас есть доступ к общим лабораториям, скоординированным исследовательским программам и механизмам передачи технологий. Это ускорит наше научное развитие."
 sov_liberals.33.a: "Наука без границ!"
 sov_liberals.34.t: "Приглашение в Альянс СНГ"
 sov_liberals.34.d: "Россия сформировала новый военно-политический альянс: §YАльянс Содружества Независимых Государств§! Как член экономического пространства СНГ, мы приглашены присоединиться к этому оборонительному пакту. Это укрепит нашу коллективную безопасность и углубит интеграцию."
 sov_liberals.34.a: "Мы присоединимся к альянсу."
 sov_liberals.34.b: "Мы отказываемся — остаёмся независимыми."
 sov_liberals.35.t: "Приглашение в альянс принято"
 sov_liberals.35.d: "§Y[From.GetName]§! согласился присоединиться к нашему Альянсу СНГ. Наше партнёрство становится сильнее."
 sov_liberals.35.a: "Превосходно."
 sov_liberals.36.t: "Приглашение в альянс отклонено"
 sov_liberals.36.d: "К сожалению, §Y[From.GetName]§! отказался присоединиться к Альянсу СНГ. Они предпочитают оставаться за рамками нашей системы коллективной безопасности."
 sov_liberals.36.a: "Их потеря."
 sov_liberals.37.t: "Военная интеграция в рамках СНГ"
 sov_liberals.37.d: "Россия инвестировала в создание совместной военной координационной структуры. Как член Содружества, мы теперь получаем выгоду от стандартизированной подготовки, общей логистики и интегрированных командно-штабных учений. Наши вооружённые силы становятся более совместимыми и эффективными."
 sov_liberals.37.a: "Сила в единстве."
 sov_liberals_news.1.t: "Великий российский демократический референдум"
 sov_liberals_news.1.d: "Состоялся знаковый референдум о территориальном будущем России. Внутренние границы резко изменились, что шокировало многих, ведь простым гражданам было дано право решать судьбу страны."
 sov_liberals_news.1.a: "Является ли это истинной демократией?"
 SOV_multi_party_encouragement_tt: "§HЕсли Украина согласится:§! Они федерализуют Донецк и Крым.\n§HИначе:§! вся территория §RНовороссии§! станет нациоальной для нас и мы получим цель войны против Украины."
 SOV_from_center_TT: "Разблокирует решения §YИз центра в регионы!§!"
 SOV_FSS_TT: "§YФСБ будет преобразована в Федеральную службу контрразведки§!"
 SOV_subjects_exist_tt: "§YРоссия§! имеет хотя бы один субъект."
 SOV_subjects_federalization_buff_tt: "Национальный дух §Yистинного федерализма§! будет §Yизменён§! и теперь будет §Gдоступна§! его §Yулучшенная версия§!."
 SOV_one_CIS_member_tt: "По крайней мере, §Yодна другая страна§! является членом §2СНГ§!"
 SOV_nazbols: "Россия - это всё. Остальное - ничто"
 SOV_nazbols_desc: "Пришло время восстановить былое величие России. Только мы по-настоящему понимаем, что нужно нашей великой родине."
 SOV_nazbols_new_russian_order: "Новый российский порядок"
 SOV_nazbols_new_russian_order_desc: "Для России наступает новый порядок! Пришло время положить конец раздробленности и вернуть стране единство."
 SOV_nazbols_no_more_oligarch: "Справиться с олигархами"
 SOV_nazbols_no_more_oligarch_desc: "Олигархи должны прекратить эксплуатировать Россию. Мы примем решительные меры, чтобы положить конец их грабежу!"
 SOV_nazbols_natiolalize: "Национализация корпораций"
 SOV_nazbols_natiolalize_desc: "Крупные корпорации — мрачное напоминание о 90-х. Мы национализируем их на благо страны и её народа."
 SOV_nazbols_west_nationalise: "Национализация западных компаний"
 SOV_nazbols_west_nationalise_desc: "Западные корпорации, пришедшие на нашу территорию в 90-е годы, должны уйти. Пришло время вернуть то, что принадлежит нам."
 SOV_nazbols_destroy_republic: "Покончить с Национальными республиками"
 SOV_nazbols_destroy_republic_desc: "Национальным республикам нет места в России. Мы не будем повторять ошибок Советского Союза."
 SOV_nazbols_federalism: "Придерживаться идей федерализма"
 SOV_nazbols_federalism_desc: "Мы поддерживаем настоящий федерализм! Субъекты должны быть автономными, а не просто регионами, обслуживающими столицу."
 SOV_nazbols_no_export: "Закрытая российская экономика"
 SOV_nazbols_no_export_desc: "Закрытая экономика — это сильная экономика. Россия может позволить себе такой подход, потому что у неё есть всё необходимое."
 SOV_nazbols_help_science: "Наука на службе России"
 SOV_nazbols_help_science_desc: "Наука способствует прогрессу, и мы будем поддерживать этот двигатель, увеличивая финансирование."
 SOV_nazbols_hate_democracy: "Ненависть к либерализму и коммунизму"
 SOV_nazbols_hate_democracy_desc: "Либерализм и коммунизм привели к упадку нашей нации и утрате русского духа. Мы не позволим им разрушить нашу страну."
 SOV_nazbols_new_industrialization: "Новая индустриализация"
 SOV_nazbols_new_industrialization_desc: "Мы начнём новую индустриализацию, чтобы возродить мощь советской промышленности!"
 SOV_nazbols_capital_return: "Подразделение по возврату капитала"
 SOV_nazbols_capital_return_desc: "Мы планируем создать специальное агентство, которое будет заниматься возвращением российского капитала из-за рубежа любыми необходимыми способами."
 SOV_nazbols_free_weapon: "Свободное ношение оружия"
 SOV_nazbols_free_weapon_desc: "Право на свободное ношение оружия изменит российское общество! Каждый гражданин должен иметь право на самооборону."
 SOV_nazbols_back_russians: "Верните русских на Родину"
 SOV_nazbols_back_russians_desc: "Мы будем активно содействовать возвращению русскоязычных людей на родину и оказывать им финансовую поддержку."
 SOV_nazbols_foreign_legion: "Иностранный легион"
 SOV_nazbols_foreign_legion_desc: "Вдохновившись примером Французского Иностранного легиона, мы создадим Российский легион, в котором иностранцы смогут служить и получать гражданство."
 SOV_nazbols_ekb: "Перенести столицу в Екатеринбург"
 SOV_nazbols_ekb_desc: "Пора перенести столицу в сердце России! Урал идеально подходит. Москва слишком далека от многих регионов."
 SOV_nazbols_empire: "Советская Империя"
 SOV_nazbols_empire_desc: "Наша власть вернулась! Слава Советской империи!"
 SOV_nazbols_nato: "Анти-западная риторика"
 SOV_nazbols_nato_desc: "Запад всегда был и будет нашим врагом. Наша риторика никогда не должна меняться."
 SOV_nazbols_return_russian_territories: "Возвращение спорных российских территорий"
 SOV_nazbols_return_russian_territories_desc: "Русский вопрос на территории бывшего Советского Союза остаётся нерешённым. Мы будем решать его решительно — либо с помощью ультиматумов, либо рискуя быть поглощёнными."
 SOV_nazbols_belarus_go_home: "Вернуть Беларусь"
 SOV_nazbols_belarus_go_home_desc: "Беларусь — это часть нашей родины, которую у нас несправедливо отняли. Нет земли более родной для русских, чем этот небольшой регион."
 SOV_nazbols_separatists_go_home: "Аннексировать сепаратистские республики"
 SOV_nazbols_separatists_go_home_desc: "Аннексировать сепаратистские республики"
 SOV_nazbols_help_artsakh: "Защитить Арцах"
 SOV_nazbols_help_artsakh_desc: "Арцах — самая христианская территория на постсоветском пространстве, где проживает больше всего настоящих армян. Мы должны их защитить!"
 SOV_nazbols_help_kurdistan: "Арцах — самая христианская территория на постсоветском пространстве, где проживает больше всего настоящих армян. Мы должны их защитить!"
 SOV_nazbols_help_kurdistan_desc: "Курдистан станет нашим плацдармом в регионе, если мы обретём там дипломатическое влияние. Ирану, Ираку и Турции придётся считаться с нашей силой."
 SOV_nazbols_anti_westes: "Анти-западная доктрина"
 SOV_nazbols_anti_westes_desc: "Нет пощады западным оккупантам русского духа!"
 SOV_nazbols_ayatolla: "Русский аятолла"
 SOV_nazbols_ayatolla_desc: "Вдохновлённая иранским аятоллой, Россия нуждается в духовном лидере, который будет поддерживать моральный облик народа, а не в бездушных министерствах."
 SOV_nazbols_our_irgc: "Корпус стражей коммунистической революции"
 SOV_nazbols_our_irgc_desc: "Мы создадим российский аналог иранского КСИР, чтобы защитить идеологические достижения нашего режима."
 SOV_nazbols_ruralisation: "Рурализация"
 SOV_nazbols_ruralisation_desc: "Мы будем вкладывать значительные средства в развитие агропромышленного сектора нашей экономики."
 SOV_nazbols_new_religion: "Коммунистическая православная церковь"
 SOV_nazbols_new_religion_desc: "Православная церковь утратила доверие даже за то, что сотрудничала с нацистами во время Второй мировой войны. Мы построим новую церковь, которая объединит всё духовное наследие России."
 SOV_anti_west_idea: "Анти-западная доктрина"
 SOV_russian_foreign_legion_idea: "Иностранный легион"
 SOV_russians_back_idea: "Возвращение соотечественников"
 SOV_nazbol_irgc_idea: "Корпус стражей коммунистической революции"
 sov_nazbol.1.t: "Россия хочет аннексировать нас"
 sov_nazbol.1.d: "Российское правительство выдвинуло ультиматум с требованием провести референдум о присоединении к России. Мы знаем, каким будет вероятный результат, поэтому пришло время определиться с ответом."
 sov_nazbol.1.a: "Конечно, пора возвращаться домой — в Россию"
 sov_nazbol.1.b: "Не сегодня"
 sov_nazbol.2.t: "[FROM.GetName] интегрирован в [SOV.GetName]"
 sov_nazbol.2.d: "[FROM.GetName] полностью интегрирована в нашу славную империю. Мы возвращаем то, что было утрачено за последнее столетие, и не остановимся на достигнутом."
 sov_nazbol.2.a: "Наша страна стала сильнее"
 sov_nazbol.3.t: "Россия претендует на наши территории!"
 sov_nazbol.3.d: "Россия выдвигает ультиматум в отношении части нашей территории, которую она считает своей. Мы должны решить, как на это реагировать."
 sov_nazbol.3.a: "Мы уступим"
 sov_nazbol.3.b: "Никогда"
 sov_nazbol.4.t: "Национал-большевики вступают в коалицию"
 sov_nazbol.4.d: "Национал-большевики присоединились к нашей правящей коалиции и получили влияние на политику нашей страны."
 sov_nazbol.4.a: "Да, за победу!"
 SOV_nazbol_coup_TT: "Национал-большевики совершают государственный переворот и захватывают власть!"
 SOV_nazbol_destroy_republics_TT: "Все §Yнациональные республики§! не были §Rуничтожены§!"
 SOV_slavic_corps: "Решить проблему со славянским корпусом"
 SOV_slavic_corps_desc: "«Славянский корпус» — это частная охранная компания, зарегистрированная в Гонконге. Мы задержали её владельцев и готовы заключить их под стражу. Однако их опыт может пригодиться нам в будущем."
 SOV_wagner_minoboroni: "Поставка от Министерства Обороны"
 SOV_wagner_minoboroni_desc: "Министерство обороны предоставит нам необходимое вооружение для проведения операций. Эта поддержка значительно укрепит наши возможности."
 SOV_co_op_wagner: "Глобальное сотрудничество с Вагнером"
 SOV_co_op_wagner_desc: "Поскольку основное финансирование поступает от Евгения Пригожина, имеет смысл назначить его руководителем ЧВК. Под его руководством работа станет более слаженной и эффективной."
 SOV_wagner_cadres: "Начните процесс подбора персонала"
 SOV_wagner_cadres_desc: "Мы начнём набор первых кандидатов в наши ЧВК. Тщательный отбор имеет решающее значение для успеха нашей деятельности."
 SOV_wagner_first_pmc: "Первый батальон ЧВК"
 SOV_wagner_first_pmc_desc: "Наш первый батальон ЧВК сформирован, и мы почти готовы приступить к выполнению наших первых боевых задач. Это важная веха на пути к расширению нашего влияния."
 SOV_wagner_more_operations: "Расширение сферы деятельности"
 SOV_wagner_more_operations_desc: "Наша ЧВК теперь готова участвовать в операциях по всему миру. Это расширение позволит нам расширить глобальный охват и влияние."
 SOV_wagner_african: "Африканское направление"
 SOV_wagner_african_desc: "Африка была потеряна после распада СССР; пришло время вернуть себе там влияние. Восстановление нашего присутствия откроет новые стратегические возможности."
 SOV_wagner_support_gru: "Поддержка операций ГРУ"
 SOV_wagner_support_gru_desc: "Мы будем поддерживать миссии ГРУ, чтобы повысить эффективность внешней политики России. Сотрудничество повысит вероятность успеха тайных операций."
 SOV_wagner_rusich: "ДШРГ Русич"
 SOV_wagner_rusich_desc: "Мы также примем в свои ряды небольшой батальон националистов, что укрепит наши ЧВК. Их идеологическая приверженность делает их ценными союзниками в наших миссиях."
 SOV_slavic_wagner_TT: "ЧВК Вагнера будет создана"
 SOV_russian_government_idea: "Российское правительство"
 SOV_russian_government_idea_desc: "Политическая ситуация в России всегда была нестабильной, особенно после распада СССР, потому что многие политические факторы, такие как внутренний сепаратизм, политическая нестабильность и безразличие населения к судьбе государства, могут играть свою роль."
