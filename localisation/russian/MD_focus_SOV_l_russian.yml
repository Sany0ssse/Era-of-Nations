 ##########ELVIRKA##########
###########Focuses###########
 SOV_nabi_rise: "Первая женщина-президент России"
 SOV_nabi_rise_desc: "Пора России снова сменить лидера, и наблюдается историческая тенденция к передаче власти новому правителю. Более того, Россией будет править женщина, как это уже было 300 лет назад."
 SOV_nabi_strong_economy_policy: "Жесткая экономическая политика"
 SOV_nabi_strong_economy_policy_desc: "России нужны жесткие экономические реформы, пора убрать барьеры, мешающие их проведению."
 SOV_nabi_infliation_down: "Борьба с инфляцией любой ценой"
 SOV_nabi_infliation_down_desc: "Инфляцию нужно победить, иначе экономический рост останется лишь обещанием электорату. Мы не намерены говорить пустые слова."
 SOV_nabi_cross_police: "'Кросс-полиция'"
 SOV_nabi_cross_police_desc: "Мы введем специальную схему балансировки власти между департаментами, при которой будем активно перемещать определенных руководителей из одного департамента в другой для поддержания постоянного баланса."
 SOV_nabi_structure: "Структурные реформы"
 SOV_nabi_structure_desc: "Экономике нужен переход на новый порядок, пора перестать полагаться на доходы от ресурсов."
 SOV_nabi_cadres: "Революция кадров"
 SOV_nabi_cadres_desc: "России нужны люди, искренне заинтересованные в развитии страны, с мышлением экономистов и технократов."
 SOV_nabi_new_russian_dream: "Новая 'Русская мечта'"
 SOV_nabi_new_russian_dream_desc: "У Америки есть Американская мечта, а наша мечта — это Русская мечта: мы станем технологическим раем, куда будут приезжать люди со всего мира."
 SOV_nabi_technocratic: "Технократический подход"
 SOV_nabi_technocratic_desc: "Политическую составляющую экономических вопросов нужно отбросить и опираться только на реальные факты и показатели."
 SOV_nabi_peredel: "Великая дерегуляция"
 SOV_nabi_peredel_desc: "Громкое название для не менее громкого процесса экономической перестройки в нашей экономике."
 SOV_nabi_great_deregulation: "'Тихая перестройка'"
 SOV_nabi_great_deregulation_desc: "Мы не довольны результатами приватизации и попробуем пересмотреть их более спокойно."
 SOV_nabi_cult: "Культ компетенции"
 SOV_nabi_cult_desc: "Единственное, что должно продвигать человека по карьерной лестнице — это компетентность, а не политические игры или связи."
 SOV_nabi_techno_patriotism: "Технологический патриотизм"
 SOV_nabi_techno_patriotism_desc: "Любить свою страну — значит любить её технологии, а чтобы люди их любили, они должны быть действительно прорывными."
 SOV_nabi_rus_worl_two: "Русский мир 2.0"
 SOV_nabi_rus_worl_two_desc: "Концепция Русского мира была устаревшей даже во времена своего создания и является кастрированной копией советской доктрины распространения социализма повсюду. Мы пойдём другим путём, более мирным и технологически продвинутым."
 SOV_nabi_mecenat: "Технологический меценат"
 SOV_nabi_mecenat_desc: "Технологии, развитие и инновации должны постоянно упоминаться не только в СМИ, но и во всех государственных учреждениях."
 SOV_nabi_shelk_path: "Цифровой финансовый шёлковый путь"
 SOV_nabi_shelk_path_desc: "Китайский Шёлковый путь — устаревшая концепция, которую мы переосмыслим по-своему, используя технологический прорыв, который будет внедрён."
 SOV_nabi_net_protectorate: "Сетевой протекторат"
 SOV_nabi_net_protectorate_desc: "Многие страны не имеют достаточно сильной технологической защиты сетей, и мы будем готовы предложить им эти услуги в обмен на влияние."
 SOV_nabi_technocratic_internationalism: "Технократический интернационализм"
 SOV_nabi_technocratic_internationalism_desc: "Политический интернационализм ушёл в прошлое, и мы готовы воспитать поколение технократов, которые будут продвигать идеалы нашей страны через технологии."
 SOV_nabi_techo_sphere: "Техносфера"
 SOV_nabi_techo_sphere_desc: "Пришло время углубить сотрудничество со странами, разделяющими наше технологическое превосходство."
 SOV_nabi_souless_empire: "Бездушная империя"
 SOV_nabi_souless_empire_desc: "Несмотря на все предпринятые усилия, все прорывы и просчеты, мы не учли одного: саму душу русской истории, которая теперь вырвана из нашей страны."
 SOV_elvirka_second_idea: "Структурная реформа государства"
 SOV_elvirka_second_idea3: "Новый [SOV.GetFlag]Русский мир"
 SOV_elvirka_policy_idea: "Сильная экономическая политика"
 SOV_elvirka_policy_idea4: "Технопатриотизм"
 SOV_elvirka_bad_siloviks_idea: "Непослушание силовиков"
 SOV_elvirka_bad_siloviks_idea_desc: "Новое правительство полностью недовольно силовыми структурами, и они активно сопротивляются новой власти. Поэтому крайне важно решить этот вопрос.\n§YЕсли этот национальный дух будет устранён, спецслужбы станут снова доступны§!\n"
 SOV_elvirka_russian_dream_idea: "Новая [SOV.GetFlag]Русская мечта"
 SOV_zloi_mironov_idea: "Оппозиция Миронова"
 SOV_zloi_zyuganov_idea: "Оппозиция Зюганова"
 SOV_elvire_techno_sphere_idea: "[SOV.GetFlag]§YРоссийская§! Техносфера"
 SOV_elvire_techno_sphere_idea_desc: "\n\n\n\n£GFX_BANNER_sov_technosphere\n\n\n\n\n\n Россия расширяет своё технологическое влияние и приглашает страны стать частью нового экономического проекта — Технологической сферы, в рамках которой каждый участник станет членом программы технологического обмена с ведущими российскими корпорациями."
 SOV_elvire_cyph_silk_road_idea: "§YРоссийский§! цифровой Шёлковый путь"
 SOV_elvire_cyph_silk_road_idea_desc: "\n\n\n\n£GFX_BANNER_sov_silkroad\n\n\n\n\n\n Китайский Шёлковый путь — устаревшая концепция, а подлинное будущее принадлежит Российскому цифровому Шёлковому пути! Пока китайские караваны пересекают пустыни Центральной Азии, мы прокладываем маршруты в цифровом пространстве со скоростью, превосходящей их в миллион раз!"
 SOV_elvire_net_protectorate_idea: "§YРоссийский§! Сетевой протекторат"
 SOV_elvire_net_protectorate_idea_desc: "\n\n\n\n£GFX_BANNER_sov_net_protectorate\n\n\n\n\n\n Не все страны могут позволить себе достаточно мощные технологии сетевой безопасности, но российские компании станут на защиту вашей инфраструктуры и уберегут её от атак вражеских хакеров!"
 SOV_elvire_internationalism_technocratic_idea: "[SOV.GetFlag]§YРоссийский§! Технократический интернационал"
 SOV_elvire_internationalism_technocratic_idea_desc: "\n\n\n\n£GFX_BANNER_sov_technointer\n\n\n\n\n\n XX век был веком социалистического интернационализма, а теперь настало время российского технократического интернационализма! Обменивайтесь знаниями с лучшими учёными России прямо здесь и сейчас!"
 SOV_mir_puppets_idea: "§YРоссийская платёжная система§! §GМир§!"
 SOV_nabi_net_protectorate_agremmeent: "Предложить §YСетевой протекторат§! для §Y[FROM.GetNamewithFlag]§!"
 SOV_nabi_silkroad_agremmeent: "Предложить §YЦифровой шёлковый путь§! для §Y[FROM.GetNamewithFlag]§!"
 SOV_nabi_techosphere_agremmeent: "Предложить §YВступление в Техносферу§! для §Y[FROM.GetNamewithFlag]§!"
 SOV_nabi_inter_agremmeent: "Предложить §YТехнократический интернационал§! для §Y[FROM.GetNamewithFlag]§!"
 SOV_nabi_mir_for_pupets: "Расширить §YПлатёжную систему§! §GМир§! для §Y[FROM.GetNamewithFlag]§!" 
 sov_nabi.1.t: "[SOV.GetNameWithFlag] предлагает нам Сетевой протекторат"
 sov_nabi.1.d: "Их правительство предлагает лучших специалистов по кибербезопасности, чтобы обеспечить нашу цифровую защиту от влияния вражеских хакеров. Мы должны решить, готовы ли мы пожертвовать частью нашей независимости ради блага страны."
 sov_nabi.1.a: "Да"
 sov_nabi.1.b: "Нет"
 sov_nabi.2.t: "Сетевой протекторат в [FROM.GetNameWithFlag]"
 sov_nabi.2.d: "Они согласились на наше предложение о сетевом протекторате в их технологической сфере."
 sov_nabi.2.a: "Отлично"
 sov_nabi.3.t: "Сетевой протекторат в [FROM.GetNameWithFlag]"
 sov_nabi.3.d: "Они отклонили наше предложение о сетевом протекторате в их технологической сфере."
 sov_nabi.3.a: "Глупцы"
 sov_nabi.4.t: "[SOV.GetNameWithFlag] предлагает нам Цифровой шёлковый путь"
 sov_nabi.4.d: "Их правительство планирует собственный проект — сетевую альтернативу знаменитому китайскому Шёлковому пути, и уверяет, что создаваемый между странами массив данных ускорит цифровое развитие всех участников в сфере ИТ и за её пределами."
 sov_nabi.4.a: "Да"
 sov_nabi.4.b: "Нет"
 sov_nabi.5.t: "Цифровой шёлковый путь в [FROM.GetNameWithFlag]"
 sov_nabi.5.d: "Они согласились на наше предложение о цифровом шёлковом пути."
 sov_nabi.5.a: "Отлично"
 sov_nabi.6.t: "Цифровой шёлковый путь в [FROM.GetNameWithFlag]"
 sov_nabi.6.d: "Они отклонили наше предложение о цифровом шёлковом пути."
 sov_nabi.6.a: "Глупцы"
 sov_nabi.7.t: "[SOV.GetNameWithFlag] предлагает нам Вступление в Техносферу"
 sov_nabi.7.d: "Их правительство намерено расширить технологическое сотрудничество и создать специальный политико-экономический кластер — Техносферу, где наши страны смогут свободно обмениваться технологиями для общего развития."
 sov_nabi.7.a: "Да"
 sov_nabi.7.b: "Нет"
 sov_nabi.8.t: "Техносфера в [FROM.GetNameWithFlag]"
 sov_nabi.8.d: "Они согласились на наше предложение о создании техносферы."
 sov_nabi.8.a: "Отлично"
 sov_nabi.9.t: "Техносфера в [FROM.GetNameWithFlag]"
 sov_nabi.9.d: "Они отклонили наше предложение о создании техносферы."
 sov_nabi.9.a: "Глупцы"
 sov_nabi.10.t: "[SOV.GetNameWithFlag] предлагает нам Технократический интернационал"
 sov_nabi.10.d: "Их правительство готово углубить сотрудничество с нами и предложило интеграцию наших образовательных и научных институтов для обмена знаниями, технологиями и опытом, чтобы вывести сотрудничество на беспрецедентный уровень."
 sov_nabi.10.a: "Да"
 sov_nabi.10.b: "Нет"
 sov_nabi.11.t: "Технократический интернационал в [FROM.GetNameWithFlag]"
 sov_nabi.11.d: "Они согласились на наше предложение о технократическом интернационале."
 sov_nabi.11.a: "Отлично"
 sov_nabi.12.t: "Технократический интернационал в [FROM.GetNameWithFlag]"
 sov_nabi.12.d: "Они отклонили наше предложение о технократическом интернационале."
 sov_nabi.12.a: "Глупцы"
 sov_nabi.13.t: "Женщина-президент России"
 sov_nabi.13.d: "Сюжет принял неожиданный поворот: действующий президент России решил уйти в отставку и передать власть неожиданному преемнику — Эльвире Набиуллиной, главе Центрального банка РФ. Похоже, Россию ждут интересные времена."
 sov_nabi.13.a: "Хммм"
 sov_nabi.14.t: "Силовики недовольны новой властью"
 sov_nabi.14.d: "Новая власть явно нарушит баланс, установленный при Путине. Силовые структуры утратят прежнюю власть и контроль, что вызывает недовольство и даже саботаж."
 sov_nabi.14.a: "Остатки прошлого"
 sov_nabi.15.t: "Сергей Миронов критикует нашу политику"
 sov_nabi.15.d: "Лидер партии 'Справедливая Россия', Сергей Миронов, продолжает критиковать наше правительство, называя каждый шаг шагом в пропасть российского государства и предсказывая скорое его падение из-за таких решений."
 sov_nabi.15.a: "Он не устал?"
 sov_nabi.16.t: "Протест олигархов"
 sov_nabi.16.d: "Политика Набиуллиной вызывает скепсис у ведущих олигархов России, которые зарабатывают на продаже ресурсов. Новые меры могут уменьшить их доходы."
 sov_nabi.16.a: "Россия — не газовая колонка"
 sov_nabi.17.t: "Новый персонал в правительстве"
 sov_nabi.17.d: "Набиуллина активно формирует команду единомышленников, поддерживающих её экономическую политику, что уже меняет курс страны и положительно сказывается на определённых политических группах."
 sov_nabi.17.a: "Время обновить правительство"
 sov_nabi.18.t: "Борьба за компетентность"
 sov_nabi.18.d: "Объявить новый подход к рабочим процессам — одно, а контролировать их — совсем другое. Это главный вызов для новой власти, которую многие считают идеалистичной, но первые шаги уже сделаны, и новая политика начинает давать плоды."
 sov_nabi.18.a: "Компетентная Россия — наша Россия"
 sov_nabi.19.t: "Положительный результат экономических реформ"
 sov_nabi.19.d: "Несмотря на небольшой срок, новая власть уже положительно повлияла на экономический рост страны. Уверенность в том, что лидер не возродит концепцию 'Русского мира', внушает надежду отечественным и зарубежным экономистам."
 sov_nabi.19.a: "Приходит ли стабильность?"
 sov_nabi.20.t: "Зюганов выражает протест"
 sov_nabi.20.d: "Лидер КПРФ открыто высказал своё недовольство экономической политикой и заявил о противодействии нашему правительству."
 sov_nabi.20.a: "Он ещё жив?"
 SOV_nabi_next_exp_tt: "Вы можете применить эти решения к странам, где уже есть национальные духи: §YРоссийский Цифровой Шелковый Путь§! и §YРоссийский Сетевой Протекторат§!"
 SOV_nabi_expansion_tt: "\n[SOV.GetFlag] Российский §Hмножитель влияния§! в §Y[ROOT.GetNameWithFlag]§!: §R+25%§!"
 nabi_russia_dream: "Мирная Российская Мечта"
 sov_reunification_category: "Объединение России"
 sov_reunification_category_desc: "Итогом войны стала фрагментация России, и теперь, когда пыль осела, мы должны выдержать все тяготы воссоединения.\nТекущий прогресс воссоединения: [?THIS.reunification_progress]."
