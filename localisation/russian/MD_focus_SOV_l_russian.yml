 SOV_expand_conscription: "Компьютеризированная экономика"
 SOV_expand_conscription_desc: "Наша экономика устарела. Наши люди достаточно умны, чтобы использовать компьютеры на благо России. Наши учёные, рабочие заводов и служащие военно-промышленного комплекса должны управлять самыми мощными и эффективными электронными вычислительными машинами, чтобы улучшить нашу экономику!"
