 SOV_economy_category_desc: "[SOV.GetFlag]§YРоссийская§! экономика сейчас переживает трудные времена. Нам нужно не просто возродить наследие прошлого, но и вырваться в лидеры глобальной экономики.\nЧтобы убрать национальный дух §Rразрушенной экономики§!, необходимо §Gзавершить§! фокусы в §Yэкономической ветке§!. Чем больше £text_icon_sov_ruble §YЭкономического Восстановления§! у вас есть, тем быстрее вы §Gуберёте§! этот §Rдебафф§!\n£text_icon_sov_ruble §YКапитализация§!: Крупнейшие компании в [SOV.GetFlag]§YРоссии§! имеют £text_icon_sov_ruble §Yкапитализацию§!, которая будет отображаться на этой панели. Она постоянно меняется из-за различных условий: приобретения новых активов в России и за рубежом, высокого или низкого уровня коррупции, войны, экономического роста и т. д.\nЕсли §Rкоммунисты§! находятся у §Yвласти§!, то £text_icon_sov_ruble §Yкапитализация§! перестает обновляться и изменяться.\nЕсли §2олигархи§! находятся у власти, £text_icon_sov_ruble §Yкапитализация§! компаний значительно §Rснижается§!."
