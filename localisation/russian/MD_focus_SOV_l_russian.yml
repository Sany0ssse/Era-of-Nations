 SOV_stab_fund_tt: "Когда экономический цикл достигает уровня §R$depression$§!, §Y$SOV_stab_fund_idea$§! будет использован в полном объеме для того, чтобы вытащить §Gэкономику§! из этого цикла.\n "
 russia.29.t: "Референдум по конституции Чеченской Республики"
 russia.29.d: "После окончания жестокого и кровопролитного конфликта у Чечни появилась возможность вернуться к мирной жизни. Следующий вопрос — как будут строиться её отношения с Москвой: останется ли она полностью интегрированным субъектом федерации или сохранит определённую автономию?"
 russia.29.o1: "Небольшая автономия им не навредит"
 russia.29.o2: "Я готов лично управлять Чечнёй."
 sov_vybory.2.t: "Путин избран президентом"
 sov_vybory.2.d: "Владимир Путин победил в первом туре президентских выборов, набрав 63,75% голосов. Было подсчитано 99% бюллетеней. Оппозиция поставила под сомнение легитимность результатов и пригрозила массовыми протестами. По последним данным Центральной избирательной комиссии, в выборах приняли участие 65,3% избирателей, имеющих право голоса."
 sov_vybory.2.a: "Лидер снова здесь!"
 sov_vybory.1.t: "Медведев избран президентом"
 sov_vybory.1.d: "Дмитрий Медведев, первый заместитель председателя правительства, одержал уверенную и ожидаемую победу на президентских выборах, сменив на этом посту Владимира Путина. Хотя Медведев обещает провести либеральные политические реформы, многие считают, что власть по-прежнему находится в руках Путина."
 sov_vybory.1.a: "Посмотрим, как у него получится!"
 rusboloto.1.t: "Протесты в Москве!"
 rusboloto.1.d: "Разочарованные очередной сменой политической власти, москвичи вышли на массовые протесты. По разным оценкам, в них приняли участие от 25 000 до 150 000 человек. Демонстрации в поддержку честных выборов прошли в 99 городах России и 45 городах за рубежом. Внезапное решение Департамента образования Москвы о проведении школьного экзамена только усилило общественный гнев. Протестующие, вооружённые самодельными плакатами, требуют честных и прозрачных выборов."
 rusboloto.1.a: "Раздавите их силами правопорядка!"
 rusboloto.1.b: "Если они этого захотят..."
 rusboloto.2.t: "Усиление протестов в Москве!"
 rusboloto.2.d: "Несмотря на сопротивление полиции, протестующие продолжают собираться на Болотной площади. По сообщениям, несколько офицеров получили ранения в результате того, что из толпы в них полетели бутылки и коктейли Молотова. В ответ полиция задержала оппозиционеров, но не стала применять газ. В отношении таких организаторов, как Навальный и Удальцов, сейчас ведутся расследования по статьям о подстрекательстве к массовым беспорядкам и насилию в отношении сотрудников правоохранительных органов."
 rusboloto.2.a: "Раздавите их силами правопорядка (снова)!"
 rusboloto.2.b: "Отлично."
 rusboloto.3.t: "Протесты были подавлены полицией"
 rusboloto.3.d: "Протестное движение не достигло своих целей и было успешно подавлено властями. Сейчас ситуация находится под контролем."
 rusboloto.3.a: "Отлично"
 sov_other.2.t: "Коммунисты, избранные в России"
 sov_other.2.d: "В результате серьёзных политических изменений к власти в России вернулась Коммунистическая партия. Обещая восстановить социалистический строй, она теперь продвигает идею полной идеологической трансформации. Новое руководство заявляет, что готово полностью изменить будущее России, вернув к жизни прошлое."
 sov_other.2.a: "Новый СССР?"
 sov_other.3.t: "Шутки Comedy Club о нашем президенте"
 sov_other.3.d: "Юмористы из популярного армянского телешоу «Камеди Клаб» недавно пошутили о нашем новоизбранном президенте. Стоит ли нам закрыть на это глаза или потребовать извинений за неуважение?"
 sov_other.3.a: "Пока нет."
 sov_other.3.b: "Попросите их извиниться."
 sov_other.6.t: "Большой русский марш"
 sov_other.6.d: "Недавно по всей России прошли массовые националистические марши с участием националистов, монархистов, православного духовенства и язычников-родноверов. Произошли столкновения с этническими меньшинствами из исламских республик. Ситуация нестабильна и может перерасти в нечто более опасное."
 sov_other.6.a: "Русские — Вперед!"
 sov_other.9.t: "Россия поддерживает Украину!"
 sov_other.9.d: "Новое демократическое правительство России выступило с дипломатической инициативой по улучшению отношений с Украиной. Она включает в себя культурную интеграцию, поддержку антикоррупционных усилий и предложения по взаимному сотрудничеству в создании демократических институтов."
 sov_other.9.a: "Братья навечно!"
 sov_other.9.b: "Истина в братстве"
 sov_other.10.t: "Россия помогает нам бороться с коррупцией!"
 sov_other.10.d: "В соответствии с новым соглашением о борьбе с коррупцией Россия оказала содействие в аресте и конфискации активов крупного коррумпированного олигарха. Это сотрудничество нанесло значительный удар по коррупции в нашей стране."
 sov_other.10.a: "Спасибо"
 SOV_undo_putin_TT: "Мы начнём ликвидацию беззаконной системы управления, которая существовала до нас!"
 SOV_nati_TT: "§Y Националистические батальоны §! присоединятся к нам"
 sov_other.11.t: "Масштабные военные учения России и НАТО!"
 sov_other.11.d: "После разворота в сторону Запада Россия начала проводить масштабные совместные военные учения с силами НАТО на своей территории. Эти учения символизируют начало новой эры сотрудничества и взаимного доверия."
 sov_other.11.a: "Когда-то враги, теперь друзья."
 sov_other.12.t: "Войска НАТО в России"
 sov_other.12.d: "В рамках нового западного альянса Россия разрешила разместить на своей территории силы НАТО для обеспечения региональной стабильности и общей безопасности."
 sov_other.12.a: "Хорошо.."
 SOV_combined_economic_system: "Комбинированная экономическая система"
 SOV_combined_economic_system_desc: "Находя компромисс между государственными институтами и интересами олигархов, мы разрабатываем уникальное российское решение для восстановления экономики. Баланс и контроль определят наш дальнейший путь."
 SOV_oligarchic_republic: "Олигархическая республика"
 SOV_oligarchic_republic_desc: "После того как олигархи завершили процесс слияния своих компаний, началась новая эра — эпоха олигархической России, где частная власть диктует национальную политику."
 SOV_continue_etatist_rise: "Продолжить восхождение этатистов"
 SOV_continue_etatist_rise_desc: "Россия не может позволить себе находиться под властью неуправляемых кланов олигархов, которые экспортируют наши ресурсы ради собственной выгоды. Нам нужно твёрдое руководство, и мы готовы его обеспечить."
 sov_other.13.t: "Российское предложение..."
 sov_other.13.d: "Новое демократическое правительство России предложило Украине заключить соглашение о взаимном признании языков. Русский язык получит официальный статус в Украине, а Россия будет способствовать развитию образования на украинском языке среди этнических украинцев. Эта инициатива направлена на укрепление мира, культурного обмена и долгосрочной дружбы между нашими народами."
 sov_other.13.a: "Замечательная идея!"
 sov_other.13.b: "Нет, извините"
 sov_other.14.t: "Украина приняла наше предложение!"
 sov_other.14.d: "Украина согласилась с нашим предложением о взаимной языковой интеграции. Началась новая эра сотрудничества."
 sov_other.14.a: "Отлично"
 sov_other.15.t: "Украина отклонила наше предложение!"
 sov_other.15.d: "Украина отклонила наше предложение о взаимной языковой интеграции и сотрудничестве."
 sov_other.15.a: "Почему?"

 #Liberals
 SOV_path_of_western: "Путь западничества"
 SOV_path_of_western_desc: "Холодная война окончена. Национализм и коммунизм остались в прошлом. Единственный путь вперёд — это демократия, ведущая к концу истории. Принятие западных ценностей и институтов обеспечит России место в современном мире."
 SOV_liberals_modifier: "Внутренняя политика новой России"
 SOV_liberals_modifier_desc: "Для политики, проводимой либералами, характерна концентрация на экономическом росте России и меньшая концентрация на военно-политических действиях."
 #Yabloko Focus
 SOV_ripe_apple: "Спелое яблоко"
 SOV_ripe_apple_desc: "Основана в 1993 году Явлинским, Болдыревым и Лукиным. «Яблоко» означает «яблоко» - по первым буквам фамилий основателей. Либерально-демократическая альтернатива коммунистической реставрации и растущему национализму. Годы партия отстаивала гражданские свободы, рыночные реформы с человеческим лицом и конец «вертикали власти». Теперь демократический президент занимает Кремль, и яблоко созрело."
 SOV_give_way_true_liberals: "Уступить дорогу истинным либералам"
 SOV_give_way_true_liberals_desc: "Десятилетия в оппозиции «Яблоко» полагалось на харизматическое лидерство. Теперь власть в руках. Технократы, региональные активисты, юристы гражданского общества, терпевшие притеснения при старом режиме, входят в правительство, и истинные реформаторы приступают к работе."
 SOV_destroy_oligarchs_by_oligarchs: "Уничтожить олигархов олигархами"
 SOV_destroy_oligarchs_by_oligarchs_desc: "Приватизация 1990-х создала горстку миллиардеров и море недовольства. Прямая конфронтация спровоцирует бегство капитала. Вместо этого заставить их конкурировать: антимонопольное регулирование, прозрачные аукционы, разукрупнение конгломератов. Государство будет арбитром, а не мародёром."
 SOV_strengthen_party_institute: "Укрепить партийный институт"
 SOV_strengthen_party_institute_desc: "При старой системе Государственная Дума была резиновой печатью. Реальные решения принимались в кремлёвских коридорах. Чтобы построить подлинную демократию, снизить избирательный барьер до 3%, позволив зелёным, регионалистам и новым левым движениям войти в парламент."
 SOV_bargain_regions: "Сделка с регионами"
 SOV_bargain_regions_desc: "«Вертикаль власти» - централизованная цепочка от Москвы до сельсоветов - была создана для предотвращения сепаратизма, но подавила местную инициативу. Теперь Кремль предлагает губернаторам договор: больше бюджетной автономии в обмен на лояльность и демократические реформы на региональном уровне."
 SOV_depoliticize_siloviki: "Департизировать силовиков"
 SOV_depoliticize_siloviki_desc: "Слишком долго спецслужбы были теневым правительством - внеправовые схемы, политические назначения, затыкание критиков. Новая администрация кладёт этому конец. Бюджеты разведки проверяются, внебюджетные фонды запрещаются, и офицеры должны выбирать: безопасность или политика, не то и другое."
 SOV_adapt_economic_realities: "Адаптация к экономическим реалиям"
 SOV_adapt_economic_realities_desc: "Наследие - бюджет, раздутый нефтяными доходами и искажённый коррупционными контрактами. Никаких печатных станков, никаких займов у дружественных банкиров. Чрезвычайные меры: заморозка расходов, пересмотр госзакупок, сокращение бюрократии. Горькое лекарство, но ответственные страны живут по средствам."
 SOV_destroy_KGB: "Уничтожить КГБ"
 SOV_destroy_KGB_desc: "Преемник советской тайной полиции всё ещё нависает над российской жизнью. Не контролируемый парламентом, он преследовал бизнес и манипулировал политикой. Лишить его политических функций, поставить под парламентский надзор, требовать судебного одобрения ордеров на слежку и перенаправить ресурсы на развитие малого бизнеса."
 SOV_kill_power_vertical: "Уничтожить вертикаль власти"
 SOV_kill_power_vertical_desc: "Конституция 1993 года дала президенту почти абсолютную власть: правление указами, роспуск парламента, назначение судей из лоялистов. Новое устройство сводит президентство к посреднической роли, усиливает Думу и создаёт независимый судебный совет, делая президента первым среди равных."
 SOV_reform_state_corporations: "Реформировать госкорпорации"
 SOV_reform_state_corporations_desc: "Роснефть, Газпром, РЖД - государственные гиганты стали империями кумовства, советы директоров заполнены силовиками. Разбить их, продать миноритарные доли через прозрачные IPO, а вырученные средства направить на пенсии, инфраструктуру и образование. Государственная собственность - инструмент, а не идеология."
 SOV_all_russian_center_infectious_diseases: "Всероссийский центр инфекционных заболеваний"
 SOV_all_russian_center_infectious_diseases_desc: "Советская санитарно-эпидемиологическая сеть рухнула в 1990-е. Новая пандемия может убить миллионы. Создать современный биомедицинский кластер для диагностики, разработки вакцин и раннего предупреждения. Здоровье - национальная безопасность, и молодые учёные вернутся из-за границы."
 SOV_democratization_education_system: "Демократизация системы образования"
 SOV_democratization_education_system_desc: "Образование колебалось между индоктринацией и хаотичной маркетизацией. Внедрить университетскую автономию, выборные факультетские советы, студенческое самоуправление. Школы учат критическому мышлению, а не зубрёжке, потому что демократия не может успешно существовать, если граждан учат подчиняться."
 SOV_consolidation_european_left: "Консолидация с европейскими левыми"
 SOV_consolidation_european_left_desc: "Россия - часть Европы культурно и политически. Социал-демократы и зелёные разделяют наши ценности: мир, социальная справедливость, защита окружающей среды. Построить сеть сестринских партий, провести московский саммит европейских левых и координировать действия по климату и трудовым правам, чтобы преодолеть менталитет Холодной войны."
 SOV_idealistic_liberalism: "Идеалистический либерализм"
 SOV_idealistic_liberalism_desc: "Часть «Яблока» утверждает, что социал-демократия - это компромисс. Они ставят права человека, европейскую интеграцию и дерегуляцию рынка выше социальных расходов. Левые называют это предательством, и партия должна выбирать."
 SOV_russian_green_deal: "Российская зелёная сделка"
 SOV_russian_green_deal_desc: "Экономика России построена на ископаемом топливе - угле, нефти, газе. Это обогатило олигархов, загрязнило воздух, опустошило Арктику. Запустить поэтапный переход к возобновляемой энергии: ветер, солнце, зелёные технологии. Угольным городам нужна поддержка, но будущее за зелёным ростом."
 SOV_against_militarism: "Против милитаризма"
 SOV_against_militarism_desc: "Призыв - пережиток тотальной войны, загоняющий молодых людей в казармы и отправляющий их умирать за амбиции старой элиты. Отменить призыв полностью в пользу профессиональной, добровольческой армии, ориентированной на оборону. Без большого призывного резерва Россия не сможет начинать крупномасштабные войны."
 SOV_homes_land_roads: "Земля-Дома-Дороги"
 SOV_homes_land_roads_desc: "Каждая российская семья получает бесплатный участок земли - до 60 гектаров в Сибири и на Дальнем Востоке - для строительства собственного дома. Государство финансирует дороги, газ, электричество и школы, создавая 14 миллионов новых домовладельцев в течение семи лет и превращая нацию в страну мелких собственников."
 SOV_protect_minorities: "Защита меньшинств"
 SOV_protect_minorities_desc: "Россия - многоэтническая федерация. Старый режим использовал «разделяй и властвуй» для сохранения контроля. Обратить это вспять с помощью культурной автономии, образования на родном языке и регионального самоуправления. Сепаратизм - это риск, но доверие и децентрализация управляют им лучше, чем полиция и пропаганда."
 SOV_doctrine_peaceful_approach: "Доктрина мирного подхода"
 SOV_doctrine_peaceful_approach_desc: "Холодная война окончена, но взаимное недоверие продолжается. Разорвать круг, пригласив членов НАТО на мирный саммит в Санкт-Петербурге. Повестка: взаимный отказ от применения силы, отказ от «сфер влияния», совместная нестратегическая противоракетная оборона. Мир нельзя поддерживать силой; его можно достичь только через понимание."
 SOV_creative_freedom: "Творческая свобода"
 SOV_creative_freedom_desc: "Цензура и страх быть помеченным «иностранным агентом» задушили российское искусство и журналистику. Отменить репрессивные законы, ликвидировать органы цензуры, прекратить преследование независимых СМИ. Художники и писатели могут свободно критиковать - творческое общество процветает, и утечка мозгов обратится вспять."
 SOV_investments_manufacturing_industry: "Инвестиции в обрабатывающую промышленность"
 SOV_investments_manufacturing_industry_desc: "Десятилетиями Россия экспортировала сырьё и импортировала готовые товары - деиндустриализация и зависимость. Запустить государственную поддержку реиндустриализации: налоговые льготы для производства, инфраструктура для индустриальных парков, государственные закупки в пользу отечественных производителей. Устойчивость, не автаркия, и страна, которая не может производить свои собственные машины, не может быть по-настоящему суверенной."
 SOV_tight_market_regulation: "Жёсткое регулирование рынка"
 SOV_tight_market_regulation_desc: "Дикий капитализм 1990-х оставил миллионы в нищете. Ввести новые правила: минимальная зарплата, привязанная к инфляции, обязательные коллективные переговоры, ограничения монополий. Корпорации платят свою справедливую долю, потому что экономическая эффективность должна служить социальной справедливости."
 SOV_judicial_reform: "Судебная реформа"
 SOV_judicial_reform_desc: "Российские суды прозвали «телефонным правосудием» - судьи получали указания от прокуроров или региональных начальников. Сделать суды независимыми: пожизненное назначение судей, избрание председателей судов судебными советами, суды присяжных по политическим делам и новое антикоррупционное бюро вне прокуратуры. Верховенство закона - единственная гарантия от тирании."
 SOV_inviolability_private_property: "Неприкосновенность частной собственности"
 SOV_inviolability_private_property_desc: "Хаос 1990-х сделал право собственности шуткой. Сделать их священными: никакой экспроприации без справедливой компенсации, ускоренные коммерческие суды, защита миноритарных акционеров. Владельцы малого бизнеса - основа среднего класса - больше не будут бояться рейдеров, и государство существует для защиты собственников, а не для наживы на них."
 SOV_destroy_historical_hate: "Уничтожить историческую ненависть"
 SOV_destroy_historical_hate_desc: "Радикальные партии - националистическая ЛДПР, неонацистская НБП и «нейтральные коммунисты» - использовали российские травмы для продвижения ксенофобии и насилия. Запретить их, конфисковать их активы, привлечь к ответственности их лидеров за разжигание ненависти. Демократия не может терпеть тех, кто клянётся её уничтожить, потому что терпимость - это договор, а не пакт о самоубийстве."
 SOV_peoples_capitalism_program: "Программа народного капитализма"
 SOV_peoples_capitalism_program_desc: "Приватизация 1990-х была «полным фиаско» - горстка банкиров стала миллиардерами, пока миллионы потеряли сбережения. Запустить вторую волну: передать малый бизнес работникам, продавать крупные предприятия через публичные IPO с индивидуальными лимитами на покупку и обеспечить, чтобы ни один акционер не владел более чем 10% крупной компании - капитализм для многих, а не для избранных."
 SOV_down_totalitarian_state: "Долой тоталитарное государство"
 SOV_down_totalitarian_state_desc: "Советское наследие - это менталитет: государство владеет гражданином, инакомыслие - измена, власть принадлежит тем, у кого есть оружие. Закрыть эту эру. Государство существует для служения человеку: сократить административные и полицейские бюджеты, отменить законы о слежке, пересмотреть прошлые политические убеждения. Россия больше не будет «вертикалью власти», а станет домом для свободных людей."
 #Yabloko Events
 sov_yabloko.0.t: "Явлинский избран президентом"
 sov_yabloko.0.d: "На исторических выборах победу одержал Григорий Явлинский. Лидер партии «Яблоко» давно утверждал, что «для Президента России существует только одна программа действий - это Конституция страны, принятая всем народом, и законы, принятые парламентом России». Теперь у него наконец появится шанс воплотить это в жизнь - демонтировать вертикаль власти, покончить с засильем силовиков и олигархов и сделать Конституцию реальностью, а не украшением. Его победа приносит надежду миллионам - и ярость старым элитам."
 sov_yabloko.0.a: "Будущее - некоммунистическая и небандитская Россия."
 sov_yabloko.1.t: "Кабинет реформаторов"
 sov_yabloko.1.d: "Решением, уже вызвавшим раскол в политической среде, президент утвердил новый состав правительства и администрации из представителей «Яблока». Рыночные либералы, институциональные реформаторы и сторонники гражданского общества обещают модернизировать государство, сократить коррупцию и вернуть доверие к власти. Явлинский давно настаивает, что «государство существует для того, чтобы служить человеку», и теперь, когда истинные реформаторы наконец приходят к власти, сторонники называют это давно назревшей коррекцией курса, хотя критики предупреждают: одного идеализма недостаточно, чтобы удержать страну от распада."
 sov_yabloko.1.a: "Пусть работают"
 sov_yabloko.2.t: "Конкуренция приносит плоды"
 sov_yabloko.2.d: "Сделка с олигархами сработала. Вынужденные конкурировать вместо сговора, предприятия сокращают издержки, инвестируют в инновации и снижают потребительские цены. Промышленная эффективность растёт, иностранные партнёры охотнее торгуют, а казна получает дополнительные доходы от оживления экономики. Утверждение Явлинского, что «количество олигархов в России должно стремиться к нулю», не забыто, но пока даже старые элиты ворчат в тишине - потому что цифры говорят сами за себя."
 sov_yabloko.2.a: "Рынок работает."
 sov_yabloko.3.t: "Соглашение с регионами"
 sov_yabloko.3.d: "Новые реформы и смена политического курса встревожили губернаторов. Президент Явлинский предлагает им сделку: в обмен на лояльность и содействие демократизации регионы получат большую экономическую и административную автономию. Он давно предупреждал, что опасен «федерализм, больше похожий на феодализм, когда отношения между центром и регионами строятся на личных связях губернатора и президента». Критики называют это опасной уступкой сепаратизму, но правительство считает, что иначе не избежать нового «парада суверенитетов» и разрушения государства."
 sov_yabloko.3.a: "Построим сбалансированную федерацию."
 sov_yabloko.4.t: "Конституционная реформа"
 sov_yabloko.4.d: "Президент Явлинский подписывает пакет поправок, лишающих пост президента избыточных полномочий. Никаких указов, подменяющих законы. Никакого роспуска Думы по желанию. Никаких назначенных судей из кремлёвского списка. Президент становится первым среди равных. Парламент получает реальный контроль, суды - независимость, регионы - вздох облегчения. Как давно настаивал Явлинский, «президент должен быть лишён возможности издавать любые секретные указы», а «вмешательство президента в экономическую политику государства недопустимо». Старая гвардия называет это «кастрацией власти», но это основа республики, где никто не стоит над законом."
 sov_yabloko.4.a: "Баланс, а не доминирование."
 sov_yabloko.5.t: "Раскол левого фланга"
 sov_yabloko.5.d: "Социал-демократическое крыло «Яблока» рассчитывало на сильное государство всеобщего благосостояния, радикальное перераспределение и приоритет социальных расходов. Вместо этого они обвиняют правительство в «идеалистическом подходе в экономике» - абстрактные либеральные ценности ставятся выше социальной справедливости и материального благополучия простых людей. Однако Явлинский всегда утверждал, что «рыночную экономику нельзя строить людоедскими методами» и что реформы должны служить людям, а не разорять их. Не имея возможности влиять на курс, десятки левых членов покидают партию в знак протеста. Урон имиджу «Яблока» среди бедных и рабочего класса уже нанесён."
 sov_yabloko.5.a: "Мы находимся на правильной стороне истории."
 sov_yabloko.6.t: "Народный капитализм"
 sov_yabloko.6.d: "Итогам приватизации 1990-х даётся официальная оценка «полное фиаско» - вместо широкого класса собственников страна получила «семибанкирщину» и чудовищное неравенство. Явлинский давно утверждал, что ключевая задача реформы - «формирование среднего класса - слоя населения, обладающего собственностью». Президент объявляет новый курс: построение «народного капитализма». Программа включает массовую передачу малого бизнеса гражданам, жёсткие ограничения на консолидацию активов (никто не может владеть более 10% крупных предприятий), а новые приватизации - только через механизмы публичного рынка. Цель - создать миллионы мелких собственников, основу стабильной демократии."
 sov_yabloko.6.a: "Собственность для миллионов, а не для избранных."
 sov_yabloko.7.t: "Россия приглашает НАТО на мирный саммит в Петербурге"
 sov_yabloko.7.d: "Президент России Григорий Явлинский направил официальное приглашение Соединённым Штатам и их союзникам по НАТО принять участие в историческом мирном саммите в Санкт-Петербурге. Он предлагает новый «Договор об общеевропейском доме», включающий взаимный отказ от применения силы, отказ от логики «сфер влияния», совместную нестратегическую ПРО на основе российских и европейских технологий, а также единый центр по борьбе с новыми угрозами. Как давно предупреждал Явлинский: «Идея создать в Европе систему ПРО как противовес США - глупость. Оторвать Европу от Америки и разрушить НАТО нам не удастся. Кончится это тем, что они всё равно будут вместе, а мы останемся на обочине». Сегодня он выбирает другой путь - не конфронтацию, а общий стол."
 sov_yabloko.7.a: "Принять приглашение"
 sov_yabloko.7.b: "Мы не доверяем Кремлю"
 sov_yabloko.8.t: "[FROM.GetName] принимает наше предложение"
 sov_yabloko.8.d: "[FROM.GetName] принял наше приглашение на мирный саммит в Санкт-Петербурге. Прямой диалог между Россией и этим членом НАТО становится возможным. Впервые старый тезис Явлинского - что мы должны сесть за один стол, иначе останемся на обочине - начинает воплощаться в жизнь. Небольшой, но важный шаг к общему европейскому дому."
 sov_yabloko.8.a: "Шаг к диалогу"
 sov_yabloko.9.t: "[FROM.GetName] отклоняет наше предложение"
 sov_yabloko.9.d: "[FROM.GetName] отклонил наше приглашение на мирный саммит в Санкт-Петербурге, ссылаясь на недоверие к Кремлю. «Оторвать Европу от Америки и разрушить НАТО нам не удастся, - предсказывал Явлинский. - Кончится это тем, что они всё равно будут вместе, а мы останемся на обочине». Сегодня его слова звучат пророчески. Диалога пока не будет - но дверь остаётся открытой."
 sov_yabloko.9.a: "Мы продолжим попытки"
 sov_yabloko.10.t: "Анатолий Голов становится премьер-министром"
 sov_yabloko.10.d: "Президент Явлинский объявляет о масштабных перестановках в кабинете, передавая ключевые министерские посты социал-демократическому крылу «Яблока». Новым премьер-министром становится Анатолий Голов - опытный социальный законодатель, бывший председатель Социал-демократической партии России. Другие левые фигуры также входят в правительство, чтобы укрепить трудовые права, общественное здравоохранение и социальное обеспечение. Европейские социалистические партии и «зелёные» тепло приветствуют этот поворот, видя в нём новую возможность для идеологического партнёрства. «Яблоко» наконец становится не просто либеральной, а подлинно социал-демократической силой."
 sov_yabloko.10.a: "Прагматичный выбор."
 sov_yabloko.11.t: "Московский саммит европейских левых"
 sov_yabloko.11.d: "Москва становится неформальной столицей европейских левых. Кремль приглашает ведущие левые партии десятков стран для обсуждения общей повестки. В центре внимания - климатические изменения, борьба с неравенством и укрепление систем общественного здравоохранения. В мире, всё глубже погружающемся в национализм и правый популизм, Россия Явлинского становится мостом между Востоком и Западом - не через милитаризм, а через солидарность и общие ценности."
 sov_yabloko.11.a: "Новая эра партнёрства."
 sov_yabloko.12.t: "Зачистка политического поля"
 sov_yabloko.12.d: "Демократы ликуют - наконец-то государство перестало терпеть тех, кто годами плевал в закон. Националисты и левые рвут и мечут: их газеты пестрят заголовками о «либеральной диктатуре», «социальном фашизме» и «предательстве национальных интересов». Явлинский, однако, всегда настаивал: «Терпимость - это не пакт о самоубийстве. Демократия не может терпеть тех, кто клянётся её уничтожить». Радикальные партии - националистическая ЛДПР, неонацистская НБП - запрещены, их активы конфискованы. Только старые элиты втихомолку улыбаются: чистка политического поля всегда идёт на руку тем, кто привык договариваться в тишине."
 sov_yabloko.12.a: "Никакой терпимости к радикалам."
 sov_yabloko.13.t: "Исторический саммит НАТО открывается в Петербурге"
 sov_yabloko.13.d: "Впервые со времён Холодной войны страны-члены НАТО и Россия садятся за один стол в Санкт-Петербурге. «Общий европейский дом» - когда-то мечта 1990-х - внезапно становится реальностью.\n\nЗападные СМИ называют это геополитическим землетрясением. Российские националисты в ярости: «Явлинский - натовский агент!» Но сам президент цитирует свои старые слова: «Оторвать Европу от Америки и разрушить НАТО нам не удастся. Кончится это тем, что они всё равно будут вместе, а мы останемся на обочине. Сегодня мы выбираем другой путь - садимся с ними за один стол».\n\nПереговоры напряжённые. В повестке: взаимное сокращение сил, совместная ПРО, новый пакт о безопасности. Мир наблюдает с осторожной надеждой. Старые элиты в Москве молчат - они не знают, аплодировать или паниковать."
 sov_yabloko.13.a: "Невероятное свершилось."

 #Yabloko Ideas
 SOV_oligarch_competition_start_idea: "Олигархи начинают конкурировать"
 SOV_oligarch_competition_start_idea_desc: "Кремль вынудил крупные бизнес-кланы к открытой конкуренции. За закрытыми дверями они лихорадочно перестраивают активы, прячут деньги и сокращают всё, кроме собственной безопасности. Налоговые чиновники лишь разводят руками. Экономика барахтается, старые сети сговора рушатся. Сами олигархи в ярости - но пока играют по новым правилам."
 SOV_oligarch_competition_idea: "Олигархическая конкуренция"
 SOV_oligarch_competition_desc_idea: "Вынужденные конкурировать вместо сговора, крупные бизнес-кланы инвестируют в инновации, сокращают издержки и снижают потребительские цены. Рыночная эффективность растёт, внешняя торговля процветает, а казна получает дополнительные доходы от оживления экономики."
 SOV_yavlinsky_fiscal_discipline: "Фискальная дисциплина Явлинского"
 SOV_constitutional_balance_idea: "Конституционный баланс властей"
 SOV_manufacturing_modernization_idea: "Модернизация промышленности"
 SOV_manufacturing_modernization_idea_desc: "Государственные субсидии, налоговые льготы и инфраструктурные вложения вызвали бум в обрабатывающей промышленности. Новые заводы строятся, старые модернизируются, производительность резко растёт. Казна несёт расходы, но долгосрочная выгода, как ожидается, перевесит краткосрочные затраты."
 SOV_peoples_capitalism_idea: "Народный капитализм"

