 russia.43.t: "Россия предлагает нам защиту"
 russia.43.d: "В последнее время наш народ понял, что если мы не получим защиты от сильной страны, то нашу страну уничтожат более сильные противники. Поэтому мы должны обезопасить себя и свой народ, войдя в состав России."
 russia.43.a: "Пришло время обеспечить безопасность нашей страны"
 SOV_eu_state: "Настоящее западное государство"
 SOV_new_pensions_reform: "Новая пенсионная реформа"
 SOV_demonopolisation_reform: "Демонополизация стратегической отрасли"
 russian_legacy_empire: "£text_icon_sov_empire Имперское наследие"
 russian_legacy_empire_desc: "Россия всегда была великой империей, и мы не откажемся от этого наследия в погоне за мимолетными демократическими иллюзиями."
 russian_legacy_democratic: "£text_icon_sov_democratic Демократическое наследие"
 russian_legacy_democratic_desc: "Хотя Россия пережила длительные периоды самодержавия, в её истории были и моменты демократических надежд. Мы сохраним и приумножим это наследие свободы."
 russian_legacy: "£text_icon_sov_empire Российское наследие"
 russian_legacy_desc: "На протяжении веков Россия шла своим уникальным путём, зачастую в изоляции и под властью сильных правителей. Перемены происходят медленно, но, возможно, настало время для преобразований."
 SOV_idea_restalinization: "Ресталинизация"
 SOV_idea_restalinization_desc: "Россия сошла с праведного пути. Чтобы восстановить нашу силу и независимость, мы должны вернуться к методам и идеям Сталина."
 sov_war_cult_idea: "Культ войны"
 sov_war_cult_idea_desc: "\n\n\n\n£GFX_BANNER_sov_cult_war\n\n\n\n\n\n История России — это история войн и побед. От Наполеона до Гитлера мы сталкивались с бесчисленными угрозами. Эта история породила глубокое культурное почитание силы и самопожертвования."
 SOV_democracy_taiwam_category: "Российская демократия в Тайване"
 SOV_democracy_taiwam_category_desc: "Тайвань по-прежнему является бельмом на глазу у Китая. По мере усиления нашего соперничества с Китаем обеспечение влияния на Тайвань становится одним из наших стратегических приоритетов."
 SOV_boost_opinion_of_rus: "Продолжайте улучшать отношения"
 SOV_more_weapon_taiwan: "Больше оружия для Тайваня"
 SOV_invest_taiwan: "Инвестиции в Тайвань"
 SOV_puppet_taiwan: "Покорить Тайвань"
 SOV_Civil_Nationalism_idea: "Истинный гражданский национализм"
 SOV_Free_Russia_idea: "Свободная Россия"
 SOV_Russian_Microchip_idea: "Baikal Core i9"
 russia.52.t: "Российская делегация на Тайване"
 russia.52.d: "Российская делегация прибыла с предложением: приобрести долю в нашей технологии производства микрочипов в обмен на важнейшие российские ресурсы. Эта сделка может быть выгодна обеим сторонам."
 russia.52.a: "Это выгодная сделка"
 russia.52.b: "Россия? И сколько в ней дивизий?"
 russia.53.t: "Тайвань отказался от сделки"
 russia.53.d: "Правительство Тайваня отклонило наше предложение, посчитав его невыгодным. Переговоры сорвались, и напряжённость может возрасти."
 russia.53.a: "Тайвань просто не признает доминирования байкальских процессоров"
 russia.54.t: "Воздушно-космические силы России"
 russia.54.d: "Российские вооружённые силы официально создали новое подразделение — Воздушно-космические силы. Эта реформа направлена на более эффективную интеграцию воздушных и космических операций."
 russia.54.a: "Ура!"
 russia.58.t: "Реформы в армии"
 russia.58.d: "Наши военные реформы начинают приносить плоды. В наши ряды пришли новые талантливые генералы, которые привносят в нашу работу силу и профессионализм."
 russia.58.a: "Хорошо"
 russia.59.t: "Реформы в армии"
 russia.59.d: "Наши военные реформы начинают приносить плоды. В наши ряды пришли новые талантливые генералы, которые привносят в нашу работу силу и профессионализм."
 russia.59.a: "Хорошо"
 russia.60.t: "Малороссийская Республика"
 russia.60.d: "Мы создали государство Малороссию на территории Украины. Теперь вопрос в том, должны ли мы установить прямой контроль над этой новой республикой."
 russia.60.a: "Да"
 russia.60.b: "Нет"
 russia.61.t: ""
 russia.61.d: ""
 russia.61.a: ""
 russia.62.t: "Крушение Ми-8 под селом Ермаковское"
 russia.62.d: "В апреле 2002 года генерал Александр Лебедь трагически погиб в возрасте 53 лет в результате крушения вертолёта Ми-8 недалеко от озера Ойское в Восточных Саянах. Во время полёта в плохую погоду вертолёт врезался в линии электропередачи, в результате чего погибли ещё семь человек. Официальной причиной крушения была названа плохая подготовка экипажа, но есть и альтернативные версии, предполагающие саботаж или принуждение к полёту в небезопасных условиях. Из-за противоречивых сообщений и отсутствия подробных аэронавигационных карт точная причина крушения остаётся неизвестной."
 russia.62.a: "трагедия"
