 S0V_15th_idea: "15-я отдельная гвардейская мотострелковая бригада"
 SOV_spetznaz_o: "Спецподразделение \"O\""
 SOV_russian_army_idea: "£text_icon_sov_army Российская армия"
 SOV_russian_army_idea_desc: "Российская армия — это лишь бледная тень некогда советской, огромной и грозной силы. Теперь перед Россией стоит задача возродить былую мощь армии государства, которое всегда участвовало в мировой политике и непосредственно на неё влияло."
 SOV_otkos_army_idea: "Выплаты за военную службу"
 SOV_military_univer_idea: "Военный департамент"
 SOV_kazachestvo_idea: "казаки"
 SOV_pmc_idea: "Российские ЧВК"
 SOV_pmc_idea1: "Российские ЧВК"
 SOV_morpehi_idea: "Корпус морской пехоты"
 SOV_vdv_idea: "Воздушно-десантные войска"
 SOV_oligarch_supply_army_idea: "Финансовая поддержка олигархов"
