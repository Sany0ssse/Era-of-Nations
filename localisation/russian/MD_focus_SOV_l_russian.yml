 SOV_perimetr_activate: "Россия активирует \"Мертвую руку\""
 SOV_perimetr_deactivate: "Россия деактивирует \"Мертвую руку\""

 SOV_perimetr_system: "Реанимировать \"Мертвую руку\""
 SOV_perimetr_system_desc: "Система Периметр - это автоматическая или полуавтоматическая система управления ядерным оружием. Она может инициировать запуск российских межконтинентальных баллистических ракет (МБР), отправив предварительно введенный приказ высшего руководства из Генерального штаба Вооруженных сил, Управления ракетных войск стратегического назначения на командные пункты и отдельные шахты, если ядерный удар будет обнаружен сейсмическими датчиками, датчиками освещенности, радиоактивности и давления, даже если структура командования была поражена."

 # Opinion modifiers#
 SOV_perimetr_om: "Система \"Периметр\" активна"

 SOV_triedinaya_ukraine: "Наши интересы на Украине"
 SOV_triedinaya_ukraine_desc: "Украина - особая страна, исторически наиболее близкая нам, а её территориальный размер требует особого взаимодействия с ней."
 SOV_triedinaya_dpr: "Референдум народных республик"
 SOV_triedinaya_dpr_desc: "Народные республики должны быть официально включены в состав нашей страны, и эти полумеры необходимо прекратить."
 SOV_triedinaya_vrp: "Мятежные народные республики"
 SOV_triedinaya_vrp_desc: "Даже такие уникальные западноукраинские республики должны быть частью нашей родины!"
 SOV_triedinaya_mlr: "Проект «Малороссия»"
 SOV_triedinaya_mlr_desc: "Проект, начинавшийся как интернет-мем, станет флагманом нашего территориального присутствия на землях бывшей Украины."
 SOV_triedinaya_mlr_annex: "Интеграция Малороссии"
 SOV_triedinaya_mlr_annex_desc: "У каждого проекта есть конец, и теперь пришло время завершить этот проект и интегрировать эту страну в нашу родину."
 SOV_triedinaya_crm: "Крым в родную гавань"
 SOV_triedinaya_crm_desc: "Наконец, историческая несправедливость будет исправлена - Крым возвращается домой."

 SOV_our_cars_tt: "Идея §YОтечественная автомобильная промышленность§! будет улучшена"