 SOV_koba_politic_modifier_desc: "Концепция общественной безопасности дает понимание того, почему мы счастливы или нет, почему кто-то здоров, а кто-то болен, почему кто-то удачлив, а кто-то нет, и как на это повлиять. Это ответы на вопросы: что такое хорошо и что такое плохо, что такое стыд и совесть, что такое интуиция и почему одни ее слушают, а другие нет, и действительно ли трудно изменить судьбу?"
