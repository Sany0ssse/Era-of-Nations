##########JIRINOVSKYI - RUSSIAN EMPIRE##########
##########Focuses##########
 SOV_zhirinovsky: "Владимир Жириновский"
 SOV_zhirinovsky_desc: "Владимир Жириновский (род. 1946) с 1991 года возглавляет ультранационалистическую Либерально-демократическую партию России. Известный своей пламенной риторикой и скандальной дракой с соками с центристом Борисом Немцовым в 1995 году, Жириновский выступает за агрессивную и непредсказуемую политику. Среди его наиболее радикальных предложений — заражение стран Балтии, входящих в НАТО, радиоактивными отходами, распылёнными с воздуха. Его противоречивые идеи продолжают формировать националистический дискурс в России."
 SOV_bumaga: "Объединены только на бумаге"
 SOV_bumaga_desc: "Хотя ЛДПР находится у власти, внутренние разногласия сохраняются, подрывая партийную сплочённость. Несмотря на видимое единство на бумаге, фракции тянут в разные стороны. Пришло время наконец объединить нашу партию и устранить внутренние конфликты, чтобы выступать единым и последовательным фронтом."
 SOV_jirik_partiya: "Партия Жириновского"
 SOV_jirik_partiya_desc: "Партия Жириновского едина вокруг своего лидера. Лояльность и дисциплина укрепили ядро партии, позволив ей с убеждением проводить националистическую повестку. Это единство укрепляет наши позиции на политической арене России."
 SOV_jirik_partiya_chistki: "Чистки в партии"
 SOV_jirik_partiya_chistki_desc: "Пришло время очистить партию от вольнодумцев и потенциальных предателей, угрожающих нашему единству. Удалив инакомыслящих, мы обеспечим дисциплинированную и послушную организацию. Эта чистка жизненно важна для обеспечения нашего политического будущего."
 SOV_jirik_partiya_total_control: "Полный контроль"
 SOV_jirik_partiya_total_control_desc: "Наша партия должна быть полностью под нашим контролем, чтобы предотвратить любое восстание или несанкционированные действия. Абсолютное доминирование над всеми партийными функциями обеспечивает эффективность и лояльность. Только через полный контроль мы сможем достичь наших целей."
 SOV_jirik_partiya_and: "Жириновский и партия"
 SOV_jirik_partiya_and_desc: "Власть партии не покоится исключительно на её лидере; она дополняет и поддерживает его. Эти симбиотические отношения позволяют координировать руководство и обеспечивать более широкую поддержку различных партийных фракций. Вместе они образуют единую силу."
 SOV_jirik_partiya_and_kadres: "Прагматичный подход к кадровым ресурсам"
 SOV_jirik_partiya_and_kadres_desc: "Вместо требования слепой лояльности мы будем искать для партии наиболее эффективных и способных сотрудников. Компетентность и результаты будут важнее простой преданности, что обеспечит более сильное и эффективное руководство."
 SOV_jirik_partiya_and_autonomous: "Автономная партия"
 SOV_jirik_partiya_and_autonomous_desc: "Автономная партия гарантирует свободу мнений и разнообразие в своих рядах. Разрешение внутренней независимости поощряет инновации и дебаты, что укрепит нашу политическую платформу и адаптивность."
 SOV_russian_irredentism: "Русский ирредентизм"
 SOV_russian_irredentism_desc: "Россия когда-то была великой империей, но была ослаблена революциями, переворотами и гражданскими войнами. Теперь мы должны восстановить нашу былую славу, вернув утраченные территории. Крым и Донбасс принадлежат нам, и наши танки дойдут до Праги. Это наша судьба и наш долг."
 SOV_governorates: "Губернии"
 SOV_governorates_desc: "Мы пережили слишком много национальных республик и маргинализацию этнических русских. Разделив страну на 30 губерний, мы сможем управлять более эффективно и объединить государство. Эта реформа укрепляет центральную власть и восстанавливает порядок."
 SOV_strengthen_union_state: "Минская губерния"
 SOV_strengthen_union_state_desc: "Пришло время покончить с мнимой независимостью Беларуси. Восстановление Беларуси как губернии в составе нашей империи — лучший способ обеспечить стабильность и контроль. Эта реинтеграция пойдёт на пользу обоим народам и укрепит наши границы."
 SOV_maintain_csto_1: "Распустить ОДКБ"
 SOV_maintain_csto_1_desc: "ОДКБ — ненужная и неэффективная организация, которая больше не служит нашим интересам. Пришло время распустить её и отказаться от устаревших альянсов. Наше будущее — в более сильных и целенаправленных партнёрствах."
 SOV_rus_sphere_united_arms: "Московский пакт"
 SOV_rus_sphere_united_arms_desc: "Мы должны создать новый мощный политический и военный альянс. Старые соглашения нас подвели; пришло время сформировать нашу собственную коалицию, которая будет отстаивать наше влияние в мире и бросать вызов доминированию Запада."
 SOV_integrate_abkhazia: "Тифлисская губерния"
 SOV_integrate_abkhazia_desc: "Мы должны сосредоточиться на землях бывшей Российской империи на Кавказе. Продолжающиеся грузино-осетино-абхазские конфликты угрожают региональной стабильности. Наша цель — навсегда положить конец этим спорам и восстановить порядок под нашим контролем."
 SOV_support_serbia: "Поддержка Сербии"
 SOV_support_serbia_desc: "Сербия остаётся нашим ключевым союзником в Южной Европе. Мы должны оказывать помощь всякий раз, когда она нужна, чтобы укрепить это жизненно важное партнёрство и продвигать наши общие интересы в регионе."
 SOV_integrate_serbia: "Союзное государство с Сербией"
 SOV_integrate_serbia_desc: "Мы предложим Сербии возобновить проект Союзного государства, который наша партия активно поддерживала в 1990-х годах. Этот союз углубит сотрудничество и укрепит наши стратегические позиции в Европе."
 SOV_czechoslovak_region: "Покончить с чешским развратом"
 SOV_czechoslovak_region_desc: "Чешская республика стоит у нас на пути, и мы не остановимся, пока они не согнутся или не исчезнут как нация."
 SOV_help_armenia: "Армяно-русский союз"
 SOV_help_armenia_desc: "Армения всегда была братской христианской страной с глубокими связями с нами. Мы готовы предложить Армении подлинный союз, основанный на доверии и взаимной поддержке. Наша дружба уходит корнями в многовековую общую историю."
 SOV_alliance_armenia: "Покончить с Азербайджаном"
 SOV_alliance_armenia_desc: "Сфабрикованная история Азербайджана лишь мешает нашей братской Армении. Мы противостоим этому препятствию и решим его, чтобы обеспечить безопасность и процветание Армении."
 SOV_Bring_back_the_legacy_of_the_Russian_Empire: "Вернуть наследие Российской империи"
 SOV_Bring_back_the_legacy_of_the_Russian_Empire_desc: "Пришло время восстановить исторические названия российских городов, отдавая дань нашему наследию. Это возрождение воссоединит нас с нашим славным прошлым и пробудит национальную гордость по всей стране."
 SOV_protect_russians: "Закон о защите россиян"
 SOV_protect_russians_desc: "Мы будем защищать русских, где бы они ни жили, отказываясь бросать наших соотечественников. Этот закон гарантирует их права и безопасность, укрепляя нашу приверженность русскому народу повсюду."
 SOV_Former_Russian_capital: "Бывшая столица России"
 SOV_Former_Russian_capital_desc: "Чтобы вернуть наследие России, мы должны снова сделать Санкт-Петербург нашей столицей. Этот символический шаг восстановит исторический статус города и подтвердит нашу приверженность традициям."
 SOV_approach_iran: "Дружба с Ираном"
 SOV_approach_iran_desc: "Мы планируем предложить Ирану союз, который значительно укрепит наши позиции в регионе. Создание этого партнёрства является ключом к обеспечению влияния и противодействию западному вмешательству."
 SOV_south_azer_admistration: "Иранская провинция"
 SOV_south_azer_admistration_desc: "Мы намерены поддержать лояльные нам местные силы в Южном Азербайджане, чтобы они начали восстание, которое ослабит хватку Ирана. Эта стратегия направлена на дестабилизацию иранского контроля и расширение нашего влияния."
 SOV_unite_of_greater_russia: "Единая, Великая и Неделимая"
 SOV_unite_of_greater_russia_desc: "Россия должна быть единой, неделимой страной без национальных перегородок. Фрагментация на республики когда-то разрушила наше могучее государство, и только единство может восстановить нашу силу."
 SOV_proclamation_of_greater_russia: "Провозглашение Великой России"
 SOV_proclamation_of_greater_russia_desc: "Теперь Россия — глобальная сверхдержава, доминирующая в Евразии и формирующая мировую политику. Обладая новой силой, мы противостоим Западу и обеспечим себе законное место на мировой арене."
 SOV_zhirinovsky_secure_central_asia: "Требовать подчинения Центральной Азии"
 SOV_zhirinovsky_secure_central_asia_desc: "Центральная Азия всегда была в нашей сфере влияния. Мы должны прочно удерживать её, чтобы не дать иранцам или китайцам закрепиться. Наше господство там не подлежит обсуждению."
 SOV_nov: "Возвращение Новороссии"
 SOV_nov_desc: "Пришло время вернуть Новороссию на её законное место в составе нашей империи. Восстановление этого региона укрепляет наши южные границы и возрождает наше историческое наследие."
 SOV_galicia: "Галицкая губерния"
 SOV_galicia_desc: "Галиция — уникальный регион, требующий обширных реформ для полной интеграции в нашу империю. Хотя это потребует времени, Галиция в конечном итоге получит статус губернии и станет лояльной частью нашего царства."
 SOV_expand_welfare_programs: "Расширение программ соцобеспечения"
 SOV_expand_welfare_programs_desc: "Российский народ слишком долго страдал от неэффективной советской системы здравоохранения. Настало время для национального восстановления и расширения программы социального обеспечения для улучшения качества жизни и здоровья населения."
 SOV_revive_the_great_idea: "Русско-греческое братство"
 SOV_revive_the_great_idea_desc: "Западное побережье Анатолии исторически было греческой православной территорией, несправедливо захваченной османами. Если греки захотят вернуть её, они получат нашу полную поддержку. Это братство укрепляет наше влияние в регионе."
 SOV_help_sirya: "Сирийские братья"
 SOV_help_sirya_desc: "Мы намерены усилить наше влияние в Сирии — стране, на которую нацелены западные глобалисты, стремящиеся к её уничтожению. Поддержка Сирии защищает наши стратегические интересы и противодействует враждебным силам."
 SOV_bulgarian_ally: "Древний славянский брат"
 SOV_bulgarian_ally_desc: "После освобождения Болгарии от османского владычества в 1878 году она могла бы стать сильным союзником, но цари упустили этот шанс. Теперь мы должны исправить это, завоевав расположение болгарского народа и восстановив братские узы."
 SOV_zhirinovsky_attack_ruthenia: "Дестабилизация Украины"
 SOV_zhirinovsky_attack_ruthenia_desc: "Украина уже давно проводит антироссийскую политику после распада СССР. Мы не можем позволить этому региону стать враждебным оплотом. Мы предпримем решительные действия, чтобы нейтрализовать эту угрозу раз и навсегда."
 SOV_zhirinovsky_attack_ukraha: "Военная операция на Украине"
 SOV_zhirinovsky_attack_ukraha_desc: "Наша цель — положить конец существованию Украины как независимого государства. Пришло время российскому флагу снова взлететь над Киевом, восстановив наш исторический контроль."
 SOV_zhirinovsky_take_trans: "Референдум в Приднестровье"
 SOV_zhirinovsky_take_trans_desc: "Продолжающиеся проблемы с Молдовой должны стать для них головной болью, потому что мы берём Приднестровье под наш контроль. Этот референдум узаконит наши притязания и расширит наше влияние."
 SOV_question_of_poland: "Польский вопрос"
 SOV_question_of_poland_desc: "В августе 2014 года Жириновский пригрозил Польше ковровыми бомбардировками, что отражало его агрессивную позицию по отношению к этой стране. Эта угроза подчёркивает напряжённость в наших отношениях."
 SOV_question_of_bavaria: "Баварский сепаратизм"
 SOV_question_of_bavaria_desc: "Мы поддерживаем стремление Баварии отделиться от Германии. Поощрение сепаратизма ослабит Германию и послужит нашим стратегическим интересам в регионе."
 SOV_question_of_genrih: "Немецкая монархическая революция"
 SOV_question_of_genrih_desc: "Мы планируем свергнуть коррумпированное и несостоятельное правительство Германии и вернуть немцам их былое величие — естественно, в составе России. Эта революция изменит баланс сил в Европе."
 SOV_question_of_east_german: "Напомнить о ГДР"
 SOV_question_of_east_german_desc: "Мы напомним жителям Восточной Германии о славной истории ГДР. Возрождение этого наследия поддерживает наши более широкие политические цели и региональное влияние."
 SOV_europe_pizda: "Подготовка к походу в Европу"
 SOV_europe_pizda_desc: "Настало время устранить европейскую угрозу. Мы подорвём их изнутри и полностью сломаем их власть. Эта кампания знаменует начало нашего решительного наступления на Европу."
 SOV_question_of_spain: "Разделённая Испания"
 SOV_question_of_spain_desc: "Испания долгое время балансировала между своими автономными регионами, чтобы предотвратить сепаратизм. Мы намерены нарушить этот баланс, чтобы ослабить Испанию и способствовать региональным разделениям. Эта стратегия расколет единство Испании."
 SOV_question_of_germany: "Немецкая проблема"
 SOV_question_of_germany_desc: "Германия остаётся ключевым стратегическим соперником. Мы больше не намерены проявлять снисхождение, как в предыдущие столетия. Решение немецкой проблемы имеет решающее значение для обеспечения нашего господства в Европе."
 SOV_syria_kurdistan_armenia_summit: "Антитурецкая операция"
 SOV_syria_kurdistan_armenia_summit_desc: "Мы готовы начать операцию по разделению и уничтожению турецкого государства — эта несостоятельная страна больше не будет вмешиваться в дела великих государств этого региона."
 SOV_istanbul_is_constantinople: "Стамбул — это Константинополь"
 SOV_istanbul_is_constantinople_desc: "Пришло время выполнить военные планы Антитурецкого саммита и вернуть утраченные территории. Восстановление Стамбула в его прежней идентичности является ключевой задачей этой кампании."
 SOV_constantinople_rename: "Константинополь вновь возродился"
 SOV_constantinople_rename_desc: "Мы возвращаем Константинополю его историческое название. Наша задача — возродить его былую славу, какой она была до падения Византии, что символизирует нашу обновлённую власть в регионе."
 SOV_constantinople_police_operation: "Специальная полицейская операция"
 SOV_constantinople_police_operation_desc: "Турецкое сопротивление угрожает нашему контролю в регионе. Мы задействуем правоохранительные органы, чтобы полностью подавить оппозицию и обеспечить стабильность. Эта операция гарантирует наше доминирование."
 SOV_constantinople_subject_rf: "Константинополь возвращается в родную гавань"
 SOV_constantinople_subject_rf_desc: "Сопротивление подавлено, ключевые объекты взяты под контроль, и мы готовы полностью интегрировать эту территорию в нашу великую империю. Это открывает новую главу в нашей экспансии."
 SOV_crusade_russian: "Русский крестовый поход"
 SOV_crusade_russian_desc: "Пришло время начать наш великий русский крестовый поход на Святую землю. То, чего не смогли достичь прошлые императоры, мы завершим с решимостью и силой. Эта миссия обновляет наше духовное и имперское предназначение."
 SOV_crusade_antioch: "Антиохийская губерния"
 SOV_crusade_antioch_desc: "Эти земли когда-то принадлежали Антиохийскому царству, и мы восстановим их. Возрождение этой губернии заново утверждает наше присутствие и чтит исторические притязания."
 SOV_crusade_assiryan: "Ассирийская провинция"
 SOV_crusade_assiryan_desc: "Современная Сирия — это тень великой Ассирийской империи. Мы вернём сирийцев к величию под властью России, восстановив их былую мощь и престиж."
 SOV_crusade_isr: "Иерусалимская губерния"
 SOV_crusade_isr_desc: "Иерусалим — конечная цель нашей кампании. Гроб Господень отныне будет принадлежать нам, укрепляя наше духовное и политическое влияние в регионе."
 SOV_crusade_egy: "Коптская провинция"
 SOV_crusade_egy_desc: "Копты — истинные правители Египта. Мы поддержим их дело и сделаем всё возможное, чтобы помочь им вернуть законное положение в нашей империи."
 SOV_lybia_love: "Союз с Ливией"
 SOV_lybia_love_desc: "Мы намерены защитить Ливию от посягательств различных прозападных стран и группировок"
 SOV_romanian_shit: "Румынская угроза"
 SOV_romanian_shit_desc: "Румыния угрожает нашим юго-западным границам. Мы должны быстро решить эту проблему, чтобы обезопасить наши рубежи и сохранить региональную стабильность."
 SOV_crush_europe: "Сокрушить Европу"
 SOV_crush_europe_desc: "Европа предлагает только глобалистов, дегенератов и моральное разложение. Мы сокрушим это декадентство и восстановим порядок. Наша кампания нацелена в самое сердце европейского упадка."
 SOV_treaty_with_turkmenistan: "Договор с Туркменистаном"
 SOV_treaty_with_turkmenistan_desc: "Нет необходимости воевать с туркменами. Мы уверены, что они с радостью мирно воссоединятся с нашей империей. Этот договор укрепит наши связи и расширит наше влияние."
 SOV_treaty_with_afganistan: "Возвращение в Афганистан"
 SOV_treaty_with_afganistan_desc: "Наша империя вновь достигла границ Афганистана. Возможно, на этот раз удача будет на нашей стороне, и мы вернём контроль над этим стратегическим регионом."
 SOV_imperial_russian_lands: "Имперские русские земли"
 SOV_imperial_russian_lands_desc: "Первым шагом в нашем плане будет возвращение исконных земель, утраченных во время коммунистического правления. С Божьей помощью мы восстановим былые территории и честь нашей империи."
 SOV_claim_finland: "Претендовать на Финляндию"
 SOV_claim_finland_desc: "Граница Финляндии проходит слишком близко к Санкт-Петербургу. Мы должны продвинуть её на север и запад, как это сделал Пётр Великий, решительно разгромив скандинавские государства, чтобы они больше никогда нам не угрожали. Это жизненно важно для нашей безопасности."
 SOV_zhirinovsky_secure_east_asia: "Азиатские амбиции"
 SOV_zhirinovsky_secure_east_asia_desc: "Российская дипломатия всегда была сложной и многогранной. Мы должны обеспечить и расширить наше влияние в Азии, чтобы укрепить наши глобальные позиции. Слава России!"
 SOV_demand_manchuria: "Возвращение в Желтороссию"
 SOV_demand_manchuria_desc: "Пришло время возродить старый проект «Жёлтая Россия». Мы готовы потребовать от Китая земли, которые когда-то принадлежали Российской империи. Это смелое требование восстановит наше влияние в Маньчжурии."
 SOV_zheltoros: "Монгольская губерния"
 SOV_zheltoros_desc: "Монголия долгое время служила буфером между нами и Китаем. Пришло время покончить с этим соглашением и сделать Монголию официальным субъектом нашей Российской империи, укрепив наши границы и контроль."
 SOV_allied_nrk: "Альянс с Северной Кореей"
 SOV_allied_nrk_desc: "Мы стремимся усилить наше влияние на Востоке, расширяя альянсы, начиная с государства, народ которого признаёт нашу поддержку его существования. Это партнёрство укрепит наши позиции в регионе."
 SOV_expand_pacific_naval_presence: "Расширить присутствие ВМФ в Тихом океане"
 SOV_expand_pacific_naval_presence_desc: "Развивая судостроительную промышленность на Дальнем Востоке, мы можем стимулировать региональный рост и обеспечить большее военно-морское присутствие в Тихом океане, продвигая наши стратегические амбиции."
 SOV_avenge_tsushima: "Отомстить за Цусиму"
 SOV_avenge_tsushima_desc: "Русско-японская война 1904-1905 годов стала унизительным поражением для нашей нации. Пришло время отомстить за наших предков, решительно разгромив Японию раз и навсегда."
 SOV_end_the_usa: "Покончить с США"
 SOV_end_the_usa_desc: "От морального разложения до глобального терроризма — Соединённые Штаты представляют собой фундаментальную угрозу нашему выживанию и стабильности мира. Они должны быть уничтожены, чтобы обеспечить наше будущее."
 SOV_return_alaska: "Возвращение Аляски"
 SOV_return_alaska_desc: "Аляска была продана за бесценок глупыми правителями в прошлые века. Теперь пришло время вернуть эту жизненно важную территорию и вернуть её на законную родину."
 SOV_side_with_the_people: "Встать на сторону народа"
 SOV_side_with_the_people_desc: "Веками элиты и преступные мафии угнетали простых людей. Пришло время исправить эту несправедливость и твёрдо встать на сторону народа."
 SOV_purge_disloyal_oligarchs: "Чистка нелояльных олигархов"
 SOV_purge_disloyal_oligarchs_desc: "Несмотря на наши усилия, некоторые олигархи отказываются поддерживать наше дело. Мы предложим им условия, от которых они не смогут отказаться, и уберём тех, кто стоит у нас на пути."
 SOV_jirik_sk_corruption: "Следственный комитет по борьбе с коррупцией"
 SOV_jirik_sk_corruption_desc: "Уровень коррупции в нашей стране достиг тревожных масштабов, и необходим ужесточённый контроль над этой проблемой. Поэтому мы создадим отдельный специальный комитет для регулирования всех антикоррупционных органов."
 SOV_jirik_vklads_sber: "Вернуть утраченные вклады в Сбербанке"
 SOV_jirik_vklads_sber_desc: "В 1990-х годах население потеряло все свои вклады в Сбербанке, но мы намерены вернуть гражданам их деньги, неожиданным образом инвестируя таким образом в экономику нашей страны."
 SOV_jirik_migrants: "Решить проблему мигрантов"
 SOV_jirik_migrants_desc: "Проблема мигрантов в стране стала тревожной, и коренное население больше не чувствует себя в безопасности, что ненормально для такого мощного государства."
 SOV_jirik_lustration: "Люстрация чиновников 1990-х годов"
 SOV_jirik_lustration_desc: "Многие чиновники совершили огромное количество преступлений в 1990-х годах и остались безнаказанными, потому что были «друзьями» предыдущего правительства. Мы не намерены проявлять снисхождение к этим негодяям."
 SOV_return_kgb: "Восстановить КГБ"
 SOV_return_kgb_desc: "Нынешние спецслужбы — жалкая пародия на советский КГБ, который был самым эффективным. Мы возродим КГБ, чтобы восстановить силу и безопасность."
 SOV_storm_v: "Отправлять заключённых на войну"
 SOV_storm_v_desc: "Заключённые истощают общественные ресурсы, ничего не внося. Теперь их отправят сражаться за свою страну и возмещать свои долги через службу."
 SOV_new_russian_army: "Русская добровольческая армия"
 SOV_new_russian_army_desc: "Наши вооружённые силы требуют серьёзной реформы. Нынешняя система провалилась, и пришло время создать добровольческую армию, готовую защищать Россию с новой энергией."
 SOV_women: "Женские батальоны"
 SOV_women_desc: "Наши женские батальоны вселят страх в сердца врагов. Одно их присутствие заставит противников бежать в ужасе."
 SOV_kazachestvo: "Милитаризовать казаков"
 SOV_kazachestvo_desc: "Казаки должны прекратить своё неуправляемое поведение и вернуться к службе в качестве дисциплинированной части российской армии."
 SOV_war_kafedra: "Восстановить военные кафедры"
 SOV_war_kafedra_desc: "Отмена военных кафедр была серьёзной ошибкой. Мы восстановим их, чтобы укрепить нашу армию и военное образование."
 SOV_territorial_defence: "Создать территориальную оборону"
 SOV_territorial_defence_desc: "Территориальная оборона необходима для защиты нашей родины, если мы столкнёмся с врагом, угрожающим нашему демократическому суверенитету."
 SOV_pay_off_army: "Возможность откупиться от армии"
 SOV_pay_off_army_desc: "Мы позволим гражданам избегать военной службы, выплачивая значительную сумму, которая будет реинвестирована в укрепление армии."
 SOV_progressive_taxation: "Прогрессивное налогообложение"
 SOV_progressive_taxation_desc: "Налоговая система, при которой люди с более высоким доходом платят больший процент, а люди с низким доходом — меньший. Эта политика способствует справедливости и социальному балансу."
 SOV_zhirinovsky_secure_baltics: "Обеспечить безопасность Прибалтики"
 SOV_zhirinovsky_secure_baltics_desc: "В 1991 году Жириновский угрожал Прибалтике крайними мерами, включая захоронение ядерных отходов и радиационные атаки. В 2014 году он пригрозил ковровыми бомбардировками региона. Обеспечение безопасности Прибалтики остаётся приоритетом."
 SOV_arrest_zyuganov: "Арестовать Зюганова"
 SOV_arrest_zyuganov_desc: "Геннадий Зюганов, лидер Коммунистической партии, — грозный противник. Его арест нейтрализует серьёзную угрозу нашему правлению."
 SOV_coopt_zyuganov: "Уважать Зюганова"
 SOV_coopt_zyuganov_desc: "Хотя Зюганов и является оппозицией, у нас общие цели. Объединение наших сил могло бы укрепить стремление к Великой России."
 SOV_supreme_leader: "Стать верховным лидером"
 SOV_supreme_leader_desc: "Мы можем взять на себя абсолютную власть без сдержек и противовесов, правя с неоспоримым авторитетом."
 SOV_jirik_cult: "Культ Жириновского"
 SOV_jirik_cult_desc: "Жириновский стал иконой нашего государства. Народ создал вокруг него культ, и мы позволим этому процветать."
 SOV_jirik_fear: "Полицейское государство"
 SOV_jirik_fear_desc: "Врагам родины не будет пощады. Наша полиция много работает для поддержания порядка."
 SOV_jirik_stand: "Родина превыше всего"
 SOV_jirik_stand_desc: "Защита родины — долг каждого гражданина. Даже мирные жители должны быть готовы защищать свою страну с непоколебимым мужеством."
 SOV_jirik_war_religion: "Имперская военная религия"
 SOV_jirik_war_religion_desc: "Наша нация должна отречься от пацифизма и принять милитаризованную православную веру, чтобы объединить и укрепить народ."
 SOV_jirik_warlord: "Верховный правитель"
 SOV_jirik_warlord_desc: "Вперёд, к светлому будущему великой и могучей России!"
 SOV_kill_western_opposition: "Уничтожить западную оппозицию"
 SOV_kill_western_opposition_desc: "Ультранационалисты требуют уничтожения оппозиции, связанной с Западом. Мы должны позволить им осуществить эти действия."
 SOV_amend_the_russian_constitution: "Внести поправки в Конституцию России"
 SOV_amend_the_russian_constitution_desc: "Конституция приемлема с некоторыми корректировками в соответствии с нашей повесткой."
 SOV_decommunization: "Декоммунизация"
 SOV_decommunization_desc: "Коммунизм уничтожил Россию, вызвав голод, воровство, тюремное заключение и смерть миллионов. Мы больше не будем чтить это тёмное наследие. Долой коммунизм!"
 SOV_the_third_rome_desc: "Москва — Третий Рим — это идея о том, что Москва является преемницей древнего Рима и Византии, продолжая наследие Римской империи. Эта концепция обсуждалась на протяжении всей европейской истории в вопросе о том, какой город по праву наследует это наследие."
 SOV_visegrag_shit: "Переговоры с Вышеградом"
 SOV_visegrag_shit_desc: "Мы не намерены расширяться на всех членов Вышеградской группы, но если они будут сопротивляться, у нас не останется выбора!"

##########Ideas##########
 SOV_IRQ_base: "[SOV.GetFlag] Российская военная база"
 SOV_IRQ_base_desc: "Российская военная база, расположенная недалеко от нашей столицы, служит нам напоминанием о том, что Россия не бросит нас в случае глобальной войны. Но если режим в нашей стране или в России кардинально изменится, военная база будет немедленно закрыта."
 SOV_LBA_base: "[SOV.GetFlag] Российская военная база"
 SOV_LBA_base_desc: "Российская военная база, расположенная недалеко от нашей столицы, служит нам напоминанием о том, что Россия не бросит нас в случае глобальной войны. Но если режим в нашей стране или в России кардинально изменится, военная база будет немедленно закрыта."
 SOV_IRQ_military_advisors: "Военные инструкторы из [SOV.GetNameWithFlag]"
 S0V_russian_sphere_idea: "Московский пакт"
 S0V_russian_sphere_idea_desc: "Альянс, созданный Россией для замены ненужного и неоправданного ОДКБ. Теперь Россия готова собирать вокруг себя союзников и давать отпор своим врагам."
 SOV_military_exercises_anti_turkey_idea: "Совместные учения с Российской армией"
 SOV_military_exercises_anti_turkey1_idea: "Совместные учения с антитурецкой коалицией"
 S0V_russian_sphere_mil_idea: "Объединённые Вооружённые Силы Российской Сферы"
 SOV_idea_governorate: "Интеграция в Россию"
 SOV_idea_governorate_desc: "Это образование проходит процесс интеграции в Россию. Вскоре оно будет полностью поглощено."
 SOV_jirik_loyal_party_support_idea: "Внутренняя политика партии"
 SOV_jirik_unloyal_party_idea: "Автономная партия"
 SOV_jirik_loyal_party_idea: "Лояльная партия"
 SOV_jirik_bad_party_idea: "Объединены только на бумаге"
 SOV_jirik_cult_idea: "Милитаристская Россия"
 SOV_jirik_crusade_idea: "Крестовый поход на Иерусалим"
 SOV_jirik_crusade_europe_idea: "Крестовый поход в Европу"
 SOV_jirik_conts_reform_idea: "Конституционная реформа"
 SOV_jirik_new_conts_monarchy_idea: "Конституционная монархия России"
 SOV_jirik_new_romanov_monarchy_idea: "Новая Романовская монархия"
 SOV_jirik_police_state_reform_idea: "Реформированные министерства внутренних дел"
 SOV_jirik_policy_idea: "Политическая власть ЛДПР"
