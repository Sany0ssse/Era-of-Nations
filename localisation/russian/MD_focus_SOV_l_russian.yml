 ##########ZYUGANOV - USSR##########
 ##########Focuses##########
 SOV_zyuga_reforms_start: "Геннадий Зюганов"
 SOV_zyuga_reforms_start_desc: "Геннадий Зюганов, родившийся в 1944 году, возглавляет Коммунистическую партию Российской Федерации с 1993 года. На президентских выборах 1996 года он изначально считался фаворитом в борьбе с Борисом Ельциным, но в итоге проиграл во втором туре, набрав 40,7% голосов против 54,4% у Ельцина. В политике Зюганова сочетаются левые взгляды и сильный национализм."
 SOV_zyuga_russian_idea: "Русская идея вместо Интернационала"
 SOV_zyuga_russian_idea_desc: "«Мы должны вернуть русскую идею, которая заключается не в либерализме или вестернизации, а в силе, православии, соборности и справедливости. Ильин понимал это лучше, чем кто-либо другой»."
 SOV_zyuga_sobornost: "Соборность вместо демократии"
 SOV_zyuga_sobornost_desc: "Западная демократия - это обман. У нас будет соборность: народ советуется, а правительство решает, как учил Ильин."
 SOV_zyuga_christian_communism: "Православие - духовная связь"
 SOV_zyuga_christian_communism_desc: "«Христос был первым коммунистом. А без веры люди распадаются. Меня крестили в детстве, и я ношу крест - я этого не скрываю»."
 SOV_zyuga_stalinist: "Сталин как государственный деятель"
 SOV_zyuga_stalinist_desc: "Сталин создал империю, победил нацизм и вернул русские земли. Да, были перегибы, но без него не было бы и нас."
 SOV_zyuga_more_empower: "Власть Коммунистической партии"
 SOV_zyuga_more_empower_desc: "Мы должны усилить власть нашей партии, пока наше положение ещё шатко."
 SOV_zyuga_anti_yeltsin: "Национализация памяти: Ельцин - враг"
 SOV_zyuga_anti_yeltsin_desc: "Ельцин и его банда разрушили великую страну. Мы переименуем всё, что носит его имя."
 SOV_zyuga_new_const: "Новая конституция"
 SOV_zyuga_new_const_desc: "Новое государство требует новой конституции, а пережитки старого режима должны остаться в прошлом."
 SOV_zyuga_ilyn: "Иван Ильин - философ Кремля"
 SOV_zyuga_ilyn_desc: "Ильин понимал, что Россия - это не демократия и не диктатура, а живая соборность. Мы возьмём его идеи, но без монархии."
 SOV_zyuga_gosplan: "Запуск Госплана 2.0"
 SOV_zyuga_gosplan_desc: "Старый Госплан рухнул вместе с Союзом. Мы восстановим его на новой, цифровой основе. Пятилетки должны стать точными, планы - неукоснительно выполняться. Централизованное планирование - наш ответ хаосу 1990-х."
 SOV_zyuga_agriculture: "Русская пшеница - наше всё"
 SOV_zyuga_agriculture_desc: "Зависимость от импортного зерна недопустима. Мы должны вернуть статус великой аграрной державы. Колхозы будут реформированы, но основа остаётся прежней: земля принадлежит народу."
 SOV_zyuga_minselhoz: "Министерство сельского хозяйства"
 SOV_zyuga_minselhoz_desc: "Чтобы накормить нацию, нужна железная рука. Министерство сельского хозяйства возьмёт под контроль все стадии производства - от поля до прилавка. Ни одного зерна мимо казны."
 SOV_zyuga_mashinostroy: "Министерство промышленности"
 SOV_zyuga_mashinostroy_desc: "Промышленность - сердце державы. Министерство машиностроения восстановит утерянные производственные цепочки - от станков до танков. Импортозамещение становится делом государственной важности."
 SOV_zyuga_prosveshen: "Министерство просвещения"
 SOV_zyuga_prosveshen_desc: "Ликвидация безграмотности 2.0. Народ должен знать не только поп-культуру, но и Маркса с Энгельсом. Мы вернём в школы советское качество образования, патриотическое воспитание и точные науки."
 SOV_zyuga_cis_2: "Вернуть непризнанные территории"
 SOV_zyuga_cis_2_desc: "«Мягкая территория» бывших республик должна вернуться под наш контроль. Пришло время собирать спорные земли и анклавы. Никаких больше «непризнанных» государств у наших границ без нашего участия."
 SOV_zyuga_migrants: "Жёсткая миграционная политика"
 SOV_zyuga_migrants_desc: "Гастарбайтеры размывают культурный код и рынок труда. Строгая визовая система, замена мигрантов роботизацией и стимулирование рождаемости среди коренных народов. Россия для русских."
 SOV_zyuga_union_state: "Союзное государство - ядро Евразии"
 SOV_zyuga_union_state_desc: "Союзное государство России и Беларуси - только первый шаг. Мы создадим наднациональный орган по образцу СССР для управления Евразией. Минск, Киев, Астана должны подчиняться единому центру."
 SOV_zyuga_federalism: "Советский федерализм"
 SOV_zyuga_federalism_desc: "Под лозунгом «дружбы народов» мы уничтожим сепаратизм. Регионы получат широкие полномочия, но только в рамках жёсткой вертикали власти из Кремля. Никаких больше национальных республик - только губернии."
 SOV_zyuga_oligarchs: "Покончить с олигархией"
 SOV_zyuga_oligarchs_desc: "Олигархи разграбили страну в лихие 1990-е. Время национализации пришло. Заводы, телеканалы, порты - всё станет народным достоянием. Тех, кто сопротивляется, ждёт Магадан или эмиграция."
 SOV_zyuga_ets: "Единая торговая система"
 SOV_zyuga_ets_desc: "Мы выходим из ВТО на своих условиях. Единая торговая система внутри нашего блока союзников: рубль, пошлины и квоты под нашим контролем. Западные корпорации будут работать по нашим правилам или уйдут."
 SOV_zyuga_science: "Возродить советскую науку"
 SOV_zyuga_science_desc: "Академия наук должна управлять экономикой. Мы остановим утечку мозгов, создадим госкорпорации по советскому образцу и рванём в космос. Нанотехнологии и ядерная физика - в приоритете."
 SOV_zyuga_5year: "Запустить пятилетку"
 SOV_zyuga_5year_desc: "Время «стабильности» кончилось. Мы объявляем экономическую мобилизацию! Ударные стройки, рост производительности на 30% и всеобщая трудовая дисциплина. Кто не работает, тот не ест."
 SOV_zyuga_petroruble: "Советский нефтяной рубль"
 SOV_zyuga_petroruble_desc: "Доллар - мировая оккупационная валюта. В расчётах за нефть и газ мы переходим на советский нефтяной рубль, обеспеченный корзиной золота и ресурсов. Это подорвёт гегемонию США."
 SOV_zyuga_marx: "Цифровой суверенитет"
 SOV_zyuga_marx_desc: "Интернет - зона влияния ЦРУ. Мы создадим свой сегмент сети, изолированный от Facebook и Twitter. Своя поисковая система, своя соцсеть, своя правда. Цифровой железный занавес."
 SOV_zyuga_antiglobalism: "Антиглобализм"
 SOV_zyuga_antiglobalism_desc: "Глобализация - это новый колониализм. Москва станет центром сопротивления. Мы поддержим любые силы в Европе и США, которые выступают против НАТО и либеральной диктатуры."
 SOV_zyuga_ussr: "Возвращение СССР"
 SOV_zyuga_ussr_desc: "Россия - не страна. Это временно утерянный флаг. Мы восстановим СССР в границах 1970-х годов. Красное знамя снова взовьётся над Кремлём, Киевом и Алма-Атой."
 SOV_zyuga_kazakh: "Последнее государство СССР"
 SOV_zyuga_kazakh_desc: "Освоение целины начиналось с нас. Казахстан - последний фрагмент империи, где к нам до сих пор относятся тепло. «Возвращение» северных регионов и Байконура будет добровольно-принудительным."
 SOV_zyuga_baltic: "Красный рассвет над Прибалтикой"
 SOV_zyuga_baltic_desc: "Прибалтика стала плацдармом НАТО. Мы выдвинем ультиматум о денацификации и защите русскоязычного населения. Утром 8 мая наши десантники высадятся в Таллине и Риге."
 SOV_zyuga_ukraine: "Коммунизация Украины"
 SOV_zyuga_ukraine_desc: "Киев - мать городов русских. Киевский режим должен пасть. Наши братья ждут освобождения. Вход советских танков в Киев восстановит историческую справедливость."
 SOV_zyuga_georgia: "Вернуть родину Сталина"
 SOV_zyuga_georgia_desc: "Сталин - наш отец народов. Грузия должна стать частью новой империи. Мы не забыли 2008 год. Абхазия и Южная Осетия - только начало. Тбилиси будет нашим."
 SOV_zyuga_finland: "Вторая зимняя война?"
 SOV_zyuga_finland_desc: "Мы не претендуем на Хельсинки, но граница 1940 года была справедливее. Финляндия, вступая в НАТО, подписала себе приговор. Выборг станет форпостом Балтийского флота."
 SOV_zyuga_aziati: "Среднеазиатская социалистическая революция"
 SOV_zyuga_aziati_desc: "«Цветные революции» в Центральной Азии - рука США. Мы проведём свою «социалистическую революцию». Ташкент, Бишкек и Душанбе вернутся на орбиту Кремля. Воду и газ нужно оплачивать федеральным рублём."
 SOV_zyuga_leo_and_erik: "Красное знамя над Ереваном и Баку"
 SOV_zyuga_leo_and_erik_desc: "Карабах и бакинская нефть должны быть под единым управлением. Мы решим армяно-азербайджанский конфликт так, как это сделал Сталин: создадим новую республику в составе СССР."
 SOV_zyuga_kndr: "Вечный союз с КНДР"
 SOV_zyuga_kndr_desc: "Пхеньян - наш форпост в Азии. Ядерный зонтик над КНДР, единое командование армией и торговое эмбарго против США. Вместе мы свергнем иго американского империализма."
 SOV_zyuga_poland: "Назад в Польшу"
 SOV_zyuga_poland_desc: "Мы никогда не забудем «Восточные территории». Варшава - один из главных сателлитов Вашингтона. Через неделю после начала войны наши ракеты «Тополь» встанут на границе с Германией. Щецин будет нашим."
 SOV_zyuga_annex_shprot: "Закусить шпротами"
 SOV_zyuga_annex_shprot_desc: "Независимость прибалтийских государств была ошибкой советского правительства, и мы это исправим!"
 SOV_zyuga_annex_tri_garika: "Перекусить с лавашом"
 SOV_zyuga_annex_tri_garika_desc: "Пришло время вернуть кавказские республики на родину"
 SOV_zyuga_annex_dhinesh: "Съесть плов"
 SOV_zyuga_annex_dhinesh_desc: "Центральная Азия не должна находиться под чьим-либо влиянием — она должна быть частью нашей великой страны."
 SOV_zyuga_annex_finland: "Съесть фрикадельки"
 SOV_zyuga_annex_finland_desc: "Признание независимости Финляндии было ошибкой, ведь Финляндия была частью России и станет ею вновь."
 SOV_zyuga_warsaw: "Возрождение Варшавского договора"
 SOV_zyuga_warsaw_desc: "Варшавский договор был распущен незаконно. Мы возродим блок на новых условиях: единая ПВО, единое пространство и республики вместо «демократий». Кто не с нами - тот против нас."
 SOV_zyuga_warsaw_hungary: "Красный Будапешт"
 SOV_zyuga_warsaw_hungary_desc: "Будапешт устал от ЕС. Орбан - наш союзник, но мы хотим большего: венгерские коммунисты должны привести страну в Союзное государство. Красный террор против либералов."
 SOV_zyuga_warsaw_czech: "Пражская весна 2.0"
 SOV_zyuga_warsaw_czech_desc: "Чехия вооружает Украину. Мы остановим эту «пражскую напасть». Новый ввод войск будет молниеносным: аэропорт Рузине, телецентр и мосты за один час."
 SOV_zyuga_warsaw_gdr: "Старый союзник"
 SOV_zyuga_warsaw_gdr_desc: "Призрак ГДР жив. Немецкие земли восточнее Эльбы - наша законная зона ответственности. Мы предъявим Бундестагу ультиматум: разоружайся или потеряй Берлин."
 SOV_zyuga_warsaw_slovakia: "Братиславский блицкриг"
 SOV_zyuga_warsaw_slovakia_desc: "Братислава всегда тяготела к Москве. Танковый блицкриг через карпатские перевалы займёт полдня. Словакия станет нашим подконтрольным государством в сердце Европы."
 SOV_zyuga_warsaw_romania: "Призрак Чаушеску"
 SOV_zyuga_warsaw_romania_desc: "Румыния - агрессор в Бессарабии. Призрак Чаушеску вернётся, чтобы наказать элиты. Мы займём Плоешти и войдём в Бухарест как освободители от евро-атлантического рабства."
 SOV_zyuga_warsaw_bulgaria: "16-я республика СССР"
 SOV_zyuga_warsaw_bulgaria_desc: "Болгария - самая близкая нам по духу славянская страна. У неё есть шанс мирно стать 16-й республикой СССР. Если нет - Черноморский флот высадит десант в Варне и Бургасе."
 SOV_zyuga_book_of_z: "Z книга"
 SOV_zyuga_book_of_z_desc: "У каждого великого правителя должны быть его труды в виде книги, и Зюганов не станет исключением."
 SOV_zyuga_globalization_target: "Россия под прицелом глобализма"
 SOV_zyuga_globalization_target_desc: "Глобализация - это новый колониализм. Наша книга доказывает: в американской версии глобализации нет места суверенной России. Мы построим собственный экономический блок, выйдем из ВТО и создадим закрытую торговую систему от Владивостока до Гаваны."
 SOV_zyuga_rossiya_rodina_moya: "Россия - моя Родина"
 SOV_zyuga_rossiya_rodina_moya_desc: "Старая идеология мертва. Новая - синтез советской власти и русского патриотизма. Как я писал в 1996 году, мы должны восстановить единство наших духовных и государственных традиций. Россия - это не просто страна, это цивилизация."
 SOV_zyuga_stalin_i_sovremennost: "Сталин и современность"
 SOV_zyuga_stalin_i_sovremennost_desc: "Команда Сталина за 15 лет превратила аграрную страну в сверхдержаву. Пришло время перестать бояться этого имени. Мы используем лучший советский опыт мобилизации - без культа личности, но с эффективностью."
 SOV_zyuga_ruskij_sterzhen: "Русский стержень державы"
 SOV_zyuga_ruskij_sterzhen_desc: "По всем международным критериям продолжается геноцид русского народа. Мы - самая большая разделённая нация в мире. Русский вопрос - это уже не вопрос меньшинств, это вопрос национального ядра. Мы защитим русских везде."
 SOV_zyuga_na_perelome: "На переломе"
 SOV_zyuga_na_perelome_desc: "Кризис 2008 года был не случайностью, а системным провалом капитализма. Наша книга «На переломе» доказала, что плановая экономика спасает нации. Мы национализируем банки, введём контроль цен и запустим свой аналог «Нового курса» - по-советски."
 SOV_zyuga_na_paseke: "На пасеке у Зюганова"
 SOV_zyuga_na_paseke_desc: "Моя книга о пасеке - не чудачество, а политический трактат. Улей - идеальное социалистическое общество: все работают на общее благо, матка руководит, трутни охраняют. Мы построим «народный социализм» на естественных, органических принципах. И да, мы будем экспортировать мёд союзникам вместо западных сладостей."
 SOV_zyuga_ideyno_teoreticheskaya: "Идейно-теоретическая основа партии"
 SOV_zyuga_ideyno_teoreticheskaya_desc: "Партия без теории - толпа. Наша идеологическая основа - не догма, а оружие. Мы создадим сеть партийных школ, обязательных для всех чиновников и офицеров. Каждый коммунист должен читать, понимать и быть готовым защищать."
 SOV_zyuga_release_book: "Издать Z книгу"
 SOV_zyuga_release_book_desc: "Пришло время народу нашей страны начать изучать труды великого лидера новой России."
 SOV_zyuga_internationalism: "Советский военный интернационализм"
 SOV_zyuga_internationalism_desc: "Пришло время разорвать цепи изоляции. Мы превратим Красную Армию из чисто оборонительной силы в остриё мировой революции. Военные базы, совместные учения, поставки оружия братским партиям – все инструменты советского интернационализма будут возрождены. Империя капитала должна знать: где бы ни поднимался рабочий класс, наша поддержка будет рядом."
 SOV_zyuga_ghost: "Призрак коммунизма бродит по Европе"
 SOV_zyuga_ghost_desc: "Капиталистические правительства трепещут – и правильно. Наше идеологическое наступление не остановится у границ России. Мы будем финансировать левые СМИ, спонсировать революционные молодёжные движения и напоминать каждому европейцу, что рабочий класс не умер. «Пролетарии всех стран, соединяйтесь!» – это не ностальгия. Это боевой план."
 SOV_zyuga_spain_razval: "Поддержка социалистического сепаратизма в Испании"
 SOV_zyuga_spain_razval_desc: "Мадридский централизм всегда подавлял национальные меньшинства. Мы протянем руку баскским, каталонским и галисийским товарищам, борющимся за самоопределение и социализм. Профсоюзы, местные партии и кооперативные сети получат нашу помощь. Фрагментированная Испания не сможет служить средиземноморскому флангу НАТО."
 SOV_zyuga_germany_razval: "Поддержка социалистического сепаратизма в Германии"
 SOV_zyuga_germany_razval_desc: "Бывшая ГДР так и не была полностью интегрирована. В Саксонии, Тюрингии и Бранденбурге старая верность красному флагу всё ещё сильна. Мы направим ресурсы немецким товарищам, которые требуют нейтралитета, осуждают перевооружение бундесвера и призывают к социалистической республике на Эльбе. Берлинскому натовскому фанатизму нужно дать ответ."
 SOV_zyuga_turkish_razval: "Поддержка социалистического сепаратизма в Турции"
 SOV_zyuga_turkish_razval_desc: "Пантюркистские амбиции Анкары и угнетение курдов делают её естественным врагом. Мы будем поддерживать курдских левых, прогрессивных турецких социалистов и все силы, борющиеся против авторитарного режима Эрдогана. Наша цель – не просто дестабилизация, а создание дружественного социалистического государства на южном фланге бывшего СССР."
 SOV_zyuga_polish_razval: "Поддержка социалистического сепаратизма в Польше"
 SOV_zyuga_polish_razval_desc: "Варшава превратилась в самый верный форпост Вашингтона. Мы напомним польскому народу, кто его истинные союзники: не НАТО, а рабочий класс. Поддержка силезских автономистов и левых профсоюзов расколет фасад «национального единства». История не окончена – она лишь делает новый поворот."
 SOV_zyuga_mongolia: "Советское знамя над Монголией"
 SOV_zyuga_mongolia_desc: "Монголия была первой социалистической страной после нашей. Нынешние правители предали наследие Сухэ-Батора и Чойбалсана. Мы поддержим Монгольское народно-революционное движение – финансово, политически, а если понадобится – и добровольцами. Улан-Батор должен вернуться в братскую семью социалистических государств. Красное знамя снова взовьётся над степью."
 SOV_zyuga_red_terrorists: "Поддержка «красных террористов» в Европе"
 SOV_zyuga_red_terrorists_desc: "Западные СМИ называют их террористами. Мы называем их борцами за освобождение пролетариата. Радикальные левые группы в Германии, Австрии, Норвегии и Чехии получат нашу тайную поддержку – конспиративные квартиры, типографии и ограниченную финансовую помощь. Мы не инициируем насилие, но не бросим тех, кто осмеливается сопротивляться диктатуре капитала."

 ##########Events##########
 sov_communists.2.t: "Конституция Коммунистической партии"
 sov_communists.2.d: "Теперь, когда абсолютная власть находится в руках партии, мы можем наконец переписать конституцию в соответствии с нашими ценностями. Однако в наших рядах возникли идеологические фракции, и мы должны решить, какая из них задаст тон нашей истинно советской конституции."
 sov_communists.2.a: "Конечно, нам нужны сталинисты."
 sov_communists.2.b: "Нам нужен более умеренный подъём."
 sov_communists.6.t: "Ресталинизация"
 sov_communists.6.d: "Хрущёвцам не удалось сохранить наследие нашего величайшего лидера. Сейчас самое время это исправить. Мы должны решить, насколько далеко мы готовы зайти в переименовании наших городов в честь Сталина и советского прошлого."
 sov_communists.6.a: "Сохранить исторические варианты."
 sov_communists.6.b: "Полный сталинизм!"
 sov_communists.7.t: "[SOV.GetName] предлагает интеграцию"
 sov_communists.7.d: "Похоже, российское правительство решило больше не играть по западным правилам и открыто заявило о своем желании интегрировать непризнанные государства на территории бывшего СССР. Станем ли мы одним из них?"
 sov_communists.7.a: "Да"
 sov_communists.7.b: "Нет"
