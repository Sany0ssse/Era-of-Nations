 SOV_army_category: "Российская армия"
 SOV_army_category_desc: "Российская армия — это лишь бледная тень некогда советской, огромной и грозной силы. Теперь перед Россией стоит задача возродить былую мощь армии государства, которое всегда участвовало в мировой политике и непосредственно на неё влияло."
