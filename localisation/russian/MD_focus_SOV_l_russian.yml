##########Events##########
 russia_governorate.1.t: "Россия решила сделать из нас губернию"
 russia_governorate.1.d: "Россия решительно выступает против старой структуры своего государства. Одним из примеров этого является возврат к административным делениям. Россия стремится пригласить нас стать одной из её губерний и частью этого нового порядка."
 russia_governorate.1.a: "Вместе мы возродим Великую империю!"
 russia_governorate.1.b: "Сопротивляйся и кусай!"
 russia_governorate.1.c: "Предложить Союзное государство"
 russia_governorate.2.t: "[FROM.GetName] возвращается домой"
 russia_governorate.2.d: "Правительство [FROM.GetName] поступило мудро, избежав конфронтации с нами. [LIT.GetName] снова станет частью Российской империи, укрепляя наше единство и общее будущее."
 russia_governorate.2.a: "Наконец-то"
 russia_governorate.3.t: "[FROM.GetName] сопротивляется нам!"
 russia_governorate.3.d: "Правительство [FROM.GetName] отклонило наше щедрое предложение мирно стать одной из наших провинций. Если они отказываются от дипломатии, мы будем вынуждены действовать силой."
 russia_governorate.3.a: "Дураки"
 russia_governorate.4.t: "[FROM.GetName] предлагает Союзное государство"
 russia_governorate.4.d: "[FROM.GetName] предложил альтернативный, менее агрессивный подход: создание Союзного государства в ускоренном темпе. Похоже, они стремятся минимизировать потери власти, которые могут понести."
 russia_governorate.4.a: "Да будет Союзное государство"
 russia_governorate.4.b: "Нет, [FROM.GetName]."
 russia_governorate.5.t: "Проблема Арцаха"
 russia_governorate.5.d: "Республика Арцах находится на перепутье в вопросе о том, кто будет управлять ею в текущих обстоятельствах. Теперь, когда Армения и Россия объединены как никогда тесно, будущее Арцаха висит на волоске."
 russia_governorate.5.a: "Пусть Россия возьмёт контроль"
 russia_governorate.5.b: "Арцах наш."
 sov_nationalists.1.t: "Внесение поправок в национальную конституцию"
 sov_nationalists.1.d: "Наша предыдущая конституция была, пожалуй, худшей в истории России! Чтобы стереть этот позорный документ, мы создадим истинно русскую конституцию. Ключевое решение — сохранить традиционную централизацию или предпочесть более децентрализованный, но экспансионистский путь. Какое направление нам выбрать?"
 sov_nationalists.1.a: "России нужно сначала стабилизироваться, прежде чем помогать другим!"
 sov_nationalists.1.b: "Экспансионизм — наша национальная судьба и должен быть закреплён в конституции!"
 sov_nationalists.2.t: "§Y[SOV.GetNameWithFlag]§! предлагает присоединиться к альянсу"
 sov_nationalists.2.d: "Российское правительство предлагает сформировать альянс через серию соглашений, направленных на защиту нас от внешних угроз. Примем ли мы предложение?"
 sov_nationalists.2.a: "Россия спасёт нас!"
 sov_nationalists.2.b: "Нет"
 sov_nationalists.3.t: "Альянс с §Y[FROM.GetNameWithFlag]§!"
 sov_nationalists.3.d: "Их правительство отказалось присоединиться к нашему альянсу на основе договора. Похоже, нам придётся навязывать свою волю силой."
 sov_nationalists.3.a: "Они будут нашими!"
 sov_nationalists.4.t: "Военные учения с §Y[FROM.GetNameWithFlag]§!"
 sov_nationalists.4.d: "Россия проводит совместные военные учения с нашими силами и силами других союзников в рамках подготовки к возможному военному вмешательству в Турции."
 sov_nationalists.4.a: "Мы будем готовы"
 sov_nationalists.5.t: "Союзное государство с §Y[SOV.GetNameWithFlag]§!"
 sov_nationalists.5.d: "Российское правительство предлагает возродить бывший проект Союзного государства между Россией и Сербией. Первоначально отвергнутый правительством Ельцина в 1990-х, теперь они предлагают воскресить этот альянс. Согласимся ли мы?"
 sov_nationalists.5.a: "Да"
 sov_nationalists.5.b: "Нет"
 sov_nationalists.6.t: "Союзное государство с §Y[SER.GetNameWithFlag]§!"
 sov_nationalists.6.d: "Правительство Сербии согласилось возобновить проект Союзного государства, что знаменует новую главу в нашем сотрудничестве."
 sov_nationalists.6.a: "Хорошо"
 sov_nationalists.7.t: "Союзное государство с §Y[SER.GetNameWithFlag]§!"
 sov_nationalists.7.d: "Правительство Сербии отказалось перезапустить проект Союзного государства. Эта неудача разочаровывает тех, кто надеялся укрепить наши связи и объединить наши нации. Мы должны тщательно обдумать следующие шаги."
 sov_nationalists.7.a: "Прискорбно"
 sov_nationalists.8.t: "Новая Российская империя"
 sov_nationalists.8.d: "Президент Жириновский объявил возрождение Российской империи краеугольным камнем своей политической программы. Будь то мирными средствами или силой, Россия готова вернуть свои бывшие территории. Мы должны быть готовы к возможности возобновления конфликта по мере возрождения империи."
 sov_nationalists.8.a: "Боже, храни президента."
 sov_nationalists.9.t: "Реимпериализация"
 sov_nationalists.9.d: "После восстания 1917 года коммунисты стремились стереть память о прошлом нашей родины, заменив её своей идеологией. Многие российские города были переименованы в честь коммунистических лидеров и символов. Мы должны восстановить нашу историю и достоинство, вернув дореволюционные названия этих городов."
 sov_nationalists.9.a: "Старые дореволюционные названия"
 sov_nationalists.9.b: "Довоенные названия были лучше"
 sov_nationalists.10.t: "Россия требует Маньчжурию"
 sov_nationalists.10.d: "Россия потребовала аннексии Маньчжурии в рамках своего плана по воссозданию Желтороссии. Это агрессивное требование заставляет нас решить, подчиниться или сопротивляться их амбициям."
 sov_nationalists.10.a: "Мы должны подчиниться..."
 sov_nationalists.10.b: "Никакой Желтороссии сегодня."
 sov_nationalists.11.t: "Китай принимает наше требование"
 sov_nationalists.11.d: "Китай согласился на наши требования относительно Маньчжурии. С этим согласием мы наконец-то обеспечили контроль над Желтороссией. Эта победа знаменует важный шаг в наших региональных амбициях."
 sov_nationalists.11.a: "Слава России!"
 sov_nationalists.12.t: "Китай отклоняет наше требование"
 sov_nationalists.12.d: "Китай отказался от наших требований по Маньчжурии. Теперь нам придётся рассмотреть возможность военных действий, чтобы вернуть Желтороссию и обеспечить выполнение наших притязаний."
 sov_nationalists.12.a: "Они выбрали смерть."
 sov_nationalists.13.t: "Защита от Грузии"
 sov_nationalists.13.d: "Россия предложила провести референдум о нашем вступлении в их союз. Ожидаемый результат ясен, но мы должны решить, принять это предложение или отклонить."
 sov_nationalists.13.a: "Конечно, пора возвращаться домой — в Россию"
 sov_nationalists.13.b: "Не сегодня"
 sov_nationalists.14.t: "Жириновский избран президентом"
 sov_nationalists.14.d: "В ходе недавней смены правительства националистическая партия ЛДПР пришла к власти, а Владимир Жириновский был избран президентом. Они пообещали масштабные реформы, включая восстановление старого флага и проведение консервативной националистической повестки."
 sov_nationalists.14.a: "Что ждёт Россию?"
 sov_nationalists.15.t: "Московское соглашение подписано!"
 sov_nationalists.15.d: "Мы официально сформировали новый военно-политический альянс, посвящённый продвижению интересов России и противодействию западным державам. Этот блок станет ключевым инструментом нашей обновлённой силы."
 sov_nationalists.15.a: "За [SOV.GetName]!"
 sov_nationalists.16.t: "Казачьи восстания в [KAZ.GetName]"
 sov_nationalists.16.d: "Лояльные нам казачьи группы в [KAZ.GetName] начали вооружённые восстания после нашего объявления о возвращении этих земель [SOV.GetName]. Их яростная преданность подпитывает это восстание."
 sov_nationalists.16.a: "За [SOV.GetName]!"
 sov_nationalists.17.t: "Военная операция в Центральной Азии"
 sov_nationalists.17.d: "Центральноазиатские республики — продукт советской ошибки, даровавшей им ложную независимость. Мы вернём эти территории обратно в нашу великую Империю силой, если потребуется."
 sov_nationalists.17.a: "За [SOV.GetName]!"
 sov_nationalists.18.t: "[FROM.GetName] стал губернией [SOV.GetName]"
 sov_nationalists.18.d: "[FROM.GetName] официально включён в качестве провинции в состав нашего государства. Теперь мы должны сосредоточиться на полной интеграции и избежать прошлых ошибок, которые привели к нестабильности."
 sov_nationalists.18.o1: "Единая и неделимая"
 sov_nationalists.19.t: "[FROM.GetName] интегрирован в [SOV.GetName]"
 sov_nationalists.19.d: "[FROM.GetName] полностью поглощён нашей великой Империей. Наша страна становится сильнее по мере возвращения утраченных территорий, и мы не планируем останавливаться."
 sov_nationalists.19.o1: "Наша страна стала больше"
 sov_nationalists.20.t: "Смерть национальным республикам"
 sov_nationalists.20.d: "Татарстан, Чечня, Башкортостан... Жириновский подписывает указ о ликвидации национальных делений. Регионы отныне - просто «провинции» с назначаемыми губернаторами. В Грозном начинаются протесты, но они быстро подавлены объявлением «антитеррористической операции»."
 sov_nationalists.20.a: "Одна нация, один лидер, одна Россия"
 sov_nationalists.21.t: "Алма-Ата - внимание, стоять!"
 sov_nationalists.21.d: "Жириновский в прямом эфире разрывает договор ОДКБ. «Хватит кормить этих «союзников», которые даже слово «Россия» боятся произнести!» Армения и Казахстан в шоке. Пентагон потирает руки."
 sov_nationalists.21.a: "Каждый сам за себя. Или за нас, если заплатит"
 sov_nationalists.22.t: "Дранг нах Остен - и теперь нах Вестен"
 sov_nationalists.22.d: "Жириновский надевает фуражку образца 1914 года и заявляет: «Европа прогнила. Мы одним махом пройдём от Лиссабона до Владивостока». В Калининградской области тайно развёртываются ракетные системы."
 sov_nationalists.22.a: "Европа, молись!"
 sov_nationalists.23.t: "Суд 90-х"
 sov_nationalists.23.d: "По всей России начинаются аресты «приватизаторов». Чубайс и компания объявлены в розыск через Интерпол (который их игнорирует). Жириновский лично допрашивает одного из олигархов в прямом эфире: «Куда дел заводы, гад?»"
 sov_nationalists.23.a: "Землю - народу! Должности - военным!"
 sov_nationalists.24.t: "Жириновский - наше всё"
 sov_nationalists.24.d: "В школах вводят предмет «Жириновсковедение». Портреты вождя висят вместо крестов в церквях (на спонсорские средства). На Красной площади строят 100-метровую статую «Русского Цезаря»."
 sov_nationalists.24.a: "Да здравствует наш великий вождь! (Пять минут аплодисментов)"


