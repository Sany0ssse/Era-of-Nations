 SOV_storm_z_central_russia: "Заключённые из Шторм Z"
 SOV_storm_z_central_russia_desc: "Многие заключённые смогли пережить резню, на которую мы их отправили, теперь они официально освобождены, но многие из них решили вернуться к тому, что у них хорошо получается, — к грабежам и убийствам."
 SOV_start_volunteer_assault_coprs: "Восстановите добровольческий штурмовой корпус"
 SOV_economic_russian: "Российская экономика"
 SOV_economic_russian_desc: "Наша экономика по-прежнему ослаблена кризисами 1990-х годов, распадом СССР и другими долгосрочными последствиями. Пришло время принять решительные меры для восстановления и укрепления экономической базы нашей страны."
 SOV_economic_reform_gazprom: "Реформа Газпрома"
 SOV_economic_reform_gazprom_desc: "«Газпром» сильно пострадал во время кризиса 1990-х годов. Реформирование этой важнейшей компании необходимо для того, чтобы она оставалась мощным двигателем нашего экономического роста."
 SOV_economic_reform_gazprom: "Реформа Газпрома"
 SOV_economic_reform_gazprom_desc: "В период кризиса 1990-х годов «Газпром» понёс тяжёлые потери. Реформирование этой ключевой компании необходимо, чтобы сохранить её как мощный двигатель нашего экономического роста."
 SOV_economic_nationalize_gazprom: "Национализация Газпрома"
 SOV_economic_nationalize_gazprom_desc: "Газовый гигант, доставшийся в наследство от рухнувшей «потерянной империи», слишком долго оставался частным владением олигархов и иностранных лоббистов. Национализация всей цепочки - от добычи до экспорта в Европу - наполнит государственную казну и обеспечит, чтобы стратегические ресурсы служили нации, а не горстке нуворишей."
 SOV_economic_nationalize_gazprom1: "Второй этап национализации"
 SOV_economic_nationalize_gazprom1_desc: "Первые указы уже подписаны, но монополисты сопротивляются. Мы должны выкупить доли иностранных акционеров, взять под контроль критически важные трубопроводы и перерабатывающие заводы, а также уничтожить теневые торговые схемы. Этот этап ударит по спекулянтам, но создаст единую государственную систему управления нашим энергетическим экспортом."
 SOV_economic_nationalize_gazprom2: "Завершающий этап национализации"
 SOV_economic_nationalize_gazprom2_desc: "Финальный аккорд. Устанавливается полная государственная монополия на природный газ. Все «серые» экспортёры ликвидируются, а новая государственная холдинговая компания подчиняется непосредственно Народному комиссариату. Этот этап завершает тотальное изъятие газовых активов, устраняя любое внешнее давление на нашу промышленную независимость и направляя нефтедоллары напрямую на перевооружение и социальные программы."
 SOV_economic_buy_sibur: "Приобретение активов СИБУРа"
 SOV_economic_buy_sibur_desc: "Мы приобретаем активы нефтяной компании «СИБУР», чтобы расширить наши производственные возможности и обеспечить безопасность нашего энергетического сектора."
 SOV_economic_zapolyarnoe: "Заполярное газовое месторождение"
 SOV_economic_zapolyarnoe_desc: "Обнаруженные в 1960-х годах огромные запасы газа, нефти и конденсата на Заполярном месторождении теперь готовы к разработке, что позволит увеличить объёмы производства энергии."
 SOV_economic_gazprom_tes: "Тепловые электростанции"
 SOV_economic_gazprom_tes_desc: "В рамках нашей программы развития энергетики мы построим несколько тепловых электростанций по всей стране, чтобы обеспечить стабильное электроснабжение."
 SOV_economic_nat_gas_sakhalin: "Добыча газа на Сахалине"
 SOV_economic_nat_gas_sakhalin_desc: "Инвестиции в газовые месторождения Сахалина обеспечат значительную прибыль и укрепят наши позиции в сфере экспорта энергоресурсов."
 SOV_economic_gazprom_stream: "Строительство ручьев"
 SOV_economic_gazprom_stream_desc: "Мы готовы построить новые газопроводы в обход некоторых стран, чтобы обеспечить стабильный и надёжный экспорт газа."
 SOV_economic_gazprom_norstream: "Северный поток"
 SOV_economic_gazprom_norstream_desc: "Мы построим прямой газопровод в Германию, что обеспечит стабильные поставки и укрепит экономические связи."
 SOV_economic_gazprom_bluestream: "Голубой Поток"
 SOV_economic_gazprom_bluestream_desc: "Планируется строительство газопровода в Турцию для расширения экспорта энергоресурсов и укрепления регионального сотрудничества."
 SOV_economic_gazprom_turkeystream: "Турецкий поток"
 SOV_economic_gazprom_turkeystream_desc: "Наше сотрудничество с Турцией углубляется по мере того, как мы готовимся к строительству ещё одного крупного газопровода."
 SOV_economic_gazprom_nordstream2: "Северный поток 2"
 SOV_economic_gazprom_nordstream2_desc: "Мы планируем расширить наше газовое партнёрство с Германией, построив второй трубопровод для удовлетворения растущего спроса."
 SOV_join_wto: "Вступить в ВТО"
 SOV_join_wto_desc: "Вступление в Всемирную торговую организацию позволит нам глубже интегрироваться в мировую экономику и принесёт процветание нашему народу."
 SOV_outer_space_initiative: "Развитие Роскосмоса"
 SOV_outer_space_initiative_desc: "Для реализации космических амбиций России необходим финансово стабильный и надёжный «Роскосмос», который будет руководить нашими исследовательскими и технологическими проектами."
 SOV_outer_space_vostochniy: "Космодром Восточный"
 SOV_outer_space_vostochniy_desc: "Чтобы снизить зависимость от Байконура, мы начнём строительство космодрома Восточный для будущих запусков."
 SOV_outer_space_asteroids_mining: "Ресурсы с астероидов"
 SOV_outer_space_asteroids_mining_desc: "Наши космические технологии теперь позволяют добывать ценные ресурсы с астероидов, и мы будем извлекать из этого выгоду."
 SOV_outer_space_space_combat_wombat: "Подготовка к космической гонке"
 SOV_outer_space_space_combat_wombat_desc: "Космическая гонка возобновилась после перерыва, и мы должны активизировать наши усилия, чтобы вернуть себе лидерство."
 SOV_outer_space_sateelites: "Инвестиции в спутники"
 SOV_outer_space_sateelites_desc: "Спутники — это глаза в космосе, необходимые не только для наблюдения, но и для предотвращения возможных конфликтов в будущем."
 SOV_outer_space_weaponized_space: "Милитаризация космоса"
 SOV_outer_space_weaponized_space_desc: "Космос неизбежно станет сферой военных действий, поэтому крайне важно, чтобы мы первыми приняли меры для защиты своих интересов."
 SOV_outer_space_moon_base: "Лунная база"
 SOV_outer_space_moon_base_desc: "Создание лунной базы станет важной вехой на нашем пути к покорению Солнечной системы."
 SOV_outer_space_marines: "Космические десантники"
 SOV_outer_space_marines_desc: "Наш новый отряд Космических Десантников не знает пощады и победит любого врага в космическом бою."
 SOV_found_rosatom: "Основание Росатома"
 SOV_found_rosatom_desc: "«Росатом» — это государственная корпорация по атомной энергии, управляющая ядерно-промышленным комплексом России."
 SOV_more_minatom: "Развивать Минатом"
 SOV_more_minatom_desc: "Мы намерены и дальше развивать нашу атомную промышленность, и, соответственно, Министерство атомной энергетики получит от нас дополнительное финансирование."
 SOV_economic_floating_nuclear: "Плавучие атомные электростанции"
 SOV_economic_floating_nuclear_desc: "«Росатом» разрабатывает автономные плавучие атомные электростанции, которые будут производиться серийно и размещаться вблизи объектов, нуждающихся в электроэнергии."
 SOV_economic_securing_rosatom: "Промышленная безопасность"
 SOV_economic_securing_rosatom_desc: "Мы усилим меры безопасности на ядерных объектах, чтобы предотвратить катастрофические инциденты."
 SOV_rosatom_fuel_division: "Топливный дивизион Росатома"
 SOV_rosatom_fuel_division_desc: "Для оптимизации работы все ядерные активы будут объединены в топливный дивизион под руководством «Росатома»."
 SOV_rosatom_fuel_division2: "Сибирский химический комбинат"
 SOV_rosatom_fuel_division2_desc: "Этот комплекс, основанный в 1953 году в Томске-7 (ныне Северск), занимается производством компонентов для ядерного оружия и является дочерним предприятием «ТВЭЛ»."
 SOV_economic_anti_terrorist_rosatom: "Антитеррористическая защита"
 SOV_economic_anti_terrorist_rosatom_desc: "Мы будем сотрудничать с Национальной гвардией, чтобы обеспечить полную защиту наших ядерных объектов от террористических угроз."
 SOV_economic_rao_ues: "Ликвидация РАО ЕЭС"
 SOV_economic_rao_ues_desc: "Реформирование энергетического сектора требует ликвидации нынешнего монополиста на рынке — РАО «ЕЭС»."
 SOV_economic_rus_hydro: "Создание РусГидро"
 SOV_economic_rus_hydro_desc: "Мы создадим «РусГидро» для эффективного контроля и управления объектами по производству энергии."
 SOV_economic_interrao: "Интер РАО"
 SOV_economic_interrao_desc: "Компания «Интер РАО», основанная в 1997 году, будет расширяться за счёт приобретения внутренних электросетей в рамках нашей энергетической реформы."
 SOV_economic_no_more_rao_eus: "Национализация энергетики"
 SOV_economic_no_more_rao_eus_desc: "Пришло время полностью обратить вспять безумную либерализацию энергетического сектора нашей страны, и эта совершенно хищническая реформа будет остановлена. Мы начнём с ликвидации РАО «ЕЭС России»."
 SOV_seize_yukos_oil: "Арестовать нефть ЮКОСа"
 SOV_seize_yukos_oil_desc: "С устранением Ходорковского мы сможем захватить компанию ЮКОС и перераспределить её активы среди лояльных сторон."
 SOV_khodorkovsky_trial: "Судебный процесс над Ходорковским"
 SOV_khodorkovsky_trial_desc: "Собрав достаточные доказательства, мы приступим к суду над Ходорковским, хотя исход уже предрешён."
 SOV_khodorkovsky_case: "Дело Ходорковского"
 SOV_khodorkovsky_case_desc: "Столкнувшись с обвинениями в коррупции и уклонении от уплаты налогов, Ходорковский, вероятно, потеряет свои активы в компании ЮКОС."
 SOV_remove_guzinsky: "Убрать Гусинского"
 SOV_remove_guzinsky_desc: "Медиамагнат Владимир Гусинский отказывается сотрудничать с правительством и олигархами, и с ним необходимо разобраться"
 SOV_economic_trikolov_tv: "Триколор ТВ"
 SOV_economic_trikolov_tv_desc: "Несмотря на то, что мы являемся частной компанией, мы сохраним скрытый контроль над вещательной сетью «Триколор ТВ»."
 SOV_economic_gazprom_media: "Газпром-Медиа"
 SOV_economic_gazprom_media_desc: "«Газпром» планирует создать собственный медиахолдинг. Мы должны контролировать этот процесс и влиять на него."
 SOV_delay_sibirneft_merger: "Отложить слияние с Сибнефтью"
 SOV_delay_sibirneft_merger_desc: "Предложенное слияние ЮКОСа и Сибнефти было заблокировано с помощью сфабрикованных обвинений против Ходорковского, чтобы помешать его контролю."
 SOV_economic_gazprom_neft: "Газпром нефть"
 SOV_economic_gazprom_neft_desc: "После ликвидации «Сибнефти» «Газпром» получил контрольный пакет акций и полный контроль над её активами."
 SOV_economic_gas_with_sibur: "Нефтегазовый проект с СИБУРОМ"
 SOV_economic_gas_with_sibur_desc: "«Газпром» разрабатывает совместный с СИБУРом нефтегазовый проект для увеличения добычи в регионе."
 SOV_economic_arctic_gas: "Арктические нефтяные и газовые месторождения"
 SOV_economic_arctic_gas_desc: "«Газпром» планирует исследовать и разрабатывать обширные запасы нефти и газа на арктических месторождениях."
 SOV_economic_oil_nenets: "Нефтегазовый проект в [NEE.GetName]"
 SOV_economic_oil_nenets_desc: "«Газпром» продолжает развивать нефтегазовые проекты в этом стратегически важном регионе."
 SOV_economic_oil_yamao: "Нефтегазовый проект в [YAM.GetName]"
 SOV_economic_oil_yamao_desc: "Дальнейшее освоение нефтегазовых ресурсов в этом регионе остаётся приоритетной задачей для «Газпрома»"
 SOV_economic_oil_khmao: "Нефтегазовый проект в [KHM.GetName]"
 SOV_economic_oil_khmao_desc: "«Газпром» намерен расширить добычу нефти и газа в этом регионе."
 SOV_economic_slavneft: "Покупка активов \"СЛАВНЕФТИ\""
 SOV_economic_slavneft_desc: "«Роснефть» и «Газпром» планируют разделить и приобрести активы «Славнефти»."
 SOV_economic_reform_rosneft: "Реформа Роснефти"
 SOV_economic_reform_rosneft_desc: "«Роснефть» намерена провести реструктуризацию и расширить свою деятельность, чтобы укрепить позиции на рынке."
 SOV_economic_reform_rosneft_nationalize: "Национализация Роснефти"
 SOV_economic_reform_rosneft_nationalize_desc: "Мы полностью интегрируем активы «Роснефти» под государственный контроль и создадим соответствующее министерство - Министерство нефти."
 SOV_economic_reform_rosneft_nationalize_assets: "Продолжить национализацию Роснефти"
 SOV_economic_reform_rosneft_nationalize_assets_desc: "Мы полностью интегрируем активы «Роснефти» под государственный контроль и создадим соответствующее министерство - Министерство нефти."
 SOV_economic_reform_slavneft_nationalize: "Национализация «Славнефти»"
 SOV_economic_reform_slavneft_nationalize_desc: ""
 SOV_economic_metallurgy_nationalize: "Создать Министерство металлургии"
 SOV_economic_metallurgy_nationalize_desc: ""
 SOV_economic_metallurgy_nationalize_second: "Продолжить национализацию металлургии"
 SOV_economic_metallurgy_nationalize_second_desc: ""
 SOV_economic_use_yukos: "Использовать активы ЮКОСА"
 SOV_economic_use_yukos_desc: "«Роснефть» будет использовать активы, полученные в результате ликвидации ЮКОСа, для дальнейшего развития компании."
 SOV_economic_buy_itera: "Приобретение компании ИТЕРА"
 SOV_economic_buy_itera_desc: "«Роснефть» планирует включить ITERA в свой портфель в качестве нового стратегического актива."
 SOV_economic_buy_severnaya_neft: "Приобретение Северной-нефти"
 SOV_economic_buy_severnaya_neft_desc: "Приобретение «Северной нефти» расширит ресурсную базу «Роснефти»."
 SOV_economic_buy_thk_bp: "Приобретение ТНК"
 SOV_economic_buy_thk_bp_desc: "«Роснефть» намерена приобрести ТНК, чтобы укрепить свои позиции в сфере нефтедобычи."
 SOV_economic_efko: "Эфко"
 SOV_economic_efko_desc: "«ЭФКО» — ведущий российский производитель жиров, маргарина, майонеза, растительных масел и молочных продуктов, входящая в число крупнейших агропромышленных компаний."
 SOV_economic_miratorg: "Мираторг"
 SOV_economic_miratorg_desc: "«Мираторг» — крупнейший в России вертикально интегрированный агрохолдинг, производящий свинину и мясную продукцию по всей цепочке поставок."
 SOV_economic_rusagro: "\"РусАгро\""
 SOV_economic_rusagro_desc: "«Русагро», одна из крупнейших сельскохозяйственных компаний России, основанная в 1995 году, специализируется на производстве свинины, жиров и сахара."
 SOV_economic_rusagro_nationalize: "Национализация РусАгро"
 SOV_economic_rusagro_nationalize_desc: "«Русагро» не должно существовать, это они отобрали землю у мелких фермеров в 1990-х годах, и теперь мы вернём всё государству."
 SOV_economic_miratorg_nationalize: "Национализация Мираторга"
 SOV_economic_miratorg_nationalize_desc: "Мы собираемся национализировать эту агрокомпанию - хватит позволять олигархам бесчинствовать на наших сельхозземлях."
 SOV_economic_efko_nationalize: "Национализация Эфко"
 SOV_economic_efko_nationalize_desc: "Пора национализировать этого агропромышленного гиганта - мы больше не допустим, чтобы олигархи хозяйничали на наших полях."
 SOV_economic_phos_agro: "\"ФосАгро\""
 SOV_economic_phos_agro_desc: "Компания «ФосАгро», базирующаяся в Москве, является крупнейшим в Европе производителем фосфорсодержащих удобрений и сопутствующих химикатов."
 SOV_economic_phos_agro_nationalize: "Национализация ФосАгро"
 SOV_economic_phos_agro_nationalize_desc: "Мы намерены национализировать эту сельскохозяйственную компанию и больше не позволим олигархам эксплуатировать сельскохозяйственные земли нашей страны."
 SOV_economic_evraz: "ЕВРАЗ"
 SOV_economic_evraz_desc: "«Евраз» — международная сталелитейная и горнодобывающая компания, частично принадлежащая российским олигархам и работающая в основном в России, США, Канаде и Казахстане."
 SOV_economic_mechel: "Мечел"
 SOV_economic_mechel_desc: "«Мечел» — крупный российский производитель угля, железной руды и стальной продукции со штаб-квартирой в Москве, осуществляющий продажи на внутреннем и международном рынках."
 SOV_economic_severstal: "Северсталь"
 SOV_economic_severstal_desc: "«Северсталь» — крупнейший в России производитель стали со штаб-квартирой в Череповце, контролируемый миллиардером Алексеем Мордашовым."
 SOV_economic_evraz_asset: "Расширение деятельности Евраз"
 SOV_economic_evraz_asset_desc: "«Евраз» намерен и дальше расширяться за счёт государственных субсидий, поддерживающих его рост."
 SOV_economic_yakut_ugol: "Приобретение компании ЯкутУголь"
 SOV_economic_yakut_ugol_desc: "«Мечел» планирует приобрести активы «Якутугля», чтобы расширить свои мощности по добыче угля."
 SOV_economic_severstal_expanded: "Расширение Северстали"
 SOV_economic_severstal_expanded_desc: "«Северсталь» намерена развиваться при поддержке государства в реализации новых проектов."
 SOV_economic_nornickel: "Норникель"
 SOV_economic_nornickel_desc: "«Норникель» — ведущая российская горно-металлургическая компания, специализирующаяся на добыче и производстве никеля и палладия, работающая в основном в районе Норильска."
 SOV_economic_buy_polus: "Купить Polyus"
 SOV_economic_buy_polus_desc: "«Полюс» — крупнейший производитель золота в России и одна из ведущих горнодобывающих компаний мира по объёму производства."
 SOV_economic_alrosa: "Алроса"
 SOV_economic_alrosa_desc: "«Алроса» лидирует в мировой добыче алмазов по объёму, на её долю приходится 95 % российской и 27 % мировой добычи алмазов."
 SOV_economic_nakynskoe: "Горно-обогатительный комбинат"
 SOV_economic_nakynskoe_desc: "«Алроса» открыла Нюрбинский завод, увеличив свои мощности по добыче и переработке."
 SOV_economic_rusal: "Русал"
 SOV_economic_rusal_desc: "«Русал» — второй по величине производитель алюминия в мире, на долю которого приходится почти 9 % мирового производства."
 SOV_economic_buy_sual: "Приобретение активов SUAL"
 SOV_economic_buy_sual_desc: "Завершение интеграции SUAL позволит полностью сформировать компанию под нашим контролем."
 SOV_economic_aeroflot: "Аэрофлот"
 SOV_economic_aeroflot_desc: "«Аэрофлот» — флагманская авиакомпания России, созданная на базе государственного предприятия советской эпохи и работающая на международном уровне."
 SOV_economic_poebda: "Победа"
 SOV_economic_poebda_desc: "«Победа» — российская бюджетная авиакомпания, дочернее предприятие «Аэрофлота», базирующееся в московском аэропорту Внуково."
 SOV_economic_new_airports: "Строить новые аэропорты"
 SOV_economic_new_airports_desc: "«Аэрофлот» планирует инвестировать в строительство новых аэропортов по всей стране, чтобы повысить доступность перелётов."
 SOV_economic_rjd: "РЖД"
 SOV_economic_rjd_desc: "«Российские железные дороги» — государственная вертикально интегрированная компания, владеющая общественной инфраструктурой и являющаяся крупнейшим перевозчиком на железнодорожной сети России. Она была создана на базе бывшего Министерства путей сообщения России. Компания играет важную роль в обеспечении связи между обширными регионами страны и поддержке экономического развития."
 SOV_economic_rjd_sochi: "Инфраструктура в Сочи"
 SOV_economic_rjd_sochi_desc: "«Российские железные дороги» планируют вложить значительные средства в инфраструктуру Сочи, чтобы стимулировать развитие туризма и улучшить транспортное сообщение в регионе. Эти меры направлены на то, чтобы сделать Сочи более доступным и привлекательным местом как для местных жителей, так и для иностранных гостей."
 SOV_economic_rjd_more_trains: "Приобретение поездов"
 SOV_economic_rjd_more_trains_desc: "«Российские железные дороги» расширяют свой парк, срочно заказывая большое количество новых вагонов. Это позволит модернизировать сеть и повысить пропускную способность перевозок по всей стране."
 SOV_economic_rjd_moscow_circle: "Московское центральное кольцо"
 SOV_economic_rjd_moscow_circle_desc: "Московское центральное кольцо (МЦК), известное как 14-я линия и обозначенное клубнично-красным и белым цветами, представляет собой 54-километровую линию городской железной дороги, опоясывающую историческую часть Москвы. Это важнейший кольцевой маршрут, который разгружает дороги и соединяет многие ключевые районы города."
 SOV_economic_rjd_transsib: "Транссибирская магистраль"
 SOV_economic_rjd_transsib_desc: "Транссибирская магистраль, исторически называвшаяся Великим Сибирским путём и часто сокращаемая до Транссиба, представляет собой обширную железнодорожную сеть, соединяющую европейскую часть России с Дальним Востоком. Она имеет решающее значение для грузовых и пассажирских перевозок через весь континент."
 SOV_economic_rjd_baikal_amure: "Байкало Амурская магистраль"
 SOV_economic_rjd_baikal_amure_desc: "Байкало-Амурская магистраль (БАМ) — это ширококолейная железная дорога протяжённостью 4324 километра, проходящая через Восточную Сибирь и Дальний Восток России. Она расположена примерно в 610-770 километрах к северу от Транссибирской магистрали и параллельно ей, обеспечивая важный альтернативный транспортный коридор."
 SOV_economic_rjd_north_latitudinal: "Северный широтный ход железной дороги"
 SOV_economic_rjd_north_latitudinal_desc: "Северная широтная железная дорога, которая в настоящее время строится в Ямало-Ненецком автономном округе, протянется на 707 километров. Она соединит западную и восточную части региона, связав Северную железную дорогу на востоке со Свердловской областью, что значительно улучшит транспортное сообщение в регионе."
 SOV_economic_rjd_sakhalin: "Транспортная инфраструктура на Сахалине"
 SOV_economic_rjd_sakhalin_desc: "Транспортная инфраструктура Сахалина нуждается в модернизации для обеспечения экономического роста острова. Российские железные дороги планируют проекты по расширению сети для модернизации и улучшения транспортного сообщения на Сахалине."
 SOV_economic_rjd_mcd: "Московские центральные диаметры"
 SOV_economic_rjd_mcd_desc: "Московские центральные диаметры (МЦД) — это пригородные железнодорожные маршруты, проходящие по существующим пригородным железнодорожным линиям в Москве и Московской области. Эти маршруты повышают эффективность перевозок, напрямую соединяя отдалённые районы с центром города."
 SOV_economic_rubber: "Отечественная шинная промышленность"
 SOV_economic_rubber_desc: "Наша отечественная шинная промышленность по-прежнему недостаточно развита и остро нуждается в дополнительных инвестициях. Выделив несколько бюджетных траншей, мы стремимся модернизировать производство и укрепить этот важный сектор нашей экономики."
 SOV_economic_rubber_foreign: "Иностранные инвесторы"
 SOV_economic_rubber_foreign_desc: "Мы планируем привлечь ведущих зарубежных производителей и бренды к созданию производственных мощностей в России. Это позволит внедрить передовые технологии и будет способствовать развитию местной промышленности."
 SOV_economic_auto: "Автомобильная промышленность"
 SOV_economic_auto_desc: "За последнее десятилетие спрос на автомобили значительно вырос, поэтому крайне важно определить будущее направление развития нашей автомобильной промышленности. Инвестиции и стратегическое партнёрство помогут удовлетворить этот растущий спрос."
 SOV_economic_invite_investors: "Приглашать иностранные бренды"
 SOV_economic_invite_investors_desc: "Мы готовы принять иностранные автомобильные бренды для строительства заводов в России. Это позволит диверсифицировать наш рынок и внедрить передовые автомобильные технологии."
 SOV_economic_cars_usa: "Американские бренды"
 SOV_economic_cars_usa_desc: "Американским автопроизводителям предлагается выйти на наш рынок и расширить своё присутствие на нём. Такое сотрудничество расширит выбор для потребителей и будет способствовать развитию конкуренции."
 SOV_economic_cars_europe: "Европейские бренды"
 SOV_economic_cars_europe_desc: "Мы готовы к полной интеграции европейских автомобильных брендов в российский рынок. Их участие будет способствовать технологическому росту и разнообразию рынка."
 SOV_economic_reno_nissan_autovaz: "Автоваз Renault Nissan"
 SOV_economic_reno_nissan_autovaz_desc: "Альянс между «АвтоВАЗом», Renault и Nissan направлен на укрепление нашего автомобильного сектора и положительное влияние на рынок за счёт совместного использования опыта и ресурсов."
 SOV_economic_cars_west_market: "Западный автомобильный рынок"
 SOV_economic_cars_west_market_desc: "Наш рынок всё больше интегрируется с западными автопроизводителями. Эта тенденция сохранится, что будет способствовать модернизации отрасли и расширению ассортимента транспортных средств для потребителей."
 SOV_economic_cars_japan_market: "Японский автомобильный рынок"
 SOV_economic_cars_japan_market_desc: "Мы планируем укреплять партнёрские отношения с японскими производителями автомобилей, чтобы использовать их передовые технологии и производственные стандарты."
 SOV_economic_cars_china_market: "Китайский автомобильный рынок"
 SOV_economic_cars_china_market_desc: "Укрепление связей с китайскими автопроизводителями откроет новые возможности и позволит российским потребителям получить доступ к инновационным моделям."
 SOV_economic_cars_udar_market: "Китайские производители"
 SOV_economic_cars_udar_market_desc: "Мы расширим присутствие китайских производителей на нашем внутреннем рынке. Это усилит конкуренцию и предоставит покупателям более доступные варианты."
 SOV_economic_cars_moskvich: "Москвич"
 SOV_economic_cars_moskvich_desc: "Мы планируем возродить исторический бренд «Москвич», лицензируя дизайн иностранных автомобилей. Такой подход позволяет сочетать наследие с современными технологиями."
 SOV_economic_aurus: "Аурус"
 SOV_economic_aurus_desc: "Aurus — престижный российский бренд, известный своими автомобилями представительского класса и класса люкс. Изначально разработанный как Единая модульная платформа и проект «Кортеж», он олицетворяет наше высочайшее автомобильное мастерство."
 SOV_economic_domestic: "Отечественные Бренды"
 SOV_economic_domestic_desc: "Необходимо уделять первостепенное внимание защите наших отечественных автопроизводителей, а не полагаться исключительно на зарубежные решения. Наращивание местного потенциала укрепляет нашу экономику и независимость в сфере автомобилестроения."
 SOV_economic_avtovaz: "АвтоВАЗ"
 SOV_economic_avtovaz_desc: "«АвтоВАЗ» — крупный российский государственный производитель автомобилей, ранее известный как ВАЗ. Автомобили компании, наиболее известной благодаря серии Lada, когда-то продавались под разными названиями, такими как «Жигули», «Ока» и «Спутник», которые были заменены на бренд Lada в 1990-х годах."
 SOV_economic_kamaz: "КАМАЗ"
 SOV_economic_kamaz_desc: "«КАМАЗ» со штаб-квартирой в Набережных Челнах — ведущий российский производитель грузовых автомобилей, автобусов и двигателей. Основанная в 1969 году компания особенно известна своими грузовиками с кабиной над двигателем."
 SOV_economic_gaz: "\"ГАЗ\""
 SOV_economic_gaz_desc: "«ГАЗ», или Горьковский автомобильный завод, — ключевой российский производитель автомобилей, расположенный в Нижнем Новгороде. Он является основным дочерним предприятием холдинга «Группа ГАЗ», который входит в промышленную группу «Базовый элемент»."
 SOV_economic_national_proud: "Национальная гордость"
 SOV_economic_national_proud_desc: "Наши отечественные автомобили — предмет национальной гордости. Мы по-прежнему стремимся поддерживать их развитие и сделать так, чтобы они стали одними из лучших автомобилей в мире."
 SOV_economic_vaz_electro_car: "Электромобили ВАЗ"
 SOV_economic_vaz_electro_car_desc: "ВАЗ планирует запустить собственную линейку электромобилей. Эта инициатива является частью более масштабной стратегии по модернизации автомобильной промышленности и удовлетворению будущих потребностей."
 SOV_economic_own_mosnosti: "Наши возможности"
 SOV_economic_own_mosnosti_desc: "Мы намерены развивать автомобильную промышленность, опираясь исключительно на собственные производственные мощности. Это поможет сохранить контроль над качеством и укрепить отечественное производство."
 SOV_economic_chaika: "Чайка"
 SOV_economic_chaika_desc: "Исторический бренд «Чайка» будет возрождён с учётом современных обновлений и функций. Это возрождение призвано объединить классическое наследие с современным автомобильным дизайном."
 SOV_economic_rostelekom: "Ростелеком"
 SOV_economic_rostelekom_desc: "«Ростелеком» — крупнейший в России поставщик цифровых услуг, обслуживающий домохозяйства, предприятия, государственные органы и операторов связи. Он объединяет локальные сети в единую национальную систему для предоставления услуг междугородной связи и интернета, играя ключевую роль в коммуникационной инфраструктуре России."
 SOV_economic_inter_networks: "Операторы внутренней сети"
 SOV_economic_inter_networks_desc: "«Ростелеком» планирует приобрести множество небольших сетевых операторов по всей России, чтобы консолидировать их под своим контролем. Эта стратегия позволит повысить эффективность и увеличить долю рынка."
 SOV_economic_gosuslugi: "ГосУслуги"
 SOV_economic_gosuslugi_desc: "«Госуслуги» — это федеральная цифровая платформа, управляемая правительством России, которая обеспечивает онлайн-доступ к информации о государственных и муниципальных услугах. Она предлагает электронные формы и упрощает взаимодействие между гражданами, бизнесом и правительством."
 SOV_economic_mts: "МТС"
 SOV_economic_mts_desc: "«Мобильные ТелеСистемы» (МТС) — крупнейший в России оператор мобильной связи со штаб-квартирой в Москве. Он предоставляет услуги в стандартах GSM, UMTS и LTE, а также услуги фиксированной телефонной связи, широкополосного доступа в интернет и различные телевизионные услуги."
 SOV_economic_mts_expanding: "Расширение деятельности МТС"
 SOV_economic_mts_expanding_desc: "МТС инвестирует в строительство многочисленных вышек сотовой связи по всей стране. Это расширение позволит улучшить покрытие и качество связи на всей территории России, что принесет пользу миллионам пользователей."
 SOV_economic_tele2: "TELE2"
 SOV_economic_tele2_desc: "Tele2 Россия, изначально основанная шведской компанией Tele2, теперь полностью принадлежит «Ростелекому» и является ключевым игроком на российском рынке телекоммуникаций."
 SOV_economic_megaphon: "МегаФон"
 SOV_economic_megaphon_desc: "«МегаФон», ранее известный как «Северо-Западный GSM», является вторым по величине оператором мобильной связи в России и третьим по величине поставщиком телекоммуникационных услуг. Он предоставляет услуги в сетях GSM, UMTS и LTE по всей стране."
 SOV_economic_it_sphere: "Российский ИТ-сектор"
 SOV_economic_it_sphere_desc: "Мы стремимся развивать отечественный IT-сектор, потому что технологии — это основа будущего. Инвестиции в IT гарантируют, что наша страна останется конкурентоспособной и инновационной."
 SOV_economic_mmvb: "Московская валютная биржа"
 SOV_economic_mmvb_desc: "Московская межбанковская валютная биржа — ключевое финансовое учреждение, обеспечивающее торговлю валютой и ценными бумагами. Она играет важную роль на финансовых рынках России."
 SOV_economic_mosbirja: "Московская биржа"
 SOV_economic_mosbirja_desc: "Московская биржа — главная российская площадка для торговли акциями, облигациями, деривативами и валютой. Она является основой финансовой инфраструктуры страны."
 SOV_economic_sber_reorg: "Реформа Сбербанка"
 SOV_economic_sber_reorg_desc: "Сбербанк проводит комплексные реформы, направленные на модернизацию деятельности и улучшение качества услуг. Эта трансформация призвана сделать банк более клиентоориентированным и конкурентоспособным в условиях меняющегося финансового ландшафта."
 SOV_economic_sber_ipo: "IPO Сбербанка для народа"
 SOV_economic_sber_ipo_desc: "Сбербанк планирует провести публичное IPO, чтобы расширить круг собственников и укрепить капитальную базу. Эта инициатива повысит прозрачность и обеспечит более активное участие общественности."
 SOV_economic_vtb_ipo: "IPO ВТБ для народа"
 SOV_economic_vtb_ipo_desc: "Банк ВТБ готовится к публичному IPO, чтобы привлечь инвестиции и расширить своё присутствие на рынке. Этот шаг повысит его финансовую стабильность и будет способствовать росту."
 SOV_economic_vtb: "ВТБ БАНК"
 SOV_economic_vtb_desc: "Банк ВТБ — крупное российское финансовое учреждение, предлагающее широкий спектр банковских услуг частным лицам и компаниям. Он играет ключевую роль в банковском секторе России."
 SOV_economic_alpha: "Альфа Банк"
 SOV_economic_alpha_desc: "Альфа-Банк — ведущий частный банк в России, известный своими комплексными финансовыми продуктами и услугами. Он обслуживает как розничных, так и корпоративных клиентов."
 SOV_economic_alpha_lab: "Лаб. Альфа"
 SOV_economic_alpha_lab_desc: "Лаборатория Альфа — это инновационный центр Альфа-Банк, специализирующийся на разработке передовых финансовых технологий и цифровых решений для повышения качества обслуживания клиентов."
 SOV_economic_destiny_sber: "Ребрендинг Сбербанка"
 SOV_economic_destiny_sber_desc: "Сбербанку пора провести масштабный ребрендинг. Старая структура и визуальный стиль устарели. Сегодня Сбербанк — это не просто банк, а полноценная экосистема, предлагающая широкий спектр финансовых и цифровых услуг."
 SOV_economic_destiny_vk: "ВКонтакте"
 SOV_economic_destiny_vk_desc: "«ВКонтакте» — крупнейшая социальная сеть в России, влияние которой выходит за рамки нашего воображения. Возможно, пришло время взять эту платформу под государственный контроль, чтобы обеспечить её соответствие национальным интересам."
 SOV_economic_kasperskyi: "Лаборатория Касперского"
 SOV_economic_kasperskyi_desc: "«Лаборатория Касперского» — всемирно известная компания в сфере кибербезопасности со штаб-квартирой в России. Она разрабатывает передовые антивирусные программы и ПО для обеспечения безопасности, которые защищают пользователей по всему миру."
 SOV_economic_bilene: "\"Билайн\""
 SOV_economic_bilene_desc: "«Билайн» — ведущая российская телекоммуникационная компания, предоставляющая услуги мобильной связи и интернета по всей стране. Она играет важную роль в объединении людей и компаний."
 SOV_economic_mir: "\"Мир\""
 SOV_economic_mir_desc: "«Мир» — российская электронная платёжная система, созданная Центральным банком России. Она предлагает финансовым учреждениям фирменные платёжные продукты, используемые для кредитных, дебетовых и других карточных программ, и является отечественной альтернативой международным платёжным системам."
 SOV_economic_destiny_yandex: "ЯНДЕКС"
 SOV_economic_destiny_yandex_desc: "Начав с небольшой компании, «Яндекс» стал лидером в сфере информационных технологий в России. Сейчас он настолько влиятелен, что для определения его дальнейшего курса может потребоваться участие государства."
 SOV_economic_glonass: "ГЛОНАСС"
 SOV_economic_glonass_desc: "«ГЛОНАСС» — российская спутниковая навигационная система, обеспечивающая глобальное покрытие. Являясь альтернативой системе GPS, она предоставляет услуги точного позиционирования, критически важные для гражданского и военного использования."
 SOV_gosuslugi_idea: "ГосУслуги"
 SOV_sollers_idea: "Соллерс"
 SOV_private_media_nationalisation_idea: "Национализация частных СМИ"
 SOV_mir_idea: "\"Мир\""
 SOV_our_cars_idea: "Отечественная автомобильная промышленность"
 SOV_idea_outer_space_development: "Разработка Роскосмоса"
 SOV_russian_kosmos_idea: "Роскосмос"
 SOV_space_marines_idea: "Космические десантники"
 SOV_asteroids_idea: "Ресурсы с астероидов"
 SOV_academic_lomonosov_idea: "Плавучая атомная электростанция"

 PMR_gazprom_gaz: "Газпром в Приднестровье"
 SOV_inter_rao: "Интер РАО в Приднестровье"
 SOV_turkey_stream_idea: "«Турецкий поток»"
 SOV_blue_stream_idea: "Голубой Поток"
 SOV_nord_stream2_idea: "Северный поток 2"
 SOV_nord_stream_idea: "Северный поток"
 SOV_korean_stream_sov_idea: "Корейский поток"
 SOV_korean_stream_idea: "Корейский поток"
 SOV_baikonur_sov_kaz_idea: "Космодром Байконур"
 SOV_baikonur_kaz_idea: "Космодром Байконур"
 SOV_baikonur_sov_idea: "Космодром Байконур"
 SOV_russian_economy_idea: "Российская экономика"
 SOV_azot_fertilizers_idea: "Доступ к химическим удобрениям"
 SOV_azot_fertilizers_idea_desc: "Химические удобрения необходимы для получения хорошего урожая, особенно в сложных климатических условиях."
 SOV_azod_phosagro_idea: "ФосАгро: химические удобрения"
 SOV_azod_phosagro_idea_desc: "ФосАгро — российский химический холдинг, производящий удобрения, фосфаты и фосфаты для кормов. Компания базируется в Москве, Россия, а ее дочерние компании включают «Апатит», компанию, расположенную в Мурманской области и занимающуюся добычей апатитовой руды. Компания является крупнейшим производителем фосфатных удобрений в Европе."
 SOV_michelin_idea: "Michelin"
 SOV_yokohama_idea: "Yokohama"
 SOV_nokian_idea: "Нокиан"
 SOV_continental_idea: "Континенталь"
 SOV_pirelly_idea: "Пирелли"
 SOV_azot_fertilizers_income: "Удобрения \"ГродноАзот\""
 SOV_azot_fertilizers_income_desc: "«Гродно Азот» успешно продаёт свою продукцию во многие страны мира и приносит нашей стране хороший доход от продаж."
 SOV_broken_economy_idea_1: "Тяжелые экономические последствия"
 SOV_broken_economy_idea_2: "Серьезные экономические последствия"
 SOV_broken_economy_idea_3: "Средние экономические последствия"
 SOV_russian_bad_economy_idea: "Разрушенная экономика"
 SOV_russian_bad_economy_idea_desc: "90-е годы оказали огромное влияние на российскую экономику. Полное уничтожение советской промышленности и научно-исследовательских разработок привело к серьёзному экономическому кризису, который мы должны преодолеть."
 sov_economic.1.t: "Дело Ходорковского"
 sov_economic.1.d: "Михаил Ходорковский был арестован по подозрению в крупных хищениях и коррупции в его нефтяной компании «ЮКОС». Он обладает значительным влиянием среди олигархов и может представлять угрозу для внутренней стабильности. Хотя убедительных доказательств его вины нет, мы должны тщательно продумать дальнейшие действия. Этот выбор может иметь долгосрочные политические последствия."
 sov_economic.1.a: "Виновный"
 sov_economic.1.b: "Он хороший бизнесмен, а не вор!"
 sov_economic.2.t: "Судебный процесс над Ходорковским"
 sov_economic.2.d: "После быстрого расследования пришло время вынести приговор Ходорковскому. Мы должны принять решение о соответствующем наказании. Наше решение станет чётким сигналом о том, как мы разбираемся с громкими коррупционными делами."
 sov_economic.2.a: "Посадите его в тюрьму!"
 sov_economic.2.b: "Штрафа будет достаточно."
 sov_economic.3.t: "Дело Гусинского"
 sov_economic.3.d: "Владимир Гусинский, генеральный директор крупнейшей российской частной медиакомпании «НТВ», был обвинён в крупном мошенничестве и арестован. Он предложил продать весь свой медиахолдинг государству и покинуть страну. Стоит ли нам согласиться на эту сделку, чтобы избежать дальнейших осложнений?"
 sov_economic.3.a: "Он невиновен! Освободите его!"
 sov_economic.3.b: "Купите акции и дайте ему уйти."
 sov_economic.4.t: "Слияние «Роснефти» с ТНК"
 sov_economic.4.d: "«Роснефть» предложила объединиться со своим главным конкурентом — ТНК. Этот шаг противоречит принципам свободного рынка, но выгоден правительству. Стоит ли нам одобрить это слияние, несмотря на риски?"
 sov_economic.4.a: "Да! «Роснефть» должна доминировать."
 sov_economic.4.b: "Нет! Защищайте свободный рынок, сохраняйте независимость ТНК."
 sov_economic.5.t: "Слияние «Газпрома» с «Сибнефтью»"
 sov_economic.5.d: "«Газпром» планирует приобрести «Сибнефть», крупную нефтяную компанию, принадлежащую Роману Абрамовичу. Хотя это и угрожает свободе рынка, но укрепляет государственные корпорации. Стоит ли нам одобрить эту сделку?"
 sov_economic.5.a: "Подтвердите! «Сибнефть» становится нашей."
 sov_economic.5.b: "Откажитесь от этого! Свободный рынок жизненно важен для России."
 sov_economic.6.t: "Ликвидация РАО \"ЕЭС России\""
 sov_economic.6.d: "РАО \"ЕЭС России\" является крупнейшим поставщиком электроэнергии по всей России, владея буквально 96 процентами генерирующих сетей. По предложению Анатолия Чубайса, директора РАО \"ЕЭС России\", еще в конце 90-х годов было предложено провести масштабную реформу российских энергетических сетей. Планируется разделить компанию на множество мелких, тем самым полностью реформировав рынок и позволив развивать электросети с большим успехом в рамках конкуренции. Мы можем завершить реформу, предложенную нам Чубайсом, или полностью свернуть ее."
 sov_economic.6.a: "Мы Проведем Реформу"
 sov_economic.7.t: "Северный поток"
 sov_economic.7.d: "Россия предлагает построить газопровод «Северный поток». Этот проект обещает значительно укрепить нашу экономику и энергетический сектор."
 sov_economic.7.a: "Согласиться"
 sov_economic.7.b: "Отклонить"
 sov_economic.8.t: "Открытие газопровода"
 sov_economic.8.d: "Наше предложение о строительстве газопровода в их страну было принято. Это новый этап в нашем экономическом сотрудничестве."
 sov_economic.8.a: "Позитивное развитие событий"
 sov_economic.9.t: "Открытие газопровода"
 sov_economic.9.d: "Наше предложение о строительстве газопровода было отклонено, что стало неожиданной неудачей. Мы должны пересмотреть нашу стратегию."
 sov_economic.9.a: "Пусть они пожалеют об этом"
 sov_economic.10.t: "Голубой Поток"
 sov_economic.10.d: "Россия предлагает построить газопровод «Голубой поток», который укрепит нашу энергетическую инфраструктуру и будет способствовать экономическому росту."
 sov_economic.10.a: "Принять"
 sov_economic.10.b: "Отклонить"
 sov_economic.11.t: "«Турецкий поток»"
 sov_economic.11.d: "Россия предлагает построить газопровод «Турецкий поток». Этот проект может значительно улучшить наши экономические связи и повысить энергетическую безопасность."
 sov_economic.11.a: "Да"
 sov_economic.11.b: "Нет"
 sov_economic.12.t: "Северный поток 2"
 sov_economic.12.d: "Предложение о строительстве «Северного потока — 2» обещает укрепить нашу экономику за счёт расширения возможностей экспорта энергоресурсов."
 sov_economic.12.a: "Одобрить"
 sov_economic.12.b: "Отклонить"
 sov_economic.13.t: "Инвестиции в российскую шинную промышленность"
 sov_economic.13.d: "Российская шинная промышленность испытывает трудности и нуждается в инвестициях. Правительство готово рассмотреть наше предложение и позволить нам построить завод раньше конкурентов."
 sov_economic.13.a: "Инвест."
 sov_economic.13.b: "Отклонить"
 sov_economic.14.t: "Российская шинная промышленность"
 sov_economic.14.d: "Правительство согласилось инвестировать в нашу шинную промышленность, что открывает новые возможности для роста и модернизации."
 sov_economic.14.a: "Хорошие новости"
 sov_economic.15.t: "Российская шинная промышленность"
 sov_economic.15.d: "Правительство отказалось инвестировать в нашу шинную промышленность, что может замедлить прогресс и снизить конкурентоспособность."
 sov_economic.15.a: "Разочарование"
 sov_economic.16.t: "Россия предлагает заключить Соглашение о торговле химическими удобрениями."
 sov_economic.16.d: "Россия предложила нам эксклюзивный контракт на поставку высококачественных химических удобрений. Заключение этой сделки может значительно повысить урожайность в нашем сельском хозяйстве, хотя некоторые могут усомниться в её политической целесообразности."
 sov_economic.16.a: "Принять"
 sov_economic.16.b: "Отказать на данный момент"
 sov_economic.17.t: "[From.GetName] Принимает"
 sov_economic.17.d: "Наши переговоры с [From.GetName] увенчались успехом. Контракт подписан, и в ближайшее время ожидается первый платёж. Это позитивный шаг вперёд."
 sov_economic.17.a: "Наконец-то, хорошие новости."
 sov_economic.18.t: "[From.GetName] отказывается от нашей сделки."
 sov_economic.18.d: "Наша сделка с [From.GetName] сорвалась. Мы не получили ответа, и перспективы выглядят мрачно. Мы должны пересмотреть наш подход."
 sov_economic.18.a: "Досадная неудача."
 sov_economic.19.t: "\"Газпром-Медиа\" берет под свой контроль"
 sov_economic.19.d: "Теперь, когда последнее независимое крупное федеральное СМИ - НТВ - полностью перешло в наше подчинение, мы готовы разрешить холдингу \"Газпром медиа\" приобрести его."
 sov_economic.19.a: "Это просто бизнес"
 sov_economic.20.t: "Арест Чубайса"
 sov_economic.20.d: "Анатолий Чубайс своими реформами мог бы привести к экономическому коллапсу всей российской энергетической системы, но мы отвергли его идею и теперь готовы судить его за все, что он сделал."
 sov_economic.20.a: "Надеюсь, Он не Перевоспитается в Тюрьме"
 sov_economic.21.t: "[From.GetName] отказывается от нашей сделки."
 sov_economic.21.d: "Переговоры с [From.GetName] зашли в тупик, ответа нет. Похоже, сделка сорвалась."
 sov_economic.21.a: "Разочаровывающий отказ."
 sov_economic.22.t: "Скандал в Газпроме"
 sov_economic.22.d: "Скандал, связанный с «Газпромом», стал достоянием общественности благодаря публикациям в СМИ. Это привело к падению стоимости акций компании и вызвало опасения по поводу её репутации."
 sov_economic.22.a: "Во всем виноваты СМИ"
 sov_economic.23.t: "Скандал со Сбербанком"
 sov_economic.23.d: "Сбербанк оказался втянут в широко освещаемый в СМИ скандал, который негативно сказался на стоимости его акций и подорвал доверие инвесторов."
 sov_economic.23.a: "СМИ снова атакуют."
 sov_economic.24.t: "Скандал в Роснефти"
 sov_economic.24.d: "«Роснефть» оказалась в центре скандала, который получил широкую огласку, нанёс ущерб репутации компании и привёл к падению стоимости её акций."
 sov_economic.24.a: "Раскручивание в СМИ"
 sov_economic.25.t: "Обвал капитализации крупных компаний."
 sov_economic.25.d: "Санкции против нашей страны привели к тому, что многие иностранные инвесторы вышли из крупных компаний, что привело к резкому падению их рыночной капитализации."
 sov_economic.25.a: "Во всем виноваты иностранные интересы."
 sov_economic.26.t: "Последствия чистки олигархов"
 sov_economic.26.d: "Наш жёсткий подход к олигархам привёл к многочисленным уголовным делам, что негативно сказалось на крупных компаниях, поскольку инвесторы испугались и ушли."
 sov_economic.26.a: "Глупые инвесторы."
 sov_economic.27.t: "Авария на объекте Роснефти"
 sov_economic.27.d: "Авария на объекте «Роснефти» нанесла серьёзный экономический и экологический ущерб. Инвесторы поспешили продать акции, ожидая крупных штрафов со стороны государства."
 sov_economic.27.a: "Кто забыл закрыть кран?"
 sov_economic.28.t: "Авария на объекте Газпрома"
 sov_economic.28.d: "На объекте «Газпрома» произошёл серьёзный инцидент, повлекший за собой экономические и экологические последствия. Инвесторы быстро продали акции, опасаясь правительственных санкций."
 sov_economic.28.a: "Снова проблема с клапаном?"
 sov_economic.29.t: "Перекрытие газового потока \"Газпрома\""
 sov_economic.29.d: "Новость о закрытии газопровода сильно ударила по фондовому рынку, что привело к падению акций «Газпрома» из-за опасений инвесторов по поводу замедления роста и убытков."
 sov_economic.29.a: "Недальновидные инвесторы."
 sov_economic.30.t: "Открытие нового газового потока"
 sov_economic.30.d: "Фондовый рынок открылся на позитивной ноте: акции «Газпрома» резко выросли после объявления о запуске нового газопровода."
 sov_economic.30.a: "Отличные новости."
 sov_economic.31.t: "Паника по поводу национализации"
 sov_economic.31.d: "Слухи о пересмотре результатов приватизации 1990-х годов вызвали панику среди инвесторов, которые боялись потерять свои активы и начали стремительно продавать акции."
 sov_economic.31.a: "Слишком остро реагирующие инвесторы."
 sov_economic.32.t: "Реакция на вступление в ВТО"
 sov_economic.32.d: "После нашего официального вступления в ВТО на Московской бирже наблюдался всплеск активности: инвесторы охотно покупали акции в ожидании значительного роста."
 sov_economic.32.a: "Фантастика!"
 sov_economic.33.t: "Возобновление работы Московской фондовой биржи"
 sov_economic.33.d: "После месячного вынужденного перерыва Московская биржа вновь открылась, и торги возобновились в обычном режиме."
 sov_economic.33.a: "С возвращением."
 sov_economic.34.t: "Приватизация Кучурганской электростанции"
 sov_economic.34.d: "Российская компания «Интер Рао» планирует приватизировать нашу мощную ГРЭС. Они обещают обеспечить бесперебойную работу и постепенную техническую модернизацию, что пойдёт на пользу нашему энергетическому сектору."
 sov_economic.34.a: "Мы согласны."
 sov_economic.34.b: "Мы не согласны."
 sov_economic.35.t: "Приватизация Кучурганской электростанции"
 sov_economic.35.d: "Власти Приднестровья приняли наше предложение о приватизации, что усилило наше влияние в регионе."
 sov_economic.35.a: "Положительный результат."
 sov_economic.36.t: "Приватизация Кучурганской электростанции"
 sov_economic.36.d: "Неожиданно власти Приднестровья отклонили наше предложение о приватизации. Мы должны принять их решение и двигаться дальше."
 sov_economic.36.a: "Прискорбно"
 sov_economic.37.t: "Бесплатный газ от Газпрома"
 sov_economic.37.d: "Россия поддерживает нашу независимость и предлагает бесплатные поставки газа. Однако за эту щедрость приходится платить политическую цену, поскольку она может быть использована для влияния на нашу политику."
 sov_economic.37.a: "Принять"
 sov_economic.37.b: "Отклонить"
 sov_economic.38.t: "Бесплатный газ для Приднестровья"
 sov_economic.38.d: "Власти Приднестровья положительно отреагировали на наше предложение о бесплатном газе, что укрепило наши позиции в регионе."
 sov_economic.38.a: "Хорошие новости."
 sov_economic.39.t: "Бесплатный газ для Приднестровья"
 sov_economic.39.d: "Власти Приднестровья отказались от нашего предложения о бесплатном газе, что стало разочаровывающим ударом по нашему региональному влиянию."
 sov_economic.39.a: "Прискорбно"
 sov_economic.40.t: "Судьба социальной сети Вконтакте"
 sov_economic.40.d: "«ВКонтакте» начинался как университетская социальная сеть, но превратился в крупнейшую платформу в России. Теперь мы должны решить, каким будет её будущее, поскольку её влияние на общество стремительно растёт."
 sov_economic.40.a: "Оставьте его независимым."
 sov_economic.40.b: "Передать ВК под контроль государства."
 sov_economic.41.t: "Инициатива по реализации национальных проектов провалилась!"
 sov_economic.41.d: "Согласно последнему отчёту Министерства экономики, мы не достигли целей в рамках национальных проектов. Эта неудача наносит ущерб как нашей международной репутации, так и доверию внутри страны. Как нам следует реагировать на эту неудачу?"
 sov_economic.41.o1: "Манипулируйте фактами; стабильность важнее всего."
 sov_economic.41.o2: "Честно признайте свою неудачу."
 sov_economic.42.t: "Инициатива «Национальные проекты» — успех!"
 sov_economic.42.d: "Министерство экономики сообщает, что мы достигли целей наших национальных проектов! Этот успех демонстрирует силу и возможности нашего народа. Это повод для гордости для всей России."
 sov_economic.42.o1: "Мы сделали это! Ура!"
 sov_economic.43.t: "[From.GetName] и МТС"
 sov_economic.43.d: "[From.GetName] и наша компания МТС подписали новое соглашение, которое предоставляет нам доступ к их рынку. Ожидается, что это партнёрство значительно повысит капитализацию нашей компании."
 sov_economic.43.a: "Отлично"
 sov_economic.44.t: "[From.GetName] и \"Газпром\""
 sov_economic.44.d: "[From.GetName] и «Газпром» завершили работу над соглашением, которое открывает доступ к их рынку. Эта сделка, вероятно, укрепит нашу капитализацию и присутствие на рынке."
 sov_economic.44.a: "Отлично"
 sov_economic.45.t: "[From.GetName] и ВТБ"
 sov_economic.45.d: "[From.GetName] и ВТБ подписали соглашение, которое обеспечивает нам доступ к рынку через их сеть, что должно положительно сказаться на нашей капитализации."
 sov_economic.45.a: "Отлично"
 sov_economic.46.t: "[From.GetName] и \"Роснефть\""
 sov_economic.46.d: "[From.GetName] и «Роснефть» заключили соглашение, которое открывает нам доступ к их рынку и обещает положительно сказаться на нашей капитализации."
 sov_economic.46.a: "Отлично"
 sov_economic.47.t: "[From.GetName] и Алроса"
 sov_economic.47.d: "[From.GetName] и «Алроса» подписали соглашение, предоставляющее нам доступ к рынку через эту компанию. Ожидается, что эта сделка повысит нашу капитализацию."
 sov_economic.47.a: "Отлично"
