visegrad_category: "Вышеградская группа"
visegrad_category_desc: "§4Вышеградская группа§! — культурный и политический альянс четырех центральноевропейских стран: §YЧехия§!, §YВенгрия§!, §YПольша§! и §YСловакия§!. Цель альянса — развитие сотрудничества в военной, экономической, культурной и энергетической сферах.\n\nКаждый месяц все члены §4Вышеградской группы§! могут вкладывать деньги в бюджет §4Вышеградского фонда§!. Мы можем тратить деньги из бюджета на совместные проекты или держать в фонде, получая §GДивиденды§!.\n"
