visegrad_invest: "Инвестировано в Вышеградский фонд"
visegrad_group.1.t: "Международный Вышеградский фонд просит инвестиций"
visegrad_group.1.d: "Члены Вышеградской группы обратились к нам с коммерческим предложением. Они просят нас инвестировать в Вышеградский фонд. Поможем им?"
visegrad_group.1.a: "Инвестировать $5 миллиардов"
visegrad_group.1.b: "Инвестировать $15 миллиардов"
visegrad_group.1.c: "Инвестировать $35 миллиардов"
visegrad_group.1.g: "Это не в наших интересах."
visegrad_group.2.t: "[FROM.GetName] согласился(ась) инвестировать в Вышеградский фонд"
visegrad_group.2.d: "[FROM.GetName] согласился(ась) инвестировать в Международный Вышеградский фонд"
visegrad_group.2.a: "Отлично"
visegrad_group.3.t: "[FROM.GetName] отказался(ась) инвестировать в Вышеградский фонд"
visegrad_group.3.d: "[FROM.GetName] отказался(ась) инвестировать в Международный Вышеградский фонд"
visegrad_group.3.a: "Ладно"
visegrad_group.4.t: "[FROM.GetName] покидает Вышеградскую группу"
visegrad_group.4.d: "[FROM.GetName] объявил(а) о своём решении выйти из Вышеградской группы. Причиной названы снижение сплоченности организации и отсутствие перспектив для дальнейшего развития."
visegrad_group.4.a: "Очень жаль!"
visegrad_group.5.t: "Вышеградская группа предлагает сделку"
visegrad_group.5.d: "Вышеградская группа обратилась к нам с коммерческим предложением. Они предлагают сотрудничество с нашей автомобильной компанией Ford, а также просят инвестировать в строительство первых заводов компании. После одобрения члены Вышеградской группы смогут строить заводы Ford, увеличивая нашу капитализацию."
visegrad_group.5.a: "Сделка"
visegrad_group.5.b: "Я думаю нет..."
visegrad_group.6.t: "США согласны"
visegrad_group.6.d: "США согласились на сделку. Теперь мы можем строить автомобильные заводы Ford, увеличивая капитализацию Германии. Хорошо, что США также выделили нам средства на строительство первых заводов."
visegrad_group.6.a: "Отлично"
visegrad_group.7.t: "США отказали"
visegrad_group.7.d: "США отказали нам в сделке с Ford. Это могла бы быть хорошая сделка, но, увы"
visegrad_group.7.a: "Жаль"
visegrad_group.8.t: "Вышеградская группа предлагает сделку"
visegrad_group.8.d: "Вышеградская группа обратилась к нам с коммерческим предложением. Они предлагают сотрудничество с нашей автомобильной компанией Hyundai, а также просят инвестировать в строительство первых заводов компании. После одобрения члены Вышеградской группы смогут строить заводы Hyundai, увеличивая нашу капитализацию."
visegrad_group.9.t: "Корея согласна"
visegrad_group.9.d: "Корея согласилась на сделку. Теперь мы можем строить автомобильные заводы Hyundai, увеличивая капитализацию Кореи. Хорошо, что Корея также выделила нам средства на строительство первых заводов."
visegrad_group.10.t: "Корея отказала"
visegrad_group.10.d: "Корея отказала нам в сделке с Hyundai. Это могла бы быть хорошая сделка, но, увы"
visegrad_group.11.t: "[FROM.GetName] приглашает нас на совместные учения"
visegrad_group.11.d: "[FROM.GetName] приглашает нас на совместные учения Вышеградской боевой группы. Это даст нам боевой опыт, повысит нашу сплоченность и подготовит к возможным конфликтам, чтобы мы могли лучше противостоять угрозам."
visegrad_group.11.a: "Мы присоединимся к ним"
visegrad_group.11.b: "У нас нет времени на это"
visegrad_group.12.t: "Вышеградская группа приглашает нас на учения"
visegrad_group.12.d: "Вышеградская группа приглашает нас на совместные учения V4+ [ROOT.GetName]. Это даст нам боевой опыт, повысит нашу сплоченность и подготовит к возможным конфликтам, чтобы мы могли лучше противостоять угрозам."
visegrad_group.13.t: "Учения V4+ [FROM.GetName] прошли успешно"
visegrad_group.13.d: "Учения V4+ [FROM.GetName] прошли успешно. Это были замечательные учения, наши вооруженные силы смогли получить боевой опыт, а все участвующие страны стали еще ближе в дипломатическом плане."
visegrad_group.13.a: "Вместе мы сильнее!"
visegrad_group.14.t: "Учения V4+ [FROM.GetName] провалились"
visegrad_group.14.d: "Учения V4+ [FROM.GetName] провалились. [FROM.GetName] отказался(ась) проводить совместные учения с нашей группой"
visegrad_group.14.a: "Может, в следующий раз"
visegrad_group.15.t: "[FROM.GetName] инвестировал(а) в нас"
visegrad_group.15.d: "[FROM.GetName] инвестировал(а) в нас через Международный Вышеградский фонд. Вышеградская группа активно развивается и страны поддерживают друг друга инвестициями, это прекрасно!"
visegrad_group.15.a: "Отлично"
visegrad_group.16.t: "Новая сила"
visegrad_group.16.d: "Сегодня члены Вышеградской группы объявили о объединении стран, участвующих в союзе, в единое государство с центром в Варшаве. Новое государство получило название Центральная Европа и стало могущественным объединением, совмещающим военную, экономическую и политическую мощь сразу нескольких стран. Конечно, еще предстоит решить много бюрократических проблем, но, тем не менее, такие новости свидетельствуют о сдвиге баланса сил в Европе и о рождении новой потенциальной сверхдержавы."
visegrad_group.16.a: "Внезапно"

visegrad_group.17.t: "Добро пожаловать в Вышеградскую Группу!"
visegrad_group.17.d: "Если вы это видете, значит ваша страна - член Вышеградской Группы (Она же Вышеградская Четверка или V4). Вышеградская Группа была создана в 1991 году в Венгерском городе Вышеград лидерами Трех стран - Польши, Чехословакии и Венгрии. После распада Чехословакии обе страны стали членами V4.\n\nГруппа ставила перед собой цели экономического сближения стран стремящихся в Европейское общество. Со временем Группа расширила интеграцию за рамки экономического партнерства, став так же культурным, торговым и военным альянсом в Центральной Европе."
visegrad_group.17.a: "Расскажите мне о механике Группы"
visegrad_group.17.b: "Очень интересно, дайте поиграть"
visegrad_group.18.t: "Основная панель Вышеградской Группы"
visegrad_group.18.d: "Итак, рассмотрим основную панель Вышеградской Группы, которая находится у вас в решениях. Там вы увидете следующие показатели: Уровень сплоченности - показатель того, насколько сплочен альянс, при низком показателе страны под управлением ИИ могут принять решение о выходе из Группы. Влияние в Вышеградской Группе - это не гонка за влияние, это показатель того, что та или иная страна занимается развитием группы, активно инвестирует и выполняет фокусы в ветке Вышеградской Группы\n\nНиже вы увидете кликабельные кнопки: Вы можете нажать на любую страну-члена Группы, что бы открыть решения с взаимодействиями с этой страной (да, с собой вы тоже можете взаимодействовать). Справа от стран находятся три кнопки для инвестиций в Вышеградский Фонд, каждая инвестиция отнимает деньги из вашей казны и вносит ее в бюджет Вышеградского Фонда добавляя вам 1% влияния в Группе, инвестиции пассивно дают доход в виде диведентов (Текущий бюджет и сумма дивидентов указена на панели). Кроме того бюджет фонда можно тратить на инвестиции в различные сектора (такая возможность открывается по фокусам)\n\nНиже расположены информативные показатели, такие как: общий объем ВВП всех стран-участниц вместе взятых, а так же страна с самым высшим вкладом в ВВП."
visegrad_group.18.a: "Понятно, а что там дальше?"
visegrad_group.19.t: "Решения Вышеградской Группы"
visegrad_group.19.d: "Ниже основной панели располагается стандартная панель решений. Что бы открыть панель с конкретными решениями, можете использовать основную панель: нажимая на страны, как уже было сказано ранее вы открываете решения связанные конкретно с той страной, на которую вы нажали. Над решениями расположены три кнопки: Основные решения, Экономические и Военные, которые определяют общую категорию решений.\n\nНапример: вы нажали на Венгрию, затем выбрали одну из двух категорий (экономическая, либо военная), для примера возьмем экономическую. Таким образом у вас открываются решения с экономическими взаимодействиями с Венгрией, в частности инвестиции в ее экономику за счет Вышеградского Фонда. При инвестировании в других членов увеличивается сплоченность, при инвестировании в собственную экономику сплоченность снижается.\n\nОтдельная категория - основные решения. Эта кнопка сбрасывает выбранную вами страну и позваляет прожимать основные решения различных категорий. К примеру нажав на Основные решения и выбрав Экономическую категорию у вас откроются общие решения для всего альянса, например запрос об инвестициях у других стран вне альянса. А при нажатии на военную категорию вы сможете к примеру модернизировать свою армию вариантами Польской техники, провести совместные учения с другими странами и так далее.\n\nБольшинство решений открыаются по фокусам в Ветке Вышеградской Группы"
visegrad_group.19.a: "Интересно. А что же там с объединением?"
visegrad_group.20.t: "Процесс объединения Вышеградской Группы"
visegrad_group.20.d: "Самая простая в понимании механика в Вышеградской Группе - объединение. Для этого вам придется пройти всю ветку фокусов Вышеградской Группы, больше половины которой могут пройти за вас и другие члены Группы, ветка общая для всех стран-участниц.\n\nИтак, вы или другие члены Группы выполнили первую часть ветки фокусов, что дальше? Далее вам нужно стать Лидером Вышеградской Группы, выполнив фокус \"Проект Объединения\". После этого вам нужно дальше идти по ветке фокусов, проводя углубленную интеграцию со странами-участницами, итогом которой будет выбор: Федерация или Конфедерация. Поздравляю, вы объединили Вышеградскую Группу в Центрально-Европейскую Федерацию (Ну или конфедерацию)!"
visegrad_group.20.a: "Спасибо за обучение, сегодня я стал немного умнее!"
visegrad_group.20.b: "У меня остались вопросы, можно уточнить пару моментов?"


#Focuses
VG_merger_of_departments_tt: "Будет создано §CМинистерство иностранных дел Вышеграда§! и §CV4 Безопасность§! как специальная структура"
VG_visegrad_nuclear_company_tt: "Будет создана компания §0Атомная четверка§!"
VG_visegrad_patent_institute_available_tt: "§4Бюджет Вышеградского фонда§! > $§Y15.00§! миллиардов"
VG_visegrad_patent_institute_tt: "Будет создан §CВышеградский патентный институт§! как специальная структура"
visegrad_leader: "Лидер Вышеградской группы"
FOCUS_FILTER_VISEGRAD: "Вышеградская группа"
visegrad_group_shared_focus: "Вышеградская группа"
visegrad_group_shared_focus_desc: "Вышеградская группа — это не просто политический форум, это культурное и историческое братство. Укрепляя нашу общую идентичность и координируя нашу политику, мы можем гарантировать, что голос Центральной Европы будет услышан на мировой арене. Наше единство — наша сила."
VG_visegrad_group_fund: "Вышеградский фонд"
VG_visegrad_group_fund_desc: "Вышеградский фонд — это совместный инвестиционный фонд Вышеградской группы. Он используется для инвестирования в совместные проекты и получения дивидендов. Фонд управляется Вышеградской группой и предназначен для инвестирования в совместные проекты и получения дивидендов."
VG_foreign_funding: "Иностранное финансирование"
VG_foreign_funding_desc: "Наша отечественная индустрия и инфраструктура — основа будущего роста. Активно привлекая зарубежные инвестиции, мы сможем внести столь необходимый капитал и опыт для модернизации нашей экономики и ускорения нашего развития."
VG_american_investments: "Американские инвестиции"
VG_american_investments_desc: "Соединенные Штаты — огромный источник капитала и технологических инноваций. Давайте создадим все условия для прихода американских инвесторов, особенно в области обороны, энергетики и высоких технологий, укрепляя трансатлантические связи."
VG_visegrad_patent_institute: "Вышеградский патентный институт"
VG_visegrad_patent_institute_desc: "Вышеградский патентный институт — совместный патентный орган Вышеградской группы. Он предназначен для создания и управления патентами на совместные проекты. Институт управляется Вышеградской группой и осуществляет управление патентами на объединённые проекты."
VG_hyundai: "Автомобильная компания Hyundai"
VG_hyundai_desc: "Hyundai — мировой лидер в автомобильной отрасли. Она участвует в создании и управлении патентами на совместные проекты. Институт управляется Вышеградской группой и осуществляет управление патентами на объединённые проекты."
VG_ford: "Автомобильная компания Ford"
VG_ford_desc: "Ford — мировой лидер в автомобильной отрасли. Она участвует в создании и управлении патентами на совместные проекты. Институт управляется Вышеградской группой и осуществляет управление патентами на объединённые проекты."
VG_european_investments: "Европейские инвестиции"
VG_european_investments_desc: "Наши соседи в Западной Европе обладают глубокими карманами и заинтересованы в стабильности Центральной Европы. Мы должны привлекать их инвесторов для финансирования ключевых проектов, чтобы обеспечить взаимосвязанность и процветание наших экономик."
VG_korean_investments: "Южнокорейские инвестиции"
VG_korean_investments_desc: "Южная Корея — мировой лидер в электронике, тяжелой промышленности и судостроении. Давайте предложим льготные условия для привлечения их чеболей, получив не только инвестиции, но и передачу передовых технологических знаний."
VG_domestic_investment: "Внутренние инвестиции"
VG_domestic_investment_desc: "Хотя иностранный капитал полезен, истинная экономическая самостоятельность достигается за счет сильного внутреннего сектора. Мы должны предоставлять гранты, налоговые льготы и поддержку собственным предпринимателям и промышленности для обеспечения устойчивого роста."
VG_energy_expansion: "Расширение энергетики"
VG_energy_expansion_desc: "Мощь нации измеряется в мегаваттах. Чтобы обеспечить работу наших предприятий и теплоснабжение населения, мы должны реализовать масштабную программу расширения энергетической инфраструктуры, вкладывая средства как в традиционные, так и в возобновляемые источники энергии."
VG_industry_expansion: "Расширение промышленности"
VG_industry_expansion_desc: "Производственный сектор — сердце современной экономики. Мы должны субсидировать строительство новых производственных мощностей и модернизацию устаревших, превращая Вышеградский регион в центр выпуска высокотехнологичной продукции."
VG_development_nuclear_energy: "Развитие ядерной энергетики"
VG_development_nuclear_energy_desc: "Для настоящей энергетической независимости и получения чистой, стабильной энергии нужно сделать ставку на атом. Совместная вышеградская ядерная программа обеспечит энергетическую безопасность на поколение вперёд."
VG_construction_nuclear_complexes: "Строительство ядерных комплексов"
VG_construction_nuclear_complexes_desc: "Один лишь план — недостаточен. Сейчас самое время начать строительство нового поколения АЭС. Это создаст тысячи рабочих мест и даст огромный толчок нашей науке и промышленности."
VG_visegrad_nuclear_company: "Вышеградская ядерная компания"
VG_visegrad_nuclear_company_desc: "Для эффективной реализации атомных программ мы объединим национальные агентства в единую, мощную структуру — Вышеградскую ядерную компанию. Это объединит наши ресурсы, знания и регуляторные возможности."
VG_automobile_factories: "Автомобильные заводы"
VG_automobile_factories_desc: "Автомобильная промышленность — основа современной индустрии. Предоставляя стимулирующие меры, мы сможем привлечь крупнейших мировых автопроизводителей и превратить Вышеградский регион в Детройт Европы."
VG_eastern_investments: "Восточные инвестиции"
VG_eastern_investments_desc: "Новые рынки и партнеры появляются на Востоке. Мы не должны ограничиваться только западным капиталом: обратимся и к другим, набирающим силу экономическим державам, чтобы расширить источники иностранного влияния и капитала."
VG_visegrad_battle_group: "Вышеградская боевая группа"
VG_visegrad_battle_group_desc: "В рамках укрепления обороны Европы мы создадим выделенную Вышеградскую боевую группу в рамках Общеевропейской политики безопасности и обороны. Это станет полигоном для испытания наших совместных действий."
VG_defense_treaty: "Оборонный договор"
VG_defense_treaty_desc: "Официальный, обязательный договор о взаимной защите станет основой нашей коллективной безопасности. Нападение на одного из нас будет считаться нападением на всех — это чётко укажет нашим противникам на серьёзность наших намерений."
VG_border_defense_plan: "План защиты границ"
VG_border_defense_plan_desc: "Внешние границы — наша общая ответственность. Мы разработаем единую стратегию пограничной охраны, интегрируя системы наблюдения и создавая силы быстрого реагирования для защиты вышеградских рубежей."
VG_modernization_polish_standards: "Модернизация по польским стандартам"
VG_modernization_polish_standards_desc: "Для реальной совместимости наши вооружённые силы должны использовать стандартное снаряжение. Унификация техники и подготовки на базе польских образцов позволит создать сплочённую и сильную армию."
VG_joint_exercises: "Проведение совместных учений"
VG_joint_exercises_desc: "Без практического опыта любые договоры бесполезны. Крупные регулярные военные учения всех родов войск необходимы для укрепления доверия, совершенствования командных структур и реального взаимодействия на поле боя."
VG_v4croatia: "V4 + Хорватия"
VG_v4croatia_desc: "Наша работа не ограничивается ядром союза. Пригласим Хорватию к участию в наших проектах, расширяя сферу влияния и приобретая ценного партнёра."
VG_v4ukraine: "V4 + Украина"
VG_v4ukraine_desc: "Стабильная и безопасная Украина крайне важна для нас. Формат V4+Украина позволит предложить поддержку и сотрудничество, обеспечивая надёжное прикрытие нашего восточного направления."
VG_v4baltic: "V4 + Балтия"
VG_v4baltic_desc: "Безопасность Балтики неотделима от нашей. Формальное партнёрство V4+Балтия создаст мощный блок на восточном фланге НАТО для координации закупок вооружений и единой стратегии."
VG_purchasing_program: "Программа закупок"
VG_purchasing_program_desc: "В единстве — сила! Создав совместное агентство по закупкам вооружений, мы будем получать лучшие условия, оптимизируем поставки и гарантируем нашим армиям лучшее оснащение."
VG_single_unit: "Единое подразделение"
VG_single_unit_desc: "Главным испытанием для военной интеграции станет формирование постоянного объединенного подразделения — Легиона Вышеграда, ядра нашего коллективного сдерживания."
VG_reorganization_armed_forces: "Реорганизация вооружённых сил"
VG_reorganization_armed_forces_desc: "Для исполнения союзных договорённостей необходима полная интеграция командования и создание единого Высшего командования Вышеградской группы."
VG_project_of_unification: "Проект объединения"
VG_project_of_unification_desc: "Пора выходить за рамки простого сотрудничества. Начнем великое дело политического и экономического объединения, превращая четыре страны в единую силу."
VG_visegrad_union: "Вышеградский союз"
VG_visegrad_union_desc: "Пусть Вышеградский союз обрёл официальные очертания: совет для координации, единый рынок, общее видение будущего Центральной Европы."
VG_project_confederation: "Проект конфедерации"
VG_project_confederation_desc: "Мы создадим конституцию Вышеградской конфедерации: союз суверенных государств с общей политикой по критически важным направлениям, при сохранении идентичности участников."
VG_centralized_unification: "Централизованное объединение"
VG_centralized_unification_desc: "Конфедерация — лишь половинчатое решение. Чтобы Союз выстоял и был мощным, необходимо централизованное государство со сильным федеральным управлением."
VG_economic_reorganization: "Экономическая реорганизация"
VG_economic_reorganization_desc: "На пути к настоящему объединению прежде всего должна быть гармонизирована экономика: налогообложение, нормы, торговые барьеры и условия для свободного передвижения товаров, капитала и работников."
VG_single_currency: "Единая валюта"
VG_single_currency_desc: "Единый рынок требует единой валюты. Отказываясь от злотого, форинта, кроны и евро в пользу новой общей валюты — Вышеградской, — мы обеспечим прочность экономического союза и бросим вызов финансовому доминированию Запада."
VG_visegrad_passport: "Вышеградский паспорт"
VG_visegrad_passport_desc: "Введём единый вышеградский паспорт — символ общего гражданства и свободы проживания, работы и путешествий по всей территории союза."
VG_merger_of_departments: "Объединение департаментов"
VG_merger_of_departments_desc: "Для эффективной работы государства начнём с объединения национальных министерств (транспорта, энергетики, иностранных дел) в единые союзные структуры."
VG_deal_with_bureaucracy: "Преодолеть проблемы бюрократии"
VG_deal_with_bureaucracy_desc: "Объединение неизбежно приведет к росту новой бюрократии. Предупредим это заранее, создав цифровую, компактную, эффективную управленческую систему."
VG_political_reconstruction: "Политическая реконструкция"
VG_political_reconstruction_desc: "Последний шаг — создание единого политического органа: двухпалатного Вышеградского парламента для представительства как всего союза, так и отдельных участников."
VG_visegrad_confederation: "Вышеградская конфедерация"
VG_visegrad_confederation_desc: "Конфедерация Вышеграда стала реальностью. Страны сохранили суверенитет, но выступают единым фронтом и защищают границы как могучее целое."
VG_visegrad_federation: "Вышеградская федерация"
VG_visegrad_federation_desc: "Мечта свершилась — вышеградская федерация стала новым центром силы в Европе: единый народ, одно государство, единый флаг — от Балтики до Дуная."
VG_center_of_power: "Центр власти"
VG_center_of_power_desc: "Вышеградская группа переросла свои истоки. Это не просто региональный блок — это центр силы, способный влиять на процессы в Европе и быть гарантом собственных интересов."
VG_center_of_influence: "Центр влияния"
VG_center_of_influence_desc: "Наш пример культурной устойчивости, экономического роста и стратегического суверенитета служит ориентиром для всего мира. Союз Вышеграда не просто еще одна держава — это центр влияния, экспортирующий идеи и ценности."