 custom_peace_uncontrolled_take_states:0 "Неокупированная Территория"
 custom_peace_uncontrolled_take_states_desc:0 "Наши войска не оккупируют эту территорию. Требование передачи земель, за которые мы не сражались, обходится значительно дороже в плане военных очков."
 custom_peace_uncontrolled_take_states_neighbor_state:0 "Соседний к зоне соприкосновения"
 custom_peace_uncontrolled_take_states_neighbor_state_desc:0 "Эта территория не занята, но граничит с землями, находящимися под нашим контролем. Затраты военных очков частично сокращаются, поскольку она находится в пределах зоны наших оперативных действий."
 custom_peace_controlled_take_states:0 "Окупированная Territory"
 custom_peace_controlled_take_states_desc:0 "В настоящее время наши войска удерживают эту территорию, что значительно упрощает продвижение этого требования за столом переговоров."
 custom_peace_uncontrolled_puppet:0 "Неокупированная Территория"
 custom_peace_uncontrolled_puppet_desc:0 "У нас здесь нет военного контингента. Установление марионеточного правительства без наземных войск обходится значительно дороже с точки зрения военных очков."
 custom_peace_uncontrolled_liberate:0 "Неокупированная Территория"
 custom_peace_uncontrolled_liberate_desc:0 "Мы ещё не достигли этой территории. Освобождение земель, на которых мы никогда не бывали, сопряжено с большими затратами военных очков."
 custom_peace_uncontrolled_force_government:0 "Неокупированная Территория"
 custom_peace_uncontrolled_force_government_desc:0 "У нас здесь нет никаких рычагов влияния. Принудительная смена правительства без военного присутствия обходится значительно дороже с точки зрения военных очков."