l_russian:
 EON_DIVISION_STRUCTURE_TT: "§YОрганизация дивизии§!\nСтолбцы объединяют батальоны в полки. Ряды — ячейки организационной схемы, а не первая и вторая линии боя. Перестановка одинаковых батальонов сверху вниз не задаёт боевой порядок.\n\nСравнивайте организацию, атаку, оборону или прорыв, броню, бронебойность, ширину фронта, скорость и потребность в технике. Возможности соединения зависят от состава и готовности."
 EON_DIVISION_SUPPORT_TT: "§YДивизионная поддержка§!\nЭти роты помогают дивизии в целом. Им нужны люди, техника и снабжение. В Era of Nations некоторые подразделения дивизионной поддержки также увеличивают ширину фронта: смотрите текущие показатели."
 EON_REGIMENT_SUPPORT_TT: "§YПолковая поддержка§!\nНижняя ячейка относится к полку прямо над ней. В этом столбце нужны минимум три совместимых линейных батальона. Пешим полкам доступна лёгкая батарея, подвижным и бронетанковым — моторизованная.\n\nБатареям нужны орудия, средства управления и люди; моторизованной также нужны машины и топливо. Они добавляют огневую мощь без увеличения ширины фронта, но не заменяют манёвренные батальоны и не гарантируют победу."
