 CHE_kto: "Контртеррористическая операция"
 CHE_kto_desc: "На территории Чечни проводится контртеррористическая операция. Несмотря на контроль над республикой федеральными силами, многие боевики всё ещё скрываются в различных сёлах.\n\nЕсли §Yуровень радикализации§! превысит §Y90%§!, то в [CHE.GetFlag] Чечне произойдёт переворот.\n\nДля ускорения снижения §Yрадикализации§! сосредоточьтесь на §YФСБ§!. Также рекомендуется выпустить [CHE.GetFlag]§YЧечню§! как марионетку."
