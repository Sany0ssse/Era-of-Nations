 CHE_five_year_plan: "Первая пятилетка"
 CHE_five_year_plan_desc: "Свободные экономические модели западных государств - не будущее для социалистического государства. Возврат к плановой экономике, предпочтительно в форме классических советских пятилеток, даст правительству неограниченное влияние на ранее бесконтрольную экономику."
 CHE_authoritarian_control_over_economy: "Авторитарный контроль над экономикой"
 CHE_authoritarian_control_over_economy_desc: "Экономическая сфера нашего государства была брошена на произвол судьбы, но теперь мы вернём её под контроль сильного лидера."
