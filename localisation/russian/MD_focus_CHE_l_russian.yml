l_russian:
 # Header
 chechnya_focus: "Дерево фокусов Чечни"

 #Focuses
 CHE_we_are_at_war: "Мы на войне!"
 CHE_we_are_at_war_desc: "Нам предстоит война за существование нашего государства, нам нужно бросить все силы на его спасение."
 CHE_gain_support_from_saudis: "Помощь от саудовцев"
 CHE_gain_support_from_saudis_desc: "Мы надеемся, что саудовская монархия поддержит нас."
 CHE_gain_support_from_qatar: "Помощь из Катара"
 CHE_gain_support_from_qatar_desc: "Катарские шейхи, несомненно, захотят помочь нам в нашей борьбе за свободу!"
 CHE_smuggle_guns_from_aze: "Азербайджанская помощь"
 CHE_smuggle_guns_from_aze_desc: "В Азербайджане есть политические силы, готовые помочь нам."
 CHE_gain_support_from_taliban: "Запросить помощь у Талибана"
 CHE_gain_support_from_taliban_desc: "Талибан, несомненно, не откажет нам в борьбе против российских оккупационных сил."
 CHE_smuggle_guns_from_geo: "Грузинская помощь"
 CHE_smuggle_guns_from_geo_desc: "В Грузии есть политические силы, готовые помочь нам в борьбе против России."
 CHE_invite_grey_wolves: "Пригласить «Серых волков»"
 CHE_invite_grey_wolves_desc: "Нам приходится полагаться на помощь из любого источника."
 CHE_last_defense: "Последний рубеж"
 CHE_last_defense_desc: "У нас нет надежды на победу, но мы будем бороться до конца, сплотившись и отвергнув прошлые разногласия."
 CHE_propose_peace_to_rus: "Мирный договор"
 CHE_propose_peace_to_rus_desc: "Эта война утомила обе стороны, возможно, пришло время заключить мир."
 CHE_call_for_volunteers: "Волонтёры со всего мира"
 CHE_call_for_volunteers_desc: "Множество волонтёров из разных стран стекаются к нам, чтобы помочь в нашей борьбе за свободу!"
 CHE_destabilize_dagestan: "Дестабилизация [DAG.GetName]"
 CHE_destabilize_dagestan_desc: "Мы намерены дестабилизировать политическую ситуацию в этой республике, и пришло время расширить наше влияние."
 CHE_destabilize_ingushi: "Дестабилизация [ING.GetName]"
 CHE_destabilize_ingushi_desc: "Мы намерены дестабилизировать политическую ситуацию в этой республике, и пришло время расширить наше влияние."
 CHE_destabilize_kcc_and_kbk: "Дестабилизация [KCC.GetName] и [KBK.GetName]"
 CHE_destabilize_kcc_and_kbk_desc: "Мы намерены дестабилизировать политическую ситуацию в этой республике, и пришло время расширить наше влияние."
 CHE_nonstable_delete: "Стабилизация правительства"
 CHE_nonstable_delete_desc: "Мы устранили всех политических противников с помощью военных операций в нашей республике, и пришло время восстановить полный контроль."
 CHE_start_new: "Дальнейшее развитие"
 CHE_start_new_desc: "Наша страна выжила, и мы готовы двигаться вперёд."

 #Events
 chechnya.0.t: "Чеченский политический кризис"
 chechnya.0.d: "Чечня в очередной раз заявила, что продолжит свою прежнюю политику, что несомненно подорвало доверие к нашему правительству и вызвало политический кризис."
 chechnya.0.a: "Проклятье"
 chechnya.17.t: "Война продолжается"
 chechnya.17.d: "Россия отвергла мирное соглашение, и похоже, теперь это война до победного конца."
 chechnya.17.a: "Вперёд, за Ичкерию!"
 chechnya.34.t: "[CHE.GetName] просит о помощи"
 chechnya.34.d: "Чеченское правительство просит у нас помощи в их борьбе за независимость против России. Мы должны понимать риски, если решим поддержать их."
 chechnya.34.a: "Мы поможем им."
 chechnya.34.b: "Это того не стоит"
 chechnya.35.t: "[FROM.GetName] отправили нам помощь"
 chechnya.35.d: "В их стране есть люди, которые симпатизируют нам, и их правительство разрешило им прийти к нам на помощь, чтобы помочь нам обрести независимость."
 chechnya.35.a: "Отлично"
 chechnya.36.t: "[CHE.GetName] просит о помощи"
 chechnya.36.d: "Чеченское правительство просит у нас помощи в их борьбе за независимость против России. Мы должны понимать риски, если решим поддержать их."
 chechnya.36.a: "Мы поможем им"
 chechnya.36.b: "Мы профинансируем их"
 chechnya.36.c: "Это того не стоит"
 chechnya.37.t: "[FROM.GetName] отправили нам деньги"
 chechnya.37.d: "Их правительство решило оказать нам финансовую поддержку, которая, несомненно, поможет нам дольше бороться в нашей неравной борьбе."
 chechnya.37.a: "Отлично"
 chechnya.38.t: "[FROM.GetName] отказались помочь нам."
 chechnya.38.d: "Они трусливо отказались помочь нам, боясь России, которая на самом деле слаба!"
 chechnya.38.a: "Трусы!"

 #Ideas
 CHE_disorg_idea: "Дезорганизация в армии"
 CHE_disorg_idea1: "Дезорганизация в армии"
 CHE_nonstable_nation: "Дестабилизация в правительстве"

 CHE_establish_loyal_government: "Создать лояльное правительство"
 CHE_establish_loyal_government_desc: "Нам нужны преданные люди и коллеги в правительстве, чтобы создать стабильную и процветающую республику"
 CHE_strengthen_ties_moscow: "Укрепление связей с Москвой"
 CHE_strengthen_ties_moscow_desc: "Мы должны продолжать укреплять наши контакты с Москвой. Братское сотрудничество - ключ к нашему процветанию"
 CHE_infrastructure: "Восстановление инфраструктуры"
 CHE_infrastructure_desc: "Наша республика сильно пострадала во время войны, вся инфраструктура была разрушена. Пришло время восстановить её"
 CHE_modernize_agriculture: "Модернизация агропромышленного комплекса"
 CHE_modernize_agriculture_desc: "Наши фермеры должны работать в лучших условиях, мы сделаем всё, чтобы наша продукция была лучшей в стране!"
 CHE_loyal_people_agency: "Лояльные люди в правоохранительных органах"
 CHE_loyal_people_agency_desc: "Нам нужны лояльные люди в правоохранительных органах. Враги всё ещё не спят и надеются дестабилизировать нашу республику"
 CHE_start_investing_medicine: "Начать инвестировать в медицину"
 CHE_start_investing_medicine_desc: "Пришло время возродить медицину на нашей территории. Санатории, пансионаты и другие оздоровительные учреждения необходимы для улучшения условий жизни в нашей республике"
 CHE_revive_education: "Возродить образование в республике"
 CHE_revive_education_desc: "В Чечне много университетов, которые мы намерены со временем возродить"
 CHE_solve_religious_issue: "Решить религиозный вопрос"
 CHE_solve_religious_issue_desc: "Религия занимает особое место в сердцах жителей нашей республики, поэтому любые конфликты на этой почве должны быть немедленно устранены"
 CHE_suppress_political_opposition: "Устранить оппозицию"
 CHE_suppress_political_opposition_desc: "Нам не нужны те, кто желает зла нашему народу и республике, продавая своё мнение западным бюрократам и прочим шайтанам"
 CHE_establish_islamic_university: "Российский исламский университет имени Кунта-Хаджи"
 CHE_establish_islamic_university_desc: "Российский исламский университет имени Кунта-Хаджи - высшее и основное религиозное учебное заведение в Чечне. Расположен в центре Грозного. В университете обучается около 300 студентов. В университете преподают выпускники исламских университетов Иордании, Малайзии, ОАЭ, Саудовской Аравии, Сирии и Египта. Важной частью учебной программы является изучение наследия Кунта-Хаджи, в честь которого назван университет"
 CHE_police_regiment: "Создать полк полиции имени Кадырова"
 CHE_police_regiment_desc: "Полк полиции особого назначения имени Героя Российской Федерации А. А. Кадырова создан по личной инициативе Рамзана Кадырова"
 CHE_revive_tourism: "Инвестировать в индустрию туризма"
 CHE_revive_tourism_desc: "Красивые виды Чечни обязательно привлекут жителей нашей страны со всех её обширных краёв"
 CHE_special_motorized_regiment: "141-й специальный моторизованный полк"
 CHE_special_motorized_regiment_desc: "141-й специальный моторизованный полк имени А. А. Кадырова на базе специального моторизованного батальона «Север»"
 CHE_battalion_vostok: "Батальон «Восток»"
 CHE_battalion_vostok_desc: "Батальон специального назначения (спецназ) ГРУ в составе 291-го гвардейского мотострелкового полка 42-й гвардейской мотострелковой дивизии, сформированный в основном из чеченцев"
 CHE_cult_ramzan: "Культ Рамзана Кадырова"
 CHE_cult_ramzan_desc: "Наш президент должен быть не просто человеком, занимающим свою должность, он должен быть символом республики!"
 CHE_adam_kadyrov: "Продвижение нашего сына"
 CHE_adam_kadyrov_desc: "Наш сын, Адам, станет главой службы безопасности, и мы также вручим ему определённые награды за его заслуги"
 CHE_electro_pult: "Завод «Электропульт»"
 CHE_electro_pult_desc: "Сотрудничество с петербургским предприятием позволило нам открыть производство на территории нашей республики"
 CHE_russian_university_spetsnaz: "Основать Российский университет спецназа"
 CHE_russian_university_spetsnaz_desc: "Российский университет сил специального назначения является первым и на сегодняшний день единственным частным учебным заведением в Российской Федерации, осуществляющим профессиональную подготовку сотрудников специальных подразделений"
 CHE_grozni_city: "Грозный-Сити"
 CHE_grozni_city_desc: "Грозный-Сити - комплекс небоскрёбов в Грозном, расположенный в центре города, вдоль проспекта Ахмата Кадырова, на берегу реки Сунжа."
 CHE_chechen_neftehim: "Чеченнефтехимпром"
 CHE_chechen_neftehim_desc: "Акционерное общество «Чеченнефтехимпром» - компания, занимающаяся управлением использованием ресурсов Чеченской Республики. Помимо хозяйственной и административной работы, компания занимается поиском и привлечением инвестиций в нефтяную промышленность Чеченской Республики, совершенствованием механизмов добычи и разработки нефтяных месторождений, геологическим изучением ресурсов и разведкой новых запасов углеводородов."
 CHE_palestine: "Признание Палестины"
 CHE_palestine_desc: "Мы признаём независимость Палестины и выражаем недовольство политикой Израиля в регионе"
 CHE_saudi: "Дружба с Саудовской Аравией"
 CHE_saudi_desc: "Мы готовы наладить диалог с саудовцами, потому что это откроет для нас большое окно возможностей в мусульманском мире"
 CHE_terek: "СОБР «Терек»"
 CHE_terek_desc: "Сформирован ещё один чеченский батальон"
 CHE_sever: "Батальон «Север»"
 CHE_sever_desc: "Сформирован ещё один чеченский батальон"
 CHE_yug: "Батальон «Юг»"
 CHE_yug_desc: "Сформирован ещё один чеченский батальон"
 CHE_Grozneftegaz: "Грознефтегаз"
 CHE_Grozneftegaz_desc: "ОАО «Грознефтегаз» - нефтегазодобывающее предприятие, работающее в Северо-Кавказском федеральном округе России."
 CHE_allah_money: "Кто-то даёт деньги Чечне"
 CHE_allah_money_desc: "Отвечая на вопрос журналистов об источниках финансирования страны, Кадыров сказал: «Аллах даёт. Не знаю. Деньги откуда-то берутся»."
 CHE_chaborz: "Чаборз М-3"
 CHE_chaborz_desc: "Лёгкий высокопроходимый вооружённый тактический вездеход (багги), разработанный по заказу Российского университета спецназа в Чеченской Республике компанией Zenit-Defense. Чаборз М-3 предназначен для использования в горной или степной местности, а также в пустынях."
 CHE_ahmat_sever: "Батальон «Ахмат-Север»"
 CHE_ahmat_sever_desc: "Мы срочно начинаем создавать новые батальоны для войны с таким сильным врагом. Наши храбрые бойцы готовы сражаться до последнего!"
 CHE_ahmat_other: "Прочие батальоны"
 CHE_ahmat_other_desc: "Батальоны «Ахмат» спешно формируются дальше. Чем нас больше, тем ближе победа!"
 CHE_ahmat_other3: "Продолжение создания батальонов"
 CHE_ahmat_other3_desc: "Мы готовы снова создавать новые батальоны, несмотря на их неоднозначные названия. Нам всё равно, мы продолжим свою работу"
 CHE_end_fight_terrorists: "Ахмат - сила"
 CHE_end_fight_terrorists_desc: "Ахмат сила"
 CHE_oil_polk: "Нефтяной полк"
 CHE_oil_polk_desc: "Специальное подразделение чеченской Росгвардии, созданное для борьбы с незаконным нефтяным бизнесом и защиты нефтяной инфраструктуры. Может быть переформатировано в боевое подразделение и отправлено на фронт"
 CHE_ahmat_other2: "Ахмат-Россия и Ахмат-Чечня"
 CHE_ahmat_other2_desc: ""
 CHE_min_selhoz: "Министерство сельского хозяйства"
 CHE_min_selhoz_desc: ""
 CHE_farm_support: "Поддержка фермеров"
 CHE_farm_support_desc: ""
 CHE_airport: "Восстановить аэропорт Грозного"
 CHE_airport_desc: ""
 CHE_revive_chgu: "Восстановить Чеченский государственный университет"
 CHE_revive_chgu_desc: ""
 CHE_geo_training: "Подготовка в высокогорье"
 CHE_geo_training_desc: ""
 CHE_doctrine_land: "Доктрина ведения боя на местности"
 CHE_doctrine_land_desc: ""
 CHE_warfrare: "Применить опыт современных войн"
 CHE_warfrare_desc: ""
 CHE_arms_rebuild: "Возродить военную промышленность"
 CHE_arms_rebuild_desc: ""
 CHE_new_gover: "Сформировать новое правительство"
 CHE_new_gover_desc: "Нашей стране пора сформировать новое правительство"
 CHE_gover: "Новая Ичкерия"
 CHE_gover_desc: ""
 CHE_return_vs: "Возродить Вооружённые силы Чечни"
 CHE_return_vs_desc: "Нашей стране нужны защитники, ей нужна своя армия"
 CHE_return_nac_gvard: "Возродить Национальную гвардию"
 CHE_return_nac_gvard_desc: "Мы снова возродим Национальную гвардию"
 CHE_return_ichkerian: "Вернуть всех ичкерийцев на родину"
 CHE_return_ichkerian_desc: "Мы готовы встретить наших братьев, которые боролись за нашу независимость за рубежом"
 CHE_snb_return: "Национальная служба безопасности"
 CHE_snb_return_desc: "Нам нужны сильные спецслужбы, чтобы защитить нашу государственность"
 CHE_repair_ingush_ties: "Подорвать ситуацию в Ингушетии"
 CHE_repair_ingush_ties_desc: "Мы должны укрепить наши позиции в регионе, поэтому будем активно «разжигать» регион."
 CHE_repair_dage_ties: "Подорвать ситуацию в Дагестане"
 CHE_repair_dage_ties_desc: "Мы должны укрепить наши позиции в регионе, поэтому будем активно «разжигать» регион."
 CHE_ismalic_polk: "Исламский полк специального назначения"
 CHE_ismalic_polk_desc: "Ещё одно подразделение, которое мы восстановим"
 CHE_mvd_reborn: "Министерство внутренних дел Ичкерии"
 CHE_mvd_reborn_desc: ""
 CHE_protect_borders: "Обустроить границу"
 CHE_protect_borders_desc: "Наши границы должны быть защищены от будущей агрессии"
 CHE_shariat_guard: "Милитаризация молодёжи"
 CHE_shariat_guard_desc: ""
 CHE_maskhadovs_primacy: "Наследие Масхадова"
 CHE_maskhadovs_primacy_desc: "Президентство Масхадова оставило след в истории Чечни 90-х годов, и нам приходится с этим жить"
 CHE_zalizat_rani: "Восстановить утраченное"
 CHE_zalizat_rani_desc: "Наша страна понесла огромные экономические потери, и мы должны хотя бы частично их компенсировать"
 CHE_honor_dudaev: "Чтить наследие Дудаева"
 CHE_honor_dudaev_desc: "Мы будем относиться к наследию создателя Республики Ичкерия с особым трепетом"
 CHE_detach_islamists: "Отказаться от исламистов"
 CHE_detach_islamists_desc: "Мы не будем сотрудничать с радикальными исламистами"
 CHE_compromise_with_islamists: "Компромисс с исламистами"
 CHE_compromise_with_islamists_desc: "Возможно, наш союз принесёт больше пользы, чем вреда"
 CHE_empower_coalition_government: "Коалиционное правительство"
 CHE_empower_coalition_government_desc: "Мы готовы принять их в свои ряды"
 CHE_appoint_khattab: "Возвысить Хаттаба"
 CHE_appoint_khattab_desc: "Мы готовы продвинуть одного из наших коллег"
 CHE_detach_but_recruit_maskhadov: "Масхадов должен уйти"
 CHE_detach_but_recruit_maskhadov_desc: "Масхадов показал себя ужасным и слабым политиком, ему пора уйти"
 CHE_basaev_on_top: "Басаев приходит к власти"
 CHE_basaev_on_top_desc: "В Ичкерию пришло новое правительство, пришло время нашей стране снова стать сильной"
 CHE_install_sharia_laws: "Законы шариата"
 CHE_install_sharia_laws_desc: "Только законы шариата приведут нашу страну к процветанию"
 CHE_assemble_the_boeviks: "Организовать солдат"
 CHE_assemble_the_boeviks_desc: "Наша армия должна быть организованной и не выглядеть как шайка бандитов"
 CHE_salafist_propaganda: "Салафистская пропаганда"
 CHE_salafist_propaganda_desc: "Мы будем ещё усерднее продвигать нашу идеологию"
 CHE_biggest_raid_to_georgia: "Крупнейший рейд в Грузию"
 CHE_biggest_raid_to_georgia_desc: "Пришло время разобраться с грузинами"
 CHE_support_taliban: "Дружба с Талибаном"
 CHE_support_taliban_desc: "Мы возродим наше прежнее партнёрство"
 CHE_al_qaeda_connections: "Связи с «Аль-Каидой» в прошлом"
 CHE_al_qaeda_connections_desc: "Нам нужны сильные союзники, и «Аль-Каида» - один из них"
 CHE_meet_with_bin_laden: "Встреча с бен Ладеном"
 CHE_meet_with_bin_laden_desc: "Мы готовы провести встречу с такой значимой фигурой в мусульманском мире"
 CHE_start_raids_into_russia: "Рейды в глубь России"
