l_russian:
 eon_energy_delivery_category: "Поставки электроэнергии"
 eon_energy_delivery_category_desc: "Договоры сохраняют согласованный объём. Доступная генерация и импорт определяют текущие поставки; при дефиците экспорт сокращается пропорционально. Поставленная энергия оплачивается отдельно через счета за электроэнергию."
 eon_energy_delivery_status: "Проверить поставки электроэнергии"
 eon_energy_delivery_status_desc: "Сравнить договорные и поставленные ГВт, прогноз расходов за неделю и приостановленные поставки."
 eon_energy_delivery.ack: "Понятно"
 eon_energy_delivery.1.t: "Отчёт о поставках электроэнергии"
 eon_energy_delivery.1.d: "Договорный импорт: [?eon_energy_delivery_contract_imports|3] ГВт\nПоставленный импорт: [?eon_energy_delivery_imports|3] ГВт\nДоговорный экспорт: [?eon_energy_delivery_contract_exports|3] ГВт\nПоставленный экспорт: [?eon_energy_delivery_exports|3] ГВт\n\nПрогноз дохода от экспорта за неделю: $[?energy_selling_income|3] млрд\nПрогноз расходов на импорт за неделю: $[?energy_buying_expenses|3] млрд\n\nПрогноз предполагает, что текущий объём поставок сохранится семь суток. Фактическая плата накапливается за поставленную энергию по часовым интервалам и оплачивается отдельно через счета за электроэнергию. Прогноз повторно не списывается через обычный недельный бюджет. Бесплатные поставки не создают плату за электроэнергию. Временное сокращение сохраняет договор и допускает восстановление. В разделе «Счета за электроэнергию» доступны поставленная энергия, платежи и задолженность."
 eon_energy_delivery.1.incomplete: "Расчёт сети достиг предела в 64 раунда до снижения изменения по каждому договору до 0,001 ГВт. Текущие поставки консервативны и одинаковы у обеих сторон, но численная сходимость не завершена.\n\nДоговорный/поставленный импорт: [?eon_energy_delivery_contract_imports|3] / [?eon_energy_delivery_imports|3] ГВт\nДоговорный/поставленный экспорт: [?eon_energy_delivery_contract_exports|3] / [?eon_energy_delivery_exports|3] ГВт\nНедельные расходы/доход: $[?energy_buying_expenses|3] / $[?energy_selling_income|3] млрд."
 eon_energy_delivery.1.invalid: "Хотя бы один договор сейчас не может исполняться: отсутствует партнёр, взаимное совпадение условий, рамочное соглашение или мирное взаимодействие. Приостановлена только соответствующая поставка; условия сохранены для пересмотра.\n\nДоговорный/поставленный импорт: [?eon_energy_delivery_contract_imports|3] / [?eon_energy_delivery_imports|3] ГВт\nДоговорный/поставленный экспорт: [?eon_energy_delivery_contract_exports|3] / [?eon_energy_delivery_exports|3] ГВт\nНедельные расходы/доход: $[?energy_buying_expenses|3] / $[?energy_selling_income|3] млрд."
 eon_energy_delivery.2.t: "Поставки электроэнергии сокращены"
 eon_energy_delivery.2.d: "Текущая генерация, внутреннее потребление или приостановленное сотрудничество не позволяют полностью выполнить договоры поставки электроэнергии. Доступный экспорт распределяется пропорционально. Оплачивается только поставленная энергия; суммы за неделю являются прогнозом. Договоры сохраняются для восстановления или переговоров. Объёмы, платежи и задолженность доступны в отчёте о поставках и разделе «Счета за электроэнергию»."
 eon_energy_delivery.3.t: "Поставки электроэнергии восстановлены"
 eon_energy_delivery.3.d: "Текущие поставки вновь соответствуют договорным объёмам в пределах численной точности. Прогноз сумм за неделю обновлён; фактически поставленная энергия по-прежнему оплачивается отдельно через счета за электроэнергию."
