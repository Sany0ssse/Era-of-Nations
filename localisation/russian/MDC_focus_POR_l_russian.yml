 #Diplomatic Ideas
 CPLP_member: "Член CPLP"
 CPLP_member_desc: "Сообщество португалоязычных стран было основано в 1996 году в Лиссабоне Анголой, Бразилией, Кабо-Верде, Гвинеей-Бисау, Мозамбиком, Португалией и Сан-Томе и Принсипи. Почти два десятилетия спустя после деколонизации Португальской империи эти семь стран объединились для углубления политической координации, развития экономического и культурного сотрудничества и продвижения португальского языка по всему миру. С более чем 240 миллионами человек на трёх континентах CPLP служит привилегированным форумом для многостороннего сотрудничества между португалоязычными странами, имея в своих уставах цели согласования позиций государств-членов на международной арене и сотрудничества во всех областях, включая образование, здравоохранение, науку и технологии, оборону, сельское хозяйство, государственное управление и юстицию."
