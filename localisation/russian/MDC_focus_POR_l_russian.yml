 #Focus Tree Loc
 #Economy
 POR_economy: "§YЭкономика Португалии§!"
 POR_economy_desc: "От вступления в ЕС в 1986 году до принятия евро в 1999 году Португалия преобразилась. Структурные фонды модернизировали инфраструктуру, традиционные отрасли модернизировались, а услуги расширились. Тем не менее, разрыв в производительности сохраняется, а глобальная конкуренция растёт. Путь вперёд требует видения."
 POR_industrial_renewal: "Программа промышленного обновления"
 POR_industrial_renewal_desc: "Португальская промышленность должна конкурировать на мировом уровне. Мы модернизируем фабрики, обновим технологии и поддержим экспортные сектора, в которых мы уже преуспеваем - бумагу, пресс-формы, керамику, пробку и автомобильные компоненты."
 POR_privatization: "Приватизация государственных компаний"
 POR_privatization_desc: "Государство отступает от экономики. Следуя тенденциям ЕС, мы продадим оставшиеся государственные доли в банковском секторе, энергетике и промышленности - привлекая иностранный капитал, повышая эффективность и сокращая государственный долг. Рыночная дисциплина заменяет политическое покровительство."
 POR_economic_renewal: "Экономическое обновление"
 POR_economic_renewal_desc: "Рост требует реформ. Гибкость рынка труда, снижение корпоративных налогов, сокращение бюрократии - рецепт известен. Вызов в реализации. Успех модернизирует Португалию и привлечёт необходимые нам инвестиции."
 POR_semapa: "Semapa"
 POR_semapa_desc: "От целлюлозы до цемента, от бумаги до упаковки - Semapa выросла в глобального игрока. Мы поддержим расширение этого португальского конгломерата - создавая рабочие места, генерируя экспорт и доказывая, что отечественный капитал может конкурировать на международном уровне."
 POR_navigator_company: "Navigator Company"
 POR_navigator_company_desc: "Мы консолидируем наш целлюлозно-бумажный сектор, создавая национального чемпиона, способного конкурировать на глобальном уровне. The Navigator Company станет ведущим европейским производителем беленой эвкалиптовой целлюлозы - её бумага достигает пяти континентов. Инновации и стратегические инвестиции ведут её к успеху."
 POR_salvador_caetano: "Salvador Caetano"
 POR_salvador_caetano_desc: "Salvador Caetano, основанная в 1946 году, движет португальским автомобильным производством. От автобусов до сборки Toyota, она приносит инвестиции и технологии. Мы поддержим её расширение на новые рынки и в электромобили, обеспечивая цепочки поставок и квалифицированные рабочие места."
 POR_volkswagen_autoeuropa: "Volkswagen Autoeuropa"
 POR_volkswagen_autoeuropa_desc: "Основанный в 1995 году как совместное предприятие, Autoeuropa стал полностью принадлежащим Volkswagen в 1999 году. К 2000 году это уже были крупнейшие иностранные промышленные инвестиции Португалии, экспортирующие 98% продукции и обеспечивающие 11% национального экспорта. Мы обеспечим продолжение немецких инвестиций, чтобы сохранить конкурентоспособность этого промышленного гиганта."
 POR_search_investors: "Поиск инвесторов"
 POR_search_investors_desc: "Капитал течёт туда, где ему рады. Мы будем активно продвигать Португалию для иностранных инвесторов - стабильная демократия, член ЕС, квалифицированная рабочая сила, стратегическое атлантическое расположение."
 POR_tourism_industry: "Индустрия туризма"
 POR_tourism_industry_desc: "Солнце, море, история, гастрономия - Португалия предлагает лучшее в мире. Туризм рос на протяжении 1990-х; теперь мы сделаем его настоящим экономическим столпом. Инфраструктура, продвижение и качественные услуги привлекут миллионы, создавая рабочие места по всей стране и демонстрируя нашу страну."
 POR_cultural_heritage_promotion: "Продвижение культурного и исторического наследия"
 POR_cultural_heritage_promotion_desc: "От римских руин до мавританских замков, от готических монастырей до площадей Помбалино - наше наследие уникально. Мы восстановим, продвинем и монетизируем его для культурной и экономической выгоды, извлекая уроки из успешных проектов городской регенерации по всей Европе."
 POR_talent_retention_program: "Программа удержания талантов"
 POR_talent_retention_program_desc: "Португалия даёт образование ярким молодым людям, а затем теряет их из-за более высокой заработной платы за границей. Мы создадим условия - качественные рабочие места, финансирование исследований, карьерные пути и модернизированные государственные услуги - которые убедят их остаться и строить своё будущее здесь. Наш величайший ресурс - наши люди."
 POR_digital_nomad_influx: "Нашествие цифровых кочевников"
 POR_digital_nomad_influx_desc: "Удалённая работа - это будущее. Климат Португалии, стоимость жизни и качество жизни привлекают независимых профессионалов. Мы построим цифровую инфраструктуру - быстрый интернет, коворкинги и упрощённые визы - чтобы приветствовать их и стимулировать местную экономику."
 POR_golden_visa: "Золотая виза Португалии"
 POR_golden_visa_desc: "Инвестиции дают право на проживание. Мы будем привлекать иностранный капитал - недвижимость, создание рабочих мест, финансирование исследований - в обмен на португальские паспорта. Честный обмен, выгодный обеим сторонам, приносящий богатство, разнообразие и глобальные связи на наши берега."
 POR_alto_douro_wine_region: "Винодельческий регион Алту-Дору"
 POR_alto_douro_wine_region_desc: "Долина Дору, старейший в мире демаркированный винодельческий регион, производит портвейн и столовые вина, признанные во всём мире. Признание ЮНЕСКО подтвердило то, что мы всегда знали - этот ландшафт является сокровищем. Мы будем неустанно продвигать его, увеличивая экспорт и сельский туризм."
 POR_ana: "ANA"
 POR_ana_desc: "Aeroportos de Portugal - управляет нашими воротами в мир. Аэропорты Лиссабона, Порту, Фару и региональные аэропорты будут модернизированы, расширены и подготовлены к растущему пассажиропотоку. Современные, эффективные аэропорты необходимы для туризма и бизнеса."
 POR_tourism_boom: "Туристический бум"
 POR_tourism_boom_desc: "Наши усилия окупились - мир открыл для себя Португалию. Туристы теперь приезжают круглый год - от холмов Лиссабона до набережной Порту, от золотых скал Алгарве до пышных садов Мадейры, от римских руин Эворы до средневековых улиц Коимбры. Поток никогда не прекращается - наполняя отели, рестораны и принося жизнь в каждый уголок нашей нации."
 POR_caixa: "Банк CGD"
 POR_caixa_desc: "Caixa Geral de Depósitos, основанная в 1876 году, является нашим крупнейшим государственным банком. Он финансирует домохозяйства, поддерживает компании и остаётся столпом национальной финансовой системы. Стабильность, надёжность, государственная служба - в этом его достоинства. Мы укрепим его роль."
 POR_bkp: "Banco Comercial Português"
 POR_bkp_desc: "Banco Comercial Português, основанный в 1985 году, произвёл революцию в португальском банковском деле. Благодаря слияниям и инновациям он стал нашим крупнейшим частным банком - современным, эффективным, ориентированным на клиента. Частный банкинг на службе общественного блага. Мы поддержим его дальнейший рост."
 POR_establish_bpf: "Учредить BPF"
 POR_establish_bpf_desc: "Banco Português de Fomento - новый банк развития для финансирования инноваций, поддержки МСП и направления средств ЕС в продуктивные инвестиции. Публичный капитал катализирует частный рост, заполняя пробелы, которых боятся коммерческие банки. Катализатор модернизации."
 POR_bpf_bgp_partnership: "Стратегическое партнёрство BPF-BGK"
 POR_bpf_bgp_partnership_desc: "Мы объединимся с польским BGK, одним из крупнейших банков развития Европы. Их опыт в инфраструктуре, инновациях и международной экспансии укрепит наш собственный BPF. Совместные инвестиции и обмен знаниями принесут пользу обеим странам."
 POR_millennium_bcp: "Millennium BCP"
 POR_millennium_bcp_desc: "Наш крупнейший частный банк ребрендируется как Millennium, объединяя свою идентичность для новой эры. Современный, цифровой, ориентированный на клиента - мы поддержим его эволюцию, чтобы конкурировать с лучшими в Европе, привнося инновации в португальский банкинг."
 POR_digitalisation_bank: "Цифровизация банковской системы"
 POR_digitalisation_bank_desc: "Будущее цифровое. Мы ускорим внедрение онлайн-банкинга, мобильных платежей и финтех-инноваций - сделав португальский банкинг одним из самых современных в Европе. Удобство для клиентов, эффективность для банков, безопасность для всех."
 POR_portugal_telecom: "Portugal Telecom"
 POR_portugal_telecom_desc: "PT соединила Португалию с миром. От государственной монополии до частной транснациональной корпорации, она была пионером мобильной связи, интернета и оптоволокна. Мы обеспечим, чтобы она продолжала инвестировать и внедрять инновации - формируя наше цифровое будущее."
 POR_altice_portugal: "Altice Portugal"
 POR_altice_portugal_desc: "Altice, международная телекоммуникационная группа, приобретает Portugal Telecom и переименовывает её в Altice Portugal. Новый капитал, новые амбиции - мы обеспечим, чтобы они инвестировали в сети следующего поколения, поддерживали качество обслуживания и чтили наследие нашего национального телеком-чемпиона."
 POR_southern_infrastructure_development: "Развитие инфраструктуры юга"
 POR_southern_infrastructure_development_desc: "Алентежу и Алгарве отстают по инфраструктуре. Мы построим дороги, модернизируем порты и улучшим транспортную доступность - раскрывая экономический потенциал и сокращая региональное неравенство. Развитие достигает каждого уголка."
 POR_mine_modernization: "Модернизация шахт"
 POR_mine_modernization_desc: "От медных рудников Невеш-Корву до вольфрамовых рудников Панашкейра, от железорудных рудников Монкорву до литиевых месторождений на севере - Португалия обладает неиспользованными запасами полезных ископаемых. Мы модернизируем шахты, привлечём инвестиции и будем извлекать ценность, защищая окружающую среду. Ресурсы под нашими ногами создают процветание над землёй."
 POR_almina: "Группа Almina"
 POR_almina_desc: "Almina добывает медь и цинк в Алентежу, экспортируя на мировые рынки. Мы поддержим расширение, создание рабочих мест и ответственную практику - доказывая, что промышленность и окружающая среда могут сосуществовать."
 POR_approach_boliden: "Привлечь Boliden"
 POR_approach_boliden_desc: "Шведская Boliden - лидер европейской горнодобывающей промышленности. Мы пригласим их изучить португальский потенциал - привнося опыт, инвестиции и высокие экологические стандарты. Северная ответственность встречается с иберийскими возможностями."
 POR_approach_almonty: "Привлечь Almonty Industries"
 POR_approach_almonty_desc: "Almonty добывает вольфрам в Панашкейре с 1896 года. Мы поддержим это канадско-португальское партнёрство, обеспечивая поставки стратегического металла и местные рабочие места - традиции встречаются с современными инвестициями."
 POR_barroso_lithium: "Литиевый проект Баррозу"
 POR_barroso_lithium_desc: "Регион Баррозу на севере Португалии содержит крупнейшее литиевое месторождение в Европе - достаточно для питания полумиллиона электромобилей ежегодно. Galp присоединяется в качестве стратегического партнёра, инвестируя и закрепляя за собой половину будущей добычи. Португалия возглавит зелёный переход - создавая богатство, строя батареи, питая будущее Европы."
 POR_approach_savs: "Привлечь SAVS"
 POR_approach_savs_desc: "Savannah Resources, британско-австралийская горнодобывающая компания, заинтересована в португальском литии. Мы договоримся о справедливом партнёрстве - рабочие места, передача технологий, доход - при обеспечении экологических стандартов. Стратегические ресурсы требуют стратегических партнёров."
 POR_algarve_digital_integration: "Цифровая интеграция Алгарве"
 POR_algarve_digital_integration_desc: "Туристический регион встречает цифровую эпоху. Мы оснастим Алгарве высокоскоростным интернетом, интеллектуальным управлением направлениями и цифровыми навыками - готовясь к завтрашним посетителям, которые ожидают связи наряду с солнцем."
 POR_a42_highway_reconstruction: "Реконструкция автомагистрали A42"
 POR_a42_highway_reconstruction_desc: "A42, соединяющая пригороды Порту, нуждается в модернизации. Мы обновим эту жизненно важную артерию - повышая безопасность, уменьшая заторы, улучшая региональную мобильность."
 POR_regional_reindustrialisation: "Региональная реиндустриализация"
 POR_regional_reindustrialisation_desc: "Промышленность покинула внутренние районы десятилетия назад, оставив безработицу и упадок. Мы вернём её - налоговые льготы для фабрик, инвестиции в инфраструктуру, обучение рабочей силы и поддержка местных предпринимателей. Не только прибрежный рост, но и рабочие места в каждом районе, возможности там, где люди действительно живут. Возвращая жизнь землям, слишком долго забытым."
 POR_bridging_regional_divide: "Преодоление регионального разрыва"
 POR_bridging_regional_divide_desc: "Побережье процветает, внутренние районы пустеют. Этот разрыв преследует Португалию поколениями. Мы покончим с ним - дороги, школы, больницы, высокоскоростной интернет в каждом районе. Равные возможности, современные услуги, реальные причины для молодых людей оставаться. Португалия - одна страна, каждый регион будет процветать."
 POR_alfa_pendular_modernization: "Модернизация Alfa Pendular"
 POR_alfa_pendular_modernization_desc: "Наш Alfa Pendular, основанный на итальянском дизайне Pendolino, поступил в эксплуатацию в 1999 году. Десять шестивагонных поездов с наклоняемой технологией соединяют Брагу с Фару на скорости до 220 км/ч. По мере их старения мы спланируем будущие обновления - современные интерьеры, Wi-Fi, розетки и улучшенное обслуживание. Современные железные дороги означают связанные регионы и страну, которая движется как единое целое."
 POR_ip: "IP"
 POR_ip_desc: "Infraestruturas de Portugal управляет нашими дорогами и железными дорогами. Мы будем инвестировать в обслуживание, ремонтировать десятилетия запустения и модернизировать ключевые коридоры. Безопасные дороги, надёжные поезда, эффективная логистика - основа экономического роста и региональной связи."
 POR_green_energy_program: "Программа зелёной энергетики"
 POR_green_energy_program_desc: "У Португалии есть солнце по всему Алентежу, ветер вдоль наших холмов и вода в наших реках. Наша революция в области возобновляемой энергии начинается сейчас - строительство солнечных ферм, ветряных парков и гидроэлектростанций. Меньше импорта, более чистый воздух и тысячи зелёных рабочих мест. Дары природы становятся нашей экономической силой."
 POR_galp_energia: "Galp Energia"
 POR_galp_energia_desc: "Galp, наш национальный энергетический чемпион, перерабатывает нефть и продаёт топливо по всей Иберии. Но мир меняется под нами. Мы поддержим переход Galp - инвестиции в возобновляемые источники энергии, развитие зелёного водорода и обеспечение места Португалии в новой энергетической экономике. От нефтяной компании до интегрированного энергетического лидера."
 POR_edpr: "EDP Renováveis"
 POR_edpr_desc: "EDP выделяет своё подразделение возобновляемой энергетики в EDP Renováveis - полностью ориентированное на ветер, солнце и чистую энергию. Используя природные преимущества Португалии и технический опыт, она будет расширяться по всей Европе и за её пределами, принося португальские энергетические инновации на мировые рынки."
 POR_serpa_solar_power_plant: "Солнечная электростанция Серпа"
 POR_serpa_solar_power_plant_desc: "Равнины Алентежу прогреваются под солнцем три тысячи часов в год. Мы привлечём американские инвестиции и технологии для строительства одной из крупнейших солнечных электростанций Европы здесь - тысячи панелей превращают солнечный свет в электричество, питая дома, сокращая импорт. Солнце Алентежу становится энергетическим будущим Португалии."
 POR_sines_energy_hub: "Энергетический хаб Синеш"
 POR_sines_energy_hub_desc: "Синеш, наш глубоководный порт, уже принимает крупнейший нефтеперерабатывающий завод Португалии с 1978 года. Теперь мы строим его будущее - строящийся терминал СПГ, инфраструктура для будущего зелёного водорода, трубопроводы, соединяющиеся с испанскими и европейскими сетями. Синеш становится нашим энергетическим шлюзом, перерабатывая то, что прибывает морем, и распределяя по всей Иберии."
 POR_pnec_2030: "PNEC 2030"
 POR_pnec_2030_desc: "Наш Национальный план по энергетике и климату ставит амбициозные цели - возобновляемые источники энергии достигнут 80% электроэнергии, выбросы будут значительно сокращены, эффективность будет повышена повсюду. Дорожная карта до 2030 года, видение до 2050 года. Мы будем инвестировать, регулировать и выполнять. Португалия возглавляет зелёный переход в Европе."
 POR_strategic_energy_independence: "Стратегическая энергетическая независимость"
 POR_strategic_energy_independence_desc: "Португалия импортирует большую часть энергии, отправляя богатство за границу. Наши ветер, солнце и вода меняют это. Мы ускорим все возобновляемые источники, построим хранилища, стабилизируем цены и обеспечим поставки."
 POR_drug_strategy: "Запуск национальной стратегии по борьбе с наркотиками"
 POR_drug_strategy_desc: "Употребление наркотиков и зависимость создают растущее бремя для общественного здоровья и социальной стабильности. Комплексная национальная стратегия по борьбе с наркотиками будет уделять приоритетное внимание профилактике, лечению и снижению вреда, стремясь уменьшить долгосрочный социальный и экономический ущерб."
 POR_decriminalize_drugs: "Декриминализация хранения наркотиков"
 POR_decriminalize_drugs_desc: "Португалия сталкивается с худшей в Европе эпидемией героина - ВИЧ растёт, тюрьмы переполнены, сообщества разрушены. Мы декриминализируем хранение для личного пользования. Пользователи будут направляться в комиссии по убеждению - врачи, социальные работники, психологи - а не в уголовные суды. Лечение заменит наказание. Зависимость будет рассматриваться как проблема здоровья, а не преступление."
 POR_establish_dissuasion_commissions: "Создание комиссий по убеждению"
 POR_establish_dissuasion_commissions_desc: "Создание междисциплинарных комиссий для направления потребителей наркотиков к медицинской и социальной помощи вместо уголовного преследования, делая упор на реабилитацию."
 POR_harm_reduction: "Внедрение мер по снижению вреда"
 POR_harm_reduction_desc: "Внедрение программ обмена игл, заместительной терапии и аутрич-программ для снижения числа передозировок и распространения болезней, передающихся через кровь."
 POR_expanding_drug_treatment: "Расширение услуг по лечению наркозависимости"
 POR_expanding_drug_treatment_desc: "Масштабирование реабилитации, заместительной терапии и последующего ухода по всей стране для снижения уровня рецидивов и улучшения социальной реинтеграции."
 POR_international_drug_coop: "Укрепление международного сотрудничества по борьбе с наркотиками"
 POR_international_drug_coop_desc: "Углубление сотрудничества с партнёрами по ЕС и международными агентствами, а также усиление портового и таможенного контроля для пресечения трансатлантической контрабанды."
 POR_sports_against_addictions: "Спорт против зависимостей"
 POR_sports_against_addictions_desc: "Мы запустим спортивные программы по всей стране - от местных клубов в каждой деревне до школьных соревнований в каждом районе, от общественных турниров в пригородах Порту до молодёжных лиг в городах Алгарве. Вовлекая молодёжь там, где они живут, поддерживая их активность и связь, уводя их от наркотиков."
 POR_drug_strategy_TT: "§GУменьшает§! последствия §Rнаркотического кризиса§!!"
 
 #Politics
 POR_politics: "Политика Португалии"
 POR_politics_desc: "Политический ландшафт Португалии в XXI веке представляет собой сложную мозаику идеологий. Слева направо, от революционного пыла до традиционалистских мечтаний - каждая фракция борется за влияние. Ориентируйтесь в этой фрагментированной арене, заключайте союзы и ведите нацию через бурные воды португальской политики."
 #Commi
 POR_communist_party: "Португальская коммунистическая партия"
 POR_communist_party_desc: "Закалённая в подпольной борьбе против Estado Novo и Революции гвоздик, Португальская коммунистическая партия является старейшим защитником дела рабочих, сражаясь за социализм через пролетарский интернационализм и классовую борьбу."
 POR_alvaro_cunhal_legacy: "Наследие Алвару Куньяла"
 POR_alvaro_cunhal_legacy_desc: "Алвару Куньял, исторический лидер партии, олицетворяет революционную непримиримость. Его преданность, закалённая 15 годами тюремного заключения и легендарным побегом, формирует идеологическое ядро партии и остаётся её компасом для построения социалистического общества."
 POR_strengthening_trade_unions: "Укрепление профсоюзов"
 POR_strengthening_trade_unions_desc: "Интеграция классовых профсоюзов, особенно Всеобщей конфедерации португальских трудящихся (CGTP-IN), в государственный аппарат делает их основным инструментом мобилизации рабочих и контроля над производством, цементируя союз партии и класса."
 POR_resistance_to_neoliberalism: "Сопротивление неолиберализму"
 POR_resistance_to_neoliberalism_desc: "Бороться с разъедающей повесткой неолиберализма - дерегуляцией, приватизацией и финансовизацией - это фундаментально. Это политическая война, которую ведёт капитал. Наш ответ - национализация, рабочий контроль и плановая экономика, ориентированная на социальные нужды, а не на частную прибыль."
 POR_industrial_leap: "Индустриальный скачок"
 POR_industrial_leap_desc: "Чтобы построить социализм, мы должны сначала создать его материальную основу. Это требует решительного скачка в тяжёлой промышленности и инфраструктуре, мобилизации национальных ресурсов под сознательным планом для преодоления зависимости и создания производительных сил для независимого социалистического общества."
 POR_planned_economy: "Плановая экономика"
 POR_planned_economy_desc: "Порвать с анархией рынка - значит взять под контроль нашу судьбу. Научно обоснованная плановая экономика - единственная система, которая может подчинить производство потребностям общества, устраняя капиталистические отходы и кризисы, чтобы направить все ресурсы на построение социализма - существенную основу пролетарского государства."
 POR_proletariat_rights: "Права пролетариата"
 POR_proletariat_rights_desc: "Права при пролетарской диктатуре являются конкретными гарантиями власти, а не буржуазными абстракциями. Мы кодифицируем их в новый порядок: право на труд, жильё, бесплатное здравоохранение, образование и управление государством - превращая рабочий класс из эксплуатируемых в коллективных хозяев своей судьбы."
 POR_anti_fa: "Антифашизм"
 POR_anti_fa_desc: "Фашизм - не историческая случайность, а насильственная кризисная форма капитализма. Наша борьба с ним неотделима от борьбы против капитализма. Как мы сопротивлялись Estado Novo, так мы боремся с его современными преемниками - новыми неофашистскими движениями. Это борьба за истинную демократию, которая может быть завоёвана только организованной силой пролетариата."
 POR_fighting_poverty: "Борьба с бедностью"
 POR_fighting_poverty_desc: "Бедность - прямой продукт капиталистической эксплуатации. Первая задача социалистического государства - искоренить её, мобилизуя плановую экономику для гарантии занятости, перераспределения богатства и обеспечения всеобщего доступа к жилью, продовольствию и услугам. Эта борьба уничтожает нищету и куёт солидарность, связывающую народ с его революционным государством."
 POR_agricultural_development: "Развитие сельского хозяйства"
 POR_agricultural_development_desc: "Против капиталистической «модернизации», создающей зависимость от ЕС и монополии агробизнеса, наша социалистическая аграрная политика продвигает продовольственный суверенитет, поддерживает кооперативы и защищает мелких фермеров. Это стратегическая битва за национальную независимость и союз между городскими рабочими и сельскими производителями."
 POR_universal_free_education: "Всеобщее бесплатное образование"
 POR_universal_free_education_desc: "Всеобщее бесплатное образование - это победа рабочего класса и идеологическое оружие. Мы освободим его от буржуазной и религиозной догмы, превратив школы в учреждения, служащие народу. Продвигая критическое мышление и научный социализм, мы куём новые поколения, которые построят и защитят социалистическое общество."
 POR_housing_programs: "Жилищные программы"
 POR_housing_programs_desc: "Жильё - это социальное право, а не товар. Против рынка трущоб и исключения мы запускаем программу общественного жилья, контроля арендной платы и экспроприации. Это преображает города, кладёт конец капиталистической изоляции и обеспечивает достойный дом для каждой рабочей семьи - победа, консолидирующая революционное государство."
 POR_secular_socialist_state: "Светское социалистическое государство"
 POR_secular_socialist_state_desc: "Реакционный союз клерикализма и капитализма является силой угнетения. Установление светского государства - это глубокий идеологический разрыв: отделение церкви от государства, конец религиозным привилегиям и утверждение научного социализма. Это наносит удар по реакции и консолидирует идеологическую гегемонию рабочего класса."
 POR_green_communism: "Зелёный коммунизм"
 POR_green_communism_desc: "Экологический кризис - это окончательное обвинение капиталистической хищнической логике, приносящей будущее планеты в жертву сиюминутной прибыли. Зелёный коммунизм провозглашает, что только плановая экономика может достичь гармонии между человеком и природой. Мы поведём революцию устойчивого развития через возобновляемую энергию и циркулярное производство, переосновывая промышленность для служения социальным нуждам и выживанию планеты."
 POR_end_european_dictatorship: "Покончить с европейской диктатурой"
 POR_end_european_dictatorship_desc: "ЕС и НАТО - это не союзы народов, а инструменты монополистического капитала и империализма, навязывающие жёсткую экономию и войны. Наше участие в этих структурах предаёт революцию. Выход - это акт национального освобождения, возвращающий наш суверенитет и право на самоопределение. Этот разрыв открывает путь к социалистической Португалии в многополярном мире."
 POR_support_international_solidarity: "Поддержка международной солидарности"
 POR_support_international_solidarity_desc: "Пролетарский интернационализм - это не лозунг, а сердце нашей борьбы. Социализм нельзя построить в одиночку. Революция в Португалии должна активно поддерживать братские партии и освободительные движения по всему миру, отвергая всякий шовинизм. Так мы разрываем изоляцию и продвигаем глобальную классовую борьбу."
 POR_castro_is_our_friend: "Кастро - наш друг"
 POR_castro_is_our_friend_desc: "В Фиделе Кастро и Кубинской революции мы видим символ социалистического достоинства. Наш союз с Гаваной - это выбор суверенитета и интернационализма. Он будет способствовать обмену в области технологий и культуры, доказывая, что другой мир возможен."
 POR_ocean_of_slavery: "Океан рабства"
 POR_ocean_of_slavery_desc: "Атлантика должна быть преобразована из колониального пути в мост революционной солидарности с Африкой и Южной Америкой. Поддержка их борьбы против неоколониализма - наш интернациональный долг, чтобы разорвать цепи зависимости и построить общий фронт за социализм."
 POR_socialist_brother: "Социалистический брат"
 POR_socialist_brother_desc: "Китай - ключевая антиимпериалистическая держава. Для социалистической Португалии вне ЕС стратегическое партнёрство с Пекином открывает дверь к промышленному сотрудничеству и передаче технологий, обеспеченное флагманской стальной сделкой - союз с могучим товарищем в глобальной борьбе."
 POR_join_brics: "Вступление в БРИКС"
 POR_join_brics_desc: "Вступление в БРИКС - это наш окончательный разрыв с империализмом и выравнивание с многополярным миром. Это коалиция за антиимпериалистическое сотрудничество и защиту суверенитета, превращающая Португалию из западной периферии в активного участника формирования более справедливого мира в соответствии с нашими социалистическими принципами."
 POR_rent_macau: "Аренда Макао"
 POR_rent_macau_desc: "Это историческое соглашение преодолевает колониальное прошлое. В акте социалистической солидарности Китай доверяет Португалии управление Макао как особой административной зоной - совместный проект, создающий жизненно важный экономический мост между нашими двумя социалистическими экономиками и новую модель антиимпериалистического сотрудничества."
 POR_shore_of_freedom: "Берег свободы"
 POR_shore_of_freedom_desc: "Мы провозглашаем Народную Республику Португалия. Чтобы защитить её, мы превратим атлантическое побережье в несокрушимый «Берег свободы» - для обороны и суверенитета. Наши порты и прибрежные ресурсы будут питать социалистическую промышленность и плановую экономику, мобилизуя наши производительные силы для окончательного построения социализма."
 POR_iberian_sr: "Иберийская СР"
 POR_iberian_sr_desc: "Мечта о единой социалистической Иберии - это кульминация нашей революции. Граница с Испанией - это искусственный реликт, разделяющий рабочих. Сливаясь с освобождённой Испанией, мы создадим Иберийскую Социалистическую Республику - федеративный союз социалистических наций, объединяющий ресурсы, гармонизирующий планирование и умножающий нашу силу как социалистическая крепость в Европе."
 POR_lisbon_to_vladivostok: "От Лиссабона до Владивостока"
 POR_lisbon_to_vladivostok_desc: "Стратегическое партнёрство с Россией - это столп нашей революционной внешней политики. Как главное государство, сопротивляющееся НАТО, она является нашим ключевым союзником. Этот альянс гарантирует энергетическую безопасность, технологический обмен и взаимную оборону - высшую защиту суверенитета и необратимости нашей социалистической республики."
 POR_attack_spain: "Покончить с Испанией"
 POR_attack_spain_desc: "Реакционное испанское государство остаётся кинжалом, направленным в сердце нашей революции - убежищем для олигархов. Рабочий класс не знает границ. Мы должны начать пролетарское наступление, чтобы освободить Испанию и воссоединить Иберию под знаменем социализма - революционную войну за освобождение всего иберийского пролетариата."
 POR_separatism_spain: "Пламя сепаратизма по всей Испании"
 POR_separatism_spain_desc: "Испанское государство угнетает такие нации, как Каталония, Страна Басков и Галисия. Наш долг - поддерживать их право на самоопределение. Помогая их освобождению, мы ослабляем контроль Мадрида, продвигая свободу для наших соседей и создавая пояс дружественных республик для защиты нашей революции."
 POR_csto_join_wow: "Вступить в ОДКБ"
 POR_csto_join_wow_desc: "ОДКБ - это оборонительный альянс против западной гегемонии. Вступление в него - это окончательный шаг в нашей военно-политической переориентации, заменяющий зонтик НАТО пактом о взаимной обороне, основанным на антиимпериалистической солидарности. Это интегрирует нас в грозную архитектуру безопасности, сдерживая агрессию и закрепляя наше место в многополярном порядке."

 #PSD
 POR_psd: "Социал-демократическая партия"
 POR_psd_desc: "Основанная Франсишку Са Карнейру, Социал-демократическая партия несёт знамя либеральной демократии и европеизма. Как сила модернизации, она выступает за экономическую динамику, индивидуальную ответственность и Португалию, уверенную в своём месте в Европе."
 POR_cds: "Centro Democrático e Social"
 POR_cds_desc: "CDS-PP, основанная в 1974 году как Демократический и социальный центр, является знаменосцем христианской демократии в Португалии. Наш традиционный партнёр по коалиции - от Aliança Democrática (1979-1983) до настоящего времени - он привносит консервативные ценности, поддержку сельских районов и стойкий атлантизм в наш альянс против социалистического правления."
 POR_back_in_action: "Португалия снова в деле"
 POR_back_in_action_desc: "Годы стагнации и дрейфа закончились. Программа структурных реформ и институционального обновления возвращает Португалию на путь роста."
 POR_sa_carneiro_legacy: "Наследие Са Карнейру"
 POR_sa_carneiro_legacy_desc: "Франсишку Са Карнейру, основатель партии и премьер-министр, олицетворяет её модернизаторский дух. Его видение - европейская интеграция, экономическая либерализация, меньшее государство - сформировало идентичность партии. Его смерть в авиакатастрофе в Камарате, за несколько дней до президентских выборов 1980 года, сделала его вечным компасом партии и основателем-мучеником."
 POR_estado_mais: "Estado Mais Pequeno"
 POR_estado_mais_desc: "Программа приватизации, дерегуляции и административного упрощения, направленная на сокращение размера и масштабов государства, передача ответственности от государственного сектора гражданскому обществу и рынку."
 POR_austerity_measures: "Меры жёсткой экономии"
 POR_austerity_measures_desc: "Пакет сокращения расходов, замораживания заработной платы в государственном секторе и сокращения социальных программ, реализованный для достижения целевых показателей дефицита ЕС и восстановления доверия рынка после многих лет финансового дисбаланса."
 POR_unify_education_and_science: "Объединение образования и науки"
 POR_unify_education_and_science_desc: "Слияние министерств образования и науки, технологий и высшего образования в единое Министерство образования и науки, создающее более последовательную политическую основу от начального школьного образования до послевузовских исследований."
 POR_made_in_portugal: "Сделано в Португалии"
 POR_made_in_portugal_desc: "Португальская промышленность, португальская изобретательность, португальская гордость. Налоговые льготы, упрощённые правила и национальная кампания по продвижению нашей продукции на мировую карту. Сделано в Португалии - сделано, чтобы конкурировать."
 POR_dialogue_with_partners: "Диалог с партнёрами"
 POR_dialogue_with_partners_desc: "Реформы, которые длятся, не навязываются, а создаются вместе. С профсоюзами, работодателями, гражданским обществом - мы будем формировать консенсус, хрупкий, но необходимый."
 POR_european_aid: "Европейская помощь"
 POR_european_aid_desc: "Мы запросим финансовую помощь у институтов ЕС и государств-членов, обеспечивая доступ к структурным фондам и экстренному кредитованию. Эта спасательная линия облегчит бремя корректировки и профинансирует критически важные инфраструктурные проекты."
 POR_ajustamento: "Перестановка кадров"
 POR_ajustamento_desc: "Мы реструктурируем государственное управление через Programa de Reestruturação da Administração Central do Estado (PRACE). Избыточные агентства будут ликвидированы, дублирующиеся функции объединены, а показатели эффективности внедрены в государственных департаментах - создавая более стройный и эффективный государственный аппарат."
 POR_implement_siadap: "Внедрение SIADAP"
 POR_implement_siadap_desc: "Интегрированная система оценки эффективности (SIADAP) внедряет оценку, основанную на заслугах, в государственном секторе. Государственные служащие оцениваются по измеримым результатам, обнажая бесхозяйственность и обуздывая коррупцию - создавая более продуктивный и честный государственный аппарат."
 POR_support_simplex: "Поддержка Simplex"
 POR_support_simplex_desc: "Поддержка программы административного упрощения Simplex: сокращение бумажной волокиты, цифровизация государственных услуг, создание универсальных центров для граждан и бизнеса. Карта гражданина, Компания за час и Нулевое лицензирование преображают отношения между государством и обществом."
 POR_simplex_plus: "Simplex+"
 POR_simplex_plus_desc: "Расширение программы Simplex реформами второго этапа: расширение цифровых услуг, внедрение электронных удостоверений личности, упрощение процедур регистрации компаний. Государство сбрасывает бумажную кожу и принимает цифровую эпоху."
 POR_cut_pensions: "Сокращение пенсий"
 POR_cut_pensions_desc: "Пенсионная система, напряжённая демографией и долгами, должна быть реформирована. Сокращение пособий для высоких доходов, увеличение стажа и фактор устойчивости, связанный с ожидаемой продолжительностью жизни - обеспечение того, чтобы пенсии были там для наших детей и внуков."
 POR_update_labour_code: "Обновление трудового кодекса"
 POR_update_labour_code_desc: "Основываясь на системе оценки SIADAP, мы обновляем трудовой кодекс, чтобы отделить прилежных от балласта. Новые оценочные метрики выявляют некомпетентность, упрощая увольнения, в то время как учебные программы повышают квалификацию тех, кто остаётся."
 POR_christian_values: "Поддержка христианских ценностей"
 POR_christian_values_desc: "Христианское наследие Португалии формирует наши законы и наше общество. Налоговые льготы для семей, поддержка религиозных школ, защита традиционных норм - меры, укрепляющие семью, краеугольный камень нации."
 POR_reduce_irc: "Снижение IRC"
 POR_reduce_irc_desc: "Корпоративный налог - налог на предпринимательство, амбиции и рост - будет значительно снижен. МСП, основа нашей экономики, получат наибольшее облегчение. Более низкие налоги привлекают инвестиции, стимулируют создание рабочих мест и сигнализируют, что Португалия открыта для бизнеса."
 POR_economic_freedom: "Экономическая свобода"
 POR_economic_freedom_desc: "Комплексная программа либерализации рынка: дерегуляция, укрепление прав собственности, устранение барьеров для конкуренции в различных секторах. Защищённые отрасли открыты, государственные монополии демонтированы, регуляторное бремя для частного бизнеса уменьшено."
 POR_new_portugal: "Новая Португалия"
 POR_new_portugal_desc: "Годы реформ приносят плоды. Государственные финансы в порядке, экономика конкурентоспособна, доверие восстановлено. Из пепла кризиса поднимается новая Португалия - стройнее, сильнее, готовая к будущему."
 POR_liberal_market: "Реформы либерализации рынка"
 POR_liberal_market_desc: "Текущие рыночные реформы открывают защищённые сектора для конкуренции, реструктуризируют государственные предприятия, снижают регуляторное бремя для частного бизнеса. Рынок с его созидательным разрушением создаёт более динамичную португальскую экономику."

 #PS Focus Tree
 POR_ps: "Социалистическая партия"
 POR_ps_desc: "Прослеживая своё происхождение до 1875 года, когда её основатели создали первую Португальскую социалистическую партию, современная партия была воссоздана в 1973 году Мариу Суарешем в изгнании после того, как оригинал был раздавлен Estado Novo. Член Социалистического интернационала, она выступает за социальную демократию и европейскую интеграцию - формируя демократический путь Португалии."
 POR_local_government_reform: "Реформа местного самоуправления"
 POR_local_government_reform_desc: "Муниципалитеты получат большую автономию и финансовую независимость. Административные структуры будут оптимизированы, сокращена бюрократия, принятие решений приблизится к гражданам."
 POR_fiscal_discipline: "Фискальная дисциплина"
 POR_fiscal_discipline_desc: "Десятилетия дефицитных расходов сделали Португалию уязвимой. Мы введём фискальную дисциплину: ограничим чрезмерные расходы, сократим государственный долг и выполним наши европейские обязательства. Необходимый курс - даже когда он испытывает наших традиционных союзников в рабочем движении."
 POR_maastricht_criteria: "Соблюдение Маастрихтских критериев"
 POR_maastricht_criteria_desc: "Сталкиваясь с невыносимым долгом и рыночным давлением, мы запросим финансовую помощь у Европейского союза и МВФ. Будет согласована программа помощи - с жёсткими условиями, но необходимая для предотвращения дефолта и сохранения Португалии на пути к более глубокой европейской интеграции."
 POR_budget_consolidation: "Бюджетная консолидация"
 POR_budget_consolidation_desc: "Фискальная дисциплина была первым шагом; теперь мы углубляем её. Расточительство будет устранено, ресурсы перенаправлены в приоритетные области, государство станет стройнее. Болезненно, неизбежно - цена долгосрочной стабильности и доверия в Европейском союзе."
 POR_eurozone_integration: "Интеграция в еврозону"
 POR_eurozone_integration_desc: "Португалия является частью еврозоны с момента её создания в 1999 году, когда эскудо было привязано к евро, а физическая валюта должна была исчезнуть в 2002 году. Теперь мы углубим наше участие, обеспечив полное соответствие правилам Пакта стабильности и максимизируя выгоды валютного союза для португальских семей и предприятий."
 POR_religious_freedom_act: "Закон о свободе вероисповедания"
 POR_religious_freedom_act_desc: "Свобода вероисповедания - краеугольный камень современной демократии. Этот закон гарантирует равное обращение ко всем религиям, уважая культурное наследие католицизма."
 POR_create_mtsss: "Создание MTSSS"
 POR_create_mtsss_desc: "Министерство труда, солидарности и социального обеспечения объединяет занятость, социальное обеспечение и солидарность под одной крышей. Единый сильный голос для рабочих и уязвимых слоёв населения - координируя политику, оптимизируя управление и гарантируя, что ни один португалец не останется позади."
 POR_healthcare_instead_prisons: "Здравоохранение вместо тюрем"
 POR_healthcare_instead_prisons_desc: "Зависимость - это кризис общественного здравоохранения, а не преступление. Мы расширим «португальскую модель» декриминализации, перенаправляя ресурсы от наказания к лечению, от тюрем к клиникам. Гуманная политика, которая уменьшает вред, восстанавливает достоинство и строит более здоровое общество."
 POR_lgbt_rights: "Права ЛГБТ"
 POR_lgbt_rights_desc: "Равные права не подлежат обсуждению. Мы расширим защиту от дискриминации, признаем однополые союзы и предоставим права на усыновление. Португалия, принимающая разнообразие, - это Португалия, верная своим демократическим ценностям."
 POR_abortion_legalization: "Легализация абортов"
 POR_abortion_legalization_desc: "Референдум 1998 года был поражением, но не концом. Мы отомстим: будет созван новый референдум, и на этот раз «да» победит. Нашим парламентским большинством мы наконец легализуем аборты по желанию в течение первых десяти недель."
 POR_national_congresses: "Национальные конгрессы"
 POR_national_congresses_desc: "Конгрессы Социалистической партии - это больше, чем собрания - это живые форумы, где сталкиваются идеи, появляются лидеры и обновляется душа партии. Через дебаты мы формируем будущее Португалии."
 POR_plan_immigrant_integration: "План интеграции иммигрантов"
 POR_plan_immigrant_integration_desc: "Иммиграция обогащает нашу нацию, когда встречает интеграцию. Мы создадим комплексный план, предлагающий языковые курсы, профессиональную подготовку и воссоединение семей, гарантируя, что новички полностью вносят вклад в португальское общество."
 POR_technological_plan: "Технологический план"
 POR_technological_plan_desc: "Технологический план - это наша дорожная карта к экономике знаний. Мы инвестируем в цифровую инфраструктуру, исследования и инновации, от высокоскоростного интернета до передовых биотехнологий - позиционируя Португалию в авангарде цифрового будущего Европы."
 POR_tax_autonomy: "Налоговая автономия"
 POR_tax_autonomy_desc: "Решения о местных налогах и расходах принадлежат тем, кого они касаются. Мы предоставим муниципалитетам большую фискальную автономию, позволяя им эффективно и ответственно решать местные потребности."
 POR_strengthen_portuguese_incomes: "Укрепление португальских доходов"
 POR_strengthen_portuguese_incomes_desc: "Растущее неравенство и стагнация заработной платы требуют действий. Мы повысим минимальную заработную плату, укрепим коллективные переговоры и предоставим адресные налоговые льготы - возвращая деньги в карманы работающих семей и стимулируя спрос."
 POR_create_dgert: "Создание DGERT"
 POR_create_dgert_desc: "Генеральный директорат по вопросам занятости и трудовых отношений будет наблюдателем рынка труда. Разрешение споров, обеспечение соблюдения стандартов и продвижение достойного труда - институт для более справедливой экономики."
 POR_invest_sns: "Инвестиции в SNS"
 POR_invest_sns_desc: "Национальная служба здравоохранения - наше величайшее достижение, но она нуждается в обновлении. Мы построим новые больницы, наймём больше персонала и инвестируем в современное оборудование - гарантируя качественное здравоохранение для всех, бесплатное в точке использования."
 POR_gender_parity_law: "Закон о гендерном паритете"
 POR_gender_parity_law_desc: "Демократию нельзя назвать завершённой, когда женщины недопредставлены. Мы введём закон о квотах, требующий, чтобы партийные списки включали не менее одной трети женщин-кандидатов - решительный шаг к истинному равенству в принятии решений."
 POR_gnr_modernization: "Модернизация GNR"
 POR_gnr_modernization_desc: "Национальная республиканская гвардия должна адаптироваться к новым вызовам. Мы модернизируем её оборудование, улучшим подготовку и укрепим общественное полицейское обслуживание - обеспечивая, чтобы общественная безопасность была эффективной и заслуживающей доверия всех сообществ."
 POR_labour_qualification: "Квалификация рабочей силы"
 POR_labour_qualification_desc: "Рабочие места завтрашнего дня требуют новых навыков. Мы запустим национальную программу обучения на протяжении всей жизни, ученичества и повышения квалификации, оснащая португальских рабочих для меняющейся экономики и защищая их от безработицы."
 POR_estado_social_forte: "Сильное социальное государство"
 POR_estado_social_forte_desc: "Сильное социальное государство - основа справедливого общества. Благодаря годам реформ мы построили всеобщее здравоохранение, качественное образование и надёжную социальную защиту. Португалия теперь предлагает своему народу безопасность от колыбели до старости."

 #CHEGA Focus Tree
 POR_chega: "Chega!"
 POR_chega_desc: "Пока либералы и социалисты ссорились из-за бюрократии, Португалия гнила. Они забыли о народе, о семьях, о рабочих. Теперь приходит сила, которая говорит прямо: никаких открытых границ, никакого потакания преступникам, никакой продажи Брюсселю. Мы покажем им, как управлять - с характером, с гордостью, с Португалией на первом месте."
 POR_tax_burden_reduction: "Снижение налогового бремени"
 POR_tax_burden_reduction_desc: "Они высосали из нас кровь бесконечными налогами. Теперь мы возвращаем то, что принадлежит вам. Подоходный налог для работающих семей резко сокращён, корпоративный налог снижен - потому что государство должно служить народу, а не наоборот. Мы сократим государство до минимума, высвобождая экономический либерализм, поддерживая порядок и традиции."
 POR_constitution_1976_revision: "Пересмотр Конституции 1976 года"
 POR_constitution_1976_revision_desc: "Реликт революции, написанный теми, кто презирает традиции. Мы перепишем её - очистим от идеологического яда, запечатаем коррупцию и вернём суверенитет нации в руки португальцев."
 POR_first_program: "Programa Portugal Primeiro"
 POR_first_program_desc: "Наша флагманская программа ставит португальских граждан на первое место: налоговые льготы для семей, поддержка малого бизнеса, более суровые приговоры для преступников и конец коррупции элит."
 POR_ministry_of_family: "Министерство семьи"
 POR_ministry_of_family_desc: "Семья находится под атакой - слева, от средств массовой информации, от культуры, которая высмеивает материнство и отцовство. Мы создадим министерство для её защиты. Больше детей, сильнее родители, нация, которая смотрит в будущее с гордостью."
 POR_law_and_order_initiative: "Инициатива «Закон и порядок»"
 POR_law_and_order_initiative_desc: "Мягкое правосудие порождает хаос. Мы дадим полиции необходимые инструменты, построим недостающие тюрьмы и обеспечим, чтобы преступники отбывали каждый день своего срока. Порядок - основа свободы."
 POR_national_investments: "Национальные инвестиции"
 POR_national_investments_desc: "Мы построили то, о чём старые партии только говорили: национальный либерализм в действии. Приватизируя нестратегические государственные активы, сокращая инвестиционные затраты и строя современные бизнес-парки, мы высвобождаем португальское предпринимательство. Государство стройнее, экономика свободнее. Так мы разрываем хватку старых партий и строим реальное процветание."
 POR_opportunity_creating_housing: "Жильё, создающее возможности"
 POR_opportunity_creating_housing_desc: "Молодые португальцы не могут позволить себе дом, потому что система настроена против них. Мы сократим бюрократию, высвободим государственные земли и построим доступное жильё - давая нашей молодёжи долю в собственной стране."
 POR_fill_prisons: "Заполнить тюрьмы"
 POR_fill_prisons_desc: "Мягкая на преступность элита опустошила наши тюрьмы, пока жертвы заполняют кладбища. Мы закроем насильников, рецидивистов, отбросов, которые охотятся на невинных - и будем держать их взаперти."
 POR_safer_portugal: "Безопасная Португалия"
 POR_safer_portugal_desc: "Каждый португалец имеет право ходить по своим улицам без страха. Мы восстановим видимое полицейское патрулирование, депортируем иностранных преступников и обеспечим отбывание наказаний - а не условно. Безопасность - первейшая обязанность государства."
 POR_protect_portugal: "Защитить Португалию, защитить португальцев"
 POR_protect_portugal_desc: "Наши границы - решето, наш суверенитет осмеян. Мы усилим пограничный контроль, оснастим нашу полицию и вооружённые силы и скажем миру: Португалия защищает своих. Те, кто приезжает сюда, должны уважать наши законы и нашу культуру."
 POR_god_country_family_work: "Бог, Родина, Семья и Труд"
 POR_god_country_family_work_desc: "Эти четыре слова - столпы нашей цивилизации. Мы восстановим их в наших школах, наших законах, нашей общественной жизни. Никаких больше извинений за то, кто мы есть. Бог, Родина, Семья и Труд - это Португалия."
 POR_ban_marxism: "Запретить марксизм"
 POR_ban_marxism_desc: "Марксизм - это рак, который заразил наши университеты, наши СМИ, нашу культуру. Мы запретим организации, проповедующие классовую войну и национальное самоуничтожение, и вычистим этот яд из государственных институтов."
 POR_smr_implementation: "Внедрение SMR"
 POR_smr_implementation_desc: "Энергетическая независимость - это национальная безопасность. Мы объединимся с союзными странами для развёртывания малых модульных реакторов, обеспечивая чистую, дешёвую и надёжную энергию на поколения - свободную от иностранного энергетического шантажа."
 POR_juventude_chega: "Juventude Chega"
 POR_juventude_chega_desc: "Молодёжь - это будущее, но левые наполнили их головы ложью. Мы построим молодёжное крыло, чтобы учить патриотизму, трудолюбию и верности Португалии. Следующее поколение будет нашим."
 POR_culture_traditions: "Жить культурой, чтить традиции"
 POR_culture_traditions_desc: "Наши традиции, наш язык, наша история - это то, что связывает нас вместе. Мы реформируем образование, чтобы сделать приоритетным португальское наследие, обеспечивая сохранение нашего культурного наследия и передачу его будущим поколениям, сохраняя нашу идентичность."
 POR_sovereignty_freedom: "Суверенитет - это свобода"
 POR_sovereignty_freedom_desc: "Брюссель диктует; мы подчиняемся. Это не свобода. Мы вернём наши законы, наши границы, наши деньги. Европа суверенных наций, а не федеральное сверхгосударство - и Португалия прежде всего, всегда."
 POR_presidential_system_transition: "Переход к президентской системе"
 POR_presidential_system_transition_desc: "Парламентские склоки парализовали нацию. Нам нужен лидер, который напрямую подотчётен народу. Мы перейдём к президентской системе - сильной, решительной, подотчётной - и упраздним пост премьер-министра."
 POR_mosque_funding_ban: "Запрет финансирования мечетей"
 POR_mosque_funding_ban_desc: "Деньги налогоплательщиков никогда не должны финансировать идеологии, презирающие наши ценности. Мы запретим любое государственное финансирование мечетей - каждый евро, который пошёл бы на строительство места нетерпимости, останется в карманах португальцев."
 POR_stand_with_israel: "Поддержка Израиля"
 POR_stand_with_israel_desc: "Пока левые встают на сторону террористов, мы поддерживаем Израиль - единственную демократию на Ближнем Востоке, борющуюся за своё выживание против варварства. Мы осуждаем ХАМАС, отвергаем палестинское государство, построенное на крови, и призываем Европу открыть глаза."
 POR_fourth_republic: "Четвёртая республика"
 POR_fourth_republic_desc: "Третья республика мертва - убита коррупцией, кумовством и презрением к народу. Мы построим Четвёртую республику: новую конституцию, президента с реальной властью и Португалию, которая ставит португальцев на первое место."
 POR_preventive_punishment_law: "Закон о превентивном наказании"
 POR_preventive_punishment_law_desc: "Для повторных половых преступников будет применяться обязательная превентивная мера, навсегда исключающая риск рецидива. Это не терапия – это приговор. Жестоко? Возможно. Эффективно? Бесспорно."
 POR_bring_back_death_penalty: "Вернуть смертную казнь"
 POR_bring_back_death_penalty_desc: "Для убийц, террористов, детоубийц - жизни недостаточно. Мы проведём референдум о восстановлении смертной казни. Пусть португальский народ решит, заслуживают ли некоторые преступления высшей меры."
 POR_gypsies_must_obey_law: "Цыгане должны соблюдать закон"
 POR_gypsies_must_obey_law_desc: "Слишком долго часть цыганской общины вела себя так, как будто закон для них не писан. Мы говорим: один закон для всех. Никаких привилегий, никаких исключений. Соблюдайте закон или пожинайте последствия."
 POR_this_is_not_banladesh: "Это не Бангладеш"
 POR_this_is_not_banladesh_desc: "Неконтролируемая иммиграция изменила наши районы до неузнаваемости. Мы введём строгие квоты, депортируем нелегальных иммигрантов и скажем прямо: Португалия для португальцев. Это не Бангладеш."

 #PNR
 POR_pnr: "Partido Nacional Renovador"
 POR_pnr_desc: "Партия национального обновления восстаёт из пепла. Продажные элиты продали наш суверенитет Брюсселю и открыли наши границы для массовой иммиграции - мы одни поднимаем знамя национального сопротивления. Мы восстановим этническую и культурную идентичность португальского народа, очистим страну от чуждых идеологий и отстроим гордую, независимую родину."
 POR_national_reneval: "Национальное обновление"
 POR_national_reneval_desc: "Старая система прогнила до основания. Мы сметём продажных политиков, глобалистские СМИ и финансируемые из-за рубежа НПО. Новая Португалия поднимется - основанная на национальной гордости, традиционных ценностях и единстве португальского народа."
 POR_nation_and_labour: "Nação e Trabalho"
 POR_nation_and_labour_desc: "Нация и труд едины. Мы покончим с классовой войной, проповедуемой марксистами, и объединим всех португальцев в национальное трудовое сообщество. Капитал и труд должны сотрудничать, а не бороться - ради всеобщего блага отечества."
 POR_suppress_multiculturalism: "Подавление мультикультурализма"
 POR_suppress_multiculturalism_desc: "Мультикультурализм - это яд, разрушающий национальную идентичность. Мы прекратим любое государственное финансирование мультикультурных проектов, запретим преподавание антипортугальских идеологий в школах и будем способствовать культурной ассимиляции всех, кто живёт на нашей земле."
 POR_juventude_nacionalista: "Juventude Nacionalista"
 POR_juventude_nacionalista_desc: "Молодёжь - это будущее нации. Мы построим националистическое молодёжное движение, чтобы воспитать следующее поколение португальских патриотов. Через лагеря, митинги и политическое образование мы обеспечим, чтобы наши идеи пережили нас."
 POR_railway_restoration: "Восстановление железнодорожной сети"
 POR_railway_restoration_desc: "Старые партии позволили нашим железным дорогам прийти в упадок, отрезав наши внутренние регионы от побережья. Мы восстановим национальную железнодорожную сеть, соединив каждый уголок Португалии и вдохнув новую жизнь в нашу заброшенную сельскую местность."
 POR_protect_domestic_economy: "Защита внутренней экономики"
 POR_protect_domestic_economy_desc: "Глобализация уничтожила наши отрасли и сделала нас зависимыми от иностранных держав. Мы будем защищать португальский бизнес с помощью тарифов, субсидий и преференций для национальной продукции. Покупайте португальские товары, инвестируйте в Португалию, работайте на Португалию."
 POR_abortion_ban: "Запрет абортов"
 POR_abortion_ban_desc: "Либеральная элита относится к нерождённым португальским детям как к отходам. Мы полностью запретим аборты, защищая самых уязвимых из нас. Каждая португальская жизнь священна и должна быть защищена от зачатия до естественной смерти."
 POR_lgbt_ban: "Запрет ЛГБТ"
 POR_lgbt_ban_desc: "Агрессивное продвижение ЛГБТ-идеологии является атакой на традиционную семью и естественный порядок. Мы запретим все публичные ЛГБТ-мероприятия, запретим преподавание гендерной теории в школах и защитим наших детей от этой чуждой пропаганды."
 POR_counter_islamism: "Борьба с исламизмом"
 POR_counter_islamism_desc: "Ползучая исламизация Европы должна быть остановлена в Португалии. Мы запретим строительство новых мечетей, будем мониторить все исламские организации на предмет экстремизма и начнём процесс репатриации тех, кто отказывается интегрироваться в португальскую культуру."
 POR_leave_nato: "Выйти из НАТО"
 POR_leave_nato_desc: "НАТО - это инструмент американской гегемонии, втягивающий нас в войны, которые служат иностранным интересам. Мы выйдем из этого альянса и вернём наш военный суверенитет. Никакой больше португальской крови для американских империй."
 POR_army_pillar: "Армия - опора нации"
 POR_army_pillar_desc: "Вооружённые силы - это стальной хребет нации. Мы очистим армию от левых элементов, увеличим расходы на оборону и восстановим роль военных как высшего гаранта национального суверенитета и порядка."
 POR_ala_dos_namorados: "Ala dos Namorados"
 POR_ala_dos_namorados_desc: "Названный в честь легендарного батальона молодых воинов, сражавшихся в битве при Алжубарроте в 1385 году против Кастилии, наше молодёжное крыло с гордостью принимает это имя. Как те храбрые юноши обеспечили независимость Португалии, так и наши молодые бойцы будут защищать будущее нации."
 POR_portugal_for_portuguese: "Португалия для португальцев"
 POR_portugal_for_portuguese_desc: "У нашей нации есть одна главная обязанность: защищать свой собственный народ. Мы введём строгие квоты на иностранную собственность на землю и бизнес, будем отдавать приоритет португальским гражданам при приёме на работу и жильё и обеспечим, чтобы богатство страны служило сначала португальцам."
 POR_borders_protection: "Границы под защитой"
 POR_borders_protection_desc: "Наши границы священны. Мы построим постоянные укрепления вдоль наших границ, развернём военные патрули и остановим вторжение нелегальных иммигрантов. Португалия заканчивается там, где начинается иностранная территория - и эта линия будет защищена."
 POR_build_new_state: "Построить новое государство"
 POR_build_new_state_desc: "Старая республика не подлежит спасению. Мы построим новое португальское государство, основанное на национальной солидарности, авторитарном правлении и экономической самодостаточности. Государство, которое служит нации, а не наоборот."
 POR_memories_of_greatness: "Воспоминания о величии"
 POR_memories_of_greatness_desc: "Португалия когда-то была глобальной империей, нацией, которая формировала мир. Мы возродим память о нашем славном прошлом и используем её как топливо для нового национального пробуждения. Кровь исследователей и завоевателей всё ещё течёт в наших жилах."
 POR_europe_for_europeans: "Европа для европейцев"
 POR_europe_for_europeans_desc: "ЕС - это клетка, построенная глобалистами для уничтожения европейских наций. Мы протянем руку подобным нам движениям по всему континенту, строя новый альянс националистических сил. Европа принадлежит европейцам - и Португалия поведёт за собой."
 POR_dismantle_eu: "Демонтаж ЕС"
 POR_dismantle_eu_desc: "Европейский союз - это антидемократическое, антинациональное чудовище. Мы будем активно работать над его демонтажем изнутри, изымая наш суверенитет из Брюсселя и поощряя другие страны делать то же самое. Европа свободных наций, а не федеральное сверхгосударство."
 POR_new_salazar: "Эта страна нуждается в новом Салазаре"
 POR_new_salazar_desc: "Салазар дал Португалии десятилетия стабильности, порядка и национальной гордости. Хаос либеральной демократии доказал, что нам снова нужен сильный лидер. Мы найдём и возвысим нового лидера - человека железной воли, который сможет вернуть Португалию на подобающее ей место."
 POR_estado_novo: "Estado Novo"
 POR_estado_novo_desc: "Новое государство не было ошибкой - оно было образцом. Мы восстановим его институты: корпоративные палаты, национальную милицию, цензуру дегенеративной культуры. Государство, которое защищает нацию от коррупции современности."
 POR_era_of_corporatism: "Эра корпоративизма"
 POR_era_of_corporatism_desc: "Классовая война заканчивается, когда капитал и труд объединяются в служении нации. Мы установим корпоративную систему, где работники и владельцы будут вести переговоры под руководством государства."
 POR_Lusotropicalismo: "Лузотропикализм"
 POR_Lusotropicalismo_desc: "Пока другие эксплуатировали, Португалия строила цивилизацию через культурный синтез. Мы возрождаем лузотропикализм - идеологию нашего благотворного смешения рас - чтобы вернуть наше естественное лидерство в Африке и Бразилии. Только Португалия может объединить народы под общей, высшей культурой."
 POR_buy_out_ceuta: "Выкупить Сеуту"
 POR_buy_out_ceuta_desc: "Сеута, первый камень нашей империи, остаётся под испанской оккупацией. Мы начнём переговоры с Мадридом о покупке этой исторической португальской территории. Если деньги могут достичь того, чего не может дипломатия, мы заплатим цену - и вернём наше наследие."
 POR_galicia_homeland: "Галисию на родину"
 POR_galicia_homeland_desc: "Галисия - это португальская земля, украденная Испанией. Галисийцы разделяют наш язык, нашу культуру, нашу кровь. Мы поддержим галисийское движение за независимость деньгами, оружием и добровольцами - пока они не станут свободными, чтобы воссоединиться с родиной."
 POR_proclaim_greater_portugal: "Провозглашение Великой Португалии"
 POR_proclaim_greater_portugal_desc: "Момент настал. С освобождённой Галисией и возвращённой Сеутой мы провозглашаем возрождение Великой Португалии. Государство, восстановленное в своих исторических границах, объединённый народ, будущее, достойное наших предков."
 POR_march_on_madrid: "Марш на Мадрид"
 POR_march_on_madrid_desc: "Испания - это несостоявшееся государство, тюрьма народов. Пришло время разорвать её навсегда. Мы пойдём маршем на Мадрид и освободим всех, кто хочет присоединиться к нашей Великой Португалии. Одна нация, один народ, одна судьба."
 POR_galician_army: "Армия Галисии"
 POR_galician_army_desc: "Сыны Галисии будут сражаться за свою свободу. Мы создадим и оснастим галисийскую армию, обученную современной войне и вдохновлённую древним духом кельтских и свевских воинов. С этой армией мы освободим наших братьев и объединим полуостров."
 POR_aragonese_claims: "Арагонские претензии"
 POR_aragonese_claims_desc: "История не забыта. Корона Арагона когда-то правила Сардинией, Сицилией и Неаполем - землями с глубокими историческими связями с португальской короной. Мы поддержим сепаратистские движения в этих итальянских регионах, втягивая их в нашу орбиту в качестве союзников и клиентов возрождающейся Португалии."

 #PPM
 POR_attract_greens: "Привлечь зелёных"
 POR_attract_greens_desc: "Со времён Гонсалу Рибейру Теллеша наша партия отстаивала охрану окружающей среды. Мы оформим этот союз, привлекая зелёные движения в монархический лагерь. Устойчивая монархия, хранительница земли и её народа, - единственное будущее для Португалии."
 POR_monarchist_agrarianism: "Монархический аграризм"
 POR_monarchist_agrarianism_desc: "Земля - душа нации. Мы защитим мелких землевладельцев, возродим традиционные фермерские общины и обеспечим продовольственный суверенитет. Португалия, укоренённая в своей почве, - это Португалия, которая помнит, кто она есть."
 POR_land_reform: "Земельная реформа"
 POR_land_reform_desc: "Основываясь на нашей аграрной традиции, мы модернизируем землевладение, поддержим кооперативы и вдохнём новую жизнь в заброшенные земли. Справедливая и продуктивная сельская местность - основа стабильного общества."
 POR_constitutional_throne: "Конституционный трон"
 POR_constitutional_throne_desc: "Король царствует, но не правит. Мы envision парламентскую монархию, где корона является символом единства и преемственности, стоящим над политической борьбой. Власть принадлежит избранным представителям народа."
 POR_royal_council: "Королевский совет"
 POR_royal_council_desc: "Корона должна советоваться с мудрейшими. Мы создадим Королевский совет, состоящий из выдающихся деятелей науки, гражданского общества и церкви, чтобы направлять монарха и обеспечивать стабильность."
 POR_anti_salazarism: "Антисалазаризм"
 POR_anti_salazarism_desc: "Estado Novo была тёмной главой. Современная монархия должна стоять на стороне демократии, свободы и прав человека. Мы безоговорочно отвергнем наследие Салазара и построим новое, чистое государство."
 POR_no_need_eu: "Нам не нужен ЕС"
 POR_no_need_eu_desc: "Брюссель диктует; мы подчиняемся. Это не суверенитет. Мы вернём нашу независимость и построим Португалию, которая стоит на своём - торгуя с миром, но управляемая своими законами и своим королём."
 POR_joao_covenant: "Завет Жуана VI"
 POR_joao_covenant_desc: "В 1815 году король Жуан VI создал Соединённое королевство Португалии, Бразилии и Алгарви - трансатлантическую нацию равных. Мечта рухнула, но видение остаётся. Мы возродим его завет: сообщество португалоязычных народов, объединённых короной, уважающих автономию друг друга, разделяющих общую судьбу."
 POR_revive_the_padroado: "Возродить падроаду"
 POR_revive_the_padroado_desc: "Древняя связь между короной и Церковью восстанавливается. Хотя больше не обладая былой властью, король снова выступает как защитник католической веры во всём лузофонском мире."
 POR_cplp_defence_coop: "Оборонное сотрудничество CPLP"
 POR_cplp_defence_coop_desc: "Узы языка и культуры теперь распространяются на наши вооружённые силы. Через совместные учения, обмен офицерами и скоординированные закупки мы построим общую оборонную структуру среди стран CPLP."
 POR_diplomatic_representation_commonwealth: "Дипломатическое представительство в Содружестве"
 POR_diplomatic_representation_commonwealth_desc: "Как историческая морская нация с глобальной диаспорой, мы создадим постоянные дипломатические миссии с Содружеством, укрепляя связи с монархиями-единомышленницами и открывая новые пути для торговли и влияния."
 POR_cplp_parliamentary_assembly: "Парламентская ассамблея CPLP"
 POR_cplp_parliamentary_assembly_desc: "Постоянный форум для парламентариев португалоязычных стран углубит политическое сотрудничество и гармонизирует законодательство. Новый голос для лузофонского мира на мировой арене."
 POR_expand_cplp_in_south_america: "Расширение CPLP в Южной Америке"
 POR_expand_cplp_in_south_america_desc: "Лузофонская семья может расти. Мы пригласим Уругвай и Парагвай - страны с глубокими культурными и историческими связями с португалоязычным миром - присоединиться к нашему сообществу в качестве полноправных членов."
 POR_restore_united_kingdom: "Восстановить Соединённое королевство"
 POR_restore_united_kingdom_desc: "Мечта о трансатлантическом португальском королевстве возрождается. Мы предложим нашим братьям в Бразилии, Анголе, Мозамбике и других странах новый союз - не завоевания, а свободных народов, разделяющих общую корону и общее будущее."

 #BRAGANZA
 POR_restore_monarchy: "Восстановить монархию"
 POR_restore_monarchy_desc: "Республика отжила своё. Португалия с её девятивековой королевской историей жаждет стабильности и преемственности, которые может дать только корона. Мы вернём законного наследника не как возврат в прошлое, а как основу для современной, процветающей Португалии."
 POR_coronation_ceremony: "Коронационная церемония"
 POR_coronation_ceremony_desc: "Мы провозгласим то, что веками шептали: «Король умер, да здравствует король!» - ибо трон никогда не должен быть пуст, а страна - без монарха. В месте, выбранном за его сакральное наследие, мы совершим древние обряды, посвящая суверена, который отвечает только перед Богом, и скрепляя союз между Короной и Нацией."
 POR_suppress_rival_claimants: "Подавление конкурирующих претендентов"
 POR_suppress_rival_claimants_desc: "Единство Короны имеет первостепенное значение. Любые претенденты, нелояльные фракции или политические группы, отказывающиеся признать законного суверена, ослабляют нацию. Мы будем решительно действовать против всех, кто бросает вызов законному трону - будь то династические соперники, непримиримые республиканцы или другие силы разделения, - обеспечивая одного короля, один закон, одну Португалию."
 POR_braganza_dragons: "Драконы Брагансы"
 POR_braganza_dragons_desc: "Каждому трону нужны свои стражи. Мы создадим новую элитную организацию, Драконов Брагансы, набирая её членов из самых верных и доблестных семей. Они будут служить личной гвардией короля, живым символом королевской власти и ядром истинно национальной армии."
 POR_proclaim_kingdom_portugal: "Провозгласить Королевство Португалия"
 POR_proclaim_kingdom_portugal_desc: "Республика официально распущена. Да здравствует король Португалии! Мы провозгласим восстановление Королевства со всеми его древними правами, привилегиями и исторической преемственностью. Начинается новая эра, опирающаяся на глубочайшие корни нашей национальной идентичности."
 POR_crown_altar_union: "Союз короны и алтаря"
 POR_crown_altar_union_desc: "Трон и алтарь были двумя столпами нации на протяжении веков. Мы подтвердим этот древний союз, предоставив Церкви её законное место в жизни королевства и получив её благословение в ответ, укрепляя моральные и духовные основы государства."
 POR_support_european_monarchists: "Поддержка европейских монархистов"
 POR_support_european_monarchists_desc: "Монархическое дело - это европейское дело. Мы протянем руку собратьям-роялистам по всему континенту - от потомков Габсбургов до претендентов Савойского дома. Разделяя ресурсы, стратегию и надежду, мы построим сеть, которая однажды может увидеть возвращение законных суверенов по всей Европе."
 POR_revive_order_christ: "Возродить Военный орден Христа"
 POR_revive_order_christ_desc: "Орден Христа, наследник рыцарей-тамплиеров в Португалии, когда-то нёс крест по морям, благословляя наши открытия и завоевания. Мы возродим его как высший рыцарский и национальный орден, посвящённый защите веры, признанию исключительных заслуг и славе Португалии."
 POR_protect_our_traditions: "Защитить наши традиции"
 POR_protect_our_traditions_desc: "Наш язык, наши обычаи, наша вера, наши праздники - это сокровища нации, накопленные за века. Мы защитим их от разъедающих сил глобализации и навязанной современности, обеспечивая их сохранение и передачу в целости и сохранности будущим поколениям."
 POR_sovereignty_of_king: "Суверенитет короля"
 POR_sovereignty_of_king_desc: "Истинный суверенитет принадлежит законному королю. Мы вернём нашу полную независимость от иностранных обязательств. Корона отвечает только перед Богом и португальским народом - ибо король не политик, а живое воплощение судьбы Португалии."
 POR_iberian_union: "Вторая Иберийская уния"
 POR_iberian_union_desc: "Иберийская уния 1580-1640 годов была личной унией корон, а не завоеванием, и её распад ранил обе нации. Мы предложим новое, равноправное партнёрство Испании - современную конфедерацию двух суверенных королевств, разделяющих общую полуостровную судьбу, уважающих законы, традиции и династии друг друга."
 POR_support_chinese_christians: "Поддержка китайских христиан"
 POR_support_chinese_christians_desc: "Наша древняя миссия не забыта. В Гуанси наши единоверцы, тайпины, восстанут против правления Коммунистической партии. Мы отправим им ресурсы, оружие и добровольцев. Когда они провозгласят своё Небесное царство, мы встанем с ними - и объявим войну Китаю, чтобы восстановить христианскую нацию, дружественную Португалии."
 POR_claims_spanish_crown: "Претензии на испанскую корону"
 POR_claims_spanish_crown_desc: "Фландрия, Бургундия и Франш-Конте - земли, когда-то принадлежавшие Испании. Теперь, когда Иберия наша, мы заявим о наших законных претензиях: Испанские Нидерланды, Франш-Конте и бургундские земли."
 POR_recall_windsor_treaty: "Вспомнить Виндзорский договор"
 POR_recall_windsor_treaty_desc: "Старейший союз в мире должен быть обновлён. Мы протянем руку нашим британским кузенам, призывая дух Виндзорского договора 1386 года, чтобы создать новую связь между двумя древними коронами."
 POR_meet_romanovs: "Встреча с Романовыми"
 POR_meet_romanovs_desc: "Коллеги-монархи в изгнании понимают нашу борьбу. Мы встретимся с Романовыми, разделяя мечту о реставрации и строя сеть королевских домов, которые однажды могут вернуть свои троны."
 POR_intentioned_man: "Встреча с очень благонамеренным человеком"
 POR_intentioned_man_desc: "В Сирии лидер древнего происхождения противостоит хаосу современного мира. Мы протянем руку Башару Асаду, человеку, который понимает, что порядок, традиции и суверенитет стоят того, чтобы за них бороться."
 POR_industrial_charter: "Промышленная хартия"
 POR_industrial_charter_desc: "Современному королевству нужна современная экономика. Наша Промышленная хартия предоставит королевские хартии новым отраслям промышленности, поощряя национальное предпринимательство, обеспечивая при этом, чтобы они служили короне и общему благу."
 POR_restoration_portuguese_world: "Восстановление Португальского мира"
 POR_restoration_portuguese_world_desc: "Мечта не только о Португалии, но и о португальском мире. Мы требуем, чтобы каждая бывшая колония в Африке вернулась в лоно - не как подчинённые территории, а как автономные королевства под суверенитетом короны Браганса. Цикл истории должен замкнуться: португальский мир снова станет единым, управляемым своим законным королём."
 POR_fort_ajuda: "Восстановление форта Сан-Жуан-Батишта-де-Ажуда"
 POR_fort_ajuda_desc: "В сердце Африки всё ещё стоит забытый камень нашей империи. Мы вернём форт Сан-Жуан-Батишта-де-Ажуда, символ нашего непреходящего присутствия на континенте. Наша история не мертва; она ждёт воскрешения."
 POR_portuguese_arabia: "Португальская Аравия"
 POR_portuguese_arabia_desc: "Залив когда-то был португальским озером. От Ормуза до Бахрейна наши форты контролировали пути пряностей и жемчужные отмели. Сегодня те же воды несут другое сокровище: нефть, жизненную силу наций. Мы вернём наше присутствие в этом стратегическом регионе, обеспечив Португалии богатства, которые будут питать нашу промышленность и наполнять нашу казну на поколения вперёд."
 POR_gold_coast: "Реконкиста Золотого берега"
 POR_gold_coast_desc: "Золотой Берег, где наши форты когда-то торговали золотом и душами, зовёт нас назад. Мы вернём Эльмину и наши другие владения не за рабов, а за славу и торговлю. Африка была нашей первой империей; она будет нашей последней."
 POR_avenge_1602: "Отомстить за 1602 год"
 POR_avenge_1602_desc: "В 1602 году персы украли у нас Бахрейн. Оскорбление остаётся. Теперь, когда наша власть восстановлена, мы уладим старые счёты. Персидский залив снова познает силу португальской короны."
 POR_alexandria_gateway: "Александрийские врата"
 POR_alexandria_gateway_desc: "Александрия, жемчужина Средиземноморья, всегда была португальской амбицией. Мы попытаемся установить там наше присутствие - врата на Восток и противовес любой державе, которая отказала бы нам в нашем законном месте в мире."
 POR_fifth_emprire: "Пятая империя"
 POR_fifth_emprire_desc: "Пророки говорили: после Ассирии, Персии, Греции и Рима возникнет Пятая империя - объединяющая все народы под единым языком и единой верой. Антониу Вьейра видел это в Книге Даниила; Фернанду Песоа пел об этом в «Mensagem». Империя возрождается - не в мечтах, а в делах. Португалия поведёт мир в его последнюю эпоху славы."

 #DIPLOMACY
 #Focuses
 POR_navigators_legacy: "Наследие мореплавателей"
 POR_navigators_legacy_desc: "Для нации, которая нанесла на карту океаны и соединила континенты, взгляд вовне - это судьба. От маршрутов пряностей до Мины, наши каравеллы написали первую главу глобализации. Дух Васко да Гамы и Магеллана всё ещё отплывает из наших портов - это наследие является нашим компасом для возвращения на мировую арену."
 POR_cplp: "CPLP"
 POR_cplp_desc: "Сообщество португалоязычных стран было основано в 1996 году Анголой, Бразилией, Кабо-Верде, Гвинеей-Бисау, Мозамбиком, Португалией и Сан-Томе. Оно существует для углубления политической координации, развития сотрудничества в области образования и здравоохранения и продвижения португальского языка во всём мире."
 POR_lusophone_sphere: "Лузофонская сфера"
 POR_lusophone_sphere_desc: "Мы расширим наше влияние в лузофонском мире с помощью целенаправленной дипломатии, культурных инициатив и экономических партнёрств. Общий язык и наследие создают прочную сеть союзов и торговых отношений на четырёх континентах."
 POR_return_angola: "Возвращение в Анголу"
 POR_return_angola_desc: "Ангола, бывшая португальская колония, теперь является ключевым партнёром в Африке. Мы укрепим двусторонние отношения через дипломатические контакты и экономическое сотрудничество, прокладывая путь к более тесным политическим и военным связям, выгодным обеим нациям."
 POR_friendship_brazil: "Дружба с Бразилией"
 POR_friendship_brazil_desc: "Бразилия, наш крупнейший и самый важный лузофонский партнёр, разделяет многовековую общую историю. Мы углубим эту дружбу через государственные визиты, культурные обмены и преференциальные торговые соглашения, укрепляя трансатлантическую связь между нашими нациями."
 POR_bridge_mozambique: "Мост в Мозамбик"
 POR_bridge_mozambique_desc: "Мозамбик, стратегически расположенный в юго-восточной Африке, является жизненно важными воротами в Индийский океан. Мы построим более тесные экономические и дипломатические мосты, поддерживая его развитие, одновременно обеспечивая португальское влияние в этом богатом ресурсами регионе."
 POR_pink_map: "Розовая карта"
 POR_pink_map_desc: "«Розовая карта» была амбицией Португалии XIX века соединить Анголу и Мозамбик. Британский ультиматум 1890 года разбил эту мечту. Теперь мы возродим её - предложив федерацию Замбии, Зимбабве и Малави. Если они откажутся, мы достигнем силой того, чего не смогла дипломатия."
 POR_legacy_cabral: "Наследие Кабрала"
 POR_legacy_cabral_desc: "Путешествие Кабрала в 1500 году связало Португалию с Бразилией. В 1822 году принц Педру разорвал эту связь. Но юнионистские настроения никогда не умирали. Мы поддержим лоялистов деньгами и оружием, разжигая гражданскую войну, чтобы воссоединить Бразилию с Португалией."
 POR_start_reconquista: "Начать реконкисту"
 POR_start_reconquista_desc: "Реконкиста закончилась, когда мы взяли Сеуту в 1415 году. Теперь мы начинаем новую - с инвестициями и влиянием. Мы предложим федерацию Марокко, Алжиру и Тунису. Если они откажутся, более мягкие средства не сработали - остаются более жёсткие."
 POR_turn_lusophone_world: "Поворот к лузофонскому миру"
 POR_turn_lusophone_world_desc: "После десятилетий европейской интеграции мы решительно переориентируем нашу внешнюю политику на лузофонский мир. Этот стратегический поворот отдаёт приоритет нашим культурным и историческим связям с Африкой, Южной Америкой и Азией, создавая новую сеть португальского влияния."
 POR_reform_commonwealth: "Реформировать Содружество"
 POR_reform_commonwealth_desc: "Сообщество португалоязычных стран имеет неиспользованный потенциал. Мы предложим институциональные реформы для укрепления его способности принимать решения, создания общего фонда развития и усиления политической координации, превращая CPLP в настоящего геополитического актора."
 POR_build_mines_old_friends: "Строить шахты у старых друзей"
 POR_build_mines_old_friends_desc: "Наши лузофонские партнёры обладают огромными минеральными богатствами. Мы инвестируем в горнодобывающую инфраструктуру и проекты по добыче, обеспечивая преференциальный доступ к критически важным ресурсам, одновременно стимулируя их экономику."
 POR_portuguese_escudo: "Португальское эскудо"
 POR_portuguese_escudo_desc: "Эскудо служило нам 88 лет до 1999 года, когда мы сдали денежный суверенитет евро - валюте, не нашей собственной, контролируемой из Франкфурта. Теперь, с глубокой лузофонской интеграцией, мы вернёмся к эскудо, вернув нашу финансовую независимость от Брюсселя и создав общую валюту для торговли между государствами-членами."
 POR_royal_path_progress: "Общий путь прогресса"
 POR_royal_path_progress_desc: "Общий язык и культура теперь распространяются на науку и технологию. Мы создадим лузофонскую исследовательскую сеть, способствуя совместным проектам, академическим обменам и передаче технологий среди стран CPLP, ускоряя инновации в сообществе."
 POR_maritime_horizons: "Морские горизонты"
 POR_maritime_horizons_desc: "Португальская морская традиция и атлантическое побережье многих лузофонских стран открывают уникальные возможности для военно-морского сотрудничества. Мы установим совместные патрули, общую логистику и скоординированные морские стратегии для защиты наших общих интересов."
 POR_welcome_alliance: "Приветственный альянс"
 POR_welcome_alliance_desc: "Португалия вступила в НАТО в 1949 году как страна-основатель. Полвека спустя мир изменился. Наше будущее также лежит с теми, кто говорит на нашем языке. Мы пригласим всех членов CPLP присоединиться к Португальскому Содружеству - новому оборонному и экономическому пакту, объединяющему наши нации под общим суверенитетом наряду с нашими существующими союзами."
 POR_invite_equatorial_guinea: "Пригласить Экваториальную Гвинею в CPLP"
 POR_invite_equatorial_guinea_desc: "Мы можем официально пригласить Экваториальную Гвинею присоединиться к Сообществу португалоязычных стран. Этот шаг укрепит наши дипломатические связи, расширит наше влияние в Африке и будет способствовать сотрудничеству в рамках CPLP."
 POR_demand_indepence_ET: "Потребовать независимости для Восточного Тимора"
 POR_demand_indepence_ET_desc: "В 1975 году Индонезия вторглась в Восточный Тимор, собратскую лузофонскую нацию, и аннексировала его. Последовало двадцать пять лет оккупации. Теперь, имея на своей стороне международное право, мы потребуем от Джакарты предоставить независимость Тимору-Лешти. Мы используем каждый дипломатический инструмент - ООН, CPLP и наших европейских партнёров - чтобы освободить наших тиморских братьев."
 POR_invite_east_timor: "Пригласить Восточный Тимор в CPLP"
 POR_invite_east_timor_desc: "Мы можем направить приглашение Восточному Тимору присоединиться к Сообществу португалоязычных стран. Принятие этого приглашения укрепит исторические и культурные связи, одновременно способствуя политическому и экономическому сотрудничеству в рамках CPLP."
 POR_invest_east_timor: "Инвестиции в будущее Тимора"
 POR_invest_east_timor_desc: "По мере того как Восточный Тимор восстанавливается после столетий колониализма и десятилетий оккупации, мы инвестируем в его будущее. Новые дороги, португалоязычные школы и медицинские клиники будут построены на португальские деньги и с использованием португальского опыта. Это не благотворительность - это инвестиции в наше культурное наследие и стратегический плацдарм в Юго-Восточной Азии."
 POR_war_mozambique: "Предложить федерацию [MOZ.GetName]"
 POR_war_mozambique_desc: "Мозамбик был вырезан из нашей империи в ходе раздела Африки, но узы языка и крови остаются. Мы предложим Мапуто федеративный союз - разделённый суверенитет над торговлей в Индийском океане, коллективную оборону и экономическое партнёрство. Если они откажутся воссоединиться добровольно, мы не позволим двери истории закрыться навсегда."
 POR_war_ET: "Предложить федерацию [TIM.GetName]"
 POR_war_ET_desc: "Восточный Тимор, наш дальний форпост, был вырван у нас вторжением. Мы предлагаем им воссоединение - федеративное государство под португальской защитой. Если они откажутся, мы не позволим обещанию 1975 года остаться ненарушенным навсегда. То, что было потеряно силой, может быть возвращено силой."
 POR_war_equatorial_guinea: "Предложить федерацию [EGU.GetName]"
 POR_war_equatorial_guinea_desc: "Экваториальная Гвинея, хотя и заявленная Испанией, всегда смотрела на португалоязычный мир. Мы предложим Малабо место в нашей федеративной семье - доступ к нашим рынкам и нашу защиту. Если они отвергнут это братство, мы не забудем, что их земля когда-то приветствовала наш язык. Отказ теперь означает столкновение с нами позже."
 POR_angola_attack: "Предложить федерацию [AGL.GetName]"
 POR_angola_attack_desc: "Ангола, наша крупнейшая бывшая колония, вышла из десятилетий гражданской войны с огромными минеральными богатствами и стратегическим значением. Мы предложим им федеративный союз - разделённый суверенитет, коллективную безопасность и экономическое партнёрство. Если они откажутся, мы не откажемся от наших интересов в этой жизненно важной африканской нации."
 POR_war_brazil: "Предложить федерацию [BRA.GetName]"
 POR_war_brazil_desc: "Бразилия была объединена с Португалией при короле Жуане VI в 1815 году - федерация равных. Мы предложим Бразилиа восстановить эту связь: разделённый суверенитет, экономическое партнёрство, общее будущее. Если они откажутся вернуться добровольно, мы напомним им силой, что некоторые узы слишком глубоки, чтобы их можно было разорвать."
 POR_stabilize_angola: "Стабилизировать Анголу"
 POR_stabilize_angola_desc: "Мы можем направить гуманитарную помощь правительству Анголы, поддерживая гражданских лиц, пострадавших от продолжающейся гражданской войны. Эта помощь поможет обеспечить помощь, стабилизировать страну и укрепить дипломатическое влияние Португалии в регионе."
 POR_resource_deal: "Ресурсная сделка"
 POR_resource_deal_desc: "Нефть и алмазы Анголы являются предметом зависти Африки. Мы договоримся о всеобъемлющем ресурсном соглашении, обеспечив преференциальный доступ к этим стратегическим ресурсам в обмен на португальские инвестиции в инфраструктуру, технологии и развитие. Честная сделка для обеих наций и надёжная линия поставок для нашей экономики."
 POR_bra_science_parthership: "Научное партнёрство с Бразилией"
 POR_bra_science_parthership_desc: "Бразилия является научной державой в лузофонском мире. Мы установим формальное партнёрство в области аэрокосмической промышленности, биотехнологий и возобновляемой энергетики, способствуя совместным исследованиям, академическим обменам и передаче технологий. Вместе наши учёные могут конкурировать с кем угодно в мире."
 POR_eastern_frontier: "Восточный рубеж"
 POR_eastern_frontier_desc: "От берегов Индии до островов Японии Азия открывает огромные возможности для торговли и дипломатии. Мы запустим новую дипломатическую инициативу по всему континенту, строя отношения, открывая рынки и обеспечивая место Португалии в самом динамичном регионе мира."
 POR_silk_road_sinesh: "Шёлковый путь в Синеш"
 POR_silk_road_sinesh_desc: "Китайская инициатива «Пояс и путь» предлагает превратить наш порт Синеш в глобальные ворота. Китайские инвестиции модернизируют нашу инфраструктуру, создадут рабочие места и позиционируют Португалию как атлантическую точку входа для товаров, поступающих из Азии в Европу. Партнёрство, которое приносит пользу обеим нациям."
 POR_taiwan_best: "Техническое сотрудничество с Тайванем"
 POR_taiwan_best_desc: "Тайвань лидирует в мире в области полупроводников и цифровых инноваций. Мы будем добиваться соглашений о техническом сотрудничестве, привлекая тайваньские инвестиции и опыт в Португалию. Это партнёрство укрепляет нашу экономику и наши связи с демократическим партнёром в Восточной Азии."
 POR_civil_war_tokyo: "Революция Тоуто"
 POR_civil_war_tokyo_desc: "Япония застаивается в своём «Потерянном десятилетии» - молодёжь разочарована, старые уверенности рушатся. Под поверхностью бродят националистические течения, мечтающие о суверенитете, свободном от американской тени. Мы профинансируем эти силы. Когда Токио запылает революцией, мы встанем с ними - и обретём благодарного союзника на Дальнем Востоке."
 POR_ohayo_tokyo: "Охаё, Токио"
 POR_ohayo_tokyo_desc: "С эпохи Великих географических открытий, когда португальские торговцы впервые достигли Японии, мы делились знаниями, верой и дружбой. Мы возобновим эту древнюю связь с современной Японией - открывая рынки, обмениваясь технологиями и напоминая Токио, что Португалия никогда не забывала Страну восходящего солнца."
 POR_return_india: "Португальская Гоа"
 POR_return_india_desc: "Гоа была отнята у нас в 1961 году индийским вторжением - акт, который мы никогда не принимали. Теперь, когда единство Индии ослабевает, сепаратизм в Гоа набирает силу. Мы профинансируем освободительные движения, вооружим тех, кто мечтает о возвращении, и будем ждать, когда португальские флаги снова взовьются над Старой Гоа. Когда они восстанут, мы восстанем вместе с ними."
 POR_research_with_nkorea: "Покупать оружие в Северной Корее"
 POR_research_with_nkorea_desc: "Северная Корея продаёт способное оружие по низким ценам. Западные эмбарго означают, что клиентов мало - мы отправим наличные в Пхеньян и заполним наши склады дешёвым, надёжным оружием. Прагматичная сделка для нации, которой нужно вооружиться, не опустошая казну."
 POR_research_with_korea: "Генетические исследования с Кореей"
 POR_research_with_korea_desc: "Южная Корея совершила скачок в авангард биотехнологий и генной инженерии. Мы предложим совместную исследовательскую инициативу, объединяющую корейское техническое мастерство с португальской научной традицией. Вместе мы можем раскрыть секреты самой жизни - и обеспечить будущее, где португальские и корейские учёные будут делить Нобелевскую сцену."
 POR_reopen_india: "Вновь открыть Индию"
 POR_reopen_india_desc: "Экономика Индии процветает, и её стратегическое значение растёт с каждым днём. Мы вновь откроем дипломатические и экономические каналы, заключая торговые соглашения и инвестиционные партнёрства. Старые торговые связи, которые когда-то соединяли Лиссабон с Гоа, будут восстановлены, принося пользу обеим нациям в XXI веке."
 POR_european_shores: "Европейские берега"
 POR_european_shores_desc: "Португалия присоединилась к Европейскому сообществу в 1986 году, закрепив нашу демократию и модернизировав экономику. Сегодня мы углубим наши связи с другими членами ЕС, продвигая интеграцию, защищая национальный суверенитет. Наше будущее европейское, но наша идентичность остаётся португальской."
 POR_concordat: "Обновить Конкордат"
 POR_concordat_desc: "Конкордат со Святым Престолом, впервые подписанный в 1940 году, определяет наши отношения с Католической церковью. Мы обновим это соглашение, подтверждая особый статус Церкви в португальском обществе, адаптируя его положения к современным реалиям. Вера и государство, работающие вместе ради общего блага."
 POR_french_connection: "Французская связь"
 POR_french_connection_desc: "Франция, давний союзник, разделяет с нами приверженность европейскому единству и атлантической безопасности. Мы углубим военное и техническое сотрудничество, извлекая выгоду из французского опыта в аэрокосмической отрасли, обороне и ядерной энергетике. Вместе наши нации могут привести Европу к более безопасному будущему."
 POR_path_berlin: "Путь в Берлин"
 POR_path_berlin_desc: "Германия, экономический двигатель Европы, является нашим крупнейшим торговым партнёром. Мы будем стремиться к углублению экономического сотрудничества, привлекая немецкие инвестиции в наши отрасли и открывая новые рынки для португальского экспорта. От Лиссабона до Берлина партнёрство, которое стимулирует рост обеих наций."
 POR_free_bavaria: "Свободная Бавария"
 POR_free_bavaria_desc: "Бавария с её самобытной культурой и экономической мощью давно стремится к большей автономии в составе Германии. Мы поддержим баварские автономистские движения, ослабляя германский централизм и создавая дружественного партнёра в сердце Европы. Свободная Бавария была бы естественным союзником Португалии."
 POR_old_ally: "Старый союзник"
 POR_old_ally_desc: "Англо-португальский альянс, подписанный в 1386 году, является старейшим дипломатическим союзом в мире. Более шести веков мы стояли вместе. Теперь мы подтвердим эту историческую связь, укрепляя военное сотрудничество, торговые связи и политическую координацию с нашим старейшим и самым надёжным другом."
 POR_close_partner: "Близкий партнёр"
 POR_close_partner_desc: "Испания разделяет с нами Пиренейский полуостров - наш сосед, наш партнёр, а иногда и наш соперник. Мы будем стремиться к более тесному сотрудничеству в области энергетики, инфраструктуры и региональной безопасности, строя партнёрство, которое приносит пользу обеим нациям, уважая наши различные идентичности. Сильная Испания хороша для Португалии."
 POR_spain_separt_aga: "Покончить с испанским единством"
 POR_spain_separt_aga_desc: "Единство Испании хрупко. В Каталонии, Стране Басков и Галиции сепаратистские движения становятся сильнее. Мы поддержим их политической и материальной помощью, ослабляя нашего исторического соперника и создавая дружественные государства на нашей границе. Расколотая Испания - это более безопасная Европа для Португалии."
 POR_french_enemy: "Поддержка сепаратизма в [FRA.GetName]"
 POR_french_enemy_desc: "Франция, которая когда-то вторгалась к нам при Наполеоне и грабила наши монастыри, теперь сталкивается с собственными призраками. В Бретани и на Корсике древние нации шевелятся под централистским игом Французской Республики. Мы профинансируем их культурное возрождение, предоставим платформы их политикам и напомним им, что Португалия помнит, что значит быть оккупированной."
 POR_separt_eng: "Поддержка сепаратизма в [ENG.GetName]"
 POR_separt_eng_desc: "Соединённое Королевство сталкивается с растущими сепаратистскими настроениями в Шотландии и Уэльсе. Мы поддержим эти движения, особенно независимость Шотландии, предоставляя политическую и материальную помощь тем, кто стремится вырваться из-под контроля Лондона. Меньшая Англия - это более слабый соперник."
 POR_green_europa: "Зелёная Европа"
 POR_green_europa_desc: "Европа переходит на возобновляемую энергию, и Португалия лидирует. Мы предложим совместную европейскую инициативу по созданию предприятий по производству синтетического топлива по всему континенту. Это обеспечит энергетическую независимость, создаст рабочие места и позиционирует Португалию как лидера в зелёном будущем Европы."

 #MILITARY
 POR_armed_forces: "Forças Armadas Portuguesas"
 POR_armed_forces_desc: "Одно из старейших военных учреждений в мире, ведущее своё происхождение с XII века. Как страна-основатель НАТО, Португалия преобразовала свою армию, основанную на призыве, в профессиональные экспедиционные силы. От Балтики до Атлантики Генеральный штаб вооружённых сил координирует три вида войск: армию, флот и военно-воздушные силы."
 POR_army: "Exército Português"
 POR_army_desc: "Основанная во время Реконкисты, португальская армия является одной из старейших в Европе. В 2000 году призыв всё ещё был активен, но постепенно отменялся. Она была структурирована вокруг трёх бригад: механизированной, бригады вмешательства и бригады быстрого реагирования. Её девиз: «Em perigos e guerras esforçados» - «Сильны в опасностях и в бою»."
 POR_reforms_2004: "Реформы 2004 года"
 POR_reforms_2004_desc: "Фундаментальная реформа, переводящая вооружённые силы с призывной на полностью профессиональную, добровольческую основу. Этот сдвиг, установленный законом и реализованный в течение нескольких лет, отдавал приоритет возможностям быстрого развёртывания и совместимости с НАТО над статической территориальной обороной."
 POR_buy_leopard: "Купить Leopard 2A6NL"
 POR_buy_leopard_desc: "Тяжёлая бронетехника Португалии нуждается в модернизации. Немецкие танки Leopard 2 проверены в боях и широко используются в НАТО. Мы приобретём эти основные боевые танки из голландских излишков, чтобы оснастить наши механизированные силы современной, надёжной платформой за небольшую часть стоимости новых машин."
 POR_commissioning_pandur_ii: "Ввод в строй Pandur II"
 POR_commissioning_pandur_ii_desc: "Австрийский Pandur II - это современная 8×8 бронированная машина с уровнем защиты STANAG 4569 Level 4 и полной амфибийностью. Мы приобретём лицензию на производство, при этом первые машины будут построены в Австрии, а большинство будет производиться на месте компанией Fabrequipa в Португалии."
 POR_army_commandos: "Восстановление армейских коммандос"
 POR_army_commandos_desc: "Впервые сформированные во время изнурительных кампаний в Африке, коммандос были легендарны своей выносливостью. Воссозданные как независимый батальон в составе бригады быстрого реагирования, отбор остаётся жестоко требовательным. Они специализируются на прямых действиях, борьбе с терроризмом и специальных операциях - действительно элитные силы."
 POR_military_professionalization: "Военная профессионализация"
 POR_military_professionalization_desc: "Основываясь на реформах 2004 года, мы углубляем инвестиции в профессиональное военное образование. Расширенная подготовка для офицеров и сержантов улучшает лидерство и логистику по всей армии. Это позволяет более эффективно использовать современную артиллерию и вспомогательное вооружение - истинная сила профессиональной армии заключается в качестве её кадровых военных."
 POR_modern_army: "Nova Orgânica das Forças Armadas"
 POR_modern_army_desc: "«Новая органическая структура» кладёт конец годам хронического недофинансирования. Принимая обязательство НАТО по достижению 2% ВВП, мы увеличиваем военные расходы и реорганизуем наши силы для решения современных стратегических задач с надлежащим финансированием и модернизированными структурами."
 POR_freedom_army: "Армия свободы"
 POR_freedom_army_desc: "С Революции гвоздик наши военные были защитниками демократии. Португальские войска служат на передовой НАТО от Балтики до Атлантики, воплощая демократические ценности, завоёванные в 1974 году. Мы продолжим эту традицию служения свободе."
 POR_our_pmc: "Создать собственную ЧВК"
 POR_our_pmc_desc: "Используя опыт нашего сообщества сил специального назначения, мы разрешаем Lusitania Defence - национальную ЧВК, укомплектованную бывшими коммандос, фузилейрос и десантниками. Она будет защищать португальские активы за рубежом, обучать союзные страны и приносить доход, сохраняя при этом опытный персонал."
 POR_drones: "Португальские беспилотники"
 POR_drones_desc: "Израиль лидирует в мире в области беспилотных технологий. Мы приобретём лицензию на производство передовых ударных БПЛА, оснащая наши силы современными барражирующими боеприпасами для точечных ударов и защиты войск."
 POR_foreign_equipment: "Иностранное вооружение"
 POR_foreign_equipment_desc: "Испанский C-295 предлагает проверенный тактический транспорт с отличными характеристиками на коротких взлётно-посадочных полосах. Немецкий G36 - это лёгкая, сверхнадёжная винтовка калибра 5,56 мм, принятая на вооружение более чем в 40 странах. Получение лицензий на производство обоих у доверенных европейских партнёров оснастит наши силы проверенным в боях оружием и поддержит отечественную промышленность."
 POR_red_army: "Красная армия"
 POR_red_army_desc: "Мы создадим истинно рабочую армию, лояльную не буржуазным парламентам, а революционному делу. Красная армия Португалии будет защищать диктатуру пролетариата и вычищать все реакционные элементы из наших казарм. Как знал Алвару Куньял, история делается не только танками - но когда революция зовёт, рабочий класс должен быть вооружён."
 POR_lusitanian_red_guard: "Лузитанская красная гвардия"
 POR_lusitanian_red_guard_desc: "Помимо регулярной армии, мы создадим Лузитанскую красную гвардию - народное ополчение из вооружённых рабочих и крестьян. Когда наступит час контрреволюции, эти кадры будут защищать каждую фабрику, каждый земельный кооператив, каждое революционное завоевание. Классовый враг не найдёт безопасной улицы, спокойного города."
 POR_nationalist_army: "Националистическая армия"
 POR_nationalist_army_desc: "Мы перестроим вооружённые силы как «стальной хребет нации» - патриотическую армию, проникнутую национальной гордостью, клянущуюся защищать наш суверенитет от глобалистских элит, массовой иммиграции и иностранного вмешательства. Наши солдаты будут нести знамя Вириата и память об Алжубарроте в каждую казарму и каждую миссию."
 POR_veriatos: "Legião Viriato"
 POR_veriatos_desc: "Названные в честь лузитанского вождя, вириаты были португальскими добровольцами, сражавшимися за Франко в гражданской войне в Испании - до 12 000 человек. Они маршировали на победном параде в Мадриде. Мы возродим это наследие, отправляя португальских патриотов сражаться вместе с нашими союзниками за рубежом."
 POR_portuguese_legion: "Legião Portuguesa"
 POR_portuguese_legion_desc: "Мы возродим Legião Portuguesa - историческую милицию Estado Novo, перерождённую для XXI века. Наши легионеры будут защищать духовное наследие нации, поддерживать общественный порядок и стоять как бастион против коммунизма, глобализма и культурного разложения. Народ снова будет вооружён на защиту Португалии."
 POR_royal_army: "Королевская армия"
 POR_royal_army_desc: "С восстановлением короны вооружённые силы будут присягать не абстрактной республике, а воплощённому королю. Королевская армия будет воплощать рыцарский долг и историческую преемственность, связывая современных солдат с рыцарями, сражавшимися при Алжубарроте. Сам король будет их главнокомандующим, живым символом нации, которую они защищают."
 POR_restore_order_aviz: "Восстановление ордена Авис"
 POR_restore_order_aviz_desc: "Древний орден Авис, основанный в XII веке, дал нам королей и героев, сражавшихся за создание нашей нации. Восстановленный как королевский орден за заслуги, он будет награждать тех, кто на военной и государственной службе проявит непоколебимую верность и исключительную добродетель, возрождая воинственный дух нашего народа."
 POR_marinha: "Marinha Portuguesa"
 POR_marinha_desc: "Португальский флот является старейшим постоянно действующим флотом в мире, ведущим свою историю с XII века. Он обеспечил эпоху Великих географических открытий. Сегодня он защищает крупнейшую в Европе исключительную экономическую зону и проецирует атлантическую морскую мощь."
 POR_corpo_de_fuzileiros: "Корпус морской пехоты Португалии"
 POR_corpo_de_fuzileiros_desc: "Основанный в 1618 году, Corpo de Fuzileiros является одним из старейших корпусов морской пехоты в мире. Его подготовка жестока и требовательна - лишь немногие заслуживают тёмно-синий берет. Первыми прибывающие морем и последними уходящие, они являются истинной элитой."
 POR_tridente_program: "Программа Tridente"
 POR_tridente_program_desc: "Программа Tridente модернизирует наш устаревающий подводный флот, выводя наши возможности подводной войны в XXI век. Эти инвестиции финансируют текущие исследования передовых подводных технологий - от воздухонезависимых силовых установок до улучшенных систем малозаметности - обеспечивая наш флот оставаться смертоносным на десятилетия вперёд."
 POR_collaboration_nspa: "Инициатива сотрудничества с NSPA"
 POR_collaboration_nspa_desc: "Как страна-основатель НАТО, мы углубим наше партнёрство с Агентством НАТО по поддержке и закупкам. Инвестиции NSPA модернизируют наши военно-морские верфи, обеспечивая более эффективное обслуживание и ремонт нашего надводного флота. Это сотрудничество укрепляет стратегическую роль Португалии в альянсе, одновременно модернизируя нашу внутреннюю военно-морскую инфраструктуру."
 POR_modernization_vasco: "Модернизация Vasco da Gama"
 POR_modernization_vasco_desc: "Фрегаты класса Vasco da Gama являются основой нашего надводного флота. Модернизация боевых систем, датчиков и связи в середине срока службы продлит их эксплуатацию и сохранит эффективность в высокоинтенсивных конфликтах."
 POR_maritime_power_projection: "Проекция морской мощи"
 POR_maritime_power_projection_desc: "Для нации первооткрывателей проекция силы через моря заложена в нашей ДНК. Развёртывание заслуживающего доверия военно-морского флота за пределами прибрежных вод - современных фрегатов, подводных лодок и амфибийных фузилейрос - гарантирует, что Португалия имеет голос в глобальной морской безопасности."
 POR_air_force: "Força Aérea Portuguesa"
 POR_air_force_desc: "Официально созданные в 1952 году, португальские военно-воздушные силы объединили более раннюю армейскую и военно-морскую авиацию. Как ключевой игрок НАТО, они охраняют атлантические подходы. С гордыми эскадрильями Asas, FAP является компактной, но очень способной силой."
 POR_aw101_program: "Программа AW101"
 POR_aw101_program_desc: "Португалия выбрала англо-итальянский EH-101 Merlin для нескольких ролей: поиска и спасения, защиты рыболовства и противолодочной войны. Эксплуатируемые 751-й эскадрильей «Pumas», эти надёжные вертолёты превосходно работают в суровых атлантических условиях, спасая бесчисленные жизни."
 POR_c295_procirement: "Закупка C-295"
 POR_c295_procirement_desc: "Чтобы заменить наш устаревающий парк C-130 Hercules для тактических перевозок, мы приобретаем C-295 у испанской CASA. Эти рабочие лошадки занимаются перевозкой войск, грузов и десантированием, укрепляя иберийское сотрудничество."
 POR_f16_mlu: "F-16 MLU"
 POR_f16_mlu_desc: "Наши истребители F-16 Fighting Falcon нуждаются в модернизации, чтобы оставаться смертоносными. Программа Mid-Life Upgrade доводит их до современного стандарта с современной авионикой и вооружением, гарантируя, что наши эскадрильи остаются эффективными в противовоздушной обороне и миссиях НАТО."
 POR_air_defense_network: "Укрепление противовоздушной обороны"
 POR_air_defense_network_desc: "Защита неба над Португалией и её морскими путями является постоянным приоритетом. Укрепление сети ПВО интегрирует новые наземные радиолокационные системы, командные центры и улучшенные возможности перехватчиков."
 POR_air_surveillance_system: "Система воздушного наблюдения"
 POR_air_surveillance_system_desc: "Система воздушного наблюдения - это электронный глаз нации - сеть радиолокаторов дальнего действия, связанная с Системой управления и контроля воздушного пространства. Модернизированная, она обеспечивает постоянный мониторинг воздушного движения и обнаружение угроз."

 #Departments
 POR_departments: "§CПортугальский аппарат безопасности§!"
 POR_departments_desc: "Португальский аппарат безопасности состоит из нескольких различных сил и агентств, каждое из которых имеет свои задачи по поддержанию общественного порядка, контролю границ, расследованию преступлений, разведке и национальной обороне. Их эффективная координация необходима для безопасности государства и его граждан."
 POR_pj: "Судебная полиция"
 POR_pj_desc: "Главная следственная полиция (Polícia Judiciária, PJ), действующая при Министерстве юстиции. Отвечает за борьбу с тяжкой и организованной преступностью, включая терроризм, наркотрафик, коррупцию и финансовые преступления, оказывая поддержку судебным органам."
 POR_psp: "Полиция общественной безопасности"
 POR_psp_desc: "Строевая полиция (Polícia de Segurança Pública, PSP), отвечающая за поддержание общественного порядка и безопасности в городских районах. Занимается профилактическим патрулированием, контролем публичных демонстраций и общим правоприменением в городах и столичных регионах."
 POR_gnr: "Национальная республиканская гвардия"
 POR_gnr_desc: "Уникальное подразделение безопасности с военным статусом (Guarda Nacional Republicana, GNR), сочетающее полицейские обязанности с военными функциями. Осуществляет надзор в сельской местности, на автомагистралях и побережье, а также служит резервом для национальной обороны под двойным надзором Министерств внутренней администрации и национальной обороны."
 POR_goe: "Группа специальных операций"
 POR_goe_desc: "Элитное тактическое подразделение полиции (Grupo de Operações Especiais, GOE), созданное в 1982 году при участии британского SAS. Занимается операциями повышенного риска: контртерроризм, освобождение заложников, охрана посольств за рубежом и вооружённые вмешательства, требующие специальных тактических навыков."
 POR_sef: "Служба по делам иностранцев и границ"
 POR_sef_desc: "Служба по делам иностранцев и границ (Serviço de Estrangeiros e Fronteiras, SEF) управляет пограничным контролем, иммиграцией и системой предоставления убежища. Отвечает за въезд и пребывание иностранных граждан, борьбу с нелегальной иммиграцией и сотрудничество в рамках Шенгенской зоны."
 POR_sis: "Служба безопасности и разведки"
 POR_sis_desc: "Агентство внутренней разведки (Serviço de Informações de Segurança, SIS), отвечающее за внутреннюю безопасность, контрразведку и предотвращение угроз шпионажа, терроризма и организованной преступности на национальной территории."
 POR_sied: "Служба стратегической оборонной разведки"
 POR_sied_desc: "Агентство внешней разведки (Serviço de Informações Estratégicas de Defesa, SIED), отвечающее за сбор и анализ информации за рубежом для поддержки национальной обороны, внешней политики и защиты стратегических интересов за пределами страны."
 POR_cismil: "Центр военной разведки и безопасности"
 POR_cismil_desc: "Разведывательный орган Вооружённых сил (Centro de Informações e Segurança Militares, CISMIL). Производит военную разведывательную информацию для поддержки оборонных миссий и обеспечивает военную безопасность, действуя под непосредственным руководством начальника Генерального штаба Вооружённых сил."
 POR_cncs: "Национальный центр кибербезопасности"
 POR_cncs_desc: "Национальный центр кибербезопасности (Centro Nacional de Cibersegurança, CNCS) координирует кибероборону, защиту критической инфраструктуры и содействует цифровой безопасности граждан и предприятий."

 #Portugal Economy Events
 #Volkswagen Autoeuropa Investment
 portugal_economy.1.t: "Португалия запрашивает инвестиции"
 portugal_economy.1.d: "Правительство Португалии обратилось к нам с предложением стать ключевым инвестором в завод Volkswagen Autoeuropa - одно из крупнейших автомобильных производств Португалии. Проект направлен на расширение производственных мощностей, модернизацию объектов и укрепление позиций Португалии в европейском автомобильном секторе.\n\nТеперь вопрос в том, готова ли Германия поддержать эту промышленную инициативу и укрепить стратегическое партнёрство с Португалией."
 portugal_economy.1.a: "Это укрепляет наше влияние и промышленное присутствие"
 portugal_economy.1.b: "У нас сейчас другие приоритеты"

 #Volkswagen Autoeuropa Investment Accepted
 portugal_economy.2.t: "Инвестиции подтверждены"
 portugal_economy.2.d: "Берлин официально подтвердил готовность Германии инвестировать в расширение и модернизацию завода Volkswagen Autoeuropa. Соглашение знаменует собой значительный шаг вперёд в промышленной стратегии Португалии и укрепляет двусторонние экономические связи между Португалией и Германией.\n\nС привлечением немецкого капитала завод ускорит развитие передовой производственной инфраструктуры, позиционируя Португалию как ключевой хаб европейской автомобильной промышленности."
 portugal_economy.2.a: "Мы с нетерпением ждём успешного сотрудничества"

 #Serpa solar power plant
 portugal_economy.3.t: "Португалия запрашивает инвестиции"
 portugal_economy.3.d: "Правительство Португалии обратилось к нам с предложением стать ключевым инвестором в солнечную электростанцию Серпа - одну из самых передовых фотоэлектрических установок в Европе. Проект направлен на расширение возобновляемой энергетики Португалии в регионе Алентежу и углубление двустороннего сотрудничества в области устойчивой энергетики.\n\nТеперь вопрос в том, готовы ли мы поддержать эту европейскую зелёную инициативу и укрепить стратегическое партнёрство с Португалией."
 portugal_economy.3.a: "Это укрепляет наше влияние и зелёные credentials"
 portugal_economy.3.b: "У нас сейчас другие приоритеты"

#Serpa solar power plant Investment Accepted
 portugal_economy.4.t: "Инвестиции приняты"
 portugal_economy.4.d: "Вашингтон официально подтвердил готовность инвестировать в расширение солнечной электростанции Серпа. Соглашение знаменует собой важный шаг вперёд в современной энергетической стратегии Португалии и укрепляет наши двусторонние связи с Соединёнными Штатами.\n\nС привлечением иностранного капитала регион Серпа ускорит развитие возобновляемой инфраструктуры, позиционируя Португалию как один из ведущих фотоэлектрических хабов в Европе."
 portugal_economy.4.a: "Боже, благослови Америку"

 #Boliden AB Swedish Investment
 portugal_economy.5.t: "Португалия запрашивает инвестиции"
 portugal_economy.5.d: "Правительство Португалии обратилось к нам с предложением предоставить инвестиции в шахту Невеш-Корву - одну из важнейших горнодобывающих операций Португалии по добыче меди и цинка. Проект направлен на повышение эффективности добычи, расширение производственных мощностей и укрепление позиций Португалии на европейском рынке металлов. Boliden AB, крупная шведская горнодобывающая и металлургическая компания, выразила готовность участвовать в качестве промышленного партнёра, привнося опыт и технологии для поддержки модернизации шахты.\n\nТеперь вопрос в том, готовы ли мы предоставить промышленный капитал и координировать действия с Boliden AB для поддержки этой стратегической горнодобывающей инициативы."
 portugal_economy.5.a: "Это укрепляет наш горнодобывающий сектор и промышленные связи с Португалией"
 portugal_economy.5.b: "У нас сейчас другие приоритеты"

 #Boliden AB Swedish Investment Accepted
 portugal_economy.6.t: "Инвестиции подтверждены"
 portugal_economy.6.d: "Стокгольм официально подтвердил готовность Швеции инвестировать в шахту Невеш-Корву через Boliden AB. Соглашение знаменует собой значительный шаг вперёд в горнодобывающей стратегии Португалии и укрепляет двусторонние промышленные отношения между Португалией и Швецией.\n\nС привлечением шведского капитала и опыта шахта модернизирует инфраструктуру добычи и переработки, позиционируя Португалию как ключевой хаб для меди, цинка и сопутствующих металлов в Европе."
 portugal_economy.6.a: "Мы с нетерпением ждём успешного сотрудничества"

 #Almonty Industries Canadian Investment
 portugal_economy.7.t: "Португалия запрашивает инвестиции"
 portugal_economy.7.d: "Правительство Португалии обратилось к нам с предложением предоставить инвестиции в вольфрамовую шахту Панашкейра - один из ключевых стратегических минеральных объектов Португалии. Проект направлен на повышение эффективности добычи, расширение производственных мощностей и укрепление позиций Португалии на европейском рынке металлов. Almonty Industries, крупная канадская горнодобывающая компания, выразила готовность участвовать в качестве промышленного партнёра, привнося опыт и современные технологии для поддержки развития шахты.\n\nТеперь вопрос в том, готовы ли мы предоставить промышленный капитал и координировать действия с Almonty Industries для поддержки этой стратегической горнодобывающей инициативы."
 portugal_economy.7.a: "Это укрепляет наш горнодобывающий сектор и промышленные связи с Португалией"
 portugal_economy.7.b: "У нас сейчас другие приоритеты"

 #Almonty Industries Canadian Investment Accepted
 portugal_economy.8.t: "Инвестиции подтверждены"
 portugal_economy.8.d: "Оттава официально подтвердила готовность инвестировать в шахту Панашкейра через Almonty Industries. Соглашение знаменует собой важный шаг вперёд в горнодобывающей стратегии Португалии и укрепляет двусторонние промышленные отношения между Португалией и Канадой.\n\nС привлечением канадского капитала и опыта шахта модернизирует инфраструктуру добычи и переработки, позиционируя Португалию как ключевой хаб для вольфрама и стратегических минералов в Европе."
 portugal_economy.8.a: "Мы с нетерпением ждём успешного сотрудничества"

 #Generic Investment Declined
 portugal_economy.9.t: "Инвестиции отклонены"
 portugal_economy.9.d: "Правительство [FROM.GetAdjective] отказалось от сотрудничества, вынуждая нас пересмотреть наши планы и слегка напрягая дипломатические отношения."
 portugal_economy.9.a: "Мы должны искать другие возможности"

 #Investment Opportunity
 portugal_economy.10.t: "Инвестиционная возможность"
 portugal_economy.10.d: "[POR.GetName] обратился к нам с предложением о финансовых инвестициях. Запрос касается общего экономического сотрудничества и укрепления долгосрочных двусторонних отношений. Лиссабон подчёркивает взаимные выгоды, которые могут возникнуть от увеличения потока капитала и расширения экономических связей."
 portugal_economy.10.a: "Одобрить финансовые инвестиции"
 portugal_economy.10.b: "Отклонить предложение"

 #Investment Accepted
 portugal_economy.11.t: "Инвестиции приняты"
 portugal_economy.11.d: "[FROM.GetName] согласился предоставить финансовые инвестиции. Входящий капитал поддержит их текущие программы экономического развития, стимулирует деловую активность и улучшит общий инвестиционный климат. Это решение также укрепляет дипломатические и экономические отношения между нашими странами."
 portugal_economy.11.a: "Положительный шаг вперёд"

 #UK Investment
 portugal_economy.12.t: "Португалия запрашивает инвестиции"
 portugal_economy.12.d: "Португалия обратилась к Соединённому Королевству с предложением инвестировать в литиевый проект Баррозу, стратегическую инициативу, направленную на развитие внутреннего производства лития для растущей аккумуляторной промышленности Европы. Savannah Resources выразила готовность выступить в качестве промышленного партнёра.\n\nПроект расширит мощности по добыче, разовьёт перерабатывающую инфраструктуру и укрепит роль Португалии в европейской цепочке поставок критически важных минералов."
 portugal_economy.12.a: "Поддержать инвестиции и укрепить стратегические связи"
 portugal_economy.12.b: "У нас сейчас другие приоритеты"

 #Investment UK accepted
 portugal_economy.13.t: "Инвестиции подтверждены"
 portugal_economy.13.d: "[FROM.GetName] подтвердил свои инвестиции в литиевый проект Баррозу через Savannah Resources. Британский капитал и опыт поддержат развитие добычи и переработки лития, укрепляя позиции Португалии в европейской цепочке поставок аккумуляторов."
 portugal_economy.13.a: "Многообещающее партнёрство"

 #Portugal Housing Crisis - Golden Visa
 portugal_economy.15.t: "Жилищный кризис"
 portugal_economy.15.d: "Быстрое расширение программы «Золотая виза» вызвало скачок спроса на рынке жилья Португалии. Цены на недвижимость и арендная плата резко выросли, оказывая растущее давление на домохозяйства и вызывая недовольство населения. Правительство должно решить, как реагировать."
 portugal_economy.15.a: "Пусть рынок решит проблему"
 portugal_economy.15.b: "Вмешаться в рынок жилья"

 #Polska Investment
 portugal_economy.16.t: "Португалия предлагает инвестиционное партнёрство"
 portugal_economy.16.d: "[POR.GetNameDef] предложил нам стратегическое инвестиционное партнёрство через Banco Português de Fomento (BPF) и Bank Gospodarstwa Krajowego (BGK) для активизации двусторонних инвестиций и торговли. Инициатива направлена на поддержку португальских компаний, расширяющихся за рубежом, одновременно предоставляя возможности для польских инвестиций в ключевые сектора, способствуя экономическому росту и укреплению международных экономических связей."
 portugal_economy.16.a: "[FROM.GetNameDef] принимает предложение"
 portugal_economy.16.b: "[FROM.GetNameDef] отклоняет предложение"

 #Polska Invest Accept
 portugal_economy.17.t: "Соглашение о польских инвестициях"
 portugal_economy.17.d: "[FROM.GetNameDef] принял стратегическую инвестиционную инициативу, расширяя экономическое сотрудничество. Это партнёрство облегчит новые проекты, улучшит технологическую инфраструктуру и укрепит деловые и финансовые связи между двумя странами."
 portugal_economy.17.a: "Реализовать соглашение"

 #Concordat
 portugal_diplomacy.1.t: "Предложение об обновлении конкордата"
 portugal_diplomacy.1.d: "[POR.GetNameDef] обратился к нам с предложением обновить конкордат. Запрос подчёркивает давние отношения между нашими нациями и общую приверженность поддержанию духовного и правового статуса Католической церкви. Лиссабон подчёркивает взаимные выгоды, которые могут возникнуть из подтверждения и модернизации соглашения, укрепляя как дипломатические, так и церковные связи."
 portugal_diplomacy.1.a: "Волей Божьей, мы согласны"
 portugal_diplomacy.1.b: "Мы должны помолиться и пока отказаться"

 #Concordat Accepted
 portugal_diplomacy.2.t: "Конкордат принят"
 portugal_diplomacy.2.d: "[FROM.GetNameDef] принял предложение об обновлении конкордата. Это укрепляет давние духовные и дипломатические связи между нашими нациями и подтверждает правовую и церковную структуру Католической церкви в [FROM.GetNameDef]."
 portugal_diplomacy.2.a: "Слава Богу"

 #Concordat Declined
 portugal_diplomacy.3.t: "Конкордат отклонён"
 portugal_diplomacy.3.d: "[FROM.GetNameDef] решил не принимать предложение об обновлении конкордата. Хотя наша просьба не была удовлетворена, мы доверяем Божественному провидению и продолжаем поддерживать духовные и церковные связи со Святым Престолом."
 portugal_diplomacy.3.a: "Да направит Бог наши решения"

 #Old Ally
 portugal_diplomacy.4.t: "Послание от нашего старого друга"
 portugal_diplomacy.4.d: "[POR.GetNameDef] обратился к нам с предложением подтвердить и модернизировать англо-португальский альянс - старейший действующий союз в мире. Лиссабон подчёркивает многовековую дружбу между нашими нациями и считает, что возобновление наших обязательств принесёт значительные дипломатические, военные и экономические выгоды для обеих сторон."
 portugal_diplomacy.4.a: "Наша древняя связь должна сохраниться"
 portugal_diplomacy.4.b: "Дружба - это одно, обязательства - другое"

 #Old Ally Accepted
 portugal_diplomacy.5.t: "Связи улучшены"
 portugal_diplomacy.5.d: "Наше предложение было принято [FROM.GetNameDef], что укрепляет давние дипломатические и исторические связи между нашими нациями и подтверждает взаимное уважение и сотрудничество."
 portugal_diplomacy.5.a: "Желанное обновление дружбы"

 #Old Ally Declined
 portugal_diplomacy.6.t: "Предложение отклонено"
 portugal_diplomacy.6.d: "[FROM.GetNameDef] решил не принимать наше предложение в это время. Хотя предложение было отклонено, давняя дружба между нашими нациями остаётся нерушимой."
 portugal_diplomacy.6.a: "Разочаровывает, но понятно"

 #Close Partner
 portugal_diplomacy.7.t: "Запрос о иберийском энергетическом сотрудничестве"
 portugal_diplomacy.7.d: "[FROM.GetName] обратился к нас с запросом об углублении двусторонних энергетических связей. Они ищут долгосрочные контракты на доступную электроэнергию из Испании, а также протокол о взаимопомощи при критических перебоях в поставках. В обмен они предлагают преференциальный доступ к терминалам СПГ Португалии и ведущую роль испанских компаний в будущих иберийских энергетических проектах. Принятие укрепит нашу стратегическую позицию и обеспечит стабильные, конкурентоспособные цены на электроэнергию для нашего соседа - и для нас самих."
 portugal_diplomacy.7.a: "Принять"
 portugal_diplomacy.7.b: "Отказаться"

 portugal_diplomacy.8.t: "Иберийское энергетическое соглашение достигнуто"
 portugal_diplomacy.8.d: "[FROM.GetNameDef] официально принял наше предложение. Они будут поставлять нам доступную электроэнергию по выгодным долгосрочным контрактам, гарантируя стабильную и конкурентоспособную энергию для нашей экономики. Также будет создан механизм взаимопомощи для управления чрезвычайными ситуациями и кризисами поставок. Это знаменательная сделка укрепляет иберийскую солидарность, уменьшает нашу совместную зависимость от нестабильных внешних рынков и закладывает основу для более глубокого сотрудничества на полуострове."
 portugal_diplomacy.8.a: "Триумф общего процветания"

 #9 berlin

 #Friendship with Brazil
 portugal_diplomacy.13.t: "Дружба с Бразилией"
 portugal_diplomacy.13.d: "[FROM.GetNameDef] обратился к нам с предложением обновить договор о дружбе между Португалией и Бразилией. Лиссабон подчёркивает давние культурные и исторические связи между нашими нациями и предлагает расширить дипломатическое, экономическое и культурное сотрудничество."
 portugal_diplomacy.13.a: "Мы с радостью принимаем"
 portugal_diplomacy.13.b: "Мы должны пока отказаться"

 #Friendship with Brazil Accepted
 portugal_diplomacy.14.t: "Дружба укреплена"
 portugal_diplomacy.14.d: "[FROM.GetNameDef] принял наше предложение. Это обновление сближает наши нации, способствуя сотрудничеству в дипломатии, торговле и культуре, укрепляя нашу историческую связь."
 portugal_diplomacy.14.a: "Положительный шаг для нашего общего будущего"

 #Friendship with Brazil Declined
 portugal_diplomacy.15.t: "Предложение отклонено"
 portugal_diplomacy.15.d: "[FROM.GetNameDef] отклонил наше предложение в это время. Хотя это разочаровывает, давняя дружба и общее наследие между нашими нациями остаются нерушимыми."
 portugal_diplomacy.15.a: "Неудача, но связи сохраняются"

 #Silk Road Sinech Chinese
 portugal_diplomacy.16.t: "Шёлковый путь Синеш"
 portugal_diplomacy.16.d: "[FROM.GetNameDef] обратился к нам с предложением сотрудничать в рамках инициативы «Один пояс, один путь». В рамках этого плана они предлагают инвестировать в порт Синеш, подчёркивая возможности для торговли и культурного обмена."
 portugal_diplomacy.16.a: "Мы с радостью принимаем"
 portugal_diplomacy.16.b: "Мы должны пока отказаться"

 #Silk Road Sinech Chinese Accepted
 portugal_diplomacy.17.t: "Сотрудничество укреплено"
 portugal_diplomacy.17.d: "[FROM.GetNameDef] принял наше предложение инвестировать в порт Синеш в рамках инициативы «Один пояс, один путь». Это укрепляет наши связи и способствует сотрудничеству в торговле, дипломатии и культуре."
 portugal_diplomacy.17.a: "Положительный шаг для нашего общего будущего"
 portugal_diplomacy.19.t: "[POR.GetNameWithFlag] предлагает ресурсную сделку"
 portugal_diplomacy.19.d: "Правительство Португалии предложило ресурсное соглашение относительно нашей нефти, направленное на координацию добычи и торговли на взаимовыгодных условиях."
 portugal_diplomacy.19.a: "Согласны"
 portugal_diplomacy.19.b: "Отклонить"
 portugal_diplomacy.20.t: "[FROM.GetNameWithFlag] ратифицировал ресурсную сделку"
 portugal_diplomacy.20.d: "Ресурсная сделка была ратифицирована. Это соглашение обеспечивает скоординированную эксплуатацию нашей нефти, укрепляя наши позиции на международных рынках."
 portugal_diplomacy.20.a: "Отлично"
 portugal_diplomacy.21.t: "[FROM.GetNameWithFlag] отказался от ресурсной сделки"
 portugal_diplomacy.21.d: "Они отклонили предложенное ресурсное соглашение. Координация добычи нефти не будет продолжаться в это время."
 portugal_diplomacy.21.a: "Досадно"
 portugal_diplomacy.22.t: "[POR.GetNameWithFlag] предлагает соглашение о научном сотрудничестве"
 portugal_diplomacy.22.d: "Правительство [POR.GetAdjective] предложило двустороннее соглашение о научно-техническом сотрудничестве, направленное на содействие совместным исследованиям, академическому обмену и инновациям на взаимовыгодных условиях."
 portugal_diplomacy.22.a: "Согласиться"
 portugal_diplomacy.22.b: "Отклонить"
 portugal_diplomacy.23.t: "[FROM.GetNameWithFlag] ратифицировал соглашение о научном сотрудничестве"
 portugal_diplomacy.23.d: "Соглашение о научном сотрудничестве было ратифицировано. Эта структура будет способствовать совместным исследовательским инициативам, обмену знаниями и технологическому развитию, укрепляя наше долгосрочное партнёрство."
 portugal_diplomacy.23.a: "Отлично"
 portugal_diplomacy.24.t: "[FROM.GetNameWithFlag] отказался от соглашения о научном сотрудничестве"
 portugal_diplomacy.24.d: "Они отклонили предложенное соглашение о научном сотрудничестве. Планы по совместным исследованиям и технологическому сотрудничеству не будут продолжаться в это время."
 portugal_diplomacy.24.a: "Досадно"
 portugal_diplomacy.25.t: "Приглашение в CPLP"
 portugal_diplomacy.25.d: "[FROM.GetNameDef] направил официальное приглашение Португалии присоединиться к Сообществу португалоязычных стран (CPLP). Эта организация, основанная в 1996 году, направлена на углубление дружбы и сотрудничества между португалоязычными странами - Анголой, Бразилией, Кабо-Верде, Гвинеей-Бисау, Мозамбиком, Сан-Томе и Принсипи и Восточным Тимором. Членство укрепит наши культурные и экономические связи с португалоязычным миром и усилит наше глобальное влияние."
 portugal_diplomacy.25.a: "Мы с радостью принимаем это историческое приглашение."
 portugal_diplomacy.25.b: "Мы должны отказаться - пока."
 portugal_diplomacy.26.t: "[FROM.GetNameDef] присоединяется к CPLP"
 portugal_diplomacy.26.d: "[FROM.GetNameDef] официально принял наше приглашение и присоединился к Сообществу португалоязычных стран. Как новый член, они будут участвовать в нашей дипломатической координации, торговых партнёрствах и программах культурного обмена. Соглашение о мобильности CPLP теперь распространяется на их граждан, студентов и рабочих, укрепляя узы, объединяющие португалоязычный мир."
 portugal_diplomacy.26.a: "Добро пожаловать в лузофонскую семью."
 portugal_diplomacy.27.t: "Приглашение вступить в CPLP отклонено"
 portugal_diplomacy.27.d: "[FROM.GetNameDef] вежливо отклонил наше приглашение присоединиться к Сообществу португалоязычных стран. Выражая признательность за предложение, они ссылаются на внутренние приоритеты как на причину отсрочки членства. Наши дипломатические каналы остаются открытыми для будущего сотрудничества."
 portugal_diplomacy.27.a: "Мы уважаем их решение."
 portugal_diplomacy.28.t: "[FROM.GetNameWithFlag] предлагает стать субъектом федерализации"
 portugal_diplomacy.28.d: "Португальское правительство, кажется, сходит с ума, и они предлагают нам ультиматум присоединиться к их так называемой федерации. Поскольку это ультиматум, мы должны рассмотреть последствия."
 portugal_diplomacy.28.a: "Они победили"
 portugal_diplomacy.28.b: "Нет"
 portugal_diplomacy.29.t: "[FROM.GetNameWithFlag] согласился стать субъектом нашей федерации"
 portugal_diplomacy.29.d: "Кажется, у них есть голос разума - они согласились стать частью нашей великой федерации."
 portugal_diplomacy.29.a: "Отлично"
 portugal_diplomacy.30.t: "[FROM.GetNameWithFlag] отказался стать нашим субъектом"
 portugal_diplomacy.30.d: "Похоже, они решили отказать нам, поэтому нам придётся найти другой способ решения этой проблемы."
 portugal_diplomacy.30.a: "Они пожалеют об этом."
 portugal_diplomacy.31.t: "Вооружённое восстание в столице страны!"
 portugal_diplomacy.31.d: "В столичном регионе произошло вооружённое восстание. Весь регион охвачен боями между правительственными силами и сторонниками некоего «Тоуто», государства, которое эти террористы объявили в регионе."
 portugal_diplomacy.31.a: "Они пожалеют об этом."
 portugal_diplomacy.33.t: "Вооружённое восстание в Гоа"
 portugal_diplomacy.33.d: "В нашем регионе произошло восстание, спонсируемое португальским правительством! Они давно заявляли, что хотят вернуть былое могущество своей страны в этом регионе, и, похоже, они наконец сошли с ума, когда решили связаться с нами."
 portugal_diplomacy.33.a: "Они пожалеют об этом."
 portugal_diplomacy.34.t: "Вооружённое восстание!"
 portugal_diplomacy.34.d: "В регионе Сул и нескольких других регионах произошло вооружённое восстание, которое спонсируется Португалией! Похоже, они решили восстановить славу своей империи."
 portugal_diplomacy.34.a: "Они пожалеют об этом."

 portugal_diplomacy.35.t: "Португалия требует освободить [TIM.GetName]"
 portugal_diplomacy.35.d: "Португальское правительство требует признать независимость Восточного Тимора и прекратить оккупацию этих земель. Похоже, европейские державы начали серьёзно интересоваться нашей проблемой."
 portugal_diplomacy.35.a: "Мы согласны"
 portugal_diplomacy.35.b: "Нет"
 portugal_diplomacy.36.t: "Индонезия соглашается освободить Восточный Тимор"
 portugal_diplomacy.36.d: "Правительство Индонезии приняло наше требование. Они выведут войска из Восточного Тимора и признают его независимость. Это историческая победа дипломатии и тиморского народа, который страдал слишком долго. Португалия приветствует рождение нового государства."
 portugal_diplomacy.36.a: "Новый флаг над Дили. Да здравствует свобода."
 portugal_diplomacy.37.t: "Индонезия отказывается освободить Восточный Тимор"
 portugal_diplomacy.37.d: "Правительство Индонезии отвергло наш ультиматум. Они отказываются прекратить оккупацию Восточного Тимора, называя наше требование вмешательством во внутренние дела. Такое неповиновение не может остаться без ответа. Мы добьёмся международных санкций и передадим дело в Совет Безопасности ООН."
 portugal_diplomacy.37.a: "Это не конец"

 portugal_diplomacy.38.t: "Предложение о стратегическом партнёрстве"
 portugal_diplomacy.38.d: "[FROM.GetName] обратился к нам с предложением о стратегических инвестициях в португальскую инфраструктуру и проекты развития. Они подчёркивают, что это сотрудничество укрепит присутствие Тайваня в Европе, одновременно предотвращая чрезмерное расширение китайского влияния на континенте. Взамен они предлагают благоприятные торговые условия и долгосрочное экономическое сотрудничество."
 portugal_diplomacy.38.a: "Мудрые инвестиции в наше европейское будущее."
 portugal_diplomacy.38.b: "Риски перевешивают выгоды"

 portugal_diplomacy.39.t: "Тайваньские инвестиции подтверждены"
 portugal_diplomacy.39.d: "[FROM.GetName] официально принял наше предложение. Их капитал поступит в португальскую инфраструктуру, возобновляемую энергетику и технологические сектора - серьёзный импульс для нашего экономического развития и модернизации. Пекин отреагировал резкой критикой, предупредив о «дестабилизирующих» последствиях, но мы рассматриваем это как суверенный выбор в пользу взаимовыгодного сотрудничества."
 portugal_diplomacy.39.a: "Новая глава в португальско-тайваньских отношениях"

 portugal_diplomacy.40.t: "Предложение о сотрудничестве в области зелёной энергетики"
 portugal_diplomacy.40.d: "[FROM.GetName] предложил стратегическое партнёрство в области зелёной энергетики и совместных исследований. Соглашение фокусируется на совместных проектах в области возобновляемой энергии, чистого водорода и устойчивых технологий."
 portugal_diplomacy.40.a: "Многообещающее партнёрство для нашего энергетического будущего"
 portugal_diplomacy.40.b: "Мы должны отдавать приоритет внутренней энергетической независимости"

 portugal_diplomacy.41.t: "Португальско-японское соглашение о зелёной энергетике подтверждено"
 portugal_diplomacy.41.d: "[FROM.GetName] официально принял наше предложение. Японские инвестиции поддержат сектор возобновляемой энергетики Португалии и совместные исследовательские инициативы, укрепляя нашу позицию в глобальном энергетическом переходе и углубляя научное сотрудничество между нашими странами."
 portugal_diplomacy.41.a: "Зелёное будущее, построенное вместе"

 portugal_diplomacy.42.t: "Предложение о морском и научном сотрудничестве"
 portugal_diplomacy.42.d: "[FROM.GetName] предложил стратегическое партнёрство в области морского транспорта, портового развития и научных исследований. Соглашение фокусируется на совместных проектах в области судостроения, океанографии и морских технологий с ведущими исследовательскими институтами обеих стран."
 portugal_diplomacy.42.a: "Ценное партнёрство для нашего морского будущего."
 portugal_diplomacy.42.b: "Мы должны сосредоточиться на внутренних приоритетах."

 portugal_diplomacy.43.t: "Португальско-индийское морское соглашение подтверждено"
 portugal_diplomacy.43.d: "[FROM.GetName] официально принял наше предложение. Партнёрство будет способствовать сотрудничеству в области судостроения, портовой инфраструктуры и морских исследований с участием таких учреждений, как Goa Shipyard Ltd. и Национальный институт океанографии. Это соглашение укрепляет позиции Португалии в Атлантике и углубляет научные связи с Индией."
 portugal_diplomacy.43.a: "Вместе сильнее на морях."

 portugal_diplomacy.45.t: "Второе тайпинское восстание"
 portugal_diplomacy.45.d: "Сообщения из наших южных провинций подтверждают, что в Гуанси вспыхнуло массовое христианское восстание. Тайпинские повстанцы, сочетающие христианское учение с призывами к социальной революции, объявили «Небесное царство» и получают оружие и золото от португальцев. Португальцы явно сошли с ума - они стремятся восстановить свою империю, используя религию, чтобы разорвать Китай изнутри."
 portugal_diplomacy.45.a: "Они заплатят за это."

 portugal_diplomacy.46.t: "Португальское содружество возникло"
 portugal_diplomacy.46.d: "Сегодня [POR.GetName] объявил о преобразовании Сообщества португалоязычных стран в Португальское содружество - новый политический и экономический альянс, посвящённый углублению сотрудничества между португалоязычными странами. Государства-члены будут координировать торговлю, дипломатию и безопасность, уважая суверенитет друг друга. Этот шаг свидетельствует об амбициях Португалии усилить своё глобальное влияние через единство со своими историческими партнёрами на четырёх континентах."
 portugal_diplomacy.46.a: "Новая глава начинается для лузофонского мира"

 portugal_diplomacy.47.t: "Вооружённое восстание в Гоа"
 portugal_diplomacy.47.d: "Из Индийского субконтинента поступают сообщения, что в Гоа вспыхнуло вооружённое восстание. Сепаратистские группы, предположительно поддерживаемые иностранными спонсорами, взялись за оружие против индийских властей. Ситуация остаётся неясной, но регион теперь в открытом мятеже."
 portugal_diplomacy.47.a: "Новая точка напряжённости в Азии"

 portugal_diplomacy.48.t: "Революция в Японии"
 portugal_diplomacy.48.d: "Япония погрузилась в хаос, поскольку националистические силы начали вооружённое восстание против правительства. Используя экономическую стагнацию и социальное недовольство, которые накапливались на протяжении всего «Потерянного десятилетия», повстанческие группы захватили контроль над несколькими районами. Международное сообщество наблюдает с беспокойством за развитием событий на Дальнем Востоке."
 portugal_diplomacy.48.a: "Мир затаил дыхание"
 #PNR
 portugal_pnr.1.t: "Дилемма скинхедов"
 portugal_pnr.1.d: "Мариу Машаду, член Партии национального обновления (PNR), объединяет бывших скинхедов и радикальные элементы. Их экстремизм может укрепить влияние партии среди радикалов, но также рискует дестабилизировать её и оттолкнуть умеренных сторонников."
 portugal_pnr.1.a: "Они могут быть нам полезны"
 portugal_pnr.1.b: "Мы можем обойтись без них"

 portugal_pnr.2.t: "Предложение о покупке Сеуты"
 portugal_pnr.2.d: "Правительство Португалии обратилось к нам с официальным предложением относительно города Сеута. Ссылаясь на исторические связи и общую заинтересованность в региональной стабильности, они предлагают значительную сумму за передачу суверенитета. В предложении подчёркивается потенциал экономического сотрудничества и укрепления двусторонних отношений между нашими двумя странами."
 portugal_pnr.2.a: "Принять предложение"
 portugal_pnr.2.b: "Сеута - неотъемлемая часть Испании!"

 portugal_pnr.3.t: "[FROM.GetNameDef] принимает"
 portugal_pnr.3.d: "Мадрид согласился на наше предложение. Соглашение о Сеуте подписано, знаменуя мирную передачу города. Значительные дипломатические и финансовые обязательства, но они обеспечивают стратегическое положение Португалии на североафриканском побережье и открывают новые возможности для сотрудничества с Испанией."
 portugal_pnr.3.a: "Исторический момент для Португалии"

 portugal_pnr.4.t: "[FROM.GetNameDef] отказывает"
 portugal_pnr.4.d: "Испанское правительство отклонило наше предложение. Их ответ подтверждает статус Сеуты как неотъемлемой части Испании, ссылаясь на суверенитет и историческую преемственность. Предложение было вежливо, но твёрдо отклонено."
 portugal_pnr.4.a: "Мы уважаем их решение"

 #Chega
 portugal_chega.1.t: "Запрос о ядерной помощи"
 portugal_chega.1.d: "С приходом Chega и нового националистического правительства Португалия решила ускорить свою энергетическую независимость за счёт строительства малых модульных реакторов (SMR). Однако нам не хватает достаточного внутреннего опыта и технологий.\nМы должны выбрать стратегического партнёра, который может поставить необходимые реакторы и технические ноу-хау.\nОбратиться ли к России - проверенной ядерной державе с привлекательными предложениями - или к Китаю, который быстро развёртывает технологии SMR по всему миру?"
 portugal_chega.1.a: "Запросить помощь у России!"
 portugal_chega.1.b: "Запросить помощь у Китая!"
 portugal_chega.2.t: "[From.GetNameDef] умоляет о ядерных инвестициях"
 portugal_chega.2.d: "[From.GetAdjective] правительство просит нас о миллиардных инвестициях и технической помощи для строительства SMR на их территории."
 portugal_chega.2.a: "Инвестировать и помогать"
 portugal_chega.2.b: "Пропустить"
 portugal_chega.3.t: "[FROM.GetName] открывает кошелёк"
 portugal_chega.3.d: "[FROM.GetAdjective] деньги и эксперты приходят. Наша программа SMR спасена."
 portugal_chega.3.a: "Отлично"
 portugal_chega.4.t: "[FROM.GetName] отказывает"
 portugal_chega.4.d: "[FROM.GetAdjective] бюрократы отказались инвестировать. С этим отказом мы предоставлены сами себе."
 portugal_chega.4.a: "Тогда мы построим это сами"

 portugal_pnr.5.t: "Галисия провозглашает независимость"
 portugal_pnr.5.d: "Невероятное произошло. Наша провинция Галисия в одностороннем порядке провозгласила независимость, ссылаясь на исторические и культурные причины. Наша разведка подтверждает, что [FROM.GetNameDef] в течение нескольких месяцев активно финансировал и вооружал галисийских сепаратистов. Теперь мы сталкиваемся с ужасной дилеммой: если мы подавим это восстание силой, мы рискуем быть исключёнными из НАТО и международной изоляции. Но если мы допустим этот сепаратизм, Каталония, Страна Басков и другие обязательно последуют примеру Галисии. Что мы будем делать?"
 portugal_pnr.5.a: "Галисия - это Испания!"
 portugal_pnr.5.b: "Мы должны сохранить наши союзы"

 portugal_pnr.6.t: "Южная Италия отделяется"
 portugal_pnr.6.d: "Сокрушительный удар по итальянскому единству. Сардиния, Неаполь и Сицилия совместно провозгласили независимость. Наша разведка подтверждает, что [FROM.GetNameDef] годами тайно финансировал сепаратистские движения по всему Меццоджорно, используя экономические обиды и региональную идентичность. Теперь Рим сталкивается с невозможным выбором: начало военной кампании по возвращению юга рискует исключением из Европейского союза и НАТО, что приведёт к международным санкциям и изоляции. Но принятие этого сепаратизма создаёт смертельный прецедент - Ломбардия, Венето и другие могут вскоре потребовать своей независимости, следуя примеру юга. Что вы будете делать?"
 portugal_pnr.6.a: "Воссоединить Италию любой ценой!"
 portugal_pnr.6.b: "Мы должны сохранить наши союзы"

 portugal_pnr.7.t: "Великая Португалия провозглашена"
 portugal_pnr.7.d: "Сегодня португальское правительство объявило о провозглашении Великой Португалии после освобождения Галисии и возвращения Сеуты. Новое государство заявляет, что восстановило свои исторические границы, воссоединив то, что считает португальскими землями, под единой нацией. Провозглашение знаменует собой осуществление давних националистических чаяний территориальной экспансии."
 portugal_pnr.7.a: "Что?"

 portugal_chega.5.t: "Вопрос о запрете хиджаба"
 portugal_chega.5.d: "Было внесено предложение запретить ношение хиджаба в государственных учреждениях, школах и судах. Сторонники утверждают, что это укрепляет светский характер государства, в то время как критики утверждают, что это ущемляет гражданские свободы и может разжечь социальную напряжённость. Общественное мнение остаётся глубоко разделённым."
 portugal_chega.5.a: "Ввести запрет"
 portugal_chega.5.b: "Не вмешиваться"

 #Braganza
 portugal_braganza.1.t: "Историческая встреча королевских домов"
 portugal_braganza.1.d: "Король Дуарте Португальский, глава дома Браганса, отправился в Москву на встречу с представителем семьи Романовых. Эта церемониальная встреча укрепляет династический престиж и усиливает связи между двумя королевскими домами."
 portugal_braganza.1.a: "Примите наследие корон"

 portugal_braganza.2.t: "Португальско-сирийский королевский визит"
 portugal_braganza.2.d: "Дуарте Пиу, глава дома Браганса, отправился в Дамаск и встретился с президентом Асадом. Он описал его как «человека с очень добрым сердцем и очень благонамеренного». Визит, хотя и символический, может изменить внешнеполитический имидж Португалии и отразить возобновлённые международные амбиции королевского дома."
 portugal_braganza.2.a: "Продолжить визит"

 portugal_braganza.3.t: "Коронационная церемония"
 portugal_braganza.3.d: "Пришло время выбрать место для коронации нового монарха. Каждое возможное место несёт свою символику и политические последствия."
 portugal_braganza.3.a: "Коронация в Вила-Висоза - колыбели династии Браганса"
 portugal_braganza.3.b: "Коронация в Лиссабоне - сердце королевства"
 portugal_braganza.3.c: "Коронация в монастыре Жеронимуш - величие и традиция"

 portugal_braganza.4.t: "Португалия требует нашего подчинения"
 portugal_braganza.4.d: "Сегодня дипломаты португальского правительства обратились к нам с официальным требованием вернуть их бывшие колониальные территории. Они утверждают, что эти земли когда-то находились под португальской властью и по праву остаются частью их исторического наследия. Лиссабон настаивает, что мирные переговоры всё ещё возможны, но даёт понять, что Португалия готова отстаивать свои претензии в случае нашего отказа. Их требования можно считать ультиматумом."
 portugal_braganza.4.a: "Это лучше, чем ввязываться в войну"
 portugal_braganza.4.b: "Мы будем защищать нашу территориальную целостность!"

 portugal_braganza.5.t: "[FROM.GetName] уступает"
 portugal_braganza.5.d: "[FROM.GetName] уступает нашим требованиям. Мы получили все заявленные территории, в то время как [FROM.GetName] смог избежать войны и спасти жизни своих солдат."
 portugal_braganza.5.a: "Очень хорошо!"

 portugal_braganza.6.t: "[FROM.GetName] отказывает"
 portugal_braganza.6.d: "[FROM.GetName] отклоняет наши требования, заявляя, что готов встретить пули за свои земли. Это дерзко и наивно с их стороны, но тем не менее достойно уважения."
 portugal_braganza.6.a: "Бог знает, мы хотели сделать это мирно"

 portugal_braganza.7.t: "Предложение Иберийской унии"
 portugal_braganza.7.d: "Пиренейский полуостров был местом расположения двух величайших империй, которые когда-либо видит мир. Только представьте силу и славу, которых мы можем достичь, провозгласив этот союз. Пришло время проложить наш путь вперёд. Португалия протягивает руку Испании, предлагая не союз подчинения, а равных - истинное партнёрство для формирования нашей общей судьбы."
 portugal_braganza.7.a: "Объединить полуостров как равных"
 portugal_braganza.7.b: "Их гордость ослепляет их"
 portugal_braganza.7.c: "Лиссабон будет преклонять колени, а не договариваться!"

 portugal_braganza.8.t: "Португалия приглашает нас в свой альянс"
 portugal_braganza.8.d: "Португалия направила нам дипломатическое предложение. В рамках восстановления исторических уз братства и общего наследия они приглашают нас присоединиться к недавно сформированному Португальскому Содружеству. Этот шаг укрепит многовековые связи между нашими нациями, обещая будущее взаимного процветания и усиленного суверенитета."
 portugal_braganza.8.a: "За славу наших наций!"
 portugal_braganza.8.b: "Это не в наших интересах."

 portugal_braganza.9.t: "[FROM.GetName] согласился присоединиться к Португальскому Содружеству"
 portugal_braganza.9.d: "Сегодня дипломаты [FROM.GetAdjective] ответили на наше приглашение. Они соглашаются связать наши страны союзным договором, называемым Португальским Содружеством. Этот шаг укрепит исторические и династические связи между нашими нациями, усиливая наше общее наследие и взаимный суверенитет!"
 portugal_braganza.9.a: "За единое будущее!"

 portugal_braganza.10.t: "[FROM.GetName] отказался присоединиться к Португальскому Содружеству"
 portugal_braganza.10.d: "Сегодня дипломаты [FROM.GetAdjective] ответили на наше приглашение. Они отказались вступать в этот исторический пакт, предпочтя не возобновлять узы нашего общего наследия в это время."
 portugal_braganza.10.a: "Их суверенитет принадлежит им."

 portugal_braganza.11.t: "Королевство Португалия восстановлено"
 portugal_braganza.11.d: "Сегодня Королевство Португалия было официально восстановлено, положив конец республиканской эпохе, начавшейся в 1910 году. Корона приглашает бывшие португальские территории и португалоязычные страны присоединиться к новому политическому союзу, основанному на общей истории, языке и культуре."
 portugal_braganza.11.a: "Да здравствует король"

 portugal_braganza.12.t: "[FROM.GetName] предлагает восстановить Соединённое королевство"
 portugal_braganza.12.d: "Лиссабон сделал нашей нации историческое предложение. Призывая дух Соединённого королевства короля Жуана VI 1815 года, [FROM.GetName] предлагает восстановление трансатлантического союза под португальской короной - федерацию равных португалоязычных наций, разделяющих общего суверена при сохранении автономного управления. Наше правительство должно решить, принять ли это предложение и воссоединиться с нашими португальскими братьями."
 portugal_braganza.12.a: "Да здравствует Соединённое королевство"
 portugal_braganza.12.b: "Наш суверенитет не подлежит обсуждению"

 portugal_braganza.13.t: "Провозглашение Пятой Империи"
 portugal_braganza.13.d: "Сегодня португальское правительство объявило о создании Пятой Империи - глобальной португальской империи с духовной и светской властью. Вдохновлённая пророческими видениями Антониу Виейры и поэзией Фернанду Пессоа, Португалия заявляет о своей судьбе как избранной нации, которой суждено повести мир в новую эпоху. Все бывшие португальские территории и лузофонские страны призваны объединиться под руководством Лиссабона."
 portugal_braganza.13.a: "Что?"

 portugal_braganza.14.t: "Древний союз"
 portugal_braganza.14.d: "Корона Португалии обращается к нам, напоминая о старейшем дипломатическом союзе в европейской истории. Подписанный в 1386 году Виндзорский договор связал наши народы вечной дружбой и взаимной обороной. Теперь, в эти неопределённые времена, [FROM.GetNameDef] предлагает подтвердить этот священный пакт. Они просят гарантии взаимной обороны и военный доступ, предлагая то же самое в ответ. Встанем ли мы на сторону нашего старейшего союзника?"
 portugal_braganza.14.a: "Почтить древние узы"
 portugal_braganza.14.b: "Прошлое лучше оставить в прошлом."

 portugal_braganza.15.t: "Виндзорский договор подтверждён"
 portugal_braganza.15.d: "Наш ответ достиг Лиссабона. Португальская корона приветствует наше решение возобновить Виндзорский договор. Гарантии взаимной обороны и военный доступ теперь действуют, вновь связывая наши страны в союзе, созданном более шести веков назад. Пусть этот союз длится так же долго, как и моря."
 portugal_braganza.15.a: "Новая глава в старейшем союзе"

 portugal_braganza.16.t: "Соединённое королевство восстановлено"
 portugal_braganza.16.d: "Лиссабон объявляет о восстановлении Соединённого королевства Португалии, Бразилии и Алгарви - трансатлантического союза лузофонских наций под португальской короной. Следуя видению короля Жуана VI от 1815 года, Бразилия, Ангола, Мозамбик и другие португалоязычные земли приглашены присоединиться как равноправные члены, а не колонии. Новое королевство будет иметь общего суверена, сохраняя при этом автономные правительства. Европейские правительства с удивлением реагируют на смелое монархическое возрождение Португалии."
 portugal_braganza.16.a: "What?"

 portugal_braganza.17.t: "В Китае вспыхнуло второе восстание тайпинов"
 portugal_braganza.17.d: "Сообщения с юга Китая подтверждают, что в провинции Гуанси вспыхнуло крупное восстание. Самопровозглашённые тайпинские повстанцы, вдохновлённые синкретической христианской идеологией, провозгласили восстановление «Небесного царства» и бросили вызов власти центрального правительства. Международные наблюдатели отмечают, что повстанцы, похоже, получают внешнюю поддержку, а улики указывают на португальское вмешательство. Пекин осудил иностранное вмешательство во внутренние дела страны."
 portugal_braganza.17.a: "Новый кризис на Дальнем Востоке"

 portugal_commi.1.t: "Предложение по экспорту стали от [POR.GetNameDef]"
 portugal_commi.1.d: "Коммунистическое руководство [POR.GetNameDef] предлагает нам соглашение об экспорте стали под государственным контролем. Сделка обеспечит стабильные поставки стали, поддержит государственную промышленность и гарантирует занятость в национализированном сталелитейном секторе."
 portugal_commi.1.a: "Принять предложение"
 portugal_commi.1.b: "Отклонить сделку"

 portugal_commi.2.t: "Соглашение об экспорте стали принято"
 portugal_commi.2.d: "[FROM.GetNameDef] принял соглашение об экспорте стали, обеспечив стабильные поставки и укрепив промышленные связи."
 portugal_commi.2.a: "Хорошо"

 portugal_commi.4.t: "Из Лиссабона во Владивосток"
 portugal_commi.4.d: "[POR.GetName] предлагает взаимные гарантии и военный доступ. Это шаг к нашей давней мечте объединить континент под нашим видением."
 portugal_commi.4.a: "Принять их предложение"
 portugal_commi.4.b: "Отклонить предложение"

 portugal_commi.5.t: "[FROM.GetName] соглашается"
 portugal_commi.5.d: "[FROM.GetName] принял наше предложение. Они соглашаются на взаимные гарантии и военный доступ, разделяя наши исторические устремления."
 portugal_commi.5.a: "Очень хорошо"

 portugal_commi.6.t: "[FROM.GetName] отказывается"
 portugal_commi.6.d: "[FROM.GetName] отклоняет наше предложение, решив идти своим путём. Смело, конечно, но мы должны уважать их выбор."
 portugal_commi.6.a: "Да будет так"

 portugal_commi.7.t: "Предложение об аренде Макао"
 portugal_commi.7.d: "Наши товарищи из революционного правительства [POR.GetAdjective] выдвинули прагматичное предложение по Макао. Ссылаясь на его уникальную колониальную историю, они официально просят 50-летнюю аренду для управления территорией. Они представляют это как акт социалистического реализма: обеспечение стабильности для оставшегося португальского населения и его экономических интересов при явном признании конечного суверенитета Китая. Предлагается значительный единовременный платёж."
 portugal_commi.7.a: "Предоставить 50-летнюю аренду"
 portugal_commi.7.b: "Макао - неотъемлемая часть Китая!"

 portugal_commi.8.t: "[FROM.GetName] соглашается"
 portugal_commi.8.d: "Пекин принял наше предложение, руководствуясь духом социалистической солидарности и исторического прагматизма. Соглашение подписано: Макао перейдёт под наше управление на 50 лет, при этом китайский суверенитет будет официально признан. Дипломатическая победа. Мы закрепляемся в Азии и получаем мост к социалистическому миру."
 portugal_commi.8.a: "Начинается новая глава для Макао"

 portugal_commi.9.t: "[FROM.GetNameDef] отказывается"
 portugal_commi.9.d: "Ответ из Пекина был жёстким. Они считают любое иностранное управление, даже со стороны братского социалистического государства, несовместимым с необходимостью национального воссоединения."
 portugal_commi.9.a: "So be it"

 portugal_commi.10.t: "Провозглашена Народная Республика Португалия"
 portugal_commi.10.d: "Сегодня революционные силы в Лиссабоне объявили о создании Народной Республики Португалия. Новое правительство, возглавляемое Португальской коммунистической партией, обещает построить социалистическое государство, основанное на рабочей демократии, национализации ключевых отраслей и тесном сотрудничестве с братскими социалистическими странами. Этот шаг стал итогом многих лет политической нестабильности и ознаменовал радикальный поворот в развитии страны."
 portugal_commi.10.a: "Революция идёт вперёд"

 portugal_commi.11.t: "Сформирована Иберийская социалистическая республика"
 portugal_commi.11.d: "Португалия и Испания объединились в Иберийскую социалистическую республику - федерацию рабочих республик, охватывающую весь полуостров. Слияние, воспринятое обоими правительствами как итог десятилетий пролетарского интернационализма, создаёт новый мощный блок на юго-западе Европы. Новое государство будет координировать экономическое планирование, оборону и внешнюю политику в рамках единой социалистической структуры."
 portugal_commi.11.a: "Единство иберийского пролетариата"

 portugal_ps.1.t: "[FROM.GetName] просит облегчения долгового бремени"
 portugal_ps.1.d: "[FROM.GetName] попросил нас оказать финансовую помощь, чтобы помочь [FROM.GetName] снизить долговое бремя и сохранить соответствие Маастрихтским критериям."
 portugal_ps.1.a: "Предоставить ограниченную помощь по долгам"
 portugal_ps.1.b: "Отказать в финансовой поддержке"

 portugal_ps.2.t: "Помощь по долгам предоставлена"
 portugal_ps.2.d: "[FROM.GetName] согласился оказать нам ограниченную финансовую поддержку, помогая снизить долговое бремя и сохранить соответствие Маастрихтским критериям."
 portugal_ps.2.a: "Принять поддержку"

 portugal_ps.3.t: "В запросе отказано"
 portugal_ps.3.d: "[FROM.GetName] отказал в помощи, настаивая на том, что приоритет должны иметь финансовая дисциплина и внутренние реформы."
 portugal_ps.3.a: "Мы справимся сами"

 portugal_ps.4.t: "Референдум об абортах в [POR.GetAdjective]"
 portugal_ps.4.d: "[GetDateText] народ [POR.GetAdjective] провёл референдум о легализации добровольного прерывания беременности до 10 недель."
 portugal_ps.4.a: "Референдум успешен"
 portugal_ps.4.b: "Референдум провален"

 portugal_ps.5.t: "Национальный конгресс"
 portugal_ps.5.d: "Социалистическая партия проводит свой Национальный конгресс, чтобы определить направление своей повестки на ближайшие годы. Делегаты обсуждают ключевые приоритеты, и руководство партии должно выбрать путь вперёд."
 portugal_ps.5.a: "Приоритет социальной политики"
 portugal_ps.5.b: "Фокус на экономической эффективности"
 portugal_ps.5.c: "Борьба с коррупцией"

 #Army
 portugal_army.1.t: "Инициатива сотрудничества с NSPA"
 portugal_army.1.d: "Сталкиваясь с ограниченными внутренними ресурсами, Португалия обратилась к нам через NSPA с запросом на инвестиции и техническое сотрудничество для модернизации своих военно-морских портов. Предложение обещает быстрый прирост мощностей для португальской инфраструктуры, одновременно расширяя наше влияние на оборонное планирование Португалии."
 portugal_army.1.a: "Принять сотрудничество с NSPA"
 portugal_army.1.b: "Вежливо отказаться"

 portugal_army.2.t: "Инициатива сотрудничества с NSPA – принята"
 portugal_army.2.d: "Запрос, поддержанный NSPA, был одобрен [FROM.GetName]. Будут предоставлены инвестиции и техническая помощь для модернизации выбранного португальского военно-морского объекта, а также укреплено сотрудничество в области закупок и логистики."
 portugal_army.2.a: "Приступить к реализации"

 portugal_army.3.t: "Инициатива сотрудничества с NSPA – отклонена"
 portugal_army.3.d: "[FROM.GetName] отклонил предложение NSPA. Мы сохраняем полную независимость в вопросах закупок и бюджетирования, но это решение откладывает возможность быстрого наращивания мощностей и получения внешней технической помощи. Усилия по модернизации будут продолжены, но более медленными темпами и за собственный счёт."
 portugal_army.3.a: "Досадно"

 portugal_army.4.t: "Продажа танков Leopard 2A5NL"
 portugal_army.4.d: "[HOL.GetNameDef] предложил продать 60 основных боевых танков Leopard 2A5NL [POR.GetNameDef] за $5 миллиардов. Эти немецкие танки - одни из самых совершенных в мире, обладающие отличной огневой мощью, защитой и мобильностью. Leopard 2A5NL значительно усилит наши бронетанковые силы и предоставит нам современные, надёжные основные боевые танки. Эта покупка укрепит наш военный потенциал и отношения с [HOL.GetNameDef]."
 portugal_army.4.a: "Продать танки Leopard 2A5NL"
 portugal_army.4.b: "Отклонить предложение о покупке танков"

 portugal_army.5.t: "Покупка танков Leopard 2A5NL одобрена"
 portugal_army.5.d: "Покупка 60 основных боевых танков Leopard 2A5NL у [HOL.GetNameDef] одобрена. Эти современные немецкие танки значительно усилят наши бронетанковые силы, предоставив нам современные, надёжные основные боевые танки с отличной огневой мощью, защитой и мобильностью. Приобретение укрепляет наш военный потенциал и демонстрирует нашу приверженность модернизации вооружённых сил с помощью высококачественного оборудования."
 portugal_army.5.a: "Наши бронетанковые силы будут грозными"

 portugal_army.6.t: "Покупка танков Leopard 2A5NL отклонена"
 portugal_army.6.d: "Мы решили отклонить предложение о покупке танков Leopard 2A5NL у [HOL.GetNameDef]. Хотя эти танки значительно усилили бы наши бронетанковые силы, мы предпочли сосредоточить ресурсы на других приоритетах нашей программы военной модернизации. Мы продолжим изучать другие варианты модернизации наших танковых сил."
 portugal_army.6.a: "Мы найдём другие решения"

 portugal_army.7.t: "Продажа Pandur II"
 portugal_army.7.d: "[AUS.GetNameDef] предложил продать 100 машин Pandur II [POR.GetNameDef] за $2 миллиарда. Эти колёсные машины обеспечивают отличную мобильность, быстрое передвижение по дорогам и защищённую транспортировку для нашей пехоты. Приобретение 100 Pandur II укрепит наши механизированные возможности, а также усилит оборонные связи с [AUS.GetNameDef]."
 portugal_army.7.a: "Продать 100 Pandur II"
 portugal_army.7.b: "Отклонить предложение"

 portugal_army.8.t: "Покупка Pandur II одобрена"
 portugal_army.8.d: "Приобретение 100 машин Pandur II у [AUS.GetNameDef] одобрено. Эти машины улучшат нашу мобильность и защищённую транспортировку войск, предоставив нашим силам большую оперативную гибкость на дорогах и в конфликтах низкой интенсивности. Сделка также укрепляет оборонное сотрудничество с [AUS.GetNameDef] и знаменует собой шаг вперёд в модернизации наших механизированных подразделений."
 portugal_army.8.a: "Это модернизирует наши механизированные силы"

 portugal_army.9.t: "Покупка Pandur II отклонена"
 portugal_army.9.d: "Мы решили отклонить предложение [AUS.GetNameDef] о покупке 100 машин Pandur II. Хотя эти машины улучшили бы мобильность и защищённую транспортировку, мы предпочитаем сейчас сосредоточиться на других элементах оборонной программы. Мы продолжим оценивать альтернативы для усиления наших механизированных возможностей."
 portugal_army.9.a: "Мы будем искать другие варианты"

 portugal_army.10.t: "Продажа C-295"
 portugal_army.10.d: "[SPR.GetNameDef] предложил продать транспортные самолёты Airbus C-295 [POR.GetNameDef]. C-295 обеспечивает надёжные тактические воздушные перевозки и логистическую поддержку, укрепляя оборонное сотрудничество между нашими странами."
 portugal_army.10.a: "Продать C-295"
 portugal_army.10.b: "Отклонить сделку"

 portugal_army.11.t: "Покупка C-295 одобрена"
 portugal_army.11.d: "[SPR.GetNameDef] принял наш запрос и поставит транспортные самолёты Airbus C-295. Эти самолёты улучшат наши возможности по воздушным перевозкам и логистике."
 portugal_army.11.a: "Это укрепит наши возможности по воздушным перевозкам"

 portugal_army.12.t: "Покупка C-295 отклонена"
 portugal_army.12.d: "[SPR.GetNameDef] отклонил наш запрос на поставку транспортных самолётов Airbus C-295. Вместо этого будут реализованы другие оборонные приоритеты."
 portugal_army.12.a: "Мы будем искать другие варианты"

 portugal_army.13.t: "Продажа AW101 Merlin"
 portugal_army.13.d: "[ENG.GetNameDef] предложил продать вертолёты AW101 Merlin [POR.GetNameDef]. AW101 обеспечивает возможности дальних перевозок и поисково-спасательных операций, укрепляя оборонное сотрудничество между нашими странами."
 portugal_army.13.a: "Продать AW101 Merlin"
 portugal_army.13.b: "Отклонить сделку"

 portugal_army.14.t: "Покупка AW101 одобрена"
 portugal_army.14.d: "[ENG.GetNameDef] принял наш запрос и поставит вертолёты AW101 Merlin. Эти вертолёты значительно улучшат наши возможности по перевозкам и поисково-спасательным операциям."
 portugal_army.14.a: "Это укрепит наши поисково-спасательные и транспортные возможности"

 portugal_army.15.t: "Покупка AW101 отклонена"
 portugal_army.15.d: "[ENG.GetNameDef] отклонил наш запрос на поставку вертолётов AW101 Merlin. Вместо этого будут реализованы другие оборонные приоритеты."
 portugal_army.15.a: "Мы будем искать другие варианты"