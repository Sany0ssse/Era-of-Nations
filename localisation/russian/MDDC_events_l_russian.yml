l_russian:
 econvent.103.t: "Коррупционный Скандал"
 econvent.103.d: "Сегодня был арестован крайне влиятельный чиновник. Его задержали по подозрению в коррупции. В ходе обыска его собственности были обнаружены помеченые купюры и деньги, похищенные из государственного бюджета."
 econvent.103.a: "От этого не уйти…"

 econvent.104.t: "Цены выходят из-под контроля"
 econvent.104.d: "Цены на нашем рынке растут с головокружительной скоростью, и центральный банк не успевает за ситуацией. Инфляция вызывает панику среди населения, и люди скупают товары, пока они не стали ещё дороже!"
 econvent.104.a: "С этим нужно что-то делать!"

 econvent.105.t: "Цены снижаются"
 econvent.105.d: "Наши аналитики заметили, что рыночные цены начинают снижаться, инфляция падает, а жизнь людей улучшается. Следует отдать должное Центральному банку за хорошо проделанную работу!"
 econvent.105.a: "Хорошие новости!"

 econvent.106.t: "Улицы заполонили толпы людей"
 econvent.106.d: "Отсутствие стабильности спровоцировало протесты. Разгневанные толпы заполонили улицы нашей страны. Их цель - сменить руководство, поскольку они считают, что нынешнее правительство не справляется."
 econvent.106.a: "Может, они успокоятся"
 econvent.106.b: "Задействовать полицию"

 econvent.107.t: "Забастовки Рабочих"
 econvent.107.d: "Плохие условия для рабочих и проблема с оплатой их труда привели к забастовкам."

 econvent.108.t: "Низкая Дисциплина Военных"
 econvent.108.d: "Задержки в зарплатах для военных и работников ВПК отрицательно сказываются на их эффективности и производительности."

 econvent.109.t: "Коррупционный Скандал"
 econvent.109.d: "Крайне влиятельный чиновник сбежал из страны со значительным количеством украденных из бюджета средств."
 econvent.109.a: "Это печально"
 econvent.109.b: "Увеличить контроль за движением капитала"

 econvent.110.t: "Коррупционный скандал в армии"
 econvent.110.d: "При очередной инвентаризации в одной из частей армии армии не досчитались винтовок."
 econvent.110.a: "Это грустно"

 econvent.111.t: "Авария на заводе"
 econvent.111.d: "Чиновникам не стоило закрывать глаза на безопасность на производстве в обмен на взятку."
 econvent.111.a: "Это грустно"

 econvent.112.t: "Разворованы средства на строительство"
 econvent.112.d: "Одна из наших крупных строек затянулась так как выяснилось что средства на нее были разворованы."
 econvent.112.a: "Это грустно"

 econvent.113.t: "Разворованный НИОКР"
 econvent.113.d: "Средства на один из наших НИОКР были разворованы."
 econvent.113.a: "Это грустно"

 econvent.114.t: "Статьи о коррумпированности высокопоставленного чиновника"
 econvent.114.d: "В интернете распространяются статьи, в которых содержатся обвинения в коррупции в адрес высокопоставленного чиновника."
 econvent.114.a: "Провести расследование"
 econvent.114.b: "К черту СМИ, наши чиновники самые честные"

 econvent.115.t: "Статьи о коррумпированности высокопоставленного чиновника"
 econvent.115.d: "В газетах распространяются статьи, в которых содержатся обвинения в коррупции в адрес высокопоставленного чиновника."
 econvent.115.a: "Провести расследование"
 econvent.115.b: "К черту СМИ, наши чиновники самые честные"
