 eon_investment_income_collect_desc:0 "Перевести сохранённые инвестиционные средства в казну в пределах свободного места. Невыплаченный остаток сохраняется; повторное получение не создаёт второй выплаты."
 eon_investment_income_status_desc:0 "Проверить сохранённый инвестиционный остаток: [?eon_investment_unclaimed_income|3] млрд. Проверка не переводит деньги."
