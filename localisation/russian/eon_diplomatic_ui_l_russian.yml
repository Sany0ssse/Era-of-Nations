 eon_framework_negotiation_category_desc:0 "Изучайте двусторонние торговые и инвестиционные предложения и отвечайте на них. Для нового проекта договора нужны отдельное изучение и согласие. Здесь также можно управлять согласованными сроками уведомления и запросами о досрочном прекращении по взаимному согласию. Конкретные проекты и поставки сохраняют собственные обязательства."
