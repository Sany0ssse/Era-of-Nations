l_russian:
 rubber_production: "Базовое производство синтетического каучука"
 rubber_production_desc: "Базовая установка по выделению бутан-бутиленовой фракции и производству самого распространенного каучука - бутадиен-стирольного (СКД). Процесс энергоемкий, с нестабильным выходом и высоким загрязнением. Резина получается стандартного качества для массовых шин."
 rubber_production2: "Каталитическая полимеризация"
 rubber_production2_desc: "Внедрение более эффективных цеолитных катализаторов позволяет увеличить выход изооктена - ключевого компонента для производства изопренового каучука (СКИ). Резина становится более эластичной и износостойкой, что важно для улучшенных автомобильных шин."
 rubber_production3: "Комплексная переработка сырья"
 rubber_production3_desc: "Модернизация технологической цепочки для глубокой переработки тяжелого сырья с выделением широкой фракции легких олефинов. Позволяет гибко производить сырье для различных типов синтетических каучуков."
 rubber_production4: "Высокоселективные катализаторы"
 rubber_production4_desc: "Применение катализаторов нового поколения для точного контроля структуры полимерных цепей. Позволяет создавать каучуки с заданными свойствами, такие как резина с низким сопротивлением качению для энергоэффективных шин."
 rubber_production5: "Био-изопрен из возобновляемого сырья"
 rubber_production5_desc: "Организация производства мономеров (изопрена) из биомассы с использованием методов ферментации. Снижает зависимость от нефтехимического сырья в производстве синтетического каучука."
 rubber_production6: "Нано-модифицированные каучуки"
 rubber_production6_desc: "Полная автоматизация и AI-контроль полимеризации в реальном времени для идеального качества. Добавление наночастиц (кремнезема, графена) в полимерную матрицу создает сверхпрочную, термостойкую и резину для авиации, робототехники и «умных» шин."
 futuristic_rubber_production: "Футуристическое производство резины"
 futuristic_rubber_production_desc: "Использование генно-модифицированных микроорганизмов для прямого биосинтеза каучука, а также замкнутых систем химического рециклинга резинотехнических изделий. Технология обеспечивает безотходное, настраиваемое производство высококачественных эластомеров."
 CAT_rubber: "Производство резины "

