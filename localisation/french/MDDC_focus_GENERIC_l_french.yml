RULE_CORE_NO_ONE_CONINENT: "Pour personne"
RULE_CORE_NO_ONE_CONINENT_DESC: "Personne n'est autorisé à créer des cœurs avec conformité sur d'autres continents, empêchant les puissances coloniales actuelles et futures de devenir trop puissantes."
# Coring pour l'IA
ALLOW_AI_CORING: "Autoriser l'IA à créer des cœurs avec conformité"
RULE_ALLOW_AI_CORING: "Oui"
RULE_ALLOW_AI_CORING_DESC: "Permet à l'IA de créer des cœurs avec conformité."
RULE_DISABLE_AI_CORING: "Joueurs uniquement"
RULE_DISABLE_AI_CORING_DESC: "Seuls les joueurs peuvent créer des cœurs avec conformité."
grey_men_brigade_tt: "La brigade £text_icon_sov_army §YHommes gris§ ! sera §Gajoutée§ ! à notre armée pour §G60 jours§ !"
influence.502.t: "[FROM.GetNameWithFlag] souhaite envoyer une brigade dans notre pays"
influence.502.d: "Le renseignement de [FROM.GetNameWithFlag] a proposé d'envoyer des instructeurs de brigade et des spécialistes de combat pour soutenir notre pays."
influence.502.a: "Nous sommes d'accord"
influence.502.b: "Nous n'en avons pas besoin"
influence.503.t: "[FROM.GetNameWithFlag] a accepté d'admettre nos brigades"
influence.503.d: "Leur gouvernement a accepté de permettre à nos operatives de brigade de participer à leurs opérations militaires. Nous sommes prêts à fournir un soutien complet."
influence.503.a: "Bien"
influence.504.t: "[FROM.GetNameWithFlag] a refusé nos brigades"
influence.504.d: "Leur gouvernement a rejeté l'implication de nos mercenaires, la considérant comme trop intrusive dans leur système politique."
influence.504.a: "Faibles"
influence.505.t: "La brigade est rentrée chez elle"
influence.505.d: "Nos combattants ont accompli avec succès tous leurs objectifs et sont retournés en réserve."
influence.505.a: "Bien"
influence.506.t: "Services militaires de [FROM.GetName]"
influence.506.d: "[FROM.GetName] nous propose ses services militaires. Devons-nous les accepter ?"
influence.506.a: "Nous avons besoin d'une logistique efficace"
influence.506.b: "Nous avons besoin de services de renseignement supplémentaires"
influence.506.c: "Nous n'en avons pas besoin"
influence.507.t: "La question de l'exploitation économique"
influence.507.d: "Nous pouvons utiliser notre sphère d'influence pour tirer des bénéfices économiques. Que préférons-nous ?\n\nNOTE : Si vous avez un vassal, vous pouvez exploiter leur trésorerie, à condition que leur niveau de corruption ne soit pas inférieur à la moyenne."
influence.507.a: "Nous avons besoin d'industrie"
influence.507.b: "Nous prendrons leur argent"
influence.507.c: "Nous avons changé d'avis"
influence.508.t: "Notre économie est exploitée"
influence.508.d: "Le gouvernement de [FROM.GetNameWithFlag] a décidé d'utiliser son influence sur nous et a commencé à exploiter notre économie."
influence.508.a: "Merde..."
influence.508.b: "Merde..."
influence.510.t: "Stabilisation de l'État"
influence.510.d: "Malgré le coup d'État réussi qui nous a permis de prendre le pouvoir, il reste illégitime. Nous devons stabiliser l'armée, le gouvernement et la société pour maintenir notre emprise sur le pouvoir."
influence.510.a: "Bof"
influence.511.t: "Soulèvement de §Y[FROM.GetNameWithFlag]§ !"
influence.511.d: "Bien que §Y[FROM.GetNameWithFlag]§ ! soit sous notre contrôle depuis longtemps, ce qui nous donne un avantage stratégique exceptionnel, ils ont décidé de §Rse rebeller§ ! contre nous.\n\nNous devons réprimer la rébellion §Rdans les 50 jours§ !, sinon nous perdrons le contrôle de §Y[FROM.GetNameWithFlag]§ ! §Rpour toujours§ !."
influence.511.a: "Mobilisez les gars"
influence.512.t: "Guerre perdue"
influence.512.d: "Malgré une préparation minutieuse, nous n'avons pas réussi à obtenir l'indépendance. Maintenant, la population est mécontente de nous, et une période d'instabilité a commencé dans le pays."
influence.512.a: "Bof"
influence.513.t: "Nous avons gagné"
influence.513.d: "Nous avons réussi à obtenir l'indépendance dans une guerre sanglante, et maintenant la nation est prête pour une nouvelle période de son histoire."
influence.513.a: "Excellent"
influence.514.t: "Le soulèvement a été réprimé"
influence.514.d: "Nos forces armées ont réussi à réprimer le §Y[FROM.GetNameWithFlag]§ ! rebelle, et leur gouvernement a été expulsé."
influence.514.a: "Excellent"
grey_men_brigade_add_tt: "La brigade £text_icon_sov_army §YHommes gris§ ! sera §Gajoutée§ ! à leur armée pour §G60 jours§ !"
exploitation_of_industry_tt: "Nous §Grecevrons§ ! une §Gpartie de leur industrie§ ! pour une §Yannée§ !"
someone_exploited_our_industry_tt: "§RL'exploitation de notre industrie§ ! a §Rdéclenché§ ! une vague de fortes §Rprotestations§ ! dans notre pays."
we_were_robbed_tt: "§RLes échecs de la politique étrangère et intérieure ont conduit§ ! non seulement à l'§Répuisement§ ! de notre §Gtrésorerie§ !, mais aussi à une §Rsérie de protestations graves§ ! contre notre gouvernement."
recently_exploited_this_nation_TT: "N'a pas récemment exploité §H[PREV.GetNameWithFlag]§ !\n"
what_to_exploit_TT: "§Y[ROOT.GetNameWithFlag]§ ! recevra un événement §Y'La question de l'exploitation économique'§ !"
GENERIC_puppet_independence: "Déclarer l'indépendance"
GENERIC_war_for_independence: "Établir notre souveraineté"
GENERIC_puppet_reduce_autonomy: "§YRéduction massive§ ! de l'autonomie dans §Y[FROM.GetNameWithFlag]§ !"
formable_nations.1.t: "[FROM.GetNameWithFlag] propose l'unification"
formable_nations.1.d: "[FROM.GetNameWithFlag] déclare qu'ensemble, nos nations deviendront beaucoup plus fortes que si nous vivons séparément."
formable_nations.1.a: "Nous sommes prêts pour une intégration complète"
formable_nations.1.b: "Nous nous unirons sur la base de l'autonomie"
formable_nations.1.c: "Nous resterons indépendants"
formable_nations.2.t: "Le gouvernement de [FROM.GetNameWithFlag] a accepté une intégration complète"
formable_nations.2.d: "Heureusement pour nous, le gouvernement de [FROM.GetNameWithFlag] a décidé de s'intégrer pleinement à notre État, ce qui est devenu un symbole du désir de leur peuple de se réunir avec nous. Cependant, malgré ce succès, cette intégration aura un impact sérieux sur l'état de l'économie et des autres institutions étatiques tout au long de la période d'intégration."
formable_nations.2.a: "Bien"
formable_nations.3.t: "Le gouvernement de [FROM.GetNameWithFlag] a accepté l'unification sur la base de l'autonomie"
formable_nations.3.d: "Le gouvernement de [FROM.GetNameWithFlag] a accepté de s'unir avec nous sur la base de l'autonomie afin d'éviter une éventuelle oppression des droits de leurs citoyens par notre direction, ainsi que pour montrer que cette union serait construite sur des droits égaux."
formable_nations.3.a: "Bien"
formable_nations.4.t: "[FROM.GetNameWithFlag] a refusé de s'unir avec nous"
formable_nations.4.d: "Malgré notre influence politique sur eux, ils ont quand même décidé que nous ne sommes pas le facteur qui déterminera leur avenir."
formable_nations.4.a: "Bof"
formable_nations.4.b: "Assez de discussions, place à la démocratie !"
has_border_to_expand_TT: "Vous devez avoir une §Rfrontière commune§ ! pour §Rvous étendre de manière agressive§ !"
