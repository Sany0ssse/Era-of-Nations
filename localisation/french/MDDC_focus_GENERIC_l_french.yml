BLT_aggressive_expansion: "Expansion agressive"
BLT_peaceful_expansion: "Expansion pacifique"
BLT_coup: "Préparer un coup d'État"
formable_nations.5.t: "Les communistes déclenchent un soulèvement"
formable_nations.5.d: "En raison d'erreurs dans le renseignement étranger et intérieur, nous avons négligé les préparatifs d'un soulèvement dans notre pays, ce qui a conduit à une guerre civile à grande échelle."
formable_nations.5.a: "Merde"
formable_nations.6.t: "Coup d'État réussi dans [FROM.GetNameWithFlag]"
formable_nations.6.d: "Grâce à notre préparation minutieuse, nous avons réussi à inciter le peuple de [FROM.GetNameWithFlag] à se soulever contre leur gouvernement. Il ne nous reste plus qu'à les aider de notre mieux pour que nos efforts ne soient pas vains."
formable_nations.6.a: "Bien"
