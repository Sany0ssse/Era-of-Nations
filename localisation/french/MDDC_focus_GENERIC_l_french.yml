##########ARBRE MILITAIRE##########
##########Focus##########
GENERIC_army_start: "Nos forces armées"
GENERIC_army_start_desc: "Il est nécessaire de réformer notre armée pour qu'elle réponde davantage aux normes du XXIe siècle."
GENERIC_army_ground_troops: "Troupes terrestres"
GENERIC_army_ground_troops_desc: "Les troupes terrestres sont le cœur de toute armée, et nous devons nous assurer que ce cœur est toujours équipé du meilleur matériel et des meilleurs soldats."
GENERIC_army_engineer: "Troupes du génie"
GENERIC_army_engineer_desc: "Toute armée a besoin de bonnes unités du génie pour surmonter les fortifications ennemies et préparer efficacement la défense de son territoire."
GENERIC_army_exercises: "Exercices militaires"
GENERIC_army_exercises_desc: "Des exercices intensifs améliorent la préparation au combat et la coordination des unités, garantissant que nos forces performent parfaitement sous pression."
GENERIC_army_anti_air_build: "Installations de défense antiaérienne"
GENERIC_army_anti_air_build_desc: "Il est nécessaire de protéger le ciel contre les aéronefs ennemis, ce qui signifie qu'il est temps d'investir dans la défense antiaérienne."
GENERIC_army_anti_air: "Troupes de défense antiaérienne"
GENERIC_army_anti_air_desc: "Non seulement au sol, notre armée doit combattre l'ennemi, nous devons également être prêts à repousser l'ennemi dans les airs."
GENERIC_army_fortress: "Nouvelles fortifications"
GENERIC_army_fortress_desc: "Nous construirons de nouvelles fortifications, ce qui nous permettra de nous défendre plus efficacement."
GENERIC_army_hub: "Centre logistique"
GENERIC_army_hub_desc: "La logistique est l'oxygène de toute armée, et nous avons l'intention de la développer."
GENERIC_army_doctrine: "Innovations en doctrine terrestre"
GENERIC_army_doctrine_desc: "La guerre moderne exige de l'adaptation. En mettant à jour nos doctrines avec de nouvelles stratégies et technologies, nous pouvons garantir que nos forces restent efficaces et prêtes pour les conflits futurs."
GENERIC_army_uniform: "Améliorations des uniformes"
GENERIC_army_uniform_desc: "Améliorer les uniformes militaires augmente le confort, la durabilité et l'adaptabilité à divers environnements de combat."
GENERIC_army_equip: "Développement d'équipements d'infanterie"
GENERIC_army_equip_desc: "Faire progresser les équipements d'infanterie garantit que nos soldats disposent d'outils de pointe, améliorant leur efficacité et leur survivabilité sur le champ de bataille."
GENERIC_army_armor: "Développement d'équipements d'infanterie"
GENERIC_army_armor_desc: "Faire progresser les équipements d'infanterie garantit que nos soldats disposent d'outils de pointe, améliorant leur efficacité et leur survivabilité sur le champ de bataille."
GENERIC_army_anti_armor: "Contre-mesures contre les unités blindées"
GENERIC_army_anti_armor_desc: "Développer des tactiques et des armes efficaces pour contrer les blindés ennemis nous permet de neutraliser leurs unités lourdes efficacement."
GENERIC_army_artillery: "Expérimentations d'artillerie"
GENERIC_army_artillery_desc: "Tester de nouveaux systèmes et techniques d'artillerie améliore la précision, la puissance de feu et l'adaptabilité sur le champ de bataille moderne."
GENERIC_army_education: "Réforme de l'éducation militaire"
GENERIC_army_education_desc: "Moderniser l'éducation militaire forme des leaders plus forts, des stratèges plus affûtés et une force capable de relever les défis contemporains."
GENERIC_army_peacekeepers: "Bataillon de maintien de la paix"
GENERIC_army_peacekeepers_desc: "Nous sommes prêts à participer à des missions de maintien de la paix à travers le monde, et nos combattants sont prêts à accomplir leur devoir international."
GENERIC_army_transport_avia: "Aviation de transport"
GENERIC_army_transport_avia_desc: "Nous devons développer notre aviation de transport comme une voie alternative pour acheminer nos troupes."
GENERIC_army_vdv: "Bataillons aéroportés"
GENERIC_army_vdv_desc: "Les bataillons amphibies doivent être développés, car une opération amphibie bien organisée peut complètement changer la situation sur le front."
GENERIC_army_pilots: "Augmenter la formation des pilotes"
GENERIC_army_pilots_desc: "Nos pilotes doivent devenir des as de l'air, nous augmenterons donc leur temps de formation."
GENERIC_army_airport: "Nouvelle base aérienne"
GENERIC_army_airport_desc: "L'aviation doit être basée quelque part, nous avons donc l'intention de créer une nouvelle base aérienne."
GENERIC_fleet_guard: "Gardiens de nos côtes"
GENERIC_fleet_guard_desc: "Nous avons l'intention d'augmenter la recherche dans le domaine du développement de flottilles à petite échelle, car les côtes ne doivent pas être protégées uniquement par des croiseurs géants."
GENERIC_fleet_morpehi: "Corps des Marines"
GENERIC_fleet_morpehi_desc: "Aucune marine forte ne peut se passer de Marines, et nous avons l'intention de créer notre propre corps des Marines."
GENERIC_army_sso: "Forces d'opérations spéciales"
GENERIC_army_sso_desc: "Toute armée a besoin d'unités d'élite, nous sommes donc prêts à annoncer la création de nos propres forces d'opérations spéciales."
GENERIC_last_war_volunteers: "Volontaires au front"
GENERIC_last_war_volunteers_desc: "Il y a ceux qui sont prêts à se précipiter immédiatement pour défendre leur pays sans attendre que la patrie les appelle."
GENERIC_last_war_stand: "Jusqu'au dernier souffle"
GENERIC_last_war_stand_desc: "Nous ne perdrons pas, nous ne nous rendrons pas, l'ennemi ne nous vaincra pas."
