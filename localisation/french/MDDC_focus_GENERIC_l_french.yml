##########ARBRE POLITIQUE##########
##########Focus##########
###########Islamistes#########
GENERIC_torjestvo_jihad: "Triomphe du Jihad"
GENERIC_torjestvo_jihad_desc: "Le salafisme triomphe désormais dans notre pays, loué soit Allah !"
GENERIC_call_intern_jihadis: "Appel aux jihadistes internes"
GENERIC_call_intern_jihadis_desc: "Nous devons lancer un appel pour que tous les jihadistes fidèles soient désormais les bienvenus dans notre pays."
GENERIC_bring_muftis: "Faire venir des muftis"
GENERIC_bring_muftis_desc: "Nous devons purifier notre umma des faux prêtres et faire venir de véritables muftis salafistes qui partageront nos idées."
GENERIC_crush_mushriqs: "Écraser les mushriqs"
GENERIC_crush_mushriqs_desc: "Les mushriqs sont les pires de tous et nous devons leur donner une leçon."
GENERIC_declare_malikate: "Déclarer un malikate"
GENERIC_declare_malikate_desc: "Nous nous déclarerons un malikate, à l'image du système saoudien."
GENERIC_medrese_propaganda: "Propagande des madrasas"
GENERIC_medrese_propaganda_desc: "Nous devons utiliser diverses madrasas pour propager nos idées parmi la population."
GENERIC_ensure_ties_with_saudis: "Renforcer les liens avec les Saoudiens"
GENERIC_ensure_ties_with_saudis_desc: "Les Saoudiens ont montré au monde que le salafisme peut être durable, et nous suivrons leurs pas."
GENERIC_religious_fanaticism: "Fanatisme religieux"
GENERIC_religious_fanaticism_desc: "Nous devons obliger chaque personne dans notre pays à être la plus fidèle et pure dans ses pensées et ses actes."
GENERIC_inghimasi: "Inghimasi"
GENERIC_inghimasi_desc: "Ceux qui le souhaitent peuvent se porter volontaires pour devenir martyrs en cas de guerre."
GENERIC_unify_caliphate: "Unifier le califat"
GENERIC_unify_caliphate_desc: "Nous sommes le véritable califat et nous devons le montrer au monde entier."
GENERIC_taqfir_to_infidels: "Takfir aux infidèles"
GENERIC_taqfir_to_infidels_desc: "Les infidèles doivent marcher au bord de la route lorsque nous passons. Ils doivent trembler, craindre et être soumis."
GENERIC_effective_jizya: "Jizya efficace"
GENERIC_effective_jizya_desc: "Nous devons rendre notre taxe de jizya sur les infidèles non seulement humiliante, mais aussi efficace."
GENERIC_government_sharia: "Charia gouvernementale"
GENERIC_government_sharia_desc: "La charia doit être la base de notre constitution et de notre code de lois."
##########Islamistes modérés##########
GENERIC_brothers_muslims: "Frères musulmans au pouvoir"
GENERIC_brothers_muslims_desc: "La Société des Frères musulmans, mieux connue sous le nom de Frères musulmans, est une organisation islamiste sunnite transnationale fondée en Égypte par l'érudit islamique, imam et enseignant Hassan al-Banna en 1928."
GENERIC_international_relations: "Établir des relations internationales"
GENERIC_international_relations_desc: "Nous devons utiliser tout notre réseau international d'organisations pour diffuser les idées des Frères musulmans."
GENERIC_state_islam: "Islam d'État"
GENERIC_state_islam_desc: "L'islam doit être la base de notre État et de nos lois."
GENERIC_qatar_foundations: "Fondation du Qatar"
GENERIC_qatar_foundations_desc: "Le Qatar est l'un des principaux acteurs du financement des Frères musulmans. Nous devons en tirer parti."
GENERIC_islamic_democracy: "Démocratie islamique"
GENERIC_islamic_democracy_desc: "Nous devons combiner l'islam avec la démocratie dans une symphonie harmonieuse."
GENERIC_moderate_emirate: "Émirat modéré"
GENERIC_moderate_emirate_desc: "Nous devons prendre l'exemple du Qatar en combinant l'islam avec des politiques modérées."
GENERIC_support_hamas: "Soutenir le Hamas"
GENERIC_support_hamas_desc: "Nous devons soutenir le Hamas contre les méfaits d'Israël et rapprocher la libération de la Palestine."
GENERIC_propaganda_bases: "Bases de propagande"
GENERIC_propaganda_bases_desc: "Nous devons soutenir et établir des bases de propagande des Frères musulmans dans tout le monde islamique."
GENERIC_anti_jid: "Mouvement de résistance"
GENERIC_anti_jid_desc: "La création d'un mouvement de résistance contre nos intérêts au Moyen-Orient doit être notre priorité absolue."
##########Chiites##########
GENERIC_iron_hand_shiism: "Main de fer du chiisme"
GENERIC_iron_hand_shiism_desc: "Notre règle doit être ferme, pour ne pas laisser les ennemis de nos idées propager de la désinformation sur notre gouvernement !"
GENERIC_shiite_democracy: "Démocratie chiite"
GENERIC_shiite_democracy_desc: "Nous devons combiner les principes démocratiques avec la théocratie chiite pour créer une harmonie."
GENERIC_our_new_mullah: "Notre nouveau mollah"
GENERIC_our_new_mullah_desc: "Notre nouvelle tâche est de trouver un mollah qui pourrait devenir un candidat approprié pour le leadership spirituel de notre pays."
GENERIC_guards_of_revolution: "Gardiens de la nouvelle révolution"
GENERIC_guards_of_revolution_desc: "Notre révolution est un miracle que nous devons protéger à tout prix."
GENERIC_public_defence_system: "Système de défense publique"
GENERIC_public_defence_system_desc: "Nous devons créer un système pour protéger notre population contre les attaques physiques et psychologiques."
GENERIC_civil_sharia: "Charia civile"
GENERIC_civil_sharia_desc: "Nous devons utiliser les lois de la charia comme base de notre code civil."
GENERIC_iranian_system: "Système iranien"
GENERIC_iranian_system_desc: "L'expérience iranienne nous est très utile - nous pouvons copier des éléments de leur régime qui nous conviennent."
GENERIC_islamic_socialism: "Socialisme islamique"
GENERIC_islamic_socialism_desc: "Combiner l'islam et le socialisme est une idée glorieuse qui peut autonomiser la classe ouvrière islamique."
GENERIC_islamic_republic: "République islamique"
GENERIC_islamic_republic_desc: "Maintenant, nous pouvons officiellement nous proclamer une République islamique."
##########ARBRE DÉMOCRATIQUE##########
GENERIC_democracy: "Démocratie"
GENERIC_democracy_desc: "L'objectif principal de la démocratie est d'assurer le bien-être des citoyens, la protection de leurs droits et libertés, et le contrôle du pouvoir."
GENERIC_personal_freedom: "Liberté individuelle"
GENERIC_personal_freedom_desc: "Garantir les libertés individuelles des citoyens est notre devoir sacré et l'un des objectifs fondamentaux de la démocratie."
GENERIC_social_equity: "Équité sociale"
GENERIC_social_equity_desc: "Pour garantir la stabilité de la société, nous devons lui offrir une égalité sociale."
GENERIC_conservative_values: "Valeurs conservatrices"
GENERIC_conservative_values_desc: "Garantir des valeurs conservatrices et traditionnelles est nécessaire pour maintenir la stabilité de notre société."
GENERIC_family_defence: "Défense de la famille"
GENERIC_family_defence_desc: "Protéger les valeurs familiales nous permettra d'assurer la stabilité et de maintenir les taux de croissance démographique."
GENERIC_minimal_government: "Gouvernement minimal"
GENERIC_minimal_government_desc: "Le rôle de l'État devrait se limiter à fournir uniquement des services de base tels que la défense, l'application de la loi et l'entretien des infrastructures."
GENERIC_democratic_representation: "Représentation démocratique"
GENERIC_democratic_representation_desc: "Grâce aux mécanismes de représentation politique (principalement les élections et les partis politiques), l'implication des citoyens dans le processus politique est réalisée."
GENERIC_green_politic: "Politique verte"
GENERIC_green_politic_desc: "Notre objectif principal est de créer une société avec un environnement durable afin de réduire l'impact négatif humain sur les écosystèmes."
GENERIC_welfare_state: "État-providence"
GENERIC_welfare_state_desc: "Notre tâche est de fournir aux citoyens tous les biens et services nécessaires à leur confort de vie dans l'État."
GENERIC_freedom_of_speech: "Liberté d'expression"
GENERIC_freedom_of_speech_desc: "La liberté d'expression est un droit humain fondamental reconnu par la communauté internationale comme un élément essentiel d'une société démocratique."
GENERIC_economic_deregulation: "Déréglementation économique"
GENERIC_economic_deregulation_desc: "La déréglementation économique est le processus de réduction ou de suppression de la réglementation gouvernementale dans certains secteurs ou industries."
GENERIC_western_liberal_democracy: "Démocratie libérale occidentale"
GENERIC_western_liberal_democracy_desc: "La démocratie libérale occidentale est une forme de démocratie représentative dans laquelle les décisions prises sont basées sur une constitution qui protège les libertés individuelles et les droits des minorités dans la société."
GENERIC_independent_democracy: "Démocratie indépendante"
GENERIC_independent_democracy_desc: "La démocratie indépendante est un mode de vie politique dans la société où les autorités, leurs organes et leurs actions sont choisis, formés et dirigés exclusivement par la nation dans le but d'atteindre le bien-être matériel, la liberté et la justice pour tous les citoyens, groupes sociaux et peuples."
GENERIC_reactionary_democracy: "Démocratie réactionnaire"
GENERIC_reactionary_democracy_desc: "La démocratie réactionnaire est apparue en réaction aux mouvements révolutionnaires et au désir de réorganisation démocratique de la société. Ses partisans prônaient la préservation des structures politiques existantes, même si elles étaient considérées comme dépassées."
##########ARBRE NATIONALISTE##########
GENERIC_nationalism: "Nationalisme"
GENERIC_nationalism_desc: "Le nationalisme est une idéologie et une orientation politique dont le principe fondamental est la thèse de la valeur des nations ou de la nation comme la plus haute forme d'unité sociale, sa primauté dans le processus de formation de l'État."
GENERIC_glorious_past: "Passé glorieux"
GENERIC_glorious_past_desc: "En regardant le passé, nous devons construire l'avenir. Dans notre passé glorieux, notre puissante nation, dirigée par un monarque fort, écrasait ses ennemis et glorifiait le drapeau de notre État. Par tous les moyens, nous devons revenir à notre ancienne gloire !"
GENERIC_uncertain_times: "Temps incertains"
GENERIC_uncertain_times_desc: "L'établissement d'une dictature militaire est généralement associé à une crise socio-économique profonde dans l'État, à l'incapacité du gouvernement civil de trouver des méthodes de gouvernance efficaces pour surmonter la crise."
GENERIC_nation_spirit: "Esprit national"
GENERIC_nation_spirit_desc: "Nous appelons à l'unification de toute notre nation de sang pur au sein d'un seul État."
GENERIC_against_establishment: "Contre l'establishment"
GENERIC_against_establishment_desc: "L'anti-establishment est une idéologie politique qui s'oppose aux systèmes ou structures sociaux, politiques et économiques existants. Il est souvent associé à des mouvements qui remettent en question l'état actuel des choses et cherchent un changement radical dans la société."
GENERIC_traditional_values: "Valeurs traditionnelles"
GENERIC_traditional_values_desc: "Les valeurs traditionnelles sont des lignes directrices morales qui forment la vision du monde des citoyens, transmises de génération en génération, sous-tendant l'identité civile panrusse et l'espace culturel commun du pays, renforçant l'unité civile."
GENERIC_people_representatives: "Représentants du peuple"
GENERIC_people_representatives_desc: "Nous sommes en faveur de la présence au pouvoir des véritables représentants du peuple."
GENERIC_unity: "Unité"
GENERIC_unity_desc: "L'unité du peuple est la cohésion des gens, leur volonté de s'unir pour atteindre des objectifs communs."
GENERIC_militarization_society: "Militarisation de la société"
GENERIC_militarization_society_desc: "Pour assurer la sécurité nationale, nous devons militariser la société, élargir la conscription et être prêts à convertir l'économie en une économie militaire."
militarization_society_tt: "Ouvre une décision § ! « Programme de militarisation »§ !"
GENERIC_autoritarism: "Autoritarisme"
GENERIC_autoritarism_desc: "L'autoritarisme est un régime politique dans lequel le pouvoir est concentré entre les mains d'un seul dirigeant ou d'un groupe restreint d'élites dirigeantes, et la société a une participation limitée à la gouvernance du pays."
GENERIC_our_interests: "Nos intérêts"
GENERIC_our_interests_desc: "Maintenant, nous sommes à la croisée des chemins pour choisir nos intérêts, ce qui est le plus important pour nous en ce moment : assurer la stabilité intérieure ou renforcer notre position sur la scène internationale."
GENERIC_work_for_country: "Travailler pour le bien du pays"
GENERIC_work_for_country_desc: "L'État d'abord, nous devons assurer la vie du pays, même si nous devons sacrifier les libertés civiles pour y parvenir."
GENERIC_protect_people: "Protéger le peuple"
GENERIC_protect_people_desc: "Le facteur le plus important dans la formation de l'État est le peuple, et nous devons offrir au peuple une vie décente, du travail et un avenir."
GENERIC_fairness: "Justice"
GENERIC_fairness_desc: "La notion de justice dans le fascisme est liée à la recherche de réformes, mais en général, l'idéologie fasciste est orientée vers la domination d'un groupe particulier et le mépris des autres."
GENERIC_power: "Pouvoir"
GENERIC_power_desc: "Le pouvoir de l'État est un ensemble de capacités matérielles et spirituelles utilisées pour atteindre les objectifs géopolitiques de l'État. Notre pouvoir devrait inspirer la peur à nos ennemis et protéger l'intégrité territoriale de notre pays."
