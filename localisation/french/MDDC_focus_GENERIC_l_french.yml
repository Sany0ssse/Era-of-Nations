GENERIC_challenge_israel: "§RDéfier Israël§ !"
GENERIC_challenge_israel_desc: "Nous avons toléré l'existence d'un État artificiel sur le territoire de nos frères islamiques pendant trop longtemps. Il est temps d'y mettre fin !"
##########Événements##########
redux_generic.1.t: "Nos intérêts"
redux_generic.1.d: "Maintenant, nous sommes à la croisée des chemins pour choisir nos intérêts, ce qui est le plus important pour nous en ce moment : assurer la stabilité intérieure ou renforcer notre position sur la scène internationale."
redux_generic.1.a: "Nous devons nous établir sur la scène mondiale."
redux_generic.1.b: "D'abord, nous devons stabiliser de l'intérieur."
redux_generic.2.t: "Question de classe"
redux_generic.2.d: "La question de classe englobe divers aspects liés à la définition des classes et de la lutte des classes à différentes périodes de l'histoire du pays."
redux_generic.2.a: "Tout le pouvoir aux travailleurs !"
redux_generic.2.b: "Garantir l'égalité des classes."
redux_generic.3.t: "Culture et idéologie"
redux_generic.3.d: "Maintenant, nous devons décider si nous conservons une approche conservatrice, avec la préservation des valeurs culturelles de nos citoyens, ou si nous empruntons la voie du marxisme culturel."
redux_generic.3.a: "Préserver le patrimoine culturel."
redux_generic.3.b: "Marxisme culturel."
redux_generic.5.t: "Fin du pétrodollar"
redux_generic.5.d: "Notre pays a enfin réussi à se libérer de l'influence de l'hégémonie économique américaine, et nous sommes maintenant prêts à tracer notre propre chemin vers une nation prospère."
redux_generic.5.a: "Enfin !"
redux_generic.6.t: "[FROM.GetName] abandonne le pétrodollar !"
redux_generic.6.d: "Un autre pays a cessé de reconnaître notre politique. Il semble que nous perdions réellement de l'influence sur le système économique."
redux_generic.6.a: "Nous devons faire quelque chose à ce sujet."
redux_generic.7.t: "La guerre contre le terrorisme"
redux_generic.7.d: "L'humanité fait face à une nouvelle menace sous la forme du terrorisme international. À une époque où les puissances nucléaires sont prêtes à vivre en paix, des forces politiques gagnent du terrain et veulent plonger le monde dans le chaos."
redux_generic.7.a: "Nous devons les arrêter."
redux_generic.8.t: "[FROM.GetName] passe au pétro-rouble"
redux_generic.8.d: "Un autre pays a choisi le rouble comme monnaie pour le commerce du pétrole."
redux_generic.8.a: "Wow"
redux_generic.9.t: "[FROM.GetName] passe au pétro-yuan"
redux_generic.9.d: "Un autre pays a choisi le yuan comme monnaie pour le commerce du pétrole."
redux_generic.9.a: "Wow"
redux_generic.10.t: "Dénonciation du traité FCE"
redux_generic.10.d: "Nous avons dénoncé le traité FCE et n'avons plus l'intention de limiter nos forces armées au profit d'autres pays."
redux_generic.10.a: "Bien"
redux_generic_news.1.t: "Bienvenue dans MD Director's Cut"
redux_generic_news.1.d: "Welcome to Era of Nations. This initial standalone fork keeps the inherited gameplay baseline.\nWe are continuing development from this starting point. Sources and original contributors are recorded in the project documentation."
redux_generic_news.1.a: "Bon jeu !"
five_year_plan.1.t: "Échec du plan quinquennal"
five_year_plan.1.desc: "Malheureusement, nous n'avons pas réussi à atteindre les objectifs fixés par notre direction, ce qui a montré l'inefficacité de notre industrie. Le plan quinquennal est un échec."
five_year_plan.1.a: "C'est un désastre"
five_year_plan.2.t: "Plan quinquennal accompli"
five_year_plan.2.desc: "Nous avons réussi à atteindre nos objectifs. Nous avons réussi à augmenter notre industrie et notre production, nos descendants peuvent être assurés d'un avenir radieux pour notre pays."
five_year_plan.2.a: "Gloire au travail !"
f_invest.1.t: "[FROM.GetName] demande notre investissement"
f_invest.1.desc: "Nous avons reçu une offre pour fournir un investissement à l'État [FROM.GetName]. Devons-nous accepter cette offre ?"
f_invest.1.a: "Accepter"
f_invest.1.b: "Refuser"
f_invest.2.t: "[FROM.GetName] accepte notre offre"
f_invest.2.desc: "[FROM.GetName] a accepté notre offre de fournir un investissement."
f_invest.2.a: "Super !"
f_invest.3.t: "[FROM.GetName] refuse notre offre"
f_invest.3.desc: "[FROM.GetName] a refusé notre offre d'investissement. Peut-être n'ont-ils pas d'argent, ou peut-être devrions-nous essayer d'améliorer nos relations."
f_invest.3.a: "Triste"
f_invest.2.a: "Bien"
generic_nato.6.t: "Les États-Unis refusent de coopérer"
generic_nato.6.desc: "Les États-Unis refusent de coopérer avec nous, peut-être parce qu'ils craignent que cela ne crée des tensions avec les puissances orientales, ou simplement à cause d'une animosité personnelle..."
generic_nato.6.a: "Peut-être la prochaine fois"
generic_nato.7.t: "Les États-Unis acceptent de coopérer"
generic_nato.7.desc: "Les États-Unis acceptent de coopérer. Cela pourrait renforcer nos relations avec les États-Unis et les autres membres de l'OTAN, et nous rapprocher d'une éventuelle adhésion à l'alliance."
generic_nato.7.a: "Bon début"
generic_nato.3.t: "[FROM.GetName] souhaite obtenir le statut IPAP"
generic_nato.3.desc: "[FROM.GetName] souhaite obtenir le statut de Plan de partenariat individuel avec l'OTAN. En ratifiant ce statut pour eux, nous aurons l'obligation de les protéger en cas de conflit."
generic_nato.3.a: "Nous ratifions ceci"
generic_nato.3.b: "Nous refusons"
generic_nato.8.t: "[FROM.GetName] a ratifié notre adhésion"
generic_nato.8.a: "Super"
generic_nato.8.desc: "[FROM.GetName] a ratifié notre statut IPAP, cela nous rend plus unis. Peut-être qu'à l'avenir, nous pourrons trouver une place parmi les rangs de l'alliance."
generic_nato.9.t: "[FROM.GetName] a refusé de nous ratifier"
generic_nato.9.a: "Peut-être la prochaine fois"
generic_nato.9.desc: "[FROM.GetName] a refusé de ratifier notre statut IPAP. Peut-être devrions-nous mieux travailler notre diplomatie avec ce pays."
generic_nato.4.t: "[FROM.GetName] souhaite rejoindre l'alliance de l'OTAN"
generic_nato.4.desc: "[FROM.GetName] a longtemps été notre bon allié en dehors de l'alliance, ils sont devenus notre membre officieux, il est maintenant temps de ratifier leur entrée complète dans l'alliance et de la rendre officielle."
generic_nato.4.a: "Nous ratifions ceci"
generic_nato.4.b: "Nous refusons"
generic_nato.10.t: "[FROM.GetName] nous ratifie pour rejoindre l'OTAN"
generic_nato.10.a: "Super"
generic_nato.10.desc: "[FROM.GetName] nous ratifie pour notre entrée complète dans l'alliance en tant que membre permanent. Notre coopération a longtemps été étroite et maintenant nous sommes un pas plus près l'un de l'autre."
generic_nato.11.t: "[FROM.GetName] refuse de nous ratifier"
generic_nato.11.a: "Triste"
generic_nato.11.desc: "[FROM.GetName] refuse de nous ratifier comme candidat à l'adhésion permanente à l'OTAN. Peut-être devrions-nous améliorer nos liens diplomatiques avec eux et renforcer notre relation."
generic_nato.1.t: "[FROM.GetName] souhaite établir un partenariat militaire avec l'OTAN"
generic_nato.1.desc: "[FROM.GetName] nous a approchés avec une proposition de coopération dans le cadre de la sécurité militaire, ils espèrent que nous les aiderons à assurer la sécurité de leurs frontières et à augmenter leur potentiel militaire pour protéger leur souveraineté."
generic_nato.1.a: "Bien sûr, nous sommes d'accord"
generic_nato.1.b: "Nous ne prendrons aucun risque"
generic_nato.5.t: "Nous n'avons pas réussi à répondre aux exigences de l'OTAN"
generic_nato.5.desc: "Nous n'avons pas réussi à remplir les exigences de base de l'alliance pour obtenir un nouveau statut à temps, peut-être devrions-nous essayer à nouveau."
generic_nato.5.a: "Triste"
generic_csto.1.t: "Conclure un accord commercial avec les pays de l'OTSC"
generic_csto.1.desc: "[FROM.GetName] souhaite conclure un accord commercial avec nous dans le cadre de son rapprochement avec les pays membres de l'alliance de l'OTSC."
generic_csto.1.a: "Nous sommes d'accord"
generic_csto.1.b: "Non"
generic_csto.2.t: "[FROM.GetName] accepte notre accord"
generic_csto.2.desc: "[FROM.GetName] a accepté de signer un accord commercial avec notre pays. Cela nous rend plus unis."
generic_csto.2.a: "Bien !"
generic_csto.3.t: "[FROM.GetName] refuse l'accord"
generic_csto.3.desc: "[FROM.GetName] refuse de signer un accord commercial avec nous, peut-être reviendront-ils à la raison plus tard."
generic_csto.4.t: "Accord de défense avec [FROM.GetName]"
generic_csto.4.desc: "[FROM.GetName] souhaite signer un traité de défense mutuelle avec nous. Si nous acceptons, nous prendrons des obligations bilatérales pour protéger les frontières et la souveraineté de nos pays."
generic_csto.4.a: "Nous sommes d'accord"
generic_csto.4.b: "Non"
generic_csto.5.t: "[FROM.GetName] souhaite rejoindre l'OTSC"
generic_csto.5.desc: "[FROM.GetName] a décidé de soumettre une candidature pour rejoindre l'alliance de l'OTSC. Allons-nous accepter leur candidature ?"
generic_csto.5.a: "Bienvenue"
generic_csto.5.b: "Nous ne sommes pas encore prêts à les accepter."
generic_csto.9.t: "[FROM.GetName] rejoint l'OTSC"
generic_csto.9.desc: "[FROM.GetName] a annoncé aujourd'hui qu'ils ont décidé de rejoindre l'OTSC. La Russie a déjà annoncé que la candidature à l'adhésion a été examinée et est prête à être signée. Il est déjà clair que cela changera l'équilibre des pouvoirs et augmentera l'influence russe dans la région. Il n'y a pas encore eu de réaction de la part de l'OTAN."
generic_csto.9.a: "Inattendu"
generic_csto.8.t: "La Russie refuse"
generic_csto.8.desc: "La Russie n'est pas prête à examiner notre candidature pour rejoindre l'OTSC."
generic_csto.8.a: "Peut-être plus tard"
generic_csto.6.t: "[FROM.GetName] accepte"
generic_csto.6.desc: "[FROM.GetName] a accepté notre accord sur un traité de défense bilatéral."
generic_csto.6.a: "Bien"
generic_csto.7.t: "[FROM.GetName] refuse"
generic_csto.7.desc: "[FROM.GetName] refuse d'accepter notre accord sur un traité de défense bilatéral."
generic_csto.7.a: "Triste"
generic_csto.10.t: "[FROM.GetName] souhaite conclure un accord d'échange de connaissances avec nous"
generic_csto.10.desc: "[FROM.GetName] souhaite conclure un accord de transfert de connaissances avec nous. Nous pouvons les aider à rattraper les grandes puissances en technologie et devenir beaucoup plus proches dans les relations entre nos pays."
generic_csto.10.a: "Bien sûr ! Nous sommes d'accord"
generic_csto.10.b: "Pas maintenant"
generic_csto.11.t: "La Russie accepte"
generic_csto.11.desc: "La Russie a accepté de transférer des connaissances avec notre pays. Cela nous donnera un bon coup de pouce en technologie."
generic_csto.11.a: "Super !"
generic_csto.12.t: "La Russie refuse"
generic_csto.12.desc: "La Russie a refusé de nous aider avec le transfert de connaissances. Il semble que nous devrons compter sur nous-mêmes."
generic_csto.12.a: "Merde !"
generic_muslims.4.t: "[FROM.GetName] nous soutient !"
generic_muslims.4.desc: "[FROM.GetName] nous soutient dans la lutte contre Israël. Ce geste de bonne volonté de nos amis islamiques nous aidera beaucoup et posera une pierre pour une amitié future."
generic_muslims.4.a: "Bien !"
generic_muslims.1.t: "[FROM.GetName] demande l'aide de notre fondation"
generic_muslims.1.desc: "[FROM.GetName] demande l'aide de notre fondation. Cela les aidera à développer l'État et augmentera notre influence sur eux."
generic_muslims.1.a: "Bienvenue"
generic_muslims.1.b: "Pas maintenant"
generic_muslims.2.t: "Le Qatar accepte"
generic_muslims.2.desc: "Le Qatar accepte d'élargir son fonds à notre pays. Cela nous donnera un bon coup de pouce dans le système éducatif, augmentera l'alphabétisation et nous permettra de rattraper les grandes puissances en technologie."
generic_muslims.2.a: "Bien"
generic_muslims.3.t: "Le Qatar refuse"
generic_muslims.3.desc: "Le Qatar a refusé de nous aider. Eh bien, pas cette fois, nous nous débrouillerons seuls."
 generic_muslims.3.a: "Nous n'en voulions pas vraiment"
generic_salafists.2.t: "[FROM.GetNameWithFlag] souhaite établir une coopération avec nous"
generic_salafists.2.d: "[FROM.GetNameWithFlag] - un pays dont le pouvoir est entre les mains de salafistes avec une idéologie similaire à la nôtre. Ils nous ont envoyé une demande de coopération, nous pourrions les soutenir avec des investissements, leur fournir une protection ou refuser et les laisser se débrouiller seuls. Que devons-nous choisir ?"
generic_salafists.2.a: "Soutien total"
generic_salafists.2.b: "Soutenons-les avec des investissements"
generic_salafists.2.c: "Soutenons leur indépendance"
generic_salafists.2.d: "Ne pas les soutenir"
generic_salafists.1.t: "Écraser les mushriqs"
generic_salafists.1.d: "Dans notre nouveau régime, les mushriqs sont désormais justement punis pour leurs péchés. Maintenant, nous pouvons commencer à préparer notre société à une soumission beaucoup plus stricte à notre cause. Bientôt, notre pays sera pur et tout désaccord sera écrasé."
generic_salafists.1.a: "Magnifique !"
