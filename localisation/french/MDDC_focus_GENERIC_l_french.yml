generic_sanctions.5.t: "[FROM.GetNameWithFlag] nous demande de lever nos sanctions"
generic_sanctions.5.d: "Le gouvernement de [FROM.GetNameWithFlag] est prêt à négocier sur les sanctions, ce qui montre que notre politique envers eux a été stratégiquement correcte."
generic_sanctions.5.a: "Nous sommes prêts à lever les sanctions s'ils sont prêts à nous payer"
generic_sanctions.5.b: "Non"
generic_sanctions.6.t: "[FROM.GetNameWithFlag] propose un accord sur les sanctions"
generic_sanctions.6.d: "[FROM.GetNameWithFlag] accepte de lever les sanctions si nous les payons pour cela."
generic_sanctions.6.a: "Ça en vaut la peine"
generic_sanctions.6.b: "Nous ne nous inclinerons pas devant eux"
generic_sanctions.7.t: "[FROM.GetNameWithFlag] a refusé de lever les sanctions contre nous"
generic_sanctions.7.d: "[FROM.GetNameWithFlag] a refusé de lever les sanctions contre nous car nous représentons toujours une menace pour leurs intérêts."
generic_sanctions.7.a: "Merde"
generic_sanctions.8.t: "[FROM.GetNameWithFlag] a accepté nos demandes"
generic_sanctions.8.d: "[FROM.GetNameWithFlag] a accepté de nous payer pour lever les sanctions. Maintenant, nos relations reviendront à la normale."
generic_sanctions.8.a: "Bien"
generic_sanctions.9.t: "[FROM.GetNameWithFlag] a rejeté notre proposition"
generic_sanctions.9.d: "Bien que nous n'ayons pas demandé beaucoup en échange de la levée des sanctions, ils pensent toujours qu'ils peuvent survivre en isolement."
generic_sanctions.9.a: "Bonne chance à eux"
