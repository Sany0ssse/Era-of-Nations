l_french:
 GENERIC_anti_corruption_reforms: "Réformes anti-corruption"
GENERIC_anti_corruption_reforms_desc: "En adoptant des réformes anti-corruption, nous pouvons espérer réduire la corruption interne de notre nation."
GENERIC_network_infrastructure: "Infrastructure Internet"
GENERIC_network_infrastructure_desc: "Le monde moderne a fait de l'Internet un besoin humain fondamental. Investir dans ce besoin facilitera l'éducation, les efforts de construction et bien plus encore."
GENERIC_centralization: "Centralisation"
GENERIC_centralization_desc: "La centralisation de l'État aidera à maintenir notre vaste nation. Centraliser la nation permettra également d'obtenir un capital politique supplémentaire et devrait générer des revenus fiscaux additionnels en conjonction avec cet accroissement de capital politique."
GENERIC_decentralization: "Décentralisation"
GENERIC_decentralization_desc: "La décentralisation de l'État et la réduction des formalités administratives aideront à diminuer les coûts bureaucratiques globaux et encourageront la croissance de la construction."
GENERIC_political_reform: "Réforme politique"
GENERIC_political_reform_desc: "Pour éviter la stagnation de notre scène politique nationale, le gouvernement doit maintenir le pays et son peuple politiquement engagés et actifs. Des lois doivent être rédigées, des fonctionnaires nommés, des plans de financement adoptés et des projets publics planifiés. Le gouvernement [Root.GetAdjective] ne doit pas devenir complaisant dans ses efforts pour moderniser et renforcer le pays."
GENERIC_cabinet_reform: "Réforme du cabinet"
GENERIC_cabinet_reform_desc: "En remplaçant plusieurs acteurs clés du cabinet qui s'opposent actuellement à l'agenda du chef du gouvernement, la branche exécutive peut projeter force et détermination face aux questions politiques et crises à venir. Ce faisant, nous devons ignorer les critiques, les perdants et les pessimistes."
GENERIC_expand_the_secret_service: "Élargir le service secret"
GENERIC_expand_the_secret_service_desc: "La sécurité de [Root.GetNameDef] dépend grandement de la force de ses agences de renseignement militaire et civil. Nous devons trouver des contre-mesures efficaces contre les agents hostiles, les éléments subversifs de la société, les terroristes ou la possibilité (peu probable) d'une attaque nucléaire ennemie."
GENERIC_build_intelligence_stations: "Construire des stations de renseignement"
GENERIC_build_intelligence_stations_desc: "En prolongement des stations RADAR de la Seconde Guerre mondiale, les stations de renseignement nous fourniront des rapports détaillés sur les mouvements de troupes ennemies et les aéronefs entrants. Nous utiliserons les expériences des affaires d'espionnage et des intrigues de l'ère de la Guerre froide."
GENERIC_strengthen_government: "Renforcer le gouvernement"
GENERIC_strengthen_government_desc: "Notre gouvernement établi a besoin d'être renforcé. Enraciner politiquement notre parti nous offrira plus d'options pour poursuivre une variété de politiques."
GENERIC_political_games: "Jeux politiques"
GENERIC_political_games_desc: "Qu'est-ce qu'un gouvernement sans une culture politique expansive ? Nous devons semer les graines du débat et de la discussion pour que notre environnement politique prospère et reste stable."
GENERIC_public_service_announcement: "Annonce de service public"
GENERIC_public_service_announcement_desc: "Nous devons établir une manière standardisée de communiquer des messages d'intérêt public directement à nos citoyens. Cela se fera par une annonce de service public."
GENERIC_the_establishment: "L'Établissement"
GENERIC_the_establishment_desc: "Les figures de l'Établissement ont renforcé leur emprise sur la politique de l'État. Nous pouvons en tirer parti pour avoir une certaine distance dans les affaires de l'État."
GENERIC_the_state: "L'État"
GENERIC_the_state_desc: "Avec une main ferme sur tout ce qui concerne notre territoire, nous pouvons, une fois pour toutes, nous débarrasser des fléaux de la division et de l'immobilisme qui ont longtemps affecté notre nation."
GENERIC_diplomatic_positions: "Positions diplomatiques"
GENERIC_diplomatic_positions_desc: "Suite à la réforme politique et à notre focus sur les affaires extérieures, nous pouvons établir des positions diplomatiques cohérentes avec nos voisins pour une plus grande coopération internationale."
GENERIC_our_place: "Notre place"
GENERIC_our_place_desc: "Nous sommes nos propres maîtres - et nous méritons d'être libres des mains avides des puissances qui nous influencent."
GENERIC_station_in_the_world: "Les vues du monde"
GENERIC_station_in_the_world_desc: "Exposer la nation au monde nous apportera une pléthore d'avantages - y compris un pouvoir d'action pour nos figures de proue."
GENERIC_the_west: "L'Occident"
GENERIC_the_west_desc: "Les pays occidentaux mettent l'accent sur la démocratie et la liberté, et sont souvent alignés avec les États-Unis. Les pays occidentaux travaillent à maintenir le statu quo en politique mondiale."
GENERIC_eastern_emergence: "Émergence de l'Est"
GENERIC_eastern_emergence_desc: "Les pays émergents politiquement souhaitent s'écarter de l'ordre mondial actuel et créer de nouvelles organisations pour remplacer les anciennes. Bien que non strictement anti-américains ou anti-occidentaux, les pays émergents cherchent souvent à affaiblir les influences occidentales."
GENERIC_non_aligned: "Non-aligné"
GENERIC_non_aligned_desc: "Les pays neutres essaient de rester en dehors de la politique mondiale, et se concentrent souvent sur le développement interne ou régional. Ils ne se sentent pas fortement concernés par l'Occident ou l'Est."
GENERIC_the_conservative_approach: "Approche conservatrice"
GENERIC_the_conservative_approach_desc: "Les pays conservateurs tentent activement de maintenir le statu quo mondial, en se concentrant sur la préservation de la politique et de la vision internationale de l'ancienne garde occidentale."
GENERIC_the_nationalist_rise: "Essor nationaliste"
GENERIC_the_nationalist_rise_desc: "Les pays nationalistes se concentrent fortement sur eux-mêmes et sur les gloires passées de leur nation. Ils tombent souvent dans des politiques autoritaires et promeuvent l'existence d'une seule ethnie ou peuple."
GENERIC_the_salafist_rise: "Essor salafiste"
GENERIC_the_salafist_rise_desc: "Le salafisme est une interprétation ultra-conservatrice de l'Islam. Les salafistes veulent réformer l'Islam en le ramenant à ses racines plus traditionnelles et littérales, par la force si nécessaire."
GENERIC_western_ideas: "Idées occidentales"
GENERIC_western_ideas_desc: "Les idéaux de démocratie et de liberté si chers à l'Occident sont essentiels au succès de tout État-nation respectable. Nous devrions les adopter."
GENERIC_the_rising_powers: "Les puissances émergentes"
GENERIC_the_rising_powers_desc: "Combien de temps une nation doit-elle suivre les règles de ses marionnettistes invisibles ? Écartons-nous de cet ordre mondial injuste et corrompu pour nous élever aux côtés de nos frères."
GENERIC_us_above_all: "Nous avant tout"
GENERIC_us_above_all_desc: "La nation est la seule chose sacrée et pure au monde. Elle doit non seulement être respectée, mais ses besoins doivent être satisfaits - peu importe ce que les autres en pensent !"
GENERIC_jihad: "Jihad"
GENERIC_jihad_desc: "Allah est le plus grand !"
GENERIC_international_diplomacy: "Diplomatie internationale"
GENERIC_international_diplomacy_desc: "L'art des accords en coulisse, des démonstrations publiques d'attitudes moralisatrices et de la division des petits pays entre leurs voisins plus grands, la pratique de la diplomatie internationale a une culture bien établie mêlant grandiloquence et machiavélisme pragmatique. Après tout, l'objectif principal de la diplomatie est de sécuriser l'approvisionnement en pétrole du pays. [Root.GetNameDef] ne doit pas rester en arrière."
GENERIC_trade_with_the_neighbors: "Commerce avec les voisins"
GENERIC_trade_with_the_neighbors_desc: "Après avoir resserré les liens avec nos voisins immédiats grâce à l'expansion de notre personnel diplomatique et de notre réseau routier, nous pouvons désormais poursuivre une intégration commerciale plus étroite avec nos partenaires voisins. Cela profitera aux bénéfices de nos grandes entreprises et de nos petits entrepreneurs."
GENERIC_alignment_debate: "Débat sur l'alignement"
GENERIC_alignment_debate_desc: "Une question ouverte de la diplomatie internationale est toujours le conflit et la juxtaposition des idées de neutralité et d'isolationnisme face à l'idée d'interventionnisme."
GENERIC_neutrality: "Neutralité"
GENERIC_neutrality_desc: "Nous devons toujours nous préoccuper en premier lieu de la sécurité et de la prospérité des citoyens [Root.GetAdjective]. Nous ne pouvons pas gaspiller nos jeunes hommes, nos ressources naturelles et nos actifs financiers dans des engagements étrangers. Au lieu de cela, nous devons nous assurer que le front intérieur est sécurisé en protégeant nos frontières et en évitant l'adhésion à des réseaux d'alliances internationales."
GENERIC_interventionism: "Interventionnisme"
GENERIC_interventionism_desc: "Se limiter à nous-mêmes sur la scène internationale est non seulement égoïste, mais insultant pour tous les peuples du monde. Peu importe ce qu'il faudra, nous devons assurer la prospérité et la sécurité de tous dans la région, et peut-être même à l'échelle mondiale ! Et si nous saisissons quelques ressources supplémentaires et de la gratification pour [Root.GetNameDef] en chemin..."
GENERIC_build_fortifications: "Construire des fortifications"
GENERIC_build_fortifications_desc: "Une architecture défensive solide est la clé pour sécuriser une ligne de front inébranlable en cas d'invasion par des forces étrangères."
GENERIC_militarism: "Militarisme"
GENERIC_militarism_desc: "Le militarisme est l'idée qu'un pays possède une armée forte utilisée pour sécuriser et protéger les intérêts nationaux, tant dans les domaines domestiques qu'étrangers."
GENERIC_peaceful_emergence: "Émergence pacifique"
GENERIC_peaceful_emergence_desc: "Malgré nos visions du monde différentes, nous ne devrions pas être hostiles envers l'ancien ordre, mais plutôt travailler lentement à changer le monde par la diplomatie et l'économie."
GENERIC_revanchism: "Revanchisme"
GENERIC_revanchism_desc: "Le revanchisme désigne la volonté d'un pays de récupérer des territoires qu'il a précédemment perdus. Popularisé par les Français après la perte de l'Alsace-Lorraine, le revanchisme reste un facteur clé dans la politique de nombreux pays."
GENERIC_economic_start: "Notre économie"
GENERIC_economic_start_desc: "Il est temps de commencer à développer la composante économique de notre pays."
GENERIC_build_roadss: "Construire des routes"
GENERIC_build_roadss_desc: "Le transport est essentiel dans toute région bien développée du monde, et nous pouvons encourager un meilleur accès à l'éducation et à la vie urbaine en construisant des routes partout dans la nation, en particulier dans les régions moins développées."
GENERIC_build_railways: "Construire des chemins de fer"
GENERIC_build_railways_desc: "Le transport est essentiel dans toute région bien développée du monde, et nous pouvons encourager l'industrialisation ainsi qu'établir une méthode de transport rapide et économique en construisant des chemins de fer dans les parties moins développées du pays."
GENERIC_build_highways: "Construire des autoroutes"
GENERIC_build_highways_desc: "Pour faciliter le transport longue distance des individus à travers [Root.GetNameDef], des autoroutes sont nécessaires. Construisons-en."
GENERIC_expand_urban_areas: "Élargir les zones urbaines"
GENERIC_expand_urban_areas_desc: "Les régions urbaines de [Root.GetNameDef] sont le cœur de son progrès et, potentiellement, de son économie. En élargissant et en améliorant la vie urbaine, nous pouvons centraliser davantage l'économie et stimuler le dynamisme des citoyens."
GENERIC_developmentalism: "Développementalisme"
GENERIC_developmentalism_desc: "Le développementalisme est une théorie économique qui stipule que la meilleure façon de développer les économies des pays moins développés est d'avoir un marché interne fort et diversifié avec des tarifs élevés."
GENERIC_increase_resource_production: "Augmenter la production de ressources"
GENERIC_increase_resource_production_desc: "Des rendements de ressources plus élevés sur nos sites de production signifient des revenus plus élevés lors des exportations en vrac. Prioriser l'extraction de ressources nous permettra de stimuler notre économie tout en produisant de plus grandes quantités d'équipements pour nos troupes."
GENERIC_economic_autonomy: "Autonomie économique"
GENERIC_economic_autonomy_desc: "L'un des plus grands dangers pour un pays est de livrer son économie à une puissance étrangère. Notre peuple n'est pas le leur à opprimer, mais le nôtre."
GENERIC_autarky: "Autarcie"
GENERIC_autarky_desc: "L'autosuffisance est l'une des choses les plus importantes que nous pouvons enseigner à nos citoyens. Non seulement cela signifie une charge de travail moindre pour la bureaucratie, mais aussi une réduction des menaces à la sécurité nationale, un contrôle accru sur la politique intérieure et une population plus instruite."
GENERIC_economic_measures: "Mesures économiques"
GENERIC_economic_measures_desc: "Grâce à la mise en œuvre de mesures réglementaires économiques et au contrôle de la dette internationale, nous pouvons stimuler la croissance de notre budget local et réduire les taux d'intérêt de la dette."
GENERIC_productivity_measures: "Mesures de productivité"
GENERIC_productivity_measures_desc: "Seule l'amélioration de la productivité peut renforcer davantage la force de notre pays."
GENERIC_improved_worker_productivity: "Améliorer la productivité des travailleurs"
GENERIC_improved_worker_productivity_desc: "Développer davantage la productivité et améliorer la production par personne peut augmenter efficacement notre production totale."
GENERIC_the_manpower_solution: "La solution de la main-d'œuvre"
GENERIC_the_manpower_solution_desc: "Sans assez de personnes, il n'y a rien. Prenons des mesures pour faire croître rapidement notre population."
GENERIC_emphasize_autarkic_measures: "Mettre l'accent sur les mesures autarciques"
GENERIC_emphasize_autarkic_measures_desc: "Qui a besoin d'un marché mondial ? Nous pouvons répondre à nos besoins avec nos propres usines."
GENERIC_reaching_to_the_global_market: "Accéder au marché mondial"
GENERIC_reaching_to_the_global_market_desc: "Ce n'est qu'en accédant au marché mondial que nous pourrons exploiter pleinement le potentiel de notre pays et obtenir une place sur la scène internationale."
GENERIC_assure_the_national_fuel_reserve: "Assurer la réserve nationale de carburant"
GENERIC_assure_the_national_fuel_reserve_desc: "Notre pétrole est extrêmement important, non seulement pour l'usage militaire dans les véhicules et les blindés, mais aussi pour le transport civil général et l'usage quotidien. Nous pouvons approfondir les silos de carburant pour rendre la réserve nationale de carburant plus efficace pour stocker cet or noir."
GENERIC_business_regulations: "Réglementation des entreprises"
GENERIC_business_regulations_desc: ""
GENERIC_urban_public_transportation_investments: "Développement de la logistique urbaine"
GENERIC_urban_public_transportation_investments_desc: ""
GENERIC_rural_logistical_solutions: "Développement de la logistique agro-industrielle"
GENERIC_rural_logistical_solutions_desc: ""
GENERIC_trade_oriented_economy: "Économie orientée vers le commerce"
GENERIC_trade_oriented_economy_desc: ""
GENERIC_economic_global_integration: "Intégration économique mondiale"
GENERIC_economic_global_integration_desc: ""
GENERIC_nationalize_religious_lands: "Nationalisation des terres religieuses"
GENERIC_nationalize_religious_lands_desc: ""
GENERIC_enter_wto: "Adhésion à l'OMC"
GENERIC_enter_wto_desc: ""
GENERIC_pressure_scientific_sommunity: "Pression sur la liberté intellectuelle"
GENERIC_pressure_scientific_sommunity_desc: ""
GENERIC_illiteracy_births_fertility: "Accès limité à l'éducation"
GENERIC_illiteracy_births_fertility_desc: ""
GENERIC_ease_of_business_reformss: "Réformes pour faciliter les affaires"
GENERIC_ease_of_business_reformss_desc: "L'une des approches possibles pour encourager les dépenses et la création d'entreprises pour les citoyens [Root.GetAdjective] est de réformer la loi et l'économie afin que cela soit plus facile et plus rentable pour les entrepreneurs indépendants de gagner leur vie."
GENERIC_attract_foreign_investors: "Attirer les investisseurs étrangers"
GENERIC_attract_foreign_investors_desc: "En assouplissant les lois sur les entreprises, nous pouvons rendre notre territoire attrayant pour les investisseurs étrangers opportunistes qui pourraient voir une ou deux étoiles brillantes là où nous sommes."
GENERIC_debt_refactoring: "Restructure de la dette"
GENERIC_debt_refactoring_desc: "Négocier nos prêts pour améliorer la vie et l'efficacité de notre gouvernement n'est jamais une mauvaise chose."
GENERIC_agricultural_district_subsidization: "Subvention des districts agricoles"
GENERIC_agricultural_district_subsidization_desc: "Le problème alimentaire ne peut être ignoré. Subventionnons notre agriculture et rendons notre pays aussi autosuffisant que possible en matière alimentaire."
GENERIC_mobilize_the_working_class: "Mobiliser la classe ouvrière"
GENERIC_mobilize_the_working_class_desc: "Dépenser davantage pour les centres de recrutement est l'un des moyens sûrs de garantir que nous ayons suffisamment de main-d'œuvre et de soutien industriel pour pousser [Root.GetNameDef] vers la victoire en cas de conflit."
GENERIC_light_industry_investments: "Investissements dans l'industrie légère"
GENERIC_light_industry_investments_desc: "Injecter du capital dans les industries civiles ainsi que dans le complexe pétrolier peut aider notre économie à progresser dans les moments les plus difficiles."
GENERIC_heavy_industry_investments: "Investissements dans l'industrie lourde"
GENERIC_heavy_industry_investments_desc: "Injecter du capital dans le complexe militaro-industriel augmentera les rendements d'équipements, garantissant que toutes nos troupes sont bien équipées pour la bataille."
GENERIC_refitting_the_military_industry: "Réaménagement de l'industrie militaire"
GENERIC_refitting_the_military_industry_desc: "Nous pouvons ouvrir de nouvelles usines pour nous assurer que notre production d'équipements ne régresse pas."
GENERIC_energy_sector: "Secteur énergétique"
GENERIC_energy_sector_desc: "Pour pouvoir maintenir un pays, son secteur énergétique doit être maintenu à jour en premier. Nous devrions construire à la fois une centrale à combustibles fossiles et une infrastructure d'énergie renouvelable pour une énergie abordable et fiable dans toute la région."
GENERIC_fossil_powerplant: "Centrales à combustibles fossiles"
GENERIC_fossil_powerplant_desc: "Nous pouvons orienter notre secteur énergétique vers le choix des combustibles fossiles comme option privilégiée, sacrifiant le rendement et l'innovation pour des méthodes de production d'énergie bon marché et bien étudiées."
GENERIC_improved_energy_cycling: "Centrales améliorées"
GENERIC_improved_energy_cycling_desc: "En faisant connaître notre position dans le secteur énergétique, plus d'entreprises et d'organisations opteront pour la production d'énergie à base de combustibles fossiles. Cela signifie également un temps d'arrêt pour les sources d'énergie renouvelables."
GENERIC_renewable_retooling: "Réorientation vers les renouvelables"
GENERIC_renewable_retooling_desc: "Nous pouvons plutôt orienter notre secteur énergétique vers l'adoption de combustibles alternatifs et durables pour obtenir un rendement élevé et un faible impact environnemental, en sacrifiant la fiabilité et en assumant des coûts plus élevés."
GENERIC_combined_military_defense_industries: "Industries de défense combinées"
GENERIC_combined_military_defense_industries_desc: "Grâce à notre excellent travail et nos efforts, nous sommes maintenant capables de gérer nos industries de défense plus efficacement."
GENERIC_renewable_infrastructure: "Infrastructure renouvelable"
GENERIC_renewable_infrastructure_desc: "Maintenant que l'engouement pour l'énergie renouvelable a pris de l'ampleur dans notre nation, nous pouvons procéder à la construction d'une infrastructure durable avec l'aide financière des investisseurs intéressés."
GENERIC_nuclear_energy_expansions: "Expansion de l'énergie nucléaire"
GENERIC_nuclear_energy_expansions_desc: "L'utilisation de l'énergie nucléaire est la tendance de l'avenir, et nous devons approfondir son développement."
GENERIC_unemployment_program: "Programmes contre le chômage"
GENERIC_unemployment_program_desc: "Des mesures rapides peuvent être mises en place pour nous assurer que nous puissions supporter des seuils de chômage plus élevés avant que la nation ne commence à souffrir. Leur mise en œuvre peut également être un moyen de modifier notre budget de protection sociale et de santé, dans l'intérêt du peuple."
GENERIC_satisfy_the_middle_class: "Satisfaire la classe moyenne"
GENERIC_satisfy_the_middle_class_desc: "La classe moyenne est peut-être le groupe d'intérêt le plus important dans la nation. Composée principalement de conglomérats industriels et commerciaux, nous pouvons nous attendre à ce qu'ils soient satisfaits en développant l'infrastructure urbaine."
GENERIC_build_churches: "Construire des églises"
GENERIC_build_churches_desc: "Si nous voulons garder les prêtres et le clergé satisfaits, nous devons également injecter du capital dans la construction d'églises, de temples et d'autres lieux de culte à travers le pays. Que le citoyen moyen reste plus ancré est également un avantage collatéral."
GENERIC_please_the_upper_class: "Satisfaire la classe supérieure"
GENERIC_please_the_upper_class_desc: "L'oligarchie forme une petite mais importante partie dans tout État, étant la main invisible derrière les investissements, les acquisitions de terres et l'économie à la fois au niveau micro et macro. Les satisfaire est naturel pour nous."
GENERIC_import_foreign_automobiles: "Importer des automobiles étrangères"
GENERIC_import_foreign_automobiles_desc: "L'herbe est toujours plus verte de l'autre côté de la clôture, et les voitures sont toujours plus propres de l'autre côté de la frontière aussi. Importer des véhicules à moteur directement depuis les industries étrangères sera une excellente excuse pour susciter un engouement gouvernemental."
GENERIC_invest_in_biofuels: "Investir dans les biocarburants"
GENERIC_invest_in_biofuels_desc: "L'énergie alternative est l'avenir ! ...Du moins, c'est ce que disent les investisseurs. Quoi qu'il en soit, nous croyons en leurs intérêts et qu'ils s'aligneront avec ceux de notre nation."
GENERIC_assure_intellectual_freedoms: "Assurer les libertés intellectuelles"
GENERIC_assure_intellectual_freedoms_desc: "Faisons savoir à tous les intellectuels à travers [Root.GetNameDef] que leurs efforts scientifiques sont non seulement précieux, mais essentiels à notre prospérité et seront protégés, quelle que soit leur idéologie ou leur allégeance."
GENERIC_create_an_automotive_industry: "Créer une industrie automobile"
GENERIC_create_an_automotive_industry_desc: "Une fois que nous aurons appris tous les petits secrets de la fabrication automobile de ces étrangers embêtants, nous pourrons commencer à exploiter nos propres alternatives pour stimuler l'industrie nationale et satisfaire la classe inférieure dans le processus."
GENERIC_build_primary_schools: "Construire des écoles primaires"
GENERIC_build_primary_schools_desc: "L'éducation - le cœur et l'âme de la population de n'importe quel pays dans le monde. L'éducation primaire en particulier est extrêmement importante à rendre accessible - car un enfant non éduqué deviendra un adulte non éduqué. Construire plus d'institutions d'enseignement primaire nous permettra d'améliorer les taux d'alphabétisation de notre pays."
GENERIC_assure_access_to_education: "Assurer l'accès à l'éducation"
GENERIC_assure_access_to_education_desc: "L'éducation n'est pas seulement un besoin clé, mais un droit ! Nous devons nous assurer qu'elle est pleinement fournie à tous les citoyens, à tout moment. La prochaine génération d'intellectuels nous apportera certainement un soutien une fois cela réalisé."
GENERIC_expand_the_universities: "Élargir les universités"
GENERIC_expand_the_universities_desc: "Maintenant que les bases de l'éducation primaire sont établies, nous pouvons investir dans l'enseignement supérieur, afin que des génies et des intellectuels de renommée mondiale puissent également venir de [Root.GetNameDef]."
GENERIC_industrial_research_task_forces: "Équipes de recherche industrielle"
GENERIC_industrial_research_task_forces_desc: "Nos équipes de recherche industrielle seraient une équipe de chercheurs financée par la nation, dédiée à l'observation des meilleures pratiques industrielles, afin que nous puissions les mettre en œuvre à l'avenir."
GENERIC_domestic_vehicle_research: "Terrains d'essai de véhicules"
GENERIC_domestic_vehicle_research_desc: "Pour avoir accès aux derniers véhicules militaires, nous ne pouvons pas simplement compter sur nos partenaires stratégiques pour nous fournir des véhicules. Nous devons construire des terrains d'essai de véhicules où nous pouvons tester et développer des véhicules blindés nationaux."
GENERIC_domestic_naval_research: "Développement de navires de guerre [Root.GetAdjective]"
GENERIC_domestic_naval_research_desc: "La sécurité de nos voies maritimes est vitale pour notre économie. Si nous devions perdre l'accès à la puissance navale de nos alliés, nous serions isolés. Nous devons créer une installation où nous pourrons concevoir nos propres navires de guerre."
GENERIC_domestic_aircraft_research: "Programme de jets nationaux"
GENERIC_domestic_aircraft_research_desc: "Les aéronefs sont parmi les machines les plus sophistiquées de la planète, et nous ne savons pas comment les fabriquer. Nous devons créer nos propres aéronefs militaires nationaux pour montrer au monde nos compétences technologiques."
GENERIC_secret_weapons_program: "Développements secrets civils"
GENERIC_secret_weapons_program_desc: ""
GENERIC_naval_reform: "Réforme navale"
GENERIC_naval_reform_desc: "Il est temps de nous débarrasser de nos pratiques navales obsolètes et de commencer à prendre les forces maritimes plus au sérieux."
GENERIC_naval_bases: "Bases navales"
GENERIC_naval_bases_desc: "La construction de quais et de ports tout le long des côtes profitera non seulement à l'industrie, mais aussi à notre marine."
GENERIC_submarines: "Sous-marins"
GENERIC_submarines_desc: "Nous pouvons commencer à explorer la technologie des sous-marins pour empêcher les envahisseurs de s'approcher trop près de nos navires de surface."
GENERIC_surface_ships: "Navires de surface"
GENERIC_surface_ships_desc: "La force brute derrière toute opération maritime, étudier les navires de surface les plus efficaces et modernes nous conduira directement vers la suprématie navale."
GENERIC_dockyards: "Chantiers navals"
GENERIC_dockyards_desc: "Construire plus de ports et stimuler l'industrie navale est nécessaire pour que nous prospérions dans le commerce et le combat !"
GENERIC_nuclear_submarines: "Sous-marins nucléaires"
GENERIC_nuclear_submarines_desc: "Un sous-marin nucléaire est tout type de sous-marin alimenté par un réacteur nucléaire. Ils sont plus puissants, plus rapides et n'ont pratiquement jamais besoin de se ravitailler."
GENERIC_naval_doctrine_innovations: "Innovations en doctrine navale"
GENERIC_naval_doctrine_innovations_desc: "Nous pouvons étudier la doctrine factionnelle standard de certaines des puissances militaires mondiales les plus puissantes pour devenir plus efficaces dans le combat maritime."
GENERIC_light_helicopter_operators: "Porte-hélicoptères léger"
GENERIC_light_helicopter_operators_desc: "Un porte-hélicoptères est un porte-avions principalement utilisé pour transporter des hélicoptères, mais il est aussi souvent classé comme un navire d'assaut amphibie ou un porte-avions anti-sous-marin. Il est principalement utilisé pour des missions d'aviation militaire, y compris la guerre anti-sous-marine, les opérations amphibies et le soutien aérien rapproché."
GENERIC_aircraft_carriers: "Porte-avions"
GENERIC_aircraft_carriers_desc: "Un porte-avions est un navire de guerre servant de base aérienne maritime, équipé d'un pont d'envol complet et d'installations pour transporter, armer, déployer et récupérer des aéronefs."
GENERIC_naval_doctrine_expertise: "Expertise en doctrine navale"
GENERIC_naval_doctrine_expertise_desc: "Intégrer chaque élément de la doctrine navale moderne dans un ensemble de tactiques combinées fera trembler même les plus grandes puissances maritimes face à notre prouesse."
GENERIC_vessel_production: "Construction navale"
GENERIC_vessel_production_desc: "Il pourrait être possible de générer une augmentation des taux de production navale en optimisant la paperasserie des chantiers navals et en promouvant la culture navale dans les États côtiers."
GENERIC_air_force_reform: "Réforme de l'armée de l'air"
GENERIC_air_force_reform_desc: "Selon le principe qu'une nation contrôlant ses cieux contrôle ses terres, nous devons poursuivre la modernisation de toutes les doctrines concernant l'air."
GENERIC_fighter_planes: "Avions de chasse"
GENERIC_fighter_planes_desc: "Les avions de chasse ou de poursuite sont conçus pour le combat air-air. Ils sont le principal moyen pour notre armée de l'air d'obtenir la supériorité aérienne sur n'importe quel espace de combat."
GENERIC_air_doctrine_innovations: "Innovations en doctrine aérienne"
GENERIC_air_doctrine_innovations_desc: "La doctrine aérienne évolue aussi rapidement que notre technologie et celle de nos ennemis, se développant et régressant avec elle. Il est temps d'accélérer le processus."
GENERIC_capital_defense_scheme: "Plan de défense de la capitale"
GENERIC_capital_defense_scheme_desc: "Établir un plan de défense plus complet contre les aéronefs et autres menaces aériennes garantira que notre peuple se sente en sécurité maintenant et pour toujours."
GENERIC_capital_defense_scheme_tt: "Ajoute §G1§! §Ybâtiment anti-aérien§! dans un §YÉtat possédé aléatoire§!"
GENERIC_defense_scheme_beta: "Plan de défense avancé de la capitale"
GENERIC_defense_scheme_beta_desc: "Améliorer davantage la défense de notre capitale pour garantir qu'il n'y aura aucun problème en aucune circonstance."
GENERIC_defense_scheme_beta_tt: "Ajoute §G1§! §Ybâtiment anti-aérien§! dans un §YÉtat possédé aléatoire§!"
GENERIC_countermeasures_against_aircraft: "Contre-mesures contre les aéronefs"
GENERIC_countermeasures_against_aircraft_desc: "Si nous devons défendre notre territoire contre des adversaires potentiellement supérieurs en air, nous devons nous concentrer spécifiquement sur la technologie des armes anti-aériennes."
GENERIC_bomber_planes: "Avions de bombardement"
GENERIC_bomber_planes_desc: "Le bombardement stratégique avec l'utilisation d'avions de bombardement démoralisera l'ennemi et endommagera son réseau logistique, même à une époque de transport irrégulier. C'est une priorité lors de l'offensive."
GENERIC_drones: "Drones"
GENERIC_drones_desc: "La technologie des UAV (véhicules aériens sans pilote) nous permettra de bombarder, d'assassiner et de nous débarrasser de cibles à longue distance, qu'il s'agisse d'humains ou d'infrastructures, sans sacrifier une once de main-d'œuvre, car les drones sont télécommandés."
GENERIC_air_doctrine_expertise: "Expertise en doctrine aérienne"
GENERIC_air_doctrine_expertise_desc: "Notre armée de l'air est maintenant véritablement redoutable - tout comme les tactiques que nous utilisons. Continuer à moderniser et faire évoluer notre doctrine nous permettra de contrôler les cieux de manières jamais imaginées auparavant."
GENERIC_army_reform: "Réforme de l'armée"
GENERIC_army_reform_desc: "La réforme de l'armée sera la première priorité, sans une armée forte, nous ne pouvons pas défendre notre pays."
GENERIC_military_emergency: "Urgence militaire"
GENERIC_military_emergency_desc: "La situation de guerre est devenue extrêmement défavorable pour nous. Nous n'avons d'autre choix que de lancer un appel d'urgence et de concentrer toutes nos forces pour surmonter les difficultés."
GENERIC_military_equipment_procurement: "Acquisition d'équipements militaires"
GENERIC_military_equipment_procurement_desc: "Sans armes suffisantes, notre armée aurait du mal à accomplir n'importe quelle mission, nous avons donc initié une acquisition d'urgence d'armes."
GENERIC_land_doctrine_innovations: "Innovations en doctrine terrestre"
GENERIC_land_doctrine_innovations_desc: "La guerre moderne exige de l'adaptation. En mettant à jour nos doctrines avec de nouvelles stratégies et technologies, nous pouvons garantir que nos forces restent efficaces et prêtes pour les conflits futurs."
GENERIC_military_exercises: "Exercices militaires"
GENERIC_military_exercises_desc: "Des exercices intensifs améliorent la préparation au combat et la coordination des unités, garantissant que nos forces performent parfaitement sous pression."
GENERIC_military_education_reform: "Réforme de l'éducation militaire"
GENERIC_military_education_reform_desc: "Moderniser l'éducation militaire forme des leaders plus forts, des stratèges plus affûtés et une force capable de relever les défis contemporains."
GENERIC_infantry_equipment_development: "Développement d'équipements d'infanterie"
GENERIC_infantry_equipment_development_desc: "Faire progresser les équipements d'infanterie garantit que nos soldats disposent d'outils de pointe, améliorant leur efficacité et leur survivabilité sur le champ de bataille."
GENERIC_land_doctrine_expertise: "Expertise en doctrine terrestre"
GENERIC_land_doctrine_expertise_desc: "Améliorer notre compréhension des doctrines terrestres modernes nous permet de maximiser l'efficacité sur le champ de bataille et de déjouer tout adversaire."
GENERIC_artillery_experiments: "Expérimentations d'artillerie"
GENERIC_artillery_experiments_desc: "Tester de nouveaux systèmes et techniques d'artillerie améliore la précision, la puissance de feu et l'adaptabilité sur le champ de bataille moderne."
GENERIC_uniform_improvements: "Améliorations des uniformes"
GENERIC_uniform_improvements_desc: "Améliorer les uniformes militaires augmente le confort, la durabilité et l'adaptabilité à divers environnements de combat."
GENERIC_self_propelled_artillery: "Artillerie autopropulsée"
GENERIC_self_propelled_artillery_desc: "Intégrer la mobilité à la puissance de feu garantit que notre artillerie peut rapidement soutenir les unités en progression et répondre aux changements de lignes de bataille."
GENERIC_develop_armor_prototypes: "Développer des prototypes de blindés"
GENERIC_develop_armor_prototypes_desc: "Concevoir des véhicules blindés de nouvelle génération renforce notre capacité à dominer le combat terrestre avec une puissance de feu et une protection supérieures."
GENERIC_countermeasures_against_armored_units: "Contre-mesures contre les unités blindées"
GENERIC_countermeasures_against_armored_units_desc: "Développer des tactiques et des armes efficaces pour contrer les blindés ennemis nous permet de neutraliser leurs unités lourdes efficacement."
