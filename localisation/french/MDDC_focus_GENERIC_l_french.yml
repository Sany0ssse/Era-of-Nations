integrate_new_territories_desc: "Si nous avons suffisamment de conformité, nous pouvons pleinement intégrer les territoires occupés comme parties intégrantes de notre État.\n\n§YConformité§ ! nécessaire pour l'intégration : §Y99§ !"
GENERIC_hamas_support_category: "Soutien au Hamas"
GENERIC_hamas_support_category_desc: "\n\n\n\n\n\n£GFX_GENERIC_hamas_support_category\n\n\n\n\n\n\n\n\n En 1948, l'État juif d'Israël a été créé sur le territoire de la Palestine. En même temps, la majorité du « Foyer national juif » était composée de la population arabe, qui a réagi de manière agressive au mandat britannique. L'agression constante de Tel-Aviv contre le monde arabe et les répressions contre la population palestinienne ont attisé le feu. \n\n L'expansion agressive d'Israël a presque complètement absorbé l'État palestinien. Dès la première guerre en 1987, le Hamas a été créé dans la bande de Gaza pour évincer le Fatah (Mouvement pour la libération nationale de la Palestine). Contrairement au Fatah, le Hamas prônait une opposition radicale à Israël et la création d'un État arabe islamique sur l'ensemble d'Israël, de la bande de Gaza et de la Cisjordanie. Le Hamas poursuit sa lutte radicale contre Israël à ce jour. \n\n Nous sommes obligés d'aider nos amis musulmans dans leur lutte pour la liberté, l'indépendance et un avenir radieux sur leur territoire."
