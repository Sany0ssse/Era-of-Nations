##########ARBRE POLITIQUE##########
##########Focus##########
###########Islamistes#########
GENERIC_torjestvo_jihad: "Triomphe du Jihad"
GENERIC_torjestvo_jihad_desc: "Le salafisme triomphe désormais dans notre pays, loué soit Allah !"
GENERIC_call_intern_jihadis: "Appel aux jihadistes internes"
GENERIC_call_intern_jihadis_desc: "Nous devons lancer un appel pour que tous les jihadistes fidèles soient désormais les bienvenus dans notre pays."
GENERIC_bring_muftis: "Faire venir des muftis"
GENERIC_bring_muftis_desc: "Nous devons purifier notre umma des faux prêtres et faire venir de véritables muftis salafistes qui partageront nos idées."
GENERIC_crush_mushriqs: "Écraser les mushriqs"
GENERIC_crush_mushriqs_desc: "Les mushriqs sont les pires de tous et nous devons leur donner une leçon."
GENERIC_declare_malikate: "Déclarer un malikate"
GENERIC_declare_malikate_desc: "Nous nous déclarerons un malikate, à l'image du système saoudien."
GENERIC_medrese_propaganda: "Propagande des madrasas"
GENERIC_medrese_propaganda_desc: "Nous devons utiliser diverses madrasas pour propager nos idées parmi la population."
GENERIC_ensure_ties_with_saudis: "Renforcer les liens avec les Saoudiens"
GENERIC_ensure_ties_with_saudis_desc: "Les Saoudiens ont montré au monde que le salafisme peut être durable, et nous suivrons leurs pas."
GENERIC_religious_fanaticism: "Fanatisme religieux"
GENERIC_religious_fanaticism_desc: "Nous devons obliger chaque personne dans notre pays à être la plus fidèle et pure dans ses pensées et ses actes."
GENERIC_inghimasi: "Inghimasi"
GENERIC_inghimasi_desc: "Ceux qui le souhaitent peuvent se porter volontaires pour devenir martyrs en cas de guerre."
GENERIC_unify_caliphate: "Unifier le califat"
GENERIC_unify_caliphate_desc: "Nous sommes le véritable califat et nous devons le montrer au monde entier."
GENERIC_taqfir_to_infidels: "Takfir aux infidèles"
GENERIC_taqfir_to_infidels_desc: "Les infidèles doivent marcher au bord de la route lorsque nous passons. Ils doivent trembler, craindre et être soumis."
GENERIC_effective_jizya: "Jizya efficace"
GENERIC_effective_jizya_desc: "Nous devons rendre notre taxe de jizya sur les infidèles non seulement humiliante, mais aussi efficace."
GENERIC_government_sharia: "Charia gouvernementale"
GENERIC_government_sharia_desc: "La charia doit être la base de notre constitution et de notre code de lois."
##########Chiites##########
GENERIC_iron_hand_shiism: "Main de fer du chiisme"
GENERIC_iron_hand_shiism_desc: "Notre règle doit être ferme, pour ne pas laisser les ennemis de nos idées propager de la désinformation sur notre gouvernement !"
GENERIC_shiite_democracy: "Démocratie chiite"
GENERIC_shiite_democracy_desc: "Nous devons combiner les principes démocratiques avec la théocratie chiite pour créer une harmonie."
GENERIC_our_new_mullah: "Notre nouveau mollah"
GENERIC_our_new_mullah_desc: "Notre nouvelle tâche est de trouver un mollah qui pourrait devenir un candidat approprié pour le leadership spirituel de notre pays."
GENERIC_guards_of_revolution: "Gardiens de la nouvelle révolution"
GENERIC_guards_of_revolution_desc: "Notre révolution est un miracle que nous devons protéger à tout prix."
GENERIC_public_defence_system: "Système de défense publique"
GENERIC_public_defence_system_desc: "Nous devons créer un système pour protéger notre population contre les attaques physiques et psychologiques."
GENERIC_civil_sharia: "Charia civile"
GENERIC_civil_sharia_desc: "Nous devons utiliser les lois de la charia comme base de notre code civil."
GENERIC_iranian_system: "Système iranien"
GENERIC_iranian_system_desc: "L'expérience iranienne nous est très utile - nous pouvons copier des éléments de leur régime qui nous conviennent."
GENERIC_islamic_socialism: "Socialisme islamique"
GENERIC_islamic_socialism_desc: "Combiner l'islam et le socialisme est une idée glorieuse qui peut autonomiser la classe ouvrière islamique."
GENERIC_islamic_republic: "République islamique"
GENERIC_islamic_republic_desc: "Maintenant, nous pouvons officiellement nous proclamer une République islamique."
##########ARBRE DÉMOCRATIQUE##########
GENERIC_democracy: "Démocratie"
GENERIC_democracy_desc: "L'objectif principal de la démocratie est d'assurer le bien-être des citoyens, la protection de leurs droits et libertés, et le contrôle du pouvoir."
GENERIC_personal_freedom: "Liberté individuelle"
GENERIC_personal_freedom_desc: "Garantir les libertés individuelles des citoyens est notre devoir sacré et l'un des objectifs fondamentaux de la démocratie."
GENERIC_social_equity: "Équité sociale"
GENERIC_social_equity_desc: "Pour garantir la stabilité de la société, nous devons lui offrir une égalité sociale."
GENERIC_conservative_values: "Valeurs conservatrices"
GENERIC_conservative_values_desc: "Garantir des valeurs conservatrices et traditionnelles est nécessaire pour maintenir la stabilité de notre société."
GENERIC_family_defence: "Défense de la famille"
GENERIC_family_defence_desc: "Protéger les valeurs familiales nous permettra d'assurer la stabilité et de maintenir les taux de croissance démographique."
GENERIC_minimal_government: "Gouvernement minimal"
GENERIC_minimal_government_desc: "Le rôle de l'État devrait se limiter à fournir uniquement des services de base tels que la défense, l'application de la loi et l'entretien des infrastructures."
GENERIC_democratic_representation: "Représentation démocratique"
GENERIC_democratic_representation_desc: "Grâce aux mécanismes de représentation politique (principalement les élections et les partis politiques), l'implication des citoyens dans le processus politique est réalisée."
GENERIC_green_politic: "Politique verte"
GENERIC_green_politic_desc: "Notre objectif principal est de créer une société avec un environnement durable afin de réduire l'impact négatif humain sur les écosystèmes."
GENERIC_welfare_state: "État-providence"
GENERIC_welfare_state_desc: "Notre tâche est de fournir aux citoyens tous les biens et services nécessaires à leur confort de vie dans l'État."
GENERIC_freedom_of_speech: "Liberté d'expression"
GENERIC_freedom_of_speech_desc: "La liberté d'expression est un droit humain fondamental reconnu par la communauté internationale comme un élément essentiel d'une société démocratique."
GENERIC_economic_deregulation: "Déréglementation économique"
GENERIC_economic_deregulation_desc: "La déréglementation économique est le processus de réduction ou de suppression de la réglementation gouvernementale dans certains secteurs ou industries."
GENERIC_western_liberal_democracy: "Démocratie libérale occidentale"
GENERIC_western_liberal_democracy_desc: "La démocratie libérale occidentale est une forme de démocratie représentative dans laquelle les décisions prises sont basées sur une constitution qui protège les libertés individuelles et les droits des minorités dans la société."
GENERIC_independent_democracy: "Démocratie indépendante"
GENERIC_independent_democracy_desc: "La démocratie indépendante est un mode de vie politique dans la société où les autorités, leurs organes et leurs actions sont choisis, formés et dirigés exclusivement par la nation dans le but d'atteindre le bien-être matériel, la liberté et la justice pour tous les citoyens, groupes sociaux et peuples."
GENERIC_reactionary_democracy: "Démocratie réactionnaire"
GENERIC_reactionary_democracy_desc: "La démocratie réactionnaire est apparue en réaction aux mouvements révolutionnaires et au désir de réorganisation démocratique de la société. Ses partisans prônaient la préservation des structures politiques existantes, même si elles étaient considérées comme dépassées."
##########ARBRE NATIONALISTE##########
GENERIC_nationalism: "Nationalisme"
GENERIC_nationalism_desc: "Le nationalisme est une idéologie et une orientation politique dont le principe fondamental est la thèse de la valeur des nations ou de la nation comme la plus haute forme d'unité sociale, sa primauté dans le processus de formation de l'État."
GENERIC_glorious_past: "Passé glorieux"
GENERIC_glorious_past_desc: "En regardant le passé, nous devons construire l'avenir. Dans notre passé glorieux, notre puissante nation, dirigée par un monarque fort, écrasait ses ennemis et glorifiait le drapeau de notre État. Par tous les moyens, nous devons revenir à notre ancienne gloire !"
GENERIC_uncertain_times: "Temps incertains"
GENERIC_uncertain_times_desc: "L'établissement d'une dictature militaire est généralement associé à une crise socio-économique profonde dans l'État, à l'incapacité du gouvernement civil de trouver des méthodes de gouvernance efficaces pour surmonter la crise."
GENERIC_nation_spirit: "Esprit national"
GENERIC_nation_spirit_desc: "Nous appelons à l'unification de toute notre nation de sang pur au sein d'un seul État."
GENERIC_against_establishment: "Contre l'establishment"
GENERIC_against_establishment_desc: "L'anti-establishment est une idéologie politique qui s'oppose aux systèmes ou structures sociaux, politiques et économiques existants. Il est souvent associé à des mouvements qui remettent en question l'état actuel des choses et cherchent un changement radical dans la société."
GENERIC_traditional_values: "Valeurs traditionnelles"
GENERIC_traditional_values_desc: "Les valeurs traditionnelles sont des lignes directrices morales qui forment la vision du monde des citoyens, transmises de génération en génération, sous-tendant l'identité civile panrusse et l'espace culturel commun du pays, renforçant l'unité civile."
GENERIC_people_representatives: "Représentants du peuple"
GENERIC_people_representatives_desc: "Nous sommes en faveur de la présence au pouvoir des véritables représentants du peuple."
GENERIC_unity: "Unité"
GENERIC_unity_desc: "L'unité du peuple est la cohésion des gens, leur volonté de s'unir pour atteindre des objectifs communs."
GENERIC_militarization_society: "Militarisation de la société"
GENERIC_militarization_society_desc: "Pour assurer la sécurité nationale, nous devons militariser la société, élargir la conscription et être prêts à convertir l'économie en une économie militaire."
militarization_society_tt: "Ouvre une décision § ! « Programme de militarisation »§ !"
GENERIC_autoritarism: "Autoritarisme"
GENERIC_autoritarism_desc: "L'autoritarisme est un régime politique dans lequel le pouvoir est concentré entre les mains d'un seul dirigeant ou d'un groupe restreint d'élites dirigeantes, et la société a une participation limitée à la gouvernance du pays."
GENERIC_our_interests: "Nos intérêts"
GENERIC_our_interests_desc: "Maintenant, nous sommes à la croisée des chemins pour choisir nos intérêts, ce qui est le plus important pour nous en ce moment : assurer la stabilité intérieure ou renforcer notre position sur la scène internationale."
GENERIC_work_for_country: "Travailler pour le bien du pays"
GENERIC_work_for_country_desc: "L'État d'abord, nous devons assurer la vie du pays, même si nous devons sacrifier les libertés civiles pour y parvenir."
GENERIC_protect_people: "Protéger le peuple"
GENERIC_protect_people_desc: "Le facteur le plus important dans la formation de l'État est le peuple, et nous devons offrir au peuple une vie décente, du travail et un avenir."
GENERIC_fairness: "Justice"
GENERIC_fairness_desc: "La notion de justice dans le fascisme est liée à la recherche de réformes, mais en général, l'idéologie fasciste est orientée vers la domination d'un groupe particulier et le mépris des autres."
GENERIC_power: "Pouvoir"
GENERIC_power_desc: "Le pouvoir de l'État est un ensemble de capacités matérielles et spirituelles utilisées pour atteindre les objectifs géopolitiques de l'État. Notre pouvoir devrait inspirer la peur à nos ennemis et protéger l'intégrité territoriale de notre pays."
##########ARBRE DE GAUCHE##########
GENERIC_left_twist: "Tournant à gauche"
GENERIC_left_twist_desc: "Le tournant à gauche peut assurer une croissance durable de l'économie et le bien-être des citoyens."
GENERIC_people_government: "Gouvernement populaire"
GENERIC_people_government_desc: "Le Commissariat du peuple est un organe central du pouvoir exécutif chargé de l'administration dans une sphère particulière de l'activité de l'État ou dans une branche spécifique de l'économie nationale."
GENERIC_centralism: "Centralisme démocratique"
GENERIC_centralism_desc: "Le centralisme démocratique est une forme de structure organisationnelle et étatique basée sur le caractère contraignant des décisions des organes de niveau supérieur sur ceux de niveau inférieur, tous les organes étant élus et responsables devant ceux de niveau inférieur."
GENERIC_socialism: "Socialisme démocratique"
GENERIC_socialism_desc: "Le socialisme démocratique est une philosophie et une idéologie politique qui combine les principes de la démocratie avec les idéaux du socialisme."
GENERIC_five_year_plan: "Plan quinquennal"
GENERIC_five_year_plan_desc: "Le plan quinquennal vise à porter notre industrie et notre production au niveau supérieur pour sécuriser l'avenir de notre nation ! \n \n CE FOCUS LANCE LA MISSION DU PLAN QUINQUENNAL. LA PROGRESSION NÉCESSITE DE PRENDRE CONSTAMMENT DES DÉCISIONS, AVANT DE COMMENCER - ASSUREZ-VOUS QUE VOTRE ÉCONOMIE PEUT LE SUPPORTER."
generic_five_year_plan_tt: "Ouvre une décision § ! « Plan quinquennal »§ !"
GENERIC_limited_market: "Marché limité"
GENERIC_limited_market_desc: "Nous devons arrêter de donner inconsidérément nos ressources et les utiliser pour le bien de notre pays."
GENERIC_class_matter: "Question de classe"
GENERIC_class_matter_desc: "La question de classe englobe divers aspects liés à la définition des classes et de la lutte des classes à différentes périodes de l'histoire du pays."
GENERIC_new_culture: "Question culturelle"
GENERIC_new_culture_desc: "Maintenant, nous devons décider si nous conservons une approche conservatrice, avec la préservation des valeurs culturelles de nos citoyens, ou si nous empruntons la voie du marxisme culturel."
GENERIC_liberty: "Liberté"
GENERIC_liberty_desc: "On dit que le socialisme garantit la liberté à chaque membre de la société."
GENERIC_equality: "Égalité"
GENERIC_equality_desc: "On dit que le socialisme garantit l'égalité dans l'emploi et l'accès aux ressources."
GENERIC_fraternity: "Fraternité"
GENERIC_fraternity_desc: "La fraternité dans le socialisme est une communauté, une unité, une union basée sur des objectifs et des principes communs."
GENERIC_redistribution_income: "Redistribution des revenus"
GENERIC_redistribution_income_desc: "La redistribution des revenus est le processus par lequel l'État intervient dans la distribution des revenus entre différents groupes de population afin de réduire les inégalités ou d'atteindre d'autres objectifs sociaux."
GENERIC_militia: "Milice populaire"
GENERIC_militia_desc: "Pour assurer la sécurité intérieure, nous devons lever une milice de citoyens courageux qui se portent volontaires pour défendre la patrie."
##########ARBRE AUTOCRATIQUE##########
GENERIC_autocracy: "Autocratie"
GENERIC_autocracy_desc: "L'autocratie est une forme de structure étatique dans laquelle le pouvoir suprême appartient directement ou indirectement à un seul sujet."
GENERIC_people_regime: "Régime populaire"
GENERIC_people_regime_desc: "La démocratie populaire est une forme d'organisation politique de la société apparue après la Seconde Guerre mondiale dans plusieurs pays d'Europe et d'Asie."
GENERIC_independence: "Indépendance"
GENERIC_independence_desc: "Pour assurer notre avenir, nous devons garantir notre souveraineté, où nous seuls pouvons dicter comment nous vivons nos vies."
GENERIC_facade_democracy: "Démocratie de façade"
GENERIC_facade_democracy_desc: "La démocratie de façade est un type de système politique dans lequel des procédures démocratiques formelles servent de façade pour dissimuler des pratiques autoritaires."
GENERIC_western_investments: "Investissements occidentaux"
GENERIC_western_investments_desc: "Pour dynamiser notre économie, nous avons besoin de l'aide de nos homologues étrangers, j'espère qu'ils ne refuseront pas de nous accorder des investissements étrangers."
GENERIC_control_of_opposition: "Contrôle de l'opposition"
GENERIC_control_of_opposition_desc: "La tendance à réprimer l'opposition ou à limiter ses activités peut avoir un impact négatif sur les institutions et principes démocratiques. Cependant, cela nous permettra de renforcer notre gouvernement et de stabiliser la situation politique dans le pays."
GENERIC_economic_freedom: "Liberté économique"
GENERIC_economic_freedom_desc: "La liberté économique est un principe qui sous-tend l'économie de marché, permettant aux entités économiques (entrepreneurs, consommateurs, État) de prendre librement des décisions dans le domaine économique."
GENERIC_west: "Occident"
GENERIC_west_desc: "L'avenir réside dans l'orientation occidentale, nous devons donc chercher à établir des relations amicales avec l'OTAN et l'UE."
GENERIC_no_foreign_agents: "Lutte contre les agents étrangers"
GENERIC_no_foreign_agents_desc: "Les agents étrangers infiltrent de plus en plus la politique de notre nation, pour protéger notre souveraineté, nous avons le devoir de combattre ce fléau."
GENERIC_friendship_with_everyone: "Amitié avec tous"
GENERIC_friendship_with_everyone_desc: "Rester indépendant ne signifie pas rester sans alliés. Une politique neutre nous permet d'établir facilement de bonnes relations avec n'importe quelle puissance."
GENERIC_between_east_west: "Entre l'Est et l'Ouest"
GENERIC_between_east_west_desc: "Étant entre deux feux, nous devons prendre encore plus soin de la souveraineté du pays, afin de ne pas devenir un pion dans un jeu politique."
GENERIC_secret_police: "Service secret"
GENERIC_secret_police_desc: ""
GENERIC_police_state: "État policier"
GENERIC_police_state_desc: "Un État policier est une expression figurée qui décrit un ordre social dans lequel les autorités cherchent à contrôler, y compris par la répression, la vie sociale, économique et politique des citoyens."
GENERIC_eastern_investments: "Investissements orientaux"
GENERIC_eastern_investments_desc: "Pour dynamiser notre économie, nous avons besoin de l'aide de nos homologues étrangers, j'espère qu'ils ne refuseront pas de nous accorder des investissements étrangers."
GENERIC_national_patriotism: "Patriotisme national"
GENERIC_national_patriotism_desc: "L'éducation patriotique nationale vise à former un sentiment d'amour pour sa petite patrie, un respect pour les traditions et la culture nationales, et à éveiller un sentiment de fierté pour son peuple."
GENERIC_east: "Orient"
GENERIC_east_desc: "L'avenir réside dans l'orientation orientale, nous devons donc chercher à établir des relations amicales avec les BRICS et la CEI."
##########Décisions##########
GENERIC_stabilization_govern_category: "Stabilisation du pays"
GENERIC_stabilization_govern_category_desc: "Le coup d'État dans notre pays a eu un impact négatif sur la stabilité politique de notre nation, et nous devons immédiatement commencer à stabiliser notre État pour éviter une guerre civile."
GENERIC_the_start_stabilization: "Résultats de la stabilisation"
GENERIC_the_stabilization_army: "Stabilisation de l'armée"
GENERIC_the_stabilization_govern: "Stabilisation du gouvernement"
GENERIC_the_stabilization_society: "Stabilisation des médias"
GENERIC_militarization_category: "Programme de militarisation"
GENERIC_militarization_category_desc: "\n\n £GFX_militarization_category_picture \n\n\n\n Le programme de militarisation nous permettra de protéger notre souveraineté contre les menaces extérieures, d'être prêts à repousser toute attaque de menaces potentielles et de semer la peur dans les yeux de nos ennemis \n\n Cela nous permettra de nous préparer aux guerres à venir, d'augmenter la production, de gagner de la main-d'œuvre, de donner des ordres à votre armée et de mobiliser des milices pendant la guerre \n\n Nos préparatifs pour la guerre sont actuellement à : §H[?war_preparedness]%§ !"
GENERIC_military_propaganda: "Propagande militaire"
GENERIC_expand_recruitment_centers: "Expansion des centres de recrutement"
GENERIC_militarization_industry: "Militarisation de l'industrie"
GENERIC_military_training: "Entraînement militaire"
GENERIC_no_step_back: "Pas un pas en arrière"
GENERIC_raise_militias: "Lever les milices"
GENERIC_victory_or_death_dec: "Victoire ou mort !"
GENERIC_five_year_plan_category: "Plan quinquennal"
GENERIC_five_year_plan_category_desc: "Le président du [ROOT.GetRulingParty], avec le Comité central, a élaboré un §RPlan quinquennal§ ! pour le développement de notre pays. Selon le plan, nous devons multiplier notre §Gproductivité§ !, développer notre §Gindustrie§ ! et assurer une §Gproduction§ ! stable pour le siècle à venir. \n \n Progrès du plan quinquennal : §H[?five_year_plan_progress]%§"
GENERIC_support_workers: "Soutien aux travailleurs"
GENERIC_support_workers_desc: ""
GENERIC_increase_industry_turnover: "Augmenter le chiffre d'affaires industriel"
GENERIC_increase_industry_turnover_desc: ""
GENERIC_expand_industry: "Expansion de l'industrie"
GENERIC_expand_industry_desc: ""
five_year_plan_mission: "Plan quinquennal"
five_year_plan_mission_desc: "Si nous échouons à respecter le plan quinquennal, ce sera un désastre pour notre économie. Pendant la durée du plan, §Rnous ne devons pas nous impliquer dans des guerres§ ! et devons nous concentrer sur le soutien de notre industrie."
GENERIC_expand_agriculture: "Expansion agricole"
GENERIC_expand_agriculture_desc: ""
GENERIC_expand_energetic: "Expansion du secteur énergétique"
GENERIC_expand_energetic_desc: ""
GENERIC_start_five_year_plan: "Lancer le plan quinquennal"
GENERIC_start_five_year_plan_desc: "§RAVERTISSEMENT : Ne lancez le plan quinquennal que si vous êtes confiant dans votre économie et que vous ne prévoyez pas de vous engager dans une guerre au cours des 5 prochaines années. Compléter la progression du plan nécessite de prendre constamment des décisions, sinon vous n'aurez pas le temps d'exécuter le plan et devrez en assumer les conséquences !"
GENERIC_economic_category: "Politique économique"
GENERIC_economic_category_desc: "§Y[ROOT.GetFlag]Chaque nation§ ! doit maintenir un certain niveau de satisfaction énergétique pour éviter l'échec de ses fonctions et services. Si nous §Réchouons§ ! à répondre aux besoins énergétiques toujours croissants de notre économie, nous risquons de subir d'immenses §Rconséquences§ ! et un §Rarrêt économique complet§ !.\n[GENERIC_DEBT_loc]\n"
GENERIC_russian_investments: "@SOV Investissements russes"
GENERIC_china_investments: "@CHI Investissements chinois"
GENERIC_india_investments: "@RAJ Investissements indiens"
GENERIC_iran_investments: "@PER Investissements iraniens"
GENERIC_usa_investments: "@USA Investissements des États-Unis"
GENERIC_france_investments: "@FRA Investissements français"
GENERIC_german_investments: "@GER Investissements allemands"
GENERIC_british_investments: "@ENG Investissements britanniques"
GENERIC_nato_ratification_category: "Adhésion à l'OTAN"
GENERIC_nato_ratification_category_desc: "\n£GFX_MAIN_desctext_nato \n\n\n L'alliance de l'OTAN est l'avenir, toutes les technologies militaires les plus avancées s'y trouvent et, pour assurer la sécurité de nos frontières, nous devons établir des relations avec l'alliance, et peut-être même devenir membres à part entière de l'OTAN."
GENERIC_nato_pfp_decision: "Partenariat pour la paix"
GENERIC_nato_pfp_mission: "Obtention du statut PfP"
