  NATO_joint_operation: "Opération conjointe de l'OTAN"
  NATO_ratify_stanag_desc: "Chaque État membre de l'OTAN ratifie le STANAG et l'applique dans ses propres forces armées. L'objectif est de fournir des procédures opérationnelles et administratives communes ainsi qu'une logistique unifiée, permettant aux forces armées d'un pays membre d'utiliser les dépôts et le soutien des forces armées d'un autre pays membre. Les STANAG forment également la base de l'interopérabilité technique entre une large gamme de systèmes de communication et d'information (SCI) nécessaires aux opérations de l'OTAN et de ses alliés."
  NATO_decisions_desc: "\n£MAIN_desctext_nato\n\n\n\n§YOTAN§!, ou l'§YOrganisation du Traité de l'Atlantique Nord§!, est une alliance militaire entre plusieurs pays d'Amérique du Nord et d'Europe. L'§YOTAN§! constitue un système de défense collective par lequel ses États membres indépendants s'engagent à une défense mutuelle en réponse à une attaque par une partie externe. \n\nTout pays européen pouvant répondre aux exigences et normes de l'alliance peut rejoindre l'§YOTAN§!. Il y a quatre étapes pour rejoindre l'alliance. La première étape est d'obtenir le statut de §YPartenariat pour la paix (PfP)§!, la deuxième étape est la ratification par tous les membres et l'obtention du statut de §YPlan d'action individuel pour le partenariat (PIAP)§!, la troisième étape est d'obtenir le statut de §YDialogue accéléré§!, et enfin, la quatrième étape est la ratification par tous les membres et l'adhésion à l'§YOrganisation du Traité de l'Atlantique Nord§!. \n\nLes pays non situés sur le continent européen, si certaines conditions sont remplies, peuvent demander le statut d'§YAllié majeur non-membre de l'OTAN§!. Ce statut leur permet de mener des exercices conjoints avec l'alliance, ainsi que de demander de l'aide en cas de difficultés."
  NATO_rework.1.t: "Mener des exercices militaires avec [FROM.GetName]"
  NATO_rework.1.d: "Les exercices militaires conjoints nous permettront d'échanger des expériences militaires et de nous préparer à d'éventuelles opérations de combat, d'identifier et de corriger les lacunes de notre armée, et de tester l'efficacité au combat des armements. Quels exercices militaires devons-nous mener ?"
  NATO_rework.1.a: "Exercices terrestres"
  NATO_rework.1.b: "Exercices aériens"
  NATO_rework.1.c: "Exercices navals"
  recent_nato_army_exercises: "Exercices terrestres récents"
  recent_nato_air_exercises: "Exercices aériens récents"
  recent_nato_navy_exercises: "Exercices navals récents"
  NATO_rework.2.t: "[FROM.GetName] souhaite mener des exercices terrestres avec nous"
  NATO_rework.2.d: "[FROM.GetName] souhaite mener des exercices militaires avec nous. Ces exercices nous permettront d'échanger des expériences militaires et de nous préparer à d'éventuelles menaces. Devons-nous accepter ?"
  NATO_rework.2.a: "Commençons les exercices"
  NATO_rework.2.b: "Ce n'est pas le meilleur moment"
  NATO_rework.3.t: "[FROM.GetName] souhaite mener des exercices aériens avec nous"
  NATO_rework.3.d: "[FROM.GetName] souhaite mener des exercices militaires avec nous. Ces exercices nous permettront d'échanger des expériences militaires et de nous préparer à d'éventuelles menaces. Devons-nous accepter ?"
  NATO_rework.3.a: "Commençons les exercices"
  NATO_rework.3.b: "Ce n'est pas le meilleur moment"
  NATO_rework.4.t: "[FROM.GetName] souhaite mener des exercices navals avec nous"
  NATO_rework.4.d: "[FROM.GetName] souhaite mener des exercices militaires avec nous. Ces exercices nous permettront d'échanger des expériences militaires et de nous préparer à d'éventuelles menaces. Devons-nous accepter ?"
  NATO_rework.4.a: "Commençons les exercices"
  NATO_rework.4.b: "Ce n'est pas le meilleur moment"
  NATO_rework.5.t: "[FROM.GetName] a accepté de mener des exercices militaires"
  NATO_rework.5.d: "[FROM.GetName] a accepté de mener des exercices militaires avec nous. Ces exercices nous permettront d'échanger des expériences militaires et de nous préparer à d'éventuelles menaces."
  NATO_rework.5.a: "Super !"
  NATO_rework.6.t: "[FROM.GetName] a refusé de mener des exercices militaires"
  NATO_rework.6.d: "[FROM.GetName] a refusé de mener des exercices militaires avec nous. Peut-être que ce n'est pas le meilleur moment pour eux."
  NATO_rework.6.a: "Peut-être plus tard..."
  NATO_rework.7.t: "[FROM.GetName] exige une intervention de l'alliance"
  NATO_rework.7.d: "[FROM.GetName], notre allié stratégique hors alliance, est en état de guerre. Il est au bord de la défaite, ne tiendra pas longtemps, et demande donc l'intervention des forces de l'alliance. Devons-nous aider notre allié stratégique ?"
  NATO_rework.7.a: "Déclarer la mobilisation !"
  NATO_rework.7.b: "Nous n'entraînerons pas le pays dans une guerre"
  NATO_rework.8.t: "[FROM.GetName] nous demande de soutenir l'opération militaire"
  NATO_rework.8.d: "[FROM.GetName] a lancé une opération militaire et demande notre soutien. La doctrine de l'OTAN ne nous oblige pas à nous engager dans une guerre offensive, nous sommes libres de refuser, mais devons-nous abandonner notre allié ?"
  NATO_rework.8.a: "Mobiliser les forces !"
  NATO_rework.8.b: "Nous ne devons pas intervenir"
  NATO_rework.9.t: "[FROM.GetName] a répondu pour soutenir l'opération"
  NATO_rework.9.d: "[FROM.GetName] a répondu à notre appel, ils nous aideront à mener une opération militaire. Peut-être poursuivent-ils leurs propres objectifs, ou peut-être ont-ils simplement décidé de soutenir un allié, dans tous les cas, cela nous rapprochera encore plus."
  NATO_rework.9.a: "Très bien !"
  generic_nato.12.t: "[FROM.GetName] souhaite entamer un dialogue accéléré sur l'adhésion à l'OTAN"
  generic_nato.12.desc: "Ils font partie de notre famille de l'Atlantique Nord depuis longtemps et nous ont maintenant approchés avec une demande pour entamer un dialogue accéléré sur la question de l'adhésion à l'alliance. Devons-nous ratifier leur statut ?"
  generic_nato.12.a: "Bien sûr !"
  generic_nato.12.b: "Pas maintenant"
