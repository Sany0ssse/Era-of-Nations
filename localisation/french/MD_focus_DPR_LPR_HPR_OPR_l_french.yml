##########Contenu de Kharkiv##########
##########Focus##########
kharkiv_focus: "Objectifs de la République populaire de Kharkiv"
HPR_Start_rebellion: "Naissance d'une nouvelle république"
HPR_Start_rebellion_desc: "Une nouvelle république populaire est née, dans les terres de Novorossiya. Les habitants de Kharkiv ont défendu leur droit à l'autodétermination, maintenant ils doivent le préserver les armes à la main."
HPR_weapon_suplly: "Appropriation des armureries"
HPR_weapon_suplly_desc: "Les armureries que nous trouvons sur le territoire de notre république seront appropriées et les armes distribuées à notre milice populaire."
HPR_harkov_defence: "Renforcer Kharkiv"
HPR_harkov_defence_desc: "Nous commencerons la construction de fortifications défensives à Kharkiv, l'ennemi approche et nous devons être prêts à défendre la ville."
HPR_mobilisation: "Mobilisation de la population"
HPR_mobilisation_desc: "Le peuple de Kharkiv doit se lever pour son foyer natal, sinon l'ennemi ne nous épargnera pas et nous détruira."
HPR_people_militia: "Milice populaire de l'HPR"
HPR_people_militia_desc: "À l'instar des autres républiques, nous créerons également notre propre milice populaire pour protéger notre souveraineté."
HPR_russian_suplly: "Armes russes"
HPR_russian_suplly_desc: "La Russie nous envoie ses armes pour que nous puissions défendre notre indépendance."
HPR_government: "Gouvernement de la République"
HPR_government_desc: "Nous approuverons enfin le gouvernement et sa structure pour le fonctionnement complet de notre État."
HPR_bivalute: "Se débarrasser de la hryvnia"
HPR_bivalute_desc: "Nous n'avons plus l'intention d'utiliser la hryvnia pour les transactions, uniquement le rouble."
HPR_bank: "Banque d'État de Kharkiv"
HPR_bank_desc: "Nous commencerons à créer notre propre système économique avec la création de notre banque d'État."
HPR_passport: "Passeport de citoyen de Kharkiv"
HPR_passport_desc: "Nous créerons également notre propre citoyenneté, les gens doivent comprendre que nous vivons dans notre propre État."
HPR_operator: "Notre opérateur télécom"
HPR_operator_desc: "Nous nous débarrasserons complètement des opérateurs télécom ukrainiens et créerons le nôtre."
HPR_teroborona: "Créer une défense territoriale"
HPR_teroborona_desc: "En plus de la milice populaire, nous empruntons la pratique ukrainienne de créer une défense territoriale pour renforcer nos frontières et la sécurité intérieure."
HPR_afini: "Bataillon 'Athènes'"
HPR_afini_desc: "De nombreux citoyens concernés qui sont venus dans notre république ont déjà pu créer leur propre bataillon - Athènes. Alors que Sparte était dans la RPD, nous aurons Athènes."
HPR_mali: "Bataillon 'Mali'"
HPR_mali_desc: "Alors que nos frères de la RPD combattent sous la bannière du bataillon Somalie, nous créerons le bataillon Mali."
HPR_sloboda: "Bataillon cosaque 'Sloboda'"
HPR_sloboda_desc: "Des représentants des Cosaques sont arrivés dans notre république et ont créé leur propre bataillon."
HPR_mgb: "Ministère de la Sécurité d'État de l'HPR"
HPR_mgb_desc: "Nous créerons notre propre ministère, qui protégera la paix et la tranquillité de nos citoyens à l'intérieur de la république."
HPR_interbrigabe: "Interbrigades"
HPR_interbrigabe_desc: "Les interbrigades des bolcheviks nationaux arrivent de Russie, ensemble nous sommes une force !"
HPR_desorg: "Éliminer la désorganisation"
HPR_desorg_desc: "Nous éliminons la désorganisation dans notre armée, qui est composée de nombreux bataillons qui ne s'obéissent pas les uns aux autres."
HPR_defence: "Lignes défensives"
HPR_defence_desc: "Notre pays doit renforcer ses frontières et être prêt à se défendre davantage."
HPR_guard_republic: "Garde républicaine de l'HPR"
HPR_guard_republic_desc: "La Garde républicaine sera créée comme une unité d'élite qui effectuera les tâches les plus importantes au front."
HPR_infra: "Reconstruire l'infrastructure"
HPR_infra_desc: "Les combats ont complètement détruit notre infrastructure, et nous la restaurerons."
HPR_energy: "Secteur énergétique"
HPR_energy_desc: "Pour éviter que la république ne plonge dans l'obscurité, nous investirons dans le secteur énergétique."
HPR_kugbaz: "Nationaliser KubGas"
HPR_kugbaz_desc: "Nous nationalisons cette entreprise pour le bénéfice de la république."
HPR_kondicioner: "Nationaliser et relancer l'usine 'Kondicioner'"
HPR_kondicioner_desc: "Nous avons besoin de plus d'industrie et nous relancerons l'usine qui a été détruite auparavant."
HPR_referendum: "Référendum sur l'adhésion à la Russie"
HPR_referendum_desc: "Notre objectif principal était et reste de devenir une partie de la Russie, et nous organiserons un référendum pour décider si nous intégrons la Russie, mais nous pensons que le résultat est déjà clair. La Russie a le dernier mot."
HPR_economic: "Économie de Kharkiv"
HPR_economic_desc: "Nous commencerons la restauration des installations de production perdues sur le territoire de Kharkiv."
HPR_bronetank: "Usine de blindés de Kharkiv"
HPR_bronetank_desc: "L'entreprise d'État de l'industrie des blindés, qui effectue la production, la réparation, l'entretien, la remise à niveau et la modernisation des véhicules blindés."
HPR_avia_zavod: "Usine aéronautique de Kharkiv"
HPR_avia_zavod_desc: "L'entreprise d'ingénierie aéronautique dans la ville de Kharkiv. Elle produit des avions de passagers, de transport et militaires."
HPR_priborostroy: "Usine de fabrication d'instruments de Kharkiv"
HPR_priborostroy_desc: "L'une des plus grandes usines de l'URSS pour la production d'électronique militaire et d'équipements électriques domestiques."
HPR_tractor: "Usine de tracteurs de Kharkiv"
HPR_tractor_desc: "Une entreprise pour la production de tracteurs à chenilles et à roues."
HPR_agregat: "Bureau de conception d'agrégats de Kharkiv"
HPR_agregat_desc: "Une entreprise scientifique et de production du complexe militaro-industriel, qui développe et fabrique des unités pour les systèmes hydrauliques, de carburant et électriques de la technologie aéronautique et spatiale."
HPR_morozova: "Bureau de conception technique de Kharkiv"
HPR_morozova_desc: "Une entreprise développant des véhicules blindés. Auparavant, KP KKBM a joué un rôle clé dans la création de véhicules blindés à chenilles de l'Union soviétique."
HPR_specmachine: "Usine de machines spéciales de Kharkiv"
HPR_specmachine_desc: "L'entreprise d'État du complexe militaro-industriel."
HPR_malichev: "Usine Malyshev"
HPR_malichev_desc: "L'usine d'ingénierie des transports à Kharkiv, qui produit des moteurs, des locomotives et des chars."
HPR_reborn_ser_and_molot: "Relancer l'usine 'Marteau et Faucille'"
HPR_reborn_ser_and_molot_desc: "Une grande entreprise de machines agricoles à Kharkiv, elle était l'une des entreprises les plus importantes de l'industrie de Kharkiv et l'une des plus grandes entreprises de machines agricoles de l'Empire russe et de l'URSS."
HPR_concers: "Consortium de défense de Kharkiv"
HPR_concers_desc: "Nous regrouperons toutes nos entreprises de l'industrie militaire en un seul consortium. Ainsi, nous renforcerons la coordination de la production et augmenterons la productivité."
