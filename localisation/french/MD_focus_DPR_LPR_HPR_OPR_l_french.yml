# Focus
BLR_Economic: "Économie biélorusse"
BLR_Economic_desc: "Nous devons développer notre économie, et nous utilisons un certain nombre de mesures pour mettre en œuvre ce développement avec succès."
BLR_Expand_Mozyr_Refinery: "Expansion de la raffinerie de Mozyr"
BLR_Expand_Mozyr_Refinery_desc: "Nous agrandirons cette installation de stockage de pétrole."
BLR_Belshina: "JSC Belshina"
BLR_Belshina_desc: "JSC Belshina est un fabricant de pneus pour automobiles. Il produit des pneus pour voitures particulières, camions, véhicules lourds, engins de construction routière et de levage, véhicules électriques, autobus, tracteurs et machines agricoles."
BLR_Expand_Naftan_Refinery: "Expansion de la raffinerie de Naftan"
BLR_Expand_Naftan_Refinery_desc: "Nous agrandirons cette installation de stockage de pétrole."
BLR_Expansion_Okolovsky_Novoselkovsky: "Expansion de la production de minerais"
BLR_Expansion_Okolovsky_Novoselkovsky_desc: "L'expansion de la production de minerais des gisements d'Okolovsky et de Novoselkovsky nous apportera beaucoup d'acier."
BLR_metro_minsk: "Métro de Minsk"
BLR_metro_minsk_desc: "Nous améliorerons et agrandirons le métro de Minsk pour optimiser les caractéristiques logistiques de la ville."
BLR_belavia: "Belavia"
BLR_belavia_desc: "Compagnie aérienne d'État biélorusse basée à Minsk. Créée en 1996, elle opère principalement des vols internationaux réguliers et charters depuis l'aéroport national de Minsk."
BLR_Zubr_Energy_LLC: "Zubr Energy LLC"
BLR_Zubr_Energy_LLC_desc: "Usine de production de batteries de démarrage destinées aux lignes de production des constructeurs automobiles mondiaux et locaux."
BLR_Hi_Tech_Park: "Parc Hi-Tech"
BLR_Hi_Tech_Park_desc: "Le Parc Hi-Tech est un régime fiscal et juridique spécial pour le développement des affaires informatiques en Biélorussie. Ce n'est pas une zone économique spéciale, mais une juridiction fonctionnant sur le principe de l'extraterritorialité. Les entreprises et entrepreneurs individuels enregistrés dans le Parc peuvent bénéficier des avantages offerts, quel que soit l'emplacement de leur bureau en Biélorussie."
BLR_Factory_Kommunarka: "Usine Kommunarka"
BLR_Factory_Kommunarka_desc: "Notre président considère que la privatisation de l'usine de confiserie 'Kommunarka' était illégale, c'est pourquoi il a été annoncé la nationalisation de cette entreprise."
BLR_MZKT: "MZKT"
BLR_MZKT_desc: "L'usine de tracteurs à roues de Minsk est une entreprise spécialisée dans la production de véhicules lourds routiers et tout-terrain, de véhicules remorqués, de châssis à roues spéciaux pour l'installation d'équipements pour les entreprises de construction, pétrolières, gazières et de fabrication de machines ; une entreprise d'État sous la juridiction du Comité militaro-industriel d'État de la République de Biélorussie."
BLR_mtz: "Usine de tracteurs de Minsk"
BLR_mtz_desc: "Usine en Biélorussie, fabricant de machines agricoles. L'usine de tracteurs de Minsk a été fondée le 29 mai 1946. Sa capacité est conçue pour la production de 71 000 tracteurs de différentes séries."
