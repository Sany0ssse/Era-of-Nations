lithuanian_paganism_idea: "Vidilisme-Romuva"
lithuanian_paganism_idea_desc: "Le néopaganisme balte est une catégorie de mouvements religieux autochtones qui se sont revitalisés parmi les peuples baltes (principalement les Lituaniens et les Lettons). La mythologie balte découle finalement de la mythologie proto-indo-européenne, en particulier de la branche balto-slave des croyances populaires."
BLR_white_legion_idea: "§CLégion blanche§!"
BLR_white_legion_idea_desc: "Nous avons intégré les nationalistes radicaux biélorusses en tant que milices gouvernementales sous contrôle militaire."
