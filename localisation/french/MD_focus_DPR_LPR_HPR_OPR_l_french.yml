BLR_cheln_trade: "Commerce de navette"
BLR_cheln_trade_desc: "Les grandes entreprises n'ont pas encore atteint la Biélorussie, alors des navettes sont apparues, apportant des appareils électroménagers de qualité, ainsi qu'une série d'autres biens d'occasion et de luxe avec des marges élevées."
BLR_Economic_full_idea: "Économie biélorusse"
BLR_Economic_full_idea_desc: "L'économie biélorusse est l'héritière directe de l'URSS, maintenant la domination du secteur public, mais cela peut entraîner de sérieux problèmes si le leadership décide de mettre définitivement fin à cette approche de la formation de l'économie."
