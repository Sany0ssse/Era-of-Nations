DPR_start: "République populaire"
dpr_focus: "Objectifs de la République populaire de Donetsk"
DPR_start_desc: "Nous n'avons plus de retour en arrière possible. Nous lutterons pour notre indépendance."
DPR_vstavai_dombass: "Debout, Donbass"
DPR_vstavai_dombass_desc: "Chaque mineur, enseignant, soldat et ouvrier. Nous combattrons tous pour notre patrie !"
DPR_reform_army: "Réformer l'armée"
DPR_reform_army_desc: "Il est nécessaire d'organiser toutes les unités de combat en une structure unique."
DPR_reforms_army: "Réformes militaires complètes"
DPR_reforms_army_desc: "Notre milice populaire est prête à défendre la patrie."
DPR_bank: "Banque centrale de Donetsk"
DPR_bank_desc: "Nous devons organiser notre système bancaire."
DPR_propaganda: "Activer la machine de propagande"
DPR_propaganda_desc: "Il est temps de convaincre le peuple de la justesse de notre rébellion."
DPR_gos_granitca: "Renforcer la frontière d'État"
DPR_gos_granitca_desc: "L'ennemi ne passera pas !"
DPR_pasports: "Passeport de citoyen de la République de Donetsk"
DPR_pasports_desc: "Nos citoyens doivent avoir leur passeport."
DPR_cheburashka: "MLRS Cheburashka"
DPR_cheburashka_desc: "Nos propres systèmes de roquettes à lancement multiple seront un excellent ajout à l'armée."
DPR_resource_from_sov: "Aide de la Russie"
DPR_resource_from_sov_desc: "Nous avons été déconnectés du réseau électrique et de l'approvisionnement en gaz ukrainiens, nous espérons que la Russie nous aidera."
DPR_warehouse: "Entrepôts d'armes"
DPR_warehouse_desc: "Il est temps de fouiller les anciens entrepôts soviétiques."
DPR_somali: "Bataillon 'Somali'"
DPR_somali_desc: "L'un des premiers bataillons créés sur le territoire de notre république."
DPR_rebuild_ruins: "Commencer à reconstruire les ruines"
DPR_rebuild_ruins_desc: "La guerre a causé de nombreuses destructions dans notre pays. Il est temps de commencer la reconstruction."
DPR_nationalise: "Nationalisation des entreprises ukrainiennes"
DPR_nationalise_desc: "Notre république a besoin d'usines, d'entreprises et de revenus fiscaux. Nous pensons pouvoir résoudre cette question."
DPR_interbrigade: "Interbrigades"
DPR_interbrigade_desc: "Les interbrigades des bolcheviks nationaux arrivent de Russie, ensemble nous sommes une force !"
DPR_ros_banks: "Offrir une place aux banques russes"
DPR_ros_banks_desc: "Peut-être que les banques russes seront intéressées par notre république."
DPR_obtf_kaskad: "OBTF Kaskad"
DPR_obtf_kaskad_desc: "Formation tactique opérationnelle-combat de la République populaire de Donetsk. L'OBTF 'Kaskad' inclut des éléments des forces et moyens des agences de maintien de l'ordre de la RPD. Le lien clé de l'OBTF 'Kaskad' est le ministère de l'Intérieur de la RPD."
DPR_vstuplenie_v_rf: "Retour à la patrie"
DPR_vstuplenie_v_rf_desc: "Nous organiserons un référendum sur l'adhésion à la Russie. Il est temps pour nous de rentrer chez nous."
DPR_integrate_army: "Commencer l'intégration dans l'armée russe"
DPR_integrate_army_desc: "Il est temps de commencer l'intégration dans l'armée russe."
DPR_integrate_army1: "Intégration complète dans l'armée russe"
DPR_integrate_army1_desc: "Nos forces armées respectent pleinement les normes de l'armée russe."
DPR_rzso_cheburashka: "MLRS 'Cheburashka'"
DPR_rzso_cheburashka_desc: "D'un point de vue technique, le Cheburashka est un système de roquettes à lancement multiple moderne typique, similaire à d'autres échantillons de cette classe. En même temps, ce MLRS présente plusieurs caractéristiques intéressantes qui lui confèrent une apparence distinctive et/ou des capacités de combat spéciales."
DPR_rzso_snejinka: "MLRS 'Snejinka'"
DPR_rzso_snejinka_desc: "D'un point de vue technique, le Snejinka est un système de roquettes à lancement multiple moderne typique, similaire à d'autres échantillons de cette classe. En même temps, ce MLRS présente plusieurs caractéristiques intéressantes qui lui confèrent une apparence distinctive et/ou des capacités de combat spéciales."
DPR_guard: "Garde républicaine de la RPD"
DPR_guard_desc: "La Garde républicaine sera créée comme une unité d'élite qui effectuera les tâches les plus importantes au front."
DPR_mgb: "Ministère de la Sécurité d'État de la RPD"
DPR_mgb_desc: "Nous créerons notre propre ministère, qui protégera la paix et la tranquillité de nos citoyens à l'intérieur de la république."
DPR_sparta: "Bataillon 'Sparta'"
DPR_sparta_desc: ""
DPR_oplot: "Bataillon 'Oplot'"
DPR_oplot_desc: ""
DPR_dizel: "Bataillon 'Dizel'"
DPR_dizel_desc: ""
DPR_khan: "Bataillon spécial à usage particulier 'Khan'"
DPR_khan_desc: ""
DPR_blpa: "Recherche sur les drones"
DPR_blpa_desc: "Nous commencerons à essayer de développer nos propres drones."
DPR_government: "Gouvernement de la République"
DPR_government_desc: "Nous approuverons enfin le gouvernement et sa structure pour le fonctionnement complet de notre État."
DPR_donetsk_build: "Renforcer Donetsk"
DPR_donetsk_build_desc: "Nous commencerons la construction de fortifications défensives à Donetsk, l'ennemi approche et nous devons être prêts à défendre la ville."
DPR_gaz_contracts_russia: "Approvisionnements en pétrole et gaz depuis la Russie"
DPR_gaz_contracts_russia_desc: "La Russie est prête à nous fournir des ressources pétrolières et gazières."
DPR_youth: "Politique de la jeunesse"
DPR_youth_desc: "Nous compterons sur notre jeunesse - elle est notre avenir."
DPR_anti_gibdd: "Anti-LGBT"
DPR_anti_gibdd_desc: "Nous n'autoriserons pas les représentants de ces minorités dans notre république."
DPR_religion_boost: "Mise en avant de la religion"
DPR_religion_boost_desc: "Notre république sera un bastion de l'orthodoxie véritable."
DPR_anti_ukrain: "Activités anti-ukrainiennes"
DPR_anti_ukrain_desc: "Nous orienterons complètement notre propagande partout et en tout vers des activités anti-ukrainiennes."
DPR_sports: "Développement du sport"
DPR_sports_desc: "Il est nécessaire de développer le sport dans notre république pour que grandisse une génération forte de défenseurs."
DPR_vpk: "Restaurer les usines militaires"
DPR_vpk_desc: "Il est temps de relancer nos grandes usines."
DPR_internet: "Opérateur Internet 'Phoenix'"
DPR_internet_desc: "Nous sommes prêts à développer notre réseau Internet pour le bien-être des citoyens de notre république."
DPR_rifles: "Fusils nationaux"
DPR_rifles_desc: "Nous avons créé des prototypes de nos propres développements parmi les fusils pour nos soldats."
DPR_univer: "École supérieure des forces armées de Donetsk"
DPR_univer_desc: "Nous recréerons l'École supérieure militaro-politique de Donetsk pour le génie et les troupes de communication, et nous formerons ici de nouveaux personnels pour notre armée."
DPR_sport_development: "Développement du sport"
DPR_referendum: "Référendum sur l'adhésion à la Fédération de Russie"
DPR_referendum_desc: "Il est temps de décider - la Russie nous acceptera-t-elle ?"
DPR_first_invest: "Investissements de la Russie"
DPR_first_invest_desc: "Enfin, les premiers investissements iront à la restauration du Donbass."
DPR_strelkov_rise: "Strelkov au pouvoir"
DPR_strelkov_rise_desc: "Igor Ivanovitch dirige désormais pleinement Novorossiya. Où cela nous mènera-t-il ?"
DPR_traitor_cleane: "Éliminer les commandants incontrôlés"
DPR_traitor_cleane_desc: "Nous n'avons besoin que de ceux qui exécuteront nos ordres à cent pour cent."
DPR_critisize_kremlin: "Critique du Kremlin"
DPR_critisize_kremlin_desc: "Le Kremlin n'a pas aidé Novorossiya de toutes ses forces, nous utilisons une rhétorique négative pour convaincre le peuple que nous devons nous battre seuls."
DPR_total_mobilisation: "Mobiliser tout le monde"
DPR_total_mobilisation_desc: "Novorossiya vaincra si tout le monde se lève pour elle."
DPR_total_war: "La dernière guerre contre l'Ukraine"
DPR_total_war_desc: "Il est temps de libérer nos terres."
DPR_npz: "Nationaliser les raffineries locales"
DPR_npz_desc: "Nous nationaliserons tout ce qui appartenait à l'ancien gouvernement."
DPR_infra: "Restaurer l'infrastructure"
DPR_infra_desc: "Nous avons besoin de routes, beaucoup de routes."
DPR_total_ressurection: "Tout restaurer"
DPR_total_ressurection_desc: "Il est temps de faire revivre notre terre natale."
DPR_ros_invest: "Investissements russes"
DPR_ros_invest_desc: "Notre république a besoin de fonds pour son développement, et la Russie est prête à les fournir."
DPR_ros_concept_interven: "Concept de politique étrangère de la Russie"
DPR_ros_concept_interven_desc: "Nous participerons activement aux missions militaires extérieures de la Russie. Nos volontaires aideront partout où la Russie en aura besoin."
DPR_create_nov: "Création de Novorossiya"
DPR_create_nov_desc: "Nous annoncerons la création d'une entité étatique unifiée - Novorossiya."
DPR_nov_army: "L'Armée de Novorossiya"
DPR_nov_army_desc: "Nous commencerons la création d'une Armée unifiée de Novorossiya."
DPR_nov_annex_opr: "Annexer la République d'Odessa à Novorossiya"
DPR_nov_annex_opr_desc: "Nous élargirons Novorossiya en intégrant la nouvelle république."
DPR_nov_annex_hpr: "Annexer la République de Kharkiv à Novorossiya"
DPR_nov_annex_hpr_desc: "Nous élargirons Novorossiya en intégrant la nouvelle république."
DPR_territorial_defence: "Créer une défense territoriale"
DPR_territorial_defence_desc: "En plus de la milice populaire, nous empruntons la pratique ukrainienne de créer une défense territoriale pour renforcer nos frontières et la sécurité intérieure."
DPR_nov_propaganda: "Promouvoir l'unité"
DPR_nov_propaganda_desc: ""
DPR_nov_zavods: "Intégration des entreprises industrielles"
DPR_nov_zavods_desc: ""
DPR_nov_economic: "Intégration économique"
DPR_nov_economic_desc: ""
DPR_nov_politic: "Intégration politique"
DPR_nov_politic_desc: ""
DPR_nov_annex: "Créer Novorossiya"
DPR_nov_annex_desc: ""
DPR_donbass_century: "Le nouveau millénaire"
DPR_donbass_century_desc: "Notre magnifique Donbass entre dans un nouveau millénaire, serons-nous capables de développer notre région pour qu'elle attire les gens, ou restera-t-elle en stagnation éternelle ?"
DPR_donbass_economic: "Économie du Donbass"
DPR_donbass_economic_desc: "Nous devons résoudre tous les problèmes économiques de la région pour enfin passer à la croissance économique."
DPR_donbass_shina: "Fabrication de pneus"
DPR_donbass_shina_desc: "Nous ouvrirons notre propre production de pneus pour répondre aux besoins de la région."
DPR_donbass_small_business: "Soutenir les petites entreprises"
DPR_donbass_small_business_desc: "Nous sommes prêts à soutenir les petites entreprises - nous croyons qu'elles sont le moteur futur de notre économie."
DPR_donbass_nalogs: "Réforme fiscale"
DPR_donbass_nalogs_desc: "Nous mènerons une réforme fiscale pour alléger le fardeau fiscal des citoyens ordinaires."
DPR_donbass_procent: "Le pourcentage du Donbass"
DPR_donbass_procent_desc: "Nous introduirons ce qu'on appelle le pourcentage du Donbass. Il sera alloué au revenu total des travailleurs depuis le trésor public, afin de maintenir la croissance des revenus des citoyens."
DPR_donbass_big_business: "Vers les grandes entreprises"
DPR_donbass_big_business_desc: "Nous travaillerons également dur avec les grandes entreprises pour augmenter les revenus fiscaux du trésor."
DPR_donbass_go: "En avant, Donbass !"
DPR_donbass_go_desc: "Nos réformes ont porté leurs fruits, nous sommes enfin passés à la croissance économique !"
DPR_donbass_workers: "Travailleurs du Donbass"
DPR_donbass_workers_desc: "La classe ouvrière est les veines de notre économie, nous devons lui accorder une attention particulière."
DPR_donbass_medicine: "Augmenter le coût de l'assurance maladie"
DPR_donbass_medicine_desc: "Nous augmenterons le financement de l'assurance maladie des travailleurs."
DPR_donbass_infra: "Nouvelles routes"
DPR_donbass_infra_desc: "L'agglomération du Donbass a besoin de nouvelles routes, et nous les construirons."
DPR_donbass_socialochka: "Augmenter la sécurité sociale"
DPR_donbass_socialochka_desc: "Nous augmenterons également l'assurance sociale des travailleurs pour qu'un employé puisse être financièrement sécurisé même en cas de blessures au travail."
DPR_donbass_speeches: "Discours enflammés"
DPR_donbass_speeches_desc: "Nous mènerons également une campagne active devant les travailleurs, en les tenant constamment informés des réformes à venir."
DPR_donbass_zavods: "Nouvelles usines"
DPR_donbass_zavods_desc: "Nos citoyens ont besoin d'emplois - nous les fournirons."
DPR_donbass_details: "Moderniser l'équipement de production"
DPR_donbass_details_desc: "Nous mettrons également à jour tout l'équipement de production qui est déjà très obsolète."
DPR_donbass_new_territory: "Nouvelles terres pour le développement"
DPR_donbass_new_territory_desc: "Nous continuerons à étendre l'agglomération du Donbass."
DPR_donbass_new_resources: "Nouveaux gisements de ressources"
DPR_donbass_new_resources_desc: "Nos réformes ont porté leurs fruits, et nos géologues ont pu découvrir de nouveaux gisements, ainsi que créer une nouvelle installation de production pour leur extraction."
DPR_donbass_security: "Sécurité du Donbass"
DPR_donbass_security_desc: "Malgré le développement rapide de notre région, avec l'autonomie qui nous est donnée, nous ne sommes pas protégés contre les menaces primitives - banditisme, corruption."
DPR_donbass_sb: "Service de sécurité propre"
DPR_donbass_sb_desc: "Nous avons l'intention de créer notre propre service de sécurité pour assurer l'ordre dans la région."
DPR_donbass_powers: "Plus de pouvoirs"
DPR_donbass_powers_desc: "Nous élargirons les pouvoirs de notre service de sécurité, en raison de mesures forcées."
DPR_donbass_arests: "Série d'arrestations"
DPR_donbass_arests_desc: "Nous mènerons une série d'arrestations parmi la direction corrompue de nos entreprises."
DPR_donbass_raids: "Raids anti-corruption"
DPR_donbass_raids_desc: "Nous avons l'intention de punir sévèrement les fonctionnaires corrompus et sommes prêts à mener une série de raids contre eux."
DPR_donbass_moneys: "Détournement des fonds corrompus"
DPR_donbass_moneys_desc: "Nous enverrons tous les fonds saisis des fonctionnaires corrompus au trésor public."
DPR_donbass_more_powers: "Encore plus de pouvoirs"
DPR_donbass_more_powers_desc: "Nous avons l'intention d'élargir encore les pouvoirs et l'influence de notre service de sécurité."
DPR_donbass_jail: "Traiter les grands fonctionnaires corrompus"
DPR_donbass_jail_desc: "Nous sommes enfin prêts à mettre hors d'état de nuire les plus grands fonctionnaires corrompus de notre région, il est temps d'en finir avec eux."
DPR_donbass_terobor: "Défense territoriale du Donbass"
DPR_donbass_terobor_desc: "Nous avons l'intention de créer une défense territoriale du Donbass, pour protéger contre le banditisme et autres atteintes à notre encontre."
DPR_donbass_terobor_brigade: "Former la première brigade"
DPR_donbass_terobor_brigade_desc: "Nous sommes prêts à former la première brigade de défense territoriale."
DPR_donbass_terobor_status: "Consolider le statut de la défense territoriale dans la législation"
DPR_donbass_terobor_status_desc: "Nous adopterons également officiellement une loi sur la défense territoriale."
DPR_donbass_terobor_bandits: "Réprimer le banditisme"
DPR_donbass_terobor_bandits_desc: "Avec l'aide de la défense territoriale, nous serons capables de réprimer les gangs de bandits locaux qui ont nui à notre économie."
DPR_donbass_terobor_oborona: "Former une nouvelle brigade de défense territoriale"
DPR_donbass_terobor_oborona_desc: "Il y a plus de volontaires, après nos récents succès, et les gens s'enrôlent en masse dans la défense territoriale."
