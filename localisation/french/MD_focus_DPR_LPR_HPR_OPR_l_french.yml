# Focus
BLR_army: "Forces armées de Biélorussie"
BLR_army_desc: ""
BLR_army_ground: "Forces terrestres"
BLR_army_ground_desc: ""
BLR_territorial_defence: "Défense territoriale"
BLR_territorial_defence_desc: "Le déclenchement de la guerre nous oblige à lever une défense territoriale pour le combat."
BLR_army_sso: "Forces d'opérations spéciales"
BLR_army_sso_desc: "Les Forces d'opérations spéciales des Forces armées de la République de Biélorussie, une branche hautement mobile des Forces armées, sont les successeurs des Forces aéroportées de l'URSS et des forces spéciales du GRU de l'URSS en Biélorussie. Principales missions : activités de contre-sabotage, renseignement, lutte contre les groupes armés illégaux, exécution de diverses tâches par des méthodes spéciales afin de mettre fin au conflit armé contre la République de Biélorussie. Elles constituent l'un des principaux éléments de la dissuasion stratégique."
BLR_army_transport: "Troupes de transport"
BLR_army_transport_desc: "Les Troupes de transport biélorusses sont une branche des Forces armées de Biélorussie. Elles sont responsables du déplacement du personnel et du matériel par camion, train et avion, et sont conçues pour assurer les tâches de soutien logistique des formations militaires des autres branches à travers le pays."
BLR_peleng: "Peleng"
BLR_peleng_desc: ""
BLR_army_morpehi: "Rétablir le Corps des Marines"
BLR_army_morpehi_desc: ""
BLR_army_navy: "Notre flotte"
BLR_army_navy_desc: ""
BLR_army_vvs_pvo: "Forces aériennes et de défense aérienne"
BLR_army_vvs_pvo_desc: ""
BLR_army_engineer: "Troupes du génie"
BLR_army_engineer_desc: ""
BLR_army_radiowarfare: "Troupes radiotechniques"
BLR_army_radiowarfare_desc: ""
BLR_borderdefence: "Service de garde-frontière"
BLR_borderdefence_desc: ""
BLR_army_peace: "Bataillon de maintien de la paix"
BLR_army_peace_desc: "Nous créerons une unité spéciale pour participer aux missions de maintien de la paix."
BLR_558_zavod: "Usine de réparation d'aéronefs 558"
BLR_558_zavod_desc: "L'Usine de réparation d'aéronefs 558 est l'une des plus grandes entreprises de la CEI pour la réparation et la modernisation des équipements d'aviation de combat modernes en service dans les forces aériennes, non seulement des pays post-soviétiques, mais aussi de nombreux pays étrangers. C'est la principale usine de réparation d'aéronefs en Biélorussie. Située dans la ville de Baranovichi."
BLR_minoitor: "Minotor-Service"
BLR_minoitor_desc: "Minotor-Service est une entreprise biélorusse basée à Minsk, spécialisée dans le développement, la production, la modernisation, la réparation et l'entretien des véhicules chenillés de combat, ainsi que la fourniture de pièces détachées pour ces derniers. C'est l'une des principales entreprises du complexe militaro-industriel du pays."
BLR_belspecveshtech: "Belspetsvneshtechnika"
BLR_belspecveshtech_desc: "Belspetsvneshtechnika, BSVT, est une entreprise unitaire de commerce extérieur d'État biélorusse fondée en 1995. Elle est spécialisée dans le commerce et la production d'armes et de produits à double usage. Membre du Comité militaro-industriel d'État, elle est considérée comme l'entreprise leader du pays dans le domaine des exportations d'armes."
BLR_140_zavod: "Usine de réparation 140"
BLR_140_zavod_desc: "L'Usine de réparation 140 est une entreprise d'État du complexe militaro-industriel de Biélorussie, spécialisée dans la réparation et la modernisation des véhicules blindés et de leurs moteurs."
