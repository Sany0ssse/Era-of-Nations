BLR_post_luka_state: "Économie dévastée de la région"
BLR_post_luka_state_desc: "La transition du vieux système post-soviétique au système de marché moderne a eu un impact négatif sur la région. De nombreuses entreprises ont fermé, et les gens sont sans emploi."
# Décisions (Économie)
BLR_Economy_category: "Gouvernement de Biélorussie"
BLR_Economy_category_desc: "La Biélorussie a obtenu son indépendance relativement récemment, mais le pays a déjà fermement établi sa place dans le monde. Ses forces armées, son économie et ses services spéciaux sont les héritiers légitimes de l'Union soviétique et conservent parfois la structure organisationnelle qu'ils avaient sous l'URSS. La Biélorussie entreprend un voyage dans le 21e siècle, sera-t-elle capable de s'adapter aux nouvelles conditions ?"
