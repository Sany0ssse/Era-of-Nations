 # Religion
uniate_church: "Église uniate"
uniate_church_desc: "Union de l'Orthodoxie et du Catholicisme. L'Église repose sur l'union avec la primauté du Catholicisme, tout en préservant certains rites orthodoxes. Dès 1439, l'union catholique a été conclue lors du concile de Florence entre les Églises catholique et orthodoxe, mais elle fut rapidement dissoute. Depuis la fin du XVe siècle, l'idée de l'union a été relancée par la Pologne. Les seigneurs féodaux polonais, constatant qu'une partie de la population de la Pologne et de la Lituanie était orthodoxe, pensaient que l'union ecclésiastique permettrait de poloniser progressivement les Ukrainiens et les Biélorusses. Une partie des seigneurs féodaux orthodoxes et du haut clergé au XVIe siècle a soutenu l'idée de l'union, cherchant à obtenir les mêmes droits que les catholiques. En 1595, les évêques Hypatius Potei de Vladimir-Volyn et Kirill Terletsky de Lutsk ont fait appel au pape pour demander l'union. Lors du concile de Brest en 1596, six évêques ont proclamé l'Union de Brest, malgré les protestations de la majorité du clergé, des seigneurs féodaux et des citoyens. Le roi a soutenu l'union, déclarant l'Église orthodoxe hors la loi et transférant ses biens à l'Église uniate. Au début du XVIIe siècle, l'Ordre des Basiliens a été créé, agissant dans l'intérêt de l'union en coopération avec les Jésuites. Progressivement, l'Église uniate s'est rapprochée du Catholicisme dans ses cérémonies, avec des changements dans les vêtements liturgiques, la structure des églises, et l'introduction de pratiques catholiques. Les fêtes orthodoxes ont également été supprimées. Ces changements ont été officialisés lors du concile de Zamostye en 1720. En Transcarpatie, l'union a été proclamée lors du concile d'Uzhgorod en 1649, mais elle ne s'est pleinement établie qu'à la fin du XVIIIe siècle. La lutte contre l'union pour la liberté religieuse et nationale en Ukraine et en Biélorussie aux XVIe et XVIIe siècles a été menée par les soi-disant confréries."
# Shuskevich
BLR_shuskevich: "De nouveau au sommet"
BLR_shuskevich_desc: "En 1994, Stanislav Shushkevich a cessé d'être chef d'État par décision du parlement. Un vote de défiance a été exprimé, et il a été démis de ses fonctions. De toute évidence, nos premières tentatives pour conserver le pouvoir n'étaient pas idéales. Mais à la suite des élections, le régime autoritaire et sanguinaire de Lukashenko l'a emporté. Le peuple est désespéré par la décision prise. Maintenant, nous sommes de retour au sommet, et nous devons veiller à ne pas perdre à nouveau la confiance du peuple."
BLR_clean_paper: "Un nouveau départ"
BLR_clean_paper_desc: "Shushkevich s'est adressé au peuple pour la première fois depuis de nombreuses années. Ce ne sont plus les années quatre-vingt-dix. Nous sommes de retour aux commandes et prêts à conduire notre pays dans la nouvelle ère du XXIe siècle. Nous ne répéterons pas les mêmes erreurs et gagnerons l'amour du peuple."
BLR_contitutional_reform: "Nouvelle réforme constitutionnelle"
BLR_contitutional_reform_desc: "Pendant les années de pouvoir de Lukashenko, notre constitution a été complétée par de nombreux ajouts autoritaires et inutiles. Cependant, il faut reconnaître que toutes les innovations n'étaient pas si mauvaises. Peut-être devrions-nous créer un compromis entre la constitution de 1994 et celle de la Biélorussie de Lukashenko, tout en restant prudents."
BLR_cooperate_opposition: "Apaiser l'opposition démocratique"
BLR_cooperate_opposition_desc: "Nous devons faire comprendre à l'opposition démocratique que nous ne sommes pas l'administration Lukashenko. La Biélorussie autoritaire appartient au passé, et cela continuera sous notre gouvernance."
BLR_supreme_parliament: "Restaurer la suprématie du parlement"
BLR_supreme_parliament_desc: "De nombreux analystes pensaient que le retour de l'administration Shushkevich réduirait le parlement au silence. Mais ils oublient que la dégradation de notre parlement a été rendue possible par notre démission, et nous avons l'intention de restaurer le pilier fondamental de la démocratie !"
BLR_lukashenko_court: "Tribunal de Lukashenko"
BLR_lukashenko_court_desc: "Notre vieil homme Lukashenko ne pouvait évidemment pas imaginer que l'administration Shushkevich déciderait de son avenir. Cependant, le peuple biélorusse n'avait pas non plus prévu ce que Lukashenko leur ferait lorsqu'il a remporté les élections pour la première fois. Nous devons décider de son sort. Probablement, nous devrions privilégier la raison plutôt que les émotions."
BLR_sway_kgb: "Influencer le KGB"
BLR_sway_kgb_desc: "Le KGB est une institution puissante, et leur loyauté est une composante importante de la stabilité de notre administration. Ils ont de nouveaux dirigeants, et ils doivent l'accepter."
BLR_integrate_loyalists: "Intégrer les loyalistes de Lukashenko"
BLR_integrate_loyalists_desc: "Alexandre Lukashenko a laissé derrière lui un grand nombre de personnes de son administration dans notre structure politique. Nous devons leur montrer qu'ils peuvent se sentir bien sous l'administration Shushkevich pour gagner leur confiance."
BLR_absolute_synergy: "Pouvoir absolu du compromis"
BLR_absolute_synergy_desc: "Le gouvernement chinois augmente ses investissements dans notre pays et est prêt à construire de nouvelles usines."
BLR_way_to_neutrality: "La voie vers la neutralité"
BLR_way_to_neutrality_desc: "L'administration précédente était célèbre pour sa « neutralité » dans l'espace politique. En réalité, avec chaque année qui passait, nous nous éloignions de plus en plus de l'Occident, tombant exclusivement dans la sphère d'influence des pays de l'Est. Cela ne peut pas continuer. Beaucoup ne nous font pas confiance, et nous devons rétablir l'équilibre des forces."
BLR_european_summit: "Sommet Europe-Biélorussie"
BLR_european_summit_desc: "De nombreux pays de l'Ouest proche ont réagi très positivement au triomphe de Stanislav Shushkevich en Biélorussie. La « dernière dictature d'Europe » a adopté des valeurs démocratiques, et notre dialogue amical avec l'Europe peut être mis en avant lors du prochain sommet."
BLR_big_brother_russia: "Négociations russo-biélorusses"
BLR_big_brother_russia_desc: "Il est insensé de couper les liens avec notre puissant voisin de l'Est. La Biélorussie, sous notre direction, ne cherche pas à discréditer nos liens culturels de longue date. Bien que la Russie moderne soit différente de celle avec laquelle Stanislav Shushkevich a signé les accords de Belovezh, nous pensons que nous pourrons maintenir le dialogue à l'avenir."
BLR_neutrality_memorandum: "Mémorandum de neutralité"
BLR_neutrality_memorandum_desc: "Compte tenu des événements récents, nous avons démontré au monde entier que la Biélorussie est prête à coopérer avec l'Est et l'Ouest. Cependant, la Biélorussie est un pays neutre, et la neutralité implique de prendre une position neutre dans la guerre froide moderne. Cela signifie que la Biélorussie ne devrait rejoindre aucune des principales associations politiques. Nous devons respecter ce principe, même si cela offense certains."
BLR_between_weast_east: "Entre l'Est et l'Ouest"
BLR_between_weast_east_desc: "Notre État neutre est situé entre l'Ouest et l'Est. Ce sont deux forces politiques énormes qui influencent notre pays. Chacune veut nous attirer de son côté, mais il est important pour elles de comprendre que si elles veulent continuer à coopérer avec nous, elles doivent respecter notre choix dans l'espace politique."
BLR_end_of_lukashenlonomics: "Fin de la Lukashenconomie"
BLR_end_of_lukashenlonomics_desc: "Le règne de Lukashenko a montré que ses réformes n'ont pas conduit à une véritable croissance économique dans notre pays. Ce seront des changements importants, mais nous devons nous éloigner de la trajectoire actuelle et développer notre propre programme."
BLR_overhaul_medicine: "Révision totale du système de santé"
BLR_overhaul_medicine_desc: "L'état de la médecine dans notre pays est catastrophique. Nous ne devons pas laisser cela ainsi. Nous devons créer non seulement des conditions favorables pour la santé privée, mais aussi maintenir un haut niveau de santé publique."
BLR_welfare_reform: "Réforme du fonds social"
BLR_welfare_reform_desc: "Nous devons réformer le système du fonds social de manière à réduire la charge sur le budget. Nous privilégions l'optimisation des paiements sociaux et la rationalisation des programmes sociaux."
BLR_privatise_shit: "Privatisation des biens excédentaires"
BLR_privatise_shit_desc: "La privatisation des biens excédentaires est nécessaire pour réduire les coûts d'entretien des biens inutilisés, augmenter les revenus budgétaires par les ventes et stimuler l'activité économique. C'est un processus assez courant dans les pays post-soviétiques."
BLR_changes_to_market: "Réorganiser les mécanismes de régulation du marché"
BLR_changes_to_market_desc: "Une bonne agence anti-monopole, des conditions de concurrence équitable - voilà notre cap. Le cap d'un pays où les entreprises n'ont pas peur pour leur existence."
BLR_the_third_way: "Troisième voie biélorusse"
BLR_the_third_way_desc: "Les extrêmes dans les questions économiques sont inappropriés. Différentes idéologies limitent certaines réformes nécessaires, mais la Biélorussie sous notre direction est un État centriste prêt à adopter toutes les bonnes propositions de tous les côtés."
BLR_1994_avanged: "1994 vengé !"
BLR_1994_avanged_desc: "1994 vengé est un triomphe ! Nous avons prouvé que 1994 était une erreur qui n'a pas pleinement révélé notre potentiel. Malgré les difficultés, nous avons réussi à mettre en œuvre toutes nos grandes décisions politiques. La société biélorusse a enfin goûté à la stabilité et à une économie prospère !"
