# Événements (Monarchie)
belarus_monarch.1.t: "Conflit d'identité"
belarus_monarch.1.d: "Nous devons maintenant décider quelle est l'essence de notre identité. Viserons-nous le passé lituanien et adopterons-nous la langue lituanienne pour notre population, ou nous appuierons-nous sur l'héritage biélorusse ?"
belarus_monarch.1.a: "Nous sommes de vrais Lituaniens !"
belarus_monarch.1.b: "Nous devons rester Biélorusses."
belarus_monarch.2.t: "Dilemme religieux"
belarus_monarch.2.d: "Le Conseil des affaires religieuses s'est réuni au sein de notre gouvernement pour décider quoi faire de notre politique religieuse d'État. Il est temps pour nous d'abandonner l'Église moscovite et de commencer la réforme de notre vie religieuse."
belarus_monarch.2.a: "Église uniate"
belarus_monarch.2.b: "Romuva est la voie à suivre !"
belarus_monarch.3.t: "Rassemblement de la régence"
belarus_monarch.3.d: "Aujourd'hui à Minsk, le Sejm s'est réuni pour élire un nouveau monarque pour la Biélorussie. Deux candidats sont à l'ordre du jour. Le premier est l'héritier de la dynastie des Habsbourg, Ferdinand Zvonimir Ier. Le second est un membre de la dynastie Urach, héritier du trône lituanien, Inigo. Qui choisirons-nous pour le Grand-Duché ?"
belarus_monarch.3.a: "Les Habsbourg régneront !"
belarus_monarch.3.b: "La dynastie Urach est la plus proche de nous !"
belarus_monarch.5.t: "Soulèvement des nationalistes biélorusses !"
belarus_monarch.5.d: "Les nationalistes biélorusses ont déclenché une émeute dans notre région ! Il semble que leur gouvernement ait utilisé cela comme prétexte pour lancer une opération militaire contre nous !"
belarus_monarch.5.a: "Ils vont le regretter."
belarus_monarch.6.t: "Soulèvement des cosaques de Tchernigov"
belarus_monarch.6.d: "Les soi-disant cosaques de Tchernigov, soutenus par le gouvernement biélorusse, ont déclenché un soulèvement sur notre territoire, apparemment comme prétexte pour envahir nos terres et déclencher une guerre contre nous !"
belarus_monarch.6.a: "Ils vont le regretter."
belarus_monarch.7.t: "Résistance biélorusse"
belarus_monarch.7.d: "La soi-disant résistance biélorusse a commencé à opérer sur notre territoire, menant activement des actions de guérilla et sabotant tout ce qui est possible dans la région."
belarus_monarch.7.a: "Ils vont le regretter."
belarus_monarch.8.t: "Cosaques de Tchernigov"
belarus_monarch.8.d: "Les soi-disant cosaques de Tchernigov ont commencé à opérer sur notre territoire, se livrant à des activités de guérilla actives et sabotant tout ce qui est possible dans la région."
belarus_monarch.8.a: "Ils vont le regretter."
belarus_monarch.9.t: "Soulèvement des nationalistes biélorusses !"
