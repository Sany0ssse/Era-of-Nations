blr_union_with_russia_info: "[SOV.GetName] nous transformera en État fantoche\nLe joueur sera transféré vers [SOV.GetName]"
BLR_batka_krut_TT: "Nous allons §Rnettoyer§! §Yl'espace politique§!, ne laissant que §Gquelques partis loyaux envers nous§! et nous créerons §Gun véritable parti patriotique§! pour §YLukashenko§!"
belarus_politics.1.t: "La nouvelle réalité politique"
belarus_politics.1.d: "Bien que la victoire sur les manifestants ait été monumentale, il existe encore un vaste réseau d'organisations et de partis d'opposition qui n'attendent que l'heure de détruire notre pays. Pour éviter cela, nous devons complètement purger le champ politique des politiciens et organisations inutiles, ne laissant que les partis qui nous sont loyaux, et nous pourrions également avoir besoin de notre propre parti politique pour contrôler la sphère politique. Ou nous pouvons tout laisser tel quel, mais l'ennemi aura encore les outils pour nous influencer sur le plan interne."
belarus_politics.1.a: "Secouons-les !"
belarus_politics.1.b: "Ne mettons pas les gens plus en colère."
# Arbre communiste
# Focus
BLR_Communism_start: "Retour au communisme"
BLR_single_party: "État à parti unique"
BLR_single_party_desc: "Pour construire le communisme, nous devons assurer une stabilité politique dans le pays et garantir que le pouvoir reste entre les mains de ceux qui sont capables de nous mener au communisme sans dévier du cap."
BLR_atheism: "Athéisme d'État"
BLR_atheism_desc: "En progressant vers le communisme, où il n'y a pas de place pour la conscience religieuse, nous devons purger l'esprit de nos citoyens des préjugés et superstitions religieux."
BLR_boc_protest_tt: "Augmentation des protestations de §R30§! et du radicalisme de §R5§!"
BLR_smersh: "SMERSH 2.0"
BLR_smersh_desc: "« SMERSH » signifie « Smert' Shpionam ! » (Mort aux espions !) - une organisation de contre-espionnage qui existait pendant la Seconde Guerre mondiale. Ces organisations ont prouvé leur efficacité dans le contre-espionnage, nous devons les rétablir en tant qu'organisme d'État."
BLR_propaganda: "Propagande"
BLR_propaganda_desc: "La propagande est un moyen efficace d'influencer la population pour transmettre notre idéologie et réprimer les sentiments d'opposition."
BLR_ban_opposition: "Interdiction de l'opposition"
BLR_ban_opposition_desc: "L'opposition sème la discorde parmi la population et freine nos efforts pour construire le communisme. Toute opposition doit être interdite, et les contre-révolutionnaires déportés ou exécutés."
BLR_five_year_plan: "Plan quinquennal"
BLR_collectivism: "Collectivisme"
BLR_collectivism_desc: "Le collectivisme est au cœur de notre idéologie, promouvant le travail commun et la solidarité pour le bien-être de tous les citoyens."
BLR_red_army: "Armée rouge"
BLR_red_army_desc: "L'Armée rouge est célèbre dans le monde entier. Certains la respectent, d'autres la craignent. Pour préserver la mémoire et renforcer notre idéologie, nous devons restaurer l'Armée rouge."
BLR_education: "Système éducatif soviétique"
BLR_education_desc: "L'éducation soviétique mettait l'accent sur l'accessibilité et la qualité de l'éducation, tout en inculquant des idéaux socialistes aux étudiants ; il est temps de ramener ce système."
BLR_industrial_expansion: "Expansion industrielle"
BLR_industrial_expansion_desc: "L'expansion du secteur de la construction permettra d'accélérer notre économie et notre production de manière plus rapide et efficace."
BLR_agriculture_expansion: "Expansion agricole"
BLR_agriculture_expansion_desc: "L'expansion de l'agriculture donnera un coup de pouce à notre économie et augmentera la production de biens agricoles pour fournir à la population tous les avantages nécessaires."
BLR_people_militia_commi: "Milice populaire"
BLR_people_militia_commi_desc: "Les milices populaires sont des brigades paramilitaires de soldats non soumis à la conscription prioritaire, composées principalement de volontaires ayant décidé de se lever pour défendre la patrie."
BLR_comm_cyber_troops: "Troupes cybernétiques rouges"
BLR_comm_cyber_troops_desc: "Dans le monde d'aujourd'hui, à l'ère des technologies numériques, nous devons organiser un nouveau département de l'Armée rouge, lié au cyberespace, pour protéger nos données et améliorer les réseaux d'espionnage."
BLR_red_shield: "Bouclier rouge"
BLR_red_shield_desc: "Pour protéger nos frontières, nous devons acquérir l'arme de dissuasion la plus redoutable : les ogives nucléaires. L'installation de plusieurs systèmes de missiles et la révision de notre doctrine devraient marquer le début de la création des Forces de missiles stratégiques Bouclier rouge."
BLR_trudarmia: "Trudarmia"
BLR_trudarmia_desc: "La Trudarmia était une organisation contrôlée par le ministère de l'Intérieur de l'URSS, existant pendant la Seconde Guerre mondiale et composée de prisonniers. Ils travaillaient dans les mines et les usines, et étaient également mobilisés comme troupes du génie."
BLR_litbel_ultimatum: "Ultimatum à la Lituanie"
BLR_litbel_ultimatum_desc: "Nous avons beaucoup en commun avec la Lituanie, il est temps de nous unir avec eux en un seul État, pacifiquement ou non, nous atteindrons notre objectif."
BLR_litbel_integration: "Projet Lit-Bel"
BLR_litbel_integration_desc: "La Lituanie est un pays avec lequel nous partageons une histoire et une frontière communes, nous devons nous unir avec eux en un seul pays et renforcer notre statut sur la scène mondiale."
# Idées
BLR_commi_politics: "Politique du communisme"
BLR_commi_politics_desc: "Nous ne devons pas dévier du cap et avancer résolument vers le communisme, même si cela crée certaines difficultés."
BLR_commi_politics1: "Politique du communisme"
BLR_commi_politics1_desc: "Nous ne devons pas dévier du cap et avancer résolument vers le communisme, même si cela crée certaines difficultés."
BLR_boc_protest_idea: "Protestation de l'Église orthodoxe biélorusse"
BLR_boc_protest_idea_desc: "Les protestations de l'Église orthodoxe causées par la politique d'athéisme d'État nous posent quelques difficultés, nous espérons qu'elles cesseront bientôt."
BLR_propaganda_idea: "Propagande"
BLR_propaganda_idea_desc: "La propagande des valeurs socialistes nous assure une stabilité politique et la confiance que la future génération construira certainement le communisme."
BLR_smersh_idea: "§CSMERSH§!"
BLR_smersh_idea_desc: "Les organisations de contre-espionnage contrôlées par le gouvernement garantissent la sécurité de nos secrets nationaux et la protection de notre souveraineté."
BLR_five_year_plan_idea: "Plan quinquennal"
BLR_five_year_plan_idea_desc: "Nous accomplirons le plan quinquennal en quatre ans !"
BLR_red_army_idea: "Armée rouge"
BLR_red_army_idea_desc: "L'Armée rouge a été créée en 1918 et a été la principale force de l'Union soviétique depuis lors. Certains la respectent, d'autres la craignent."
BLR_red_army_idea2: "Armée rouge"
BLR_red_army_idea2_desc: "L'Armée rouge a été créée en 1918 et a été la principale force de l'Union soviétique depuis lors. Certains la respectent, d'autres la craignent."
BLR_red_army_idea3: "Armée rouge"
BLR_red_army_idea3_desc: "L'Armée rouge a été créée en 1918 et a été la principale force de l'Union soviétique depuis lors. Certains la respectent, d'autres la craignent."
BLR_trudarmy_mobilize: "La Trudarmia a été mobilisée"
BLR_trudarmy_mobilize_desc: "L'Armée du travail est mobilisée et prête à travailler au front pour défendre la patrie."
BLR_lit_workers: "Travailleurs lituaniens"
BLR_lit_workers_desc: "L'acceptation des travailleurs lituaniens augmente la tolérance interethnique et nous rapproche de l'amitié entre les populations lituanienne et biélorusse."
BLR_litbel_cp: "Parti communiste lituano-biélorusse"
BLR_litbel_cp_desc: "L'unification des partis communistes lituanien et biélorusse nous permettra de mieux centraliser le pouvoir dans le pays."
BLR_litbel_passport: "Passeport lituano-biélorusse"
BLR_litbel_passport_desc: "Les nouveaux passeports élimineront de nombreux problèmes bureaucratiques et renforceront l'unité du pays."
BLR_litbel_constitution: "Constitution lituano-biélorusse"
BLR_litbel_constitution_desc: "La nouvelle constitution résoudra les problèmes liés aux lois nationales, à la bureaucratie, à la centralisation et à la langue officielle."
BLR_lit_protests: "Problèmes d'intégration"
BLR_lit_protests_desc: "Les Lituaniens s'opposent à l'unification de l'État. De nombreux rassemblements et sabotages ont lieu en Lituanie."
BLR_soviet_education: "Éducation soviétique"
BLR_soviet_education_desc: "Le système éducatif soviétique rend l'éducation plus accessible et de meilleure qualité."
BLR_rublit: "Rublitas"
BLR_rublit_desc: "Rublitas - une monnaie lituano-biélorusse unique créée par la fusion du rouble biélorusse et du litas lituanien."
BLR_red_army_idea4: "Armée rouge"
BLR_red_army_idea4_desc: "L'Armée rouge a été créée en 1918 et a été la principale force de l'Union soviétique depuis lors. Certains la respectent, d'autres la craignent."
# Événements
belarus_CLTB.1.t: "La Biélorussie exige notre annexion"
belarus_CLTB.1.d: "Le Parti communiste de Biélorussie exige notre annexion pour créer un État socialiste unique. Bien que l'unification avec notre voisin de l'Est puisse renforcer notre position commune sur la scène mondiale et créer une nouvelle force en Europe à prendre au sérieux, cela pourrait également menacer notre souveraineté, sans parler des différences nationales, culturelles et idéologiques."
belarus_CLTB.1.a: "Oui, unissons-nous !"
belarus_CLTB.1.b: "JAMAIS !"
belarus_CLTB.2.t: "La Lituanie refuse"
belarus_CLTB.2.d: "La Lituanie a refusé notre demande d'unification, arguant que cela compromettrait la souveraineté du pays et que cette unification créerait plus de problèmes, tant en politique intérieure qu'étrangère."
belarus_CLTB.2.a: "Nous voulions résoudre cela pacifiquement"
belarus_CLTB.3.t: "La Lituanie accepte"
belarus_CLTB.3.d: "Le gouvernement lituanien a accepté de créer un État unique avec nous, il ne reste plus qu'à résoudre un grand nombre de problèmes bureaucratiques et à gérer le mécontentement de la population lituanienne, qui n'est clairement pas satisfaite de la décision de ses dirigeants."
belarus_CLTB.3.a: "Vive la fraternité des nations !"
belarus_CLTB.4.t: "La Biélorussie et la Lituanie s'unissent en un seul pays"
belarus_CLTB.4.d: "La Lituanie accepte la proposition des communistes biélorusses de créer un État unique au sein de la république socialiste. Il n'est pas clair si cela était un coup d'État planifié à l'avance par le KGB de Biélorussie ou si les parties ont réussi à parvenir à un accord, mais une chose est sûre : cela changera considérablement l'équilibre des forces en Europe, il reste à savoir en faveur de qui..."
belarus_CLTB.4.a: "Quoi ?"
belarus_CLTB.5.t: "Le peuple lituanien résiste à notre annexion"
belarus_CLTB.5.d: "Comme prévu, le peuple lituanien a réagi négativement à notre annexion. Les manifestants prônent activement l'indépendance de l'État lituanien et se livrent à des sabotages. Tout cela exerce une forte pression sur notre économie, nous devons augmenter le financement de la police et engager des coûts supplémentaires pour la bureaucratie."
belarus_CLTB.5.a: "Nous devons en finir plus vite"
belarus_CLTB.6.t: "Intégration terminée"
belarus_CLTB.6.d: "Après de nombreuses protestations, coopérations et rassemblements agressifs, qui ont été réprimés avec succès grâce au soutien du KGB de Biélorussie, les sentiments séparatistes ont commencé à s'estomper. Nous avons activement mis en œuvre un certain nombre de réformes visant à une coexistence confortable avec les Lituaniens, créé une nouvelle monnaie, ajusté la constitution et délivré de nouveaux passeports aux citoyens. Après beaucoup de travail, nous sommes enfin prêts à proclamer la création de la République socialiste lituano-biélorusse."
belarus_CLTB.6.a: "Enfin, nous sommes unis"
belarus_communism.1.t: "Protestation de l'Église orthodoxe biélorusse"
belarus_communism.1.d: "Après la proclamation de l'athéisme d'État et les répressions contre l'Église orthodoxe biélorusse, les croyants ont commencé à se rassembler en masse pour défendre les églises et préserver la religion. On dirait que cela va durer."
belarus_communism.1.a: "Ils s'en remettront"
# Décisions
BLR_litbel_integration_category_desc: "Après l'unification du territoire de la Lituanie à notre État, de nombreux problèmes sont apparus, tels que : le mécontentement de la population lituanienne, la crise bureaucratique, une population désunie, etc. Pour compléter le projet d'intégration et proclamer la création de la République socialiste lituano-biélorusse, nous devons résoudre les problèmes urgents, réprimer le mécontentement sur le territoire de la Lituanie et finalement parvenir à la création d'un État socialiste fort et allié.\n\n\n\n\n\n\n\n                       £GFX_decision_litbel_integration \n\n\n\n\n\n\n Une intégration complète nécessitera de réduire la résistance et d'augmenter la subordination de la population lituanienne, ainsi que de compléter toutes les réformes importantes."
BLR_litbel_integration_category: "Intégration de la Lituanie"
BLR_lithaunian_workers: "Adopter les travailleurs lituaniens"
BLR_lithaunian_workers_desc: "Les travailleurs lituaniens sont discriminés dans les entreprises biélorusses. Nous devons augmenter la tolérance interethnique et prolonger les opportunités d'emploi pour les travailleurs lituaniens."
BLR_unite_with_lcp: "S'unir avec le Parti communiste lituanien"
BLR_unite_with_lcp_desc: "La fusion avec le Parti communiste lituanien nous permettra de centraliser le pouvoir plus fortement et de travailler plus efficacement pour unifier l'État."
BLR_new_pasport: "Passeport lituano-biélorusse"
BLR_new_pasport_desc: "Les citoyens lituaniens continuent d'utiliser des passeports lituaniens, ce qui crée des problèmes bureaucratiques majeurs sur le territoire de la Biélorussie, tout comme les Biélorusses rencontrent des problèmes lorsqu'ils présentent des passeports biélorusses sur les territoires nouvellement annexés de la Lituanie. Il est nécessaire de créer de nouveaux passeports unifiés pour éliminer ce problème."
BLR_new_constitution: "Constitution lituano-biélorusse"
BLR_new_constitution_desc: "Les différences entre les lois et statuts biélorusses et lituaniens ont créé des problèmes après l'unification. Nous devons rédiger une nouvelle constitution pour un État unique qui conviendrait à la fois à nous et aux Lituaniens."
BLR_unite_propaganda: "Propagande d'unité"
BLR_unite_propaganda_desc: "Nous devons promouvoir l'unité avec le peuple lituanien afin de réduire le niveau de protestations et de calmer la population des terres lituaniennes."
BLR_dispersal_demonstrators: "Dispersion des manifestants"
BLR_dispersal_demonstrators_desc: "Les manifestations lituaniennes commencent à prendre un élan radical, il est temps d'agir et d'envoyer les gardes ou même le KGB pour les réprimer."
BLR_proclaim_litbel: "Proclamer la §RRépublique socialiste lituano-biélorusse§!"
BLR_proclaim_litbel_desc: "Nous avons complété toutes les étapes pour l'unification de l'État, les protestations ont été réprimées, les nouveaux passeports et le Rublitas sont déjà en circulation parmi les citoyens, ce qui signifie que nous sommes prêts à proclamer la création de la République socialiste lituano-biélorusse !"
litbel_decision_tt: "Toutes les §Yétapes pour l'intégration§! doivent être complétées"
BLR_united_currency: "Monnaie unifiée"
BLR_united_currency_desc: "Le rouble biélorusse et le litas lituanien doivent être fusionnés pour créer une nouvelle monnaie unique qui serait utilisée dans tout le pays."
BLR_army_reorganization: "Réorganisation de l'armée"
BLR_army_reorganization_desc: "L'annexion de la Lituanie a créé des problèmes dans le commandement, dans le corps des officiers et principalement dans l'organisation de nos forces armées. Il est temps de corriger cela et de réorganiser complètement notre armée."
BLR_trudarmia_category: "Trudarmia"
BLR_trudarmia_category_desc: "\n\n£GFX_decision_trudarmia\n\n\n\n\n L'Armée du travail est une équipe de prisonniers contrôlée par le ministère de l'Intérieur. Ils effectuent divers types de travaux, allant du travail dans les usines et les fermes collectives à l'extraction de ressources dans les mines. En temps de guerre, ils peuvent être mobilisés pour participer au front en tant que troupes du génie."
BLR_mobilize_trudarmy: "Mobiliser la Trudarmia"
BLR_demobilize_trudarmy: "Démobiliser la Trudarmia"
BLR_factory_work: "Travail en usine"
BLR_kolhoz_work: "Travail dans les fermes collectives"
BLR_steel_mining: "Envoyer dans les mines d'acier"
BLR_tungsten_mining: "Envoyer dans les mines de tungstène"
BLR_aluminium_mining: "Envoyer dans les mines d'aluminium"
BLR_oil_mining: "Envoyer dans les gisements de pétrole"
# Tag cosmétique
plc_unified_neutrality: "Commonwealth polono-lituanien-ruthène"
BLR_litbel_communism: "République socialiste lituano-biélorusse"
# Arbre RPTJ
# Focus
BLR_rptj_start: "Républicain et juste"
BLR_rptj_start_desc: "Le Parti républicain du travail et de la justice est un parti social-démocrate de gauche en Biélorussie. Avons-nous réussi à montrer que nous pouvons prendre le pouvoir ? Oui. Mais le conserver et mener notre pays à la prospérité sous la direction d'un socialisme raisonné ? Eh bien, nous devons le prouver, et nous avons l'intention de le faire."
BLR_labour: "Travail, responsabilité, justice"
BLR_labour_desc: "Notre slogan est « Travail, responsabilité, justice ». Et ce ne sont pas des mots vides. Travail - le travail est la meilleure protection sociale, justice - un marché du travail sans barrières, responsabilité - la sécurité du vieillissement. Ces principes guideront notre Biélorussie, tant que nous serons au pouvoir."
BLR_ussr_legacy: "Héritage de l'URSS"
BLR_ussr_legacy_desc: "La Biélorussie soviétique fait partie de notre histoire. Et nous devrions être fiers de cette histoire, car c'est à l'ère soviétique que notre terre a prospéré. Peut-être devrions-nous nous inspirer des expériences passées dans le développement du pays, qui étaient connues auparavant."
BLR_union_with_russian_socialist_patriots: "Alliance avec les patriotes russes"
BLR_union_with_russian_socialist_patriots_desc: "Bien sûr, nous considérons les Russes comme nos frères. Nous voulons également un avenir meilleur pour eux, donc nous ne cacherons pas nos sympathies pour certains partis socialistes de ce vaste pays."
BLR_ukrainian_socialists: "Coopération avec les socialistes ukrainiens"
BLR_ukrainian_socialists_desc: "Nos voisins du sud, les camarades ukrainiens, ont également des forces politiques raisonnables qui s'intéressent à la véritable prospérité du peuple de leur pays."
BLR_real_free_medicine: "Véritable médecine gratuite"
BLR_real_free_medicine_desc: "Pour les membres de notre parti, il reste un mystère pourquoi la base du bien-être peut être payante. L'État doit fournir des soins de santé gratuits et les maintenir à un niveau décent."
BLR_destroy_the_national_bank: "Croisade contre la banque nationale"
BLR_destroy_the_national_bank_desc: "Cette structure capitaliste fait son sale boulot en Biélorussie depuis trop longtemps. Nous avons l'intention de dissoudre la banque nationale."
BLR_peoples_redistribution: "Redistribution populaire"
BLR_peoples_redistribution_desc: "La redistribution des richesses doit garantir une justice sociale, en veillant à ce que les ressources soient partagées équitablement pour le bien-être de tous."
BLR_labour_as_a_best_gurantee: "Le travail, la meilleure garantie sociale"
BLR_labour_as_a_best_gurantee_desc: "La politique économique doit viser le plein emploi. Notre objectif est que toute personne ayant la possibilité de travailler puisse le faire. Un revenu garanti donne aux gens plus de liberté. Le chômage est un grand gâchis de ressources humaines et un échec social."
BLR_state_property_domination: "Domination de la propriété d'État"
BLR_state_property_domination_desc: "Quoi qu'on en dise, encourager l'industrie nationale et les produits locaux est une mesure exclusivement patriotique, capable de conduire notre grande industrie à un âge d'or."
BLR_national_patriotic_union: "Union patriotique nationale de Biélorussie"
BLR_national_patriotic_union_desc: "Autrefois, les socialistes russes se sont unis pour créer une union unique dans laquelle ils promouvaient leurs valeurs et idées. Nous emprunterons cette expérience. L'objectif de l'union est le patriotisme, l'État et la justice sociale !"
BLR_support_the_kgb: "Renforcer le KGB"
BLR_support_the_kgb_desc: "Renforcer le Comité de sécurité de la République de Biélorussie est important pour maintenir notre intégrité territoriale. Personne n'osera nous attaquer si nous pouvons riposter."
BLR_parliamentary_supervision: "Supervision parlementaire"
BLR_parliamentary_supervision_desc: "Oui, nous voulons apparaître à la communauté internationale comme un parti social-démocrate, mais une supervision supplémentaire des affaires au parlement peut nous aider dans nos réformes futures..."
BLR_congress_of_left_patriots: "Congrès des patriotes de gauche"
BLR_congress_of_left_patriots_desc: "Nous avons maintenant assez de contacts avec les patriotes de gauche de l'espace post-soviétique pour les rassembler tous et discuter de nos plans de coopération."
BLR_social_justice_economy: "Économie de justice sociale"
BLR_social_justice_economy_desc: "Économie de justice sociale - Toute personne qui devient chômeur doit être motivée dès le premier jour pour retrouver rapidement un nouvel emploi. À son tour, le marché du travail moderne est un marché avec des conditions de travail et des salaires décents, capable de s'adapter aux changements technologiques. Et bien sûr, la santé. C'est l'élément le plus important de la qualité de vie."
BLR_destroy_market_opposition: "Détruire l'opposition du marché"
BLR_destroy_market_opposition_desc: "« Voulez-vous que des dizaines de ces Saakachvili courent sur nos places ? »"
BLR_Union_of_peoples_states_idea: "Union des républiques populaires du travail"
BLR_Union_of_peoples_states_idea_desc: "L'heure a sonné ! Les travailleurs de nos pays peuvent proclamer avec fierté la création d'une véritable union tripartite entre eux ! Gloire à nos Républiques !"
BLR_peoples_patriotic_democracy: "Démocratie patriotique"
BLR_peoples_patriotic_democracy_desc: "De nombreuses figures occidentales ne sont pas convaincues que la Biélorussie s'est complètement éloignée de l'autoritarisme sous notre gouvernance, mais nous ne pensons pas ainsi. Nous avons contribué à la promotion de la démocratie dans notre pays. Le patriotisme peut coexister avec la démocratie, et nous l'avons prouvé."
BLR_labourist_state: "La République du travail"
BLR_labourist_state_desc: "Nous avons réussi à créer un État véritablement juste et patriotique, dans lequel chacun peut dire que le travail et le socialisme ont amélioré leur qualité de vie !"
