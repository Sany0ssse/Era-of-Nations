# Poznyak
BLR_Pazniak: "Règne de Paznyak"
BLR_Pazniak_desc: "Les forces nationalistes pro-occidentales ont pris le pouvoir dans le pays. Où mèneront-elles la Biélorussie ? Vers un avenir plus lumineux ou vers l'effondrement du pays ?"
BLR_rofeign_legion: "La Légion étrangère"
BLR_rofeign_legion_desc: "Nous allons essayer de tirer parti de l'expérience française et créer notre propre légion étrangère."
BLR_debur: "Débureaucratisation"
BLR_debur_desc: "Nous réduirons les dépenses pour les fonctionnaires et leur nombre, et les fonds libérés bénéficieront au peuple."
BLR_patriotism: "Patriotisme"
BLR_patriotism_desc: "Il est temps de renforcer l'éducation patriotique dans notre pays."
BLR_Belarusisation: "Biélorussisation"
BLR_Belarusisation_desc: "Toute la littérature, tous les titres doivent être en biélorusse."
BLR_Democratic_clean: "Purges des démocrates"
BLR_Democratic_clean_desc: "Nous n'allons pas devenir les serviteurs de l'Occident. Il est temps de purger notre pays des démocrates."
BLR_Communistst_clean: "Purge des communistes"
BLR_Communistst_clean_desc: "L'héritage de l'URSS doit être détruit. Il est temps de chasser ces adeptes de la contagion rouge."
BLR_denied_rus_language: "Refus de la langue russe"
BLR_denied_rus_language_desc: "Le russe ne sera plus la deuxième langue officielle. Nous en avons assez de l'occupation russe."
BLR_Anti_corruption_law: "Loi anti-corruption"
BLR_Anti_corruption_law_desc: "Nous lutterons contre la corruption sous toutes ses formes."
BLR_anti_immigration_policies: "Politiques anti-immigration"
BLR_anti_immigration_policies_desc: "Mettre en œuvre davantage de politiques anti-immigration permettra de préserver l'identité biélorusse."
BLR_russofobia: "Politique anti-russe"
BLR_russofobia_desc: "Il est temps de s'occuper de l'ennemi commun - la Russie. Il est temps de dompter ses ambitions impérialistes envers nous."
BLR_decolectivisation: "Décollectivisation"
BLR_decolectivisation_desc: "Il est temps de se débarrasser de l'héritage de l'URSS et d'aider la population à migrer vers les villes."
BLR_litvins_past: "Passé des Litvins"
BLR_litvins_past_desc: "L'histoire ne peut être changée, et nous le savons. Nous, les Litvins, sommes les fiers héritiers du Grand-Duché de Lituanie."
BLR_constitution_from_1994: "Constitution de 1994"
BLR_constitution_from_1994_desc: "Il est temps de rétablir une constitution normale dans notre pays."
BLR_We_not_energy_slave: "Nous ne sommes pas esclaves des ressources russes"
BLR_We_not_energy_slave_desc: "La Russie offrait des rabais uniquement pour soutenir son régime fantoche ; ça suffit. Nous sommes prêts à construire une économie forte sans ces rabais."
BLR_Influence_nationalists: "Influence des nationalistes"
BLR_Influence_nationalists_desc: "Nous devons activement soutenir les mouvements nationalistes dans les pays voisins."
BLR_Territorial_claims: "Revendications territoriales"
BLR_Territorial_claims_desc: "Notre pays doit revenir à ses véritables frontières."
BLR_sez: "Zones économiques spéciales"
BLR_sez_desc: ""
BLR_itshka: "Secteur informatique"
BLR_itshka_desc: ""
BLR_freedom_spirit: "Esprit de liberté"
BLR_freedom_spirit_desc: ""
BLR_chanting_of_bpr: "Célébration du BPR"
BLR_Reform_Police: "Réforme de la police"
BLR_Dismiss_soviet_officers: "Réforme de l'armée"
BLR_create_nationalsecurity: "Agence nationale de cybersécurité"
BLR_south_river_battalion: "Bataillon de la rivière sud"
BLR_white_legion_battalion: "Bataillon de la Légion blanche"
BLR_white_legion_battalion_desc: "Le premier bataillon de la Légion blanche a enfin été formé. De vrais patriotes de leur pays sont prêts à se battre pour sa liberté et sa force."
BLR_GDL: "Grand-Duché de Lituanie"
BLR_GDL_desc: "Il est temps de restaurer le grand État des Litvins. Enfin, notre peuple ne sera plus sous le joug d'une superpuissance ; il aura l'opportunité de devenir lui-même une superpuissance."
BLR_help_silesians: "Aider les séparatistes silésiens"
BLR_help_silesians_desc: "Diviser pour régner est le principe principal que nous utiliserons dans notre politique envers la Pologne. Lorsque la phase chaude de la transition des Polonais sous notre contrôle commencera, les Silésiens pourraient faciliter notre conquête de ce pays."
BLR_revansh_return: "Raviver le Praviy Revansh"
BLR_revansh_return_desc: "Le Praviy Revansh était une organisation nationaliste des années 90, qui professait une rhétorique anti-polonaise et anti-russe et était convaincue qu'il était nécessaire de créer des organisations paramilitaires à la manière ukrainienne."
BLR_blackcat: "Raviver le Chat Noir"
BLR_blackcat_desc: "Le Chat Noir était une grande organisation partisane sur le territoire de la Biélorussie pendant 40 ans, qui luttait pour son indépendance contre le gouvernement soviétique. Leurs méthodes nous aideront parfaitement à nous défendre contre l'invasion des ennemis."
BLR_lith_again: "Retour à Zemaitija"
BLR_lith_again_desc: "Le moment est venu de compléter la reconstruction de notre puissant État. Une Lituanie petite et faible se dresse sur notre chemin ; nous la briserons. Mais nous ne pourrons pas attaquer le pays comme ça ; nous devons créer les conditions nécessaires et une raison pour que notre invasion ne semble pas sans fondement."
BLR_Taler_ruble: "Taler biélorusse"
BLR_Taler_ruble_desc: "Nous devons nous débarrasser complètement du rouble, en le remplaçant par notre nouvelle monnaie."
BLR_National_science: "Croissance scientifique et économique"
BLR_National_science_desc: "Nous commencerons à développer notre propre science et économie en tant qu'État indépendant."
BLR_create_nationalsecurity: "Créer de nouveaux départements"
BLR_create_nationalsecurity_desc: "Au lieu de l'héritage de l'URSS sous la forme du KGB, nous créerons deux nouvelles structures - le Service de sécurité nationale et le Service de renseignement national."
BLR_Delete_KGB: "Réforme du KGB"
BLR_Delete_KGB_desc: "Le KGB doit être aboli et remplacé par une nouvelle structure."
BLR_Reform_Police: "Réforme de la police"
BLR_Reform_Police_desc: "La milice soviétique était une relique du passé dont nous voulons nous débarrasser ; nous réorganisons la milice en une police nationale sur le modèle de la Pologne."
BLR_attack_russian_bear: "Achever l'ours russe"
BLR_attack_russian_bear_desc: "Enfin, notre principal ennemi sera détruit."
BLR_zmagar_army: "Réforme de l'armée"
BLR_zmagar_army_desc: "Notre armée a besoin d'une réforme urgente, pendant que nous étions occupés par la réforme sociopolitique de notre pays, nos forces armées ont été sérieusement affaiblies."
BLR_Young_Front: "Jeune Front"
BLR_Young_Front_desc: "Le Jeune Front est un mouvement international de la jeunesse biélorusse. C'est une organisation d'opposition de la jeunesse biélorusse."
BLR_south_river_battalion_desc: "Un bataillon constitué de résidents américains du comté de South River."
BLR_territorial_reform: "Réforme territoriale"
BLR_territorial_reform_desc: "Au lieu des six régions actuelles et de 110 districts, Zenon Poznyak et l'équipe d'auteurs du programme proposent de diviser le pays en 16 voïvodies, plus Minsk séparément. Les voïvodies, à leur tour, seront divisées en 60 provinces et 270 anciennes villes."
BLR_anti_lgbt: "Interdiction de la propagande des relations perverses"
BLR_anti_lgbt_desc: "Nous adoptons une loi sur la priorité et la protection de la famille, du mariage (union d'un homme et d'une femme), de la maternité, sur la protection de la famille contre les empiétements et les ingérences dans les affaires familiales par l'idéologie et les organisations. De plus, il est proposé d'adopter une loi « sur la protection de la nature humaine » et d'interdire la propagande des relations perverses contre la nature humaine."
BLR_latgale_or_war: "Latgale ou la guerre"
BLR_latgale_or_war_desc: "Latgale faisait autrefois partie du Grand-Duché de Lituanie. Le moment est venu de rendre ces terres à sa composition, il est peu probable que la Lettonie puisse nous résister."
BLR_legacy_kurland: "Héritage du Duché de Courlande"
BLR_legacy_kurland_desc: "Le Duché de Courlande a autrefois participé à la course à la colonisation. Le drapeau du Duché flottait autrefois sur Trinité-et-Tobago et au large des côtes de la Gambie. Il est temps, nous, les successeurs légitimes du Duché, de chercher à ramener ces anciennes possessions coloniales dans notre empire. Il est temps de fixer nos objectifs outre-mer et de ramener ces anciennes possessions coloniales dans le giron."
BLR_pro_poland_propoganda: "Propagande pro-biélorusse en Pologne"
BLR_pro_poland_propoganda_desc: "Nous devons accroître notre influence en Pologne par la propagande et d'autres sources d'interaction."
BLR_Dismiss_soviet_officers: "Renvoyer les officiers pro-soviétiques"
BLR_Dismiss_soviet_officers_desc: "La lutte contre l'héritage soviétique doit également être menée dans l'armée, nous n'avons pas besoin de généraux qui sympathisent avec ce régime sanglant."
BLR_open_border_with_pol: "Ouvrir les frontières"
BLR_open_border_with_pol_desc: "L'ouverture des frontières aidera nos peuples à se sentir connectés non seulement économiquement, mais aussi physiquement."
BLR_training_for_pol: "Exercices militaires conjoints"
BLR_training_for_pol_desc: "Nos armées ont besoin de coordination au combat. Des exercices militaires conjoints aideront parfaitement à cet égard."
BLR_Asseco_Poland: "Asseco Pologne"
BLR_Asseco_Poland_desc: "Nous racheterons cette entreprise et en ferons la propriété de notre futur État des Biélorusses et des Polonais."
BLR_ynia_Poland: "La seconde Union de Lublin"
BLR_ynia_Poland_desc: "Il est temps de se souvenir à quel point l'Union de Lublin était honteuse pour le Grand-Duché de Lituanie. Cette fois, ce sera différent."
BLR_Ukraine_way: "Amitié avec l'Ukraine"
BLR_Ukraine_way_desc: "Malgré nos revendications territoriales, nous sommes prêts à mener un dialogue avec l'Ukraine contre des ennemis communs, et il est possible de créer une alliance qui aidera nos États à survivre entourés d'adversaires."
BLR_Join_GUAM_to_Ukraine: "Rejoindre le GUAM"
BLR_Join_GUAM_to_Ukraine_desc: "L'une de nos premières étapes amicales envers l'Ukraine sera de rejoindre le GUAM. Une organisation où l'Ukraine occupe l'un des rôles principaux."
BLR_training_with_ukr: "Exercices militaires conjoints"
BLR_training_with_ukr_desc: "Nous sommes prêts à proposer à l'armée ukrainienne de mener des exercices conjoints pour pratiquer des manœuvres et coordonner les troupes."
BLR_military_coop_with_ukraine: "§GCoopération militaro-technique§!"
BLR_military_coop_with_ukraine_desc: "Nous sommes prêts à établir une coopération militaro-technique avec le complexe militaro-industriel ukrainien."
BLR_Intermarium: "Intermarium"
BLR_Intermarium_desc: "Il est temps pour nous de nous unir avec l'Ukraine dans une puissante alliance pour affronter ensemble nos ennemis."
BLR_Intermarium_poland: "Intermarium"
BLR_Intermarium_poland_desc: "Il est temps pour nous de nous unir avec la Pologne dans une puissante alliance pour affronter ensemble nos ennemis."
BLR_Ukraine_enemy: "S'emparer des terres ukrainiennes"
BLR_Ukraine_enemy_desc: "Historiquement, ces terres appartenaient au Grand-Duché de Lituanie et maintenant, aucun faux lien d'amitié ne devrait nous empêcher de les rendre à notre grand État."
BLR_Transnistria_enemy: "Résoudre le problème de la Transnistrie"
BLR_Transnistria_enemy_desc: "Un petit État non reconnu est la Transnistrie. Cela fait longtemps qu'elle est une source de maux de tête pour la Moldavie, mais nous sommes prêts à les aider à résoudre ce problème, bien sûr, en prenant ces terres pour nous-mêmes."
BLR_Sovereign_Internet: "Internet souverain"
BLR_Sovereign_Internet_desc: "Nous devons rendre notre espace Internet complètement indépendant des autres pays afin qu'ils ne puissent pas influencer nos citoyens."
# Idées
BLR_national_state_idea: "État national biélorusse"
BLR_national_state_idea_desc: "Après des siècles d'occupation polonaise, russe puis soviétique, la Biélorussie, qui avait obtenu son indépendance et s'était retrouvée sous l'emprise d'un dictateur pro-russe, a pu obtenir sa liberté. Mais malgré cela, nous avons beaucoup de travail à faire pour réaliser les rêves de millions de Biélorusses d'un État national biélorusse, un État où la culture, la langue et l'histoire biélorusses ne sont pas réprimées, un État digne d'une place sur la scène internationale."
