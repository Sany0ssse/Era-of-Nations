# Événements (suite du précédent artifact)
belarus_another.55.t: "Révolution du jean"
belarus_another.55.d: "Les protestations gagnent en ampleur en Biélorussie, et le gouvernement biélorusse ne parvient pas à les réprimer. Devrions-nous intervenir pour sauver leur gouvernement ?"
belarus_another.55.a: "Nous enverrons nos spécialistes"
belarus_another.55.b: "N'interférons pas"
belarus_another.56.t: "Révolution du jean"
belarus_another.56.d: "La Russie nous a envoyé ses spécialistes, et ensemble, nous avons réussi à réprimer les protestations !"
belarus_another.56.a: "Merci à la Russie"
belarus_another.57.t: "Révolution du jean"
belarus_another.57.d: "Nous avons secrètement demandé de l'aide au gouvernement russe, et ils nous ont refusé, nous laissant seuls face au mouvement révolutionnaire."
belarus_another.57.a: "Que Dieu nous aide"
belarus_another.58.t: "Révolution du jean"
belarus_another.58.d: "Les protestations gagnent en ampleur, certains bâtiments administratifs ont déjà été saisis, des émeutes commencent dans d'autres villes, et en plus, certains généraux ont rejoint les rebelles. Que devons-nous faire ?"
belarus_another.58.a: "Nous combattrons jusqu'au bout !"
belarus_another.58.b: "Nous céderons le pouvoir pacifiquement"
belarus_another.59.t: "La Biélorussie demande un prêt"
belarus_another.59.d: "Le gouvernement biélorusse nous demande de leur fournir un prêt. Nous ne sommes pas certains de leur solvabilité, mais l'influence que nous gagnerons en vaudra certainement la peine."
belarus_another.59.a: "Donnons-leur l'argent"
belarus_another.59.b: "Nous refusons"
belarus_another.60.t: "Prêt russe"
belarus_another.60.d: "Le gouvernement russe a accepté de nous fournir un prêt."
belarus_another.60.a: "Bien"
belarus_another.61.t: "Prêt russe"
belarus_another.61.d: "Le gouvernement russe a refusé de nous accorder un prêt."
belarus_another.61.a: "Triste"
belarus_another.62.t: "La Biélorussie propose de créer un commerçant commun de potassium"
belarus_another.62.d: "Le gouvernement biélorusse a proposé de créer un commerçant commun de potassium pour les deux entreprises, Uralkali et Belaruskali. Ainsi, nous pourrons tirer des profits plus avantageux de cette ressource."
belarus_another.62.a: "Nous acceptons"
belarus_another.62.b: "Nous refusons"
belarus_another.63.t: "Commerçant commun de potassium"
belarus_another.63.d: "Le gouvernement russe a accepté de créer une entreprise commune de commerce de potasse."
belarus_another.63.a: "Super"
belarus_another.64.t: "La Biélorussie met fin au commerçant commun de potassium"
belarus_another.64.d: "La confrontation entre nos deux entreprises de commerce de potassium a atteint ses limites, et le gouvernement biélorusse a décidé de séparer sa propre entreprise et de créer son propre commerçant."
belarus_another.64.a: "Triste"
belarus_another.65.t: "Coup d'État pro-Union"
belarus_another.65.d: "Nous avons tenté de mener un coup d'État en Biélorussie en utilisant toutes nos ressources administratives et policières, ainsi que nos relations."
belarus_another.65.a: "Voyons le résultat"
belarus_azot.1.t: "La Biélorussie propose un accord commercial sur les engrais chimiques"
belarus_azot.1.d: "La Biélorussie nous a récemment contactés pour nous proposer un contrat exclusif sur les meilleurs engrais qu'ils peuvent offrir. Accepter cela augmentera certainement notre rendement agricole, bien que politiquement, cette manœuvre puisse être discutable aux yeux de certains."
belarus_azot.1.a: "Absolument"
belarus_azot.1.b: "Pas possible pour le moment"
belarus_azot.2.t: "[From.GetName] accepte"
belarus_azot.2.d: "Nos efforts pour conclure un accord avec [From.GetName] ont enfin abouti, le contrat a été signé et le premier paiement est sur le point d'être reçu."
belarus_azot.2.a: "Enfin, une bonne nouvelle"
belarus_azot.3.t: "[From.GetName] refuse notre accord"
belarus_azot.3.d: "Nos efforts pour conclure un accord avec [From.GetName] semblent vains, nous n'avons pas reçu de réponse, et cela ne semble mener nulle part."
belarus_azot.3.a: "Maudits soient-ils, [From.GetNameDef] !"
belarus_azot.4.t: "[From.GetName] annule son contrat"
belarus_azot.4.d: "Nous avons reçu une nouvelle stupéfiante - [From.GetName] annule son contrat d'engrais avec nous, nous ne pourrons plus leur vendre notre produit, du moins pour l'instant."
belarus_azot.4.a: "Idiots ! Ils ne savent pas ce qu'ils perdent !"
BLR_Azot_category: "Commerce d'engrais GrodnoAzot"
BLR_Azot_category_desc: "Se concentrer sur le nombre de marchés auxquels GrodnoAzot a accès est vital pour la diversification et l'expansion de l'économie biélorusse. La multitude d'engrais et de pesticides différents à leur disposition peut être utile à de nombreuses nations. Établir des contrats avec d'autres pays et augmenter la production de nos engrais apportera une grande quantité de revenus à la nation et au peuple de Biélorussie.\n\nLes revenus tirés du commerce sont déterminés par le nombre de contrats signés multiplié par cinq pour cent.\n§YContrats d'engrais actuels :§! [?current_azot_capacity]/[?current_max_azot_capacity]\n§YCapacité maximale d'engrais :§! [?current_max_azot_capacity]/[?max_azot_capacity]"
BLR_Foreign_azot_trade_category: "Commerce d'engrais chimiques"
BLR_expand_azot_production: "Élargir la production d'engrais"
BLR_mission_to_Poland: "Mission commerciale vers [POL.GetNamewithFlag]"
BLR_mission_to_Poland_desc: "Établir une mission commerciale avec la Pologne est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Germany: "Mission commerciale vers [GER.GetNamewithFlag]"
BLR_mission_to_Germany_desc: "Établir une mission commerciale avec l'Allemagne est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_France: "Mission commerciale vers [FRA.GetNamewithFlag]"
BLR_mission_to_France_desc: "Établir une mission commerciale avec la France est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Norway: "Mission commerciale vers [NOR.GetNamewithFlag]"
BLR_mission_to_Norway_desc: "Établir une mission commerciale avec la Norvège est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Sweden: "Mission commerciale vers [SWE.GetNamewithFlag]"
BLR_mission_to_Sweden_desc: "Établir une mission commerciale avec la Suède est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Russia: "Mission commerciale vers [SOV.GetNamewithFlag]"
BLR_mission_to_Russia_desc: "Établir une mission commerciale avec la Russie est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Ukraine: "Mission commerciale vers [UKR.GetNamewithFlag]"
BLR_mission_to_Ukraine_desc: "Établir une mission commerciale avec l'Ukraine est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Kazahstan: "Mission commerciale vers [KAZ.GetNamewithFlag]"
BLR_mission_to_Kazahstan_desc: "Établir une mission commerciale avec le Kazakhstan est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Czechia: "Mission commerciale vers [CZE.GetNamewithFlag]"
BLR_mission_to_Czechia_desc: "Établir une mission commerciale avec la Tchéquie est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Netherland: "Mission commerciale vers [HOL.GetNamewithFlag]"
BLR_mission_to_Netherland_desc: "Établir une mission commerciale avec les Pays-Bas est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Zimbabwe: "Mission commerciale vers [ZIM.GetNamewithFlag]"
BLR_mission_to_Zimbabwe_desc: "Établir une mission commerciale avec le Zimbabwe est une décision commerciale judicieuse pour le bien de notre nation."
cancel_BLR_trade: "Annuler les contrats de commerce d'engrais"
BLR_pending_offer: "Une nation envisage actuellement un contrat d'engrais"
Luka_reactors: "Lukashenko promet de construire un réacteur nucléaire"
BLR_oil_sov: "Contrat énergétique avec la Biélorussie"
belarus_another.6.t: "Le culte de Lukashenko"
belarus_another.6.d: "Alexandre Lukashenko est président de la République de Biélorussie depuis très longtemps. Pendant son règne, un véritable culte du « Batka » s'est formé autour de lui. Ce culte le distingue des autres dictateurs de la CEI, mais l'oblige également à interagir avec son peuple d'une manière particulière. Le soutien à Batka est un indicateur montrant à quel point Alexandre Grigorievitch Lukashenko est soutenu dans tous les segments de la population. Selon diverses actions, cet indicateur augmentera ou diminuera, offrant divers bonus ou malus."
belarus_another.6.a: "Notre Batka Lukashenko, mère de la Biélorussie"
BLR_luka_prime: "Premier ministre de l'État de l'Union - Lukashenko"
