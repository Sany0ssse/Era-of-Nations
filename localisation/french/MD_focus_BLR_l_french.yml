BLR_mzkt_contract_desc: "Usine de tracteurs à roues de Minsk, MZKT est une entreprise spécialisée dans la production de véhicules lourds routiers et tout-terrain, de véhicules remorqués, de châssis à roues spéciaux pour l'installation d'équipements pour les entreprises de construction, pétrolières, gazières et de complexes de construction mécanique. Entreprise d'État sous la juridiction du Comité militaro-industriel d'État de la République de Biélorussie"
BLR_mzkt_contract_another: "Contrat avec MZKT"
BLR_mzkt_another_desc: "Usine de tracteurs à roues de Minsk, MZKT est une entreprise spécialisée dans la production de véhicules lourds routiers et tout-terrain, de véhicules remorqués, de châssis à roues spéciaux pour l'installation d'équipements pour les entreprises de construction, pétrolières, gazières et de complexes de construction mécanique. Entreprise d'État sous la juridiction du Comité militaro-industriel d'État de la République de Biélorussie"
BLR_mzkt_contract_blr: "Contrat MZKT avec [SOV.GetNameWithFlag]"
BLR_mzkt_contract_blr_desc: "Usine de tracteurs à roues de Minsk, MZKT est une entreprise spécialisée dans la production de véhicules lourds routiers et tout-terrain, de véhicules remorqués, de châssis à roues spéciaux pour l'installation d'équipements pour les entreprises de construction, pétrolières, gazières et de complexes de construction mécanique. Entreprise d'État sous la juridiction du Comité militaro-industriel d'État de la République de Biélorussie"
BLR_mzkt_union_state: "[BLR.GetFlag]Usine de tracteurs à roues de Minsk"
BLR_mzkt_union_state_desc: "Usine de tracteurs à roues de Minsk, MZKT est une entreprise spécialisée dans la production de véhicules lourds routiers et tout-terrain, de véhicules remorqués, de châssis à roues spéciaux pour l'installation d'équipements pour les entreprises de construction, pétrolières, gazières et de complexes de construction mécanique. Elle est actuellement sous la juridiction de l'État de l'Union"
BLR_140_zavod_union_state: "[BLR.GetFlag]Usine de réparation 140"
BLR_140_zavod_union_state_desc: "L'usine de réparation 140 est une entreprise d'État du complexe militaro-industriel de [SOV.GetFlag]État de l'Union, spécialisée dans la réparation et la modernisation des véhicules blindés et de leurs moteurs"
BLR_agriculture: "Agriculture biélorusse"
# Politique intérieure
BLR_presidential_election_of_2001: "La sphère politique"
BLR_presidential_election_of_2001_desc: "Il est temps de décider qui dirigera notre pays au nouveau millénaire"
# État de l'Union
BLR_union_become_one: "L'Union deviendra une"
# Libéraux
BLR_united_opposition: "Opposition unie"
BLR_united_opposition_desc: "L'opposition libérale a atteint son objectif initial de reléguer l'ancien ordre autoritaire de notre pays aux marges de l'histoire. Mais ce n'est pas la fin. Ce n'est que le début. Les éléments anti-étatiques se sont trop fortement installés dans notre patrie. La lutte continue. La prudence est de notre côté !"
BLR_eradicate_corruption: "Éradiquer la corruption"
BLR_eradicate_corruption_desc: "Le précédent gouvernement autoritaire a fait de la corruption une partie intégrante du système de notre pays. Pendant longtemps, le peuple l'a tolérée, et l'opportunité de commencer la longue lutte contre la corruption s'ouvre aujourd'hui."
BLR_united_againt_totalitarism: "Unis contre le totalitarisme"
BLR_united_againt_totalitarism_desc: "Nous en avons assez d'être les gardiens malheureux du titre de « dernière dictature d'Europe ». La Biélorussie est un pays démocratique avec des institutions de pouvoir démocratiques. Nous lutterons ensemble contre toute manifestation de tendances totalitaires."
BLR_dismantle_unloyal_administrations: "Démanteler les administrations déloyales"
BLR_dismantle_unloyal_administrations_desc: "Malheureusement, parmi les gens de notre pays, tout le monde n'est pas prêt à accepter la voie du progrès et de la prospérité. Ils ont fait leur choix et ils le regretteront."
BLR_free_political_prisoners: "Libérer les prisonniers politiques"
BLR_free_political_prisoners_desc: "De nombreux journalistes, manifestants et politiciens ont été soumis à la répression politique par le régime précédent et se sont retrouvés en prison. Les temps changent, et maintenant nous avons assez de pouvoir politique pour leur rendre leur liberté."
BLR_bring_siloviks_to_justice: "Traduire les siloviks en justice"
BLR_bring_siloviks_to_justice_desc: "Nous avons tous vu comment les chiens loyaux du régime inhumain précédent terrorisaient les manifestants pacifiques dans les rues de nos villes. C'était injuste, et nous devons leur montrer où est leur place."
BLR_constitutional_referendum: "Référendum constitutionnel"
BLR_constitutional_referendum_desc: "Nous devons donner un choix à notre peuple. Un choix sur la manière dont la Biélorussie doit s'exprimer dans l'espace politique. Autrefois, le régime autoritaire a fait ce choix pour nous, et cela n'a rien apporté de bon. Mais maintenant, les forces démocratiques sont au pouvoir, et l'idée d'intégration européenne se répand parmi les citoyens. Notre administration soutient cela, mais il convient de déterminer comment la Biélorussie peut y parvenir, compte tenu de notre grand voisin."
BLR_oko_za_oko: "Œil pour œil"
BLR_oko_za_oko_desc: "Le peuple a décidé que la Biélorussie en a assez ! L'Est a soutenu le régime autoritaire biélorusse précédent, qui a réprimé et humilié nos citoyens. Si nous voulons nous débarrasser des chaînes de l'influence étrangère, cela doit être fait immédiatement et de manière décisive ! Ce sera notre revanche."
BLR_destroy_eastern_influence: "Détruire l'influence de l'Est"
BLR_destroy_eastern_influence_desc: "Il est temps de mettre fin aux envahisseurs de l'Est qui continuent d'interférer dans nos affaires internes. La Biélorussie est un État indépendant qui aspire à l'intégration européenne. L'influence de l'Est rend cet objectif difficile à atteindre."
BLR_democratise_siloviks: "Démocratiser les siloviks"
BLR_democratise_siloviks_desc: "Auparavant, les siloviks étaient loyaux à la dictature biélorusse. Désormais, ils serviront notre Biélorussie démocratique."
BLR_strong_president: "Président fort"
BLR_strong_president_desc: "Nous devons créer l'image d'un leader épris de liberté et fort. Peut-être que certains nous accuseront de sympathie pour l'autoritarisme, mais il faut comprendre que c'est pour le bien de la sécurité de la démocratie de la nation de la République de Biélorussie. « Mon allégeance va à la République, à la démocratie ! »"
BLR_radical_economic_reforms: "Réformes économiques radicales"
BLR_radical_economic_reforms_desc: "Pour faire partie du monde européen, nous devons correspondre aux meilleurs systèmes économiques des pays européens. Il est temps pour notre croissance économique. Sans réforme sérieuse, nous ne pouvons pas y parvenir."
BLR_ditch_russia: "S'éloigner de la Russie"
BLR_ditch_russia_desc: "« Adieu, Russie mal lavée »"
BLR_european_dominance: "Domination européenne"
BLR_european_dominance_desc: "Nous pouvons être sûrs que les sentiments pro-européens prédominent désormais dans notre société. Europe, nous voilà !"
BLR_optimise_bureaucracy: "Optimiser la bureaucratie"
BLR_optimise_bureaucracy_desc: "Moins de bureaucratie signifie moins de dépenses qui pèsent sur notre budget !"
BLR_new_patroitism: "Nouveau patriotisme"
BLR_new_patroitism_desc: "Les citoyens à l'esprit libéral associent le patriotisme à l'ancien régime autoritaire qui le promouvait. Mais des escrocs et des voleurs peuvent-ils aimer leur patrie ? Il est important de promouvoir un véritable patriotisme, qui repose principalement sur la défense de nos droits et de la démocratie."
BLR_belarusian_consensus: "Consensus biélorusse"
BLR_belarusian_consensus_desc: "Nous voulons le meilleur pour notre pays, mais la réalité est qu'il est suicidaire de provoquer la Russie et de se précipiter tête baissée dans les organisations occidentales. Nous sommes en faveur des réformes, mais les réformes doivent tenir compte de notre position géopolitique. Par conséquent, il est important de ne pas rompre les relations avec la Russie et la diaspora russe en Biélorussie. Notre chemin vers l'intégration européenne sera probablement atteint par de multiples compromis."
BLR_unite_the_belarus: "Unir la Biélorussie"
BLR_unite_the_belarus_desc: "Le peuple de notre pays est divisé. Certains sont pro-russes, d'autres plus pro-occidentaux. Il n'est un secret pour personne que nous voyons la Biélorussie dans le monde occidental. Nous devons unir doucement la Biélorussie sous cette idée."
BLR_depolitisize_siloviks: "Dépolitiser les siloviks"
BLR_depolitisize_siloviks_desc: "Les forces de sécurité défendaient auparavant le régime précédent, mais nous devons nous assurer que leur première priorité est de maintenir l'ordre public. De plus, nous ne permettrons pas que le pluralisme des opinions soit entravé dans notre pays. Les citoyens pro-russes ont le droit de s'exprimer sans crainte d'être jetés derrière les barreaux."
BLR_parliamentary_dominance: "Domination parlementaire"
BLR_parliamentary_dominance_desc: "La force de notre démocratie réside dans notre parlement, qui connaît un âge d'or sous la gouvernance libérale."
BLR_a_call_to_cremlin: "Appel au Kremlin"
BLR_a_call_to_cremlin_desc: "Nous voulons l'intégration européenne. Mais nous voulons aussi que rien n'arrive à la Biélorussie le 24 février. Nous discuterons avec la Russie des conditions sous lesquelles elle nous permettra de nous intégrer pleinement dans les institutions occidentales. Les analystes disent que la Biélorussie paiera un prix élevé, mais nous n'avons pas d'autres options."
BLR_moderate_approach_to_economy: "Approche modérée de l'économie"
BLR_moderate_approach_to_economy_desc: "Pas de radicalisme. Seulement des réformes économiques équilibrées et prudentes, pour ne pas plonger notre pays dans la crise."
BLR_slow_integration: "Intégration lente"
BLR_slow_integration_desc: "Nous avons fait des compromis qui ouvrent la voie à une intégration lente mais sûre avec l'Occident. Nous avons beaucoup sacrifié et devons montrer que ce n'était pas en vain."
BLR_red_white_red: "Belyj Chervonyj Belyj"
BLR_red_white_red_desc: "Drapeau blanc-rouge-blanc - symbole d'une Biélorussie libre, forte et démocratique. Pendant notre temps au pouvoir, nous avons prouvé que nous sommes dignes de ce drapeau !"
BLR_lukashists_opposition: "Opposition loukashiste"
BLR_administration_purge: "Purge de l'administration"
BLR_strong_president_idea: "Président fort"
BLR_new_economic_of_belarus: "Nouvelle économie de la Biélorussie"
BLR_new_economic_of_belarus_desc: "Notre économie n'est pas assez efficace, nous avons besoin de réformes radicales pour construire une économie stable comme en Europe. La première étape vers l'intégration européenne est des réformes économiques conformes au style européen."
