BLR_GrodnoAzot: "Grodno Azot"
BLR_GrodnoAzot_desc: "La branche de l'usine Khimvolokno de Grodno Azot OJSC est un grand fabricant de fils et fibres de polyamide et de polyester, ainsi que de polyamide-6 (PA-6) et de matériaux composites polymères basés sur celui-ci. Chacun des principaux types de produits est fabriqué dans une large gamme avec diverses propriétés physiques et mécaniques et des indicateurs de qualité, en fonction de l'application."
