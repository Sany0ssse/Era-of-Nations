# Autres événements
belarus_another.1.t: "La Biélorussie nous demande des investissements"
belarus_another.1.d: "Nos vieux amis biélorusses nous demandent des investissements"
belarus_another.1.a: "Bien sûr"
belarus_another.1.b: "Désolé, non"
belarus_another.2.t: "Guerre diplomatique polono-biélorusse"
belarus_another.2.d: "Nos relations avec la Pologne ont commencé à se détériorer rapidement. La Biélorussie a accusé l'un des diplomates polonais d'« actions actives visant à déstabiliser la société biélorusse ». En réponse, la Pologne a préparé une liste de responsables biélorusses qui seront interdits d'entrée sur le territoire polonais. La cause du conflit était l'association publique « Union des Polonais de Biélorussie », qui regroupe environ 20 000 personnes. Lors du congrès de l'Union des Polonais de Biélorussie, son ancien dirigeant, fidèle à la direction de la Biélorussie, a été démis, après quoi l'Union des Polonais de Biélorussie a été soumise à une pression massive de la part des autorités, qui ont accusé la direction de la Pologne, qui finançait le congrès, et l'ambassade de ce pays, d'« activités subversives » contre la Biélorussie. Le ministère de la Justice de Biélorussie a refusé d'approuver les résultats du congrès de l'Union des Polonais de Biélorussie, qui a élu Angelika Borys comme présidente. Le Sejm polonais a exprimé son mécontentement face aux actions des autorités biélorusses, ce qui a été perçu en Biélorussie comme une tentative d'ingérence dans ses affaires internes. Les développements ultérieurs ont conduit à un conflit diplomatique."
belarus_another.2.a: "Nous en avons assez des Polonais !"
belarus_another.3.t: "Uniatisme en Ukraine"
belarus_another.3.d: "L'uniatisme a commencé à se répandre activement sur le territoire de notre pays, et de nombreux habitants ont commencé à exiger un rejet officiel de l'Église orthodoxe, subordonnée à Moscou. Peut-être devrions-nous les écouter ?"
belarus_another.3.a: "L'uniatisme deviendra la religion d'État"
belarus_another.3.b: "Tout restera comme avant"
belarus_another.4.t: "La Biélorussie nous demande des investissements"
belarus_another.4.d: "Nos vieux amis biélorusses nous demandent des investissements"
belarus_another.4.a: "Bien sûr"
belarus_another.4.b: "Désolé, non"
belarus_another.5.t: "Décret numéro 3"
belarus_another.5.d: "L'indignation du peuple face au décret n° 3 est très grande. Les gens exigent son annulation, ils demandent des concessions. Allons-nous les suivre ?"
belarus_another.5.a: "Nous n'annulerons pas le décret"
belarus_another.5.b: "Je pense que nous sommes prêts à faire des concessions"
belarus_another.7.t: "Investissements biélorusses dans notre pays"
belarus_another.7.d: "Nos collègues de la République de Biélorussie proposent de conclure un accord de coopération et d'investissement. Nous devons examiner cet accord et décider si nous le concluons ou non."
belarus_another.7.a: "Nous signerons le contrat"
belarus_another.7.b: "Nous refusons"
belarus_another.8.t: "Projet BOMBEL"
belarus_another.8.d: "Les fonds de l'UE ont été reçus. Il est temps pour nous de décider comment disposer de ces fonds."
belarus_another.8.a: "Nous ferons ce qu'il faut - nous renforcerons la frontière"
belarus_another.8.b: "Je ne pense pas qu'ils remarqueront si nous prenons"
belarus_another.9.t: "Investissements biélorusses dans notre pays"
belarus_another.9.d: "Nos collègues de la République de Biélorussie proposent de conclure un accord de coopération et d'investissement. Nous devons examiner cet accord et décider si nous le concluons ou non."
belarus_another.9.a: "Nous signerons le contrat"
belarus_another.9.b: "Nous refusons"
belarus_another.10.t: "Que faire des PMC Wagner ?"
belarus_another.10.d: "Nous avons détenu plusieurs personnes suspectes qui se sont révélées être des mercenaires des célèbres PMC Wagner russes. Nos forces de l'ordre sont déjà prêtes à les accuser de préparation d'actes terroristes. La partie russe insiste pour leur libération. Que ferons-nous ?"
belarus_another.10.a: "Nous les libérerons et les remettrons à la partie russe"
belarus_another.10.b: "Mettez-les en prison et accusez-les de préparation d'attaques terroristes"
belarus_another.11.t: "Guerre civile en Biélorussie"
belarus_another.11.d: "Notre rhétorique clairement anti-russe, la politique d'imposition rigide de la langue biélorusse, ainsi que l'imposition active d'une histoire selon laquelle nous n'avons rien en commun avec les Russes, ont porté leurs fruits. Les régions de l'Est se sont rebellées, les forces d'autodéfense locales ont pris le pouvoir, nous devons arrêter cela le plus rapidement possible avant que les grandes puissances n'en profitent."
belarus_another.11.a: "C'est terrible !"
belarus_another.12.t: "Le général Azarenok fait du lobbying pour les intérêts russes dans notre pays"
belarus_another.12.d: "Nos forces de l'ordre ont appris que le général Azarenka faisait du lobbying pour les intérêts de la Russie dans notre pays à travers ses relations. Devons-nous y prêter attention, ou est-ce dans l'intérêt de la République de Biélorussie ?"
belarus_another.12.a: "Bien sûr"
belarus_another.12.b: "Il faut le mettre en prison"
belarus_another.14.t: "Sergey Tikhanovsky"
belarus_another.14.d: "Un blogueur d'opposition bien connu critiquant notre gouvernement. Il commence à avoir trop d'influence parmi le peuple, et nous devons faire quelque chose à ce sujet."
belarus_another.14.a: "Nous devons le mettre en prison"
belarus_another.14.b: "Ne le touchez pas, il pourrait encore nous être utile"
belarus_another.15.t: "Demander de l'aide au FMI"
belarus_another.15.d: "Nous sommes forcés de demander une assistance au FMI pour éliminer les conséquences de la crise."
belarus_another.15.a: "Nous n'avons pas le choix"
belarus_another.16.t: "Renforcement de la politique de crédit"
belarus_another.16.d: "La politique de crédit subira une révision drastique en raison de la situation actuelle."
belarus_another.16.a: "Nous n'avons pas le choix"
belarus_another.17.t: "Coopération militaire avec la Biélorussie"
belarus_another.17.d: "Nous avons invité des spécialistes militaires de Biélorussie pour résoudre les tâches les plus importantes dans notre armée. Les forces spéciales biélorusses ont formé nos combattants, et l'industrie militaire biélorusse a amélioré notre système de défense aérienne."
belarus_another.17.a: "Incroyable !"
belarus_another.18.t: "Latgale ou la guerre"
belarus_another.18.d: "Le gouvernement biélorusse devient de plus en plus agressif. Ils nous ont donné un ultimatum - soit nous leur cédons la région de Latgale, soit les conséquences seront les plus terribles pour notre pays. Une telle déclaration inattendue nous a choqués. Que ferons-nous ?"
belarus_another.18.a: "Nous devrons leur céder Latgale, ainsi nous préserverons au moins notre indépendance"
belarus_another.18.b: "Aucune concession"
belarus_another.19.t: "La seconde Union de Lublin"
belarus_another.19.d: "La Biélorussie influence activement notre gouvernement et dispose de leviers sur celui-ci. Aujourd'hui, l'ambassadeur biélorusse nous a remis un projet de nouvel accord - impliquant la création d'une entité supranationale, selon le type proposé par la Russie pour le gouvernement Lukashenko. En réalité, nous perdons une partie de notre autonomie, mais nos États deviennent presque unis. Acceptons-nous cela ?"
belarus_another.19.a: "Notre pays est affaibli, je pense que nous devrions accepter"
belarus_another.19.b: "Notre indépendance est tout pour nous"
belarus_another.20.t: "Signature de l'Union"
belarus_another.20.d: "Le gouvernement polonais a accepté de créer une union avec nous ! C'est une victoire pour tout le peuple biélorusse !"
belarus_another.20.a: "Eh bien, nous verrons"
belarus_another.21.t: "La Pologne a refusé !"
belarus_another.21.d: "Le gouvernement polonais, que nous avons soutenu si longtemps, nous a trahis. Apparemment, nous n'avons pas le choix et nous devons décider par nous-mêmes ce que nous ferons avec ces traîtres. Nous devrons peut-être utiliser tous les leviers disponibles."
belarus_another.21.a: "Faisons un enfer pour les Polonais"
belarus_another.21.b: "Laissons-les"
belarus_another.22.t: "Milice silésienne"
belarus_another.22.d: "Notre peuple a une chance d'obtenir l'indépendance, il est temps d'en profiter et de prendre les armes !"
belarus_another.22.a: "À bas l'oppression polonaise !"
belarus_another.23.t: "Exercices conjoints avec la Biélorussie"
belarus_another.23.d: "La Biélorussie nous propose de mener des exercices conjoints pour la coordination au combat de nos troupes. Acceptons-nous ?"
belarus_another.23.a: "Bien sûr, nous acceptons"
belarus_another.23.b: "Nous nous en passerons"
belarus_another.24.t: "Exercices conjoints avec la Pologne"
belarus_another.24.d: "Ils ont accepté de mener des exercices avec nos troupes. Nous acquerrons une bonne expérience."
belarus_another.24.a: "Bien"
belarus_another.25.t: "Fournir des armes à l'Irak"
belarus_another.25.d: "Nous sommes prêts à allouer une partie des armes pour livraison à l'Irak afin de soutenir le régime ami là-bas."
belarus_another.25.a: "Bien"
belarus_another.26.t: "Atterrissage d'un avion Ryanair avec Protasevich"
belarus_another.26.d: "Nos services spéciaux ont réussi à intercepter et faire atterrir l'avion où se trouve l'éditeur de l'une des chaînes d'opposition, NEXTA. Il s'appelle Roman Protasevich."
belarus_another.26.a: "Bien"
belarus_another.27.t: "Le destin de l'Église biélorusse"
belarus_another.27.d: "La direction de notre pays a sérieusement envisagé d'accorder l'autocéphalie à notre Église. Mais cette démarche pourrait certainement détériorer les relations avec notre ami et voisin - la Russie. Allons-nous le faire ?"
belarus_another.27.a: "Nous accordons l'autocéphalie à notre Église"
belarus_another.27.b: "Non"
belarus_another.28.t: "Que faire avec l'Union des Polonais de Biélorussie ?"
belarus_another.28.d: "L'Union des Polonais de Biélorussie est depuis longtemps notre problème. À travers elle, la Pologne nous influençait de toutes ses forces, il est temps de s'en occuper. Soit nous les laissons, soit nous expulsons complètement la population polonaise."
belarus_another.28.a: "Laissons-les sous notre contrôle"
belarus_another.28.b: "Il n'y a pas de place pour les Polonais en Biélorussie"
belarus_another.29.t: "Annulation du commerce de navette"
belarus_another.29.d: "Grâce à la Russie et à la Chine, nous avons établi des approvisionnements en biens nécessaires pour enfin nous débarrasser de cette relique des années 90."
belarus_another.29.a: "Bien"
belarus_another.30.t: "Annulation du commerce de navette"
belarus_another.30.d: "Maintenant que nous avons accès aux biens européens par des canaux officiels, nos citoyens n'auront plus à s'engager dans cette activité dangereuse et parfois peu rentable."
belarus_another.30.a: "Bien"
belarus_another.31.t: "Guerre du lait"
belarus_another.31.d: "La Russie a boycotté l'importation de nos produits laitiers sur son territoire, nous coupant ainsi d'une part importante des profits. Allons-nous accepter les conditions qu'ils proposent, ou protégerons-nous le producteur national ?"
belarus_another.31.a: "Nous soutenons notre producteur à fond"
belarus_another.31.b: "Cédons à leurs exigences"
belarus_another.32.t: "Problème avec le Conseil suprême"
belarus_another.32.d: "Le Soviet suprême reste une relique du système soviétique, que nous ne pouvons pas encore éliminer légalement sans modifier la constitution. Par conséquent, nous devrons faire des compromis avec eux jusqu'à ce que nous résolvions enfin ce problème."
belarus_another.32.a: "Pour la gloire de la Biélorussie"
belarus_another.33.t: "Crash d'avion en Ukraine"
belarus_another.33.d: "Un avion avec Zenon à bord, en route pour Kyiv, s'est écrasé en Ukraine à la suite d'un accident d'avion. Il n'y a eu aucun survivant dans cette catastrophe, et il est urgent de décider qui prendra le poste de leader de l'État. Le député du parti, Yuri Belenky, est devenu le chef temporaire et peut-être permanent."
belarus_another.33.a: "Pour la gloire de la Biélorussie"
belarus_another.34.t: "Taler biélorusse"
belarus_another.34.d: "La Biélorussie propose d'introduire une monnaie unique sur le territoire de notre pays - le Thaler, le même qu'ils utilisent sur leur territoire. Peut-être que l'introduction d'une monnaie commune améliorera le commerce entre nos pays, mais notre indépendance sera à nouveau menacée."
belarus_another.34.a: "Nous acceptons"
belarus_another.34.b: "Nous refusons"
belarus_another.35.t: "Intermarium"
belarus_another.35.d: "La Biélorussie nous propose de créer une alliance militaire appelée l'Intermarium. En la créant, nous nous protégerons de l'agression de voisins plus puissants."
belarus_another.35.a: "Nous acceptons"
belarus_another.35.b: "Nous refusons"
belarus_another.36.t: "La Biélorussie veut rejoindre l'OTAN"
belarus_another.36.d: "La Biélorussie est sur la voie de la démocratie depuis longtemps et veut la défendre avec nous. Le gouvernement biélorusse a rempli toutes les conditions pour rejoindre l'OTAN et a déposé une demande d'adhésion à l'organisation. Allons-nous l'accepter ?"
belarus_another.36.a: "Nous acceptons"
belarus_another.36.b: "Nous refusons"
belarus_another.37.t: "Nous rejoignons l'OTAN"
belarus_another.37.d: "Notre demande d'adhésion a été approuvée, et maintenant nous faisons partie de cette grande alliance, prête à défendre la démocratie dans le monde entier !"
belarus_another.37.a: "Hourra !"
belarus_another.38.t: "La Biélorussie veut rejoindre l'USAID"
belarus_another.38.d: "Le gouvernement biélorusse a envoyé une demande pour rejoindre le programme USAID. Sommes-nous prêts à y répondre positivement ?"
belarus_another.38.a: "Nous acceptons leur demande"
belarus_another.38.b: "Non"
belarus_another.39.t: "Notre demande a été acceptée par l'USAID"
belarus_another.39.d: "Les États-Unis ont approuvé notre demande, et maintenant nous faisons partie du programme USAID."
belarus_another.39.a: "Hourra !"
belarus_another.40.t: "La crise économique de 2008 en Biélorussie"
belarus_another.40.d: "Phénomènes complexes dans l'économie du pays, indiquant une détérioration de la situation financière et économique. En 2008, la crise financière a commencé en Biélorussie. Maintenant, nous devons choisir un domaine dans lequel nous réduirons nos dépenses pour sauver le budget."
belarus_another.40.a: "Réduction du financement du système éducatif"
belarus_another.40.b: "Réduction du financement du système de santé"
belarus_another.40.c: "Réduction du financement du système bureaucratique"
belarus_another.41.t: "Opération « Nouveau Jour »"
belarus_another.41.d: "Le gouvernement biélorusse nous propose une opération militaire conjointe contre la Lituanie afin d'éliminer le problème du corridor de Suwałki. Acceptons-nous de prendre un tel risque ?"
belarus_another.41.a: "Nous devons sécuriser nos frontières"
belarus_another.41.b: "Nous ne prendrons pas ce risque"
belarus_another.42.t: "La Biélorussie veut obtenir Vilnius"
belarus_another.42.d: "Le gouvernement biélorusse a exprimé son souhait de transférer Vilnius et les territoires environnants sous leur contrôle total. Leur argument repose sur le fait qu'il s'agit d'une terre biélorusse historique. Acceptons-nous cela ?"
belarus_another.42.a: "Nous leur céderons Vilnius, renforçant ainsi les liens amicaux"
belarus_another.42.b: "Peut-être que nous le garderons pour nous"
belarus_another.43.t: "Les résultats de la révolution du jean"
belarus_another.43.d: "Nous n'attendions pas un tel soulèvement populaire, peut-être que notre pays a vraiment besoin de changements et qu'il est temps de céder le pouvoir à d'autres ?"
belarus_another.43.a: "Jamais"
belarus_another.43.b: "Apparemment, l'ère du changement est arrivée"
belarus_another.44.t: "Manifestations massives sous la direction de Tikhanovskaya"
belarus_another.44.d: "Nous n'attendions pas un tel soulèvement populaire, peut-être que notre pays a vraiment besoin de changements, et qu'il est temps de céder le pouvoir à d'autres ?"
belarus_another.44.a: "Jamais"
belarus_another.44.b: "Apparemment, l'ère du changement est arrivée"
belarus_another.45.t: "Guerre civile en Biélorussie"
belarus_another.45.d: "Nous n'avons pas pu contenir les manifestants, maintenant ils ont plongé le pays dans un chaos total. Que va-t-il se passer ensuite..."
belarus_another.45.a: "C'est terrible !"
belarus_another.46.t: "« Excursion à Varsovie »"
belarus_another.46.d: "Avec l'assistance de nos gardes-frontières, les PMC Wagner ont franchi la frontière polonaise et sont entrés sur son territoire. Ce que personne n'attendait a commencé."
belarus_another.46.a: "Été et arbalètes"
belarus_another.47.t: "La grande marche sur Varsovie"
belarus_another.47.d: "Avec l'assistance de nos gardes-frontières, les PMC Wagner ont franchi la frontière polonaise et sont entrés sur son territoire. Ce que personne n'attendait a commencé."
belarus_another.47.a: "Été et arbalètes"
belarus_another.48.t: "La guerre contre Wagner"
belarus_another.48.d: "Notre gouvernement a été choqué par la nouvelle que les combattants des PMC Wagner ont attaqué notre pays. Ils sont venus du territoire de la Biélorussie, ce qui nous donne une bonne raison de leur déclarer la guerre. Allons-nous le faire ?"
belarus_another.48.a: "Il est temps de mettre fin à la Biélorussie"
belarus_another.48.b: "Il n'est pas nécessaire de déclarer la guerre"
belarus_another.49.t: "« Excursion à Vilnius »"
belarus_another.49.d: "Avec l'assistance de nos gardes-frontières, les PMC Wagner ont franchi la frontière lituanienne et sont entrés sur son territoire. Ce que personne n'attendait a commencé."
belarus_another.49.a: "Été et arbalètes"
belarus_another.52.t: "Révolution du jean"
belarus_another.52.d: "Le peuple biélorusse est sorti pour protester contre le gouvernement légitime et exiger la démission de tout le gouvernement. J'espère que nous sommes bien préparés pour cela ?"
belarus_another.52.a: "Réprimer les protestations"
belarus_another.52.b: "Essayer de négocier"
belarus_another.53.t: "Les bolcheviks nationaux ont pris le pouvoir en Russie"
belarus_another.53.d: "Nos fidèles partisans ont enfin réussi à prendre le pouvoir en Russie. Le Kremlin est à nous maintenant. Notre leader est prêt à diriger la Russie."
belarus_another.53.a: "La Russie est tout. Le reste n'est rien."
belarus_another.54.t: "Rejoindre la Russie"
belarus_another.54.d: "Enfin, la Biélorussie rentre chez elle. Maintenant, nous ferons partie d'un grand pays, sacrifiant notre autonomie, mais en avions-nous besoin ?"
belarus_another.54.a: "Enfin"

 # Événements
belarus_another.55.t: "Révolution du jean"
belarus_another.55.d: "Les protestations gagnent en ampleur en Biélorussie, et le gouvernement biélorusse ne parvient pas à les réprimer. Devrions-nous intervenir pour sauver leur gouvernement ?"
belarus_another.55.a: "Nous enverrons nos spécialistes"
belarus_another.55.b: "N'interférons pas"
belarus_another.56.t: "Révolution du jean"
belarus_another.56.d: "La Russie nous a envoyé ses spécialistes, et ensemble, nous avons réussi à réprimer les protestations !"
belarus_another.56.a: "Merci à la Russie"
belarus_another.57.t: "Révolution du jean"
belarus_another.57.d: "Nous avons secrètement demandé de l'aide au gouvernement russe, et ils nous ont refusé, nous laissant seuls face au mouvement révolutionnaire."
belarus_another.57.a: "Que Dieu nous aide"
belarus_another.58.t: "Révolution du jean"
belarus_another.58.d: "Les protestations gagnent en ampleur, certains bâtiments administratifs ont déjà été saisis, des émeutes commencent dans d'autres villes, et en plus, certains généraux ont rejoint les rebelles. Que devons-nous faire ?"
belarus_another.58.a: "Nous combattrons jusqu'au bout !"
belarus_another.58.b: "Nous céderons le pouvoir pacifiquement"
belarus_another.59.t: "La Biélorussie demande un prêt"
belarus_another.59.d: "Le gouvernement biélorusse nous demande de leur fournir un prêt. Nous ne sommes pas certains de leur solvabilité, mais l'influence que nous gagnerons en vaudra certainement la peine."
belarus_another.59.a: "Donnons-leur l'argent"
belarus_another.59.b: "Nous refusons"
belarus_another.60.t: "Prêt russe"
belarus_another.60.d: "Le gouvernement russe a accepté de nous fournir un prêt."
belarus_another.60.a: "Bien"
belarus_another.61.t: "Prêt russe"
belarus_another.61.d: "Le gouvernement russe a refusé de nous accorder un prêt."
belarus_another.61.a: "Triste"
belarus_another.62.t: "La Biélorussie propose de créer un commerçant commun de potassium"
belarus_another.62.d: "Le gouvernement biélorusse a proposé de créer un commerçant commun de potassium pour les deux entreprises, Uralkali et Belaruskali. Ainsi, nous pourrons tirer des profits plus avantageux de cette ressource."
belarus_another.62.a: "Nous acceptons"
belarus_another.62.b: "Nous refusons"
belarus_another.63.t: "Commerçant commun de potassium"
belarus_another.63.d: "Le gouvernement russe a accepté de créer une entreprise commune de commerce de potasse."
belarus_another.63.a: "Super"
belarus_another.64.t: "La Biélorussie met fin au commerçant commun de potassium"
belarus_another.64.d: "La confrontation entre nos deux entreprises de commerce de potassium a atteint ses limites, et le gouvernement biélorusse a décidé de séparer sa propre entreprise et de créer son propre commerçant."
belarus_another.64.a: "Triste"
belarus_another.65.t: "Coup d'État pro-Union"
belarus_another.65.d: "Nous avons tenté de mener un coup d'État en Biélorussie en utilisant toutes nos ressources administratives et policières, ainsi que nos relations."
belarus_another.65.a: "Voyons le résultat"
belarus_azot.1.t: "La Biélorussie propose un accord commercial sur les engrais chimiques"
belarus_azot.1.d: "La Biélorussie nous a récemment contactés pour nous proposer un contrat exclusif sur les meilleurs engrais qu'ils peuvent offrir. Accepter cela augmentera certainement notre rendement agricole, bien que politiquement, cette manœuvre puisse être discutable aux yeux de certains."
belarus_azot.1.a: "Absolument"
belarus_azot.1.b: "Pas possible pour le moment"
belarus_azot.2.t: "[From.GetName] accepte"
belarus_azot.2.d: "Nos efforts pour conclure un accord avec [From.GetName] ont enfin abouti, le contrat a été signé et le premier paiement est sur le point d'être reçu."
belarus_azot.2.a: "Enfin, une bonne nouvelle"
belarus_azot.3.t: "[From.GetName] refuse notre accord"
belarus_azot.3.d: "Nos efforts pour conclure un accord avec [From.GetName] semblent vains, nous n'avons pas reçu de réponse, et cela ne semble mener nulle part."
belarus_azot.3.a: "Maudits soient-ils, [From.GetNameDef] !"
belarus_azot.4.t: "[From.GetName] annule son contrat"
belarus_azot.4.d: "Nous avons reçu une nouvelle stupéfiante - [From.GetName] annule son contrat d'engrais avec nous, nous ne pourrons plus leur vendre notre produit, du moins pour l'instant."
belarus_azot.4.a: "Idiots ! Ils ne savent pas ce qu'ils perdent !"
BLR_Azot_category: "Commerce d'engrais GrodnoAzot"
BLR_Azot_category_desc: "Se concentrer sur le nombre de marchés auxquels GrodnoAzot a accès est vital pour la diversification et l'expansion de l'économie biélorusse. La multitude d'engrais et de pesticides différents à leur disposition peut être utile à de nombreuses nations. Établir des contrats avec d'autres pays et augmenter la production de nos engrais apportera une grande quantité de revenus à la nation et au peuple de Biélorussie.\n\nLes revenus tirés du commerce sont déterminés par le nombre de contrats signés multiplié par cinq pour cent.\n§YContrats d'engrais actuels :§! [?current_azot_capacity]/[?current_max_azot_capacity]\n§YCapacité maximale d'engrais :§! [?current_max_azot_capacity]/[?max_azot_capacity]"
BLR_Foreign_azot_trade_category: "Commerce d'engrais chimiques"
BLR_expand_azot_production: "Élargir la production d'engrais"
BLR_mission_to_Poland: "Mission commerciale vers [POL.GetNamewithFlag]"
BLR_mission_to_Poland_desc: "Établir une mission commerciale avec la Pologne est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Germany: "Mission commerciale vers [GER.GetNamewithFlag]"
BLR_mission_to_Germany_desc: "Établir une mission commerciale avec l'Allemagne est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_France: "Mission commerciale vers [FRA.GetNamewithFlag]"
BLR_mission_to_France_desc: "Établir une mission commerciale avec la France est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Norway: "Mission commerciale vers [NOR.GetNamewithFlag]"
BLR_mission_to_Norway_desc: "Établir une mission commerciale avec la Norvège est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Sweden: "Mission commerciale vers [SWE.GetNamewithFlag]"
BLR_mission_to_Sweden_desc: "Établir une mission commerciale avec la Suède est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Russia: "Mission commerciale vers [SOV.GetNamewithFlag]"
BLR_mission_to_Russia_desc: "Établir une mission commerciale avec la Russie est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Ukraine: "Mission commerciale vers [UKR.GetNamewithFlag]"
BLR_mission_to_Ukraine_desc: "Établir une mission commerciale avec l'Ukraine est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Kazahstan: "Mission commerciale vers [KAZ.GetNamewithFlag]"
BLR_mission_to_Kazahstan_desc: "Établir une mission commerciale avec le Kazakhstan est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Czechia: "Mission commerciale vers [CZE.GetNamewithFlag]"
BLR_mission_to_Czechia_desc: "Établir une mission commerciale avec la Tchéquie est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Netherland: "Mission commerciale vers [HOL.GetNamewithFlag]"
BLR_mission_to_Netherland_desc: "Établir une mission commerciale avec les Pays-Bas est une décision commerciale judicieuse pour le bien de notre nation."
BLR_mission_to_Zimbabwe: "Mission commerciale vers [ZIM.GetNamewithFlag]"
BLR_mission_to_Zimbabwe_desc: "Établir une mission commerciale avec le Zimbabwe est une décision commerciale judicieuse pour le bien de notre nation."
cancel_BLR_trade: "Annuler les contrats de commerce d'engrais"
BLR_pending_offer: "Une nation envisage actuellement un contrat d'engrais"
Luka_reactors: "Lukashenko promet de construire un réacteur nucléaire"
BLR_oil_sov: "Contrat énergétique avec la Biélorussie"
belarus_another.6.t: "Le culte de Lukashenko"
belarus_another.6.d: "Alexandre Lukashenko est président de la République de Biélorussie depuis très longtemps. Pendant son règne, un véritable culte du « Batka » s'est formé autour de lui. Ce culte le distingue des autres dictateurs de la CEI, mais l'oblige également à interagir avec son peuple d'une manière particulière. Le soutien à Batka est un indicateur montrant à quel point Alexandre Grigorievitch Lukashenko est soutenu dans tous les segments de la population. Selon diverses actions, cet indicateur augmentera ou diminuera, offrant divers bonus ou malus."
belarus_another.6.a: "Notre Batka Lukashenko, mère de la Biélorussie"
BLR_luka_prime: "Premier ministre de l'État de l'Union - Lukashenko"
