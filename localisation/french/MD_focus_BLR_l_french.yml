# Arbre Nazbols
# Focus
BLR_soviet_system: "Biélorussie national-bolchevique"
BLR_soviet_system_desc: "Les national-bolcheviques ont pris le pouvoir dans le pays et sont prêts à entamer leurs premières réformes économiques. L'une d'elles sera un retour au système économique soviétique, en raison de l'échec de l'expérience du dirigeant précédent."
BLR_nazbol_new_church: "Nouvelle religion"
BLR_nazbol_new_church_desc: "Il est temps de créer une nouvelle religion qui répond aux intérêts de notre État !"
BLR_military_nazbol: "Investissements dans l'industrie militaire"
BLR_military_nazbol_desc: "Notre industrie militaire n'a toujours pas retrouvé le niveau de l'époque soviétique, nous devons y remédier."
BLR_nazbol_propaganda: "Machine de propagande"
BLR_nazbol_propaganda_desc: "Notre propagande doit être rouge et radicale, car notre haine prolétarienne envers l'Occident doit purifier l'esprit des Russes !"
BLR_nazbol_narodnaya_chk: "Commission populaire d'urgence"
BLR_nazbol_narodnaya_chk_desc: "Nous devons créer une commission spéciale pour les situations d'urgence du peuple et préparer notre population à tous les scénarios."
BLR_nazbol_anti_wse: "Étouffer l'opposition"
BLR_nazbol_anti_wse_desc: "Les opposants sont des rats ! Et nous les écraserons en Biélorussie avec notre juste haine prolétarienne."
BLR_nazbol_work_fronts: "Fronts de travail"
BLR_nazbol_work_fronts_desc: "Travail, société et armée ne font qu'un ! Le travail est un front de notre guerre sainte, et nous y excellerons."
BLR_nazbol_cyber: "Guerre cybernétique"
BLR_nazbol_cyber_desc: "Le cyberespace est une opportunité pour les masses de détruire le capitalisme occidental en utilisant ses propres outils."
BLR_nazbol_interbrigades: "Interbrigades"
BLR_nazbol_interbrigades_desc: "Nous sommes nationalistes, mais des nationalistes internationaux, et nous accueillons tous les radicaux qui souhaitent se battre pour leur race et leur classe dans nos rangs."
BLR_nazbol_inqusition: "Inquisition orthodoxe rouge"
BLR_nazbol_inqusition_desc: "Christianisme, Staline et communisme vont toujours de pair. Staline était le tsar prolétarien russe, saint et juste, qui a restauré l'orthodoxie en Russie et offert tant de martyrs à notre peuple. Et comme la bible rouge l'enseigne, le Christ était communiste depuis le début !"
BLR_nazbol_minsk: "Minsk - Forteresse de la révolution"
BLR_nazbol_minsk_desc: "Minsk est le symbole de notre nouvelle ère - une ville de rouge, de blanc et de noir. Centre avant-gardiste de notre révolution. Et nous devons le montrer dans la pratique."
BLR_nazbol_faerwall: "Pare-feu révolutionnaire"
BLR_nazbol_faerwall_desc: "Plus jamais la propagande occidentale corruptrice ne pénétrera l'esprit de notre peuple russe pur et innocent."
BLR_nazbol_black_guard: "Garde noire"
BLR_nazbol_black_guard_desc: "Nous devons sélectionner les meilleurs parmi les meilleurs et créer un nouveau régiment de gardiens pour notre État."
BLR_nazbol_revoult_spirit: "Esprit révolutionnaire"
BLR_nazbol_revoult_spirit_desc: "L'esprit de la révolution est notre véritable idée russe du chaos se déchaînant pour balayer tout ce qui se trouve sur notre chemin."
BLR_nazbol_anti_west: "Doctrine anti-occidentale"
BLR_nazbol_anti_west_desc: "L'Occident est l'antithèse de la vie ! La terre du coucher de soleil, où la vie s'arrête. L'Occident doit être oublié et enterré."
BLR_revoult_sobor: "Attirer les radicaux"
BLR_revoult_sobor_desc: "Les radicaux sont les plus purs dans leurs pensées et leurs actes - nous devons rassembler tous ceux qui sont assez passionnés et constituer une grande armée de la révolution."
BLR_nazbol_flame: "La flamme de la révolution"
BLR_nazbol_flame_desc: "Nous arrivons, et rien ne peut éteindre ce que nous mettrons en flammes."
