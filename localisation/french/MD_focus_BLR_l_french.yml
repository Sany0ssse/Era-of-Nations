# Décisions
BLR_belarusisation_category: "Biélorussisation"
BLR_belarusisation_category_desc: "\n\n\n£GFX_decisions_category_belarusisation\n\n\n\n\n\n Pendant longtemps, la langue et la culture biélorusses ont été opprimées par des occupants étrangers. D'abord, les Polonais ont essayé de nous poloniser dans le cadre de la République des Deux Nations, puis les Russes ont essayé de nous russifier dans le cadre de la Russie, et ensuite les communistes dans le cadre de l'URSS. Et maintenant, ayant enfin obtenu une pleine indépendance, nous devons non seulement préserver l'héritage de notre culture, mais aussi exalter sa gloire passée et chasser les échos de l'assimilation des occupants."
BLR_language_problem: "Question linguistique"
BLR_rename_cities: "Renommer les villes"
BLR_cultural_propaganda: "Propagande culturelle"
BLR_belarusisation_of_population: "Biélorussisation de la population"
BLR_nationalisation_russian_enterprises: "Nationalisation des entreprises @SOVrusses"
BLR_nationalisation_russian_enterprises_desc: "Pendant l'époque de l'influence russe en Biélorussie, trop d'entreprises, de sociétés et d'actifs russes se sont accumulés, menaçant notre souveraineté contre l'impérialisme russe\n§RAVERTISSEMENT :§! Si §Y@SOV[SOV.GetName]§! perd plus de $§R50.00§! milliards de capital, cela peut §Rdéclarer la guerre contre nous§!"
# Événements
belarus_poznyak.1.t: "Réforme du KGB"
belarus_poznyak.1.desc: "Le KGB est un bureau pro-russe qui a longtemps contrôlé la politique de notre pays. Il est temps de détruire cette abomination et de créer un Service de sécurité national souverain de Biélorussie, qui assurera la sécurité de notre pays."
belarus_poznyak.1.a: "Abolir cette horreur"
belarus_poznyak.2.t: "La question de la langue officielle"
belarus_poznyak.2.desc: "Pendant longtemps, la Biélorussie a été sous l'influence de langues étrangères. Que ce soit dans le cadre de la Russie ou de l'État polonais, notre langue a été opprimée et assimilée, et encore aujourd'hui, notre langue meurt sous la pression de la langue russe. Il est temps de résoudre ce problème."
belarus_poznyak.2.a: "Le biélorusse est la seule langue officielle"
belarus_poznyak.2.b: "Interdiction totale de la langue russe"
belarus_poznyak.3.t: "La Biélorussie a nationalisé nos entreprises"
belarus_poznyak.3.desc: "Dans le cadre de la biélorussisation, le nouveau gouvernement biélorusse a nationalisé les entreprises et les actifs de nos sociétés dans le pays. De grandes entreprises russes ont souffert de la nationalisation, telles que : Gazprom, Lukoil, VAZ, Sberbank, MTS, et ainsi de suite."
belarus_poznyak.3.a: "SUKA !"
belarus_poznyak.3.b: "Ils paieront pour ça"
