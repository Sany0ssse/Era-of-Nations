BLR_euroitegration: "Eurointégration"
BLR_euroitegration_desc: " \n\n\n\n£GFX_decisions_category_blr_eurointegration_category\n\n\n\n\n\n\n Après de nombreuses années de dictature, la Biélorussie a enfin trouvé un gouvernement démocratique et civilisé, maintenant notre cap est de nous éloigner des anciens idéaux et de nous aligner sur le monde civilisé. L'intégration européenne est l'adoption des valeurs et des normes des pays européens, l'intégration dans le collectif occidental et l'entrée ultérieure dans l'Union européenne, puis dans l'OTAN. Cependant, notre voisin, qui a longtemps contrôlé notre politique et nié la singularité du peuple biélorusse, ne sera probablement pas satisfait de notre nouveau cap, et donc nous devons être plus prudents avec nos déclarations. Tout vient en son temps, la Biélorussie deviendra certainement une partie de la famille européenne \n\n Nous pourrons rejoindre l'OTAN et l'Union européenne après avoir complété un certain focus, et avoir atteint §G100§! §3Eurointégration§! et §3Intégration OTAN§!. Chacune de nos décisions a des conséquences et avec l'eurointégration, nous augmenterons l'§Oescalade§!. Si l'escalade dépasse §R100§!, cela conduira à une guerre avec [SOV.GetNameWithFlag] \n \n§3Eurointégration actuelle§!: §G[?blr_euroitegration]§! \n§3Intégration OTAN actuelle§!: §G[?blr_natoitegration]§!\n§OEscalade actuelle§!: §R[?blr_escalation]§!"
