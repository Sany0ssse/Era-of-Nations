LAG_nazbols: "République socialiste de Latgale"
# Arbre Lukashenko
# Focus
BLR_Lykashenko: "§YLukashenko§!"
BLR_Lykashenko_desc: "Alexandre Grigorievitch Lukashenko (né le 30 août 1954) est un homme politique, homme d'État et militaire biélorusse. En fait, il occupe le poste de président de la Biélorussie et de commandant en chef des forces armées de Biélorussie depuis le 20 juillet 1994. Il est connu pour ses positions pro-russes. Dans les sociétés biélorusse et russophone, il porte le surnom de « Batka »."
BLR_dai_denyag: "Demander un prêt à la Russie"
BLR_dai_denyag_desc: "Nous demanderons au gouvernement russe de nous accorder un prêt."
BLR_Impact_kgb: "Impact du KGB"
BLR_Impact_kgb_desc: "Le KGB utilise diverses méthodes pour éliminer ceux qui sont mécontents de l'élection du nouveau président."
BLR_Liquidation_pub_assoc: "Liquidation des associations publiques"
BLR_Liquidation_pub_assoc_desc: "Le KGB s'active à liquider ou tente de liquider les associations publiques qui déplaisent à notre président."
BLR_crackdown_opp_rall: "Répression des rassemblements d'opposition"
BLR_crackdown_opp_rall_desc: "Nous dispersons activement les rassemblements de nos adversaires politiques mécontents des élections."
BLR_Increased_censorship: "Renforcer la censure des médias"
BLR_Increased_censorship_desc: "Il est nécessaire de mettre en place une censure stricte des médias pour que nos adversaires ne puissent pas s'agiter contre nous."
BLR_concept_national_security_Belarus: "Concept de sécurité nationale"
BLR_concept_national_security_Belarus_desc: "Ce concept établit un ensemble de vues officielles sur l'essence et le contenu des activités de la République de Biélorussie pour assurer l'équilibre des intérêts de l'individu, de la société et de l'État, ainsi que leur protection contre les menaces internes et externes."
BLR_Economic_development_2001_2005: "Programme de développement socio-économique"
BLR_Economic_development_2001_2005_desc: "Le programme de développement socio-économique de la République de Biélorussie pour 2001-2005, élaboré par le ministère de l'Économie de la République de Biélorussie en collaboration avec d'autres ministères et organes d'administration publique républicaine, les comités exécutifs régionaux et le comité exécutif de la ville de Minsk, avec la participation de l'Académie nationale des sciences, de la Banque nationale, d'instituts de recherche spécialisés et d'organisations publiques, conformément à la loi de la République de Biélorussie « Sur la prévision étatique et les programmes de développement socio-économique de la République de Biélorussie » et aux résolutions du Conseil des ministres de la République de Biélorussie du 2 février 2000 n°141 et du 10 août 2000 n°1248 sur le développement du programme de développement socio-économique de la République de Biélorussie pour 2001-2005."
BLR_reforms_Belarusian_Railway: "Réformes des chemins de fer biélorusses"
BLR_reforms_Belarusian_Railway_desc: "Nos chemins de fer sont dans un état déplorable, nous allons donc mettre en œuvre un ensemble de réformes pour améliorer la situation."
BLR_promise_first_nuclear: "Promesse de construire une centrale nucléaire"
BLR_promise_first_nuclear_desc: "Nous promettons à tous nos citoyens qu'une centrale nucléaire sera construite sur le territoire de notre pays, garantissant ainsi notre sécurité énergétique."
BLR_New_Land_code: "Nouveau code foncier"
BLR_New_Land_code_desc: "Le nouveau code foncier simplifie considérablement l'achat de terres par les propriétaires privés et les entreprises, ce qui plaira certainement à un certain segment de la population."
BLR_gasification_country: "Achèvement de la gazéification du pays"
BLR_gasification_country_desc: "Nous achèverons la gazéification de notre pays, ce que nos citoyens apprécieront certainement."
BLR_Anti_Corruption: "Campagne anti-corruption"
BLR_Anti_Corruption_desc: "Nous devons vaincre la corruption dans notre pays. L'essentiel est de ne pas se retrouver confrontés à nous-mêmes à la fin."
BLR_Punish_Shushkevich: "Punir les proches de Chouchkévitch"
BLR_Punish_Shushkevich_desc: "Chouchkévitch nous a laissé un héritage sous la forme de ses partisans au sein du gouvernement, il est temps de s'en débarrasser."
BLR_Internet_cencorship: "Censure d'Internet"
BLR_Internet_cencorship_desc: "Internet est devenu une plateforme où l'on discute souvent de sentiments visant à renverser le gouvernement, il est nécessaire de contrôler cela."
BLR_reform_kolhoz: "Réformes des fermes collectives"
BLR_reform_kolhoz_desc: "Il est nécessaire de réformer les fermes collectives pour assurer la stabilité de notre agro-industrie."
BLR_Azarenok_case: "L'affaire Igor Azarenok"
BLR_Azarenok_case_desc: "Le général Azarenok est soupçonné d'avoir fait du lobbying pour les intérêts russes en République de Biélorussie, à travers des pots-de-vin et autres fraudes. Devrions-nous y prêter attention ?"
BLR_National_Library: "Nouveau bâtiment de la Bibliothèque nationale"
BLR_National_Library_desc: "Le nouveau bâtiment de la Bibliothèque nationale de Biélorussie, construit avec la participation de tout le pays, a été ouvert aux usagers le 16 juin 2006."
BLR_BRSM: "Union républicaine de la jeunesse biélorusse"
BLR_BRSM_desc: "L'Union républicaine de la jeunesse biélorusse est une association publique de jeunesse en République de Biélorussie. C'est la plus grande association de jeunesse du pays et elle est soutenue par Alexandre Lukashenko. Ses activités sont financées par l'État."
BLR_Potato_Empire: "Empire de la pomme de terre"
BLR_Potato_Empire_desc: "Nous sommes parmi les meilleurs experts mondiaux en pommes de terre. Notre pays devrait en être fier."
BLR_Another_year: "Une autre année d'indépendance"
BLR_Another_year_desc: "La Biélorussie continuera à suivre sa politique indépendante."
BLR_Changes_Customs_policy: "Modification de la politique douanière"
BLR_Changes_Customs_policy_desc: "De nouvelles modifications et restrictions ont été introduites pour compliquer l'importation de produits contrefaits dans notre pays."
BLR_whitelegion_case: "L'affaire de la Légion blanche"
BLR_whitelegion_case_desc: "Nos services spéciaux ont signalé une grande activité des représentants de la Légion blanche, il est nécessaire de les arrêter et de les emprisonner."
BLR_Investing_Agro_industry: "Investissements dans l'agro-industrie"
BLR_Investing_Agro_industry_desc: "L'agro-industrie est une composante importante de l'économie de notre pays, et nous continuerons à augmenter les investissements dans ce secteur."
BLR_fate_belarusian_church: "Le destin de l'Église biélorusse"
BLR_fate_belarusian_church_desc: "Nous devons décider de la voie que suivra notre Église."
BLR_New_concept_security: "Nouveau concept de sécurité nationale"
BLR_New_concept_security_desc: "Notre concept défensif doit être mis à jour, et nous apporterons de nouvelles modifications à notre législation."
BLR_100dney: "100 idées pour la Biélorussie"
BLR_100dney_desc: "Le projet « 100 idées pour la Biélorussie », visant à identifier les jeunes talentueux et doués, à développer leurs activités scientifiques et à promouvoir des développements innovants prometteurs."
BLR_stroiotryad: "Relancer les brigades de construction étudiantes"
BLR_stroiotryad_desc: "Nous relancerons la pratique des brigades de construction étudiantes de l'URSS. Pour les encourager, nous les exempterons d'impôts."
BLR_People_Militia: "Création de la milice populaire"
BLR_People_Militia_desc: "Nous sommes prêts à adopter une loi sur la création d'une milice populaire, qui servira de réserve pour la défense territoriale. Dans chaque village, il devrait y avoir un groupe de personnes entraînées pour contrer l'ennemi, avec une transformation ultérieure en mouvement partisan."
BLR_azarenok_tv: "Nouveau propagandiste de Lukashenko"
BLR_azarenok_tv_desc: "On peut désormais souvent voir à la télévision un nouveau propagandiste qui parle au nom de notre parti et convainc le peuple de la justesse de nos actions."
BLR_Dosaaf: "DOSAAF"
BLR_Dosaaf_desc: "est une organisation paramilitaire biélorusse. Le DOSAAF RB s'inspire de l'organisation soviétique du même nom. Les objectifs de l'organisation sont de promouvoir la préparation des citoyens, d'inculquer une formation militaire aux jeunes Biélorusses, une éducation à la citoyenneté et de fournir une formation pour les tâches et métiers militaires essentiels. En dehors du domaine militaire, le DOSAAF RB propose une éducation sportive et patriotique ainsi que des événements pour d'autres organisations biélorusses."
