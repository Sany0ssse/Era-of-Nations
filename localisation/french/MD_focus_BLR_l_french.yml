# Arbre Nationaliste
# Focus
BLR_young_goi_start: "Jeune Front"
BLR_young_goi_start_desc: "Le Jeune Front est un mouvement d'opposition de jeunesse en Biélorussie, étroitement associé à la branche droite du parti BPF et à la Ligue monarchiste de Biélorussie."
BLR_young_goi_identity: "Racines de notre identité"
BLR_young_goi_identity_desc: "Nous devons enfin décider quelle est l'essence de notre peuple. Vénérons-nous pleinement le passé lituanien, ou soutenons-nous notre propre identité biélorusse ?"
BLR_young_goi_integration_fashiks: "Intégrer les radicaux"
BLR_young_goi_integration_fashiks_desc: "Nous devons inviter la Légion blanche et les organisations Revansch à rejoindre nos rangs et à soutenir notre nouvel État."
BLR_young_goi_lustration: "Lustration des communistes"
BLR_young_goi_lustration_desc: "Nous devons une fois pour toutes détacher l'héritage communiste et soviétique de notre identité et du champ politique actuel."
BLR_young_goi_medicine: "Soutien médical"
BLR_young_goi_medicine_desc: "Nous devons fournir des soins de santé de haut niveau à tous nos citoyens et garantir une nation biélorusse saine et forte !"
BLR_young_goi_new_organs: "Nouvelle structure gouvernementale"
BLR_young_goi_new_organs_desc: "Nous devons réformer notre gouvernement pour le rendre plus proche des puissances occidentales, tout en préparant le système pour le futur monarque."
BLR_young_goi_academy: "Académie militaire de Vilno"
BLR_young_goi_academy_desc: "Nous devons dire adieu à nos généraux soviétiques et créer une nouvelle académie militaire à Vilno, qui formera de véritables commandants militaires patriotes biélorusses."
BLR_young_goi_magdeburg: "Charte des droits de Magdebourg"
BLR_young_goi_magdeburg_desc: "Les droits de Magdebourg étaient un ensemble de privilèges urbains développés pour la première fois par Otton Ier, empereur du Saint-Empire romain, et basés sur la loi flamande, qui régulaient le degré d'autonomie interne des villes et villages accordé par le souverain local."
BLR_magdeburg_rights: "Charte des droits de Magdebourg"
BLR_magdeburg_rights_desc: "Les droits de Magdebourg étaient un ensemble de privilèges urbains développés pour la première fois par Otton Ier, empereur du Saint-Empire romain, et basés sur la loi flamande, qui régulaient le degré d'autonomie interne des villes et villages accordé par le souverain local."
BLR_young_goi_religion: "Retour à notre religion"
BLR_young_goi_religion_desc: "L'heure est venue de nous débarrasser de l'Église moscovite et de revenir à la religion que nous considérons la plus acceptable pour notre nouveau pays."
BLR_young_goi_new_monarch: "Choix d'un nouveau monarque"
BLR_young_goi_new_monarch_desc: "Nous avons bien préparé notre État pour notre nouveau monarque qui régnera sur notre pays pendant des siècles."
BLR_young_goi_territorial_demands: "Revendications territoriales"
BLR_young_goi_territorial_demands_desc: "Il est temps pour notre État de commencer à revendiquer tous les territoires qui appartiennent de droit à notre couronne."
BLR_young_goi_vkl: "Restaurer le Grand-Duché"
BLR_young_goi_vkl_desc: "Grand-Duché de Lituanie"
BLR_young_goi_guard: "Gardes du Grand-Duc"
BLR_young_goi_guard_desc: "La Garde royale de notre Grand-Duc est composée des Ruthéniens les plus loyaux qui se consacrent à la protection du Grand-Duché de Lituanie."
BLR_vkl_guard: "Garde ruthène du Grand-Duc"
BLR_vkl_guard_desc: "La Garde royale de notre Grand-Duc est composée des Ruthéniens les plus loyaux qui se consacrent à la protection du Grand-Duché de Lituanie."
BLR_vkl_guard_two: "Garde ruthène du Grand-Duc"
BLR_vkl_guard_two_desc: "La Garde royale de notre Grand-Duc est composée des Ruthéniens les plus loyaux qui se consacrent à la protection du Grand-Duché de Lituanie."
BLR_young_goi_kurlyandia: "Héritage de Courlande"
BLR_young_goi_kurlyandia_desc: "Nous devons restaurer notre domination sur la Courlande et le territoire letton dans son intégralité."
BLR_young_goi_polish: "Union polono-lituanienne"
BLR_young_goi_polish_desc: "Union polono-lituanienne"
