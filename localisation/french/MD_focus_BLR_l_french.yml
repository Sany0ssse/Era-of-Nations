belarus_economic.1.t: "Effondrement du système économique"
belarus_economic.1.d: "L'ancien système soviétique s'est effondré ! La privatisation a lieu en Biélorussie, les entreprises ferment, et il semble que la Biélorussie s'apprête à vivre ce que la Russie a traversé dans les années 90."
belarus_economic.1.a: "Que Dieu nous sauve"
