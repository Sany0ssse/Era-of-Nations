# Événements (Nazbols)
belarus_nazbol.1.t: "L'insurrection des national-bolcheviques"
belarus_nazbol.1.d: "Les national-bolcheviques biélorusses ont déclenché une insurrection dans l'une des régions de notre pays ! Maudits soient-ils ! Il fallait détruire leur organisation il y a longtemps."
belarus_nazbol.1.a: "Les étouffer"
