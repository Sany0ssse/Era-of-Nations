belarus_liberals.1.t: "Opposition loukashiste"
belarus_liberals.1.desc: "Nous avons enfin arraché le pouvoir des griffes du dictateur, mais les partisans du loukashisme sont toujours présents dans le pays et ils ne sont clairement pas satisfaits du départ de 'Batka'. Les partisans du loukashisme rejettent l'intégration européenne et veulent que la Biélorussie reste entre les mains de l'autoritarisme conservateur."
belarus_liberals.1.a: "Nous devons régler cela rapidement"
belarus_liberals.2.t: "Référendum constitutionnel"
belarus_liberals.2.desc: "Le peuple biélorusse a fait son choix en faveur de l'intégration européenne. Cependant, après les protestations des loukashistes, nous avons sérieusement réfléchi à la question de savoir si nous devons nous éloigner de la Russie et adopter une politique anti-russe ou maintenir des relations amicales."
belarus_liberals.2.a: "Moi, nous, l'Europe"
belarus_liberals.2.b: "Fraternité russo-biélorusse"
belarus_liberals.3.t: "Trahison aux frontières"
belarus_liberals.3.desc: "Avec le début du nouveau régime à Minsk, la Biélorussie s'est de plus en plus éloignée de Moscou, une politique anti-russe, la russophobie et l'influence de l'Occident collectif ont forcé notre ancien frère à commettre une trahison. Nous ne resterons pas simplement à attendre que l'OTAN s'étende à nouveau à nos frontières, nous devons lancer une frappe préventive et éliminer la menace à la frontière."
belarus_liberals.3.a: "Minsk en 3 jours"
belarus_liberals.3.b: "Préparer une opération militaire spéciale"
belarus_liberals.4.t: "La Biélorussie veut discuter de l'adhésion à l'UE"
belarus_liberals.4.desc: "La Biélorussie souhaite discuter avec nous des conditions sous lesquelles nous ne serons pas opposés à son adhésion à l'Union européenne, ce qui est bien sûr très aimable de leur part. Nous avons répété à maintes reprises que l'Union européenne ne représente pas une menace pour nous, contrairement à l'OTAN, et par conséquent, ces questions ne peuvent être discutées que dans le contexte d'un statut neutre pour la Biélorussie."
belarus_liberals.4.a: "Statut neutre et garanties de non-agression"
belarus_liberals.4.b: "Nous sommes prêts à défendre personnellement le statut neutre de la Biélorussie"
belarus_liberals.4.c: "Zone démilitarisée entre nos frontières"
