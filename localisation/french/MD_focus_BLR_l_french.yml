BLR_azot_fertilizers_idea: "Accès aux engrais chimiques"
BLR_azot_fertilizers_idea_desc: "Les engrais chimiques sont essentiels pour une bonne récolte, surtout dans un climat difficile."
BLR_azot_fertilizers_income: "Engrais GrodnoAzot"
BLR_azot_fertilizers_income_desc: "Grodno Azot vend avec succès ses produits à de nombreux pays du monde et apporte à notre pays un bon revenu grâce aux ventes."
