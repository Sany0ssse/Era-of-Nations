GENERIC_21century_start_idea: "Le nouveau millénaire"
GENERIC_21century_start_idea_desc: "Le nouveau millénaire a apporté paix et prospérité à notre planète, et maintenant que le monde n'est plus menacé par une guerre entre deux superpuissances, nous pouvons enfin concentrer nos efforts sur l'amélioration du bien-être de l'humanité."
GENERIC_terorrist_war_idea: "La guerre contre le terrorisme"
GENERIC_terorrist_war_idea_desc: "L'idylle du nouveau millénaire n'a pas duré longtemps, car un nouvel ennemi, le terrorisme international, a commencé à menacer l'humanité. Ce n'est plus une menace locale, mais un danger potentiel pour tous les pays développés."
GENERIC_local_conflicts_idea: "Guerres locales"
GENERIC_local_conflicts_idea_desc: "Le terrorisme a peut-être été vaincu, mais la nature humaine maintient le monde en alerte. Désormais, les puissances cherchent clairement à redessiner la carte du monde, un chemin dangereux qui pourrait nous mener à un nouveau conflit."
GENERIC_global_war_idea: "La guerre mondiale"
GENERIC_global_war_idea_desc: "Tous les efforts pour résoudre les problèmes pacifiquement ont échoué, et le monde est finalement revenu à la résolution des problèmes par l'ancienne méthode de la guerre."
