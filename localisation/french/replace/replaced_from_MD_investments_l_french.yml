l_french:
available_internal_investments_tt: "Toutes les nations disposeront d'un minimum de deux emplacements disponibles qu'elles peuvent utiliser pour n'importe lequel de leurs États à travers tout le pays. Vous pouvez choisir de réaliser plusieurs projets dans un seul État ou de répartir les projets à travers le pays. Vous pouvez obtenir des emplacements supplémentaires en augmentant le §YRang de puissance§! de votre nation.\n\nProjets en cours :\n[ROOT.state_owned_investment_timer_seven][ROOT.state_owned_investment_timer_six][ROOT.state_owned_investment_timer_five][ROOT.state_owned_investment_timer_four][ROOT.state_owned_investment_timer_three][ROOT.state_owned_investment_timer_two][ROOT.state_owned_investment_timer_one]"
encourage_productivity_in_state_click_tt: "Pendant 120 jours, la §YCroissance de la productivité§! dans §Y[THIS.GetName]§! sera §Y25%§! plus rapide."
block_future_expand_local_building_capacity: "Nous pouvons §YÉlargir la capacité de construction locale§! dans §Y[THIS.GetName]§! (Nombre d'expansions de la capacité de construction : §Y[?expanded_building_slot_times]/5§!)"
expand_local_building_capacity_click_tt: "Tous les 120 jours, nous pouvons gagner §G2§! §YEmplacements de construction§! dans §Y[THIS.GetName]§!.\nL'expansion dans les États peu peuplés sera §Gmoins coûteuse§!, tandis que dans les régions densément peuplées, elle sera plus §Rcoûteuse§!.\nNombre actuel d'expansions des §YEmplacements de construction§! dans un État donné : §Y[?expanded_building_slot_times]/5§!."
