CORPORATE_INCOME_TAXES_TOOLTIP: "Revenus des taxes sur les entreprises :\n$[?agriculture_district_tax|+3] de §YDistricts agricoles commercialisés§!\n$[?agriculture_tax_gain|+3] de §YAgriculture de subsistance§!\n$[?civil_fac_tax|+3] de §YIndustries civiles§!\n$[?military_fac_tax|+3] de §YIndustries militaires§!\n$[?dockyard_tax|+3] de §YChantiers navals§!\n$[?rub_ref_tax|+3] de §YRaffineries de caoutchouc§!\n$[?office_tax|+3] de §YSecteurs de bureaux§!"
CORPORATE_INCOME_TAXES_TOOLTIP_DELAYED: "Les taxes sur les entreprises sont les impôts que nous prélevons sur les entreprises opérant dans notre pays. Cela inclut, par exemple, la TVA, les taxes foncières et, bien sûr, les taxes sur les bénéfices. Le montant des taxes dépend du nombre de §YIndustries civiles§!, §YIndustries militaires§!, §YChantiers navals§!, §YRaffineries de caoutchouc§!, §YSecteurs de bureaux§! et §YDistricts agricoles commercialisés§! que notre pays possède, ainsi que de notre §YTaux de taxation des entreprises§!. Les §Yrevenus des entreprises§! sont principalement influencés par notre §YCycle économique§! et notre §YNiveau de corruption§!. Les revenus peuvent également être modifiés par diverses idées.\n\nLes taxes sur les entreprises déterminent notre §YCoût fiscal§! (le nombre d'§YIndustries civiles§! non disponibles pour la construction) et influencent également le montant que les autres pays doivent payer pour investir dans nos États.\n\nImpact des lois, idées et technologies sur §YTous les revenus fiscaux§! : [?tax_gain_multiplier_display|+%0]\nImpact des lois, idées et technologies sur §YRevenus fiscaux des entreprises§! : [?modifier@corporate_tax_income_multiplier_modifier|+%0]\nImpact de la productivité sur §YRevenus fiscaux des entreprises§! : [?productivity_tax_effect_display|+%]\nImpact des lois, idées et technologies sur §YRevenus fiscaux des secteurs de bureaux§! : [?modifier@office_park_income_tax_modifier|+%0]\nImpact des lois, idées et technologies sur §YRevenus fiscaux des chantiers navals§! : [?modifier@dockyard_income_tax_modifier|+%0]\nImpact des lois, idées et technologies sur §YRevenus fiscaux des industries civiles§! : [?modifier@civilian_industry_tax_modifier|+%0]\nImpact des lois, idées et technologies sur §YRevenus fiscaux des industries militaires§! : [?modifier@military_industry_tax_modifier|+%0]\nImpact des lois, idées et technologies sur §YRevenus fiscaux des raffineries de caoutchouc§! : [?modifier@rub_ref_income_tax_modifier|+%0]\nImpact des lois, idées et technologies sur §YRevenus fiscaux des districts agricoles commercialisés§! : [?modifier@agriculture_district_income_tax_modifier|+%0]\n"
