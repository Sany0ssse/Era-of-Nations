EMPLOYMENT_TOOLTIP_DELAYED: "Main-d'œuvre totale : §Y[?ROOT.workforce_total_display]§!\nPart de la population dans la main-d'œuvre : §Y[?ROOT.workforce_total_percentage_display|%]§!\n\nMillions de travailleurs par secteur :\n§GUsines militaires§! : [?ROOT.workers_in_mil_facs|3]\n§BChantiers navals§! : [?ROOT.workers_in_dockyards|3]\n§OUsines civiles§! : [?ROOT.workers_in_civ_facs|3]\n§CBureaux§! : [?ROOT.workers_in_offices|3]\n§BRaffineries de caoutchouc§! : [?ROOT.workers_in_rub_ref|3]\n§GAgriculture non commercialisée§! : [?ROOT.agriculture_workers|3]\n§CExtraction de ressources§! : [?ROOT.resource_sector_workers|3]\n§YDistricts agricoles commercialisés§! : [?ROOT.workers_in_agriculture_district|3]\n§RChômeurs et subsistance§! : [?ROOT.total_unemployed|3]\n\nChômage actuel : §R[?ROOT.total_unemployed_percentage_display|%]§!\n\n§YSeuil de chômage élevé :§! [?ROOT.unemployment_threshold_display_var|%0]\n\n§YModificateurs du chômage élevé§!\n£stability_texticon Stabilité : [?ROOT.high_unemployment_modifier_var|%+]\n£social_cost_multiplier_modifier_texticon §YCoût des dépenses sociales§! Multiplicateur : [?ROOT.high_unemployment_modifier_var_2|%-]"
EMPLOYMENT_AVERAGE_TT_DELAYED: "§YSatisfaction des travailleurs§! est la valeur qui représente le nombre de travailleurs employés dans votre pays par rapport à ce qui est requis par vos bâtiments.\n\n§YSatisfaction moyenne des travailleurs :§! [?ROOT.average_worker_fulfillment|%0]\n\n§YSatisfaction des travailleurs par bâtiment :§!\nUsines civiles : §Y[?ROOT.civilian_factories_manpower_fulfillment|%]§!\nUsines militaires : §Y[?ROOT.military_factories_manpower_fulfillment|%]§!\nChantiers navals : §Y[?ROOT.naval_factories_manpower_fulfillment|%]§!\nBureaux : §Y[?ROOT.offices_manpower_fulfillment|%]§!\nRaffineries de caoutchouc : §Y[?ROOT.rub_ref_manpower_fulfillment|%]§!\nDistricts agricoles commercialisés : §Y[?ROOT.agriculture_district_manpower_fulfillment|%]§!\n"
military_factory_employment_button_delayed_tt: "Lorsque nous avons plus d'emplois que de travailleurs, il peut être bénéfique dans certaines situations d'augmenter ou de diminuer le nombre de travailleurs alloués à chaque secteur (usines/bureaux) pour permettre à plus de travailleurs d'aller dans d'autres secteurs.\n\n£click_left §YClic gauche§! pour augmenter le niveau d'emploi des usines militaires.\n£click_right §YClic droit§! pour le diminuer.\n\nNiveau d'emploi cible actuel : §Y[?ROOT.military_factory_employment_var|%]§!"
civilian_factory_employment_button_delayed_tt: "Lorsque nous avons plus d'emplois que de travailleurs, il peut être bénéfique dans certaines situations d'augmenter ou de diminuer le nombre de travailleurs alloués à chaque secteur (usines/bureaux) pour permettre à plus de travailleurs d'aller dans d'autres secteurs.\n\n£click_left §YClic gauche§! pour augmenter le niveau d'emploi des usines civiles.\n£click_right §YClic droit§! pour le diminuer.\n\nNiveau d'emploi cible actuel : §Y[?ROOT.civilian_factory_employment_var|%]§!"
naval_factory_employment_button_delayed_tt: "Lorsque nous avons plus d'emplois que de travailleurs, il peut être bénéfique dans certaines situations d'augmenter ou de diminuer le nombre de travailleurs alloués à chaque secteur (usines/bureaux) pour permettre à plus de travailleurs d'aller dans d'autres secteurs.\n\n£click_left §YClic gauche§! pour augmenter le niveau d'emploi des chantiers navals.\n£click_right §YClic droit§! pour le diminuer.\n\nNiveau d'emploi cible actuel : §Y[?ROOT.naval_factory_employment_var|%]§!"
office_employment_button_delayed_tt: "Lorsque nous avons plus d'emplois que de travailleurs, il peut être bénéfique dans certaines situations d'augmenter ou de diminuer le nombre de travailleurs alloués à chaque secteur (usines/bureaux) pour permettre à plus de travailleurs d'aller dans d'autres secteurs.\n\n£click_left §YClic gauche§! pour augmenter le niveau d'emploi des bureaux.\n£click_right §YClic droit§! pour le diminuer.\n\nNiveau d'emploi cible actuel : §Y[?ROOT.office_employment_var|%]§!"
ag_district_employment_button_delayed_tt: "Lorsque nous avons plus d'emplois que de travailleurs, il peut être bénéfique dans certaines situations d'augmenter ou de diminuer le nombre de travailleurs alloués à chaque secteur (usines/bureaux) pour permettre à plus de travailleurs d'aller dans d'autres secteurs.\n\n£click_left §YClic gauche§! pour augmenter le niveau d'emploi des districts agricoles commercialisés.\n£click_right §YClic droit§! pour le diminuer.\n\nNiveau d'emploi cible actuel : §Y[?ROOT.agriculture_district_employment_var|%]§!"
POPULATION_TAX_RATE_TT: "Le taux d'imposition de la population inclut toutes les taxes imposées au public. Cela peut inclure, sans s'y limiter, l'impôt sur le revenu, les taxes sur la valeur ajoutée, la taxe sur les ventes et les impôts fonciers.\n\n§YModificateurs des taxes sur la population :§!\n£stability_texticon Stabilité : [?stability_factor_from_population_tax|%+] \n£social_cost_multiplier_modifier_texticon §YCoût des dépenses sociales§! Multiplicateur : [?law_spending_from_population_tax|%-] \n£health_cost_multiplier_modifier_texticon §YCoût de la santé§! Multiplicateur : [?law_spending_from_population_tax|%-] \n"