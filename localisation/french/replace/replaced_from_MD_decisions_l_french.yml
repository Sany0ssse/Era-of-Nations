l_french:
### Public War Weariness ###
war_wariness_decision_category: "Actions en temps de guerre"
war_wariness_decision_category_desc: "\n£MAIN_desctext_weariness\n\n\n\nNotre pays est maintenant en guerre. Les problèmes qui accompagnent les conflits sont désormais d'une importance cruciale. La manière la plus efficace de gagner une guerre est de maintenir le soutien du peuple. Une fois que le peuple perd son soutien pour un conflit, nous avons déjà perdu.\n\nLoi martiale - nécessite des décisions opportunes et réfléchies de la part de l'État. Nous pouvons procéder à une mobilisation partielle ou totale, mais je ne pense pas que la population appréciera notre décision. Après la fin de la guerre, une période de démobilisation obligatoire d'un an suit, pendant laquelle, même si nous commençons une nouvelle guerre, nous ne pourrons pas lancer une nouvelle mobilisation. Si nous menons une guerre défensive, nous pouvons demander l'aide des grandes puissances.\n\n§YNote : Le peuple n'apprécie pas les guerres longues. Plus la guerre est décisive, moins elle est pénalisante.§!\nPénalité actuelle de soutien à la guerre : [?war_support_factor_var|R0%]\n"
AB_war_support_campaigns: "Campagne de soutien à la guerre"
AB_war_support_campaigns_desc: "Le peuple perd confiance en notre gouvernement et commence à ne plus soutenir la guerre. Donnons-leur une motivation supplémentaire."
AB_promises_of_peace: "Promesses de paix"
AB_promises_of_peace_desc: "La guerre pèse lourdement sur le peuple. Nous devrions commencer à organiser des campagnes pour discuter du potentiel de paix."
AB_partial_mobilization: "Lancer la §RMobilisation partielle§!"
AB_full_mobilization: "Lancer la §RMobilisation totale§!"
AB_raise_militia: "Lever la milice"
AB_open_foreign_aid_panel: "Ouvrir le panneau de §YAide étrangère§!"
AB_ask_foreign_support: "Demander une §YAide étrangère§! à [FROM.GetNameWithFlag]"
AB_close_foreign_aid_panel: "Fermer le panneau de §YAide étrangère§!"

AB_mobilization.1.t: "Début de la mobilisation partielle"
AB_mobilization.1.desc: "La mobilisation partielle a commencé dans le pays, certains réservistes de la population soumise à l'obligation militaire ont été convoqués dans les centres de recrutement et envoyés sur les terrains d'entraînement pour une formation accélérée. Une petite partie de l'industrie a été transférée sur des rails militaires, les usines militaires fonctionnent plus rapidement."
AB_mobilization.1.a: "C'est une mesure nécessaire"

AB_mobilization.2.t: "Début de la mobilisation totale"
AB_mobilization.2.desc: "Le pays a entamé une mobilisation totale, la loi martiale a été déclarée, tous les hommes capables de porter une arme ont reçu une convocation au centre de recrutement et sont envoyés sur le terrain d'entraînement pour une formation accélérée. La majeure partie de l'industrie passe en mode guerre, les usines produisant des biens militaires travaillent à un rythme accéléré jour et nuit sans interruption."
AB_mobilization.2.a: "PAS UN PAS EN ARRIÈRE !"

AB_mobilization.3.t: "Les troupes de la milice sont prêtes"
AB_mobilization.3.desc: "Des personnes souhaitant aller au front mais incapables de le faire dans différentes parties du pays ont commencé à se rassembler dans les troupes de milice. Elles sont impatientes de se rendre au front pour défendre les intérêts de notre État côte à côte avec les soldats. Le pays ne les oubliera jamais, vive [ROOT.GetName] !"
AB_mobilization.3.a: "C'est ça le patriotisme"

AB_mobilization.4.t: "[FROM.GetName] nous demande de l'aide"
AB_mobilization.4.desc: "[FROM.GetName] s'est tourné vers nous pour obtenir de l'aide dans une guerre pour leur souveraineté et leur droit à exister. [FROM.GetName], englouti dans les flammes de la guerre, lutte pour le droit d'exister librement et a besoin d'un soutien extérieur, devons-nous les aider ?"
AB_mobilization.4.a: "Envoyer des casques bleus"
AB_mobilization.4.b: "Les armer jusqu'aux dents"
AB_mobilization.4.c: "Leur envoyer de l'argent"
AB_mobilization.4.d: "Ce n'est pas dans nos intérêts"

AB_mobilization.5.t: "Les casques bleus [FROM.GetAdjective] sont arrivés"
AB_mobilization.5.desc: "Les casques bleus de [FROM.GetName] sont arrivés dans notre pays et sont prêts à nous aider dans la guerre pour notre liberté. Nous sommes très reconnaissants envers nos amis [FROM.GetAdjective] et espérons que ce geste marquera le début d'une nouvelle coopération après la guerre."
AB_mobilization.5.a: "Très bien !"

AB_mobilization.6.t: "[FROM.GetName] envoie une aide militaire"
AB_mobilization.6.desc: "[FROM.GetName] nous a envoyé une aide militaire, ces énormes caisses d'armes, de chars, de missiles nous aideront clairement à gagner. Nous sommes très reconnaissants envers nos amis [FROM.GetAdjective] et espérons que ce geste marquera le début d'une nouvelle coopération après la guerre."
AB_mobilization.6.a: "TANT D'ARMES !"

AB_mobilization.7.t: "[FROM.GetName] envoie de l'argent"
AB_mobilization.7.desc: "[FROM.GetName] nous a envoyé de l'argent, en temps de guerre, l'économie est dans une situation particulièrement difficile, donc même une telle aide est très demandée pour nous. Nous sommes très reconnaissants envers nos amis [FROM.GetAdjective] et espérons que ce geste marquera le début d'une nouvelle coopération après la guerre."
AB_mobilization.7.a: "Donnez-moi votre argent"

AB_mobilization.8.t: "[FROM.GetName] a refusé de nous aider"
AB_mobilization.8.desc: "[FROM.GetName] a refusé de nous aider, disant que ce n'est pas dans leurs intérêts, peut-être est-ce vrai et devrions-nous chercher de l'aide ailleurs."
AB_mobilization.8.a: "Nous nous en souviendrons"

full_mobilization_is_underway: "La mobilisation totale a commencé"
AB_partial_mobilization_idea: "Mobilisation §OPartielle§!"
AB_full_mobilization_idea: "Mobilisation §RTotale§!"
AB_demobilization: "Démobilisation"
AB_militia_has_been_raised_idea: "La milice a été levée"
AB_foreign_peacekeepers: "Casques bleus étrangers"
AB_recent_mobilization_idea: "Mobilisation récente"
