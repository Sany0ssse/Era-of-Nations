TOTAL_CONSUMPTION_ENERGY_TT: "Les valeurs suivantes constituent la répartition complète de la consommation d'énergie.\n----------\nConsommation d'énergie §Yde la population§! : [?population_energy_use_display_var|R2] GW\nConsommation d'énergie §Ytotale des bâtiments§! : [?energy_use_buildings_total_display_var|R2] GW\nConsommation d'énergie des §Yventes d'énergie§! : [?all_sell_energy_use_display_var|R2] GW\nConsommation d'énergie §Yautre§! : [?other_energy_use_display_var|R2] GW\n----------\n§YConsommation d'énergie des bâtiments par type :§!\nConsommation d'énergie des §Yusines civiles§! : [?energy_use_civs_total_display_var|R2] GW\nConsommation d'énergie des §Ybureaux§! : [?energy_use_offices_total_display_var|R2] GW\nConsommation d'énergie des §Yusines militaires et chantiers navals§! : [?energy_use_mils_total_display_var|R2] GW\nConsommation d'énergie des §Yraffineries de caoutchouc§! : [?energy_use_rub_ref_total_display_var|R2] GW\nConsommation d'énergie des §Ydistricts agricoles commercialisés§! : [?energy_use_agriculture_district_total_display_var|R2] GW\n\n"

TOTAL_CONSUMPTION_ENERGY_DELAYED_TT: "§YModificateurs§! :\nImpact des lois, idées et technologies sur la §Yconsommation d'énergie totale§! : [?modifier@energy_use_multiplier|-%]\nImpact des lois, idées et technologies sur la §Yconsommation d'énergie de la population§! : [?modifier@pop_energy_use_multiplier|-%]\nImpact des lois, idées et technologies sur la §Yconsommation d'énergie des usines civiles§! : [?modifier@energy_use_modifier_civs|-%]\nImpact des lois, idées et technologies sur la §Yconsommation d'énergie des parcs de bureaux§! : [?modifier@energy_use_modifier_offices|-%]\nImpact des lois, idées et technologies sur la §Yconsommation d'énergie des usines militaires et chantiers navals§! : [?modifier@energy_use_modifier_mils|-%]\nImpact des lois, idées et technologies sur la §Yconsommation d'énergie des raffineries de caoutchouc§! : [?modifier@energy_use_modifier_rub_ref|-%]\nImpact des lois, idées et technologies sur la §Yconsommation d'énergie des districts agricoles commercialisés§! : [?modifier@energy_use_modifier_agriculture_district|-%]\n"

ENERGY_GENERATION_TOTAL_TT: "Les valeurs suivantes constituent la répartition complète des sources de production d'énergie. Les §Ycentrales à combustibles fossiles§! seront en veille si vous produisez plus d'énergie que vous n'en consommez. Les §Ycentrales à combustibles fossiles en veille§! ne consomment pas de §Ycarburant§!.\n----------\nProduction d'énergie des §Ycombustibles fossiles§! : [?fossil_pp_energy_generation|G2] GW\nProduction d'énergie des §Ycentrales à combustibles fossiles inactives§! : [?free_fossil_powerplants_power|Y2] GW\nProduction d'énergie §Yhydroélectrique§! : [?hydroelectric_energy_generation|G2] GW\nProduction d'énergie §Ygéothermique§! : [?geothermal_energy_generation|G2] GW\nProduction d'énergie §Ynucléaire§! : [?nuclear_energy_generation|G2] GW\nProduction d'énergie §Ysolaire et éolienne§! : [?renewable_energy_display_var|G2] GW\nProduction d'énergie des §Yachats d'énergie§! : [?all_buy_energy_generation_display_var|G2] GW\nProduction d'énergie des §Yautres sources§! : [?other_energy_generation|G2] GW\n§YRetrait de l'énergie stockée§! : [?energy_withdrawal_from_storage|G2] GW\n\n----------\nProduction potentielle d'énergie §Ysolaire et éolienne§! : [?minimum_renewable_energy_var|+2] GW à [?maximum_renewable_energy_var|+2] GW"