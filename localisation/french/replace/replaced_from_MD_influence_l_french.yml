double_more_gdp_than_them_tt: "Notre PIB doit être deux fois supérieur au leur"
### Economic Stuff ###
influence.1.d: "Nous avons décidé de commencer à élaborer un paquet d'aide économique. Nous pouvons choisir d'envoyer 5, 15 ou 35 milliards en aide. Cette générosité améliorera les relations et nous accordera de l'influence dans [FROM.GetName], bien qu'il n'y ait aucune garantie qu'ils utiliseront l'aide économique pour quelque chose de valeur. Plus nous donnons, plus nous gagnerons d'influence.\n\n"
influence.1.a: "Envoyer 5 milliards en aide économique."
influence.1.b: "Envoyer 15 milliards en aide économique."
influence.1.c: "Envoyer 35 milliards en aide économique."
aid_button_TT: "§HDonner une aide économique§!\nNous enverrons un don monétaire unique à §H[FROM.GetNameWithFlag]§! en échange d'une influence et d'une amélioration des relations. Le don s'élève à §Y5§!, §Y15§! ou §Y35§! milliards du Trésor §H[FROM.GetAdjective]§!.\n\nSi l'IA est en bonne position, elle refusera l'aide.\n"
aid_military_button_TT: "§HAide militaire§!\nNous pouvons choisir d'envoyer un envoi unique d'armes, d'équipements lourds, de drones et de missiles ou de fournir des services militaires tels que la logistique, le renseignement et une brigade de mercenaires à §H[FROM.GetNameWithFlag]§! en échange d'une influence et d'une amélioration des relations. Cependant, cela aura un impact négatif sur notre position avec leurs ennemis. Vous pouvez envoyer une aide militaire une fois tous les soixante jours.\n\n§RVous pouvez envoyer une brigade de mercenaires si vous jouez en tant que réactionnaires ou nationalistes§!"
economic_exploitation_button_TT: "§HExploitation économique§!\nUtilisera une partie de notre influence pour exploiter l'économie de §H[FROM.GetNameWithFlag]§!. Cela vous donnera une §GIndustrie gratuite§! ou un §GAccès au Trésor§! §R(Si le pays est une marionnette)§!, §Wmais cela nuira à votre relation.§!\n\nNOTE : Vous pouvez exploiter un pays §RUne fois tous les 182 jours§!. Choisissez votre option d'exploitation judicieusement."
foreign_interference_in_our_politics_dem_idea: "Influence étrangère sur notre politique"
foreign_interference_in_our_politics_nat_idea: "Influence étrangère sur notre politique"
