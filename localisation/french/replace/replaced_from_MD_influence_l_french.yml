foreign_interference_in_our_politics_salad_idea: "Influence étrangère sur notre politique"
influence_higher_80_tt: "§H[ROOT.GetNameWithFlag]§! a plus de 80 % d'influence"
influence_less_50_tt: "a moins de 50 % d'influence"
influence_less_80_tt: "a moins de 80 % d'influence"
