l_efrench:
 # NATO Decisions
NATO_decisions: "Adhésion à l'OTAN"
NATO_decisions_desc: "\n£MAIN_desctext_nato\n\n\n\n§YL'OTAN§!, ou §YOrganisation du Traité de l'Atlantique Nord§!, est une alliance militaire entre plusieurs pays d'Amérique du Nord et d'Europe. §YL'OTAN§! constitue un système de défense collective où ses États membres indépendants s'engagent à une défense mutuelle en réponse à une attaque par une partie extérieure.\nTout pays européen pouvant répondre aux exigences et aux normes de l'alliance peut rejoindre l'OTAN. Il y a quatre étapes pour rejoindre l'alliance. La première étape est d'obtenir le statut de §YPfP§! (Partenariat pour la paix), la deuxième étape est la ratification par tous les membres et l'obtention du statut §YIPAP§! (Plan d'action individuel de partenariat), la troisième étape est d'obtenir le statut §YDialogue accéléré§! et enfin, la quatrième étape est la ratification par tous les membres et l'adhésion à l'§YOrganisation du Traité de l'Atlantique Nord§!."
leave_NATO: "§YQuitter§! l'OTAN"
leave_NATO_desc: "Nous n'avons plus d'intérêt à faire partie de l'OTAN."
denounce_Status_As_Major_Non_NATO_Ally: "§YRenoncer§! au statut d'allié majeur non membre de l'OTAN"
denounce_Status_As_Major_Non_NATO_Ally_desc: "Nous n'avons plus d'intérêt à être affiliés à l'alliance de l'OTAN."
become_NATO_aspirant: "§YDevenir§! un pays aspirant à l'OTAN"
become_NATO_aspirant_desc: "Les pays aspirants à l'OTAN sont des États qui ont manifesté leur intérêt à devenir membres de l'OTAN. Après avoir montré notre intérêt pour l'OTAN, nous recevrons un Plan d'action pour l'adhésion, qui nous donnera des objectifs à atteindre avant de pouvoir rejoindre l'alliance. Une fois ces objectifs atteints, nous pourrons entamer des négociations d'adhésion, ce qui nécessitera l'approbation de tous les membres actuels de l'OTAN."
finish_NATO_membership_action_plan: "§YCompléter§! le Plan d'action pour l'adhésion"
finish_NATO_membership_action_plan_desc: "En complétant le Plan d'action pour l'adhésion imposé par l'OTAN, nous pouvons commencer les négociations d'adhésion avec les membres existants. Chaque membre actuel de l'OTAN doit approuver notre candidature. Notre statut restera celui de candidat à l'OTAN jusqu'à ce que tous les membres aient approuvé notre candidature."
ratify_country_accession: "§YRatifier l'adhésion de [From.GetName]§! à l'OTAN"
ratify_country_accession_desc: "[From.GetName] a terminé son Plan d'action pour l'adhésion. Il ne reste plus qu'à nous, ainsi qu'aux autres membres de l'OTAN, de ratifier leur adhésion, après quoi ils deviendront un membre à part entière de l'OTAN."
join_NATO: "§YRejoindre§! l'OTAN"
join_NATO_desc: "Tous les autres membres de l'OTAN ont ratifié notre adhésion à l'OTAN. Nous pouvons maintenant devenir un membre à part entière de l'alliance."
show_non_ratified_countries: "§YAfficher§! les pays non ratifiés"
show_non_ratified_countries_desc: "Ici, vous pouvez voir une liste des pays qui n'ont pas encore ratifié notre adhésion. Vous pouvez inciter les pays à ratifier votre adhésion en améliorant vos relations avec eux."
call_nato_to_arms: "§YAppeler§! l'OTAN aux armes !"
call_nato_to_arms_desc: "Nous sommes attaqués par une puissance étrangère. Nous pouvons maintenant invoquer l'article 5 du traité de l'OTAN, ce qui signifie que nos alliés doivent venir à notre défense."
nato_enhance_forward_presence_brigade: "§YDéployer§! la brigade E de l'OTAN"
nato_enhance_forward_presence_brigade_desc: "La récente crise en Crimée a placé les États-Unis dans une position délicate. Le déploiement de la brigade E devrait aider à dissuader toute nouvelle agression de la part des Russes."
nato_deploy_turkish_brigade: "§YDéployer§! la brigade S de l'OTAN"
nato_deploy_turkish_brigade_desc: "La Turquie continue de réaffirmer son engagement envers l'OTAN. Nous devrions montrer notre gratitude en déployant une nouvelle brigade dans la région."
NATO_apply_to_become_major_non_nato_ally: "Demander le statut d'allié majeur non membre de l'OTAN"
NATO_apply_to_become_major_non_nato_ally_desc: "Nos relations extrêmement positives avec les membres de l'OTAN, et en particulier avec le leader de la faction, nous offrent une opportunité unique de demander le statut d'allié majeur non membre de l'OTAN, en fonction de notre situation actuelle."

RULE_CANT_LEAVE_NATO: "§RNous ne pouvons pas quitter l'OTAN lorsque nous sommes attaqués !§!"
RULE_CANT_KICK_OUT_OF_NATO: "§RNous ne pouvons pas expulser des pays de l'OTAN !§!"
RULE_CANT_ASSUME_LEADERSHIP_OF_NATO: "§RLe leadership de l'OTAN en temps de guerre est verrouillé au leader initial !§!"

nato_join_Nato_Nuclear_Sharing: "Rejoindre le partage nucléaire"
nato_join_Nato_Nuclear_Sharing_desc: "Le partage nucléaire est un concept de la politique de dissuasion nucléaire de l'OTAN, qui permet à tous les pays membres dépourvus d'armes nucléaires propres de participer à la planification de l'utilisation des armes nucléaires par l'OTAN. Nous devrions rejoindre ce programme pour assurer la sécurité de notre nation."
Nato_Nuclear_Sharing: "Demander l'accès aux armes nucléaires"
Nato_Nuclear_Sharing_desc: "Les tensions montent, nous devons obtenir des armes nucléaires pour défendre notre pays et nos alliés."
nato_leave_Nato_Nuclear_Sharing: "Quitter le groupe de partage nucléaire"
nato_leave_Nato_Nuclear_Sharing_desc: "Nous ne voulons plus faire partie du groupe de partage nucléaire. Nous devons débarrasser notre nation de toutes les armes étrangères stockées ici."
Nato_Nuclear_Sharing_I_TT: "Nous obtenons l'accès à 20 §Yogives nucléaires de 45 kt§! fabriquées par §Y[USA.GetNameWithFlag]§! et à §Y20 ALGM§! pour §Y365 jours§!\n"

# NATO Events
NATO.1.t: "[From.GetNameDef] et l'OTAN"
NATO.1.d: "[From.GetNameDef] est membre de l'OTAN. Si nous lui déclarons la guerre, ils auront la possibilité d'appeler les autres membres de l'OTAN dans le conflit. Cela signifie qu'il est très probable que nous finissions en guerre avec la majorité des membres de l'OTAN."
NATO.1.a: "Noté"
NATO.2.t: "Appeler l'OTAN aux armes ?"
NATO.2.d: "Nous avons été attaqués par une puissance étrangère. En tant que membre de l'OTAN, nous pouvons invoquer l'article 5 du traité, ce qui obligerait les autres pays de l'OTAN à nous assister."
NATO.2.a: "Appeler l'OTAN"
NATO.2.b: "Nous pouvons gérer cela"
NATO.3.t: "[From.GetNameDef] appelle à l'aide !"
NATO.3.d: "[From.GetNameDef] a été attaqué par un autre pays, et ils ont invoqué l'article 5 de l'OTAN. Cela signifie que nous devons les aider dans leur guerre."
NATO.3.a: "Nous devons aider nos alliés !"
NATO.3.b: "Peut-être rester en dehors ?"
NATO.4.t: "Démobilisation de l'OTAN"
NATO.4.d: "Maintenant que la menace contre un membre de l'OTAN a été traitée, l'alliance militaire entre ces pays peut être dissoute. L'OTAN se mobilisera à nouveau si un autre membre est attaqué."
NATO.4.a: "D'accord"
NATO.5.t: "L'OTAN se démobilise"
NATO.5.d: "Maintenant que la menace contre l'État membre de l'OTAN a été traitée, l'alliance militaire entre ces pays peut être dissoute. L'OTAN se mobilisera à nouveau si un autre membre est attaqué."
NATO.5.a: "D'accord"
NATO.6.t: "[From.GetNameDef] quitte l'OTAN"
NATO.6.d: "Le gouvernement de [From.GetNameDef] a annoncé qu'il quittera l'OTAN. Ils ont déclaré que l'alliance ne répond plus à leurs besoins et qu'ils ne se sentent plus à l'aise de travailler avec leurs anciens alliés."
NATO.6.a: "Intéressant"
NATO.7.t: "[From.GetNameDef] cherche à rejoindre l'OTAN"
NATO.7.d: "[From.GetNameDef] a manifesté son intérêt à devenir membre de l'OTAN. Ils recevront un Plan d'action pour l'adhésion, après quoi ils devront obtenir l'approbation de tous les membres actuels de l'OTAN pour devenir un nouveau membre."
NATO.7.a: "Nouveaux alliés ?"
NATO.8.t: "[From.GetNameDef] rejoint l'OTAN"
NATO.8.d: "[From.GetNameDef] a été accepté pour rejoindre l'OTAN. Ils font désormais partie de l'alliance militaire, et ils s'engageront à défendre leurs alliés, tandis que leurs nouveaux alliés sont prêts à les défendre."
NATO.8.a: "Intéressant"

# Tooltips
NATO_join_tt: "Un §Ybonus d'opinion mutuel§! entre vous et tous les autres membres de §BL'OTAN§! sera ajouté.\nUn §Yaccès militaire mutuel§! avec tous les membres de §BL'OTAN§! sera ajouté.\n"
NATO_leave_tt: "Le §Ybonus d'opinion mutuel§! entre vous et les autres pays sera supprimé, et vous perdrez §Yl'accès militaire§! à tous les autres membres de §BL'OTAN§!.\nTous les membres de §BL'OTAN§! auront une §Yopinion§! moins favorable de vous.\n"

# Legacy - Events
NATO.9.t: "Invitation à l'OTAN"
NATO.9.d: "Les États-Unis et leurs alliés nous ont approchés et nous ont exhortés, afin de protéger la liberté et la paix mondiale, à rejoindre l'OTAN pour un bénéfice mutuel."
NATO.9.a: "Nous acceptons !"
NATO.9.b: "Nous n'avons pas le temps pour cela."
NATO.10.t: "[From.GetNameDef] rejoint l'OTAN !"
NATO.10.d: "Les officiels de [From.GetNameDef] ont contacté nos ambassadeurs et ont confirmé qu'ils rejoindront l'OTAN sous peu."
NATO.10.a: "Pour le monde libre !"
NATO.11.t: "[From.GetNameDef] refuse l'adhésion à l'OTAN"
NATO.11.d: "[From.GetNameDef] nous a informés que l'adhésion à l'OTAN n'est pas conforme à leurs intérêts et qu'ils ne rejoindront pas l'alliance de sitôt."
NATO.11.o1: "C'est vraiment dommage."
NATO.13.t: "[Root.GetNameDef] rejoint l'OTAN"
NATO.13.d: "La direction de l'OTAN a confirmé aujourd'hui que les négociations d'adhésion entre les États membres de l'OTAN et [Root.GetNameDef] se sont conclues avec succès et que les forces militaires [From.GetAdjective] seront bientôt intégrées dans la structure de commandement commune."
NATO.13.o1: "Un développement significatif."
NATO.14.t: "[From.GetNameDef] cherche à rejoindre l'OTAN"
NATO.14.d: "Les délégués de [From.GetNameDef] ont de plus en plus indiqué que leur pays d'origine est prêt à rejoindre l'Organisation du Traité de l'Atlantique Nord. Jusqu'à présent, nous les avons repoussés avec des promesses vides pendant que le Congrès est occupé par des questions politiques absolument importantes, mais maintenant, nous devons informer les comités de politique étrangère si nous avons l'intention de soumettre à l'OTAN une demande pour accepter [From.GetName] dans nos rangs."
NATO.14.a: "C'est là que le plaisir commence."
NATO.14.b: "Ce n'est pas dans nos intérêts."
NATO.15.t: "[USA.GetNameDef] refuse la demande d'adhésion à l'OTAN"
NATO.15.d: "[USA.GetNameDef] a rejeté notre demande d'adhésion à l'OTAN."
NATO.15.a: "Décevant."
NATO.16.t: "[From.GetName] quitte l'OTAN !"
NATO.16.d: "Le dirigeant de [From.GetNameDef], [From.GetLeader], a annoncé aujourd'hui l'intention du pays de se retirer immédiatement de l'Organisation du Traité de l'Atlantique Nord et de ses alliances affiliées. Cela affaiblira le pacte militaire."
NATO.16.o1: "Bon choix"
NATO.16.o2: "Intéressant"
NATO.17.t: "Changement de politique"
NATO.17.d: "Notre récent virage vers des politiques moins démocratiques a poussé l'OTAN à nous abandonner. Nous ne répondons plus à leurs exigences absurdes concernant la soi-disant démocratie. Nous rejetons cette notion et nous sommes mieux sans l'OTAN et leur fausse protection !"
NATO.17.o1: "Mieux vaut sans eux !"