l_french:
 # 0
 industrial_complex: "Industrie civile"
 industrial_complex_plural: "Industries civiles"
 industrial_complex_desc: "Ce bâtiment fournit à l'état une capacité industrielle pour la production de biens civils ou la construction de nouveaux bâtiments. Peut être converti en industrie militaire si nécessaire.\n\nApporte à l'état :\nNombre de travailleurs requis : §Y345K§!\nPIB de base par §Yindustrie civile§! : $§Y20 milliards§!\nConsommation énergétique de base : §R-0,4§! GW\n"
 
 # 1
 arms_factory: "Industrie militaire"
 arms_factory_plural: "Industries militaires"
 arms_factory_desc: "Ce bâtiment fournit à l'état une capacité industrielle pour la production d'équipements militaires. Peut être converti en industrie civile si nécessaire.\n\nApporte à l'état :\nNombre de travailleurs requis : §Y25K§!\nPIB de base par §Yindustrie militaire§! : $§Y1 milliard§!\nConsommation énergétique de base : §R-0,4§! GW"
 
 # 2
 infrastructure: "Infrastructure"
 infrastructure_plural: "Infrastructures"
 infrastructure_desc: "Ce bâtiment améliore les infrastructures de l'état. Il augmente votre capacité logistique dans les régions stratégiques, accélère vos divisions et améliore l'extraction des ressources brutes."
 
 # 3
 internet_station: "Infrastructure réseau"
 internet_station_plural: "Infrastructures réseau"
 internet_station_desc: "Les §Yinfrastructures réseau§! comprennent des structures de télécommunication et des systèmes de câbles à fibre optique souterrains permettant des transmissions sur de longues distances.\n\nChaque niveau d'§Yinfrastructure réseau§! améliore la croissance de productivité locale de §G+5,00%§!.\nChaque niveau réduit la durée des §Yinvestissements internationaux§! de §G-5,00%§!."
 
 # 4
 dockyard: "Chantier naval"
 dockyard_plural: "Chantiers navals"
 dockyard_desc: "Les §Ychantiers navals§! représentent la capacité d'un état à produire des navires militaires allant des §Ypatrouilleurs§!, §Yconvois§!, §Ydestroyers§!, §Yporte-avions§! et plus.\n\nApporte à l'état :\nNombre de travailleurs requis : §Y25K§!\nPIB de base par §Ychantier naval§! : $§Y1 milliard§!\nConsommation énergétique de base : §R-0,4§! GW"
 
 # 5
 air_base: "Base aérienne"
 air_base_plural: "Bases aériennes"
 air_base_desc: "Une §Ybase aérienne§! est une installation militaire pour le déploiement et la préparation des forces aériennes. Peut être agrandie jusqu'au niveau 10, ajoutant une capacité de §Y50§! avions par niveau."
 
 # 6
 radar_station: "Station radar"
 radar_station_plural: "Stations radar"
 radar_station_desc: "Les §Ystations radar§! permettent de détecter les troupes ennemies dans les états voisins. Un niveau plus élevé augmente leur portée effective.\n\nAméliore aussi la détection des forces aériennes ennemies et des flottes en mer."
 RADAR_ONMAP_TOOLTIP: "§HNiveau de la station radar§! : $LVL|G$/$TOT|H$\nAppartient à : $WHO|H$"
 RADAR_ONMAP_DAMAGED_TOOLTIP: "§HNiveau de la station radar§! : $LVL|R$/$TOT|H$\nAppartient à : $WHO|H$"
 
 # 7
 anti_air_building: "Sites SHORAD"
 anti_air_building_plural: "Sites SHORAD"
 anti_air_building_desc: "Les §Ysites SHORAD§! (Défense aérienne à courte portée) regroupent des systèmes antiaériens protégeant contre les menaces aériennes à basse altitude, des hélicoptères aux avions à réaction."
 
 # 8
 nuclear_reactor: "Réacteur nucléaire"
 nuclear_reactor_plural: "Réacteurs nucléaires"
 nuclear_reactor_desc: "Convertit l'énergie nucléaire en électricité, consommant de l'uranium modérément enrichi.\n\nProduction énergétique de base : §G+6§! GW\n"
 
 # 9
 synthetic_refinery: "Infrastructure d'énergies renouvelables"
 synthetic_refinery_plural: "Infrastructures d'énergies renouvelables"
 synthetic_refinery_desc: "Regroupe toutes les sources d'énergie renouvelable : parcs solaires, éoliennes, biocarburants, etc.\n\nProduction énergétique de base : §G+0,5§! GW\n"
 synthetic_refinery_amount: "$VALUE|Y0=$"
 synthetic_refinery_resource: "£resources_strip|$FRAME$"
 
 # 10
 fuel_silo: "Réserve stratégique de carburant"
 fuel_silo_plural: "Réserves stratégiques de carburant"
 fuel_silo_desc: "Stockage stratégique permettant à la nation d'accumuler davantage de §Hcarburant§!."
 
 # 11
 offices: "Secteur tertiaire"
 offices_plural: "Secteurs tertiaires"
 offices_desc: "Représente les industries autres que l'extraction et l'industrie lourde : finance, technologie, services, etc.\n\nApporte à l'état :\nNombre de travailleurs requis : §Y630K§!\nPIB de base par §Ysecteur tertiaire§! : $§Y50 milliards§!\nConsommation énergétique de base : §R-0,25§! GW"
 
 # 12
 naval_base: "Base navale"
 naval_base_plural: "Bases navales"
 naval_base_desc: "Étend la portée de votre flotte et permet sa réparation. Permet l'approvisionnement outre-mer et l'export de ressources. Des niveaux plus élevés augmentent le débit logistique."
 
 # 13
 bunker: "Fort terrestre"
 bunker_plural: "Forts terrestres"
 bunker_desc: "Inflige un malus d'attaque de $VALUE|+%0$ par niveau de fort à l'attaquant en combat. Une attaque multi-directionnelle réduit l'effet des forts."
 
 # 14
 coastal_bunker: "Fort côtier"
 coastal_bunker_plural: "Forts côtiers"
 coastal_bunker_desc: "Inflige un malus d'attaque de $VALUE|+%0$ par niveau de fort lors d'un débarquement ennemi."
 
 # 15
 supply_node: "Centre logistique"
 supply_node_desc: "Point le long d'une voie ferrée, hors des villes existantes, permettant le ravitaillement."
 
 # 16
 rail_way: "Voie ferrée"
 rail_way_plural: "Voies ferrées"
 rail_way_desc: "Relie les centres logistiques pour étendre le ravitaillement loin de la capitale.\n\nChaque niveau améliore la croissance de productivité locale de §G+4,00%§!."
 
 # 17
 fossil_powerplant: "Centrale thermique"
 fossil_powerplant_plural: "Centrales thermiques"
 fossil_powerplant_desc: "Regroupe toutes les centrales utilisant des combustibles fossiles (charbon, gaz, pétrole). S'arrête si la production excède la consommation.\n\nProduction énergétique de base : §G+1§! GW\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$"
 
 # 18
 agriculture_district: "District agricole commercial"
 agriculture_district_plural: "Districts agricoles commerciaux"
 agriculture_district_desc: "Regroupe toute l'agriculture non-subsistance : agro-industrie, silos, abattoirs, etc.\n\nApporte à l'état :\nNombre de travailleurs requis : §Y250K§!\nPIB de base : $§Y25 milliards§!\nConsommation énergétique : §R-0,10§! GW\n§GProduction de carburant§! : 8\n§GApprovisionnement local§! : 1,5%\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 
 # 19
 rocket_site: "Site de lancement de missiles"
 rocket_site_plural: "Sites de lancement de missiles"
 rocket_site_desc: "Permet le déploiement d'armes stratégiques allant des §Ymissiles sol-air§! aux §Ymissiles balistiques intercontinentaux§!."
 
 # Nouveaux bâtiments
 nuclear_facility: "Centre de R&D civile"
 nuclear_facility_plural: "Centres de R&D civile"
 nuclear_facility_desc: "Regroupe les projets spéciaux liés aux capacités industrielles civiles et installations nucléaires."
 
 air_facility: "Centre d'aérodynamique et d'avionique"
 air_facility_plural: "Centres d'aérodynamique et d'avionique"
 air_facility_desc: "Permet la recherche sur les aéronefs, fusées avancées, électronique associée et projets spatiaux."
 
 naval_facility: "Centre d'ingénierie navale"
 naval_facility_plural: "Centres d'ingénierie navale"
 naval_facility_desc: "Permet la recherche sur les navires de surface et sous-marins. Ne peut être construit que sur la côte."
 
 mega_gun_emplacement: "Canon à grande portée multi-charges"
 mega_gun_emplacement_plural: "Canons à grande portée multi-charges"
 mega_gun_emplacement_desc: "Utilisant un système de propulsion multi-charges, ce canon peut bombarder des cibles à des distances sans précédent en accélérant les obus à vitesse supersonique."
 
 stronghold_network: "Réseau défensif étatique"
 stronghold_network_plural: "Réseaux défensifs étatiques"
 stronghold_network_desc: "Un vaste réseau de tunnels, points fortifiés, tranchées et abris offrant un avantage décisif aux défenseurs."
 
 land_facility: "Centre de recherche terrestre"
 land_facility_plural: "Centres de recherche terrestre"
 land_facility_desc: "Permet la recherche sur les chars spéciaux, l'artillerie et autres aspects de la guerre terrestre."