influence.52.d: "Nous avons les options suivantes pour envoyer du matériel à notre allié.\n\nLe pack d'équipement d'infanterie : 250 unités d'équipement d'infanterie/armes légères, 10 unités d'équipement de commandement et contrôle, 10 unités de MANPADS, 10 unités d'armes antichars, sous réserve de ce qui est disponible dans nos réserves.\n\nLe pack de véhicules : 10 unités de transports de troupes blindés, 10 unités de véhicules de combat d'infanterie, 10 unités de véhicules utilitaires.\n\nLe pack drones/missiles : 30 unités de drones, 10 unités de 2 types de missiles balistiques."
influence.51.b_tt: "Vous aurez le choix du type de services militaires que vous pouvez fournir."
influence.51.a: "Leur envoyer des armes"
influence.51.b: "Leur fournir nos services militaires"
influence.51.c: "À bien y réfléchir..."
influence.52.a: "Pack d'équipement d'infanterie."
influence.52.b: "Pack de véhicules."
influence.52.c: "Pack drones/missiles."
influence.52.e: "En fait, j'en ai besoin..."
influence.53.a: "Accepter le pack."
