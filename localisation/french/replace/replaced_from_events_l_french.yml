influence.501.t: "Services militaires"
influence.501.d: "Nous pouvons leur fournir les services suivants : logistique, reconnaissance ou envoi de mercenaires.\n\nNous pouvons également envoyer des mercenaires tous les 60 jours à l'un des pays."
influence.501.a: "Établir leur logistique"
influence.501.b: "Leur fournir des renseignements modernes"
influence.501.c: "Leur envoyer des hommes gris"
influence.501.e: "Nous avons reconsidéré"