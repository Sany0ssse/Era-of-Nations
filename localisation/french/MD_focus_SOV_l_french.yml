##########Events##########
russia_governorate.1.t: "La Russie a décidé de faire de nous un gouvernorat"
russia_governorate.1.d: "La Russie s'oppose fermement à l'ancienne structure de son État. Un exemple de cela est le retour aux divisions administratives. La Russie est impatiente de nous inviter à devenir l'un de ses gouvernorats et à faire partie de ce nouvel ordre."
russia_governorate.1.o1: "Ensemble, nous ferons renaître le grand Empire !"
russia_governorate.1.o2: "Résister et mordre !"

russia_governorate.2.t: "[LIT.GetName] revient à la maison"
russia_governorate.2.d: "Le gouvernement de [LIT.GetName] a agi sagement en évitant la confrontation avec nous. [LIT.GetName] fera à nouveau partie de l'Empire russe, renforçant notre unité et notre avenir commun."
russia_governorate.2.o1: "Enfin"

russia_governorate.3.t: "[LIT.GetName] nous résiste !"
russia_governorate.3.d: "Le gouvernement de [LIT.GetName] a rejeté notre offre généreuse de devenir pacifiquement l'une de nos provinces. S'ils refusent la diplomatie, nous serons forcés de prendre des mesures par la force."
russia_governorate.3.o1: "Idiots"

russia_governorate.4.t: "La Russie a décidé de faire de nous un gouvernorat"
russia_governorate.4.d: "La Russie est fermement opposée à l'ancienne structure étatique. Un exemple est la réinstauration des divisions administratives. La Russie est déterminée à nous inviter à devenir l'un de ses gouvernorats."
russia_governorate.4.o1: "Ensemble, nous ferons renaître le grand Empire !"
russia_governorate.4.o2: "Résister et mordre !"

russia_governorate.5.t: "[LAT.GetName] revient à la maison"
russia_governorate.5.d: "Le gouvernement de [LAT.GetName] a agi prudemment en évitant le conflit avec nous. [LAT.GetName] redeviendra une partie de l'Empire russe, renforçant notre lien."
russia_governorate.5.o1: "Enfin"

russia_governorate.6.t: "[LAT.GetName] nous résiste !"
russia_governorate.6.d: "Le gouvernement de [LAT.GetName] a refusé notre offre généreuse de nous rejoindre pacifiquement en tant que province. Nous n'aurons d'autre choix que de les prendre par la force."
russia_governorate.6.o1: "Idiots"

russia_governorate.7.t: "La Russie a décidé de faire de nous un gouvernorat"
russia_governorate.7.d: "La Russie est fortement opposée à l'ancienne structure étatique. Un exemple est la réintroduction des divisions administratives. La Russie souhaite nous inviter à devenir l'un de ses gouvernorats."
russia_governorate.7.o1: "Ensemble, nous ferons renaître le grand Empire !"
russia_governorate.7.o2: "Résister et mordre !"

russia_governorate.8.t: "[EST.GetName] revient à la maison"
russia_governorate.8.d: "Le gouvernement de [EST.GetName] a sagement évité la confrontation avec nous. [EST.GetName] redeviendra une partie de l'Empire russe, nous rejoignant dans notre force renouvelée."
russia_governorate.8.o1: "Enfin"

russia_governorate.9.t: "[EST.GetName] nous résiste !"
russia_governorate.9.d: "Le gouvernement de [EST.GetName] a rejeté notre offre généreuse de devenir pacifiquement notre province. S'ils persistent, nous devrons prendre des mesures décisives."
russia_governorate.9.o1: "Idiots"

russia_governorate.10.t: "La Russie a décidé de faire de nous un gouvernorat"
russia_governorate.10.d: "La Russie s'oppose fermement à l'ancienne structure étatique et soutient le retour des divisions administratives. Ils souhaitent ardemment que nous devenions l'un de leurs gouvernorats."
russia_governorate.10.o1: "Ensemble, nous ferons renaître le grand Empire !"
russia_governorate.10.o2: "Résister et mordre !"

russia_governorate.11.t: "La Géorgie revient à la maison"
russia_governorate.11.d: "Le gouvernement de la Géorgie a choisi sagement d'éviter la confrontation avec nous. La Géorgie redeviendra une partie de l'Empire russe, renouvelant les anciens liens."
russia_governorate.11.o1: "Enfin"

russia_governorate.12.t: "La Géorgie nous résiste !"
russia_governorate.12.d: "Le gouvernement de la Géorgie a refusé notre offre généreuse d'intégration pacifique en tant que province. Nous n'aurons d'autre choix que de les prendre par la force."
russia_governorate.12.o1: "Idiots"

russia_governorate.13.t: "La Russie a décidé de faire de nous un gouvernorat"
russia_governorate.13.d: "La Russie s'oppose fermement à l'ancienne structure étatique et soutient le retour des divisions administratives. Ils veulent nous inviter à devenir l'un de leurs gouvernorats."
russia_governorate.13.o1: "Ensemble, nous ferons renaître le grand Empire !"
russia_governorate.13.o2: "Résister et mordre !"

russia_governorate.14.t: "La Moldavie revient à la maison"
russia_governorate.14.d: "Le gouvernement de la Moldavie a agi sagement en évitant la confrontation. La Moldavie redeviendra une partie de l'Empire russe, renforçant notre unité."
russia_governorate.14.o1: "Enfin"

russia_governorate.15.t: "La Moldavie nous résiste !"
russia_governorate.15.d: "Le gouvernement de la Moldavie a refusé notre offre généreuse de nous rejoindre pacifiquement en tant que province. Nous serons forcés de les prendre par la force s'ils continuent de résister."
russia_governorate.15.o1: "Idiots"

russia_governorate.16.t: "La Russie a décidé de faire de nous un gouvernorat"
russia_governorate.16.d: "La Russie est fermement opposée à l'ancienne structure étatique. Ils poussent pour le retour des divisions administratives et veulent que nous devenions l'un de leurs gouvernorats."
russia_governorate.16.o1: "Ensemble, nous ferons renaître le grand Empire !"
russia_governorate.16.o2: "Résister et mordre !"
russia_governorate.16.o3: "Proposer un État d'Union"

russia_governorate.17.t: "La Biélorussie revient à la maison"
russia_governorate.17.d: "Le gouvernement de la Biélorussie a agi sagement en évitant le conflit avec nous. La Biélorussie redeviendra une partie de l'Empire russe, renforçant notre alliance."
russia_governorate.17.o1: "Excellent."

russia_governorate.18.t: "La Biélorussie nous résiste !"
russia_governorate.18.d: "Le gouvernement de la Biélorussie a refusé notre offre généreuse de nous rejoindre pacifiquement en tant que province. S'ils persistent, nous devrons prendre des mesures décisives."
russia_governorate.18.o1: "Idiots"
 russia_governorate.19.t: "La Biélorussie propose un État d'Union"
russia_governorate.19.d: "Le gouvernement biélorusse a proposé une alternative moins agressive : la création accélérée d'un État d'Union. Il semble qu'ils cherchent à minimiser les pertes de pouvoir qu'ils pourraient subir."
russia_governorate.19.o1: "Qu'il y ait un État d'Union"
russia_governorate.19.o2: "Pas de Biélorussie."

russia_governorate.20.t: "La Russie a décidé de faire de nous un gouvernorat"
russia_governorate.20.d: "La Russie s'oppose fermement à l'ancienne structure étatique et pousse pour le retour des divisions administratives. Ils insistent pour que nous devenions l'un de leurs gouvernorats."
russia_governorate.20.o1: "Ensemble, nous ferons renaître le grand Empire !"
russia_governorate.20.o2: "Résister et mordre !"
russia_governorate.20.o3: "Proposer un État d'Union"

russia_governorate.21.t: "L'Arménie revient à la maison"
russia_governorate.21.d: "Le gouvernement arménien a agi sagement en évitant la confrontation. L'Arménie redeviendra une partie de l'Empire russe, restaurant les anciens liens."
russia_governorate.21.o1: "Excellent."

russia_governorate.22.t: "L'Arménie nous résiste !"
russia_governorate.22.d: "L'Arménie a audacieusement résisté aux souhaits de la Russie pour un État d'Union. Nous devons préparer une réponse appropriée à leur défi."
russia_governorate.22.o1: "Idiots."

russia_governorate.23.t: "L'Arménie propose un État d'Union"
russia_governorate.23.d: "Le gouvernement arménien a proposé une alternative moins agressive : la création accélérée d'un État d'Union. Ils semblent vouloir réduire leurs pertes potentielles de pouvoir."
russia_governorate.23.o1: "Qu'il y ait un État d'Union"
russia_governorate.23.o2: "Pas d'Arménie."

russia_governorate.24.t: "Le problème de l'Artsakh"
russia_governorate.24.d: "La République d'Artsakh est à un carrefour concernant qui la gouvernera dans les circonstances actuelles. Maintenant que l'Arménie et la Russie sont plus étroitement unies que jamais, l'avenir de l'Artsakh est en jeu."
russia_governorate.24.o1: "Laissons la Russie prendre le contrôle"
russia_governorate.24.o2: "L'Artsakh est à nous."

sov_nationalists.1.t: "Amender la constitution nationale"
sov_nationalists.1.d: "Notre constitution précédente était sans doute la pire de l'histoire russe ! Pour effacer ce document honteux, nous créerons une véritable constitution russe. La décision clé est de savoir si nous devons maintenir la centralisation traditionnelle ou opter pour une voie plus décentralisée, mais expansionniste. Quelle direction choisir ?"
sov_nationalists.1.a: "La Russie doit se stabiliser avant d'aider les autres !"
sov_nationalists.1.b: "L'expansionnisme est notre destin national et doit être inscrit dans la constitution !"

sov_nationalists.3.t: "La Russie nous offre sa protection"
sov_nationalists.3.d: "Aujourd'hui, le président de la Russie a officiellement proposé de placer des bases militaires sur notre sol pour nous protéger des menaces extérieures. Cette offre pourrait renforcer notre sécurité de manière significative."
sov_nationalists.3.a: "La Russie nous sauvera !"
sov_nationalists.3.b: "Nous pouvons nous débrouiller seuls !"

sov_nationalists.4.t: "La Russie propose d'envoyer les PMC Wagner"
sov_nationalists.4.d: "Le gouvernement russe a proposé d'envoyer des spécialistes de la célèbre compagnie militaire privée Wagner pour nous aider. Leur présence pourrait faire pencher la balance en notre faveur."
sov_nationalists.4.a: "Nous les acceptons"
sov_nationalists.4.b: "Nous n'avons pas besoin de mercenaires ici !"

sov_nationalists.5.t: "La Russie propose de relancer l'Entente"
sov_nationalists.5.d: "Le gouvernement russe a proposé de relancer l'alliance de l'Entente. Cette offre inattendue pourrait permettre à nos peuples de se tenir à nouveau ensemble, unis contre les menaces communes."
sov_nationalists.5.a: "Vive l'Entente !"
sov_nationalists.5.b: "Nous n'en avons pas besoin"

sov_nationalists.6.t: "La révolution russe"
sov_nationalists.6.d: "Notre république a maintenant une chance d'obtenir l'indépendance ! Les nationaux-bolcheviks ont amené leurs camarades ici, et ensemble nous vaincrons nos ennemis et revendiquerons notre avenir."
sov_nationalists.6.a: "La Russie nous sauvera !"

sov_nationalists.7.t: "§Y[SOV.GetNameWithFlag]§! offre sa protection"
sov_nationalists.7.d: "Le gouvernement russe propose de signer une série d'accords garantissant notre protection contre les invasions étrangères. Allons-nous accepter ce pacte de sécurité ?"
sov_nationalists.7.a: "La Russie nous sauvera !"
sov_nationalists.7.b: "Non"

sov_nationalists.8.t: "§Y[SOV.GetNameWithFlag]§! propose de rejoindre l'alliance"
sov_nationalists.8.d: "Le gouvernement russe propose de former une alliance à travers une série d'accords visant à nous protéger des menaces extérieures. Allons-nous accepter ?"
sov_nationalists.8.a: "La Russie nous sauvera !"
sov_nationalists.8.b: "Non"

sov_nationalists.9.t: ""
sov_nationalists.9.d: ""
sov_nationalists.9.a: ""

sov_nationalists.10.t: "Alliance avec §Y[PER.GetNameWithFlag]§!"
sov_nationalists.10.d: "Le gouvernement iranien a refusé de rejoindre notre alliance par un traité. Il semble que nous devrons imposer notre volonté par la force."
sov_nationalists.10.a: "L'Iran sera à nous !"

sov_nationalists.11.t: ""
sov_nationalists.11.d: ""
sov_nationalists.11.a: ""

sov_nationalists.12.t: "§Y[SOV.GetNameWithFlag]§! propose de rejoindre l'alliance"
sov_nationalists.12.d: "Le gouvernement russe propose une série d'accords pour nous protéger des invasions. Allons-nous accepter leur offre et rejoindre l'alliance ?"
sov_nationalists.12.a: "La Russie nous sauvera !"
sov_nationalists.12.b: "Non"

sov_nationalists.13.t: "Alliance avec §Y[FROM.GetNameWithFlag]§!"
sov_nationalists.13.d: "Le gouvernement de [FROM.GetName] a refusé de rejoindre notre alliance par un traité. Il semble que nous devrons imposer notre volonté par la force."
sov_nationalists.13.a: "Triste nouvelle"

sov_nationalists.14.t: "Exercices militaires avec §Y[FROM.GetNameWithFlag]§!"
sov_nationalists.14.d: "La Russie mène des exercices militaires conjoints avec nos forces et celles d'autres alliés en préparation d'une potentielle intervention militaire en Turquie."
sov_nationalists.14.a: "Nous serons prêts"

sov_nationalists.15.t: "L'État d'Union avec §Y[SOV.GetNameWithFlag]§!"
sov_nationalists.15.d: "Le gouvernement russe suggère de relancer le projet d'État d'Union entre la Russie et la Serbie. Initialement rejeté par le gouvernement Eltsine dans les années 1990, ils proposent maintenant de ressusciter cette alliance. Allons-nous accepter ?"
sov_nationalists.15.a: "Oui"
sov_nationalists.15.b: "Non"

sov_nationalists.16.t: "L'État d'Union avec §Y[SER.GetNameWithFlag]§!"
sov_nationalists.16.d: "Le gouvernement serbe a accepté de reprendre le projet d'État d'Union, marquant un nouveau chapitre dans notre coopération."
sov_nationalists.16.a: "Bien"

sov_nationalists.17.t: "L'État d'Union avec §Y[SER.GetNameWithFlag]§!"
sov_nationalists.17.d: "Le gouvernement serbe a refusé de relancer le projet d'État d'Union. Ce revers est décevant pour ceux qui espéraient renforcer nos liens et unifier nos nations. Nous devons réfléchir soigneusement à nos prochaines étapes."
sov_nationalists.17.a: "Dommage"

sov_nationalists.18.t: ""
sov_nationalists.18.d: ""
sov_nationalists.18.a: ""

sov_nationalists.19.t: "Accord avec la Russie"
sov_nationalists.19.d: "Les ambitions impériales de la Russie ont atteint nos frontières. Leur gouvernement a émis un ultimatum direct exigeant le contrôle de notre pays. La question demeure : devons-nous résister ou nous soumettre à leurs exigences ?"
sov_nationalists.19.a: "Nous abandonnons"
sov_nationalists.19.b: "Pas aujourd'hui"

sov_nationalists.20.t: "Nouvel Empire russe"
sov_nationalists.20.d: "Le président Jirinovsky a déclaré la renaissance de l'Empire russe comme la pierre angulaire de son programme politique. Que ce soit par des moyens pacifiques ou par la force, la Russie est prête à reprendre ses anciens territoires. Nous devons nous préparer à la possibilité d'un conflit renouvelé alors que l'empire renaît."
sov_nationalists.20.a: "Que Dieu sauve le président."

sov_nationalists.21.t: "Réimpérialisation"
sov_nationalists.21.d: "Après le soulèvement de 1917, les communistes ont cherché à effacer la mémoire du passé de notre patrie en le remplaçant par leur idéologie. De nombreuses villes russes ont été renommées d'après des leaders et symboles communistes. Nous devons restaurer notre histoire et notre dignité en ramenant les noms prérévolutionnaires de ces villes."
sov_nationalists.21.a: "Ramenons les anciens noms prérévolutionnaires des villes"
sov_nationalists.21.b: "Les titres d'avant-guerre étaient meilleurs"

sov_nationalists.22.t: "La Russie propose d'organiser un référendum"
sov_nationalists.22.d: "Le gouvernement russe a suggéré de tenir un référendum urgent sur l'adhésion à leur union. Cette proposition soudaine met en évidence la rapidité et la détermination des nouvelles politiques de la Russie. La question est : allons-nous organiser ce référendum et accepter son résultat ?"
sov_nationalists.22.a: "Faisons-le et acceptons le résultat"
sov_nationalists.22.b: "Nous ne voulons pas faire partie de la Russie"

sov_nationalists.23.t: "La Russie exige la Mandchourie"
sov_nationalists.23.d: "La Russie a exigé l'annexion de la Mandchourie dans le cadre de son plan pour recréer Zheltorossiya. Cette revendication agressive nous oblige à décider si nous devons nous soumettre ou résister à leurs ambitions."
sov_nationalists.23.a: "Nous devons nous soumettre..."
sov_nationalists.23.b: "Pas de Zheltorossiya pour aujourd'hui."

sov_nationalists.24.t: "La Chine accepte notre demande"
sov_nationalists.24.d: "La Chine a accepté nos demandes concernant la Mandchourie. Avec cette acceptation, nous avons enfin sécurisé le contrôle de Zheltorossiya. Cette victoire marque une étape importante dans nos ambitions régionales."
sov_nationalists.24.a: "Slava Rossii !"

sov_nationalists.25.t: "La Chine refuse notre demande"
sov_nationalists.25.d: "La Chine a refusé nos demandes sur la Mandchourie. Nous devrons maintenant envisager une action militaire pour reprendre Zheltorossiya et faire valoir nos revendications."
sov_nationalists.25.a: "Ils ont choisi la mort."

sov_nationalists.26.t: "La Russie déclare la guerre aux États-Unis"
sov_nationalists.26.d: "Le gouvernement nationaliste de la Russie a déclaré une campagne d'unification contre la menace atlantiste pour l'ordre mondial. Cette déclaration soudaine signale une nouvelle phase de conflit global."
sov_nationalists.26.a: "Qu'est-ce que c'est que ça ?!"

sov_nationalists.27.t: "Accord avec la Russie"
sov_nationalists.27.d: "Les ambitions impériales de la Russie ont maintenant atteint nos frontières. Leur gouvernement a émis un ultimatum direct exigeant le contrôle de notre pays. La question demeure : devons-nous résister ou nous soumettre ?"
sov_nationalists.27.a: "Nous abandonnons"
sov_nationalists.27.b: "Pas aujourd'hui"

sov_nationalists.28.t: "Protection de la Géorgie"
sov_nationalists.28.d: "La Russie a proposé de tenir un référendum pour que nous rejoignions leur union. Le résultat attendu est clair, mais nous devons décider si nous acceptons cette proposition ou la rejetons."
sov_nationalists.28.a: "Bien sûr, il est temps de rentrer à la maison - en Russie"
sov_nationalists.28.b: "Pas aujourd'hui"

sov_nationalists.29.t: "Union inattendue"
sov_nationalists.29.d: "Personne n'avait anticipé une coopération avec les communistes, pourtant cela s'est produit de manière inattendue. Cette alliance pourrait changer radicalement le paysage politique."
sov_nationalists.29.a: "Intéressant"

sov_nationalists.30.t: "Choisir le nouveau monarque..."
sov_nationalists.30.d: "La Russie a besoin d'un nouveau monarque fort pour diriger l'empire renaissant. Nous devons décider qui prendra le trône et guidera la nation à travers ces temps tumultueux."
sov_nationalists.30.d1: "Andrey Romanov est le candidat le plus légitime !"
sov_nationalists.30.b: "Maria Vladimirovna !"
sov_nationalists.30.c: "Georgiy devrait régner !"
sov_nationalists.30.a: "Nicolas le Troisième !"

sov_nationalists.31.t: "Unification de l'Église et de l'État"
sov_nationalists.31.d: "Le gouvernement a annoncé la fusion de l'Église et de l'État en une entité unifiée. L'Église orthodoxe est maintenant pleinement intégrée aux cercles dirigeants, restaurant l'harmonie historique entre l'autorité spirituelle et politique."
sov_nationalists.31.a: "Tsarebozhniki."

sov_nationalists.32.t: "Jirinovsky élu président"
sov_nationalists.32.d: "Lors du récent changement de gouvernement, le parti nationaliste LDPR a remporté le pouvoir, avec Vladimir Jirinovsky élu président. Ils ont promis des réformes radicales, y compris le retour de l'ancien drapeau et la poursuite d'un programme nationaliste conservateur."
sov_nationalists.32.a: "Qu'attend la Russie ?"

sov_nationalists.33.t: "Opération militaire en [UKR.GetName]"
sov_nationalists.33.d: "Les efforts diplomatiques pour ramener l'Ukraine dans l'Empire russe ont échoué. Maintenant, une action militaire sera entreprise pour renverser le gouvernement actuel et reprendre ces terres."
sov_nationalists.33.a: "Kiev sera à nous !"

sov_nationalists.34.t: "L'Armée de [SOV.GetName]"
sov_nationalists.34.d: "Notre État renaissant nécessite une armée forte et capable. Nous mettrons en œuvre des réformes pour moderniser et renforcer nos forces armées pour les défis à venir."
sov_nationalists.34.a: "Pour [SOV.GetName] !"

sov_nationalists.35.t: "L'Accord de Moscou a été signé !"
sov_nationalists.35.d: "Nous avons officiellement formé une nouvelle alliance militaro-politique dédiée à la promotion des intérêts de la Russie et à l'opposition aux puissances occidentales. Ce bloc sera un instrument clé de notre force renouvelée."
sov_nationalists.35.a: "Pour [SOV.GetName] !"

sov_nationalists.36.t: "Gouvernorat de [NOV.GetName]"
sov_nationalists.36.d: "[NOV.GetName] sera pleinement intégré à l'Empire russe. Le drapeau russe flottera à nouveau sur cette terre, marquant son retour à la patrie."
sov_nationalists.36.a: "Pour [SOV.GetName] !"

sov_nationalists.37.t: "Soulèvements cosaques en [KAZ.GetName]"
sov_nationalists.37.d: "Les groupes cosaques loyaux à nous en [KAZ.GetName] ont commencé des rébellions armées suite à notre annonce de reprendre ces terres pour [SOV.GetName]. Leur loyauté féroce alimente ce soulèvement."
sov_nationalists.37.a: "Pour [SOV.GetName] !"

sov_nationalists.38.t: "Opération militaire en Asie centrale"
sov_nationalists.38.d: "Les républiques d'Asie centrale sont le produit d'une erreur soviétique, leur accordant une fausse indépendance. Nous ramènerons ces territoires dans notre grand Empire par la force si nécessaire."
sov_nationalists.38.a: "Pour [SOV.GetName] !"

sov_nationalists.39.t: "Rébellion armée anti-russe"
sov_nationalists.39.d: "Nos politiques pro-russes ont déclenché une mutinerie parmi certains généraux, qui marchent maintenant vers Varsovie dans le but de renverser les forces d'occupation russes contrôlant le gouvernement polonais."
sov_nationalists.39.a: "Mon Dieu"

sov_nationalists.40.t: "Rébellion armée anti-russe"
sov_nationalists.40.d: "Notre position pro-russe a conduit certains généraux à se rebeller, déclarant leur intention d'expulser par la force l'ensemble du gouvernement pro-russe de la République tchèque."
sov_nationalists.40.a: "Mon Dieu"

sov_nationalists.41.t: "§Y[SOV.GetNameWithFlag]§! exige des troupes sur notre territoire"
sov_nationalists.41.d: "Le gouvernement russe craint une menace possible de notre part et exige un accès militaire à notre territoire. Devons-nous leur accorder le passage pour apaiser les tensions ou refuser ?"
sov_nationalists.41.a: "Si c'est la voie vers une solution pacifique, nous acceptons"
sov_nationalists.41.b: "Non"

sov_nationalists.42.t: "Ils ont refusé notre proposition"
sov_nationalists.42.d: "Leur refus de coopérer nous a convaincus qu'ils représentent une menace réelle pour la sécurité de notre nation. Nous devons nous préparer à un conflit supplémentaire."
sov_nationalists.42.o1: "Idiots"

sov_nationalists.43.t: "Invasion de l'Alaska"
sov_nationalists.43.d: "Nos forces ont réussi à débarquer sur le sol alaskien et sont prêtes à reprendre ce territoire par la force. Cela marque le début d'une nouvelle campagne audacieuse."
sov_nationalists.43.o1: "Le gouvernorat d'Alaska devrait être de retour"

sov_nationalists.44.t: "[FROM.GetName] offre des armes"
sov_nationalists.44.d: "[FROM.GetName] a proposé de nous fournir des armes qui seront précieuses dans nos conflits à venir. Ce soutien renforcera nos capacités militaires."
sov_nationalists.44.o1: "Nous acceptons"
sov_nationalists.44.o2: "Nous n'en avons pas besoin"

sov_nationalists.45.t: "[FROM.GetName] a accepté notre proposition"
sov_nationalists.45.d: "[FROM.GetName] a accepté notre offre généreuse, marquant une étape supplémentaire vers le renforcement de notre alliance et l'augmentation de notre influence dans la région."
sov_nationalists.45.o1: "Bien"

sov_nationalists.46.t: "[FROM.GetName] offre des instructeurs militaires"
sov_nationalists.46.d: "[FROM.GetName] propose d'envoyer des instructeurs militaires pour former nos troupes aux tactiques de guerre modernes. Cette formation améliorera l'efficacité de notre armée."
sov_nationalists.46.o1: "Nous acceptons"
sov_nationalists.46.o2: "Nous n'en avons pas besoin"

sov_nationalists.47.t: "[FROM.GetName] a accepté notre proposition"
sov_nationalists.47.d: "[FROM.GetName] a accepté notre offre, renforçant davantage notre alliance et élargissant notre influence politique dans cette région."
sov_nationalists.47.o1: "Bien"

sov_nationalists.48.t: "[FROM.GetName] a refusé notre offre"
sov_nationalists.48.d: "[FROM.GetName] a rejeté notre proposition généreuse, manquant une opportunité de renforcer notre influence et de stabiliser leur propre situation politique."
sov_nationalists.48.o1: "Dommage"

sov_nationalists.49.t: "[FROM.GetName] propose d'accueillir une base militaire"
sov_nationalists.49.d: "[FROM.GetName] a proposé d'accueillir une base militaire sur leur territoire pour nous aider à contrer les adversaires potentiels. Cela pourrait être un avantage stratégique."
sov_nationalists.49.o1: "Nous acceptons"
sov_nationalists.49.o2: "Nous n'en avons pas besoin"

sov_nationalists.50.t: "[FROM.GetName] est devenu un gouvernorat de [SOV.GetName]"
sov_nationalists.50.d: "[FROM.GetName] a officiellement été incorporé comme province de notre État. Maintenant, nous devons nous concentrer sur une intégration complète et éviter les erreurs passées qui ont conduit à l'instabilité."
sov_nationalists.50.o1: "Un et indivisible"

sov_nationalists.51.t: "[FROM.GetName] est intégré à [SOV.GetName]"
sov_nationalists.51.d: "[FROM.GetName] a été complètement absorbé dans notre grand Empire. Notre nation devient plus forte à mesure que nous reprenons les territoires perdus, et nous n'avons pas l'intention d'arrêter l'expansion."
sov_nationalists.51.o1: "Notre pays s'est agrandi"

sov_nationalists.52.t: "[FROM.GetName] a orchestré un coup d'État dans notre pays !"
sov_nationalists.52.d: "Les services spéciaux russes ont orchestré un coup d'État sur notre sol, plaçant au pouvoir un dirigeant loyal à eux. Une fois de plus, nous sommes enchaînés par le contrôle russe."
sov_nationalists.52.o1: "Oh non"

sov_nationalists.53.t: "Opération : Grill"
sov_nationalists.53.d: "Les forces russes ont lancé des frappes préventives surprises sur les installations militaires azerbaïdjanaises, avançant rapidement vers Bakou et marquant le début d'une nouvelle guerre."
sov_nationalists.53.o1: "Mettons fin à cela"
sov_nationalists.53.o2: "Oh non"

sov_nationalists.54.t: "Intégration d'Istanbul"
sov_nationalists.54.d: "Notre priorité est d'intégrer Istanbul et les zones environnantes dans le système territorial de la Russie et de faire revivre l'héritage culturel byzantin. Nous commencerons à restaurer les noms historiques immédiatement."
sov_nationalists.54.o1: "Merveilleux"

sov_nationalists.55.t: "Résistance turque"
sov_nationalists.55.d: "Les citoyens turcs locaux, ainsi que d'anciens militaires et membres des services de renseignement, ont organisé une résistance contre nos efforts à Istanbul et dans les territoires voisins."
sov_nationalists.55.o1: "Cela devient insupportable"

sov_nationalists.56.t: "Opération policière spéciale"
sov_nationalists.56.d: "Notre opération policière a réussi, supprimant complètement la résistance turque. Nous pouvons maintenant procéder à l'intégration de ces terres sans opposition."
sov_nationalists.56.o1: "Merveilleux"

sov_nationalists.57.t: "Constantinople fait partie de la Russie"
sov_nationalists.57.d: "La justice historique a enfin été rendue. Constantinople est devenue une partie de la Russie, réalisant un rêve vieux de plusieurs siècles de nos dirigeants et marquant une victoire majeure pour l'empire."
sov_nationalists.57.o1: "C'est une grande victoire !"

