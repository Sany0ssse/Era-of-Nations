SOV_economy_category: "Économie russe"
SOV_economy_category_desc: "[SOV.GetFlag]§YL'économie russe§! traverse actuellement des temps difficiles. Nous devons non seulement raviver l'héritage du passé, mais aussi percer parmi les leaders de l'économie mondiale\nPour supprimer l'esprit national de l'§Réconomie brisée§!, il est nécessaire de §Gterminer§! les focus dans la §Ybranche économique§!. Plus vous avez de £text_icon_sov_ruble §YRécupération économique§!, plus vite vous §Gsupprimerez§! ce §Rdébuff§!\n£text_icon_sov_ruble §YCapitalisation§! : Les plus grandes entreprises en [SOV.GetFlag]§YRussie§! ont une £text_icon_sov_ruble §Ycapitalisation§! qui sera affichée dans leur panneau. Elle change constamment en raison de diverses conditions : l'acquisition de nouveaux actifs en Russie et à l'étranger, une corruption élevée ou faible, la guerre, la croissance économique, etc.\nSi les §RCommunistes§! sont au §Ypouvoir§!, alors la £text_icon_sov_ruble §Ycapitalisation§! cesse d'être mise à jour et modifiée.\nSi les §2Oligarques§! sont au pouvoir, la £text_icon_sov_ruble §Ycapitalisation§! des entreprises est considérablement §Rréduite§!."
