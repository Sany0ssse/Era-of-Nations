SOV_yabloko: "RUDP Yabloko"
SOV_yabloko_desc: "Yabloko, l'un des plus anciens partis libéraux de la Russie moderne, a enfin accédé au pouvoir, porté par une nouvelle vague de soutien à la démocratie de style occidental. Le parti est devenu un foyer politique pour les réformateurs – allant des démocrates aguerris des années 1990 à une nouvelle génération inspirée par la promesse d'une société libérale et juste. Leur objectif est rien moins que de transformer la Russie en une démocratie libérale occidentale modèle."

SOV_yavlinskiy: "Grigory Yavlinsky"
SOV_yavlinskiy_desc: "Grigory Yavlinsky est né le 10 avril 1952 à Lviv, mais sa carrière politique a pris racine dans les institutions gouvernementales de l'ère soviétique à Moscou. Économiste de formation, il fut autrefois chargé de concevoir des réformes de marché pour l'URSS, mais ses propositions furent finalement écartées au profit d'autres stratégies. Malgré les revers, il est resté un fervent défenseur des réformes et dirige le parti Yabloko depuis le début des années 1990 jusqu'à aujourd'hui. Sa présence durable dans la politique russe reflète son engagement envers une Russie démocratique et économiquement libérale."

SOV_russian_liberalism: "Libéralisme russe"
SOV_russian_liberalism_desc: "Pendant des siècles, la Russie a souffert sous des autocrates – des tsars au régime soviétique. La véritable démocratie n'a jamais eu l'opportunité de s'épanouir. Le moment est venu de rompre avec cet héritage. En adoptant les valeurs libérales occidentales, telles que l'autodétermination, les droits humains et la liberté d'expression, nous pouvons guider la Russie vers une nouvelle ère de gouvernance démocratique et d'émancipation civique."

SOV_fix_eltsyn_shit: "Corriger les erreurs des années 90"
SOV_fix_eltsyn_shit_desc: "Les politiques économiques de Gaïdar et Eltsine dans les années 1990 ont conduit la Russie sur une voie dangereuse. Au lieu d'une économie de marché dynamique, le pays a sombré dans l'oligarchie, avec la richesse et le pouvoir concentrés entre les mains de quelques-uns. Nous devons maintenant corriger ces torts et prouver que le vrai capitalisme peut fonctionner en Russie. Une économie transparente et compétitive doit remplacer le système de copinage qui a été autorisé à s'enraciner."

SOV_russian_free_speech: "Liberté d'expression russe"
SOV_russian_free_speech_desc: "La liberté d'expression est un pilier fondamental de toute société libérale. Lorsque les gens sont réduits au silence, l'État devient stagnant et déconnecté de ses citoyens. Cette répression a conduit à l'effondrement sous l'empire et l'Union soviétique. Pour sauvegarder notre avenir et empêcher un autre cycle de décadence, nous devons protéger et promouvoir un discours ouvert et l'expression pour tous."

SOV_no_repressions: "Inverser les lois répressives"
SOV_no_repressions_desc: "Avant notre arrivée au pouvoir, le gouvernement a adopté des lois qui ont restreint les libertés civiles et emprisonné des citoyens innocents. Ces mesures répressives n'ont pas leur place dans une démocratie libérale. Nous devons démanteler ces lois et libérer ceux qui ont été injustement punis. C'est une étape nécessaire vers la justice, la réconciliation et la restauration de la confiance du public envers le gouvernement."

SOV_depoliticize_oligarchs: "Dépolitiser les oligarques"
SOV_depoliticize_oligarchs_desc: "La fusion du pouvoir politique et économique dans les années 1990 a donné naissance à une oligarchie enracinée qui a affaibli notre démocratie. Ces élites traitent le pays comme un actif privé. Il est essentiel de briser cette alliance malsaine et de s'assurer que l'influence politique repose uniquement sur le peuple. Ce n'est qu'ainsi que nous pourrons rendre le pouvoir à sa juste place – entre les mains des citoyens."

SOV_depoliticize_oligarchs_focus_TT: "Nous entamerons un long processus de dépolitisation des oligarques. Ils pourraient résister !"

SOV_new_society: "La grande société"
SOV_new_society_desc: "La Russie a surmonté la tempête de la reprise. Il est maintenant temps de commencer la transformation de notre société. Nous visons à construire un cadre libéral pour la gouvernance et l'économie, en nous éloignant des valeurs autoritaires et collectivistes du passé. Notre initiative de Grande Société s'inspire de la vision de Lyndon B. Johnson, mais notre ambition est encore plus grande : transformer fondamentalement la Russie en une démocratie libérale moderne et tournée vers l'avenir."

SOV_capitalism_in_500_days: "Lancer le programme des 500 jours"
SOV_capitalism_in_500_days_desc: "Le programme des 500 jours a été initialement conçu pour transformer l'économie soviétique en un système basé sur le marché. Bien qu'il ait été mis de côté au profit de la thérapie de choc de Gaïdar, le besoin d'une telle réforme demeure. Nous relancerons et mettrons à jour le programme pour créer une transformation économique plus stable et inclusive. S'il est correctement mis en œuvre, il jettera les bases d'une prospérité à long terme et d'une résilience démocratique."

SOV_lgbt_rights: "Droits LGBT"
SOV_lgbt_rights_desc: "Une société véritablement libérale doit respecter les droits et la dignité de chaque personne, quelle que soit son orientation sexuelle. Les individus LGBT méritent une protection égale devant la loi et un accès égal aux opportunités. Reconnaître leurs droits est non seulement un impératif moral, mais aussi une étape nécessaire pour construire une Russie inclusive et moderne."

SOV_kill_communists: "Détruire les sympathisants communistes"
SOV_kill_communists_desc: "Le communisme reste l'une des plus grandes menaces pour la réforme libérale en Russie. Alimenté par la nostalgie d'un passé imparfait, ses partisans cherchent à inverser nos progrès. Nous devons démanteler leurs réseaux de manière décisive et empêcher la réémergence d'un socialisme autoritaire. Il n'y a pas de place pour cette idéologie dans un État démocratique moderne."

SOV_kill_revanchism: "Détruire les pensées revanchistes"
SOV_kill_revanchism_desc: "Qu'est-ce qui engendre le totalitarisme et les idéologies illibérales ? Le revanchisme. Il prospère dans les systèmes faibles, attendant une chance de ressurgir. Comme un virus persistant, il doit être éradiqué si nous voulons sécuriser notre avenir libéral. Nous devons l'affronter de front – avec l'éducation, la réforme et des institutions fortes – pour s'assurer qu'il n'infecte pas à nouveau notre société."

SOV_communist_angry_focus_TT: "Nous rendrons les communistes furieux !"

SOV_kill_fascists: "Calmer la vague nationaliste"
SOV_kill_fascists_desc: "Le nationalisme, lorsqu'il est poussé à l'extrême, représente un grave danger pour une société libérale et multiethnique. L'histoire a montré les conséquences dévastatrices des régimes nationalistes. Nous devons démanteler ces mouvements avant qu'ils ne prennent de l'ampleur. Une Russie libre et inclusive doit primer sur les agendas ethnonationalistes étroits."

SOV_fascists_angry_focus_TT: "Nous rendrons les nationalistes furieux !"

SOV_better_russia: "Une meilleure Russie"
SOV_better_russia_desc: "Bien que notre travail soit loin d'être terminé, nous avons pris des mesures décisives pour construire une Russie plus libre et plus juste. Pour la première fois depuis des générations, le cycle de la tyrannie a été interrompu. Nous avons empêché le retour de la dictature, et avec des efforts continus, nous pouvons construire un avenir défini par la démocratie et les opportunités."

SOV_500_days_ura_tt: "A complété §Y5§ ! programmes des 500 jours"
SOV_500_days_pizda_tt: "Si nous n'achevons pas nos réformes, les conséquences pourraient être imprévisibles !"
SOV_500_days_focus_TT: "Déverrouille les décisions de réformes économiques. Attention, si nous n'achevons pas notre programme à temps, les conséquences pourraient être imprévisibles !"

SOV_depolitisation_of_oligarchs: "Dépolitisation des oligarques"
SOV_new_broken_economy: "Conséquences des réformes échouées"
SOV_new_broken_economy_desc: "Nous n'avons pas réussi à mettre en œuvre nos réformes économiques. Maintenant, le pays se trouve dans l'emprise d'une profonde récession – comparable à la chute catastrophique des années 1990. Les entreprises s'effondrent, la confiance publique disparaît et le chômage explose. L'échec d'agir à temps a un coût dévastateur."

SOV_communist_angry: "Protestations communistes !"
SOV_nationalists_angry: "Protestations nationalistes !"

SOV_the_onf: "Front populaire panrusse"
SOV_the_onf_desc: "Certains soutiennent que sécuriser le pouvoir nécessite l'abolition des élections et l'adoption de la dictature. Nous rejetons cette voie. L'autoritarisme conduit à la stagnation et à la ruine. À la place, nous proposons une large coalition d'organisations civiles et de partis politiques – une plateforme pour un débat constructif, l'innovation et la supervision. À travers ce Front populaire, nous renforcerons la démocratie tout en maintenant la stabilité politique."
SOV_the_onf_TT: "§YLa large coalition§ ! de partis sera créée pour assurer §Yla stabilité politique !§ !"

#Democracy by PAKMAN
SOV_preserve_working_system: "Préserver le système fonctionnel"
SOV_preserve_working_system_desc: "Certains soutiennent que le seul moyen d'atteindre un système fédéral équitable est d'accorder une autonomie maximale aux régions ou de réformer complètement la structure actuelle. Nous pensons autrement. Le système fédéral actuel, bien que discrédité par les régimes autoritaires passés, est fondamentalement solide. Grâce à des réformes démocratiques et réfléchies, nous pouvons libérer tout son potentiel et garantir qu'il fonctionne pour tous les Russes."

SOV_more_fair_taxation: "Fiscalité plus équitable"
SOV_more_fair_taxation_desc: "Un défaut critique de notre système actuel réside dans la fiscalité régionale. Actuellement, les impôts sont collectés localement, envoyés au gouvernement fédéral, puis redistribués – souvent de manière inéquitable. Ce système concentre la richesse dans certaines régions clés tout en laissant d'autres sous-développées. Nous devons réformer ce processus pour permettre aux régions de contrôler une part équitable de leurs propres ressources. Cela favorisera un développement équilibré et réduira les inégalités économiques et les sentiments séparatistes."

SOV_equal_regions: "Égalité des régions"
SOV_equal_regions_desc: "Il n'est pas nécessaire de démanteler ou de modifier radicalement notre structure fédérale. Ce dont nous avons besoin, c'est d'un engagement renouvelé envers une gouvernance démocratique et une égalité des chances pour toutes les régions. En abordant les abus passés et en entreprenant des réformes globales, nous pouvons créer un système où chaque région, quelle que soit sa taille ou sa richesse, a une voix et les outils pour prospérer."

SOV_what_we_dreamt_about: "Notre rêve"
SOV_what_we_dreamt_about_desc: "Nous avons réalisé ce que les architectes originaux du fédéralisme russe n'ont qu'imaginé. Notre système est maintenant fonctionnel, démocratique et équitable. Le succès de nos réformes prouve que la Russie peut maintenir l'unité et l'égalité sans abandonner ses fondations fédérales. C'est la Russie dont nous rêvions – forte, libre et équitable pour tous."

SOV_idea_russian_federalism: "Système fédéral russe"
SOV_idea_russian_federalism_1: "Système fédéral russe"
SOV_idea_russian_federalism_2: "Système fédéral russe"

SOV_new_form_of_the_gov: "La nouvelle forme de gouvernement"
SOV_new_form_of_the_gov_desc: "Des décennies de contrôle autoritaire ont érodé les principes démocratiques qui guidaient autrefois notre gouvernement. La branche exécutive a acquis un pouvoir incontrôlé. Il est de notre devoir de réévaluer et de rééquilibrer les rôles des organes centraux du gouvernement. Ce n'est qu'en rétablissant des freins et contrepoids démocratiques que nous pourrons créer un gouvernement qui sert véritablement le peuple."

SOV_empower_duma: "Renforcer l'Assemblée fédérale"
SOV_empower_duma_desc: "Bien que les pouvoirs du président puissent sembler limités sur le papier, en pratique, ils permettent la manipulation de toutes les branches du gouvernement. Pour préserver la démocratie, nous devons amender la constitution pour limiter l'autorité présidentielle. Nous rendrons le poste cérémoniel ou l'éliminerons entièrement, transférant le véritable pouvoir législatif à l'Assemblée fédérale."

SOV_mixed_system: "Le système mixte"
SOV_mixed_system_desc: "Le système semi-présidentiel actuel de la Russie est enraciné dans les principes libéraux occidentaux, en particulier ceux inscrits dans la Constitution de 1993. Les critiques affirment qu'il favorise la dictature, mais avec les bons amendements, nous pouvons renforcer les freins et contrepoids sans une refonte complète. En affinant le système, nous empêcherons la concentration du pouvoir tout en préservant la continuité institutionnelle."

SOV_all_powers_to_the_presidents: "Tous les pouvoirs au président"
SOV_all_powers_to_the_presidents_desc: "Beaucoup pensent que la Russie fonctionne comme une république présidentielle de facto, le président détenant la majeure partie de l'autorité pratique. Ce modèle peut encore fonctionner dans une démocratie s'il est restructuré soigneusement. Nous ajusterons la constitution pour faire du président le chef formel de la branche exécutive, absorbant les fonctions du Premier ministre et rationalisant la gouvernance."

SOV_changes_in_the_constitution: "Constitution véritablement démocratique"
SOV_changes_in_the_constitution_desc: "Après une délibération approfondie, nous sommes prêts à mettre en œuvre une nouvelle vague d'amendements constitutionnels. Ces changements redéfiniront la structure du pouvoir étatique, consacreront les principes démocratiques et garantiront les libertés civiles. Surtout, ils préserveront la liberté d'expression et empêcheront l'abus d'autorité pour les générations à venir."

SOV_semipres_focus_TT: "Nous resterons une république semi-présidentielle"
SOV_parliament_focus_TT: "Nous deviendrons une république parlementaire"
SOV_president_focus_TT: "Nous deviendrons une république présidentielle"

SOV_idea_parliamentary_republic: "République parlementaire"
SOV_idea_presidential_republic: "République présidentielle"
SOV_idea_semi_presidential_republic: "République semi-présidentielle"

SOV_freind_kyr: "Amitié avec le Kirghizistan"
SOV_freind_kyr_desc: "Renforcer notre influence en Asie centrale est l'une de nos priorités stratégiques. En resserrant les liens avec le Kirghizistan, nous pouvons construire des partenariats durables avec les États post-soviétiques et stabiliser la région."

SOV_freind_kaz: "Amitié avec le Kazakhstan"
SOV_freind_kaz_desc: "Renforcer notre influence en Asie centrale est l'une de nos priorités stratégiques. Le Kazakhstan occupe une position clé dans la région, et une relation bilatérale forte bénéficiera à nos deux nations."

SOV_freind_uzb: "Amitié avec l'Ouzbékistan"
SOV_freind_uzb_desc: "Renforcer notre influence en Asie centrale est l'une de nos priorités stratégiques. Construire un partenariat étroit avec l'Ouzbékistan apportera des bénéfices économiques et diplomatiques mutuels."

SOV_freind_taj: "Amitié avec le Tadjikistan"
SOV_freind_taj_desc: "Renforcer notre influence en Asie centrale est l'une de nos priorités stratégiques. Renouveler les liens avec le Tadjikistan contribuera à assurer la paix, la coopération et le développement partagé dans la région."

SOV_freind_trk: "Amitié avec le Turkménistan"
SOV_freind_trk_desc: "Renforcer notre influence en Asie centrale est l'une de nos priorités stratégiques. Des relations plus étroites avec le Turkménistan nous aideront à favoriser la coopération régionale et la confiance mutuelle."

SOV_attack_uzb: "Apporter la démocratie en Ouzbékistan"
SOV_attack_uzb_desc: "Une grande partie de l'Asie centrale reste sous l'emprise de leaders autoritaires qui gouvernent comme des khans modernes. Nous agirons pour instaurer une véritable gouvernance démocratique en Ouzbékistan et libérer son peuple de l'autocratie."

SOV_attack_kaz: "Apporter la démocratie au Kazakhstan"
SOV_attack_kaz_desc: "Une grande partie de l'Asie centrale reste sous l'emprise de leaders autoritaires qui gouvernent comme des khans modernes. Le Kazakhstan mérite un avenir bâti sur la liberté, les droits humains et les institutions démocratiques."

SOV_attack_kyr: "Apporter la démocratie au Kirghizistan"
SOV_attack_kyr_desc: "Une grande partie de l'Asie centrale reste sous l'emprise de leaders autoritaires qui gouvernent comme des khans modernes. Le Kirghizistan doit avoir une chance de prospérer grâce à de véritables réformes démocratiques."

SOV_attack_trk: "Apporter la démocratie au Turkménistan"
SOV_attack_trk_desc: "Une grande partie de l'Asie centrale reste sous l'emprise de leaders autoritaires qui gouvernent comme des khans modernes. Le peuple du Turkménistan mérite un système où ses voix sont entendues et respectées."

SOV_attack_taj: "Apporter la démocratie au Tadjikistan"
SOV_attack_taj_desc: "Une grande partie de l'Asie centrale reste sous l'emprise de leaders autoritaires qui gouvernent comme des khans modernes. Le Tadjikistan doit avoir l'opportunité d'embrasser un avenir plus lumineux et plus démocratique."

SOV_support_democracy_in_georgia: "Soutenir la démocratie en Géorgie"
SOV_support_democracy_in_georgia_desc: "La Géorgie se trouve à la frontière du développement démocratique dans le Caucase. Nous soutiendrons ses efforts pour renforcer les institutions démocratiques et promouvoir les libertés politiques pour tous ses citoyens."

SOV_state_investments: "Investissements étatiques en Géorgie"
SOV_state_investments_desc: "En investissant en Géorgie, nous renforçons notre présence dans le Caucase et favorisons la croissance économique chez un partenaire clé. Ces investissements renforceront la stabilité et la coopération mutuelle dans la région."

SOV_naval_base_in_georgia: "Base navale en Géorgie"
SOV_naval_base_in_georgia_desc: "Établir une base navale sur la côte géorgienne renforcera considérablement notre capacité à surveiller et contrôler la région de la mer Noire. Malgré le déplacement des frontières russes plus au nord, sa présence navale dans la mer Noire reste vitale et permanente. Cette base sécurisera nos intérêts stratégiques et renforcera la sécurité régionale."

SOV_mediate_ossetianabkhaz_question: "Médiation de la question osséto-abkhaze"
SOV_mediate_ossetianabkhaz_question_desc: "Le conflit de longue date entre l'Ossétie et l'Abkhazie ne correspond plus à la réalité géopolitique moderne. Nous devons agir en tant que médiateur neutre pour aider à apaiser les tensions et favoriser la paix dans le Caucase, en promouvant la stabilité et la coopération entre toutes les parties impliquées."

SOV_friendship_armenia: "Amitié avec l'Arménie"
SOV_friendship_armenia_desc: "Renforcer notre relation avec l'Arménie est essentiel. En tant que partenaire historique et régional proche, l'Arménie mérite une attention accrue pour approfondir les liens politiques, économiques et culturels."

SOV_friendship_azerbaijan: "Amitié avec l'Azerbaïdjan"
SOV_friendship_azerbaijan_desc: "Améliorer les relations avec l'Azerbaïdjan, principale puissance pétrolière du Caucase du Sud, est une démarche stratégique. Une coopération renforcée bénéficiera aux deux pays et aidera à stabiliser la région économiquement et politiquement."

SOV_invest_in_arm_it: "Investir en Arménie"
SOV_invest_in_arm_it_desc: "Investir en Arménie favorisera le développement économique et renforcera notre influence dans le Caucase. Un soutien ciblé peut stimuler les infrastructures, l'industrie et la coopération bilatérale."

SOV_invest_in_aze_oil: "Investir dans le pétrole azerbaïdjanais"
SOV_invest_in_aze_oil_desc: "Développer les champs pétrolifères de l'Azerbaïdjan est crucial pour approfondir la coopération interétatique. Cet investissement sécurisera les ressources énergétiques et renforcera les liens économiques entre nos nations."

SOV_decide_side: "Choisir notre camp"
SOV_decide_side_desc: "Bien que nous nous efforcions de maintenir des relations équilibrées avec tous les pays post-soviétiques du Caucase, le conflit non résolu entre l'Arménie et l'Azerbaïdjan nous oblige à faire un choix. Il est impossible de soutenir les deux parties de manière égale dans ce différend régional complexe."

SOV_support_artsakh: "Soutenir l'Artsakh"
SOV_support_artsakh_desc: "Nos sympathies penchent vers l'Arménie, qui reste notre partenaire le plus proche et le plus amical dans le Caucase. Soutenir l'Artsakh reflète notre engagement envers cette alliance et envers la protection des nations amies dans la région."

SOV_support_azerbaijan: "Soutenir l'Azerbaïdjan"
SOV_support_azerbaijan_desc: "Malgré notre amitié historique avec l'Arménie, nous devons également considérer les réalités économiques et stratégiques. La position forte de l'Azerbaïdjan et ses vastes réserves pétrolières en font un partenaire vital dont les intérêts ne peuvent être ignorés."

SOV_invite_shah: "Inviter le Shah"
SOV_invite_shah_desc: "La situation politique en Iran est de plus en plus instable. Inviter le prince héritier pourrait nous fournir un allié précieux et aider à rétablir l'ordre. Son retour pourrait influencer l'équilibre des pouvoirs en notre faveur dans ces temps incertains."

SOV_support_the_reformists: "Soutenir les réformistes"
SOV_support_the_reformists_desc: "La faction réformiste en Iran correspond mieux à nos intérêts et à notre vision pour la région. Les soutenir pourrait conduire à des politiques plus modérées et à un partenariat stable bénéfique pour les deux parties."

SOV_invest_in_iran: "Investir en Iran"
SOV_invest_in_iran_desc: "L'Iran offre des opportunités économiques significatives que nous ne pouvons ignorer. En investissant dans son développement, nous pouvons sécuriser des rendements profitables et renforcer notre influence dans la région."

SOV_neutral_relations: "Relations neutres"
SOV_neutral_relations_desc: "La paix est préférable au conflit. Nous poursuivrons nos objectifs par la diplomatie et la coopération, évitant la guerre et favorisant la stabilité dans la région."

SOV_passage_through_caucasus: "Passage à travers le Caucase"
SOV_passage_through_caucasus_desc: "Sécuriser un passage sûr à travers le Caucase du Sud renforcera notre position stratégique tout en maintenant des liens amicaux avec l'Iran. Cette solution équilibre nos intérêts régionaux et favorise la coopération."

SOV_animosity_to_iran: "Hostilité envers l'Iran"
SOV_animosity_to_iran_desc: "La persécution de son peuple par le gouvernement iranien a créé une hostilité envers nous. Cette animosité fait de l'Iran un voisin inamical et imprévisible que nous devons approcher avec prudence."

SOV_ignite_revolution_in_iran: "Déclencher une révolution en Iran"
SOV_ignite_revolution_in_iran_desc: "Nous avons maintenant une opportunité de soutenir la libération du peuple iranien. Déclencher une révolution alignera la région plus étroitement avec nos intérêts et favorisera une plus grande stabilité en notre faveur."

SOV_poland_relations: "Amitié russo-polonaise"
SOV_poland_relations_desc: "Il est temps de dépasser les anciens conflits et de construire un monde slave plus fort avec nos voisins polonais. La coopération avec la Pologne apportera des bénéfices mutuels et une stabilité régionale."

SOV_befriend_france: "Amitié avec la France"
SOV_befriend_france_desc: "Renforcer les liens avec la France est essentiel pour atteindre nos ambitions mondiales. Un partenariat étroit favorisera la paix et la coopération sur la scène internationale."

SOV_mutual_def_poland: "Coopération avec la Pologne"
SOV_mutual_def_poland_desc: "La Pologne représente un partenaire commercial précieux. Renforcer la coopération économique et diplomatique renforcera notre influence régionale et notre prospérité mutuelle."

SOV_befriend_germany: "Amitié avec l'Allemagne"
SOV_befriend_germany_desc: "La puissance économique de l'Allemagne en fait un partenaire vital pour nous. Développer des relations solides offrira de nombreux avantages et renforcera notre position en Europe et au-delà."

SOV_peugeout: "Peugeot"
SOV_peugeout_desc: "Peugeot est l'un des principaux constructeurs automobiles français et une composante clé de PSA Peugeot Citroën, la deuxième plus grande entreprise automobile en Europe en 2007. S'associer avec eux offre un grand potentiel pour la coopération industrielle."

SOV_volkswagen: "Volkswagen"
SOV_volkswagen_desc: "Volkswagen est un constructeur automobile allemand emblématique. Chaque Russe mérite d'avoir accès à des véhicules de qualité comme ceux-ci, qui symbolisent la modernité et la fiabilité."

SOV_us_brotherhood: "Amitié russo-américaine"
SOV_us_brotherhood_desc: "Nous devons mettre de côté les animosités de la Guerre froide et construire une nouvelle relation prometteuse avec les États-Unis. Ensemble, nous pouvons créer un monde plus sûr et plus prospère pour tous."

 SOV_us_russia_defence_pact: "Traité de défense russo-américain"
SOV_us_russia_defence_pact_desc: "En signant ce traité, nous mettrons fin à des décennies de rivalité entre les États-Unis et la Russie. Ce pacte historique ouvrira la voie à une paix durable et à une sécurité mondiale."

SOV_ger_nuclear_deal: "Accord nucléaire avec l'Occident"
SOV_ger_nuclear_deal_desc: "Le moment est venu de signer un nouveau traité sur les armes stratégiques. Cet accord réduira les tensions nucléaires et marquera un nouveau chapitre dans nos relations avec les puissances occidentales."

SOV_democratic_constitution: "Constitution démocratique"
SOV_democratic_constitution_desc: "Notre constitution a maintenant été transformée en un document véritablement démocratique. Elle garantit les droits civils fondamentaux tels que la liberté d'expression, de réunion, de religion, ainsi que le droit de vote et de participer à la vie politique. De plus, elle définit clairement le rôle de la Russie dans les affaires internationales et offre des garanties pour la protection sociale dans tous les secteurs de la société."

russia.77.t: "Investissements en provenance de Russie"
russia.77.d: "La Russie propose des investissements pour soutenir notre économie. Accepter cette proposition bénéficiera grandement à notre nation, renforçant nos fondations économiques et ouvrant de nouvelles opportunités de croissance."
russia.77.o1: "Super, nous sommes partants !"
russia.77.o2: "Non, nous sommes capables de nous développer seuls."

russia.78.t: "Notre offre a été acceptée"
russia.78.d: "Ils ont accepté notre proposition, marquant une étape positive dans notre coopération et notre développement mutuel."
russia.78.o1: "OURAAA !"

russia.79.t: "Notre offre a été rejetée"
russia.79.d: "Malheureusement, notre offre a été refusée, ce qui signifie que nous devrons reconsidérer notre approche et chercher d'autres opportunités."
russia.79.o1: "Dommage"

russia.83.t: "Une proposition pour résoudre notre ancien conflit avec la Géorgie"
russia.83.d: "La Russie a proposé de signer un accord visant à apaiser les tensions et à désamorcer le conflit de longue date dans la région. Cette offre représente une opportunité d'améliorer la stabilité et d'éviter de nouvelles hostilités. Bien que la Russie laisse entendre qu'elle s'attend à notre acceptation, nous devons examiner attentivement si cet accord protège véritablement notre souveraineté et nos intérêts."
russia.83.o1: "Nous acceptons"
russia.83.o2: "Non, nous avons gagné notre indépendance et nous la défendrons !"

russia.80.t: "Investissement dans notre industrie énergétique"
russia.80.d: "La Russie propose des investissements pour développer notre secteur énergétique, en échange d'une plus grande influence. Accepter cet accord renforcerait notre infrastructure énergétique et approfondirait nos liens économiques avec la Russie. Cependant, nous devons peser les avantages par rapport à la perte potentielle de contrôle sur cette industrie vitale."
russia.80.o1: "Bien sûr, le pétrole azerbaïdjanais doit prospérer !"
russia.80.o2: "La Russie ? Pff !"

russia.81.t: "Notre offre a été acceptée"
russia.81.d: "Ils ont accepté notre proposition, marquant un développement positif dans notre relation. Cette acceptation ouvre de nouvelles possibilités de coopération et de bénéfices mutuels dans un avenir proche."
russia.81.o1: "OURAAA !"

russia.82.t: "Notre offre a été rejetée"
russia.82.d: "Malheureusement, notre offre a été refusée. Ce revers signifie que nous devons revoir nos stratégies et envisager d'autres approches pour faire avancer nos intérêts."
russia.82.o1: "Ça valait le coup d'essayer"

russia.84.t: "La Russie exprime son soutien envers nous"
russia.84.d: "Les dirigeants russes ont publiquement déclaré leur soutien à notre gouvernement et exprimé leur volonté de renforcer les liens diplomatiques et amicaux. Ce soutien pourrait ouvrir la voie à une coopération accrue et à une stabilité régionale."
russia.84.o1: "Aouè !"

russia.85.t: "L'apparition de l'ancien Shah d'Iran"
russia.85.d: "Des rapports indiquent que l'ancien Shah d'Iran, qui nourrit toujours des ambitions de reprendre le pouvoir, a refait surface. Son retour pourrait avoir un impact significatif sur le paysage politique iranien et les dynamiques régionales, nous obligeant à réévaluer nos stratégies dans la région."
russia.85.o1: "Intéressant"

russia.86.t: "Le pacte de défense mutuelle russo-américain"
russia.86.d: "Après une période de rapprochement, nous avons maintenant l'opportunité de signer un pacte de défense mutuelle avec la Russie, visant à garantir une paix durable entre nos nations. Ce pacte symboliserait une avancée majeure dans la coopération internationale et la stabilité."
russia.86.o1: "C'est la meilleure décision que nous puissions prendre"
russia.86.o2: "Il ne peut y avoir qu'une seule superpuissance dans le monde, et c'est nous !"

russia.89.t: "Accord nucléaire"
russia.89.d: "La Russie propose que nous concluions un traité axé sur la sécurité nucléaire stratégique. Un tel accord renforcerait notre position commune sur la non-prolifération nucléaire et réduirait le risque de conflit nucléaire dans la région et au-delà."
russia.89.o1: "Nous acceptons"
russia.89.o2: "Non, ce n'est pas ce que nous voulons"

russia.90.t: "Accord nucléaire"
russia.90.d: "[FROM.GetNameWithFlag] a formellement accepté l'accord nucléaire. Cela marque une étape importante dans nos efforts pour assurer la sécurité régionale et promouvoir la paix."
russia.90.o1: "Bien"

russia.91.t: ""
russia.91.d: ""
russia.91.o1: ""

russia.92.t: "Le pacte de défense mutuelle russo-polonais"
russia.92.d: "La Russie a proposé de signer un pacte de défense mutuelle avec la Pologne, signalant un possible dégel des relations. Bien que certains responsables gouvernementaux restent prudents, craignant une domination russe en Europe de l'Est, cet accord pourrait inaugurer une nouvelle ère de coopération et de sécurité pour notre pays."
russia.92.o1: "Il est temps de pardonner à la Russie"
russia.92.o2: "La Russie reste la Russie. Rejetons le pacte !"

russia.93.t: "La Pologne a accepté !"
russia.93.d: "Le gouvernement polonais a officiellement accepté de signer le pacte de défense mutuelle avec la Russie. Cet accord reflète une volonté de surmonter les différends passés et de travailler ensemble pour une sécurité mutuelle."
russia.93.o1: "Les frères slaves frappent à nouveau !"

russia.94.t: "La Pologne a refusé !"
russia.94.d: "Le gouvernement polonais a refusé de signer le pacte de défense mutuelle, maintenant une position prudente envers la Russie. Bien que décevant, cette décision reflète des préoccupations persistantes concernant les dynamiques de pouvoir régionales."
russia.94.o1: "C'est leur choix"

russia.95.t: "Base navale russe"
russia.95.d: "La Russie a proposé de construire une base navale sur notre territoire. Une telle base renforcerait notre partenariat stratégique et améliorerait la sécurité régionale, mais elle pourrait également soulever des inquiétudes concernant la souveraineté et l'influence militaire."
russia.95.o1: "Construisez autant que vous voulez !"
russia.95.o2: "La Russie reste la Russie. Rejetons l'offre !"

russia.96.t: "La Géorgie a autorisé !"
russia.96.d: "La Géorgie a autorisé l'établissement d'une base navale russe sur son territoire. Cette décision pourrait améliorer les relations bilatérales et renforcer la coopération en matière de sécurité dans la région."
russia.96.o1: "Spasibo, frères !"

russia.97.t: "La Géorgie a refusé !"
russia.97.d: "La Géorgie a refusé notre demande de construire une base navale russe. Ce refus reflète des tensions persistantes et des priorités stratégiques divergentes qui nécessiteront une diplomatie prudente pour être gérées."
russia.97.o1: "C'est leur choix"

#A Just Russia
SOV_a_just_russia: "Une Russie juste"
SOV_a_just_russia_desc: "Une Russie juste a été fondée en 2006-2007 par la fusion de plusieurs partis politiques de gauche. Initialement, beaucoup pensaient qu'il s'agissait d'un projet contrôlé par l'administration présidentielle pour simuler une compétition politique. Cependant, ces suppositions se sont révélées fausses lorsque Une Russie juste a remporté une majorité significative aux élections, surprenant beaucoup et remodelant le paysage politique. La montée du parti reflète un véritable soutien populaire et un désir de justice sociale."

SOV_direction: "Orientation du parti"
SOV_direction_desc: "Après notre arrivée au pouvoir, la question de l'orientation de notre parti est devenue urgente. Bien que nous partagions de nombreuses valeurs fondamentales, deux factions principales ont émergé : les partisans du mouvement libéral 'Bande Blanche' et les défenseurs du patriotisme social. Ces visions divergentes seront débattues lors du prochain congrès du parti, qui décidera finalement de notre futur chemin. Cette décision façonnera les politiques et les priorités de notre parti à l'avenir."

SOV_white_stripe_movement_preveil: "Le mouvement Bande Blanche l'emporte"
SOV_white_stripe_movement_preveil_desc: "Le congrès du parti a choisi de soutenir l'agenda du mouvement Bande Blanche, axé sur une démocratisation plus profonde et des liens plus étroits avec l'Occident. Ce chemin aligne le parti sur la social-démocratie de style européen et embrasse des réformes visant à accroître les libertés politiques et la modernisation. Cette décision signale un engagement envers l'ouverture, la transparence et la coopération avec les nations démocratiques."

SOV_russian_democracy: "Démocratie sociale russe"
SOV_russian_democracy_desc: "La quête de justice et de réforme sociale a longtemps été une passion déterminante du peuple russe. Tout au long de l'histoire, les Russes ont gravité vers des idées d'égalité, de liberté et de justice sociale. Cette tendance s'est poursuivie après l'effondrement de l'Union soviétique, les citoyens se ralliant derrière des mouvements promettant des réformes significatives. Maintenant au pouvoir, nous avons la responsabilité de réaliser ces espoirs et de les traduire en progrès social et démocratique réels."

SOV_democratisation: "Réduire la dépendance au centre fédéral"
SOV_democratisation_desc: "Les réformateurs sociaux ont constamment défendu le fédéralisme et la décentralisation comme clés d'une Russie équitable et fonctionnelle. Pour atteindre un développement équilibré à travers le pays, il est essentiel de réduire la dépendance régionale envers le centre fédéral. En dotant les gouvernements locaux de plus d'autonomie et de ressources, nous favoriserons l'égalité et une gouvernance plus réactive dans toutes les régions."

SOV_real_welfare: "Un véritable bien-être social"
SOV_real_welfare_desc: "La réforme du système de bien-être est une priorité absolue pour notre gouvernement. Pendant trop longtemps, les gens ordinaires ont souffert en raison de réformes de marché ratées et de programmes d'assurance sociale inadéquats. Nous nous engageons à réformer la sécurité sociale pour mieux protéger les citoyens vulnérables et améliorer leur qualité de vie. Notre objectif est un système qui répond véritablement aux besoins de la majorité, et non seulement des privilégiés."

SOV_empower_legislature: "Héritier de l'Assemblée constituante russe"
SOV_empower_legislature_desc: "L'Assemblée constituante russe fut le premier organe véritablement représentatif destiné à façonner l'avenir du pays. Bien qu'elle ait été interrompue par les bolcheviks, son héritage a inspiré la création de la Douma d'État en tant que parlement du peuple. Malheureusement, la Douma a depuis perdu beaucoup de sa crédibilité et de son influence. Il est temps de restaurer la foi en cette institution en lui accordant de réels pouvoirs et en assurant une véritable représentation populaire."

SOV_defend_people: "Défendre notre peuple"
SOV_defend_people_desc: "Il est douloureux de voir des mères célibataires lutter pour acheter des médicaments pour leurs enfants ou des familles nombreuses accablées par des prêts à taux élevé pour de petits appartements. La pauvreté se répand dans nos régions pendant que les banques et les entreprises s'enrichissent. Pour combattre cette injustice, nous devons construire un système de prestations sociales et de garanties qui protège nos citoyens de la misère. Chaque personne mérite dignité et protection."

SOV_social_gurantees: "Garanties sociales et santé"
SOV_social_gurantees_desc: "Le système de sécurité sociale de la Russie fait face à deux défis majeurs : la provision des retraites et un réseau de santé défaillant. De nombreux citoyens âgés ne peuvent pas se permettre les médicaments nécessaires, et les hôpitaux échouent souvent à fournir des soins adéquats. Nous augmenterons le financement et les subventions pour garantir aux retraités un niveau de vie décent et pour que les services de santé deviennent accessibles et fiables pour tous."

SOV_a_just_system: "Un système juste"
SOV_a_just_system_desc: "Notre vision est une société où chaque individu compte, où les droits humains fondamentaux sont respectés et où la participation politique est encouragée. Nous aspirons à un système qui offre des élections équitables et des décisions prises dans l'intérêt de tous les citoyens. C'est le système juste envisagé par les révolutionnaires du passé – une société bâtie sur l'égalité, la liberté et la véritable démocratie."

SOV_a_just_economy: "Une économie juste"
SOV_a_just_economy_desc: "Notre plus grande ambition n'est pas seulement une économie prospère, mais une nation prospère. Chacun devrait bénéficier de la sécurité financière et de la protection sociale ; personne ne devrait être laissé pour compte. Pour construire une telle société, la richesse doit être distribuée équitablement, avec des impôts plus élevés sur les profits excessifs et des allégements pour les moins fortunés. Cette approche favorisera l'égalité et la justice sociale, jetant les bases d'un pays plus fort et plus uni."

SOV_question_of_direction: "Question de l'orientation"
SOV_question_of_direction_desc: "La question de l'orientation future de notre parti est devenue de plus en plus urgente. Certains soutiennent que nos réformes sociales n'ont pas été assez loin, plaidant pour des changements radicaux qui transforment complètement l'ordre social. D'autres estiment que nous devrions imiter les partis sociaux-démocrates européens à succès et poursuivre des réformes graduelles et pragmatiques. Le choix qui nous attend définira notre identité et influencera l'avenir de la nation."

SOV_revive_spirit_of_socialist_revolutionaries: "Raviver l'esprit des socialistes-révolutionnaires"
SOV_revive_spirit_of_socialist_revolutionaries_desc: "Les socialistes-révolutionnaires visaient à transformer radicalement la société russe à travers le socialisme agraire, croyant que les paysans étaient la force motrice de la révolution. Bien qu'Une Russie juste ne revendique pas une succession directe, nos réformes ont déclenché une transformation sociétale pacifique mais profonde, faisant écho à l'esprit de ces révolutionnaires historiques. Bien que leurs idées datent de plusieurs siècles, elles restent pertinentes aujourd'hui, nous incitant à envisager de rétablir officiellement le Parti socialiste-révolutionnaire."

SOV_land_socialisation: "La socialisation des terres"
SOV_land_socialisation_desc: "Un principe central du programme socialiste-révolutionnaire était la socialisation des terres, ce qui signifie que la terre appartiendrait collectivement à tous les Russes. Ce concept implique effectivement de transférer la propriété foncière à l'État, mais gérée équitablement pour le bénéfice du peuple. En tant que représentants du peuple, nous nous engageons à utiliser cette terre de manière équitable pour maximiser le bien-être public et la productivité agricole."

SOV_social_democracy_sr: "La social-démocratie toujours à la mode"
SOV_social_democracy_sr_desc: "La social-démocratie reste l'une des idées politiques les plus réussies à émerger de l'Europe. L'histoire montre de nombreux exemples où les politiques sociales-démocrates ont amélioré la vie des citoyens tout en maintenant une vitalité économique. En adoptant ces principes, nous pouvons mettre en œuvre des réformes efficaces qui favorisent la justice sociale et la prospérité pour tous les Russes."

SOV_third_way: "La troisième voie"
SOV_third_way_desc: "La gouvernance démocratique exige une négociation et un équilibre constants. De nombreux pays sociaux-démocrates sont passés des politiques gauchistes traditionnelles à des approches orientées vers le marché mais socialement responsables, connues sous le nom de 'troisième voie'. Cette philosophie combine des pratiques de marché libre avec des objectifs de bien-être social, créant un système équilibré adapté à nos besoins actuels. Adopter la troisième voie nous aidera à construire une économie moderne, efficace et équitable."

SOV_centre_holds: "Le centre reste fort"
SOV_centre_holds_desc: "L'agenda du Conseil central du parti a prévalu au congrès, adoptant un programme patriotique axé sur le renforcement de la souveraineté de la Russie, de l'autorité du gouvernement central et de l'unité nationale. Ce programme vise à transformer la Russie d'un État fragmenté et en difficulté en une superpuissance forte capable de défendre ses frontières et de protéger ses peuples divers. Il reflète un engagement envers la stabilité, le pouvoir et la fierté nationale."

SOV_russian_patriotism: "Patriotisme social russe"
SOV_russian_patriotism_desc: "Notre idéologie centrale repose sur le patriotisme social, qui met l'accent sur la création d'un État social souverain fort. Cet État doit défendre les intérêts de ses citoyens sur le plan international et national. Il est du devoir du gouvernement de fournir des conditions garantissant un niveau de vie élevé, tandis que les citoyens, en retour, doivent une loyauté à leur patrie en respectant les lois, en remplissant le service obligatoire et en préservant les traditions nationales. Cet équilibre entre droits et responsabilités est la base de notre vision pour une Russie prospère."

SOV_empower_nation: "Donner du pouvoir au peuple russe"
SOV_empower_nation_desc: "Nous définissons la nation russe non seulement par l'ethnicité, mais comme l'ensemble des peuples habitant les vastes territoires de la Russie. Cela inclut la région de la Volga, la Sibérie et le Caucase, dont les peuples partagent la langue, la culture et les valeurs russes. Cette nation russe multinationale doit être priorisée par l'État, représentant leurs intérêts collectifs. Les étrangers ne devraient pas revendiquer de privilèges spéciaux – la Russie appartient uniquement à sa nation russe diverse, unie et forte."

SOV_talks_with_rodina: "Négociations avec Rodina"
SOV_talks_with_rodina_desc: "Notre relation avec la faction Rodina est profonde, ayant autrefois formé un seul parti au début des années 2000. Les conflits internes ont fracturé le mouvement, menant à la formation d'Une Russie juste à partir de certains anciens membres de Rodina. Maintenant, avec des différences politiques atténuées et des programmes étroitement alignés, il est logique de rétablir les relations et de travailler à l'unification. Une telle unité renforcera notre capacité à mettre en œuvre des politiques communes efficacement."

SOV_form_national_patriotic_front: "Former le Front patriotique national"
SOV_form_national_patriotic_front_desc: "Bien que le peuple russe soit fort individuellement, nous sommes vulnérables lorsque nous sommes divisés. Unis, cependant, nous pouvons surmonter tout défi et façonner l'avenir de notre nation. Pour atteindre une force politique et une domination, nous devons former une large coalition de partis partageant des valeurs patriotiques et socialistes. Ce n'est qu'en nous unissant que nous pourrons construire une Russie prospère et indépendante capable de tenir tête sur la scène mondiale."

SOV_social_platform: "Prioriser la plateforme sociale"
SOV_social_platform_desc: "Un niveau de vie élevé est essentiel pour le développement de notre État. Lorsque les citoyens se sentent en sécurité et optimistes quant à leur avenir, la nation prospère. Notre gouvernement placera la politique sociale au premier plan, s'assurant que les gens reçoivent le soutien et les ressources nécessaires à leur bien-être. Investir dans des programmes sociaux, c'est investir dans la stabilité et la croissance de la Russie."

SOV_do_not_forget_about_people: "Ne pas oublier le peuple !"
SOV_do_not_forget_about_people_desc: "Le peuple est la véritable source de pouvoir dans notre pays, et nous devons toujours garder leurs besoins à l'esprit. Une nation heureuse et prospère peut accomplir de grandes réalisations, tandis qu'une population pauvre et négligée risque l'effondrement et les troubles. Nos politiques doivent prioriser l'amélioration de la vie de tous les citoyens pour sécuriser l'avenir de la Russie."

SOV_more_regulations: "Nationalisation des entreprises"
SOV_more_regulations_desc: "Pendant trop longtemps, les capitalistes ont exploité notre peuple et notre État, accumulant des richesses sans contribuer à la société. Les lois libérales ont permis un excès capitaliste incontrôlé, les profits allant uniquement à une poignée de privilégiés. Pour changer cela, nous nationaliserons les grandes industries et établirons des entreprises d'État pour contrôler l'orientation du marché. Cela nous permettra de mobiliser le pouvoir économique au bénéfice de tous les citoyens."

SOV_economical_platform: "Prioriser la plateforme économique"
SOV_economical_platform_desc: "Pour que notre peuple prospère et que la Russie s'épanouisse, une économie forte est indispensable. Aucune civilisation ne peut prospérer sans puissance et croissance économiques. Nous concentrerons nos efforts sur la reconstruction de la force économique de la nation en priorisant l'agenda économique du Front patriotique national. Restaurer la puissance économique de la Russie est la base d'une prospérité durable."

SOV_invest_in_beneficial_sectors: "Investir dans les secteurs bénéfiques"
SOV_invest_in_beneficial_sectors_desc: "Relancer la capacité productive du pays nécessite des investissements en capital significatifs. Par conséquent, nous devons canaliser les fonds vers les secteurs clés de l'économie qui promettent des rendements durables à long terme. En nous concentrant sur les industries qui stimuleront la croissance économique future, nous renforcerons le PIB de la Russie et sécuriserons un avenir économique stable pour notre nation."

SOV_rapid_militarisation: "Militarisation rapide"
SOV_rapid_militarisation_desc: "Un État souverain fort exige une armée puissante. Nous accélérerons la militarisation en intégrant la formation militaire dans les écoles et en organisant des activités militaires civiques obligatoires. Les dépenses de défense augmenteront pour garantir que l'armée puisse repousser toute invasion. L'État et le peuple russes doivent être préparés et unis pour défendre leur patrie contre toutes les menaces."

SOV_under_a_leader: "Sous un leader fort"
SOV_under_a_leader_desc: "L'État russe a historiquement été centré autour de leaders forts – des figures comme Ivan le Terrible, Alexandre III et Joseph Staline ont suscité un profond respect et façonné le destin de la nation. Aujourd'hui, le peuple et l'État ont besoin d'un leader tout aussi fort pour les unir derrière une grande mission nationale. Nous sommes prêts à fournir un tel leadership pour guider la Russie vers de nouveaux sommets."

SOV_talks_with_left_patriots: "Négociations avec les patriotes de gauche"
SOV_talks_with_left_patriots_desc: "Le parti des Patriotes de Russie de Gennady Semigin bénéficie d'un soutien populaire considérable et de ressources financières, prônant un patriotisme de gauche similaire au nôtre. Reconnaissant un allié naturel, nous entamerons des négociations pour intégrer les Patriotes de Russie dans le Front patriotique national. Leur inclusion renforcera notre coalition et leur assurera une représentation au gouvernement."

SOV_unite_patriotic_parties: "Unir les partis patriotiques"
SOV_unite_patriotic_parties_desc: "L'éclatement du parti Rodina a conduit à de nombreux petits partis partageant des idéaux patriotiques mais manquant d'influence seuls. Bien qu'individuellement faibles, l'expérience politique de leurs dirigeants peut être précieuse lorsqu'ils sont unis sous une cause commune. Nous intégrerons ces partis dans le Front patriotique national, leur offrant des rôles gouvernementaux pour consolider les forces patriotiques et amplifier leur impact."

SOV_a_just_russia_prevails: "Une Russie juste l'emporte"
SOV_a_just_russia_prevails_desc: "Au sein du Front patriotique national, Une Russie juste est restée la force dominante. Seule Une Russie juste possède l'unité, la vision et la force nécessaires pour maintenir la cohésion de la coalition et guider la Russie vers une véritable grandeur. Notre leadership garantira que le Front reste inébranlable et concentré sur la construction d'une nation forte et juste."

SOV_rodina_prevails: "Rodina l'emporte"
SOV_rodina_prevails_desc: "Rodina a reconstruit sa position politique et regagné la confiance des électeurs au sein de la coalition, renforçant suffisamment sa position pour revendiquer la direction du Front patriotique national. Cela marque le début d'une nouvelle ère, où Rodina mènera le Front et la Russie vers un avenir plus lumineux et plus prospère. L'unité de la coalition n'a jamais été aussi forte."

SOV_rodina_tt: "Rodina prendra la direction du FPN"
SOV_blr_democracy_tt: "Instaurera une démocratie en Biélorussie"

SOV_under_a_banner: "Sous la grande bannière"
SOV_under_a_banner_desc: "Les drapeaux de l'Empire russe, de l'Union soviétique et le tricolore russe moderne sont de puissants symboles de l'histoire de notre nation. Sous ces bannières, la Russie a atteint de grands sommets en matière de culture, d'économie, de science et de politique étrangère. Nos ancêtres ont fait des sacrifices héroïques sous ces drapeaux – de la guerre de Crimée à la Grande Guerre patriotique. Maintenant, sous le tricolore russe, nous nous efforcerons d'atteindre des réalisations et une gloire nationale encore plus grandes."

SOV_empower_executive: "Renforcer le président"
SOV_empower_executive_desc: "Nous avons longtemps soutenu que le bureau du président de la Russie est entravé par des restrictions excessives qui empêchent une gouvernance efficace. Pour mettre en œuvre pleinement les politiques de patriotisme social, ces limitations inutiles doivent être supprimées. Donner plus d'autorité au président est essentiel pour un leadership décisif et un progrès national."

SOV_united_country: "Patrie unie"
SOV_united_country_desc: "Atteindre nos objectifs nationaux exige l'unité du peuple russe. Ce n'est que par la solidarité que la Russie peut atteindre la grandeur et une prospérité durable. Les citoyens doivent se rallier autour d'une idéologie commune, d'un leader respecté et d'un État fort. Tant que le peuple russe reste uni, aucune force ne peut briser notre nation."

russia.87.t: "Notre offre a été acceptée"
russia.87.d: "Les États-Unis ont accepté de signer un traité de défense réciproque, marquant une étape significative vers une coopération militaire plus étroite entre nos nations. Cet accord promet de renforcer notre sécurité mutuelle et de favoriser une plus grande confiance sur la scène internationale."
russia.87.o1: "Excellent !"

SOV_investments_in_ben: "Investissement dans les secteurs bénéfiques"

russia.88.t: "Notre offre a été rejetée"
russia.88.d: "Malheureusement, notre proposition a été refusée. Bien que décevant, nous continuerons à chercher d'autres partenaires et opportunités pour faire avancer nos intérêts et renforcer notre position."
russia.88.o1: "Nous avons fait de notre mieux."

russia.98.t: "Affaires du parti"
russia.98.d: "Avec l'investiture d'Alexeï Navalny, les différences entre ses politiques et celles du parti Yabloko sont devenues de plus en plus évidentes. Bien que Navalny et Yabloko partagent des plateformes similaires, des différends persistent au sein de la direction du parti. Des rumeurs suggèrent que Navalny pourrait partir pour former sa propre organisation, soulevant des questions sur l'unité et l'orientation futures du parti."
russia.98.o1: "Le président Navalny restera dans Yabloko !"
russia.98.o2: "Le président Navalny créera son propre parti !"

russia.99.t: "Le parti de Navalny"
russia.99.d: "Après la démission de Navalny de Yabloko, ses proches alliés et membres du gouvernement ont convoqué un congrès d'urgence pour établir un nouveau parti. Le congrès a adopté le programme du parti à l'unanimité, mais un débat intense a surgi concernant le nom et le symbolisme du parti. Plusieurs options ont été proposées, avec trois principaux prétendants menant la discussion. Lequel sera choisi pour représenter ce nouveau mouvement ?"
russia.99.o1: "§YAlliance du peuple§ !"
russia.99.o2: "§YParti du progrès§ !"
russia.99.o3: "§YRussie de l'avenir§ !"

russia.100.t: "Conflit au sein du parti"
russia.100.d: "De sérieux désaccords ont émergé entre le président Navalny et la direction de Yabloko après son investiture. Le parti accuse Navalny d'avoir des vues nationalistes qui entrent en conflit avec sa plateforme. Bien que Navalny soit resté publiquement silencieux, les spéculations vont bon train sur son possible départ pour former un nouveau parti sous la bannière de 'NAROD'. Cependant, certains signes indiquent qu'il cherche un compromis pour éviter une scission. Le résultat reste incertain."
russia.100.o1: "Un compromis sera trouvé."
russia.100.o2: "Le nouveau Parti démocratique national émergera !"

russia.101.t: "Rebranding ?"
russia.101.d: "Notre parti fait face à un dilemme concernant son identité à mesure que nous progressons dans la démocratisation. De nombreux vétérans souhaitent conserver le nom historique du parti comme symbole de l'héritage, tandis que d'autres prônent la suppression du terme 'communiste' du titre pour refléter une direction plus moderne et démocratique. Ce débat met en lumière la tension entre tradition et changement au sein du parti."
russia.101.o1: "PCRF maintenant ! PCRF pour toujours !"
russia.101.o2: "Nous ne sommes plus staliniens !"

russia.102.t: "Retour de Gorbatchev ?"
russia.102.d: "Dans notre quête de réalignement politique, l'absence de Mikhaïl Gorbatchev – l'homme qui a initialement lancé ces réformes – se fait cruellement sentir. La question se pose : devrions-nous donner à Gorbatchev une seconde chance de diriger ou d'influencer ce processus ? Son héritage reste controversé."
russia.102.o1: "C'est un traître !"
russia.102.o2: "Vive Gorbatchev !"

russia.103.t: "Notre Corps d'Afrique a été engagé"
russia.103.d: "L'un de nos bataillons du Corps d'Afrique a été engagé par [FROM.GetNameWithFlag]. Cette coopération renforce nos liens et démontre le rôle international croissant de notre armée. Nous sommes impatients de poursuivre cette collaboration."
russia.103.a: "Bien"

russia.104.t: "Domination politique"
russia.104.d: "Notre gouvernement fait face au défi d'un système de partis fragmenté, entraînant un chaos au sein de la Douma d'État. Aucune force politique ne détient une majorité décisive, ce qui conduit à des luttes de pouvoir constantes. Au niveau régional, la fragmentation donne du pouvoir aux élites locales, affaiblissant le contrôle fédéral. Actuellement, trois forces principales existent : le parti pro-gouvernemental Unité, le bloc Patrie - Toute la Russie, et le parti réformiste Notre maison - Russie. Nous pouvons soit élargir les factions pro-gouvernementales pour former une coalition préservant une certaine démocratie, soit les unir en un seul 'Parti du pouvoir' pour assurer une plus grande centralisation et une gouvernance plus forte."
russia.104.o1: "La 'Coalition présidentielle' doit être créée !"
russia.104.o2: "Unissons-les."

russia.105.t: "Russie unie"
russia.105.d: "Après de longues négociations, un nouveau parti politique pro-gouvernemental, 'Russie unie', a été créé. Ce parti unit presque toute l'élite régionale et les fonctionnaires fédéraux loyaux envers nous. Grâce à cette unification, nous avons sécurisé une majorité à la fois à la Douma d'État et dans les parlements régionaux, nous permettant de faire passer des législations clés et de maintenir le contrôle sur la politique régionale."
russia.105.a: "Une nouvelle Russie nous attend !"

russia.106.t: "Une Russie juste"
russia.106.d: "Une nouvelle force politique nommée 'Une Russie juste' a émergé de l'unification de divers mouvements patriotiques de gauche. Son programme met l'accent sur le bien-être social, une participation accrue de l'État dans l'économie et la protection de la souveraineté nationale. Bien que certains soupçonnent que le parti a été créé pour absorber les électeurs anti-establishment, il a un potentiel significatif pour devenir un acteur influent dans le paysage politique évolutif de la Russie."
russia.106.a: "La voix du peuple !"

russia.107.t: "Nouveau peuple ?"
russia.107.d: "Un nouveau parti politique appelé Nouveau Peuple a été fondé, dirigé par l'éminent homme d'affaires Andreï Nechaev. Prônant la liberté d'expression, la démocratie libérale, les droits des entrepreneurs et la numérisation de l'économie et de la gouvernance, ce parti présente une vision moderne. Il reste à voir si Nouveau Peuple s'établira fermement dans le système politique russe ou s'estompera."
russia.107.a: "Nouveau peuple et ancien système"

SOV_the_party_TT: "Le parti au pouvoir sera changé !"
SOV_the_nonparty_TT: "Un nouveau parti apparaîtra."

sov_just_russia.1.t: "Le congrès du parti"
sov_just_russia.1.d: "Après sa victoire électorale impressionnante, Une Russie juste a tenu un congrès d'urgence pour déterminer l'orientation future du parti, la formation du gouvernement et les élections du Conseil central. Les délégués ont débattu de deux voies principales : poursuivre l'agenda pro-Bande Blanche ou adopter le programme de patriotisme social promu par la direction du parti. Le congrès décidera du destin du parti."
sov_just_russia.1.o1: "Le congrès a soutenu la direction du parti"
sov_just_russia.1.o2: "Le congrès a soutenu le mouvement Bande Blanche"

sov_just_russia.2.t: "Négociations avec la faction Rodina"
sov_just_russia.2.d: "Après de longues négociations entre les dirigeants d'Une Russie juste et de Rodina, un accord a été conclu : Rodina soutiendra le gouvernement actuel d'Une Russie juste, qui, en retour, promet de consulter Rodina sur toutes les décisions gouvernementales majeures. Les deux partis ont également convenu de commencer à former une large coalition d'organisations et de partis patriotiques."
sov_just_russia.2.o1: "Notre Rodina"

sov_just_russia.3.t: "Front patriotique national"
sov_just_russia.3.d: "Aujourd'hui, après un long processus de formation, les dirigeants de Rodina et d'Une Russie juste, aux côtés des chefs de syndicats et d'organisations publiques, ont annoncé la création du Front patriotique national – une large coalition populaire. Son idéologie principale est le patriotisme social, tel qu'articulé par Sergueï Mironov, visant des réformes socialistes et patriotiques pour transformer le pays. Selon l'accord de coalition, les partis membres peuvent participer aux discussions sur les affaires de l'État, et les grandes organisations peuvent demander des sièges au gouvernement. Rodina occupera un siège au gouvernement et plusieurs postes ministériels en tant que co-leader."
sov_just_russia.3.o1: "En avant ensemble – vers l'avenir !"

SOV_democracy_in_kaz: "Démocratie russe en [KAZ.GetNameWithFlag]"
SOV_democracy_in_kaz_desc: "Nous utiliserons l'élément de surprise pour lancer avec succès une opération en [KAZ.GetNameWithFlag]. Cependant, le temps est limité, donc une action rapide et décisive est cruciale pour son succès."
SOV_democracy_in_kyr: "Démocratie russe en [KYR.GetNameWithFlag]"
SOV_democracy_in_kyr_desc: "En utilisant des tactiques de surprise, nous prévoyons de frapper rapidement en [KYR.GetNameWithFlag]. La fenêtre pour commencer l'opération est étroite, donc la rapidité est essentielle."
SOV_democracy_in_taj: "Démocratie russe en [TAJ.GetNameWithFlag]"
SOV_democracy_in_taj_desc: "Nous tirerons parti de l'élément de surprise pour mener une opération efficace en [TAJ.GetNameWithFlag]. Agir rapidement est vital pour atteindre nos objectifs."
SOV_democracy_in_trk: "Démocratie russe en [TRK.GetNameWithFlag]"
SOV_democracy_in_trk_desc: "Notre stratégie implique une attaque surprise en [TRK.GetNameWithFlag]. L'opération doit commencer rapidement pour assurer le succès."
SOV_democracy_in_uzb: "Démocratie russe en [UZB.GetNameWithFlag]"
SOV_democracy_in_uzb_desc: "Nous emploierons la surprise pour lancer une opération réussie en [UZB.GetNameWithFlag], mais nous devons agir rapidement avant que l'opportunité ne se referme."

SOV_i_blin_idea: "Processeurs domestiques"

 rosgvardia_wagner: "Evgueni Prigojine a été tué"

SOV_wagner_rosguard_idea: "Les PMC Wagner au sein de la Rosgvardia"
SOV_rosguard_wagner: "Intégrer les PMC Wagner dans la Rosgvardia"
SOV_rosguard_wagner_desc: "Après la mort d'Evgueni Prigojine, ses PMC ont commencé à se désintégrer sous nos yeux. Certains sont restés en Biélorussie, beaucoup ont quitté, mais certains sont prêts à passer sous notre contrôle direct. Nous sommes prêts à en faire une partie de la Rosgvardia."

##########ARMY TREE##########
##########Focuses##########

SOV_groznyy_offensive: "Offensive de Grozny"
SOV_groznyy_offensive_desc: "La deuxième guerre de Tchétchénie a commencé en août 1999, lorsque des combattants tchétchènes de l'Ichkérie de facto indépendante ont infiltré le Daguestan voisin. La contre-attaque de l'armée russe a conduit à un siège de Grozny, qui devrait tomber d'ici fin janvier ou début février."

SOV_finish_1998_reforms: "Achever les réformes militaires de 1998"
SOV_finish_1998_reforms_desc: "Lancées sous le ministre de la Défense Igor Sergueïev, les réformes de 1998 ont classé les unités selon leur état de préparation au combat ou leur effectif en temps de paix et ont transformé certaines en bases de stockage d'équipements. Les forces aériennes et spatiales ont également été réorganisées."

SOV_2001_military_reforms: "Lancer les réformes militaires"
SOV_2001_military_reforms_desc: "Le ministre de la Défense Sergueï Ivanov a annoncé des réformes rendant les unités de volontaires constamment prêtes au combat tout en maintenant le système de conscription."

SOV_csto_training_exercises: "Exercices d'entraînement de l'OTSC"
SOV_csto_training_exercises_desc: "Notre alliance reste forte grâce à des exercices conjoints réguliers et à des entraînements."

SOV_black_gussard: "Hussards noirs"
SOV_black_gussard_desc: "La 15e brigade de fusiliers motorisés de la Garde séparée Alexandrienne est la seule brigade de maintien de la paix de la Russie au sein des forces terrestres."

SOV_2008_military_reforms: "Poursuivre les réformes militaires"
SOV_2008_military_reforms_desc: "Le ministère de la Défense a décidé de réduire davantage les effectifs des forces, diminuant le nombre de troupes pour accroître la flexibilité stratégique et tactique."

SOV_increased_arms_exports_2: "Augmentation des exportations d'armes"
SOV_increased_arms_exports_2_desc: "Les exportations d'armes ont toujours été vitales pour l'économie russe. Les revenus de ces transactions aideront à stimuler notre économie nationale, même si certaines armes tombent entre des mains douteuses."

SOV_reserve_officer_training_system: "Système de formation des officiers de réserve"
SOV_reserve_officer_training_system_desc: "Notre système de formation des officiers de réserve, obsolète, nécessite une réforme pour mieux préparer le personnel grâce à une éducation militaire améliorée."

SOV_kosmo_voiska: "Forces spatiales russes"
SOV_kosmo_voiska_desc: "Les forces spatiales russes constituent la branche spatiale des forces aérospatiales."

SOV_form_the_uac: "Former la UAC"
SOV_form_the_uac_desc: "Créée le 20 février 2006 par la fusion des principaux fabricants d'avions, la United Aircraft Corporation vise à optimiser la production et à réduire les pertes."

SOV_russian_airspace_forces: "Forces aérospatiales russes"
SOV_russian_airspace_forces_desc: "Après une période de déclin, notre force aérienne est maintenant équipée et prête à reconquérir la suprématie aérienne mondiale."

SOV_airforce_structure_change: "Réformes des structures"
SOV_airforce_structure_change_desc: "Des mises à jour du personnel sont en cours pour moderniser les rangs de notre force aérienne."

SOV_airforce_far_aviation: "Commandement de l'aviation à longue portée"
SOV_airforce_far_aviation_desc: "Nous établissons un nouveau commandement pour gérer les opérations aériennes sur de longues distances."

SOV_airforce_transport_aviation: "Aviation de transport militaire"
SOV_airforce_transport_aviation_desc: "L'aviation de transport militaire soutient le commandant en chef suprême en gérant les mouvements stratégiques et opérationnels des troupes et des approvisionnements."

SOV_airforce_space_forces_upgrade: "Réforme des forces spatiales"
SOV_airforce_space_forces_upgrade_desc: "Le secteur aéronautique en évolution nécessite des réformes dans toutes les branches des forces armées, y compris les forces spatiales."

SOV_air_rocket_defence: "Forces de défense aérienne et antimissile"
SOV_air_rocket_defence_desc: "Ce nouveau type de troupes protégera les actifs étatiques et militaires critiques contre les attaques aérospatiales."

SOV_missile_defense_investments: "Forces de missiles antiaériens"
SOV_missile_defense_investments_desc: "Ces forces protégeront les installations vitales et les troupes contre les frappes aériennes ennemies."

SOV_radio_defense_investments: "Troupes radiotechniques"
SOV_radio_defense_investments_desc: "Équipées de radars et de systèmes d'automatisation, ces troupes mènent des reconnaissances aériennes et fournissent des données radar aux organes de contrôle et aux unités de combat."

SOV_roscosmos_intel: "Groupement de satellites"
SOV_roscosmos_intel_desc: "Nous déploierons un réseau actif de satellites de reconnaissance pour fournir à nos forces des renseignements essentiels."

SOV_fighter_production: "Renforcer la production de chasseurs"
SOV_fighter_production_desc: "Plus de chasseurs signifient un ciel plus sûr et plus paisible."

SOV_uav_production: "Élargir la production de drones"
SOV_uav_production_desc: "Nous visons à déployer largement les drones dans nos forces."

SOV_bombers_production: "Augmenter la production de bombardiers"
SOV_bombers_production_desc: "Nos ennemis seront submergés par la puissance de nos bombardiers."

SOV_pakfa: "PAKFA"
SOV_pakfa_desc: "Nos chasseurs de la série SU figurent parmi les meilleurs au monde."

SOV_pakda: "PAKDA"
SOV_pakda_desc: "La série PAKDA comprend certains des bombardiers les plus avancés."

SOV_modernize_soviet_missile_stockpiles: "Amélioration des puits de lancement"
SOV_modernize_soviet_missile_stockpiles_desc: "Nos silos de missiles vieillissent et nécessitent des mises à jour opportunes."

SOV_hypersonic_missiles: "Missiles hypersoniques"
SOV_hypersonic_missiles_desc: "Voyageant à plus de Mach 5, les missiles hypersoniques ne laissent aucun temps pour la détection ou la riposte."

SOV_space_forces_improvement: "Plus d'investissements dans l'aviation"
SOV_space_forces_improvement_desc: "Nous augmenterons le financement de nos troupes spatiales."

SOV_mechanized_infantry_renovations: "Utiliser 'Armata' pour les APC et les IFV"
SOV_mechanized_infantry_renovations_desc: "Notre infanterie mécanisée repose actuellement sur des APC et des IFV soviétiques obsolètes, qui doivent être modernisés."

SOV_armata_universal_combat_platform: "Plateforme de combat universelle Armata"
SOV_armata_universal_combat_platform_desc: "La plateforme Armata est un véhicule lourd à chenilles modulaire de nouvelle génération destiné à remplacer les chars et les APC plus anciens."

SOV_reform_army: "Nouvelle réforme de l'armée"
SOV_reform_army_desc: "Il est temps de moderniser notre armée pour répondre aux normes de la guerre contemporaine."

SOV_armyreform_spec: "Les forces spéciales sont notre force"
SOV_armyreform_spec_desc: "Nous élargirons nos forces spéciales et améliorerons leur formation et leur équipement."

SOV_armyreform_anti_air: "Troupes de défense antiaérienne"
SOV_armyreform_anti_air_desc: "Ces troupes protègent nos forces et installations contre les attaques aériennes ennemies lors de diverses opérations."

SOV_armyreform_engineer: "Troupes du génie"
SOV_armyreform_engineer_desc: "Les troupes du génie réalisent des tâches d'ingénierie militaire spécialisées et mènent des opérations pour endommager les forces ennemies."

SOV_radioelectronic_warfare: "Troupes de guerre électronique"
SOV_radioelectronic_warfare_desc: "Ces unités mènent des opérations pour dominer l'espace aérien, protéger nos systèmes contre les interférences ennemies et perturber les communications ennemies."

SOV_railway_troops: "Troupes ferroviaires"
SOV_railway_troops_desc: "Les troupes ferroviaires assurent la défense de la Russie en gérant et en sécurisant le réseau ferroviaire."

SOV_armyreform_ipso: "Troupes d'opérations d'information"
SOV_armyreform_ipso_desc: "Ces troupes mènent des cyberattaques, gèrent les réseaux militaires et protègent les systèmes de communication contre les cybermenaces."

SOV_mto: "Créer des troupes de soutien logistique"
SOV_mto_desc: "Les troupes de soutien logistique fournissent une assistance technique et logistique à toutes les branches des forces armées."

SOV_arta: "L'artillerie est le dieu de la guerre"
SOV_arta_desc: "Nous maintiendrons le principe soviétique de la suprématie de l'artillerie, garantissant que notre artillerie reste la meilleure."

SOV_mechanize: "Mécanisation de l'armée"
SOV_mechanize_desc: "Notre armée doit être mobile et mécanisée, et nous consacrerons tous nos efforts à atteindre cet objectif."

SOV_ratnik_program: "Le programme Ratnik"
SOV_ratnik_program_desc: "Ratnik est un système d'équipement de combat avancé conçu pour améliorer la survivabilité et l'efficacité au combat des soldats grâce à une technologie moderne."

SOV_rostech: "Rostec"
SOV_rostech_desc: "Rostec est un conglomérat de défense appartenant à l'État dédié au développement, à la production et à l'exportation de technologies avancées."

SOV_rosoboronprom: "Rosoboronprom"
SOV_rosoboronprom_desc: "Rosoboronprom est le seul exportateur étatique russe de produits, services et technologies militaires et à double usage."

SOV_kbp: "KBP"
SOV_kbp_desc: "KBP est une entreprise de pointe de l'industrie de défense russe spécialisée dans la conception d'armes, basée à Tula."

SOV_tula_arms: "Armes de Tula"
SOV_tula_arms_desc: "Fondée par Pierre le Grand en 1712, l'usine d'armes de Tula a une longue histoire de production d'armes pour la Russie."

SOV_orsis: "Orsis"
SOV_orsis_desc: "Orsis, basée à Moscou, fabrique des fusils de précision à percussion centrale pour un usage militaire et civil."

SOV_lobaev_arms: "Lobaev Arms"
SOV_lobaev_arms_desc: "Lobaev Arms conçoit et produit des fusils de précision et des munitions, opérant dans l'oblast de Kalouga."

SOV_rosgvardia: "Former la Rosgvardia"
SOV_rosgvardia_desc: "La Garde nationale de Russie est une force militaire interne indépendante chargée de la sécurité des frontières, de la lutte contre le terrorisme, du contrôle des armes et de la protection de l'ordre public."

SOV_rosguard_start_org: "Commencer à former des brigades"
SOV_rosguard_start_org_desc: "Il est temps de commencer à assembler les premières brigades."

SOV_rosguard_armor: "Nouveaux véhicules blindés"
SOV_rosguard_armor_desc: "Dans le cadre des réformes, la Garde nationale acquerra de nouveaux véhicules blindés pour améliorer ses capacités de combat."

SOV_rosguard_military: "Commandement des forces de la Garde nationale"
SOV_rosguard_military_desc: "Cette organisation militaire étatique assure la sécurité publique et étatique et a évolué à partir des troupes internes du ministère des Affaires intérieures."

SOV_rosguard_occup: "Transformation des OMON et SOBR"
SOV_rosguard_occup_desc: "Les unités OMON et SOBR seront intégrées dans la Garde nationale, avec un effectif élargi et un équipement amélioré."

SOV_start_fleet_reforms: "Réformes de la marine russe"
SOV_start_fleet_reforms_desc: "Notre marine nécessite des réformes globales pour restaurer son efficacité."

SOV_cancel_unnecessary_projects: "Annuler les projets inutiles"
SOV_cancel_unnecessary_projects_desc: "Nous devons concentrer nos ressources sur les projets navals les plus critiques."

SOV_Updated_naval_doctrine: "Doctrine navale actualisée"
SOV_Updated_naval_doctrine_desc: "Il est temps de réviser notre doctrine navale pour répondre aux défis modernes."

SOV_begin_modernization_of_our_fleet: "Commencer la modernisation de notre flotte"
SOV_begin_modernization_of_our_fleet_desc: "Moderniser notre flotte est essentiel pour maintenir la force navale."

SOV_Optimize_our_fleet: "Optimiser notre flotte"
SOV_Optimize_our_fleet_desc: "Nous rationalisons les dépenses de la flotte pour libérer des fonds pour les mises à niveau nécessaires."

SOV_The_high_seas_fleet: "La flotte de haute mer"
SOV_The_high_seas_fleet_desc: "Nous visons à construire une marine de haute mer puissante, comparable à celle de la Grande-Bretagne."

SOV_form_yunarmiya: "Former la Yunarmiya"
SOV_form_yunarmiya_desc: "Yunarmiya, une organisation patriotique pour la jeunesse, aidera à inspirer les futures générations à soutenir l'armée."

SOV_pmc_gazproms: "PMC corporatives"
SOV_pmc_gazproms_desc: "Gazprom finance la création de ses propres bataillons de compagnies militaires privées."

SOV_pmc_redut: "PMC Redut"
SOV_pmc_redut_desc: "Redut est une PMC russe active en Ukraine, composée principalement de vétérans de diverses branches militaires et de renseignement avec une expérience de combat."

SOV_pmc_redut_coprs: "Le 1er Corps de volontaires"
SOV_pmc_redut_coprs_desc: "Suite à la mutinerie de Prigojine, le Premier Corps de volontaires a été formé, incluant de nombreux bataillons de volontaires supervisés par la PMC Redut."

SOV_storm_z: "Storm-Z"
SOV_storm_z_desc: "Nous recruterons des prisonniers pour servir dans notre propre unité militaire, transformant leur peine en une chance de se battre pour la patrie."

SOV_red_army: "Nouvelle Armée rouge"
SOV_red_army_desc: "La renaissance de l'Armée rouge symbolise un retour à la force et à la discipline, construisant une force capable de faire face aux menaces modernes."

SOV_pogran: "Relancer les anciens projets militaires"
SOV_pogran_desc: "Nous restaurerons plusieurs initiatives militaires oubliées depuis longtemps pour renforcer nos capacités de défense."

SOV_til_vs: "Relancer l'arrière des forces armées"
SOV_til_vs_desc: "Nos unités de logistique et de soutien sont la colonne vertébrale de l'armée. Revitaliser l'arrière garantira des opérations soutenues."

SOV_kafedra_return: "Restaurer les départements militaires"
SOV_kafedra_return_desc: "Les départements militaires dans les établissements d'enseignement seront rétablis pour former les futurs officiers et spécialistes."

SOV_fleet: "Glorieuse marine soviétique"
SOV_fleet_desc: "Nous visons à restaurer la tradition et la puissance de la marine soviétique, projetant notre pouvoir sur les mers."

SOV_rocketi: "Renforcer les forces de missiles stratégiques"
SOV_rocketi_desc: "Nos forces de missiles stratégiques sont la pierre angulaire de la dissuasion ; leur renforcement est vital pour la sécurité nationale."

SOV_aviatcia: "Renforcer la force aérienne"
SOV_aviatcia_desc: "Nous améliorerons les capacités de notre force aérienne, assurant la domination dans les cieux."

SOV_academy: "Restaurer les écoles militaires"
SOV_academy_desc: "Les académies militaires seront revitalisées pour former la prochaine génération de commandants et de spécialistes."

SOV_kirov: "L'armée est le moteur du progrès"
SOV_kirov_desc: "Une armée forte stimule le progrès et la stabilité nationaux. Nous veillerons à ce que nos forces montrent la voie."

SOV_special_o: "Forces spéciales 'O'"
SOV_special_o_desc: "Nous créerons une unité de forces spéciales d'élite chargée d'exécuter les missions les plus dangereuses et critiques en temps de guerre."

SOV_new_russia_army: "Nouvelle armée russe"
SOV_new_russia_army_desc: "L'ère moderne exige une armée moderne. Nous devons adapter nos forces pour répondre aux défis et technologies contemporains."

SOV_oligarch_pay_for_army: "Les oligarques investissent dans l'armée"
SOV_oligarch_pay_for_army_desc: "Nous avons obtenu un soutien financier de la part d'oligarques qui, en échange, seront protégés contre les poursuites."

SOV_more_yunarmy: "Expansion de la Jeune Armée"
SOV_more_yunarmy_desc: "Nous élargirons la Jeune Armée pour accroître sa portée et son efficacité en tant qu'outil d'éducation patriotique et de propagande."

SOV_propaganda_army: "Percée technologique"
SOV_propaganda_army_desc: "Nos progrès technologiques doivent correspondre à ceux du monde. L'armée montrera la voie en adoptant de nouvelles innovations."

SOV_leib_guard: "Réforme du régiment présidentiel"
SOV_leib_guard_desc: "Le régiment présidentiel sera transformé en Garde impériale, faisant revivre l'unité prestigieuse de l'ère de l'Empire russe."

SOV_ratnik_3: "Ratnik-3"
SOV_ratnik_3_desc: "Nous investirons massivement dans le programme Ratnik-3 pour équiper nos soldats avec l'équipement de combat le plus avancé et le plus récent."

SOV_pmc_patriot: "PMC Patriot"
SOV_pmc_patriot_desc: "Le ministère de la Défense prévoit de créer une nouvelle compagnie militaire privée pour élargir notre influence et nos capacités opérationnelles."

SOV_morpeh_vdv: "Réforme des forces aéroportées et des marines"
SOV_morpeh_vdv_desc: "Les marines et les troupes aéroportées nécessitent une restructuration pour répondre aux exigences de la guerre moderne. Nous mènerons des réformes globales."

SOV_uav_arms: "Troupes de drones"
SOV_uav_arms_desc: "Les drones sont un atout clé dans le combat moderne. Nous formerons un corps de drones dédié pour maximiser leur potentiel stratégique et tactique."

