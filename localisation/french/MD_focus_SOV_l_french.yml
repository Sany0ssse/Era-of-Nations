Sov_warsaw_pact.7.t: "Référendum sur l'unification en un seul pays"
Sov_warsaw_pact.7.d: "Les peuples tchèque et slovaque n'ont pas oublié comment, il y a peu de temps, leurs dirigeants les ont trompés en divisant leur pays sans avertissement. Une opportunité se présente maintenant pour corriger cette erreur historique et réunir à nouveau une nation forte. La Russie agira comme un médiateur neutre pour garantir un processus de référendum juste et sécurisé."
Sov_warsaw_pact.7.a: "Il est temps de s'unir !"

Sov_warsaw_pact.8.t: "Manifestations à travers la République tchèque et la Slovaquie"
Sov_warsaw_pact.8.d: "Des manifestations massives ont éclaté à travers la Slovaquie et la République tchèque. Les manifestants accusent les gouvernements actuels de méfaits, les blâmant pour la division de l'ancienne Tchécoslovaquie. Ils exigent la démission de leurs dirigeants et appellent à un référendum national pour reconsidérer la séparation du pays."
Sov_warsaw_pact.8.a: "Le monde semble glisser dans le passé..."

SOV_protests_by_scientists_idea: "Manifestations des scientifiques est-allemands"
SOV_protests_by_scientists_idea_desc: "Après la réunification allemande en 1990, les diplômes universitaires de nombreux chercheurs est-allemands ont été invalidés, entraînant des pertes d'emplois généralisées. Récemment, ces scientifiques ont commencé à manifester, exigeant la reconnaissance et la justice pour leurs contributions et qualifications."
SOV_east_german_military_discontent_idea: "Grèves des officiers militaires est-allemands"
SOV_east_german_military_discontent_idea_desc: "Suite à la réunification de l'Allemagne, tous les grades militaires obtenus par les officiers est-allemands ont été annulés. Cela a causé un profond mécontentement parmi ces officiers, qui se sentent injustement traités et marginalisés dans la nouvelle structure militaire."

Sov_warsaw_pact.10.t: "L'essor de l'ostalgie en Allemagne"
Sov_warsaw_pact.10.d: "Un mouvement appelé « ostalgie », qui romantise la vie en Allemagne de l'Est, gagne un élan significatif à l'est. Bien que ce mouvement existait déjà, son intensité actuelle a alarmé les experts internationaux, qui soupçonnent une influence secrète des agences de renseignement du Pacte de Varsovie."
Sov_warsaw_pact.10.a: "Intéressant"

Sov_warsaw_pact.11.t: "Activité inhabituelle en Allemagne de l'Est"
Sov_warsaw_pact.11.d: "Nous avons récemment détecté une augmentation des activités communistes clandestines en Allemagne de l'Est. Nos rapports de renseignement font état de sabotages au sein de l'armée et d'un ralentissement des progrès scientifiques. Ces actions semblent être soutenues secrètement par l'URSS. Des fonds gouvernementaux supplémentaires ont été alloués pour contrer ces efforts subversifs."
Sov_warsaw_pact.11.a: "Nous devons vérifier notre personnel pour détecter les collaborateurs"

SOV_United_Network_of_Warsaw_Pact_Laboratories: "Réseau uni des laboratoires du Pacte de Varsovie"
SOV_Joint_research_on_armor_and_infantry: "Recherche conjointe sur l'armure et l'infanterie"
SOV_Joint_aviation_research: "Recherche conjointe sur l'aviation"

SOV_joint_research_ttip: "§RCes bonus ne peuvent être utilisés qu'une seule fois et s'appliquent uniquement aux pays du Pacte de Varsovie. Les pays hors du Pacte de Varsovie historique n'en bénéficient pas. Utilisez-les uniquement si vous êtes sûr que tous vos alliés sont membres du Pacte, car seuls eux en profitent.§ !"

SOV_warsaw_influence_close: "Clôturer les décisions sur la révolution en §Y[BUL.GetName weighting: 0.3, SOV_warsaw_influence_close1: "Clôturer les décisions sur la révolution en §Y[ROM.GetNameWithFlag]§ !"
SOV_warsaw_influence_close2: "Clôturer les décisions sur la révolution en §Y[HUN.GetNameWithFlag]§ !"
SOV_warsaw_influence_close3: "Clôturer les décisions sur la révolution en §Y[CZE.GetNameWithFlag]§ ! et §Y[SLO.GetNameWithFlag]§ !"

Sov_warsaw_pact.12.t: "Début des exercices militaires conjoints du Pacte de Varsovie"
Sov_warsaw_pact.12.d: "L'État-major général conjoint des pays du Pacte de Varsovie a annoncé le début d'exercices militaires combinés. Les experts occidentaux y voient principalement une démonstration de force visant à intimider l'OTAN et à réaffirmer la présence militaire du Pacte."
Sov_warsaw_pact.12.a: "Difficile de croire que ces événements se reproduisent..."

Sov_warsaw_pact.13.t: "Rébellion armée en Allemagne de l'Est"
Sov_warsaw_pact.13.d: "Une révolte armée a éclaté en Allemagne de l'Est. Avec le soutien financier et en armes du Pacte de Varsovie, les forces militaires est-allemandes ont pris le contrôle d'institutions clés et proclamé le rétablissement de la République Démocratique Allemande. Les rebelles dénoncent la réunification avec l'Allemagne de l'Ouest comme une grave erreur qui doit être corrigée."
Sov_warsaw_pact.13.a: "Le monde est-il au bord de la Troisième Guerre mondiale ?"

SOV_Restore_order_on_the_western_border: "Restaurer l'ordre à la frontière occidentale"

cant_start_exercises_tt: "Un seul type d'exercice peut être effectué à la fois"
cant_start_exercises1_tt_effect: "§RVous ne pouvez pas commencer un autre exercice pendant les 297 prochains jours.§ !"
cant_start_exercises2_tt_effect: "§RVous ne pouvez pas commencer un autre exercice pendant les 286 prochains jours.§ !"
cant_start_exercises3_tt_effect: "§RVous ne pouvez pas commencer un autre exercice pendant les 275 prochains jours.§ !"

SOV_restoration_of_ovd_tt: "Ouvre les décisions pour le rétablissement du §YPacte de Varsovie§ !"

SOV_restoration_of_warsaw_pact: "Restauration du Pacte de Varsovie"
SOV_restoration_of_warsaw_pact_desc: "La situation en Europe de l'Est est devenue de plus en plus instable, plusieurs anciens alliés du Pacte de Varsovie ayant déjà rejoint l'OTAN. Plus cela continue, plus il sera difficile de regagner une influence mondiale. Nous devons reprendre ce qui a été perdu et rétablir un équilibre mondial bipolaire."

Sov_warsaw_pact.14.t: "Le Pacte de Varsovie offre une protection militaire"
Sov_warsaw_pact.14.d: "Pour sécuriser notre souveraineté et défendre notre patrie contre les menaces extérieures, les pays du Pacte de Varsovie nous offrent une protection militaire. Accepter cela renforcera notre défense et garantira notre sécurité."
Sov_warsaw_pact.14.a: "Il est temps de protéger notre patrie"

SOV_AUTH_SS: "État national soviétique russe"
SOV_soviet_empire: "Empire soviétique"

Sov_warsaw_pact.15.t: "Chance de se libérer de l'influence russe"
Sov_warsaw_pact.15.d: "Les récents troubles en Russie ont créé une opportunité pour nous de réduire leur influence sur notre pays. Alors que la Russie se concentre sur ses problèmes internes, nous devons décider si nous restons alliés ou poursuivons notre propre voie indépendante."
Sov_warsaw_pact.15.a: "La Russie n'est plus notre alliée"
Sov_warsaw_pact.15.b: "Nous restons"

Sov_warsaw_pact.17.t: "Invasion de l'Allemagne de l'Est"
Sov_warsaw_pact.17.d: "Il y a quelques heures, nos forces en Allemagne de l'Est ont été attaquées, forçant nos troupes frontalières à se retirer. Le monde est maintenant au bord d'un conflit nucléaire. Nous faisons face à une décision grave : défendre nos alliés et risquer l'annihilation mondiale ou sacrifier un allié pour préserver la paix."
Sov_warsaw_pact.17.a: "Mobilisez l'armée, il est temps de marcher !"
Sov_warsaw_pact.17.b: "Aucun allié ne vaut la destruction totale de la planète"

WP_escaped: "A quitté notre sphère d'influence"

Sov_warsaw_pact.16.t: "Le soulèvement réussit"
Sov_warsaw_pact.16.d: "Avec l'aide de nos alliés historiques, nous avons pris le contrôle des centres de commandement clés en Allemagne de l'Est. Le Pacte de Varsovie a offert la protection de notre souveraineté en échange d'une coopération stratégique, renforçant notre position."
Sov_warsaw_pact.16.a: "Gloire à la RDA et à son peuple !"

Sov_warsaw_pact.18.t: "L'URSS refuse son assistance"
Sov_warsaw_pact.18.d: "Pour éviter la Troisième Guerre mondiale, l'URSS retire ses troupes de notre territoire, nous laissant affronter les menaces seuls."
Sov_warsaw_pact.18.a: "Traîtres !"

OVD_raspalsa: "Le Pacte de Varsovie s'est effondré"

Sov_warsaw_pact.19.t: "L'URSS retire ses troupes d'Allemagne de l'Est"
Sov_warsaw_pact.19.d: "Le conflit en Allemagne de l'Est a poussé le monde au bord de la guerre. Pour éviter un conflit total, les dirigeants soviétiques ont ordonné un retrait complet de leurs troupes. Le monde observe attentivement alors que le dernier soldat soviétique quitte la République Démocratique Allemande nouvellement déclarée."
Sov_warsaw_pact.19.a: "« Dans l'armée soviétique, il faut plus de courage pour battre en retraite que pour avancer. »"

birth_of_eastern_germany_world_tension: "Rébellion en Allemagne de l'Est"

##Nazbol Events
sov_nationalists.2.t: "La révolution russe dans notre pays !"
sov_nationalists.2.d: "§Y[SOV.GetNameWithFlag]§ ! incite la population russophone de notre pays à se soulever, se préparant à envoyer des troupes pour intervenir. Les tensions montent rapidement."
sov_nationalists.2.a: "Que Dieu nous aide"

sov_nationalists_news.1.t: "Jirinovsky élu président"
sov_nationalists_news.1.d: "Suite aux récents changements gouvernementaux, le parti nationaliste LDPR, dirigé par [SOV.GetLeader], a pris le pouvoir en Russie. Ils ont annoncé un programme politique radical, incluant la restauration de l'ancien drapeau et la poursuite d'un agenda nationaliste conservateur."
sov_nationalists_news.1.a: "Qu'attend la Russie ?"

sov_nationalists_news.2.t: "Le nouvel Empire russe"
sov_nationalists_news.2.d: "Dans un discours télévisé, le président de la Russie a déclaré son intention de faire renaître l'Empire russe par tous les moyens nécessaires. Cela a alarmé de nombreuses nations, en particulier les anciens États soviétiques, qui y voient une menace pour leur souveraineté. Le monde espère que cette rhétorique agressive n'est qu'une manœuvre électorale."
sov_nationalists_news.2.a: "Une déclaration alarmante"

sov_nationalists_news.3.t: "Le Pacte de Moscou"
sov_nationalists_news.3.d: "Le dirigeant de la Russie, [SOV.GetLeader], a annoncé des plans pour créer une nouvelle alliance militaro-économique appelée le « Pacte de Moscou » pour protéger les intérêts russes et les nations amies. Il a cité une pression occidentale sans précédent et a invité les anciens pays soviétiques à rejoindre. Les experts avertissent que cela signale une nouvelle guerre froide."
sov_nationalists_news.3.a: "Un développement alarmant"

sov_nationalists_news.4.t: "La nouvelle capitale russe"
sov_nationalists_news.4.d: "[SOV.GetLeader] a annoncé des plans pour déplacer la capitale de la Russie de Moscou à la ville historique de Petrograd (anciennement Saint-Pétersbourg) en tant que « retour de la justice historique ». Tous les organes gouvernementaux doivent se relocaliser dans l'année, bien que certains avertissent que cela exposera la capitale aux menaces de l'OTAN."
sov_nationalists_news.4.a: "Essayer de restaurer le passé"

sov_nationalists_news.5.t: "La Russie annonce ses ambitions"
sov_nationalists_news.5.d: "Dans un discours audacieux, le chef d'État de la Russie a revendiqué des territoires de l'ancien empire, blâmant les bolcheviks et l'Occident pour la chute de l'empire. Il a accusé les nations occidentales d'interférer et de commettre un génocide contre les Russes, proclamant une « Grande Russie » prête à reprendre ses terres par tous les moyens, menaçant même d'une guerre nucléaire."
sov_nationalists_news.5.a: "Seul Dieu peut nous sauver..."

sov_nationalists_news.6.t: "Le dirigeant suprême de la Russie"
sov_nationalists_news.6.d: "La nouvelle constitution de la Russie abolit la présidence et la remplace par un dirigeant suprême détenant de vastes pouvoirs, centralisant effectivement toutes les branches du gouvernement sous une seule autorité. [SOV.GetLeader] a déclaré la nécessité d'un leader fort pour restaurer la grandeur de la Russie, marquant le début d'une nouvelle ère autoritaire."
sov_nationalists_news.6.a: "Vive [SOV.GetLeader] !"

sov_nationalists_news.7.t: "Le nouvel Empire russe"
sov_nationalists_news.7.d: "Lors d'une session régulière de la Douma d'État, le président russe [SOV.GetLeader] a déclaré la nécessité de restaurer l'Empire russe. Dans son discours, il a qualifié l'effondrement de l'ancien empire d'« erreur historique » et a proposé de tenir une conférence constitutionnelle pour adopter une nouvelle « constitution impériale ». Un organe spécial, la « Régence provisoire », sera formé pour rédiger cette constitution et sélectionner un candidat à couronner empereur. Son discours a été accueilli par des applaudissements enthousiastes du parti au pouvoir, un député déclarant : « J'ai attendu cela toute ma vie. » Étant donné les purges généralisées de l'opposition et la centralisation croissante du pouvoir, [SOV.GetLeader] semble prêt à restructurer entièrement le gouvernement. La renaissance de l'empire signale que la Russie réaffirme ses prétentions sur les anciens territoires impériaux."
sov_nationalists_news.7.a: "Inattendu à tous points de vue..."

sov_nationalists_news.8.t: "La Russie intègre les nationaux-bolcheviks"
sov_nationalists_news.8.d: "Le président [SOV.GetLeader] a annoncé que plusieurs membres éminents du Parti national-bolchevique, y compris son chef controversé Eduard Limonov, rejoindront le gouvernement russe. Bien que leurs rôles spécifiques soient inconnus, leur entrée au gouvernement marque un changement idéologique majeur vers le national-bolchevisme. Cette idéologie promeut une expansion territoriale agressive dans l'ancienne Union soviétique. L'Occident et les nations de la CEI se préparent maintenant à une probable escalade des tensions."
sov_nationalists_news.8.a: "Inattendu à tous points de vue..."

sov_nationalists_news.9.t: "Couronnement de Nicolas Romanov"
sov_nationalists_news.9.d: "Nicolas Romanov a été officiellement couronné empereur de l'Empire russe lors d'une cérémonie somptueuse tenue à la cathédrale de l'Assomption à Moscou. L'événement a réuni des officiels du gouvernement, des dignitaires étrangers, des monarchistes et le régent de l'empereur, [SOV.GetLeader]. Dans son discours, Nicolas a revendiqué la succession de Nicolas II et a affirmé la légitimité du nouvel empire. Il a également publiquement soutenu [SOV.GetLeader] pour diriger le nouveau gouvernement tsariste. Cependant, selon la nouvelle constitution adoptée, le rôle du Premier ministre a été réduit au profit de l'empereur, jetant une incertitude sur l'influence future de [SOV.GetLeader] dans les affaires de l'État."
sov_nationalists_news.9.a: "L'impérialisme contre-attaque."

sov_nationalists_news.10.t: "Couronnement de Maria Romanova"
sov_nationalists_news.10.d: "Maria Romanova a été couronnée nouvelle impératrice de la Russie lors d'une cérémonie à la cathédrale de l'Assomption à Moscou, empreinte de tradition impériale. La cérémonie a réuni des officiels de l'État, des dirigeants étrangers, des monarchistes et le régent [SOV.GetLeader]. Dans son discours, Maria a revendiqué la succession de Nicolas II, affirmé la légalité du nouvel empire et exprimé son intention de nommer [SOV.GetLeader] à la tête du gouvernement tsariste. Malgré son soutien, la nouvelle constitution accorde plus d'autorité à l'empereur, laissant incertain le rôle politique futur de [SOV.GetLeader]."
sov_nationalists_news.10.a: "L'impérialisme contre-attaque."

sov_nationalists_news.11.t: "Couronnement de George Romanova"
sov_nationalists_news.11.d: "George Romanova est monté sur le trône en tant que nouvel empereur de la Russie, couronné dans la cathédrale historique de l'Assomption à Moscou. L'événement a été suivi par des officiels de l'État, des dignitaires étrangers, des monarchistes et le régent [SOV.GetLeader]. Dans son discours, George a souligné son lien avec Nicolas II et affirmé la légitimité du nouvel Empire russe. Il a également exprimé son souhait de nommer [SOV.GetLeader] à la tête du gouvernement tsariste. Avec la constitution transférant le pouvoir à l'empereur, le rôle de [SOV.GetLeader] dans la gouvernance est maintenant en question."
sov_nationalists_news.11.a: "L'impérialisme contre-attaque."

sov_nationalists_news.12.t: "Couronnement d'Andrei Romanova"
sov_nationalists_news.12.d: "Andrei Romanova a été couronné empereur de l'Empire russe lors d'une cérémonie tenue à la cathédrale de l'Assomption à Moscou, un site chargé d'histoire impériale. Le couronnement a attiré une foule d'officiels de l'État, de dirigeants mondiaux, de monarchistes et le régent [SOV.GetLeader]. Dans son discours public, le nouvel empereur a affirmé la continuité avec Nicolas II et déclaré la renaissance de l'héritage impérial de la Russie. Il a également soutenu [SOV.GetLeader] en tant que chef du nouveau gouvernement tsariste. Malgré ce soutien, la nouvelle constitution élève le rôle de l'empereur, signalant une possible diminution de l'influence de [SOV.GetLeader]."
sov_nationalists_news.12.a: "L'impérialisme contre-attaque."

sov_nationalists_news.28.t: "Régent saint de la Russie"
sov_nationalists_news.28.d: "Après de longues délibérations sur le prochain empereur de la Russie, le régent [SOV.GetLeader] a surpris la nation en déclarant qu'aucun candidat n'était digne. Il a dissous la Régence provisoire et s'est proclamé régent saint et seul empereur légitime de la Russie. Invoquant un devoir divin de restaurer la « justice historique », [SOV.GetLeader] a centralisé tout le pouvoir entre ses mains. Bien que la base légale de cette déclaration reste floue, il est évident qu'aucune force interne ne contestera son autorité. Ses ambitions d'expansion et de domination sont maintenant totalement libres."
sov_nationalists_news.28.a: "Quelle folie !"

sov_nationalists_news.13.t: "La troisième Rome"
sov_nationalists_news.13.d: "Dans un discours télévisé, [SOV.GetLeader] a proclamé que la Russie moderne a transcendé le rôle d'un simple État. Il a affirmé que la Russie a accompli sa mission spirituelle en faisant renaître l'héritage de l'Empire romain, et qu'ainsi, une « troisième Rome » doit émerger. Cette déclaration a stupéfié les observateurs internationaux, qui craignent maintenant ses implications géopolitiques potentielles. Ce mouvement suggère un changement fondamental dans l'auto-identité de la Russie et ses ambitions futures. Le monde pourrait assister au début d'une nouvelle ère idéologique."
sov_nationalists_news.13.a: "Et qu'est-ce que cela est censé signifier ?"

sov_nationalists_news.14.t: "La Russie envahit l'Asie centrale"
sov_nationalists_news.14.d: "Le gouvernement russe a lancé une opération militaire à grande échelle en Asie centrale. Moscou accuse les États d'Asie centrale de mener des politiques russophobes, d'opprimer les Russes ethniques et de permettre une migration incontrôlée qui déstabilise la Russie de l'intérieur. Le chef d'État russe a également déclaré que ces territoires appartiennent légitimement à la Russie. Les réactions mondiales ont été rapides, les pays voisins et les puissances internationales condamnant l'agression. Des sanctions et des représailles diplomatiques de l'Occident devraient suivre."
sov_nationalists_news.14.a: "La nouvelle ère de l'impérialisme"

sov_nationalists_news.15.t: "La Russie envahit l'Ukraine"
sov_nationalists_news.15.d: "La Russie a annoncé une invasion majeure de l'Ukraine. Dans un discours national, [SOV.GetLeader] a revendiqué le territoire de l'Ukraine comme faisant partie des terres ancestrales de la Russie et a qualifié l'État ukrainien de « projet anti-russe ». Il a qualifié l'Ukraine moderne de « Malorossiya », appelant son retour un « devoir historique ». La condamnation internationale a été immédiate. Les nations occidentales ont déclaré cette invasion comme une grave menace pour la sécurité européenne et ont promis un soutien économique et militaire à l'Ukraine. L'équilibre mondial du pouvoir pourrait bientôt changer à mesure que ce conflit se déroule."
sov_nationalists_news.15.a: "Espérons le meilleur"

sov_nationalists_news.16.t: "La Russie met la pression sur la Biélorussie"
sov_nationalists_news.16.d: "La Russie a émis un ultimatum formel à la Biélorussie, exigeant qu'elle s'intègre à la Russie en tant que gouvernorat semi-autonome. Cet ultimatum a provoqué des ondes de choc dans la communauté internationale. Le ministère des Affaires étrangères biélorusse a qualifié la proposition d'inattendue et alarmante. Il n'est pas clair si la Biélorussie cédera à ces exigences ou si ce mouvement n'est qu'un bluff stratégique de Moscou. Avec des tensions élevées, les pays voisins observent de près la réponse de Minsk."
sov_nationalists_news.16.a: "Quel stress"

sov_nationalists_news.17.t: "La Russie met la pression sur les pays baltes"
sov_nationalists_news.17.d: "Dans un ultimatum alarmant, la Russie a exigé que les États baltes soient incorporés à son territoire en tant que gouvernorats semi-autonomes. Cette annonce a secoué la communauté internationale. Les dirigeants baltes se sont réunis en session d'urgence, qualifiant l'ultimatum d'« attendu mais profondément troublant ». Pourtant, une réponse unifiée s'est révélée difficile. Avec la crainte croissante d'une escalade militaire, l'incertitude plane maintenant sur la région alors que les dirigeants de l'OTAN et de l'UE délibèrent sur leurs prochaines actions."
sov_nationalists_news.17.a: "Quel stress"

sov_nationalists_news.18.t: "La Russie met la pression sur la Géorgie"
sov_nationalists_news.18.d: "La Russie a délivré un ultimatum à la Géorgie, exigeant qu'elle devienne une partie semi-autonome de la Fédération de Russie. Le gouvernement géorgien a rapidement convoqué une session d'urgence, décrivant l'ultimatum comme une menace directe. Les troupes russes se sont déjà déployées près des républiques sécessionnistes bordant la Géorgie, suggérant une action militaire probable si les exigences sont rejetées. La situation reste tendue alors que la Géorgie se prépare à une éventuelle escalade."
sov_nationalists_news.18.a: "Quel stress"

sov_nationalists_news.19.t: "La Russie met la pression sur la Moldavie"
sov_nationalists_news.19.d: "La Moldavie est devenue la dernière cible de la pression russe, avec un ultimatum exigeant son incorporation à la Russie en tant que gouvernorat semi-autonome. Les officiels moldaves ont répondu avec alarme lors d'une session d'urgence, citant la présence de troupes russes en Transnistrie comme un signe inquiétant. Le gouvernement se prépare à la possibilité d'un conflit alors que les observateurs internationaux expriment leur inquiétude face à la posture de plus en plus agressive de Moscou en Europe de l'Est."
sov_nationalists_news.19.a: "Quel stress"

sov_nationalists_news.20.t: "La Russie annonce des revendications en Asie de l'Est"
sov_nationalists_news.20.d: "Lors d'une conférence de presse, [SOV.GetLeader] a affirmé les revendications de la Russie sur plusieurs territoires en Asie de l'Est, notamment la Mongolie et la Mandchourie. Invoquant leur importance stratégique, il a déclaré ces régions comme faisant partie du nouvel agenda politique de la Russie. Bien qu'il ait affirmé préférer une résolution pacifique, il n'a pas exclu les options militaires. Il a également critiqué les actions historiques du Japon et exigé des excuses publiques. En réponse, la Mongolie, la Chine et le Japon ont condamné les remarques de la Russie comme provocatrices et irréalistes. La région est maintenant sur le qui-vive, craignant une instabilité renouvelée."
sov_nationalists_news.20.a: "J'espère que ce ne sont que des mots"

sov_nationalists_news.21.t: "La Russie met la pression sur la Mongolie"
sov_nationalists_news.21.d: "La Russie a émis un ultimatum à la Mongolie, demandant qu'elle devienne un gouvernorat semi-autonome sous contrôle russe. Le gouvernement mongol a qualifié l'ultimatum de troublant et a convoqué une réunion d'urgence pour évaluer la menace. La communauté internationale suit de près ce développement, incertaine s'il signale une réelle agression ou une intimidation calculée. Quoi qu'il en soit, l'équilibre des pouvoirs dans la région pourrait changer."
sov_nationalists_news.21.a: "Quel stress"

sov_nationalists_news.22.t: "La Russie étend sa présence dans le Pacifique"
sov_nationalists_news.22.d: "Lors d'une réunion de l'ONU, le Premier ministre japonais a accusé la Russie d'augmenter considérablement sa présence militaire dans l'océan Pacifique. Il a averti que de telles actions pourraient signaler des préparatifs pour une future invasion. Le représentant de la Russie à l'ONU a nié ces allégations, insistant sur le fait que cette accumulation est liée à des exercices militaires à venir. Malgré cela, les tensions continuent de monter entre les deux nations, et la possibilité d'un conflit devient de plus en plus probable. Les canaux diplomatiques restent ouverts—pour l'instant."
sov_nationalists_news.22.a: "Quel stress"

sov_nationalists_news.23.t: "La Russie met la pression sur l'Arménie"
sov_nationalists_news.23.d: "La Russie a récemment proposé que l'Arménie rejoigne l'État russe avec une large autonomie et des promesses de restitution territoriale. La proposition incluait également une menace voilée d'intervention militaire en cas de refus de l'Arménie. Les officiels arméniens ont qualifié l'offre de « étrange et effrayante » et débattent actuellement de la réponse à donner. Cet ultimatum a rendu la communauté internationale nerveuse, alors que la région observe de près la décision de l'Arménie."
sov_nationalists_news.23.a: "Quel ultimatum étrange"

sov_nationalists_news.24.t: "Opération 'Grill'"
sov_nationalists_news.24.d: "La Russie a lancé une opération militaire contre l'Azerbaïdjan, l'accusant de déstabiliser la région et de commettre un génocide contre les peuples russe et arménien. Le ministère des Affaires étrangères a déclaré que la Russie a l'obligation morale de protéger les chrétiens dans le Caucase. Les analystes estiment que l'opération vise également à sécuriser les précieuses réserves pétrolières de l'Azerbaïdjan, qui pourraient être une force motrice derrière la campagne. La réaction internationale a été rapide et critique, avec des craintes d'une escalade supplémentaire dans la région."
sov_nationalists_news.24.a: "Assez effrayant."

sov_nationalists_news.29.t: "Exercices militaires à la frontière turque"
sov_nationalists_news.29.d: "La Russie a commencé des exercices militaires conjoints de grande envergure près de la frontière turque. Selon les déclarations officielles, les exercices sont conçus pour simuler une réponse à une invasion hypothétique par des « forces néo-impérialistes ». Les exercices incluent des opérations aériennes, des simulations de combats urbains et des invasions navales. La Turquie a fermement condamné ces manœuvres, avertissant que ces actions ressemblent à des préparatifs pour un conflit à grande échelle. La situation a accru les tensions dans la région et suscité des préoccupations internationales."
sov_nationalists_news.29.a: "Assez effrayant."

sov_nationalists_news.25.t: "La Russie déclare la nouvelle croisade"
sov_nationalists_news.25.d: "Dans un discours controversé, le chef d'État russe a déclaré que les populations chrétiennes de l'Est font face à des persécutions et à un génocide. Il a appelé la Russie à endosser le rôle de défenseur du christianisme mondial. Proclamant le début d'une « nouvelle croisade », il a juré de protéger les communautés chrétiennes et de préserver leur héritage culturel par tous les moyens nécessaires. Cette annonce a provoqué l'indignation dans le monde islamique. Dans une réponse unifiée, les nations islamiques se sont engagées à résister à toute agression et à défendre leur souveraineté."
sov_nationalists_news.25.a: "Ave Maria !"

sov_nationalists_news.26.t: "La Russie planifie l'intégration d'Istanbul"
sov_nationalists_news.26.d: "Suite aux actions militaires de la Russie en Turquie, le chef d'État russe a visité Istanbul et a annoncé des plans pour intégrer la ville à l'État russe. Il a déclaré qu'Istanbul serait renommée sous son titre historique, Constantinople. De plus, il a souligné la nécessité d'opérations policières étendues pour éliminer les cellules de résistance restantes dans la ville. L'annonce a suscité de fortes réactions de la communauté internationale, beaucoup y voyant une provocation symbolique ainsi qu'un mouvement stratégique."
sov_nationalists_news.26.a: "Intéressant."

sov_nationalists_news.27.t: "La Russie défie l'Europe"
sov_nationalists_news.27.d: "Dans un discours audacieux devant des hauts fonctionnaires, [SOV.GetLeader] a accusé les puissances occidentales d'avoir orchestré l'effondrement de l'Empire russe et de l'Union soviétique. Il a affirmé que l'objectif de longue date de l'Occident est de maintenir la Russie faible et divisée. Proclamant la fin de l'hégémonie occidentale, il a affirmé le droit de la Russie au leadership en Europe. Les dirigeants européens ont rapidement répondu, avertissant qu'un conflit avec la Russie pourrait bientôt être inévitable. Les budgets de défense sont déjà augmentés, et la préparation militaire est révisée à travers le continent."
sov_nationalists_news.27.a: "Intéressant."

##Union of Sovereign State Content
#Union of Sovereign State Events
sov_sover_state.1.t: "§Y[SOV.GetNameWithFlag]§ ! nous propose l'idée de relancer l'USS"
sov_sover_state.1.d: "§YL'Union des États souverains§ ! a été initialement démantelée avant de pouvoir se réaliser, s'effondrant pendant le chaos politique de la tentative de coup d'État du Comité d'État d'urgence à Moscou. Maintenant, l'initiative revient avec une vigueur renouvelée. Le projet offre une seconde chance d'unifier les États post-soviétiques sous un nouveau cadre plus flexible. Cette proposition pourrait remodeler l'ordre régional."
sov_sover_state.1.a: "Nous acceptons de participer à cela"
sov_sover_state.1.b: "Cela ne nous intéresse pas"

sov_sover_state.2.t: "Le conflit géorgien - Vote"
sov_sover_state.2.d: "Nous devons enfin déterminer l'avenir de la Géorgie et de ses régions sécessionnistes. La Géorgie doit-elle être restaurée dans son intégralité, ou l'Abkhazie et l'Ossétie du Sud resteront-elles indépendantes et deviendront-elles membres de l'Union des États souverains ? Le résultat de ce vote pourrait définir les frontières de la région pour les années à venir."
sov_sover_state.2.a: "La Géorgie doit être entière et indivisible"
sov_sover_state.2.b: "L'Abkhazie et l'Ossétie du Sud sont des pays indépendants"

sov_sover_state.3.t: "Le conflit géorgien - Vote"
sov_sover_state.3.d: "Les résultats sont tombés—l'Abkhazie et l'Ossétie du Sud ont été déclarées territoires légitimes à retourner à nous. Cette décision réaffirme nos revendications historiques et représente une victoire diplomatique. La communauté internationale observe de près alors que la situation se déroule."
sov_sover_state.3.a: "Nous avons gagné !"

sov_sover_state.4.t: "Le conflit géorgien - Vote"
sov_sover_state.4.d: "Aujourd'hui, un vote a confirmé notre souveraineté, garantissant que notre pays reste indépendant. Non seulement nous avons préservé notre liberté, mais nous avons également obtenu une reconnaissance officielle de notre statut. Cela marque un tournant dans notre parcours national."
sov_sover_state.4.a: "Nous avons gagné !"

sov_sover_state.5.t: "Déclaration de l'Union des États souverains"
sov_sover_state.5.d: "Le projet final du traité nous a été soumis pour examen. C'est maintenant à nous de décider si nous signons et rejoignons officiellement l'Union des États souverains. Ce choix façonnera notre rôle dans la nouvelle alliance régionale."
sov_sover_state.5.a: "Oui"
sov_sover_state.5.b: "Non"

sov_sover_state.6.t: "Union des États souverains"
sov_sover_state.6.d: "Le processus de signature est terminé, et l'Union des États souverains est officiellement fondée. Cet événement historique marque le début d'une nouvelle ère de coopération, de développement mutuel et de gouvernance partagée parmi ses membres."
sov_sover_state.6.a: "Hourra !"

sov_sover_state.7.t: "L'Abkhazie et l'Ossétie du Sud restent indépendantes"
sov_sover_state.7.d: "Les résultats du vote des États membres de l'Union des États souverains ont confirmé que l'Abkhazie et l'Ossétie du Sud resteront indépendantes. Ces républiques seront maintenant invitées à devenir membres à part entière de l'union. Cette décision pourrait avoir des implications profondes pour la diplomatie régionale."
sov_sover_state.7.a: "Intéressant"

sov_sover_state.8.t: "La Géorgie récupère ses territoires"
sov_sover_state.8.d: "Le résultat du vote parmi les futurs membres de l'Union des États souverains a déclaré que les territoires géorgiens sécessionnistes doivent retourner immédiatement à la Géorgie. Cette décision est saluée comme un pas vers la restauration de l'intégrité territoriale de l'État géorgien."
sov_sover_state.8.a: "Intéressant"

 sov_sover_state.9.t: "Le conflit arméno-azerbaïdjanais"
sov_sover_state.9.d: "Le Haut-Karabagh est une source de conflit violent et de profonde division nationale depuis des décennies. Le moment est venu de déterminer à qui il appartient de droit. Devrait-il appartenir à l'Arménie ou à l'Azerbaïdjan ? La réponse aura des effets durables sur les deux pays et sur toute la région."
sov_sover_state.9.a: "Le Karabagh appartient à l'Azerbaïdjan"
sov_sover_state.9.b: "Le Karabagh appartient à l'Arménie"

sov_sover_state.10.t: "Le conflit arméno-azerbaïdjanais"
sov_sover_state.10.d: "Après délibération parmi les membres de l'Union des États souverains, la décision a été prise : le Haut-Karabagh sera attribué à l'Azerbaïdjan. Ce résultat pourrait raviver les tensions et fera probablement l'objet d'un examen international."
sov_sover_state.10.a: "Intéressant"

sov_sover_state.11.t: "Le conflit arméno-azerbaïdjanais"
sov_sover_state.11.d: "Le vote parmi les futurs membres de l'Union des États souverains s'est conclu par une décision d'attribuer le Haut-Karabagh à l'Arménie. Cette décision risque de provoquer de fortes réactions à Bakou et à l'étranger, avec des conséquences géopolitiques possibles."
sov_sover_state.11.a: "Intéressant"

sov_sover_state.12.t: "Le conflit arméno-azerbaïdjanais"
sov_sover_state.12.d: "Un second vote a de nouveau confirmé que le Haut-Karabagh sera reconnu comme faisant partie de l'Azerbaïdjan. Cette décision renforce la position de Bakou mais pourrait approfondir les hostilités dans la région."
sov_sover_state.12.a: "Intéressant"

sov_sover_state.13.t: "Le conflit arméno-azerbaïdjanais"
sov_sover_state.13.d: "Un autre vote de l'Union des États souverains s'est conclu par la décision de reconnaître le Haut-Karabagh comme territoire arménien. Cette résolution devrait exacerber les tensions diplomatiques avec l'Azerbaïdjan."
sov_sover_state.13.a: "Intéressant"

sov_sover_state.14.t: "Union des États souverains"
sov_sover_state.14.d: "§Y[FROM.GetNameWithFlag]§ ! a officiellement accepté de devenir candidat à l'adhésion à l'Union des États souverains. C'est une étape cruciale vers la construction d'une confédération unie de républiques souveraines."
sov_sover_state.14.a: "Hourra !"

sov_sover_state.15.t: "Union des États souverains"
sov_sover_state.15.d: "§Y[FROM.GetNameWithFlag]§ ! a signé l'accord formel pour rejoindre l'Union des États souverains. Cela marque leur entrée officielle dans l'union et renforce l'alliance."
sov_sover_state.15.a: "Hourra !"

sov_sover_state.16.t: "Le conflit de Crimée"
sov_sover_state.16.d: "Suite à l'annexion de la Crimée par la Russie depuis l'Ukraine, le statut de la région au sein de l'Union des États souverains est maintenant en révision. La Crimée doit-elle rester sous contrôle russe ou être rendue à l'Ukraine ? Le résultat de ce vote aura de lourdes conséquences pour la crédibilité de l'union."
sov_sover_state.16.a: "La Crimée doit rester russe"
sov_sover_state.16.b: "La Crimée doit redevenir ukrainienne"

sov_sover_state.17.t: "Le conflit de Crimée"
sov_sover_state.17.d: "Les États membres de l'Union des États souverains ont voté pour rendre la Crimée à §Y[UKR.GetNameWithFlag]§ !. Cette décision pourrait provoquer un contrecoup en Russie et marque une démarche audacieuse vers la résolution de conflits et la légitimité."
sov_sover_state.17.a: "Intéressant"

sov_sover_state.18.t: "Le conflit de Crimée"
sov_sover_state.18.d: "L'Union des États souverains a voté pour confirmer la Crimée comme faisant partie de §Y[SOV.GetNameWithFlag]§ !. Cette décision soutient la position de la Russie et consolide ses revendications, mais provoquera certainement une forte réaction de l'Ukraine et de l'Occident."
sov_sover_state.18.a: "Intéressant"

sov_sover_state.19.t: "Le conflit de Crimée"
sov_sover_state.19.d: "Un vote de l'Union des États souverains a réaffirmé la Crimée comme territoire de §Y[UKR.GetNameWithFlag]§ !. Cette décision risque d'enflammer les tensions avec la Russie, mais est considérée comme une victoire pour la souveraineté ukrainienne."
sov_sover_state.19.a: "Intéressant"

sov_sover_state.20.t: "Le conflit de Crimée"
sov_sover_state.20.d: "L'Union des États souverains a déclaré la Crimée comme territoire légitime de §Y[SOV.GetNameWithFlag]§ !. Ce résultat renforce le contrôle de Moscou et réaffirme sa domination sur la péninsule, tendant davantage les relations internationales."
sov_sover_state.20.a: "Intéressant"

autonomy_union_ss: "République souveraine fédérale"

SOV_reassure_ruthenia: "Projet de l'Union des États souverains"
SOV_reassure_ruthenia_desc: "Nous visons à relancer le projet longtemps abandonné de l'Union des États souverains, une alternative confédérale à l'URSS. En invitant des nations sélectionnées, nous espérons rétablir la cohésion régionale sous un nouveau cadre, corrigeant les défauts de l'héritage soviétique."

SOV_Sign_mutual_cooperation_agreements: "Adhésion à l'État d'Union"
SOV_Sign_mutual_cooperation_agreements_desc: "Nous approcherons plusieurs nations avec des propositions pour rejoindre l'État d'Union. Ces pays sont susceptibles de bénéficier et de contribuer à notre prospérité collective et à la stabilité régionale."

SOV_Putting_out_the_fire_in_the_post-Soviet_space: "Annoncer la cérémonie de signature de l'accord"
SOV_Putting_out_the_fire_in_the_post-Soviet_space_desc: "Nous annoncerons officiellement la date de la cérémonie de signature du traité d'Union. Cet événement déterminera quelles nations sont engagées à rejoindre notre union et à travailler ensemble vers des objectifs communs."

SOV_Gorbachev_dream: "Élargir l'État d'Union"
SOV_Gorbachev_dream_desc: "La cérémonie de fondation est terminée. Avec les formalités réglées, nous avancerons dans l'élargissement de l'État d'Union, consolidant sa présence et son influence dans tout l'espace post-soviétique."

SOV_ssg_category: "Union des États souverains"
SOV_ssg_category_desc: "L'Union des États souverains a été envisagée comme une version réformée de l'URSS – plus douce, plus décentralisée et de nature confédérale. Aujourd'hui, nous avons la chance de donner vie à cette vision, en améliorant les erreurs du passé et en construisant un avenir plus fort."

SOV_conflict_geo: "Soumettre la résolution du §Yconflit en Géorgie§ ! au vote"
SOV_conflict_geo_resolve: "Résoudre définitivement le §Yconflit géorgien§ !"
SOV_conflict_nkr: "Soumettre la résolution du §Yconflit en Artsakh§ ! au vote"
SOV_conflict_nkr_resolve: "Résoudre définitivement le §Yconflit arméno-azerbaïdjanais§ !"
SOV_conflict_ukr: "Soumettre la résolution du §Yconflit en Crimée§ ! au vote"
SOV_conflict_ukr_resolve: "Résoudre définitivement le §Yconflit de Crimée§ !"

russia.42.t: "La Transnistrie organise un référendum sur l'adhésion à l'Union soviétique"
russia.42.d: "Un nouveau référendum se tient en Transnistrie concernant l'adhésion à l'Union soviétique. Notre peuple se trouve une fois de plus à un carrefour de l'histoire, et leur décision définira le prochain chapitre de notre avenir."
russia.42.a: "Nous sommes prêts à rejoindre l'Union soviétique"

