 free_esb: "Négocier la libération de [ESB.GetNamewithFlag]"
 SOV_reunification_mission: "Table ronde sur l'unification"
 sov_dissolution.1.t: "Le régionalisme en hausse"
 sov_dissolution.1.d: "Avec la récente tournure des événements pour le pire, de plus en plus d'acteurs étatiques commencent à affirmer leur indépendance. Ce n'est qu'une question de temps avant que cette situation ne devienne incontrôlable et ne mène à une instabilité généralisée."
 sov_dissolution.1.a: "Impossible"
 sov_dissolution.2.t: "Une partie de la Russie réintégrée"
 sov_dissolution.2.d: "Après de longues négociations, une autre région de la patrie est revenue sous son véritable drapeau. Cela marque une étape importante vers la réunification et la stabilité nationale."
 sov_dissolution.2.a: "Un pas de plus"
 sov_dissolution.3.t: "La Russie demande la libération d'un pantin"
 sov_dissolution.3.d: "Le gouvernement russe a tendu la main dans l'espoir de négocier la pleine indépendance de l'un de ses anciens territoires. Cette initiative pourrait remodeler l'équilibre des pouvoirs dans la région."
 sov_dissolution.3.a: "Un investissement financier pourrait être utile"
 sov_dissolution.3.b: "Nous pourrions acheter leurs actifs d'État"
 sov_dissolution.3.c: "Hors de question"
 sov_dissolution.4.t: "[FROM.GetName] demande une compensation monétaire"
 sov_dissolution.4.d: "Suite à des pourparlers avec [FROM.GetNamewithFlag] concernant la libération éventuelle de certaines parties de leur pays, ils ont proposé une compensation monétaire en échange de cette concession. De telles demandes compliquent le processus de négociation."
 sov_dissolution.4.a: "Un petit prix à payer"
 sov_dissolution.4.b: "Ce n'est pas possible"
 sov_dissolution.5.t: "[FROM.GetName] demande le transfert d'actifs d'État"
 sov_dissolution.5.d: "Lors des discussions sur la libération de certaines régions, [FROM.GetNamewithFlag] a demandé le transfert d'actifs d'État en compensation. Cette demande nécessitera un examen attentif avant de pouvoir aller de l'avant."
 sov_dissolution.5.a: "Un petit prix à payer"
 sov_dissolution.5.b: "Ce n'est pas possible"
 sov_dissolution.6.t: "[FROM.GetName] refuse d'éventuelles négociations"
 sov_dissolution.6.d: "Malgré les efforts de rapprochement, [FROM.GetNamewithFlag] a catégoriquement rejeté toutes les propositions de libération de parties de leur territoire. La situation reste tendue et instable, avec peu d'espoir d'une résolution immédiate."
 sov_dissolution.6.a: "Ces fous arrogants !"
 sov_dissolution.7.t: "[SOV.GetName] accepte nos conditions"
 sov_dissolution.7.d: "[SOV.GetName] a accepté nos demandes de compensation raisonnables pour libérer notre État affilié. Cet accord nous rapproche de la réunification et de la paix."
 sov_dissolution.7.a: "Ce n'est qu'une affaire de business"
 sov_dissolution.8.t: "[SOV.GetName] rejette nos conditions"
 sov_dissolution.8.d: "[SOV.GetName] a refusé d'envisager nos demandes de compensation raisonnables pour la libération de notre État affilié. Ce refus pourrait retarder les progrès et augmenter les tensions."
 sov_dissolution.8.a: "Tant pis pour eux"
 sov_dissolution.10.t: "Troubles politiques pendant les négociations"
 sov_dissolution.10.d: "Lors des pourparlers sur une éventuelle réintégration à la Russie, plusieurs questions sensibles ont fait surface, ce qui a effectivement bloqué le processus de négociation. Le climat politique reste incertain et fragile."
 sov_dissolution.10.a: "Utilisons certains des outils à notre disposition"
 sov_dissolution.10.b: "Nous devons nous en tenir à l'écart"
 sov_dissolution.11.t: "Manque de fonds pour les négociations"
 sov_dissolution.11.d: "Une compensation monétaire a été proposée lors des pourparlers sur la réintégration pour couvrir les frais administratifs liés au transfert d'État. Cependant, le manque de fonds menace d'arrêter les progrès et nécessite une budgétisation minutieuse."
 sov_dissolution.11.a: "Ça fait partie du processus"
 sov_dissolution.11.b: "Il n'y a pas d'argent - mais tenez bon !"
 sov_dissolution.12.t: "Actifs d'État incompatibles"
 sov_dissolution.12.d: "Il est devenu clair que certains actifs d'État feraient faillite lors des négociations de réintégration. Nous devons prendre des mesures décisives pour résoudre ces problèmes et faire avancer les pourparlers."
 sov_dissolution.12.a: "Vendez-les maintenant."
 sov_dissolution.12.b: "Nous avons besoin de ces actifs"
 SOV_reunification_plus_10: "§GCela augmentera le progrès de l'unification de 10§!"
 SOV_reunification_plus_15: "§GCela augmentera le progrès de l'unification de 15§!"
 SOV_reunification_plus_20: "§GCela augmentera le progrès de l'unification de 20§!"
 SOV_reunification_minus_10: "§RCela diminuera le progrès de l'unification de 10§!"
 pmc_african_corps_TT: "Le bataillon §Y[SOV.GetFlag]de l'Afrika Korps§! n'est pas §Gembauché§!."
 russia.108.t: "Mutinerie militaire des généraux"
 russia.108.d: "Notre arrivée au pouvoir a été mal accueillie par une grande partie de la population et des autorités russes. De manière inattendue, les généraux Choïgou et Guerassimov ont fui précipitamment Moscou, rallié leurs fidèles au Tatarstan et en Touva, et nous ont déclaré la guerre. Cette trahison a ébranlé la nation."
 russia.108.a: "Maudits traîtres !"
 russia.109.t: "La Rosgvardia a déclenché une émeute"
 russia.109.d: "La rébellion menée par les généraux Choïgou et Guerassimov a plongé le pays dans le chaos. Maintenant, Zolotov, chef de la Rosgvardia, a rejoint le soulèvement avec ses forces loyales, défiant notre gouvernement et approfondissant la guerre civile."
 russia.109.a: "La Garde des traîtres !"
 russia.110.t: "Le gouvernement nous a trahis"
russia.110.d: "Les fonctionnaires du gouvernement, menés par Volodine, ont imposé la loi martiale dans les régions sous leur contrôle. L'armée est fracturée, nous forçant à affronter non seulement des rebelles, mais aussi d'anciens alliés désormais fidèles à des fonctionnaires opposés."
 russia.110.a: "Les fonctionnaires sont comme des rats"
 russia.111.t: "Le soulèvement communiste"
 russia.111.d: "Volgograd est devenu le bastion d'un nouveau soulèvement communiste. Plusieurs régions ont déclaré leur sécession et visent à recréer un analogue de l'URSS. Un nouvel ennemi dangereux est apparu."
 russia.111.a: "Maintenant, il y a ça aussi"
 russia.112.t: "La nouvelle guerre de Tchétchénie"
 russia.112.d: "Le gouvernement tchétchène nous a déclaré la guerre, rompant son allégeance à la Russie. Il refuse de soutenir un pays qui n'a pas réussi à garantir leur survie et leur indépendance."
 russia.112.a: "Cette fois, nous devons en finir avec eux"
 russia.113.t: "Les patriotes en colère se soulèvent"
 russia.113.d: "Igor Strelkov, un vétéran militaire et patriote renommé, est récemment arrivé à Donetsk. Il a exhorté les habitants du Donbass à nous résister et à s'opposer au gouvernement qu'ils considèrent comme corrompu et criminel."
 russia.113.a: "Le Donbass nous a trahis."
 russia.114.t: "La Sibérie se soulève"
 russia.114.d: "Des activistes sibériens ont déclaré leur république en Extrême-Orient, refusant de reconnaître notre gouvernement. Cette sécession nous coupe de territoires et de ressources orientaux vitaux."
 russia.114.a: "Nous nous en occuperons."
 russia.115.t: "Le retour de la République de l'Oural"
 russia.115.d: "La République de l'Oural, une initiative du gouverneur Rossel à la fin des années 90, a été écrasée par Eltsine. Maintenant, un sentiment revanchard se rallume chez les habitants de l'Oural, et ils s'efforcent de faire revivre l'ancienne république."
 russia.115.a: "L'Oural paiera pour ça."
 russia.116.t: "Le soulèvement dans le Nord"
 russia.116.d: "Au milieu du chaos, des activistes libéraux du nord de la Russie ont formé un gouvernement qui cherche à nous contrer et à nous renverser. Leur ascension ajoute un nouveau front à la tourmente qui s'abat sur le pays."
 russia.116.a: "Même eux aussi ?!"
 russia.117.t: "Merci d'avoir choisi la Russie !"
 russia.117.d: "La phase finale approche ! Nous sommes ravis d'annoncer la prochaine refonte majeure de la Russie dans notre mod. Cette mise à jour amènera le contenu à un état où d'autres changements à grande échelle ne seront plus nécessaires. Les ajustements futurs seront mineurs et la plupart du temps imperceptibles. Nous espérons que vous apprécierez cette expérience améliorée.\n\n- L'équipe de refonte russe de Era of Nations"
 russia.117.a: "Spasibo"
 russia.118.t: "Le destin du croiseur 'Bakou'"
 russia.118.d: "Le sort du croiseur Bakou est incertain depuis des années. Depuis les années 90, l'Inde a exprimé son intérêt à l'acquérir. Nous devons maintenant décider de le conserver et de le moderniser pour notre marine ou de le vendre à l'Inde pour obtenir des fonds."
 russia.118.a: "Améliorons-le"
 russia.118.b: "Vendons-le"

 NOV_limonka: "Novorossiya"

 georgia_broken_relations: "Relations ruinées avec la Géorgie"
 SOV_Georgian_question: "Destin de la Géorgie"
 SOV_Georgian_question_desc: "Pour le moment, la tâche principale de notre politique étrangère est de résoudre le plus rapidement possible la question de notre future interaction avec la Géorgie."

 # Events Buran
 russia.200.t: "Bonnes nouvelles de Baïkonour"
 russia.200.d: "L'équipe de réparation de Bouran nous a confirmé aujourd'hui que la navette a été retirée avec succès de son hangar vieillissant, marquant le début de son processus de démantèlement. Une équipe d'ingénieurs qualifiés a été réunie pour superviser la déconstruction de la structure."
 russia.200.a: "Comme prévu"

 russia.300.t: "Fonds du projet Bouran détournés"
 russia.300.d: "Des fonds alloués au programme de restauration de Bouran auraient été détournés, redirigeant des ressources essentielles loin du projet. Les efforts pour identifier le coupable ont jusqu'à présent échoué. La disparition des registres financiers et la corruption à haut niveau ont entravé l'enquête."
 russia.300.a: "Maudit soit-il !"

 russia.301.t: "La communauté internationale est admirative"
 russia.301.d: "Grâce à nos efforts draconiens mais réussis de réparation de la navette Bouran, la communauté internationale a été captivée par nos réalisations. Nous pouvons saisir ce moment de reconnaissance mondiale et maximiser son impact tant que les projecteurs sont braqués sur nous."
 russia.301.a: "Rendons hommage aux ingénieurs !"
 russia.301.b: "Rendons hommage à [SOV.GetLeader] !"

 russia.302.t: "La navette Bouran est réparée"
 russia.302.d: "Après des mois de travail minutieux, la navette Bouran a été entièrement restaurée et est prête pour un nouveau chapitre de l'exploration spatiale. Chaque vis, chaque pièce a été vérifiée deux fois, et un vol d'essai réussi a prouvé sa bonne marche. Maintenant préparée pour de futures missions, c'est un moment de triomphe pour la Russie. La renaissance d'un engin légendaire que l'on pensait perdu à jamais."
 russia.302.a: "Un pas en avant pour l'exploration spatiale !"
 russia.3022.t: "La navette Bouran a été réparée par la Russie"
 russia.3022.d: "Après des mois de travail minutieux, la navette Bouran a été entièrement restaurée et est prête pour un nouveau chapitre de l'exploration spatiale. Chaque vis, chaque pièce a été vérifiée deux fois, et un vol d'essai réussi a prouvé sa bonne marche. Maintenant préparée pour de futures missions, c'est un moment de triomphe pour la Russie. La renaissance d'un engin légendaire que l'on pensait perdu à jamais."
 russia.3022.a: "Un pas en avant pour l'exploration spatiale !"

 russia.303.t: "Bouran en réparation est détruite dans un incendie de hangar"
 russia.303.d: "Le 16 juin 2003, une catastrophe s'est produite lorsqu'un incendie a ravagé le hangar temporaire où la navette Bouran était en cours de réparation, la détruisant complètement. Après tous les efforts pour la restaurer et la préparer pour de futures missions, l'héritage de la navette a été réduit en cendres. La perte a été dévastatrice, une fin tragique pour ce qui aurait pu être le retour triomphal de la navette dans le ciel."
 russia.303.a: "Des rêves qui ne se réaliseront jamais"
 russia.3033.t: "Bouran en réparation est détruite dans un incendie de hangar"
 russia.3033.d: "Le 16 juin 2003, une catastrophe s'est produite lorsqu'un incendie a ravagé le hangar temporaire où la navette Bouran était en cours de réparation, la détruisant complètement. Après tous les efforts pour la restaurer et la préparer pour de futures missions, l'héritage de la navette a été réduit en cendres. La perte a été dévastatrice, une fin tragique pour ce qui aurait pu être le retour triomphal de la navette dans le ciel."
 russia.3033.a: "Des rêves qui ne se réaliseront jamais"

 russia.304.t: "Bouran est détruite dans l'effondrement d'un hangar"
 russia.304.d: "Le 12 mai 2002, une tragédie s'est produite lorsque la navette Bouran a été perdue dans un effondrement dévastateur de hangar, mettant fin à son histoire dans un tas de débris et causant de multiples morts. Ce symbole autrefois fier de l'exploration spatiale a été réduit en ruines, pour ne plus jamais voler. Ce fut une fin déchirante pour un engin qui représentait tant d'espoir et d'ambition, désormais à jamais hors de portée."
 russia.304.a: "Des rêves qui ne se réaliseront jamais"
 russia.3044.t: "Bouran est détruite dans l'effondrement d'un hangar"
 russia.3044.d: "Le 12 mai 2002, une tragédie s'est produite lorsque la navette Bouran a été perdue dans un effondrement dévastateur de hangar, mettant fin à son histoire dans un tas de débris et causant de multiples morts. Ce symbole autrefois fier de l'exploration spatiale a été réduit en ruines, pour ne plus jamais voler. Ce fut une fin déchirante pour un engin qui représentait tant d'espoir et d'ambition, désormais à jamais hors de portée."
 russia.3044.a: "Des rêves qui ne se réaliseront jamais"
