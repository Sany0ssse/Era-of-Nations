SOV_reign_of_yeltsin: "Le règne de Boris Eltsine"
SOV_reign_of_yeltsin_desc: "Boris Eltsine fut le premier président de la Fédération de Russie, État successeur de l'URSS, de 1991 à 1999. Il a présidé une période de graves difficultés économiques et une guerre désastreuse en Tchétchénie, et le 31 décembre 1999, il a transmis son poste au Premier ministre Vladimir Poutine."
# Poutine
SOV_putin: "Vladimir Poutine"
SOV_putin_desc: "Vladimir Poutine, né à Leningrad, est un ancien officier du KGB qui a brièvement servi comme directeur du FSB et secrétaire du Conseil de sécurité avant d'être nommé Premier ministre en août 1999. Avec son expérience dans le renseignement étranger, Poutine est considéré comme l'une des figures les plus compétentes — sinon la plus puissante — pour diriger la Russie dans ces temps turbulents."
SOV_the_grand_bargain: "Le grand marché"
SOV_the_grand_bargain_desc: "La Russie est actuellement sous l'emprise des oligarques. Si nous voulons obtenir un réel pouvoir dans le pays, nous devons leur proposer un marché qu'ils ne peuvent refuser."
SOV_stabilisation_fund: "Fonds de stabilisation"
SOV_stabilisation_fund_desc: "Le fonds de stabilisation servira de réserve financière en cas de crise économique. Il aidera à préserver la stabilité nationale pendant les périodes de ralentissement et à garantir le fonctionnement des services publics. Cette sécurité renforce notre position sur les marchés nationaux et internationaux."
SOV_kasyanov_govern: "Gouvernement de Kassianov"
SOV_kasyanov_govern_desc: "Le gouvernement de Kassianov prévoit de conclure un accord avec le Club de Paris pour annuler une partie de notre dette nationale. Cela allégerait les charges financières et stimulerait la croissance. Avec plus de marge de manœuvre fiscale, nous pourrons nous concentrer sur le développement et le bien-être public."
SOV_young_guard: "Jeune Garde"
SOV_young_guard_desc: "La Jeune Garde est l'aile jeunesse du parti Russie unie. Son nom fait référence à un mouvement clandestin héroïque de la Seconde Guerre mondiale. Groupe d'action pro-Poutine, il revendique 85 branches régionales, de Kaliningrad à Vladivostok, mobilisant la jeunesse patriotique à travers la nation."
SOV_reform_sovfed: "Réforme du Conseil de la Fédération"
SOV_reform_sovfed_desc: "Nous réformons le Conseil de la Fédération pour rendre son travail plus efficace. Dans son état actuel, il est peu utile. Avec une meilleure structure et un objectif plus clair, le Conseil peut devenir un outil vital pour la mise en œuvre des politiques."
SOV_npp: "Projets prioritaires nationaux"
SOV_npp_desc: "Depuis l'effondrement de l'Union soviétique, le niveau de vie en Russie a décliné. En 2005, les Projets prioritaires nationaux ont été lancés pour améliorer la santé, l'éducation, le logement et l'agriculture. Ces projets visent à revitaliser les secteurs clés de la vie quotidienne et à renforcer la nation de la base."
SOV_putinism: "Poutinisme"
SOV_putinism_desc: "Bien que Vladimir Poutine n'ait pas d'idéologie formelle, son règne est caractérisé par la domination des oligarques et des anciens officiers militaires, ou siloviki. Ce modèle de gouvernance, connu sous le nom de 'Poutinisme', met l'accent sur le contrôle, la loyauté et l'autorité de l'État."
SOV_empower_siloviki: "Renforcer les siloviki"
SOV_empower_siloviki_desc: "Les 'siloviki' désignent les anciens officiers militaires et de renseignement passés en politique. En les renforçant, nous assurons l'unité interne et une prise de décision guidée par des valeurs partagées et la discipline."
SOV_gen_3_nuclear_plants: "Réacteurs nucléaires de génération 3+"
SOV_gen_3_nuclear_plants_desc: "Les réacteurs nucléaires de génération III+ sont des versions avancées des conceptions précédentes, offrant une sécurité et une efficacité opérationnelle accrues. Développés dans les années 1990 avec les leçons tirées de décennies d'utilisation de l'énergie nucléaire en Occident, ils représentent l'avenir de l'énergie propre et stable pour la Russie."
SOV_revision_6: "Révision numéro 6"
SOV_revision_6_desc: "La révision numéro 6 est une loi de surveillance étendue qui donne au gouvernement l'autorité totale pour surveiller les communications à travers le pays. Bien que controversée, elle est justifiée comme une mesure de sécurité nationale. Sa portée large garantit qu'aucune menace ne passe inaperçue."
SOV_state_corporatism: "Corporatisme d'État"
SOV_state_corporatism_desc: "De nombreuses grandes entreprises russes sont dirigées par des individus ayant des liens avec le gouvernement. En unifiant le pouvoir de l'État et des entreprises, nous pouvons éliminer les inefficacités et aligner l'activité économique sur les objectifs nationaux. Cette fusion donnera à l'État un contrôle total sur l'orientation de l'économie."
SOV_putinism_propaganda: "Propagande du poutinisme"
SOV_putinism_propaganda_desc: "Avant Poutine, la Russie était un pays brisé et humilié. Sous son leadership, l'espoir et la fierté ont été restaurés. Nous célébrerons cette renaissance et veillerons à ce que tous les citoyens comprennent la grandeur qu'il a apportée à la Russie."
SOV_subjects: "Sujets de la Fédération"
SOV_subjects_desc: "Nous visons à introduire des interactions plus claires et structurées avec les sujets fédéraux. Cela permettra une meilleure coordination économique et une cohésion politique renforcée à travers toutes les régions."
SOV_referendum_in_chechnya: "Référendum en Tchétchénie"
SOV_referendum_in_chechnya_desc: "La Tchétchénie est culturellement et politiquement distincte du reste de la Russie. La seule voie vers la paix est de laisser son peuple décider — intégration complète dans la Fédération de Russie ou un certain degré d'autonomie. Nous respecterons leur choix et travaillerons vers un règlement durable."
SOV_referendum_in_bashkiria: "[BSH.GetNameWithFlag] - Référendum sur le statut"
SOV_referendum_in_bashkiria_desc: "Nous alignerons notre constitution et notre cadre légal avec ceux de [BSH.GetNameWithFlag]. C'est une étape clé vers une gouvernance unifiée et une clarté administrative."
SOV_referendum_in_tatarstan: "[TAT.GetNameWithFlag] - Référendum sur le statut"
SOV_referendum_in_tatarstan_desc: "Nous alignerons notre constitution et notre cadre légal avec ceux de [TAT.GetNameWithFlag]. Harmoniser ces documents assure une cohérence au sein de la Fédération."
SOV_referendum_in_khmao: "[KHM.GetNameWithFlag] - Référendum sur le statut"
SOV_referendum_in_khmao_desc: "Nous alignerons notre structure légale avec celle de [KHM.GetNameWithFlag] pour assurer une meilleure intégration et administration. Cette unification légale réduira les frictions et aidera à standardiser la gouvernance à travers les régions."
SOV_referendum_in_crimea: "[CRM.GetNameWithFlag] - Référendum sur le statut"
SOV_referendum_in_crimea_desc: "Nous alignerons notre constitution et nos lois avec celles de [CRM.GetNameWithFlag], consolidant sa place dans la Fédération. La clarté légale est essentielle pour une stabilité et une légitimité à long terme."
SOV_referendum_in_kuban: "Projet de la République de Kouban [KUB.GetFlag]"
SOV_referendum_in_kuban_desc: "La République de Kouban était une création historique pendant la guerre civile russe. Aujourd'hui, nous envisageons d'élargir à nouveau son autonomie, pour le bénéfice économique mutuel de la région et de la Russie dans son ensemble."
SOV_referendum_in_ural: "Relancer le projet de la République de l'Oural [URA.GetFlag]"
SOV_referendum_in_ural_desc: "La République de l'Oural a été proposée par le gouverneur Eduard Rossel pour donner à la région un statut équivalent aux républiques nationales. Bien que bloquée légalement, l'idée persiste. Il est peut-être temps de revisiter et éventuellement relancer ce projet longtemps enfoui."
SOV_the_putinka: "La Putinka"
SOV_the_putinka_desc: "Les Khrouchtchevkas d'antan sont remplacées par un nouveau modèle de logement, la Putinka. Moderne, spacieuse et plus durable, ces bâtiments marquent une nouvelle ère dans le développement urbain russe."
SOV_sign_bologna_accords: "Signer les accords de Bologne"
SOV_sign_bologna_accords_desc: "Le processus de Bologne est un accord européen visant à standardiser l'enseignement supérieur à travers les nations. En signant les accords, nous nous alignons sur les normes éducatives mondiales, facilitant les études à l'étranger pour les étudiants russes et la reconnaissance de nos diplômes par les institutions étrangères."
SOV_enforce_oligarchs_control: "Imposer un contrôle sur les oligarques"
SOV_enforce_oligarchs_control_desc: "Les oligarques ont peut-être de l'influence, mais un contrôle direct de l'État est bien plus efficace. En montrant que l'État est plus puissant, nous pouvons créer un système stable de corporations dirigées par l'État qui profite à l'ensemble du pays."
SOV_2011_healthcare_reforms: "Réformes de la santé de 2011"
SOV_2011_healthcare_reforms_desc: "Les réformes de la santé de 2011 ont été proposées par le Premier ministre Vladimir Poutine. Elles ont consacré plus de 300 milliards de roubles à l'amélioration des soins de santé à travers la Russie, visant à accroître l'accès et la qualité pour tous les citoyens."
SOV_mitigate_financial_crisis: "Atténuer la crise financière"
SOV_mitigate_financial_crisis_desc: "La récession mondiale de 2008 affecte la Russie comme le reste du monde. Nous devons prendre des mesures fortes pour protéger notre économie et préserver les progrès réalisés depuis l'effondrement de l'Union soviétique."
SOV_develop_it_industry: "Développer l'industrie informatique"
SOV_develop_it_industry_desc: "Le secteur informatique russe accuse des décennies de retard par rapport à ses homologues occidentaux. Nous avons besoin de leaders innovants et d'entreprises similaires à Steve Jobs, Bill Gates, Google, Microsoft, Apple et Facebook pour faire avancer notre technologie."
SOV_renewable_energy_investments: "Investissements dans l'énergie renouvelable"
SOV_renewable_energy_investments_desc: "Nos ressources pétrolières et gazières sont limitées, et le changement climatique représente une menace sérieuse. Investir dans l'énergie renouvelable réduira notre dépendance aux hydrocarbures et aidera la Russie à devenir un leader mondial dans les technologies d'énergie propre."
SOV_commercialize_glonass: "Commercialiser GLONASS"
SOV_commercialize_glonass_desc: "GLONASS est le système de navigation par satellite de la Russie, offrant une alternative au GPS. Élargir son utilisation commerciale renforcera notre indépendance technologique et ouvrira de nouvelles opportunités économiques."
SOV_increase_roscosmos_funding: "Augmenter le financement de Roscosmos"
SOV_increase_roscosmos_funding_desc: "Roscosmos, héritier de l'héritage du programme spatial soviétique, est la principale agence spatiale de la Russie. Augmenter son financement est essentiel pour rester dans la course spatiale internationale et faire progresser nos capacités technologiques."
SOV_go_russia: "Allez, Russie !"
SOV_go_russia_desc: "La Russie est une grande puissance avec un potentiel inarrêtable. Sous le leadership de Poutine, nous reprendrons notre place légitime en tant que superpuissance mondiale dominante dans les années à venir."
SOV_medvedev_modernization_program: "Programme de modernisation de Medvedev"
SOV_medvedev_modernization_program_desc: "Lancé en 2009, le programme de modernisation de Medvedev visait à diversifier l'économie russe et à réduire la dépendance au pétrole et au gaz. Il mettait l'accent sur l'efficacité énergétique, la technologie nucléaire, l'informatique, les produits pharmaceutiques et l'exploration spatiale, tout en promouvant la transparence et la responsabilité du gouvernement."
SOV_rokirovka: "Rokirovka"
SOV_rokirovka_desc: "Rokirovka, signifiant roque en échecs, fait référence au retrait de Poutine après son mandat présidentiel pour permettre à Medvedev de prendre le pouvoir. Ce mouvement stratégique a assuré la continuité du leadership dans le système politique russe."
SOV_gay_propaganda_laws: "Lois sur la propagande LGBT"
SOV_gay_propaganda_laws_desc: "Nous avons l'intention de nous opposer à la représentation LGBT dans notre société pour protéger les valeurs de notre peuple et préserver l'esprit de la jeunesse contre ce que nous considérons comme des influences néfastes."
SOV_anti_corruption_foundation: "Fondation anti-corruption"
SOV_anti_corruption_foundation_desc: "La corruption a profondément infecté les systèmes politique et économique russes. Créer un comité gouvernemental dédié avec une réelle autorité est nécessaire pour lutter efficacement contre ce problème et restaurer la confiance du public."
SOV_economic_liberalism: "Marchés libres, peuple libre"
SOV_economic_liberalism_desc: "Les marchés libres sont essentiels pour sortir la Russie de la pauvreté et encourager la croissance. Le gouvernement doit s'écarter et permettre aux entreprises d'opérer librement, sans interférence ni favoritisme."
SOV_the_novorossiyan_uprising: "Le soulèvement de Novorossiya"
SOV_the_novorossiyan_uprising_desc: "Les peuples de Lougansk et Donetsk cherchent la souveraineté nationale vis-à-vis de l'Ukraine. Fournir un soutien discret à ces combattants de la liberté pourrait faire pencher l'équilibre régional en faveur de la Russie."
SOV_annexation_of_crimea: "Annexion de la Crimée"
SOV_annexation_of_crimea_desc: "S'emparer de la Crimée, une péninsule stratégiquement vitale et ethniquement russe, est crucial. Déployer des troupes sans marques distinctives pour soutenir les soulèvements locaux maintiendra une plausible dénégation et retardera toute intervention occidentale."
SOV_the_new_dictator: "Le dictateur"
SOV_the_new_dictator_desc: "Les prétentions démocratiques ne sont plus nécessaires. Poutine, Medvedev et Russie unie savent ce qui est le mieux pour la Russie. Le leadership doit être fort et permanent pour l'avenir du pays."
SOV_police_reforms: "Réformes de la sécurité"
SOV_police_reforms_desc: "Réformer les agences de renseignement est vital pour la stabilité et les efforts anti-corruption. Réduire le pouvoir des siloviki aidera à protéger la démocratie russe et à renforcer le contrôle gouvernemental."
SOV_root_out_corruption: "Éliminer les oligarques"
SOV_root_out_corruption_desc: "Les oligarques représentent les vestiges corrompus de l'ère Poutine. Ils doivent être éliminés, leurs actifs saisis et leur influence démantelée pour rétablir l'ordre et la justice."
SOV_multi_party_encouragement: "Accords linguistiques"
SOV_multi_party_encouragement_desc: "Les Russes et les Ukrainiens partagent des liens culturels et linguistiques profonds. Nous devons garantir des droits linguistiques égaux pour renforcer l'unité et le respect mutuel entre nos peuples."
SOV_democracy_in_russia: "Mesures pour l'intégrité des élections"
SOV_democracy_in_russia_desc: "Les gens ne font confiance aux élections que si elles sont justes et transparentes. Nous devons prendre des mesures pour rétablir la confiance dans le processus électoral russe après des années de corruption et de doutes."
SOV_neoliberal_foreign_policy: "Hégémonie libérale"
SOV_neoliberal_foreign_policy_desc: "Pour protéger notre sécurité et soutenir les démocraties libérales dans le monde, nous devons activement résister aux régimes autocratiques là où ils menacent la paix et la stabilité."
SOV_withdraw_from_the_sco: "Se retirer de l'OCS"
SOV_withdraw_from_the_sco_desc: "L'Organisation de coopération de Shanghai est composée de gouvernements autocratiques qui s'opposent à nos valeurs. Il est dans l'intérêt de la Russie de se distancier de ce groupe."
SOV_rein_in_the_government: "Maîtriser le gouvernement"
SOV_rein_in_the_government_desc: "Avec l'opposition efficacement neutralisée, nous pouvons renforcer le contrôle sur le gouvernement fédéral et assurer une direction unifiée pour l'avenir de la Russie."
SOV_support_euromaidan: "Aider l'Ukraine"
SOV_support_euromaidan_desc: "L'Ukraine fait face à des troubles. Soutenir notre nation frère aidera à stabiliser son gouvernement et à sécuriser nos intérêts régionaux."
SOV_support_democratic_belarus: "Apporter la démocratie en Biélorussie"
SOV_support_democratic_belarus_desc: "Il est temps de libérer la Biélorussie de la dictature et de soutenir le développement de la démocratie et de la liberté pour son peuple."
SOV_buy_belarus: "Corrompre les officiels clés"
SOV_buy_belarus_desc: "Pour gagner de l'influence en Biélorussie, nous devons corrompre stratégiquement des officiels clés et sécuriser leur loyauté envers notre cause."
SOV_civil_war_belarus: "Renverser les occupants de la Biélorussie"
SOV_civil_war_belarus_desc: "Le moment est venu de libérer la Biélorussie de l'occupation étrangère et de restaurer la souveraineté à son peuple légitime."
SOV_green_energy_investments: "Investissements dans l'énergie verte"
SOV_green_energy_investments_desc: "Les compagnies pétrolières contrôlent depuis longtemps la politique et les affaires russes. Réduire notre dépendance aux combustibles fossiles combattra la corruption et ouvrira la voie à un avenir énergétique plus propre."
SOV_nato_exercises: "Exercices Russie-OTAN"
SOV_nato_exercises_desc: "Pour établir des liens plus forts, les forces russes et de l'OTAN organiseront prochainement des exercices conjoints réguliers, favorisant la coopération et la compréhension mutuelle."
SOV_nato_standardization: "Adopter les normes de l'OTAN"
SOV_nato_standardization_desc: "Rejoindre l'OTAN nécessite d'aligner notre équipement et notre production sur leurs normes. Cela exigera des réformes importantes dans notre industrie militaire."
SOV_closer_ties_with_the_west: "Rapprochement avec l'Occident"
SOV_closer_ties_with_the_west_desc: "La Guerre froide est terminée. Il est temps de dépasser les vieux conflits et de construire de nouvelles amitiés avec les nations occidentales."
SOV_may_decrees: "Décrets de mai"
SOV_may_decrees_desc: "Le premier jour de sa présidence en 2012, Poutine a émis 14 décrets présidentiels, connus sous le nom de Décrets de mai. Ces derniers se concentraient sur l'éducation, le logement, la main-d'œuvre qualifiée, les relations avec l'UE, l'industrie de la défense et les relations interethniques pour guider le développement de la Russie."
SOV_loosen_government_censorship: "Renforcer la censure gouvernementale"
SOV_loosen_government_censorship_desc: "Après avoir obtenu un troisième mandat sans précédent, il est important de renforcer le contrôle sur les médias et l'information pour maintenir la stabilité et prévenir la dissidence."
SOV_unite_with_asia: "Union centrasiatique"
SOV_unite_with_asia_desc: "Nous devons consolider notre union avec les nations d'Asie centrale tant que nous le pouvons encore. Cela renforcera notre influence et sécurisera l'avenir de la région."
SOV_counter_euromaidan: "Contrecarrer Euromaïdan"
SOV_counter_euromaidan_desc: "L'Ukraine s'éloigne de plus en plus de notre influence. Nous devons agir de manière décisive pour leur rappeler qui sont leurs véritables alliés."
SOV_extend_term_limits: "Prolonger les limites de mandat"
SOV_extend_term_limits_desc: "Actuellement, le mandat présidentiel est de quatre ans. Le prolonger à six ans permettra une gouvernance stable et une continuité jusqu'au moins 2018."
SOV_moscow_tehran_axis: "Axe Moscou-Téhéran"
SOV_moscow_tehran_axis_desc: "La Russie et l'Iran partagent des alliances naturelles et des intérêts communs. Vive l'amitié entre les empires russe et perse."
SOV_fly_byu_drones: "Renforcer la coopération militaire"
SOV_fly_byu_drones_desc: "Nous élargirons la coopération militaire avec l'Iran en fournissant des avions de combat et, en échange, recevrons leur technologie de drones kamikazes pour renforcer nos forces."
SOV_alliance_with_india: "Accords de Delhi"
SOV_alliance_with_india_desc: "L'Inde et la Russie ont une longue histoire de résistance à l'impérialisme. Nous célébrons notre amitié et espérons qu'elle perdure pendant de nombreuses années."
SOV_alliance_with_china: "Conférence de Shanghai"
SOV_alliance_with_china_desc: "Ensemble, la Chine et la Russie forment un bloc puissant s'opposant à l'Occident mondialiste. Nous sommes déterminés à remplacer leur influence par la nôtre."
SOV_acquire_drones: "Acquérir des drones étrangers"
SOV_acquire_drones_desc: "L'Iran nous propose une technologie avancée de drones pour soutenir nos opérations militaires spéciales. Accepter leur proposition pourrait améliorer considérablement nos capacités."
SOV_aggressive_foreign_policy: "Politique étrangère agressive"
SOV_aggressive_foreign_policy_desc: "Avec l'opposition interne maîtrisée, la Russie peut maintenant adopter une posture plus affirmée à l'étranger. Protéger les Russes ethniques à l'étranger fournit une justification pour influencer et intervenir si nécessaire."
SOV_challenge_nato: "Défier l'OTAN"
SOV_challenge_nato_desc: "L'OTAN signifie Organisation Terroriste de l'Atlantique Nord. Nous devons mettre fin à leur contrôle impérialiste et établir notre hégémonie sur l'Europe."
SOV_zov_in_belarus: "Tenter de regagner de l'influence en Biélorussie"
SOV_zov_in_belarus_desc: "Nous essaierons de reprendre le contrôle sur la Biélorussie malgré le fait que ses autorités ont adopté une position clairement anti-russe. Cet effort est crucial pour restaurer notre influence et sécuriser nos intérêts stratégiques dans la région."
SOV_support_vitebsk: "Développer le projet Vitebsk"
SOV_support_vitebsk_desc: "Notre projet de longue date de la République populaire de Vitebsk est prêt à être mis en œuvre. Il est temps d'allumer un soulèvement qui servira de point d'appui pour étendre notre influence en Biélorussie."
SOV_wagner_to_vitebsk: "Wagner à Vitebsk"
SOV_wagner_to_vitebsk_desc: "La société militaire privée Wagner est prête à aider les rebelles de Vitebsk avec leurs mercenaires expérimentés. Leur implication renforcera le soulèvement et augmentera ses chances de succès."
SOV_condemn_belarusian_russophobes: "Condamner la politique anti-russe biélorusse"
SOV_condemn_belarusian_russophobes_desc: "Nous continuerons à dénoncer publiquement le régime biélorusse actuel pour ses politiques anti-russes dangereuses. Cette rhétorique aidera à isoler le régime et à rallier le soutien parmi le peuple biélorusse."
SOV_belarus_strike: "Minsk en 3 jours"
SOV_belarus_strike_desc: "Le moment est venu de porter un coup décisif contre le régime nationaliste qui gouverne la Biélorussie. Une frappe rapide et écrasante sur Minsk démontrera notre détermination et modifiera l'équilibre des pouvoirs dans la région."
SOV_belarus_passports: "Distribuer des passeports russes à Vitebsk"
SOV_belarus_passports_desc: "Nous commencerons à distribuer la citoyenneté russe aux résidents de Vitebsk. Cette mesure renforcera notre revendication sur la région et offrira une meilleure protection et des droits à notre peuple là-bas."
SOV_2021_ukrainian_coup: "Le coup d'État ukrainien"
SOV_2021_ukrainian_coup_desc: "Il n'y a plus de place pour des négociations avec Kiev. Nous devons travailler à changer le régime par tous les moyens nécessaires et restaurer un gouvernement plus favorable aux intérêts russes."
SOV_blr_union_programm: "Coordonner les programmes d'union avec la Biélorussie"
SOV_blr_union_programm_desc: "Pour renforcer nos liens, nous coordonnerons et mettrons en œuvre plusieurs feuilles de route d'intégration avec la Biélorussie. Ces programmes approfondiront notre coopération économique et politique."
SOV_recognize_novorossiya: "Reconnaître Novorossiya"
SOV_recognize_novorossiya_desc: "Novorossiya est une région historique de l'est de l'Ukraine avec une population majoritairement russe. Nous ne pouvons abandonner notre peuple à un gouvernement ukrainien qui s'oppose ouvertement à la culture et aux intérêts russes."
SOV_condemn_ukrainian_russophobes: "Condamner les russophobes ukrainiens"
SOV_condemn_ukrainian_russophobes_desc: "Les récents changements politiques en Ukraine montrent clairement que le gouvernement de Kiev n'a pas l'intention de respecter les liens historiques entre la Russie et ses régions frontalières. Nous devons adapter notre rhétorique diplomatique en conséquence et envisager de fabriquer des incidents pour justifier notre position."
SOV_exercises_belarus_start: "Détermination alliée — exercices"
SOV_exercises_belarus_start_desc: "Les forces armées russes et biélorusses mèneront des exercices militaires conjoints pour démontrer notre unité et notre readiness à défendre nos intérêts communs."
SOV_the_final_strike: "La frappe finale"
SOV_the_final_strike_desc: "L'Ukraine a choisi une voie qui menace la stabilité régionale. Il est temps d'agir de manière décisive et de corriger cette trajectoire. En avant vers la victoire !"
SOV_secret_strike: "La frappe inattendue"
SOV_secret_strike_desc: "Tout en détournant l'attention mondiale, notre véritable objectif a été la Finlande. Il est temps de riposter pour les conflits passés avec une frappe surprise. Gloire à nos forces !"
SOV_pasports_novorossiya: "Distribuer des passeports russes"
SOV_pasports_novorossiya_desc: "Nous distribuerons la citoyenneté russe aux résidents des régions que nous avons libérées, consolidant leur lien avec la mère patrie et les protégeant sous la loi russe."
SOV_russian_taker: "Le collecteur des terres russes"
SOV_russian_taker_desc: "Notre mission est de ramener les terres historiquement russes à leur place légitime au sein de la Russie. Nous porterons cette responsabilité avec fierté et détermination."
SOV_karelian_republic: "République carélo-finlandaise"
SOV_karelian_republic_desc: "En raison des difficultés rencontrées par la minorité russe dans certaines parties de la Finlande, nous annexerons des parties de la Finlande pour rejoindre notre République carélienne. Cette action est justifiée par l'oppression subie par les Caréliens dans ces zones."
SOV_UVZ_expanding: "Faire travailler UralVagonZavod à 146 %"
SOV_UVZ_expanding_desc: "Notre pays a un besoin urgent de chars en grande quantité. Nous pousserons UralVagonZavod à augmenter sa production pour répondre à ces exigences et assurer notre force militaire."
SOV_more_drones: "Investir dans la production de drones"
SOV_more_drones_desc: "La guerre moderne repose fortement sur la technologie sans pilote. Nous devons investir massivement dans la production de drones pour rester à la pointe des développements militaires contemporains."
SOV_vstavai_strana: "Bataillons nationaux"
SOV_vstavai_strana_desc: "Les peuples de la Russie doivent se lever ensemble pour défendre notre patrie. Les bataillons nationaux incarneront cet esprit et combattront avec une détermination inégalée."
SOV_armneia_arbat: "Bataillon arménien Arbat"
SOV_armneia_arbat_desc: "Nos frères arméniens sont prêts à nous soutenir dans le conflit. Leur engagement et leur bravoure renforceront nos efforts sur le champ de bataille."
SOV_npp_again: "Nouveaux projets nationaux"
SOV_npp_again_desc: "Le gouvernement a lancé de nouveaux projets nationaux visant à stimuler l'économie à des niveaux sans précédent. Ces initiatives auront un impact sur divers secteurs, du bien-être social à l'avancement technologique."
SOV_m12: "Autoroute fédérale M12 'Vostok'"
SOV_m12_desc: "L'autoroute fédérale M12 Vostok relie des villes majeures, y compris Moscou, Vladimir, Mourom, Arzamas, Kazan, Nijnekamsk, Iekaterinbourg et Tioumen. Ce développement d'infrastructure est une partie clé de nos efforts de modernisation nationale."
SOV_volunteer_gifts: "Dons des citoyens"
SOV_volunteer_gifts_desc: "Les citoyens concernés contribuent généreusement pour soutenir les lignes de front. Leurs dons fournissent des ressources essentielles et boostent le moral de nos troupes."
SOV_reconservation: "Déconservation"
SOV_reconservation_desc: "Nous réactiverons les stocks d'armes et d'équipements conservés depuis l'ère soviétique. Cela renforcera rapidement nos capacités militaires sans nécessiter de nouvelle production."
SOV_contracts_with_minobr: "Contrat avec le ministère de la Défense"
SOV_contracts_with_minobr_desc: "Pour apporter de l'ordre aux troupes, tout le personnel doit signer des contrats formels avec le ministère de la Défense. Cela garantira la discipline et la clarté dans le commandement."
SOV_african_corps: "Créer le Corps africain"
SOV_african_corps_desc: "Nous visons à maintenir nos liens stratégiques en Afrique développés à travers les activités de Wagner PMC. Former un corps officiel au sein des forces armées renforcera la coopération continue avec les nations africaines."
SOV_unite_as_one: "Respecter l'histoire de la Russie"
SOV_unite_as_one_desc: "Notre nation a une histoire vaste et riche. Nous devons honorer et respecter notre héritage comme fondation pour l'unité et la fierté à venir."
SOV_anti_bsb: "Interdire l'opposition"
SOV_anti_bsb_desc: "Il est temps de prendre des mesures décisives contre les groupes d'opposition pro-occidentaux qui sapent notre stabilité et répandent l'influence étrangère."
SOV_referendums_novorossiya: "Référendums sur l'adhésion à la Russie"
SOV_referendums_novorossiya_desc: "Le moment est venu pour Novorossiya de se réunir officiellement avec la Russie. Organiser des référendums permettra au peuple d'exprimer sa volonté et de légitimer ce processus."
SOV_attack_moldova: "Libérer la Moldavie"
SOV_attack_moldova_desc: "Nos alliés en Transnistrie souffrent sous le contrôle moldave. Élargir notre zone tampon contre l'OTAN en libérant la Moldavie sécurisera la frontière ouest de la Russie et protégera nos intérêts."
SOV_information_war: "Guerre de l'information"
SOV_information_war_desc: "Pour affaiblir le soutien occidental à l'Ukraine, nous devons diffuser une propagande ciblée en ligne. Contrôler le récit est crucial pour influencer l'opinion internationale et atteindre nos objectifs."
SOV_zyuganov: "Gennadi Ziouganov"
SOV_zyuganov_desc: "Gennadi Ziouganov, né en 1944, dirige le Parti communiste de la Fédération de Russie depuis 1993. Lors de l'élection présidentielle de 1996, il était initialement favori pour battre Boris Eltsine, mais a finalement perdu au second tour avec 40,7 % des voix contre 54,4 % pour Eltsine. La politique de Ziouganov combine une idéologie de gauche avec une forte perspective nationaliste."
SOV_coup_major_post_soviet_countries: "Coup d'État dans les républiques"
SOV_coup_major_post_soviet_countries_desc: "Au lieu de risquer une intervention militaire désastreuse, nous offrirons aux républiques séparatistes une proposition irrésistible. Cette approche diplomatique vise à les ramener sous notre influence sans effusion de sang."
SOV_allied_nrk_2: "Alliance avec la Corée du Nord"
SOV_allied_nrk_2_desc: "Nous prévoyons d'élargir nos alliances vers l'Est, en commençant par la Corée du Nord — une nation dont le peuple apprécie notre soutien passé et doit en grande partie sa survie à notre aide."
SOV_warsaw_finland: "Finlande rouge"
SOV_warsaw_finland_desc: "Pendant la guerre civile russe, une tentative a été faite pour établir un gouvernement socialiste en Finlande afin de récupérer les territoires perdus. Maintenant, nous sommes prêts à accomplir cette mission en intégrant la Finlande dans le Pacte de Varsovie."
SOV_mongolia_question: "Question mongole"
SOV_mongolia_question_desc: "La Mongolie a historiquement maintenu une neutralité à notre demande pour éviter un conflit avec la Chine et préserver des relations amicales. Cependant, nous sommes maintenant prêts à mettre de côté ces préoccupations et à proposer une union complète avec la Mongolie."
SOV_vietnam_question: "Question vietnamienne"
SOV_vietnam_question_desc: "Le Vietnam est depuis longtemps un allié et partenaire fiable. Le moment est venu d'approfondir notre coopération et d'élever ce partenariat à un nouveau niveau."
SOV_spain_influ: "Revoir l'issue de la guerre civile"
SOV_spain_influ_desc: "Les forces socialistes ont été vaincues lors de la guerre civile espagnole. Nous sommes prêts à aider les communistes espagnols à se relever pour restaurer la dictature du prolétariat en Espagne."
SOV_avenge_afgan: "Deuxième intervention en Afghanistan"
SOV_avenge_afgan_desc: "Notre première tentative de prendre le contrôle de l'Afghanistan s'est soldée par un échec. Maintenant, nous sommes prêts à venger cette défaite et à accomplir enfin nos objectifs dans ce qu'on appelle le 'Cimetière des empires'."
SOV_iraq_influ: "Irak rouge"
SOV_iraq_influ_desc: "Bien que l'Irak soit géographiquement éloigné et n'ait jamais été étroitement allié avec nous, nous sommes prêts à soutenir leurs efforts pour renverser le régime anti-soviétique actuellement au pouvoir."
SOV_warsaw_greece: "Répéter la guerre civile en Grèce"
SOV_warsaw_greece_desc: "La guerre civile grecque de 1946 à 1949 s'est terminée par une défaite des forces communistes. Maintenant, nous sommes prêts à revenir et à prendre notre revanche pour reprendre l'influence."
SOV_mobilize_the_masses: "Mobiliser les masses"
SOV_mobilize_the_masses_desc: "La révolution nécessite un large soutien populaire, pas seulement un parti d'avant-garde. Le Parti communiste doit engager les travailleurs et les agriculteurs russes politiquement et économiquement en créant des emplois, en rénovant les usines et en construisant des collectifs de travail."
SOV_fight_international_capitalists: "Combattre les capitalistes internationaux"
SOV_fight_international_capitalists_desc: "Les oligarques rappellent les koulaks d'antan — corrompus et dangereux. Depuis l'effondrement de l'URSS, ils ont étendu leur contrôle, déplaçant les travailleurs et promouvant le capitalisme mondial. Pour relancer la Russie, nous devons d'abord éliminer cette classe capitaliste internationale."
SOV_weaken_the_banks: "Affaiblir les banques"
SOV_weaken_the_banks_desc: "Les banques agissent comme les exécuteurs du capitalisme, exploitant les travailleurs dans le monde entier par la suppression des salaires et des prêts prédateurs. Elles manipulent la politique par des moyens légaux et illicites. Les banques doivent être dépouillées de leur pouvoir et reléguées à de simples prêteurs apolitiques."
SOV_communist_purges: "Purgés communistes"
SOV_communist_purges_desc: "L'effondrement du communisme en 1991 fut une défaite humiliante. Nous devons déraciner ceux au sein du Parti responsables de cette trahison et les purger des positions de pouvoir."
SOV_restalinization: "Restalinisation"
SOV_restalinization_desc: "Staline mérite un nouvel hommage pour avoir construit le socialisme et protégé l'humanité du fascisme. La grandeur de son ère est indéniable, même pour ses critiques les plus acharnés. Nous libérerons le monde sous son héritage."
SOV_zyuga_reforms_start: "Domination du Parti communiste"
SOV_zyuga_reforms_start_desc: "Le Parti communiste de la Fédération de Russie sait mieux comment gouverner. Si on lui donne carte blanche, nous construirons une véritable utopie communiste qui réussira là où le passé a échoué."
SOV_empower_the_communist_party: "Renforcer le Parti communiste"
SOV_empower_the_communist_party_desc: "À peine une décennie s'est écoulée depuis l'essor du capitalisme, mais son système politique est enraciné et doit être éliminé. La première étape vers la domination du Parti est de s'emparer des élections locales et régionales."
SOV_zyuganov_constitution: "La constitution de Ziouganov"
SOV_zyuganov_constitution_desc: "Il est temps d'abandonner la constitution capitaliste de 1991. Nous avons besoin d'un nouveau document qui garantisse des droits politiques et économiques reflétant les valeurs des citoyens soviétiques, des droits refusés en Occident."
SOV_honor_gorbachevs_legacy: "Honorer l'héritage de Gorbatchev"
SOV_honor_gorbachevs_legacy_desc: "Les réformes de Gorbatchev ont été sabotées par des capitalistes cachés visant à détruire le communisme. Nous devons restaurer ses réformes et maintenir une économie mixte pour servir de bastion communiste moderne."
SOV_nationalize_foreign_business: "Nationaliser les entreprises étrangères"
SOV_nationalize_foreign_business_desc: "Les usines industrielles appartenant à des étrangers posent des risques pour la sécurité économique. Face aux sanctions, ces propriétaires pourraient fuir et dépouiller des actifs vitaux. Nous devons nationaliser ces industries pour protéger notre économie, quelles que soient les répercussions diplomatiques."
SOV_condemn_globalism: "Condamner le mondialisme"
SOV_condemn_globalism_desc: "Le mondialisme prétend promouvoir la coopération mondiale, mais c'est en réalité un complot capitaliste pour exploiter le peuple et les ressources de la Russie. Nous rejetterons cela et construirons notre économie, notre société et notre armée pour renverser la Pax Americana."
SOV_russian_sfsr: "La RSFSR"
SOV_russian_sfsr_desc: "L'effondrement de l'URSS découle d'une trop grande importance accordée à l'égalité entre les nations. Nous construirons un État communiste axé uniquement sur les intérêts nationaux russes pour créer une union plus forte et plus stable."
SOV_reunite_the_ussr: "L'URSS"
 SOV_reunite_the_ussr_desc: "Malgré les dangers du séparatisme nationaliste, créer une seconde URSS est vital pour poursuivre la révolution soviétique. Une superstructure communiste forte peut surmonter le nationalisme et unir des peuples divers."
SOV_european_communist_pressure: "Pression communiste européenne"
SOV_european_communist_pressure_desc: "Les Européens craignent souvent le communisme à cause de la propagande capitaliste. Une fois cette barrière brisée, le système capitaliste s'effondrera, révélant la vérité sur les promesses du communisme."
SOV_first_two_year_plan: "Premier plan quinquennal"
SOV_first_two_year_plan_desc: "Les modèles de marché libre occidentaux n'offrent aucun avenir pour le socialisme. Un retour à une économie planifiée à travers des plans quinquennaux de style soviétique restaurera le contrôle gouvernemental sur l'économie."
SOV_civilian_industrial_councils: "Conseils industriels civils"
SOV_civilian_industrial_councils_desc: "Pour relancer l'industrie russe, nous devons créer des emplois axés sur la construction de machines lourdes. Bien que principalement destinés au marché intérieur, cela soutiendra également les mouvements révolutionnaires à l'étranger grâce à des équipements fabriqués en Russie."
SOV_a_second_two_year_plan: "Second plan quinquennal"
SOV_a_second_two_year_plan_desc: "Un second plan quinquennal renforcera la sécurité et l'indépendance économiques soviétiques, garantissant une croissance industrielle à long terme et une domination."
SOV_recollectivization: "Recollectivisation"
SOV_recollectivization_desc: "La propriété privée est inacceptable. La terre et les biens appartiennent au peuple, pas aux élites capitalistes. Nous exigeons le retour de nos terres à ceux qui les travaillent."
SOV_reestablish_the_military_industrial_complex: "Rétablir le complexe militaro-industriel"
SOV_reestablish_the_military_industrial_complex_desc: "L'armée et le peuple ne font qu'un. Reconstruire notre complexe militaro-industriel renforcera notre défense et nos capacités révolutionnaires."
SOV_territorial_demands: "Revendications territoriales"
SOV_territorial_demands_desc: "Restaurer la gloire soviétique nécessite de dissoudre les États-nations créés pour protéger les intérêts capitalistes. Ces frontières arbitraires doivent être démantelées pour unir le prolétariat."
SOV_military_industrial_councils: "Conseils industriels militaires"
SOV_military_industrial_councils_desc: "Parallèlement aux conseils civils, une industrie de défense contrôlée par le parti nous permettra de produire des armes pour défendre la Russie rouge et soutenir les révolutions communistes dans le monde."
SOV_increase_minimum_wage: "Augmenter le salaire minimum"
SOV_increase_minimum_wage_desc: "Tout le monde mérite un salaire qui garantit une vie heureuse et décente. Augmenter le salaire minimum est essentiel pour respecter ce droit."
SOV_merge_tank_and_aircraft_plants: "Fusionner les usines de chars et d'avions"
SOV_merge_tank_and_aircraft_plants_desc: "Plusieurs entreprises produisent des matériaux similaires de manière inefficace. Fusionner ces usines réduira les redondances et maximisera la production industrielle."
SOV_empower_the_nkvd: "Renforcer le KGB"
SOV_empower_the_nkvd_desc: "Notre sécurité d'État doit recevoir un financement accru et une autonomie pour perturber les intérêts capitalistes, tant à l'intérieur qu'à l'extérieur du pays."
SOV_scientific_councils: "Conseils scientifiques"
SOV_scientific_councils_desc: "Nous devons accélérer la formation des jeunes Russes les plus brillants dans les meilleures institutions pour servir la révolution. Leurs innovations et inventions garantiront notre avance scientifique et militaire."
SOV_challenge_nato_3: "Libération de l'Europe"
SOV_challenge_nato_3_desc: "Les gouvernements européens trompent le prolétariat depuis trop longtemps. Il est temps de lancer une opération militaire spéciale pour dénazifier l'Europe à nouveau, comme nous l'avons fait en 1945."
SOV_soviet_war_memorials: "Mémoriaux de guerre soviétiques"
SOV_soviet_war_memorials_desc: "Vingt-sept millions de citoyens soviétiques sont morts pendant la Grande Guerre patriotique. Nous devons honorer leur sacrifice et préserver leur mémoire pour les générations futures avec une gloire éternelle."
SOV_glory_of_the_red_army: "La gloire de l'Armée rouge"
SOV_glory_of_the_red_army_desc: "L'Armée rouge reste la force militaire la plus puissante et respectée de l'histoire."
SOV_soviet_academy_of_sciences: "Académie des sciences soviétique"
SOV_soviet_academy_of_sciences_desc: "L'Académie des sciences soviétique est la principale institution scientifique de l'URSS. Nos esprits les plus brillants travaillent sans relâche pour réaliser des percées qui rendent le monde capitaliste envieux."
SOV_ban_private_land_ownership: "Interdire la propriété foncière privée"
SOV_ban_private_land_ownership_desc: "La terre est un droit humain fondamental, pas une marchandise. Les biens doivent appartenir au peuple, pas à des capitalistes lointains qui profitent au détriment des travailleurs."
SOV_honor_soviet_legacy: "Honorer l'héritage soviétique"
SOV_honor_soviet_legacy_desc: "L'Union soviétique fut le plus grand pays de l'histoire. En seulement trente ans, elle nous a fait passer du labeur agraire à l'exploration spatiale — des réalisations surpassant de loin celles des nations capitalistes."
SOV_gay_propaganda_laws_2: "Préservation du mariage traditionnel"
SOV_gay_propaganda_laws_2_desc: "Le mariage est une union entre un homme et une femme. Les modes de vie alternatifs promus par le capitalisme cherchent à affaiblir notre société de l'intérieur."
SOV_preserve_perestroika_ideas: "Préserver les idées de la perestroïka"
SOV_preserve_perestroika_ideas_desc: "Les réformes de Gorbatchev ont permis de surmonter la stagnation de l'URSS dans les années 1980. Ces politiques restent efficaces et devraient guider nos réformes actuelles."
SOV_a_new_economic_policy: "Une nouvelle politique économique"
SOV_a_new_economic_policy_desc: "Bien que les plans quinquennaux aient fonctionné, ils ne suffisent pas seuls. Des ajustements sont nécessaires pour maximiser la croissance économique."
SOV_christian_communism: "Communisme chrétien"
SOV_christian_communism_desc: "Marx a qualifié la religion d'opium du peuple, mais brûler les églises n'est ni pratique ni souhaitable. Beaucoup de citoyens restent croyants, nous devrions donc adopter le christianisme orthodoxe comme religion d'État pour la cohésion sociale."
SOV_consolidate_intel_agencies: "Consolider les agences de renseignement"
SOV_consolidate_intel_agencies_desc: "Nos services de renseignement sont fragmentés. Les unifier sous un commandement unique améliorera l'efficacité et le succès opérationnel."
SOV_harsher_punishments: "Punitions plus sévères"
SOV_harsher_punishments_desc: "Pour rétablir la loi et l'ordre, nous devons réintroduire les punitions strictes utilisées à l'époque de l'URSS. Cela contribuera à réduire considérablement la criminalité."
SOV_military_education: "Écoles patriotiques soviétiques"
SOV_military_education_desc: "La jeune génération doit apprendre la gloire de l'Union soviétique et les sacrifices de leurs ancêtres pour perpétuer leur héritage."
SOV_belt_and_road: "Plan d'infrastructure soviétique"
SOV_belt_and_road_desc: "Nos routes sont en mauvais état et les trains sont peu fiables. Si Staline était vivant, il exigerait une action rapide pour y remédier."
SOV_nuclear_development: "Développement nucléaire"
SOV_nuclear_development_desc: "L'URSS était un leader mondial en technologie nucléaire. En tant que successeur, nous devons reprendre et faire progresser cette position."
SOV_red_cyber_army: "Armée cybernétique rouge"
SOV_red_cyber_army_desc: "Inspirée par l'Armée des 50 Centimes de la Chine, ce groupe rémunéré de trolls pro-soviétiques sur Internet diffusera de la propagande et sèmera la discorde dans les sociétés occidentales."
SOV_aero_improvements: "Améliorations aéronautiques"
SOV_aero_improvements_desc: "L'industrie aérospatiale soviétique a été dévastée par l'effondrement de 1991. Après des années de mauvaise gestion et de sous-financement, il est temps de revitaliser ce secteur crucial."
SOV_rocketry: "Roquettes avancées"
SOV_rocketry_desc: "La fusée soviétique a toujours été à la pointe. Nous restons leaders et continuerons à innover dans ce domaine."
SOV_revitalize_air_bases: "Revitaliser les bases aériennes"
SOV_revitalize_air_bases_desc: "L'URSS a laissé de nombreuses pistes d'atterrissage inutilisées. Nous devons les restaurer et les utiliser pour un avantage stratégique."
SOV_radical_tax_reform: "Plan fiscal communiste"
SOV_radical_tax_reform_desc: "Les riches ne paient pas leur juste part. Nous augmenterons les impôts sur eux tout en allégeant le fardeau des pauvres."
SOV_national_patriotic_alliance: "Alliance patriotique nationale"
SOV_national_patriotic_alliance_desc: "Nous formerons une coalition de nationalistes, patriotes et communistes pour réunir l'Union soviétique sur des bases politiques et patriotiques solides."
SOV_empower_national_patriotic_alliance: "Renforcer l'Alliance"
SOV_empower_national_patriotic_alliance_desc: "Pour renforcer la coalition, nous placerons leurs membres au pouvoir aux côtés des nôtres, en gardant une légère domination pour maintenir le contrôle."
SOV_a_new_constitution: "Nouvelle constitution soviétique"
SOV_a_new_constitution_desc: "Avec nos nouveaux alliés, nous convoquerons une assemblée constitutionnelle pour rédiger et adopter une nouvelle constitution unifiée."
SOV_expand_university_enrollment: "Augmenter les inscriptions universitaires"
SOV_expand_university_enrollment_desc: "L'enseignement supérieur est la clé du succès personnel et de la productivité économique. Nous augmenterons les inscriptions universitaires pour développer une main-d'œuvre plus forte."
SOV_automation_for_the_people: "Initiative Internet"
SOV_automation_for_the_people_desc: "Le 21e siècle offre l'automatisation, Internet et l'IA. Si elles sont bien développées, ces technologies pourraient libérer les gens du travail et inaugurer une société communiste de luxe entièrement automatisée."
SOV_political_purges: "Purge politique"
SOV_political_purges_desc: "Des éléments non fiables et déloyaux existent parmi nous. Ils doivent être identifiés, isolés et exclus de la vie publique."
SOV_guarantee_multi_party_system: "Garantir le système multipartite"
SOV_guarantee_multi_party_system_desc: "L'une des réformes de Gorbatchev fut de permettre la démocratie multipartite. Nous devons préserver cela pour honorer son héritage réformiste."
SOV_the_chinese_question: "Le traître révisionniste"
SOV_the_chinese_question_desc: "Depuis l'ère de Mao, la Chine a suivi une voie impérialiste et révisionniste. Nous devons corriger cela et ramener le véritable socialisme en Chine."
SOV_our_socialist_brother: "Notre frère socialiste"
SOV_our_socialist_brother_desc: "Après l'effondrement de l'URSS, la Chine a hérité du flambeau socialiste. Ensemble, nous continuerons à faire progresser le socialisme au 21e siècle."
SOV_nork_deals: "Accords avec le Nord"
SOV_nork_deals_desc: ""
SOV_chicom_cooperation: "Élargir la coopération économique"
SOV_chicom_cooperation_desc: ""
SOV_support_the_kpa: "Soutenir l'Armée populaire coréenne"
SOV_support_the_kpa_desc: "Certains au sein de l'Armée populaire coréenne s'opposent au régime Kim et sont prêts à s'allier avec nous. Nous devons travailler pour sécuriser leur soutien."
SOV_nork_coup: "Le coup d'État nord-coréen"
SOV_nork_coup_desc: "Sur notre signal, le général de l'APC lancera un coup d'État contre la dynastie Kim, dans l'espoir d'installer un gouvernement socialiste plus loyal et véritable."
SOV_zyuganovs_cult_of_personality: "Culte de la personnalité de Ziouganov"
SOV_zyuganovs_cult_of_personality_desc: "Gennadi Ziouganov est le leader communiste le plus fort, le plus intelligent et le plus charismatique ayant jamais vécu !"
SOV_international_revolution: "Exporter la révolution internationale"
SOV_international_revolution_desc: "La révolution ne peut survivre en Russie seule. Le prolétariat mondial doit se soulever pour renverser le capitalisme et construire une utopie communiste."
SOV_export_class_struggle: "Exporter la lutte des classes"
SOV_export_class_struggle_desc: "Le socialisme marxiste enseigne que l'histoire est définie par la lutte des classes. Le prolétariat renversera inévitablement la bourgeoisie !"
SOV_reignite_revolutionary_spirit: "Raviver l'esprit révolutionnaire"
SOV_reignite_revolutionary_spirit_desc: "La révolution est éternelle et doit être maintenue vivante par une vigilance et une action constantes."
SOV_fifth_international: "Former la 5e Internationale"
SOV_fifth_international_desc: "Le mouvement communiste soviétique s'est historiquement divisé entre la Troisième Internationale de Staline et la Quatrième Internationale de Trotski, culminant en des purges brutales. Nous avons besoin d'une nouvelle internationale pour unir les communistes du monde entier."
SOV_empower_ex_soviet_communists: "Renforcer les ex-communistes soviétiques"
SOV_empower_ex_soviet_communists_desc: "De nombreux vétérans de l'ère soviétique vivent encore en Russie et dans les anciennes républiques. Nous devrions les renforcer pour aider à réunir l'URSS."
SOV_a_loyal_cpc: "Un CPC loyal"
SOV_a_loyal_cpc_desc: "Le Parti communiste de Chine est devenu révisionniste et inapte à gouverner. Nous devons le renverser par la force, avec l'aide de collaborateurs internes, pour restaurer le véritable communisme."
SOV_yavlinsky: "Grigori Yavlinski"
SOV_yavlinsky_desc: "Grigori Yavlinski (né en 1952) a été actif dans la réforme économique soviétique au début des années 1990 en tant qu'auteur du 'Programme des 500 jours'. Il dirige la coalition socio-libérale Yabloko et a obtenu 7,3 % des voix en 1996. Son soutien provient principalement des électeurs urbains et de la classe moyenne, et sa position diplomatique est amicale envers les puissances occidentales."
SOV_maintain_good_relationships_with_central_asia: "Maintenir l'amitié avec l'Asie centrale"
SOV_maintain_good_relationships_with_central_asia_desc: "Nous partageons une amitié culturelle et historique avec les nations d'Asie centrale, unies par un passé bolchevique commun. Il est temps de raviver ces liens étroits et d'explorer une coopération accrue."
SOV_befriend_india: "Se lier d'amitié avec l'Inde"
SOV_befriend_india_desc: "L'Union soviétique a soutenu l'indépendance de l'Inde. Le moment est venu de raviver cette amitié et de renforcer notre partenariat."
SOV_befriend_pakistan: "Se lier d'amitié avec le Pakistan"
SOV_befriend_pakistan_desc: "Bien que nous ayons soutenu l'Inde pendant la Guerre froide, nous n'avons plus besoin de maintenir cette position. Le Pakistan offre un meilleur partenariat stratégique pour nos intérêts."
SOV_support_israel: "Soutenir Israël"
SOV_support_israel_desc: "Notre pays a une longue histoire d'interactions avec Israël et son peuple. Nous devons continuer à entretenir cette amitié."
SOV_support_palestine: "Soutenir la Palestine"
SOV_support_palestine_desc: "Les Arabes souffrent de l'oppression israélienne depuis de nombreuses années. Nous devons nous tenir à leurs côtés dans ces moments difficiles."
SOV_pressure_the_persians: "Frapper l'Iran"
SOV_pressure_the_persians_desc: "Les mollahs iraniens représentent le dernier bastion de l'autocratie, de la corruption et de l'extrémisme dans notre région. Les éliminer est vital pour la paix et la sécurité russes et mondiales tout en promouvant la démocratie dans un Moyen-Orient troublé."
SOV_honor_victims_of_repression: "Honorer les victimes de la répression"
SOV_honor_victims_of_repression_desc: "Les purges, famines et terreurs d'État soviétiques ont fait du mal à des millions de personnes et touché presque tous les foyers russes. Nous ne devons jamais oublier ces victimes. Plus jamais."
SOV_a_pragmatic_approach: "Une approche pragmatique"
SOV_a_pragmatic_approach_desc: "Bien que la démocratie soit souhaitable, passer directement de la dictature communiste à une démocratie capitaliste ne fonctionnera pas. Une thérapie de choc briserait notre nouvel État fragile."
SOV_democratic_idealism: "Idéalisme démocratique"
SOV_democratic_idealism_desc: "Il est temps de laisser les fantômes du passé derrière nous et de poursuivre les réformes démocratiques à tout prix."
SOV_suppress_nationalists: "Réprimer les nationalistes"
SOV_suppress_nationalists_desc: "Les nationalistes russes menacent la création d'une démocratie de style occidental. Ils doivent être réprimés."
SOV_respect_soviet_legacy: "Respecter l'héritage soviétique"
SOV_respect_soviet_legacy_desc: "Notre histoire nous appartient. L'ignorer ou la détester est autodestructeur. Nous devons respecter le passé soviétique pour ses réalisations, sans oublier ses erreurs."
SOV_decommunize_russian_society: "Décommuniser la société russe"
SOV_decommunize_russian_society_desc: "Le communisme est tombé. Nous devons retirer ses symboles et images pour éviter de nourrir la rhétorique nationaliste et néo-communiste."
SOV_rehabilitate_purged_figures: "Réhabiliter les figures purgées"
SOV_rehabilitate_purged_figures_desc: "De nombreuses personnes capables et loyales ont été purgées et effacées à l'époque soviétique. Nous devons nous souvenir d'elles et préserver leur héritage."
SOV_reconcile_the_cprf_2: "Réconcilier le CPRF"
SOV_reconcile_the_cprf_2_desc: "Le Parti communiste de la Fédération de Russie reste puissant. Se réconcilier avec eux est le seul moyen d'être vu comme un gouvernement légitime."
SOV_ostracize_the_cprf: "Ostraciser le CPRF"
SOV_ostracize_the_cprf_desc: "Le CPRF est le vestige mourant de l'ancien système soviétique. Nous devons les exclure de la société respectable."
SOV_foster_multi_party_democracy: "Convention pour une Russie démocratique"
SOV_foster_multi_party_democracy_desc: "Avec l'opposition nationaliste et communiste neutralisée, il est temps de convoquer une convention à l'échelle du gouvernement pour établir les règles et normes d'une nouvelle Russie démocratique."
SOV_economic_bill_of_rights: "Charte des droits économiques"
SOV_economic_bill_of_rights_desc: "Pour jouir de la vie, de la liberté et de la quête du bonheur, les gens doivent avoir des libertés économiques de base. Personne ne devrait être privé de ces droits à cause de la pauvreté. Nous avons besoin d'une charte des droits économiques pour protéger les citoyens des excès du capitalisme."
SOV_influence_central_asian_change: "Influencer le changement en Asie centrale"
SOV_influence_central_asian_change_desc: "L'Asie centrale est remplie d'autocrates corrompus. Sans action, ces nations s'éloigneront de notre sphère d'influence."
SOV_join_nato: "S'engager dans l'OTAN"
SOV_join_nato_desc: "La Guerre froide est terminée, et notre position est difficile. En tant que démocratie, nous devons rejoindre une alliance avec d'autres démocraties pour assurer notre survie."
SOV_pan_eurasian_infrastructure: "Programme d'infrastructure eurasienne"
SOV_pan_eurasian_infrastructure_desc: "L'infrastructure russe est en mauvais état. Nous devons construire des routes, des ponts, des chemins de fer et d'autres projets pour stimuler l'économie."
SOV_status_quo: "Maintenir le statu quo coréen"
SOV_status_quo_desc: "Une péninsule coréenne stable sert au mieux les intérêts de la Russie. Si un changement doit survenir, il doit être graduel et contrôlé, pas chaotique."
SOV_strengthen_relations_with_north: "Renforcer les relations avec le Nord"
SOV_strengthen_relations_with_north_desc: "La Corée du Nord est notre alliée depuis que nous avons fourni des MiG-15 pendant la guerre de Corée. À 80 ans d'amitié !"
SOV_encourage_economic_reforms: "Encourager les réformes économiques nord-coréennes"
SOV_encourage_economic_reforms_desc: "Dans un monde globalisé, la Russie a encore un allié fermé et sous-développé. Cela n'est pas bon pour nos intérêts."
SOV_expand_business_with_south: "Élargir les affaires avec la Corée du Sud"
SOV_expand_business_with_south_desc: "La Corée du Sud a du capital et de l'expertise, tandis que nous avons des ressources et de la main-d'œuvre. Ce partenariat ne peut que bénéficier aux intérêts russes et accroître notre influence."
SOV_export_more_energy: "Exporter plus d'énergie vers la Corée du Sud"
SOV_export_more_energy_desc: "L'économie de la Corée du Sud est forte. Leur fournir de l'énergie améliore notre position géopolitique et notre influence."
SOV_support_peaceful_korean_unification: "Soutenir l'unification coréenne pacifique"
SOV_support_peaceful_korean_unification_desc: "Une réunification pacifique créerait un vaste marché nordique, une économie méridionale forte et une nouvelle puissance régionale, aidant à équilibrer l'influence des États-Unis et de la Chine."
SOV_east_asia_in_democracy: "Démocratiser l'Asie de l'Est"
SOV_east_asia_in_democracy_desc: "L'Asie de l'Est, en particulier la Chine et la Corée du Nord, sont les derniers bastions communistes. Notre politique devrait se concentrer sur la libération de ces peuples et reléguer le communisme à l'histoire."
SOV_expand_trade_with_taiwan: "Élargir le commerce avec Taïwan"
SOV_expand_trade_with_taiwan_desc: "Taïwan produit des semi-conducteurs avancés et d'autres biens de haute technologie. Augmenter le commerce profite à nos intérêts et à notre influence."
SOV_support_taiwan_military_buildup: "Soutenir le renforcement militaire de Taïwan"
SOV_support_taiwan_military_buildup_desc: "Pour dissuader l'agression chinoise, nous devrions aider Taïwan à renforcer ses défenses."
SOV_support_south_led_unification: "Soutenir l'unification menée par le Sud"
SOV_support_south_led_unification_desc: "L'avenir de la Corée réside à Séoul."
SOV_export_military_hardware_to_south_korea: "Exporter du matériel militaire vers le Sud"
SOV_export_military_hardware_to_south_korea_desc: "La Corée du Sud a besoin de soutien pour unifier la péninsule. Nous devrions fournir du matériel militaire pour les aider."
SOV_behead_autocratic_dragons: "Décapiter les dragons autocratiques"
SOV_behead_autocratic_dragons_desc: "Les États totalitaires sont des dragons vicieux. Coupez-leur la tête, criez 'Havoc !' et libérez les chiens de la guerre !"
SOV_ignite_second_korean_war: "Déclencher la seconde guerre de Corée"
SOV_ignite_second_korean_war_desc: "Le régime nord-coréen est une relique stalinienne dépassée qui appartient à la poubelle de l'histoire. Si la Corée du Sud choisit la force pour unifier la péninsule, elle a notre plein soutien."
SOV_rosguard_tank: "Autoriser la Rosgvardia à utiliser des chars"
SOV_rosguard_tank_desc: "Après le soulèvement de Prigojine, nous sommes prêts à confier des chars à la Rosgvardia."
SOV_form_bars: "Former le BARS"
SOV_form_bars_desc: "La Réserve spéciale de l'armée de combat (BARS) se compose de dizaines de milliers de réservistes frais qui ont passé une sélection rigoureuse dans les bureaux d'enrôlement militaire et signé des contrats de défense. La préférence est donnée à ceux récemment démobilisés qui conservent des compétences militaires vitales dans des spécialités clés."
SOV_reorganize_airforce: "Réorganiser l'armée de l'air"
SOV_reorganize_airforce_desc: "Notre armée de l'air est en mauvais état. Une série de réformes majeures la remettra en meilleure forme."
SOV_missile_development: "Forces de missiles stratégiques"
SOV_missile_development_desc: "Ces troupes maintiennent une disponibilité au combat constante pour la dissuasion nucléaire, capables de frappes nucléaires massives ou ciblées. Elles forment le cœur de notre force militaire et économique, avec tous les missiles balistiques intercontinentaux russes sous leur commandement."
SOV_avtovaz: "AVTOVAZ"
SOV_avtovaz_desc: "AvtoVAZ est un fabricant automobile russe de premier plan fondé en 1966. Initialement connu sous le nom de VAZ, acronyme de Volga Automotive Plant en russe. AvtoVAZ est surtout connu pour la production de la série emblématique Lada, un pilier de l'histoire automobile russe."
SOV_gaz: "GAZ"
SOV_gaz_desc: "GAZ, ou Gorkovsky Avtomobilny Zavod, est un important fabricant automobile russe basé à Nijni Novgorod, autrefois appelé Gorki. Il sert de filiale principale du groupe GAZ Holding, lui-même partie du grand conglomérat industriel Basic Element."
SOV_kamaz: "KAMAZ"
SOV_kamaz_desc: "KAMAZ, fondé en 1969, est un grand producteur russe de camions, bus et moteurs, basé à Naberezhnye Chelny. L'entreprise est reconnue pour ses camions à cabine avancée fiables, largement utilisés à l'échelle nationale et internationale."
SOV_aurus: "AURUS"
SOV_aurus_desc: "Aurus Motors est une marque automobile de luxe russe établie en 2000. Initialement développée pour servir de cortèges officiels d'État, Aurus s'est depuis étendue au marché des voitures de luxe avec des modèles haut de gamme."
SOV_focus_on_luxury_cars: "Se concentrer sur les voitures de luxe"
SOV_focus_on_luxury_cars_desc: "Le peuple russe mérite plus qu'une simple Lada abordable. Nous devons élargir la gamme Aurus et soutenir la croissance d'autres marques de voitures de luxe pour rehausser le prestige de la Russie dans le monde automobile."
SOV_focus_on_affordable_cars: "Se concentrer sur les voitures abordables"
SOV_focus_on_affordable_cars_desc: "La Russie dépend actuellement fortement des véhicules importés. Pour renforcer notre marché intérieur, nous devons augmenter la production de voitures abordables fabriquées en Russie, garantissant que chaque citoyen puisse posséder un véhicule construit localement."
SOV_revitalized_automobile_industry: "Industrie automobile revitalisée"
SOV_revitalized_automobile_industry_desc: "Après des efforts coûteux de modernisation et d'expansion, notre industrie automobile a enfin atteint un niveau respectable de production et de qualité. Cette revitalisation marque une étape clé dans la reconstruction de notre économie."
SOV_economic_programs: "Réformes économiques"
SOV_economic_programs_desc: "Après l'effondrement de l'URSS et les bouleversements des années 1990, l'économie russe a un besoin urgent de réformes globales et de renouveau. Notre objectif est de restaurer la stabilité et de promouvoir une croissance durable."
SOV_uralvagonzavod: "Uralvagonzavod"
SOV_uralvagonzavod_desc: "Uralvagonzavod est une grande entreprise russe de construction de machines située à Nijni Taguil. C'est l'un des plus grands complexes industriels de Russie et est reconnu comme le premier fabricant mondial de chars de combat principaux."
SOV_national_center_for_aviabuilding: "Centre national pour la construction aéronautique"
SOV_national_center_for_aviabuilding_desc: "L'industrie aéronautique russe reste l'un de nos secteurs les plus prometteurs. Investir dans ce domaine est essentiel pour sécuriser notre position de leader en technologie aérospatiale."
SOV_domestic_helicopter_production: "Production nationale d'hélicoptères"
SOV_domestic_helicopter_production_desc: "L'industrie des hélicoptères russes a une fière tradition de conception et de production de certains des hélicoptères les plus avancés au monde. Un investissement continu est crucial pour maintenir et élargir ce succès."
SOV_heavy_industry_investments: "Investissements dans l'industrie lourde"
SOV_heavy_industry_investments_desc: "L'industrie lourde était la colonne vertébrale de l'économie soviétique. Revitaliser ce secteur par des investissements ciblés est crucial pour renforcer les fondations économiques de la Russie."
SOV_refined_metallurgy: "Métallurgie raffinée"
SOV_refined_metallurgy_desc: "La métallurgie est une industrie stratégique vitale pour notre développement national. Nous devons investir massivement pour élargir et moderniser ce secteur afin de répondre aux demandes futures."
SOV_expand_tungsten_mining: "Élargir l'extraction de tungstène"
SOV_expand_tungsten_mining_desc: "Le tungstène, également connu sous le nom de wolfram, est un métal rare aux propriétés uniques, notamment une dureté exceptionnelle et une haute densité. Ces qualités le rendent inestimable pour les applications militaires telles que les projectiles perforants. Élargir l'extraction de tungstène renforcera notre base de ressources."
SOV_expand_iron_mining: "Élargir la production d'acier"
SOV_expand_iron_mining_desc: "L'acier, un alliage de fer et de carbone, est essentiel pour la construction, les infrastructures, le transport, les machines et les armements en raison de sa solidité et de sa durabilité. Augmenter la production d'acier est vital pour le développement national et la défense."
SOV_expand_gold_mining: "Élargir l'extraction d'or"
SOV_expand_gold_mining_desc: "L'or est valorisé non seulement pour sa valeur économique mais aussi pour ses utilisations industrielles dans les connecteurs électriques résistants à la corrosion, les protections infrarouges, le verre coloré et les applications dentaires. Élargir l'extraction d'or renforcera à la fois notre économie et nos capacités technologiques."
SOV_expand_aluminium_mining: "Élargir l'extraction d'aluminium"
SOV_expand_aluminium_mining_desc: "L'aluminium est un métal léger et durable largement utilisé dans le transport, l'ingénierie, la construction et l'emballage. Il est particulièrement crucial pour la fabrication d'avions. Développer l'extraction d'aluminium soutiendra les industries clés et le progrès technologique."
SOV_industrial_expansion_plan: "Plan d'expansion industrielle"
SOV_industrial_expansion_plan_desc: "La grave crise économique de la fin des années 1990 a laissé la Russie avec un chômage élevé et une pauvreté généralisée. Cela était dû à une privatisation rapide et à un exode de travailleurs qualifiés et d'entreprises vers l'Occident. Les années 2000 doivent se concentrer sur la reconstruction de l'industrie civile pour stimuler le commerce intérieur et international."
SOV_domestic_aircraft_production: "Production nationale d'avions"
SOV_domestic_aircraft_production_desc: "La Russie a une tradition distinguée de production d'avions de haute qualité. Pour maintenir notre leadership aérospatial, nous devons prioriser les investissements qui élargissent et modernisent ce secteur vital."
SOV_expand_tankograd: "Élargir Tankograd"
SOV_expand_tankograd_desc: "Tankograd, le surnom de l'usine de tracteurs de Tcheliabinsk, était un site central de production de chars pendant la Grande Guerre patriotique. Elle a continué à produire des chars tout au long de l'ère soviétique. Une expansion moderne améliorera sa capacité et ses capacités de production pour l'avenir."
SOV_domestic_auto_production: "Production automobile nationale"
SOV_domestic_auto_production_desc: "L'industrie automobile grand public russe a historiquement été modeste, mais des marques notables comme Lada et Aurus ont marqué leur empreinte. Soutenir ces entreprises stimulera les exportations et renforcera le soft power mondial de la Russie."
SOV_expand_kalashnikov_concern: "Élargir le groupe Kalashnikov"
SOV_expand_kalashnikov_concern_desc: "Le groupe Kalashnikov, anciennement usine de construction de machines d'Ijevsk, est le plus grand fabricant de défense de Russie. Produisant 95 % des armes légères du pays, il conçoit également des munitions guidées et des armes de précision. Élargir ce groupe est vital pour notre industrie militaire."
SOV_revaluation_of_the_ruble: "Réévaluation du rouble"
SOV_revaluation_of_the_ruble_desc: "Au cours de la dernière décennie, le rouble russe a perdu une valeur significative en raison de mauvaises politiques commerciales et d'une inflation non maîtrisée. Restaurer la confiance dans le rouble est essentiel pour stabiliser notre économie et protéger le pouvoir d'achat de nos citoyens."
SOV_european_interaction_plan: "Plan d'interaction européenne"
SOV_european_interaction_plan_desc: "L'Europe reste l'un de nos partenaires économiques les plus importants, malgré les sanctions occasionnelles. Développer un plan stratégique pour gérer ces relations est crucial pour une croissance économique soutenue."
SOV_nord_stream: "Nord Stream"
SOV_nord_stream_desc: "Nord Stream est un important gazoduc traversant la mer Baltique, reliant directement la Russie à l'Allemagne. Ce tracé contourne les pays d'Europe de l'Est, donnant à la Russie un levier significatif sur la région et permettant à l'Allemagne d'éviter les tensions régionales."
SOV_south_stream: "South Stream"
SOV_south_stream_desc: "South Stream est un gazoduc complémentaire allant de la région de Rostov en Russie à travers la mer Noire, traversant la Bulgarie, et se divisant vers l'Autriche et l'Italie. Ce gazoduc renforce nos capacités d'exportation d'énergie vers l'Europe."
SOV_east_stream: "Sila Sibiri"
SOV_east_stream_desc: "Sila Sibiri, ou la Puissance de la Sibérie, est le troisième grand gazoduc reliant la Russie à la Chine. Il assure un approvisionnement énergétique fiable à notre proche allié et offre un marché stratégique pour nos exportations de pétrole et de gaz, aidant à contourner les sanctions occidentales."
SOV_resist_the_washington_consensus: "Résister au consensus de Washington"
SOV_resist_the_washington_consensus_desc: "Les politiques économiques imposées à Eltsine par Washington ont affaibli notre économie et ouvert la voie aux intérêts occidentaux pour acquérir nos actifs d'État. Nous devons rejeter ces plans et développer une nouvelle stratégie pour relancer l'économie russe de manière indépendante."
SOV_return_to_the_gold_standard: "Retour à l'étalon-or"
SOV_return_to_the_gold_standard_desc: "L'argent papier sans support physique perd de sa valeur avec le temps. Réinstaurer l'étalon-or stabilisera le rouble et restaurera la confiance dans notre monnaie."
SOV_decree_no_585: "Décret n° 585"
SOV_decree_no_585_desc: "Le décret n° 585, émis en 2003, a établi RZhD comme une société par actions. RZhD est responsable de la gestion du vaste réseau ferroviaire de la Russie."
SOV_sakhalin_railway: "Revitaliser le chemin de fer de Sakhaline"
SOV_sakhalin_railway_desc: "Le chemin de fer de Sakhaline, situé sur l'île près du Japon, est vital pour l'économie locale. Le moderniser et le revitaliser renforcera la connectivité régionale et le développement économique."
SOV_expand_the_trans_siberian_railroad: "Élargir le chemin de fer transsibérien"
SOV_expand_the_trans_siberian_railroad_desc: "Le chemin de fer transsibérien relie Moscou à Vladivostok et sert de colonne vertébrale économique de la Russie. Élargir ce réseau est essentiel pour le développement national et le commerce."
SOV_appease_the_moscow_oligarchs: "Apaiser les oligarques de Moscou"
SOV_appease_the_moscow_oligarchs_desc: "Investir stratégiquement pour apaiser les oligarques de Moscou sécurisera leur soutien et maintiendra la stabilité parmi l'élite économique."
SOV_high_speed_rail_construction: "Construction de chemins de fer à grande vitesse"
SOV_high_speed_rail_construction_desc: "L'infrastructure ferroviaire actuelle de la Russie est dépassée. Investir dans la technologie des chemins de fer à grande vitesse modernisera le transport et améliorera l'efficacité à travers le pays."
SOV_explore_arctic_gas_fields: "Explorer les champs gaziers arctiques"
SOV_explore_arctic_gas_fields_desc: "La région arctique détient d'immenses réserves de pétrole et de gaz naturel. Explorer et développer ces champs pourrait augmenter considérablement les capacités de production énergétique de la Russie."
SOV_expansionary_monetary_policy: "Politique monétaire expansionniste"
SOV_expansionary_monetary_policy_desc: "Injecter des liquidités dans l'économie stimulera la croissance et encouragera l'investissement, contribuant à améliorer les perspectives économiques à long terme."
SOV_attract_foreign_investors: "Attirer les investisseurs étrangers"
SOV_attract_foreign_investors_desc: "Attirer les investissements étrangers est l'un des moyens les plus efficaces pour alimenter la croissance économique et accroître les opportunités commerciales."
SOV_economic_stimulus: "Stimulus économique"
SOV_economic_stimulus_desc: "Introduire des mesures de relance ciblées aidera à relancer les secteurs clés de l'économie et à soutenir une croissance durable."
SOV_state_capitalism: "Capitalisme d'État"
SOV_state_capitalism_desc: "Éliminer l'influence des oligarques de Moscou est essentiel pour lutter contre la corruption croissante qui menace le progrès de notre pays."
SOV_rise_of_the_oligarchs: "Ascension des oligarques"
SOV_rise_of_the_oligarchs_desc: "Soutenir les oligarques améliorera nos relations avec eux et pourrait débloquer de nouvelles sources de financement et d'influence."
SOV_russian_federation_stabilization_fund: "Fonds de stabilisation de la Fédération de Russie"
SOV_russian_federation_stabilization_fund_desc: "Établi en 2004 par l'administration Poutine, le Fonds de stabilisation a été créé pour protéger l'industrie pétrolière russe des effets des fluctuations des prix du pétrole. Cette initiative s'inspire des leçons de la crise économique de 1998, en partie causée par la volatilité des marchés du gaz et du pétrole."
SOV_deregulation: "Dérégulation"
SOV_deregulation_desc: "Une régulation excessive du marché engendre souvent corruption et inefficacité économique. Encourager le libre-échange, la monnaie et les systèmes de troc favorisera une économie plus robuste et dynamique."
SOV_ignore_oligarchic_corruption: "Ignorer la corruption oligarchique"
SOV_ignore_oligarchic_corruption_desc: "Les oligarques sont des alliés clés, et tant qu'ils contribuent financièrement, nous pouvons fermer les yeux sur leurs activités douteuses pour le bien de la stabilité politique."
SOV_entice_oligarchic_investment: "Inciter à l'investissement oligarchique"
SOV_entice_oligarchic_investment_desc: "Les oligarques détiennent un capital important. Offrir des réductions d'impôts et des incitations peut les encourager à investir plus activement dans l'économie, au bénéfice de la nation tout entière."
SOV_regulate_the_market: "Réguler le marché"
SOV_regulate_the_market_desc: "Les marchés libres échouent souvent à produire des résultats qui servent les intérêts nationaux. Notre gouvernement doit jouer un rôle actif dans la régulation des marchés pour garantir que la croissance économique profite à tous les Russes."
SOV_nationalize_foreign_industry: "Nationaliser les industries étrangères"
SOV_nationalize_foreign_industry_desc: "Les usines industrielles appartenant à des étrangers posent des risques pour la sécurité, en particulier avec les sanctions en cours. Nationaliser ces industries protégera les capacités de production vitales, même si cela tend les relations diplomatiques."
SOV_root_out_oligarchs: "Éliminer les oligarques"
SOV_root_out_oligarchs_desc: "Bien qu'il puisse être impossible d'éliminer entièrement la classe des oligarques, leur influence excessive sur l'économie doit être réduite pour rétablir l'équité et le contrôle national."
SOV_intl_oil_price_agreements: "Accords internationaux sur les prix du pétrole"
SOV_intl_oil_price_agreements_desc: "La Russie est en concurrence avec l'OPEP, une coalition de quinze exportateurs de pétrole qui contrôle efficacement les prix mondiaux du pétrole. Collaborer discrètement avec l'OPEP pourrait aider à stabiliser et augmenter les prix du pétrole au bénéfice des intérêts russes."
SOV_trade_with_the_east: "Commerce avec l'Est"
SOV_trade_with_the_east_desc: "Bien que les marchés occidentaux restent importants, élargir le commerce avec les partenaires orientaux — en particulier la Chine — offre des opportunités significatives pour la croissance."
SOV_expand_aeroflot_routes: "Élargir les routes d'Aeroflot"
SOV_expand_aeroflot_routes_desc: "Aeroflot, la compagnie aérienne nationale de la Russie depuis l'époque soviétique, devrait étendre ses routes à travers le pays. Cela renforcera l'unité nationale et favorisera l'intégration économique."
 SOV_expand_economic_policy: "Économie modernisée"
SOV_expand_economic_policy_desc: "Les économies modernes prospèrent grâce à des technologies avancées telles que l'informatique, l'intelligence artificielle et les énergies alternatives. La Russie doit investir massivement dans ces domaines pour rester compétitive au 21e siècle."
SOV_southern_arms_exports: "Projet Khazri"
SOV_southern_arms_exports_desc: "Exporter des armes vers nos alliés dans le sous-continent indien élargira l'influence de la Russie et renforcera les liens stratégiques dans la région."
SOV_nord_stream_2: "Nord Stream 2"
SOV_nord_stream_2_desc: "Nord Stream 2 est une extension du gazoduc original vers l'Allemagne. Il augmentera la dépendance de l'Allemagne envers le gaz russe et modifiera davantage l'équilibre des pouvoirs en Europe de l'Est."
SOV_manufacturing_improvements: "Améliorations de la fabrication"
SOV_manufacturing_improvements_desc: "Nos machines industrielles sont obsolètes et limitent la qualité de la production. Nous devons adopter de nouvelles technologies et processus de fabrication pour améliorer l'efficacité et la production."
SOV_computers: "Industrie informatisée"
SOV_computers_desc: "Intégrer les ordinateurs dans les processus industriels est vital pour moderniser la production et accroître la compétitivité dans tous les secteurs."
SOV_expand_the_tech_industry: "Secteur informatique russe"
SOV_expand_the_tech_industry_desc: "Le secteur des technologies de l'information croît rapidement dans le monde entier. La maîtrise de l'informatique définira le leadership mondial ce siècle, et la Russie doit revendiquer sa place à l'avant-garde."
SOV_advanced_semiconductor_manufacturing: "Fabrication avancée de semi-conducteurs"
SOV_advanced_semiconductor_manufacturing_desc: "Les semi-conducteurs sont fondamentaux pour la technologie moderne, des véhicules aux ordinateurs et à l'aérospatiale. Contrôler leur production est crucial pour la sécurité nationale et l'indépendance technologique."
SOV_the_silicon_taiga: "La Taïga de Silicium"
SOV_the_silicon_taiga_desc: "La 'Taïga de Silicium' est le surnom de l'industrie informatique en plein essor de la Russie, en parallèle avec la Silicon Valley des États-Unis."
SOV_yandex: "Yandex"
SOV_yandex_desc: "Yandex LLC est la plus grande entreprise technologique multinationale de Russie, fournissant des services Internet principalement en Russie et dans la CEI. Elle fonctionne comme le Google russe, détenant plus de 42 % du marché des moteurs de recherche en langue russe et se classant cinquième au niveau mondial."
SOV_vkontakte: "VKontakte"
SOV_vkontakte_desc: "VKontakte (VK) est la principale plateforme de médias sociaux et de réseautage de Russie, basée à Saint-Pétersbourg. Souvent comparée à Facebook, VK dessert principalement les utilisateurs russophones, avec une base d'utilisateurs de plus de 500 millions de comptes en 2018."
SOV_quantum_computing: "Informatique quantique"
SOV_quantum_computing_desc: "Les ordinateurs quantiques exploitent les principes de la mécanique quantique pour effectuer des calculs bien au-delà des capacités des ordinateurs classiques. Un ordinateur quantique évolutif pourrait révolutionner des domaines comme la cryptographie, les simulations physiques et la résolution de problèmes complexes."
SOV_uranium_one_sale: "Vente d'Uranium One"
SOV_uranium_one_sale_desc: "Uranium One est un groupe international de combustible nucléaire sous la tutelle de la Rosatom State Corporation. Vendu aux intérêts russes en 2010, il est devenu une filiale à part entière du groupe Uranium One basé à Moscou en 2013, renforçant la position de la Russie sur le marché nucléaire mondial."
SOV_jinr: "Institut commun de recherche nucléaire"
SOV_jinr_desc: "Situé à Doubna, l'Institut commun de recherche nucléaire est un centre multinational de recherche scientifique nucléaire avec plus de 5 500 employés, dont 1 200 chercheurs titulaires d'un doctorat provenant de dix-huit pays. Il dispose de sept laboratoires spécialisés couvrant la physique théorique, la physique des particules, la physique des ions lourds, et plus encore."
SOV_gamaleya_institute: "Institut Gamaleya"
SOV_gamaleya_institute_desc: "L'Institut de recherche Gamaleya d'épidémiologie et de microbiologie est un centre de recherche médicale de premier plan en Russie, sous l'égide du ministère de la Santé. Il a acquis une reconnaissance mondiale pour le développement de Spoutnik V, le premier vaccin contre la COVID-19 à atteindre le marché."
SOV_tighten_ties_with_ukraine: "Resserrer les liens avec l'Ukraine"
SOV_tighten_ties_with_ukraine_desc: "Bien que certains Ukrainiens puissent avoir du mal à le comprendre pleinement, nous devons être clairs : nous partageons une ethnicité et un héritage communs. C'est pourquoi il est essentiel de favoriser des relations plus étroites et amicales avec eux. Renforcer ces liens bénéficiera aux deux nations à long terme."
SOV_CSTO_enlargement_with_ukr: "Inviter l'Ukraine à l'OTSC"
SOV_CSTO_enlargement_with_ukr_desc: "La Biélorussie est déjà membre de notre alliance fraternelle. Il est maintenant temps d'étendre une invitation à l'Ukraine pour rejoindre notre bloc de confiance, renforçant notre sécurité collective et notre coopération."
SOV_mutual_economic_prosperity: "Coopération économique mutuelle"
SOV_mutual_economic_prosperity_desc: "Les pays voisins ne devraient pas imposer de barrières au commerce entre eux. Pour favoriser la croissance économique, nous devons éliminer tous les obstacles qui entravent le libre-échange et encourager une prospérité mutuelle."
SOV_ukrainian_russian_defense: "Défense mutuelle russo-ukrainienne"
SOV_ukrainian_russian_defense_desc: "En tant que frères, la Russie et l'Ukraine doivent se tenir unies pour se défendre mutuellement. Nous nous engageons à nous protéger et à combattre côte à côte, quel qu'en soit le coût."
SOV_religious_subjugation: "Subjugation religieuse"
SOV_religious_subjugation_desc: "Il n'est pas nécessaire que l'Ukraine maintienne une église séparée. Nos deux nations sont orthodoxes, et rien ne devrait nous diviser sur des bases religieuses. L'unité dans la foi aidera à renforcer notre lien."
SOV_promote_russian_language: "État bilingue"
SOV_promote_russian_language_desc: "Il est temps de promouvoir la langue russe en Ukraine et de finalement briser les barrières linguistiques qui séparent nos peuples. Une plus grande unité linguistique favorisera la compréhension et la coopération."
SOV_brotherhood_forever: "Fraternité pour toujours !"
SOV_brotherhood_forever_desc: "Nous sommes des frères post-soviétiques avec une histoire et une culture communes. Il est vital que nous entretenions et cultivions cette amitié durable pour les générations à venir."
SOV_eat_burgers_with_obama: "Manger des burgers avec Obama"
SOV_eat_burgers_with_obama_desc: "Pour annoncer notre renouveau géopolitique, nous enverrons notre président en visite d'État chez notre ancien rival et ami d'aujourd'hui, les États-Unis. Cette rencontre symbolique marque un nouveau chapitre de coopération et de diplomatie."
SOV_freedom_better_than_non_freedom: "La liberté vaut mieux que l'oppression"
SOV_freedom_better_than_non_freedom_desc: "Opprimer nos citoyens n'a aucun sens. L'État doit protéger la libre pensée et la créativité, qui génèrent les idées nécessaires pour reconstruire et renforcer notre pays."
SOV_police_not_milice: "Politsiya, pas Militsiya !"
SOV_police_not_milice_desc: "Dans le cadre d'une réforme majeure de la police, nous visons à restaurer le prestige et le professionnalisme de nos forces de sécurité. Renommer la Militsiya en Politsiya est une étape clé pour atteindre cet objectif."
SOV_crush_cult_of_stalin: "Condamner le culte de Staline"
SOV_crush_cult_of_stalin_desc: "Beaucoup de nos compatriotes croient encore que Staline était le plus grand leader de la Russie. Nous devons démanteler ce culte de la personnalité et encourager le peuple russe à faire confiance à nos leaders actuels et futurs."

#Ideas
SOV_rostech_idea: "Rostech"
SOV_kbp_idea: "Bureau de conception d'instruments KBP"
SOV_rosoboronprom_idea: "Oboronprom"
SOV_kalashnikov_idea: "Groupe Kalashnikov"

russia.0.t: "La Russie nous invite dans sa faction"
russia.0.d: "La Russie nous a invités à rejoindre sa faction, cherchant à renforcer notre alliance et à bâtir un partenariat militaire solide. Cette offre pourrait redéfinir notre position stratégique et apporter des avantages significatifs en matière de sécurité."
russia.0.o1: "Accepter. L'Ours russe nous protégera."
russia.0.o2: "Refuser. L'Ours est faible !"
russia.1.t: "La catastrophe du sous-marin Koursk"
russia.1.d: "La catastrophe du sous-marin Koursk s'est produite à 75 kilomètres au nord de la péninsule de Kola, en Russie. Une soudure défectueuse sur une torpille d'exercice a causé une explosion de peroxyde, déclenchant la détonation d'au moins cinq ogives de torpilles. Le commandement naval russe a gravement sous-estimé l'ampleur de la tragédie et a refusé l'aide internationale, soupçonnant une implication de l'OTAN. Bien que de nombreux membres de l'équipage aient survécu à l'explosion initiale et soient restés piégés sous l'eau, les efforts de sauvetage lents et inefficaces ont tragiquement entraîné la mort des 118 marins à bord."
russia.1.o1: "Horrible !"
russia.5.t: "L'impérialisme russe menace notre souveraineté !"
russia.5.d: "La Russie s'est unie à la Biélorussie d'une manière qui rend le gouvernement de Minsk pratiquement impuissant. Cela montre clairement que la Russie privilégie ses propres ambitions impériales néo-soviétiques aux intérêts de ses alliés. Nous devons décider comment répondre à cette menace flagrante contre notre souveraineté."
russia.5.o1: "Nous devons rompre nos liens."
russia.5.o2: "Nous devons espérer le meilleur..."
russia.6.t: "Programme de protection sud-russe"
russia.6.d: "La Russie a déclaré son soutien en cas de conflit militaire et a envoyé des conseillers militaires pour aider à renforcer nos défenses contre nos ennemis. Leur implication pourrait considérablement renforcer nos capacités."
russia.6.o1: "Excellent."
russia.6.o2: "Bien sûr que non !"
russia.7.t: "L'invasion de la Crimée"
russia.7.d: "Bien que les Russes ethniques n'aient jamais été pleinement satisfaits au sein de notre population, cela ne justifie pas l'apparition de milices lourdement armées et sans insigne envahissant la Crimée depuis l'est et repoussant nos troupes. Il est maintenant évident que ces séparatistes sont soutenus, armés et commandés par des forces russes massées à nos frontières. Nous devons décider comment répondre à cette agression."
russia.7.o1: "Nous reculerons."
russia.7.o2: "Nous tiendrons et combattrons !"
russia.8.t: "L'Ukraine recule !"
russia.8.d: "Le gouvernement ukrainien a été forcé de se retirer. La Crimée est maintenant sous notre contrôle."
russia.8.o1: "Excellent."
threat_SOV_annexiation_of_crimea: "Annexion de la Crimée"
russia.9.t: "L'Ukraine relève notre défi !"
russia.9.d: "Contre toute attente, l'Ukraine a choisi de se battre pour la Crimée. En réponse, nos commandants ont déjà ordonné une avancée. Nous avons déclenché un conflit qui ne sera pas facilement contenu."
russia.9.o1: "Allons-y."
russia.10.t1: "La Russie exige notre intégration"
russia.10.t2: "Se soumettre à la Russie"
russia.10.d1: "Nous sommes depuis longtemps un sujet de la Russie. Aujourd'hui, une délégation est arrivée avec une proposition inattendue : la Russie souhaite intégrer pleinement notre pays et mettre fin à notre statut d'État sujet. Nous devons décider comment procéder."
russia.10.d2: "La Russie a exigé notre soumission totale et entend s'installer comme nos souverains. Devons-nous résister à leur pression ou accepter la volonté du Grand Ours ?"
russia.10.o1: "Nous n'avons pas le choix."
russia.10.o2: "Nous ne nous soumettrons jamais !"
russia.11.t: "La Russie exige notre annexion !"
russia.11.d: "La Russie a commencé à montrer une agression subtile envers notre gouvernement, masquée derrière des courtoisies diplomatiques. Nous devons nous préparer au pire si nous refusons les exigences de cette superpuissance."
russia.11.o1: "Nous sommes un avec la Russie."
russia.11.o2: "Jamais."
russia.12.t1: "[From.GetName] Accepte !"
russia.12.d1: "[From.GetName] a accepté notre proposition. Nous devons rapidement commencer à prendre le contrôle des gouvernements locaux et apporter de la stabilité à la région. Les autorités abkhazes ont décidé de s'intégrer et de coopérer étroitement avec nos envoyés pour soutenir les forces d'occupation."
russia.12.t2: "[From.GetName] Accepte !"
russia.12.d2: "[From.GetName] a accepté notre proposition. Nous devons rapidement prendre le contrôle des gouvernements locaux et établir l'ordre. Le gouvernement sud-ossète a choisi de s'intégrer et de travailler aux côtés de nos envoyés pour soutenir l'occupation."
russia.12.o1: "Merveilleux."
russia.13.t1: "[From.GetName] Refuse !"
russia.13.d1: "[From.GetName] a rejeté notre offre d'intégration. Comment osent-ils ! Préparez les troupes stationnées dans la région. Ces pseudo-républiques rebelles doivent se rappeler qui est leur véritable bienfaiteur."
russia.13.t2: "[From.GetName] Refuse !"
russia.13.d2: "[From.GetName] a rejeté notre offre d'intégration. Comment osent-ils ! Préparez les troupes dans la région. Ces pseudo-États défiants doivent être rappelés à leur place."
russia.13.o1: "Regrettable."
russia.14.t: "Investissements russes"
russia.14.d: "La Russie a proposé d'investir dans notre pays, en proposant de développer notre base industrielle à leurs frais. Cependant, cette générosité s'accompagne de conditions, car une influence russe accrue sur notre gouvernement suivra inévitablement."
russia.14.o1: "Nous pourrions utiliser quelques usines."
russia.14.o2: "Les Russes, restez à l'écart !"
russia.15.t: "Manifestations contre la guerre"
russia.15.d: "L'opération spéciale que nous avons lancée a déclenché des manifestations contre la guerre à travers le pays. Les manifestants ont adopté le drapeau blanc-bleu-blanc comme symbole, représentant une Russie sans effusion de sang ni ambitions impériales."
russia.15.o1: "Leur drapeau ressemble à une voiture de l'OMON."
russia.16.t: "« Printemps russe » dans le Donbass"
russia.16.d: "Les troubles qui secouent l'Ukraine ont déclenché des soulèvements à Donetsk, Lougansk et dans d'autres régions. Bien que tous n'aient pas réussi à prendre le contrôle, là où ils l'ont fait, nous pourrions avoir une opportunité de soutenir leurs efforts."
russia.16.o1: "Jouer la RPD"
russia.16.o2: "Jouer la RPL"
russia.16.o3: "Jouer la RPH"
russia.16.o4: "Jouer la RPO"
russia.16.o5: "Je suis russe, je tiens jusqu'au bout."
russia.17.t: "Le groupe « Otvajnie »"
russia.17.d: "Notre armée a formé une unité d'élite, rassemblant les meilleurs soldats et équipée du meilleur matériel disponible. Cette unité, connue sous le nom de 'Brave', renforcera nos capacités militaires lorsqu'elle passera à l'offensive."
russia.17.o1: "Gloire aux armes russes."
russia.63.t: "PMC « Fakel », « Flamme », « Potok »"
russia.63.d: "Gazprom a entièrement financé et établi plusieurs compagnies militaires privées prêtes à entrer en combat et à se battre pour le compte de la Russie."
russia.63.a: "Pas trop de PMC ?"
russia.64.t: "Bataillon « Hispaniola »"
russia.64.d: "Le bataillon Hispaniola est une formation militaire russe composée de fans radicaux de clubs de football comme le CSKA, le Spartak, le Torpedo, le Zenit, le Lokomotiv, l'Orel, et autres. Son commandant est Stanislav Orlov, connu sous le nom de code « Espagnol », représentant du groupe Red-Blue Warriors."
russia.64.a: "Même les fans de football vont à la guerre."
russia.65.t: "Unité nationale russe"
russia.65.d: "Le mouvement patriotique panrusse 'Unité nationale russe', également connu sous le nom de 'Barkashovites' ou 'Garde de Barkashov', est un groupe paramilitaire fondamentaliste orthodoxe nationaliste irrédentiste. Fondé en 1990 par d'anciens activistes du groupe 'Mémoire' sous la direction d'Alexandre Barkashov, ses membres ont également formé un bataillon de volontaires pour participer aux combats."
russia.65.a: "Nous avons besoin de l'aide de tous."
russia.66.t: "La Russie a envoyé de l'aide"
russia.66.d: "Le gouvernement russe a fourni une aide humanitaire, un soutien militaro-technique et a envoyé de nombreux volontaires, y compris les célèbres Cosaques du Don, pour nous aider."
russia.66.a: "Merci, Russie !"
russia.67.t: "La Russie a envoyé de l'aide"
russia.67.d: "Le gouvernement russe a livré une aide humanitaire et militaro-technique, ainsi que des volontaires venant de Russie elle-même, y compris un bataillon de volontaires tchétchènes."
russia.67.a: "Merci, Russie !"
russia.68.t: "La Russie a envoyé de l'aide"
russia.68.d: "Le gouvernement russe nous a envoyé une aide humanitaire et militaro-technique, ainsi que des volontaires venant de Russie, y compris des membres de la compagnie militaire privée E.N.O.T."
russia.68.a: "Merci, Russie !"
