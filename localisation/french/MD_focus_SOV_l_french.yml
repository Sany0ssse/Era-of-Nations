##########JIRINOVSKYI - RUSSIAN EMPIRE##########
##########Focuses##########
SOV_zhirinovsky: "Vladimir Jirinovsky"
SOV_zhirinovsky_desc: "Vladimir Jirinovsky (né en 1946) dirige le Parti libéral-démocrate de Russie, hyper-nationaliste, depuis 1991. Connu pour sa rhétorique enflammée et une célèbre altercation avec du jus contre le centriste Boris Nemtsov en 1995, Jirinovsky prône des politiques agressives et imprévisibles. Parmi ses propositions les plus extrêmes figure la contamination des États baltes alignés sur l'OTAN en dispersant des déchets radioactifs aériens à leurs frontières. Ses idées controversées continuent de façonner le discours nationaliste russe."

SOV_bumaga: "Unis seulement sur le papier"
SOV_bumaga_desc: "Bien que le LDPR détienne le pouvoir, des divisions internes persistent, sapant la cohésion du parti. Malgré une apparence d'unité sur le papier, des factions tirent dans différentes directions. Il est temps d'unifier enfin notre parti et d'éliminer les conflits internes pour présenter un front fort et cohérent."

SOV_jirik_partiya: "Le parti de Jirinovsky"
SOV_jirik_partiya_desc: "Le parti de Jirinovsky est uni derrière son leader. La loyauté et la discipline ont solidifié le noyau du parti, lui permettant de poursuivre son agenda nationaliste avec conviction. Cette unité renforce notre position dans le paysage politique russe."

SOV_jirik_partiya_jirinovci: "Rapprocher les loyaux"
SOV_jirik_partiya_jirinovci_desc: "Nous devons rassembler les membres les plus dévoués et loyaux qui obéiront aux ordres sans hésitation. Ces partisans inébranlables formeront l'épine dorsale de notre parti, prêts à agir de manière décisive lorsque requis. Renforcer la loyauté est essentiel pour notre survie."

SOV_jirik_partiya_chistki: "Purge du parti"
SOV_jirik_partiya_chistki_desc: "Il est temps de purger le parti des libres penseurs et des traîtres potentiels qui menacent notre unité. En éliminant les dissidents, nous assurerons une organisation disciplinée et obéissante. Cette purge est vitale pour sécuriser notre avenir politique."

SOV_jirik_partiya_puppet_sovet: "Le Conseil suprême fantoche"
SOV_jirik_partiya_puppet_sovet_desc: "Le Conseil suprême doit servir uniquement de porte-voix, sans aucune autonomie ou pouvoir réel. En subordonnant cet organe, nous empêchons les défis à la direction et garantissons un contrôle absolu sur les décisions du parti."

SOV_jirik_partiya_young: "Militarisation de l'aile jeunesse"
SOV_jirik_partiya_young_desc: "La jeunesse doit être préparée pour le conflit à venir, car les temps de paix touchent à leur fin. Former et militariser les jeunes membres du parti créera une nouvelle génération prête à défendre nos idéaux. Cet accent sur la jeunesse est crucial pour notre force à long terme."

SOV_jirik_partiya_total_control: "Contrôle total"
SOV_jirik_partiya_total_control_desc: "Notre parti doit être entièrement sous notre contrôle pour empêcher toute rébellion ou action non autorisée. Une domination absolue sur toutes les fonctions du parti garantit efficacité et loyauté. Ce n'est qu'à travers un contrôle total que nous pouvons atteindre nos objectifs."

SOV_jirik_partiya_and: "Jirinovsky et le parti"
SOV_jirik_partiya_and_desc: "Le pouvoir du parti ne repose pas uniquement sur son leader ; il le complète et le soutient. Cette relation symbiotique permet un leadership coordonné et un soutien plus large à travers les différentes factions du parti. Ensemble, ils forment une force unifiée."

SOV_jirik_partiya_and_samodeal: "Encourager l'auto-activité"
SOV_jirik_partiya_and_samodeal_desc: "Nous favoriserons l'initiative et l'activité autonome au sein des rangs du parti. Encourager les membres à prendre des responsabilités et à agir de manière proactive renforce notre mouvement de l'intérieur. Cette approche construit une organisation plus résiliente."

SOV_jirik_partiya_and_kadres: "Approche pragmatique des ressources humaines"
SOV_jirik_partiya_and_kadres_desc: "Plutôt que d'exiger une loyauté aveugle, nous rechercherons les personnels les plus efficaces et compétents pour le parti. La compétence et les résultats primeront sur la simple dévotion, garantissant un leadership plus fort et plus efficace."

SOV_jirik_partiya_and_sovet: "Renforcer le Conseil suprême"
SOV_jirik_partiya_and_sovet_desc: "Le Conseil suprême doit démontrer que Jirinovsky n'est pas un dictateur et que le parti embrasse une pluralité d'opinions. En renforçant cet organe, nous montrons l'engagement du parti envers le débat interne et la gouvernance partagée."

SOV_jirik_partiya_and_money: "Revenus supplémentaires"
SOV_jirik_partiya_and_money_desc: "Nous augmenterons les revenus du parti à travers diverses sources pour financer nos activités plus efficacement. Accroître les ressources financières est essentiel pour développer notre influence et maintenir des campagnes à long terme. Diversifier les sources de revenus est une priorité stratégique."

SOV_jirik_partiya_and_autonomous: "Le parti autonome"
SOV_jirik_partiya_and_autonomous_desc: "Un parti autonome garantit la liberté d'opinion et la diversité au sein de ses rangs. Permettre une indépendance interne encourage l'innovation et le débat, ce qui renforcera notre plateforme politique et notre adaptabilité."

SOV_russian_irredentism: "Irrédentisme russe"
SOV_russian_irredentism_desc: "La Russie était autrefois un grand empire mais a été affaiblie par des révolutions, des coups d'État et des guerres civiles. Maintenant, nous devons restaurer notre ancienne gloire en récupérant les territoires perdus. La Crimée et le Donbass nous appartiennent, et nos chars rouleront jusqu'à Prague. C'est notre destin et notre devoir."

SOV_governorates: "Gouvernorats"
SOV_governorates_desc: "Nous avons trop longtemps enduré les républiques nationales et la marginalisation des Russes ethniques. En réorganisant le pays en 30 gouvernorats, nous gouvernerons plus efficacement et unirons l'État. Cette réforme renforce l'autorité centrale et rétablit l'ordre."

SOV_strengthen_union_state: "Gouvernorat de Minsk"
SOV_strengthen_union_state_desc: "Il est temps de mettre fin à la prétendue indépendance de la Biélorussie. Restaurer la Biélorussie en tant que gouvernorat au sein de notre empire est le meilleur moyen d'assurer la stabilité et le contrôle. Cette réintégration bénéficiera aux deux peuples et renforcera nos frontières."

SOV_maintain_csto_1: "Dissoudre l'OTSC"
SOV_maintain_csto_1_desc: "L'OTSC est une organisation inutile et inefficace qui ne sert plus nos intérêts. Il est temps de la dissoudre et de dépasser les alliances obsolètes. Notre avenir réside dans des partenariats plus forts et plus ciblés."

SOV_rus_sphere_united_arms: "Pacte de Moscou"
SOV_rus_sphere_united_arms_desc: "Nous devons créer une nouvelle alliance politique et militaire puissante. Les anciens accords nous ont échoué ; il est temps de former notre propre coalition qui affirmera notre influence mondiale et défiera la domination occidentale."

SOV_integrate_abkhazia: "Gouvernorat de Tiflis"
SOV_integrate_abkhazia_desc: "Nous devons nous concentrer sur les anciennes terres de l'Empire russe dans le Caucase. Les conflits géorgiens-ossètes-abkhazes en cours menacent la stabilité régionale. Notre objectif est de mettre fin à ces disputes de manière permanente et de rétablir l'ordre sous notre contrôle."

SOV_support_serbia: "Soutenir la Serbie"
SOV_support_serbia_desc: "La Serbie reste notre allié clé en Europe du Sud. Nous devons fournir une assistance chaque fois qu'ils en ont besoin pour renforcer ce partenariat vital et promouvoir nos intérêts communs dans la région."

SOV_integrate_serbia: "État d'Union avec la Serbie"
SOV_integrate_serbia_desc: "Nous proposerons à la Serbie de renouveler le projet d'État d'Union, que notre parti a fortement soutenu dans les années 1990. Cette union approfondira la coopération et renforcera notre position stratégique en Europe."

SOV_iraq_moscow_pact: "Protéger l'Irak"
SOV_iraq_moscow_pact_desc: "Nous ne permettrons pas aux armées étrangères de se promener librement dans les rues de Bagdad. Protéger l'Irak contre les interférences extérieures est crucial pour maintenir la stabilité régionale et notre influence."

SOV_save_gaddafi: "Protéger la Libye"
SOV_save_gaddafi_desc: "Les armées étrangères ne seront pas autorisées à dominer Tripoli. Nous nous engageons à protéger la souveraineté de la Libye et à nous opposer à l'intervention militaire extérieure."

SOV_czechoslovak_region: "Région tchécoslovaque"
SOV_czechoslovak_region_desc: "Comme en 1968, la région tchécoslovaque reste d'un grand intérêt stratégique pour nous. Assurer notre influence ici consolidera notre domination sur l'Europe de l'Est. Nous devons agir de manière décisive pour rétablir notre position."

SOV_help_karabah: "Libérer le Karabagh de l'Azerbaïdjan"
SOV_help_karabah_desc: "Nous ne reconnaissons pas l'occupation du Karabagh par l'Azerbaïdjan et avons l'intention de rendre ces terres à notre empire. Cette libération rétablira la justice historique et renforcera nos frontières méridionales."

SOV_help_armenia: "Union arméno-russe"
SOV_help_armenia_desc: "L'Arménie a toujours été une nation chrétienne fraternelle avec des liens profonds avec nous. Nous sommes prêts à offrir à l'Arménie une véritable alliance basée sur la confiance et le soutien mutuel. Notre amitié est enracinée dans des siècles d'histoire partagée."

SOV_alliance_armenia: "Mettre fin à l'Azerbaïdjan"
SOV_alliance_armenia_desc: "L'histoire fabriquée de l'Azerbaïdjan ne fait qu'entraver notre Arménie fraternelle. Nous confronterons et résoudrons cet obstacle pour assurer la sécurité et la prospérité de l'Arménie."

SOV_Bring_back_the_legacy_of_the_Russian_Empire: "Rétablir l'héritage de l'Empire russe"
SOV_Bring_back_the_legacy_of_the_Russian_Empire_desc: "Il est temps de restaurer les noms historiques des villes russes, honorant notre héritage. Cette renaissance nous reconnectera à notre passé glorieux et inspirera la fierté nationale à travers le pays."

SOV_protect_russians: "Loi sur la protection des Russes"
SOV_protect_russians_desc: "Nous protégerons les Russes où qu'ils vivent, refusant d'abandonner nos compatriotes. Cette loi garantit leurs droits et leur sécurité, renforçant notre engagement envers le peuple russe partout."

SOV_Former_Russian_capital: "Ancienne capitale russe"
SOV_Former_Russian_capital_desc: "Pour récupérer l'héritage de la Russie, nous devons faire de Saint-Pétersbourg notre capitale à nouveau. Ce geste symbolique restaurera le statut historique de la ville et réaffirmera notre engagement envers la tradition."

SOV_approach_iran: "Approcher l'Iran"
SOV_approach_iran_desc: "Nous prévoyons d'offrir à l'Iran une alliance qui renforcera considérablement notre position dans la région. Construire ce partenariat est clé pour sécuriser notre influence et contrer l'interférence occidentale."

SOV_south_azer_admistration: "Le gouvernorat iranien"
SOV_south_azer_admistration_desc: "Nous avons l'intention de soutenir les forces locales loyales à nous en Azerbaïdjan du Sud pour déclencher une révolte qui affaiblira la mainmise de l'Iran. Cette stratégie vise à déstabiliser le contrôle iranien et à élargir notre influence."

SOV_unite_of_greater_russia: "Unie, grande et indivisible"
SOV_unite_of_greater_russia_desc: "La Russie doit être un pays uni et indivisible sans divisions nationales. La fragmentation en républiques a autrefois détruit notre puissant État, et seule l'unité peut restaurer notre force."

SOV_proclamation_of_greater_russia: "Proclamer la Grande Russie"
SOV_proclamation_of_greater_russia_desc: "La Russie est maintenant une superpuissance mondiale dominant l'Eurasie et façonnant la politique mondiale. Avec une nouvelle force, nous confronterons l'Occident et sécuriserons notre place légitime sur la scène mondiale."

SOV_zhirinovsky_secure_central_asia: "Exiger la soumission de l'Asie centrale"
SOV_zhirinovsky_secure_central_asia_desc: "L'Asie centrale a toujours été dans notre sphère d'influence. Nous devons la sécuriser fermement pour empêcher les Iraniens ou les Chinois de gagner du terrain. Notre domination là-bas est non négociable."

SOV_nov: "Retour de Novorossiya"
SOV_nov_desc: "Il est temps de ramener Novorossiya à sa place légitime au sein de notre empire. Restaurer cette région renforce nos frontières méridionales et ravive notre héritage historique."

SOV_galicia: "Gouvernorat de Galicie"
SOV_galicia_desc: "La Galicie est une région unique qui nécessite des réformes importantes pour une intégration complète dans notre empire. Bien que cela prenne du temps, la Galicie atteindra finalement le statut de gouvernorat et deviendra une partie loyale de notre royaume."

SOV_expand_welfare_programs: "Élargir les programmes sociaux"
SOV_expand_welfare_programs_desc: "Le peuple russe a trop longtemps souffert sous le système de santé soviétique défaillant. Il est temps d'une reprise nationale et d'une expansion des programmes sociaux pour améliorer la qualité de vie et la santé publique."

SOV_revive_the_great_idea: "La fraternité russo-grecque"
SOV_revive_the_great_idea_desc: "La côte ouest de l'Anatolie était historiquement un territoire grec orthodoxe, injustement pris par les Ottomans. Si les Grecs souhaitent le récupérer, ils ont notre plein soutien. Cette fraternité renforce notre influence dans la région."

SOV_help_sirya: "Les frères syriens"
SOV_help_sirya_desc: "Nous avons l'intention d'accroître notre influence en Syrie, un pays ciblé par les globalistes occidentaux cherchant sa destruction. Soutenir la Syrie protège nos intérêts stratégiques et contre les forces hostiles."

SOV_bulgarian_ally: "Vieux frère slave"
SOV_bulgarian_ally_desc: "Après la libération de la Bulgarie de la domination ottomane en 1878, elle aurait pu devenir un allié fort, mais les tsars ont manqué cette chance. Nous devons maintenant corriger cela en gagnant la faveur du peuple bulgare et en restaurant des liens fraternels."

SOV_zhirinovsky_attack_ruthenia: "Déstabilisation de l'Ukraine"
SOV_zhirinovsky_attack_ruthenia_desc: "L'Ukraine a longtemps poursuivi des politiques anti-russes depuis l'effondrement de l'URSS. Nous ne pouvons pas permettre à cette région de devenir un bastion hostile. Nous prendrons des mesures décisives pour neutraliser cette menace une fois pour toutes."

SOV_zhirinovsky_attack_ukraha: "Opération militaire en Ukraine"
SOV_zhirinovsky_attack_ukraha_desc: "Notre objectif est de mettre fin à l'existence de l'Ukraine en tant qu'État indépendant. Il est temps que le drapeau russe flotte à nouveau sur Kiev, restaurant notre contrôle historique."

SOV_zhirinovsky_take_trans: "Référendum transnistrien"
SOV_zhirinovsky_take_trans_desc: "Le problème en cours avec la Moldavie devrait devenir un casse-tête pour eux car nous prenons le contrôle de la Transnistrie. Ce référendum légitimera notre revendication et étendra notre influence."

SOV_question_of_poland: "La question de la Pologne"
SOV_question_of_poland_desc: "En août 2014, Jirinovsky a menacé de bombarder la Pologne, reflétant sa position agressive envers ce pays. Cette menace souligne les tensions dans nos relations."

SOV_question_of_bavaria: "Séparatisme bavarois"
SOV_question_of_bavaria_desc: "Nous soutenons le désir de la Bavière de se séparer de l'Allemagne. Encourager le séparatisme affaiblira l'Allemagne et servira nos intérêts stratégiques dans la région."

SOV_question_of_genrih: "La révolution monarchique allemande"
SOV_question_of_genrih_desc: "Nous prévoyons de renverser le gouvernement allemand corrompu et défaillant et de restaurer la grandeur des Allemands — naturellement, au sein de la Russie. Cette révolution redessinera l'équilibre des pouvoirs en Europe."

SOV_question_of_east_german: "Rappeler la RDA"
SOV_question_of_east_german_desc: "Nous rappellerons au peuple de l'Allemagne de l'Est l'histoire fière de la RDA. Raviver cet héritage soutient nos objectifs politiques plus larges et notre influence régionale."

SOV_europe_pizda: "Préparer la marche sur l'Europe"
SOV_europe_pizda_desc: "Le temps est venu d'éliminer la menace européenne. Nous les saperons de l'intérieur et briserons complètement leur pouvoir. Cette campagne marque le début de notre poussée décisive en Europe."

SOV_question_of_spain: "Espagne divisée"
SOV_question_of_spain_desc: "L'Espagne a longtemps équilibré ses régions autonomes pour empêcher le séparatisme. Nous avons l'intention de perturber cet équilibre pour affaiblir l'Espagne et promouvoir des divisions régionales. Cette stratégie fracturera l'unité de l'Espagne."

SOV_question_of_germany: "Problème allemand"
SOV_question_of_germany_desc: "L'Allemagne reste un rival stratégique clé. Nous n'avons plus l'intention de faire preuve de clémence comme par le passé. Résoudre le problème allemand est crucial pour sécuriser notre domination en Europe."

SOV_syria_kurdistan_armenia_summit: "Exercices militaires conjoints"
SOV_syria_kurdistan_armenia_summit_desc: "Notre coalition anti-turque mènera des exercices militaires conjoints pour renforcer les capacités de combat de la Syrie, du Kurdistan et de l'Arménie. Ces exercices nous préparent à des opérations de défense et d'offensive coordonnées."

SOV_istanbul_is_constantinople: "Istanbul est Constantinople"
SOV_istanbul_is_constantinople_desc: "Il est temps d'exécuter les plans de guerre du sommet anti-turc et de récupérer les territoires perdus. Restaurer Istanbul à son ancienne identité est un objectif clé de cette campagne."

SOV_constantinople_rename: "Constantinople renaît"
SOV_constantinople_rename_desc: "Nous restaurons Constantinople à son nom historique. Notre tâche est de raviver sa gloire d'antan, telle qu'elle était avant la chute de Byzance, symbolisant notre pouvoir renouvelé dans la région."

SOV_constantinople_police_operation: "Opération policière spéciale"
SOV_constantinople_police_operation_desc: "La résistance turque menace notre contrôle dans la région. Nous déploierons les forces de l'ordre pour supprimer complètement l'opposition et assurer la stabilité. Cette opération garantit notre domination."

SOV_constantinople_subject_rf: "Constantinople à son port natal"
SOV_constantinople_subject_rf_desc: "Avec la résistance réprimée et les installations clés sécurisées, nous sommes prêts à intégrer pleinement ce territoire dans notre grand empire. Cela marque un nouveau chapitre dans notre expansion."

SOV_crusade_russian: "La croisade russe"
SOV_crusade_russian_desc: "Il est temps de lancer notre grande croisade russe vers la Terre Sainte. Ce que les empereurs passés n'ont pas réussi à accomplir, nous le compléterons avec détermination et force. Cette mission renouvelle notre dessein spirituel et impérial."

SOV_crusade_antioch: "Gouvernorat d'Antioche"
SOV_crusade_antioch_desc: "Ces terres appartenaient autrefois au Royaume d'Antioche, et nous les restaurerons. Raviver ce gouvernorat rétablit notre présence et honore les revendications historiques."

SOV_crusade_assiryan: "Gouvernorat assyrien"
SOV_crusade_assiryan_desc: "La Syrie moderne n'est qu'une ombre du grand empire assyrien. Nous guiderons les Syriens vers la grandeur sous la domination russe, restaurant leur ancien pouvoir et prestige."

SOV_crusade_isr: "Gouvernorat de Jérusalem"
SOV_crusade_isr_desc: "Jérusalem est l'objectif ultime de notre campagne. Le Saint-Sépulcre nous appartiendra désormais, consolidant notre influence spirituelle et politique dans la région."

SOV_crusade_egy: "Gouvernorat copte"
SOV_crusade_egy_desc: "Les Coptes sont les véritables dirigeants de l'Égypte. Nous soutiendrons leur cause et ferons tout notre possible pour les aider à reprendre leur position légitime au sein de notre empire."

SOV_romanian_shit: "Menace roumaine"
SOV_romanian_shit_desc: "La Roumanie menace nos frontières sud-ouest. Nous devons résoudre ce problème rapidement pour sécuriser nos frontières et maintenir la stabilité régionale."

SOV_crush_europe: "Écraser l'Europe"
SOV_crush_europe_desc: "L'Europe n'offre que des globalistes, des dégénérés et une décadence morale. Nous écraserons cette décadence et rétablirons l'ordre. Notre campagne vise le cœur du déclin européen."

SOV_treaty_with_turkmenistan: "Traité avec le Turkménistan"
SOV_treaty_with_turkmenistan_desc: "Il n'y a pas besoin de combattre les Turkmènes. Nous sommes confiants qu'ils se réuniront volontiers avec notre empire de manière pacifique. Ce traité renforcera nos liens et élargira notre influence."

SOV_treaty_with_afganistan: "Retour en Afghanistan"
SOV_treaty_with_afganistan_desc: "Notre empire a de nouveau atteint les frontières de l'Afghanistan. Peut-être que cette fois, la fortune nous favorisera, et nous reprendrons le contrôle de cette région stratégique."

SOV_imperial_russian_lands: "Terres impériales russes"
SOV_imperial_russian_lands_desc: "La première étape de notre plan est de récupérer les terres natales perdues pendant la domination communiste. Avec la faveur divine, nous restaurerons les anciens territoires et l'honneur de notre empire."

SOV_claim_finland: "Revendiquer la Finlande"
SOV_claim_finland_desc: "La frontière de la Finlande est trop proche de Saint-Pétersbourg. Nous devons la repousser vers le nord et l'ouest, comme l'a fait Pierre le Grand, en battant décisivement les États nordiques pour qu'ils ne nous menacent plus jamais. Cela est vital pour notre sécurité."

SOV_zhirinovsky_secure_east_asia: "Ambitions asiatiques"
SOV_zhirinovsky_secure_east_asia_desc: "La diplomatie russe a toujours été complexe et multidimensionnelle. Nous devons sécuriser et élargir notre influence en Asie pour renforcer notre position mondiale. Gloire à la Russie !"

SOV_demand_manchuria: "Retour à Zheltorossiya"
SOV_demand_manchuria_desc: "Il est temps de relancer l'ancien projet de Russie Jaune. Nous sommes prêts à exiger de la Chine les terres qui appartenaient autrefois à l'Empire russe. Cette revendication audacieuse restaurera notre influence en Mandchourie."

SOV_zheltoros: "Gouvernorat mongol"
SOV_zheltoros_desc: "La Mongolie a longtemps servi de tampon entre nous et la Chine. Il est temps de mettre fin à cet arrangement et de faire de la Mongolie un sujet officiel de notre Empire russe, renforçant nos frontières et notre contrôle."

SOV_allied_nrk: "Alliance avec la Corée du Nord"
SOV_allied_nrk_desc: "Nous visons à renforcer notre influence à l'Est en élargissant les alliances, en commençant par une nation dont le peuple reconnaît notre soutien à son existence. Ce partenariat renforcera notre position dans la région."

SOV_expand_pacific_naval_presence: "Élargir la présence navale dans le Pacifique"
SOV_expand_pacific_naval_presence_desc: "En développant l'industrie de la construction navale dans l'Extrême-Orient, nous pouvons stimuler la croissance régionale et projeter une plus grande puissance navale à travers l'océan Pacifique, faisant avancer nos ambitions stratégiques."

SOV_avenge_tsushima: "Venger Tsushima"
SOV_avenge_tsushima_desc: "La guerre russo-japonaise de 1904-1905 fut une défaite humiliante pour notre nation. Il est temps de venger nos ancêtres en battant décisivement le Japon une fois pour toutes."

SOV_end_the_usa: "Mettre fin aux États-Unis"
SOV_end_the_usa_desc: "De la décadence morale au terrorisme mondial, les États-Unis représentent une menace fondamentale pour notre survie et la stabilité mondiale. Ils doivent être détruits pour assurer notre avenir."

SOV_return_alaska: "Retour de l'Alaska"
SOV_return_alaska_desc: "L'Alaska a été vendu pour une bouchée de pain par des dirigeants insensés dans les siècles passés. Maintenant, il est temps de récupérer ce territoire vital et de le ramener à sa patrie légitime."

SOV_side_with_the_people: "Se ranger du côté du peuple"
SOV_side_with_the_people_desc: "Pendant des siècles, les élites et les mafias criminelles ont opprimé le peuple. Il est temps de corriger cette injustice et de se tenir fermement du côté du peuple."

SOV_purge_disloyal_oligarchs: "Purger les oligarques déloyaux"
SOV_purge_disloyal_oligarchs_desc: "Malgré nos efforts, certains oligarques refusent de soutenir notre cause. Nous leur offrirons des conditions qu'ils ne pourront pas refuser et éliminerons ceux qui se dressent sur notre chemin."

SOV_ensure_a_balance: "Assurer un équilibre"
SOV_ensure_a_balance_desc: "La société russe est principalement divisée entre les élites et le peuple. Nous devons maintenir un équilibre délicat, soutenant les deux groupes car chacun est essentiel à la stabilité du pays."

SOV_return_kgb: "Restaurer le KGB"
SOV_return_kgb_desc: "Les services de renseignement actuels sont une pâle imitation du KGB de l'ère soviétique, qui était le plus efficace. Nous rétablirons le KGB pour restaurer la force et la sécurité."

SOV_storm_v: "Envoyer les prisonniers à la guerre"
SOV_storm_v_desc: "Les prisonniers épuisent les ressources publiques sans contribuer. Ils seront désormais envoyés combattre pour leur pays et rembourser leurs dettes par le service."

SOV_new_russian_army: "Armée volontaire russe"
SOV_new_russian_army_desc: "Nos forces armées nécessitent une réforme majeure. Le système actuel a échoué, et il est temps de créer une armée volontaire prête à défendre la Russie avec une vigueur renouvelée."

SOV_women: "Bataillons de femmes"
SOV_women_desc: "Nos bataillons de femmes inspireront la peur chez l'ennemi. Leur seule présence fera fuir les adversaires en panique."

SOV_kazachestvo: "Militariser les Cosaques"
SOV_kazachestvo_desc: "Les Cosaques doivent cesser leur comportement indiscipliné et revenir à servir en tant que partie disciplinée de l'armée russe."

SOV_war_kafedra: "Restaurer les départements militaires"
SOV_war_kafedra_desc: "L'abolition des départements militaires fut une grave erreur. Nous les rétablirons pour renforcer notre armée et l'éducation militaire."

SOV_nationalize: "Réexaminer les résultats de la privatisation"
SOV_nationalize_desc: "Nous réévaluerons les effets destructeurs de la privatisation et annulerons ses résultats nuisibles pour protéger les intérêts nationaux."

SOV_minister_propaganda: "Créer un ministère de la Propagande"
SOV_minister_propaganda_desc: "La propagande doit être centralisée sous un ministère dédié pour garantir un contrôle total et une efficacité de tous les messages."
SOV_pay_off_army: "Possibilité d'acheter l'exemption militaire"
SOV_pay_off_army_desc: "Nous permettrons aux individus d'éviter le service militaire en payant une somme importante, qui sera réinvestie dans le renforcement de l'armée."

SOV_zhirinovsky_economic_policy: "Politique économique de Jirinovsky"
SOV_zhirinovsky_economic_policy_desc: "Des siècles d'expérimentation avec des économies planifiées et de marché ont montré la nécessité d'une approche mixte pour faire avancer l'économie russe au 21e siècle."

SOV_progressive_taxation: "Fiscalité progressive"
SOV_progressive_taxation_desc: "Un système fiscal où les hauts revenus paient un pourcentage plus élevé tandis que ceux ayant des revenus plus faibles paient moins. Cette politique favorise l'équité et l'équilibre social."

SOV_guarantee_the_people: "Garantir le peuple"
SOV_guarantee_the_people_desc: "Le peuple est le fondement de la puissance de la Russie et de la nôtre. Nous devons obtenir leur soutien pour maintenir notre autorité et notre stabilité."

SOV_revitalize_russian_industrial_sector: "Revitaliser le secteur industriel russe"
SOV_revitalize_russian_industrial_sector_desc: "L'industrie russe nous a autrefois transformés d'une société agraire en une nation spatiale. Avec des investissements et une gestion appropriés, elle peut nous mener de l'ère industrielle à l'ère de l'information."

SOV_increase_fossil_fuel_investments: "Augmenter les investissements dans les combustibles fossiles"
SOV_increase_fossil_fuel_investments_desc: "Malgré l'opposition des globalistes, les combustibles fossiles restent essentiels et irremplaçables. Nous devons investir massivement dans ce secteur pour assurer la prospérité et la sécurité énergétique de la Russie."

SOV_idea_comp_industry: "Industrie informatique"
SOV_idea_comp_industry_desc: "Notre économie est dépassée. Nos scientifiques et travailleurs qualifiés doivent exploiter la technologie informatique pour faire progresser l'économie russe et le complexe militaro-industriel à de nouveaux sommets."

SOV_increased_arms_exports: "Augmentation des exportations d'armes"
SOV_increased_arms_exports_desc: "L'industrie de l'armement renommée de la Russie est un outil puissant pour gagner de l'influence à l'échelle mondiale. Nous devons construire des infrastructures pour augmenter la production et les exportations d'armes."

SOV_zhirinovsky_secure_baltics: "Sécuriser les pays baltes"
SOV_zhirinovsky_secure_baltics_desc: "En 1991, Jirinovsky a menacé de prendre des mesures extrêmes contre les pays baltes, y compris l'élimination de déchets nucléaires et des attaques par radiation. En 2014, il a menacé de bombarder la région. Sécuriser les pays baltes reste une priorité."

SOV_arrest_zyuganov: "Arrêter Zyuganov"
SOV_arrest_zyuganov_desc: "Gennady Zyuganov, leader du Parti communiste, est un adversaire redoutable. Son arrestation neutralisera une menace majeure pour notre pouvoir."

SOV_coopt_zyuganov: "Coopter Zyuganov"
SOV_coopt_zyuganov_desc: "Bien que Zyuganov soit dans l'opposition, nous partageons des objectifs communs. Unir nos forces pourrait renforcer la quête d'une Grande Russie."

SOV_supreme_leader: "Devenir leader suprême"
SOV_supreme_leader_desc: "Nous pouvons assumer un pouvoir absolu sans freins ni contrepoids, en gouvernant avec une autorité incontestée."

SOV_jirik_cult: "Le culte de Jirinovsky"
SOV_jirik_cult_desc: "Jirinovsky est devenu une icône de notre État. Le peuple a créé un culte autour de lui, et nous permettrons à cela de prospérer."

SOV_fuck_parties: "Au diable la démocratie"
SOV_fuck_parties_desc: "La démocratie est un outil des services de renseignement occidentaux pour propager leur propagande. Nous ne permettrons pas l'influence ennemie sur notre sol."

SOV_jirik_fear: "L'État policier"
SOV_jirik_fear_desc: "Aucune pitié ne sera montrée aux ennemis de la patrie. Nos forces de police ont une lourde charge de travail pour maintenir l'ordre."

SOV_jirik_stand: "La patrie avant tout"
SOV_jirik_stand_desc: "Défendre la patrie est le devoir de chaque citoyen. Même les civils doivent être prêts à protéger leur pays avec un courage inébranlable."

SOV_jirik_war_religion: "Religion militaire impériale"
SOV_jirik_war_religion_desc: "Notre nation doit abandonner le pacifisme et adopter une foi orthodoxe militarisée pour unifier et renforcer le peuple."

SOV_jirik_warlord: "Le dirigeant suprême"
SOV_jirik_warlord_desc: "En avant vers un avenir brillant pour une Russie grande et puissante !"

SOV_remain_president: "Rester président"
SOV_remain_president_desc: "Nous exerçons déjà un pouvoir presque absolu ; il n'est pas nécessaire de poursuivre d'autres changements."

SOV_iron_regency: "Régence de fer"
SOV_iron_regency_desc: "Nous pouvons passer à une monarchie, en nommant un conseil de régence pour gouverner pendant la transition."

SOV_make_russia_great_again: "Rendre la Russie grande à nouveau !"
SOV_make_russia_great_again_desc: "La grandeur de la Russie sera restaurée, et nous ferons tout notre possible pour y parvenir."

SOV_coopt_hyper_nationalists: "Coopter les ultra-nationalistes"
SOV_coopt_hyper_nationalists_desc: "Nous devrions nous allier avec l'aile nationaliste radicale de notre parti, en leur accordant plus de pouvoir au sein du gouvernement."

SOV_rva: "Former une armée volontaire russe"
SOV_rva_desc: "Avec le nombre croissant de groupes nationalistes, nous unirons les unités paramilitaires en une armée volontaire russe, prête à être déployée en temps de guerre."

SOV_kill_western_opposition: "Éliminer l'opposition pro-occidentale"
SOV_kill_western_opposition_desc: "Les ultra-nationalistes exigent l'élimination de l'opposition alignée sur l'Occident. Nous devrions les autoriser à mener ces actions."

SOV_amend_the_russian_constitution: "Amender la constitution russe"
SOV_amend_the_russian_constitution_desc: "La constitution est acceptable avec quelques ajustements pour correspondre à notre programme."

SOV_new_russian_status_quo: "Nouveau statu quo russe"
SOV_new_russian_status_quo_desc: "Le pouvoir a été consolidé ; un nouvel établissement gouverne désormais la Russie."

SOV_decommunization: "Décommunisation"
SOV_decommunization_desc: "Le communisme a détruit la Russie, causant la famine, le vol, l'emprisonnement et la mort de millions de personnes. Nous ne rendrons plus hommage à cet héritage sombre. À bas le communisme !"

SOV_embrace_monarchists: "Adopter les monarchistes"
SOV_embrace_monarchists_desc: "Le soutien à la monarchie croît. Nous devrions inviter les monarchistes à rejoindre notre parti et à influencer."

SOV_condemn_the_partition_of_india: "Traité d'amitié indo-russe"
SOV_condemn_the_partition_of_india_desc: "L'Inde et la Russie se sont historiquement opposées à l'Occident ensemble. Notre principal rival est maintenant la Chine, dont l'ascension nous menace existentiellement."

SOV_praise_china: "Traité d'amitié sino-russe"
SOV_praise_china_desc: "La Chine et la Russie se sont unies contre les puissances occidentales. Notre principal adversaire est l'Inde, dont la domination croissante représente une menace."

SOV_reconcile_the_cprf: "Réconcilier le CPRF"
SOV_reconcile_the_cprf_desc: "Nous partageons de nombreux objectifs avec le Parti communiste. Peut-être pouvons-nous les intégrer à notre cause et réparer les divisions passées."

SOV_support_workers_rights: "Soutenir les droits des travailleurs"
SOV_support_workers_rights_desc: "Les travailleurs sont des membres vitaux de notre nation. Nous devons adopter des réformes pour améliorer leurs droits, même si cela affecte la productivité."

SOV_social_conservatism: "Conservatisme social"
SOV_social_conservatism_desc: "Le conservatisme social promeut l'application par le gouvernement des valeurs traditionnelles, considérées comme essentielles pour maintenir la civilisation et la décence."

SOV_ally_national_bolsheviks: "S'allier avec les nationaux-bolcheviks"
SOV_ally_national_bolsheviks_desc: "Les nationaux-bolcheviks sont un groupe nationaliste d'extrême droite très vocal. Ils pourraient devenir un allié politique utile."

SOV_national_bolshevik_thought: "Pensée nationale-bolchevique"
SOV_national_bolshevik_thought_desc: "L'idéologie nationale-bolchevique combine le nationalisme avec les principes bolcheviques pour poursuivre une Grande Russie."

SOV_national_bolshevik_cooperation: "Coopération nationale-bolchevique"
SOV_national_bolshevik_cooperation_desc: "Nous avons obtenu la coopération des nationaux-bolcheviks pour monopoliser le soutien nationaliste et renforcer notre mouvement."

SOV_national_bolshevik_coup: "Coalition avec les nationaux-bolcheviks"
SOV_national_bolshevik_coup_desc: "Permettre une coalition avec ce grand parti d'opposition allégera les pressions et consolidera notre contrôle."

SOV_absolute_monarchy: "Monarchie absolue"
SOV_absolute_monarchy_desc: "Une monarchie sans contraintes constitutionnelles est la meilleure voie pour un leadership fort."

SOV_constitutional_monarchy: "Monarchie constitutionnelle"
SOV_constitutional_monarchy_desc: "Un pouvoir absolu corrompt. Une certaine retenue sur le pouvoir du monarque est nécessaire pour éviter de répéter les erreurs des Romanov."

SOV_empower_the_romanovs: "Honorer les Romanov"
SOV_empower_the_romanovs_desc: "La dynastie Romanov a dirigé la Russie pendant des siècles jusqu'à ce qu'elle soit injustement renversée par les bolcheviks. Nous devrions honorer leur héritage et leurs réalisations."

SOV_zhirinovsky_iron_regent: "Revendiquer la couronne"
SOV_zhirinovsky_iron_regent_desc: "La révolution de 1917 a plongé la Russie dans le chaos. Vladimir Jirinovsky, destiné à être le prochain tsar, rétablira l'ordre et résoudra les crises les plus profondes de la nation."

SOV_compromise_with_old_believers: "Compromis avec les Starovertsy"
SOV_compromise_with_old_believers_desc: "Les Starovertsy rejettent le patriarche Kirill. Nous devrions parvenir à un compromis religieux, peut-être en nommant un nouveau patriarche acceptable pour eux comme religion d'État."

SOV_crush_old_believers: "Écraser les Starovertsy"
SOV_crush_old_believers_desc: "Les Starovertsy refusent de reconnaître le patriarche Kirill. Nous devons les réprimer pour établir notre propre religion d'État."

SOV_the_third_rome_desc: "Moscou, la troisième Rome, est l'idée que Moscou est le successeur de l'ancienne Rome et de Byzance, portant l'héritage de l'Empire romain. Ce concept a été débattu tout au long de l'histoire européenne quant à quelle ville hérite légitimement de cet héritage."

SOV_unity_of_church_and_state: "Unité de l'Église et de l'État"
SOV_unity_of_church_and_state_desc: "L'orthodoxie est le fondement de la nation russe. Sans son soutien, gouverner notre vaste empire est impossible. Nous intégrerons la religion dans la gouvernance en conséquence."

SOV_god_save_the_tsar: "Bozhe, Tsarya Khrani !"
SOV_god_save_the_tsar_desc: "Que Dieu sauve le tsar !"

##########Ideas##########
SOV_IRQ_base: "Base militaire russe [SOV.GetFlag]"
SOV_IRQ_base_desc: "La base militaire russe, située près de notre capitale, nous rappelle que la Russie ne nous abandonnera pas en cas de guerre mondiale. Mais si le régime dans notre pays ou en Russie change radicalement, la base militaire sera immédiatement fermée."

SOV_LBA_base: "Base militaire russe [SOV.GetFlag]"
SOV_LBA_base_desc: "La base militaire russe, située près de notre capitale, nous rappelle que la Russie ne nous abandonnera pas en cas de guerre mondiale. Mais si le régime dans notre pays ou en Russie change radicalement, la base militaire sera immédiatement fermée."

SOV_IRQ_military_advisors: "Instructeurs militaires de [SOV.GetNameWithFlag]"

S0V_russian_sphere_idea: "Pacte de Moscou"
S0V_russian_sphere_idea_desc: "Alliance créée par la Russie pour remplacer l'OTSC inutile et injustifié. Maintenant, la Russie est prête à rassembler des alliés autour d'elle et à riposter contre ses ennemis."

SOV_military_exercises_anti_turkey_idea: "Exercices conjoints avec l'armée russe"
SOV_military_exercises_anti_turkey1_idea: "Exercices conjoints avec la coalition anti-turque"

S0V_russian_sphere_mil_idea: "Forces armées unies de la sphère russe"

SOV_idea_governorate: "Intégration dans la Russie"
SOV_idea_governorate_desc: "Cette entité est en cours d'intégration dans la Russie. Bientôt, elle sera complètement absorbée."

SOV_jirik_loyal_party_support_idea: "Politique interne du parti"
SOV_jirik_unloyal_party_idea: "Parti autonome"
SOV_jirik_loyal_party_idea: "Parti loyal"
SOV_jirik_bad_party_idea: "Unis seulement sur le papier"
SOV_jirik_cult_idea: "Russie militariste"
SOV_jirik_crusade_idea: "La croisade vers Jérusalem"
SOV_jirik_crusade_europe_idea: "La croisade vers l'Europe"
SOV_kgb_jirik: "KGB"
SOV_jirik_conts_reform_idea: "Réforme constitutionnelle"
SOV_jirik_new_conts_monarchy_idea: "La monarchie constitutionnelle de Russie"
SOV_jirik_new_romanov_monarchy_idea: "La nouvelle monarchie Romanov"
SOV_jirik_police_state_reform_idea: "Ministères de l'Intérieur réformés"

