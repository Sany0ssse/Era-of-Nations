SOV_azod_phosagro_idea: "Engrais chimiques PhosAgro"
SOV_azod_phosagro_idea_desc: "PhosAgro est une holding chimique russe produisant des engrais, des phosphates et des phosphates alimentaires. L'entreprise est basée à Moscou, en Russie, et ses filiales incluent Apatit, une entreprise située dans la région de Mourmansk et spécialisée dans l'extraction de roche apatite. L'entreprise est le plus grand producteur européen d'engrais à base de phosphate."
SOV_azod_phosagro_income: "Engrais PhosAgro"
SOV_azod_phosagro_income_desc: "PhosAgro vend avec succès ses produits dans de nombreux pays du monde et génère un revenu important pour notre pays grâce à ces ventes."
