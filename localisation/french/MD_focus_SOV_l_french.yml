sov_vybory.2.t: "Poutine élu président"
sov_vybory.2.d: "Vladimir Poutine a remporté le premier tour de l'élection présidentielle avec 63,75 % des voix, avec 99 % des bulletins dépouillés. L'opposition a remis en question la légitimité des résultats, menaçant de répondre par des manifestations de masse. Selon les dernières données de la Commission électorale centrale, 65,3 % des électeurs éligibles ont participé à l'élection."
sov_vybory.2.a: "Leader à nouveau ici !"

sov_vybory.1.t: "Medvedev élu président"
sov_vybory.1.d: "Dmitri Medvedev, premier vice-premier ministre, a remporté une victoire décisive et attendue à l'élection présidentielle, succédant à Vladimir Poutine. Bien que Medvedev promette un virage vers une politique libérale, beaucoup pensent que le pouvoir reste fermement entre les mains de Poutine."
sov_vybory.1.a: "Voyons comment il s'en sort !"

russia_med.1.t: "La militsiya renommée en politsiya"
russia_med.1.d: "Le président Dmitri Medvedev a signé la loi sur la police, marquant une réforme clé du système des forces de l'ordre. La réforme change le nom 'Militsiya' en 'Politsiya' et vise à réduire les chevauchements bureaucratiques tout en renforçant le partenariat entre la police et la société civile. Elle redéfinit également les devoirs, droits et responsabilités des officiers de police."
russia_med.1.a: "Ça change tout."

russia_med.2.t: "Poutine se rend à Pikalyovo"
russia_med.2.d: "Au milieu d'une profonde crise financière, deux des trois usines industrielles clés de la ville de Pikalyovo ont été fermées, laissant les travailleurs sans emploi et désespérés. Des manifestations de masse ont éclaté, incitant l'intervention du gouvernement. Poutine s'est personnellement rendu dans la ville, a convoqué les oligarques impliqués et a exigé la réouverture des usines, démontrant ainsi son autorité sur l'élite économique russe."
russia_med.2.a: "Rendez-moi mon stylo !" #Авторучку мне верните, пожалуйста

rusboloto.1.t: "Manifestations à Moscou !"
rusboloto.1.d: "Frustrés par un nouvel échange de pouvoir politique, des manifestations massives ont éclaté à Moscou. Les estimations varient de 25 000 à 150 000 personnes. Des manifestations pour des élections justes ont eu lieu dans 99 villes russes et 45 villes à l'étranger. La programmation soudaine d'un examen scolaire par le Département de l'éducation de Moscou n'a fait qu'aggraver la colère publique. Les manifestants, munis de pancartes artisanales, exigent des élections justes et transparentes."
rusboloto.1.a: "Écrasez-les avec les forces de l'ordre !"
rusboloto.1.b: "S'ils le veulent ainsi..."

rusboloto.2.t: "Manifestations accrues à Moscou !"
rusboloto.2.d: "Malgré la résistance policière, les manifestants continuent de se rassembler sur la place Bolotnaya. Des rapports indiquent que plusieurs officiers ont été blessés par des bouteilles et des cocktails Molotov lancés par la foule. La police a répondu en arrêtant des opposants, mais s'est abstenue d'utiliser du gaz. Des organisateurs comme Navalny et Udaltsov font maintenant l'objet d'une enquête en vertu des lois sur l'incitation à l'émeute et la violence contre les forces de l'ordre."
rusboloto.2.a: "Écrasez-les avec les forces de l'ordre (encore) !"
rusboloto.2.b: "D'accord."

rusboloto.3.t: "Les manifestations ont été gérées par la police"
rusboloto.3.d: "Le mouvement de protestation n'a pas atteint ses objectifs et a été efficacement réprimé par les autorités. La situation est maintenant sous contrôle."
rusboloto.3.a: "Magnifique"

sov_other.2.t: "Les communistes élus en Russie"
sov_other.2.d: "Dans un changement politique majeur, le Parti communiste est revenu au pouvoir en Russie. Promettant de restaurer l'ordre socialiste, ils promeuvent maintenant une transformation idéologique complète. La nouvelle direction affirme être prête à bouleverser complètement l'avenir de la Russie, en faisant revivre le passé."
sov_other.2.a: "Nouvelle URSS ?"

sov_other.3.t: "Comedy Club se moque de notre président"
sov_other.3.d: "Des comédiens de l'émission télévisée arménienne populaire Comedy Club ont récemment plaisanté sur notre président nouvellement élu. Devrions-nous laisser passer cela ou exiger des excuses pour ce manque de respect ?"
sov_other.3.a: "Pas encore."
sov_other.3.b: "Demandez-leur des excuses."

sov_other.6.t: "Grande marche russe"
sov_other.6.d: "Des marches nationalistes massives ont récemment eu lieu à travers la Russie, impliquant des nationalistes, des monarchistes, le clergé orthodoxe et des Rodnovers païens. Des affrontements ont eu lieu avec des minorités ethniques des républiques islamiques. La situation est volatile et pourrait dégénérer en quelque chose de plus dangereux."
sov_other.6.a: "Russes — En avant !"

sov_other.9.t: "La Russie soutient l'Ukraine !"
sov_other.9.d: "Le nouveau gouvernement démocratique de la Russie a lancé une initiative diplomatique pour améliorer les relations avec l'Ukraine. Cela inclut l'intégration culturelle, le soutien aux efforts anti-corruption et des propositions de coopération mutuelle pour construire des institutions démocratiques."
sov_other.9.a: "Frères pour toujours !"
sov_other.9.b: "La vérité est dans la fraternité"

sov_other.10.t: "La Russie nous aide à éradiquer la corruption !"
sov_other.10.d: "Dans le cadre d'un nouvel accord anti-corruption, la Russie a aidé à l'arrestation et à la saisie des actifs d'un oligarque corrompu majeur. Cette coopération a porté un coup significatif à la corruption dans notre pays."
sov_other.10.a: "Merci"

SOV_undo_putin_TT: "Nous commencerons à démanteler le système de gouvernance illégal qui nous a précédés !"
SOV_nati_TT: "Les §Ybataillons nationalistes§! se joindront à nous"

sov_other.11.t: "Exercices militaires russo-OTAN massifs !"
sov_other.11.d: "Suite à son virage vers l'Occident, la Russie a initié des exercices militaires conjoints à grande échelle avec les forces de l'OTAN sur le sol russe. Ces exercices symbolisent une nouvelle ère de coopération et de confiance mutuelle."
sov_other.11.a: "Jadis ennemis, maintenant amis."

sov_other.12.t: "Troupes de l'OTAN en Russie"
sov_other.12.d: "Dans le cadre de son nouvel alignement occidental, la Russie a autorisé le stationnement de forces de l'OTAN sur son territoire pour promouvoir la stabilité régionale et la sécurité partagée."
sov_other.12.a: "Bien.."

SOV_combined_economic_system: "Système économique combiné"
SOV_combined_economic_system_desc: "En forgeant un compromis entre les institutions étatiques et les intérêts oligarchiques, nous créons une solution typiquement russe pour la reprise économique. L'équilibre et le contrôle définiront notre chemin à suivre."

SOV_oligarchic_republic: "République oligarchique"
SOV_oligarchic_republic_desc: "Avec la finalisation des fusions corporatives par les oligarques, une nouvelle ère commence — une Russie dirigée par les oligarques, où le pouvoir privé dicte la politique nationale."

SOV_continue_etatist_rise: "Poursuivre l'essor étatiste"
SOV_continue_etatist_rise_desc: "La Russie ne peut pas se permettre d'être gouvernée par des clans d'oligarques indisciplinés qui exportent nos ressources pour leur profit. Nous avons besoin d'un leadership ferme, et nous sommes prêts à le fournir."

sov_other.13.t: "Proposition russe..."
sov_other.13.d: "Le nouveau gouvernement démocratique de la Russie a proposé un accord linguistique mutuel avec l'Ukraine. Le russe obtiendrait un statut officiel en Ukraine, tandis que la Russie promouvrait l'éducation en langue ukrainienne parmi les Ukrainiens ethniques. Cette initiative vise à favoriser la paix, l'échange culturel et une amitié à long terme entre nos nations."
sov_other.13.a: "Excellente idée !"
sov_other.13.b: "Désolé, non"

sov_other.14.t: "L'Ukraine a accepté notre proposition !"
sov_other.14.d: "L'Ukraine a accepté notre proposition d'intégration linguistique mutuelle. Une nouvelle ère de coopération a commencé."
sov_other.14.a: "Magnifique"

sov_other.15.t: "L'Ukraine a rejeté notre proposition !"
sov_other.15.d: "L'Ukraine a rejeté notre offre d'intégration linguistique mutuelle et de coopération."
sov_other.15.a: "Pourquoi ?"

SOV_nemtsov: "Boris Nemtsov"
SOV_nemtsov_desc: "Boris Efimovitch Nemtsov (9 octobre 1959 – 27 février 2015) est un physicien russe, politicien libéral et critique virulent de Vladimir Poutine. Il a joué un rôle clé dans la mise en place des réformes économiques pendant la transition de l'ère soviétique et a occupé des postes de haut rang sous le président Eltsine, notamment gouverneur de Nijni Novgorod, ministre du Carburant et de l'Énergie, et vice-premier ministre. Nemtsov a ensuite fondé le mouvement Jeune Russie, co-fondé Cause Droite et a contribué à créer l'Union des Forces de Droite, un bloc politique réformiste libéral. Son héritage reste un symbole de la résistance démocratique dans l'histoire russe moderne."
SOV_union_of_right_forces: "Union des Forces de Droite"
SOV_union_of_right_forces_desc: "Nous serons désormais à la barre du pouvoir. L'Union des Forces de Droite vise à orienter la Russie vers des valeurs démocratiques et le libéralisme de marché. Avec des réformistes expérimentés et un programme clair, nous travaillerons à moderniser le pays de l'intérieur."
SOV_conservative_russia: "Russie conservatrice"
SOV_conservative_russia_desc: "Les changements mondiaux ont presque détruit la Russie à nouveau, il est temps de revenir à des réformes pacifiques. Un cours conservateur aidera à préserver les valeurs traditionnelles, à rétablir l'ordre et à stabiliser notre nation en ces temps incertains."
SOV_tsar_boris: "Tsar Boris"
SOV_tsar_boris_desc: "Des décennies sous le régime soviétique ont privé notre peuple d'équilibre spirituel et ont égaré la Russie. Seule une monarchie, même symbolique, peut ramener notre nation sur le droit chemin. Une monarchie restaurée servira de force culturelle unificatrice dans une société fracturée."
SOV_reform_constitution: "Réforme constitutionnelle"
SOV_reform_constitution_desc: "Notre constitution doit être réformée en vue du retour de la monarchie, bien que très limitée. Ces changements consacreront le rôle cérémoniel de la monarchie tout en préservant les institutions démocratiques et l'État de droit."
SOV_curb_corruption: "Lutte contre la corruption"
SOV_curb_corruption_desc: "Les fonctionnaires corrompus sont les ennemis de la Russie. Les éliminer est essentiel pour instaurer la confiance dans le gouvernement et attirer les investissements. Cet effort nécessitera des réformes radicales et une volonté politique ferme."
SOV_economical_liberalism: "Libéralisme économique"
SOV_economical_liberalism_desc: "Les marchés libres sont la clé pour sortir la Russie de la pauvreté. Nous devons retirer le gouvernement du secteur privé et laisser les entreprises opérer de manière indépendante. Réduire la bureaucratie et encourager l'entrepreneuriat libérera le véritable potentiel économique du pays."
SOV_affirm_orthodoxy: "L'Église est notre amie"
SOV_affirm_orthodoxy_desc: "Les années d'athéisme d'État sous l'Union soviétique nous ont éloignés de Dieu. En redonnant vie à nos églises et en restituant les propriétés prises au clergé, nous commencerons la guérison spirituelle de notre nation. L'Église orthodoxe servira de fondation morale dans notre renaissance nationale."
SOV_russian_history_patr: "Respecter l'histoire de la Russie"
SOV_russian_history_patr_desc: "Il est impossible de suivre le modèle soviétique de dénigrement de notre passé impérial. Nous devons honorer toute l'étendue de l'histoire russe — des tsars à l'ère moderne. Un avenir fort dépend de la compréhension et du respect de notre héritage."
SOV_joint_us_ventures: "Partenariat avec les États-Unis"
SOV_joint_us_ventures_desc: "Nous autoriserons les États-Unis à établir des bases militaires sur notre territoire et soutiendrons des entreprises économiques conjointes. Cela renforcera les liens diplomatiques, modernisera notre économie et augmentera notre influence sur la scène mondiale."
SOV_iron_guard_militarism: "La Garde de Fer"
SOV_iron_guard_militarism_desc: "Nous créerons une unité spéciale — La Garde de Fer. Ils serviront d'élite royale, responsables de la protection de la monarchie, de l'exécution de missions sensibles et de mener de front. Leur loyauté et leur formation en feront un symbole de la nouvelle ère."
SOV_laying_the_bricks: "Construire un grand pays brique par brique"
SOV_laying_the_bricks_desc: "Chaque pas que nous faisons, comme une brique dans la construction d'une maison, nous rapproche de la construction d'une grande Russie. Le progrès viendra progressivement, par la patience, la vision et le travail acharné. C'est la fondation de notre renaissance nationale."
SOV_navalny: "Alexeï Navalny"
SOV_navalny_desc: "Alexeï Anatolievitch Navalny (né le 4 juin 1976) est un leader de l'opposition russe, avocat et militant anti-corruption. Il a organisé de nombreuses manifestations et a défié le contrôle de Vladimir Poutine sur le pouvoir. En tant que leader du parti Russie de l'Avenir et fondateur de la Fondation Anti-Corruption, Navalny est reconnu internationalement pour ses efforts en faveur des droits humains. Il a été déclaré prisonnier de conscience par Amnesty International et a reçu le prix Sakharov pour la liberté de pensée. Sa qualification du parti Russie Unie comme 'parti de voleurs et d'escrocs' est devenue un cri de ralliement pour les réformistes."
SOV_path_of_western: "Voie de l'occidentalisme"
SOV_path_of_western_desc: "La Guerre froide est terminée. Le nationalisme et le communisme appartiennent à notre passé. La seule voie à suivre est la démocratie, vers la fin de l'histoire. Adopter les valeurs et institutions occidentales garantira la place de la Russie dans le monde moderne."
SOV_like_usa_weapon: "Accès libre aux armes"
SOV_like_usa_weapon_desc: "Vive la liberté des armes ! Nous établirons des politiques permettant aux citoyens d'exercer leur droit de porter des armes, inspirées du modèle américain. Cela renforcera l'autonomie des individus et l'idée de liberté."
SOV_our_own_section_230: "Notre Section 230"
SOV_our_own_section_230_desc: "Nous appliquerons la pratique de la Section 230 dans notre législation. En protégeant les plateformes en ligne de la responsabilité pour le contenu généré par les utilisateurs, nous encourageons un internet plus libre et ouvert. L'innovation prospère lorsque la parole est protégée."
SOV_liberal_loyalty_idea: "Loyauté libérale"
SOV_karabakh_question: "Résoudre la question de l'Artsakh"
SOV_karabakh_question_desc: "Il est temps de s'en occuper. Le conflit de l'Artsakh reste une source d'instabilité dans la région. La Russie doit adopter une position claire et de principe pour instaurer une paix durable."
SOV_georgia_question: "La question géorgienne"
SOV_georgia_question_desc: "Il est temps de s'en occuper. Les relations avec la Géorgie sont tendues, et les problèmes territoriaux non résolus persistent. Une stratégie à long terme doit être développée pour résoudre le conflit et stabiliser le Caucase."
sov_other.17.t: "La Russie soutient l'Arménie !"
sov_other.17.d: "La Russie a récemment déclaré un soutien ouvert à l'Arménie et à ses efforts pour récupérer les territoires perdus. Ce mouvement marque un changement dans notre politique régionale et pourrait modifier considérablement l'équilibre des forces dans le Caucase."
sov_other.17.a: "Intéressant"
sov_other.18.t: "La Russie décide de maintenir le statu quo"
sov_other.18.d: "La Russie a décidé de ne pas soutenir ouvertement les revendications territoriales de l'Arménie. Pour l'instant, le gouvernement a choisi une approche plus prudente et neutre pour éviter une escalade supplémentaire dans la région."
sov_other.18.a: "Intéressant"

SOV_malorossia_flag: "Le projet Malorossia a été financé"
SOV_vitebsk_flag: "Le projet Vitebsk a été financé"
SOV_first_bars_flag: "La première vague de BARS est entraînée"
SOV_second_bars_flag: "La deuxième vague de BARS est entraînée"
SOV_third_bars_flag: "La troisième vague de BARS est entraînée"
SOV_wagner_rebeliion_flag: "Les SMP Wagner ont organisé une mutinerie"
SOV_union_annex_belarus: "L'État d'Union a été créé"
SOV_romanov_empire: "Saint Empire Romanov"
SOV_hyper_empire: "Troisième Rome"
demsov_supp_arm: "Nous avons soutenu l'Arménie"
demsov_supp_aze: "Nous avons soutenu l'Azerbaïdjan"
sov_furgal.1.t: "L'affaire Sergueï Furgal"
sov_furgal.1.d: "Dans la région de Khabarovsk en Russie, le gouverneur du parti nationaliste LDPR se présente comme un 'homme saint'. Il destitue les officiels qui nous sont loyaux, lutte agressivement contre la corruption, réduit les salaires et licencie de nombreux bureaucrates. D'un côté, nous pouvons le féliciter comme un exemple d'intégrité. D'un autre côté, il interfère trop avec les intérêts commerciaux des oligarques qui nous sont loyaux et renforce les idées nationalistes et démocratiques. Comment devons-nous gérer cette situation ?"
sov_furgal.1.a: "Il a perdu ma confiance. Fabriquez une affaire criminelle contre lui."
sov_furgal.1.b: "Soutenons ce comportement !"

sov_furgal.2.t: "Furgal est emprisonné !"
sov_furgal.2.d: "Furgal a été condamné et emprisonné. La capitale régionale a été déplacée de Khabarovsk à Vladivostok. Cependant, les habitants de Khabarovsk protestent contre l'arrestation de Furgal, demandant la destitution de notre leader suprême et sa libération. Contrairement aux manifestants libéraux, les partisans de Furgal brandissent des drapeaux de Khabarovsk. Que ferons-nous ?"
sov_furgal.2.a: "Écrasez les manifestations !"

sov_girkin.1.t: "Capture de Slavyansk !"
sov_girkin.1.d: "Au début, le conflit dans le Donbass n'était pas violent. Bien que la République populaire de Donetsk ait été proclamée et que l'activiste pro-Euromaïdan Dmitri Tcherniavski ait été tué, les séparatistes manquaient de réel pouvoir. La police et les forces de sécurité hésitaient, et le soutien local était minime. La plupart des gens ne participaient qu'à des rassemblements pacifiques, tandis que l'administration régionale saisie était occupée par un mélange d'extrémistes, de criminels et d'activistes russes des zones frontalières. Seuls quelques leaders de la RPD comme Alexandre Khryakov et Andreï Purgin étaient connus. La plupart pensaient que les séparatistes se disperseraient rapidement. Mais la situation a escaladé de manière inattendue à Slavyansk, une ville de 120 000 habitants dans le nord de Donetsk. Un groupe de 52 hommes armés a saisi le poste de police de la ville avec peu de résistance. Ils ont utilisé des explosifs et un véhicule pour pénétrer dans le bâtiment, marquant un tournant dans le conflit."
sov_girkin.1.a: "Intéressant"

SOV_support_nov_idea: "Soutien russe"
SOV_supportlnrdnr_rus: "Soutenir la RPL et la RPD"
SOV_supportlnrdnr_rus_desc: "Il est temps de soutenir les républiques du Donbass et de renforcer notre influence là-bas."
SOV_peacekeeping_in_artsakh: "Maintien de la paix en Artsakh"
SOV_peacekeeping_in_artsakh_desc: "En tant que puissance dominante dans l'espace post-soviétique, nous devons maintenir notre statut en résolvant le conflit de l'Artsakh de manière responsable et assertive."
SOV_friend_assad: "Assad ne doit PAS partir"
SOV_friend_assad_desc: "La Syrie est un allié vital pour nous. Nous devons garantir que le régime d'Assad reste stable pour protéger nos intérêts dans la région."
rec_nov_TT: "Nous reconnaîtrons [NOV.GetFlag]§YDonbass§! comme indépendant et préparerons une §Rinvasion§!"
annex_nov_TT: "Nous §Rannexerons§! [NOV.GetFlag]§YRépubliques du Donbass§! en organisant des référendums là-bas"
gazprom_pmc_TT: "§2Gazprom§! formera des §Ybataillons de SMP§! à envoyer en §Rguerre§!"
SOV_malorussia_lib_army_tt: "Un bataillon de l'£text_icon_moa §YArmée de libération de Malorossiya§! sera formé"
SOV_trade_with_kazakhstan: "Commerce avec le Kazakhstan"
SOV_trade_with_kazakhstan_desc: "Le Kazakhstan a toujours été l'un de nos amis les plus proches en Asie centrale. Élargir le commerce entre nos pays bénéficiera aux deux économies et renforcera notre influence régionale."
SOV_trade_with_azerbaijan: "Commerce avec l'Azerbaïdjan"
SOV_trade_with_azerbaijan_desc: "L'Azerbaïdjan est un partenaire prometteur. Augmenter le commerce avec eux aidera à élargir notre présence dans le Caucase et à renforcer les liens économiques."
SOV_trade_with_tajikistan: "Commerce avec le Tadjikistan"
SOV_trade_with_tajikistan_desc: "Le Tadjikistan est depuis longtemps un partenaire fiable. Renforcer les relations commerciales créera des opportunités rentables et consolidera notre alliance."
SOV_trade_with_kyrgyzstan: "Commerce avec le Kirghizistan"
SOV_trade_with_kyrgyzstan_desc: "Le Kirghizistan est un allié clé en Asie centrale. Élargir le commerce avec eux renforcera notre partenariat et soutiendra une croissance mutuelle."
SOV_trade_with_armenia: "Commerce avec l'Arménie"
SOV_trade_with_armenia_desc: "Les Arméniens sont nos frères dans le Caucase. Commercer davantage avec l'Arménie bénéficiera aux deux économies et approfondira notre coopération régionale."
SOV_trade_with_uzbekistan: "Commerce avec l'Ouzbékistan"
SOV_trade_with_uzbekistan_desc: "L'Ouzbékistan représente un marché vaste et en croissance. Stimuler le commerce avec eux donnera un coup de pouce significatif à notre économie."
SOV_indian_partnership: "Partenariat indien"
SOV_indian_partnership_desc: "L'Inde est un vaste marché en développement qui a besoin de nos biens, tandis que nous pouvons bénéficier de l'accès à leurs marchés. Élargir les relations commerciales avec l'Inde est une démarche intelligente pour les deux parties."

sov_other.19.t: "Proposition de paix russe !"
sov_other.19.d: "La Russie propose un traité de paix nous permettant de prendre Hadrut et Karvachar tout en laissant Stepanakert aux Arméniens. Des forces de maintien de la paix russes seraient déployées à Stepanakert. Rejeter cette offre irait à l'encontre des intérêts politiques de la Russie."
sov_other.19.a: "Bien sûr."
sov_other.19.b: "Nous nous battrons jusqu'au bout !"

sov_other.20.t: "Proposition russe."
sov_other.20.d: "La Russie propose d'aider à réguler le conflit du Haut-Karabagh en envoyant des forces de maintien de la paix, mais exige que nous cédions certains territoires en retour."
sov_other.20.a: "Non, nous sommes bien."
sov_other.20.b: "Oui, envoyez de l'aide, s'il vous plaît."

sov_other.21.t: "L'Arménie refuse."
sov_other.21.d: "L'Arménie estime qu'elle peut gérer le conflit de manière indépendante et a décliné l'assistance russe."
sov_other.21.a: "Eh bien..."

sov_other.22.t: "La Russie propose d'acheter notre artillerie"
sov_other.22.d: "La Russie a fait une offre lucrative pour acheter une grande quantité de nos systèmes d'artillerie. Les fonds fourniront un coup de pouce significatif à notre économie."
sov_other.22.a: "C'est une excellente offre !"
sov_other.22.b: "Nous refusons."

sov_other.23.t: "Accord avec la Corée du Nord."
sov_other.23.d: "La Corée du Nord a accepté de nous fournir une grande quantité de systèmes d'artillerie, renforçant nos capacités militaires."
sov_other.23.a: "C'est une excellente offre !"

sov_other.24.t: "Accord avec la Corée du Nord"
sov_other.24.d: "La Corée du Nord a refusé notre proposition de fournir de l'artillerie. Malheureusement, c'est une autre déception."
sov_other.24.a: "Dommage."

sov_other.25.t: "Accord avec la Corée du Nord"
sov_other.25.d: "La Russie a conclu un accord avec la Corée du Nord pour acheter des systèmes d'artillerie, dont certains nous ont été attribués."
sov_other.25.a: "Bien."

SOV_union_luka: "Loukachenko est le Premier ministre"
SOV_union_luka_desc: "Bien que l'État d'Union ait été établi, les talents d'Alexandre Grigoryevitch ne doivent pas être gaspillés. L'approuver comme Premier ministre de l'État d'Union est un choix judicieux."

SOV_unite_with_nkpr: "Accord avec la Corée du Nord"
SOV_unite_with_nkpr_desc: "Nous proposerons à la Corée du Nord un accord pour acheter une grande quantité de leur artillerie afin de reconstituer nos réserves."

sov_other.26.t: "Attentat terroriste de Doubrovka"
sov_other.26.d: "L'attentat terroriste de Doubrovka était une crise d'otages à Moscou qui a duré trois jours. Un groupe de 40 militants tchétchènes armés, dirigés par Movsar Barayev, a pris 916 otages pendant une représentation de la comédie musicale Nord-Ost au Centre théâtral. Le FSB et les forces spéciales ont finalement mis fin au siège, tuant tous les terroristes et sauvant la plupart des otages. Officiellement, 130 otages sont morts pendant la crise."
sov_other.26.a: "Ils répondront de leurs actes"

sov_other.32.t: "Référendum sur le statut de notre république"
sov_other.32.d: "Les réformes constitutionnelles en Russie nous permettent de choisir un nouveau statut — rester une partie de la Russie ou déclarer l'indépendance. Sommes-nous prêts à prendre cette décision ?"
sov_other.32.a: "Nous resterons une partie de la Russie."
sov_other.32.b: "Nous soutenons l'indépendance."

sov_other.33.t: "Ils restent avec nous"
sov_other.33.d: "[FROM.GetNameWithFlag] a décidé de rester une partie de la Russie."
sov_other.33.a: "Hourra !"

sov_other.34.t: "Une autre république nous a quittés"
sov_other.34.d: "[FROM.GetNameWithFlag] a décidé de quitter notre pays. Nous respectons leur décision."
sov_other.34.a: "Dommage"

sov_other.35.t: "Un ancien général demande à parler à la Douma d'État"
sov_other.35.d: "Un ancien général des forces spatiales désormais dissoutes demande à prendre la parole lors de la prochaine session de la Douma d'État. Il est rapporté qu'il tient des idées délirantes et potentiellement schizophréniques, qu'il a l'intention de promouvoir."
sov_other.35.a: "Nous le laisserons parler quand même."
sov_other.35.b: "Ignorez-le"

sov_other.36.t: "Les idées du général à la retraite gagnent en popularité"
sov_other.36.d: "Les idées controversées du général Petrov gagnent un soutien sans précédent, en particulier dans les cercles militaires. Cette tendance est profondément préoccupante pour notre stabilité."
sov_other.36.a: "Ne rien faire."
sov_other.36.b: "Arrêter le général et ses fidèles partisans"

sov_other.37.t: "Le général organise un coup d'État !"
sov_other.37.d: "Comment avons-nous manqué cela ? Le général Petrov a lancé un coup d'État militaire et renversé le gouvernement. Il est entré au Kremlin sans opposition."
sov_other.37.a: "C'est désastreux"

sov_other.38.t: "Le nouveau chef de la Banque centrale"
sov_other.38.d: "Nous sommes prêts à nommer Elvira Nabiullina comme nouveau chef de la Banque centrale. Ayant prouvé ses compétences en tant que ministre de l'Économie, son leadership devrait avoir un impact positif sur notre économie."
sov_other.38.a: "Félicitez-les"

sov_other.39.t: ""
sov_other.39.d: ""
sov_other.39.a: ""

SOV_z_propaganda: "Propagande Z"
SOV_z_propaganda1: "Propagande Z"

sov_final_strike.1.t: "Déclaration d'opération militaire"
sov_final_strike.1.d: "Ce matin tôt, notre président a annoncé le début d'une opération spéciale en Ukraine visant à la dénazification et à la démilitarisation. Une invasion à grande échelle est imminente, marquant une escalade sérieuse du conflit."
sov_final_strike.1.a: "Cela va avoir de graves conséquences"

russia_news.11.t: "La Russie déclare une opération militaire !"
russia_news.11.d: "Aujourd'hui, le président russe a annoncé une opération militaire en Ukraine. Les objectifs déclarés sont une dénazification et une démilitarisation complètes. Le ministère russe de la Défense affirme que l'opération ne cible que les installations militaires, mais les dirigeants occidentaux ont déjà promis leur soutien à Kiev."
russia_news.11.o1: "En avant !"
russia_news.11.o2: "Nous soutiendrons la Russie !"
russia_news.11.o3: "Nous soutiendrons l'Ukraine !"
russia_news.11.o4: "Maudits Russes."
russia_news.11.o5: "Une autre guerre sur les ruines de l'Union."

russia_news.12.t: ""
russia_news.12.d: ""
russia_news.12.o1: ""
russia_news.12.o2: ""
russia_news.12.o3: ""
russia_news.12.o4: ""
russia_news.12.o5: ""

russia_news.13.t: "La Russie déclare une opération militaire !"
russia_news.13.d: "Ce matin, le président russe a déclaré une opération militaire en Ukraine avec pour objectifs la dénazification et la démilitarisation. Le ministère de la Défense insiste sur le fait que seuls les objectifs militaires sont visés, mais les dirigeants occidentaux ont promis leur soutien à Kiev."
russia_news.13.o1: "En avant !"
russia_news.13.o2: "Nous soutiendrons la Russie !"
russia_news.13.o3: "Nous soutiendrons la Finlande !"
russia_news.13.o4: "Maudits Russes."
russia_news.13.o5: "Une autre guerre sur les ruines de l'Empire russe."

sov_final_strike.2.t: "L'armée n'a pas atteint ses principaux objectifs"
sov_final_strike.2.d: "L'opération en cours n'a pas atteint ses objectifs, en grande partie à cause de la corruption généralisée au sein de nos forces de défense. Cet échec révèle l'état réel de nos capacités militaires."
sov_final_strike.2.a: "Préparez-vous pour une longue guerre."

SOV_slow_advance_idea: "Armée non préparée"

sov_final_strike.3.t: "L'armée a réussi à atteindre ses principaux objectifs"
sov_final_strike.3.d: "L'opération en cours progresse bien, démontrant la haute qualité de notre armée, grâce aux récentes réformes et à une campagne anti-corruption réussie."
sov_final_strike.3.a: "Excellent."

sov_final_strike.4.t: "Sanctions contre la Russie"
sov_final_strike.4.d: "Le conflit en Ukraine doit cesser. Nous pouvons tenter de paralyser la Russie par des sanctions économiques, mais cela pourrait également nuire à notre propre économie. Devons-nous nous préparer à une guerre des sanctions à grande échelle ?"
sov_final_strike.4.a: "Imposer des sanctions industrielles."
sov_final_strike.4.b: "Imposer des sanctions commerciales."

sov_final_strike.5.t: "[FROM.GetName] impose des sanctions contre nous !"
sov_final_strike.5.d: "[FROM.GetName] a imposé des sanctions contre nous pour soutenir l'Ukraine. Ces mesures pourraient gravement nuire à notre économie."
sov_final_strike.5.a: "Maudissez-les."

sov_final_strike.6.t: "La Russie nous propose de participer à une OMS en Ukraine !"
sov_final_strike.6.d: "Lors d'une rencontre personnelle, le président russe nous a invités à rejoindre l'opération militaire spéciale en Ukraine. Nous devons examiner cette offre avec soin, car entrer en guerre aura des conséquences durables."
sov_final_strike.6.a: "Nous aiderons nos frères !"
sov_final_strike.6.b: "Je ne pense pas que nous devrions nous impliquer."

sov_final_strike.7.t: "Krach financier après les sanctions"
sov_final_strike.7.d: "Les sanctions occidentales ont déclenché une panique financière grave parmi notre population, causant un déséquilibre dangereux dans l'offre et la demande de roubles. L'effondrement de notre Fonds national de bien-être, qui aurait pu atténuer cette crise, aggrave la situation. Nous faisons maintenant face à un effondrement financier imminent."
sov_final_strike.7.a: "Que Dieu nous aide..."

SOV_western_sanctions_modifier: "Sanctions occidentales"
SOV_western_sanctions_modifier_desc: "Nos actions agressives ont conduit les nations occidentales et leurs alliés à imposer des sanctions sévères contre nous. C'est un avertissement sérieux, et nous devons nous préparer à des menaces plus importantes de leur part."

SOV_ruble_collapse: "Effondrement financier"
SOV_ruble_collapse_1: "Ralentissement économique"
SOV_ruble_collapse_2: "Stagnation"

SOV_sanction_backfire_idea_moderate: "Dommages légers des sanctions"
SOV_sanction_backfire_idea_harsh: "Dommages modérés des sanctions"
SOV_sanction_backfire_idea_ultimate: "Dommages sévères des sanctions"

SOV_sanctions_warning_TT: "§YCette décision§! aura des conséquences économiques §Rsérieuses§!."
SOV_sanctions_eras_TT: "L'impact des sanctions sera §Gréduit§! pour nous."

SOV_western_sanctions: "Sanctions imposées contre nous"
SOV_western_sanctions_desc: "Sous les sanctions occidentales"

SOV_russian_resistance_economy: "Économie de résistance russe"
SOV_russian_resistance_economy_desc: "Face à une guerre économique sévère de l'Occident, notre seule option est de construire une économie résiliente et autosuffisante — une véritable économie de résistance."

SOV_fnb_destroyed: "Détruire le Fonds national de bien-être"
SOV_fnb_destroyed_desc: "Les ressources du Fonds national de bien-être sont cruciales pour atténuer les effets des sanctions."

SOV_prevent_panic_on_currency_exchange: "Arrêter la panique sur les marchés boursiers"
SOV_prevent_panic_on_currency_exchange_desc: "Les marchés boursiers, à terme et obligataires ont déclenché une panique publique. Les gens se précipitent pour retirer des devises étrangères de leurs comptes. Cela doit être arrêté."

SOV_stop_moex_sessions: "Fermer temporairement la Bourse de Moscou"
SOV_stop_moex_sessions_desc: "Fermer temporairement les marchés aidera à les calmer après les récents troubles."

SOV_prevent_ruble_collapse: "Sauver le rouble de l'effondrement"
SOV_prevent_ruble_collapse_desc: "Il est essentiel de contrôler le taux de change du rouble pour éviter son effondrement."

SOV_stabilized_finances: "Stabiliser l'économie"
SOV_stabilized_finances_desc: "Nous avons surmonté la pire période de panique. Il est maintenant temps de stabiliser lentement l'économie."

SOV_expansion_of_importozamesheniye: "Établir la substitution des importations"
SOV_expansion_of_importozamesheniye_desc: "Il est temps de développer les industries nationales et de réduire notre dépendance aux importations."

SOV_add_liquidity: "Injecter des liquidités dans l'économie"
SOV_add_liquidity_desc: "Notre économie a un besoin urgent d'une injection de liquidités pour continuer à fonctionner."

SOV_consumer_goods_replacement: "Marques nationales"
SOV_consumer_goods_replacement_desc: "Nous n'avons pas besoin de produits étrangers — nous avons nos propres marques nationales de qualité."

SOV_the_turn_to_the_east: "Virage vers l'Est"
SOV_the_turn_to_the_east_desc: "L'Occident s'est révélé être un partenaire non fiable. Il est temps de réorienter notre attention vers l'Est."

SOV_creation_of_sovereign_economy: "Économie souveraine"
SOV_creation_of_sovereign_economy_desc: "Notre nation construira une économie souveraine et indépendante, libre de toute influence étrangère."

SOV_back_to_growth: "Retour à la croissance"
SOV_back_to_growth_desc: "Rien ne peut nous arrêter longtemps ; tout revers ne fera que nous ralentir temporairement."

SOV_help_prigoba: "Envoyer du matériel au Sahel"
SOV_help_prigoba_desc: "Notre État proxy dans la région du Sahel a besoin d'un soutien militaire urgent."

russia_leave_every_faction_tt: "[SOV.GetNameWithFlag] quittera sa faction.\n"

