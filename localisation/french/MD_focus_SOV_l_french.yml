 start_talks_with_don: "Lancer les pourparlers d'unification avec [DON.GetNamewithFlag]"
 start_talks_with_csb: "Lancer les pourparlers d'unification avec [CSB.GetNamewithFlag]"
 start_talks_with_esb: "Lancer les pourparlers d'unification avec [ESB.GetNamewithFlag]"
