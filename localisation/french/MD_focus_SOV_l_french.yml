SOV_putinism_system_protest: "Protestation contre le système de Poutine"

sov_medvedev.4.t: "La Russie propose une réinitialisation des relations"
sov_medvedev.4.d: "Le nouveau gouvernement russe, adoptant une position plus pro-occidentale que le régime de Poutine, a proposé une réinitialisation des relations. Leurs diplomates suggèrent un nouveau départ, une 'relance' pour la coopération."
sov_medvedev.4.a: "Bien sûr ! Les Russes peuvent être de bons amis !"
sov_medvedev.4.b: "Nous ne pouvons pas être amis avec eux."

sov_medvedev.6.t: "Poutine et Medvedev proclament le duumvirat !"
sov_medvedev.6.d: "Dans un mouvement politique surprenant, le président et le premier ministre de la Russie ont annoncé conjointement qu'ils gouverneront ensemble dans un duumvirat officiel. Cet arrangement sans précédent remodèle la structure du pouvoir en Russie."
sov_medvedev.6.a: "Bien"

sov_medvedev.7.t: "Le nouveau régime russe"
sov_medvedev.7.d: "Notre président s'est montré de plus en plus vocal sur les réseaux sociaux, exprimant des vues audacieuses sur l'Occident. Sa rhétorique a radicalement changé, signalant le retour de la Russie sur une voie d'indépendance affirmée."
sov_medvedev.7.a: "Je les déteste, ce sont des salauds et des dégénérés."

sov_medvedev.8.t: "Le virage de la Russie vers l'Occident"
sov_medvedev.8.d: "Une nouvelle politique audacieuse a été annoncée par le président. La Russie considérera désormais l'Occident non comme un ennemi, mais comme un partenaire vital. Notre nation tourne une nouvelle page."
sov_medvedev.8.a: "Que Dieu bénisse l'Amérique !... et la Russie !"

SOV_kob_party_start: "Unité du parti conceptuel"
SOV_kob_party_start_desc: "L'Unité du parti conceptuel, dirigée par notre leader visionnaire, le général Konstantin Petrov, a pris le pouvoir. Il est temps de mener une guerre idéologique contre le Correcteur Prédicteur et de libérer la Russie de ses chaînes cachées."

SOV_kobnod: "Mouvement populaire russe pour le pouvoir de Dieu"

SOV_establish_militar_loyal: "Établir la loyauté militaire"
SOV_establish_militar_loyal_desc: "Le général Petrov doit obtenir une loyauté totale de l'armée. Toutes les branches doivent prêter serment d'allégeance à lui en tant que Glavkoverkh – le commandant suprême de toute la Russie."

SOV_establish_loyalistii: "Loyalisme régional"
SOV_establish_loyalistii_desc: "Nous devons placer des membres dévoués du parti dans les positions de pouvoir régionales pour garantir une loyauté absolue et empêcher toute résistance à notre cheminement."

SOV_regional_control: "Purge de l'oligarchie"
SOV_regional_control_desc: "Les oligarques ont drainé le sang de notre peuple pendant trop longtemps. Maintenant, nous riposterons et débarrasserons le pays de ces élites parasitaires."

SOV_establish_new_religion: "Nouvelle politique religieuse"
SOV_establish_new_religion_desc: "Les religions organisées modernes ont été créées pour asservir les esprits et supprimer la pensée indépendante. Nous devons libérer le peuple de cette servitude mentale."

SOV_internet_propaganda: "Propagande sur Internet"
SOV_internet_propaganda_desc: "Peu comprennent le véritable pouvoir d'Internet. Comme le Correcteur Prédicteur avant nous, nous l'utiliserons pour remodeler la pensée publique et écraser la fausse conscience."

SOV_course_of_truth: "Voie de la vérité"
SOV_course_of_truth_desc: "Pendant trop longtemps, le clergé orthodoxe a caché les vérités profondes au peuple. Maintenant, nous apporterons la lumière sur ces secrets et exposerons la pleine vérité de notre histoire."

SOV_russian_knights: "Vityaz russe"
SOV_russian_knights_desc: "Au cœur de l'esprit russe se trouve l'âme du Vityaz – le noble guerrier. Bien que peu nombreux, ces chevaliers modernes portent l'héritage de la Rus' au combat."

SOV_new_cosmic_warfare: "Nouvelle guerre cosmique"
SOV_new_cosmic_warfare_desc: "Le général Petrov, spécialiste de la guerre spatiale, voit les étoiles comme la prochaine frontière de la Russie. Nous devons restaurer et faire progresser l'héritage du programme spatial soviétique."

SOV_remaking_constitution: "Refonte de la Constitution"
SOV_remaking_constitution_desc: "La Constitution actuelle restreint notre volonté de réformer. Elle doit être entièrement réécrite pour refléter notre vision de l'avenir divin de la Russie."

SOV_iron_hand_of_koba: "Héritage stalinien"
SOV_iron_hand_of_koba_desc: "Staline était l'héritier spirituel des tsars et l'architecte d'une Russie disciplinée et forte. Nous devons raviver son héritage et suivre la voie qu'il a tracée."

SOV_natural_bloshevism: "Bolchevisme naturel"
SOV_natural_bloshevism_desc: "La chute du régime tsariste et l'essor du bolchevisme n'étaient pas des coïncidences – ils étaient l'évolution naturelle de notre nation. Nous devons pleinement embrasser ce destin."

SOV_slavic_reincarnation: "Réincarnation slave"
SOV_slavic_reincarnation_desc: "La véritable renaissance spirituelle réside dans les croyances de nos ancêtres. Toutes les religions étrangères doivent être abolies au profit d'un retour au paganisme slave originel."

SOV_merge_pantheons: "Fusion avec Zvenyashie Kedry"
SOV_merge_pantheons_desc: "En nous unissant à Zvenyashie Kedry, nous pouvons fusionner nos croyances sacrées en une seule foi puissante pour résister aux manipulations des prêtres égyptiens."

SOV_support_nod: "Soutenir le NOD"
SOV_support_nod_desc: "Le mouvement NOD est farouchement anti-occidental. Leur idéologie s'aligne sur la nôtre, et ils devraient être intégrés dans notre administration."

SOV_educational_water: "Eau morte"
SOV_educational_water_desc: "L'Eau morte, une doctrine politico-religieuse inspirée du folklore russe et développée initialement par le Centre sacerdotal secret de l'Union soviétique, cherche à raviver spirituellement le peuple. Elle forme désormais la base idéologique de notre Unité du parti conceptuel."

SOV_search_for_priests: "Recherche des prêtres"
SOV_search_for_priests_desc: "Les prêtres égyptiens ont manipulé le monde depuis l'ombre pendant trop longtemps. Nous devons débusquer leurs agents cachés à l'intérieur de nos frontières."

SOV_purge_westernists: "Purge des occidentalistes"
SOV_purge_westernists_desc: "Les occidentalistes sont les serviteurs aveugles du capitalisme mondial. Leur influence toxique doit être éliminée de notre gouvernement et de notre société."

SOV_revolutions_in_other_slavic_states: "Révolution Bogorodichnaya"
SOV_revolutions_in_other_slavic_states_desc: "Nous devons propager la révolution à travers les terres slaves pour libérer nos frères du contrôle du Correcteur Prédicteur. L'ère de la libération est arrivée."

SOV_seek_for_them_in_israel: "Les chercher en Israël"
SOV_seek_for_them_in_israel_desc: "Selon le général Petrov, les prêtres égyptiens pourraient avoir des agents même en Israël. Nous devons enquêter et exposer leur influence cachée là-bas."

SOV_seek_for_them_in_swiss: "Les chercher en Suisse"
SOV_seek_for_them_in_swiss_desc: "La Suisse est depuis longtemps soupçonnée d'être le quartier général du Correcteur Prédicteur. Nous fouillerons chaque recoin pour découvrir la vérité."

SOV_seek_for_them_in_egypt: "Les chercher en Égypte"
SOV_seek_for_them_in_egypt_desc: "Peut-être que les prêtres égyptiens se sont cachés dans le berceau même de leur pouvoir. Nous devons chercher la vérité dans leur ancienne patrie."

SOV_kill_predictor_corrector: "Tuer le Correcteur Prédicteur !"
SOV_kill_predictor_corrector_desc: "Nous avons découvert l'emplacement du Correcteur Prédicteur. Il est temps de commencer notre sainte croisade – contre le capitalisme, la manipulation et les ennemis de la vérité."

SOV_semibankirshina_desc: "La Semibankirshina, ou 'le groupe des sept banquiers', désigne les oligarques les plus puissants qui exerçaient autrefois une influence énorme sur la politique russe à l'époque d'Eltsine."

SOV_enforce_oligarhic_rule: "Imposer le pouvoir oligarchique"
SOV_enforce_oligarhic_rule_desc: "L'État a opprimé les oligarques trop longtemps tout en faisant peu pour le progrès économique. Il est temps de transférer le pouvoir à ceux qui stimulent vraiment la croissance."

SOV_revive_oligarch_influence: "Raviver l'influence des oligarques"
SOV_revive_oligarch_influence_desc: "Il est temps pour notre cercle d'oligarques de retrouver leur prominence et de reprendre leur influence sur la gouvernance russe."

SOV_bring_the_old_gang_from_abroad: "Ramener l'ancienne bande de l'étranger"
SOV_bring_the_old_gang_from_abroad_desc: "Beaucoup de nos anciens alliés ont été forcés à l'exil. Maintenant que les vents ont tourné, nous pouvons les inviter à revenir et reconstruire notre empire d'influence."

SOV_privatize_state_corporations: "Privatiser les corporations d'État"
SOV_privatize_state_corporations_desc: "L'économie dirigée par l'État sous Poutine était inefficace et gonflée. Nous devons démanteler ces corporations et les rendre aux mains du privé."

SOV_move_oligarchic_entites_back_to_russia: "Rapramener les entités oligarchiques"
SOV_move_oligarchic_entites_back_to_russia_desc: "La richesse russe cachée à l'étranger doit revenir au pays. Avec notre contrôle établi, nous pouvons utiliser ces ressources pour financer à la fois le profit et le progrès."

SOV_exploit_natural_wealth: "Exploiter la richesse naturelle de la Russie"
SOV_exploit_natural_wealth_desc: "La Russie possède d'immenses réserves de ressources naturelles. Nous les exploiterons avec efficacité – en gardant le peuple satisfait et les oligarques riches."

SOV_semi_criminal_government: "Gouvernement semi-criminel"
SOV_semi_criminal_government_desc: "Les oligarques ont des liens de longue date avec le crime organisé. Pourquoi le combattre ? Nous formaliserons cet arrangement et les intégrerons dans le gouvernement."

SOV_end_lawsuits_against_oligarchs: "Mettre fin aux poursuites contre les oligarques"
SOV_end_lawsuits_against_oligarchs_desc: "Poutine a mené une guerre juridique contre les oligarques pour sécuriser son contrôle. Nous mettrons fin à cette injustice et rendrons leur dignité à nos citoyens les plus prospères."

SOV_restore_semibankirshina: "Restaurer la Semibankirshina"
SOV_restore_semibankirshina_desc: "La Semibankirshina – les sept banquiers puissants – est de retour. Avec Poutine hors du chemin, ils se tiennent maintenant unis, prêts à façonner à nouveau le destin de la Russie."

SOV_back_to_the_west: "Retour vers l'Occident"
SOV_back_to_the_west_desc: "Antagoniser l'Occident a dévasté notre économie. Il est temps d'abandonner l'hostilité désuète de la Guerre froide et de favoriser de nouvelles alliances pour la prospérité."

SOV_russian_laissez_faire: "Laissez-faire russe"
SOV_russian_laissez_faire_desc: "Le capitalisme de marché libre revient en Russie. Il est temps pour une entreprise sans restriction et la richesse pour ceux assez audacieux pour la saisir."

SOV_oligarchs_democracy: "Aveuglés par leurs promesses"
SOV_oligarchs_democracy_desc: "La victoire électorale des forces pro-oligarques a choqué beaucoup. Aveuglés par des promesses, le peuple a choisi les mêmes élites qui ont autrefois pillé la nation sous Eltsine."

sov_oligarchs.1.t: "Remaniements gouvernementaux !"
sov_oligarchs.1.d: "Les oligarques étaient autrefois affaiblis, mais ce n'est plus le cas. Dans ses efforts pour obtenir leur soutien, le président leur a accordé une influence sans précédent. Les ministres loyaux aux oligarques prennent le pouvoir – ouvrant une nouvelle ère de domination des élites."
sov_oligarchs.1.a: "Que Dieu sauve la Russie..."

sov_oligarchs.2.t: "Gusinsky retourne en Russie !"
sov_oligarchs.2.d: "Le magnat des médias russes Vladimir Gusinsky, autrefois exilé par les autorités précédentes, est de retour. Les vents ont tourné – et il est accueilli à bras ouverts."
sov_oligarchs.2.a: "Bienvenue de retour !"

sov_oligarchs.3.t: "Berezovsky retourne en Russie !"
sov_oligarchs.3.d: "Boris Berezovsky – l'un des oligarques les plus riches et les plus controversés de Russie – est de retour. On dirait les années 90 à nouveau."
sov_oligarchs.3.a: "Comme dans les années 90 !"

sov_oligarchs.4.t: "La Semibankirshina prend le pouvoir en Russie !"
sov_oligarchs.4.d: "L'influence oligarchique a atteint son apogée. Les sept magnats de l'ère Eltsine ont écrasé tous leurs rivaux et saisi le pouvoir. L'avenir du gouvernement russe repose désormais entre leurs mains – mais la question demeure : qui dirigera ?"
sov_oligarchs.4.a: "Règle directe du Conseil !"
sov_oligarchs.4.b: "Nous organiserons de nouvelles élections avec un autre candidat."
sov_oligarchs.4.c: "Nous pourrions manipuler le président actuel."

sov_oligarchs.5.t: "Élections truquées !"
sov_oligarchs.5.d: "Pour légitimer notre règle, nous devons organiser de nouvelles élections et assurer la victoire du parti Russie Libérale. Le seul dilemme est de choisir un candidat présidentiel : une marionnette, ou l'un des nôtres ?"
sov_oligarchs.5.a: "Nevzorov est notre candidat !"
sov_oligarchs.5.b: "Boris Berezovsky sera le président."
sov_oligarchs.5.c: "Mikhail Khodorkovsky sera le président."

