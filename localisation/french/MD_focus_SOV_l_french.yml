## Chechen Referendum Events
russia.29.t: "Référendum sur la constitution de la République tchétchène"
russia.29.d: "Suite à la fin d'un conflit brutal et sanglant, la Tchétchénie a maintenant l'opportunité de retourner à une vie pacifique. La question suivante concerne la structure de ses relations avec Moscou — restera-t-elle pleinement intégrée en tant que sujet fédéral, ou conservera-t-elle certaines autonomies ?"
russia.29.o1: "Un peu d'autonomie ne leur fera pas de mal."
russia.29.o2: "Je suis prêt à gouverner personnellement la Tchétchénie."

