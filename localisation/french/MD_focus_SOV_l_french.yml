##Transnistria
SOV_annex12: "Le point d'appui sur le Dniestr"
SOV_annex13: "Rendre les régions sécessionnistes"
russia.43.t: "La Russie nous offre sa protection"
russia.43.d: "Récemment, notre peuple a réalisé que sans la protection d'un pays fort, notre pays sera détruit par des adversaires plus puissants. Par conséquent, nous devons sécuriser notre nation et notre peuple en devenant une partie de la Russie."
russia.43.a: "Il est temps de sécuriser notre nation"

SOV_Civil_nationalism: "Nationalisme civique"
SOV_Civil_nationalism_desc: "La nation doit passer en premier. Nous prioriserons les intérêts nationaux avant tout, unissant la société autour d'une identité partagée et d'un objectif commun."

SOV_embrace_the_legacy_of_the_USSR: "Adopter l'héritage de l'URSS"
SOV_embrace_the_legacy_of_the_USSR_desc: "L'héritage de l'Union soviétique continue de guider notre développement politique et culturel. Ses réalisations restent la pierre angulaire de notre identité nationale et de nos ambitions."

SOV_Introduce_visa_regime_with_Central_Asia: "Régime de visa avec l'Asie centrale"
SOV_Introduce_visa_regime_with_Central_Asia_desc: "Pour mieux gérer nos frontières et répondre aux préoccupations économiques et sociales, nous introduirons un régime de visa avec l'Asie centrale. Cette mesure vise à réduire l'immigration illégale et à sauvegarder la stabilité nationale."

SOV_Utilize_the_country_economic_potential_100_percent: "Maximiser le potentiel économique"
SOV_Utilize_the_country_economic_potential_100_percent_desc: "Nous débloquerons pleinement le potentiel économique du pays. Chaque ressource et opportunité doit être utilisée pour stimuler la croissance et la prospérité."

SOV_Cooperation_with_Taiwan: "Coopération avec Taïwan"
SOV_Cooperation_with_Taiwan_desc: "Une coopération stratégique avec Taïwan nous donnera accès à une technologie avancée et à des avantages économiques considérables. Ce partenariat peut accélérer notre développement."

SOV_Buy_out_Taiwans_microchip_technology: "Acquérir la technologie des microprocesseurs de Taïwan"
SOV_Buy_out_Taiwans_microchip_technology_desc: "Nous avons conclu un accord pour acheter la technologie de fabrication de microprocesseurs de Taïwan. Cette acquisition servira de base à notre avancée technologique et économique."

SOV_Promote_Russian_companies_in_the_post-Soviet_space: "Promouvoir les entreprises russes dans l'espace post-soviétique"
SOV_Promote_Russian_companies_in_the_post-Soviet_space_desc: "Nous soutiendrons agressivement les entreprises russes qui se développent dans la région post-soviétique. Notre objectif est de revendiquer une position dominante sur ces marchés."

SOV_Monopoly_in_the_post-Soviet_space: "Monopole dans l'espace post-soviétique"
SOV_Monopoly_in_the_post-Soviet_space_desc: "Les entreprises russes devraient atteindre une domination de marché dans toute la région post-soviétique. Grâce à des investissements stratégiques et une influence politique, nous ferons de cela une réalité."

SOV_Economic_Empire: "Empire économique"
SOV_Economic_Empire_desc: "Une Russie forte n'a pas besoin de guerre pour s'affirmer. Grâce à la puissance économique et à l'influence, nous assurerons notre place en tant que leader mondial."

SOV_Make_the_Anti-Corruption_Foundation_a_State_Company: "Fondation anti-corruption"
SOV_Make_the_Anti-Corruption_Foundation_a_State_Company_desc: "Pour institutionnaliser la lutte contre la corruption, la Fondation anti-corruption deviendra une organisation appartenant à l'État avec le plein soutien du gouvernement."

SOV_Demonopolization_of_the_strategic_economy: "Démonopolisation de l'économie stratégique"
SOV_Demonopolization_of_the_strategic_economy_desc: "Nous briserons les monopoles dans les secteurs stratégiques de l'économie pour améliorer la transparence, la concurrence et l'efficacité."

SOV_Unite_the_network_of_state-owned_companies: "Unir le réseau des entreprises publiques"
SOV_Unite_the_network_of_state-owned_companies_desc: "Nous consoliderons nos entreprises publiques en un réseau cohérent et efficace, aligné sur les intérêts nationaux et capable de stimuler une croissance à long terme."

SOV_Increase_salaries_and_pensions_for_the_military_and_the_population: "Augmenter les salaires et les pensions"
SOV_Increase_salaries_and_pensions_for_the_military_and_the_population_desc: "Nous avons fait une promesse – et nous la tiendrons. Les salaires et les pensions pour les militaires et la population civile seront considérablement augmentés."

SOV_Measures_of_rapprochement_with_the_West: "Rapprochement avec l'Occident"
SOV_Measures_of_rapprochement_with_the_West_desc: "L'Occident ne doit pas être vu comme une menace, mais comme un partenaire. Grâce à la coopération et au dialogue, nous rétablirons la confiance et redéfinirons nos relations."

SOV_The_way_of_free_russia: "La voie de la Russie libre"
SOV_The_way_of_free_russia_desc: "Une Russie libre est une Russie forte. Nous poursuivrons la liberté, la démocratie et la fierté nationale comme fondement d'un avenir meilleur."

SOV_eu_state: "Véritable État occidental"
SOV_new_pensions_reform: "Nouvelle réforme des retraites"
SOV_demonopolisation_reform: "Démonopolisation de l'industrie stratégique"

russian_legacy_empire: "£text_icon_sov_empire Héritage impérial"
russian_legacy_empire_desc: "La Russie a toujours été un grand empire, et nous n'abandonnerons pas cet héritage au profit d'illusions démocratiques éphémères."

russian_legacy_democratic: "£text_icon_sov_democratic Héritage démocratique"
russian_legacy_democratic_desc: "Bien que la Russie ait connu de longues périodes d'autocratie, elle a également connu des moments d'espoir démocratique. Nous préserverons et élargirons cet héritage de liberté."

russian_legacy: "£text_icon_sov_empire Héritage russe"
russian_legacy_desc: "Pendant des siècles, la Russie a suivi sa propre voie unique, souvent isolée et sous un régime fort. Le changement vient lentement, mais le moment pourrait être propice à une transformation."

SOV_idea_restalinization: "Restalinisation"
SOV_idea_restalinization_desc: "La Russie s'est écartée du chemin juste. Pour retrouver notre force et notre indépendance, nous devons revenir aux méthodes et à la vision de Staline."

sov_war_cult_idea: "Le culte de la guerre"
sov_war_cult_idea_desc: "L'histoire de la Russie est imprégnée de guerre et de victoire. De Napoléon à Hitler, nous avons affronté d'innombrables menaces. Cette histoire a favorisé une profonde révérence culturelle pour la force et le sacrifice."

SOV_fbk_organization_category: "Siège de la Fondation anti-corruption"
SOV_fbk_organization_category_desc: "Des années d'autocratie ont saturé notre État de corruption. La Fondation anti-corruption s'engage à l'éradiquer et à restaurer l'honneur dans le service public."

SOV_democracy_taiwan_category: "Démocratie russe à Taïwan"
SOV_democracy_taiwan_category_desc: "Taïwan reste une épine dans le pied de la Chine. Alors que notre rivalité avec la Chine s'intensifie, sécuriser une influence sur Taïwan est devenu l'une de nos priorités stratégiques."

SOV_boost_opinion_of_rus: "Continuer à améliorer les relations"
SOV_more_weapon_taiwan: "Plus d'armes pour Taïwan"
SOV_invest_taiwan: "Investissements à Taïwan"
SOV_puppet_taiwan: "Subjuguer Taïwan"

SOV_Civil_Nationalism_idea: "Véritable nationalisme civique"
SOV_Combating_illegal_migration_idea: "Lutte contre l'immigration illégale"

SOV_Finding_corrupt_officials_in_the_party: "Identifier les fonctionnaires corrompus dans le parti"
SOV_Check_police_personnel: "Inspecter le personnel de police"
SOV_expose_corrupt_schemes_in_the_smuggling_trade: "Démasquer les schémas de corruption dans le commerce de contrebande"
SOV_check_data_on_illegal_migration: "Analyser les données sur l'immigration illégale"
SOV_operation_Sweet_Gifts: "Opération Doux Cadeaux"
SOV_Prepare_the_test_purchase: "Préparer l'achat test"
SOV_Train_specialized_personnel: "Former un personnel spécialisé"
SOV_Finalize_the_sweet_gifts_operation: "Finaliser l'opération Doux Cadeaux"

SOV_Free_Russia_idea: "Russie libre"
SOV_Russian_Microchip_idea: "Baikal Core i9"

russia.52.t: "Délégation russe à Taïwan"
russia.52.d: "Une délégation russe est arrivée avec une proposition : acheter une part de notre technologie de microprocesseurs en échange de ressources russes essentielles. Cet accord pourrait bénéficier aux deux parties."
russia.52.a: "C'est une bonne affaire"
russia.52.b: "La Russie ? Et combien de divisions a-t-elle ?"

russia.53.t: "Taïwan renie l'accord"
russia.53.d: "Le gouvernement taïwanais a rejeté notre offre, la jugeant défavorable. Les négociations ont échoué, et les tensions pourraient augmenter."
russia.53.a: "Taïwan ne reconnaît tout simplement pas la domination des processeurs Baikal"

russia.54.t: "Forces de défense aérospatiale russes"
russia.54.d: "L'armée russe a officiellement établi une nouvelle branche : les Forces de défense aérospatiale. Cette réforme vise à intégrer plus efficacement les opérations aériennes et spatiales."
russia.54.a: "Hourra !"

russia.55.t: "Le couronnement du tsar Boris"
russia.55.d: "Boris Eltsine est revenu à la vie publique et est maintenant vu par beaucoup comme le tsar symbolique de toute la Russie. Bien que largement cérémonielle, cette renaissance de la monarchie est historique – même si peu conventionnelle."
russia.55.a: "Quelle absurdité"

russia.58.t: "Réformes de l'armée"
russia.58.d: "Nos réformes militaires commencent à porter leurs fruits. De nouveaux généraux talentueux ont rejoint nos rangs, apportant force et professionnalisme renouvelé."
russia.58.a: "Bien"

russia.59.t: "Réformes de l'armée"
russia.59.d: "Nos réformes militaires commencent à porter leurs fruits. De nouveaux généraux talentueux ont rejoint nos rangs, apportant force et professionnalisme renouvelé."
russia.59.a: "Bien"

russia.60.t: "République de Malorossiya"
russia.60.d: "Nous avons établi l'État de Malorossiya sur le territoire ukrainien. La question maintenant est de savoir si nous devons exercer un contrôle direct sur cette nouvelle république."
russia.60.a: "Oui"
russia.60.b: "Non"

russia.61.t: ""
russia.61.d: ""
russia.61.a: ""

russia.62.t: "La catastrophe du Mi-8 près du village d'Ermakovskoye"
russia.62.d: "En avril 2002, le général Alexander Lebed est tragiquement décédé à l'âge de 53 ans dans un accident d'hélicoptère Mi-8 près du lac Oyskoye dans les Sayans orientaux. L'appareil a heurté des lignes électriques par mauvais temps, tuant sept autres personnes à ses côtés. Bien que officiellement attribué à une mauvaise préparation de l'équipage, des théories alternatives suggèrent un sabotage ou une pression pour voler malgré des conditions dangereuses. Des rapports contradictoires et l'absence de cartes aéronautiques détaillées ont laissé la cause exacte incertaine."
russia.62.a: "Tragédie"

