 sov_reunification_category: "Unification de la Russie"
 sov_reunification_category_desc: "L'issue de la guerre a vu la Russie se fractionner, une fois la poussière retombée, nous devons endurer les difficultés de la réunification.\nProgrès actuel de la réunification : [?THIS.reunification_progress]."
