##Alaska
russia.21.t: "La Russie exige l'Alaska"
russia.21.d: "La Russie a émis une demande formelle pour l'annexion de l'Alaska. Invoquant des revendications historiques, leur soi-disant 'Empire' cherche à récupérer les anciens territoires de l'Empire russe, l'Alaska étant clairement parmi eux. Nous devons décider si nous devons céder ou nous préparer à résister à cette ambition audacieuse."
russia.21.o1: "Nous devons nous soumettre..."
russia.21.o2: "Il n'y aura pas de Russes à Anchorage."
russia.22.t1: "Les États-Unis acceptent notre demande"
russia.22.d1: "Les États-Unis ont accepté notre demande pour l'Alaska. Nous avons enfin repris le contrôle des territoires nordiques, une victoire symbolique et stratégique pour notre nation."
russia.22.o1: "Slava Rossii !"
russia.23.t1: "Les États-Unis refusent notre demande"
russia.23.d1: "Les États-Unis ont refusé notre demande de retour de l'Alaska. Si nous voulons récupérer ce qui nous appartient, nous devrons nous battre pour cela."
russia.23.o1: "Nous leur préparerons un 'cadeau' alors."
russia.24.t: "La Russie propose un État d'Union"
russia.24.d: "Nos amis en Russie ont proposé d'approfondir notre État d'Union existant en un État d'Union complet. Accepter cette offre signifierait la fin de l'indépendance biélorusse, mais peut-être est-ce un pas nécessaire vers l'unité et la force."
russia.24.o1: "L'Union, c'est ça !"
russia.24.o2: "Résister et mordre !"
russia.25.t: "La Biélorussie accepte !"
russia.25.d: "La Biélorussie a accepté la proposition d'un État d'Union. Désormais, ils suivront nos directives. Cependant, ce mouvement pourrait susciter des inquiétudes parmi nos autres alliés."
russia.25.o1: "Excellent."
russia.31.t: "La Russie propose des investissements dans les pipelines"
russia.31.d: "La Russie a proposé un projet d'investissement mutuel pour développer l'infrastructure énergétique entre nos pays. Ils offrent de construire un pipeline pour transporter leur pétrole et gaz sur notre territoire. Cela pourrait apporter de grands avantages économiques, si nous pouvons accepter le coût politique."
russia.31.o1: "Bien sûr !"
russia.31.o2: "Les Russes, restez à l'écart !"
russia.32.t: "La Russie propose d'investir dans l'industrie militaire"
russia.32.d: "La Russie a proposé un investissement conjoint dans notre industrie militaire. Ils sont prêts à construire une usine d'armement pour renforcer nos capacités de défense et nos liens économiques. Accepter cela pourrait redéfinir notre secteur de la défense."
russia.32.o1: "Bien sûr !"
russia.32.o2: "Les Russes, restez à l'écart !"
russia.38.t: "[FROM.GetName] Accepte la coopération économique !"
russia.38.d: "[FROM.GetName] a répondu positivement à notre proposition d'investissement. Cela marque le début d'une coopération plus profonde et d'une croissance mutuelle entre nos nations."
russia.38.o1: "Excellent."
russia.39.t: "[FROM.GetName] Refuse la coopération économique !"
russia.39.d: "[FROM.GetName] a rejeté notre proposition d'investissement, stoppant tout progrès futur sur ce projet. L'opportunité de collaboration économique est perdue, du moins pour l'instant."
russia.39.o1: "Triste."
russia.40.t: "Prendre la Confédération du Sahel sous contrôle direct"
russia.40.d: "Nous pensons qu'il serait préférable de superviser personnellement les affaires de la Confédération du Sahel. Un contrôle direct peut assurer la stabilité et une gouvernance plus efficace dans la région."
russia.40.o1: "Non."
russia.40.o2: "Aller pour la Confédération du Sahel."
russia.41.t: "[SOV.GetNamewithFlag] Nous offre son système de lance-flammes lourd"
russia.41.d: "La Russie nous a offert l'une de ses dernières avancées militaires — un puissant système de lance-flammes lourd. Cette arme avancée pourrait grandement améliorer nos capacités. Devons-nous accepter leur offre ?"
russia.41.o1: "Oui."
russia.41.o2: "Non."
russia.44.t: "Achat de nos systèmes de lance-flammes lourds"
russia.44.d: "[FROM.GetName] a accepté d'acheter nos systèmes de lance-flammes lourds. Cette vente renforce nos liens économiques et militaires avec eux."
russia.44.a: "Bien."
russia.45.t: "Achat de nos systèmes de lance-flammes lourds"
russia.45.d: "[FROM.GetName] a refusé d'acheter nos systèmes de lance-flammes lourds. Une opportunité de transaction a été perdue."
russia.45.a: "C'est triste."
russia.46.t: "[SOV.GetNamewithFlag] Nous offre ses chars"
russia.46.d: "La Russie nous offre l'une de ses dernières inventions en matière de guerre blindée — un système de chars de pointe. Acquérir cet équipement pourrait considérablement renforcer nos forces terrestres."
russia.46.o1: "Oui."
russia.46.o2: "Non."
russia.47.t: "Achat de nos chars"
russia.47.d: "[FROM.GetName] a accepté d'acheter nos chars. Cette transaction bénéficiera à nos économies et à nos positions stratégiques."
russia.47.a: "Bien."
russia.48.t: "Achat de nos chars"
russia.48.d: "[FROM.GetName] a refusé d'acheter nos chars. Nous devrons chercher de nouveaux clients."
russia.48.a: "C'est triste."
russia.49.t: "Conflit au Karabakh"
russia.49.d: "Le conflit sans fin au Karabakh a atteint un autre point critique. Nous devons maintenant décider qui soutenir dans cette région volatile et historiquement contestée."
russia.49.a: "Nous aiderons l'Arménie."
russia.49.b: "Nous aiderons l'Azerbaïdjan."
russia.50.t: "Conflit géorgien"
russia.50.d: "L'Abkhazie et l'Ossétie du Sud posent depuis longtemps des problèmes à la Géorgie. Leur séparation dans les années 1990 a donné lieu à des années d'agitation et de conflits. Le moment est venu de déterminer l'avenir de ces territoires."
russia.50.a: "Nous prendrons l'Abkhazie et l'Ossétie pour nous-mêmes."
russia.50.b: "La Géorgie recevra l'Abkhazie et l'Ossétie."
russia.33.t: "Des rumeurs circulent sur un coup d'État russe !"
russia.33.d: "Des sources semi-fiables nous ont informés d'une possible tentative de coup d'État orchestrée par des éléments pro-russes. Pour prévenir cette menace, nous devons agir rapidement en arrêtant les responsables corrompus ayant des liens avec Moscou."
russia.33.o1: "Hmm..."
russia.34.t: "Le coup d'État ukrainien a réussi !"
russia.34.d: "Des rapports de Kyiv confirment que les forces pro-russes ont pris le contrôle du gouvernement. Une nouvelle administration loyale à Moscou est maintenant au pouvoir."
russia.34.o1: "Ura !"
russia.35.t: "Le coup d'État ukrainien a échoué !"
russia.35.d: "Les éléments pro-russes ont échoué dans leur tentative de prendre le contrôle du gouvernement ukrainien. Tous les conspirateurs ont été arrêtés, et Kyiv a déposé une protestation officielle."
russia.35.o1: "Blyat."
russia_news.9.t: "Le coup d'État russe en Ukraine a réussi."
russia_news.9.d: "Des rapports de Kyiv indiquent que les forces pro-russes ont réussi à prendre le contrôle de l'administration ukrainienne et à installer un gouvernement loyal. La Russie nie toute implication dans le coup d'État."
russia_news.9.o1: "Les Russes restent les Russes."
russia_news.9.o2: "Nos frères ont choisi la bonne voie !"
russia_news.9.o3: "Qu'est-ce que c'est que ça ?"
russia_news.10.t: "Le coup d'État russe en Ukraine a échoué."
russia_news.10.d: "Des rapports de Kyiv indiquent que les operatives pro-russes ont échoué à prendre le contrôle de l'administration. La Russie nie toute implication avec les rebelles ou le complot échoué."
russia_news.10.o1: "Les Russes restent les Russes."
russia_news.10.o2: "Blyat !"
russia_news.10.o3: "Maudits Russes."
russia.30.t: "Incident à la centrale hydroélectrique de Sayano-Shushenskaya"
russia.30.d: "Une catastrophe a frappé la plus grande installation hydroélectrique de Russie. L'une des turbines de la centrale Sayano-Shushenskaya s'est effondrée, tuant 75 personnes et causant de graves dommages au barrage. Les rapports actuels indiquent que 9 des 10 turbines ont été rendues inopérantes. La situation est critique et exige une action immédiate."
russia.30.o1: "Utiliser les fonds fédéraux et réparer immédiatement !"
russia.30.o2: "Censurer les véritables dégâts."
russia_news.6.t: "Incident à la centrale hydroélectrique de Sayano-Shushenskaya"
russia_news.6.d: "Ce matin, un désastre a frappé la centrale hydroélectrique de Sayano-Shushenskaya, la plus grande de Russie. Une turbine s'est effondrée, tuant 75 personnes et endommageant gravement le barrage. Les rapports suggèrent que 9 des 10 turbines ont été affectées, paralysant les opérations de la centrale."
russia_news.6.o1: "Horrible."
russia_news.6.o2: "Envoyer nos condoléances."
russia_news.6.o3: "Nous espérons que la Russie ira bien."
russia_news.6.o4: "Ils ont eu ce qu'ils méritaient !"
russia_news.1.t: "Vladimir Poutine élu président"
russia_news.1.d: "Comme prévu, Vladimir Poutine — président par intérim depuis le 31 décembre 1999 — a remporté l'élection présidentielle russe. Initialement perçu comme une simple extension de la volonté politique de Boris Eltsine, Poutine a déjà surpris beaucoup avec sa gestion ferme de la crise tchétchène, prouvant qu'il pourrait ne pas être aussi malléable qu'on le croyait."
russia_news.1.o1: "Voyons comment il s'en sort."
russia_news.2.t: "Vladimir Jirinovski élu président"
russia_news.2.d: "Dans une surprise inattendue, le Parti libéral-démocrate nationaliste a obtenu la présidence pour son leader franc-parler, Vladimir Jirinovski. Beaucoup pensaient que Vladimir Poutine gagnerait facilement, mais le peuple russe semble avoir choisi une voie plus radicale."
russia_news.2.o1: "La carrière de Poutine est terminée."
russia_news.3.t: "Gennady Ziouganov élu président"
russia_news.3.d: "Dans un revirement étonnant, Gennady Ziouganov du Parti communiste a remporté la présidence. La plupart pensaient que Poutine avait l'élection assurée, étant donné son lien avec Boris Eltsine. Ce résultat soulève de sérieuses questions sur l'avenir de la Russie et son possible retour vers une gouvernance de style soviétique."
russia_news.3.o1: "Cela marque-t-il la renaissance de l'URSS ?"
russia_news.4.t: "Grigori Yavlinski élu président"
russia_news.4.d: "Quasiment inconnu en dehors des cercles activistes, Grigori Yavlinski est devenu le nouveau président de la Russie dans une surprenante victoire électorale. Poutine, le grand favori et héritier d'Eltsine, était attendu pour gagner facilement. Mais l'électorat a choisi une voie différente, signalant peut-être un rejet de la politique oligarchique et une préférence pour une réforme libérale."
russia_news.4.o1: "Bonne chance, Grigori !"
russia_news.4.o2: "...qui ?"
russia_news.5.t: "L'essor de l'Union soviétique"
russia_news.5.d: "La nouvelle direction communiste de la Russie a clairement exprimé ses intentions — ils cherchent à restaurer l'ancienne Union soviétique en réunissant ses anciennes républiques. Une vague d'alarme ou d'excitation se propage, selon la position politique de chacun."
russia_news.5.o1: "Excellent."
russia_news.5.o2: "Soutenir la nouvelle Union !"
russia_news.5.o3: "Nouvelles troublantes."
russia_news.5.o4: "Terrible."
russia_news.50.t: "La catastrophe du sous-marin Koursk"
russia_news.50.d: "Les officiels russes ont confirmé le naufrage du sous-marin K-141 'Koursk' dans la mer de Barents, à 75 kilomètres de la péninsule de Kola. La catastrophe s'est produite le 12 août 2000, en raison d'une explosion interne. Bien que la Russie ait proposé plusieurs explications, y compris une collision avec un sous-marin de l'OTAN, l'alliance a fermement nié toute implication. Les 118 membres d'équipage ont péri dans l'incident."
russia_news.50.o1: "Une grande tragédie !"
russia_news.50.o2: "Envoyer nos condoléances à nos alliés."
russia_news.50.o3: "Nous espérons que les Russes iront bien."
russia_news.50.o4: "Ils ont eu ce qui leur pendait au nez."
russia_news.51.t: "La mort d'Alexandre Douguine"
russia_news.51.d: "Alexandre Douguine, un idéologue russe controversé et fondateur du mouvement eurasien, est mort chez lui de la rage, apparemment contractée par son rat de compagnie, Logos. Les autorités sont perplexes quant à la raison pour laquelle il n'a pas cherché de soins médicaux. En raison de circonstances suspectes, l'affaire est enquêtée comme un possible homicide."
russia_news.51.o1: "Une grande tragédie !"
russia_news.51.o2: "Une mort cruelle."
russia_news.7.t: "La Russie rejoint l'OMC !"
russia_news.7.d: "Après un processus de négociation prolongé, la Russie a été acceptée à l'Organisation mondiale du commerce. Pour obtenir cette approbation, la Russie a dû prouver des réformes économiques réelles, notamment aux États-Unis et à l'UE. Les médias d'État russes saluent cela comme une étape majeure dans la reprise post-soviétique du pays."
russia_news.7.o1: "Nous ouvrons nos portes !"
russia_news.7.o2: "La Russie s'ouvre au monde."
russia_news.7.o3: "La Russie s'ouvre au monde."
russia_news.7.o4: "Maudits soient-ils."
russia_news.8.t: "La Russie renomme la Militsiya en Police"
russia_news.8.d: "Le président Dmitri Medvedev a signé une loi de réforme majeure changeant le nom de la 'Militsiya' russe en 'Police'. La législation définit de nouveaux droits et responsabilités pour les officiers, élimine les rôles redondants et vise à améliorer la confiance du public en favorisant un partenariat entre la police et la société."
russia_news.8.o1: "Comme c'est intéressant."
russia_news.8.o2: "Bien."
