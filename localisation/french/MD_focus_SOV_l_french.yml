##########ECONOMIC TREE##########
##########Focuses##########
SOV_economic_russian: "L'économie russe"
SOV_economic_russian_desc: "Notre économie reste affaiblie par les crises des années 1990, l'effondrement de l'URSS et d'autres effets durables. Il est temps de prendre des mesures décisives pour reconstruire et renforcer les fondations économiques de notre nation."

SOV_economic_reform_gazprom: "Réforme de Gazprom"
SOV_economic_reform_gazprom_desc: "Gazprom a beaucoup souffert pendant la crise des années 1990. Réformer cette entreprise cruciale est essentiel pour la préserver comme un moteur puissant de notre croissance économique."

SOV_economic_buy_sibur: "Acquérir les actifs de SIBUR"
SOV_economic_buy_sibur_desc: "Nous acquérons les actifs de la compagnie pétrolière SIBUR pour élargir nos capacités industrielles et sécuriser notre secteur énergétique."

SOV_economic_zapolyarnoe: "Champ gazier de Zapolyarnoïe"
SOV_economic_zapolyarnoe_desc: "Découvert dans les années 1960, les vastes réserves de gaz, de pétrole et de condensats à Zapolyarnoïe sont maintenant prêtes pour l'extraction afin de stimuler notre production énergétique."

SOV_economic_gazprom_tes: "Construction de centrales thermiques"
SOV_economic_gazprom_tes_desc: "Dans le cadre de notre programme de développement énergétique, nous construirons plusieurs centrales thermiques à travers le pays pour assurer un approvisionnement électrique stable."

SOV_economic_nat_gas_sakhalin: "Production de gaz à Sakhaline"
SOV_economic_nat_gas_sakhalin_desc: "Les investissements dans les champs gaziers de Sakhaline garantiront des profits substantiels et renforceront nos exportations énergétiques."

SOV_economic_gazprom_stream: "Construction de gazoducs"
SOV_economic_gazprom_stream_desc: "Nous sommes prêts à construire de nouveaux gazoducs contournant certains pays, garantissant des exportations de gaz stables et fiables."

SOV_economic_gazprom_norstream: "Nord Stream"
SOV_economic_gazprom_norstream_desc: "Nous construirons un gazoduc direct vers l'Allemagne, assurant un approvisionnement constant et renforçant les liens économiques."

SOV_economic_gazprom_bluestream: "Blue Stream"
SOV_economic_gazprom_bluestream_desc: "Un gazoduc vers la Turquie est prévu pour élargir nos exportations énergétiques et renforcer la coopération régionale."

SOV_economic_gazprom_turkeystream: "Turkish Stream"
SOV_economic_gazprom_turkeystream_desc: "Notre coopération avec la Turquie s'approfondit alors que nous nous préparons à construire un autre gazoduc majeur."

SOV_economic_gazprom_nordstream2: "Nord Stream 2"
SOV_economic_gazprom_nordstream2_desc: "Nous prévoyons d'étendre notre partenariat gazier avec l'Allemagne en construisant un deuxième gazoduc pour répondre à la demande croissante."

SOV_join_wto: "Rejoindre l'OMC"
SOV_join_wto_desc: "Rejoindre l'Organisation mondiale du commerce nous intégrera davantage dans l'économie mondiale et apportera la prospérité à notre peuple."

SOV_outer_space_initiative: "Développement de Roscosmos"
SOV_outer_space_initiative_desc: "Les ambitions spatiales de la Russie nécessitent un Roscosmos financièrement stable et fiable pour mener nos efforts d'exploration et technologiques."

SOV_outer_space_vostochniy: "Cosmodrome de Vostochny"
SOV_outer_space_vostochniy_desc: "Pour réduire notre dépendance envers Baïkonour, nous commencerons la construction du cosmodrome de Vostochny pour les futurs lancements."

SOV_outer_space_asteroids_mining: "Ressources des astéroïdes"
SOV_outer_space_asteroids_mining_desc: "Notre technologie spatiale permet désormais l'extraction de ressources précieuses des astéroïdes, dont nous tirerons parti."

SOV_outer_space_space_combat_wombat: "Préparation à la course spatiale"
SOV_outer_space_space_combat_wombat_desc: "La course spatiale a repris après une pause, et nous devons intensifier nos efforts pour reprendre le leadership."

SOV_outer_space_sateelites: "Investir dans les satellites"
SOV_outer_space_sateelites_desc: "Les satellites sont des yeux essentiels dans l'espace, indispensables non seulement pour la course, mais aussi pour d'éventuels conflits futurs."

SOV_outer_space_weaponized_space: "Militarisation de l'espace"
SOV_outer_space_weaponized_space_desc: "L'espace deviendra inévitablement un domaine militarisé, il est donc crucial que nous agissions en premier pour sécuriser nos intérêts."

SOV_outer_space_moon_base: "Base lunaire"
SOV_outer_space_moon_base_desc: "Établir une base lunaire sera une étape majeure sur notre chemin vers la conquête du système solaire."

SOV_outer_space_marines: "Marines spatiaux russes"
SOV_outer_space_marines_desc: "Notre nouvelle branche de marines spatiaux ne montrera aucune pitié, vainquant tout ennemi dans les combats spatiaux."

SOV_found_rosatom: "Fondation de Rosatom"
SOV_found_rosatom_desc: "Rosatom est la corporation étatique de l'énergie nucléaire qui supervise le complexe nucléaire-industriel de la Russie."

SOV_economic_floating_nuclear: "Centrales nucléaires flottantes"
SOV_economic_floating_nuclear_desc: "Rosatom conçoit des centrales nucléaires flottantes autonomes destinées à être produites en masse et déployées près des lieux ayant besoin d'électricité."

SOV_economic_securing_rosatom: "Sécurité industrielle"
SOV_economic_securing_rosatom_desc: "Nous renforcerons la sécurité des installations nucléaires pour prévenir les incidents catastrophiques."

SOV_rosatom_fuel_division: "Division carburant de Rosatom"
SOV_rosatom_fuel_division_desc: "Tous les actifs nucléaires seront consolidés dans une division carburant sous la direction de Rosatom pour rationaliser les opérations."

SOV_rosatom_fuel_division2: "Combinat chimique de Sibérie"
SOV_rosatom_fuel_division2_desc: "Établi en 1953 à Tomsk-7 (aujourd'hui Seversk), ce complexe gère la production de composants d'armes nucléaires et opère en tant que filiale de TVEL."

SOV_rosatom_predmet_zoloto: "Holding d'uranium ARMZ"
SOV_rosatom_predmet_zoloto_desc: "Atomredmetzoloto, une division minière de Rosatom, se classe sixième mondialement dans la production d'uranium et deuxième pour les réserves d'uranium in-situ."

SOV_economic_anti_terrorist_rosatom: "Protection antiterroriste"
SOV_economic_anti_terrorist_rosatom_desc: "Nous collaborerons avec la Garde nationale pour protéger pleinement nos installations nucléaires contre les menaces terroristes."

SOV_economic_rao_ues: "Liquidation de RAO UES"
SOV_economic_rao_ues_desc: "La réforme du secteur énergétique nécessite le démantèlement du monopoliste actuel du marché, RAO UES."

SOV_economic_rus_hydro: "Création de RusHydro"
SOV_economic_rus_hydro_desc: "Nous établirons RusHydro pour contrôler et gérer efficacement les installations de production d'énergie."

SOV_economic_rus_hydro_expanded: "Expansion de RusHydro"
SOV_economic_rus_hydro_expanded_desc: "Les investissements ont renforcé RusHydro, lui permettant de construire de nouvelles infrastructures énergétiques à travers le pays."

SOV_economic_interrao: "Inter RAO"
SOV_economic_interrao_desc: "Fondée en 1997, Inter RAO se développera en acquérant des réseaux électriques nationaux dans le cadre de notre réforme énergétique."

SOV_economic_interrao_expand: "Expansion d'Inter RAO"
SOV_economic_interrao_expand_desc: "Avec le soutien de l'État, Inter RAO est prêt à construire de nouvelles installations énergétiques à l'échelle nationale."

SOV_seize_yukos_oil: "Saisie de Yukos Oil"
SOV_seize_yukos_oil_desc: "Avec l'élimination de Khodorkovsky, nous pouvons saisir Yukos Oil et redistribuer ses actifs à des parties loyales."

SOV_khodorkovsky_trial: "Les procès de Khodorkovsky"
SOV_khodorkovsky_trial_desc: "Ayant rassemblé suffisamment de preuves, nous procéderons au procès de Khodorkovsky, bien que le résultat soit déjà clair."

SOV_khodorkovsky_case: "L'affaire Khodorkovsky"
SOV_khodorkovsky_case_desc: "Confronté à des accusations de corruption et d'évasion fiscale, Khodorkovsky risque de perdre ses participations dans Yukos Oil."

SOV_remove_guzinsky: "Élimination de Guzinsky"
SOV_remove_guzinsky_desc: "Le magnat des médias Vladimir Guzinsky refuse de coopérer avec le gouvernement et les oligarques, et doit être traité en conséquence."

SOV_economic_trikolov_tv: "Tricolor TV"
SOV_economic_trikolov_tv_desc: "Bien qu'il s'agisse d'une entreprise privée, nous maintiendrons un contrôle discret sur le réseau de diffusion de Tricolor TV."

SOV_economic_gazprom_media: "Gazprom Media"
SOV_economic_gazprom_media_desc: "Gazprom prévoit de créer son propre holding médiatique ; nous devons gérer et influencer ce développement."

SOV_delay_sibirneft_merger: "Retarder la fusion de Sibneft"
SOV_delay_sibirneft_merger_desc: "La fusion proposée entre Yukos et Sibneft a été bloquée par des accusations fabriquées contre Khodorkovsky pour empêcher son contrôle."

SOV_economic_gazprom_neft: "Gazprom Neft"
SOV_economic_gazprom_neft_desc: "Suite à la liquidation de Sibneft, Gazprom a acquis une participation majoritaire et un contrôle total sur ses actifs."

SOV_economic_gas_with_sibur: "Projet pétrolier et gazier avec SIBUR"
SOV_economic_gas_with_sibur_desc: "Gazprom développe un projet pétrolier et gazier conjoint avec SIBUR pour améliorer la production régionale."

SOV_economic_arctic_gas: "Champs pétroliers et gaziers de l'Arctique"
SOV_economic_arctic_gas_desc: "Gazprom prévoit d'explorer et d'exploiter les vastes réserves des champs pétroliers et gaziers de l'Arctique."

SOV_economic_oil_nenets: "Projet pétrolier et gazier à [NEE.GetName]"
SOV_economic_oil_nenets_desc: "Gazprom continue de développer des projets pétroliers et gaziers dans cette région stratégique."

SOV_economic_oil_yamao: "Projet pétrolier et gazier à [YAM.GetName]"
SOV_economic_oil_yamao_desc: "Le développement ultérieur des ressources pétrolières et gazières dans cette région reste une priorité pour Gazprom."

SOV_economic_oil_khmao: "Projet pétrolier et gazier à [KHM.GetName]"
SOV_economic_oil_khmao_desc: "Gazprom prévoit d'élargir les opérations d'extraction de pétrole et de gaz dans cette région."

SOV_economic_slavneft: "Achat des actifs de SLAVNEFT"
SOV_economic_slavneft_desc: "Rosneft et Gazprom prévoient de diviser et d'acquérir les actifs de Slavneft."

SOV_economic_reform_rosneft: "Réforme de Rosneft"
SOV_economic_reform_rosneft_desc: "Rosneft vise à restructurer et élargir ses opérations pour renforcer sa position sur le marché."

SOV_economic_use_yukos: "Utilisation des actifs de YUKOS"
SOV_economic_use_yukos_desc: "Rosneft utilisera les actifs acquis lors de la liquidation de Yukos pour poursuivre le développement de l'entreprise."

SOV_economic_buy_itera: "Acquisition d'ITERA"
SOV_economic_buy_itera_desc: "Rosneft prévoit d'intégrer ITERA dans son portefeuille en tant que nouvel actif stratégique."

SOV_economic_buy_severnaya_neft: "Acquisition de SevernayaNeft"
SOV_economic_buy_severnaya_neft_desc: "L'acquisition de SevernayaNeft élargira la base de ressources de Rosneft."

SOV_economic_buy_thk_bp: "Acquisition de TNK"
SOV_economic_buy_thk_bp_desc: "Rosneft prévoit d'acquérir TNK pour renforcer ses capacités de production pétrolière."

SOV_economic_efko: "Efko"
SOV_economic_efko_desc: "Efko est un leader russe dans la production de graisses, de margarine, de mayonnaise, d'huiles végétales et de produits laitiers, classé parmi les plus grandes entreprises agro-industrielles."

SOV_economic_miratorg: "Miratorg"
SOV_economic_miratorg_desc: "Miratorg est le plus grand holding agricole verticalement intégré de Russie, produisant du porc et des produits carnés tout au long de la chaîne d'approvisionnement."

SOV_economic_rusagro: "RusAgro"
SOV_economic_rusagro_desc: "L'une des plus grandes entreprises agricoles de Russie, RusAgro est spécialisée dans la production de porc, de graisses et de sucre, fondée en 1995."

SOV_economic_efko_expanded: "Extension d'Efko"
SOV_economic_efko_expanded_desc: "Efko prévoit une croissance continue, soutenue par des subventions étatiques pour stimuler son développement."

SOV_economic_miratorg_expanded: "Extension de Miratorg"
SOV_economic_miratorg_expanded_desc: "Miratorg vise à élargir sa production avec l'aide d'investissements gouvernementaux."

SOV_economic_rusagro_expanded: "Extension de RusAgro"
SOV_economic_rusagro_expanded_desc: "RusAgro cherche à se développer davantage grâce au financement de l'État."

SOV_economic_phos_agro: "PhosAgro"
SOV_economic_phos_agro_desc: "PhosAgro, basée à Moscou, est le plus grand producteur européen d'engrais à base de phosphate et de produits chimiques associés."

SOV_economic_belarus_integrate: "Intégration de l'industrie biélorusse"
SOV_economic_belarus_integrate_desc: "Nous intégrerons les usines biélorusses dans l'économie russe, en les plaçant sous notre contrôle."

SOV_economic_mzkt_annex: "Intégration de MZKT"
SOV_economic_mzkt_annex_desc: "MZKT, un producteur biélorusse de véhicules lourds et spécialisés, sera incorporé sous notre juridiction."

SOV_economic_140_annex: "Intégration de l'usine de réparation 140"
SOV_economic_140_annex_desc: "L'usine de réparation 140, spécialisée dans la modernisation des véhicules blindés, sera annexée pour élargir notre capacité industrielle militaire."

SOV_economic_peleng_annex: "Intégration de Peleng"
SOV_economic_peleng_annex_desc: "Peleng, une entreprise biélorusse de premier plan dans l'optoélectronique pour usage militaire et civil, rejoindra notre système industriel."

SOV_economic_grodno_annex: "Intégration de Grodno Azot"
SOV_economic_grodno_annex_desc: "Grodno Azot produit des engrais essentiels pour l'agriculture, et son intégration renforcera notre portée sur le marché."

SOV_economic_evraz: "EVRAZ"
SOV_economic_evraz_desc: "EVRAZ est une entreprise multinationale d'acier et d'extraction minière, partiellement détenue par des oligarques russes, opérant principalement en Russie, aux États-Unis, au Canada et au Kazakhstan."

SOV_economic_mechel: "Mechel"
SOV_economic_mechel_desc: "Mechel est un grand producteur russe de charbon, de minerai de fer et de produits sidérurgiques, basé à Moscou avec des ventes nationales et internationales."

SOV_economic_severstal: "Severstal"
SOV_economic_severstal_desc: "Severstal est le plus grand sidérurgiste de Russie, basé à Cherepovets et contrôlé par le milliardaire Alexey Mordashov."

SOV_economic_evraz_asset: "Extension d'EVRAZ"
SOV_economic_evraz_asset_desc: "EVRAZ est prêt à se développer davantage grâce à des subventions étatiques soutenant sa croissance."

SOV_economic_yakut_ugol: "Acquisition de YakutUgol"
SOV_economic_yakut_ugol_desc: "Mechel prévoit d'acquérir les actifs de YakutUgol pour élargir sa capacité de production de charbon."

SOV_economic_severstal_expanded: "Extension de Severstal"
SOV_economic_severstal_expanded_desc: "Severstal vise à croître avec le soutien du gouvernement pour de nouveaux projets."

SOV_economic_nornickel: "Nornickel"
SOV_economic_nornickel_desc: "Nornickel est une entreprise russe de premier plan dans l'extraction et la fonte, spécialisée dans le nickel et le palladium, opérant principalement près de Norilsk."

SOV_economic_buy_polus: "Achat de Polyus"
SOV_economic_buy_polus_desc: "Polyus est le plus grand producteur d'or de Russie et l'une des principales entreprises minières mondiales en termes de production."

SOV_economic_alrosa: "Alrosa"
SOV_economic_alrosa_desc: "Alrosa domine la production mondiale de diamants en volume, représentant 95 % de la production de diamants russe et 27 % à l'échelle mondiale."

SOV_economic_nakynskoe: "Usine de traitement et d'extraction de Nyurbinsky"
SOV_economic_nakynskoe_desc: "Alrosa a ouvert l'usine de Nyurbinsky, renforçant sa capacité d'extraction et de traitement."

SOV_economic_rusal: "Rusal"
SOV_economic_rusal_desc: "Rusal est le deuxième plus grand producteur mondial d'aluminium, responsable de près de 9 % de la production mondiale."

SOV_economic_buy_sual: "Acquisition des actifs de SUAL"
SOV_economic_buy_sual_desc: "L'achèvement de l'intégration de SUAL finalisera la formation complète de l'entreprise sous notre contrôle."

SOV_economic_aeroflot: "Aeroflot"
SOV_economic_aeroflot_desc: "Aeroflot est la compagnie aérienne phare de la Russie, évoluée à partir de l'entreprise d'État de l'ère soviétique, opérant désormais à l'international."

SOV_economic_poebda: "Pobeda"
SOV_economic_poebda_desc: "Pobeda est une compagnie aérienne à bas coût russe et une filiale d'Aeroflot, basée à l'aéroport de Vnukovo à Moscou."

SOV_economic_new_airports: "Construction de nouveaux aéroports"
SOV_economic_new_airports_desc: "Aeroflot prévoit d'investir dans la construction de nouveaux aéroports à travers le pays pour améliorer l'accessibilité des vols."

SOV_economic_rjd: "RZD"
SOV_economic_rjd_desc: "Les Chemins de fer russes (RZD) sont une entreprise étatique verticalement intégrée qui possède l'infrastructure publique et est le plus grand transporteur du réseau ferroviaire russe. Fondée sur la base de l'ancien ministère des Chemins de fer de Russie, l'entreprise joue un rôle vital dans la connexion des vastes régions du pays et soutient le développement économique."

SOV_economic_rjd_sochi: "Infrastructures à Sotchi"
SOV_economic_rjd_sochi_desc: "Les Chemins de fer russes prévoient d'investir massivement dans les infrastructures de Sotchi pour stimuler le tourisme et améliorer les capacités de transport de la région. Ces développements visent à rendre Sotchi plus accessible et attrayante pour les visiteurs nationaux et internationaux."

SOV_economic_rjd_more_trains: "Achat de trains"
SOV_economic_rjd_more_trains_desc: "Les Chemins de fer russes élargissent leur flotte en commandant d'urgence un grand nombre de nouveaux wagons. Cette initiative modernisera le réseau et améliorera la capacité de transport à travers le pays."

SOV_economic_rjd_moscow_circle: "Cercle central de Moscou"
SOV_economic_rjd_moscow_circle_desc: "Le Cercle central de Moscou (MCC), connu sous le nom de Ligne 14 et marqué par des couleurs rouge fraise et blanc, est une ligne ferroviaire urbaine de 54 kilomètres qui encercle le Moscou historique. Il fournit une route orbitale essentielle, réduisant la congestion et connectant de nombreuses zones clés autour de la ville."

SOV_economic_rjd_transsib: "Chemin de fer transsibérien"
SOV_economic_rjd_transsib_desc: "Le Chemin de fer transsibérien, historiquement appelé la Grande Route de Sibérie et souvent abrégé en Transsib, est un vaste réseau ferroviaire reliant la Russie européenne à l'Extrême-Orient russe. Il est crucial pour le transport de marchandises et de passagers à travers le continent."

SOV_economic_rjd_baikal_amure: "Ligne principale Baïkal-Amour"
SOV_economic_rjd_baikal_amure_desc: "La Ligne principale Baïkal-Amour (BAM) est un chemin de fer à voie large s'étendant sur 4 324 kilomètres à travers la Sibérie orientale et l'Extrême-Orient russe. Elle se trouve à environ 610 à 770 kilomètres au nord et parallèle au Chemin de fer transsibérien, offrant un corridor de transport alternatif important."

SOV_economic_rjd_north_latitudinal: "Chemin de fer latitudinal nord"
SOV_economic_rjd_north_latitudinal_desc: "Le Chemin de fer latitudinal nord, actuellement en construction dans le district autonome de Yamalo-Nenets, s'étendra sur 707 kilomètres. Il reliera les parties ouest et est de la région, connectant le Chemin de fer du Nord à l'est avec l'oblast de Sverdlovsk, améliorant grandement la connectivité régionale."

SOV_economic_rjd_sakhalin: "Infrastructures de transport à Sakhaline"
SOV_economic_rjd_sakhalin_desc: "Les infrastructures de transport de Sakhaline nécessitent des améliorations pour soutenir la croissance économique de l'île. Les Chemins de fer russes planifient des projets d'expansion pour moderniser et améliorer la connectivité au sein de Sakhaline."

SOV_economic_rjd_mcd: "Diamètres centraux de Moscou"
SOV_economic_rjd_mcd_desc: "Les Diamètres centraux de Moscou (MCD) sont des services ferroviaires de banlieue opérant sur les lignes ferroviaires suburbaines existantes à Moscou et dans l'oblast de Moscou environnant. Ces services améliorent l'efficacité du transit en reliant directement les zones périphériques au centre-ville."

SOV_economic_rubber: "Industrie des pneus domestiques"
SOV_economic_rubber_desc: "Notre industrie des pneus domestiques reste sous-développée et a un besoin urgent de plus d'investissements. En allouant plusieurs tranches budgétaires, nous visons à moderniser la production et à renforcer ce secteur important de notre économie."

SOV_economic_rubber_foreign: "Investisseurs étrangers"
SOV_economic_rubber_foreign_desc: "Nous prévoyons d'attirer les principaux fabricants et marques de pneus étrangers pour établir des installations de production en Russie. Cela apportera une technologie avancée et stimulera le développement de l'industrie locale."

SOV_economic_auto: "Industrie automobile"
SOV_economic_auto_desc: "La demande pour les automobiles a considérablement augmenté au cours de la dernière décennie, rendant crucial de décider de l'orientation future de notre industrie automobile. Les investissements et les partenariats stratégiques aideront à répondre à cette demande croissante."

SOV_economic_invite_investors: "Inviter des marques étrangères"
SOV_economic_invite_investors_desc: "Nous sommes prêts à accueillir des marques automobiles étrangères pour construire des usines en Russie. Cela diversifiera notre marché et apportera des technologies automobiles de pointe."

SOV_economic_cars_usa: "Marques automobiles américaines"
SOV_economic_cars_usa_desc: "Les fabricants automobiles américains sont invités à entrer et à élargir leur présence sur notre marché. Cette coopération améliorera le choix des consommateurs et favorisera la concurrence."

SOV_economic_cars_europe: "Marques automobiles européennes"
SOV_economic_cars_europe_desc: "Nous sommes prêts à intégrer pleinement les marques automobiles européennes sur le marché russe. Leur implication contribuera à la croissance technologique et à la diversité du marché."

SOV_economic_reno_nissan_autovaz: "Avtovaz Renault Nissan"
SOV_economic_reno_nissan_autovaz_desc: "L'alliance entre Avtovaz, Renault et Nissan vise à renforcer notre secteur automobile et à avoir un impact positif sur le marché grâce à une expertise et des ressources partagées."

SOV_economic_cars_west_market: "Marché automobile occidental"
SOV_economic_cars_west_market_desc: "Notre marché s'intègre de plus en plus aux constructeurs automobiles occidentaux. Cette tendance est appelée à se poursuivre, contribuant à moderniser l'industrie et à offrir aux consommateurs une plus large gamme de véhicules."

SOV_economic_cars_japan_market: "Marché automobile japonais"
SOV_economic_cars_japan_market_desc: "Nous prévoyons d'approfondir les partenariats avec les constructeurs automobiles japonais pour bénéficier de leurs technologies avancées et de leurs normes de fabrication."

SOV_economic_cars_china_market: "Marché automobile chinois"
SOV_economic_cars_china_market_desc: "Renforcer les liens avec les constructeurs automobiles chinois ouvrira de nouvelles opportunités et permettra l'accès à des modèles innovants pour les consommateurs russes."

SOV_economic_cars_udar_market: "Large accès des fabricants chinois"
SOV_economic_cars_udar_market_desc: "Nous élargirons la présence des fabricants chinois sur notre marché intérieur. Cela augmentera la concurrence et offrira des options plus abordables pour les acheteurs."

SOV_economic_cars_moskvich: "Moskvich"
SOV_economic_cars_moskvich_desc: "Nous prévoyons de relancer la marque historique Moskvich en utilisant des conceptions de voitures étrangères sous licence. Cette approche équilibre l'héritage avec la technologie moderne."

SOV_economic_aurus: "Aurus"
SOV_economic_aurus_desc: "Aurus est une marque russe prestigieuse connue pour ses véhicules exécutifs et de luxe. Initialement développée sous le nom de Plateforme Modulaire Unifiée et le projet Tuple, elle représente l'excellence de l'artisanat automobile haut de gamme russe."

SOV_economic_domestic: "Focus sur les marques automobiles nationales"
SOV_economic_domestic_desc: "Il est essentiel de prioriser et de protéger nos fabricants automobiles nationaux au lieu de dépendre uniquement des solutions étrangères. Développer la capacité locale renforce notre économie et notre indépendance automobile."

SOV_economic_avtovaz: "AvtoVAZ"
SOV_economic_avtovaz_desc: "AvtoVAZ est un grand constructeur automobile étatique russe, anciennement connu sous le nom de VAZ. Réputé pour sa série Lada, les véhicules de l'entreprise étaient autrefois vendus sous divers noms comme Zhiguli, Oka et Sputnik, qui ont été progressivement abandonnés en faveur de la marque Lada dans les années 1990."

SOV_economic_kamaz: "KAMAZ"
SOV_economic_kamaz_desc: "KAMAZ, basé à Naberezhnye Chelny, est un leader russe dans la production de camions, d'autobus et de moteurs. Fondée en 1969, l'entreprise est particulièrement célèbre pour ses conceptions de camions à cabine avancée."

SOV_economic_gaz: "GAZ"
SOV_economic_gaz_desc: "GAZ, ou Gorkovsky Avtomobilny Zavod, est un fabricant automobile clé de Russie basé à Nijni Novgorod. Il opère en tant que filiale principale du groupe GAZ, lui-même partie du groupe industriel Basic Element."

SOV_economic_national_proud: "Fierté nationale"
SOV_economic_national_proud_desc: "Nos voitures nationales sont une source de fierté nationale. Nous restons engagés à soutenir leur développement et à garantir qu'elles deviennent parmi les meilleurs véhicules au monde."

SOV_economic_vaz_electro_car: "Voitures électriques VAZ"
SOV_economic_vaz_electro_car_desc: "VAZ prévoit de lancer sa propre gamme de véhicules électriques. Cette initiative s'inscrit dans une stratégie plus large pour moderniser l'industrie automobile et répondre aux demandes futures."

SOV_economic_own_mosnosti: "Nos capacités"
SOV_economic_own_mosnosti_desc: "Nous avons l'intention de nous appuyer exclusivement sur nos propres installations de production pour la croissance de l'industrie automobile. Cela aidera à maintenir le contrôle de la qualité et à renforcer la fabrication nationale."

SOV_economic_chaika: "Chaika"
SOV_economic_chaika_desc: "La marque historique Chaika sera relancée avec des mises à jour et des fonctionnalités modernes. Cette relance vise à allier l'héritage classique à un design automobile contemporain."

SOV_economic_rostelekom: "Rostelecom"
SOV_economic_rostelekom_desc: "Rostelecom est le plus grand fournisseur de services numériques de Russie, desservant les ménages, les entreprises, le gouvernement et les opérateurs télécoms. Il connecte les réseaux locaux dans un système national unifié pour les appels longue distance et les services Internet, jouant un rôle crucial dans l'infrastructure de communication de la Russie."

SOV_economic_inter_networks: "Opérateurs de réseaux internes"
SOV_economic_inter_networks_desc: "Rostelecom prévoit d'acquérir de nombreux petits opérateurs de réseaux à travers la Russie pour les consolider sous son contrôle. Cette stratégie améliorera l'efficacité et élargira sa part de marché."

SOV_economic_gosuslugi: "Gosuslugi"
SOV_economic_gosuslugi_desc: "Gosuslugi est une plateforme numérique fédérale gérée par le gouvernement russe, offrant un accès en ligne aux informations sur les services étatiques et municipaux. Elle propose des formulaires électroniques et rationalise l'interaction entre les citoyens, les entreprises et le gouvernement."

SOV_economic_mts: "MTS"
SOV_economic_mts_desc: "Mobile TeleSystems (MTS) est le plus grand opérateur de réseau mobile de Russie, basé à Moscou. Il fournit des services sur les normes GSM, UMTS et LTE, ainsi que des services de téléphonie fixe, d'Internet à haut débit et de télévision."

SOV_economic_mts_expanding: "Expansion de MTS"
SOV_economic_mts_expanding_desc: "MTS investit dans la construction de nombreuses tours de réseau à travers le pays. Cette expansion améliorera la couverture et la qualité des communications à travers la Russie, bénéficiant à des millions d'utilisateurs."

SOV_economic_tele2: "Tele2 Russie"
SOV_economic_tele2_desc: "Tele2 Russie, initialement fondé par Tele2 suédois, est maintenant une filiale à 100 % de Rostelecom. C'est un acteur clé sur le marché des télécommunications russes."

SOV_economic_megaphon: "MegaFon"
SOV_economic_megaphon_desc: "MegaFon, anciennement North-West GSM, est le deuxième plus grand opérateur de téléphonie mobile de Russie et le troisième fournisseur de télécommunications. Il offre des services sur les réseaux GSM, UMTS et LTE à travers le pays."

SOV_economic_it_sphere: "Secteur IT russe"
SOV_economic_it_sphere_desc: "Nous nous engageons à développer le secteur IT national, car la technologie est la base de l'avenir. Investir dans l'IT garantit que notre pays reste compétitif et innovant."

SOV_economic_mmvb: "Bourse interbancaire de Moscou"
SOV_economic_mmvb_desc: "La Bourse interbancaire de Moscou est une institution financière clé facilitant le commerce des devises et des titres. Elle joue un rôle important sur les marchés financiers russes."

SOV_economic_mosbirja: "Bourse de Moscou"
SOV_economic_mosbirja_desc: "La Bourse de Moscou est la principale plateforme de Russie pour le commerce des actions, obligations, dérivés et devises. Elle constitue l'épine dorsale de l'infrastructure financière du pays."

SOV_economic_sber_reorg: "Réforme de Sberbank"
SOV_economic_sber_reorg_desc: "Sberbank subit des réformes globales pour moderniser ses opérations et améliorer ses services. Cette transformation vise à la rendre plus axée sur le client et compétitive dans le paysage financier en évolution."

SOV_economic_sber_ipo: "Introduction en bourse populaire de Sberbank"
SOV_economic_sber_ipo_desc: "Sberbank prévoit de lancer une introduction en bourse publique pour élargir la propriété et renforcer sa base de capital. Cette initiative augmentera la transparence et invitera une plus grande participation publique."

SOV_economic_vtb_ipo: "Introduction en bourse populaire de VTB"
SOV_economic_vtb_ipo_desc: "La banque VTB prépare une introduction en bourse publique pour attirer des investissements et élargir sa présence sur le marché. Cette étape renforcera sa stabilité financière et soutiendra sa croissance."

SOV_economic_vtb: "Banque VTB"
SOV_economic_vtb_desc: "La banque VTB est une institution financière majeure en Russie offrant une large gamme de services bancaires aux particuliers et aux entreprises. Elle joue un rôle clé dans le secteur bancaire russe."

SOV_economic_alpha: "Alpha Bank"
SOV_economic_alpha_desc: "Alpha Bank est une banque privée de premier plan en Russie, reconnue pour ses produits et services financiers complets. Elle dessert à la fois les clients particuliers et corporatifs."

SOV_economic_alpha_lab: "Alpha Lab"
SOV_economic_alpha_lab_desc: "Alpha Lab est le centre d'innovation d'Alpha Bank, axé sur le développement de technologies financières de pointe et de solutions numériques pour améliorer l'expérience client."

SOV_economic_destiny_sber: "Rebranding de Sberbank"
SOV_economic_destiny_sber_desc: "Il est temps pour Sberbank de subir un rebranding majeur. L'ancienne structure et le style visuel sont dépassés. Aujourd'hui, Sberbank n'est pas seulement une banque, mais un écosystème complet offrant une variété de services financiers et numériques."

SOV_economic_destiny_vk: "Avenir de VK"
SOV_economic_destiny_vk_desc: "VKontakte est le plus grand réseau social de Russie, avec une influence dépassant ce que nous aurions pu imaginer. Il pourrait être temps de placer cette plateforme sous contrôle étatique pour garantir son alignement avec les intérêts nationaux."

SOV_economic_kasperskyi: "Kaspersky Lab"
SOV_economic_kasperskyi_desc: "Kaspersky Lab est une entreprise de cybersécurité mondialement reconnue basée en Russie. Elle développe des logiciels antivirus et de sécurité avancés qui protègent les utilisateurs dans le monde entier."

SOV_economic_bilene: "Beeline"
SOV_economic_bilene_desc: "Beeline est une entreprise de télécommunications de premier plan en Russie, fournissant des services mobiles et Internet à travers le pays. Elle joue un rôle significatif dans la connexion des personnes et des entreprises."

SOV_economic_mir: "Mir"
SOV_economic_mir_desc: "Mir est un système de paiement électronique russe établi par la Banque centrale de Russie. Il propose aux institutions financières des produits de paiement de marque utilisés pour les programmes de cartes de crédit, de débit et autres, offrant une alternative nationale aux systèmes de cartes internationaux."

SOV_economic_destiny_yandex: "Avenir de Yandex"
SOV_economic_destiny_yandex_desc: "Partant d'une petite entreprise, Yandex a grandi pour dominer le secteur IT en Russie. Il est maintenant assez influent pour que l'intervention de l'État puisse être nécessaire pour guider son orientation future."

SOV_economic_glonass: "GLONASS"
SOV_economic_glonass_desc: "GLONASS est le système de navigation par satellite de la Russie offrant une couverture mondiale. En tant qu'alternative au système GPS, il fournit des services de positionnement précis essentiels pour les usages civils et militaires."
