SOV_broken_economy_idea_2: "Conséquences économiques sérieuses"
SOV_broken_economy_idea_3: "Conséquences économiques modérées"
SOV_russian_bad_economy_idea: "Économie brisée"
SOV_russian_bad_economy_idea_desc: "Les années 90 ont eu un impact énorme sur l'économie russe. La destruction totale de l'industrie soviétique et de la R&D a conduit à une crise économique majeure, qu'il nous faut résoudre."

##########Events##########
sov_economic.1.t: "L'affaire Khodorkovsky"
sov_economic.1.d: "Mikhaïl Khodorkovsky a été arrêté pour suspicion de vol majeur et de corruption au sein de sa compagnie pétrolière Yukos. Il exerce une influence significative parmi les oligarques et pourrait représenter une menace pour la stabilité interne. Bien qu'il n'y ait pas de preuves concluantes de sa culpabilité, nous devons décider comment procéder avec prudence. Ce choix pourrait avoir des répercussions politiques durables."
sov_economic.1.a: "Coupable !"
sov_economic.1.b: "C'est un bon homme d'affaires, pas un voleur !"
sov_economic.2.t: "Le procès de Khodorkovsky"
sov_economic.2.d: "Suite à une enquête rapide, le moment est venu de prononcer un jugement sur Khodorkovsky. Nous devons décider de la punition appropriée. Notre décision enverra un message fort sur la manière dont nous traitons les cas de corruption de haut profil."
sov_economic.2.a: "Mettez-le en prison !"
sov_economic.2.b: "Une amende suffit."
sov_economic.3.t: "L'affaire Guzinsky"
sov_economic.3.d: "Vladimir Gusinsky, PDG de la plus grande entreprise de médias privés de Russie, NTV, a été accusé de fraude majeure et arrêté. Il a proposé de vendre l'ensemble de son holding médiatique au gouvernement et de quitter le pays. Devons-nous accepter cette offre pour éviter d'autres complications ?"
sov_economic.3.a: "Acheter les parts et le laisser partir."
sov_economic.3.b: "Il est innocent ! Libérez-le !"
sov_economic.3.c: "Nous n'avons pas besoin de ses médias. Emprisonnez-le !"
sov_economic.4.t: "Fusion de Rosneft avec TNK"
sov_economic.4.d: "Rosneft a proposé de fusionner avec son principal concurrent, TNK. Cette décision va à l'encontre des principes du marché libre mais profite au gouvernement. Devons-nous approuver cette fusion malgré les risques ?"
sov_economic.4.a: "Oui ! Rosneft doit dominer."
sov_economic.4.b: "Non ! Protégeons le marché libre, gardons TNK indépendant."
sov_economic.5.t: "Fusion de Gazprom avec Sibneft"
sov_economic.5.d: "Gazprom prévoit d'acquérir Sibneft, une grande entreprise pétrolière appartenant à Roman Abramovich. Bien que cela menace la liberté du marché, cela renforce les entreprises gouvernementales. Devons-nous approuver cet accord ?"
sov_economic.5.a: "Approuvons-le ! Sibneft devient nôtre."
sov_economic.5.b: "Rejetons-le ! Le marché libre est vital pour la Russie."
sov_economic.6.t: "Liquidation de RAO UES"
sov_economic.6.d: "RAO UES était un grand holding énergétique contrôlant la majeure partie de la capacité électrique et du réseau de Russie. Après les réformes, cette entreprise a été liquidée et remplacée par de nombreuses entités plus petites. Cela marque une nouvelle ère pour le secteur énergétique."
sov_economic.6.a: "Noté."
sov_economic.7.t: "Nord Stream"
sov_economic.7.d: "La Russie propose de construire le gazoduc Nord Stream. Ce projet promet de stimuler considérablement notre économie et notre secteur énergétique."
sov_economic.7.a: "Accepter"
sov_economic.7.b: "Refuser"
sov_economic.8.t: "Ouverture du gazoduc"
sov_economic.8.d: "Notre proposition d'ouvrir un gazoduc vers leur pays a été acceptée. Cela marque une nouvelle étape dans notre coopération économique."
sov_economic.8.a: "Développement positif"
sov_economic.9.t: "Ouverture du gazoduc"
sov_economic.9.d: "Notre offre d'ouvrir un gazoduc a été refusée, ce qui constitue un revers inattendu. Nous devons reconsidérer notre stratégie."
sov_economic.9.a: "Qu'ils le regrettent"
sov_economic.10.t: "Blue Stream"
sov_economic.10.d: "La Russie propose de construire le gazoduc Blue Stream, qui renforcera notre infrastructure énergétique et notre croissance économique."
sov_economic.10.a: "Accepter"
sov_economic.10.b: "Refuser"
sov_economic.11.t: "Turkish Stream"
sov_economic.11.d: "La Russie propose le gazoduc Turkish Stream. Ce projet pourrait considérablement améliorer nos liens économiques et notre sécurité énergétique."
sov_economic.11.a: "Oui"
sov_economic.11.b: "Non"
sov_economic.12.t: "Nord Stream 2"
sov_economic.12.d: "L'offre de construire Nord Stream 2 promet de renforcer notre économie grâce à des capacités d'exportation énergétique améliorées."
sov_economic.12.a: "Approuver"
sov_economic.12.b: "Refuser"
sov_economic.13.t: "Investissements dans l'industrie des pneus russes"
sov_economic.13.d: "L'industrie des pneus russes est en difficulté et a besoin d'investissements. Le gouvernement est ouvert à notre implication, nous permettant de construire une usine de fabrication avant que les concurrents ne le fassent."
sov_economic.13.a: "Investir"
sov_economic.13.b: "Refuser"
sov_economic.14.t: "Industrie des pneus russes"
sov_economic.14.d: "Le gouvernement a accepté d'investir dans notre industrie des pneus, offrant de nouvelles opportunités pour la croissance et la modernisation."
sov_economic.14.a: "Bonne nouvelle"
sov_economic.15.t: "Industrie des pneus russes"
sov_economic.15.d: "Le gouvernement a refusé d'investir dans notre industrie des pneus, un revers qui pourrait ralentir les progrès et la compétitivité."
sov_economic.15.a: "Décevant"
sov_economic.16.t: "La Russie propose un accord commercial sur les engrais chimiques."
sov_economic.16.d: "La Russie nous a proposé un contrat exclusif pour des engrais chimiques de haute qualité. Accepter cet accord pourrait grandement améliorer nos rendements agricoles, bien que certains puissent remettre en question les implications politiques."
sov_economic.16.a: "Accepter"
sov_economic.16.b: "Refuser pour l'instant"
sov_economic.17.t: "[From.GetName] accepte"
sov_economic.17.d: "Nos négociations avec [From.GetName] ont réussi. Le contrat est signé, et le premier paiement est attendu prochainement. Cela marque une avancée positive."
sov_economic.17.a: "Enfin, une bonne nouvelle."
sov_economic.18.t: "[From.GetName] refuse notre accord."
sov_economic.18.d: "Notre accord avec [From.GetName] a échoué. Nous n'avons reçu aucune réponse, et les perspectives semblent sombres. Nous devons reconsidérer notre approche."
sov_economic.18.a: "Revers frustrant."
sov_economic.19.t: "La Russie propose un accord commercial sur les engrais chimiques."
sov_economic.19.d: "La Russie a proposé un contrat exclusif pour des engrais chimiques de qualité supérieure. Cet accord promet des rendements agricoles plus élevés mais pourrait susciter des préoccupations politiques parmi certains partis."
sov_economic.19.a: "Accepter l'offre."
sov_economic.19.b: "Refuser pour l'instant."
sov_economic.20.t: "[From.GetName] accepte"
sov_economic.20.d: "L'accord avec [From.GetName] a été finalisé. Le contrat est signé et les paiements commenceront bientôt, marquant une réalisation significative."
sov_economic.20.a: "Excellente nouvelle."
sov_economic.21.t: "[From.GetName] refuse notre accord."
sov_economic.21.d: "Les négociations avec [From.GetName] ont stagné sans réponse. L'accord semble mort pour l'instant."
sov_economic.21.a: "Refus décevant."
sov_economic.22.t: "Le scandale de Gazprom"
sov_economic.22.d: "Un scandale impliquant Gazprom a éclaté dans le domaine public via une exposition médiatique. Cela a causé une chute de la valeur des actions de l'entreprise et soulevé des préoccupations concernant sa réputation."
sov_economic.22.a: "Blâmer les médias."
sov_economic.23.t: "Le scandale de Sberbank"
sov_economic.23.d: "Sberbank est impliquée dans un scandale largement relayé par les médias, ce qui a affecté négativement ses prix d'actions et ébranlé la confiance des investisseurs."
sov_economic.23.a: "Encore une attaque des médias."
sov_economic.24.t: "Le scandale de Rosneft"
sov_economic.24.d: "Rosneft fait face à un scandale largement médiatisé, nuisant à la réputation de l'entreprise et provoquant une chute de la valeur de ses actions."
sov_economic.24.a: "Manipulation des médias."
sov_economic.25.t: "Effondrement de la capitalisation des grandes entreprises"
sov_economic.25.d: "Les sanctions contre notre pays ont poussé de nombreux investisseurs étrangers à se retirer des grandes entreprises, entraînant une chute brutale de leur capitalisation boursière."
sov_economic.25.a: "Blâmer les intérêts étrangers."
sov_economic.26.t: "Conséquences de la purge des oligarques"
sov_economic.26.d: "Notre approche stricte envers les oligarques a déclenché de nombreux dossiers criminels, ce qui a eu un impact négatif sur les grandes entreprises, les investisseurs réagissant avec peur et se retirant."
sov_economic.26.a: "Investisseurs insensés."
sov_economic.27.t: "Accident dans une installation de Rosneft"
sov_economic.27.d: "Un accident dans une installation de Rosneft a causé des dommages économiques et environnementaux graves. Les investisseurs se sont empressés de vendre leurs actions, anticipant de lourdes sanctions étatiques."
sov_economic.27.a: "Qui a oublié de fermer la vanne ?"
sov_economic.28.t: "Accident dans une installation de Gazprom"
sov_economic.28.d: "Un incident majeur s'est produit dans une installation de Gazprom, entraînant des retombées économiques et environnementales. Les investisseurs ont rapidement vendu leurs actions, craignant des sanctions gouvernementales."
sov_economic.28.a: "Encore un problème de vanne ?"
sov_economic.29.t: "Fermeture d'un flux de gaz de Gazprom"
sov_economic.29.d: "La nouvelle de la fermeture d'un flux de gaz a durement frappé le marché boursier, provoquant une chute des actions de Gazprom alors que les investisseurs craignent un ralentissement de la croissance et des pertes."
sov_economic.29.a: "Investisseurs à courte vue."
sov_economic.30.t: "Ouverture d'un nouveau flux de gaz"
sov_economic.30.d: "Le marché boursier a ouvert avec une nouvelle positive : les actions de Gazprom ont fortement augmenté suite à l'annonce du lancement d'un nouveau flux de gaz."
sov_economic.30.a: "Excellente nouvelle."
sov_economic.31.t: "Panique de la nationalisation"
sov_economic.31.d: "Des rumeurs concernant une révision de la privatisation des années 1990 ont provoqué une panique parmi les investisseurs, qui ont craint de perdre leurs actifs et ont commencé à vendre leurs actions rapidement."
sov_economic.31.a: "Investisseurs exagérant."
sov_economic.32.t: "Réaction à l'adhésion à l'OMC"
sov_economic.32.d: "Suite à notre entrée officielle dans l'OMC, la Bourse de Moscou a connu une hausse alors que les investisseurs achetaient avec empressement des actions, anticipant une croissance majeure."
sov_economic.32.a: "Fantastique !"
sov_economic.33.t: "Reprise de la Bourse de Moscou"
sov_economic.33.d: "Après une fermeture forcée d'un mois, la Bourse de Moscou a rouvert et les échanges sont revenus à la normale."
sov_economic.33.a: "Bon retour."
sov_economic.34.t: "Privatisation de la centrale de Cuciurgan"
sov_economic.34.d: "Inter RAO, une entreprise russe, prévoit de privatiser notre puissante centrale GRES. Ils promettent d'assurer un fonctionnement continu et des améliorations techniques progressives, ce qui bénéficiera à notre secteur énergétique."
sov_economic.34.a: "Nous sommes d'accord."
sov_economic.34.b: "Nous ne sommes pas d'accord."
sov_economic.35.t: "Privatisation de la centrale de Cuciurgan"
sov_economic.35.d: "Les autorités transnistriennes ont accepté notre proposition de privatisation, augmentant notre influence dans la région."
sov_economic.35.a: "Résultat positif."
sov_economic.36.t: "Privatisation de la centrale de Cuciurgan"
sov_economic.36.d: "De manière inattendue, les autorités transnistriennes ont rejeté notre offre de privatisation. Nous devons accepter leur décision et passer à autre chose."
sov_economic.36.a: "Dommage."
sov_economic.37.t: "Gaz gratuit de Gazprom"
sov_economic.37.d: "La Russie soutient notre indépendance et offre des approvisionnements en gaz gratuits. Cependant, cette générosité a un prix politique attendu, car elle pourrait être utilisée pour influencer nos politiques."
sov_economic.37.a: "Accepter."
sov_economic.37.b: "Refuser."
sov_economic.38.t: "Gaz gratuit pour la Transnistrie"
sov_economic.38.d: "Les autorités transnistriennes ont répondu positivement à notre proposition de gaz gratuit, renforçant notre position dans la région."
sov_economic.38.a: "Bonne nouvelle."
sov_economic.39.t: "Gaz gratuit pour la Transnistrie"
sov_economic.39.d: "Les autorités transnistriennes ont refusé notre offre de gaz gratuit, un revers décevant pour notre influence régionale."
sov_economic.39.a: "Dommage."
sov_economic.40.t: "Destin du réseau social VKontakte"
sov_economic.40.d: "VKontakte a commencé comme un réseau social universitaire mais est devenu la plus grande plateforme de Russie. Nous devons maintenant décider de son avenir alors que son influence sur la société croît rapidement."
sov_economic.40.a: "Laisser son indépendance."
sov_economic.40.b: "Placer VK sous contrôle étatique."
sov_economic.41.t: "Échec de l'initiative des projets nationaux !"
sov_economic.41.d: "Le dernier rapport du ministère de l'Économie révèle que nous n'avons pas atteint les objectifs de nos projets nationaux. Cet échec nuit à la fois à notre réputation internationale et à la confiance intérieure. Comment devons-nous répondre à ce revers ?"
sov_economic.41.o1: "Manipuler les faits ; la stabilité est primordiale."
sov_economic.41.o2: "Admettre l'échec honnêtement."
sov_economic.42.t: "Succès de l'initiative des projets nationaux !"
sov_economic.42.d: "Le ministère de l'Économie rapporte que nous avons atteint les objectifs de nos projets nationaux ! Ce succès démontre la force et la capacité de notre peuple. C'est un moment de fierté pour la Russie."
sov_economic.42.o1: "Nous l'avons fait ! Hourra !"
sov_economic.43.t: "[From.GetName] et MTS"
sov_economic.43.d: "[From.GetName] et notre entreprise MTS ont signé un nouvel accord, nous donnant accès à leur marché. Ce partenariat devrait considérablement augmenter la capitalisation de notre entreprise."
sov_economic.43.a: "Excellent"
sov_economic.44.t: "[From.GetName] et Gazprom"
sov_economic.44.d: "[From.GetName] et Gazprom ont finalisé un accord qui ouvre l'accès à leur marché. Cet accord devrait renforcer notre capitalisation et notre présence sur le marché."
sov_economic.44.a: "Excellent"
sov_economic.45.t: "[From.GetName] et VTB"
sov_economic.45.d: "[From.GetName] et VTB ont signé un accord nous donnant accès au marché via leur réseau, ce qui devrait avoir un impact positif sur notre capitalisation."
sov_economic.45.a: "Excellent"
sov_economic.46.t: "[From.GetName] et Rosneft"
sov_economic.46.d: "[From.GetName] et Rosneft ont conclu un accord qui nous permet d'accéder à leur marché, promettant un effet positif sur notre capitalisation."
sov_economic.46.a: "Excellent"
sov_economic.47.t: "[From.GetName] et Alrosa"
sov_economic.47.d: "[From.GetName] et Alrosa ont signé un accord nous donnant accès au marché via cette entreprise. Cet accord devrait améliorer notre capitalisation."
sov_economic.47.a: "Excellent"

