## 500 Days Program
SOV_500_days_category: "Programme de 500 jours"
SOV_500_days_category_desc: "Le programme de 500 jours était une initiative proposée en 1990 par l'économiste soviétique Stanislav Shatalin et le président de la Commission des réformes économiques Grigory Yavlinskiy. L'objectif principal de ce programme est de passer d'une économie planifiée à un véritable capitalisme de marché en réduisant le rôle de l'État dans l'économie. Malheureusement, ce programme n'a jamais été mis en œuvre car l'establishment soviétique le jugeait trop radical.\nAprès les erreurs de la thérapie de choc de Gaïdar et la mauvaise gestion économique des gouvernements précédents, la situation économique actuelle nous oblige à réessayer et à mettre pleinement en œuvre le programme de 500 jours pour achever la conversion complète vers une économie de marché moderne !"
