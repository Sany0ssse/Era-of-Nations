##Medvedev Branch
SOV_cross_the_rubicon: "Franchir le Rubicon"
SOV_cross_the_rubicon_desc: "Le moment est venu pour le véritable dirigeant de la Russie de prendre le pouvoir. Nous devons agir de manière décisive pour sécuriser l'avenir de notre nation et prendre les rênes de l'histoire."

SOV_tandemokratia: "Tandemokratie"
SOV_tandemokratia_desc: "La tandemokratie fait référence au duumvirat de Poutine et Medvedev. Ensemble, ils gouverneront désormais la Russie comme une force unifiée, combinant leurs forces en un pouvoir unique."

SOV_unlimited_samoderzhaviye: "Samoderzhaviye illimité"
SOV_unlimited_samoderzhaviye_desc: "Nous revenons au principe du Samoderzhaviye – la règle absolue. Avec deux tsars à la barre, notre gouvernance reflète la puissance de l'ancienne autocratie russe."

SOV_establish_new_oligarchate: "Établir un nouvel oligarchat"
SOV_establish_new_oligarchate_desc: "Les oligarques ont longtemps façonné la politique russe. En remplaçant les loyalistes de Poutine par nos propres alliés, nous assurerons une stabilité durable et un soutien fidèle."

SOV_peace_with_the_west: "Paix avec l'Occident"
SOV_peace_with_the_west_desc: "Avec nos affaires internes en mutation, un conflit avec l'Occident n'est pas viable. Pour l'instant, la paix doit prévaloir – jusqu'à ce que le moment soit opportun."

SOV_continue_reformism: "Poursuivre le réformisme"
SOV_continue_reformism_desc: "Les politiques conservatrices de Poutine ont conduit à la stagnation. Notre nouvelle administration revitalisera la Russie à travers des réformes globales et un leadership renouvelé."

SOV_secure_the_FSB: "Sécuriser le FSB"
SOV_secure_the_FSB_desc: "Le FSB reste un bastion de l'influence poutiniste. Une purge est nécessaire pour démanteler ce dernier bastion de l'ancien régime."

SOV_crush_putinism: "Écraser le poutinisme"
SOV_crush_putinism_desc: "Le poutinisme doit être complètement démantelé – ses politiques, ses réseaux, son idéologie. Nous devons le laisser derrière nous pour avancer."

SOV_western_russia: "Nouvelle vague dans un style ancien"
SOV_western_russia_desc: "Bien que le parti au pouvoir ait repris le pouvoir, il est maintenant dirigé par une aile réformiste. Leur objectif est de remodeler le système pour qu'il soit compatible avec des partenariats démocratiques et une coopération occidentale."

SOV_enforce_liberal_values: "Supériorité des valeurs libérales"
SOV_enforce_liberal_values_desc: "Le libéralisme est la base d'une Russie libre et prospère. Nous devons maintenir et propager ces valeurs alors que nous reconstruisons la nation."

SOV_focus_on_economy: "Miracle économique russe"
SOV_focus_on_economy_desc: "L'ère libérale promet une relance économique. En ouvrant les marchés et en mettant en œuvre des réformes, nous inaugurerons une nouvelle ère de prospérité, de paix et de liberté."

SOV_abandon_foreign_policy: "Abandonner la politique étrangère"
SOV_abandon_foreign_policy_desc: "La guerre froide est terminée. Nous ne sommes plus une menace communiste pour l'Occident. Il est temps de mettre de côté les griefs passés et d'embrasser une paix durable."

 SOV_age_of_stability: "Russie stable"
SOV_age_of_stability_desc: "Après des décennies de troubles et d'inégalités, la Russie a trouvé la paix. Avec un réformateur visionnaire à sa tête, nous entrons dans une ère de stabilité durable et d'unité nationale."

SOV_establish_controlled_opposition: "Établir une opposition contrôlée"
SOV_establish_controlled_opposition_desc: "Une opposition contrôlée au sein de la Douma créera l'apparence de la démocratie tout en nous permettant de faire passer des réformes sans entraves."

SOV_special_economic_operation: "Opération économique spéciale"
SOV_special_economic_operation_desc: "La Biélorussie et l'Ukraine doivent comprendre que l'ère poutiniste est terminée. Nous les engagerons par la coopération, et non par la coercition, et reconstruirons les relations sur de nouvelles bases."

SOV_the_iron_dimon: "Règle de fer"
SOV_the_iron_dimon_desc: "Le peuple est fatigué de la faiblesse. Il exige de la force. Un véritable leader – ferme, inflexible et résolu – se lèvera pour répondre à cet appel."

SOV_the_new_dictatorship: "Nouvelle dictature"
SOV_the_new_dictatorship_desc: "Pour consolider notre autorité, nous adopterons la structure et l'efficacité d'une nouvelle dictature, adaptée aux besoins modernes."

SOV_medvedeism: "Medvedéisme"
SOV_medvedeism_desc: "Le poutinisme a échoué pour la nation. Une nouvelle doctrine arrive : le Medvedéisme – conçue pour corriger le passé et guider la Russie vers l'avenir."

SOV_defend_national_interests: "Défendre les intérêts nationaux"
SOV_defend_national_interests_desc: "Avec l'État sécurisé, nous tournerons notre regard vers l'extérieur. Les terres légitimes du peuple russe doivent revenir sous notre protection."

iron_dimon: "Dimon de fer"
pro_western_dima: "Véritable libéral"
russian_duumviri: "Duumvirat russe"
SOV_dimon: "Grande Russie"

sov_medvedev.1.t: "Medvedev prend le pouvoir à Poutine !"
sov_medvedev.1.d: "Initialement placé au pouvoir pour contourner les limites de mandats présidentiels, Dmitri Medvedev s'est maintenant affranchi de l'ombre de Poutine. Avec son rival écarté, Medvedev se tient seul à la barre du pouvoir russe. Un nouveau chapitre de l'histoire russe commence."
sov_medvedev.1.a: "Notre avenir est incertain."

