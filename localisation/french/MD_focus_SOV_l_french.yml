SOV_alpha_idea_desc: "Unité spéciale du Centre des opérations spéciales du Service fédéral de sécurité de la Fédération de Russie. Les principales tâches du Département A sont la mise en œuvre d'opérations de sécurité spéciales pour prévenir les actes terroristes, rechercher, neutraliser ou éliminer les terroristes, libérer des otages, etc. De plus, les combattants du groupe Alpha sont également impliqués dans d'autres opérations du FSB de Russie de complexité spéciale et accrue, et opèrent également dans les 'points chauds'."
