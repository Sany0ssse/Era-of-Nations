 ###########Ideas###########
 SOV_russian_government_idea: "Le gouvernement russe"
 SOV_russian_government_idea_desc: "La situation politique de la Russie a toujours été instable, en particulier après l'effondrement de l'URSS, car de nombreux facteurs politiques tels que le séparatisme interne, l'instabilité politique et l'apathie de la population envers le destin de l'État peuvent jouer un rôle."
