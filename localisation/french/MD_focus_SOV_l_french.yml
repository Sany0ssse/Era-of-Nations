##Communist Events
sov_communists.1.t: "Interdiction de la propriété privée"
sov_communists.1.d: "Après une série de lois anti-bourgeoises adoptées par notre gouvernement, nous avons enfin atteint l'étape finale de l'élimination du capitalisme sur le sol russe. Comme nos glorieux camarades l'ont fait dans les années 1920, nous allons maintenant interdire la propriété privée. La seule question qui reste est jusqu'où ira cette confiscation — sera-t-elle totale, modérée ou sélective ?"
sov_communists.1.a: "La confiscation totale a fonctionné à l'époque et fonctionnera maintenant !"
sov_communists.1.b: "Soyons un peu plus modérés."
sov_communists.1.c: "Exproprier uniquement les grandes industries."

sov_communists.2.t: "Constitution national-communiste"
sov_communists.2.d: "Avec l'alignement du NPA et du CPRF, nous sommes maintenant prêts à rédiger une nouvelle constitution. La question est de savoir si notre fondation idéologique doit pencher vers un communisme internationaliste ou vers une voie plus nationaliste et isolationniste. Notre direction future est en jeu."
sov_communists.2.a: "Nous devons être fiers d'être Russes !"
sov_communists.2.b: "Nous ne devons pas oublier notre idéologie principale."

sov_communists.3.t: "Constitution démocratique"
sov_communists.3.d: "Nous avons hérité de certaines des idées les plus prometteuses de nos leaders idéologiques de l'ère de la perestroïka. Pour construire un avenir plus lumineux et plus libre, nous devons réécrire notre constitution. Mais devons-nous l'orienter vers une structure plus libérale, ou maintenir le cœur de notre idéologie dominante ?"
sov_communists.3.a: "Nous devons préserver les idées de Gorbatchev !"
sov_communists.3.b: "Nous ne devons pas oublier notre idéologie principale."

sov_communists.4.t: "Constitution du parti communiste"
sov_communists.4.d: "Avec le pouvoir absolu désormais entre les mains du Parti, nous pouvons enfin réécrire la constitution selon nos valeurs. Cependant, des factions idéologiques ont émergé dans nos rangs, et nous devons décider quelle faction donnera le ton à notre véritable constitution soviétique."
sov_communists.4.a: "Bien sûr, nous avons besoin des staliniens."
sov_communists.4.b: "Nous avons besoin d'une montée plus modérée."

sov_communists.5.t: "Reconstruction des monuments militaires soviétiques"
sov_communists.5.d: "À travers notre vaste pays, des milliers de monuments de la Grande Guerre patriotique sont en ruine. Il est de notre devoir de les restaurer pour honorer nos héros tombés. Nous devons également envisager de construire de nouveaux monuments pour s'assurer que les générations futures n'oublient jamais les sacrifices et la gloire de notre peuple."
sov_communists.5.a: "Qu'ils soient plus empreints de deuil."
sov_communists.5.b: "Ils doivent glorifier notre héroïsme !"

sov_communists.6.t: "Restalinisation"
sov_communists.6.d: "Les Khrouchtchéviens n'ont pas réussi à préserver l'héritage de notre plus grand leader. Il est temps de corriger cela. Nous devons décider jusqu'où nous voulons aller dans le renommage de nos villes en l'honneur de Staline et du passé soviétique."
sov_communists.6.a: "Conserver les options historiques."
sov_communists.6.b: "Aller à fond dans le stalinisme !"
