SOV_jreci_1_tooltip: "Enfin, un gouvernement est arrivé au pouvoir en §Y[SOV.GetNameWithFlag]§! qui connaît la véritable vérité sur la conspiration des £text_icon_jreci §0prêtres égyptiens§! et du £text_icon_corrector §0Correcteur Prédicteur§!.\n"
SOV_jreci_2_tooltip: "Chaque militaire russe doit suivre une formation pour savoir contre qui se battre à l'avenir. Contre les serviteurs du £text_icon_corrector §0Correcteur Prédicteur§!.\n"
SOV_jreci_3_tooltip: "Chaque député, fonctionnaire et autre gestionnaire régional suivra un cours théorique spécial sur la lutte contre les agents des £text_icon_jreci §0prêtres égyptiens§!.\n"
SOV_jreci_4_tooltip: "§tLes oligarchs§! sont les véritables agents des £text_icon_jreci §0prêtres égyptiens§! envoyés par le £text_icon_corrector §0Correcteur Prédicteur§! pour l'effondrement de la Russie. Nous allons mettre fin à cela.\n"
SOV_jreci_5_tooltip: "§tUne nouvelle religion§! est la clé de la victoire dans la guerre contre les serviteurs du £text_icon_corrector §0Correcteur Prédicteur§!.\n"
SOV_jreci_6_tooltip: "§tLa propagande sur Internet§! commencera enfin à montrer la véritable vérité à nos citoyens, que les £text_icon_jreci §0prêtres égyptiens§! leur ont cachée.\n"
SOV_jreci_7_tooltip: "Tout ce dont nous avons besoin, c'est la §tvérité !§!.\n"
SOV_jreci_8_tooltip: "Pour vaincre le £text_icon_corrector §0Correcteur du Correcteur§!, nous devons dominer non seulement dans les airs et sur terre. Nous devons devenir les maîtres du cosmos !.\n"
SOV_jreci_9_tooltip: "Les véritables guerriers russes sont les §tVityazi§!. C'est cet ordre que nous recréerons pour préparer une armée sacrée contre nos ennemis.\n"
SOV_jreci_10_tooltip: "§tLe bolchevisme§! est aussi naturel pour une personne russe que le désir de justice et de paix.\n"
SOV_jreci_11_tooltip: "Réécrivons la constitution et supprimons tout ce que les £text_icon_jreci §0prêtres égyptiens§! nous ont forcés à y écrire.\n"
SOV_jreci_12_tooltip: "Staline était un §thomme sage§!, ce sont ses méthodes qui ont retardé la conquête de la Russie par le £text_icon_corrector §0Correcteur Prédicteur§!, il est temps de se souvenir des anciennes méthodes.\n"
SOV_jreci_13_tooltip: "Le livre §tEau morte§! est une lecture obligatoire pour chaque Russe \n"
SOV_jreci_14_tooltip: "Il est temps de chercher les £text_icon_jreci §0prêtres égyptiens§! dans la Mère Russie, ensuite nous libérerons le monde entier d'eux \n"
SOV_jreci_15_tooltip: "Les agents occidentaux du £text_icon_corrector §0Correcteur Prédicteur§! seront détruits ou expulsés de notre Russie \n"
SOV_jreci_16_tooltip: "Debout, Russe ! À bas les chaînes des £text_icon_jreci §0prêtres égyptiens§!\n"
