###########Events###########
sov_gru.1.t: "La Russie souhaite envoyer le GRU dans notre pays"
sov_gru.1.d: "Les services de renseignement russes ont proposé d'envoyer des instructeurs et des spécialistes de combat du GRU pour soutenir notre pays."
sov_gru.1.a: "Nous acceptons"
sov_gru.1.b: "Nous n'en avons pas besoin"
sov_gru.2.t: "[FROM.GetNameWithFlag] a accepté l'envoi de notre GRU"
sov_gru.2.d: "Leur gouvernement a accepté que nos opérateurs du GRU participent à leurs opérations militaires. Nous sommes prêts à fournir un soutien complet."
sov_gru.2.a: "Bien"
sov_gru.3.t: "[FROM.GetNameWithFlag] a refusé notre GRU"
sov_gru.3.d: "Leur gouvernement a rejeté l'implication de nos forces spéciales, considérant cela comme trop intrusif dans leur système politique."
sov_gru.3.a: "Faibles"
sov_gru.4.t: "Retour des agents du GRU"
sov_gru.4.d: "Les officiers du GRU sont revenus de leur mission et sont prêts à continuer de servir la patrie."
sov_gru.4.a: "Bon"
sov_gru.5.t: "Création du Centre E"
sov_gru.5.d: "Nous établirons un nouveau département du FSB axé sur la lutte contre les activités d'opposition, en particulier celles des groupes pro-occidentaux."
sov_gru.5.a: "Bien"
sov_gru.6.t: "La Russie propose l'assistance des PMC Wagner"
sov_gru.6.d: "Les canaux diplomatiques russes ont offert d'envoyer un contingent de PMC Wagner pour nous soutenir dans la situation actuelle."
sov_gru.6.a: "Nous acceptons"
sov_gru.6.b: "Nous n'en avons pas besoin"
sov_gru.7.t: "[FROM.GetNameWithFlag] a accepté l'aide des PMC Wagner"
sov_gru.7.d: "Leur gouvernement a accepté notre offre d'assistance des PMC Wagner. Nos combattants se déploient pour une nouvelle mission."
sov_gru.7.a: "Bien"
sov_gru.8.t: "[FROM.GetNameWithFlag] a refusé l'aide des PMC Wagner"
sov_gru.8.d: "Leur gouvernement a refusé l'assistance des PMC Wagner, apparemment convaincu de pouvoir gérer seul."
sov_gru.8.a: "Faibles"
sov_gru.9.t: "Retour des PMC Wagner"
sov_gru.9.d: "Les combattants des PMC Wagner ont terminé leur mission et rentrent chez eux."
sov_gru.9.a: "Bien"
sov_gru.10.t: "La Russie propose à nouveau l'assistance des PMC Wagner"
sov_gru.10.d: "Les canaux diplomatiques russes ont de nouveau offert le soutien des PMC Wagner pour nous aider à gérer la situation."
sov_gru.10.a: "Nous acceptons"
sov_gru.10.b: "Nous n'en avons pas besoin"
sov_gru.11.t: "[FROM.GetNameWithFlag] a accepté l'aide des PMC Wagner"
sov_gru.11.d: "Leur gouvernement a accepté de recevoir l'assistance des PMC Wagner. Nos combattants se déploient à nouveau."
sov_gru.11.a: "Bien"
sov_gru.12.t: "[FROM.GetNameWithFlag] a refusé l'aide des PMC Wagner"
sov_gru.12.d: "Leur gouvernement a décliné l'aide des PMC Wagner, confiant dans ses propres capacités."
sov_gru.12.a: "Faibles"
sov_gru.13.t: "Retour des PMC Wagner"
sov_gru.13.d: "Les combattants des PMC Wagner ont terminé leur mission et rentrent chez eux."
sov_gru.13.a: "Bien"

##########LIBERALS TREE##########
##########Focuses##########
SOV_new_russia: "Nouvelle Russie"
SOV_new_russia_desc: "Il est temps pour la Russie de choisir une nouvelle direction, un chemin qu'elle suit depuis des siècles."
SOV_release_prisoners: "Libérer les prisonniers politiques"
SOV_release_prisoners_desc: "Les prisonniers politiques n'ont pas leur place dans notre magnifique pays. Nous devons leur accorder la liberté."
SOV_true_federalism: "Véritable fédéralisme"
SOV_true_federalism_desc: "Il est temps de mettre fin au faux fédéralisme imposé dans les années 1990. Nous restaurerons une véritable autonomie aux régions."
SOV_rework_constituion: "Référendum démocratique constitutionnel"
SOV_rework_constituion_desc: "Nous entreprendrons une réforme complète de la constitution, en mettant particulièrement l'accent sur les droits et les interactions des sujets fédéraux."
SOV_russia_good: "Pays uni et intègre"
SOV_russia_good_desc: "Le référendum a confirmé que notre peuple ne souhaite pas changer l'intégrité territoriale de la Russie."
SOV_true_federalism: "Référendum des sujets de la Russie"
SOV_referendum_start_desc: "Chaque sujet fédéral organisera son propre référendum pour décider s'il reste dans la Russie ou devient indépendant."
SOV_return_arms_subject: "Ramener les sujets par la force"
SOV_return_arms_subject_desc: "Nous ne reconnaissons pas leur désir de sécession et utiliserons la force pour les ramener."
SOV_subject_guarantee: "Garantir l'indépendance"
SOV_subject_guarantee_desc: "Nous respecterons leur indépendance et la garantirons officiellement."
SOV_usr: "États-Unis de Russie"
SOV_usr_desc: "Inspirés par le succès des États-Unis, nous réformerons notre système pour qu'il ressemble davantage au leur."
SOV_new_establishment: "Le nouvel établissement"
SOV_new_establishment_desc: "Les nouvelles républiques nécessiteront un nouveau leadership pour défendre leurs intérêts au sein de l'État russe."
SOV_good_federalism: "Fédéralisme réussi"
SOV_good_federalism_desc: "Notre système fédéral a mûri, bénéficiant à la fois au gouvernement central et à ses sujets constituants."
SOV_federal_police: "Police fédérale"
SOV_federal_police_desc: "Nous réformerons la police en la divisant en forces fédérales et régionales, donnant plus de pouvoir aux régions et réduisant la pression sur le budget central."
SOV_federation_army: "Armée fédérale"
SOV_federation_army_desc: "Avec de nombreuses entités capables de lever leurs propres unités, le fardeau de l'armée fédérale sera considérablement réduit."
SOV_no_taxes_subjects: "Supprimer les taxes fédérales"
SOV_no_taxes_subjects_desc: "Nous éliminerons les taxes fédérales sur les sujets, allégeant leur fardeau financier et stimulant les économies locales."
SOV_cis_return: "La seconde chance de la CEI"
SOV_cis_return_desc: "Malgré les échecs passés, nous avons l'intention de relancer la CEI en tant qu'union d'États post-soviétiques libres."
SOV_cis_reform: "Négociations sur les réformes"
SOV_cis_reform_desc: "La CEI a besoin de réformes si nous voulons éviter de répéter les erreurs passées et assurer un succès à long terme."
SOV_cis_interstate_bank: "Contacter de nouveaux membres"
SOV_cis_interstate_bank_desc: "Certains pays ont quitté la CEI et ne se considèrent plus comme membres. Nous prévoyons de les ramener."
SOV_cis_scientific_cooperation: "Nouveaux membres de la CEI"
SOV_cis_scientific_cooperation_desc: "La CEI doit croître en incluant chaque ancienne république soviétique pour renforcer l'union."
SOV_cis_unity_state: "Confédération de la CEI"
SOV_cis_unity_state_desc: "Initialement conçue comme une confédération, nous visons à réintroduire ce projet à tous les membres de la CEI, malgré les risques possibles."
SOV_cis_military_forces: "Forces armées de la CEI"
SOV_cis_military_forces_desc: "La CEI doit disposer d'une force militaire moderne et puissante, et nous sommes déterminés à la relancer."

##Kasyanov Branch
SOV_parnas: "PARNAS"
SOV_parnas_desc: "Le Parti de la liberté du peuple (PARNAS) est un parti politique libéral-démocrate et l'un des premiers partis d'opposition fondés à la fin de l'époque soviétique."
SOV_kasyanov: "Mikhaïl Kasyanov"
SOV_kasyanov_desc: "Mikhaïl Mikhaïlovitch Kasyanov (né le 8 décembre 1957) est un homme d'État et politicien russe, actuellement président du Parti de la liberté du peuple."
SOV_from_center_to_regions: "Du centre aux régions"
SOV_from_center_to_regions_desc: "Nous croyons que la véritable prospérité économique dépend de l'autonomisation politique, économique et administrative des régions et des municipalités."
SOV_eliminate_FSS: "Éliminer le FSS"
SOV_eliminate_FSS_desc: "Transformer le FSS en un Service fédéral de contre-espionnage en supprimant les rôles d'enquête et de lutte contre la corruption, et en excluant le Service de communications gouvernementales et les troupes frontalières."
SOV_demilitarize_mia: "Démilitariser le ministère de l'Intérieur"
SOV_demilitarize_mia_desc: "Retirer les troupes internes du ministère de l'Intérieur et établir une Garde nationale populaire sous la supervision du président et du parlement, interdisant l'utilisation de l'OMON contre les manifestations pacifiques."
SOV_reduce_taxes_on_small_businesses: "Réduire les taxes sur les petites entreprises"
SOV_reduce_taxes_on_small_businesses_desc: "Réduire les taxes sur les petites entreprises est essentiel pour stimuler notre économie et favoriser la croissance."
SOV_ease_administrative_pressure: "Alléger la pression administrative"
SOV_ease_administrative_pressure_desc: "La pression administrative sur les régions augmente, et nous devons agir pour arrêter et inverser cette tendance."
SOV_kasyanov_economic_reform: "Réformes économiques à grande échelle"
SOV_kasyanov_economic_reform_desc: "Malgré des ressources abondantes, notre économie stagne. Nous supprimerons les restrictions gouvernementales précédentes et relancerons la croissance."
SOV_kasyanov_infrastructure: "Programme d'infrastructure à grande échelle"
SOV_kasyanov_infrastructure_desc: "Notre infrastructure est en mauvais état. Nous devons lancer un programme fédéral pour la moderniser de toute urgence."
SOV_kasyanov_human_capital: "Capital humain"
SOV_kasyanov_human_capital_desc: "Les citoyens sont la base de l'État, et nous investirons massivement dans leur bien-être et leur développement."
SOV_kasyanov_far_east: "Programme fédéral pour l'Extrême-Orient"
SOV_kasyanov_far_east_desc: "L'Extrême-Orient nécessite des investissements sérieux. Nous créerons un programme fédéral dédié pour développer la région."
SOV_kasyanov_militia: "Investissements dans l'agriculture"
SOV_kasyanov_militia_desc: "Les agriculteurs doivent se sentir protégés financièrement et juridiquement. Nous mettrons en œuvre des réformes pour améliorer l'agriculture privée."
SOV_kasyanov_konkurentsia: "Plus de pouvoirs antimonopoles"
SOV_kasyanov_konkurentsia_desc: "Le Service fédéral antimonopole obtiendra des pouvoirs renforcés pour lutter contre les activités illégales sur le marché."
SOV_political_reforms: "Réforme politique à grande échelle"
SOV_political_reforms_desc: "Notre système politique a besoin d'un changement fondamental. Nous commencerons des réformes pour mettre fin au contrôle totalitaire et revitaliser la vie politique."
SOV_anti_corruption_agency: "Agence anti-corruption"
SOV_anti_corruption_agency_desc: "La corruption est enracinée dans le pouvoir. Un programme national vigoureux de lutte contre la corruption impliquant tous les citoyens est essentiel."
SOV_adhere_to_nato_policy: "Adhérer à la politique de l'OTAN"
SOV_adhere_to_nato_policy_desc: "La coopération avec l'OTAN promeut la sécurité, la stabilité et la compréhension mutuelle. Elle maintient l'influence de la Russie et équilibre les intérêts mondiaux."
SOV_establishment_of_free_independent_alliance: "Établissement d'une alliance libre et indépendante"
SOV_establishment_of_free_independent_alliance_desc: "Nous devons rétablir des liens diplomatiques avec tous les États post-soviétiques et éventuellement former une union pour un développement économique et militaire commun."
SOV_new_union_treaty: "Adhésion à une alliance libre et indépendante"
SOV_new_union_treaty_desc: "Avec notre alliance établie, nous inviterons toutes les anciennes républiques soviétiques à rejoindre et défendre la démocratie ensemble."
SOV_membership_subjects: "Adhésion des sujets"
SOV_membership_subjects_desc: "Notre alliance est incomplète sans la participation des sujets de notre fédération."
SOV_membership_east: "Adhésion de l'Est"
SOV_membership_east_desc: "Inviter les pays de l'Est renforcera notre alliance avec leurs ressources, leurs économies et leurs capacités militaires, améliorant notre défense et la protection de la démocratie."
SOV_membership_pribalt: "Adhésion des pays baltes"
SOV_membership_pribalt_desc: "Inclure les États baltes offre un accès stratégique à la mer Baltique et renforce la puissance industrielle et technologique. Sans eux, notre alliance risque de perdre un territoire clé et des alliés."
SOV_membership_caucasus: "Adhésion du Caucase"
SOV_membership_caucasus_desc: "Le Caucase apporte des ressources stratégiques et une importance géopolitique. Les exclure risque d'affaiblir notre influence régionale et la stabilité démocratique."
 SOV_membership_ces: "Adhésion à l'EAC"
 SOV_membership_ces_desc: "Les ressources et la position de l'Asie centrale sont vitales. Leur inclusion élargira les marchés, renforcera la sécurité et augmentera notre influence régionale."
 SOV_free_economic_zone: "Zone Économique Spéciale"
 SOV_free_economic_zone_desc: "Nous devrions transformer Kaliningrad en une zone économique spéciale, servant de pont de coopération entre la Russie et l'UE."
 SOV_transfer_state_shares_to_pension_funds: "Transfert des parts de l'État aux fonds de pension"
 SOV_transfer_state_shares_to_pension_funds_desc: "Pour améliorer le niveau de vie et la longévité des citoyens, les parts détenues par l'État seront transférées au Fonds de Pension Russe avec des restrictions de vote."
 ##########Ideas##########
 SOV_kasyanov_political: "Grande Russie Démocratique"
 SOV_kasyanov_happy_farmers_idea: "Soutien gouvernemental aux agriculteurs"
 SOV_kasyanov_fas: "Service Fédéral Antimonopole"
 SOV_kasyanov_anti_corruption_agency: "Agence indépendante de lutte contre la corruption"
 ##########Events##########
 sov_liberals.1.t: "Réformes accomplies !"
 sov_liberals.1.d: "Nous avons réussi à réformer notre système économique en seulement 500 jours ! C'est une réussite majeure, qui surpasse ce que Gaïdar et Eltsine ont pu accomplir. Nous devons maintenant maintenir une croissance régulière et améliorer le bien-être de nos citoyens."
 sov_liberals.1.o1: "Célébrons ça !"
 sov_liberals.2.t: "Réformes échouées !"
 sov_liberals.2.d: "Nos efforts de réforme ont échoué. Nous n'avons pas pu créer le miracle économique que nous espérions. Nous devons maintenant nous préparer au pire, et faire face à un déclin économique qui rappellera les années 1990."
 sov_liberals.2.o1: "Oh non..."
 sov_liberals.2.o2: "Oh non..."
 sov_liberals.2.o3: "Oh non..."
 sov_liberals.3.t: "Le grand référendum démocratique russe"
 sov_liberals.3.d: "Le moment est venu de décider de l'avenir de la structure étatique et territoriale de la Russie. Un référendum national révélera enfin la vision du peuple quant à l'avenir territorial de notre pays."
 sov_liberals.3.o1: "C'est au peuple de décider du destin du pays."
 sov_liberals.4.t: "[FROM.GetNameWithFlag] nous invite à une alliance"
 sov_liberals.4.d: "[FROM.GetNameWithFlag] nous invite à rejoindre leur Alliance Indépendante Libre, visant à défendre la démocratie dans l'ancienne Union Soviétique et au-delà. Ensemble, nous pouvons renforcer notre défense, développer nos économies et accroître notre influence géopolitique. Refuser signifierait manquer un soutien crucial en cas de conflit et rester isolés. Le choix nous appartient : nous unir et coopérer ou faire cavalier seul."
 sov_liberals.4.a: "Nous acceptons leur offre"
 sov_liberals.4.b: "Ce n'est pas le bon moment"
 sov_liberals.5.t: "[FROM.GetNameWithFlag] accepte de rejoindre notre alliance"
 sov_liberals.5.d: "[FROM.GetNameWithFlag] a accepté notre invitation à rejoindre l'Alliance Indépendante Libre ! Ils sont maintenant sous notre protection."
 sov_liberals.5.a: "Excellent !"
 sov_liberals.6.t: "[FROM.GetNameWithFlag] a refusé de rejoindre notre alliance"
 sov_liberals.6.d: "[FROM.GetNameWithFlag] a décliné notre invitation à l'Alliance Indépendante Libre."
 sov_liberals.6.a: "C'est leur choix."
 sov_liberals.6.b: "Nous ne laisserons pas ça passer, nous agirons par la force !"
 sov_liberals.7.t: "[FROM.GetNameWithFlag] nous invite à une alliance"
 sov_liberals.7.d: "[FROM.GetNameWithFlag] nous invite à rejoindre leur Alliance Indépendante Libre pour défendre la démocratie dans l'espace post-soviétique et au-delà. Nous unir renforcera notre défense, notre économie et notre influence mondiale. Refuser nous expose au risque d'être isolés en cas de conflit."
 sov_liberals.7.a: "Nous acceptons"
 sov_liberals.7.b: "Nous ne pouvons pas pour le moment"
 sov_liberals.8.t: "[FROM.GetNameWithFlag] nous invite à une alliance"
 sov_liberals.8.d: "[FROM.GetNameWithFlag] nous invite à rejoindre leur Alliance Indépendante Libre, visant à protéger la démocratie dans l'ancienne Union Soviétique et dans le monde entier. Ensemble, nous pouvons renforcer notre défense, développer notre économie et étendre notre influence. Décliner nous fait courir le risque de perdre des alliés en cas de conflit."
 sov_liberals.8.a: "Nous acceptons"
 sov_liberals.8.b: "Pas maintenant"
 sov_liberals.9.t: "[FROM.GetNameWithFlag] nous invite à une alliance"
 sov_liberals.9.d: "[FROM.GetNameWithFlag] nous invite à rejoindre leur Alliance Indépendante Libre, dédiée à la défense de la démocratie dans la région post-soviétique et au-delà. La coopération promet un renforcement de la défense, une croissance économique et une influence géopolitique accrue. Refuser pourrait nous laisser isolés."
 sov_liberals.9.a: "Nous acceptons"
 sov_liberals.9.b: "Nous devons décliner pour le moment"
 sov_liberals.10.t: "[FROM.GetNameWithFlag] nous invite à une alliance"
 sov_liberals.10.d: "[FROM.GetNameWithFlag] nous invite à rejoindre leur Alliance Indépendante Libre pour défendre la démocratie dans l'ancienne Union Soviétique et dans le monde entier. Adhérer renforcera notre défense, notre développement économique et notre position mondiale. Décliner nous ferait perdre un soutien crucial."
 sov_liberals.10.a: "Nous acceptons"
 sov_liberals.10.b: "Nous déclinons pour le moment"
 sov_liberals.11.t: "[FROM.GetNameWithFlag] nous invite à la CEI"
 sov_liberals.11.d: "[FROM.GetNameWithFlag] tente une fois de plus de relancer la CEI et nous invite à la rejoindre. Avec un leadership plus démocratique, la CEI pourrait devenir une véritable union d'États indépendants au lieu d'un outil d'influence pour Moscou."
 sov_liberals.11.a: "Nous acceptons de la rejoindre"
 sov_liberals.11.b: "Non"
 sov_liberals.12.t: "[FROM.GetNameWithFlag] a accepté de rejoindre la CEI"
 sov_liberals.12.d: "[FROM.GetNameWithFlag] a accepté notre invitation à rejoindre la CEI, ce qui renforce notre position et montre que le projet est toujours d'actualité."
 sov_liberals.12.a: "Bien"
 sov_liberals.13.t: "[FROM.GetNameWithFlag] a refusé de rejoindre la CEI"
 sov_liberals.13.d: "[FROM.GetNameWithFlag] a décliné notre offre, montrant peu d'intérêt pour la coopération au sein de l'espace post-soviétique."
 sov_liberals.13.a: "Malheureux"
 sov_liberals.14.t: "[FROM.GetNameWithFlag] propose de créer une Confédération de la CEI"
 sov_liberals.14.d: "[FROM.GetNameWithFlag] suggère d'élargir la CEI en une Confédération, restaurant partiellement sa forme des années 1990. Bien que cela offre des avantages, cela risque aussi de nous faire perdre en autonomie, car Moscou regagnerait un plus grand contrôle."
 sov_liberals.14.a: "Nous acceptons"
 sov_liberals.14.b: "Non"
 sov_liberals.15.t: "[FROM.GetNameWithFlag] est devenu membre de la Confédération de la CEI"
 sov_liberals.15.d: "[FROM.GetNameWithFlag] a signé pour rejoindre la Confédération de la CEI avec nous, nous rapprochant d'un état quasi-unifié et faisant du déclin des années 1990 un lointain souvenir."
 sov_liberals.15.a: "Bien"
 sov_liberals.16.t: "[FROM.GetNameWithFlag] a refusé de devenir membre de la Confédération de la CEI"
 sov_liberals.16.d: "[FROM.GetNameWithFlag] a rejeté l'accord de la Confédération de la CEI et, scandalisé par la perte de souveraineté, s'est immédiatement retiré de la CEI."
 sov_liberals.16.a: "Malheureux"
 sov_liberals.17.t: "[FROM.GetNameWithFlag] propose la création des forces armées de la CEI"
 sov_liberals.17.d: "[FROM.GetNameWithFlag] souhaite relancer les forces armées de la CEI pour une meilleure coordination entre les États membres. Cela augmenterait notre puissance militaire, mais aussi l'influence de la Russie."
 sov_liberals.17.a: "Nous acceptons"
 sov_liberals.17.b: "Non"
 sov_liberals.18.t: "[FROM.GetNameWithFlag] accepte de participer aux forces armées de la CEI"
 sov_liberals.18.d: "[FROM.GetNameWithFlag] a accepté de rejoindre les forces armées de la CEI, ce qui renforce considérablement la puissance militaire de l'union."
 sov_liberals.18.a: "Bien"
 sov_liberals.19.t: "[FROM.GetNameWithFlag] a refusé de participer aux forces armées de la CEI"
 sov_liberals.19.d: "[FROM.GetNameWithFlag] a décliné de rejoindre les forces armées relancées de la CEI, considérant que leur composition actuelle est suffisante."
 sov_liberals.19.a: "Malheureux"
 sov_liberals.20.t: "Notre destin au sein de la CEI"
 sov_liberals.20.d: "Avec le changement de pouvoir en Russie, le nouveau gouvernement ne respecte plus les valeurs démocratiques du passé. Nous devons maintenant décider si nous restons dans la CEI."
 sov_liberals.20.a: "Nous restons"
 sov_liberals.20.b: "Nous partons"
 sov_liberals.21.t: "[FROM.GetNameWithFlag] quitte la CEI"
 sov_liberals.21.d: "[FROM.GetNameWithFlag] est en désaccord avec le nouveau gouvernement et les politiques de la Russie, et a signé un décret pour se retirer de la CEI et de ses structures."
 sov_liberals.21.a: "Malheureux"
 sov_liberals.22.t: "[FROM.GetNameWithFlag] propose des investissements à Kaliningrad"
 sov_liberals.22.d: "[FROM.GetNameWithFlag] a changé sa politique envers Kaliningrad, l'ouvrant aux investissements étrangers et proposant une collaboration."
 sov_liberals.22.a: "Nous acceptons"
 sov_liberals.22.b: "Non"
 sov_liberals.23.t: "[FROM.GetNameWithFlag] a accepté d'investir dans la région de Kaliningrad"
 sov_liberals.23.d: "[FROM.GetNameWithFlag] a accepté notre proposition d'investissement et se prépare à finaliser l'accord."
 sov_liberals.23.a: "Excellent"
 sov_liberals.24.t: "[FROM.GetNameWithFlag] a refusé d'investir dans la région de Kaliningrad"
 sov_liberals.24.d: "[FROM.GetNameWithFlag] a décliné notre offre d'investissement, n'y voyant apparemment aucun bénéfice pour lui-même."
 sov_liberals.24.a: "Malheureux"
 sov_liberals.25.t: "Résultats des investissements dans la région de Kaliningrad"
 sov_liberals.25.d: "Nous avons approché plusieurs pays européens avec des propositions d'investissement pour Kaliningrad, et les résultats sont prometteurs."
 sov_liberals.25.a: "D'accord"
 sov_liberals.26.t: "Le développement de l'Extrême-Orient - la deuxième étape"
 sov_liberals.26.d: "Notre programme de développement de l'Extrême-Orient se poursuit alors que nous annonçons la prochaine étape de financement pour la croissance de la région."
 sov_liberals.26.a: "Bien"
 sov_liberals.27.t: "Le destin de la Géorgie"
 sov_liberals.27.d: "La Géorgie reste un défi dans le Caucase. Nous devons décider comment gérer nos relations avec ce pays."
 sov_liberals.27.a: "Marchons sur Tbilissi"
 sov_liberals.27.b: "Les relations pacifiques restent notre priorité"
 sov_liberals.28.t: "L'opération 'Doux Cadeaux' a été menée avec succès"
 sov_liberals.28.d: "Nous avons mis au jour et démantelé le plus grand réseau de corruption du pays, arrêtant des oligarques de premier plan et des députés. Notre principale tâche est maintenant de maintenir ce nouvel ordre."
 sov_liberals.28.a: "La Fondation Anti-Corruption a rempli sa mission"
 sov_liberals.29.t: "Boris Nemtsov est tué !"
 sov_liberals.29.d: "Boris Nemtsov a été assassiné le 27 février 2015, près du pont Bolchoï Moskvoretsky à Moscou, alors qu'il marchait avec le mannequin ukrainien Anna Duritskaya. Les agresseurs connaissaient son itinéraire et ont tiré six coups de feu par derrière, touchant des organes vitaux. Les tueurs ont fui dans une voiture blanche. Plusieurs suspects ont été condamnés à des peines de prison allant de 11 à 20 ans. Le commanditaire reste inconnu."
 sov_liberals.29.a: "C'est noté"
 sov_liberals.30.t: "L'héritage d'Eltsine"
 sov_liberals.30.d: "Après l'effondrement de l'Union Soviétique, Boris Eltsine, un dirigeant tourmenté, a présidé à des temps difficiles : la dissolution du Conseil Suprême, les guerres de Tchétchénie, les crises économiques et les réformes ratées. La Russie a ensuite cherché la stabilité sous un nouveau dirigeant qui a promis ordre et croissance. Le système politique s'est transformé, consolidant la nation après la tourmente. L'avenir reste incertain."
 sov_liberals.30.a: "Gardons un œil sur la situation."
 sov_liberals.31.t: "Mort d'Eltsine"
 sov_liberals.31.d: "RIA a rapporté que Boris Eltsine, le premier président de la Russie indépendante, est décédé après une longue bataille contre une maladie cardiaque. Une minute de silence a été observée à l'université qui porte son nom, et de nombreux dirigeants occidentaux ont envoyé leurs condoléances."
 sov_liberals.31.a: "Repose en paix, combattant de la liberté."
 sov_liberals.31.b: "Repose en paix."
 sov_liberals_news.1.t: "Le grand référendum démocratique russe"
 sov_liberals_news.1.d: "Un référendum historique sur l'avenir territorial de la Russie a eu lieu. Les frontières internes ont radicalement changé, choquant beaucoup de gens, car les citoyens ordinaires ont eu le pouvoir de décider du destin du pays."
 sov_liberals_news.1.a: "Est-ce une vraie démocratie ?"
 ##########Tooltips##########
 SOV_great_democratic_referendum_tt: "Les résultats du §Yréférendum§! dépendent de l'état de l'£text_icon_sov_empire §Yhéritage russe§!. Plus l'£text_icon_sov_empire §Yhéritage russe§! penche vers la £text_icon_sov_democratic §2démocratie§!, plus les chances d'un changement de la structure territoriale du pays sont élevées à la suite du §Yréférendum§!."
 SOV_system_democratic_referendum_tt: "Le §Ysystème politique§! choisi influencera les résultats du §Yprochain référendum§!."
 SOV_from_center_TT: "Débloque les décisions de §YDu centre vers les régions !§!"
 SOV_FSS_TT: "Le §YService Fédéral de Sécurité sera transformé en Service Fédéral de Contre-espionnage§!."
 SOV_subjects_exist_tt: "La §YRussie§! a au moins un sujet."
 SOV_subjects_federalization_buff_tt: "L'esprit national du §Yvéritable fédéralisme§! sera §Ymodifié§! et une §Gversion améliorée§! de celui-ci sera désormais §Ydisponible§!."
 SOV_one_CIS_member_tt: "Au moins §Yun autre pays§! est membre de §2la CEI§!."
 ##########NATIONAL BOLSHEVIKS TREE##########
 SOV_nazbols: "La Russie est tout. Le reste n'est rien"
 SOV_nazbols_desc: "Le moment est venu de restaurer la grandeur de la Russie. Nous sommes les seuls à comprendre vraiment ce dont notre grande patrie a besoin."
 SOV_nazbols_new_russian_order: "Le nouvel ordre russe"
 SOV_nazbols_new_russian_order_desc: "Un nouvel ordre se lève pour la Russie ! Il est temps de mettre fin à la fragmentation et de ramener l'unité dans la nation."
 SOV_nazbols_no_more_oligarch: "S'occuper des oligarques"
 SOV_nazbols_no_more_oligarch_desc: "Les oligarques doivent cesser d'exploiter la Russie. Nous prendrons des mesures décisives pour mettre fin à leur pillage !"
 SOV_nazbols_natiolalize: "Nationalisation des entreprises"
 SOV_nazbols_natiolalize_desc: "Les grandes entreprises sont un sombre souvenir des années 90. Nous allons les nationaliser au profit du pays et de son peuple."
 SOV_nazbols_west_nationalise: "Nationalisation des entreprises occidentales"
 SOV_nazbols_west_nationalise_desc: "Les entreprises occidentales qui sont entrées sur notre territoire dans les années 90 doivent partir. Il est temps de récupérer ce qui nous appartient."
 SOV_nazbols_destroy_republic: "Mettre fin aux républiques nationales"
 SOV_nazbols_destroy_republic_desc: "Les républiques nationales n'ont pas leur place en Russie. Nous ne répéterons pas les erreurs de l'Union Soviétique."
 SOV_nazbols_federalism: "Adhérer aux idées du fédéralisme"
 SOV_nazbols_federalism_desc: "Nous soutenons le véritable fédéralisme ! Les sujets devraient être autonomes, pas seulement des régions au service de la capitale."
 SOV_nazbols_no_export: "L'économie russe fermée"
 SOV_nazbols_no_export_desc: "Une économie fermée est une économie forte. La Russie peut se permettre cette approche car elle a tout ce dont elle a besoin."
 SOV_nazbols_cut_fsb: "Réduire le budget du FSB"
 SOV_nazbols_cut_fsb_desc: "Notre gouvernement dépense trop pour des services secrets qui espionnent excessivement les citoyens. Nous réduirons le budget du FSB et réduirons cette structure, car nous sommes un pays libre !"
 SOV_nazbols_help_science: "La science au service de la Russie"
 SOV_nazbols_help_science_desc: "La science est le moteur du progrès, et nous alimenterons pleinement ce moteur avec des fonds accrus."
 SOV_nazbols_hate_democracy: "Haine du libéralisme et du communisme"
 SOV_nazbols_hate_democracy_desc: "Le libéralisme et le communisme ont conduit à la décadence de notre nation et à la perte de l'esprit russe. Nous ne les laisserons pas détruire notre pays."
 SOV_nazbols_new_industrialization: "Nouvelle industrialisation"
 SOV_nazbols_new_industrialization_desc: "Nous lancerons un nouvel effort d'industrialisation pour raviver la force de l'industrie de l'ère soviétique !"
 SOV_nazbols_capital_return: "Division du rapatriement des capitaux"
 SOV_nazbols_capital_return_desc: "Nous prévoyons de créer une agence spéciale chargée de récupérer les capitaux russes de l'étranger, par tous les moyens nécessaires."
 SOV_nazbols_free_weapon: "Port d'armes libre"
 SOV_nazbols_free_weapon_desc: "Le droit de porter des armes librement transformera la société russe ! Chaque citoyen devrait avoir le droit de se défendre."
 SOV_nazbols_back_russians: "Ramener les Russes dans leur patrie"
 SOV_nazbols_back_russians_desc: "Nous allons activement promouvoir et soutenir financièrement le retour des russophones dans leur patrie."
 SOV_nazbols_foreign_legion: "La Légion Étrangère"
 SOV_nazbols_foreign_legion_desc: "Inspirés par la Légion Étrangère française, nous allons créer une Légion russe où les étrangers peuvent servir et obtenir la citoyenneté."
 SOV_nazbols_ekb: "Déplacer la capitale à Ekaterinbourg"
 SOV_nazbols_ekb_desc: "Il est temps de déplacer la capitale au cœur de la Russie ! L'Oural est parfait. Moscou est trop éloignée de nombreuses régions."
 SOV_nazbols_empire: "L'Empire Soviétique"
 SOV_nazbols_empire_desc: "Notre pouvoir est de retour ! Gloire à l'Empire Soviétique !"
 SOV_nazbols_nato: "Rhétorique anti-occidentale"
 SOV_nazbols_nato_desc: "L'Occident a toujours été et restera notre ennemi. Notre rhétorique ne doit jamais changer."
 SOV_nazbols_return_russian_territories: "Restituer les territoires russes contestés"
 SOV_nazbols_return_russian_territories_desc: "La question russe dans l'ancienne Union Soviétique n'est pas résolue. Nous la réglerons de manière décisive, soit par des ultimatums, soit nous risquons d'être dévorés."
 SOV_nazbols_belarus_go_home: "Restaurer le Bélarus"
 SOV_nazbols_belarus_go_home_desc: "Le Bélarus est un morceau de notre patrie qui nous a été injustement pris. Il n'y a pas de terre plus chère aux Russes que cette petite région."
 SOV_nazbols_separatists_go_home: "Annexer les républiques séparatistes"
 SOV_nazbols_separatists_go_home_desc: "La Transnistrie, l'Abkhazie, l'Ossétie du Sud - leur soi-disant indépendance est une erreur laissée par la Russie d'Eltsine. Nous allons y remédier."
 SOV_nazbols_help_artsakh: "Protéger l'Artsakh"
 SOV_nazbols_help_artsakh_desc: "L'Artsakh est le territoire le plus fermement chrétien de l'espace post-soviétique, abritant les Arméniens les plus authentiques. Nous devons les protéger !"
 SOV_nazbols_help_kurdistan: "Protéger le Kurdistan"
 SOV_nazbols_help_kurdistan_desc: "Le Kurdistan sera notre point d'appui dans la région si nous obtenons une influence diplomatique. L'Iran, l'Irak et la Turquie devront tenir compte de notre puissance là-bas."
 SOV_nazbols_anti_westes: "Doctrine anti-occidentale"
 SOV_nazbols_anti_westes_desc: "Pas de pitié pour les occupants occidentaux de l'esprit russe !"
 SOV_nazbols_ayatolla: "L'Ayatollah russe"
 SOV_nazbols_ayatolla_desc: "Inspirée par l'Ayatollah iranien, la Russie a besoin d'un chef spirituel pour maintenir l'équilibre moral du peuple, pas de ministères sans âme."
 SOV_nazbols_our_irgc: "Le Corps des Gardiens de la Révolution Communiste Orthodoxe"
 SOV_nazbols_our_irgc_desc: "Nous allons créer un équivalent russe du Corps des Gardiens de la Révolution Islamique d'Iran pour préserver les acquis idéologiques de notre régime."
 SOV_nazbols_ruralisation: "Ruralisation"
 SOV_nazbols_ruralisation_desc: "Nous allons investir massivement dans le développement du secteur agro-industriel de notre économie."
 SOV_nazbols_new_religion: "L'Église Communiste Orthodoxe"
 SOV_nazbols_new_religion_desc: "L'Église orthodoxe a perdu sa crédibilité, ayant même coopéré avec les nazis pendant la Seconde Guerre Mondiale. Nous allons construire une nouvelle église synthétisant l'ensemble de l'héritage spirituel de la Russie."

 SOV_anti_west_idea: "Doctrine anti-occidentale"
 SOV_russian_foreign_legion_idea: "Légion étrangère"
 SOV_russians_back_idea: "Rapatriement des compatriotes"
 SOV_nazbol_irgc_idea: "Le Corps des Gardiens de la Révolution Communiste Orthodoxe"

 sov_nazbol.1.t: "La Russie veut nous annexer"
 sov_nazbol.1.d: "Le gouvernement russe a émis un ultimatum exigeant un référendum sur le ralliement à leur pays. Nous connaissons le résultat probable, il est donc temps de décider de notre réponse."
 sov_nazbol.1.a: "Bien sûr, il est temps de rentrer chez nous, en Russie"
 sov_nazbol.1.b: "Pas aujourd'hui"

 sov_nazbol.2.t: "[FROM.GetName] est intégré à [SOV.GetName]"
 sov_nazbol.2.d: "[FROM.GetName] a été entièrement intégré à notre glorieux Empire. Nous récupérons ce qui a été perdu au cours du siècle dernier et nous ne nous arrêterons pas maintenant."
 sov_nazbol.2.a: "Notre pays s'est renforcé"

 sov_nazbol.3.t: "La Russie revendique nos territoires !"
 sov_nazbol.3.d: "La Russie a émis un ultimatum pour une partie de nos terres qu'ils considèrent comme leurs. Nous devons décider comment répondre."
 sov_nazbol.3.a: "Nous allons céder"
 sov_nazbol.3.b: "Jamais"

 sov_nazbol.4.t: "Les Nationaux-Bolcheviks rejoignent la coalition"
 sov_nazbol.4.d: "Les Nationaux-Bolcheviks ont rejoint notre coalition au pouvoir, gagnant de l'influence sur la politique de notre pays."
 sov_nazbol.4.a: "Oui, à la victoire !"

 ###########Tooltips###########
 SOV_nazbol_coup_TT: "Les Nationaux-Bolcheviks seront admis au gouvernement et le pays par le parti de la coalition"
 SOV_nazbol_destroy_republics_TT: "Toutes les §Yr épubliques nationales§! n'ont pas été §R détruites§!"

 ##########WAGNER TREE##########
 ##########Focuses##########
 SOV_slavic_corps: "Régler le problème avec le Corps Slavon"
 SOV_slavic_corps_desc: "Le Corps Slavon est une entreprise de sécurité privée enregistrée à Hong Kong. Nous avons capturé ses propriétaires et sommes prêts à les emprisonner. Cependant, leur expertise pourrait s'avérer précieuse pour nous à l'avenir."
 SOV_wagner_minoboroni: "Approvisionnement du Ministère de la Défense"
 SOV_wagner_minoboroni_desc: "Le Ministère de la Défense nous fournira les armes nécessaires pour mener à bien nos opérations. Ce soutien renforcera considérablement nos capacités."
 SOV_co_op_wagner: "Confier la direction à Prigojine"
 SOV_co_op_wagner_desc: "Étant donné que le financement principal provient d'Evgueni Prigojine, il est logique de le placer à la tête des Sociétés Militaires Privées. Son leadership apportera plus de coordination et d'efficacité."
 SOV_wagner_cadres: "Lancer le processus de recrutement"
 SOV_wagner_cadres_desc: "Nous allons commencer à recruter les premiers candidats pour rejoindre nos Sociétés Militaires Privées. Une sélection rigoureuse est cruciale pour le succès de nos opérations."
 SOV_wagner_first_pmc: "Le premier bataillon des Sociétés Militaires Privées"
 SOV_wagner_first_pmc_desc: "Notre premier bataillon de SMP a été formé, et nous sommes presque prêts à lancer nos premières missions de combat. Cela marque une étape majeure dans l'expansion de notre influence."
 SOV_wagner_more_operations: "Expansion des activités"
 SOV_wagner_more_operations_desc: "Notre SMP est maintenant prête à prendre part à des opérations dans le monde entier. Cette expansion augmentera notre portée et notre impact mondiaux."
 SOV_wagner_african: "Direction africaine"
 SOV_wagner_african_desc: "L'Afrique a été perdue après l'effondrement de l'URSS ; il est temps de récupérer notre influence là-bas. Le rétablissement de notre présence ouvrira de nouvelles opportunités stratégiques."
 SOV_wagner_support_gru: "Soutien aux opérations du GRU"
 SOV_wagner_support_gru_desc: "Nous soutiendrons les missions du GRU pour renforcer l'efficacité de la politique étrangère russe. La coopération améliorera le taux de réussite des opérations secrètes."
 SOV_wagner_rusich: "DshRG Rusich"
 SOV_wagner_rusich_desc: "Nous intégrerons également un petit bataillon de nationalistes dans nos rangs, renforçant nos SMP. Leur engagement idéologique en fait de précieux alliés dans nos missions."

 ###########Tooltips###########
 SOV_slavic_wagner_TT: "La Société Militaire Privée Wagner sera créée"

