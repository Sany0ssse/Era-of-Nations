##########SAFE TREE##########
##########Focuses##########
SOV_safe_russia: "Sécurité du pays"
SOV_safe_russia_desc: "Notre pays est vaste, et pour le protéger efficacement, nous avons besoin de forces importantes ainsi que d'unités et d'agences spécialisées travaillant sans relâche pour garantir la sécurité de la nation."
SOV_FSB_expansion: "Expansion du FSB"
SOV_FSB_expansion_desc: "Le FSB est notre principale agence de sécurité, et nous devons nous assurer qu'il dispose d'installations modernes et de ressources pour répondre aux défis actuels."
SOV_svr: "Service de renseignement extérieur (SVR)"
SOV_svr_desc: "Le SVR est la principale agence de renseignement extérieur de la Russie, opérant sous l'autorité du président. C'est un service paramilitaire clé de l'État, responsable des opérations de renseignement et des missions secrètes à l'étranger."
SOV_alpha_omon_exp: "Groupe Alpha"
SOV_alpha_omon_exp_desc: "Le Groupe Alpha, officiellement Direction A du Centre des opérations spéciales du FSB, est une unité d'élite des forces spéciales créée par le KGB soviétique en 1974. Opérant sous contrôle politique direct, il effectue des opérations secrètes et paramilitaires à haut risque à l'intérieur et à l'extérieur de la Russie."
SOV_vimpel_omon_exp: "Groupe Vympel"
SOV_vimpel_omon_exp_desc: "Le Groupe Vympel, ou Direction V, est une unité spetsnaz du FSB, souvent appelée Direction V du KGB. C'est l'unité jumelle du Groupe Alpha et se spécialise dans les opérations stratégiques sous le commandement du FSB."
SOV_pogranci_fsb: "Service des frontières du FSB de Russie"
SOV_pogranci_fsb_desc: "Le Service des frontières est une branche du FSB responsable de la patrouille et de la protection des vastes frontières terrestres de la Russie."
SOV_second_slujba: "Deuxième Service"
SOV_second_slujba_desc: "Également connu sous le nom de Service pour la protection de l'ordre constitutionnel et la lutte contre le terrorisme, le Deuxième Service combat le terrorisme, l'extrémisme et les menaces politiques internes, protégeant l'ordre constitutionnel de la Russie et maintenant le contre-espionnage dans les sphères sociales et culturelles sensibles."
SOV_inner_army: "Troupes internes"
SOV_inner_army_desc: "Les Troupes internes du ministère de l'Intérieur sont une force paramilitaire chargée du contrôle des foules, de la garde des installations critiques et du soutien aux opérations policières. Elles ont joué des rôles clés dans les conflits internes tels que les guerres de Tchétchénie."
SOV_omon: "OMON"
SOV_omon_desc: "L'OMON est un système d'unités de police spéciales au sein des forces armées de la Russie, créé en 1988. Connu pour le contrôle des émeutes et le maintien de l'ordre paramilitaire, l'OMON opère également dans plusieurs États post-soviétiques dans des rôles similaires."
SOV_upravlenie_k: "Département K"
SOV_upravlenie_k_desc: "Le Département K du ministère de l'Intérieur se spécialise dans la lutte contre la cybercriminalité et le trafic illégal d'appareils électroniques et d'équipements de surveillance."
SOV_centr_t: "Centre de lutte contre l'extrémisme"
SOV_centr_t_desc: "Connu sous le nom de Centre E, cette unité du ministère de l'Intérieur se concentre sur l'identification et la répression des activités extrémistes à travers la Russie."
SOV_gusb: "Direction principale de la sécurité interne"
SOV_gusb_desc: "La Direction principale de la sécurité interne est une unité de police indépendante au sein du ministère de l'Intérieur, responsable de la prévention de la corruption, des crimes internes et de la garantie de l'intégrité des forces de l'ordre."
SOV_sobr: "SOBR"
SOV_sobr_desc: "Le SOBR est une unité de réponse rapide spetsnaz avec une formation et un équipement militaires. Travaillant aux côtés de l'OMON, il fonctionne comme une force tactique de police paramilitaire déployable pour des opérations à haut risque."
SOV_anti_corrupt_upravlenie: "Direction générale de la sécurité économique et de la lutte contre la corruption"
SOV_anti_corrupt_upravlenie_desc: "Cette direction mène les efforts du ministère de l'Intérieur pour combattre les crimes économiques et la corruption, mettant en œuvre les politiques et réglementations étatiques pour protéger la sécurité économique de la Russie."
SOV_gru: "GRU"
SOV_gru_desc: "Le GRU est l'agence de renseignement militaire étranger de la Russie sous l'autorité de l'état-major général. Il commande le renseignement militaire et les forces spetsnaz et est connu pour entreprendre des opérations complexes et à haut risque à travers le monde, rendant compte au ministère de la Défense."
SOV_gru_spetznaz: "Spetsnaz GRU"
SOV_gru_spetznaz_desc: "Les Spetsnaz GRU sont les unités de forces spéciales du GRU, chargées d'effectuer des opérations militaires secrètes et des missions de renseignement à l'étranger."
SOV_zaslon: "Zaslon"
SOV_zaslon_desc: "Zaslon est une unité spéciale hautement classifiée du SVR, formée en 1997. Elle fournit un soutien militaire aux opérations de renseignement extérieur, protège les missions diplomatiques russes et sécurise les dirigeants du SVR lors de missions à haut risque."
SOV_outer: "Renseignement extérieur"
SOV_outer_desc: "Notre sécurité nationale dépend de la manière dont nous surveillons et affaiblissons nos adversaires. Nous devons rester vigilants face à tout ennemi tentant de nous saper."

