 # Main event
 MANAGE_SUBJECT_EXPENSES_T: "Examen des dépenses publiques à [FROM.GetNameDef]"
 MANAGE_SUBJECT_EXPENSES_D: "En tant que métropole de [FROM.GetNameDef], nous devons guider notre état fantoche dépendant sur le droit chemin. Pour y parvenir, nous devrons utiliser certaines connexions, mais cela en vaut la peine pour les rendre plus réceptifs à notre influence. Cependant, à chaque intervention, ils s'éloigneront progressivement de nous - un petit prix à payer pour une implication aussi significative."

