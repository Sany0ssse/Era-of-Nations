  eastern_church_arm: "Église apostolique arménienne"
  eastern_church_arm_desc: "L'Église apostolique arménienne (EAA) est l'une des plus anciennes églises chrétiennes au monde. Selon la légende, l'Église arménienne est appelée « apostolique » car ses fondateurs étaient les apôtres Thaddée et Barthélemy, qui furent les premiers à prêcher le christianisme en Arménie. Historiquement, l'EAA a été formée en 301 par les efforts de saint Grégoire l'Illuminateur et l'adoption du christianisme par le roi Trdat III comme religion d'État."
  eastern_church_eth: "Église orthodoxe éthiopienne"
  eastern_church_eth_desc: "L'Église orthodoxe éthiopienne est l'une des anciennes églises orientales (pré-chalcédoniennes). Jusqu'en 1959, elle était une église autonome, en dépendance canonique de l'Église copte, après quoi elle a obtenu l'autocéphalie. Comme les autres églises orientales anciennes, elle reconnaît trois conciles œcuméniques et professe la christologie miaphysite. Elle possède son propre rite éthiopien, ainsi qu'une structure hiérarchique du clergé unique, sans équivalent dans les autres traditions ecclésiastiques."

  AZE_karabakh_defeat: "Défaite dans la guerre du Karabagh"
  AZE_karabakh_defeat_desc: "La défaite dans la guerre des années 90 a été une blessure douloureuse pour notre nation. Les Azerbaïdjanais aspirent à la revanche pour récupérer leurs terres historiques et permettre à des milliers de réfugiés de rentrer chez eux."
  AZE_karabakh_revanchism: "Revanchisme du Karabagh"
  AZE_karabakh_revanchism_desc: "Le peuple azerbaïdjanais, qui a perdu la guerre de l'Artsakh avec un grand soutien international, est resté humilié sur la scène internationale, et le peuple, aveuglé par l'échec, est de plus en plus enclin au nationalisme et à rejoindre les forces armées."
  ARM_victory_karabakh: "Victoire dans la guerre du Karabagh"
  ARM_victory_karabakh_desc: "La victoire dans la guerre du Karabagh a renforcé les sentiments nationaux des Arméniens et a également permis à de nombreuses personnes de l'Artsakh d'occuper des postes élevés dans le gouvernement arménien. Cependant, cela a réduit la motivation pour un développement militaire et politique ultérieur."
  ARM_armenian_mafia_6: "Mafia arménienne"
  ARM_armenian_mafia_6_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à gérer les problèmes internes, le problème de la criminalité organisée est apparu en Arménie, qui, en coopérant avec les oligarques et en faisant souvent partie de l'oligarchie, a affecté négativement la situation socio-économique arménienne."
  ARM_armenian_mafia_5: "Mafia puissante"
  ARM_armenian_mafia_5_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à gérer les problèmes internes, le problème de la criminalité organisée est apparu en Arménie, qui, en coopérant avec les oligarques et en faisant souvent partie de l'oligarchie, a affecté négativement la situation socio-économique arménienne."
  ARM_armenian_mafia_4: "La mafia a subi des pertes"
  ARM_armenian_mafia_4_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à gérer les problèmes internes, le problème de la criminalité organisée est apparu en Arménie, qui, en coopérant avec les oligarques et en faisant souvent partie de l'oligarchie, a affecté négativement la situation socio-économique arménienne."
  ARM_armenian_mafia_3: "Accords avec la mafia"
  ARM_armenian_mafia_3_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à gérer les problèmes internes, le problème de la criminalité organisée est apparu en Arménie, qui, en coopérant avec les oligarques et en faisant souvent partie de l'oligarchie, a affecté négativement la situation socio-économique arménienne."
  ARM_armenian_mafia_2: "Domination sur la mafia"
  ARM_armenian_mafia_2_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à gérer les problèmes internes, le problème de la criminalité organisée est apparu en Arménie, qui, en coopérant avec les oligarques et en faisant souvent partie de l'oligarchie, a affecté négativement la situation socio-économique arménienne."
  ARM_armenian_mafia_1: "Mafia mineure"
  ARM_mafia_strikes_back: "Retour de la mafia"
  ARM_mafia_strikes_back_TT: "Nous continuerons à lutter contre la mafia pour l'éradiquer, mais cela entraînera des problèmes temporaires."

  ARM_deals_with_bandits_3: "Accords avec les bandits"
  ARM_deals_with_bandits_3_desc: "Au lieu de combattre la mafia, nous établirons des relations, réduirons la pression sur les petites entreprises et commencerons à contrôler les grands flux financiers."
  ARM_deals_with_bandits_2: "Domination sur les bandits"
  ARM_deals_with_bandits_2_desc: "Maintenant, la mafia ne pourra plus s'opposer à nous. Nous contrôlons la circulation de l'argent dans le pays, ce qui nous donne la possibilité d'utiliser tous les leviers d'influence sur l'oligarchie."
  ARM_deals_with_bandits_1: "Séparation des sphères d'influence"
  ARM_deals_with_bandits_1_desc: "Nous avons partagé les sphères d'influence avec les autorités de la mafia arménienne. Nous laissons les bandits continuer à exister, mais nous nous sommes débarrassés de l'ennemi interne."

  armenian_perseverance: "Persévérance arménienne"
  armenian_perseverance_desc: "De nombreuses civilisations ont prospéré et disparu au cours des trois derniers millénaires. Contrairement à leurs anciens amis et ennemis, les Arméniens persistent toujours. Bien que l'Arménie historique ne revienne peut-être jamais, la volonté de prospérer et de rester ferme est plus forte que jamais."
  NKR_marz_arm: "Marz de facto de [ARM.GetNamewithFlag]"
  NKR_marz_tt: "\n§YDépense supplémentaire : $$§R0,350§!§! pour les taxes §Yarméniennes§! de [ARM.GetFlag]"

  ARM_echoes_1999: "Échos de 1999 - §9Opposition unifiée§!"
  ARM_echoes_1999_desc: "Les conséquences de la fusillade au parlement de 1999 secouent encore la population et poussent les factions de l'opposition à protester contre Kocharyan."
  ARM_echoes_1999_pac: "Échos de 1999 - §YNationalistes exclus de la coalition§!"
  ARM_echoes_1999_pac_desc: "Les conséquences de la fusillade au parlement de 1999 secouent encore la population et poussent les factions de l'opposition à protester contre Kocharyan."

  ARM_changes_in_militar: "Changements dans l'armée"

  ARM_broken_economy: "Écho économique des années 90"
  ARM_broken_economy_desc: "L'économie arménienne est en profond déclin et nous devons prendre des mesures pour tenter de l'améliorer, malgré la domination d'une forte oligarchie.\n\n§GCette idée§! sera §Gsupprimée§! si nous augmentons notre §YPIB par habitant§! au-dessus de §Y20k§!"

  ARM_diaspora_links: "Liens avec la diaspora"
  ARM_diaspora_links_desc: "La diaspora arménienne à travers le monde dispose de connexions importantes et peut nous aider à établir des relations ou à influencer d'autres pays.\n\nCette §Yidée§! nous donne accès à un panel de §Gdécisions liées à la diaspora§!."

  ARM_rural_water_issues: "Problème d'approvisionnement en eau rural"
  ARM_rural_water_issues_desc: "Après l'effondrement de l'URSS, l'Arménie a commencé à rencontrer des problèmes avec l'infrastructure d'irrigation des cultures agricoles. Bien que l'agriculture occupe une part importante de l'économie arménienne, ces problèmes n'ont pas encore été résolus."

  ARM_102st_base: "Base militaire 102 de [SOV.GetNamewithFlag]"
  ARM_102st_base_desc: "La base militaire russe 102 est une base militaire russe à Gyumri, en Arménie, sous le commandement du district militaire sud des forces armées russes.\n\n§YCette idée sera supprimée si [SOV.GetNamewithFlag] n'a plus d'accès militaire à notre territoire.§!"

  ARM_echoes_of_1999: "Échos de 1999"
  ARM_echoes_of_1999_desc: "L'Arménie est à un carrefour politique et récolte les fruits de l'attentat terroriste de 1999. Que signifie l'ascension de Robert Kocharyan pour l'Arménie ?"

  ARM_agree_on_places: "Accords sur les places"

  ARM_high_emigration_5: "Niveau élevé d'émigration"
  ARM_high_emigration_5_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités actuelles, l'Arménie est menacée d'extinction, ce qui ne peut être dit de son voisin oriental et principal ennemi politique. La résolution de la question démographique devrait devenir le principal agenda de la politique arménienne.\n§W------------------§!\nCet esprit national sera §Gréduit§! si notre §HPIB§! dépasse §H20G$§! et que nous avons au moins §H15 % de stabilité§!.\n§W------------------§!"
  ARM_high_emigration_4: "Niveau substantiel d'émigration"
  ARM_high_emigration_4_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités actuelles, l'Arménie est menacée d'extinction, ce qui ne peut être dit de son voisin oriental et principal ennemi politique. La résolution de la question démographique devrait devenir le principal agenda de la politique arménienne.\n§W------------------§!\nCet esprit national sera §Gréduit§! si notre §HPIB§! dépasse §H30G$§! et que nous avons au moins §H24 % de stabilité§!.\n§W------------------§!"
  ARM_high_emigration_3: "Niveau élevé d'émigration"
  ARM_high_emigration_3_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités actuelles, l'Arménie est menacée d'extinction, ce qui ne peut être dit de son voisin oriental et principal ennemi politique. La résolution de la question démographique devrait devenir le principal agenda de la politique arménienne.\n§W------------------§!\nCet esprit national sera §Gréduit§! si notre §HPIB§! dépasse §H40G$§! et que nous avons au moins §H24 % de stabilité§!.\n§W------------------§!"
  ARM_high_emigration_2: "Faible niveau d'émigration"
  ARM_high_emigration_2_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités actuelles, l'Arménie est menacée d'extinction, ce qui ne peut être dit de son voisin oriental et principal ennemi politique. La résolution de la question démographique devrait devenir le principal agenda de la politique arménienne.\n§W------------------§!\nCet esprit national sera §Gréduit§! si notre §HPIB§! dépasse §H20G$§! et que nous avons au moins §H34 % de stabilité§!.\n§W------------------§!"
  ARM_high_emigration_1: "Petite émigration"
  ARM_high_emigration_1_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités actuelles, l'Arménie est menacée d'extinction, ce qui ne peut être dit de son voisin oriental et principal ennemi politique. La résolution de la question démographique devrait devenir le principal agenda de la politique arménienne.\n§W------------------§!\nCet esprit national sera §Gréduit§! si notre §HPIB§! dépasse §H60G$§! et que nous avons au moins §H44 % de stabilité§!.\n§W------------------§!"
  ARM_high_emigration_0: "Très faible émigration"
  ARM_high_emigration_0_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités actuelles, l'Arménie est menacée d'extinction, ce qui ne peut être dit de son voisin oriental et principal ennemi politique. La résolution de la question démographique devrait devenir le principal agenda de la politique arménienne.\n§W------------------§!\nCet esprit national sera §Gréduit§! si notre §HPIB§! dépasse §H100G$§! et que nous avons au moins §H64 % de stabilité§!.\n§W------------------§!"
  ARM_immigration: "Immigration positive"
  ARM_immigration_desc: "Les Arméniens du monde entier reviennent systématiquement dans leur patrie historique, rapatriés en masse en tant que citoyens à part entière."
  ARM_russia_debt_wait: "Accord de §Wreport§! de la dette de [SOV.GetNamewithFlag]"
  ARM_russia_debt_wait_desc: "[ARM.GetNamewithFlag] est le seul pays dont la dette n'a pas été assumée ou annulée par [SOV.GetNamewithFlag]. Que ce soit un geste politique ou pragmatique, ils nous ont accordé un délai pour régler la question de la dette."

  ##########ARBRE KOCHARYAN##########
  ##########Focus##########
  ARM_Kocharjan: "§YL'ère de Kocharyan§!"
  ARM_Kocharjan_desc: "Après l'éviction de son prédécesseur Levon Ter-Petrosyan de la présidence, Kocharyan a été nommé deuxième président de l'Arménie, battant son principal rival, Karen Demirchyan (ancien dirigeant de l'Arménie soviétique), lors d'une élection présidentielle anticipée entachée d'irrégularités et de violations des deux côtés, selon les observateurs électoraux internationaux."
  ARM_manifestation_power: "Manifestation du pouvoir politique"
  ARM_manifestation_power_desc: "Pour être convaincus que notre rôle dans l'administration de l'État ne sera pas ébranlé, nous devons montrer notre volonté et remettre l'appareil d'État à sa place."
  ARM_place_agreement: "Accords de places"
  ARM_place_agreement_desc: "Pour renforcer le pouvoir de Kocharyan dans le pays, nous devons négocier de manière non violente avec les politiciens régionaux, les fonctionnaires et même certains députés."
  ARM_confrontation_mafia: "Confrontation avec la mafia"
  ARM_confrontation_mafia_desc: "La mafia arménienne, qui a de nombreuses connexions avec les criminels russes, a trop d'influence sur ce qui se passe en Arménie. Nous devons changer cela."
  ARM_liquidation_bosses: "Élimination des chefs"
  ARM_liquidation_bosses_desc: "La mafia est faible. Le moment est venu de décapiter le dragon avec un coup décisif de la justice."
  ARM_installing_loyal: "Installer les nôtres"
  ARM_installing_loyal_desc: "Bien que cela semble désavantageux à court terme, pour renforcer le pouvoir de Kocharyan, nous devons purger l'appareil d'État des dissidents et des opposants. Nous n'avons rien à négocier avec eux."
  ARM_suppress_opposition: "Réprimer l'opposition"
  ARM_suppress_opposition_desc: "L'opposition est trop active en raison de l'influence externe sur l'Arménie. Il est temps de faire pression sur l'opposition avec des mesures sévères et quelques arrestations pour calmer leur ardeur."
  ARM_deals_with_bandits: "Accords avec la mafia"
  ARM_deals_with_bandits_desc: "Les cercles criminels de l'Arménie, bien qu'ils aient tendance à s'agiter et à violer systématiquement la loi, influencent largement ce qui se passe en Arménie. Peut-être ne devrions-nous pas les combattre, mais vassaliser le banditisme et le rendre profitable pour nous."
  ARM_domination_over_bandits: "Dominer les bandits"
  ARM_domination_over_bandits_desc: "Bien que nous ayons décidé de négocier avec les bandits, nous ne devons pas leur donner trop de pouvoir. Kocharyan doit établir son contrôle sur eux."
  ARM_official_investigation: "Lancer une enquête officielle"
  ARM_official_investigation_desc: "Pour calmer l'opposition et la communauté internationale, nous devons lancer une enquête officielle sur l'attentat terroriste de 1999."
  ARM_pacify_yerkrapah: "Pacifier Yerkrapah"
  ARM_pacify_yerkrapah_desc: "L'organisation militaire Yerkrapah est trop influente en Arménie pour notre pouvoir... Elle est principalement composée de partisans nationalistes de Vazgen Sargsyan. Nous devons les retirer du commandement militaire."
  ARM_meet_putin: "Rencontre avec Poutine"
  ARM_meet_putin_desc: "Peut-être pourrons-nous convaincre la Russie d'investir dans notre économie et créer un climat de confiance pour un futur accord sur la dette."
  ARM_northern_avenue_project: "Projet de l'Avenue du Nord"
  ARM_northern_avenue_project_desc: "L'Avenue du Nord est un projet proposé pour le centre d'Erevan dans lequel les rues seront reconstruites en supprimant les anciens bâtiments historiques et en construisant de nouveaux bâtiments modernes."
  ARM_property_for_debt: "Accord de propriété contre dette"
  ARM_property_for_debt_desc: "L'Arménie est le seul pays dont la dette n'a pas été annulée par la Russie après la chute de l'URSS. Cependant, peut-être pouvons-nous conclure un accord en donnant des propriétés au lieu de l'argent."
  ARM_autocrats_power: "Pouvoir autocratique"
  ARM_autocrats_power_desc: "Enfin, Kocharyan n'a plus d'obstacles dans son champ politique."
  ARM_person_business: "Entreprises personnelles"
  ARM_person_business_desc: "Bien que cela puisse nuire à notre cycle économique, nous pouvons tirer certains bénéfices des entreprises personnelles de Kocharyan."
  ARM_caucasian_tiger: "Tigre caucasien"
  ARM_caucasian_tiger_desc: "En raison d'un secteur de la construction gonflé, l'Arménie a maintenant la plus forte croissance du PIB dans la région. Nous devons profiter de cette situation."
  ARM_silence_hun: "Faire taire Hunanyan"
  ARM_silence_hun_desc: "Hunanyan pourrait donner des informations à l'opposition. Nous ne devons pas laisser cela se produire."
  ARM_constitutional_changes: "Changements constitutionnels"
  ARM_constitutional_changes_desc: "Pour mettre fin à tout espoir de l'opposition d'arrêter notre pouvoir, nous devons modifier la constitution et réprimer les manifestations."
  ARM_hi_rob: "Salut, Rob !"
  ARM_hi_rob_desc: "Poghos Poghosyan du parti Dashnaktsutyun a longtemps été un problème pour Kocharyan. C'est un vieil « ami » à lui, et les anciens liens sont trop risqués pour nous maintenant."
  ARM_political_assassinations: "Assassinats politiques"
  ARM_political_assassinations_desc: "Nous continuons à éliminer nos adversaires si nécessaire pour notre domination politique..."
  ARM_union_state_proposal: "Proposition d'État d'union"
  ARM_union_state_proposal_desc: "Enfin, nous pouvons essayer de rejoindre le projet d'État d'union pour notre prospérité future."
  ARM_loyal_in_power: "« Nos » gens aux commandes"
  ARM_loyal_in_power_desc: "Maintenant, les autorités régionales sont sous le contrôle de Kocharyan. Cependant, pour le bien du pouvoir politique, la lutte contre la corruption devient de plus en plus impossible."
  ##########Idées##########
  ARM_suppressed_oppos: "Opposition réprimée"
  ARM_cauc_tigr: "Tigre caucasien"
  ARM_autocratic_grip: "Pouvoir autocratique"
  ARM_armenia_kocharyan_idea: "L'Arménie de Kocharyan"
  ##########Décisions##########
  ARM_political_assassinations_category: "Assassinats politiques"
  ARM_political_assassinations_category_desc: "Après le coup d'État de 1999, le pouvoir de §YKocharyan§! £ARM_Conservative est dans un état précaire. L'§Yopposition§! se préparera à plusieurs reprises à renverser le président. Il est nécessaire de nettoyer le champ politique pour être sûr de la préservation du pouvoir. Les ennemis au sein de l'environnement politique et l'opposition externe doivent être éradiqués."
  arm_opposition_backlash_ticker_mission: "Retour de l'opposition"
  arm_opposition_backlash_ticker_mission_desc: "L'§Yopposition arménienne§! [ARM.GetFlag] se prépare à organiser des rassemblements et à forcer le gouvernement £ARM_Conservative §YKocharyan§! à céder et à organiser des élections équitables. Nous devons retarder ce moment et, de préférence, empêcher complètement les rassemblements, ou nous assurer que l'opposition perdra."
  ARM_first_wave_of_assasinat: "Lancer la §Ypremière vague§! d'§Yassassinats politiques§!"
  ARM_second_wave_of_assasinat: "Lancer la §9deuxième vague§! d'§Yassassinats politiques§!"
  first_assasinat_done: "§YPremière vague d'assassinats terminée§!"
  second_assasinat_done: "§YDeuxième vague d'assassinats terminée§!"
