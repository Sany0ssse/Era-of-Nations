  ARM_Kocharyan_Autocratic_loc1: "\n§gPOUVOIR AUTOCRATIQUE§! :\n£construction_speed_texticon Vitesse de construction locale : §G+10,00 %§!\n£political_power_texticon Gain de pouvoir politique : §G+5,00 %§!\n£interest_rate_multiplier_modifier_texticon §YTaux d'intérêt§! : §G-2§!\n£emerging_outlook_campaign_cost_modifier_texticon Soutien émergent quotidien : §G+0,06§!"

  ##########ARBRE SARGSYAN##########
  ##########Focus##########
  ARM_Sargsyan: "§YSerzh Sargsyan§!"
  ARM_Sargsyan_desc: "Depuis 1988, Serzh Sargsyan est l'un des leaders du « mouvement du Karabagh », qui avait pour objectif la défense du Haut-Karabagh par l'Arménie. Grâce à ses excellentes connexions dans les sphères militaire et politique en Arménie, il est devenu un candidat idéal pour la présidence après Kocharyan."
  ARM_appoint_tigran: "Nommer Tigran"
  ARM_appoint_tigran_desc: "Nous devrions nommer Tigran Sargsyan à la tête de la banque centrale arménienne pour d'éventuelles réformes futures."
  ARM_clear_out_nats: "Éliminer les partisans d'Andranik Margaryan"
  ARM_clear_out_nats_desc: "Andranik Margaryan et son aile nationaliste du parti doivent être réprimés, ils sont trop déloyaux et dangereux pour être tolérés dans notre parti."
  ARM_spheres_of_influence_sep: "Séparer les sphères d'influence"
  ARM_spheres_of_influence_sep_desc: "Le gouvernement précédent nous a donné le feu vert pour diriger ce pays, nous devons donc respecter leurs entreprises."
  ARM_utilize_miltary_knowledge: "Utiliser les connaissances militaires"
  ARM_utilize_miltary_knowledge_desc: "L'expérience militaire de Serzh Sargsyan doit être utilisée au profit de nos forces armées, il sait quoi faire."
  ARM_befriend_oligs: "Se lier d'amitié avec les oligarques"
  ARM_befriend_oligs_desc: "Peut-être devrions-nous établir des liens avec les oligarques et écouter les offres qu'ils pourraient nous faire..."
  ARM_patriotic_educ: "Éducation patriotique des jeunes"
  ARM_patriotic_educ_desc: "Nous devons éduquer notre jeunesse dans un esprit patriotique. Notre parti, même avant que nous en prenions la direction, a eu beaucoup de succès dans ce domaine et nous devons donc continuer cette tradition."
  ARM_ensure_milit: "Assurer le soutien militaire"
  ARM_ensure_milit_desc: "Nous devons nous assurer que l'armée occupe l'une des positions les plus importantes dans notre gouvernement et notre société."
  ARM_priorit_loy_gener: "Prioriser les généraux loyaux"
  ARM_priorit_loy_gener_desc: "Nous devons donner la priorité aux généraux qui nous sont loyaux et établir des connexions politiques."
  ARM_new_gov_builds: "Nouveaux bâtiments gouvernementaux"
  ARM_new_gov_builds_desc: "Grâce à nos bonnes relations avec l'oligarchie, nous pouvons peut-être conclure un bon accord avec eux pour la construction de nouvelles installations pour notre gouvernement."
  ARM_navasard_legacy_sup: "Héritage de Navasardyan"
  ARM_navasard_legacy_sup_desc: "Bien que nous ayons réprimé l'ancienne garde du parti républicain, utiliser leurs méthodes et leur héritage pourrait être très utile pour l'avenir de notre pays."
  ARM_cronies_elevated: "Élever les proches"
  ARM_cronies_elevated_desc: "Nous devons changer nos priorités dans l'éducation, tout en maintenant les idées fondamentales."
  ARM_support_monopolies: "Soutenir les monopoles"
  ARM_support_monopolies_desc: "Nous devons maintenir notre système de monopoles pour préserver notre influence dans l'État."
  ARM_hovik_guidelines: "Directives de Hovik"
  ARM_hovik_guidelines_desc: "Le Premier ministre Hovik Abrahamyan a ordonné au ministère de l'Économie d'élaborer des lignes directrices pour l'importation de dix produits essentiels sur le marché dans un délai d'un mois. Ces produits incluent le sucre, la farine, le blé, l'huile, le riz, le sarrasin, le beurre, la margarine, les bananes, les oranges, les aliments pour bébés, la volaille, les médicaments, le diesel et l'essence. Il a noté que, bien que ces marchés ne soient pas officiellement monopolisés, ils sont perçus comme tels par le public."
  ARM_mandatory_pension_system: "Système de retraite obligatoire par accumulation"
  ARM_mandatory_pension_system_desc: "Il est nécessaire de procéder à une réforme des retraites qui améliorera la vie de nos retraités."
  ARM_patronize_nats: "Patronner les nationalistes"
  ARM_patronize_nats_desc: "Le Parti républicain soutient les mouvements nationalistes dans le pays de multiples façons."
  ARM_footbal_diplo: "Diplomatie du football"
  ARM_footbal_diplo_desc: "La « diplomatie du football » dans les relations entre l'Arménie et la Turquie a commencé le 6 septembre 2008, lorsque le président turc Abdullah Gül est arrivé à Erevan à l'invitation du président arménien Serzh Sargsyan pour assister ensemble à un match de football entre les équipes nationales des deux pays dans le cadre des qualifications pour la Coupe du monde 2010. Après le match, le dirigeant turc a invité son homologue arménien à assister au match retour en Turquie le 14 octobre 2009. Le 10 octobre 2009, des protocoles bilatéraux ont été signés à Zurich avec le soutien de politiciens et de dirigeants mondiaux de haut rang. Et quatre jours plus tard à Bursa, les présidents de la Turquie et de l'Arménie ont assisté au match des équipes nationales de football. Cependant, le 22 avril 2010, Sargsyan a suspendu la ratification des documents signés à Zurich par décret, expliquant que la Turquie n'était pas prête à poursuivre le processus entamé."
  ARM_visit_to_russia: "Visite d'État en Russie"
  ARM_visit_to_russia_desc: "Serzh Sargsyan se rendra en Russie pour négocier un rapprochement de l'Arménie avec l'UE."
  ARM_approach_eu_serzh: "Rapprochement avec l'Union européenne"
  ARM_approach_eu_serzh_desc: "La Journée européenne est un événement marquant dans notre pays, grâce auquel nous avons plus d'opportunités pour nous rapprocher de l'UE."
  ARM_serzh_free_speech: "Liberté d'expression pour le soutien de l'UE"
  ARM_serzh_free_speech_desc: "Bien que nous ne voulions pas renforcer l'opposition, nous devons accorder certains droits à la population pour élargir les opportunités économiques."
  ARM_ss_army: "Armée de S.S."
  ARM_ss_army_desc: "Nous sommes l'armée de Serzh Sargsyan, nous le suivrons jusqu'au bout du monde !"
  
##########Events##########
  arm_sargsyan.1.t: "Rencontre en Arménie après un match de football !"
  arm_sargsyan.1.d: "Après avoir assisté au match de football entre l'Arménie et la Turquie, les dirigeants de l'Arménie et de la Turquie discutent de diverses affaires. L'Arménie propose de conclure un accord bilatéral de coopération entre nos pays pour un développement mutuellement bénéfique de nos économies et la normalisation des relations."
  arm_sargsyan.1.a: "Bien sûr"
  arm_sargsyan.1.b: "Non"
  arm_sargsyan.2.t: "Coopération arméno-turque signée"
  arm_sargsyan.2.d: "La Turquie a accepté de signer un accord de coopération bilatéral."
  arm_sargsyan.2.a: "Bien"
  arm_sargsyan.3.t: "La Turquie refuse"
  arm_sargsyan.3.d: "Nos efforts pour rétablir les relations n'ont pas trouvé d'écho de l'autre côté."
  arm_sargsyan.3.a: "D'accord"
  arm_sargsyan.4.t: "Sargsyan visite Moscou"
  arm_sargsyan.4.d: "Sargsyan nous demande de permettre à l'Arménie de se rapprocher des pays de l'UE. Il soutient que cela n'entraînera pas une rupture des liens avec nous."
  arm_sargsyan.4.a: "Nous sommes d'accord"
  arm_sargsyan.4.b: "L'Arménie ne peut pas nous quitter pour l'UE"
  arm_sargsyan.4.c: "Nous pouvons leur offrir un partenariat économique plus étroit"
  arm_sargsyan.5.t: "La Russie exige que nous abandonnions nos objectifs de rapprochement avec l'UE"
  arm_sargsyan.5.d: "La Russie s'oppose catégoriquement à tout rapprochement entre nous et l'UE, et menace donc de sanctions économiques si nous essayons de nous rapprocher."
  arm_sargsyan.5.a: "Nous maintenons notre position"
  arm_sargsyan.5.b: "Nous acceptons les exigences"
  arm_sargsyan.6.t: "L'Arménie n'a pas peur de nos menaces"
  arm_sargsyan.6.d: "Nos menaces n'ont pas effrayé la direction arménienne, devons-nous imposer les sanctions promises ?"
  arm_sargsyan.6.a: "Nous les avions prévenus"
  arm_sargsyan.6.b: "Peut-être la prochaine fois pourrons-nous trouver un arrangement"
  arm_sargsyan.7.t: "La Russie propose un accord"
  arm_sargsyan.7.d: "Si nous abandonnons nos plans de rapprochement avec l'UE, nous recevrons une aide économique en retour. Mais si nous rejetons l'offre, il y aura des conséquences."
  arm_sargsyan.7.a: "Marché conclu"
  arm_sargsyan.7.b: "Nous rejetons cette offre"
  arm_sargsyan.8.t: "La Russie accepte"
  arm_sargsyan.8.d: "La Russie accepte notre rapprochement avec l'Union européenne."
  arm_sargsyan.8.a: "Parfait"
  arm_sargsyan.9.t: "L'Arménie cède"
  arm_sargsyan.9.d: "L'Arménie décide de ne pas nous contredire et accepte nos exigences."
  arm_sargsyan.9.a: "Bien"
  arm_sargsyan.10.t: "La Russie recule"
  arm_sargsyan.10.d: "La Russie a décidé de retirer ses menaces et de nous laisser tranquillement mettre en œuvre nos objectifs."
  arm_sargsyan.10.a: "Parfait"
  arm_sargsyan.11.t: "L'Arménie rejette l'accord"
  arm_sargsyan.11.d: "Malgré nos tentatives de leur offrir une proposition économique avantageuse, elle a été rejetée."
  arm_sargsyan.11.a: "Dommage"
  arm_sargsyan.12.t: "Journée européenne en Arménie"
  arm_sargsyan.12.d: "La délégation de l'UE en Arménie organisera des événements festifs à Erevan et dans différentes régions du pays, ainsi que des réunions d'information, des expositions et des concerts dédiés aux activités de l'UE en Arménie."
  arm_sargsyan.12.a: "C'est une bonne idée"
  arm_sargsyan.12.b: "Non"
  arm_sargsyan.13.t: "L'UE nous soutient"
  arm_sargsyan.13.d: "Les principaux pays de l'UE ont accepté de soutenir notre initiative européenne."
  arm_sargsyan.13.a: "Vers l'avenir avec l'Europe"
  arm_sargsyan.14.t: "L'UE refuse de nous soutenir"
  arm_sargsyan.14.d: "Les pays de l'UE ont ignoré notre événement et ne nous ont pas soutenus."
  arm_sargsyan.14.a: "D'accord"
  arme.12.t: "Contacter les oligarques"
  arme.12.d: "Lors du prochain congrès, où des discussions entre le gouvernement et les oligarques ont lieu, Gagik Tsarukyan a proposé de nous aider à établir un contrôle sur l'opposition en créant une coalition informelle entre les partis."
  arme.12.a: "Bien sûr !"
  arme.12.b: "Désolé, non."

