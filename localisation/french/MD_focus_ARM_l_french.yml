  ##########ARBRE MONARCHISTE##########
  ##########Focus##########
  ARM_monarch: "§YRestauration de la monarchie§!"
  ARM_monarch_desc: "Aucun militaire, parti ou autre figure n'a le droit de diriger le pays. Le dirigeant le plus légitime ne peut être qu'un monarque dont l'approche paternaliste peut mener l'Arménie à la grandeur."
  ARM_assemble_meliq_union: "Rassembler l'Union Meliq"
  ARM_assemble_meliq_union_desc: "L'Union Meliq est une organisation aristocratique traditionaliste en Arménie. Nous devons réunir chaque membre de cette organisation pour élire un nouveau Tagavor."
  ARM_armeno_ari_union: "Union arméno-aryenne"
  ARM_armeno_ari_union_desc: "L'Union arméno-aryenne est un parti politique en Arménie qui prône le retour aux anciennes traditions païennes arméniennes et la restauration du Royaume d'Arménie tel qu'il était dans l'Antiquité."
  ARM_bagratuni: "Prétendant Bagratuni ?"
  ARM_bagratuni_desc: "La dynastie Bagratuni ou Bagratide est une dynastie royale arménienne qui a régné sur le Royaume médiéval d'Arménie. Originaires comme vassaux du Royaume d'Arménie de l'Antiquité, ils sont devenus la famille noble arménienne la plus importante pendant la période de domination arabe en Arménie, établissant finalement leur propre royaume indépendant. Ils sont également les ancêtres de la dynastie royale géorgienne Bagrationi. Cependant, Roland von Bagratuni n'a pas pleinement prouvé sa descendance de la dynastie Bagratuni, ce qui suscite de nombreuses inquiétudes parmi les membres de l'Union Meliq."
  ARM_savoya: "Maison de Savoie"
  ARM_savoya_desc: "La dernière famille royale d'Arménie était la famille Lusignan. Lorsque le Royaume de Cilicie fut détruit en 1375, le dernier roi Levon VI (Léon VI) a transmis le titre de Roi d'Arménie à Jacques Ier (Hakob Ier), Roi de Chypre, qui était de la même famille Lusignan. En 1489, la reine Charlotte a transmis le titre à son cousin Charles le Guerrier, duc de Savoie (en Italie)."
  ARM_going_to_roots: "Retour à nos racines"
  ARM_going_to_roots_desc: "L'Arménie est l'un des pays les plus anciens ayant survécu jusqu'à ce jour. Tous les peuples n'ont pas réussi à survivre, mais c'est notre nation qui a traversé un chemin semé d'embûches, que beaucoup n'auraient pas surmonté. La foi de nos ancêtres, leurs glorieux exploits et leurs traditions sont ce qui nous a permis de survivre et de continuer à lutter."
  ARM_glory_of_tigr: "Gloire de Tigrane le Grand"
  ARM_glory_of_tigr_desc: "Il est temps pour l'Arménie de se relever et de s'unir autour de son nouveau royaume renaissant, qui doit atteindre les sommets atteints par Tigrane le Grand et même les surpasser !"
  ARM_state_christianity: "Christianisme d'État"
  ARM_state_christianity_desc: "La constitution de notre État décrit déjà l'importance de l'Église arménienne dans la vie de notre peuple. Cependant, le moment est venu de faire de l'Église une partie intégrante de l'État et de l'intégrer dans tous les aspects de la vie."
  ARM_restoring_aspets: "Restauration des Aspets"
  ARM_restoring_aspets_desc: "Les Aspet Dziavors ou Ayrudzis étaient des chevaliers arméniens qui servaient comme guerriers loyaux des tagavors arméniens ou des familles nobles. Nous devons restaurer ce titre dans notre armée, en combinant les anciennes traditions avec la guerre moderne."
  ARM_support_pan_iranists: "Colère parthe"
  ARM_support_pan_iranists_desc: "Nous, Arméniens, sommes les seuls vestiges de l'Empire arsacide, qui fut détruit par les Sassanides dans une série d'événements malheureux. Maintenant, nous devons décider : devons-nous nous allier et nous unir aux Perses, ou devons-nous restaurer notre dynastie en Iran."
  ARM_REV_PER_TT: "§YNous déclencherons une révolution en [PER.GetNamewithFlag] pour renverser leur gouvernement§!"
  ARM_give_money_to_kob: "Soutenir KOB"
  ARM_give_money_to_kob_desc: "Le parti conceptuel KOB partage des valeurs très similaires aux nôtres. Nous devons soutenir nos frères de Russie pour créer un axe cohérent de nos alliés dans la région."
  ARM_supporting_chechens: "Soutenir l'Ichkérie"
  ARM_supporting_chechens_desc: "Pendant la première guerre de Tchétchénie, Roland von Bagratuni a entretenu une correspondance avec Djokhar Doudaïev, où ils ont discuté de la résistance à la Russie et des ambitions pan-caucasiennes."
  ARM_crusader_legacy: "Héritage des croisades"
  ARM_crusader_legacy_desc: "Parmi les bonnes actions que le peuple arménien a accomplies envers l'Église et le monde chrétien, il faut souligner que, lorsque les princes chrétiens et les guerriers sont partis reprendre la Terre Sainte, aucun peuple ou nation n'est venu à leur aide avec autant d'enthousiasme, de joie et de foi que les Arméniens, qui ont fourni aux croisés des chevaux, des provisions et des guides. Les Arméniens ont aidé ces guerriers avec tout leur courage et leur loyauté pendant les guerres saintes. - Pape Grégoire XIII"
  ARM_our_old_realm: "La dette d'Édouard"
  ARM_our_old_realm_desc: "Le dernier roi de la Cilicie arménienne, dans ses efforts pour appeler à une nouvelle croisade pour la libération de l'Arménie, a visité le roi d'Angleterre Édouard III. Dans l'espoir de restaurer le Royaume de Cilicie, Levon a placé le trésor d'État en lieu sûr, le confiant au roi anglais. Les parties ont conclu un accord selon lequel le trésor serait conservé en Angleterre jusqu'à la libération et la restauration du Royaume arménien. Il est temps de réclamer notre argent."
  ARM_renewed_nobility: "Noblesse renouvelée"
  ARM_renewed_nobility_desc: "Nous devons non seulement intégrer l'ancienne noblesse, qui pourrait hésiter à coopérer avec nous, mais aussi créer une nouvelle caste d'aristocratie à partir de nos commandants militaires."
  ARM_polish_hung_dilem: "Dilemme polonais"
  ARM_polish_hung_dilem_desc: "Roland von Bagratuni est venu de Pologne en Arménie et est prêt à soutenir le mouvement monarchiste dans sa première patrie."
  ARM_fate_of_italy: "Destin de l'Italie"
  ARM_fate_of_italy_desc: "La Maison de Savoie possède légitimement le titre de Rois d'Italie. Nous devons commencer à réfléchir à la manière de nous unir à notre seconde couronne."
  ARM_true_tseghakronism: "Vrai Tséghakronisme"
  ARM_true_tseghakronism_desc: "En tant que monarchie nouvellement établie, nous devons soutenir les idées tséghakronistes car elles s'alignent pleinement sur notre direction traditionaliste."
  ARM_new_religious_thought: "Nouvelle pensée religieuse"
  ARM_new_religious_thought_desc: "Les dirigeants de notre conseil estiment qu'il est dans l'esprit de nos idéaux de faire revivre l'ancienne foi autochtone arménienne et de l'intégrer dans notre société."
  ARM_support_ossetia: "Soutenir l'Ossétie"
  ARM_support_ossetia_desc: "L'Ossétie est l'un des rares pays du Caucase qui non seulement partage notre sang, mais aussi nos idéaux. Nous devons soutenir leur cause."
  ARM_pan_caucasianism: "Pan-caucasianisme"
  ARM_pan_caucasianism_desc: "L'unification de tout le Caucase sous notre drapeau est l'objectif de notre roi et sa volonté doit être accomplie."
  ARM_liberating_levant: "Libération du Levant"
  ARM_liberating_levant_desc: "Comme l'ont fait nos ancêtres occidentaux et arméniens, nous devons lancer une nouvelle croisade pour libérer le Levant et rétablir les anciens États croisés."
  ARM_true_urheimat: "Vrai Urheimat"
  ARM_true_urheimat_desc: "L'Arménie est la véritable patrie de tous les Indo-Européens. Comme notre parti l'a initialement déclaré :\n\nHaut-plateau arménien\nla patrie des Arméniens,\nberceau de la civilisation aryenne.\nAryens du monde entier,\nlibérez-la,\nlibérez-vous."

  ##########Événements##########
  arm_empire.2.t: "Unification avec nos frères arméniens"
  arm_empire.2.d: "Il est temps de nous unir et de nous tenir côte à côte avec nos frères arméniens. Ensemble, nous construirons un avenir grandiose, punissant nos ennemis communs et menant nos peuples à la prospérité."
  arm_empire.2.a: "Unissons-nous"
  arm_empire.2.b: "Croisons donc les bras"
  arm_empire.2.c: "Nous suivons des chemins différents"
  arm_empire.3.t: "Ils ont accepté de s'unifier"
  arm_empire.3.d: "Notre rêve s'est réalisé et maintenant les peuples arménien et perse sont à nouveau unis."
  arm_empire.3.a: "Bien"
  arm_empire.4.t: "Ils ont rejeté notre offre"
  arm_empire.4.d: "Nous n'avons pas réussi à les convaincre de nous rejoindre."
  arm_empire.4.a: "D'accord"
  arm_empire.5.t: "Ils ont choisi une alliance avec nous"
  arm_empire.5.d: "Ils ont décidé que la meilleure option était de devenir notre allié."
  arm_empire.5.a: "Bien"
  arm_empire.6.t: "L'Arménie propose d'acheter [SOO.GetName]"
  arm_empire.6.d: "Le gouvernement arménien nous a contactés aujourd'hui avec une proposition inhabituelle. Ils ont l'intention d'acheter le territoire de [SOO.GetName] pour une somme considérable. Nous sommes choqués par une telle offre, d'autant plus que les diplomates arméniens ont clairement laissé entendre que leur refus entraînerait des conséquences négatives."
  arm_empire.6.a: "C'est absurde !"
  arm_empire.6.b: "Nous acceptons"
  arm_empire.7.t: "L'Arménie propose d'acheter [SOO.GetName]"
  arm_empire.7.d: "Le gouvernement arménien nous a contactés aujourd'hui avec une proposition inhabituelle. Ils ont l'intention d'acheter le territoire de [SOO.GetName] pour une somme considérable. Nous sommes choqués par une telle offre, d'autant plus que les diplomates arméniens ont clairement laissé entendre que leur refus entraînerait des conséquences négatives."
  arm_empire.7.a: "C'est absurde !"
  arm_empire.7.b: "Nous acceptons"
  arm_empire.8.t: "L'Arménie propose de nous acheter"
  arm_empire.8.d: "Le gouvernement arménien a pris contact diplomatique avec nous aujourd'hui avec une proposition très inhabituelle. Ils ont l'intention de littéralement acheter notre pays pour le placer sous leur contrôle pour une somme très importante. Bien sûr, le montant sera présenté de manière plus diplomatique dans les médias officiels, mais la somme proposée est considérable. De plus, leur patronage, contrairement à la Russie, qui n'a pas accepté de faire de nous une partie de son pays pendant de nombreuses années, est attrayant."
  arm_empire.8.a: "Délire !"
  arm_empire.8.b: "Nous acceptons"
  arm_empire.9.t: "[SOO.GetName] refuse l'offre"
  arm_empire.9.d: "Leur gouvernement a refusé notre offre généreuse. Eh bien, il semble que nous devrons chercher d'autres moyens d'interagir avec eux."
  arm_empire.9.a: "Dommage"
  arm_empire.10.t: "L'Arménie exige le retour de l'argent"
  arm_empire.10.d: "Maintenant que le Royaume d'Arménie a été restauré, il est temps pour nous de respecter les termes de l'ancien traité, selon lequel le trésor arménien conservé en Grande-Bretagne a été transféré là-bas par un traité en 1378. En cas d'obtention de l'indépendance par l'Arménie, le trésor doit être restitué."
  arm_empire.10.a: "Nous tenons nos promesses"
  arm_empire.10.b: "Ce n'est pas l'Arménie avec laquelle le traité a été conclu."
  arm_empire.11.t: "La Grande-Bretagne refuse de rendre l'argent"
  arm_empire.11.d: "Sans surprise, on ne peut rien confier aux Britanniques, pas même notre argent."
  arm_empire.11.a: "Nous les forcerons à rendre l'argent, mais pas maintenant"
  arm_empire.12.t: "La Grande-Bretagne respecte les termes du traité"
  arm_empire.12.d: "Le gouvernement britannique a accepté de nous rendre notre argent."
  arm_empire.12.a: "Peut-être pouvons-nous vraiment compter sur les Britanniques en temps de besoin"
  arm_empire.13.t: "L'Arménie remet en question notre souveraineté sur les territoires"
  arm_empire.13.d: "Il n'était qu'une question de temps avant qu'une Arménie nouvellement renforcée décide de reprendre le contrôle de tous ses territoires. Nous ne pouvons qu'espérer que notre armée sera capable de repousser la menace extérieure."
  arm_empire.13.a: "Une nouvelle croisade a commencé"
  arm_empire.14.t: "Unification sous une seule couronne"
  arm_empire.14.d: "Maintenant, après l'arrivée au pouvoir de la Maison de Savoie en Arménie, nous avons l'opportunité de nous réunir sous une seule couronne."
  arm_empire.14.a: "Nous acceptons de nous unir avec l'Arménie"
  arm_empire.14.b: "Parlons d'intégration"
  arm_empire.14.c: "Non"
  arm_empire.15.t: "L'Italie accepte de devenir notre territoire"
  arm_empire.15.d: "La couronne italienne a accepté de s'unir à nous sous la suprématie de notre Maison."
  arm_empire.15.a: "Parfait"
  arm_empire.16.t: "L'Italie rejette notre offre"
  arm_empire.16.d: "L'Italie a refusé notre offre, montrant ainsi un degré extrême de manque de respect envers nous."
  arm_empire.16.a: "C'est leur problème"
  arm_empire.17.t: "L'Italie propose de s'unir sous son drapeau"
  arm_empire.17.d: "L'Italie nous propose de devenir une partie d'elle, ce qui nous apportera de grands avantages financiers et politiques. Nous pourrons également préserver notre souveraineté."
  arm_empire.17.a: "Peut-être vous ?"
  arm_empire.17.b: "Nous acceptons"
  arm_empire.18.t: "L'Arménie rejette notre proposition et nous propose de devenir une partie d'elle"
  arm_empire.18.d: "L'Arménie nous invite à devenir une partie d'elle. Nous pourrons conserver une partie de notre souveraineté."
  arm_empire.18.a: "Non"
  arm_empire.18.b: "Unissons-nous"
  arm_empire.19.t: "L'insurrection en Tchétchénie"
  arm_empire.19.d: "La guerre a recommencé en Tchétchénie. Selon nos services de renseignement, les rebelles tchétchènes ont été financés par les services spéciaux arméniens pour déclencher une insurrection. Il semble que le gouvernement arménien soit intéressé par l'instabilité dans notre pays."
  arm_empire.19.a: "La troisième guerre de Tchétchénie a commencé"
  arm_empire.20.t: "L'insurrection en Tchétchénie"
  arm_empire.20.d: "La guerre a recommencé en Tchétchénie. Selon nos services de renseignement, les rebelles tchétchènes ont été financés par les services spéciaux arméniens pour déclencher une insurrection. Il semble que le gouvernement arménien soit intéressé par l'instabilité dans notre pays."
  arm_empire.20.a: "La troisième guerre de Tchétchénie a commencé"
  arm_empire.21.t: "Unification sous un seul drapeau"
  arm_empire.21.d: "Maintenant, après l'arrivée au pouvoir de la Maison de Savoie en Arménie, nous avons l'opportunité de nous réunir sous un seul drapeau."
  arm_empire.21.a: "Nous acceptons de nous unir avec l'Arménie"
  arm_empire.21.b: "Parlons d'intégration"
  arm_empire.21.c: "Non"
  arm_empire.22.t: "La Tchétchénie accepte de devenir notre territoire"
  arm_empire.22.d: "Le gouvernement tchétchène a accepté de s'unir à nous sous notre drapeau."
  arm_empire.22.a: "Parfait"
  arm_empire.23.t: "La Tchétchénie rejette notre offre"
  arm_empire.23.d: "La Tchétchénie a refusé notre offre, montrant ainsi un degré extrême de manque de respect envers nous."
  arm_empire.23.a: "C'est leur problème"
  arm_empire.24.t: "La Tchétchénie propose de s'unir sous son drapeau"
  arm_empire.24.d: "La Tchétchénie nous propose de devenir une partie d'elle, ce qui nous apportera de grands avantages financiers et politiques. Nous pourrons également préserver notre souveraineté."
  arm_empire.24.a: "Peut-être vous ?"
  arm_empire.24.b: "Nous acceptons"
  arm_empire.25.t: "L'Arménie rejette notre proposition et nous propose de devenir une partie d'elle"
  arm_empire.25.d: "L'Arménie nous invite à devenir une partie d'elle. Nous pourrons conserver une partie de notre souveraineté."
  arm_empire.25.a: "Non"
  arm_empire.25.b: "Unissons-nous"
  arm_empire.26.t: "La guerre civile polonaise"
  arm_empire.26.d: "En raison des récents événements et, en fait, du transfert du pouvoir à un gouvernement fantoche pro-arménien, toutes les forces politiques n'étaient pas d'accord avec cette position de la Pologne. De nombreux généraux de l'armée polonaise, avec le soutien des partis politiques occidentaux, ont organisé une rébellion contre nous !"
  arm_empire.26.a: "Que Dieu nous sauve"
  arm_empire.26.b: "Soudain"
  arm_empire.27.t: "La guerre civile italienne"
  arm_empire.27.d: "En Italie, après les événements survenus, une crise politique a immédiatement commencé. Beaucoup dans le pays étaient mécontents du régime ouvertement fantoche qui a pris le contrôle du pays. En conséquence, tout cela a conduit à un soulèvement armé dirigé par des forces politiques pro-occidentales."
  arm_empire.27.a: "Que Dieu nous sauve"
  arm_empire.27.b: "Soudain"
  arm_empire.28.t: "Soutien au parti conceptuel 'Unité'"
  arm_empire.28.d: "Le système politique russe ne nous laisse pas beaucoup de choix quant au favori à promouvoir pour nos intérêts politiques. Nous considérons le gouvernement actuel comme purement hostile à notre pays, nous avons donc l'intention de promouvoir nos intérêts en Russie à travers notre protégé."
  arm_empire.28.a: "Allons-y"
  arm_empire.29.t: "Financement continu du parti conceptuel 'Unité'"
  arm_empire.29.d: "Nous continuerons à financer ce parti, dans l'espoir que nos finances seront rentabilisées à l'avenir."
  arm_empire.29.a: "D'accord"
  arm_empire.30.t: "Destin du parti conceptuel 'Unité'"
  arm_empire.30.d: "Il est temps de décider si nous allons avancer vers le final de notre grand plan pour un changement de pouvoir en Russie, ou si nous allons continuer à renforcer notre influence."
  arm_empire.30.a: "C'est encore tôt"
  arm_empire.30.b: "Le moment est venu"
  arm_empire.31.t: "Rébellion du parti conceptuel 'Unité'"
  arm_empire.31.d: "Tous les préparatifs sont terminés, et maintenant nous ne pouvons qu'espérer que nos finances ont été bien dépensées."
  arm_empire.31.a: "Le moment est venu"
  arm_empire.32.t: "Le parti conceptuel 'Unité' a pris le pouvoir en Russie"
  arm_empire.32.d: "Le parti conceptuel 'Unité', dirigé par Konstantin Petrov, a pris le pouvoir en Russie sans grande résistance, et la désunion politique semble avoir affaibli les défenses internes du pays."
  arm_empire.32.a: "Nous perdons le pays."
  arm_empire.32.b: "Victoire !"
  arm_empire.33.t: "Rébellion du parti conceptuel 'Unité'"
  arm_empire.33.d: "Le parti conceptuel 'Unité', dirigé par Konstantin Petrov, a tenté de prendre le pouvoir à Moscou en organisant un coup d'État, mais les services spéciaux ont pu l'empêcher. Malheureusement, le parti s'est avéré avoir de nombreux partisans dans les régions, ce qui a provoqué des soulèvements dans tout le pays."
  arm_empire.33.a: "Nous perdons le pays."
  arm_empire.33.b: "Victoire partielle"
  arm_empire.34.t: "Échec de la rébellion du parti conceptuel 'Unité'"
  arm_empire.34.d: "Le parti conceptuel 'Unité', dirigé par Konstantin Petrov, a tenté de prendre le pouvoir à Moscou en organisant un coup d'État, mais les services spéciaux ont pu l'empêcher. De plus, tous les partisans de son parti dans les régions ont été arrêtés, tout s'est déroulé paisiblement."
  arm_empire.34.a: "La Russie est sauvée à nouveau."
  arm_empire.34.b: "Nous avons perdu."
  arm_empire_news.1.t: "La guerre civile polonaise"
  arm_empire_news.1.d: "Un gouvernement pro-arménien est arrivé au pouvoir en Pologne, que l'Arménie a soigneusement cultivé pendant de nombreuses années. Mais toutes les forces politiques du pays n'étaient pas satisfaites de cette situation. De nombreux généraux, ainsi que des partis politiques pro-occidentaux, ont organisé une rébellion pour renverser le gouvernement fantoche."
  arm_empire_news.1.a: "Pauvre Pologne"
  arm_empire_news.2.t: "La guerre civile italienne"
  arm_empire_news.2.d: "Une crise éclate en Italie. Le gouvernement pro-arménien a pris le contrôle du pays, et en conséquence, certaines forces politiques sont entrées en conflit armé ouvert avec l'autorité politique centrale du pays."
  arm_empire_news.2.a: "Pauvre Italie"
  arm_empire_news.3.t: "Émeutes dans les régions de Russie"
  arm_empire_news.3.d: "Le parti conceptuel 'Unité', dirigé par Konstantin Petrov, n'ayant pas réussi à prendre le pouvoir au Kremlin, a profité de la faiblesse des services spéciaux régionaux pour organiser des émeutes dans certaines régions de Russie où le parti bénéficiait d'un fort soutien."
  arm_empire_news.3.a: "Folie"
  arm_empire_news.4.t: "États-Unis d'Arménie"
  arm_empire_news.4.d: "Un événement historique a eu lieu aujourd'hui en Arménie. Le gouvernement arménien a annoncé la création d'un État totalement nouveau basé sur des principes et des lois radicalement différents de son prédécesseur, les États-Unis d'Arménie. Maintenant, l'Arménie est comme les États-Unis, mais dans le Caucase, un événement vraiment incroyable."
  arm_empire_news.4.a: "D'accord... ça va ?"

  ##########Idées##########
  ARM_new_nobility_idea: "Nouvelle noblesse"
  ARM_new_nobility_idea_desc: "La nouvelle aristocratie de notre État comprend non seulement les anciennes maisons restaurées dans leurs titres, mais aussi une nouvelle aristocratie militaire jeune."
  ARM_armenian_paganism_idea: "Hétanisme"
  ARM_armenian_paganism_idea_desc: "La foi autochtone arménienne, également appelée hétanisme, est un mouvement religieux néo-païen qui renoue avec les systèmes de croyances historiques et pré-chrétiennes et les religions ethniques des Arméniens."
  ARM_glory_of_tigran_idea: "Gloire de Tigrane"
  ARM_crusade_legacy_idea: "Esprit croisé"
  ARM_urheimat_restored_idea: "Urheimat restauré"
  ARM_tseghakronism_one_idea: "Tséghakronisme"
  ARM_renewed_knighthood_idea: "Chevalerie renouvelée"
  ARM_tseghakronism_two_idea: "Tséghakronisme"
  ARM_state_christianity_idea: "Chaque citoyen est chrétien"

  ##########Infobulles##########
