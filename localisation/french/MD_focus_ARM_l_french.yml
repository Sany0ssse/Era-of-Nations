ARM_corrupt_military: "Militaire Corrompu"
ARM_corrupt_military_desc: "La corruption dans l'armée arménienne est omniprésente et étouffante. De nombreux généraux se livrent à des activités extérieures pour s'enrichir, vendant du matériel militaire et pillant les entrepôts.\n\nCette §RIdea§! sera §Gsupprimée§! si notre §Rcorruption§! descend en dessous de $medium_corruption$."
