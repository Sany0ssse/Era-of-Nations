arm_levon.1.d: "Si nous acceptons le nouveau statut neutre de l'Arménie, nous pouvons en bénéficier dans une certaine mesure en obtenant un hub direct dans le Caucase et certains avantages financiers."
arm_levon.1.a: "Bien sûr"
