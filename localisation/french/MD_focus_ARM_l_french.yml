arm_pashinyan.1.t: "[ARM_Pashik_misters_loc]"
arm_pashinyan.1.d: "Le gouvernement de [ARM.GetNameWithFlag] affirme que leur gouvernement libéral ne représente pas une menace pour nous et ils acceptent de poursuivre la coopération."
arm_pashinyan.1.a: "D'accord, nous acceptons"
arm_pashinyan.1.b: "Non"
arm_pashinyan.2.t: "[SOV.GetNameWithFlag] nous fait confiance"
arm_pashinyan.2.d: "[FROM.GetNameWithFlag] a accepté notre position et nous a également confirmé qu'ils ne nous considéraient pas comme leur ennemi."
arm_pashinyan.2.a: "Bien"
arm_pashinyan.3.t: "[SOV.GetNameWithFlag] ne nous fait pas confiance"
arm_pashinyan.3.d: "[FROM.GetNameWithFlag] a déclaré que notre politique étrangère représente une menace pour eux, et notre tentative de changer leur opinion n'est qu'une couverture pour notre coopération avec les ennemis de [SOV.GetNameWithFlag]."
arm_pashinyan.3.a: "Mauvais"
arm_pashinyan.5.t: "Le peuple nous soutient"
arm_pashinyan.5.d: "Il y a deux ans, nous avons promis d'améliorer la vie de nos citoyens, et nous avons réussi à tenir cette promesse. Maintenant, le peuple nous soutient pleinement."
arm_pashinyan.5.a: "Bien"
arm_pashinyan.6.t: "Ils se souviennent de nos promesses ?"
arm_pashinyan.6.d: "De manière inattendue, les gens se sont souvenus de nos paroles selon lesquelles nous améliorerions leur niveau de vie. Maintenant, tout ce que nous devons faire, c'est justifier cet échec par d'autres raisons."
arm_pashinyan.6.a: "Nous pensions pouvoir nous en sortir sans dépenser trop d'argent..."
arm_pashinyan.7.t: "Controverses dans la constitution"
arm_pashinyan.7.d: "Il y a plusieurs articles contradictoires dans notre constitution qui nous empêchent d'établir des relations diplomatiques normales avec nos voisins."
arm_pashinyan.7.a: "D'accord"
arm_pashinyan.8.t: "Rivaux au pouvoir"
arm_pashinyan.8.d: "Serzh Sargsyan et Robert Kotcharian menacent notre pouvoir car ils pourraient revenir au pouvoir. Nous devons saper leur autorité."
arm_pashinyan.8.a: "Mener une enquête complète"
arm_pashinyan.8.b: "Une simple calomnie politique suffira"
arm_pashinyan.9.t: "Question du système politique"
arm_pashinyan.9.d: "Maintenant que notre programme politique a atteint la plupart de ses objectifs, nous devons décider comment avancer à l'avenir. Nous pouvons continuer à adhérer aux principes démocratiques, ou nous pouvons limiter quelque peu les libertés politiques."
arm_pashinyan.9.a: "Nous ne devons pas perdre notre emprise"
arm_pashinyan.9.b: "Nous avons promis la démocratie au peuple, nous nous y tiendrons"
arm_pashinyan.10.t: "Discours anti-Biélorussie au parlement"
arm_pashinyan.10.d: "« Je déclare que je ne me rendrai plus jamais en Biélorussie tant que le président Alexandre Loukachenko sera en place. Et en général, je déclare qu'à partir de maintenant, aucun représentant officiel de l'Arménie n'ira en Biélorussie. Point final. »"
arm_pashinyan.10.a: "Je déteste les pommes de terre"
arme.35.t: "Dilemme de l'OTSC"
arme.35.d: "L'OTSC s'est révélé inefficace pour notre pays, car nos alliés nominaux refusent de nous aider contre les Azerbaïdjanais, qui violent constamment notre intégrité territoriale. Nous devons décider quoi faire de notre statut dans l'OTSC."
arme.35.a: "Déchirez les papiers et dites adieu !"
arme.35.b: "Peut-être devrions-nous geler notre adhésion."
arme.36.t: "[ARM.GetNameWithFlag] quitte l'OTSC !"
arme.36.d: "Récemment, la partie arménienne a annoncé qu'elle souhaitait quitter l'OTSC et organise actuellement la documentation pour une sortie complète de l'organisation. Cela affectera grandement notre influence dans la région."
arme.36.a: "Enroulez-vous comme une saucisse !"
arme.37.t: "[ARM.GetNameWithFlag] gèle son adhésion à l'OTSC !"
arme.37.d: "Récemment, la partie arménienne a annoncé qu'elle souhaitait geler son adhésion à l'OTSC, mais elle n'organise pas la documentation pour une sortie complète de l'organisation. Peut-être est-ce une décision politique visant la politique intérieure de leur pays."
arme.37.a: "Hein ?"

