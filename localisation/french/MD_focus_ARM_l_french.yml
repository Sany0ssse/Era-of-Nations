ARM_army_category: "[ARM.GetFlag]Armée Arménienne"
ARM_army_category_desc: "£text_icon_armarmy L'Armée de la [ARM.GetFlag]§YRépublique d'Arménie§! existe depuis environ 10 ans, période pendant laquelle elle a traversé toute la §Rguerre pour l'indépendance§! de §Y[NKR.GetFlag]Artsakh§! contre §Y[AZE.GetFlag]Azerbaïdjan§!.\n\nMais nous devons nous rappeler que [ARM.GetFlag]§Votre État§! fait face inévitablement à la possibilité d'une répétition de ces événements, et nous devons être §Gpréparés§!, tout comme £text_icon_armarmy notre armée.\n\nEn §Gcomplétant§! les focalisations dans la branche £text_icon_armarmy §Ymilitaire§!, vous §Gdébloaterez§! de plus en plus d'§Yesprits nationaux§!, qui seront affichés ci-dessous."
