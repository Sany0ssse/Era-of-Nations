##########ARBRE DES SERVICES SPÉCIAUX##########
##########Focalisations##########
ARM_defence: "En garde de l'Arménie"
ARM_defence_desc: "Notre pays a besoin d'une meilleure protection, et seuls les meilleurs services spéciaux peuvent la fournir, ce que nous financerons généreusement."
ARM_police: "Police d'Arménie"
ARM_police_desc: "La police de la République d'Arménie est la police nationale de l'Arménie. Nous sommes maintenant prêts pour des réformes globales de cette structure, nous embaucherons de nouveaux personnels, éliminerons les fonctionnaires corrompus et augmenterons le financement de la police."
ARM_police_troops: "Troupes de police"
ARM_police_troops_desc: "Les troupes de police arméniennes, qui ont activement participé à toutes les opérations de combat menées par les anciennes troupes internes arméniennes et les troupes internes soviétiques. Les unités militaires des troupes internes du ministère arménien de l'Intérieur avaient un large éventail d'activités : protection des installations spéciales, maintien de l'ordre public, service de sécurité publique, formation préalable des conscrits et formation des sous-officiers."
ARM_national_central_bureau: "Bureau central national"
ARM_national_central_bureau_desc: "Le département de police est divisé en trois divisions, chacune ayant un éventail différent de responsabilités, de la criminologie au soutien technique de la police. Ces trois départements doivent remplir leurs fonctions à 100 %, et nous augmenterons leur financement et procéderons à des réformes du personnel pour qu'ils puissent accomplir cette tâche avec certitude."
ARM_special_oper_forces: "Forces d'opérations spéciales"
ARM_special_oper_forces_desc: "Forces spéciales d'élite de la police arménienne pour contrer la multitude d'opposants à l'État. À l'heure actuelle, cette structure ne répond pas aux normes modernes des forces spéciales de police, et nous avons l'intention de changer cela en mettant à jour complètement leur composition et leur équipement."
ARM_black_panters: "Panthères noires"
ARM_black_panters_desc: "Anciens militaires intégrés dans les forces spéciales au sein de la police. Leur expérience et leurs méthodes de gestion des adversaires potentiels seront très précieuses et utiles pour les structures policières de notre État."
ARM_nss: "Service de sécurité nationale"
ARM_nss_desc: "Le Service de sécurité nationale est le service de sécurité sortant de l'Arménie, responsable des questions de sécurité nationale et de renseignement. Malheureusement, cette structure est encore relativement jeune et manque de personnel expérimenté, ce que nous changerons en effectuant les réformes nécessaires et en augmentant le financement de ce service spécial."
ARM_take_border_troops: "Garde-frontière"
ARM_take_border_troops_desc: "La garde-frontière arménienne est une branche du Service de sécurité nationale de l'Arménie, responsable de la surveillance et de la protection des frontières de l'Arménie avec ses voisins, la Turquie, l'Azerbaïdjan, l'Iran et la Géorgie. Malheureusement, ce service est financé à un niveau très faible par le budget, ce qui l'empêche d'exécuter pleinement ses fonctions prévues. Nous allons remédier à cela."
ARM_economic_corruption_security: "Sécurité économique et lutte contre la corruption"
ARM_economic_corruption_security_desc: "Cette unité est responsable de la lutte contre la corruption et de la sécurité économique, protégeant ainsi l'économie arménienne des influences internes négatives. Les priorités de l'économie et de la sécurité sont plus importantes que jamais pour nous, et en allouant des fonds à cette unité, nous ne lésinons pas."
ARM_constitutional_terrorism: "Sécurité et constitution"
ARM_constitutional_terrorism_desc: "La sécurité et la constitution sont les priorités de ce département, et pour garantir que ces priorités soient encore mieux remplies, nous allouerons des fonds supplémentaires pour le développement de ce département."
ARM_alpha: "Forces spéciales Alpha"
ARM_alpha_desc: "Les forces spéciales d'élite des services spéciaux arméniens, dont les missions varient d'un large éventail de tâches, de la lutte contre les bandits aux terroristes. Le renouvellement du personnel et l'augmentation du financement devraient avoir un impact positif sur le développement de cette structure."
ARM_fis: "Service de renseignement extérieur"
ARM_fis_desc: "Le Service de renseignement extérieur est la principale agence de renseignement externe de l'Arménie. Notre propre service de renseignement d'État, qui sera responsable de toutes nos actions de politique étrangère non officielles."

