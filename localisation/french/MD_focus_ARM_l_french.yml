  ARM_house_elections_warning_tt: "§RNous devons être prudents dans le choix du chef de la maison§!"
  ARM_bagratuni_house_chosen_tt: "La §RMaison de Bagratuni§! deviendra la maison régnante dans l'État."
  ARM_savoya_house_chosen_tt: "La §YMaison de Savoie§! deviendra la maison régnante en Arménie !"
  ARM_liberating_levant_tt: "Nous pourrons §Rexiger la soumission§! des §Ypays de la Terre Sainte§!. §RNous obtiendrons également des revendications§! sur leur territoire."

  ARM_kob_wait_tt: "Nous continuerons à §Raugmenter§! la popularité des partisans du parti conceptuel 'Unité' en Russie jusqu'à ce que nous jugions nécessaire de déclencher une §Rrévolution§!"
  ARM_kob_go_tt: "Le parti conceptuel 'Unité' §Ylancera§! une §Rtentative de coup d'État§! en Russie."

  ##########Dashnaktsutyun##########
  ##########Focus##########
  ARM_dashnak: "§YDashnaktsutyun§!"
  ARM_dashnak_desc: "La seule force politique ayant le droit de diriger l'Arménie est sans aucun doute le Dashnaktsutyun, le plus ancien parti d'Arménie, qui a guidé la Première République d'Arménie dès sa création. Seul leur agenda nationaliste de gauche peut mener l'Arménie à la grandeur."
  ARM_legacy_of_fedayi: "Héritage des Fédayis"
  ARM_legacy_of_fedayi_desc: "Nous devons honorer les fédayis arméniens qui ont lutté contre la tyrannie turque au siècle dernier. Nous devons nous préparer à la guerre, sinon les Turcs attaqueront et nous massacreront à nouveau !"
  ARM_end_to_democr: "Fin de la démocratie"
  ARM_end_to_democr_desc: "Il est grand temps de cesser de se bercer d'illusions et de détruire tout bastion de fausse démocratie établi en Arménie."
  ARM_bring_sefily: "Ramener Sefilyan"
  ARM_bring_sefily_desc: "Sefilyan était un fervent Dashnak jusqu'à ce que l'aile émergente de notre parti commence à trop apaiser la Russie. Nous devons nous réunifier avec le NDP !"
  ARM_venerate_nemesis: "Honorer l'opération Némésis"
  ARM_venerate_nemesis_desc: "L'opération Némésis était un programme de la Fédération révolutionnaire arménienne visant à assassiner les responsables ottomans du génocide arménien et les officiels de la République démocratique d'Azerbaïdjan les plus responsables du massacre des Arméniens pendant les Jours de Septembre 1918 à Bakou."
  ARM_nzhdehs_thought: "Intégrer la pensée de Nzhdeh"
  ARM_nzhdehs_thought_desc: "Garegin Nzhdeh s'est séparé des Dashnaks à un moment donné, s'écartant de notre agenda social-nationaliste. Cependant, nous devons essayer d'intégrer sa pensée dans notre philosophie et utiliser son image pour la promotion du parti."
  ARM_soc_nationalism: "Social-nationalisme"
  ARM_soc_nationalism_desc: "Au cœur de son identité, le Dashnaktsutyun est à la fois un parti socialiste et nationaliste arménien. Peu importe ce qui s'est passé au 20e siècle, nous devons renforcer notre idéologie et construire une nouvelle Arménie !"
  ARM_just_like_eagle: "Comme l'aigle de Taron"
  ARM_just_like_eagle_desc: "En utilisant davantage la rhétorique nzhdehiste, nous pouvons attirer plus de nationalistes arméniens dans nos rangs et construire une société véritablement nationale."
  ARM_harmonize_economy: "Harmoniser l'économie"
  ARM_harmonize_economy_desc: "Nous devons utiliser les syndicats et la nationalisation de l'industrie pour harmoniser l'économie en retirant le capital des mains des capitalistes."
  ARM_scout_movem_ref: "Réformer le mouvement scout"
  ARM_scout_movem_ref_desc: "Le mouvement scout arménien est soutenu et sponsorisé par les Dashnaks depuis longtemps. Nous devons maintenant le militariser et former les futurs jeunes combattants."
  ARM_militarized_society: "Société militarisée"
  ARM_militarized_society_desc: "Notre société doit être une grande armée, une armée du peuple avec un esprit dédié à écraser nos ennemis."
  ARM_incr_contr_diaspora: "Augmenter le contrôle sur la diaspora"
  ARM_incr_contr_diaspora_desc: "Tout au long de leur histoire de confrontation avec la Turquie et dans la question de la survie du peuple, les Arméniens ont compté sur une coopération conjointe entre les grandes et petites communautés. Les groupes de guérilla volontaires, ainsi que l'influence de la diaspora axée sur le lobbying des intérêts, sont les clés de la prospérité de l'Arménie."
  ARM_first_republic_decl: "Héritier de la Première République"
  ARM_first_republic_decl_desc: "Nous sommes les héritiers légitimes de la République arménienne et il est de notre devoir sacré de récupérer toutes les terres de notre pays !"
  ARM_lebanon_coup: "Soutenir les Dashnaks libanais"
  ARM_lebanon_coup_desc: "La communauté arménienne est assez politiquement active au Liban. Nous pouvons soutenir la branche de notre parti au Liban pour organiser un coup d'État."
  ARM_prevail_of_east_looking_ideas: "Prédominance des idées orientées vers l'Est"
  ARM_prevail_of_east_looking_ideas_desc: "Nous ne devons pas nous limiter à notre propre agenda politique. Nous devons coopérer avec tous pour combattre l'influence occidentale !"
  ARM_review_all_with_koch: "Renouveler notre alliance avec Kocharyan"
  ARM_review_all_with_koch_desc: "Kocharyan a longtemps tenu notre parti en otage de ses ambitions politiques. Maintenant que nous sommes au pouvoir, nous pouvons décider de son utilité pour nous. Kocharyan a une influence sérieuse sur la politique arménienne. Nous pouvons l'utiliser comme l'un des outils pour gagner de l'influence en Arménie."
  ARM_ishkhan_saghat: "Position d'Ishkhan Saghatelyan"
  ARM_ishkhan_saghat_desc: "La position d'Ishkhan Saghatelyan est beaucoup plus modérée sur les politiques socialistes, mais il est très connu pour ses déclarations pro-russes."
  ARM_leftwing_origins: "Embrasser les origines de gauche"
  ARM_leftwing_origins_desc: "Nous devons nous souvenir des racines de notre parti et revenir aux idées du marxisme avec des caractéristiques arméniennes."
  ARM_marxist_thought_integr: "Intégrer la pensée marxiste"
  ARM_marxist_thought_integr_desc: "Nous devons réintégrer la pensée marxiste dans notre agenda social-nationaliste et construire un État véritablement révolutionnaire !"
  ARM_spirit_of_revol: "Esprit de la révolution"
  ARM_spirit_of_revol_desc: "Nous devons faire de notre pays un avant-garde de la révolution. Une révolution contre l'impérialisme turc !"
  ARM_revol_selhoz: "Révolution agricole"
  ARM_revol_selhoz_desc: "Notre pays doit être capable de se nourrir lui-même, beaucoup de terres restent inutilisées pour les besoins agricoles, il est temps de corriger cela !"
  ARM_seize_oligs_stuff: "Saisie des actifs des oligarques"
  ARM_seize_oligs_stuff_desc: "Les oligarques doivent être soumis à notre État et leurs actifs doivent être nationalisés !"
  ARM_letter_to_russia: "Lettre à la Russie"
  ARM_letter_to_russia_desc: "Nous devons montrer à la Russie qu'ils ne sont plus seuls dans leur résistance à l'Occident libéral !"
  ARM_soc_welfare: "État-providence social"
  ARM_soc_welfare_desc: "Le nouvel agenda politique arménien doit être un État-providence social complet, où chaque citoyen est soutenu."
  ARM_hold_oligs_gunpoint: "Tenir les oligarques sous la menace"
  ARM_hold_oligs_gunpoint_desc: "Peut-être ne devrions-nous pas être si radicaux envers les oligarques et nationaliser tous leurs actifs, mais nous devons nous assurer que leurs taxes sont élevées et qu'ils sont suffisamment responsables."
  ARM_pkk_negotiat: "Aider le PKK"
  ARM_pkk_negotiat_desc: "La lutte de nos frères kurdes doit être soutenue et honorée ! Nous devons mettre tout notre effort pour soutenir leur cause."
  ARM_union_states: "Proposition d'État d'union"
  ARM_union_states_desc: "Enfin, nous pouvons essayer de rejoindre le projet d'État d'union pour notre prospérité future."

