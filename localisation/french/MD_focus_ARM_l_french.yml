yerkr_party_change_tt: "Le parti §8junte militaire§! passera de §RYerkrapah§! à §Yforces armées d'Arménie§!"
ARM_nor_aven_first: "Avenue du Nord"
later_good_thing_tt: "Lorsque l'§Yidée§! des §Rproblèmes d'infrastructure à Erevan§! sera §Gsupprimée§!, nous obtiendrons des §Gbonus !§!"
ARM_infr_problems_yerevan: "Problèmes d'infrastructure à Erevan"
ARM_infr_problems_yerevan_desc: "En raison de la reconstruction du centre d'Erevan, des problèmes temporaires sont survenus, provoquant des embouteillages.\n§W------------------§!\nLorsque l'§Yidée§! sera §Gsupprimée§!, nous obtiendrons des §Gbonus de modificateurs d'état§! à Erevan."
ARM_nor_aven_sec: "Vieux Erevan"
norav_tt: "Nous obtiendrons §Ydiverses options§! sur ce qu'il faut faire avec le §Yprojet de l'Avenue du Nord§!"
olig_fortyfive_opinion_tt: "L'opinion des §Yoligarques§! doit être d'au moins §Y45 !§!"
rus_waits_tt: "Nous avons §Yconvenu§! avec [SOV.GetNameWithFlag] que nous résoudrons la §Rquestion de la dette§! dans un délai d'§Yun an !§!"
first_assasin_tt: "§YNous terminerons la première phase des assassinats politiques !§!"
second_assasin_tt: "§YNous terminerons la deuxième phase des assassinats politiques !§!"

arm_milit.1.t: "L'Arménie demande une licence pour fusils !"
arm_milit.1.d: "Récemment, le gouvernement arménien nous a approchés pour demander une licence de production de nos fusils d'assaut dans leur pays. Devrions-nous accepter cette offre ?"
arm_milit.1.a: "Où signer ?"
arm_milit.1.b: "Non, bien sûr."
arm_milit.2.t: "[FROM.GetNameWithFlag] accepte notre offre !"
arm_milit.2.d: "[FROM.GetNameWithFlag] a accepté notre offre et nous fournira tous les documents pour la production de fusils."
arm_milit.2.a: "Merveilleux."
arm_milit.3.t: "[FROM.GetNameWithFlag] rejette notre offre !"
arm_milit.3.d: "Ils ont rejeté notre offre et ne nous fourniront aucun document ou licence pour la production de leurs fusils."
arm_milit.3.a: "Pff."

arm_milit.4.t: "Offre d'Orsis"
arm_milit.4.d: "Récemment, l'entreprise militaire Orsis nous a fait une offre pour investir dans notre complexe militaro-industriel. Nous pouvons accepter leur offre ou poursuivre des objectifs politiques..."
arm_milit.4.a: "Bien sûr, nous acceptons !"
arm_milit.4.b: "Votre matériel est pour la chasse, pas pour l'armée !"

arm_milit.5.t: "L'armée d'Artsakh est intégrée à la nôtre"
arm_milit.5.d: "Les forces armées de la République d'Artsakh prennent des mesures pour s'intégrer à notre armée, pour une meilleure interaction et coopération de nos forces armées."
arm_milit.5.a: "Super !"

arme.4.t: "Enquête sur l'attentat de 1999"
arme.4.d: "Notre gouvernement a lancé une enquête officielle sur l'attentat terroriste contre le parlement en 1999. Pour éviter trop de troubles, l'affaire est traitée par des enquêteurs semi-indépendants. Voyons ce qu'ils découvriront."
arme.4.a: "Ouais, bien sûr..."

arme.5.t: "Résultats de l'enquête"
arme.5.d: "Les enquêteurs ne peuvent pas trouver le véritable commanditaire de l'attentat, et toutes les preuves mènent, d'une manière ou d'une autre, à nous ou à d'anciens membres du parti Dashnaktsutyun. Dans tous les cas, nous devons clore cette affaire démonstrative avant qu'elle n'aille trop loin. Mais que dirons-nous dans le rapport ?"
arme.5.a: "Clôturez simplement l'affaire."
arme.5.b: "Euh, accusez les Dashnaks !"

arme.6.t: "[ARM.GetNameWithFlag] demande des investissements !"
arme.6.d: "Notre ancien partenaire politique et ami, Robert Kotcharian, nous demande d'investir dans l'économie arménienne dans une transaction mutuellement bénéfique. Devrions-nous accepter ?"
arme.6.a: "Bien sûr !"
arme.6.b: "Désolé, pas cette fois."

arme.7.t: "[SOV.GetNameWithFlag] accepte !"
arme.7.d: "Grâce à nos bonnes relations avec le leadership politique russe, ils ont accepté d'investir dans notre économie et de construire une usine civile dans notre pays."
arme.7.a: "Merveilleux !"

arme.8.t: "[SOV.GetNameWithFlag] refuse !"
arme.8.d: "Malheureusement, la Russie n'a pas été convaincue d'investir dans notre économie et de signer l'accord."
arme.8.a: "Pff."

arme.9.t: "Projet de l'Avenue du Nord"
arme.9.d: "L'Avenue du Nord est un projet d'avenue piétonne que nous devons construire pour attirer des investissements et potentiellement générer beaucoup de revenus. Cependant, la question est : que faire des vieux bâtiments et de leurs résidents ?"
arme.9.a: "Compenser partiellement les pertes"
arme.9.b: "Compenser intégralement les pertes"
arme.9.c: "Rénover les bâtiments historiques anciens"

arme.10.t: "Accord de propriété contre dette"
arme.10.d: "L'Arménie a accepté de fournir des propriétés en échange de l'annulation de ses dettes d'État. L'Arménie était le seul pays dont nous n'avions pas annulé les dettes d'État pour maintenir une pression future, et cela a porté ses fruits."
arme.10.a: "Merveilleux !"

arme.11.t: "Assassinat de Poghos Poghosyan !"
arme.11.d: "Après la récente rencontre entre Robert Kotcharian et Poghos Poghosyan, ce dernier a été liquidé. Très probablement, le parti Dashnaktsutyun sera furieux. Nous devons décider quoi faire avec eux..."
arme.11.a: "Rapprochons les fidèles..."
arme.11.b: "Ils ne nous servent à rien."

arme.13.t: "Opposition affaiblie !"
arme.13.d: "Les organisations d'opposition et les bureaucrates déloyaux ont été éliminés de notre pays, et l'opposition est sévèrement affaiblie, ce qui est très utile dans notre situation. Le règne de Kotcharian est prolongé... pour l'instant."
arme.13.a: "Très bien..."

arme.14.t: "[ARM.GetNameWithFlag] rejoint l'§GÉtat d'Union !§!"
arme.14.d: "Récemment, le président arménien Robert Kotcharian a décidé de rejoindre le projet de l'État d'Union et de s'unir avec nous et les autres États membres !"
arme.14.a: "Merveilleux !"

koch_union_stat_tt: "[ARM.GetNameWithFlag] rejoindra l'§GÉtat d'Union !§!"

arme.15.t: "L'opposition gagne du soutien !"
arme.15.d: "En raison de l'inaction du gouvernement de Kotcharian, l'opposition a accru son soutien parmi la population et s'est consolidée."
arme.15.a: "Zut !"

