##########Événements##########
arme.73.t: "Statue du Christ en Arménie"
arme.73.d: "Notre grandiose projet religieux, la statue de Jésus-Christ, est achevé. Désormais, l'Arménie possède son propre visage du Christ sur son territoire, et les chrétiens du monde entier nous admirent."
arme.73.a: "Avec l'aide de Dieu"

##########ARBRE DEMIRCHYAN##########
ARM_Demirchyan: "§YParti populaire d'Arménie§!"
ARM_Demirchyan_desc: "Le Parti populaire d'Arménie (en arménien : Hayastani Zhoghovrdakan Kusaktsutyun) est un parti politique socialiste en Arménie. Il a été fondé par le dirigeant soviétique et arménien Karen Demirchyan, qui fut premier secrétaire du Parti communiste d'Arménie de 1974 à 1988. Aujourd'hui, son fils Stepan Demirchyan dirige le parti."
ARM_strat_technocrats: "Promouvoir les technocrates"
ARM_strat_technocrats_desc: "Pour faire de l'Arménie ce que nous voulons qu'elle soit, nous devons entreprendre une réforme à grande échelle du gouvernement et du cabinet des ministres, en écartant les anciens flatteurs du précédent gouvernement et en intégrant de nouveaux jeunes professionnels."
ARM_reindustr_country: "Reconstruction inversée"
ARM_reindustr_country_desc: "Le maudit Gorbatchev, avec sa perestroïka, a ruiné notre pays en le déshonorant et en le laissant en ruines. Il est temps de revenir au système socialiste et d'oublier pour longtemps ces terribles derniers jours de l'URSS."
ARM_demirch_gamble: "Le pari de Stepan"
ARM_demirch_gamble_desc: "Malgré les convictions socialistes de Stepan, il serait politiquement avantageux de s'unir à l'un des autres partis partageant notre agenda de politique étrangère."
ARM_legacy_of_father: "Héritage du père"
ARM_legacy_of_father_desc: "Nous n'avons qu'un slogan, une devise : tous ceux qui travaillent ont le droit de profiter des bienfaits de la vie. Les parasites, qui sucent le sang des travailleurs, doivent être privés de ces avantages. Et nous proclamons : tous pour les travailleurs, tous pour les travailleurs !"
ARM_mobilization_of_economy: "Mobilisation de l'économie"
ARM_mobilization_of_economy_desc: "Pour reconstruire le pays à neuf, il est nécessaire de mobiliser l'économie et d'utiliser toutes nos modestes ressources pour tripler les indicateurs économiques."
ARM_iron_fisting_oligs: "Écraser l'oligarchie"
ARM_iron_fisting_oligs_desc: "Nous devons nous assurer que les bandits des années 90 ne dirigent plus ce pays et son économie !"
ARM_socialism_with_human_face: "Socialisme à visage humain"
ARM_socialism_with_human_face_desc: "La religion et le socialisme ne sont pas du tout antagonistes. Même le gouvernement soviétique a toléré l'Église arménienne pendant son existence. Nous ne devons pas lutter contre l'Église, mais nous unir à elle !"
ARM_coalition_with_vazgen_supporters: "Coalition avec les partisans de Vazgen"
ARM_coalition_with_vazgen_supporters_desc: "L'attentat de 1999 contre le parlement visait spécifiquement à empêcher Yerkrapah et le Parti populaire d'Arménie d'accéder au pouvoir. Vazgen Sargsyan et Karen Demirchyan ont été assassinés lors de cet attentat. Nous devons nous unir à nouveau pour la prospérité de notre nation !"
ARM_remember_shaumian: "Stratégie de Shaumian"
ARM_remember_shaumian_desc: "Shaumian est un parfait exemple de nationalisme arménien et de bolchevisme unis pour le bien-être des travailleurs arméniens et l'unification globale du peuple. Nous devons soutenir son héritage."
ARM_euro_dilemma: "Dilemme européen"
ARM_euro_dilemma_desc: "Nous devons enfin décider de notre position vis-à-vis de l'Union européenne. Nous sommes plutôt favorables à l'UE, mais notre situation géopolitique pourrait nous imposer une position différente."
ARM_rebuilding_initiative: "Initiative de reconstruction"
ARM_rebuilding_initiative_desc: "Lénine comprenait que la renaissance du capitalisme n'était pas sûre pour la RSFSR, mais il la considérait acceptable, car il s'agissait d'une question de mesure. Et cette mesure était établie par les soviets eux-mêmes. Cela permettait de réguler la croissance du secteur capitaliste de l'économie : « Pour maintenir la voie vers le socialisme, nous faisons des concessions aux paysans dans des limites que nous jugerons nous-mêmes. »"
ARM_sov_legacy_cond_dec: "Condamnation des décisions soviétiques"
ARM_sov_legacy_cond_dec_desc: "Un siècle entier s'est écoulé depuis la formation de la République transcaucasienne. Déchirée par le nationalisme, elle s'est scindée en trois États. Nous devons oublier les différences nationales et historiques, et aider nos voisins à renverser le pouvoir bourgeois pour établir la dictature du prolétariat !"
ARM_invite_asala: "Expansion rouge"
ARM_invite_asala_desc: "L'Armée secrète arménienne pour la libération de l'Arménie (ASALA) était une organisation militante marxiste-léniniste active entre 1975 et les années 1990, dont l'objectif déclaré était de contraindre le gouvernement turc à reconnaître publiquement sa responsabilité dans le génocide arménien de 1915, à payer des réparations et à céder un territoire pour une patrie arménienne. L'ASALA elle-même et d'autres sources la décrivaient comme une organisation de guérilla et armée. Nous devons suivre ses traces."
ARM_workers_soldiers: "Travailleurs et soldats"
ARM_workers_soldiers_desc: "Nous ne pouvons pas séparer notre identité, notre aspiration à la justice nationale, de notre politique économique. Nous sommes un pays d'Arméniens, un pays de travailleurs et de soldats !"
ARM_support_patriotic_movement: "Soutien au mouvement patriotique"
ARM_support_patriotic_movement_desc: "Nous devons soutenir tous les mouvements patriotiques qui ne visent pas à restaurer un capitalisme débridé dans notre pays."

