###Expansion arménienne
arm_expansion.1.t: "[ARM.GetNameWithFlag] nous invite dans une alliance"
arm_expansion.1.d: "[ARM.GetNameWithFlag] nous propose une alliance afin que nous puissions ensemble contenir l'expansionnisme de [TUR.GetNameWithFlag]."
arm_expansion.1.a: "[TUR.GetNameWithFlag] ne résistera pas à notre puissance"
arm_expansion.1.b: "Désolé, mais nous aimons les kebabs"
arm_expansion.2.t: "[ARM.GetNameWithFlag] nous invite dans une alliance"
arm_expansion.2.d: "[ARM.GetNameWithFlag] nous propose une alliance afin que nous puissions ensemble contenir l'expansionnisme de [TUR.GetNameWithFlag]."
arm_expansion.2.a: "[TUR.GetNameWithFlag] ne résistera pas à notre puissance"
arm_expansion.2.b: "Désolé, mais nous aimons les kebabs"
arm_expansion.3.t: "[ARM.GetNameWithFlag] nous invite dans une alliance"
arm_expansion.3.d: "[ARM.GetNameWithFlag] nous propose une alliance afin que nous puissions ensemble contenir l'expansionnisme de [TUR.GetNameWithFlag]."
arm_expansion.3.a: "[TUR.GetNameWithFlag] ne résistera pas à notre puissance"
arm_expansion.3.b: "Désolé, mais nous aimons les kebabs"
arm_expansion.4.t: "[ARM.GetNameWithFlag] exige une justice historique"
arm_expansion.4.d: "S'il n'y a pas de réponse positive de notre part, ils lanceront l'opération « Croissant brisé »."
arm_expansion.4.a: "Nous n'avons pas d'autre choix..."
arm_expansion.4.b: "C'est notre chance de restaurer la grandeur de l'Empire ottoman !"
arm_expansion.5.t: "L'Arménie renonce à l'Artsakh"
arm_expansion.5.d: "Nous reconnaissons officiellement l'abandon complet de nos revendications sur le Haut-Karabagh."
arm_expansion.5.a: "Tout cela pour le bien de nos partenaires étrangers"
arm_expansion.6.t: "[ARM.GetNameWithFlag] souhaite établir des relations amicales avec nous"
arm_expansion.6.d: "Ils estiment qu'il est temps d'oublier les vieilles rancunes et conflits et de commencer à avancer ensemble vers un avenir meilleur."
arm_expansion.6.a: "Nous avons tous fait des erreurs"
arm_expansion.6.b: "Oubliez l'idée d'être amis avec nous"
arm_expansion.7.t: "[ARM.GetNameWithFlag] nous demande des investissements"
arm_expansion.7.d: "[ARM.GetNameWithFlag] nous demande d'investir dans leur infrastructure et, en retour, ils deviendront notre plaque tournante commerciale."
arm_expansion.7.a: "Nous sommes toujours ravis d'aider"
arm_expansion.7.b: "Ils ne sont plus capables de nous être utiles"
arm_expansion.8.t: "[FROM.GetNameWithFlag] accepte d'investir dans notre pays"
arm_expansion.8.d: "Heureusement, nous avons réussi à convaincre [FROM.GetNameWithFlag] d'investir chez nous."
arm_expansion.8.a: "Bien"
arm_expansion.9.t: "[FROM.GetNameWithFlag] refuse d'investir dans notre pays"
arm_expansion.9.d: "Il semble que [FROM.GetNameWithFlag] ne soit plus intéressé par une coopération avec nous."
arm_expansion.9.a: "Mauvais"
arm_expansion.10.t: "[ARM.GetNameWithFlag] nous propose un couloir de Zangezur vers Nakhitchevan"
arm_expansion.10.d: "Dans le cadre des nouveaux arrangements, [ARM.GetNameWithFlag] nous propose un couloir vers Nakhitchevan. Cela devrait exclure tout conflit supplémentaire entre nos pays."
arm_expansion.10.a: "Notre rêve a prévalu !"
arm_expansion.10.b: "Non, nous aimons l'Arménie"
arm_expansion.11.t: "[AZE.GetNameWithFlag] accepte de démilitariser Syunik"
arm_expansion.11.d: "Maintenant que nous avons démilitarisé Syunik et cédé le contrôle du couloir vers Nakhitchevan à [AZE.GetNameWithFlag], la guerre ne reviendra plus jamais dans notre pays."
arm_expansion.11.a: "Tout pour l'amitié avec nos partenaires !"
arm_expansion.12.t: "[AZE.GetNameWithFlag] refuse notre proposition"
arm_expansion.12.d: "Immédiatement après le refus de [AZE.GetNameWithFlag] de notre offre, une série de grandes manifestations a eu lieu à Bakou."
arm_expansion.12.a: "Peut-être est-ce pour le mieux"
arm_expansion.13.t: "[TUR.GetNameWithFlag] accepte"
arm_expansion.13.d: "[FROM.GetNameWithFlag] accepte de renouveler les relations diplomatiques avec nous."
arm_expansion.13.a: "Ensemble, nous sommes une force"
arm_expansion.14.t: "[TUR.GetNameWithFlag] refuse de reprendre les relations diplomatiques avec nous"
arm_expansion.14.d: "[TUR.GetNameWithFlag] a accepté notre refus de reconnaître les crimes de guerre de [TUR.GetNameWithFlag] pendant la Première Guerre mondiale, mais ne reprendra pas les relations diplomatiques avec nous."
arm_expansion.14.a: "Bof"
arm_expansion.15.t: "Le soulèvement en Arménie occidentale"
arm_expansion.15.d: "Nous avons une chance de déclencher un soulèvement armé en Arménie occidentale, actuellement sous contrôle turc, mais nous devons comprendre que cela nous impliquera dans une guerre avec la Turquie, et il n'y aura pas de retour en arrière."
arm_expansion.15.a: "Liberté pour l'Arménie occidentale !"
arm_expansion.15.b: "Nous ne prendrons aucun risque"
arm_expansion.16.t: "Le soulèvement en Arménie occidentale"
arm_expansion.16.d: "De manière inattendue pour nous, un soulèvement contre notre gouvernement a eu lieu dans ce qu'on appelle l'Arménie occidentale ! Les autorités arméniennes ont directement déclaré leur responsabilité dans l'organisation de cette rébellion, et des informations ont déjà émergé sur l'apparition de leurs militants aux côtés des rebelles, c'est scandaleux !"
arm_expansion.16.a: "Ils paieront pour cela."
arm_expansion.17.t: "Le soulèvement en Arménie occidentale"
arm_expansion.17.d: "L'heure est venue pour la dernière guerre pour la libération des terres ancestrales arméniennes, maintenant ou jamais, gloire à l'Arménie !"
arm_expansion.17.a: "Gloire à l'Arménie !"
ARM_west_armenia: "République d'Arménie occidentale"
ARM_turkey_compliance_idea: "Gouvernement d'Arménie occidentale"
ARM_shadow_of_sevres: "Ombre du traité de Sèvres"
ARM_shadow_of_sevres_desc: "Le traité de Sèvres est l'un des traités du système de Versailles-Washington, dont la création a marqué la fin de la Première Guerre mondiale. Il a été signé le 10 août 1920 à Sèvres (France) par les pays de l'Entente et les États qui les ont rejoints, d'une part, et le gouvernement de l'Empire ottoman, d'autre part. Le traité n'est pas entré en vigueur car l'Assemblée nationale turque a refusé de le ratifier. Il a été remplacé trois ans plus tard par le traité de Lausanne, qui a fixé les frontières de la Turquie dans leur forme actuelle."
ARM_active_diplomacy: "Diplomatie active"
ARM_active_diplomacy_desc: "Nous devons jouer un rôle de premier plan dans la politique régionale, et notre tâche fondamentale pour atteindre cet objectif sera de vaincre le principal mal du Caucase - la Turquie."
ARM_west_arm_gov: "Contacter le gouvernement d'Arménie occidentale"
ARM_west_arm_gov_desc: "La République d'Arménie occidentale, également connue sous le nom d'État d'Arménie, est un gouvernement en exil revendiquant la souveraineté sur des parties des hauts plateaux arméniens, y compris des sections de l'Arménie occidentale ainsi que Nakhitchevan, et parfois aussi le Haut-Karabagh. Ce pays autoproclamé affirme avoir sa propre présidence, son gouvernement, son parlement, sa constitution, son hymne national et ses armoiries."
ARM_agree_with_greece: "Restaurer la Grande Idée"
ARM_agree_with_greece_desc: "À l'heure actuelle, [TUR.GetNameWithFlag] détient de vastes territoires qui appartiennent de droit à [GRE.GetNameWithFlag]. Nous inviterons la Grèce à rejoindre notre coalition pour récupérer ce qui a été perdu."
ARM_negotiate_syria: "Négociations avec [SYR.GetNameWithFlag]"
ARM_negotiate_syria_desc: "Certaines des terres ancestrales de [SYR.GetNameWithFlag] sont également sous contrôle turc. Cependant, [SYR.GetNameWithFlag] est dans une position stratégique vulnérable en cas d'invasion éventuelle par le nord."
ARM_negotiate_kurds: "Négociations avec [KUR.GetNameWithFlag]"
ARM_negotiate_kurds_desc: "Depuis de nombreuses décennies, les Kurdes tentent d'établir leur propre État indépendant qui unira l'ensemble du peuple kurde. Aidons-les dans cette entreprise."
ARM_return_to_western_armenia: "Retour en Arménie occidentale"
ARM_return_to_western_armenia_desc: "Il est temps de récupérer ce qui a été perdu et de libérer le Caucase et l'Asie Mineure du colonialisme turc."
ARM_land_of_peace: "Terre de paix"
ARM_land_of_peace_desc: "L'expérience passée a montré que nous sommes incapables de récupérer nos territoires. Il est maintenant temps de repenser notre politique étrangère et d'essayer d'établir des relations avec nos voisins musulmans."
ARM_ussr_success_const: "Héritage de la RSS d'Arménie"
ARM_ussr_success_const_desc: "Pour établir des liens amicaux avec nos voisins, nous nous reconnaissons comme le successeur de la RSS d'Arménie, confirmant ainsi l'intégrité territoriale de toutes les autres RSS, y compris [AZE.GetNameWithFlag]."
ARM_normalize_relations_with_turkey: "Normaliser les relations avec la Turquie"
ARM_normalize_relations_with_turkey_desc: "La principale raison du long conflit entre la Turquie et l'Arménie était les crimes de guerre de la Turquie en Arménie occidentale. Cependant, nous ne sommes plus intéressés par cela, étant donné que plus d'un demi-siècle s'est écoulé depuis cette époque."
ARM_crossroad_of_peace: "Carrefour de la paix"
ARM_crossroad_of_peace_desc: "En tant que pays neutre qui entretient de bonnes relations avec ses voisins, nous leur proposerons d'investir dans notre économie."
ARM_zang_corr_question: "Question du couloir de Zangezur"
ARM_zang_corr_question_desc: "Conformément à notre nouvelle politique pacifique, nous ne sommes plus intéressés par le développement militaire de Syunik. Bien que ce soit une artère clé bloquant l'accès de l'Azerbaïdjan à son enclave de Nakhitchevan, et nous fournissant une route terrestre pour les approvisionnements militaires iraniens, nous n'avons plus l'intention d'utiliser cette région pour faire pression sur l'Azerbaïdjan."
ARM_anatolian_heritage: "Héritage anatolien"
ARM_anatolian_heritage_desc: "Il est nécessaire de commencer un échange culturel, économique, politique et scientifique entre nos pays pour stabiliser davantage nos relations."
ARM_scince_poten_idea: "Potentiel scientifique"
ARM_kazah_cooperation_idea: "Coopération [KAZ.GetNameWithFlag] - [ARM.GetNameWithFlag]"
ARM_shirvan_deal: "Proposer à [PER.GetNameWithFlag] un échange territorial"
arme.174.t: "[ARM.GetNameWithFlag] propose un échange territorial"
arme.174.d: "Récemment, l'Arménie nous a proposé d'échanger des territoires, en cédant notre province de Khoy, où vivent principalement des Kurdes iraniens, contre la province de Shirvan, peuplée de personnes parlant persan. Devons-nous accepter ?"
arme.174.a: "Bien sûr, pourquoi pas !"
arme.174.b: "Est-ce une sorte de complot ?"
arme.175.t: "[PER.GetNameWithFlag] refuse l'échange territorial !"
arme.175.d: "L'Iran ne veut pas céder Khoy en échange de Shirvan."
arme.175.a: "Ils le paieront."
ARM_turkey_negotiations: "Négociations avec [TUR.GetNameWithFlag]"
ARM_turkey_negotiations_desc: "Depuis notre indépendance, la Turquie a été un obstacle majeur au commerce avec l'Europe. Peut-être pouvons-nous normaliser nos relations avec eux et ouvrir les frontières."
arme.176.t: "Notre position sur les négociations avec [TUR.GetNameWithFlag]"
arme.176.d: "Il est temps de définir notre position sur les négociations avec la Turquie. Devons-nous commencer à essayer de normaliser les relations et ouvrir les frontières, ou devons-nous abandonner cette idée ?"
arme.176.a: "Informer la Turquie que nous sommes prêts à discuter."
arme.176.b: "Abandonner cette idée stupide."
arme.177.t: "[ARM.GetNameWithFlag] souhaite normaliser les relations !"
arme.177.d: "Récemment, l'Arménie nous a envoyé une proposition diplomatique pour normaliser et réguler les relations. À long terme, un partenariat mutuel et l'ouverture des frontières peuvent bénéficier aux deux parties. Cependant, l'Arménie exige de notre part la reconnaissance du génocide dans l'Empire ottoman. De nombreux activistes nationalistes estiment que cette reconnaissance pourrait entraîner des revendications territoriales ou des réparations économiques. Cependant, l'Arménie elle-même nie ces allégations."
arme.177.a: "Nous sommes prêts à normaliser, mais nous devons discuter de certains points."
arme.177.b: "Ils devront d'abord résoudre le conflit du Haut-Karabagh."
arme.177.c: "Comment osent-ils même penser à nous parler !"
arme.178.t: "[TUR.GetNameWithFlag] nous demande d'abandonner les accusations de génocide !"
arme.178.d: "La Turquie a reçu notre proposition, mais ils veulent que nous abandonnions les accusations et la reconnaissance du génocide. Que devons-nous leur répondre ?"
arme.178.a: "Exiger la justice n'équivaut pas à des réparations ou des revendications territoriales."
arme.178.b: "Nous pouvons abandonner nos aspirations, bien sûr."
arme.179.t: "[ARM.GetNameWithFlag] accepte !"
arme.179.d: "L'Arménie a accepté d'abandonner ses revendications concernant le génocide et est maintenant pleinement prête à normaliser les relations et à ouvrir les frontières pour le commerce."
arme.179.a: "Merveilleux !"

turkish_relat_negotated: "Relations arméno-turques normalisées"

arme.180.t: "[ARM.GetNameWithFlag] insiste !"
arme.180.d: "L'Arménie déclare une fois de plus qu'elle n'a aucune intention de revendiquer des territoires turcs. Au contraire, des musées de la paix et de l'histoire pourraient être construits pour condamner l'histoire sanglante et absoudre l'État turc de son passé ottoman. L'Arménie insiste sur le fait qu'elle souhaite favoriser le commerce et les relations politiques, et non un agenda irrédentiste."
arme.180.a: "Reconnaissons les atrocités passées et construisons un nouvel avenir."
arme.180.b: "Ils veulent nous humilier. C'est inacceptable."
arme.181.t: "[TUR.GetNameWithFlag] reconnaît le génocide arménien !"
arme.181.d: "La Turquie a récemment accepté de reconnaître le génocide de 1915 dans l'Empire ottoman et a normalisé ses relations avec nous."
arme.181.a: "Que Dieu nous bénisse !"
arme.182.t: "[TUR.GetNameWithFlag] refuse de normaliser les relations !"
arme.182.d: "La Turquie a récemment abandonné tous les efforts diplomatiques pour normaliser les relations avec nous. Plus aucun lien n'est établi désormais."
arme.182.a: "Ils ne changent jamais."
arme.183.t: "Opposition à l'ancien gouvernement"
arme.183.d: "Le changement radical de pouvoir dans notre pays n'est pas passé inaperçu. Les partisans de l'ancien gouvernement ont organisé une puissante campagne politique d'opposition contre nous, mettant ainsi à l'épreuve la force et la stabilité de notre gouvernement."
arme.183.a: "Leur temps est révolu."
arme.184.t: "Opposition à l'ancien gouvernement"
arme.184.d: "Le changement radical de pouvoir dans notre pays n'est pas passé inaperçu. Les partisans de l'ancien gouvernement ont organisé une puissante campagne politique d'opposition contre nous, mettant ainsi à l'épreuve la force et la stabilité de notre gouvernement."
arme.184.a: "Leur temps est révolu."
arme.185.t: "Opposition à l'ancien gouvernement"
arme.185.d: "Le changement radical de pouvoir dans notre pays n'est pas passé inaperçu. Les partisans de l'ancien gouvernement ont organisé une puissante campagne politique d'opposition contre nous, mettant ainsi à l'épreuve la force et la stabilité de notre gouvernement."
arme.185.a: "Leur temps est révolu."
arme.186.t: "Opposition à l'ancien gouvernement"
arme.186.d: "Le changement radical de pouvoir dans notre pays n'est pas passé inaperçu. Les partisans de l'ancien gouvernement ont organisé une puissante campagne politique d'opposition contre nous, mettant ainsi à l'épreuve la force et la stabilité de notre gouvernement."
arme.186.a: "Leur temps est révolu."
arme.187.t: "Manifestations dans les régions"
arme.187.d: "L'instabilité politique a également ébranlé nos marionnettes. Les États sous notre contrôle sont secoués par des manifestations anti-arméniennes, nous devons régler cela rapidement."
arme.187.a: "Bon sang"
arme.188.t: "L'Arménie demande des armes"
arme.188.d: "L'Arménie, en tant que membre à part entière de l'OTAN, a lancé un programme de réarmement et nous demande maintenant de leur fournir certaines armes pour leur armée réformée."
arme.188.a: "Nous fournirons des armes"
arme.188.b: "Non"
arme.189.t: "Armes de l'OTAN"
arme.189.d: "[FROM.GetNameWithFlag] a accepté de nous fournir des armes pour réarmer notre armée."
arme.189.a: "Super"
arme.190.t: "Armes de l'OTAN"
arme.190.d: "[FROM.GetNameWithFlag] a refusé de nous fournir des armes pour réarmer notre armée."
arme.190.a: "Triste"
arme.223.t: "La rébellion en Azerbaïdjan"
arme.223.d: "Les séparatistes azerbaïdjanais ont profité de l'impréparation de nos services spéciaux ainsi que de notre petite armée et ont lancé un soulèvement armé pour tenter de libérer leur pays de notre domination."
arme.223.a: "Oh non"
arme.224.t: "La rébellion à Kouban"
arme.224.d: "Nos actions à Kouban n'ont pas été sans conséquences, le peuple de Kouban se soulève contre nous, ils ont annoncé la création de la République de Kouban et ont commencé à former des groupes armés pour nous combattre."
arme.224.a: "Oh non"
arme.225.t: "La rébellion au Daghestan"
arme.225.d: "Nos actions au Daghestan n'ont pas été sans conséquences, le peuple du Daghestan se soulève contre nous, ils ont annoncé la création de la République du Daghestan et ont commencé à former des groupes armés pour nous combattre."
arme.225.a: "Oh non"
arme.226.t: "La rébellion en Géorgie"
arme.226.d: "Nos actions en Géorgie n'ont pas été sans conséquences, le peuple géorgien s'est rebellé contre nous et veut se libérer de notre occupation, nous devons maintenant faire face à une rébellion géorgienne organisée."
arme.226.a: "Oh non"
arme.227.t: "La rébellion en Abkhazie"
arme.227.d: "Nos actions en Abkhazie n'ont pas été sans conséquences, le peuple abkhaze s'est rebellé contre nous et veut se libérer de notre occupation, nous devons maintenant faire face à une rébellion abkhaze organisée."
arme.227.a: "Oh non"
arme.228.t: "La rébellion au Kurdistan"
arme.228.d: "Nos actions au Kurdistan n'ont pas été sans conséquences, le peuple kurde s'est rebellé contre nous et veut se libérer de notre occupation, nous devons maintenant faire face à une rébellion kurde organisée."
arme.228.a: "Oh non"
arme.229.t: "La rébellion à Djavakheti"
arme.229.d: "Les habitants de Djavakheti ont été extrêmement choqués par notre politique envers l'Artsakh et notre abandon de ces terres. Dans ce contexte, un groupe de militaires radicaux a même réussi à organiser une rébellion, déclarant notre gouvernement illégal et anti-arménien."
arme.229.a: "Oh non"
arme.230.t: "Autonomie du Talyshstan"
arme.230.d: "Le gouvernement du Talyshstan a lancé un ultimatum à notre gouvernement, exprimant une désobéissance farouche à nos ambitions politiques de soumettre complètement ces terres à la nation arménienne, ils exigent une autonomie au sein de notre État, sinon ils ont l'intention de défendre leur indépendance les armes à la main."
arme.230.a: "Pas d'autonomie"
arme.230.b: "Accordons-leur l'autonomie"
arme.231.t: "Manifestations contre une armée faible"
arme.231.d: "Le soulèvement armé qui a commencé contre nous a provoqué une vague de manifestations à travers le pays, les gens sont mécontents de la faiblesse de nos forces armées, ils exigent plus de financement pour notre armée."
arme.231.a: "Et de quoi vont-ils se nourrir ?"
ARM_repatriate_armenians: "§GRapatrier§! les §YArméniens§! vers [ARM.GetNameWithFlag]"
first_repat_done: "Premier rapatriement achevé"
second_repat_done: "Deuxième rapatriement achevé"
third_repat_done: "Troisième rapatriement achevé"
four_repat_done: "Quatrième rapatriement achevé"
effect_app_if_migr_lev_tt: "§YL'effet de cette décision apparaîtra lorsque nous atteindrons au moins un faible niveau d'émigration§!"
ARM_ask_diaspora_invest: "Demander à la §YDiaspora§! d'§Ginvestir§! dans [ARM.GetNameWithFlag]"
ARM_fix_water_yerevan: "Réparer les conduites d'eau à §YErevan§!"
ARM_fix_water_gegharkunik: "Réparer les conduites d'eau à §YGegharkunik-Tavush§!"
ARM_fix_water_syunik: "Réparer les conduites d'eau à §YSyunik§!"
arme.191.t: "L'opposition tente de destituer Kotcharian !"
arme.191.d: "Les leaders de l'opposition ont formé une coalition et, en plus de manifester, ils tentent maintenant de destituer Kotcharian de sa position présidentielle. Tout dépend maintenant de la loyauté des élites gouvernementales envers Kotcharian."
arme.191.a: "Bon sang !"
arme.191.b: "Ils n'avaient aucune chance."
oppos_killed: "Opposition éliminée"
oppos_lived: "Opposition en vie"
arme.192.t: "Raffi Hovhannisyan crée le parti Héritage !"
arme.192.d: "Récemment, le parti national-libéral Héritage a été créé en Arménie. Il a été fondé par le premier ministre des Affaires étrangères de l'Arménie, Raffi Hovhannisyan, qui a occupé ce poste sous Levon Ter-Petrosyan dans les années 90. Le parti considère comme sa tâche principale la formation d'un État démocratique légal développé qui construit sa politique intérieure et extérieure sur la base de son intérêt national souverain."
arme.192.a: "Un nouvel acteur ?"
ARM_protests: "Manifestations de l'opposition"
arme.193.t: "Manifestations de l'opposition !"
arme.193.d: "Demirchian a lancé une manifestation exigeant la démission des autorités sur la place de la Liberté, il a ensuite entamé un rassemblement vers le palais présidentiel, mais la police a bloqué la route devant l'Assemblée nationale."
arme.193.a: "Les réprimer par la force."
arme.194.t: "Soldat arménien assassiné en Hongrie !"
arme.194.d: "En Hongrie, lors d'un exercice conjoint des pays partenaires de l'OTAN, auquel participaient des soldats arméniens et azerbaïdjanais, le militaire arménien Gurgen Margaryan a été tué. Depuis le 11 janvier 2004, Margaryan participait à un cours d'anglais de trois mois dans le cadre du programme Partenariat pour la paix de l'OTAN à Budapest. Tôt le matin du 19 février, il a été tué. Le meurtrier, l'officier azerbaïdjanais Ramil Safarov, a frappé le soldat arménien endormi au visage 16 fois avec une hache, séparant presque sa tête de son corps. Safarov a été arrêté, mais son avenir reste incertain. On ne sait pas s'il sera extradé vers l'Azerbaïdjan ou non."
arme.194.a: "Un acte si barbare !"
arme.194.b: "Beau travail ! Nous devons lui donner le titre de héros !"
arme.195.t: "[AZE.GetNameWithFlag] nous paye pour libérer Safarov !"
arme.195.d: "En Hongrie, lors d'un exercice conjoint des pays partenaires de l'OTAN, auquel participaient des soldats arméniens et azerbaïdjanais, le militaire arménien Gurgen Margaryan a été tué. Depuis le 11 janvier 2004, Margaryan participait à un cours d'anglais de trois mois dans le cadre du programme Partenariat pour la paix de l'OTAN à Budapest. Tôt le matin du 19 février, il a été tué. Le meurtrier, l'officier azerbaïdjanais Ramil Safarov, a frappé le soldat arménien endormi au visage 16 fois avec une hache, séparant presque sa tête de son corps. Safarov a été arrêté, mais son avenir reste incertain. On ne sait pas s'il sera extradé vers l'Azerbaïdjan ou non."
arme.195.a: "L'argent, c'est toujours bon !"
arme.196.t: "90 ans depuis le génocide arménien"
arme.196.d: "Aujourd'hui, le pays est en deuil pour le 90e anniversaire du génocide des Arméniens, des Grecs et des Assyriens dans la Turquie ottomane. Des millions d'Arméniens à travers le monde expriment leur solidarité avec nous, tout comme les dirigeants de nombreux pays qui ont reconnu les crimes ottomans contre l'humanité."
arme.196.a: "Que les victimes reposent en paix."
arme.197.t: "Création d'un comité de recherche sur le génocide"
arme.197.d: "Aujourd'hui, des représentants du gouvernement, du musée du Génocide, de la diaspora arménienne et du clergé se sont réunis à Erevan pour discuter de la création d'un comité pour étudier le génocide arménien."
arme.197.a: "Bonne initiative"
arme.198.t: "Manifestations massives à Erevan !"
arme.198.d: "Une série d'émeutes anti-gouvernementales a eu lieu en Arménie. Des manifestations ont éclaté dans la capitale arménienne, Erevan, organisées par les partisans du candidat présidentiel et ancien président Levon Ter-Petrosyan et d'autres leaders de l'opposition. Cela implique des dizaines de milliers de manifestants pendant la journée et des centaines campant la nuit."
arme.198.a: "Les réprimer !"
arme.199.t: "Le pic des manifestations !"
arme.199.d: "Les manifestations ont atteint un tel niveau que la police ne peut plus résister à la foule avec des méthodes non violentes. L'armée est en alerte, les policiers et les soldats sont prêts à ouvrir le feu. Tout le monde attend l'ordre."
arme.199.a: "Écrasons-les avec notre armée !"
arme.199.b: "Non, l'armée n'est plus loyale... Nous devons nous retirer !"
arme.200.t: "Transition du pouvoir à Serzh Sargsyan"
arme.200.d: "Après la répression des rassemblements et des accords internes, Kotcharian est prêt à céder le poste de président à son successeur choisi, Serzh Sargsyan."
arme.200.a: "Super"
arme.200.b: "Cela n'arrivera pas !"
arme.201.t: "Manifestations de Dashnaktsutyun !"
arme.201.d: "Dans le contexte du début des négociations entre la Turquie et l'Arménie, le parti Dashnaktsutyun a entamé le processus de sortie de la coalition et de protestation contre la décision diplomatique de Serzh Sargsyan."
arme.201.a: "Maudits idiots"
arme.202.t: "L'opposition exige la libération des prisonniers !"
arme.202.d: "Des manifestations ont commencé à Erevan pour exiger la libération des activistes arrêtés lors des rassemblements. Les manifestations n'ont pas d'exigences politiques. Cependant, il est possible que libérer les prisonniers puisse être bénéfique..."
arme.202.a: "Libérons-les !"
arme.202.b: "Gardons-les enfermés"
arme.203.t: "Mouvement du parc Mashtots"
arme.203.d: "En raison des décisions du maire d'Erevan, qui nous est fidèle, de démolir des kiosques et des espaces verts dans le parc Mashtots, un mouvement de protestation pacifique a commencé à Erevan. Ils exigent la préservation des conditions actuelles de l'espace public de la ville."
arme.203.a: "Leurs demandes sont raisonnables."
arme.203.b: "Idiots de libéraux !"
arme.204.t: "Raffi Hovhannisyan déclare une révolution !"
arme.204.d: "Divers groupes politiques et civils organisent maintenant des manifestations anti-gouvernementales en Arménie. Cependant, le leader du mouvement de protestation est clairement Raffi Hovhannisyan. Une foule de ses partisans s'est rassemblée sur la place de la Liberté à Erevan, où Hovhannisyan a exhorté le président Sargsyan à accepter la victoire du peuple et à reconnaître sa défaite. Les partis pro-occidentaux et nationalistes comme les Dashnaks rejoignent la manifestation."
arme.204.a: "Réprimer les manifestations !"
arme.204.b: "Donnons-leur ce qu'ils veulent"
arme.205.t: "Raffi Hovhannisyan entame une grève de la faim !"
arme.205.d: "Après s'être adressé à ses partisans sur la place de la Liberté, Hovhannisyan a annoncé sa décision de commencer une grève de la faim. Il a exhorté le président élu Serzh Sargsyan à démissionner. Selon Hovhannisyan, ce n'est pas seulement une grève de la faim, mais un boycott contre les mensonges et la fraude."
arme.205.a: "Au moins, les manifestations diminuent."
arme.206.t: "Parti Contrat Civil"
arme.206.d: "Récemment, un groupe de diverses figures de l'opposition a annoncé la création d'un nouveau parti composé d'anciens membres de l'ANC. Le leader de ce nouveau parti est Nikol Pashinyan, récemment libéré de prison après avoir été arrêté lors des manifestations."
arme.206.a: "Un autre groupe ?"
arme.207.t: "Manifestations d'Electric Erevan"
arme.207.d: "Face à la récente tentative du parlement d'augmenter les tarifs de l'électricité, des manifestations de masse ont commencé à Erevan. La police tente de disperser les manifestants en utilisant des moyens non létaux et des canons à eau. Devons-nous reconsidérer notre position sur les tarifs ou laisser les choses telles quelles ?"
arme.207.a: "Nous abandonnerons notre plan"
arme.207.b: "Poussons le changement de tarif !"
arme.208.t: "Massacre de Gyumri !"
arme.208.d: "Valery Permyakov, un militaire de la 102e base militaire russe située à Gyumri, était en service de garde de nuit. Vers 4 heures du matin le 12 janvier, Permyakov, armé d'un fusil d'assaut AK-74 et de deux chargeurs de munitions, a quitté sans autorisation l'emplacement de l'unité, ou plus précisément le poste de garde des entrepôts RAV. Le déserteur s'est dirigé vers la frontière arméno-turque, avec l'intention de la traverser et de disparaître en Turquie. Quelque temps après sa fuite, Permyakov a décidé d'entrer dans une maison située sur la rue Myasnikyan, à environ 30 minutes de marche de l'unité militaire russe. En entrant dans la cour commune par une porte verrouillée de manière symbolique, Permyakov a découvert plusieurs maisons individuelles à un étage. Le soldat, après avoir brisé le cadre de la partie vitrée de la porte d'entrée, est entré dans le bâtiment.\n\nPermyakov a tué tous les membres de la famille Avetisyan qui vivaient dans cette maison, y compris les enfants. Après le massacre qu'il a commis, Valery Permyakov, vêtu des vêtements des morts et abandonnant son arme, a quitté les lieux du crime. À 12h30, les corps de la famille Avetisyan ont été découverts par les voisins.\n\nNous sommes confrontés à un dilemme - devons-nous nous occuper de lui nous-mêmes ou remettre ce monstre à la Russie ?"
arme.208.a: "La Russie enseignera à ce salaud comment se comporter en Sibérie !"
arme.208.b: "Exécutez ce salaud !"
arme.209.t: "Massacre de Gyumri !"
arme.209.d: "Valery Permyakov, un militaire de la 102e base militaire russe située à Gyumri, était en service de garde de nuit. Vers 4 heures du matin le 12 janvier, Permyakov, armé d'un fusil d'assaut AK-74 et de deux chargeurs de munitions, a quitté sans autorisation l'emplacement de l'unité, ou plus précisément le poste de garde des entrepôts RAV. Le déserteur s'est dirigé vers la frontière arméno-turque, avec l'intention de la traverser et de disparaître en Turquie. Quelque temps après sa fuite, Permyakov a décidé d'entrer dans une maison située sur la rue Myasnikyan, à environ 30 minutes de marche de l'unité militaire russe. En entrant dans la cour commune par une porte verrouillée de manière symbolique, Permyakov a découvert plusieurs maisons individuelles à un étage. Le soldat, après avoir brisé le cadre de la partie vitrée de la porte d'entrée, est entré dans le bâtiment.\n\nPermyakov a tué tous les membres de la famille Avetisyan qui vivaient dans cette maison, y compris les enfants. Après le massacre qu'il a commis, Valery Permyakov, vêtu des vêtements des morts et abandonnant son arme, a quitté les lieux du crime. À 12h30, les corps de la famille Avetisyan ont été découverts par les voisins.\n\nL'Arménie a été très généreuse de ne pas exécuter ce monstre. Permyakov doit maintenant faire face à un procès et être envoyé dans une prison de haute sécurité."
arme.209.a: "Ce salaud pourrira dans un enfer vivant."
arme.210.t: "Massacre de Gyumri !"
arme.210.d: "Valery Permyakov, un militaire de la 102e base militaire russe située à Gyumri, était en service de garde de nuit. Vers 4 heures du matin le 12 janvier, Permyakov, armé d'un fusil d'assaut AK-74 et de deux chargeurs de munitions, a quitté sans autorisation l'emplacement de l'unité, ou plus précisément le poste de garde des entrepôts RAV. Le déserteur s'est dirigé vers la frontière arméno-turque, avec l'intention de la traverser et de disparaître en Turquie. Quelque temps après sa fuite, Permyakov a décidé d'entrer dans une maison située sur la rue Myasnikyan, à environ 30 minutes de marche de l'unité militaire russe. En entrant dans la cour commune par une porte verrouillée de manière symbolique, Permyakov a découvert plusieurs maisons individuelles à un étage. Le soldat, après avoir brisé le cadre de la partie vitrée de la porte d'entrée, est entré dans le bâtiment.\n\nPermyakov a tué tous les membres de la famille Avetisyan qui vivaient dans cette maison, y compris les enfants. Après le massacre qu'il a commis, Valery Permyakov, vêtu des vêtements des morts et abandonnant son arme, a quitté les lieux du crime. À 12h30, les corps de la famille Avetisyan ont été découverts par les voisins.\n\nL'Arménie a décidé d'exécuter Permyakov et de ne pas le condamner à une peine de prison à vie en Russie."
arme.210.a: "Ce qu'ils ont fait est juste, mais contre nos accords légaux. Espérons que nous pourrons surmonter cela..."
arme.211.t: "Crise d'otages à Erevan"
arme.211.d: "Un groupe d'hommes armés se faisant appeler les Audacieux de Sasun a pris d'assaut un poste de police à Erevan, en Arménie, et a pris neuf otages. Ils exigent la libération du leader de l'opposition Jirair Sefilian et la démission du président. Le groupe a entamé un affrontement avec les forces gouvernementales, avec une foule croissante de manifestants se joignant aux appels à la démission du président. Deux policiers ont été tués pendant l'affrontement et des dizaines ont été blessés ; un policier est mort de ses blessures après la fin de la crise. Plusieurs des assaillants ont également été blessés. Que devons-nous faire ?"
arme.211.a: "Négocier avec eux"
arme.211.b: "Envoyer le Service de Sécurité Nationale pour prendre d'assaut le lieu !"
arme.212.t: "Sasna Tsrer se rend !"
arme.212.d: "Le groupe Sasna Tsrer a décidé de se rendre pour éviter davantage de bain de sang. Compte tenu de tous nos efforts, la situation a été résolue de manière assez pacifique."
arme.212.a: "Dieu merci..."
arme.213.t: "Assaut des forces spéciales réussi !"
arme.213.d: "Les forces spéciales ont réussi à prendre d'assaut le poste de police, éliminant les terroristes politiques Sasna Tsrer. Tous les assaillants ont été tués. Aucun otage n'a été blessé."
arme.213.a: "Opération magnifique !"
pavlik_dies: "Pavlik Manukyan est mort"
arme.214.t: "Armen Sarkissian devient président !"
arme.214.d: "Dans le cadre de la réforme autocratique visant à renforcer le pouvoir de facto de Serzh Sargsyan et à établir une république parlementaire, Armen Sarkissian a été élu président de l'Arménie. Sans liens clairs avec l'ancienne clique, il peut grandement aider à améliorer notre image."
arme.214.a: "Bon choix."
arme.215.t: "Marche de protestation à Gyumri !"
arme.215.d: "Le 31 mars, Nikol Pashinyan a entamé sa marche de protestation Im Qayl (mon pas), commençant dans la ville de Gyumri, prévoyant de marcher à travers des villes comme Vanadzor, Dilijan, Hrazdan et Abovyan, avant d'atteindre finalement Erevan."
arme.215.a: "Encore une manifestation sans importance ?"
arme.216.t: "Manifestations présidentielles arméniennes"
arme.216.d: "Menées par Nikol Pashinyan, les manifestations à Erevan ont rassemblé trois cent mille personnes avec des actes de désobéissance civile tels que le blocage des routes et le klaxon des voitures, le peuple montre qu'il en a assez de la corruption rampante et exige une véritable démocratie. Si le Parti républicain de Serzh Sargsyan ne se retire pas, ils seront renversés par la force dans une révolte."
arme.216.a: "Bien sûr, bien sûr..."
arme.216.b: "Éliminer la manifestation !"
arme.217.t: "Révolution de velours"
arme.217.d: "À la suite d'une série de manifestations politiques en Arménie, le parti dit « conservateur » de l'Arménie dirigé par Serzh Sargsyan s'est retiré et a permis au peuple d'élire Nikol Pashinyan, qui s'est engagé à détruire la corruption rampante qui gangrène l'Arménie, à améliorer sa situation économique et à arrêter l'émigration massive."
arme.217.a: "Dukhov !"
arme.218.t: "Nikol Pashinyan nomme le prochain ministre de la Défense !"
arme.218.d: "Le Premier ministre de l'Arménie, Nikol Pashinyan, a annoncé qu'il nommera Davit Tonoyan, le ministre par intérim des situations d'urgence, au poste de ministre de la Défense. Malgré la réputation douteuse de Davit Tonoyan et ses possibles liens avec la corruption, il se distingue par sa rhétorique nationaliste et expansionniste, ce qui pourrait apaiser les nationalistes dans le pays."
arme.218.a: "Intéressant"
arme.219.t: "Parti de l'Accord National Pan-Arménien"
arme.219.d: "Un nouveau parti a récemment été formé en Arménie. L'alliance croit en la démocratie directe, l'abolition de la présidence, le renforcement de la souveraineté de l'Arménie, la poursuite du développement économique du pays, l'établissement d'une presse indépendante, la gratuité de l'éducation universitaire, l'encouragement au rapatriement de la diaspora arménienne, la protection des droits des minorités ethniques, soutient le concept de l'Arménie wilsonienne et l'unification de l'Artsakh avec l'Arménie."
arme.219.a: "Intéressant."
arme.220.t: "Mouvement Conservateur National 5165"
arme.220.d: "Le Mouvement Conservateur National 5165 a été récemment fondé et Karin Tonoyan a été élue présidente du parti. Le nombre dans le nom du parti représente la hauteur du mont Ararat. En essence, ce parti est composé d'anciens militaires, de proches de militaires et de personnes soutenant un régime militaire en Arménie."
arme.220.a: "Intéressant."
arme.221.t: "Choisir le véritable Bagratuni"
arme.221.d: "L'Union Meliq s'est réunie pour choisir le nouveau monarque - qui sera-t-il ?"
arme.221.a: "Roland von Bagratuni"
arme.221.b: "Ter Ashot Bagratuni"
arme.222.t: "[ARM.GetNameWithFlag] rejoint l'§GÉtat de l'Union !§!"
arme.222.d: "Récemment, le président arménien a décidé de rejoindre le projet de l'État de l'Union et de s'unir avec nous et les autres États membres !"
arme.222.a: "Merveilleux !"
