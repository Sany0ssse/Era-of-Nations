##########ARMY TREE##########
##########Focuses##########
##########Focus##########
ARM_army: "L'Armée dans une Nouvelle Ère"
ARM_army_desc: "Après la fin de la guerre d'Artsakh, l'armée arménienne, qui s'était distinguée, a connu un déclin significatif, débuté dès l'effondrement de l'Union soviétique. Grâce à l'héritage soviétique et à une milice à grande échelle, les Arméniens ont réussi à vaincre l'Azerbaïdjan et à établir un équilibre précaire dans la région. Les anciennes doctrines, les armes obsolètes, les généraux rigides et les problèmes économiques ont mis un terme au développement des forces armées. La principale voie de développement est la poursuite de la coopération avec la Russie, ainsi qu'avec d'autres voisins et partenaires de l'OTSC. Cependant, certains experts militaires insistent sur une refonte complète de la doctrine militaire et de la structure de l'armée selon les lignes occidentales. L'Arménie, bénéficiant d'une position diplomatique avantageuse, peut tenter de prendre le meilleur de chaque côté ou choisir une coopération claire avec certaines forces. Même sans ressources importantes, l'Arménie a un grand potentiel si elle peut correctement répartir ses priorités."
ARM_vazgen_academy: "Université Militaire Vazgen Sargsyan"
ARM_vazgen_academy_desc: "L'Université Militaire Vazgen Sargsyan est un établissement d'enseignement supérieur relevant du ministère de la Défense de l'Arménie. Sa mission est de préparer et de former des officiers capables d'accomplir des tâches de défense en temps de paix comme en temps de guerre."
ARM_inner_troops: "Troupes Intérieures"
ARM_inner_troops_desc: "En plus des troupes principales et des gardes-frontières, nous devons créer des troupes intérieures pour instaurer un ordre complet à l'intérieur du pays et maintenir des réserves."
ARM_institute_mo_ra: "Université d'Aviation Militaire"
ARM_institute_mo_ra_desc: "L'Université d'Aviation Militaire Armenak Khanperyants est un établissement d'enseignement supérieur de l'Armée de l'Air arménienne, relevant du ministère de la Défense de l'Arménie."
ARM_pvo_troops: "Force de Défense Antiaérienne"
ARM_pvo_troops_desc: "Nous devons envisager la création de forces de défense antiaérienne pour garantir la sécurité de notre espace aérien."
ARM_intern_cooperat: "Coopération Internationale"
ARM_intern_cooperat_desc: "Pour développer nos forces armées et améliorer le professionnalisme de nos officiers, nous devons interagir avec des pays amis à travers le monde."
ARM_peace_brigade: "Brigade de Maintien de la Paix"
ARM_peace_brigade_desc: "Afin d'acquérir et d'adopter une expérience étrangère dans la conduite de la guerre, nous devons développer nos troupes de maintien de la paix pour les envoyer en missions militaires et humanitaires."
ARM_air_fedence_force: "Entraînements Aériens Systématisés"
ARM_air_fedence_force_desc: "Notre aviation n'a pas de programme d'entraînement systématique pour les pilotes, et les manuels n'ont pas été mis à jour depuis l'époque soviétique. Nous devons unifier les académies d'aviation et mettre en place un programme d'entraînement systématique."
ARM_davisur_arm: "Davisur"
ARM_davisur_arm_desc: "L'une des usines de couture d'Erevan peut être transformée en une entreprise à part entière qui produira des uniformes standardisés avec un nouveau camouflage pixélisé, que nous pourrions copier du Canada ou des États-Unis."
ARM_aspar_arms: "Aspar Arms"
ARM_aspar_arms_desc: "Aspar Arms est une entreprise qui s'occupe de l'exportation et de l'importation d'armes vers la République d'Arménie. Récemment, ils ont commencé à développer des prototypes prometteurs de leurs propres modèles d'armes légères. Nous devrions leur accorder une licence de fabrication et soutenir leur usine."
ARM_k3_prototype: "Prototypes de Fusil K-3"
ARM_k3_prototype_desc: "L'entreprise arménienne Garni-Ler fabrique des armes artisanales en Arménie depuis les années 90. Nous devrions moderniser leurs anciens prototypes et subventionner leur entreprise."
ARM_uav_krunk: "Drone Krunk"
ARM_uav_krunk_desc: "Krunk est un véhicule aérien sans pilote arménien en service dans les forces armées de l'Arménie. Il est destiné à la reconnaissance rapprochée, transmettant des données vidéo en temps réel (visuelles ou infrarouges) ou prenant des images fixes de résolution supérieure."
ARM_sso: "Forces d'Opérations Spéciales"
ARM_sso_desc: "Il est temps de moderniser nos forces d'opérations spéciales en nous appuyant sur nos propres développements et notre expérience militaire."
ARM_new_army: "La Nouvelle Armée Arménienne"
ARM_new_army_desc: "L'armée arménienne entre dans une nouvelle ère de modernisation et d'évolution, laissant ses problèmes dans le passé !"
ARM_militia: "Créer une Milice Populaire"
ARM_militia_desc: "L'Arménie dispose depuis les années 1990 d'une loi légalisant la création de milices paramilitaires civiles non étatiques et leur intégration dans les forces armées en cas de conflit. Il est temps de mettre cette loi en application."
ARM_national_guard: "Créer une Garde Nationale"
ARM_national_guard_desc: "Nous devrions peut-être envisager la création d'une garde nationale arménienne, directement responsable du maintien de l'ordre en Arménie et étroitement liée au ministère de l'Intérieur."
ARM_vdv: "Créer une Force Aéroportée"
ARM_vdv_desc: "La doctrine militaire soviétique supposait une grande diversité des branches des forces armées. Nous devrions adopter une stratégie similaire en créant des unités aéroportées à part entière."
ARM_morpehi: "Créer un Corps de Marines"
ARM_morpehi_desc: "Avec l'accès à la mer, nous devrions également tenir compte de l'expérience d'autres pays et créer des unités de marines."
ARM_fleet: "Créer une Marine"
ARM_fleet_desc: "La mer des victoires a enveloppé notre terre ! Depuis l'époque de l'Arménie cilicienne, nous avons enfin accès à la mer. Il est temps de commencer à créer notre nouvelle flotte."
ARM_N2_arms: ""
ARM_n2: "N-2"
ARM_n2_desc: "Le N-2 est un projet de lance-roquettes multiple arménien par l'Association de Production Scientifique Garni-Ler. Nous pouvons approuver leur projet pour commencer la fabrication de ce lance-roquettes."
ARM_Lusan_arms: "Lusan"
ARM_lusan: "Lusan"
ARM_lusan_desc: "L'Usine d'Outils de Charentsavan cherche des fonds pour lancer la production en série des véhicules militaires LUSAN. Nous devrions envisager d'investir dans ce projet."
ARM_mortars_prod: "Production de Mortiers"
ARM_mortars_prod_desc: "Les mortiers sont relativement faciles à produire et ne nécessitent pas beaucoup d'équipements techniques. Nous devrions explorer cette possibilité."
ARM_hayk_car: "Prototype de Véhicule Hayk"
ARM_hayk_car_desc: "Le véhicule de combat Hayk est un prototype créé sous la supervision du concepteur Karen Gevorkyan. Bien qu'il ne soit pas le type de transport militaire le plus efficace, c'est un développement innovant et fiable qui mérite d'être soutenu."
ARM_rockets_modern: "Modernisation des Roquettes"
ARM_rockets_modern_desc: "Compte tenu de nos capacités techniques, nous pouvons essayer de moderniser les anciennes roquettes soviétiques et russes."
ARM_mlrs_proto: "Prototypes de MLRS"
ARM_mlrs_proto_desc: "Garni-Ler a proposé la création de prototypes de MLRS. Nous devons soutenir leurs efforts dans cette direction."
ARM_our_own_armor: "Production de Blindage Céramique"
ARM_our_own_armor_desc: "En plus des plaques d'acier produites par Davisur, nous pouvons commencer la production de plaques de blindage céramique en copiant les conceptions commerciales disponibles."
ARM_radars_arm: "Radars Arméniens"
ARM_radars_arm_desc: "Pour garantir notre confiance dans la capacité à détecter précisément les avions ennemis au-dessus de notre territoire, nous devons investir dans la construction de radars militaires."
ARM_night_vis_arm: "Mise en Place de la Vision Nocturne"
ARM_night_vis_arm_desc: "Si notre situation économique le permet, nous pouvons commencer à intégrer des viseurs et des lunettes de vision nocturne dans nos forces armées."
ARM_new_unif_proj: "Projet de Nouvel Uniforme"
ARM_new_unif_proj_desc: "En tenant compte de l'expérience étrangère, nous devons commencer à développer un nouvel uniforme de camouflage."
ARM_voma_center: "Centre VOMA"
ARM_voma_center_desc: "VOMA (littéralement en arménien : Art de la Survie) est une organisation non gouvernementale arménienne, créée par un groupe de militaires professionnels et de vétérans qui ont annoncé leur objectif de développer une société capable de se défendre en cas de guerre."
ARM_warfare_analysis_center: "Centre d'Analyse de la Guerre"
ARM_warfare_analysis_center_desc: "Coordination de nos forces armées, réévaluation de l'expérience de combat, analyse des opérations de combat modernes. Tout cela doit être unifié dans un seul organe des forces armées, qui sera ce centre."
ARM_reform_army: "Armée Réformée"
ARM_reform_army_desc: "Notre armée doit être réformée pour être prête à repousser les attaques ennemies contre notre pays. La stratégie défensive est la base de notre politique militaire."
ARM_swiss_model: "Modèle de l'Armée Suisse"
ARM_swiss_model_desc: "Nous commencerons à réformer notre armée selon le modèle suisse, afin d'optimiser nos forces armées comme nécessaire."
ARM_fortress: "Défense Montagneuse"
ARM_fortress_desc: "Nous transformerons notre pays en une véritable forteresse, les tactiques défensives suisses seront notre fondation."
ARM_territorial_defence: "Défense Territoriale"
ARM_territorial_defence_desc: "Nous avons l'intention de créer une défense territoriale pour une protection supplémentaire de notre État."
ARM_soviet_army: "Armée Soviétique"
ARM_soviet_army_desc: "L'armée soviétique était, selon nous, la référence des forces armées. Nous avons l'intention de créer de nouvelles branches des forces armées qui répondront à nos besoins logistiques."
ARM_engineer_troops: "Troupes du Génie"
ARM_engineer_troops_desc: "Forces spéciales des forces armées destinées au soutien du génie : équipement du territoire des opérations militaires (combats), reconnaissance du génie et escorte des troupes (forces) à l'offensive, etc."
ARM_radio_troops: "Troupes de Radio"
ARM_radio_troops_desc: "Forces spéciales destinées au déploiement et à l'exploitation de systèmes de communication afin d'assurer le contrôle des troupes et des forces subordonnées au ministère de la Défense dans toutes leurs activités."
ARM_railway_troops: "Troupes Ferroviaires"
ARM_railway_troops_desc: "Les chemins de fer étaient destinés au soutien ferroviaire des forces armées. Les troupes ferroviaires incluaient des organes de gestion, des formations, des unités, des institutions et des entreprises."
ARM_border_troops: "Troupes Frontalières"
ARM_border_troops_desc: "Troupes conçues pour protéger et défendre la frontière de l'État, prévenir et réprimer les atteintes à la souveraineté et à l'intégrité territoriale."
ARM_nationalist_army: "Armée Nationale"
ARM_nationalist_army_desc: "Notre pays a besoin d'une armée nationale forte ! Elle sera créée sur la base d'une doctrine militaire unique."
ARM_nationalists_in_army: "Recrutement de Radicaux dans l'Armée"
ARM_nationalists_in_army_desc: "Nous avons l'intention de solliciter l'aide d'éléments nationalistes radicaux, malgré le désordre qu'ils pourraient causer, ils renforceront le moral et l'idéologie."
ARM_univeristy_army: "Nouvelles Universités Militaires"
ARM_univeristy_army_desc: "Nous avons l'intention de construire de nouvelles universités militaires pour améliorer la qualité de l'éducation militaire dans le pays."
ARM_polk_dziavory: "Dzhiavory"
ARM_polk_dziavory_desc: "Les Dzhiavors (cavalerie arménienne), chevaliers ciliciens ou chevaliers arméniens sont des chevaliers croisés de l'Arménie cilicienne. Nous avons l'intention de réorganiser la compagnie de la garde d'honneur en une unité de combat de notre armée."
ARM_102: "Unité 102"
ARM_102_desc: "L'Unité 102 est une unité spéciale de l'armée arménienne, entraînée et composée de divers groupes arméniens à travers le monde pour mener diverses actions contre les pays ennemis."
ARM_ar15_west_contr: "Contrat pour la Production de Modèles AR"
ARM_ar15_west_contr_desc: "Les fusils américains les plus récents sont la meilleure option pour notre future production de fusils. Nous pourrons les produire tels quels, mais aussi les rétro-ingénier pour notre propre bénéfice."
ARM_ak12_rus_contr: "Licence de Production de Fusils de Type AK"
ARM_ak12_rus_contr_desc: "Les fusils russes les plus récents sont la meilleure option pour notre future production de fusils. Nous pourrons les produire tels quels, mais aussi les rétro-ingénier pour notre propre bénéfice."
ARM_orsis_dilemma: "Dilemme Orsis"
ARM_orsis_dilemma_desc: "Orsis a manifesté son intérêt à investir dans notre complexe militaro-industriel. Cependant, nos généraux militaires ont une autre proposition."
ARM_start_foreign_legion: "Création de la Légion Étrangère"
ARM_start_foreign_legion_desc: "Le concept de la Légion Étrangère, en tant que partie des forces armées, nous attire depuis longtemps, et nous sommes maintenant prêts à mettre en œuvre cette idée avec l'assistance de certains États."
ARM_foreign_legion_france: "Armes et Spécialistes Français"
ARM_foreign_legion_france_desc: "Nous avons l'intention d'acheter des équipements français et des spécialistes prêts à les entretenir pour notre légion étrangère."
ARM_foreign_legion_india: "Armes et Spécialistes Indiens"
ARM_foreign_legion_india_desc: "Nous avons l'intention d'acheter des équipements indiens et des spécialistes prêts à les entretenir pour notre légion étrangère."
ARM_foreign_legion_create: "Légion Étrangère Arménienne"
ARM_foreign_legion_create_desc: "Nous sommes fiers d'annoncer la création de la Légion Étrangère Arménienne, où nous accueillerons des citoyens de tous les pays !"

##########Idées##########
ARM_armenian_army_idea: "Armée Arménienne"
ARM_armenian_army_idea_desc: "Bien que les forces armées arméniennes aient été créées relativement récemment, elles ont traversé la guerre d'indépendance, mais elles rencontrent déjà de nombreux problèmes qu'il faut résoudre."
