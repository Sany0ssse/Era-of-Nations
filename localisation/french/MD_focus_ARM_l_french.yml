arm_foreign_legion.1.t: "Légion Étrangère Arménienne"
arm_foreign_legion.1.d: "Inspirés par l'exemple de la Légion Étrangère Française, nous avons décidé de créer une unité similaire dans notre armée. La question de l'équipement technique de la légion se pose maintenant, nous avons l'intention d'impliquer des spécialistes français et indiens pour nous aider dans cette tâche."
arm_foreign_legion.1.a: "Génial"
arm_foreign_legion.2.t: "Légion Étrangère Arménienne"
arm_foreign_legion.2.d: "Enfin, notre nouvelle unité, la Légion Étrangère, a été créée. Désormais, les citoyens d'autres pays, entre autres, ont la possibilité d'obtenir notre citoyenneté en servant dans la légion pendant plusieurs années et en versant leur sang pour le bien de l'Arménie."
arm_foreign_legion.2.a: "Génial"
arm_foreign_legion.3.t: "Légion Étrangère Arménienne"
arm_foreign_legion.3.d: "Le gouvernement arménien propose d'envoyer son unité, la Légion Étrangère, chez nous. Ils affirment qu'il s'agit de combattants expérimentés, bien équipés techniquement et entraînés au combat, qui seront certainement utiles dans la situation actuelle."
arm_foreign_legion.3.a: "Nous les laissons entrer."
arm_foreign_legion.3.b: "Pas intéressé"
arm_foreign_legion.4.t: "Notre Légion Étrangère"
arm_foreign_legion.4.d: "[From.GetName] a accepté d'accueillir notre légion étrangère sur son territoire pour stabiliser la situation actuelle dans le pays, et nous sommes très satisfaits de notre coopération."
arm_foreign_legion.4.a: "Bien"
arm_foreign_legion.5.t: "Notre Légion Étrangère"
arm_foreign_legion.5.d: "[From.GetName] a refusé d'accepter notre légion étrangère sur son territoire, jugeant leur présence inutile."
arm_foreign_legion.5.a: "Triste"
arm_foreign_legion.6.t: "Notre Légion Étrangère"
arm_foreign_legion.6.d: "Les soldats de notre légion étrangère ont accompli leur mission et rentrent dans leur patrie."
arm_foreign_legion.6.a: "Bienvenue à la maison"

