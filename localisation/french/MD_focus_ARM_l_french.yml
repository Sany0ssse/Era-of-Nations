ARM_armenia_eu_idea_tt: "[ARM_coop_eu_loc][ARM_council_eu_loc][ARM_ngo_eu_loc][ARM_lgbt_eu_loc][ARM_49_eu_loc]"
ARM_foreseeing_the_prophecy: "Prévoir la prophétie"
ARM_foreseeing_the_prophecy_desc: "La légende des origines du peuple arménien raconte que les Arméniens ont gagné leur droit d'exister en affrontant les tribus sémitiques du Sud sous l'unification de Hayk le Progéniteur. Les temps nouveaux portent l'héritage du passé sur leurs épaules, et les légendes disent que le salut des Arméniens, comme Hayk le Progéniteur, doit arriver dans le nouveau millénaire..."
ARM_expand_cis_cooperations: "Élargir la coopération de sécurité de la CEI"
ARM_expand_cis_cooperations_desc: "Élargir la coopération de sécurité de la CEI"
arme.16.t: "Réunion de sécurité de la CEI à Erevan, Arménie"
arme.16.d: "Le dirigeant arménien [ARM.GetLeader] a reçu les chefs des délégations arrivés à Erevan pour participer à la réunion du Conseil des chefs des services de sécurité et des services spéciaux de la CEI.\n\nComme rapporté par le service de presse du chef de l'État arménien, [ARM.GetLeader] a souligné l'importance du travail du Conseil, en particulier compte tenu de la priorité d'assurer la sécurité aux niveaux national, régional et international. Le président a insisté sur la nécessité d'approfondir la coopération au sein de la CEI.\n\n[ARM.GetLeader] a noté que, de tout temps, les questions de lutte contre les menaces à la sécurité ont été au centre de l'attention des États. Selon lui, la coopération dans ce domaine et d'autres permet de renforcer davantage les liens interétatiques et l'amitié entre les peuples.\n\nÀ la demande de [ARM.GetLeader], les invités ont présenté les questions discutées lors de la réunion tenue à Tsaghkadzor et les décisions prises."
arme.16.a: "Intéressant."
armcis_infl: "§Y[ROOT.GetNameWithFlag]§! Obtiendra §Y2 % d'influence§! sur tous les §3membres de la CEI§!"
ARM_russian_culture_promotion: "Promotion de la culture russe"
ARM_russian_culture_promotion_desc: "La Russie est toujours désireuse de promouvoir sa culture dans notre pays. Quelle que soit leur motivation, une connaissance supplémentaire d'une langue étrangère et une coopération éducative sont toujours bénéfiques pour notre population."
ARM_russian_fsb_borderguards: "Gardes-frontières du FSB russe"
ARM_russian_fsb_borderguards_desc: "Nous devons inviter les troupes frontalières russes du FSB pour augmenter notre sécurité."
arme.17.t: "[ARM.GetNameWithFlag] Invite les troupes frontalières du FSB"
arme.17.d: "Récemment, le gouvernement arménien a proposé à nos troupes frontalières du FSB de garder et de surveiller la frontière arméno-turque et les frontières arméno-azerbaïdjanaises.\n\nCela augmentera notre influence et notre renseignement dans la région, si nous acceptons cette proposition."
arme.17.a: "Bien sûr !"
arme.17.b: "Désolé, non."
ARM_fsb_borderguards: "Gardes-frontières du FSB"
arme.18.t: "[SOV.GetNameWithFlag] accepte !"
arme.18.d: "Les troupes frontalières du FSB russe seront déployées dans toutes nos régions."
arme.18.a: "Super."
arme.19.t: "[SOV.GetNameWithFlag] refuse !"
arme.19.d: "La Russie a refusé notre proposition de stationner des troupes du FSB russe à nos frontières."
arme.19.a: "Pfff."
ARM_expand_russian_base_time: "Exercices avec l'armée russe"
ARM_expand_russian_base_time_desc: "Puisque la base militaire russe est située dans notre pays, nous pouvons organiser des exercices militaires conjoints."
ARM_remove_fsb_borderguards: "Retirer les gardes-frontières du FSB de [SOV.GetNameWithFlag]"
fsb_deployed: "Le FSB a été déployé à [ARM.GetNameWithFlag]"
arme.20.t: "[ARM.GetNameWithFlag] propose la promotion de la culture russe !"
arme.20.d: "Depuis l'époque de l'ancienne Rus', les échanges culturels arméno-russes ont grandement contribué aux deux cultures. Ayant une histoire commune à travers l'Empire russe et l'Union soviétique, l'Arménie nous propose un accord. Ils autoriseront l'installation de nos centres culturels en Arménie pour promouvoir notre culture. Apparemment, le gouvernement arménien souhaite promouvoir notre culture pour contrer l'influence culturelle occidentale dans leur société. En échange, ils nous demandent de financer une partie des coûts pour établir ces centres en Arménie."
arme.20.a: "D'accord, on y va !"
arme.20.b: "Nous ne voyons pas l'intérêt de promouvoir la culture."
arme.21.t: "[SOV.GetNameWithFlag] accepte !"
arme.21.d: "La Russie a accepté de financer les centres culturels russes en Arménie."
arme.21.a: "Magnifique !"
arme.22.t: "[SOV.GetNameWithFlag] refuse !"
arme.22.d: "La Russie a refusé notre proposition d'ouvrir des centres culturels russes en Arménie. Ils disent ne pas voir l'intérêt de telles initiatives."
arme.22.a: "Quel peuple étrange. Peut-être n'avions-nous pas besoin de leurs centres culturels après tout."
ARM_educational_cooperation: "Coopération éducative avec la Russie"
ARM_educational_cooperation_desc: "Nous pouvons essayer de convaincre la Russie de lancer un programme d'échange d'étudiants avec nous."
ARM_rusarm_educ_coop: "Accord éducatif arméno-russe"
arme.23.t: "[ARM.GetNameWithFlag] propose un accord éducatif !"
arme.23.d: "L'Arménie nous a récemment proposé un accord de coopération éducative, permettant un échange d'étudiants entre les universités des deux pays. Étant donné que les universités arméniennes ont de nombreux liens avec l'éducation occidentale, nos étudiants pourraient en bénéficier grandement."
arme.23.a: "D'accord !"
arme.23.b: "C'est une sorte de complot arménien !"
arme.24.t: "[SOV.GetNameWithFlag] accepte !"
arme.24.d: "La Russie a accepté notre proposition d'échange d'étudiants, et nous signerons les documents sous peu."
arme.24.a: "Magnifique !"
arme.25.t: "[SOV.GetNameWithFlag] refuse !"
arme.25.d: "La Russie a refusé notre proposition, la considérant comme une méthode perfide pour pervertir la jeunesse russe avec l'influence occidentale."
arme.25.a: "Q-quoi ?"
mgu_unlock: "§YCoopération avec l'Université d'État de Moscou§! sera disponible !"
ARM_russian_tv_channels: "Chaînes de télévision russes"
ARM_russian_tv_channels_desc: "Nous pouvons autoriser les chaînes de télévision russes sur le marché arménien. Oui, cela augmentera l'influence russe sur nous, mais les bénéfices pourraient être bien plus importants."
ARM_rus_diaspora_strength: "Connexions avec la diaspora"
ARM_rus_diaspora_strength_desc: "Nous pouvons essayer de nous connecter avec la diaspora arménienne et accepter leurs dons."
ARM_ratify_iran_pipeline: "Ratification du gazoduc de Syunik"
ARM_ratify_iran_pipeline_desc: "Peut-être devrions-nous proposer à l'Iran un accord pour un gazoduc à travers notre frontière sud. Nous échangerons de l'énergie contre du gaz."
arme.26.t: "[ARM.GetNameWithFlag] propose un accord gazier !"
arme.26.d: "L'Arménie nous propose un accord par lequel un gazoduc sera construit de l'Iran vers l'Arménie. Le gaz fourni par l'Iran à l'Arménie sera échangé contre de l'électricité, dont nous manquons cruellement dans les régions du nord.\n\nLes coûts du gazoduc seront partagés entre nous et l'Arménie. L'accord est plutôt avantageux, devons-nous accepter ?"
arme.26.a: "Nous acceptons !"
arme.26.b: "Désolé, non."
arme.27.t: "[PER.GetNameWithFlag] refuse !"
arme.27.d: "L'Iran a refusé notre offre. Ils considèrent notre proposition comme une sorte de complot sioniste qui menace leur souveraineté."
arme.27.a: "Sont-ils fous ?"
arme.28.t: "[PER.GetNameWithFlag] accepte !"
arme.28.d: "L'Iran a accepté notre proposition et est prêt à construire le gazoduc. Maintenant, nous devons payer notre part des coûts et commencer à coordonner nos efforts de construction."
arme.28.a: "Super !"
ARM_syunik_pipeline: "Gazoduc Iran-Arménie"
ARM_syunik_pipeline_two: "Gazoduc Iran-Arménie"
gas_two_tt: "Nous accorde §G2 combustibles fossiles§! dans §YSyunik§!"
gas_two_per_tt: "Donne §G2 combustibles fossiles§! à §YArménie§!"
gas_four_tt: "Nous accorde §G4 combustibles fossiles§! dans §YSyunik§!"
gas_four_per_tt: "Donne §G4 combustibles fossiles§! à §YArménie§!"
ARM_arm_electr_deal: "Approvisionnement en électricité arménienne"
ARM_arm_electr_deal_two: "Approvisionnement en électricité arménienne"
arme.29.t: "[PER.GetNameWithFlag]-[ARM.GetNameWithFlag] Accord gazier !"
arme.29.d: "Récemment, les dirigeants de l'Arménie et de l'Iran se sont rencontrés dans la province de Syunik en Arménie et ont célébré l'ouverture officielle d'un nouveau gazoduc."
arme.29.a: "Magnifique !"
per_gas_accepted: "[PER.GetNameWithFlag] a accepté l'accord sur le gazoduc"
ARM_expand_pipeline: "Élargir le gazoduc avec [PER.GetNameWithFlag]"
ARM_cancel_pipeline: "§RAnnuler§! le gazoduc avec [PER.GetNameWithFlag]"
arme.30.t: "[ARM.GetNameWithFlag] élargit l'accord gazier !"
arme.30.d: "L'Arménie a décidé d'augmenter l'accord de troc et de nous fournir plus d'électricité en échange de plus de gaz."
arme.30.a: "Super !"
ARM_eaeu_integrat: "Intégration à l'UEEA"
ARM_eaeu_integrat_desc: "La pression économique russe sur nous est trop forte pour être ignorée. Nous pouvons en tirer quelque chose de très bénéfique, si nous signons les bons accords..."
ARM_undermine_russian_influence: "Saper l'influence russe"
ARM_undermine_russian_influence_desc: "Les Russes influencent notre pays depuis trop longtemps. Nous devons nous débarrasser de leur influence dans notre pays."
arme.31.t: "[PER.GetNameWithFlag]-[ARM.GetNameWithFlag] L'accord gazier est annulé !"
arme.31.d: "L'accord gazier entre l'Arménie et l'Iran est désormais annulé et le gazoduc est fermé."
arme.31.a: "D'accord."
arme.32.t: "[ARM.GetNameWithFlag] sape l'influence de [SOV.GetNameWithFlag] !"
arme.32.d: "Récemment, l'Arménie a commencé à fermer divers centres culturels russes influents et a interdit les médias d'État russes dans leur pays."
arme.32.a: "Sacrés salauds !"
ARM_support_russian_opposition: "Soutenir l'opposition russe"
ARM_support_russian_opposition_desc: "Nous devons saper la Russie et soutenir les leaders de l'opposition russe en les finançant depuis l'Arménie."
arme.33.t: "[ARM.GetNameWithFlag] soutient notre opposition !"
arme.33.d: "Récemment, le gouvernement arménien a annoncé qu'il soutient l'opposition russe et invite tous ceux qui pourraient être réprimés à venir en Arménie. On ignore pourquoi le gouvernement arménien a adopté une telle position, mais il est clair qu'elle a été influencée par le récent refroidissement des relations entre Erevan et Moscou."
arme.33.a: "Comment osent-ils !"
arme.34.t: "Question de la base militaire russe"
arme.34.d: "Maintenant que nos relations avec la Russie se sont détériorées, la question du retrait des troupes russes de notre pays se pose. D'un côté, nous pouvons simplement les expulser, et de l'autre, essayer d'influencer la Russie à travers cette base militaire. Comment devons-nous procéder ?"
arme.34.a: "Ils doivent partir le plus vite possible !"
arme.34.b: "Ils pourraient être utiles... pour le moment."
ARM_question_military_base: "Questionner la base militaire russe"
ARM_question_military_base_desc: "Nous devons maintenant réfléchir à ce que nous devons faire concernant la base militaire russe en Arménie."
ARM_freeze_csto_membership: "Geler l'adhésion à l'OTSC"
ARM_freeze_csto_membership_desc: "L'OTSC ne nous est d'aucune utilité car ils ne veulent pas nous aider contre l'Azerbaïdjan. Nous devons décider quoi faire de cette organisation."
ARM_investigate_prorus_offic: "Enquêter sur les officiels pro-russes"
ARM_investigate_prorus_offic_desc: "De nombreux politiciens et officiels sont très enthousiastes à soutenir les politiques russes. Nous devons enquêter sur eux..."
ARM_polish_cherries: "Cerise polonaise"
ARM_polish_cherries_desc: "La Pologne est célèbre pour ses produits agricoles, pourquoi ne pas entamer une relation commerciale avec elle en commençant à petite échelle ?"
ARM_polish_mil_coop: "Coopération militaire avec la Pologne"
ARM_polish_mil_coop_desc: "La Pologne peut devenir un bon fournisseur d'armes pour nous, et nous avons l'intention d'essayer de conclure un contrat de livraison d'armes avec eux."
ARM_arm_pol_friend: "Partenariat avec la Pologne"
ARM_arm_pol_friend_desc: "Nous avons l'intention de développer nos relations de partenariat avec nos collègues polonais à un nouveau niveau."
ARM_polish_fleet_help: "Demander à la Pologne d'aider avec la flotte"
ARM_polish_fleet_help_desc: "Nous avons l'intention d'attirer des spécialistes polonais pour le développement de notre flotte, en rappelant les premiers traités de la Pologne avec la Première République d'Arménie."
ARM_our_common_heritage: "Notre héritage commun"
ARM_our_common_heritage_desc: "La bataille de Grunwald, lorsque l'Ordre teutonique fut vaincu par l'armée polonaise, n'a pas eu lieu sans la participation des Arméniens. Nous avons aidé la Pologne à l'époque, pouvons-nous les inviter à se souvenir de l'héritage glorieux de ces années ?"
ARM_military_coop_greece: "Coopération militaire avec la Grèce"
ARM_military_coop_greece_desc: "Nous avons l'intention de proposer à la Grèce d'élargir notre coopération militaire et de tenir un certain nombre d'exercices conjoints."
arme.38.t: "Résultats de l'enquête"
arme.38.d: "Notre Service de Sécurité Nationale a vérifié tous les politiciens pro-russes et a trouvé leurs liens avec le gouvernement russe. Cependant, aucun schéma de corruption n'a été découvert."
arme.38.a: "Intéressant."
arme.39.t: "Résultats de l'enquête"
arme.39.d: "Notre Service de Sécurité Nationale a vérifié tous les politiciens pro-russes et a trouvé leurs liens avec le gouvernement russe. Des schémas de corruption ont également été déclassifiés et leurs activités ont été stoppées."
arme.39.a: "Super !"
ARM_sign_rome_statute: "Signature du Statut de Rome"
ARM_sign_rome_statute_desc: "Signer le Statut de Rome pourrait nous donner plus d'outils pour contrer l'agression russe dans notre région et au-delà."
ARM_cleanse_russian_agents: "Arrêter les agents russes"
ARM_cleanse_russian_agents_desc: "Nous devons arrêter et interdire tous les politiciens qui travaillent ouvertement pour les intérêts russes et promeuvent une politique de soumission !"
ARM_demand_contr_reassur: "Exiger l'exécution des contrats"
ARM_demand_contr_reassur_desc: "Avec notre influence sur la Russie qui s'accroît, nous devons exiger que nos contrats d'armement soient respectés."
arme.40.t: "[ARM.GetNameWithFlag] exige l'exécution des contrats"
arme.40.d: "Le gouvernement arménien, ayant accru son influence sur notre pays, exige que nous respections certains contrats d'armement que nous avons cessé d'exécuter après la détérioration de nos relations. Cependant, si nous respectons le contrat, leur influence sur nous diminuera fortement."
arme.40.a: "Étouffe-toi avec !"
ARM_northern_neighbor: "Voisin du nord"
ARM_northern_neighbor_desc: "Notre voisin du nord, le moins hostile, doit être traité. Soit par la diplomatie, soit autrement."
ARM_open_up_djavakhq_quest: "Ouvrir la question de Djavakhk"
ARM_open_up_djavakhq_quest_desc: "Notre peuple en Géorgie est opprimé par nos partenaires du nord. Il est temps de les libérer de la Géorgie !"
ARM_support_separatism: "Soutenir le séparatisme"
ARM_support_separatism_desc: "Nous devons soutenir le séparatisme en Géorgie et promouvoir la liberté de Djavakhk par des moyens militaires !"
ARM_protect_minority_rights: "Protéger les droits des minorités"
ARM_protect_minority_rights_desc: "Nos amis géorgiens sont trop durs avec la population arménienne dans leur pays. Nous ne devons pas déclencher de conflit, mais influencer la Géorgie par des moyens diplomatiques."
ARM_friendship_and_trade_agreement: "Accord d'amitié et de commerce"
ARM_friendship_and_trade_agreement_desc: "Bien qu'il y ait des problèmes concernant la Géorgie et notre population arménienne à Djavakhk, nous pouvons négocier pacifiquement et faire prospérer nos deux pays."
ARM_demand_representation: "Exiger une représentation"
ARM_demand_representation_desc: "Nous respectons l'intégrité territoriale de la Géorgie, cependant, nous ne pouvons pas rester à l'écart et regarder comment le système non démocratique en Géorgie ostracise la communauté arménienne dans leur système politique !"
ARM_black_sea_agreements: "Accords de la mer Noire"
ARM_black_sea_agreements_desc: "Le commerce à travers la mer Noire est énorme et il pourrait être bénéfique pour nous deux d'établir des accords pour le commerce bilatéral et l'accès maritime."
ARM_electro_exporting: "Exportation d'électricité"
ARM_electro_exporting_desc: "Notre capacité à exporter de l'électricité est suffisante pour élargir notre exportation. Nous pouvons établir un accord avec la Géorgie qui pourrait être bénéfique."
ARM_javakhq_must_be_free: "Opération §9\"Croix déchue\"§!"
ARM_javakhq_must_be_free_desc: "Les Géorgiens impérialistes exploitent notre terre et notre peuple depuis trop longtemps ! Maintenant, nous devons mener une opération militaire et libérer notre peuple !"
ARM_support_geo_peace: "Soutenir la paix en Géorgie"
ARM_support_geo_peace_desc: "Pour favoriser la confiance entre nos pays, nous pouvons essayer de négocier un accord entre les républiques séparatistes et la Géorgie, mettant fin à ce conflit insensé."
ARM_friendship_syria: "Amitié avec la Syrie"
ARM_friendship_syria_desc: "Malgré nos possibles différences politiques avec la Syrie, la communauté alaouite a toujours soutenu les Arméniens dans la région, et nous devons approfondir nos relations."
ARM_alaw_assyr_armen: "Connexions alaouites-arméniennes-assyriennes"
ARM_alaw_assyr_armen_desc: "Le trio des Alaouites, Arméniens et Assyriens sont des minorités non musulmanes en Syrie. Pour que nos communautés survivent, nous devons coopérer et nous soutenir mutuellement."
ARM_rescuing_diasp: "Sauver la diaspora"
ARM_rescuing_diasp_desc: "La situation en Syrie est assez instable, et nous devons aider notre communauté à se rapatrier en Arménie et à s'intégrer dans notre société."
ARM_human_aid_syr: "Aide humanitaire à la Syrie"
ARM_human_aid_syr_desc: "La population syrienne a désespérément besoin d'aide, nous devons fournir une aide humanitaire à la Syrie et accroître notre influence sur eux."
ARM_intervene_in_syria: "Intervenir en Syrie"
ARM_intervene_in_syria_desc: "Nous devons envoyer nos forces pour aider la Syrie dans leur guerre !"
arme.41.t: "Les Arméniens de Djavakheti exigent une représentation !"
arme.41.d: "La population arménienne de Samtskhe-Djavakheti exige une représentation dans notre parlement et souhaite une autonomie élargie au sein de la Géorgie. Ils précisent que leurs manifestations ne sont pas liées à l'Ossétie du Sud et à l'Abkhazie, et ils ne veulent pas d'un conflit armé dans leur patrie.\n\nLe gouvernement arménien lui-même a soutenu leur demande tout en appelant à la stabilisation de la situation et en demandant aux Arméniens de ne pas déclencher une révolte armée.\n\nLe gouvernement arménien a également déclaré que si nous fédéralisons notre pays, ils nous aideront à intégrer l'Ossétie du Sud et l'Abkhazie grâce à leurs liens avec la diaspora, en contournant l'influence russe."
arme.41.a: "Demande légitime !"
arme.41.b: "Nous ne pouvons pas nous le permettre !"
arme.42.t: "Fédéralisation !"
arme.42.d: "Pourquoi lis-tu ceci, petit tricheur ?"
arme.42.a: "Zaebumba ?"
djavakhq_pizdec: "[GEO.GetNameWithFlag] a refusé une résolution pacifique"
arme.43.t: "Fédéralisation de [GEO.GetNameWithFlag] !"
arme.43.d: "La Géorgie a accepté la proposition des Arméniens de Djavakhk et a fédéralisé leur pays."
arme.43.a: "Magnifique !"
arme.44.t: "[GEO.GetNameWithFlag] refuse de se fédéraliser !"
arme.44.d: "La Géorgie a refusé de se fédéraliser et ne donnera pas d'autonomie à Djavakhk."
arme.44.a: "Quel dommage !"
geofed_arm_tt: "[GEO.GetNameWithFlag] pourrait se fédéraliser et donner une autonomie à §9Djavakhk§! [ARM.GetFlag]"
arme.45.t: "[ARM.GetNameWithFlag] propose une résolution de conflit !"
arme.45.d: "Récemment, le gouvernement arménien a décidé de médier notre conflit avec la Géorgie. Les Arméniens proposent une solution par laquelle nous, [ROOT.GetNameWithFlag], obtiendrons une autonomie complète avec la possibilité de sécession si nous le souhaitons. Ils pointent du doigt la situation récente de la région autonome de Djavakhk et la manière efficace dont elle a été résolue. L'Arménie garantira également que la Géorgie ne nous retirera pas notre autonomie. Devons-nous accepter ?"
arme.45.a: "Bien sûr !"
arme.45.b: "Nous ne renoncerons pas à notre souveraineté !"
sooabk_peac_tt: "[SOO.GetNameWithFlag] et [ABK.GetNameWithFlag] rejoindront [GEO.GetNameWithFlag] en tant que §Yrégions autonomes§! et nous obtiendrons une influence sur [GEO.GetNameWithFlag] !"
arme.46.t: "[FROM.GetNameWithFlag] accepte la fédéralisation !"
arme.46.d: "[FROM.GetNameWithFlag] a accepté la solution arménienne pour la fédéralisation avec la Géorgie et fait désormais partie de l'État géorgien."
arme.46.a: "Magnifique !"
arme.46.b: "Super !"
arme.47.t: "[FROM.GetNameWithFlag] rejette la fédéralisation !"
arme.47.d: "[FROM.GetNameWithFlag] a rejeté notre proposition de résolution."
arme.47.a: "Très regrettable."
arme.48.t: "[ARM.GetNameWithFlag] revendique Samtskhe-Djavakheti !"
arme.48.d: "Récemment, le gouvernement de [ARM.GetNameWithFlag] a déclaré que l'oppression des Arméniens en Géorgie doit cesser immédiatement.\n\nNos officiels et certaines figures arméniennes pro-géorgiennes nient toute revendication d'oppression, cependant, l'Arménie a déjà commencé à rassembler des troupes à la frontière géorgienne-arménienne."
arme.48.a: "Sacrés salauds !"
arme.49.t: "Guerre entre [ARM.GetNameWithFlag] et [GEO.GetNameWithFlag] !"
arme.49.d: "L'Arménie a récemment déclaré la guerre à la Géorgie. Cela pourrait être notre chance historique d'écraser définitivement le géant géorgien !"
arme.49.a: "Nous nous joignons !"
arme.49.b: "C'est trop risqué..."
ARM_amenia_georgia_trade: "Accord commercial [ARM.GetNameWithFlag] - [GEO.GetNameWithFlag]"
arme.50.t: "[ARM.GetNameWithFlag] propose un accord commercial !"
arme.50.d: "[ARM.GetNameWithFlag] a récemment proposé un accord d'amitié et de commerce entre nos pays. Devons-nous accepter leur proposition ?"
arme.50.a: "Bien sûr !"
arme.50.b: "Nous ne sommes pas intéressés."
arme.51.t: "[GEO.GetNameWithFlag] accepte !"
arme.51.d: "[GEO.GetNameWithFlag] a accepté notre proposition diplomatique de signer un accord d'amitié et de commerce."
arme.51.a: "Magnifique !"
arme.52.t: "[GEO.GetNameWithFlag] rejette !"
arme.52.d: "[GEO.GetNameWithFlag] a rejeté notre proposition d'amitié et de commerce."
arme.52.a: "Nous devons abandonner nos tentatives de nous lier d'amitié avec la Géorgie."
arme.52.b: "Continuons notre mission diplomatique."
arme.53.t: "[ARM.GetNameWithFlag] demande un accès à la mer Noire !"
arme.53.d: "Récemment, le gouvernement arménien a exprimé sa volonté de nous payer pour un accès à la mer Noire. Devons-nous accepter leur offre ?"
arme.53.a: "Oui, bien sûr !"
arme.53.b: "Non, dégagez."
arme.54.t: "[GEO.GetNameWithFlag] accepte !"
arme.54.d: "[GEO.GetNameWithFlag] a accepté notre proposition diplomatique de nous donner accès aux ports de la mer Noire."
arme.54.a: "Magnifique !"
arme.55.t: "[GEO.GetNameWithFlag] rejette !"
arme.55.d: "[GEO.GetNameWithFlag] a rejeté notre proposition d'amitié et de commerce."
arme.55.a: "Pfff"
arme.55.b: "Nous devons poursuivre les efforts diplomatiques !"
arme.56.t: "[ARM.GetNameWithFlag] propose un accord d'exportation d'électricité !"
arme.56.d: "Récemment, l'Arménie nous a proposé un accord d'exportation d'électricité, par lequel ils nous fourniront de l'électricité pendant plusieurs années à un prix abordable. Devons-nous accepter ?"
arme.56.a: "Bien sûr !"
arme.56.b: "Désolé, non."
arme.57.t: "[ARM.GetNameWithFlag] souhaite acheter nos armes"
arme.57.d: "[ARM.GetName] a exprimé le souhait d'acheter certaines de nos armes dans le cadre du renforcement de la coopération militaire avec nous, ainsi que du renforcement de ses forces armées. Devons-nous accepter ?"
arme.57.a: "Bien sûr !"
arme.57.b: "Désolé, non."
arme.58.t: "Contrat militaire avec [POL.GetNameWithFlag]"
arme.58.d: "Ils ont accepté de nous vendre leurs armes dans le cadre de la coopération militaire entre les deux pays, ce qui est très encourageant, car nous pourrons renforcer considérablement nos forces armées."
arme.58.a: "Bien"
arme.59.t: "Contrat militaire avec [POL.GetNameWithFlag]"
arme.59.d: "Ils ont refusé de signer un contrat pour la fourniture d'armes à notre intention, apparemment ils pensent que leurs armes entre nos mains perturberaient l'équilibre des forces ? Quelle stupidité."
arme.59.a: "Triste"
arme.60.t: "[ARM.GetNameWithFlag] cherche à améliorer les relations avec nous"
arme.60.d: "Le gouvernement arménien est clairement déterminé à améliorer sérieusement les relations diplomatiques entre nos pays, et ils ont l'intention de nous inviter à signer un accord d'amitié et de coopération. Devons-nous accepter ?"
arme.60.a: "Bien sûr !"
arme.60.b: "Désolé, non."
arme.61.t: "Partenariat avec [POL.GetNameWithFlag]"
arme.61.d: "Le gouvernement polonais a approuvé un accord de partenariat et d'amitié entre nos pays, ce qui est sans aucun doute encourageant, car de plus en plus de pays deviennent nos partenaires !"
arme.61.a: "Super"
arme.62.t: "Partenariat avec [POL.GetNameWithFlag]"
arme.62.d: "Le gouvernement polonais nous a refusé un traité d'amitié et de coopération, ce qui est bien sûr triste, car nous sommes toujours concentrés sur la coopération entre nos pays."
arme.62.a: "Triste"
arme.63.t: "[ARM.GetNameWithFlag] demande de l'aide pour le développement de la flotte"
arme.63.d: "Le gouvernement arménien, se référant à l'accord conclu lors de l'existence de la Première République d'Arménie, demande à notre gouvernement une assistance pour développer la flotte, car l'Arménie a de nouveau accès à la mer. Devons-nous accepter ?"
arme.63.a: "Bien sûr !"
arme.63.b: "Désolé, non."
arme.64.t: "[POL.GetFlag] Aide polonaise au développement de la flotte"
arme.64.d: "Le gouvernement polonais a accepté de nous aider à développer notre flotte, et maintenant nous renforcerons nos forces navales."
arme.64.a: "Super !"
arme.65.t: "[POL.GetFlag] Aide polonaise au développement de la flotte"
arme.65.d: "Le gouvernement polonais a refusé de nous aider à développer nos forces navales, invoquant l'impossibilité financière de le faire."
arme.65.a: "Triste"
arme.66.t: "[ARM.GetNameWithFlag] nous invite à nous souvenir de Grunwald"
arme.66.d: "La bataille de Grunwald est un événement historique dans l'histoire de la Pologne, lorsque l'Ordre teutonique et ses alliés furent complètement vaincus par l'armée polonaise. Les historiens confirment également la participation des Arméniens à cet événement aux côtés de l'armée polonaise. Cela irritera grandement le côté allemand. Devons-nous accepter ?"
arme.66.a: "C'est une raison d'être fiers."
arme.66.b: "Désolé, non."
arme.67.t: "L'héritage polono-arménien de la bataille de Grunwald"
arme.67.d: "Le gouvernement polonais a soutenu notre désir de préserver cet événement historique dans la mémoire de nos peuples comme une raison de fierté."
arme.67.a: "Bien"
arme.68.t: "L'héritage polono-arménien de la bataille de Grunwald"
arme.68.d: "Le gouvernement polonais n'a pas soutenu notre désir de raviver l'histoire de ces événements, apparemment ils craignent la botte allemande !"
arme.68.a: "Triste"
arme.69.t: "Cerise polonaise"
arme.69.d: "Toute relation entre pays commence par de petites choses, donc notre relation avec la Pologne a ses racines dans l'achat de baies polonaises pour notre marché, peut-être pouvons-nous élargir notre partenariat avec eux."
arme.69.a: "Nous l'espérons"
arme.70.t: "[ARM.GetNameWithFlag] propose des exercices conjoints"
arme.70.d: "L'Arménie a l'intention d'élargir la coopération militaro-technique avec nous et propose de tenir des exercices conjoints de nos forces d'opérations spéciales pour partager nos expériences."
arme.70.a: "Nous acceptons"
arme.70.b: "Non"
arme.71.t: "Exercices conjoints avec la Grèce"
arme.71.d: "Le gouvernement grec a accepté notre offre et nous avons effectué des exercices conjoints de nos forces d'opérations spéciales."
arme.71.a: "Nous sommes plus forts ensemble."
arme.72.t: "Exercices conjoints avec la Grèce"
arme.72.d: "Le gouvernement grec a refusé de mener des exercices conjoints avec nos forces d'opérations spéciales."
arme.72.a: "Il doit y avoir des raisons."
ARM_legacy_of_grunwald_idea: "Héritage de la bataille de Grunwald"
ARM_anti_turkish_idea: "Diplomatie anti-turque"
ARM_amenia_georgia_electro: "Importation d'électricité de [ARM.GetNameWithFlag]"
ARM_amenia_georgia_electro_agre: "Exportation d'électricité vers [GEO.GetNameWithFlag]"
arme.74.t: "[GEO.GetNameWithFlag] accepte !"
arme.74.d: "La Géorgie a accepté notre offre d'exportation d'électricité et nous établissons maintenant toutes les infrastructures nécessaires pour le transport de l'électricité."
arme.74.a: "Super !"
arme.75.t: "[GEO.GetNameWithFlag] refuse !"
arme.75.d: "La Géorgie considère notre offre d'exportation d'électricité comme nuisible à leur propre industrie de production d'électricité. Ainsi, ils ne veulent pas de notre électricité dans leur pays."
arme.75.a: "Fous"
ARM_bilat_trade_agreement: "Accord commercial bilatéral"
ARM_bilat_trade_agreement_desc: "Le commerce entre l'Arménie et l'Iran a beaucoup de potentiel. Nous devons créer des conditions dans lesquelles il n'y aura aucun obstacle entre nos pays en matière de commerce."
ARM_memorandum_of_understanding: "Mémorandum d'entente"
ARM_memorandum_of_understanding_desc: "Les médias d'État de l'Iran et de l'Arménie doivent signer un mémorandum d'entente et de coordination pour lutter contre la désinformation sur les deux pays provenant de leurs ennemis communs."
ARM_amenia_iran_memo: "Mémorandum d'entente [ARM.GetNameWithFlag] - [PER.GetNameWithFlag]"
arme.76.t: "Mémorandum d'entente [ARM.GetNameWithFlag] - [PER.GetNameWithFlag] !"
arme.76.d: "Récemment, les médias gouvernementaux arméniens nous ont contactés pour proposer un accord mutuellement bénéfique. Ils proposent de signer un mémorandum par lequel les médias iraniens et arméniens lutteront contre la désinformation sur les deux pays, propagée par nos ennemis communs. Devons-nous accepter cette proposition ?"
arme.76.a: "Bien sûr !"
arme.76.b: "Nous ne sommes pas intéressés"
arme.77.t: "[PER.GetNameWithFlag] accepte !"
arme.77.d: "L'Iran a accepté notre proposition de mémorandum, par lequel les médias iraniens et arméniens lutteront contre la désinformation sur les deux pays, propagée par nos ennemis communs."
arme.77.a: "Super !"
arme.78.t: "[PER.GetNameWithFlag] refuse !"
arme.78.d: "L'Iran n'a vu aucun intérêt à signer le mémorandum que nous leur avons proposé."
arme.78.a: "Étrange"
arme.80.t: "Coopération politique avec [ARM.GetNameWithFlag]"
arme.80.d: "L'Arménie est notre partenaire et l'une des nations les plus proches en esprit, nous avons un héritage commun et devons rester soudés, il n'est donc pas surprenant que l'Arménie ait exprimé le souhait d'élargir notre coopération."
arme.80.a: "Nous sommes amis !"
arme.80.b: "Nous ne sommes pas intéressés"
arme.81.t: "Coopération politique avec [GRE.GetNameWithFlag]"
arme.81.d: "La Grèce a exprimé sa volonté de coopérer avec nous dans la sphère politique, et ensemble, nos États peuvent accomplir beaucoup !"
arme.81.a: "Super"
arme.82.t: "Coopération politique avec [GRE.GetNameWithFlag]"
arme.82.d: "La Grèce n'est pas prête à élargir la coopération politique avec nous, ils ne voient pas l'intérêt de le faire."
arme.82.a: "Triste"
arme.83.t: "Politique conjointe anti-turque"
arme.83.d: "La Turquie est une menace égale pour l'Arménie et pour nous. L'Arménie propose de mener une politique conjointe anti-turque pour montrer au gouvernement turc sa place."
arme.83.a: "La Turquie devrait avoir peur de nous"
arme.83.b: "Nous ne sommes pas intéressés"
arme.84.t: "Politique conjointe anti-turque"
arme.84.d: "Le gouvernement grec a soutenu notre initiative politique anti-turque, et nous avons l'intention de lutter contre l'influence de la Turquie sur nous."
arme.84.a: "Super"
arme.85.t: "Politique conjointe anti-turque"
arme.85.d: "Le gouvernement grec a décidé de ne pas soutenir notre initiative anti-turque, ce qui nous a déçus."
arme.85.a: "Triste"
arme.86.t: "Partenariat avec [ARM.GetNameWithFlag]"
arme.86.d: "L'Arménie a l'intention d'élargir son partenariat avec nous dans le cadre de la coopération avec l'Union européenne, ils nous voient comme ceux qui leur ouvriront la voie pour interagir avec toute l'UE."
arme.86.a: "Nous sommes amis !"
arme.86.b: "Nous ne sommes pas intéressés"
arme.87.t: "Coopération politique avec [GRE.GetNameWithFlag]"
arme.87.d: "La Grèce est prête à élargir notre coopération politique, et est également prête à aider à établir des contacts avec l'Union européenne."
arme.87.a: "Super"

arme.88.t: "Aide dans la lutte pour Chypre"
arme.88.d: "Le gouvernement arménien soutient nos efforts pour protéger nos intérêts à Chypre, et ils sont prêts à nous fournir un soutien maximal dans ce combat. Sommes-nous prêts à hausser la mise et à impliquer l'Arménie dans cette affaire ?"
arme.88.a: "Oui"
arme.88.b: "Nous ne sommes pas intéressés"
arme.89.t: "Aide dans la lutte pour Chypre"
arme.89.d: "Le gouvernement grec a exprimé une grande joie face à notre offre d'assistance pour résoudre la question de Chypre, et ils ont clairement laissé entendre que nous pourrions les aider par tous les moyens nécessaires."
arme.89.a: "Super"
arme.90.t: "Aide dans la lutte pour Chypre"
arme.90.d: "Le gouvernement grec nous a refusés et nous a mis en garde contre une participation à la question de Chypre, il semble qu'ils craignent de déstabiliser la situation."
arme.90.a: "Triste"
arme.91.t: "L'Arménie nous soutient à Chypre"
arme.91.d: "Les services spéciaux arméniens nous assistent activement dans la résolution de notre problème à Chypre, nous aidant à accroître notre influence sur l'île."
arme.91.a: "Super"
ARM_mithridates_legacy: "Héritage de Mithridate"
ARM_mithridates_legacy_desc: "Depuis l'Antiquité, les Arméniens et les Grecs ont toujours partagé des valeurs communes, une fraternité de sang et des ennemis communs. Dans la tradition de l'héritage de Mithridate du Pont, nous devons poursuivre l'amitié entre nos peuples frères."
ARM_reassuring_comp_agre: "Accord global"
ARM_reassuring_comp_agre_desc: "Nous devons signer un accord d'amitié global avec la Grèce pour officialiser enfin nos relations au niveau gouvernemental."
ARM_anti_turk_diplo: "Diplomatie anti-turque"
ARM_anti_turk_diplo_desc: "Nous devons coordonner nos efforts diplomatiques avec la Grèce pour contrer les ambitions turques à notre égard."
ARM_our_friend_in_eu: "Notre ami dans l'UE"
ARM_our_friend_in_eu_desc: "La Grèce est notre allié le plus proche au sein de l'Union européenne. Nous devons en tirer parti."
ARM_support_cyprus: "Soutenir Chypre"
ARM_support_cyprus_desc: "Tout comme notre Artsakh, la Grèce a Chypre. Les décisions tyranniques turques y sont également présentes. Nous devons soutenir la cause grecque à Chypre."
arme.79.t: "[ARM.GetNameWithFlag] propose un projet de barrage !"
arme.79.d: "Récemment, le gouvernement arménien a proposé un projet conjoint de barrage hydroélectrique sur la rivière Araks, qui coule entre nos frontières. Devons-nous accepter leur proposition ?"
arme.79.a: "Bien sûr, nous acceptons !"
arme.79.b: "Non, nous ne sommes pas intéressés."
arme.92.t: "[PER.GetNameWithFlag] accepte !"
arme.92.d: "L'Iran a accepté la construction conjointe d'un barrage hydroélectrique dans la région de Syunik. Ils ont déjà payé leur part du coût."
arme.92.a: "Super !"
ARM_amenia_iran_dam_share: "Partage hydroélectrique de Syunik"
idea_willcanc_if_rel_tt: "§YCette idée sera supprimée si nos relations avec [ARM.GetNameWithFlag] se détériorent.§!"
dam_syunik_tt: "§YBarrage hydroélectrique§! avec §YProduction d'énergie de 0.53§! sera construit à §YSyunik !§!"
arme.93.t: "[PER.GetNameWithFlag] refuse !"
arme.93.d: "L'Iran n'est pas intéressé par la construction d'une centrale hydroélectrique dans la région de Syunik."
arme.93.a: "Très regrettable."
ARM_arax_hydro_power: "Énergie hydroélectrique d'Araks"
ARM_arax_hydro_power_desc: "Nous pouvons proposer à l'Iran de construire une centrale hydroélectrique dans la région de Syunik sur la rivière Araks."
ARM_export_weapons_iran: "Exporter des armes vers l'Iran"
ARM_export_weapons_iran_desc: "En raison de la pression étrangère sur l'Iran, ils pourraient être intéressés par l'achat de nos armes à un prix raisonnable..."
arme.94.t: "[ARM.GetNameWithFlag] propose un accord d'armement !"
arme.94.d: "Récemment, le gouvernement arménien nous a proposé un envoi d'armes d'infanterie de qualité militaire. Ils nous offrent un prix raisonnable, compte tenu de la situation actuelle."
arme.94.a: "Bien sûr, nous acceptons !"
arme.94.b: "Nous ne sommes pas intéressés."
arme.95.t: "[PER.GetNameWithFlag] accepte !"
arme.95.d: "L'Iran a accepté d'acheter nos armes, l'envoi sera complété sous peu."
arme.95.a: "Super !"
arme.96.t: "[PER.GetNameWithFlag] refuse !"
arme.96.d: "L'Iran n'a pas accepté d'acheter nos armes pour une raison quelconque."
arme.96.a: "Très regrettable."
ARM_free_trade_zone: "Zone de libre-échange de Meghri"
ARM_third_power_transmission: "Zone économique libre de Meghri"
ARM_third_power_transmission_desc: "Pour augmenter notre commerce avec l'Iran, nous devrions établir une zone de libre-échange à Meghri."
ARM_iranian_drone_deal: "Achat de drones iraniens"
ARM_iranian_drone_deal_desc: "Les drones iraniens ont prouvé leur efficacité dans les combats modernes. Nous pouvons leur trouver une utilité..."
arme.97.t: "[ARM.GetNameWithFlag] souhaite acheter nos drones !"
arme.97.d: "Récemment, l'Arménie a manifesté un intérêt pour l'achat de nos drones. Devons-nous accepter leur offre et leur fournir les drones pour la somme convenue ?"
arme.97.a: "Bien sûr !"
arme.97.b: "Désolé, non."
arme.98.t: "[PER.GetNameWithFlag] accepte !"
arme.98.d: "L'Iran a accepté de nous vendre certains de leurs drones. Ils seront livrés sous peu."
arme.98.a: "Super !"
arme.99.t: "[PER.GetNameWithFlag] refuse !"
arme.99.d: "L'Iran n'a pas accepté notre accord d'achat de drones."
arme.99.a: "Oh."
ARM_covert_defense_agreement: "Accord de défense secret"
ARM_covert_defense_agreement_desc: "Nous devons nous allier avec l'Iran à un niveau secret et plus profond pour assurer la sécurité de nos deux États."
arme.100.t: "[ARM.GetNameWithFlag] propose un accord de défense secret !"
arme.100.d: "L'Arménie a récemment proposé un accord de défense secret entre nos deux pays. Ils veulent que nous garantissions leur indépendance, et ils garantiront la nôtre. Devons-nous accepter ?"
arme.100.a: "Bien sûr !"
arme.100.b: "Non, nous ne pouvons pas prendre ce risque."
arme.101.t: "[PER.GetNameWithFlag] accepte !"
arme.101.d: "L'accord de défense secret a été signé."
arme.101.a: "Super !"
arme.102.t: "[PER.GetNameWithFlag] refuse !"
arme.102.d: "L'accord de défense secret n'a pas été signé."
arme.102.a: "Eh..."
arme.103.t: "Rébellion au Kurdistan"
arme.103.d: "Les Kurdes se sont rebellés dans les régions de leur résidence situées sur le territoire de notre pays, ils ont clairement été aidés par quelqu'un de l'étranger. Nos services de renseignement rapportent que cela est l'œuvre des services spéciaux arméniens."
arme.103.a: "L'Arménie paiera pour cela"
arme.104.t: "Bataillons rebelles"
arme.104.d: "Notre soulèvement gagne du terrain, des bataillons entiers ont déjà été formés, prêts à défendre notre liberté contre l'occupation iranienne."
arme.104.a: "Pour la liberté du Kurdistan"
arme.105.t: "Accord commercial avec l'Arménie"
arme.105.d: "Le gouvernement arménien souhaite conclure un accord commercial avec nous, en contournant les structures de l'Union européenne. Ils estiment que ce sera une meilleure façon de coopérer économiquement que d'attendre des années que la bureaucratie européenne fasse son travail."
arme.105.a: "Nous acceptons"
arme.105.b: "Nous refusons"
arme.106.t: "Accord de coopération économique et commerciale avec l'Arménie"
arme.106.d: "Le gouvernement arménien souhaite élargir les liens culturels et économiques avec notre pays. L'Arménie propose de conclure une série de traités et d'accords visant à coopérer dans ces domaines entre nos pays."
arme.106.a: "Nous acceptons"
arme.106.b: "Nous refusons"
arme.107.t: "Accord commercial avec la France"
arme.107.d: "Le gouvernement français a accepté de conclure une série d'accords sur la coopération économique et culturelle avec nous."
arme.107.a: "Super"
arme.108.t: "Accord commercial avec la France"
arme.108.d: "Le gouvernement français a refusé d'élargir la coopération avec nous dans les domaines culturel et économique, apparemment ils ne nous considèrent pas comme des partenaires possibles."
arme.108.a: "Triste"
arme.109.t: "Accord de coopération éducative avec l'Arménie"
arme.109.d: "Le gouvernement arménien a exprimé son intérêt pour une coopération avec nos institutions éducatives et souhaiterait voir des représentations de nos meilleures universités dans leur pays. C'est une excellente opportunité pour influencer les esprits de la jeunesse arménienne."
arme.109.a: "Nous acceptons"
arme.109.b: "Nous refusons"
arme.110.t: "Accord de coopération éducative avec la France"
arme.110.d: "Le gouvernement français a exprimé sa volonté et son désir de coopérer activement avec nous dans le domaine éducatif et est également prêt à ouvrir des représentations de ses institutions d'enseignement supérieur dans notre pays."
arme.110.a: "Super"
arme.111.t: "Accord de coopération éducative avec la France"
arme.111.d: "Le gouvernement français a refusé notre offre de coopération dans le domaine de l'éducation entre nos pays, il semble qu'ils ne soient pas d'humeur à dialoguer avec nous dans ce domaine."
arme.111.a: "Triste"
arme.112.t: "Coopération militaire avec l'Arménie"
arme.112.d: "Le gouvernement arménien souhaite nous proposer une coopération militaire entre nos pays, l'Arménie est très intéressée par l'expérience de nos missions internationales, ainsi que par l'expérience de la Légion étrangère."
arme.112.a: "Nous acceptons"
arme.112.b: "Nous refusons"
arme.113.t: "Coopération militaire avec la France"
arme.113.d: "Le gouvernement français a accepté de coopérer entre nos forces armées, en particulier pour acquérir de l'expérience dans la conduite de missions internationales, ainsi que certaines opérations de la Légion étrangère."
arme.113.a: "Super"
arme.114.t: "Coopération militaire avec la France"
arme.114.d: "Le gouvernement français a refusé de coopérer militairement avec nous, apparemment ils ne croient pas que notre armée soit en mesure d'apprendre de l'expérience étrangère."
arme.114.a: "Triste"
arme.115.t: "L'Arménie dans la Francophonie"
arme.115.d: "Le gouvernement arménien aspire depuis longtemps à devenir membre de la Francophonie, peut-être que cela représentera quelque chose de plus pour eux, car nous pourrons également les intégrer pleinement dans la francosphère avec le temps. Devons-nous soutenir le désir de l'Arménie de rejoindre la Francophonie ?"
arme.115.a: "Oui"
arme.115.b: "Non"
arme.116.t: "L'Arménie dans la Francophonie"
arme.116.d: "La France a réagi positivement à notre désir de devenir membre de la Francophonie, et maintenant que nous sommes dans la sphère d'influence de la France, nous pouvons compter sur leur patronage."
arme.116.a: "Super"
arme.117.t: "L'Arménie dans la Francophonie"
arme.117.d: "La France a décidé de nous refuser notre désir de devenir membre de la Francophonie et, à l'avenir, de faire partie de toute la sphère francophone."
arme.117.a: "Triste"
arme.118.t: "L'Arménie souhaite rejoindre notre programme militaire européen"
arme.118.d: "Le Programme de Partenariat d'État du Commandement Européen des États-Unis (EUCOM SPP), selon sa propre mission, est un programme de partenariat de la Garde nationale qui relie les États américains à des pays partenaires désignés pour soutenir les objectifs de coopération en matière de sécurité du commandement. Actuellement, 22 partenariats existent avec d'anciens pays soviétiques, yougoslaves et du Pacte de Varsovie dans la zone de responsabilité de l'EUCOM. Devenus indépendants lors de la dissolution de l'Union soviétique le 26 décembre 1991, ces pays ont rapidement demandé l'assistance et les conseils des États-Unis pour créer de nouvelles forces d'autodéfense."
arme.118.a: "Bien sûr, nous devons entraîner nos alliés"
arme.118.b: "Désolé, non"
arme.119.t: "[USA.GetNameWithFlag] accepte !"
arme.119.d: "[FROM.GetNameWithFlag] ont accepté notre initiative, et maintenant nos troupes participeront à des exercices conjoints avec nos alliés européens."
arme.119.a: "Parfait"
arme.120.t: "[USA.GetNameWithFlag] nous a rejetés"
arme.120.d: "Notre politique étrangère a peut-être influencé cela, mais nous n'avons pas été autorisés à participer aux exercices conjoints des pays européens."
arme.120.a: "Mauvais"
arme.121.t: "Exercice conjoint avec l'État du Kansas"
arme.121.d: "L'Arménie souhaite accueillir un exercice conjoint avec notre armée de l'État du Kansas."
arme.121.a: "Bien sûr"
arme.121.b: "Jamais"
arme.122.t: "[USA.GetNameWithFlag] accepte !"
arme.122.d: "[FROM.GetNameWithFlag] accepte des exercices conjoints entre notre armée et la Garde nationale du Kansas."
arme.122.a: "Parfait"
arme.123.t: "[USA.GetNameWithFlag] a rejeté notre proposition"
arme.123.d: "Malheureusement, nous ne pourrons pas améliorer la préparation de notre armée lors d'exercices conjoints avec l'État du Kansas."
arme.123.a: "Mauvais"
arme.124.t: "L'Arménie souhaite obtenir le statut d'allié majeur non-OTAN"
arme.124.d: "Nous voyons l'Arménie comme un pays clé dans la région du Caucase, et son adhésion au programme de partenariat non-OTAN est une bonne perspective pour élargir notre influence là-bas."
arme.124.a: "Oui, nous acceptons"
arme.124.b: "Non, l'Arménie est faible"
arme.125.t: "[USA.GetNameWithFlag] accepte !"
arme.125.d: "Les [USA.GetNameWithFlag] ont ratifié notre candidature, et nous avons maintenant une occasion unique de coopération militaire avec l'OTAN."
arme.125.a: "Bien"
arme.126.t: "[USA.GetNameWithFlag] a rejeté notre candidature"
arme.126.d: "[USA.GetNameWithFlag] a décidé de rejeter notre candidature car nous ne répondons pas à leurs normes."
arme.126.a: "Bof"
arme.127.t: "Investissements supplémentaires en [ARM.GetNameWithFlag] ?"
arme.127.d: "Il est nécessaire de développer les liens économiques entre nos pays à travers divers programmes conjoints."
arme.127.a: "Oui, bien sûr"
arme.127.b: "Jamais"
arme.128.t: "[USA.GetNameWithFlag] accepte !"
arme.128.d: "Heureusement, nous avons réussi à convaincre [USA.GetNameWithFlag] de programmes de financement supplémentaires dans notre pays."
arme.128.a: "Bien"
arme.129.t: "[USA.GetNameWithFlag] a rejeté notre proposition"
arme.129.d: "Malheureusement, [USA.GetNameWithFlag] n'est pas intéressé par cela."
arme.129.a: "Mauvais"
arme.130.t: "[ARM.GetNameWithFlag] demande des paiements dans le cadre du Millennium Challenge Compact"
arme.130.d: "L'Arménie estime que leur État a franchi toutes les étapes d'amélioration de la gouvernance et est prêt pour des décaissements dans le cadre du programme Millennium Challenge Compact."
arme.130.a: "Bien sûr, ils sont prêts"
arme.130.b: "Non, réparez votre pays"
arme.131.t: "[USA.GetNameWithFlag] accepte !"
arme.131.d: "Nous avons réussi à obtenir les paiements car le gouvernement [USA.GetNameWithFlag] est convaincu que nous sommes pleinement préparés pour cela."
arme.131.a: "Bien"
arme.132.t: "[USA.GetNameWithFlag] a rejeté notre proposition"
arme.132.d: "Notre gouvernement n'a pas effectué toutes les réformes nécessaires pour que [USA.GetNameWithFlag] accepte."
arme.132.a: "Bof"
arme.133.t: "Lobbying de l'ANCA"
arme.133.d: "Le Comité National Arménien d'Amérique (ANCA) est une organisation communautaire arméno-américaine. Son siège est à Washington, D.C., et elle possède des bureaux régionaux à Glendale, en Californie, et à Watertown, dans le Massachusetts."
arme.133.a: "Bien"
arme.134.t: "[ARM.GetNameWithFlag] demande la reconnaissance du génocide arménien"
arme.134.d: "L'Arménie fait pression très fort pour la reconnaissance du génocide arménien. Si nous acceptons, notre influence en Arménie sera grandement renforcée, mais cela détériorera nos relations avec la Turquie."
arme.134.a: "La Turquie doit être punie pour cela"
arme.134.b: "Génocide arménien, quoi ?"
arme.135.t: "[USA.GetNameWithFlag] reconnaît le génocide !"
arme.135.d: "Ce jour sera véritablement l'un des jours les plus importants de l'histoire de l'Arménie, car nous avons réussi à convaincre [USA.GetNameWithFlag] de reconnaître le génocide commis par la Turquie."
arme.135.a: "Hourra !"
arme.136.t: "[USA.GetNameWithFlag] fait semblant de ne pas savoir de quoi nous parlons"
arme.136.d: "Malheureusement, les États-Unis préfèrent être plus amis avec [TUR.GetNameWithFlag] qu'avec nous."
arme.136.a: "Mauvais"
arme.137.t: "[ARM.GetNameWithFlag] se retire des accords militaires avec [USA.GetNameWithFlag]"
arme.137.d: "Faisons-nous partie de la catégorie des pays faibles qui ne peuvent pas s'occuper d'eux-mêmes ? Ces pays dépendent fortement de l'opinion de [USA.GetNameWithFlag], car ils comptent uniquement sur la production et les livraisons d'armes de [USA.GetNameWithFlag], ce qui nuit à leur propre sécurité en les rendant dépendants de Washington. Nous ne sommes plus intéressés par cela."
arme.137.a: "Dégagez, OTAN !"
arme.144.t: "Gel des actifs de [USA.GetNameWithFlag]"
arme.144.d: "La monnaie que les États-Unis ont injectée dans notre pays visait à renverser notre gouvernement. Nous nationalisons ce capital en compensation."
arme.144.a: "Ça nous appartient"
arme.145.t: "Retrait des organisations non gouvernementales"
arme.145.d: "Les [USA.GetNameWithFlag] financent des organisations qui menacent notre sécurité. Nous ne sommes plus intéressés à y participer."
arme.145.a: "C'est mieux ainsi"
arme.149.t: "[ARM.GetNameWithFlag] souhaite élargir les liens culturels"
arme.149.d: "Nos peuples sont liés par des siècles d'histoire, et nous devons maintenir ce lien à l'avenir. De plus, nos pays bénéficient mutuellement d'une telle coopération sur les plans politique et économique."
arme.149.a: "Bien sûr"
arme.149.b: "Non"
arme.150.t: "[SYR.GetNameWithFlag] accepte !"
arme.150.d: "Le gouvernement syrien est entièrement d'accord avec nous et est prêt à renforcer davantage l'interaction culturelle."
arme.150.a: "Bien"
arme.151.t: "[SYR.GetNameWithFlag] rejette la coopération culturelle"
arme.151.d: "Ils ne sont pas intéressés et ont rejeté notre offre."
arme.151.a: "Mauvais"
arme.152.t: "[ARM.GetNameWithFlag] évacue la diaspora vers [ARM.GetNameWithFlag]"
arme.152.d: "En raison de la guerre dans laquelle notre pays est impliqué, le gouvernement arménien a décidé d'évacuer sa population vers [ARM.GetNameWithFlag]."
arme.152.a: "Bon voyage !"
arme.153.t: "Les Arméniens sont arrivés de [SYR.GetNameWithFlag]"
arme.153.d: "Nous avons réussi à évacuer notre peuple de Syrie, qui traverse des moments difficiles actuellement."
arme.153.a: "Bien"
arme.154.t: "Aide humanitaire à [SYR.GetNameWithFlag]"
arme.154.d: "Nos amis syriens sont dans une situation difficile, nous leur fournirons donc une aide humanitaire."
arme.154.a: "Nos frères doivent être sauvés !"
arme.155.t: "[ARM.GetNameWithFlag] fournit une aide humanitaire"
arme.155.d: "Nos amis de [ARM.GetNameWithFlag] nous ont envoyé une aide humanitaire. Notre peuple remercie chaleureusement le peuple arménien de ne pas nous avoir oubliés."
arme.155.a: "Que Dieu protège l'Arménie !"
arme.156.t: "[ARM.GetNameWithFlag] nous envoie une aide militaire"
arme.156.d: "[ARM.GetNameWithFlag] est prêt à nous fournir une assistance qui devrait améliorer notre situation sur le front."
arme.156.a: "Merci"
arme.156.b: "Nous n'en avons pas besoin"
arme.157.t: "[SYR.GetNameWithFlag] accepte notre aide"
arme.157.d: "Leur direction militaire nous remercie pour l'aide que nous avons fournie."
arme.157.a: "Bien"
arme.158.t: "[SYR.GetNameWithFlag] refuse l'aide"
arme.158.d: "Apparemment, ils n'ont pas vraiment besoin de notre aide."
arme.158.a: "D'accord"
arme.163.t: "[ARM.GetNameWithFlag] souhaite rejoindre l'OTAN"
arme.163.d: "Ils assurent qu'ils travailleront pour une cause commune et deviendront un partenaire clé de l'alliance dans leur région."
arme.163.a: "Bien sûr"
arme.163.b: "Non"
arme.164.t: "[USA.GetNameWithFlag] nous accepte dans l'alliance"
arme.164.d: "Nous avons réussi à obtenir la protection de l'une des alliances les plus puissantes au monde."
arme.164.a: "Parfait"
arme.165.t: "[USA.GetNameWithFlag] rejette notre candidature"
arme.165.d: "Ils ne sont pas intéressés par notre adhésion à l'OTAN."
arme.165.a: "Bof"
ARM_relations_with_america: "Relations avec les États-Unis"
ARM_relations_with_america_desc: "Les États-Unis abritent une importante diaspora arménienne, ainsi que de très bonnes relations historiques avec nous. Depuis le président Wilson, de nombreux Arméniens ont vu l'Amérique comme notre partenaire fiable."
ARM_join_us_eur_partn_prog: "Partenariat d'État du Commandement Européen"
ARM_join_us_eur_partn_prog_desc: "Les États-Unis proposent un programme de partenariat militaire avec leurs réserves armées, visant à renforcer nos nouvelles structures militaires."
ARM_expand_us_embassy: "Élargissement de l'ambassade des États-Unis"
ARM_expand_us_embassy_desc: "L'Amérique contrôle déjà une grande parcelle de terrain sous l'égide de son ambassade. Cependant, s'ils souhaitent plus de terrain pour leur ambassade, nous pouvons leur en fournir."
ARM_additional_programs_for_armenia: "Programmes supplémentaires pour l'Arménie"
ARM_additional_programs_for_armenia_desc: "Les États-Unis peuvent nous fournir des programmes de développement supplémentaires exclusivement destinés à l'Arménie."
ARM_millennium_challenge_compact: "Millennium Challenge Compact"
ARM_millennium_challenge_compact_desc: "Le Millennium Challenge est un accord quinquennal du gouvernement américain entre le MCC et un pays éligible pour financer des programmes spécifiques visant à réduire la pauvreté et à stimuler la croissance économique."
ARM_anca_lobbying: "Lobbying de l'ANCA"
ARM_anca_lobbying_desc: "Le Comité National Arménien d'Amérique est une organisation communautaire arméno-américaine. Son siège est à Washington, D.C., et elle possède des bureaux régionaux à Glendale, en Californie, et à Watertown, dans le Massachusetts."
ARM_us_recog_arm_gen: "Reconnaissance du génocide arménien par les États-Unis"
ARM_us_recog_arm_gen_desc: "Nous devons demander aux États-Unis de faire enfin pression sur la Turquie et de reconnaître les atrocités turques pendant la Première Guerre mondiale comme un génocide."
ARM_kansas_armenia_partnership: "Partenariat Kansas-Arménie"
ARM_kansas_armenia_partnership_desc: "L'armée arménienne s'est associée à la Garde nationale du Kansas à travers le programme CSPP des États-Unis. Nous devons effectuer des entraînements ensemble."
ARM_req_mnna_status: "Demande de statut d'allié majeur non-OTAN"
ARM_req_mnna_status_desc: "Maintenant que nous avons montré une véritable loyauté envers la cause occidentale, peut-être devrions-nous demander un statut d'allié majeur non-OTAN aux États-Unis."
ARM_stopping_usaid: "Arrêt de l'USAID"
ARM_stopping_usaid_desc: "L'USAID est une organisation qui ne fait que promouvoir les intérêts américains. Elle doit être arrêtée !"
ARM_close_us_embassy: "Fermeture de l'ambassade"
ARM_close_us_embassy_desc: "Les États-Unis conspirent contre nous à travers leur ambassade depuis trop longtemps. Cela doit cesser."
ARM_seizing_us_investments: "Saisie des investissements américains"
ARM_seizing_us_investments_desc: "Tous les investissements américains ne visent pas la prospérité du pays hôte, mais les revenus capitalistes des élites américaines. Nous devons les saisir !"
ARM_stop_military_coop: "Arrêt de la coopération militaire"
ARM_stop_military_coop_desc: "Nous n'avons aucun intérêt à coopérer militairement avec les Américains faibles."
ARM_no_more_relations_with_us: "Plus de relations avec les États-Unis"
ARM_no_more_relations_with_us_desc: "Nous ne pouvons pas nous permettre d'avoir AUCUNE relation avec le pays terroriste des États-Unis."
ARM_no_more_ngo_funds: "Plus de fonds pour les ONG"
ARM_no_more_ngo_funds_desc: "Les ONG sont des organisations d'espionnage social, qui promeuvent des valeurs qui ne correspondent pas à notre agenda. Cela doit cesser."
ARM_anti_nato_propaganda: "Propagande contre l'OTAN"
ARM_anti_nato_propaganda_desc: "L'OTAN est une organisation impérialiste de l'hégémonie occidentale ! Comment ne pas dire la vérité au monde à leur sujet ?"
ARM_combat_us_influence: "Lutter contre l'influence américaine"
ARM_combat_us_influence_desc: "Nous devons combattre l'influence américaine à chaque coin de rue. De la culture à l'économie, la présence de l'Amérique doit être freinée."
ARM_relations_with_iran: "Relations avec l'Iran"
ARM_relations_with_iran_desc: "L'Iran est l'un de nos plus anciens voisins. Il est temps de décider quelle sera notre relation au 21e siècle."
ARM_close_border_with_iran: "Fermer la frontière avec l'Iran"
ARM_close_border_with_iran_desc: "Nous devons fermer notre frontière avec l'Iran pour ne plus permettre aucun commerce avec eux."
ARM_rip_the_trade_agreements: "Plus de commerce"
ARM_rip_the_trade_agreements_desc: "Nous devons interdire les produits iraniens et couper tout lien commercial entre l'Iran et l'Arménie."
ARM_closing_blue_mosque: "Fermeture de la Mosquée Bleue"
ARM_closing_blue_mosque_desc: "L'Iran utilise la Mosquée Bleue comme centre d'influence en Arménie. Nous devons mettre fin à cela."
ARM_amenia_iran_agen_capt: "Surveillance anti-iranienne"
ARM_capture_iranian_agents: "Surveillance anti-iranienne"
ARM_capture_iranian_agents_desc: "L'Iran pourrait tenter de conspirer contre nous. Nous devons être prêts à une telle situation."
ARM_hez_are_terrorists: "Le Hezbollah est terroriste !"
ARM_hez_are_terrorists_desc: "Le Hezbollah est un mandataire terroriste iranien. Nous devons condamner leur organisation politique et leur agenda !"
ARM_support_pjaks: "Soutenir le Parti de la Vie Libre du Kurdistan"
ARM_support_pjaks_desc: "Pour freiner les ambitions iraniennes, nous devons soutenir les organisations séparatistes kurdes, comme le Parti de la Vie Libre du Kurdistan."
ARM_post_ussr_partnersh: "Partenariats post-URSS"
ARM_post_ussr_partnersh_desc: "De nombreux pays avec lesquels nous avions des relations économiques et politiques à l'époque soviétique sont maintenant assez éloignés de nous. Nous pouvons essayer de reconstruire nos relations."
ARM_trade_partnership_blr: "Partenariat avec la Biélorussie"
ARM_trade_partnership_blr_desc: "Le marché biélorusse peut être très intéressant pour nos entreprises, tout comme notre marché peut l'être pour eux."
ARM_trade_partnership_kaz: "Partenariat avec le Kazakhstan"
ARM_trade_partnership_kaz_desc: "Nos relations avec le Kazakhstan ne sont peut-être pas les meilleures, mais nos intérêts commerciaux communs et notre profonde intégration avec la Russie peuvent nous bénéficier à tous les deux."
ARM_trade_partnership_ukr: "Partenariat avec l'Ukraine"
ARM_trade_partnership_ukr_desc: "Établir de bonnes relations commerciales avec l'Ukraine pourrait être très bénéfique pour nous, car notre marché peut être très adapté à leurs produits."
arme.138.t: "[ARM.GetNameWithFlag] souhaite signer un accord de coopération avec l'UE !"
arme.138.d: "Récemment, l'Arménie a décidé de signer un accord de coopération avec l'Union européenne. Devons-nous accepter leur proposition ?"
arme.138.a: "Bien sûr !"
arme.138.b: "Nous ne sommes pas d'accord."
arme.139.t: "[FROM.GetNameWithFlag] accepte !"
arme.139.d: "[FROM.GetNameWithFlag] a accepté notre proposition, et l'accord sera signé sous peu."
arme.139.a: "Super !"
arme.140.t: "[FROM.GetNameWithFlag] rejette !"
arme.140.d: "[FROM.GetNameWithFlag] a rejeté notre proposition de signer un accord de coopération."
arme.140.a: "Très regrettable."
arme.141.t: "[ARM.GetNameWithFlag] souhaite rejoindre le Plan d'Action Ouvert !"
arme.141.d: "Récemment, l'Arménie a manifesté un intérêt pour rejoindre le Plan d'Action Ouvert. Les plans d'action visent à améliorer l'agenda des réformes assumées par le gouvernement, les rendant plus transparents, responsables, participatifs et innovants. Devons-nous leur permettre de rejoindre ?"
arme.141.a: "Bien sûr !"
arme.141.b: "Désolé, non."
arme.142.t: "[FROM.GetNameWithFlag] accepte !"
arme.142.d: "Ils ont accepté notre demande de rejoindre le Plan d'Action Ouvert, qui vise à améliorer l'agenda des réformes assumées par le gouvernement, les rendant plus transparents, responsables, participatifs et innovants."
arme.142.a: "Super !"
arme.143.t: "[FROM.GetNameWithFlag] rejette !"
arme.143.d: "[FROM.GetNameWithFlag] a rejeté notre proposition de rejoindre le Plan d'Action Ouvert."
arme.143.a: "Très regrettable."
arme.146.t: "Maison de commerce en [ARM.GetNameWithFlag]"
arme.146.d: "Le gouvernement arménien suggère que nous élargissions nos relations commerciales à un nouveau niveau. Le gouvernement arménien, avec l'assistance de la société Multigroup, est prêt à fournir un espace pour la création d'une maison de commerce où nos produits seront présentés à la vente aux acheteurs arméniens. Devons-nous conclure un tel accord ?"
arme.146.a: "Oui"
arme.146.b: "Non"
arme.147.t: "Maison de commerce de la Biélorussie en Arménie"
arme.147.d: "Le gouvernement biélorusse a accepté d'ouvrir une maison de commerce pour les produits biélorusses dans notre pays."
arme.147.a: "Super"
arme.148.t: "Maison de commerce de la Biélorussie en Arménie"
arme.148.d: "Le gouvernement biélorusse a refusé d'ouvrir une maison de commerce pour les produits biélorusses dans notre pays."
arme.148.a: "Triste"
arme.159.t: "Discussions sur la Convention d'Istanbul"
arme.159.d: "Nous sommes confrontés à la question d'accepter ou de refuser de signer les accords d'Istanbul sur les droits humains. Cet accord nous rapprochera de l'adhésion à l'Union européenne, mais il pourrait provoquer un mécontentement parmi la population."
arme.159.a: "Signons-les !"
arme.159.b: "Nous ne pouvons pas prendre ce risque."
arme.160.t: "Exercices militaires conjoints avec l'Arménie"
arme.160.d: "Le gouvernement arménien suggère que nos forces armées mènent des exercices militaires conjoints pour partager leur expérience et leurs compétences, améliorer la coordination de nos forces armées et renforcer les relations amicales entre les deux pays."
arme.160.a: "Nous acceptons"
arme.160.b: "Non"
arme.161.t: "Exercices militaires conjoints avec [FROM.GetName]"
arme.161.d: "Leur gouvernement a accepté de mener des exercices conjoints avec nos forces armées."
arme.161.a: "Super"
arme.162.t: "Exercices militaires conjoints avec [FROM.GetName]"
arme.162.d: "Leur gouvernement a refusé de mener des exercices conjoints avec nos forces armées."
arme.162.a: "Triste"
arme.166.t: "[ARM.GetNameWithFlag] propose un traité scientifique !"
arme.166.d: "Récemment, le gouvernement arménien nous a proposé un traité d'échange scientifique mutuel, potentiellement bénéfique pour les deux parties. Devons-nous accepter leur proposition ?"
arme.166.a: "Bien sûr !"
arme.166.b: "Désolé, non."
arme.167.t: "[KAZ.GetNameWithFlag] accepte !"
arme.167.d: "Le Kazakhstan a accepté notre traité scientifique, et maintenant les deux parties commenceront à en bénéficier."
arme.167.a: "Super !"
arme.168.t: "[KAZ.GetNameWithFlag] rejette !"
arme.168.d: "Le Kazakhstan a rejeté notre proposition de traité, la considérant comme une sorte de ruse qui les mettrait dans une position désavantageuse."
arme.168.a: "Q-quoi ?"
arme.169.t: "[ARM.GetNameWithFlag] propose une coopération commerciale !"
arme.169.d: "Récemment, le gouvernement arménien, par le biais de ses connexions diasporiques en Ukraine, nous a contactés pour proposer un accord commercial mutuellement bénéfique. Devons-nous accepter ?"
arme.169.a: "Bien sûr !"
arme.169.b: "Non."
arme.170.t: "[UKR.GetNameWithFlag] accepte !"
arme.170.d: "L'Ukraine a accepté notre traité commercial, et maintenant les deux parties commenceront à en bénéficier."
arme.170.a: "Super !"
arme.171.t: "[UKR.GetNameWithFlag] rejette !"
arme.171.d: "L'Ukraine a rejeté notre proposition commerciale, la considérant comme une sorte de ruse qui les mettrait dans une position désavantageuse."
arme.171.a: "Q-quoi ?"
arme.172.t: "Brigade volontaire arménienne"
arme.172.d: "Récemment, avec le soutien de la diaspora arménienne et du gouvernement arménien, les Arméniens locaux de Rojava ont rejoint notre combat contre l'oppression turque et islamiste. Ils font maintenant partie de l'Armée de Libération des Ouvriers et Paysans de Turquie (TİKKO) et des Forces Démocratiques Syriennes. La brigade a déclaré que ses objectifs sont de défendre les Arméniens de Syrie, leur langue et leur culture, ainsi que tous les peuples de l'Administration Autonome du Nord et de l'Est de la Syrie, contre l'État Islamique d'Irak et du Levant (EIIL) et l'État turc, qu'elle a décrit comme les représentants actuels du Comité fasciste de l'Union et du Progrès."
arme.172.a: "Super !"
arme.173.t: "États-Unis d'Arménie"
arme.173.d: "Notre pays est entré dans une nouvelle phase de son développement historique ! Nous sommes maintenant prêts à annoncer la création des États-Unis d'Arménie ! Notre État s'est étendu à des frontières dignes de porter un tel nom. Nous deviendrons les gardiens de la paix et de la démocratie à travers le Caucase... peut-être plus encore."
arme.173.a: "Super !"
ARM_kaz_scienc_part: "Partenariat scientifique avec le Kazakhstan"
ARM_kaz_scienc_part_desc: "Nous pouvons proposer au Kazakhstan un traité scientifique mutuellement bénéfique."



ARM_diasp_ukr: "Connexions en Ukraine"
ARM_diasp_ukr_desc: "La diaspora arménienne en Ukraine est assez importante. Peut-être pouvons-nous utiliser nos connexions pour trouver un accord mutuellement bénéfique."
ARM_ukraine_cooperation_idea: "Accord [ARM.GetNameWithFlag] - [UKR.GetNameWithFlag]"
ARM_reach_out_baltics: "Tendre la main aux pays baltes"
ARM_reach_out_baltics_desc: "Nous devons établir des contacts avec les États baltes et normaliser nos relations avec eux, en tenant compte de nos liens historiques."
ARM_gods_land: "Terre sainte"
ARM_gods_land_desc: "La Terre sainte a une importance considérable aujourd'hui, non seulement en raison de son importance religieuse, mais aussi à cause de la rivalité géopolitique qui s'y déroule."
ARM_arm_quart_partnership: "Partenariat avec le quartier arménien"
ARM_arm_quart_partnership_desc: "L'Église apostolique arménienne est réputée pour contrôler presque entièrement le site du tombeau de Jésus. De plus, le quartier arménien de Jérusalem exerce une grande influence dans la ville. Nous devons tirer parti de ces facteurs."
ARM_recog_palest: "Reconnaissance de la Palestine"
ARM_recog_palest_desc: "Israël a montré suffisamment d'hostilité envers nous pour que nous comprenions désormais la lutte de la cause palestinienne. Nous devons reconnaître la Palestine pour afficher notre position."
ARM_support_israel: "Soutien à Israël"
ARM_support_israel_desc: "Israël a fait preuve de bonne volonté dans sa coopération avec nous. Nous devons répondre en conséquence avec un esprit amical."
ARM_cont_pal_christians: "Soutien aux chrétiens palestiniens"
ARM_cont_pal_christians_desc: "Nous devons soutenir les chrétiens palestiniens en leur envoyant une aide humanitaire et en renforçant les liens avec l'Église arménienne."
ARM_relat_in_kurdistan: "Approche envers le Kurdistan"
ARM_relat_in_kurdistan_desc: "Nos relations avec les Kurdes n'ont peut-être pas toujours été sans problèmes, cependant, nous sommes tous deux victimes de l'oppression turque et, par conséquent, nous devons nous unir."
ARM_yazidi_repatriation: "Repatriement des Yézidis"
ARM_yazidi_repatriation2: "Repatriement des Yézidis"
ARM_accept_yazidis: "Accepter les Yézidis"
ARM_accept_yazidis_desc: "Les Yézidis sont une minorité religieuse au Moyen-Orient qui a historiquement entretenu de très bonnes relations avec les Arméniens et ne nous a jamais trahis. Nous devons accepter leurs organisations en Arménie et favoriser leur renaissance culturelle."
ARM_our_land_their_freedom: "Notre terre pour leur liberté"
ARM_our_land_their_freedom_desc: "Nous devons adopter une loi qui reconnaîtra les Yézidis comme une minorité officielle en Arménie, leur permettra de se rapatrier pleinement en Arménie, et leur accordera des sièges au parlement."
ARM_yazidis_are_kurds: "Les Yézidis sont des Kurdes"
ARM_yazidis_are_kurds_desc: "Nous ne devons pas soutenir les organisations yézidies, mais plutôt inviter des organisations kurdes pour renforcer l'identité kurde parmi les Yézidis."
ARM_support_barzani_ambitions: "Soutenir les ambitions kurdes"
ARM_support_barzani_ambitions_desc: "Bien que les Kurdes peuplent d'anciens territoires arméniens, nous devons néanmoins les soutenir contre la Turquie."
ARM_support_nubar_ozanian: "Soutenir les Arméniens à Rojava"
ARM_support_nubar_ozanian_desc: "Récemment, les Kurdes de Rojava ont entamé leur lutte contre les islamistes et les envahisseurs turcs. Nous devons soutenir leur cause."
############GOUVERNEMENT#############
##########Décisions##########
ARM_ministry_of_external_category: "Gouvernement de l'Arménie"
ARM_ministry_of_external_category_desc: "Le £text_icon_armgovern §YGouvernement arménien§! devra entreprendre diverses §Yactions de politique intérieure et extérieure§! pour survivre, prospérer et étendre son influence.\n\nLes mécanismes de §Gintégration de nouveaux territoires§! exigent que votre §Yrégime politique§! ait §Odes revendications sur certains territoires§!. Tous les territoires ne sont pas disponibles pour l'intégration par tous les partis politiques.\n\nLes décisions liées à la §YDiaspora arménienne§! sont disponibles tant que vous avez l'§Yidée nationale§! correspondante."
ARM_integration_new_lands: "§YIntégration§! de nouveaux territoires"
ARM_new_crusade_israel: "Lancer la §YCroisade§! pour le §Y[ISR.GetFlag]Royaume de Jérusalem§!"
ARM_new_crusade_hazbik: "Lancer la §YCroisade§! pour le §Y[LEB.GetFlag]Duché d'Antioche§!"
ARM_new_crusade_palestine: "Lancer la §YCroisade§! pour §Y[PAL.GetNameWithFlag]§!"
ARM_italy_reclamation: "Lancer l'§GUnification§! avec §Y[ITA.GetNameWithFlag]§!"
##########Infobulles##########
ARM_new_decision_govern_unlock_tt: "£text_icon_armgovern §YGouvernement de l'Arménie§! : §YDéverrouille§! de nouvelles décisions"
integr_stuff_tt: "Cette §YDécision§! nous permettra d'§Gintégrer§! divers §Gterritoires§! si notre £text_icon_armgovern §YRégime politique§! nous le permet !\nSurveillez de près le niveau de conformité, certaines régions pourraient se rebeller contre votre occupation."
##########Drapeau##########
ARM_United_States: "États-Unis d'Arménie"
##########ARBRE DE ZHIRAYR##########
##########Objectifs##########
ARM_Zhirayr_Sefilyan: "§YPôle national-démocratique§!"
ARM_Zhirayr_Sefilyan_desc: "Jirair Sefilian est un commandant militaire et activiste politique arménien. Pendant la première guerre du Haut-Karabagh, il a commandé le bataillon militaire spécial de Shushi. Il milite depuis longtemps contre toute concession territoriale à l'Azerbaïdjan dans le Haut-Karabagh et contre l'influence russe en Arménie. Sefilian est l'une des figures clés du Parti pan-arménien Sasna Tsrer."
ARM_veter_must_rule: "Démocratie nationale"
ARM_veter_must_rule_desc: "Les valeurs occidentales et l'approche démocratique n'ont aucun sens si nous devons fermer les yeux sur ce que sont les Arméniens et quels sont nos intérêts nationaux. Les vétérans doivent diriger notre nation, même si nous voulons une véritable démocratie."
ARM_request_support_us: "Légion arménienne d'Amérique"
ARM_request_support_us_desc: "La Légion arménienne d'Amérique est une organisation qui regroupe les Arméniens ayant servi dans l'armée américaine par le passé. La Légion a pour objectif de combattre les ennemis du peuple arménien. L'organisation dispose également de petites équipes spéciales de cinq personnes qui reçoivent un entraînement secret sous la direction d'anciens officiers du Corps des Marines de l'armée américaine. Il y a déjà plus d'un millier de combattants dans la Légion arménienne - des jeunes d'origine arménienne. Nous devrions soutenir leur cause et les intégrer comme une branche militaire."
ARM_staunch_western_position: "Épine dans le flanc"
ARM_staunch_western_position_desc: "Pour que l'Arménie devienne véritablement forte et indépendante, nous devons oublier une coopération étroite avec la Russie et nous concentrer exclusivement sur les partenaires occidentaux."
ARM_against_euroscepticism: "Contre l'euroscepticisme"
ARM_against_euroscepticism_desc: "La Russie est une menace. C'est l'opinion unanime du gouvernement en place. Il est temps de prendre des mesures concrètes et de s'engager avec l'OTAN. En prime, cela rendra les efforts de la Turquie pour nous déstabiliser extrêmement difficiles."
ARM_protectorate: "Rempart caucasien"
ARM_protectorate_desc: "L'OTAN cherche à se rapprocher toujours plus de la Russie, et bien qu'ils aient déjà la Turquie, nous pouvons les rapprocher encore davantage. Bien sûr, nos conditions seront que les membres de l'OTAN garantissent notre indépendance nationale."
ARM_nato_weapon: "Soutien militaire de l'OTAN"
ARM_nato_weapon_desc: "Nous devons de toute urgence réarmer notre armée, et maintenant, en tant que membres de l'OTAN, nous sommes prêts à nous tourner vers les autres membres de l'organisation pour obtenir de l'aide dans la résolution de cette question."
ARM_plant_radicalism: "Occidentalisme radical"
ARM_plant_radicalism_desc: "La culture européenne et le modèle économique occidental sont ce à quoi l'Arménie devrait aspirer. C'est l'idéal qui, malheureusement, s'est éloigné de notre dernière frontière de la civilisation européenne."
ARM_first_war_glorify: "Glorification de la première guerre d'Artsakh"
ARM_first_war_glorify_desc: "Nous devons glorifier la guerre d'Artsakh pour renforcer nos sentiments nationaux et patriotiques !"
ARM_fight_for_freedom: "Lutte pour la liberté"
ARM_fight_for_freedom_desc: "Notre combat n'est pas seulement nationaliste dans son essence. Nous luttons aussi pour les droits, la liberté et la dignité !"
ARM_ecommerce_init: "Initiatives d'e-commerce"
ARM_ecommerce_init_desc: "Nous devons soutenir l'e-commerce et la numérisation des structures gouvernementales."
ARM_fourth_rev_stnd: "Normes de la quatrième révolution"
ARM_fourth_rev_stnd_desc: "Notre mouvement est une nouvelle révolution - une évolution des valeurs nationales et démocratiques, qui doit établir de nouvelles normes pour tous les Arméniens."
ARM_new_nuclear_plants: "Nouvelles centrales nucléaires"
ARM_new_nuclear_plants_desc: "Nous devons compter sur l'énergie nucléaire car c'est le seul moyen pour notre pays de produire davantage tout en restant compétitif sur le marché mondial."
ARM_no_more_kgb: "Plus d'influence du KGB"
ARM_no_more_kgb_desc: "Les agents du KGB conspirent contre notre pays depuis trop longtemps sous le couvert de divers influenceurs et activistes politiques. Ils sont même dans notre parlement ! Nous devons mettre fin à cela."
ARM_ally_ukr_blr: "Allier les mouvements amis"
ARM_ally_ukr_blr_desc: "De nombreux mouvements en Ukraine et en Biélorussie partagent les mêmes idées que nous. Nous devons les soutenir dans notre résistance collective à la Russie."
ARM_no_more_colony: "Plus de domination coloniale !"
ARM_no_more_colony_desc: "La Russie nous contrôle depuis trop longtemps ! Nous devons mettre fin à cette exploitation coloniale !"
ARM_new_sparapet_pavel: "Nouveau Sparapet"
ARM_new_sparapet_pavel_desc: "Pavel Manukyan a prouvé sa valeur pour être le Sparapet de notre nouveau pays puissant !"
ARM_like_sassoun_daredevils: "Comme les audacieux de Sassoun"
ARM_like_sassoun_daredevils_desc: "Nous devons prendre exemple sur notre épopée glorieuse et nous unir en tant que nation dans notre esprit populaire !"
ARM_investig_milit: "Enquêter sur l'armée"
ARM_investig_milit_desc: "L'armée doit être enquêtée pour éradiquer toute corruption."
ARM_heroes_need_heroes: "Les héros ont besoin de héros"
ARM_heroes_need_heroes_desc: "Les héros ont effectivement besoin de héros ! Toute notre nation, hommes et femmes, jeunes et vieux, doit être prête à se battre pour notre cause."
