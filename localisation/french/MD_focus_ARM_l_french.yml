ARM_asala_bases_idea: "Bases d'ASALA"

##########Événements##########
arm_demirchyan.1.t: "Nettoyage de l'armée"
arm_demirchyan.1.d: "Il y a encore des éléments dangereux dans l'armée, représentés par les partisans de Kotcharian. Nous devons purger l'armée de leur influence."
arm_demirchyan.1.a: "Bien"
arm_demirchyan.2.t: "Nos conseillers"
arm_demirchyan.2.d: "Pour une meilleure gouvernance, nous devons peut-être écouter les conseils d'autres partis. Il ne reste qu'à choisir lesquels."
arm_demirchyan.2.a: "La paix et la démocratie doivent guider notre peuple"
arm_demirchyan.2.b: "Nous sommes pour un socialisme véritable"
arm_demirchyan.3.t: "§Y[ARM.GetNameWithFlag]§! propose l'installation de bases d'ASALA"
arm_demirchyan.3.d: "§Y[ARM.GetNameWithFlag]§! nous offre des bases pour protéger notre souveraineté contre la Turquie. En retour, ils demandent la permission d'inclure la région de Van dans leur zone d'intérêt."
arm_demirchyan.3.a: "Nous sommes toujours du côté de nos frères d'armes !"
arm_demirchyan.3.b: "Désolé, non"
arm_demirchyan.4.t: "§Y[KUR.GetNameWithFlag]§! rejette notre offre"
arm_demirchyan.4.d: "Ils ont dit qu'ils n'avaient pas besoin de notre aide."
arm_demirchyan.4.a: "Bof"
arm_demirchyan.5.t: "Renaissance d'ASALA"
arm_demirchyan.5.d: "Il a récemment été révélé que le groupe ASALA, connu pour ses politiques militarisées envers l'Azerbaïdjan et la Turquie, se tient désormais officiellement au service de la sécurité de §Y[ARM.GetNameWithFlag]§!"
arm_demirchyan.5.a: "Oh non..."
arm_demirchyan.5.b: "C'est juste une manœuvre politique"
arm_demirchyan.6.t: "ASALA est du côté de notre gouvernement"
arm_demirchyan.6.d: "Personne n'est oublié, rien n'est oublié - avec nos alliés d'ASALA, nous pouvons mener §Y[ARM.GetNameWithFlag]§! vers un grand avenir !"
arm_demirchyan.6.a: "Bien"
arm_demirchyan_news.1.t: "[ARM.GetLeader] critique les régimes communistes"
arm_demirchyan_news.1.d: "Le dirigeant arménien [ARM.GetLeader] a publiquement critiqué tous les régimes communistes dans le monde. Il a déclaré qu'ils utilisaient inefficacement les ressources de leur pays et détruisaient leur économie et leur culture."
arm_demirchyan_news.1.a: "Coup porté au système socialiste"
ARM_forced_industrialisation_unlock_tt: "§YOuvrira des décisions sur l'industrialisation forcée dans §Y[ARM.GetNameWithFlag]§!§!"
arm_demirchyan.8.t: "Notre position sur l'UE"
arm_demirchyan.8.d: "Nous devons décider si nous poursuivrons la coopération avec l'UE ou l'abandonnerons. Cependant, si nous décidons de continuer à coopérer avec l'UE, nous pourrions en tirer certains avantages."
arm_demirchyan.8.a: "Envoyer une délégation à l'UE"
arm_demirchyan.8.b: "Nous avons d'autres plans"
arm_demirchyan.9.t: "§Y[ARM.GetNameWithFlag]§! délégation arrive dans la capitale"
arm_demirchyan.9.d: "§Y[ARM.GetNameWithFlag]§! souhaite continuer à coopérer avec nous malgré leur idéologie. Acceptons-nous leur offre ?"
arm_demirchyan.9.a: "Oui, pourquoi pas ?"
arm_demirchyan.9.b: "Les communistes ne méritent pas notre attention"
arm_demirchyan.10.t: "[FROM.GetNameWithFlag] accepte !"
arm_demirchyan.10.d: "Nous avons réussi à les convaincre de poursuivre la coopération avec nous."
arm_demirchyan.10.a: "Bien"
arm_demirchyan.11.t: "Ils ont refusé de coopérer avec nous"
arm_demirchyan.11.d: "Malheureusement, notre proposition n'a pas trouvé d'écho auprès d'eux."
arm_demirchyan.11.a: "Bof"
arm_demirchyan.12.t: "Avenir de la terre"
arm_demirchyan.12.d: "Il est temps de décider de l'avenir de notre pays. Les visions bolchevique nationale et démocratique sont populaires dans notre pays, mais le résultat final dépendra de nous."
arm_demirchyan.12.a: "La démocratie est la meilleure pour nous"
arm_demirchyan.12.b: "Une voie plus radicale rendrait notre pays encore plus fort"

