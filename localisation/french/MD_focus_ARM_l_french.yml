  ####LEVON TER-PETROSYAN
  ARM_Petrosyan: "§4Roi de la colline§!"
  ARM_Petrosyan_desc: "Levon Hakobi Ter-Petrosyan, également connu par ses initiales LTP, est un homme politique arménien qui a été le premier président de l'Arménie. Il a dirigé le mouvement du Karabagh pour l'unification du Haut-Karabagh, peuplé d'Arméniens, avec l'Arménie en 1988. Il a conduit le pays à travers la première guerre du Haut-Karabagh contre l'Azerbaïdjan voisin."
  ARM_deideologization_of_democracy: "Dé-idéologisation de la démocratie"
  ARM_deideologization_of_democracy_desc: "L'Arménie est l'un des rares pays post-soviétiques où la liberté d'expression, le marché libre et les droits humains sont véritablement valorisés. Notre petit pays montagneux doit devenir un bastion de la démocratie dans la région."
  ARM_crossroad_diplomacy: "Diplomatie des carrefours"
  ARM_crossroad_diplomacy_desc: "Nous devons utiliser toutes nos capacités diplomatiques régionales pour élargir notre sphère d'influence et établir des relations normales avec tous les pays de la région."
  ARM_wipe_out_koch: "Arrêter Kocharyan"
  ARM_wipe_out_koch_desc: "Les fonctionnaires corrompus de Kocharyan doivent être éliminés des structures gouvernementales."
  ARM_desovietize_armenia: "Désoviétisation de l'Arménie"
  ARM_desovietize_armenia_desc: "Nous devons nous débarrasser de l'héritage soviétique en Arménie, le régime communiste n'a apporté à l'Arménie que des larmes, de la peur, la mort, la douleur et la perte de terres nationales. Il est temps d'agir."
  ARM_learn_from_cilicia: "Tirer les leçons de l'exemple cilicien"
  ARM_learn_from_cilicia_desc: "Nous devons tirer des leçons de notre histoire, en particulier de la Cilicie, qui a été saccagée en raison d'aspirations irrationnelles à changer radicalement de politique étrangère. Nous ne devons pas répéter les mêmes erreurs."
  ARM_privatize_land: "Privatisation des terres"
  ARM_privatize_land_desc: "Nous devons commencer nos réformes économiques en reprenant les terres saisies illégalement par la mafia, les oligarques et les opportunistes, et les privatiser correctement."
  ARM_press_oligs: "Faire pression sur les oligarques"
  ARM_press_oligs_desc: "Nous devons nous assurer que les oligarques n'auront plus d'influence, au moins au niveau municipal de notre gouvernement."
  ARM_crush_mafia: "Écraser la mafia"
  ARM_crush_mafia_desc: "Nous devons éliminer toute forme d'activité criminelle en Arménie et punir tous les criminels."
  ARM_utilize_wifes_connections: "Utiliser les relations familiales"
  ARM_utilize_wifes_connections_desc: "Nous devons utiliser les relations familiales pour tenter de normaliser les relations avec Israël."
  ARM_liberalize_economy: "Libéralisation de l'économie"
  ARM_liberalize_economy_desc: "Nous devons libéraliser l'économie pour favoriser une croissance économique rapide."
  ARM_socdem_principles: "Principes sociaux-démocrates"
  ARM_socdem_principles_desc: "Nous devons adhérer aux principes sociaux de soutien à la société pour rendre notre société plus égalitaire."
  ARM_syria_israel_mediation: "Médiation Syrie-Israël"
  ARM_syria_israel_mediation_desc: "Nous pouvons tenter d'établir un processus de paix entre Israël et la Syrie pour accroître notre sphère d'influence."
  ARM_it_sector: "Développement du secteur informatique"
  ARM_it_sector_desc: "Nous devons développer le secteur informatique, car c'est l'industrie qui connaît la croissance la plus rapide dans notre pays."
  ARM_levon_build_roads: "Construction de routes"
  ARM_levon_build_roads_desc: "L'infrastructure en Arménie est dans un état déplorable, nous devons réparer les anciennes routes et en construire de nouvelles pour améliorer la situation."
  ARM_future_looking_strategy: "Stratégie tournée vers l'avenir"
  ARM_future_looking_strategy_desc: "Nous devons adopter une stratégie de politique étrangère visant la stabilité à long terme dans la région."
  ARM_defence_levon_invest: "Investissements dans la défense"
  ARM_defence_levon_invest_desc: "Nous devons investir dans la défense, malgré notre stratégie de politique étrangère visant à poursuivre la paix dans la région."

  #Événements d'actualités
  arme.2.t: "Tentative d'assassinat sur le président du Haut-Karabagh"
  arme.2.d: "La tentative d'assassinat sur Arkady Ghukasyan a montré que tout le monde n'accepte pas sa politique. Vers une heure du matin, la voiture du président a été visée par une embuscade, située à seulement 200 mètres de la résidence. Les terroristes ont ouvert un feu croisé des deux côtés simultanément. Ghukasyan a été blessé aux jambes, et deux de ses gardes ont été grièvement blessés."
  arme.2.a: "Terrible !"
  arme.2.b: "Règlement de comptes caucasien"
  arme.2.c: "Nous devons mettre fin au banditisme"
  arme.2.o1: "Dommage qu'ils ne l'aient pas tué !"
  arme.3.t: "Les communistes du Transcaucase se sont unis dans le « Pont Rouge »"
  arme.3.d: "Samedi, les communistes d'Azerbaïdjan, d'Arménie et de Géorgie se sont à nouveau unis. Lors de la réunion des hauts dirigeants des partis communistes du Transcaucase, qui s'est tenue au Pont Rouge (l'endroit où convergent les frontières des trois républiques), un protocole a été signé pour établir l'organisation communiste publique arméno-azerbaïdjano-géorgienne « Pont Rouge - Fraternité et Amitié ». « Entre nos pays, il n'y a pas de contradictions, et donc les communistes sont la seule force capable de régler tous les conflits dans la région », a déclaré le camarade Georgadze."
  arme.3.a: "Les communistes préparent quelque chose"
  arme.3.b: "Inertie du siècle dernier"
  arme.3.c: "Ils perdent leur temps"
  arme.3.o1: "À quoi s'attendent-ils..."

