##########TSARUKYAN TREE##########
##########Focalisations##########
ARM_Tsarukyan: "§GTsarukyan§!"
ARM_Tsarukyan_desc: "Gagik Tsarukyan est un homme d'affaires, politicien et ancien athlète arménien. Tsarukyan est le fondateur et leader du parti politique Arménie prospère. Il possède également diverses entreprises à grande échelle et est considéré comme l'un des hommes les plus riches d'Arménie."
ARM_patriotism: "Patriotisme"
ARM_patriotism_desc: "Le patriotisme arménien est abstrait. Beaucoup cherchent leur patrie dans les nuages, dans le brouillard mystique, mais elle est si proche de nous et a tant besoin de notre attention, de notre dévouement, de notre admiration. Pour beaucoup, l'Arménie n'est qu'une idée, une amnésie, un Sion, un autel. L'Arménie a besoin d'un patriotisme concret et vivant. La patrie est pour l'homme, pas l'homme pour la patrie."
ARM_berkut: "Où est notre Berkut ?"
ARM_berkut_desc: "La société de sécurité privée arménienne Berkut, étonnamment, a toujours été une unité lourdement équipée composée d'anciens criminels et d'anciens militaires. Peut-être devrions-nous l'élever au niveau étatique."
ARM_hard_way: "La voie difficile"
ARM_hard_way_desc: "Si quelqu'un ne veut pas obéir au nouveau gouvernement, nous le forcerons. Il faut emprunter la voie difficile de prendre les affaires des dissidents indisciplinés."
ARM_Group: "Gouvernement de Multi"
ARM_Group_desc: "Le consortium Multi Group a été fondé en 1998 à l'initiative de Gagik Tsarukyan. Le processus de développement et l'activité intensive du consortium ont commencé en 2001, lorsque le consortium a été créé et de nombreuses grandes entreprises y ont été impliquées. Le consortium se classe régulièrement parmi les dix premiers de la liste des plus grands contribuables d'Arménie."
ARM_olympic_comitee: "Comité olympique"
ARM_olympic_comitee_desc: "Nous devons renforcer et soutenir le comité olympique de toutes les manières possibles. Gagik Tsarukyan est lui-même un athlète et ne peut rester à l'écart."
ARM_buy_small_business: "Racheter les petites entreprises"
ARM_buy_small_business_desc: "Nous devons racheter toutes les petites entreprises des mains des spéculateurs de la classe moyenne. Nous devons franchir cette étape pour atteindre la corporatocratie."
ARM_pooling_capital: "Mettre en commun le capital"
ARM_pooling_capital_desc: "Il est temps de combiner tout le capital et d'en tirer un bon bénéfice."
ARM_tsaruk_trde: "Commerce de Tsarukyan"
ARM_tsaruk_trde_desc: "Tsarukyan est un commerçant très expérimenté. Peut-être devrions-nous étatiser cette entreprise ?"
ARM_remove_competitors: "Éliminer les concurrents"
ARM_remove_competitors_desc: "Seul Tsarukyan peut faire des affaires en Arménie. C'est son domaine, et les autres oligarques doivent soit obéir, soit en subir les conséquences."
ARM_utilize_assets: "Utiliser nos actifs"
ARM_utilize_assets_desc: "Nous devons utiliser tout ce que notre pays possède pour augmenter nos revenus, même si cela signifie fournir plus d'efforts dans tous les domaines de l'économie."
ARM_statue_of_christ: "Nouvelle statue du Christ"
ARM_statue_of_christ_desc: "Tsarukyan est un chrétien très dévot. Il veut construire une nouvelle statue de Jésus-Christ. Quelle merveilleuse idée !"
ARM_sports_promotion: "Développer les sports"
ARM_sports_promotion_desc: "Nous devons développer nos sports et les promouvoir partout où nous le pouvons !"
ARM_sport_youth: "Jeunesse sportive"
ARM_sport_youth_desc: "Tous les jeunes en Arménie doivent être sportifs, forts et en bonne santé ! C'est notre objectif ultime."
ARM_bet_culture: "Adopter la culture des paris"
ARM_bet_culture_desc: "De nombreux Arméniens aiment boire de la bière et parier sur les sports. Nous devons soutenir cette culture ! Qu'y a-t-il de mal à cela ?"
ARM_support_peasants: "Soutien à la population rurale"
ARM_support_peasants_desc: "Toute la population rurale doit être soutenue. Tsarukyan lui-même vient d'un milieu paysan et connaît les luttes des gens ordinaires."
ARM_befr_mafia: "Se lier d'amitié avec la mafia"
ARM_befr_mafia_desc: "Peut-être... Peut-être ! Peut-être devrions-nous nous lier d'amitié avec la mafia pour poursuivre nos objectifs politiques à long terme."
ARM_monopoly: "Corporatocratie totale"
ARM_monopoly_desc: "Maintenant, Multi Group doit contrôler toutes les structures gouvernementales. Quelle excellente idée !"
ARM_freedom_for_pes: "Liberté pour les paysans"
ARM_freedom_for_pes_desc: "Nous devons nous abstenir d'interférer avec les petites entreprises de production agricole. Nous devons leur donner un peu de liberté."
ARM_hire_pmc_wagner: "Engager la SMP Wagner"
ARM_hire_pmc_wagner_desc: "La guerre traverse nos terres, et nous avons l'intention de ne ménager aucune dépense pour défendre notre patrie. Nous cherchons à obtenir l'aide de la Russie et de ses célèbres SMP pour repousser l'attaque de l'ennemi."
ARM_create_pmc: "SMP Guerriers du Lion d'Or"
ARM_create_pmc_desc: "Nous devons également créer notre propre société militaire privée qui protégera les intérêts de notre pays pour une bonne rémunération, que nous leur fournirons certainement."

