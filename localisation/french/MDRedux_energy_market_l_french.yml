energy_agreement_accept: "Accord énergétique"
energy_agreement_reject: "Accord énergétique rejeté"
energy_agreement_cancel: "Accord énergétique annulé"
energy_contract_cancel: "Contrat énergétique annulé"

ENERGY_CONTRACT_AGREEMENT_TITLE: "Proposer un §YAccord énergétique§!"
ENERGY_CONTRACT_AGREEMENT_ACTION_DESC: "La conclusion de l'Accord énergétique nous permettra d'envoyer à ce pays des contrats pour acheter leur énergie ou leur vendre la nôtre. De même, ce pays pourra également nous envoyer des contrats similaires. C'est mutuellement bénéfique !"
PROPOSE_ENERGY_AGREEMENT_ACCEPT_TT: "§YAccord énergétique§! entré en vigueur"
PROPOSE_ENERGY_AGREEMENT_ACCEPT_DESC: "§YAccord énergétique§! entré en vigueur. Nous pouvons maintenant acheter ou vendre de l'énergie à cet État."
PROPOSE_ENERGY_AGREEMENT_TOOLTIP: "Nous n'avons pas d'§YAccord énergétique§! avec [From.GetNameWithFlag]"
PROPOSE_ENERGY_AGREEMENT_DESC: "Voulez-vous envoyer une proposition à [From.GetNameWithFlag] pour signer un §YAccord énergétique§!? La conclusion d'un accord énergétique augmentera notre influence mutuelle de §G1-5%§!, améliorera les relations de §G50§! et nous permettra de conclure des contrats pour le transit de notre énergie vers [From.GetNameWithFlag] ou le transit de l'énergie [From.GetFlag][From.GetAdjective] vers notre pays."
CANCEL_ENERGY_AGREEMENT_TITLE: "Rompre l'§YAccord énergétique§!"
base_energy_condition: "Réticence de base contre l'§YAccord énergétique§!"
condition_energy_six: "Est un voisin de [Root.GetNameWithFlag]"
ONLY_PERMITTED_CONTINENTS_TT: "Tout ceci doit être fait : \n Nous avons accès au transit d'énergie vers ce continent. \n Ce n'est pas une île"
CANCEL_ENERGY_AGREEMENT_ACTION_DESC: "Si vous ou votre partenaire énergétique annulez l'Accord énergétique, vous ne pourrez plus conclure de contrats énergétiques."
CANCEL_ENERGY_AGREEMENT_DESC: "L'annulation de l'accord énergétique ne mettra pas fin aux contrats en cours, mais [From.GetNameWithFlag] mettra probablement fin à tous les contrats existants. Les relations avec [From.GetNameWithFlag] seront détériorées de §R100§!. Vous ne pourrez plus acheter ou vendre de l'énergie à [From.GetNameWithFlag]"
CANCEL_ENERGY_AGREEMENT_TOOLTIP: "Nous avons un Accord énergétique avec eux."

energy_selling_TT: "$$[?energy_selling_income|+3] de §YVentes d'énergie§!\n"
energy_buying_TT: "$$[?energy_buying_expenses|-3] de §YAchats d'énergie§!\n"
big_energy_sell_deal_tt: "Nous fournirons §R16§! GW de notre énergie, en retour nous recevrons $§G0,875§! milliard par semaine"
medium_energy_sell_deal_tt: "Nous fournirons §R10§! GW de notre énergie, en retour nous recevrons $§G0,500§! milliard par semaine"
small_energy_sell_deal_tt: "Nous fournirons §R6§! GW de notre énergie, en retour nous recevrons $§G0,175§! milliard par semaine"
small_energy_buy_deal_tt: "Nous recevrons §G6§! GW d'énergie, en retour nous donnerons $§R0,175§! milliard par semaine"
medium_energy_buy_deal_tt: "Nous recevrons §G10§! GW d'énergie, en retour nous donnerons $§R0,500§! milliard par semaine"
big_energy_buy_deal_tt: "Nous recevrons §G16§! GW d'énergie, en retour nous donnerons $§R0,875§! milliard par semaine"

energy_selling.1.t: "[FROM.GetName] nous a proposé un contrat énergétique"
energy_selling.1.desc: "[FROM.GetName] nous a proposé un contrat pour le transit d'énergie vers notre pays, bien sûr contre une rémunération raisonnable. Ce contrat pourrait résoudre notre problème énergétique, mais serons-nous en mesure d'en assumer les coûts ?"
energy_selling.1.a: "Nous acceptons le contrat"
energy_selling.1.b: "Nous refusons"
energy_selling.2.t: "[FROM.GetName] a accepté le contrat"
energy_selling.2.desc: "[FROM.GetName] a accepté notre contrat énergétique. Cela sera bénéfique pour nous deux."
energy_selling.2.a: "Super !"
energy_selling.3.t: "[FROM.GetName] a refusé le contrat"
energy_selling.3.desc: "[FROM.GetName] a refusé notre proposition de conclure un contrat énergétique. Apparemment, ils ne sont pas dans la meilleure position pour le faire, ou nous devons améliorer notre approche diplomatique."
energy_selling.3.a: "Dommage"
energy_selling.4.t: "[FROM.GetName] nous a proposé un contrat énergétique"
energy_selling.4.desc: "[FROM.GetName] nous a proposé un contrat pour le transit de notre énergie vers leur pays, bien sûr contre une rémunération raisonnable. Ce contrat pourrait fournir des revenus énergétiques supplémentaires pour notre pays. Pouvons-nous assumer les coûts énergétiques supplémentaires ?"
energy_selling.5.t: "[FROM.GetName] a annulé le contrat énergétique"
energy_selling.5.desc: "Pour une raison quelconque, [FROM.GetName] a annulé le contrat énergétique. Le transit d'énergie est arrêté, le paiement hebdomadaire est arrêté. Nous pouvons proposer à nouveau un contrat énergétique à ce pays, peut-être devrions-nous modifier les conditions."
energy_selling.5.a: "Peut-être devrions-nous renégocier le contrat..."

not_buying_energy_tt: "Le pays n'achète pas d'énergie"
not_selling_energy_tt: "Le pays ne vend pas d'énergie"

