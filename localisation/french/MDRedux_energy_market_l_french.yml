big_energy_selling_decision_tt: "Notre production d'énergie sera augmentée de §G16§! \nNous devrons payer $§R0,875§! milliard par semaine"
big_energy_buying_decision_tt: "Nous fournirons §R16§! GW d'énergie. Nous recevrons $§G0,875§! milliard par semaine"
