#Energy Market
#energy_market_category: "Marché de l'énergie"
#energy_market_category_desc: " \n£GFX_MAIN_desctext_energy\n\n\n\nNous pouvons envoyer des demandes d'achat/vente d'énergie à des pays avec lesquels nous avons signé un accord. Prix du contrat pour l'acheteur : $§Y0,500§! milliard par semaine par contrat. Volume du contrat : §Y10§! GW"
sell_energy_to: "§YVendre de l'énergie à§! [FROM.GetNameWithFlag]"
energy_selling_decision_tt: "Notre production d'énergie sera augmentée de §G10§! \nNous devrons payer $§R0,500§! milliard par semaine"
