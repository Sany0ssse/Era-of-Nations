BLR.Western_Autocracy: "£BLR_Nat_Populism (BPF) Front populaire biélorusse 'Renouveau' (§2Aile occidentale§!)"
BLR.Western_Autocracy_icon: "£BLR_Nat_Populism"
BLR.Western_Autocracy_desc: "Conservatisme national - Front populaire biélorusse 'Renouveau' (Biélorusse - Biełaruski Narodny Front 'Adradžeńnie')\n\n Le parti BPF est un parti biélorusse de centre-droit créé en 1993 sous le nom de 'Front populaire biélorusse'. Son leader et figure de proue est Zenon Poznyak. Il est connu pour ses positions anti-russes, ainsi que pour son soutien à une autonomie complète de la Biélorussie vis-à-vis de l'Occident et de l'Est."
BLR.conservatism: "£BLR_conservatism (UCP) Parti civique uni"
BLR.conservatism_icon: "£BLR_conservatism"
BLR.conservatism_desc: "Conservatisme libéral - Parti civique uni (Biélorusse - Abjadnanaja Hramadzianskaja Partyja)\n\n Le Parti civique uni est un parti libéral-conservateur formé en 1995 à la suite de la fusion de partis libéraux partageant des idées similaires. Le parti prône la démocratisation du régime politique, des réformes de marché et soutient l'adhésion du pays aux organisations occidentales."
BLR.liberalism: "£BLR_liberalism (EB) Biélorussie européenne"
BLR.liberalism_icon: "£BLR_liberalism"
BLR.liberalism_desc: "Libéralisme pro-européen - Biélorussie européenne (Biélorusse - Ewrapiejskaja Biełaruś)\n\n Il s'agit d'une coalition de partisans pro-européens sur le territoire de la Biélorussie. Elle affiche une rhétorique clairement anti-russe et l'intention de se retirer de tous les accords liés à la Russie après son arrivée au pouvoir."
BLR.socialism: "£BLR_western_socialism (BSDP) Parti social-démocrate biélorusse (Assemblée populaire)"
BLR.socialism_icon: "£BLR_western_socialism"
BLR.socialism_desc: "Social-démocratie - Parti social-démocrate biélorusse (Assemblée populaire) (Biélorusse - Bielaruskaja Sacyjal-Demakratyčnaja Partyja (Narodnaja Hramada))\n\n Le BSDP est un parti politique biélorusse. Initialement, le parti a été créé le 2 mars 1991 sous le nom de Gramada social-démocrate biélorusse (abrégé BSDG) et a existé sous ce nom jusqu'au 29 juin 1996, date à laquelle il a fusionné avec le Parti du consentement populaire (PNS), ce qui a donné lieu à un nouveau nom, le Parti social-démocrate biélorusse (Narodnaya Gramada), sous lequel il a existé jusqu'au 24 juin 2005. Le BSDP perpétue les traditions de la Gramada socialiste biélorusse (1902-1918) et du Parti social-démocrate biélorusse (1918-1924). Le BSDP fait partie de la communauté des partis réunis dans l'Internationale socialiste et l'Alliance progressiste. Le BSDP est en opposition au régime du président Alexandre Loukachenko."
BLR.socialism_alt: "£BLR_western_socialism_1 (BSDPA) Parti social-démocrate biélorusse (Assemblée)"
BLR.socialism_alt_icon: "£BLR_western_socialism_1"
BLR.socialism_alt_desc: "Social-démocratie - Parti social-démocrate biélorusse (Assemblée) (Biélorusse - Bielaruskaja Sacyjal-Demakratyčnaja Partyja (Hramada))\n\n Le BSDPA est un parti social-démocrate de style européen fondé par d'anciens membres de Narodnaja Hramada. Le parti soutient l'adhésion à l'OTAN et à l'UE, mais favorise le maintien de relations amicales avec la Russie."
BLR.Communist-State: "£BLR_Communist_State (CPB) Parti communiste de Biélorussie"
BLR.Communist-State_icon: "£BLR_Communist_State"
BLR.Communist-State_desc: "Marxisme-léninisme - Parti communiste de Biélorussie (Biélorusse - Kamunistyčnaja Partyja Bielarusi)\n\n Le Parti communiste de Biélorussie est un parti politique de la République de Biélorussie. Il a été formé en 1996 à la suite d'une scission au sein du Parti des communistes de Biélorussie, liée à des divergences de vues au sein du PKB sur la politique menée par le président du pays. Le CPB soutient la politique d'Alexandre Loukachenko et est la plus grande organisation communiste de la république."
BLR.LitbelCommunist-State: "£BLR_Communist_State (CPBL) Parti communiste de Biélorussie et de Lituanie"
BLR.LitbelCommunist-State_icon: "£BLR_Communist_State"
BLR.LitbelCommunist-State_desc: "Marxisme-léninisme - Parti communiste de Biélorussie (Biélorusse - Kamunistyčnaja Partyja Bielarusi)\n\n Le Parti communiste de Biélorussie est un parti politique de la République de Biélorussie. Il a été formé en 1996 à la suite d'une scission au sein du Parti des communistes de Biélorussie, liée à des divergences de vues au sein du PKB sur la politique menée par le président du pays. Le CPB soutient la politique d'Alexandre Loukachenko et est la plus grande organisation communiste de la république."
BLR.Conservative: "£BLR_Conservative Administration de Loukachenko"
BLR.Conservative_icon: "£BLR_Conservative"
BLR.Conservative_desc: "Alexandre Loukachenko s'accroche fermement au pouvoir et n'a pas l'intention de l'abandonner facilement. Il a rassemblé autour de lui des partisans fervents de ses idées. Son idéologie est clairement pro-russe avec une intégration aussi profonde que possible sur les plans économique et social. Cependant, malgré cela, Loukachenko cherche toujours des partenaires à l'Ouest et à l'Est, notamment en Chine, afin de négocier avec la Russie sans devenir totalement sa marionnette."
BLR.Conservative_bela: "£BLR_Conservative_1 (WR) Russie blanche"
BLR.Conservative_bela_icon: "£BLR_Conservative_1"
BLR.Conservative_bela_desc: "Autocratie de Loukachenko - Russie blanche (Biélorusse - Bělaja Ruś)\n\n La Russie blanche a été fondée sur l'organisation politique du même nom. Le parti soutient pleinement la politique d'Alexandre Loukachenko, étant en réalité son parti personnel pour maintenir une majorité absolue au parlement et contrôler la vie politique du pays."
BLR.anarchist_communism: "£BLR_anarchist_communism (RPLJ) Parti républicain du travail et de la justice"
BLR.anarchist_communism_icon: "£BLR_anarchist_communism"
BLR.anarchist_communism_desc: "Populisme de gauche - Parti républicain du travail et de la justice (Biélorusse - Respublikanskaja Partyja Pracy i Spraviadlivaści)\n\n Le RPLJ est un parti socialiste fondé en 1993. Le parti est favorable à la création d'un État-providence, à une transition partielle vers une économie planifiée, mais soutient le conservatisme social. Le parti coopère activement avec des partis politiques similaires dans la CEI et a une attitude très négative envers le monde occidental."
BLR.Autocracy: "£BLR_Autocracy (BPP) Parti patriotique biélorusse"
BLR.Autocracy_icon: "£BLR_Autocracy"
BLR.Autocracy_desc: "Nationalisme de gauche - Parti patriotique biélorusse (Biélorusse - Bielaruskaja Patryjatyčnaja Partyja)\n\n Le Parti patriotique biélorusse est un parti politique de Biélorussie. Il a été créé en 1996 parmi les partisans actifs d'Alexandre Loukachenko. Les objectifs du parti sont de promouvoir la construction d'une société socialement juste ; de favoriser la création d'une union renouvelée des peuples fraternels, en particulier de la Russie, de la Biélorussie et de l'Ukraine ; de soutenir le président dans ses efforts pour mettre en œuvre les programmes électoraux et des mesures urgentes pour sortir la Biélorussie de la crise ; de protéger les intérêts nationaux, l'honneur et la dignité de la Biélorussie dans tous les domaines."
BLR.Neutral_conservatism: "£BLR_Neutral_conservatism (BCD) Démocratie chrétienne biélorusse"
BLR.Neutral_conservatism_icon: "£BLR_Neutral_conservatism"
BLR.Neutral_conservatism_desc: "Démocratie chrétienne - Démocratie chrétienne biélorusse (Biélorusse - Bielaruskaja Chryścijanskaja Demakratyja)\n\n La Démocratie chrétienne biélorusse est l'héritière du parti du même nom qui a lutté pour l'indépendance de la Biélorussie au XXe siècle. Le parti proclame la démocratie chrétienne comme son idéologie et s'oppose à l'autoritarisme."
BLR.Neutral_Autocracy: "£BLR_neutral_autocracy (BAP) Parti agraire biélorusse"
BLR.Neutral_Autocracy_icon: "£BLR_neutral_autocracy"
BLR.Neutral_Autocracy_desc: "Agrarisme - Parti agraire biélorusse (Biélorusse - Bielaruskaja Ahrarnaja Partyja)\n\n Le parti a été fondé en 1992 et adhère à l'idéologie de l'agrarisme de gauche. Le parti défend également les intérêts des agriculteurs et des agrariens en Biélorussie."
BLR.oligarchism: "£BLR_oligarchism (LDPB) Parti libéral-démocrate de Biélorussie"
BLR.oligarchism_icon: "£BLR_oligarchism"
BLR.oligarchism_desc: "Populisme pro-russe - Parti libéral-démocrate de Biélorussie (Biélorusse - Libieraĺna-Demakratyčnaja Partyja Bielarusi)\n\n Le Parti libéral-démocrate est le plus grand parti politique biélorusse, établi en 1994 sur la base de la branche biélorusse du Parti libéral-démocrate de l'Union soviétique. Depuis octobre 1999, le Parti libéral-démocrate se positionne comme un parti d'opposition 'constructive'."
BLR.neutral_Social: "£BLR_neutral_Social (BSDA) Assemblée sociale-démocrate biélorusse"
BLR.neutral_Social_icon: "£BLR_neutral_Social"
BLR.neutral_Social_desc: "Social-démocratie - Assemblée sociale-démocrate biélorusse (Biélorusse - Bielaruskaja Sacyjal-Demakratyčnaja Hramada)\n\n Le parti Gramada est un parti politique biélorusse. Le leader honoraire du parti était un homme politique bien connu, le premier dirigeant de la Biélorussie indépendante, Stanislav Shushkevich. Le programme du BSDG, adopté lors du 2e Congrès en 1999, notait que le BSDG est un parti de type centre-droit. Malgré son nom, il n'adhère pas au principe de régulation étatique de l'économie établi parmi les partis sociaux-démocrates, il prône une économie à plusieurs niveaux et, avant tout, une économie de marché. La deuxième caractéristique du BSDG — également un signe traditionnel de biais 'de droite' — est qu'un rôle important dans le programme est attribué à la renaissance nationale et au renforcement de l'indépendance de l'État biélorusse."
BLR.Neutral_Libertarian: "£BLR_neutral_libertarian (PFP) Parti de la liberté et du progrès"
BLR.Neutral_Libertarian_icon: "£BLR_neutral_libertarian"
BLR.Neutral_Libertarian_desc: "Conservatisme libéral - Parti de la liberté et du progrès (Biélorusse - Partyja Svabody i Prahresu)\n\n Il s'agit d'un parti politique libéral qui vise à démocratiser le système politique et à créer une économie de marché en Biélorussie. Le parti s'oppose au radicalisme et soutient la coopération avec les pays occidentaux."
BLR.Neutral_Communism: "£BLR_Neutral_Communism (BPL) Parti de gauche biélorusse 'Monde juste'"
BLR.Neutral_Communism_icon: "£BLR_Neutral_Communism"
BLR.Neutral_Communism_desc: "Socialisme révolutionnaire - Parti de gauche biélorusse 'Monde juste' (Biélorusse - Bielaruskaja Partyja Lievych 'Spraviadlivy Sviet')\n\n Le Parti de gauche biélorusse est un parti politique de la République de Biélorussie. Il a été fondé en 1991 à la suite de la suspension des activités du CPB — CPSU sur le territoire de la République de Biélorussie. En 1996, certains membres du PKB qui soutenaient la politique d'A. Loukachenko se sont séparés du parti et ont formé le Parti communiste de Biélorussie pro-présidentiel. Actuellement, le Parti Monde juste s'oppose au régime du président Alexandre Loukachenko. Le parti dispose d'un vaste réseau d'organisations régionales. Il fait partie de la Gauche européenne."
BLR.Neutral_green: "£BLR_neutral_green (BGP) Parti vert biélorusse"
BLR.Neutral_green_icon: "£BLR_neutral_green"
BLR.Neutral_green_desc: "Progressisme vert - Parti vert biélorusse (Biélorusse - Bielaruskaja Partyja 'Zialionyja')\n\n Le Parti vert biélorusse est un parti politique progressiste qui prône la priorisation des questions environnementales et soutient publiquement les droits LGBT. Le parti s'oppose également à la peine de mort et à l'autoritarisme."
BLR.Nat_Autocracy: "£BLR_Nat_Autocracy (AFRB) Forces armées de la République de Biélorussie"
BLR.Nat_Autocracy_icon: "£BLR_Nat_Autocracy"
BLR.Nat_Autocracy_desc: "Gouvernement militaire - Forces armées de la République de Biélorussie (Biélorusse - Uzbrojenyja sily Respubliki Bielaruś)\n\n La junte militaire des principaux généraux des Forces armées de Biélorussie. D'une main de fer, ils sont prêts à conserver le pouvoir et à protéger le pays contre l'ennemi extérieur."
BLR.Nat_Fascism: "£BLR_Nat_Fascism (NBP) Parti national-bolchevique"
BLR.Nat_Fascism_icon: "£BLR_Nat_Fascism"
BLR.Nat_Fascism_desc: "Bolchevisme national - Parti national-bolchevique (Biélorusse - Nacyjanal-Baĺšavickaja Partyja)\n\n Les bolcheviks nationaux, partisans d'Eduard Limonov, forment un mouvement politique opérant en Biélorussie depuis 1994. Le bolchevisme national moderne est une idéologie flexible qui combine les idées de justice nationale et sociale avec les exigences de libertés civiles. Pour le bolchevique national, la patrie est synonyme d'un État-providence et d'un pays libre basé sur les droits des citoyens."
BLR.Nat_Populism_n: "£BLR_western_autocracy (BPF) Front populaire biélorusse (§8Aile nationaliste§!)"
BLR.Nat_Populism_n_icon: "£BLR_western_autocracy"
BLR.Nat_Populism_n_desc: "Populisme national - Front populaire biélorusse (Biélorusse - Biełaruski Narodny Front)\n\n Le parti a été fondé sur le mouvement public Front populaire biélorusse 'Renouveau', créé en 1988, qui prônait l'indépendance de la Biélorussie, la démocratisation du pouvoir, la renaissance de la langue et de la culture biélorusses."
BLR.Monarchist: "£BLR_monarchism (ML) Ligue monarchique du Grand-Duché de Lituanie"
BLR.Monarchist_icon: "£BLR_monarchism"
BLR.Monarchist_desc: "Monarchie héréditaire - Ligue monarchique du Grand-Duché de Lituanie (Biélorusse - 'Za Wieru, Ajczynu j Kniazia !')\n\n La Ligue monarchique du Grand-Duché de Lituanie 'Za Wieru, Ajczynu j Kniazia !' est une organisation sociopolitique monarchique, patriotique, de tendance pro-lituanienne (pro-biélorusse). Elle opère sur le territoire de la Biélorussie et de la Lituanie. Fondée le 30 juin 2002, son siège est à Minsk. Elle réunit des conservateurs et des partisans de la restauration de la monarchie en Lituanie et en Biélorussie. Elle prône la restauration des libertés de l'Église et de la noblesse. La mission de la Ligue est de rétablir le Grand-Duché de Lituanie en tant que monarchie héréditaire catholique, sujet de droit international tel qu'en 1654."